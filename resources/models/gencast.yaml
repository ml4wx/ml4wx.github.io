slug: gencast
name: GenCast
kind: model
category: global-ensemble
description: Conditional diffusion model that samples each ensemble member as a full 15-day trajectory;
  in the Nature paper it beat the ECMWF ENS on most targets. Checkpoints at 0.25° (ERA5 and HRES-fine-tuned
  "operational") and 1° (including a small "Mini" model).
provider: Google DeepMind
