slug: graphcast
name: GraphCast
kind: model
category: global-deterministic
description: Graph neural network that steps the global atmosphere forward 6 hours at a time on a multi-scale
  icosahedral mesh; in the Science paper it beat ECMWF HRES on 90% of 1380 verification targets. The code
  now lives in the WeatherNext repo, with 0.25° (37-level and HRES-fine-tuned 13-level "operational")
  and 1° "small" checkpoints.
provider: Google DeepMind
url: https://deepmind.google/blog/graphcast-ai-model-for-faster-and-more-accurate-global-weather-forecasting/
repo: google-deepmind/weathernext
paper:
  arxiv: '2212.12794'
  doi: 10.1126/science.adi2336
license: Apache-2.0
