- global-medium-range
added: '2026-10-26'
org: google-deepmind
weights: https://console.cloud.google.com/storage/browser/dm_graphcast
resolution: 0.25°, 37 levels (also 13-level and 1° versions)
lead_time: 10 days, 6-hourly
training_data: ERA5 (operational version fine-tuned on ECMWF HRES analyses)
