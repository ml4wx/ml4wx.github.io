summary: A deep learning model learns the radar reflectivity-to-rainfall (Z-R) relation for Shenzhen,
  outperforming the traditional Z-R equation and matching a pure DL nowcaster.
abstract: Sudden precipitations may bring troubles or even huge harm to people's daily lives. Hence a
  timely and accurate precipitation nowcasting is expected to be an indispensable part of our modern life.
  Traditionally, the rainfall intensity estimation from weather radar is based on the relationship between
  radar reflectivity factor (Z) and rainfall rate (R), which is typically estimated by location-dependent
  experiential formula and arguably uncertain. Therefore, in this paper, we propose a deep learning-based
  method to model the ZR relation. To evaluate, we conducted our experiment with the Shenzhen precipitation
  dataset. We proposed a combined method of deep learning and the ZR relationship, and compared it with
  a traditional ZR equation, a ZR equation with its parameters estimated by the least square method, and
  a pure deep learning model. The experimental results show that our combined model performs much better
  than the equation-based ZR formula and has the similar performance with a pure deep learning nowcasting
  model, both for all level precipitation and heavy ones only.
