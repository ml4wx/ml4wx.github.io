summary: SVM and general regression neural network models estimate western North Pacific tropical cyclone
  size parameters (RMW, R34, R50, R64) from infrared satellite imagery.
abstract: Knowledge about tropical cyclone (TC) size is essential for disaster prevention and mitigation
  strategies, but due to the limitations of observations, TC size data from the open ocean are scarce.
  In this paper, several models are developed to identify TC size parameters, including the radius of
  maximum wind (RMW) and the radii of 34 (R34), 50 (R50), and 64 (R64) knot winds, using various machine
  learning algorithms based on infrared channel imagery of geostationary meteorological satellites over
  the Western North Pacific (WNP). Through evaluation and verification, the trained and optimized support
  vector machine models are proposed for RMW and R34, while the general regression neural network models
  are set up for R50 and R64.
