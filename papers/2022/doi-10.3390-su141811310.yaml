summary: A neural network with Deep Taylor Decomposition attributes simulated soil moisture changes to
  forcing agents and compares the signals with SMAP observations.
abstract: Soil moisture is a vital land surface variable that can influence climate change. Many problems
  in soil moisture data require the identification of signals obscured by anthropogenic external forces
  (including greenhouse gases such as CO2 and aerosol radiative force), natural forces (such as volcanic
  and solar activity), and internal variability (such as ENSO, NAO, and PDO). Although artificial neural
  networks (ANNs) have been widely studied in making accurate predictions, the studies of interpretation
  of ANNs in soil moisture are still rare. Hence, the proposed method aims to assist in the study of interpretating
  soil moisture data. Specifically, first, an ANN model is trained to predict the approximate year of
  the simulations by identifying the spatial patterns of qualitative changes in soil moisture. After accurately
  predicting the approximate year, the spatial patterns in the ANN model, acting as “reliable indicators”
  of the force changes, are the different natures of regional signals. Then, the simulated data and Soil
  Moisture Active and Passive (SMAP) observations are fed into the trained ANN separately, and the specific
  differences are observed by the Deep Taylor Decomposition (DTD) visualization tool. By comparing with
  the standard multiple linear regression method, the results of the ANN model can provide the reliable
  indicators of change for a specific year, thus providing meaningful information from the ANN model according
  to the common soil moisture data. The results show that a large correlation exists between eastern Asia
  and western North America during the 21st century, and the correlation increases with time in Australia.
  This also reflects the strong force signal due to a combination of anthropogenic and external forces
  that has played a role in soil moisture over the decades and can clearly discern the differences between
  model simulations and observed data. This study indicates that the proposed method using ANNs and visualization
  tools enables relatively accurate predictions and the discovery of unknown patterns within soil moisture
  data.
