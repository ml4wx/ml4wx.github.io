summary: Random forest fusing MODIS, GPM and GLDAS factors reproduces the SPEI drought index for Shandong,
  China, from 2002-2020, outperforming XGBoost and SVM.
abstract: Drought is an extremely dangerous natural hazard that causes water crises, crop yield reduction,
  and ecosystem fires. Researchers have developed many drought indices based on ground-based climate data
  and various remote sensing data. Ground-based drought indices are more accurate but limited in coverage;
  while the remote sensing drought indices cover larger areas but have poor accuracy. Applying data-driven
  models to fuse multi-source remote sensing data for reproducing composite drought index may help fill
  this gap and better monitor drought in terms of spatial resolution. Machine learning methods can effectively
  analyze the hierarchical and non-linear relationships between the independent and dependent variables,
  resulting in better performance compared with traditional linear regression models. In this study, seven
  drought impact factors from the Moderate Resolution Imaging Spectroradiometer (MODIS) satellite sensor,
  Global Precipitation Measurement Mission (GPM), and Global Land Data Assimilation System (GLDAS) were
  used to reproduce the standard precipitation evapotranspiration index (SPEI) for Shandong province,
  China, from 2002 to 2020. Three machine learning methods, namely bias-corrected random forest (BRF),
  extreme gradient boosting (XGBoost), and support vector machines (SVM) were applied as regression models.
  Then, the best model was used to construct the spatial distribution of SPEI. The results show that the
  BRF outperforms XGBoost and SVM in SPEI estimation. The BRF model can effectively monitor drought conditions
  in areas without ground observation data. The BRF model provides comprehensive drought information by
  producing a spatial distribution of SPEI, which provides reliability for the BRF model to be applied
  in drought monitoring.
