summary: Pseudoproxy tests compare Bi-LSTM with linear PCR and CCA for millennial NH and NAE summer temperature
  reconstruction; Bi-LSTM is less skilful but captures extreme cooling.
abstract: Abstract. Three different climate field reconstruction (CFR) methods employed to reconstruct
  North Atlantic-European (NAE) and Northern Hemisphere (NH) summer season temperature over the past millennium
  from proxy records are tested in the framework of pseudoproxy experiments derived from three climate
  simulations with Earth System Models. Two of these methods are traditional multivariate linear methods
  (Principal Components Regression, PCR and Canonical Correlation Analysis, CCA), whereas the third method
  (Bidirectional Long-Short-Term Memory Neural Network, Bi-LSTM) belongs to the category of machine learning
  methods. The Bi-LSTM method does not need to assume linear and temporally stable relationships between
  the underlying proxy network and the targeted climate field, in contrast to PCR and CCA. In addition,
  Bi-LSTM incorporates information on the serial correlation of the time series. All three methods tested
  herein achieve reasonable reconstruction performance in both spatial and temporal scale. Generally,
  the reconstruction skill is higher in regions with denser proxy coverage, but reconstruction skill is
  also achieved in proxy-free areas due to climate teleconnections. All three CFR methodologies generally
  tend to more strongly underestimate the target temperature variations as more noise is introduced into
  the pseudoproxies. The Bi-LSTM method tested in our experiments shows relatively worse reconstruction
  skills compared to PCR and CCA, yet it brings some encouraging results on capturing extreme cooling
  climate signals. This indicates that this nonlinear CFR method could be a potential methodology for
  past climate extremes analysis.
