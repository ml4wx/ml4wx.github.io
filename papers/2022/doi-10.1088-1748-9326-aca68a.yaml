summary: Two deep-learning bias-correction pathways improve 4-month-lead summer precipitation forecasts
  from a Chinese GCM, with the deterministic pathway better for extremes.
abstract: Abstract As most global climate models (GCM) suffer from large biases in simulating/predicting
  summer precipitation over China, it is of great importance to develop suitable bias-correction methods.
  This study proposes two pathways of bias-correction with deep learning (DL) models incorporated. One
  is the deterministic pathway (DP), in which the bias correction is directly applied to the precipitation
  forecasts. The other one, namely the probability pathway (PP), corrects the forecasted precipitation
  anomalies using a conditional probability method before being added to the observational climatology.
  These two pathways have been applied to correct the precipitation forecasts based on a GCM prediction
  system Nanjing University of Information Science and Technology Climate Forecast System version 1.0
  (NUIST-CFS1.0). The applications of DL models in the both pathways yield higher resolution of corrected
  predictions than the uncorrected ones. Both pathways improve summer precipitation predictions at 4-month
  lead. Moreover, the DP correction shows a better performance in predicting extreme precipitation, while
  the PP is proficient in correcting the spatial pattern of precipitation anomalies over China. The present
  results highlight the importance of the application of appropriate correction strategy for different
  prediction purposes.
