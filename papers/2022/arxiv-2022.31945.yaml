summary: Focal Frame Loss weights prediction frames by difficulty, improving several radar nowcasting
  models without extra training cost on two large radar datasets.
abstract: Precipitation nowcasting is an important but hard problem. Currently, with the landing of deep
  learning, it has been treated as an image prediction problem based on radar echo maps. However, deep
  learning models suffer from poor performance and blurred prediction results. Lots of improvement works
  enhance the model by adding complex modules, which increases insufferable training memory and time overhead.
  Others tempt to add more limitations or guidances on loss, but they usually have little effect in such
  an extremely complex and difficult task. In this paper, we propose a simple but effective loss named
  Focal Frame Loss (FFL), which assigns different weights to the images in the prediction sequence to
  focus on the images that are relatively difficult to predict. Experiments on two large-scale radar datasets
  show that FFL can greatly improve the performance of multiple popular models without introducing additional
  training costs.
