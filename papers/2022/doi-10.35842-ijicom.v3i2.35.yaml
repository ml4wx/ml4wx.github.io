summary: Applies Bayesian-regularized neural networks to weather forecasting, reporting improved accuracy
  with more training data but no quantified headline result.
abstract: Weather forecasting has become very urgent in various fields of human life, including in big
  cities. The need for weather forecasting accuracy will be effective and efficient in managing the quality
  of civilization flexibly. Bayesian regularization is one of the techniques used to obtain accurate results
  and development of artificial neural networks. The training process achieves the smallest epoch using
  a general processing unit to solve big data and high resolution. Scenarios performed via dataset partitioning
  and MSE enhancement. The addition of training data will improve system performance which indicates a
  significant increasing accuracy. Likewise, the decrease in MSE can increase the system accuracy to achieve
  a convergence stability point. Weather forecasting can recommend work units within the city and its
  surroundings, even between provinces or countries.
