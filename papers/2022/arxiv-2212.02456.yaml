summary: Transformer ensembles predict eight hours of rainfall from one hour of satellite imagery, ranking
  third in the NeurIPS 2022 Weather4cast challenge.
abstract: Accurately forecasting the weather is an important task, as many real-world processes and decisions
  depend on future meteorological conditions. The NeurIPS 2022 challenge entitled Weather4cast poses the
  problem of predicting rainfall events for the next eight hours given the preceding hour of satellite
  observations as a context. Motivated by the recent success of transformer-based architectures in computer
  vision, we implement and propose two methodologies based on this architecture to tackle this challenge.
  We find that ensembling different transformers with some baseline models achieves the best performance
  we could measure on the unseen test data. Our approach has been ranked 3rd in the competition.
