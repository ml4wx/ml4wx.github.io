summary: Adds a stochastic noise generation step to a deep network for ensemble urban radar rainfall nowcasts,
  matching optical flow skill over a full year at 5-minute resolution.
abstract: Rainfall forecasting plays a key role in mitigating environmental risks in urban areas, which
  are subject to increasing hydrogeological risk due to transformations in the urban landscape. We present
  a new technique for probabilistic precipitation nowcasting by generating an ensemble of equiprobable
  forecasts, which is especially useful for weather radars with limited spatial range, and that can be
  used operationally on devices with low computational capacity. The ensemble members are obtained by
  a novel stochastic noise generation process, consistent with the spatial scales not resolved by the
  prediction model, which allows continuous downscaling of the output of a deep generative neural network.
  Through an in-depth analysis of the results, for precipitation accumulated in the first hour, measured
  by all the most robust skill indicators, extended to an entire year of data at 5-min time resolution,
  we demonstrate that the proposed procedure is able to provide calibrated, reliable, and sharp ensemble
  rainfall forecasts with a quality comparable or superior to the state-of-the-art classical alternative
  optical flow technique. The ensemble generation procedure we propose is sufficiently general to be applied
  in principle to other deterministic architectures as well, thus enabling their generalization in probabilistic
  terms.
