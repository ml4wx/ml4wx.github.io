summary: Compares explanation methods on severe-weather and road-surface-temperature models, finding top-10
  feature sets agree on about six features, and releases scikit-explain.
abstract: With increasing interest in explaining machine learning (ML) models, the first part of this
  two-part study synthesizes recent research on methods for explaining global and local aspects of ML
  models. This study distinguishes explainability from interpretability, local from global explainability,
  and feature importance versus feature relevance. We demonstrate and visualize different explanation
  methods, how to interpret them, and provide a complete Python package (scikit-explain) to allow future
  researchers to explore these products. We also highlight the frequent disagreement between explanation
  methods for feature rankings and feature effects and provide practical advice for dealing with these
  disagreements. We used ML models developed for severe weather prediction and sub-freezing road surface
  temperature prediction to generalize the behavior of the different explanation methods. For feature
  rankings, there is substantially more agreement on the set of top features (e.g., on average, two methods
  agree on 6 of the top 10 features) than on specific rankings (on average, two methods only agree on
  the ranks of 2-3 features in the set of top 10 features). On the other hand, two feature effect curves
  from different methods are in high agreement as long as the phase space is well sampled. Finally, a
  lesser-known method, tree interpreter, was found comparable to SHAP for feature effects, and with the
  widespread use of random forests in geosciences and computational ease of tree interpreter, we recommend
  it be explored in future research.
