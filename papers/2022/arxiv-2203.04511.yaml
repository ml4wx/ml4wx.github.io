summary: Neural forward-intensity Poisson process models nonlinear excitation links between extreme climate
  events and political violence across countries over 20 years.
abstract: 'The causal mechanism between climate and political violence is fraught with complex mechanisms.
  Current quantitative causal models rely on one or more assumptions: (1) the climate drivers persistently
  generate conflict, (2) the causal mechanisms have a linear relationship with the conflict generation
  parameter, and/or (3) there is sufficient data to inform the prior distribution. Yet, we know conflict
  drivers often excite a social transformation process which leads to violence (e.g., drought forces agricultural
  producers to join urban militia), but further climate effects do not necessarily contribute to further
  violence. Therefore, not only is this bifurcation relationship highly non-linear, there is also often
  a lack of data to support prior assumptions for high resolution modeling. Here, we aim to overcome the
  aforementioned causal modeling challenges by proposing a neural forward-intensity Poisson process (NFIPP)
  model. The NFIPP is designed to capture the potential non-linear causal mechanism in climate induced
  political violence, whilst being robust to sparse and timing-uncertain data. Our results span 20 recent
  years and reveal an excitation-based causal link between extreme climate events and political violence
  across diverse countries. Our climate-induced conflict model results are cross-validated against qualitative
  climate vulnerability indices. Furthermore, we label historical events that either improve or reduce
  our predictability gain, demonstrating the importance of domain expertise in informing interpretation.'
