summary: Builds a 148-year, 50-60 km precipitation oxygen isoscape for China by CNN fusion and bias correction
  of eight isotope-enabled GCMs, correlation above 0.8.
abstract: Abstract. The precipitation oxygen isotopic composition is a useful environmental tracer for
  climatic and hydrological studies. However, the observed precipitation oxygen is limited at both temporal
  and spatial scales. Isotope-equipped general circulation models (iGCMs) can compensate for the temporal
  and spatial discontinuity of observation networks, but they suffer from coarse spatial resolutions and
  systematic biases. The objective of this study is to build a high-resolution precipitation oxygen isoscape
  in China for a period of 148 years by integrating observed and iGCMs-simulated precipitation oxygen
  isotope composition (δ18Op) using data fusion and bias correction methods. The temporal and spatial
  resolutions are month and 50–60 km for the isoscape, respectively. Prior to building the oxygen isoscape,
  the performance of two bias correction methods (BCMs) and three data fusion methods (DFMs) is compared
  after post-processing of eight iGCM simulations. Results show that the outputs of the Convolutional
  Neural Networks (CNN) fusion method exhibit the strongest correlation with observations with correlation
  coefficient mostly larger than 0.8, and the smallest bias with root mean square error mostly smaller
  than 2 ‰. The other two DFMs also perform slightly better than the two BCMs, which show similar performance.
  Thus, precipitation oxygen isoscape is generated by using the CNN fusion method for the 1969–2007 period
  in which all iGCMs have output and by using the bias correction methods for the remaining years. Based
  on the precipitation oxygen isoscape, the spatiotemporal patterns of δ18Op across China are investigated.
  The generated isoscape shows similar spatial and temporal distribution characteristics to observations.
  In general, the distribution pattern of δ18Op is consistent with the temperature effect in northern
  China, and with the precipitation amount effect in southern China, and be more specific in the Qinghai-Tibet
  Plateau of China. The δ18Op time series mirrors a fluctuating upward trend of the temperature or precipitation
  in most regions of China. The temporal and spatial distribution characteristics of the generated isoscape
  are consistent with the characteristics of atmospheric circulation and climate change, indicating successful
  assimilation and extension of the observed precipitation oxygen isotopes in time and space. Overall,
  the built isoscape is reliable and useful for providing strong support for tracking atmospheric and
  hydrological processes. The dataset is available in Zenodo at https://doi.org/10.5281/zenodo.5703811
  (Chen et al., 2021).
