summary: Combines artificial neural networks and regression to downscale EURO-CORDEX temperatures from
  12 km to 1 km over Athens, projecting Tmax and Tmin rises under RCP scenarios.
abstract: The main objective of this study is to bridge the gap between regional- and city-scale climate
  simulations, with the focus given to the thermal environment. A dynamic-statistical downscaling methodology
  for defining daily maximum (Tmax) and minimum (Tmin) temperatures is developed based on artificial neural
  networks (ANNs) and multiple linear regression models (MLRs). The approach involves the use of simulations
  from two EURO-CORDEX regional climate models (RCMs) (at approximately 12 km × 12 km) that are further
  downscaled to a finer resolution (1 km × 1 km). A feature selection methodology is applied to select
  the optimum subset of parameters for training the machine learning models. The downscaling methodology
  is initially applied to two RCMs, driven by the ERA-Interim reanalysis (2008–2011) and high-resolution
  urban climate model simulations (UrbClims). The performance of the relationships is validated and found
  to successfully simulate the spatiotemporal distribution of Tmax and Tmin over Athens. Finally, the
  relationships that were extracted by the models are further used to quantify changes for Tmax and Tmin
  in high resolution, between the historical period (1971–2000) and mid-century (2041–2071) climate projections
  for two different representative concentration pathways (RCP4.5 and RCP8.5). Based on the results, both
  mean Tmax and Tmin are estimated to increase by 1.7 °C and 1.5 °C for RCP4.5 and 2.3 °C and 2.1 °C for
  RCP8.5, respectively, with distinct spatiotemporal patterns over the study area.
