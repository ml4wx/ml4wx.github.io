summary: Bird-mating-optimizer-tuned bidirectional GRU for weather forecasting reports RMSE 0.173, better
  than MLP-ANN at 0.202.
abstract: Weather forecasting is primarily related to the prediction of weather conditions that becomes
  highly important in diverse applications like drought discovery, severe weather forecast, climate monitoring,
  agriculture, aviation, telecommunication, etc. Data-driven computer modelling with Artificial Neural
  Networks (ANN) can be used to solve non-linear problems. Presently, Deep Learning (DL) based weather
  forecasting models can be designed to accomplish reasonable predictive performance. In this aspect,
  this study presents a Hyper Parameter Tuned Bidirectional Gated Recurrent Neural Network (HPT-BiGRNN)
  technique for weather forecasting. The HPT-BiGRNN technique aims to utilize the past weather data for
  training the BiGRNN model and achieve the effective forecasts with minimum time duration. The BiGRNN
  is an enhanced version of Gated Recurrent Unit (GRU) that follows the process of passing input via forward
  and backward neural network and the outputs are linked to the identical output layer. The BiGRNN technique
  includes several hyper-parameters and hence, the hyperparameter optimization process takes place using
  Bird Mating Optimizer (BMO). The design of BMO algorithm for hyperparameter optimization of the BiGRNN,
  particularly for weather forecast shows the novelty of the work. The BMO algorithm is used to set hyperparameters
  such as momentum, learning rate, batch size and weight decay. The experimental result the HPT-BiGRNN
  approach has resulted in a lower RMSE of 0.173 whereas the Fuzzy-GP, Fuzzy-SC, MLP-ANN and RBF-ANN methods
  have gained an increased RMSE of 0.218, 0.216, 0.202 and 0.245 respectively.
