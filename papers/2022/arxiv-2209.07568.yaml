summary: A physically constrained GAN corrects Earth system model precipitation, fixing local distributions
  and the double-peaked ITCZ while preserving global precipitation sums under future scenarios.
abstract: Precipitation results from complex processes across many scales, making its accurate simulation
  in Earth system models (ESMs) challenging. Existing post-processing methods can improve ESM simulations
  locally, but cannot correct errors in modelled spatial patterns. Here we propose a framework based on
  physically constrained generative adversarial networks (GANs) to improve local distributions and spatial
  structure simultaneously. We apply our approach to the computationally efficient ESM CM2Mc-LPJmL. Our
  method outperforms existing ones in correcting local distributions, and leads to strongly improved spatial
  patterns especially regarding the intermittency of daily precipitation. Notably, a double-peaked Intertropical
  Convergence Zone, a common problem in ESMs, is removed. Enforcing a physical constraint to preserve
  global precipitation sums, the GAN can generalize to future climate scenarios unseen during training.
  Feature attribution shows that the GAN identifies regions where the ESM exhibits strong biases. Our
  method constitutes a general framework for correcting ESM variables and enables realistic simulations
  at a fraction of the computational costs.
