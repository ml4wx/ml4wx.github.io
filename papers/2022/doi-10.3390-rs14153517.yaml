summary: F2F-NN, a CNN retrieving sea surface wind fields from FY-3D microwave imager data, reaches 0.26
  m/s RMSE and beats five existing products in a hurricane case.
abstract: 'In this paper, we present a method for retrieving sea surface wind speed (SSWS) from Fengyun-3D
  (FY-3D) microwave radiation imager (MWRI) data. In contrast to the conventional point-to-point (P2P)
  retrieval methods, we propose a field-to-field (F2F) SSWS retrieval method based on the basic framework
  of a Convolutional Neural Network (CNN). Considering the spatial continuity and consistency characteristics
  of wind fields within a certain range, we construct the model based on the basic framework of CNN, which
  is suitable for retrieving various wind speed intervals, and then synchronously obtaining the smooth
  and continuous wind field. The retrieval results show that: (1) Comparing the retrieval results with
  the label data, the root-mean-square error (RMSE) of wind speed is about 0.26 m/s, the F2F-NN model
  is highly efficient in training and has a strong fitting ability to label data. Comparing the retrieval
  results with the buoys (NDBC and TAO) data, the RMSE of F2F-NN wind speed is less than 0.91 m/s, the
  retrieval accuracy is better than the wind field products involved in the comparison. (2) In the hurricane
  (Sam) area, the F2F-NN model greatly improves the accuracy of wind speed in the FY-3D wind field. Comparing
  five wind field products with the Stepped-Frequency Microwave Radiometer (SFMR) data, the overall accuracy
  of the F2F-NN wind data is the highest. Comparing the five wind field products with the International
  Best Track Archive for Climate Stewardship (IBTrACS) data, the F2F-NN wind field is superior to the
  other products in terms of maximum wind speed and maximum wind speed radius. The structure of the wind
  field retrieved by F2F-NN is complete and accurate, and the wind speed changes smoothly and continuously.'
