summary: Builds a regression surrogate of outdoor thermal comfort from WRF climate simulations and a portfolio-based
  allocation method for urban cooling resources in Singapore.
abstract: 'Decision makers (DMs) who are involved in urban planning are often required to allocate finite
  resources (say, money) to improve outdoor thermal comfort (OTC) levels in a region (e.g., city, canton,
  country). In this paper, for the first time, we address the following two questions, which are directly
  related to this requirement: (1) How can the statistical properties of the spatial risk profile of an
  urban area from an OTC perspective be quantified, no matter which OTC index the DM chooses to use? (2)
  Given the risk profile, how much and where should the DM allocate the finite resources to improve the
  OTC levels? We answer these fundamental questions by developing a new and rigorous mathematical framework
  as well as a new class of models for spatial risk models. Our approach is based on methods from machine
  learning: first, a surrogate model of the OTC index that provides both accuracy and mathematical tractability
  is developed via regression analysis. Next, we incorporate the imperfect climate model and derive the
  statistical properties of the OTC index. We present the concept of spatio-temporal aggregate risk (STAR)
  measures and derive their statistical properties. Finally, building on our derivations, we develop a
  new algorithm for spatial resource allocation, which is useful for DMs and is based on modern portfolio
  theory. We implemented the tool and used it to illustrate its operation on a practical case of the large-scale
  area of Singapore using a WRF climate model.'
