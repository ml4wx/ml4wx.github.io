summary: A parallel multi-frame radar nowcasting model with noise dropout and semantic restore modules
  reduces error accumulation and achieves competitive scores against state-of-the-art methods.
abstract: Precipitation nowcasting based on radar echo maps is essential in meteorological research. Recently,
  Convolutional RNNs based methods dominate this field, but they cannot be solved by parallel computation
  resulting in longer inference time. FCN based methods adopt a multi-frame-to-single-frame inference
  (MSI) strategy to avoid this problem. They feedback into the model again to predict the next time step
  to get multi-frame nowcasting results in the prediction phase, which will lead to the accumulation of
  prediction errors. In addition, precipitation noise is a crucial factor contributing to high prediction
  errors because of its unpredictability. To address this problem, we propose a novel Multi-frame-to-Multi-frame
  Inference (MMI) model with Noise Resistance (NR) named MMINR. It avoids error accumulation and resists
  precipitation noiseś negative effect in parallel computation. NR contains a Noise Dropout Module (NDM)
  and a Semantic Restore Module (SRM). NDM deliberately dropout noise simple yet efficient, and SRM supplements
  semantic information of features to alleviate the problem of semantic information mistakenly lost by
  NDM. Experimental results demonstrate that MMINR can attain competitive scores compared with other SOTAs.
  The ablation experiments show that the proposed NDM and SRM can solve the aforementioned problems.
