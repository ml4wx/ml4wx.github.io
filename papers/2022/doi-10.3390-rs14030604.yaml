summary: CLSTM-LFN video-prediction model fuses lightning history with NWP variables to forecast 0-3 h
  cloud-to-ground lightning areas, outperforming parameterization schemes.
abstract: The evolution of lightning generation and extinction is a nonlinear and complex process, and
  the nowcasting results based on extrapolation and numerical models largely differ from the real situation.
  In this study, a multiple-input and multiple-output lightning nowcasting model, namely Convolutional
  Long- and Short-Term Memory Lightning Forecast Net (CLSTM-LFN), is constructed to improve the lightning
  nowcasting results from 0 to 3 h based on video prediction methods in deep learning. The input variables
  to CLSTM-LFN include historical lightning occurrence frequency and physical variables significantly
  related to lightning occurrence from numerical model products, which are merged with each other to provide
  effective information for lightning nowcasting in time and space. The results of batch forecasting tests
  show that CLSTM-LFN can achieve effective forecasts of 0 to 3 h lightning occurrence areas, and the
  nowcasting results are better than those of the traditional lightning parameterization scheme and only
  inputting a single data source. After analyzing the importance of input variables, the results show
  that the role of numerical model products increases significantly with increasing forecast time, and
  the relative importance of convective available potential energy is significantly larger than that of
  other physical variables.
