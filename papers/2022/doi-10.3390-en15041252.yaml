summary: Compares ML and ensemble methods for day-ahead wind farm output using lagged NWP point forecasts,
  with a new averaging ensemble giving the lowest error at two farms.
abstract: 'The ability to precisely forecast power generation for large wind farms is very important,
  since such generation is highly unstable and creates problems for Distribution and Transmission System
  Operators to properly prepare the power system for operation. Forecasts for the next 24 h play an important
  role in this process. They are also used in energy market transactions. Even a small improvement in
  the quality of these forecasts translates into more security of the system and savings for the economy.
  Using two wind farms for statistical analyses and forecasting considerably increases credibility of
  newly created effective prediction methods and formulated conclusions. In the first part of our study,
  we have analysed the available data to identify potentially useful explanatory variables for forecasting
  models with additional development of new input data based on the basic data set. We demonstrate that
  it is better to use Numerical Weather Prediction (NWP) point forecasts for hourly lags: −3, 2, −1, 0,
  1, 2, 3 (original contribution) as input data than lags 0, 1 that are typically used. Also, we prove
  that it is better to use forecasts from two NWP models as input data. Ensemble, hybrid and single methods
  are used for predictions, including machine learning (ML) solutions like Gradient-Boosted Trees (GBT),
  Random Forest (RF), Multi-Layer Perceptron (MLP), Long Short-Term Memory (LSTM), K-Nearest Neighbours
  Regression (KNNR) and Support Vector Regression (SVR). Original ensemble methods, developed for researching
  specific implementations, have reduced errors of forecast energy generation for both wind farms as compared
  to single methods. Predictions by the original ensemble forecasting method, called “Ensemble Averaging
  Without Extremes” have the lowest normalized mean absolute error (nMAE) among all tested methods. A
  new, original “Additional Expert Correction” additionally reduces errors of energy generation forecasts
  for both wind farms. The proposed ensemble methods are also applicable to short-time generation forecasting
  for other renewable energy sources (RES), e.g., hydropower or photovoltaic (PV) systems.'
