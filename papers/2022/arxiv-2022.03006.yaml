summary: Ensemble of gradient boosting, random forest, Bernoulli Naive Bayes and KNN reaches 95% weather
  prediction accuracy and runs in under 40 s for 5,000 nodes.
abstract: The agricultural sector’s day-to-day operations, such as irrigation and sowing, are impacted
  by the weather. Therefore, weather constitutes a key role in all regular human activities. Weather forecasting
  must be accurate and precise to plan our activities and safeguard ourselves as well as our property
  from disasters. Rainfall, wind speed, humidity, wind direction, cloud, temperature, and other weather
  forecasting variables are used in this work for weather prediction. Many research works have been conducted
  on weather forecasting. The drawbacks of existing approaches are that they are less effective, inaccurate,
  and time-consuming. To overcome these issues, this paper proposes an enhanced and reliable weather forecasting
  technique. As well as developing weather forecasting in remote areas. Weather data analysis and machine
  learning techniques, such as Gradient Boosting Decision Tree, Random Forest, Naive Bayes Bernoulli,
  and KNN Algorithm are deployed to anticipate weather conditions. A comparative analysis of result outcome
  said in determining the number of ensemble methods that may be utilized to improve the accuracy of prediction
  in weather forecasting. The aim of this study is to demonstrate its ability to predict weather forecasts
  as soon as possible. Experimental evaluation shows our ensemble technique achieves 95% prediction accuracy.
  Also, for 1000 nodes it is less than 10 s for prediction, and for 5000 nodes it takes less than 40 s
  for prediction.
