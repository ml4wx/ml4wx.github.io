summary: LSTM predicts atmospheric wind and temperature profiles up to 30 km from US radiosondes, matching
  or beating reanalysis in some cases for infrasound modeling.
abstract: 'Abstract Infrasound is generated by a variety of natural and anthropogenic sources. Infrasonic
  waves travel through the dynamic atmosphere, which can change on the order of minutes to hours. Infrasound
  propagation largely depends on the wind and temperature structure of the atmosphere. Numerical weather
  prediction models are available to provide atmospheric specifications, but uncertainties in these models
  exist and they are computationally expensive to run. Machine learning has proven useful in predicting
  tropospheric weather using Long Short‐Term Memory (LSTM) networks. An LSTM network is utilized to make
  atmospheric specification predictions up to ∼30 km for three different training and testing scenarios:
  (a) the model is trained and tested using only radiosonde data from the Albuquerque, NM, USA station,
  (b) the model is trained on radiosonde stations across the contiguous US, excluding the Albuquerque,
  NM, USA station, which was reserved for testing, and (c) the model is trained and tested on radiosonde
  stations across the contiguous US. Long Short‐Term Memory predictions are compared to a state‐of‐the‐art
  reanalysis model and show cases where the LSTM outperforms, performs equally as well, or underperforms
  in comparison to the state‐of‐the‐art. Regional and temporal trends in model performance across the
  US are also discussed. Results suggest that the LSTM model is a viable tool for predicting atmospheric
  specifications for infrasound propagation modeling.'
