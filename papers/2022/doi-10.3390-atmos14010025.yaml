summary: CSIP-Net, a convolutional network that predicts FY-4A infrared satellite images, reaching 4.77
  K mean error at 2 h and 0.855 accuracy for precipitation-area detection.
abstract: Geosynchronous satellite observation images have the advantages of a wide observation range
  and high temporal resolution, which are critical for understanding atmospheric motion and change patterns.
  The realization of geosynchronous satellite observation image prediction will provide significant support
  for short-term forecasting, including precipitation forecasting. Here, this paper proposes a deep learning
  method for predicting satellite observation images that can perform the task of predicting satellite
  observation sequences. In the study of predicting the observed images for Band 9 of the FY-4A satellite,
  the average mean square error of the network’s 2-h prediction is 4.77 Kelvin. The network’s predictive
  performance is the best among multiple deep learning models. We also used the model to predict Bands
  10–14 of the FY-4A satellite and combined the multi-band prediction results. To test the application
  potential of the network prediction performance, we ran a precipitation area detection task on the multi-band
  prediction results. After 2 h of prediction, the detection results from satellite infrared images still
  achieved an accuracy of 0.855.
