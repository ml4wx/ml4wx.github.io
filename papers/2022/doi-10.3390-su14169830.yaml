summary: Applies regression, clustering and CNN analysis to 28,713 Australian tropical cyclone records,
  identifying drivers of low central pressure and anomaly root causes.
abstract: Tropical cyclones take precious lives, damage critical infrastructure, and cause economic losses
  worth billions of dollars in Australia. To reduce the detrimental effect of cyclones, a comprehensive
  understanding of cyclones using artificial intelligence (AI) is crucial. Although event records on Australian
  tropical cyclones have been documented over the last 4 decades, deep learning studies on these events
  have not been reported. This paper presents automated AI-based regression, anomaly detection, and clustering
  techniques on the largest available cyclone repository covering 28,713 records with almost 80 cyclone-related
  parameters from 17 January 1907 to 11 May 2022. Experimentation with both linear and logistic regression
  on this dataset resulted in 33 critical insights on factors influencing the central pressure of cyclones.
  Moreover, automated clustering determined four different clusters highlighting the conditions for low
  central pressure. Anomaly detection at 70% sensitivity identified 12 anomalies and explained the root
  causes of these anomalies. This study also projected parameterization and fine-tuning of AI-algorithms
  at different sensitivity levels. Most importantly, we mathematically evaluated robustness by supporting
  an enormous scenario space of 4.737 × 108234. A disaster strategist or researcher can use the deployed
  system in iOS, Android, or Windows platforms to make evidence-based policy decisions on Australian tropical
  cyclones.
