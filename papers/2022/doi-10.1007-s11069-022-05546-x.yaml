summary: Compares threshold, neural network and belief-function methods for 0–24 h lightning strike risk
  over the sea for aviation, with WWLLN ground truth.
abstract: Abstract Thunderstorms, the main generator of lightning on earth, are characterized by the presence
  of extreme atmospheric conditions (turbulence, hail, heavy rain, wind shear, etc.). Consequently, the
  atmospheric conditions associated with this kind of phenomenon (in particular the strike itself) can
  be dangerous for aviation. This study focuses on the estimation of the lightning strike risk induced
  by thunderstorms over the sea, in a short-range forecast, from 0 to 24 h. In this framework, three methods
  have been developed and compared. The first method is based on the use of thresholds and weighting functions;
  the second method is based on a neural network approach, and the third method is based on the use of
  belief functions. Each method has been applied to the same dataset comprising predictors defined from
  numerical weather prediction model outputs. In order to assess the different methods, a “ground truth”
  dataset based on lightning stroke locations supplied by the World Wide Lightning Location Network (WWLLN)
  has been used. The choice of one method over the others will depend on the compromise that the user
  is willing to accept between false alarms, missed detections, and runtimes. The first method has a very
  low missed detection rate but a high false alarm rate, while the other two methods have much lower false
  alarm rates, but at the cost of a non-negligible missed detection rate. Finally, the third method is
  much faster than the other two methods.
