summary: Compares U-Net, ConvLSTM and SVG-LP for precipitation nowcasting on precipitation maps, adding
  a patch extraction scheme and a loss that reduces blurring.
abstract: Precipitation nowcasting is of great importance for weather forecast users, for activities ranging
  from outdoor activities and sports competitions to airport traffic management. In contrast to long-term
  precipitation forecasts which are traditionally obtained from numerical models, precipitation nowcasting
  needs to be very fast. It is therefore more challenging to obtain because of this time constraint. Recently,
  many machine learning based methods had been proposed. We propose the use three popular deep learning
  models (U-net, ConvLSTM and SVG-LP) trained on two-dimensional precipitation maps for precipitation
  nowcasting. We proposed an algorithm for patch extraction to obtain high resolution precipitation maps.
  We proposed a loss function to solve the blurry image issue and to reduce the influence of zero value
  pixels in precipitation maps.
