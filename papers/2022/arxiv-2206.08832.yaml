summary: Random Forest-based solar irradiance forecasting at 288 San Antonio sites from weather data,
  achieving R2 of 0.85 to 0.91.
abstract: A novel method for real-time solar generation forecast using weather data, while exploiting
  both spatial and temporal structural dependencies is proposed. The network observed over time is projected
  to a lower-dimensional representation where a variety of weather measurements are used to train a structured
  regression model while weather forecast is used at the inference stage. Experiments were conducted at
  288 locations in the San Antonio, TX area on obtained from the National Solar Radiation Database. The
  model predicts solar irradiance with a good accuracy (R2 0.91 for the summer, 0.85 for the winter, and
  0.89 for the global model). The best accuracy was obtained by the Random Forest Regressor. Multiple
  experiments were conducted to characterize influence of missing data and different time horizons providing
  evidence that the new algorithm is robust for data missing not only completely at random but also when
  the mechanism is spatial, and temporal.
