summary: Random Forest nowcasts cloud-to-ground lightning over Italy and seas, finding that finest-resolution
  gridding of inputs gives the best skill.
abstract: Abstract The relation between the increase in the frequency and the effects of extreme events
  with climate change has been widely demonstrated and the related consequences are a global concern.
  In this framework, the strong correlation between significant lightning occurrence and intense precipitation
  events has been also documented. Consequently, the possibility of having a short-term forecasting tool
  of the lightning activity may help in identifying and monitoring the evolution of severe weather events
  on very short time ranges. The present paper proposes an application of Random Forest (RF), a popular
  Machine Learning (ML) algorithm, to perform a nowcasting of Cloud-to-Ground (CG) lightning occurrence
  over the Italian territory and the surrounding seas during the months of August, September, and October
  from 2017 to 2019. Results obtained with three different spatial resolutions have been compared, suggesting
  that, to enhance the skills of the model in identifying the presence or absence of strokes, all the
  data selected as input should be commonly gridded on the finest available spatial resolution. Moreover,
  the features’ importance analysis performed confirms that meteorological features describing the state
  of the atmosphere, especially at higher altitudes, have a stronger impact on the final result than topology
  data, such as Latitude or Digital Elevation Model (DEM).
