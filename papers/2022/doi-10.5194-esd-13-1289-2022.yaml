summary: Supervised classifier trained on 18 observation and reanalysis datasets labels Central and Eastern
  Pacific El Niño types, then shows the observed CP increase lies within internal variability in large
  ensembles.
abstract: 'Abstract. The El Niño Southern Oscillation (ENSO) occurs in three phases: neutral, warm (El
  Niño) and cool (La Niña). While classifying El Niño and La Niña is relatively straightforward, El Niño
  events can be broadly classified into two types: Central Pacific (CP) and Eastern Pacific (EP). Differentiating
  between CP and EP events is currently dependent on both the method and observational dataset used. In
  this study, we create a new classification scheme using supervised machine learning trained on 18 observational
  and reanalysis products. This builds on previous work by identifying classes of events using the temporal
  evolution of sea surface temperature in multiple regions across the tropical Pacific. By applying this
  new classifier to seven single model initial-condition large ensembles (SMILEs) we investigate both
  the internal variability and forced changes in each type of ENSO event, where events identified behave
  similar to those observed. It is currently debated whether the observed increase in the frequency of
  CP events after the late 1970s is due to climate change. We found it to be within the range of internal
  variability in the SMILEs. When considering future changes, we do not project a change in CP frequency
  or amplitude under a strong warming scenario (RCP8.5/SSP370) and we find model differences in EP El
  Niño and La Niña frequency and amplitude projections. Finally, we find that models show differences
  in projected precipitation and SST pattern changes for each event type that do not seem to be linked
  to the Pacific mean state SST change, although the SST and precipitation changes in individual SMILEs
  are linked. Our work demonstrates the value of combining machine learning with climate models, and highlights
  the need to use SMILEs when evaluating ENSO in climate models due to the large spread of results found
  within a single model due to internal variability alone.'
