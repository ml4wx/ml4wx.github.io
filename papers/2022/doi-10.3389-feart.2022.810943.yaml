summary: Hierarchical clustering separates northward-moving typhoon tracks affecting Northeast China and
  links each type to preceding Pacific SST anomalies, with numerical experiments confirming the mechanism.
abstract: In this study, the northward-moving tropical cyclones (TCs) that influence Northeast China (NEC)
  in July–September are identified based on the distance between the TC center and the boundaries of NEC.
  Then, based on a machine learning algorithm named hierarchical agglomerative clustering, the tracks
  of northward-moving TCs that influence NEC are classified into the eastern-track type and the turning
  type. In NEC, the precipitation induced by eastern-track type TCs gradually decreases from east to west,
  and the precipitation induced by turning-type TCs gradually decreases from south to north. For eastern-track
  type TCs, negative Niño3 sea surface temperature (SST) anomalies in preceding January–March can induce
  cyclonic circulation anomalies and positive vorticity anomalies over the Philippine Sea during subsequent
  July–September, which favors the genesis of TCs. Moreover, the westerly anomaly in the subtropical western
  north Pacific and the strengthening of cyclonic steering flow over the Philippines jointly steer the
  TCs to move northward along the northerly airflow on the west of the western Pacific subtropical high,
  which favors the genesis of eastern-track type TCs. For turning-type TCs, the positive SST anomalies
  in the West Wind Drift area during preceding May–July cause positive vorticity anomalies from the northern
  Philippines to Taiwan from July to September. The cyclonic steering flow over the Philippines and the
  anticyclonic steering flow over the Sea of Japan lead the TCs to move northwestwards and then turn to
  northeast, which is conducive to the genesis of turning type northward-moving TCs. Finally, the results
  of numerical experiments have confirmed these findings.
