summary: An attention-based encoder-decoder LSTM forecasts short-term surface temperature from multiple
  meteorological variables, with learned spatial feature attention weights validated against correlations.
abstract: Weather prediction and meteorological analysis contribute significantly towards sustainable
  development to reduce the damage from extreme events which could otherwise set-back the progress in
  development by years. The change in surface temperature is as one of the important indicators in detecting
  climate change. In this research, we propose a novel deep learning model named Spatial Feature Attention
  Long Short Term Memory (SFA-LSTM) model to capture accurate spatial and temporal relations of multiple
  meteorological features to forecast temperature. Significant spatial feature and temporal interpretations
  of historical data aligned directly to output feature helps the model to forecast data accurately. The
  spatial feature attention captures mutual influence of input features on the target feature. The model
  is built using encoder-decoder architecture, where the temporal dependencies in data are learnt using
  LSTM layers in the encoder phase and spatial feature relations in the decoder phase. SFA-LSTM forecasts
  temperature by simultaneously learning most important time steps and weather variables. When compared
  with baseline models, SFA-LSTM maintains the state-of the-art prediction accuracy while offering the
  benefit of appropriate spatial feature interpretability. The learned spatial feature attention weights
  are validated from magnitude of correlation with target feature obtained from the dataset.
