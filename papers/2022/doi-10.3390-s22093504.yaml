summary: Fuzzy-logic fusion of decision tree, naive Bayes, KNN and SVM classifiers predicts rainfall for
  Lahore from 12 years of station data.
abstract: Precipitation in any form-such as rain, snow, and hail-can affect day-to-day outdoor activities.
  Rainfall prediction is one of the challenging tasks in weather forecasting process. Accurate rainfall
  prediction is now more difficult than before due to the extreme climate variations. Machine learning
  techniques can predict rainfall by extracting hidden patterns from historical weather data. Selection
  of an appropriate classification technique for prediction is a difficult job. This research proposes
  a novel real-time rainfall prediction system for smart cities using a machine learning fusion technique.
  The proposed framework uses four widely used supervised machine learning techniques, i.e., decision
  tree, Naïve Bayes, K-nearest neighbors, and support vector machines. For effective prediction of rainfall,
  the technique of fuzzy logic is incorporated in the framework to integrate the predictive accuracies
  of the machine learning techniques, also known as fusion. For prediction, 12 years of historical weather
  data (2005 to 2017) for the city of Lahore is considered. Pre-processing tasks such as cleaning and
  normalization were performed on the dataset before the classification process. The results reflect that
  the proposed machine learning fusion-based framework outperforms other models.
