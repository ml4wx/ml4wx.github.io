summary: Ensemble k-nearest-neighbour method in a GIS environment predicts regional typhoon tracks with
  fast simulation and high accuracy.
abstract: This paper presents a novel approach for typhoon track prediction that potentially impacts a
  region using ensemble k-Nearest Neighbor (k-NN) in a GIS environment. In this work, the past typhoon
  tracks are zonally split into left and right classes by the current typhoon track and then grouped as
  an ensemble member containing three (left-center-right) typhoons. The proximity of the current typhoon
  to the left and/or right class is determined by using a supervised classification k-NN algorithm. The
  track dataset created from the current and similar class typhoons is trained by using the supervised
  regression k-NN to predict current typhoon tracks. The ensemble averaging is performed for all typhoon
  track groups to obtain the final track prediction. It is found that the number of ensemble members does
  not necessarily affect the accuracy; the determination of similarity at the beginning, however, plays
  an important key role. A series of tests yields that the present method is able to produce a typhoon
  track prediction with a fast simulation time, high accuracy, and long duration.
