summary: Wavelet analysis and Bayesian ML project emergence windows for Atlantic hurricane categories
  2–5, with category 5 storms expected between 2026 and 2031.
abstract: 'Every year, tropical hurricanes affect North and Central American wildlife and people. The
  ability to forecast hurricanes is essential in order to minimize the risks and vulnerabilities in North
  and Central America. Machine learning is a newly tool that has been applied to make predictions about
  different phenomena. We present an original framework utilizing Machine Learning with the purpose of
  developing models that give insights into the complex relationship between the land–atmosphere–ocean
  system and tropical hurricanes. We study the activity variations in each Atlantic hurricane category
  as tabulated and classified by NOAA from 1950 to 2021. By applying wavelet analysis, we find that category
  2–4 hurricanes formed during the positive phase of the quasi-quinquennial oscillation. In addition,
  our wavelet analyses show that super Atlantic hurricanes of category 5 strength were formed only during
  the positive phase of the decadal oscillation. The patterns obtained for each Atlantic hurricane category,
  clustered historical hurricane records in high and null tropical hurricane activity seasons. Using the
  observational patterns obtained by wavelet analysis, we created a long-term probabilistic Bayesian Machine
  Learning forecast for each of the Atlantic hurricane categories. Our results imply that if all such
  natural activity patterns and the tendencies for Atlantic hurricanes continue and persist, the next
  groups of hurricanes over the Atlantic basin will begin between 2023 ± 1 and 2025 ± 1, 2023 ± 1 and
  2025 ± 1, 2025 ± 1 and 2028 ± 1, 2026 ± 2 and 2031 ± 3, for hurricane strength categories 2 to 5, respectively.
  Our results further point out that in the case of the super hurricanes of the Atlantic of category 5,
  they develop in five geographic areas with hot deep waters that are rather very well defined: (I) the
  east coast of the United States, (II) the Northeast of Mexico, (III) the Caribbean Sea, (IV) the Central
  American coast, and (V) the north of the Greater Antilles.'
