summary: Machine learning ensemble of 27 CMIP6 models improves China extreme precipitation simulation
  and projects increases of up to 13.7% by late century.
abstract: In recent years, China has suffered from frequent extreme precipitation events, and predicting
  their future trends has become an essential part of the current research on this issue. Because of the
  inevitable uncertainties associated with individual models for climate prediction, this study uses a
  machine learning approach to integrate and fit multiple models. The results show that the use of several
  evaluation metrics provides better results than the traditional ensemble median method. The correlation
  coefficients with the actual observations were found to improve from about 0.8 to 0.9, while the correlation
  coefficients of the precipitation amount (PRCPTOT), very heavy precipitation days (R20mm), and extreme
  precipitation intensity (SDII95) reached 0.95. Based on this, the precipitation simulations of moderate
  forced scenario for sharing socio-economic path (SSP2-4.5) from 27 coupled models in the Coupled Model
  Intercomparison Project Phase 6 (CMIP6) were used to explore potential changes in future extreme precipitation
  events in China and to calculate the distribution and trends of the PRCPTOT, extreme precipitation amount
  (R95pTOT), maximum consecutive 5-day precipitation (Rx5day), precipitation intensity (SDII), SDII95,
  and R20mm for the early 21st century (2023–2050), mid-21st century (2051–2075), and late 21st century
  (2076–2100), respectively. The results showed that the most significant increase in extreme precipitation
  indices is expected to occur by the end of the century, with the R95pTOT, Rx5day, and SDII95 increasing
  by 13.73%, 9.43%, and 9.34%, respectively, from the base period. The remaining three precipitation indexes,
  the PRCPTOT, SDII, and R20mm, also showed increases of 8.77%, 6.84%, and 4.02%, respectively. Additionally,
  there were apparent differences in the spatial variation of extreme precipitation. There were significant
  increasing trends of extreme precipitation indexes in central China and northeast China in the three
  periods, among which the total annual precipitation showed an increasing trend in central and northern
  China and a decreasing trend in western and south China. An increasing trend of annual precipitation
  intensity was found to be mainly concentrated in central China and south China, and the annual precipitation
  frequency showed a larger increasing trend at the beginning of this century. The annual precipitation
  frequency showed an increasing trend in the early part of this century. In general, all the indices
  showed an overall increasing trend in the future period, with the PRCPTOT, Rx5day, and SDII95 showing
  the most significant overall increasing trends.
