summary: A neural segmentation pipeline (HolodecML) for HOLODEC cloud particle holograms improves detection
  by nearly 20% over standard processing when trained with image corruptions.
abstract: 'Abstract. HOLODEC, an airborne cloud particle imager, captures holographic images of a fixed
  volume of cloud to characterize the types and sizes of cloud particles, such as water droplets and ice
  crystals. Cloud particle properties include position, diameter, and shape. In this work we evaluate
  the potential for processing HOLODEC data by leveraging a combination of GPU hardware and machine learning
  with the eventual goal of improving HOLODEC processing speed and performance. We present a hologram
  processing algorithm, HolodecML, which utilizes a neural network segmentation model and computational
  parallelization to achieve these goals. HolodecML is trained using synthetically generated holograms
  based on a model of the instrument, and it predicts masks around particles found within reconstructed
  images. From these masks, the position and size of the detected particles can be characterized in three
  dimensions. In order to successfully process real holograms, we find we must apply a series of image
  corrupting transformations and noise to the synthetic images used in training. In this evaluation, HolodecML
  had comparable position and size estimations performance to the standard processing method, but it improved
  particle detection by nearly 20 % on several thousand manually labeled HOLODEC images. However, the
  particle detection improvement only occurred when image corruption was performed on the simulated images
  during training, thereby mimicking non-ideal conditions in the actual probe. The trained model also
  learned to differentiate artifacts and other impurities in the HOLODEC images from the particles, even
  though no such objects were present in the training data set. By contrast, the standard processing method
  struggled to separate particles from artifacts. HolodecML also leverages GPUs and parallel computing
  that enables large processing speed gains over serial and CPU-only based evaluation. Our results demonstrate
  that the machine-learning based framework may be a possible path to both improving and accelerating
  hologram processing. The novelty of the training approach, which leveraged noise as a means for parameterizing
  non-ideal aspects of the HOLODEC detector, could be applied in other domains where the theoretical model
  is incapable of fully describing the real-world operation of the instrument and accurate truth data
  required for supervised learning cannot be obtained from real-world observations.

