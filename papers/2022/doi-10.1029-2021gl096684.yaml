summary: Supervised classification of MODIS images builds the greenCuDb dataset, revealing that continental
  green cumulus form under similar large-scale conditions worldwide.
abstract: Abstract One of the major sources of uncertainty in climate prediction results from the limitations
  in representing shallow cumulus (Cu) in models. Recently, a class of continental shallow convective
  Cu was shown to share distinct morphological properties and to emerge globally mostly over forests and
  vegetated areas, thus named greenCu. Using machine‐learning supervised classification, we identify greenCu
  fields over three regions, from the tropics to mid‐ and higher‐latitudes, and establish a novel satellite‐based
  data set called greenCuDb, consisting of 1° × 1° sized, high‐resolution MODIS images. Using greenCuDb
  in conjunction with ERA5 reanalysis data, we create greenCu composites for different regions and reveal
  that greenCu are driven by similar large‐scale meteorological conditions, regardless of their geographical
  locations throughout the world's continents. These conditions include distinct profiles of temperature,
  humidity and large‐scale vertical velocity. The boundary layer is anomalously warm and moderately humid,
  and is accompanied by a strong large‐scale subsidence in the free troposphere.
