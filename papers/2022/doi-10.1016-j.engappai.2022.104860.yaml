summary: A hybrid CNN-SVR model predicts daily global solar radiation at six Queensland solar farms from
  GCM and station variables, beating eight alternative DL and ML methods.
abstract: This study proposes a new hybrid deep learning (DL) model, the called CSVR, for Global Solar
  Radiation (GSR) predictions by integrating Convolutional Neural Network (CNN) with Support Vector Regression
  (SVR) approach. First, the CNN algorithm is used to extract local patterns as well as common features
  that occur recurrently in time series data at different intervals. Then, the SVR is subsequently adopted
  to replace the fully connected CNN layers to predict the daily GSR time series data at six solar farms
  in Queensland, Australia. To develop the hybrid CSVR model, we adopt the most pertinent meteorological
  variables from Global Climate Model and Scientific Information for Landowners database. From a pool
  of Global Climate Models variables and ground-based observations, the optimal features are selected
  through a metaheuristic Feature Selection algorithm, an Atom Search Optimization method. The hyperparameters
  of the proposed CSVR are optimized by mean of the HyperOpt method, and the overall performance of the
  objective algorithm is benchmarked against eight alternative DL methods, and some of the other Machine
  Learning approaches (LSTM, DBN, RBF, BRF, MARS, WKNNR, GPML and M5TREE) methods. The results obtained
  shows that the proposed CSVR model can offer several predictive advantages over the alternative DL models,
  as well as the conventional ML models. Specifically, we note that the CSVR model recorded a root mean
  square error/mean absolute error ranging between ≈ 2.172–3.305 MJ m2/1.624–2.370 MJ m2 over the six
  tested solar farms compared to ≈ 2.514–3.879 MJ m2/1.939–2.866 MJ m2 from alternative ML and DL algorithms.
  Consistent with this predicted error, the correlation between the measured and the predicted GSR, including
  the Willmott’s, Nash-Sutcliffe’s coefficient and Legates & McCabe’s Index was relatively higher for
  the proposed CSVR model compared to other DL and Machine Learning methods for all of the study sites.
  Accordingly, this study advocates the merits of CSVR model to provide a viable alternative to accurately
  predict GSR for renewable energy exploitation, energy demand or other forecasting-based applications.
