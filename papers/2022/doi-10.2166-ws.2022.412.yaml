summary: CEEMDAN-LSTM hybrid predicts annual precipitation in Zhengzhou city, reaching 2.69% MAPE and
  R² of 0.9863, outperforming five baseline models.
abstract: Abstract Scientific precipitation predicting is of great value and guidance to regional water
  resources development and utilization, agricultural production, and drought and flood control. Precipitation
  is a nonlinear, non-smooth time series with significant stochasticity and uncertainty. In this paper,
  a complete ensemble empirical mode decomposition with adaptive noise (CEEMDAN) with long short-term
  memory (LSTM) model is developed for predicting annual precipitation in Zhengzhou city, China, which
  is compared with a single LSTM model, an ensemble empirical mode decomposition–LSTM model, a complementary
  ensemble empirical mode decomposition–LSTM model, and a CEEMDAN–autoregressive integrated moving average
  and a CEEMDAN–recurrent neural network model. The results show that the mean absolute percentage error,
  root mean square error, and coefficient of determination of the coupled CEEMDAN–LSTM model are 2.69%,
  17.37 mm, and 0.9863, respectively. The prediction accuracy is significantly higher than that of the
  other five models, indicating that the proposed model has high prediction accuracy and can be used for
  annual precipitation forecasting in Zhengzhou city.
