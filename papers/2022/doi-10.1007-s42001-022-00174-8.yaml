summary: Combines Twitter sentiment with Global Fire Atlas satellite data to predict wildfire attributes,
  treating social media as a human-sensor for wildfire nowcasting.
abstract: Abstract The intensity of wildfires and wildfire season length is increasing due to climate
  change, causing a greater threat to the local population. Much of this population are increasingly adopting
  social media, and sites like Twitter are increasingly being used as a real-time human-sensor network
  during natural disasters; detecting, tracking and documenting events. The human-sensor concept is currently
  largely omitted by wildfire models, representing a potential loss of information. By including Twitter
  data as a source in our models, we aim to help disaster managers make more informed, socially driven
  decisions, by detecting and monitoring online social media sentiment over the course of a wildfire event.
  This paper implements machine learning in a wildfire prediction model, using social media and geophysical
  data sources with Sentiment Analysis to predict wildfire characteristics with high accuracy. We also
  use wildfire-specific attributes to predict online social dynamics, as this has been shown to be indicative
  of localised disaster severity. This may be useful for disaster management teams in identifying areas
  of immediate danger. We combine geophysical satellite data from the Global Fire Atlas with social data
  provided by Twitter. We perform data collection and subsequent analysis & visualisation, and compare
  regional differences in online social sentiment expression. Following this, we compare and contrast
  different machine learning models for predicting wildfire attributes. We demonstrate social media is
  a predictor of wildfire activity, and present models which accurately model wildfire attributes. This
  work develops the concept of the human sensor in the context of wildfires, using users’ Tweets as noisy
  subjective sentimental accounts of current localised conditions. This work contributes to the development
  of more socially conscious wildfire models, by incorporating social media data into wildfire prediction
  and modelling.
