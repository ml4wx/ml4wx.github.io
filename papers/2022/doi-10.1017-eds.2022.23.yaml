summary: ResDeepD, a residual super-resolution CNN, downscales 1° Indian monsoon rainfall to 0.25° and
  outperforms SRCNN, DeepSD and Nest-UNet, including during cyclonic storms.
abstract: Abstract In the twenty-first century, machine learning and deep learning have been successfully
  used to find hidden information from coarse-grained data in various domains. In Computer Vision, scientists
  have used neural networks to identify hidden pixel-level information from low-resolution (LR) image
  data. This approach of estimating high-resolution (HR) information from LR data is called the super-resolution
  (SR) approach. This approach has been borrowed by climate scientists to downscale coarse-level measurements
  of climate variables to obtain their local-scale projections. Climate variables are spatial in nature
  and can be represented as images where each pixel denotes a grid point where the variables can be measured.
  We can apply the deep learning-based SR techniques on such “images” for statistical downscaling of such
  variables. This approach of downscaling can be termed as deep downscaling. In this work, we have tried
  to make HR projection of the Indian summer monsoon rainfall by using a novel deep residual network called
  ResDeepD. The aim is to downscale the 1 0 × 1 0 low LR precipitation data to get the values at 0.25
  0 × 0.25 0 resolution. The proposed model uses a series of skip connections across residual blocks to
  give better results as compared to the existing models like super-resolution convolutional neural network,
  DeepSD, and Nest-UNet that have been used previously for this task. We have also examined the model’s
  performance for downscaling rainfall during some extreme climatic events like cyclonic storms and deep
  depression and found that the model performs better than the existing models.
