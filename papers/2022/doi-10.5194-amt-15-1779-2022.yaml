summary: Neural network retrieves 13 years of IASI temperature profiles trained on ERA5, agreeing within
  0.5 K of radiosondes between 750 and 7 hPa.
abstract: 'The three infrared atmospheric sounding interferometers (IASIs), launched in 2006, 2012, and
  2018, are key instruments to weather forecasting, and most meteorological centres assimilate IASI nadir
  radiance data into atmospheric models to feed their forecasts. The European Organisation for the Exploitation
  of Meteorological Satellites (EUMETSAT) recently released a reprocessed homogeneous radiance record
  for the whole IASI observation period, from which 13 years (2008–2020) of temperature profiles can be
  obtained. In this work, atmospheric temperatures at different altitudes are retrieved from IASI radiances
  measured in the carbon dioxide absorption bands (654–800 and 2250–2400 cm −1 ) by selecting the channels
  that are the most sensitive to the temperature at different altitudes. We rely on an artificial neural
  network (ANN) to retrieve atmospheric temperatures from a selected set of IASI radiances. We trained
  the ANN with IASI radiances as input and the European Centre for Medium-Range Weather Forecasts (ECMWF)
  reanalysis version 5 (ERA5) as output. The retrieved temperatures were validated with ERA5, with in
  situ radiosonde temperatures from the Analysed RadioSoundings Archive (ARSA) network and with EUMETSAT
  temperatures retrieved from IASI radiances using a different method. Between 750 and 7 hPa, where IASI
  is most sensitive to temperature, a good agreement is observed between the three datasets: the differences
  between IASI on one hand and ERA5, ARSA, or EUMETSAT on the other hand are usually less than 0.5 K at
  these altitudes. At 2 hPa, as the IASI sensitivity decreases, we found differences up to 2 K between
  IASI and the three validation datasets. We then computed atmospheric temperature linear trends from
  atmospheric temperatures between 750 and 2 hPa. We found that in the past 13 years, there is a general
  warming trend of the troposphere that is more important at the poles and at mid-latitudes (0.5 K/decade
  at mid-latitudes, 1 K/decade at the North Pole). The stratosphere is globally cooling on average, except
  at the South Pole as a result of the ozone layer recovery and a sudden stratospheric warming in 2019.
  The cooling is most pronounced in the equatorial upper stratosphere (−1 K/decade). This work shows that
  ANN can be a powerful and simple tool to retrieve IASI temperatures at different altitudes in the upper
  troposphere and in the stratosphere, allowing us to construct a homogeneous and consistent temperature
  data record adapted to trend analysis.'
