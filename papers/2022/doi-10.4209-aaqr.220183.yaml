summary: Meta-analysis of machine learning for dust storm detection and prediction, finding SVMs dominate
  satellite detection and SVM/random forests dominate meteorological-data prediction.
abstract: 'Dust storms are natural hazards that affect both people and properties. Therefore, it is important
  to mitigate their risks by implementing an early notification system. Different methods are used to
  predict dust storms, such as observing satellite images, analyzing meteorological data, and using numerical
  weather prediction model forecasts. However, recent studies have shown that machine learning algorithms
  have higher capacities to predict dust storms in less time and with fewer processing operations compared
  to numerical weather models. This paper conducted a meta-analysis review to examine studies that addressed
  the areas associated with the application of machine learning to dust storm prediction. It aims to compare
  the applied models and the types of data used in the literature under study. Given that the location
  of a dust storm event is essential, the properties of dust storms are discussed in relation to the region.
  The output classes and the various performance metrics observed in each reviewed paper are also summarized.
  Subsequently, the present paper offers a detailed analysis highlighting the capabilities of machine
  learning models in predicting dust storms. The analysis shows two main categories: early detection and
  dust storm prediction. Most models used for dust storm early detection from satellite images are support
  vector machines (SVM). In contrast, the most used models for dust storm prediction are SVM and random
  forests that predict the occurrence of dust storms from meteorological data. Finally, the paper highlights
  the challenges and future trends in the field, illustrating the potential directions for applying deep
  learning algorithms and providing long-range predictions with assessments of dust storm duration and
  intensity.'
