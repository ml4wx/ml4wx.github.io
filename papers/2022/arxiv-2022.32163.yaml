summary: Stacked LSTM-CNN ensembles with fully connected or SVM meta-classifiers improve sand-dust storm
  prediction over single LSTM or CNN models in Inner Mongolia.
abstract: Weather forecasting is an important factor affecting production and life. With the development
  of technology, weather forecasting methods such as weather map forecasting, numerical weather forecasting,
  and quantitative forecasting methods have emerged. However, these traditional data analysis methods
  have shortcomings such as incomplete analysis, insufficient objectivity, inability to quantitatively
  predict the weather, and low prediction accuracy. The import of neural networks into the field of weather
  forecasting helps to alleviate the above shortcomings and improve the accuracy of weather forecasting.
  In this paper, the LSTM network and the CNN network are used to predict the sand-dust storm weather.
  In order to improve the prediction performance, we use the Stacking integration algorithm to fuse the
  LSTM and CNN models. To improve the experimental scientific and comprehensive, using fully connected
  network and support vector machine as meta-classifiers, two LSTM-CNN integrated sand-dust storm prediction
  models are established. At last, the above integrated model is used in the prediction of sand-dust storms
  in Inner Mongolia. The experimental results show that compared with a single LSTM or CNN model, the
  Stacking ensemble model has different degrees of improvement in model evaluation indicators such as
  accuracy, precision, recall, and f1-score. The Stacking ensemble model uses the fully connected network
  model as the meta-classifier is even better. These prove that the Stacking ensemble algorithm improves
  the sand-dust storm classification effect and generalization ability of a single neural network to a
  certain extent.
