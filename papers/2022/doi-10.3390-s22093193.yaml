summary: Synthetic driving-simulator images increase CNN weather-condition classification training efficiency
  by up to 74%, addressing dataset bias in vision-based weather recognition.
abstract: Weather prediction from real-world images can be termed a complex task when targeting classification
  using neural networks. Moreover, the number of images throughout the available datasets can contain
  a huge amount of variance when comparing locations with the weather those images are representing. In
  this article, the capabilities of a custom built driver simulator are explored specifically to simulate
  a wide range of weather conditions. Moreover, the performance of a new synthetic dataset generated by
  the above simulator is also assessed. The results indicate that the use of synthetic datasets in conjunction
  with real-world datasets can increase the training efficiency of the CNNs by as much as 74%. The article
  paves a way forward to tackle the persistent problem of bias in vision-based datasets.
