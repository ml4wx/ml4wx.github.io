summary: LSTM weather prediction feeds a clustering and nonlinear sizing model for off-grid hybrid renewable
  systems, giving a 0.1% loss-of-load gain over seasonal naive.
abstract: Lack of electricity in rural communities implies inequality of access to information and opportunities
  among the world’s population. Hybrid renewable energy systems (HRESs) represent a promising solution
  to address this situation given their portability and their potential contribution to avoiding carbon
  emissions. However, the sizing methodologies for these systems deal with some issues, such as the uncertainty
  of renewable resources. In this work, we propose a sizing methodology that includes long short-term
  memory (LSTM) cells to predict weather conditions in the long term, multivariate clustering to generate
  different weather scenarios, and a nonlinear mathematical formulation to find the optimal sizing of
  an HRES. Numerical experiments are performed using open-source data from a rural community in the Pacific
  Coast of Mexico as well as open-source programming frameworks to allow their reproducibility. We achieved
  an improvement of 0.1% in loss of load probability in comparison to the seasonal naive method, which
  is widely used in the literature for this purpose. Furthermore, the RNN training stage takes 118.42,
  2103.35, and 726.71 s for GHI, wind, and temperature, respectively, which are acceptable given the planning
  nature of the problem. These results indicate that the proposed methodology is useful as a decision-making
  tool for this planning problem.
