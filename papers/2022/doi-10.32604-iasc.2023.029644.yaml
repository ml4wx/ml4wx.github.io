summary: GAN with sub-pixel convolution performs 8x super-resolution of ERA5 temperature fields, improving
  RMSE 37% over bicubic interpolation.
abstract: A Generative Adversarial Neural (GAN) network is designed based on deep learning for the Super-Resolution
  (SR) reconstruction task of temperature fields (comparable to downscaling in the meteorological field),
  which is limited by the small number of ground stations and the sparse distribution of observations,
  resulting in a lack of fineness of data. To improve the network’s generalization performance, the residual
  structure, and batch normalization are used. Applying the nearest interpolation method to avoid over-smoothing
  of the climate element values instead of the conventional Bicubic interpolation in the computer vision
  field. Sub-pixel convolution is used instead of transposed convolution or interpolation methods for
  up-sampling to speed up network inference. The experimental dataset is the European Centre for Medium-Range
  Weather Forecasts Reanalysis v5 (ERA5) with a bidirectional resolution of . On the other hand, the task
  aims to scale up the size by a factor of 8, which is rare compared to conventional methods. The comparison
  methods include traditional interpolation methods and a more widely used GAN-based network such as the
  SRGAN. The final experimental results show that the proposed scheme advances the performance of Root
  Mean Square Error (RMSE) by 37.25%, the Peak Signal-to-noise Ratio (PNSR) by 14.4%, and the Structural
  Similarity (SSIM) by 10.3% compared to the Bicubic Interpolation. For the traditional SRGAN network,
  a relatively obvious performance improvement is observed by experimental demonstration. Meanwhile, the
  GAN network can converge stably and reach the approximate Nash equilibrium for various initialization
  parameters to empirically illustrate the effectiveness of the method in the temperature fields.
