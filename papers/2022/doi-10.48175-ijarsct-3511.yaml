summary: Compares regression-style machine learning models on historical station data to predict minimum,
  maximum and average temperature and precipitation for different locations.
abstract: Weather forecasting with traditional technique is mainly done by physical model, still in many
  parts of the world. Though not neglecting the importance of the model there is an alternative method
  where recorded data of past can be used for predicting the future weather data. The predicted data may
  not be exact, but less time consuming and more efficient. Minimum temperature, maximum temperature,
  average temperature, precipitation percentage these are the common parameters and predicting these with
  another less resource-based method with some precision will help us going. Machine learning can be used
  for processing the data based on models like linear regression, functional regression, circular, statistical
  which processes the data and reduces the error. On comparing the result of model based on different
  location one can used a model based on requirement. The result obtained then can be analyzed and further
  improved upon input variables and data size.
