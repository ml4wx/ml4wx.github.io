summary: A hybrid method uses ML regression inside 3DVAR to retrieve fine-scale boundary-layer winds from
  lidar and in-situ data, improving 2-D and 3-D velocity estimates by 42.3% on average.
abstract: To better describe the main features of the complex airflow in the atmospheric boundary layer,
  a hybrid wind field retrieval method based on machine learning (ML) and data assimilation (DA) is proposed.
  Based on the joint measurement of lidar andin situmeasurements, a 3-D variational data assimilation
  (3DVAR) method is used to retrieve the fine-scale wind field. To address the iterative interpolation
  problem in the traditional DA methods, this article isolates the interpolation from the optimization
  and uses the regression methods in ML to estimate the interpolated observations on analysis grids. More
  specifically, the supervised regression and semisupervised regression are, respectively, used for lidar
  andin situobservations according to their heterogeneity. Simulation and field measurement results indicate
  that, compared with the traditional DA methods, the proposed method can better estimate both 2-D and
  3-D velocities, by an improvement of more than 42.3% on average.
