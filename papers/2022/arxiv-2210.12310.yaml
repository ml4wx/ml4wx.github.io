summary: Survey of feature engineering, convolutional, LSTM and attention methods for spatio-temporal
  patterns in meteorological image sequences, illustrated with solar forecasting and convection detection.
abstract: Atmospheric processes involve both space and time. This is why human analysis of atmospheric
  imagery can often extract more information from animated loops of image sequences than from individual
  images. Automating such an analysis requires the ability to identify spatio-temporal patterns in image
  sequences which is a very challenging task, because of the endless possibilities of patterns in both
  space and time. In this paper we review different concepts and techniques that are useful to extract
  spatio-temporal context specifically for meteorological applications. In this survey we first motivate
  the need for these approaches in meteorology using two applications, solar forecasting and detecting
  convection from satellite imagery. Then we provide an overview of many different concepts and techniques
  that are helpful for the interpretation of meteorological image sequences, such as (1) feature engineering
  methods to strengthen the desired signal in the input, using meteorological knowledge, classic image
  processing, harmonic analysis and topological data analysis (2) explain how different convolution filters
  (2D/3D/LSTM-convolution) can be utilized strategically in convolutional neural network architectures
  to find patterns in both space and time (3) discuss the powerful new concept of 'attention' in neural
  networks and the powerful abilities it brings to the interpretation of image sequences (4) briefly survey
  strategies from unsupervised, self-supervised and transfer learning to reduce the need for large labeled
  datasets. We hope that presenting an overview of these tools - many of which are underutilized - will
  help accelerate progress in this area.
