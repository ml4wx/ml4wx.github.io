summary: Convolutional conditional neural processes provide off-grid multisite temperature and precipitation
  downscaling over Europe, beating existing methods and improving extreme precipitation representation.
abstract: A new model is presented for multisite statistical downscaling of temperature and precipitation
  using convolutional conditional neural processes (convCNPs). ConvCNPs are a recently developed class
  of models that allow deep-learning techniques to be applied to off-the-grid spatio-temporal data. In
  contrast to existing methods that map from low-resolution model output to high-resolution predictions
  at a discrete set of locations, this model outputs a stochastic process that can be queried at an arbitrary
  latitude–longitude coordinate. The convCNP model is shown to outperform an ensemble of existing downscaling
  techniques over Europe for both temperature and precipitation taken from the VALUE intercomparison project.
  The model also outperforms an approach that uses Gaussian processes to interpolate single-site downscaling
  models at unseen locations. Importantly, substantial improvement is seen in the representation of extreme
  precipitation events. These results indicate that the convCNP is a robust downscaling model suitable
  for generating localised projections for use in climate impact studies.
