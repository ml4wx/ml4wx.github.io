summary: A backpropagation neural network classifies cloud types from images with a 60.6% success rate
  on 92 training images.
abstract: The clouds have different patterns on each type and each type has different properties. The
  introduction of the type, shape, and nature of the cloud is indispensable in the weather forecasts so
  that the clouds can be classified. There are several methods used in the image classification process
  that is the method of the artificial neural network Backpropagation. The method of Backpropagation is
  one of the methods used for the classification process, in this research Backpropagation used on the
  training and testing process for the introduction of cloud imagery aimed at determining the type of
  cloud, before the second These stages are carried out imagery through the preprocessing process. From
  the training conducted using the Backpropagation method shows that this method generates the best weight
  value and saves that value into the database to do the testing process using a neural network Backpropagation.
  In addition, Backpropagation also has the ability to reduce errors by continuously correcting the weight
  until reaching the maximum target. Data used for training data as many as 92 cloud type image with each
  type of 10 imagery. In this study obtained a system success rate of 60.6%.
