summary: Compares nine machine-learning site-adaptation methods to calibrate the STRÅNG gridded solar
  irradiance product in Sweden using three stations; no single method wins everywhere.
abstract: Gridded global horizontal irradiance (GHI) databases are fundamental for analysing solar energy
  applications' technical and economic aspects, particularly photovoltaic applications. Today, there exist
  numerous gridded GHI databases whose quality has been thoroughly validated against ground-based irradiance
  measurements. Nonetheless, databases that generate data at latitudes above 65$^{\circ}$ are few, and
  those available gridded irradiance products, which are either reanalysis or based on polar orbiters,
  such as ERA5, COSMO-REA6, or CM SAF CLARA-A2, generally have lower quality or a coarser time resolution
  than those gridded irradiance products based on geostationary satellites. Among the high-latitude gridded
  GHI databases, the STRÅNG model developed by the Swedish Meteorological and Hydrological Institute (SMHI)
  is likely the most accurate one, providing data across Sweden. To further enhance the product quality,
  the calibration technique called "site adaptation" is herein used to improve the STRÅNG dataset, which
  seeks to adjust a long period of low-quality gridded irradiance estimates based on a short period of
  high-quality irradiance measurements. This study, differing from the conventional statistical approaches,
  adopts machine learning for site adaptation. Nine machine-learning algorithms have been analysed and
  compared with conventional statistical ones to identify Sweden's most favourable technique for site
  adaptation. Three weather stations of SMHI are used for training and validation. The results show that,
  due to the spatio-temporal heterogeneity in model performance, no universal model can be identified,
  which suggests that site adaptation is a location-dependent procedure.
