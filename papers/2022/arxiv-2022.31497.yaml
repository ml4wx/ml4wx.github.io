summary: Neural networks map Landsat TOA reflectance to horizontal and inclined surface albedo over sloping
  terrain, achieving RMSE of 0.029 for HHSA against in-situ data.
abstract: 'Surface albedo plays a key role in global climate modeling as a factor controlling the energy
  budget. Satellite observations were utilized to estimate surface albedo at global and regional scales
  with good precision over flat areas. However, because topography greatly complicates radiative transfer
  (RT) processes, estimating the albedo of rugged terrain with satellite data remains a challenge. In
  addition, albedo definitions over sloping terrain differ from that for flat areas. They include horizontal/horizontal
  sloped surface albedo (HHSA) and inclined/inclined sloped surface albedo (IISA). Methods for retrieving
  HHSA and IISA in mountains have not been well-explored. Here, we retrieved HHSA and IISA on sloping
  terrain from Landsat 8 using a direct estimation algorithm. We simulated a dataset of Landsat top-of-atmosphere
  (TOA) reflectance and surface albedo with discrete anisotropic radiative transfer (DART) model, for
  variable atmospheric, vegetation, soil, and topography properties. Then, we used artificial neural networks
  (ANNs) to derive an empirical relationship between TOA reflectance and surface albedo. The accuracy
  of our method was verified within situmeasurements: root mean squared error (RMSE) and bias equal to
  0.029 and −0.010 for HHSA, and 0.023 and −0.001 for IISA, respectively. Several albedo results (HHSA,
  IISA, values without topographic consideration) were evaluated and compared. HHSA was found similar
  to albedo without topographic consideration, but IISA, considered as the “true albedo” for sloping terrain,
  showed large difference from them. This study demonstrated the feasibility of surface albedo estimation
  from Landsat TOA reflectance directly in rugged terrains and advanced our understanding of energy budget
  in mountains.'
