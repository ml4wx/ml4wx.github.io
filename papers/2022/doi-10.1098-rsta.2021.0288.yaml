summary: Review argues for bottom-up AI and hybrid physical-statistical drought forecasting, prioritising
  robustness and uncertainty stability over event-based verification.
abstract: Despite major improvements in weather and climate modelling and substantial increases in remotely
  sensed observations, drought prediction remains a major challenge. After a review of the existing methods,
  we discuss major research gaps and opportunities to improve drought prediction. We argue that current
  approaches are top-down, assuming that the process(es) and/or driver(s) are known—i.e. starting with
  a model and then imposing it on the observed events (reality). With the help of an experiment, we show
  that there are opportunities to develop bottom-up drought prediction models—i.e. starting from the reality
  (here, observed events) and searching for model(s) and driver(s) that work. Recent advances in artificial
  intelligence and machine learning provide significant opportunities for developing bottom-up drought
  forecasting models. Regardless of the type of drought forecasting model (e.g. machine learning, dynamical
  simulations, analogue based), we need to shift our attention to robustness of theories and outputs rather
  than event-based verification. A shift in our focus towards quantifying the stability of uncertainty
  in drought prediction models, rather than the goodness of fit or reproducing the past, could be the
  first step towards this goal. Finally, we highlight the advantages of hybrid dynamical and statistical
  models for improving current drought prediction models. This article is part of the Royal Society Science+
  meeting issue ‘Drought risk in the Anthropocene’.
