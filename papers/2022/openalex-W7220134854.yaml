summary: Describes a solar-powered IoT weather station with a machine learning model to predict local
  weather conditions in Mangalpalli; results are not quantified.
abstract: 'Abstract: In the context of actions for small cities, CVR Solar Powered Weather Station has
  been developed to monitor changes in Weather. Users can find out the weather changes in the area and
  can plan their day-to-day activities. In several important productive areas, such as farming, the climate
  plays a crucial role. These days, there is a lot of climate change, which is why it is bothersome that
  old weather forecasts are growing closer and less accurate. Therefore, miles are crucial to embellishing
  and modifying the weather forecast model. To cater the needs of current socio-economic changes, a solar
  powered IoT Based Weather Monitoring System plays a vital role in predicting changes in weather. A Machine
  Learning Model to Predict Weather Conditions in Mangalpalli Area is presented in the article. Index
  Terms: LoRaWAN Gateway, Machine Learning Model, Photosynthetically Available Radiation, Total Solar
  Radiation'
