summary: Deep multi-model ensemble method combining NWP outputs with window attention and a rolling recurrent
  network for the two-dimensional initial-lead time structure, applied to sea level pressure.
abstract: The multi-model ensemble (MME) forecast for meteorological elements has been proved many times
  to be more skillful than the single model. It improves the forecast quality by integrating multiple
  sets of numerical forecast results with different spatial-temporal characteristics. Currently, the main
  numerical forecast results present a grid structure formed by longitude and latitude lines in space
  and a special two-dimensional time structure in time, namely the initial time and the lead time, compared
  with the traditional one-dimensional time. These characteristics mean that many MME methods have limitations
  in further improving forecast quality. Focusing on this problem, we propose a deep MME forecast method
  that suits the special structure. At spatial level, our model uses window self-attention and shifted
  window attention to aggregate information. At temporal level, we propose a recurrent like neural network
  with rolling structure (Roll-RLNN) which is more suitable for two-dimensional time structure that widely
  exists in the institutions of numerical weather prediction (NWP) with running service. In this paper,
  we test the MME forecast for sea level pressure as the forecast characteristics of the essential meteorological
  element vary clearly across institutions, and the results show that our model structure is effective
  and can make significant forecast improvements.
