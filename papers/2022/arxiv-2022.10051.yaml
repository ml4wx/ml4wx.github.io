summary: Reviews neural network methods for weather and climate prediction, comparing their effectiveness
  against numerical weather prediction models and discussing challenges.
abstract: Weather prediction systems today are a function of a multitude of variables, which result in
  complicated and convoluted systems of mathematical simulations and equations. Simulating along the lines
  of these systems requires enormous amounts of computational power and resources at the scale of supercomputers
  and super-scalar and massively parallelised architectures. There has been a recent attempt to avoid
  such costly and often inefficient calculations by making use of artificial neural networks (ANN) to
  predict future weather and climate patterns at large. This paper will explore such methods of varying
  complexity, and review their effectiveness as compared to numerical weather predictions (NWP) models.
