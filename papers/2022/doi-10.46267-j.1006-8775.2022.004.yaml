summary: Predicts annual tropical cyclone frequency for Guangdong from winter precursors using LSTM-FC,
  which achieves lower error than MLR and GPR for 2010–2019.
abstract: Tropical cyclone (TC) annual frequency forecasting is significant for disaster prevention and
  mitigation in Guangdong Province. Based on the NCEP-NCAR reanalysis and NOAA Extended Reconstructed
  global sea surface temperature (SST) V5 data in winter, the TC frequency climatic features and prediction
  models have been studied. During 1951-2019, 353 TCs directly affected Guangdong with an annual average
  of about 5.1. TCs have experienced an abrupt change from abundance to deficiency in the mid to late
  1980 with a slightly decreasing trend and a normal distribution. 338 primary precursors are obtained
  from statistically significant correlation regions of SST, sea level pressure, 1000hPa air temperature,
  850hPa specific humidity, 500hPa geopotential height and zonal wind shear in winter. Then those 338
  primary factors are reduced into 19 independent predictors by principal component analysis (PCA). Furthermore,
  the Multiple Linear Regression (MLR), the Gaussian Process Regression (GPR) and the Long Short-term
  Memory Networks and Fully Connected Layers (LSTM-FC) models are constructed relying on the above 19
  factors. For three different kinds of test sets from 2010 to 2019, 2011 to 2019 and 2010 to 2019, the
  root mean square errors (RMSEs) of MLR, GPR and LSTM-FC between prediction and observations fluctuate
  within the range of 1.05-2.45, 1.00-1.93 and 0.71-0.95 as well as the average absolute errors (AAEs)
  0.88-1.0, 0.75-1.36 and 0.50-0.70, respectively. As for the 2010-2019 experiment, the mean deviations
  of the three model outputs from the observation are 0.89, 0.78 and 0.56, together with the average evaluation
  scores 82.22, 84.44 and 88.89, separately. The prediction skill comparisons unveil that LSTM-FC model
  has a better performance than MLR and GPR. In conclusion, the deep learning model of LSTM-FC may shed
  light on improving the accuracy of short-term climate prediction about TC frequency. The current research
  can provide experience on the development of deep learning in this field and help to achieve further
  progress of TC disaster prevention and mitigation in Guangdong Province.
