summary: A stacked LSTM autoencoder with feature selection gives daily solar radiation prediction intervals
  at six Queensland farms, outperforming tree ensembles and persistence.
abstract: We review the latest modeling techniques and propose new hybrid SAELSTM framework based on Deep
  Learning (DL) to construct prediction intervals for daily Global Solar Radiation (GSR) using the Manta
  Ray Foraging Optimization (MRFO) feature selection to select model parameters. Features are employed
  as potential inputs for Long Short-Term Memory and a seq2seq SAELSTM autoencoder Deep Learning (DL)
  system in the final GSR prediction. Six solar energy farms in Queensland, Australia are considered to
  evaluate the method with predictors from Global Climate Models and ground-based observation. Comparisons
  are carried out among DL models (i.e., Deep Neural Network) and conventional Machine Learning algorithms
  (i.e., Gradient Boosting Regression, Random Forest Regression, Extremely Randomized Trees, and Adaptive
  Boosting Regression). The hyperparameters are deduced with grid search, and simulations demonstrate
  that the DL hybrid SAELSTM model is accurate compared with the other models as well as the persistence
  methods. The SAELSTM model obtains quality solar energy prediction intervals with high coverage probability
  and low interval errors. The review and new modelling results utilising an autoencoder deep learning
  method show that our approach is acceptable to predict solar radiation, and therefore is useful in solar
  energy monitoring systems to capture the stochastic variations in solar power generation due to cloud
  cover, aerosols, ozone changes, and other atmospheric attenuation factors.
