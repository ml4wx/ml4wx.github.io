summary: Deep learning predicts next-day wildfire danger in the Eastern Mediterranean, beating the Fire
  Weather Index, with explainable AI attributing importance to wetness variables.
abstract: Abstract Climate change exacerbates the occurence of extreme droughts and heatwaves, increasing
  the frequency and intensity of large wildfires across the globe. Forecasting wildfire danger and uncovering
  the drivers behind fire events become central for understanding relevant climate‐land surface feedback
  and aiding wildfire management. In this work, we leverage Deep Learning (DL) to predict the next day's
  wildfire danger in a fire‐prone part of the Eastern Mediterranean and explainable Artificial Intelligence
  (xAI) to diagnose model attributions. We implement DL models that capture the temporal and spatio‐temporal
  context, generalize well for extreme wildfires, and demonstrate improved performance over the traditional
  Fire Weather Index. Leveraging xAI, we identify the substantial contribution of wetness‐related variables
  and unveil the temporal focus of the models. The variability of the contribution of the input variables
  across wildfire events hints into different wildfire mechanisms. The presented methodology paves the
  way to more robust, accurate, and trustworthy data‐driven anticipation of wildfires.
