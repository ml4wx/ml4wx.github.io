summary: A knowledge-guided LSTM encoding diel hysteresis and Birch effect outperforms Q10 models and
  CLM in dryland soil respiration (correlation 0.7 vs under 0.4).
abstract: Soil respiration in dryland ecosystems is challenging to model due to its complex interactions
  with environmental drivers. Knowledge-guided deep learning provides a much more effective means of accurately
  representing these complex interactions than traditional Q10-based models. Mutual information analysis
  revealed that future soil temperature shares more information with soil respiration than past soil temperature,
  consistent with their clockwise diel hysteresis. We explicitly encoded diel hysteresis, soil drying,
  and soil rewetting effects on soil respiration dynamics in a newly designed Long Short Term Memory (LSTM)
  model. The model takes both past and future environmental drivers as inputs to predict soil respiration.
  The new LSTM model substantially outperformed three Q10-based models and the Community Land Model when
  reproducing the observed soil respiration dynamics in a semi-arid ecosystem. The new LSTM model clearly
  demonstrated its superiority for temporally extrapolating soil respiration dynamics, such that the resulting
  correlation with observational data is up to 0.7 while the correlations of the Q10-based models and
  the Community Land Model (CLM) are less than 0.4. Our results underscore the high potential for knowledge-guided
  deep learning to replace Q10-based soil respiration modules in Earth system models.
