summary: Statistical trend analysis and SMOreg regression of 1891–2020 Bay of Bengal cyclone records project
  cyclogenesis to 2021; ML role is minor.
abstract: 'Abstract Background Recurrent tropical cyclones of thermal origin in the Bay of Bengal have
  regular damage to the 480km Odisha coasts of the east coast of India. The causes are violent wind, torrential
  rain, and storm surge inundations. The high sea surface temperature (> 270C), relative humidity, wind
  shear, Coriolis force, preexisting disturbances, warm oceanic current, easterly trade wind, and upper
  air cyclonic circulation. Odisha receives a lion’s share of the cyclogenesis of the Bay of Bengal and
  is shattering the coastal inhabitants and the ecosystem. Methodology and Results: The cyclone data of
  India Meteorological Department from 1891 to 2020, post-Holocene, pre-Anthropocene, and golden spike
  periods are analyzed statistically. The categorization, naming, cause of ample cyclogenesis in the Bay
  of Bengal particularly along Odisha coast are discussed in the present study. The geological stratification,
  meteorological players, and coastal features of Odisha coast are discussed. The trend in CD’s, CS, and
  SCS has been studied and prediction of these storms that shall brew and grow over Bay of Bengal fabric
  from 1980 to 2021, (during the golden spike period of the Anthropocene period) by using Linear regression
  and SMOreg soft computing machine learning model has been forecasted. Conclusions The decrease in cyclogenesis
  frequency but increase in amplitude, intensity, and severity is the present trend along with a southerly
  shift of landfall along the east coast. The reason is that the southwest monsoon brings with it high
  wind shear, which hinders cyclone development, and variation in wind layer shear.'
