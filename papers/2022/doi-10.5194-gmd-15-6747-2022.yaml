summary: DeepESD, a CNN multi-model ensemble, downscales eight CMIP5 GCMs to CORDEX EUR-44, matching RCM
  climate change signals with smaller precipitation spread.
abstract: Abstract. Deep Learning (DL) has recently emerged as an innovative tool to downscale climate
  variables from large-scale atmospheric fields under the perfect prognosis (PP) approach. Different Convolutional
  Neural Networks (CNN) have been applied under present-day conditions with promising results, but little
  is known about their suitability for extrapolating future climate change conditions. Here, we analyze
  this problem from a multi-model perspective, developing and evaluating an ensemble of CNN-based downscaled
  projections (DeepESD) for temperature and precipitation over the European EUR-44i (0.5º) domain, based
  on eight GCMs from the Coupled Model Intercomparison Project Phase 5 (CMIP5). To our knowledge, this
  is the first time that CNNs have been used to produce multi-model ensembles of downscaled projections,
  allowing to quantify inter-model uncertainty in climate change signals. The results are compared with
  those corresponding to an EUR-44 ensemble of regional climate models (RCMs) showing that DeepESD reduces
  distributional biases in the historical period. Moreover, the resulting climate change signals are broadly
  comparable to those obtained with the RCMs, with similar spatial structures. As for the uncertainty
  of the climate change signal (measured on the basis of inter-model spread), DeepESD yields a smaller
  uncertainty for precipitation, but a similar uncertainty for temperature. To facilitate further studies
  of this downscaling approach we follow FAIR principles and make publicly available the code (a Jupyter
  notebook) and the DeepESD dataset. In particular, DeepESD is published at the Earth System Grid Federation
  (ESGF), as the first continental-wide PP dataset contributing to CORDEX (EUR-44).
