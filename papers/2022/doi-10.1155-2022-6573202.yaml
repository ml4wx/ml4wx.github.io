summary: Compares MLR and ANN downscaling of ERA5 and MERRA2 winds against South China tall-tower observations;
  ERA5 with ANN gives r=0.69 and RMSE 2.11 m/s.
abstract: Climate reanalysis products have been widely used to overcome the absence of high-quality and
  long-term observational records for wind energy users. In this study, the applicability of two popular
  reanalysis datasets (ERA5 and MERRA2) in estimating wind characteristics for four tall tower observatories
  (TTOs) in South China was assessed. For each TTO, linear and nonlinear downscaling techniques, namely,
  multiple linear regression (MLR) and an artificial neural network (ANN), respectively, were adopted
  for the downscaling of the scalar wind speed and the corresponding U/V components. The downscaled wind
  speed and U/V components were subsequently compared with the TTO observations by correlation coefficient
  (Pearson’s r), the root mean square error (RMSE), the uncertainty analysis (U95), and the reliability
  analysis (RE). According to the results, ERA5 had a better applicability (higher Pearson’s r and RE,
  but lower RMSE and U95) in estimating TTO wind speed than MERRA2 when using both the MLR and ANN downscaling
  method. The average Pearson’s r, RE, RMSE, and U95 of the downscaled wind from ERA5 by the MLR (ANN)
  method were 0.66 (0.69), 40.8% (41.8%), 2.20 m/s (2.11 m/s), 0.181 m/s (0.179 m/s), respectively, and
  0.60 (0.63), 38.0% (39.7%), 2.32 m/s (2.25 m/s), 0.189 m/s (0.187 m/s), respectively, for MERRA2. The
  wind components analysis showed that the better performance of ERA5 was attributed to its smaller error
  in estimating V component than MERRA2. For the wind direction, the two reanalysis datasets did not display
  distinct differences. Additionally, the misalignment of the wind direction between the reanalysis products
  and the TTOs was higher for the secondary predominant wind direction (SPWD) than for the predominant
  wind direction (PWD). Furthermore, we found that the reanalysis U wind had a higher RMSE but a lower
  RE and Pearson’s r than the V wind, which indicates that the misalignment in the wind direction was
  mainly associated with the deviation in the U component.
