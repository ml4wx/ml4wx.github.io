summary: Replaces the forward model in variational data assimilation with a differentiable learned emulator,
  speeding geopotential height DA by four orders of magnitude.
abstract: Abstract. Data assimilation (DA) in the geophysical sciences remains the cornerstone of robust
  forecasts from numerical models. Indeed, DA plays a crucial role in the quality of numerical weather
  prediction, and is a crucial building block that has allowed dramatic improvements in weather forecasting
  over the past few decades. DA is commonly framed in a variational setting, where one solves an optimization
  problem within a Bayesian formulation using raw model forecasts as a prior, and observations as likelihood.
  This leads to a DA objective function that needs to be minimized, where the decision variables are the
  initial conditions specified to the model. In traditional DA, the forward model is numerically and computationally
  expensive. Here we replace the forward model with a low-dimensional, data-driven, and differentiable
  emulator. Consequently, gradients of our DA objective function with respect to the decision variables
  are obtained rapidly via automatic differentiation. We demonstrate our approach by performing an emulator-assisted
  DA forecast of geopotential height. Our results indicate that emulator-assisted DA is faster than traditional
  equation-based DA forecasts by four orders of magnitude, allowing computations to be performed on a
  workstation rather than a dedicated high-performance computer. In addition, we describe accuracy benefits
  of emulator-assisted DA when compared to simply using the emulator for forecasting (i.e., without DA).
  Our overall formulation is denoted AIAEDA (Artificial Intelligence Emulator Assisted Data Assimilation).
