summary: Neural networks reconstruct daily and monthly 780 m Greenland Ice Sheet air temperature from
  MODIS land surface temperature, reaching R of 0.96 against automatic weather stations.
abstract: High spatial and temporal resolution products of near-surface air temperature (T2m) over the
  Greenland Ice Sheet (GrIS) are required as baseline information in a variety of research disciplines.
  Due to the sparse network of in situ data on the GrIS, remote sensing data and machine learning methods
  provide great advantages, due to their capacity and accessibility. The Land Surface Temperature (LST)
  at 780 m resolution from the Moderate Resolution Imaging Spectroradiometer (MODIS) and T2m observation
  from 25 Automatic Weather Stations (AWSs) are used to establish a relationship over the GrIS by comparing
  multiple machine learning approaches. Four machine learning methods—neural network (NN), gaussian process
  regression (GPR), support vector machine (SVM), and random forest (RF)—are used to reconstruct the T2m
  at daily and monthly scales. We develop a reliable T2m reconstruction model based on key meteorological
  parameters, such as albedo, wind speed, and specific humidity. The reconstructions daily and monthly
  products are generated on a 780 m × 780 m spatial grid spanning from 2007 to 2019. When compared with
  in situ observations, the NN method presents the highest accuracy, with R of 0.96, RMSE of 2.67 °C,
  and BIAS of −0.36 °C. Similar to the regional climate model (RACMO2.3p2), the reconstructed T2m can
  better reflect the spatial pattern in term of latitude, longitude, and altitude effects.
