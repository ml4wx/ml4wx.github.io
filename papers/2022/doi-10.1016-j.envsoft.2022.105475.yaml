summary: Neural network regression extends the global PDSI drought index from GLDAS data, achieving RMSE
  below 1 over 99.5% of the globe and providing an updated dataset.
abstract: The Palmer Drought Severity Index (PDSI) ranges from −10 to 10 and is used for monitoring drought
  extent and severity. PDSI is a monthly global gridded data set with partial global coverage from 1850
  through 1947 and full global coverage from 1948 through 2018. PDSI updates are infrequent. We present
  a method to extend PDSI using Global Land Data Assimilation System (GLDAS) data. We provide an updated
  dataset and code for the method. We discuss the accuracy and bias of the method for various regions.
  We have high accuracy, with 99.5% of the globe exhibiting RMSE values less than 1. Globally our method
  is unbiased with an average ME of approximately 0. Some regions have slight biases with dryer and wetter
  regions showing a slight negative and positive biases, respectively. Prediction errors exhibits spatial
  trends with the highest errors in areas with extreme climate.
