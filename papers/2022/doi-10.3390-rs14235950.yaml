summary: LSTM forecasts Himawari-8 brightness temperatures and random forest converts them into 10-minute
  rainfall estimates over Indonesia, with RMSE of 1.54 mm per 3 h.
abstract: 'Increasing the accuracy of rainfall forecasts is crucial as an effort to prevent hydrometeorological
  disasters. Weather changes that can occur suddenly and in a local scope make fast and precise weather
  forecasts increasingly difficult to inform. Additionally, the results of the numerical weather model
  used by the Indonesia Agency for Meteorology, Climatology, and Geophysics are only able to predict the
  rainfall with a temporal resolution of 1–3 h and cannot yet address the need for rainfall information
  with high spatial and temporal resolution. Therefore, this study aims to provide the rainfall forecast
  in high spatiotemporal resolution using Himawari-8 and GPM IMERG (Global Precipitation Measurement:
  The Integrated Multi-satellite Retrievals) data. The multivariate LSTM (long short-term memory) forecasting
  is employed to predict the cloud brightness temperature by using the selected Himawari-8 bands as the
  input and training data. For the rain rate regression, we used the random forest technique to identify
  the rainfall and non-rainfall pixels from GPM IMERG data as the input in advance. The results of the
  rainfall forecast showed low values of mean error and root mean square error of 0.71 and 1.54 mm/3 h,
  respectively, compared to the observation data, indicating that the proposed study may help meteorological
  stations provide the weather information for aviation purposes.'
