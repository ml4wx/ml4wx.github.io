summary: A ResNet extracts 500 m sea-surface wind fields from Sentinel-1 SAR over Venice, with 16° direction
  RMS against in-situ data and finer structure than ECMWF.
abstract: 'The spatial characteristics at mesoscale$\gamma $of the strongest sea surface winds blowing
  on the Adriatic Sea and Venice Lagoon, Italy, have been investigated through 500 m$\times500$m wind
  fields extracted, without external information, from the C-band Sentinel-1 synthetic aperture radar
  (SAR) images interferometric wide (IW) swath ground range detected high resolution (GRDH) level 1 (L1)
  by a deep learning method based on a residual neural network (ResNet). The derived SAR wind directions
  have been used to retrieve the wind speed using theC_SARMOD2geophysical model function (GMF). The resulting
  wind fields have been compared with European Centre for Medium-range Weather Forecasts (ECMWF) andin
  situdata: the wind direction bias$|\beta _\theta |\le 1 {\textstyle ^\circ }$indicates a very good agreement
  and the value of RMS difference againstin situwinds of$16 {\textstyle ^\circ }$results smaller than
  those reported in the literature; the wind speed bias$\beta _{w}=-1.5\,\, {\textstyle \text {ms}^{-1}}$with
  respect toin situdata indicates an underestimation of SAR speed. However, the innovation brought by
  ResNet results is evident in the study of the spatial structure of the wind fields, showing unprecedented
  details. The spatial gradients of wind direction and speed obtained ($\approx 6 {\textstyle ^\circ }/\text
  {km}$and$0.5\,\, {\textstyle \text {ms}^{-1}}/\text {km}$, respectively) are well consistent with those
  derived from previous experimental campaigns. The maps of the atmospheric wind stress curl derived from
  the ResNet wind fields exhibit the presence of contiguous cells with positive and negative values roughly
  elongated in the wind direction, not reproducible with such profusion of details by any other existing
  datasets. ResNet wind fields provide exhaustive coverage of the Venice lagoon, allowing to study their
  spatial structure: under northeasterly winds, the wind speed increases on average from northern to southern
  lagoon by 30% in agreement with a case study reported in the literature. Local differences of ResNet
  wind direction with respect to ECMWF ($\pm 30 {\textstyle ^\circ }$maximum) generate local differences
  of wind speed as large as$\pm 2\,\, {\textstyle \text {ms}^{-1}}$.'
