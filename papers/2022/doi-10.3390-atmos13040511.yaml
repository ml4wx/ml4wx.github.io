summary: Proposes a reference-based, gradient-guided deep network for daily precipitation downscaling
  from GPM and ERA5 with topography, outperforming baseline super-resolution methods.
abstract: The spatial resolution of precipitation predicted by general circulation models is too coarse
  to meet current research and operational needs. Downscaling is one way to provide finer resolution data
  at local scales. The single-image super-resolution method in the computer vision field has made great
  strides lately and has been applied in various fields. In this article, we propose a novel reference-based
  and gradient-guided deep learning model (RBGGM) to downscale daily precipitation considering the discontinuity
  of precipitation and ill-posed nature of downscaling. Global Precipitation Measurement Mission (GPM)
  precipitation data, variables in ERA5 re-analysis data, and topographic data are selected to perform
  the downscaling, and a residual dense attention block is constructed to extract features of them. By
  exploring the discontinuous feature of precipitation, we introduce gradient feature to reconstruct precipitation
  distribution. We also extract the feature of high-resolution monthly precipitation as a reference feature
  to resolve the ill-posed nature of downscaling. Extensive experimental results on benchmark data sets
  demonstrate that our proposed model performs better than other baseline methods. Furthermore, we construct
  a daily precipitation downscaling data set based on GPM precipitation data, ERA5 re-analysis data and
  topographic data.
