summary: LSTM and CNN models using GNSS radio occultation profiles forecast regional wind fields over
  Beijing-Tianjin-Hebei, with about 1.4 m/s speed error and 1 s inference.
abstract: With the development of computer technology and expanding environmental issues, machine learning
  has received more and more attention in the field of weather forecasting. Global Navigation Satellite
  System-Radio Occultation(GNSS-RO) technology is a kind of remote sensing technology. This investigation
  proposes an alternative to numerical weather forecasting model. The new method is based on machine learning
  utilizing GNSS-RO data to forecast the wind field in the Beijing-Tianjin-Hebei region of China. The
  dataset including temperature, humidity, pressure, wind speed and direction was obtained by numerical
  calculation in terms of historical monitoring data in Beijing-Tianjin-Hebei region. Then the models
  of wind fields forecasting based on machine learning were established with different neural network
  including Long Short-Term Memory (LSTM), Convolutional Neural Network (CNN) and Deep Neural Networks
  (DNN). The prediction performance of different models was analyzed. The results demonstrate that LSTM
  and CNN have better performance on predicting the wind field than Deep Neural Networks. The wind speed
  error is about 1.4m/s, and the wind direction error is about 30°. Moreover, the time required for neural
  network to predict a new sample is about 1 second, which is only 0.2% of the prediction time compared
  with numerical model. Finally, the machine learning model can be used to predict the wind field effectively,
  with GNSS-RO data as the input in application. This paper pro-vides a new method in sight to use machine
  learning to forecast the regional wind field utilizing GNSS-RO data.
