summary: Hybrid BA-KNEA post-processing of GEFSv12 forecasts improves 1–3 day solar radiation forecasts
  in Xinjiang, with RMSE 3.2–3.7 MJ m-2 d-1.
abstract: Accurate forecasting of solar radiation (Rs) is significant to photovoltaic power generation
  and agricultural management. The National Centers for Environmental Prediction (NECP) has released its
  latest Global Ensemble Forecast System version 12 (GEFSv12) prediction product; however, the capability
  of this numerical weather product for Rs forecasting has not been evaluated. This study intends to establish
  a coupling algorithm based on a bat algorithm (BA) and Kernel-based nonlinear extension of Arps decline
  (KNEA) for post-processing 1–3 d ahead Rs forecasting based on the GEFSv12 in Xinjiang of China. The
  new model also compares two empirical statistical methods, which were quantile mapping (QM) and Equiratio
  cumulative distribution function matching (EDCDFm), and compares six machine-learning methods, e.g.,
  long-short term memory (LSTM), support vector machine (SVM), XGBoost, KNEA, BA-SVM, BA-XGBoost. The
  results show that the accuracy of forecasting Rs from all of the models decreases with the extension
  of the forecast period. Compared with the GEFS raw Rs data over the four stations, the RMSE and MAE
  of QM and EDCDFm models decreased by 20% and 15%, respectively. In addition, the BA-KNEA model was superior
  to the GEFSv12 raw Rs data and other post-processing methods, with R2 = 0.782–0.829, RMSE = 3.240–3.685
  MJ m−2 d−1, MAE = 2.465–2.799 MJ m−2 d−1, and NRMSE = 0.152–0.173.
