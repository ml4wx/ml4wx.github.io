summary: Systematic PRISMA review of 110 studies on statistical, NWP and ML short-term rainfall forecasting,
  highlighting hybrid models for nowcasting.
abstract: Abstract Rainfall forecasting is a high-priority research problem due to the complex interplay
  of multiple factors. Despite extensive studies, a systematic quantitative review of recent developments
  in rainfall forecasting is lacking in the literature. This study conducted a systematic quantitative
  review of statistical, numerical weather prediction (NWP) and machine learning (ML) techniques for rainfall
  forecasting. The review adopted the preferred reporting items for systematic reviews and meta-analyses
  (PRISMA) technique for screening keywords and abstracts, leading to 110 qualified papers from multiple
  databases. The impact of rainfall threshold, meteorological parameters, topography, algorithm techniques,
  geographic location, the horizontal resolution of the model, and lead time on rainfall forecast was
  examined. The review shows the importance of precipitable water vapor (PWV) along with other meteorological
  parameters for accurate nowcasting in coastal and mountainous regions. An increase in rainfall forecast
  uncertainty with an increase in the lead time makes the NWP model less popular for the short-term forecast.
  The pre-processing techniques increased the accuracy of ML techniques by considering extreme values
  and detecting the irregularly distributed multi-scale features of rainfall in space and time. Future
  research can focus on hybrid models with improved accuracy for nowcasting. The output from the hybrid
  model serves as input for the decision support system required for urban flood risk management.
