summary: A deep autoencoder detects anomalous heavy precipitation events in Japan and attributes their
  increase since 1977 partly to anthropogenic forcing, with more expected this century.
abstract: Abstract The frequency of large‐scale anomalous precipitation events associated with heavy precipitation
  has been increasing in Japan. However, it is unclear if the increase is due to anthropogenic warming
  or internal variability. Also, it is challenging to develop an objective methodology to identify anomalous
  events because of the large variety of anomalous precipitation cases. In this study, we applied a deep
  learning technique to objectively detect anomalous precipitation events in Japan for both observations
  and simulations using high‐resolution climate models. The results show that the observed increases in
  anomalous heavy precipitation events in Western Japan during 1977–2015 were not made only by internal
  variability but the increases in anthropogenic forcing played an important role. Such events will continue
  to increase in frequency this century. The increases are attributable to the increasing frequency of
  tropical cyclones and enhanced frontal rainbands near Japan. These results highlight the mitigation
  challenge posed by the increasing occurrence of unprecedented precipitation events in the future.
