summary: Random forest and ANN post-processing of four NMME models gives better monthly and seasonal precipitation
  forecasts over Southwest Asia than individual models.
abstract: Southwest Asia has different climate types including arid, semiarid, Mediterranean, and temperate
  regions. Due to the complex interactions among components of the Earth system, forecasting precipitation
  is a difficult task in such large regions. The aim of this paper is to propose a learning approach,
  based on artificial neural network (ANN) and random forest (RF) algorithms for post-processing the output
  of forecasting models, in order to provide a multi-model ensemble forecasting of monthly precipitation
  in southwest Asia. For this purpose, four forecasting models, including GEM-NEMO, NASA-GEOSS2S, CanCM4i,
  and COLA-RSMAS-CCSM4, included in the North American multi-model ensemble (NMME) project, are considered
  for the ensemble algorithms. Since each model has nine different lead times, a total of 108 different
  ANN and RF models are trained for each month of the year. To train the proposed ANN an RF models, the
  ERA5 reanalysis dataset is employed. To compare the performance of the proposed algorithms, four performance
  evaluation criteria are calculated for each model. The results indicate that the performance of the
  ANN and RF post-processing is better than that of the individual NMME models. Moreover, RF outperformed
  ANN for all lead times and months of the year.
