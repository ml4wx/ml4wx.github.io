summary: Compares GEV models with GLM or neural network spatial interpolation of extreme Mediterranean
  precipitation parameters, with the ANN hidden-unit complexity key to performance.
abstract: 'Extreme precipitation events can lead to disastrous floods, which are the most significant
  natural hazards in the Mediterranean regions. Therefore, a proper characterization of these events is
  crucial. Extreme events defined as annual maxima can be modeled with the generalized extreme value (GEV)
  distribution. Owing to spatial heterogeneity, the distribution of extremes is non-stationary in space.
  To take non-stationarity into account, the parameters of the GEV distribution can be viewed as functions
  of covariates that convey spatial information. Such functions may be implemented as a generalized linear
  model (GLM) or with a more flexible non-parametric non-linear model such as an artificial neural network
  (ANN). In this work, we evaluate several statistical models that combine the GEV distribution with a
  GLM or with an ANN for a spatial interpolation of the GEV parameters. Key issues are the proper selection
  of the complexity level of the ANN (i.e., the number of hidden units) and the proper selection of spatial
  covariates. Three sites are included in our study: a region in the French Mediterranean, the Cap Bon
  area in northeast Tunisia, and the Merguellil catchment in central Tunisia. The comparative analysis
  aim at assessing the genericity of state-of-the-art approaches to interpolate the distribution of extreme
  precipitation events.'
