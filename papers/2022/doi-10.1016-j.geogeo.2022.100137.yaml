summary: Feedforward networks refine global VMF1 zenith tropospheric delay over Nigeria using local GNSS
  stations, lowering external RMSE to 0.03–0.04 m.
abstract: Recent studies on the application of Zenith Tropospheric Delay (ZTD) in meteorology and geodesy
  have shown improved accuracy with the use of locally estimated ZTD compared to Global ZTD. This paper
  focuses on the refinement of global gridded ray-traced Vienna Mapping Functions 1 (VMF1) ZTD over Nigeria,
  using ZTD estimates derived from local GNSS Continuously Operating Reference Stations (CORS) observations.
  Three (3) years of GNSS observations collected at 13 CORS located within the study area were post-processed
  using GNSS Analysis and Processing Software (GAPS) to derive the local GNSS-ZTD estimates. The global
  VMF1-ZTD were interpolated at the locations of the local GNSS-CORS. An optimal deep structured supervised
  Neural Network (NN) was derived by training feedforward networks using the Levenberg-Marquardt backpropagation
  algorithm, with spatiotemporal variables and VMF1-ZTD as inputs and the GNSS-ZTD as the target. The
  outputs from the NN model were assessed using internal and external data. Results from internal data
  evaluations indicated a robust and accurate model output with optimum network performances indicating
  MSE of ∼7.22 × 10−6 m and ∼4.56 × 10−4 m for hydrostatic and wet ZTD networks respectively. The external
  data evaluations performed using the International GNSS Services (IGS) Zenith Path Delay (ZPD), indicated
  an RMSE range of ∼0.041 m to 0.095 m for global-VMF1 and ∼0.030 m to 0.037 m for the Local Refine (LR)-VMF1.
  The results suggest that the application of ZTD estimates derived from local GNSS observations in the
  refinement of global gridded VMF1-ZTD yields an improved accuracy over Nigeria. Consequently, the LR-VMF1
  ZTD estimates are recommended for improved accuracy, required for geodetic and meteorological applications
  in and around Nigeria
