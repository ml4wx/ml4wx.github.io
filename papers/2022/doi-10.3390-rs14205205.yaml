summary: TITP-Net spatio-temporal CNN forecasts typhoon intensity at 18-48 h, improving MAE by 5-7% over
  deep learning and official dynamical forecasts.
abstract: Typhoons can cause massive casualties and economic damage, and accurately predicting typhoon
  intensity has always been a hot topic both in theory and practice. In consideration with the spatial
  and temporal complexity of typhoons, machine learning methods have recently been applied in typhoon
  forecasting. In this paper, we attempt to improve typhoon intensity forecasting by treating it as a
  spatio-temporal problem in the deep learning field. In particular, we propose a novel typhoon intensity
  forecasting model named the Typhoon Intensity Spatio-temporal Prediction Network (TITP-Net). The proposed
  model takes multidimensional environmental variables and physical factors of typhoons into account and
  fully extracts the information from the datasets by capturing spatio-temporal dependencies with a spatial
  attention module, which includes two-dimensional and three-dimensional convolutional operations. A series
  of experiments with a comprehensive framework by using TITP-Net are conducted. The MAEs of the forecasts
  with 18, 24, 36 and 48 h lead time obtain a significant improvement by 7.02%, 6.53%, 6.25% and 5.37%
  compared with some existing deep learning models and dynamical models from official agencies.
