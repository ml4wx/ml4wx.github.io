summary: Survey of AI methods for ENSO forecasting, reviewing deep learning approaches since Ham et al.
  (2019) and comparing them with traditional statistical and dynamical forecasts.
abstract: Climate disasters such as floods and droughts often bring heavy losses to human life, national
  economy, and public safety. El Niño/Southern Oscillation (ENSO) is one of the most important inter-annual
  climate signals in the tropics and has a global impact on atmospheric circulation and precipitation.
  To address the impact of climate change, accurate ENSO forecasts can help prevent related climate disasters.
  Traditional prediction methods mainly include statistical methods and dynamic methods. However, due
  to the variability and diversity of the temporal and spatial evolution of ENSO, traditional methods
  still have great uncertainty in predicting ENSO. In recent years, with the rapid development of artificial
  intelligence technology, it has gradually penetrated into all aspects of people’s lives, and the climate
  field has also benefited. For example, deep learning methods in artificial intelligence can automatically
  learn and train from a large amount of sample data, obtain excellent feature representation, and effectively
  improve the performance of various learning tasks. It is widely used in computer vision, natural language
  processing, and other fields. In 2019, Ham et al. used a convolutional neural network (CNN) model in
  ENSO forecasting 18 months in advance, and the winter ENSO forecasting skill could reach 0.64, far exceeding
  the dynamic model with a forecasting skill of 0.5. The research results were regarded as the pioneering
  work of deep learning in the field of weather forecasting. This paper introduces the traditional ENSO
  forecasting methods and focuses on summarizing the various latest artificial intelligence methods and
  their forecasting effects for ENSO forecasting, so as to provide useful reference for future research
  by researchers.
