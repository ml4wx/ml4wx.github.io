abstract: This paper demonstrates the importance of Data Science techniques within the Natural Sciences
  sector, more specifically, within the area of climate research such as global warming and hurricane
  development. During times of a continued increase in global temperatures, it more important than ever
  to further improve today's forecasting and prediction methods. Two possible Data Science approaches
  are being demonstrated and proveen to add value to the traditional statistics based forecasting methods.
