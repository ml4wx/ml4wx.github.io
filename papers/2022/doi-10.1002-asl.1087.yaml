summary: Toy experiments show neural networks and SVR downscaling temperature extrapolate poorly outside
  calibration range, unlike multiple linear regression.
abstract: Abstract Machine learning is a growing field of research with many applications. It provides
  a series of techniques able to solve complex nonlinear problems, and that has promoted their application
  for statistical downscaling. Intercomparison exercises with other classical methods have so far shown
  promising results. Nevertheless, many evaluation studies of statistical downscaling methods neglect
  the analysis of their extrapolation capability. In this study, we aim to make a wakeup call to the community
  about the potential risks of using machine learning for statistical downscaling of climate change projections.
  We present a set of three toy experiments, applying three commonly used machine learning algorithms,
  two different implementations of artificial neural networks and a support vector machine, to downscale
  daily maximum temperature, and comparing them with the classical multiple linear regression. We have
  tested the four methods in and out of their calibration range, and have found how the three machine
  learning techniques can perform poorly under extrapolation. Additionally, we have analysed the impact
  of this extrapolation issue depending on the degree of overlapping between the training and testing
  datasets, and we have found very different sensitivities for each method and specific implementation.
