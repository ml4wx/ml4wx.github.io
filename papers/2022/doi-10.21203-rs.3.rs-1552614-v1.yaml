summary: Random forest post-processing of CFSv2 precipitation forecasts over Iran, with correlation above
  0.87, packaged as a decision support system.
abstract: Abstract Although many meteorological prediction models have been developed recently, but their
  predictions are still unreliable. Post-processing is a task for improving meteorological predictions.
  This study proposes a post-processing method for the Climate Forecast System Version2 (CFSV2) model.
  The applicability of the proposed method is shown in Iran for an observation data from 1982 to 2017.
  A software has been implemented which could be used to automatically perform post-processing in meteorological
  organizations. With application of the present study, Decision Support System (DSS) is implemented for
  controlling precipitation based natural side effects such as flood disaster or drought phenomenon. Likewise,
  it is worth noting that the mentioned DSS meets Sustainable Development Goals (SDGs) through grantee
  of human health and environmental protection issues. Finally, the most important section of DSS is related
  to prediction and in the present study it is performed by Random Forest algorithm with more than 0.87
  correlation coefficient.
