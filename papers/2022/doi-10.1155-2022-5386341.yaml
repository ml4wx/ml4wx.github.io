summary: An LSTM-based health monitoring framework for CINRAD-SA weather radar flags early faults from
  deviations between predicted and measured monitoring parameters, reducing false alarms.
abstract: The health management of weather radar plays a key role in achieving timely and accurate weather
  forecasting. The current practice mainly exploits a fixed threshold prespecified for some monitoring
  parameters for fault detection. This causes abundant false alarms due to the evolving working environments,
  increasing complexity of the modern weather radar, and the ignorance of the dependencies among monitoring
  parameters. To address the above issues, we propose a deep learning-based health monitoring framework
  for weather radar. First, we develop a two-stage approach for problem formulation that address issues
  of fault scarcity and abundant false fault alarms in processing the databases of monitoring data, fault
  alarm record, and maintenance records. The temporal evolution of weather radar under healthy conditions
  is represented by a long short-term memory network (LSTM) model. As such, any anomaly can be identified
  according to the deviation between the LSTM-based prediction and the actual measurement. Then, construct
  a health indicator based on the portion of the occurrence of deviation beyond a user-specified threshold
  within a time window. The proposed framework is demonstrated by a real case study for the Chinese S-band
  weather radar (CINRAD-SA). The results validate the effectiveness of the proposed framework in providing
  early fault warnings.
