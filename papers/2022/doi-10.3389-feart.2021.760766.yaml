summary: Residual-network daily deterministic and probabilistic models for sub-seasonal high temperature
  in eastern China improve on European hindcasts by 8–50% in error metrics.
abstract: 'The high temperature forecast of the sub-season is a severe challenge. Currently, the residual
  structure has achieved good results in the field of computer vision attributed to the excellent feature
  extraction ability. However, it has not been introduced in the domain of sub-seasonal forecasting. Here,
  we develop multi-module daily deterministic and probabilistic forecast models by the residual structure
  and finally establish a complete set of sub-seasonal high temperature forecasting system in the eastern
  part of China. The experimental results indicate that our method is effective and outperforms the European
  hindcast results in all aspects: absolute error, anomaly correlation coefficient, and other indicators
  are optimized by 8–50%, and the equitable threat score is improved by up to 400%. We conclude that the
  residual network has a sharper insight into the high temperature in sub-seasonal high temperature forecasting
  compared to traditional methods and convolutional networks, thus enabling more effective early warnings
  of extreme high temperature weather.'
