summary: Explainable ML with Shapley values on satellite and reanalysis data shows liquid water path rises
  nonlinearly with droplet number, with sensitivity dependent on precipitation and SST.
abstract: 'Changes in marine boundary layer cloud (MBLC) radiative properties in response to aerosol perturbations
  are largely responsible for uncertainties in future climate predictions. In particular, the relationship
  between the cloud droplet number concentration (Nd, a proxy for aerosol) and the cloud liquid water
  path (LWP) remains challenging to quantify from observations. In this study, satellite observations
  from multiple polar-orbiting platforms for 2006–2011 are used in combination with atmospheric reanalysis
  data in a regional machine learning model to predict changes in LWP in MBLCs in the Southeast Atlantic.
  The impact of predictor variables on the model output is analysed using Shapley values as a technique
  of explainable machine learning. Within the machine learning model, precipitation fraction, cloud top
  height, and Nd are identified as important cloud state predictors for LWP, with dynamical proxies and
  sea surface temperature (SST) being the most important environmental predictors. A positive nonlinear
  relationship between LWP and Nd is found, with a weaker sensitivity at high cloud droplet concentrations.
  This relationship is found to be dependent on other predictors in the model: Nd–LWP sensitivity is higher
  in precipitating clouds and decreases with increasing SSTs.'
