summary: Scalable sensitivity bounds with uncertainty-aware deep models for continuous-treatment causal
  effects, applied to how human emissions affect cloud properties in 15 years of satellite data.
abstract: Estimating the effects of continuous-valued interventions from observational data is a critically
  important task for climate science, healthcare, and economics. Recent work focuses on designing neural
  network architectures and regularization functions to allow for scalable estimation of average and individual-level
  dose-response curves from high-dimensional, large-sample data. Such methodologies assume ignorability
  (observation of all confounding variables) and positivity (observation of all treatment levels for every
  covariate value describing a set of units), assumptions problematic in the continuous treatment regime.
  Scalable sensitivity and uncertainty analyses to understand the ignorance induced in causal estimates
  when these assumptions are relaxed are less studied. Here, we develop a continuous treatment-effect
  marginal sensitivity model (CMSM) and derive bounds that agree with the observed data and a researcher-defined
  level of hidden confounding. We introduce a scalable algorithm and uncertainty-aware deep models to
  derive and estimate these bounds for high-dimensional, large-sample observational data. We work in concert
  with climate scientists interested in the climatological impacts of human emissions on cloud properties
  using satellite observations from the past 15 years. This problem is known to be complicated by many
  unobserved confounders.
