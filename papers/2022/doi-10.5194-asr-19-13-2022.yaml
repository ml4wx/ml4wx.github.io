summary: Builds the first open 10 m building height map of Ireland from Sentinel-1/2 features; CNN is
  most accurate, but ridge regression is chosen for realism and low cost.
abstract: ECOCLIMAP-Second Generation (ECO-SG) is the land-cover map used in the HARMONIE-AROME configuration
  of the shared ALADIN-HIRLAM Numerical Weather Prediction system used for short-range operational weather
  forecasting for Ireland. The ECO-SG urban classification implicitly includes building heights. The work
  presented in this paper involved the production of the first open-access building height map for the
  island of Ireland which complements the Ulmas-Walsh land cover map, a map which has improved the horizontal
  extent of urban areas over Ireland. The resulting building height map will potentially enable upgrades
  to ECO-SG urban information for future implementation in HARMONIE-AROME. This study not only produced
  the first open-access building height map of Ireland at 10 m × 10 m resolution, but assessed various
  types of regression models trained using pre-existing building height information for Dublin City and
  selected 64 important spatio-temporal features, engineered from both the Sentinel-1A/B and Sentinel-2A/B
  satellites. The performance metrics revealed that a Convolutional Neural Network is superior in all
  aspects except the computational time required to create the map. Despite the superior accuracy of the
  Convolutional Neural Network, the final building height map created results from the ridge regression
  model which provided the best blend of realistic output and low computational complexity. The method
  relies solely on freely available satellite imagery, is cost-effective, can be updated regularly, and
  can be applied to other regions depending on the availability of representative regional building height
  sample data.
