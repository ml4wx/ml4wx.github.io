summary: ANFIS models forecast typhoon rainfall at a Tamsui station up to three hours ahead and are packaged
  in a mobile app, with best RMSE of 7.9 mm.
abstract: 'Machine learning methods such as Adaptive Network‐Based Fuzzy Inference System (ANFIS) have
  been widely employed in intelligent urban storm water disaster warning for the purpose of smart city.
  However, there exists lack of research proposed for applying ANFIS and mobile application (App) to reach
  the purpose of smart city. In order to accomplish the goal, the study integrates ANFIS and Qt Framework
  to develop a Typhoon Rainfall Forecasting System to real‐time typhoon rainfall forecast via a mobile
  device. The Service is first built by applying cluster analysis to typhoon data (Tamsui Weather Station
  of Taiwan) during June 1967 and November 2020 to classify the data into four groups and then applying
  the ANFIS to construct the Service with data in each group. The fuzzy rule of ANFIS is established by
  grid partition method. Both the Service and App employ Qt Framework as the cross‐operating development
  tool, and the App is transformed to a smart mobile device App of different platforms. The simulated
  results show the following: (1) Taking the example of typhoon Nakri in group 1, the lowest root mean
  square error (7.898 mm) and the lowest computation time (178 sec) were obtained for training with 1000
  steps and three membership functions. (2) Using the optimal parameters of the typhoon belonging to that
  group can obtain better prediction results. The developed typhoon rainfall forecasting system App in
  the supplementary information demonstrates that the user can use the smart mobile device for real‐time
  typhoon forecasting at the most three hours ahead easily.'
