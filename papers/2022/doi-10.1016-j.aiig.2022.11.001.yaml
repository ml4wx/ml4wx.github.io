summary: ResGraphNet, a GraphSAGE model with residual links, predicts HadCRUT5 global monthly mean temperature
  more accurately than 11 baselines across seven datasets.
abstract: Data-driven prediction of time series is significant in many scientific research fields such
  as global climate change and weather forecast. For global monthly mean temperature series, considering
  the strong potential of deep neural network for extracting data features, this paper proposes a data-driven
  model, ResGraphNet, which improves the prediction accuracy of time series by an embedded residual module
  in GraphSAGE layers. The experimental results of a global mean temperature dataset, HadCRUT5, show that
  compared with 11 traditional prediction technologies, the proposed ResGraphNet obtains the best accuracy.
  The error indicator predicted by the proposed ResGraphNet is smaller than that of the other 11 prediction
  models. Furthermore, the performance on seven temperature datasets shows the excellent generalization
  of the ResGraphNet. Finally, based on our proposed ResGraphNet, the predicted 2022 annual anomaly of
  global temperature is 0.74722 °C, which provides confidence for limiting warming to 1.5 °C above pre-industrial
  levels.
