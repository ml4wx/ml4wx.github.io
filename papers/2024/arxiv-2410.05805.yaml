summary: An unsupervised DDPM post-processing method removes blurriness from precipitation nowcasts without
  paired training data, tested on seven radar datasets.
abstract: Precipitation nowcasting plays a pivotal role in socioeconomic sectors, especially in severe
  convective weather warnings. Although notable progress has been achieved by approaches mining the spatiotemporal
  correlations with deep learning, these methods still suffer severe blurriness as the lead time increases,
  which hampers accurate predictions for extreme precipitation. To alleviate blurriness, researchers explore
  generative methods conditioned on blurry predictions. However, the pairs of blurry predictions and corresponding
  ground truth need to be generated in advance, making the training pipeline cumbersome and limiting the
  generality of generative models within blur modes that appear in training data. By rethinking the blurriness
  in precipitation nowcasting as a blur kernel acting on predictions, we propose an unsupervised postprocessing
  method to eliminate the blurriness without the requirement of training with the pairs of blurry predictions
  and corresponding ground truth. Specifically, we utilize blurry predictions to guide the generation
  process of a pre-trained unconditional denoising diffusion probabilistic model (DDPM) to obtain high-fidelity
  predictions with eliminated blurriness. A zero-shot blur kernel estimation mechanism and an auto-scale
  denoise guidance strategy are introduced to adapt the unconditional DDPM to any blurriness modes varying
  from datasets and lead times in precipitation nowcasting. Extensive experiments are conducted on 7 precipitation
  radar datasets, demonstrating the generality and superiority of our method.
