summary: A residual CNN analysis step matches the best tuned ensemble Kalman filter on Lorenz 96 using
  a single forecast state, identifying unstable-subspace perturbations without an ensemble.
abstract: We investigate the ability to discover data assimilation (DA) schemes meant for chaotic dynamics
  with deep learning. The focus is on learning the analysis step of sequential DA, from state trajectories
  and their observations, using a simple residual convolutional neural network, while assuming the dynamics
  to be known. Experiments are performed with the Lorenz 96 dynamics, which display spatiotemporal chaos
  and for which solid benchmarks for DA performance exist. The accuracy of the states obtained from the
  learned analysis approaches that of the best possibly tuned ensemble Kalman filter, and is far better
  than that of variational DA alternatives. Critically, this can be achieved while propagating even just
  a single state in the forecast step. We investigate the reason for achieving ensemble filtering accuracy
  without an ensemble. We diagnose that the analysis scheme actually identifies key dynamical perturbations,
  mildly aligned with the unstable subspace, from the forecast state alone, without any ensemble-based
  covariances representation. This reveals that the analysis scheme has learned some multiplicative ergodic
  theorem associated to the DA process seen as a non-autonomous random dynamical system.
