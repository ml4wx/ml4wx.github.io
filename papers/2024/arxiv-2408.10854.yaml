summary: MambaDS applies a selective state-space model with a topography constraint layer to downscale
  near-surface meteorological fields over China and CONUS, reporting state-of-the-art results.
abstract: In an era of frequent extreme weather and global warming, obtaining precise, fine-grained near-surface
  weather forecasts is increasingly essential for human activities. Downscaling (DS), a crucial task in
  meteorological forecasting and remote sensing, enables the reconstruction of high-resolution meteorological
  states for target regions from global-scale forecast results. Previous downscaling methods, inspired
  by convolutional neural network (CNN) and Transformer-based super-resolution (SR) models, lacked tailored
  designs for meteorology and encountered structural limitations. Notably, they failed to efficiently
  integrate topography, a crucial prior to the downscaling process. In this article, we address these
  limitations by pioneering the selective state-space model (SSM) into the meteorological field downscaling
  and propose a novel model called MambaDS. This model retains the advantages of Mamba in long-range dependency
  modeling and linear computational complexity while enhancing the learning ability of multivariate correlation.
  In addition, by designing an efficient topography constraint layer, this prior information can be used
  more efficiently than ever before. Through extensive experiments in both China mainland and the continental
  United States (CONUS), we validated that our proposed MambaDS achieves state-of-the-art (SOTA) results
  in three different types of meteorological field downscaling settings.
