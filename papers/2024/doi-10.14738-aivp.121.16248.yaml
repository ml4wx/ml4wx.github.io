summary: A U-Net revises RMAPS-ST precipitation forecasts, raising CSI scores by about 30% on summer 2022
  cases.
abstract: Using the U-Net algorithm idea in the field of artificial intelligence, a deep learning framework
  is designed and the loss function is redefined. This learning framework revised the precipitation forecast
  results of RMAPS-ST after training on two summer samples. Approved the revised precipitation forecast
  for June-July 2022 and precipitation on August 18, 2022, The test results show that the revised forecast
  level is significantly improved, especially for magnitude greater than 0.1mm/3 hours, and the CSI score
  is increased by an average of 30% compared with before revision.
