summary: Crowdsourced citizen weather station data are used with government station forecasts to predict
  urban temperatures for heatwave and urban heat planning.
abstract: 'The growing impact of climate change, including extreme weather events, represents a significant
  challenge for humanity. With most of the world''s population living in urban areas, the urban heat island
  effect and anthropogenic heat contribute to elevated city temperatures. This increase in urban warming
  threatens human health and demands a deeper understanding of thermal distribution in urban environments.
  Collecting accessible and widespread temperature data in urban areas is essential to address this challenge.
  This study aims to develop a methodology for anticipating temperature distribution in urban environments,
  leveraging Citizen Weather Stations (CWS) as valuable crowdsourcing data sources. The ultimate goal
  is to create a predictive model that estimates urban temperatures based on government meteorological
  station forecasts, improving urban planning, regulating temperature-based routes, preventing health
  issues in vulnerable populations, and enhancing urban livability. The methodology is divided into three
  fundamental stages: data acquisition through CWS with citizen collaboration, the development and evaluation
  of optimal forecast models based on government weather stations (SWS) data, and its exploitation in
  terms of utility and applicability. This methodology encompasses data collection and filtering to ensure
  its usefulness and implement reliable models. The resulting tool facilitates informed decision-making
  and precise seasonal event planning in urban environments, effectively addressing the challenges of
  climate extrapolation and contributing to more effective adaptation and mitigation strategies in climate
  change and heatwaves. The results obtained probe the feasibility of using CWS to predict temperatures
  in urban environments, which has been demonstrated accurately. This is a significant achievement, as
  CWS has proven to be a reliable source of climate data for this context. Also, the filtering process
  described and applied to the case study has proven effective, discarding approximately 34.87% of the
  data. This is achieved by detecting and eliminating anomalies, considering station availability, and
  adhering to specific quality criteria. Finally, the developed prediction model has demonstrated its
  ability to optimally estimate urban temperatures, utilizing climate prediction data provided by government
  weather stations (SWS). The model performance indicators support this claim. For the linear regression
  model, a Mean Squared Error (MSE) of 2.177 and an R-squared (R2) of 0.960 are obtained, while for the
  neural network, an MSE of 1.284 and an R2 of 0.976 are achieved.'
