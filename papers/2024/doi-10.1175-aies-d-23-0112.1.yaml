summary: A convolutional normalizing-flow model post-processes NWP and coastal measurements for 1–6 h
  offshore wind forecasts, cutting RMSE by 40% versus raw NWP.
abstract: Abstract The safe and efficient execution of offshore operations requires short-term (1–6 h
  ahead) high-quality probabilistic forecasts of metocean variables. The development areas for offshore
  wind projects, potentially in high depths, make it difficult to gather measurement data. This paper
  explores the use of deep learning for wind speed forecasting at an unobserved offshore location. The
  proposed convolutional architecture jointly exploits coastal measurements and numerical weather predictions
  to emulate multivariate probabilistic short-term forecasts. We explore both Gaussian and non-Gaussian
  neural representations using normalizing flows. We benchmark these approaches with respect to state-of-the-art
  data-driven schemes, including analog methods and quantile forecasting. The performance of the models
  and resulting forecast quality are analyzed in terms of probabilistic calibration, probabilistic and
  deterministic metrics, and as a function of weather situations. We report numerical experiments for
  a real case study off the French Mediterranean coast. Our results highlight the role of regional numerical
  weather prediction and coastal in situ measurement in the performance of postprocessing. For single-valued
  forecasts, a 40% decrease in RMSE is observed compared to the direct use of numerical weather predictions.
  Significant skill improvements are also obtained for the probabilistic forecasts, in terms of various
  scores, as well as an acceptable probabilistic calibration. The proposed architecture can process a
  large amount of heterogeneous input data and offers a versatile probabilistic framework for multivariate
  forecasting.
