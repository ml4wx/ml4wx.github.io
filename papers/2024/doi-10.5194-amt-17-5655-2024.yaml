summary: Autoencoder plus regression retrieves marine cloud base height from MODIS properties using ceilometer
  labels, yielding a global year-long cloud base dataset with 379 m MAE.
abstract: 'Abstract. Clouds are a crucial regulator in the Earth''s energy budget through their radiative
  properties, both at the top-of-the-atmosphere and at the surface, hence determining key factors like
  their vertical extent is of essential interest. While the cloud top height is commonly retrieved by
  satellites, the cloud base height is difficult to estimate from satellite remote sensing data. Here
  we present a novel method leveraging spatially resolved cloud properties from the MODIS instrument to
  retrieve the cloud base height over marine areas. A machine learning model is built with two components
  to facilitate the cloud base height retrieval: the first component is an autoencoder designed to learn
  a representation of the data cubes of cloud properties and reduce their dimensionality. The second component
  is developed for predicting the cloud base using ground-based ceilometer observations from the lower
  dimensional encodings generated by the aforementioned autoencoder. The method is then evaluated based
  on a collection of co-located surface ceilometer observations and retrievals from the CALIOP satellite
  lidar. The statistical model performs well on both datasets, exhibiting accurate predictions in particular
  for lower cloud bases and a narrow distribution of the absolute error, namely 379 m and 328 m for the
  mean absolute error and the standard deviation of the absolute error respectively for cloud bases in
  the test set. Furthermore, cloud base height predictions are generated for an entire year over ocean,
  and global mean aggregates are also presented, providing insights about global cloud base height distribution
  and offering a valuable dataset for extensive studies requiring global cloud base height retrievals.
  The global cloud base height dataset and the presented models are available from Zenodo (Lenhardt et
  al., 2024).'
