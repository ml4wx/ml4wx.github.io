summary: ResNet-50 classifies discrete direct normal irradiance levels from low-cost sky camera images,
  reaching 85.78% accuracy as a cheaper alternative to pyranometers.
abstract: This study advances the field of solar irradiance nowcasting by introducing a discrete-level
  classification approach, diverging from traditional continuous measurement methods. Grounded in a need
  for cost-effective and modular solutions, the research employs high-resolution computer vision coupled
  with a deep learning framework to predict Direct Normal Irradiance (DNI). By harnessing the capabilities
  of a Logitech C900 1080p HD camera and an NVIDIA Jetson module, the study achieves real-time data processing,
  pivotal for CSP systems' operational efficiency. The core of the methodology is the ResNet-50 convolutional
  neural network, refined via transfer learning on a bespoke dataset, culminating in a predictive accuracy
  of 85.78%. This discrete classification model contrasts with conventional, costly instruments like the
  MS-57, offering a novel and accessible alternative for DNI estimation. Such innovation not only demonstrates
  high predictive accuracy but also signifies a shift towards less resource-intensive and more adaptable
  solar energy forecasting tools, contributing a significant leap towards optimizing renewable energy
  systems.
