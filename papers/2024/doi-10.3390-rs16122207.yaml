summary: Random forest model forecasts daily typhoon rainfall at 133 Chinese stations; western Pacific
  subtropical high indices rank high in feature importance, with r about 0.73.
abstract: In this study, a tropical cyclone or typhoon rainfall forecast model based on Random Forest
  is developed to forecast the daily rainfall at 133 weather stations in China. The input factors to the
  model training process include rainfall observations during 1960–2018, typhoon information (position
  and intensity), station information (position and altitude), and properties of the western Pacific subtropical
  high. Model evaluation shows that besides the distance between a station and cyclone, the subtropical
  high properties are ranked very high in the model’s feature importance, especially the subtropical ridgeline,
  and intensity. These aspects of the subtropical high influence the location and timing of typhoon landfall.
  The forecast model has a correlation coefficient of about 0.73, an Index of Agreement of nearly 0.8,
  and a mean bias of 1.28 mm based on the training dataset. Biases are consistently low, with both positive
  and negative signs, for target stations in the outer rainband (up to 1000 km, beyond which the model
  does not forecast) of typhoons. The range of biases is much larger for target stations in the inner-core
  (0–200 km) region. In this region, the model mostly overestimates (underestimates) the small (large)
  rain rates. Cases study of Typhoon Doksuri and Talim in 2023, as independent cases, shows the high performance
  of the model in forecasting the peak rain rates and timing of their occurrence of the two impactful
  typhoons.
