summary: Hybrid autoencoder models predict European city air temperature up to four weeks ahead, beating
  persistence and climatology benchmarks including during heatwaves.
abstract: 'This paper proposes two hybrid approaches based on Autoencoders (AEs) for long-term temperature
  prediction. The first algorithm comprises an AE trained to learn temperature patterns, which is then
  linked to a second AE, used to detect possible anomalies and provide a final temperature prediction.
  The second proposed approach involves training an AE and then using the resulting latent space as input
  of a neural network, which will provide the final prediction output. Both approaches are tested in long-term
  air temperature prediction in European cities: seven European locations where major heat waves occurred
  have been considered. The long-term temperature prediction for the entire year of the heatwave events
  has been analysed. Results show that the proposed approaches can obtain accurate long-term (up to 4
  weeks) temperature prediction, improving Persistence and Climatology in the benchmark models compared.
  In heatwave periods, where the persistence of the temperature is extremely high, our approach beat the
  persistence operator in three locations and works similarly in the rest of the cases, showing the potential
  of this AE-based method for long-term temperature prediction.'
