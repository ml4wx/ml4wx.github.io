summary: Diffusion model generates probabilistic LES-consistent wind inflow ensembles for turbines from
  10-minute observations, with streamwise correlations of 0.20 to 0.85.
abstract: To validate the second-by-second dynamics of turbines in field experiments, it is necessary
  to accurately reconstruct the winds going into the turbine. Current time-resolved inflow reconstruction
  techniques estimate wind behavior in unobserved regions using relatively simple spectral-based models
  of the atmosphere. Here, we develop a technique for time-resolved inflow reconstruction that is rooted
  in a large-eddy simulation model of the atmosphere. Our "large-eddy reconstruction" technique blends
  observations and atmospheric model information through a diffusion model machine learning algorithm,
  allowing us to generate probabilistic ensembles of reconstructions for a single 10-min observational
  period. Our generated inflows can be used directly by aeroelastic codes or as inflow boundary conditions
  in a large-eddy simulation. We verify the second-by-second reconstruction capability of our technique
  in three synthetic field campaigns, finding positive Pearson correlation coefficient values (0.20>r>0.85)
  between ground-truth and reconstructed streamwise velocity, as well as smaller positive correlation
  coefficient values for unobserved fields (spanwise velocity, vertical velocity, and temperature). We
  validate our technique in three real-world case studies by driving large-eddy simulations with reconstructed
  inflows and comparing to independent inflow measurements. The reconstructions are visually similar to
  measurements, follow desired power spectra properties, and track second-by-second behavior (0.25 > r
  > 0.75).
