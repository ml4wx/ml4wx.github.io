summary: A CNN with a custom kernel detects atmospheric gravity waves in noisy satellite images without
  noise removal, reaching over 94% test accuracy.
abstract: Atmospheric gravity waves occur in the Earths atmosphere caused by an interplay between gravity
  and buoyancy forces. These waves have profound impacts on various aspects of the atmosphere, including
  the patterns of precipitation, cloud formation, ozone distribution, aerosols, and pollutant dispersion.
  Therefore, understanding gravity waves is essential to comprehend and monitor changes in a wide range
  of atmospheric behaviors. Limited studies have been conducted to identify gravity waves from satellite
  data using machine learning techniques. Particularly, without applying noise removal techniques, it
  remains an underexplored area of research. This study presents a novel kernel design aimed at identifying
  gravity waves within satellite images. The proposed kernel is seamlessly integrated into a deep convolutional
  neural network, denoted as gWaveNet. Our proposed model exhibits impressive proficiency in detecting
  images containing gravity waves from noisy satellite data without any feature engineering. The empirical
  results show our model outperforms related approaches by achieving over 98% training accuracy and over
  94% test accuracy which is known to be the best result for gravity waves detection up to the time of
  this work. We open sourced our code at https://rb.gy/qn68ku.
