summary: CNN+LSTM, CNN+PatchTST and CNN+Transformer predict typhoon tracks; CNN+LSTM reaches R² 0.991
  on 2021–2022 data, with coastal data improving accuracy.
abstract: The accuracy in predicting the typhoon track can be key to minimizing their frequent disastrous
  effects. This article aims to study the accuracy of typhoon trajectory prediction obtained by combining
  several algorithms based on current deep-learning techniques. The combination of a Convolutional Neural
  Network with Long Short-Term Memory (CNN+LSTM), Patch Time-Series Transformer (CNN+PatchTST) and Transformer
  (CNN+Transformer) were the models chosen for this work. These algorithms were tested on the best typhoon
  track data from the China Meteorological Administration (CMA), ERA5 data from the European Centre for
  Medium-Range Weather Forecasts (ECMWF), and structured meteorological data from the Zhuhai Meteorological
  Bureau (ZMB) as an extension of existing studies that were based only on public data sources. The experimental
  results were obtained by testing two complete years of data (2021 and 2022), as an alternative to the
  frequent selection of a small number of typhoons in several years. Using the R-squared metric, results
  were obtained as significant as CNN+LSTM (0.991), CNN+PatchTST (0.989) and CNN+Transformer (0.969).
  CNN+LSTM without ZMB data can only obtain 0.987, i.e., 0.004 less than 0.991. Overall, our findings
  indicate that appropriately augmenting data near land and ocean boundaries around the coast improves
  typhoon track prediction.
