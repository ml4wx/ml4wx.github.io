summary: Multi-view stacking of tree, KNN and LSTM models predicts monthly rainfall in Rabat, cutting
  RMSE to 17.5 mm versus 40.8 mm for the best single model.
abstract: 'This research paper explores the implementation of machine learning (ML) techniques in weather
  and climate forecasting, with a specific focus on predicting monthly precipitation. The study analyzes
  the efficacy of six multivariate machine learning models: Decision Tree, Random Forest, K-Nearest Neighbors
  (KNN), AdaBoost, XGBoost, and Long Short-Term Memory (LSTM). Multivariate time series models incorporating
  lagged meteorological variables were employed to capture the dynamics of monthly rainfall in Rabat,
  Morocco, from 1993 to 2018. The models were evaluated based on various metrics, including root mean
  square error (RMSE), mean absolute error (MAE), and coefficient of determination (R2). XGBoost showed
  the highest performance among the six individual models, with an RMSE of 40.8 (mm). In contrast, Decision
  Tree, AdaBoost, Random Forest, LSTM, and KNN showed relatively lower performances, with specific RMSEs
  ranging from 47.5 (mm) to 51 (mm). A novel multi-view stacking learning approach is introduced, offering
  a new perspective on various ML strategies. This integrated algorithm is designed to leverage the strengths
  of each individual model, aiming to substantially improve the precision of precipitation forecasts.
  The best results were achieved by combining Decision Tree, KNN, and LSTM to build the meta-base while
  using XGBoost as the second-level learner. This approach yielded a RMSE of 17.5 millimeters. The results
  show the potential of the proposed multi-view stacking learning algorithm to refine predictive results
  and improve the accuracy of monthly precipitation forecasts, setting a benchmark for future research
  in this field.'
