summary: OMG-HD forecasts directly from station, radar and satellite observations without data assimilation,
  beating IFS-HRES and HRRR up to 12 h over CONUS, with up to 17% RMSE gains.
abstract: In recent years, Artificial Intelligence Weather Prediction (AIWP) models have achieved performance
  comparable to, or even surpassing, traditional Numerical Weather Prediction (NWP) models by leveraging
  reanalysis data. However, a less-explored approach involves training AIWP models directly on observational
  data, enhancing computational efficiency and improving forecast accuracy by reducing the uncertainties
  introduced through data assimilation processes. In this study, we propose OMG-HD, a novel AI-based regional
  high-resolution weather forecasting model designed to make predictions directly from observational data
  sources, including surface stations, radar, and satellite, thereby removing the need for operational
  data assimilation. Our evaluation shows that OMG-HD outperforms both the European Centre for Medium-Range
  Weather Forecasts (ECMWF)'s high-resolution operational forecasting system, IFS-HRES, and the High-Resolution
  Rapid Refresh (HRRR) model at lead times of up to 12 hours across the contiguous United States (CONUS)
  region. We achieve up to a 13% improvement on RMSE for 2-meter temperature, 17% on 10-meter wind speed,
  48% on 2-meter specific humidity, and 32% on surface pressure compared to HRRR. Our method shows that
  it is possible to use AI-driven approaches for rapid weather predictions without relying on NWP-derived
  weather fields as model input. This is a promising step towards using observational data directly to
  make operational forecasts with AIWP models.
