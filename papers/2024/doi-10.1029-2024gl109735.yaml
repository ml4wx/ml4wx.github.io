summary: XGBoost predicts low-cloud fraction more accurately than CAM5, CAM6 and ERA5, with explainable
  analysis showing moisture importance and better stratocumulus-to-cumulus transition.
abstract: Abstract In this study, we evaluated the performance of machine learning (ML) models (XGBoost)
  in predicting low‐cloud fraction (LCF), compared to two generations of the community atmospheric model
  (CAM5 and CAM6) and ERA5 reanalysis data, each having a different cloud scheme. ML models show a substantial
  enhancement in predicting LCF regarding root mean squared errors and correlation coefficients. The good
  performance is consistent across the full spectrums of atmospheric stability and large‐scale vertical
  velocity. Employing an explainable ML approach, we revealed the importance of including the amount of
  available moisture in ML models for representing spatiotemporal variations in LCF in the midlatitudes.
  Also, ML models demonstrated marked improvement in capturing the LCF variations during the stratocumulus‐to‐cumulus
  transition (SCT). This study suggests ML models' great potential to address the longstanding issues
  of “too few” low clouds and “too rapid” SCT in global climate models.
