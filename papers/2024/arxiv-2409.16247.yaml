summary: DLESyM, a deep learning Earth system model, simulates 1000-year observed climate without drift,
  matching CMIP6 variability at a fraction of the cost.
abstract: A key challenge for computationally intensive state-of-the-art Earth System models is to distinguish
  global warming signals from interannual variability. Here we introduce DLESyM, a parsimonious deep learning
  model that accurately simulates the Earth's current climate over 1000-year periods with no smoothing
  or drift. DLESyM simulations equal or exceed key metrics of seasonal and interannual variability--such
  as tropical cyclogenesis over the range of observed intensities, the cycle of the Indian Summer monsoon,
  and the climatology of mid-latitude blocking events--when compared to historical simulations from four
  leading models from the 6th Climate Model Intercomparison Project. DLESyM, trained on both historical
  reanalysis data and satellite observations, is an accurate, highly efficient model of the coupled Earth
  system, empowering long-range sub-seasonal and seasonal forecasts while using a fraction of the energy
  and computational time required by traditional models.
