summary: A hybrid SPEEDY atmosphere model with ML-predicted SST and ocean heat content forecasts El Nino
  for 3-7 months and equatorial precipitation skill for about 15 days.
abstract: 'This paper explores the potential of a hybrid modeling approach that combines machine learning
  (ML) with conventional physics-based modeling for weather prediction beyond the medium range. It extends
  the work of Arcomano et al. (2022), which tested the approach for short- and medium-range weather prediction,
  and the work of Arcomano et al. (2023), which investigated its potential for climate modeling. The hybrid
  model used for the forecast experiments of the paper is based on the low-resolution, simplified parameterization
  atmospheric general circulation model SPEEDY. In addition to the hybridized prognostic variables of
  SPEEDY, the model has three purely ML-based prognostic variables: the 6h cumulative precipitation, the
  sea surface temperature, and the heat content of the top 300m deep layer of the ocean (a new addition
  compared to the model used in Arcomano et al., 2023). The model has skill in predicting the El Nino
  cycle and its global teleconnections with precipitation for 3-7 months depending on the season. The
  model captures equatorial variability of the precipitation associated with Kelvin and Rossby waves and
  MJO. Predictions of the precipitation in the equatorial region have skill for 15 days in the East Pacific
  and 11.5 days in the West Pacific. Though the model has low spatial resolution, for these tasks it has
  prediction skill comparable to what has been published for high-resolution, purely physics-based, conventional,
  operational forecast models.'
