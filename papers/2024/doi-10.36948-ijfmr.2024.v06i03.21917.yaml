summary: Uses LSTM networks to forecast solar irradiance and wind speed for renewable energy production,
  evaluated with MAE, RMSE and R2 metrics.
abstract: This research paper focuses on Forecasting Renewable Energy Production, particularly solar and
  wind power, plays a crucial role in transitioning towards sustainable energy sources. Accurate forecasting
  of renewable energy production is essential for efficient integration into the power grid. In this paper,
  we propose an AI-based approach leveraging weather prediction models to forecast renewable energy production.
  Specifically, we employ deep learning techniques, including Long Short-Term Memory (LSTM) networks,
  to predict solar irradiance and wind speed, which are key factors influencing renewable energy generation.
  We evaluate the performance of our proposed framework using various quality metrics, including mean
  absolute error (MAE), root mean square error (RMSE), normalized metrics (nMAE, nRMSE), and coefficient
  of determination (R2).
