summary: A model-knowledge-guided deep learning model using ERA5 and infrared imagery forecasts Northwest
  Pacific tropical cyclone intensity 24 h ahead with 3.56 m/s error, beating official forecasts by 4-22%.
abstract: Abstract This paper developed a deep learning (DL) model for forecasting tropical cyclone (TC)
  intensity in the Northwest Pacific. A dataset containing 20 533 synchronized and collocated samples
  was assembled, which included ERA5 reanalysis data as well as satellite infrared (IR) imagery, covering
  the period from 1979 to 2021. The u -, v - and w -components of wind, sea surface temperature, IR satellite
  imagery, and historical TC information were selected as the model inputs. Then, a TC-intensity-forecast-fusion
  (TCIF-fusion) model was developed, in which two special branches were designed to learn multi-factor
  information to forecast 24 h TC intensity. Finally, heatmaps capturing the model’s insights are generated
  and applied to the original input data, creating an enhanced input set that results in more accurate
  forecasting. Employing this refined input, the heatmaps (model knowledge) were used to guide TCIF-fusion
  model modeling, and the model-knowledge-guided TCIF-fusion model achieved a 24 h forecast error of 3.56
  m s −1 for Northwest Pacific TCs spanning 2020–2021. The results show that the performance of our method
  is significantly better than the official subjective prediction and advanced DL methods in forecasting
  TC intensity by 4% to 22%. Additionally, compared to operational approaches, model-guided knowledge
  methods can better forecast the intensity of landfalling TCs.
