summary: Transformer ENSO-PhyNet embeds heat-budget processes in self-attention, reaching Niño3.4 skill
  up to 22-month lead with attention maps showing physically consistent drivers.
abstract: While deep learning models have shown promising capabilities in ENSO prediction, their inherent
  black-box nature often leads to a lack of physical consistency and interpretability. Here, we introduce
  ENSO-PhyNet, a Transformer-based model for ENSO prediction, which incorporates heat budget dynamical
  processes through self-attention computations. The model predicts sea surface temperature (SST) in the
  equatorial Pacific and achieves skillful predictions of the Niño 3.4 index with a lead time of up to
  22 months. The self-attention maps reveal how the model makes predictions by focusing on specific processes
  in certain regions. Case analyses of recent El Niño and La Niña events underscore the impact of thermocline
  feedback and zonal advection feedback on the warming of the 2015 event, as well as the crucial role
  of anomalous easterlies in the emergence of the second-year La Niña in 2021. These findings demonstrate
  the model’s interpretability and its ability to identify signals that are physically consistent with
  the development of ENSO events.
