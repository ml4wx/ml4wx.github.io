summary: Aurora is a large Earth-system foundation model trained on over a million hours of data that
  beats operational systems for air quality, waves, cyclone tracks and high-resolution weather.
abstract: Reliable forecasts of the Earth system are crucial for human progress and safety from natural
  disasters. Artificial intelligence offers substantial potential to improve prediction accuracy and computational
  efficiency in this field, however this remains underexplored in many domains. Here we introduce Aurora,
  a large-scale foundation model for the Earth system trained on over a million hours of diverse data.
  Aurora outperforms operational forecasts for air quality, ocean waves, tropical cyclone tracks, and
  high-resolution weather forecasting at orders of magnitude smaller computational expense than dedicated
  existing systems. With the ability to fine-tune Aurora to diverse application domains at only modest
  computational cost, Aurora represents significant progress in making actionable Earth system predictions
  accessible to anyone.
