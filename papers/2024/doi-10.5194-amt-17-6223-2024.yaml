summary: Neural network retrieves Arctic water vapour and temperature profiles from combined MOSAiC microwave
  radiometers, improving accuracy over single-instrument retrievals.
abstract: Abstract. In the central Arctic, high quality water vapour observations are sparse due to the
  low density of meteorological stations and uncertainties in satellite remote sensing. Different reanalyses
  also disagree on the amount of water vapour in the central Arctic. The Multidisciplinary drifting Observatory
  for the Study of the Arctic Climate (MOSAiC) expedition provides comprehensive observations that are
  suitable for evaluating satellite products and reanalyses. Radiosonde observations provide high quality
  water vapour estimates with a high vertical but a low temporal resolution. Observations from the microwave
  radiometers (MWRs) onboard the research vessel Polarstern complement these observations through high
  temporal resolution. In this study, we demonstrate the high accuracy of the combination of the two MWRs
  HATPRO (Humidity and Temperature Profiler) and MiRAC-P (Microwave Radiometer for Arctic Clouds – Passive).
  For this purpose, we developed new retrievals of integrated water vapour (IWV) and profiles of specific
  humidity and temperature using a Neural Network approach, including observations from both HATPRO and
  MiRAC-P to utilize their different water vapour sensitivity. The retrievals were trained with ERA5 data
  from the European Centre for Medium-Range Weather Forecasts (ECMWF) and synthetic MWR observations simulated
  with the Passive and Active Microwave radiative TRAnsfer tool (PAMTRA). We applied the retrievals on
  the synthetic and real observations and evaluated them with ERA5 and radiosondes launched during MOSAiC,
  respectively. To assess the benefit of the combination of HATPRO and MiRAC-P compared to single MWR
  retrievals, we compared the errors with respect to MOSAiC radiosondes and computed the vertical information
  content of the specific humidity profiles. The root mean squared error (RMSE) of IWV was reduced by
  up to 15 %. Specific humidity biases and RMSE were reduced by up to 75 and 50 %, respectively. The vertical
  information content of specific humidity could be increased from 1.7 to 2.4 degrees of freedom. We also
  computed relative humidity from the retrieved temperature and specific humidity profiles and found that
  RMSE was reduced from 45 to 15 %. Finally, we show a case study demonstrating the enhanced humidity
  profiling capabilities compared to the standard HATPRO based retrievals. The vertical resolution of
  the retrieved specific humidity profiles is still low compared to radiosondes but the case study revealed
  the potential to resolve major humidity inversions. To which degree the MWR combination detects humidity
  inversions, also compared to satellites and reanalyses, will be part of future work.
