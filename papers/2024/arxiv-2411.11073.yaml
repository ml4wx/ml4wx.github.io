summary: Neural and distributional-regression post-processing of 8-member WRF solar irradiance ensembles
  in Chile improves calibration and point accuracy over raw ensembles at 30 stations.
abstract: By the end of 2023, renewable sources cover 63.4% of the total electric power demand of Chile,
  and in line with the global trend, photovoltaic (PV) power shows the most dynamic increase. Although
  Chile's Atacama Desert is considered the sunniest place on Earth, PV power production, even in this
  area, can be highly volatile. Successful integration of PV energy into the country's power grid requires
  accurate short-term PV power forecasts, which can be obtained from predictions of solar irradiance and
  related weather quantities. Nowadays, in weather forecasting, the state-of-the-art approach is the use
  of ensemble forecasts based on multiple runs of numerical weather prediction models. However, ensemble
  forecasts still tend to be uncalibrated or biased, thus requiring some form of post-processing. The
  present work investigates probabilistic forecasts of solar irradiance for Regions III and IV in Chile.
  For this reason, 8-member short-term ensemble forecasts of solar irradiance for calendar year 2021 are
  generated using the Weather Research and Forecasting (WRF) model, which are then calibrated using the
  benchmark ensemble model output statistics (EMOS) method based on a censored Gaussian law, and its machine
  learning-based distributional regression network (DRN) counterpart. Furthermore, we also propose a neural
  network-based post-processing method resulting in improved 8-member ensemble predictions. All forecasts
  are evaluated against station observations for 30 locations, and the skill of post-processed predictions
  is compared to the raw WRF ensemble. Our case study confirms that all studied post-processing methods
  substantially improve both the calibration of probabilistic- and the accuracy of point forecasts. Among
  the methods tested, the corrected ensemble exhibits the best overall performance. Additionally, the
  DRN model generally outperforms the corresponding EMOS approach.
