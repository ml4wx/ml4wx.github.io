summary: Comparison of eight deep learning models for monthly temperature and precipitation in Weifang
  City finds CNN-LSTM-GRU best, with R = 0.988.
abstract: Climate change affects the water cycle, water resource management, and sustainable socio-economic
  development. In order to accurately predict climate change in Weifang City, China, this study utilizes
  multiple data-driven deep learning models. The climate data for 73 years include monthly average air
  temperature (MAAT), monthly average minimum air temperature (MAMINAT), monthly average maximum air temperature
  (MAMAXAT), and monthly total precipitation (MP). The different deep learning models include artificial
  neural network (ANN), recurrent NN (RNN), gate recurrent unit (GRU), long short-term memory neural network
  (LSTM), deep convolutional NN (CNN), hybrid CNN-GRU, hybrid CNN-LSTM, and hybrid CNN-LSTM-GRU. The CNN-LSTM-GRU
  for MAAT prediction is the best-performing model compared to other deep learning models with the highest
  correlation coefficient (R = 0.9879) and lowest root mean square error (RMSE = 1.5347) and mean absolute
  error (MAE = 1.1830). These results indicate that The hybrid CNN-LSTM-GRU method is a suitable climate
  prediction model. This deep learning method can also be used for surface water modeling. Climate prediction
  will help with flood control and water resource management.
