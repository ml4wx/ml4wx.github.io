summary: A hybrid deep neural network reconstructs 3D DPR radar reflectivity from GMI radiances with under
  4 dBZ RMSE, including typhoon cases.
abstract: Abstract Three‐dimensional global precipitation observation is crucial for understanding climate
  and weather dynamics. While spaceborne precipitation radars provide precise but limited observations,
  passive microwave imagers are available much more frequently. In this study, we propose a deep learning
  approach to reconstruct active radar observations using passive microwave radiances. We introduce the
  Hybrid Deep Neural Network (HDNN) model, which utilizes reflectivity profiles from the Dual‐frequency
  Precipitation Radar (DPR) onboard the Global Precipitation Measurement (GPM) Core Observatory Satellite
  as the “target” and combines radiances from the GPM Microwave Imager (GMI) with supplementary reanalysis
  data to serve as the “features.” Results underscore the HDNN's exemplary performance, with a root mean
  square error below 4 dBZ across all altitude levels, and a consistent accuracy across different precipitation
  types. Its efficacy is further illustrated when applied to typhoon cases of Haishen and Khanun, emerging
  as a superior tool for capturing 3D structures of expansive precipitation systems.
