summary: Edge-enhanced super-resolution GAN with Faster R-CNN detects cyclones in CAM5.1 climate data
  over the Indian subcontinent, reaching 86.3% accuracy.
abstract: Abstract The accurate identification of extreme weather events (EWEs), particularly cyclones,
  has become increasingly crucial due to the intensifying impacts of climate change. In the Indian subcontinent,
  the frequency and severity of cyclones have demonstrably risen, highlighting the need for reliable detection
  methods to minimize casualties and economic losses. However, the inherent limitations of low-resolution
  data pose significant challenges to traditional detection methods. Deep learning models offer a promising
  solution, enabling the precise identification of cyclone boundaries crucial for assessing regional impacts
  using global climate models data. By leveraging the power of deep learning, we can significantly enhance
  our capabilities for cyclone detection and contribute to improved risk mitigation strategies in the
  vulnerable Indian subcontinent. Therefore, this paper introduces an edge-enhanced super-resolution GAN
  (EESRGAN) leveraging an end-to-end detector network. The proposed approach comprised of a generator
  network equipped by residual-in-residual dense block (RRDB) and discriminator containing Faster RCNN
  detector. The precise patterns of cyclone had been effectively extracted to help boundary detection.
  Extensive experiments have been conducted on Community Atmospheric Model (CAM5.1) data taken into account
  only seven variables. Four matrices including precision, recall, intersection over union, and mean average
  precision have been considered to assess the proposed approach. The results have been found very effective
  while achieving accuracy up to 86.3% and average precision (AP) of 88.63%. Moreover, the proposed method
  demonstrates its superiority while compared with benchmarks object detectors methods. Thus, the proposed
  method can be employed in the area of extreme climate detection and could enrich the climate research
  domain.
