summary: XGBoost predicts Atlantic tropical cyclone rainfall and reveals a nonlinear Saharan dust effect
  peaking near 0.06 dust optical depth, then suppressing rainfall.
abstract: Tropical cyclone rainfall (TCR) extensively affects coastal communities, primarily through inland
  flooding. The impact of global climate changes on TCR is complex and debatable. This study uses an XGBoost
  machine learning model with 19-year meteorological data and hourly satellite precipitation observations
  to predict TCR for individual storms. The model identifies dust optical depth (DOD) as a key predictor
  that enhances performance evidently. The model also uncovers a nonlinear and boomerang-shape relationship
  between Saharan dust and TCR, with a TCR peak at 0.06 DOD and a sharp decrease thereafter. This indicates
  a shift from microphysical enhancement to radiative suppression at high dust concentrations. The model
  also highlights meaningful correlations between TCR and meteorological factors like sea surface temperature
  and equivalent potential temperature near storm cores. These findings illustrate the effectiveness of
  machine learning in predicting TCR and understanding its driving factors and physical mechanisms.
