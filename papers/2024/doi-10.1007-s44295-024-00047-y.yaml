summary: A CNN with content-guided channel and spatial attention improves ENSO prediction and helps overcome
  the spring predictability barrier; it also generates synthetic ocean data.
abstract: Abstract El Niño-Southern Oscillation (ENSO) is a periodic climate phenomenon in the equatorial
  Pacific that significantly influences global climate patterns. Accurate prediction and monitoring of
  ENSO events are essential for meteorological agencies and governmental institutions. This study introduces
  a content-guided attention module within a convolutional neural network to improve prediction accuracy.
  This module models inter-channel relationships and enhances information interaction by integrating channel
  and spatial attention weights. These advancements substantially improve prediction accuracy and help
  overcome the spring prediction barrier in ENSO forecasting. The research emphasizes global feature modeling
  and proposes a novel content-guided ENSO prediction model. It also includes an ocean data generation
  model utilizing global attention. Furthermore, a layered rendering technique is employed to invert ocean
  data, facilitating detailed analysis and contributing to the development of an ocean synthetic dataset.
