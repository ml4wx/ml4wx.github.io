summary: Automated system uses OpenCV and YOLO to extract wind information from web forecast charts and
  send text marine forecasts to navigators.
abstract: Sailing vessel navigators always want to receive state-of-the-art prompt and accurate marine
  weather-forecasting services. However, the weather-routing services by private sectors are expensive.
  Further, forecasting results from public institutes are usually free, and they are not in real-time
  or numerical modes, so they are not quite suitable for small-size or offshore vessels. In this study,
  an intelligent system was constructed for delivering sea forecasting at specific areas according to
  the navigator’s order. The system can automatically obtain web-based forecasting charts issued from
  multi-source meteorological agencies and convert the regional information into numerical text at requested
  points. During this step, several intelligent algorithms, like the OpenCV digital image processing algorithm
  and the YOLO wind vector deep learning recognition method, were applied. By applying this state-of-the-art
  system, navigators on board do not need to download different institutional graphics (usually with large
  stream bytes) to explore the future states of the sea surface in a specific area in the sailing route
  but can obtain the multi-source text forecasting information just by sending the area coordinates to
  a designated email address. The field tests confirmed that this auto-intelligent system could assist
  the navigator within a few minutes and thus greatly enhance the navigation safety with minor text-based
  communication costs. It is expected that by improving the efficiency of marine services and bringing
  in more artificial intelligence technology, maritime security would be more sustainable.
