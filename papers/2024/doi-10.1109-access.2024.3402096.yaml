summary: Review of AI, ML, NWP and hybrid models for solar irradiance forecasting, comparing accuracy,
  strengths and weaknesses, and highlighting future directions for solar energy integration.
abstract: Meeting the energy needs of a growing population is of paramount importance in today’s society.
  The use of renewable energy sources, especially solar energy, can help reduce greenhouse gas emissions
  from traditional sources. Solar irradiance, which depends on several factors such as the availability
  of sunlight, cloud cover index, latitude, orientation and tilt of solar panels, and technical factors,
  plays a crucial role in the use of solar energy. Predicting solar irradiance is therefore essential
  for enhancing the reliability and efficiency of solar energy systems. Artificial intelligence (AI) and
  machine learning (ML) models are increasingly being used to predict solar irradiance forecasting. These
  models can learn from historical weather data and identify complex patterns to predict future solar
  irradiance with high accuracy. Techniques such as regression, neural networks and ensemble methods are
  frequently used and enable more efficient planning and operation of solar energy systems. This study
  provides a comprehensive analysis of the existing state-of-the-art models for solar irradiance forecasting.
  The study evaluates a variety of forecasting models, including machine learning, numerical weather prediction
  and hybrid approaches for assessing their accuracy, strengths and weaknesses. As an outcome of this
  study, potential future improvements in the prediction of solar irradiance are highlighted and the importance
  of interdisciplinary collaboration and emerging technologies is emphasized. To ensure a sustainable
  and resilient energy future, it is crucial to continue efforts to better integrate solar energy into
  mainstream electricity systems. This work can serve as a fundamental analysis for future researchers
  to identify the most appropriate approaches for medium and long-term solar irradiance forecasts.
