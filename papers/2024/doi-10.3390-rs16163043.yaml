summary: Random forest correction of GFS precipitable water vapor using GPS data over the US improves
  accuracy by 12.08%, with evaluation during hurricane conditions.
abstract: Precipitable water vapor (PWV) is one of the most dynamic components of the atmosphere, playing
  a critical role in precipitation formation, the hydrological cycle, and climate change. This study used
  SuomiNet Global Positioning System (GPS) data from April 2021 to June 2023 in the United States to comprehensively
  evaluate 3 and 6 h Global Forecast System (GFS) PWV products (i.e., PWV3h and PWV6h). There was high
  consistency between the GFS PWV and GPS PWV data, with correlation coefficients (Rs) higher than 0.98
  and a root mean square error (RMSE) of about 0.23 cm. The PWV3h product performed slightly better than
  PWV6h. PWV tended to be underestimated when PWV > 4 cm, and the degree of underestimation increased
  with increasing water vapor value. The RMSE showed obvious seasonal and diurnal variations, with the
  RMSE value in summer (i.e., 0.280 cm) considerably higher than in winter (i.e., 0.158 cm), and nighttime
  were RMSEs higher than daytime RMSEs. Clear-sky conditions showed smaller RMSEs, while cloudy-sky conditions
  exhibited a smaller range of monthly RMSEs and higher Rs. PWV demonstrated a clear spatial pattern,
  with both Rs and RMSEs decreasing with increasing elevation and latitude. Based on these temporal and
  spatial patterns, Back Propagation neural network and random forest (RF) models were employed, using
  PWV, Julian day, and geographic information (i.e., latitude, longitude, and elevation) as input data
  to correct the GFS PWV products. The results indicated that the RF model was more advantageous for water
  vapor correction, improving overall accuracy by 12.08%. In addition, the accuracy of GFS PWV forecasts
  during hurricane weather was also evaluated. In this extreme weather, the RMSE of the GFS PWV forecast
  increased comparably to normal weather, but it remained less than 0.4 cm in most cases.
