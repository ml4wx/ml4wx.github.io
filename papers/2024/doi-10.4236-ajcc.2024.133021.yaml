summary: Systematic review of ground-based cloud tracking for short-term photovoltaic forecasting, covering
  image processing and deep learning methods and open challenges.
abstract: Renewable energies are highly dependent on local weather conditions, with photovoltaic energy
  being particularly affected by intermittent clouds. Anticipating the impact of cloud shadows on power
  plants is crucial, as clouds can cause partial shading, excessive irradiation, and operational issues.
  This study focuses on analyzing cloud tracking methods for short-term forecasts, aiming to mitigate
  such impacts. We conducted a systematic literature review, highlighting the most significant articles
  on cloud tracking from ground-based observations. We explore both traditional image processing techniques
  and advances in deep learning models. Additionally, we discuss current challenges and future research
  directions in this rapidly evolving field, aiming to provide a comprehensive overview of the state of
  the art and identify opportunities for significant advancements in the next generation of cloud tracking
  systems based on computer vision and deep learning.
