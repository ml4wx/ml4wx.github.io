summary: Random forest with game-theory attribution links 2022–2023 US fall and spring drought, and La
  Niña, to a 37% wheat production loss.
abstract: Unprecedented precipitation deficits in the 2022-2023 growing season across the primary wheat-producing
  region in the United States caused delays in winter wheat emergence and poor crop growth. Using an integrated
  approach, we quantitatively unraveled a 37% reduction in wheat production as being attributable to both
  per-harvested acre yield loss and severe crop abandonment, reminiscent of the Dust Bowl years in the
  1930s. We used random forest machine learning and game theory analytics to show that the main driver
  of yield loss was spring drought, whereas fall drought dominated abandonment rates. Furthermore, results
  revealed, across the US winter wheat belt, the La Niña phase of the El Niño Southern Oscillation (ENSO),
  increased abandonment rates compared to the El Niño phase. These findings underscore the necessity of
  simultaneously addressing crop abandonment and yield decline to stabilize wheat production amid extreme
  climatic conditions and provide a holistic understanding of global-scale ENSO dynamics on wheat production.
