summary: Shows Pangu-Weather, FourCastNet and GraphCast fail to reproduce sub-synoptic and mesoscale phenomena,
  lacking physical consistency versus physics-based models.
abstract: Abstract Machine Learning (ML) is having a profound impact in the domain of Weather and Climate
  Prediction. A recent development in this area has been the emergence of fully data‐driven ML prediction
  models which routinely claim superior performance to that of traditional physics‐based models. We examine
  some aspects of the forecasts produced by three of the leading current ML models, Pangu‐Weather, FourCastNet
  and GraphCast, with a focus on their fidelity and physical consistency. The main conclusion is that
  these ML models are not able to properly reproduce sub‐synoptic and mesoscale weather phenomena and
  lack the fidelity and physical consistency of physics‐based models and this has impacts on the interpretation
  of their forecasts and their perceived skill. Balancing forecast skill and physical realism will be
  an important consideration for future ML models.
