summary: Reviews Southern Hemisphere regime shifts since the late 1970s using clustering and regime identification,
  linking them to anthropogenic forcing and Australian rainfall changes.
abstract: Analysis of observations, reanalysis, and model simulations, including those using machine learning
  methods specifically designed for regime identification, has revealed changes in aspects of the Southern
  Hemisphere (SH) circulation and Australian climate and extremes over the last half-century that indicate
  transitions to new states. In particular, our analysis shows a dramatic shift in the metastability of
  the SH climate that occurred in the late 1970s, associated with a large-scale regime transition in the
  SH atmospheric circulation, with systematic changes in the subtropical jet, blocking, zonal winds, and
  storm tracks. Analysis via nonstationary clustering reveals a regime shift coincident with a sharp transition
  to warmer oceanic sea surface temperatures and increased baroclinicity in the large scales of the Antarctic
  Circumpolar Circulation (ACC), extending across the whole hemisphere. At the same time, the background
  state of the tropical Pacific thermocline shoaled, leading to an increased likelihood of El Niño events.
  The SH climate shift in the late 1970s is the first hemispheric regime shift that can be directly attributed
  to anthropogenic climate change. These changes in dynamics are associated with additional regional tipping
  points, including reductions in mean and extreme rainfall in south-west Western Australia (SWWA) and
  streamflow into Perth dams, and also with increases in mean and extreme rainfall over northern Australia
  since the late 1970s. The drying of south-eastern Australia (SEA) occurred against a background of accelerating
  increases in average and extreme temperatures across the whole continent since the 1990s, implying further
  inflection points may have occurred. Analysis of climate model simulations capturing the essence of
  these observed shifts indicates that these systematic changes will continue into the late 21st century
  under high greenhouse gas emission scenarios. Here, we review two decades of work, revealing for the
  first time that tipping points characteristic of regime transitions are inferred to have already occurred
  in the SH climate system.
