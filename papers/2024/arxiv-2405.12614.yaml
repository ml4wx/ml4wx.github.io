summary: Combines Gaussian processes and neural networks with NWP, topography and station data to produce
  calibrated probabilistic sub-kilometer surface wind gust fields with lower CRPS.
abstract: Accurately representing surface weather at the sub-kilometer scale is crucial for optimal decision-making
  in a wide range of applications. This motivates the use of statistical techniques to provide accurate
  and calibrated probabilistic predictions at a lower cost compared to numerical simulations. Wind represents
  a particularly challenging variable to model due to its high spatial and temporal variability. This
  paper presents a novel approach that integrates Gaussian processes and neural networks to model surface
  wind gusts at sub-kilometer resolution, leveraging multiple data sources, including numerical weather
  prediction models, topographical descriptors, and in-situ measurements. Results demonstrate the added
  value of modeling the multivariate covariance structure of the variable of interest, as opposed to only
  applying a univariate probabilistic regression approach. Modeling the covariance enables the optimal
  integration of observed measurements from ground stations, which is shown to reduce the continuous ranked
  probability score compared to the baseline. Moreover, it allows the generation of realistic fields that
  are also marginally calibrated, aided by scalable techniques such as random Fourier features and pathwise
  conditioning. We discuss the effect of different modeling choices, as well as different degrees of approximation,
  and present our results for a case study.
