summary: Neural network forecasts monthly precipitation and SPI drought indices over South America, outperforming
  NMME in validation.
abstract: Climate forecasting is essential for energy production, agricultural activities, transportation,
  and civil defense sectors, serving as a foundation for decision-making and risk management. This study
  addresses the challenge of accurately predicting extreme droughts in South America, a region highly
  vulnerable to climate variability. By employing a supervised neural network (NN) within a machine learning
  framework, we developed a methodology to forecast precipitation and subsequently calculate the Standardized
  Precipitation Index (SPI) for predicting drought conditions across the continent. The proposed model
  was trained with precipitation data from the Global Precipitation Climatology Project (GPCP) for the
  period 1983–2023. It provided monthly drought forecasts, which were validated against observational
  data and compared with predictions from the North American Multi-Model Ensemble (NMME). Key findings
  indicate the neural network’s ability to capture complex precipitation patterns and predict drought
  conditions. The model’s architecture effectively integrates precipitation data, demonstrating superior
  performance metrics compared to traditional approaches like the NMME. This study reinforces the relevance
  of using machine learning algorithms as a robust tool for drought prediction, providing critical information
  that can assist in decision-making for sustainable water resource management.
