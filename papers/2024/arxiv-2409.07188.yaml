summary: FuXi-2.0 delivers 1-hourly global forecasts with more variables, beating ECMWF HRES for wind
  power and adding an atmosphere-ocean coupled component.
abstract: Machine learning (ML) models have become increasingly valuable in weather forecasting, providing
  forecasts that not only lower computational costs but often match or exceed the accuracy of traditional
  numerical weather prediction (NWP) models. Despite their potential, ML models typically suffer from
  limitations such as coarse temporal resolution, typically 6 hours, and a limited set of meteorological
  variables, limiting their practical applicability. To overcome these challenges, we introduce FuXi-2.0,
  an advanced ML model that delivers 1-hourly global weather forecasts and includes a comprehensive set
  of essential meteorological variables, thereby expanding its utility across various sectors like wind
  and solar energy, aviation, and marine shipping. Our study conducts comparative analyses between ML-based
  1-hourly forecasts and those from the high-resolution forecast (HRES) of the European Centre for Medium-Range
  Weather Forecasts (ECMWF) for various practical scenarios. The results demonstrate that FuXi-2.0 consistently
  outperforms ECMWF HRES in forecasting key meteorological variables relevant to these sectors. In particular,
  FuXi-2.0 shows superior performance in wind power forecasting compared to ECMWF HRES, further validating
  its efficacy as a reliable tool for scenarios demanding precise weather forecasts. Additionally, FuXi-2.0
  also integrates both atmospheric and oceanic components, representing a significant step forward in
  the development of coupled atmospheric-ocean models. Further comparative analyses reveal that FuXi-2.0
  provides more accurate forecasts of tropical cyclone intensity than its predecessor, FuXi-1.0, suggesting
  that there are benefits of an atmosphere-ocean coupled model over atmosphere-only models.
