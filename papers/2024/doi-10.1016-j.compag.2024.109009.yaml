summary: Statistically post-processed ACCESS-G3 forecasts, downscaled and made ensemble, feed APSIM to
  forecast sugarcane irrigation indices with better accuracy and reliable uncertainty.
abstract: Efficient irrigation reduces energy and water costs, increases profit margins and delivers better
  environmental outcomes. Whilst many growers rely on weather forecasts to make decisions, few studies
  have sought to incorporate weather forecast uncertainty into the optimisation of irrigation management
  or to evaluate weather forecasts through the lens of irrigation indices. Therefore, in this study, we
  seek to generate and evaluate ensemble forecasts of irrigation indices produced by coupling numerical
  weather prediction (NWP) forecasts with a biophysical process model (APSIM). We investigate a case study
  application for sugarcane in northeastern Australia. As a first step, three and a half years of forecasts
  from the Australian Bureau of Meteorology’s ACCESS-G3 model are statistically post-processed to generate
  7-day forecasts that are downscaled and calibrated to local climate zones. In addition, the forecast
  post-processor converts the deterministic forecasts into an ensemble, thus quantifying forecast uncertainty.
  The generated forecasts are then used as forcing for the APSIM crop model to produce ensemble forecasts
  of soil water deficit (SWD), crop water use (CWU) and crop stress (Stress) for a simulated sugarcane
  crop. Through cross-validation, the post-processed weather forecasts demonstrate improved forecast accuracy
  compared to naive climatology and raw NWP forecasts for daily rainfall, maximum and minimum temperature
  and solar radiation; with the added benefit of providing a reliable uncertainty estimate. Improvement
  to an even greater degree is observed for the derived irrigation indices, particularly CWU and Stress,
  for which the forecasts are also reliable. The developed irrigation indices based on NWP can be used
  directly for decision making or, alternatively, may be used further in machine learning for optimisation
  of irrigation schedules in conjunction with other remotely sensed variables.
