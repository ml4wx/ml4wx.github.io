summary: Hybrid data-driven and analytical model predicts live and dead fuel moisture and load globally
  at ~9 km daily, producing a 10-year wildfire fuel dataset.
abstract: Abstract. Effective wildfire management and prevention strategies depend on accurate forecasts
  of fire occurrence and propagation. Fuel load and fuel moisture content are essential variables for
  forecasting fire occurrence and whilst existing operational systems incorporate dead fuel moisture content,
  both live fuel moisture content and fuel load are either approximated or neglected. We propose a mid-complexity
  model combining data driven and analytical methods to predict fuel characteristics. The model can be
  integrated into Earth-System models to provide real-time forecasts and climate records taking advantage
  of meteorological variables, land surface modelling and satellite observations. Fuel load and moisture
  is partitioned into live and dead fuels, including both wood and foliage components. As an example,
  we have generated a 10-year dataset which is well correlated with independent data and largely explains
  observed fire activity globally. While dead fuel moisture correlates highest with fire activity, live
  fuel moisture and load are shown to potentially enhance prediction skill. The use of observation data
  to inform a dynamical model is a crucial first step toward disentangling the contributing factors of
  fuel and weather to understand fire evolution globally. This dataset, with high spatiotemporal resolution
  (~9 km, daily), is the first of its kind and will be regularly updated.
