summary: DSADNet fuses radar and rainfall maps with dynamic convolution and attention to directly predict
  near-term rainfall over Jiangsu, China, outperforming the compared models.
abstract: Accurate precipitation nowcasting is of great significance for flood prevention, agricultural
  production, and public safety. In recent years, spatiotemporal sequence models based on deep learning
  have been widely used for precipitation nowcasting and have achieved better prediction results than
  traditional methods. These models commonly use radar echo extrapolation and utilize the Z-R relationship
  between radar and rainfall to predict rainfall. However, radar echo data can be affected by various
  noises, and the Z-R correlation linking radar and rainfall encompasses several variables influenced
  by factors like terrain, climate, and seasonal variations. To solve this problem, we propose a dual-source
  attention dynamic neural network (DSADNet) for precipitation nowcasting, which is a network model that
  utilizes a fusion module to extract valid information from radar maps and rainfall maps, together with
  dynamic convolution and the attention mechanism, to directly predict future rainfall through encoding
  and decoding structure. We conducted experiments on a real dataset in Jiangsu, China, and the experimental
  results show that our model had better performance than the other examined models.
