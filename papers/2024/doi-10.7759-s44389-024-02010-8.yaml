summary: Review of statistical, ML, DL and hybrid models for meteorological parameter prediction, concluding
  hybrid models give the best accuracy.
abstract: Weather forecasting involves predicting atmospheric conditions for a specific location using
  various weather parameters. This is done by collecting data on the usual atmospheric conditions. However,
  reliable weather forecast remains a complex challenge for forecasters and analyzers. Weather data are
  critical across many sectors, including agriculture, tourism, airport operations, mining, and power
  generation. Traditional computational intelligence models have proven insufficient for delivering accurate
  predictions. Consequently, deep learning approaches are increasingly used to measure large data records,
  enabling more effective predictions by learning from historical data. The main component of the research
  includes the reviews of various statistical, machine learning, deep learning models, and hybrid models
  for meteorological parameter prediction. It evaluates their performance using different metrics. The
  proposed planning suggests that hybrid models offer superior prediction accuracy and recommends future
  research to explore their potential further. The intent of this research lies in its potential to improve
  weather forecasting accuracy.
