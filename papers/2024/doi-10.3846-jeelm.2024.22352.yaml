summary: Fbprophet, SARIMAX and LSTM models project Mahanadi basin precipitation and temperature under
  RCP scenarios from CORDEX-MIROC; Fbprophet and SARIMAX perform best.
abstract: This study examined climate change dynamics in the lower Mahanadi River basin by integrating
  observed and climate model data. Historical precipitation and temperature data (1979–2020) from the
  India Meteorological Department (IMD) and monthly climate model data from the CORDEX-SMHI-MIROC model
  via the Earth System Grid Federation (ESGF) are utilized. Four machine learning models (Fbprophet, Holt-Winters,
  LSTM RNN, and SARIMAX) are applied to forecast precipitation, Tmax, and Tmin, and are compared across
  different representative concentration pathway (RCP 2.6, 4.5, and 8.5) scenarios. Diverse trajectories
  emerge, highlighting potential shifts in precipitation and temperature dynamics over near, mid, and
  far-term intervals. Fbprophet and SARIMAX are identified as superior models through performance evaluation
  metrics (R2, RMSE, r, P-bias, and NSE). Spatial analysis using ArcGIS and IDW interpolation reveals
  spatial variations in climate projections, aiding in visualizing future climate trends within the Mahanadi
  Basin. This study acknowledges limitations such as historical data uncertainties, socio-economic indicators,
  and unpredictable RCP trajectories, introducing a novel method to integrate machine learning with climate
  model data for assessing reliability. It also explores anticipated shifts in monthly precipitation and
  temperature patterns, providing insights into future climate variations.
