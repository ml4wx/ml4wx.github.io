summary: Presents an artificial neural network weather predictor claiming 90.4% accuracy against other
  models, with limited methodological detail in the abstract.
abstract: For humans, weather prediction is vital in making rational everyday choices and avoiding risk.
  Accurate weather forecasting is regarded as one of the world’s most difficult issues. New weather forecasting,
  unlike conventional techniques, relies on a mixture of computer simulations, observation (via balloons
  and satellites), and information of patterns and trends (via local weather analysts and weather stations).
  Predictions are rendered with fair precision using such techniques. Prediction algorithms based on complicated
  formulas run the majority of computational models used for prediction. This paper highlights the prediction
  of weather with the artificial neural networks (ANN) using the latest available smart computing devices.
  To assess the effectiveness of the model, comparison research is conducted with the other existing models
  in the same area. The result demonstrates that our approach is better in comparison to other similar
  research and products. The comparative analysis has been undergone which confirms the superiority of
  our proposed techniques with an accuracy of 90.4%.
