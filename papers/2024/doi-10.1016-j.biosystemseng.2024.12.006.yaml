summary: Neural network and SVM models trained on vineyard weather-station data predict grapevine sunburn
  risk, reaching 90% cross-validation accuracy.
abstract: Due to climate change, heatwaves and prolonged periods of drought are more frequent and cause
  serious consequences to yield and berry composition of grapevine ( Vitis vinifera L.). In response to
  this challenge, machine learning model was built to predict sunburn damages on the berries. The trial
  was conducted over two years (2022–2023) in a not irrigated vineyard of cv. Sangiovese, trained to vertical
  shoot positioning (VSP) spur pruned cordon. The vineyard was monitored from veraison to harvest with
  a weather station and thermocouples connected to a wireless sensor network (WSN). The evolution of the
  sunburn damages was visually evaluated twice a week. The damages appeared soon after veraison and the
  severity of the symptoms increased when heatwaves occurred. Weather station data including air temperature,
  solar radiation and relative humidity were analysed and used to build prediction models for sunburn
  damage. Ten parameters were derived from raw data to supply the prediction models of neural network
  (NN) and Support Vector Machine (SVM) optimised with gamma tuning. The NN achieved 90.32% accuracy in
  cross-validation, followed by SVM with 86.22% using radial kernel. The machine learning model was created
  using TensorFlow framework and it is available in the mobile phone application SHEET which will alert
  grape growers about the risk of sunburn damages on their orchards. • Grapevine orchard cv. Sangiovese
  was monitored for sunburn damage in 2 years. • Berry shrivel and necrosis were observed on VSP spur
  pruned plants. • Ten parameters were selected to describe climate conditions and assess risk. • Machine
  learning model was able to predict risk of future sunburn damage. • Mobile application named SHEET is
  freely available for farmers to manage risk.
