summary: Transfer-learned CNN, pretrained on CMIP6 and fine-tuned on observations, predicts the Pacific
  decadal oscillation up to one year ahead with better skill than dynamical systems.
abstract: Abstract The Pacific decadal oscillation (PDO) is often described as a long-lived El Niño-like
  pattern of Pacific climate variability, and it has widespread climate and ecosystem impacts. PDO forecasts
  can provide useful information for policymakers on how to handle PDO impacts. Nevertheless, due to the
  long duration of the PDO cycles and their complex formation mechanisms, it remains a challenge to predict
  long lead time PDO. In this paper, we propose a transfer-learning-enhanced convolutional neural network
  (CNN) to tackle complex ocean dynamic forecasting and predict PDO events with up to a one-year lead
  time. Our method first trains the CNN on historical simulations from Coupled Model Intercomparison Project
  6 (CMIP6), covering the period from 1850 to 1972. This prior knowledge is then refined by further training
  the model with observational data from 1854 to 1972, ensuring robust performance on unseen data. Additionally,
  k-fold cross-validation is also employed to evaluate the model’s performance across diverse subsets
  of data, enhancing its reliability. Throughout the testing phase from 1983 to 2022, the CNN model consistently
  outperforms existing dynamical forecast systems, exhibiting superior correlation skills in predicting
  annual mean PDO indices and PDO phases, including displaying resilience to seasonal variations. The
  transferred CNN is thus a powerful method to predict PDO events and is potentially valuable for a wide
  range of applications. This work directly supports the objectives of the World Climate Research Programme
  Grand Challenge on Climate Prediction.
