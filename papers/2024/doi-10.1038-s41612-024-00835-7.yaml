summary: A Res34-Unet post-processing of NMME six-month forecasts of eastern China summer rainfall identifies
  WPSH and SST as key drivers and shows which models capture them.
abstract: Due to systematic errors in models and the special geographic location of eastern China, most
  global climate models exhibit significant biases in predicting summer precipitation in this region.
  This study evaluates the North American Multi-Model Ensemble (NMME) forecasts for eastern China, with
  a lead time of six months.While NMME simulates precipitation climatology well, it poorly predicts anomalies.
  Using the Res34-Unet deep learning post-processing method, which has been proven to enhance NMME’s forecasts,
  we explore that Western Pacific Subtropical High (WPSH) and sea surface temperature (SST) are critical
  in enhancing forecast accuracy. Among the four models evaluated, only GEM-NEMO (correlation of 0.538
  with the WPSH) and CanSIPS-IC3 (which partly captured the impact of SST anomalies on precipitation)
  partially reflected the key factors identified by deep learning. Simulating these factors more accurately
  could greatly enhance NMME’s predictive skill for summer precipitation.
