summary: Wavelet-transform LSTM improves temperature prediction at Makokou, Gabon, reaching 0.45 °C RMSE
  versus plain LSTM in the Congo Basin.
abstract: Currently, the Congo Basin represents the most important center in terms of biodiversity concentration,
  especially with the increasing deforestation observed in the Amazon. The available climate models are
  mostly at larger scales, and few of them focus on specific areas of the Congo Basin, such as the locality
  of Makokou in Gabon. A new approach is therefore needed to predict temperatures changes in this particular
  region. Although some work focus on temperature prediction, most do not use deep learning algorithms.
  This contribution aims to compare the predictions of a Long Short-Term Memory (LSTM) model with those
  from the combination of Wavelet Transform and LSTM (WT-LSTM). The developed LSTM model includes two
  LSTM layers, two Dropout layers (with a rate of 50 %) and a Dense layer to outpout the predicted value.
  The WT-LSTM model shows superior results compared to the LSTM model, with a root mean square error of
  0.45 °C, a mean absolute error of 0.35 °C, and a Spearman correlation coefficient of 0.97 °C. These
  results highlight the importance of using advanced approaches to improve climate forecasts in areas
  crucial for biodiversity conservation. The increased accuracy of predictions could help better anticipate
  and mitigate the impacts of of local climate change, thereby contributing to the sustainable management
  of this ecologically sensitive region.
