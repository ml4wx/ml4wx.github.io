summary: Multilayer perceptron classifiers convert NWP lightning indices into binary lightning hazard,
  scoring better on test than training data but failing to separate cloud-to-cloud from cloud-to-ground
  lightning.
abstract: To convert lightning indices generated by numerical weather prediction experiments into binary
  lightning hazard, a machine-learning tool was developed. This tool, consisting of parallel multilayer
  perceptron classifiers, was trained on an ensemble of planetary boundary layer schemes and microphysics
  parameterizations that generated four different lightning indices over 1 week. In a subsequent week,
  the multi-physics ensemble was applied and the machine-learning tool was used to evaluate the accuracy.
  Unintuitively, the machine-learning tool performed better on the testing dataset than the training dataset.
  Much of the error may be attributed to mischaracterizing the convection. The combination of the machine
  learning model and simulations could not differentiate between cloud-to-cloud lightning and cloud-to-ground
  lightning, despite being trained on cloud-to-ground lightning. It was found that the simulation most
  representative of the local operational model was the most accurate simulation tested.
