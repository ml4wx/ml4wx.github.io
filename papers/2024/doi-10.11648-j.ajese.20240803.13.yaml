summary: Stacking ensemble with an RNN meta-regressor predicts daily temperature in Algiers better than
  its six base models.
abstract: Temperature, as a critical element of weather forecasting, has consistently attracted extensive
  public attention. Accurate daily temperature prediction is essential for mitigating economic losses,
  preventing casualties, and maintaining public safety. However, traditional temperature prediction methods
  often fail to forecast the temperature promptly and effectively. To achieve more accurate daily temperatures
  prediction, researchers have turned to the recent advancement of artificial intelligence. This study
  aims to address the prediction of daily temperature in Algiers, by developing a stacking-based ensemble
  model. Firstly, the data normalization method is employed to preprocess the raw temperature data of
  Algiers in the experiment. Secondly, Decision Tree, K-Nearest Neighbors, Linear Regression, Random Forest,
  Recurrent Neural Network, and Support Vector Regression are selected as base models to predict the daily
  temperature. Finally, a stacking-based ensemble model with Recurrent Neural Network as the meta regressor
  (S-RNN) is applied for further accurate prediction. The experiment involves evaluating multiple metrics
  on the dataset to assess the performance of the model in predicting daily temperatures in Algiers. The
  experimental results indicate that the ensemble model outperforms other base models in addressing the
  challenges of daily temperature prediction. Meanwhile, this study confirms the significant potential
  in the application of stacking-based ensemble learning in the field of daily temperature prediction.
