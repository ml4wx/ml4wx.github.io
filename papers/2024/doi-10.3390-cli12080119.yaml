summary: CNN estimates Canadian Drought Monitor values from ERA5-Land and projects drought zones to 2100
  under CanESM5 scenarios.
abstract: This study addresses the critical issue of drought zoning in Canada using advanced deep learning
  techniques. Drought, exacerbated by climate change, significantly affects ecosystems, agriculture, and
  water resources. Canadian Drought Monitor (CDM) data provided by the Canadian government and ERA5-Land
  daily data were utilized to generate a comprehensive time series of mean monthly precipitation and air
  temperature for 199 sample locations in Canada from 1979 to 2023. These data were processed in the Google
  Earth Engine (GEE) environment and used to develop a Convolutional Neural Network (CNN) model to estimate
  CDM values, thereby filling gaps in historical drought data. The CanESM5 climate model, as assessed
  in the IPCC Sixth Assessment Report, was employed under four climate change scenarios to predict future
  drought conditions. Our CNN model forecasts CDM values up to 2100, enabling accurate drought zoning.
  The results reveal significant trends in temperature changes, indicating areas most vulnerable to future
  droughts, while precipitation shows a slow increasing trend. Our analysis indicates that under extreme
  climate scenarios, certain regions may experience a significant increase in the frequency and severity
  of droughts, necessitating proactive planning and mitigation strategies. These findings are critical
  for policymakers and stakeholders in designing effective drought management and adaptation programs.
