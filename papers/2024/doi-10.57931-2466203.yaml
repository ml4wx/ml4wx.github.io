summary: Webinar summary of AI methods for tropical cyclone data augmentation and climate-index reconstruction
  to overcome limited observational data for climate extremes.
abstract: 'Context: This webinar was hosted by the MultiSector Dynamics Community of Practice (MSD CoP;
  https://multisectordynamics.org). Abstract: Artificial Intelligence (AI) models require large volumes
  of data for training and testing. Data requirements present challenges for using AI to explore extreme
  events with limited observational data. This webinar will showcase two innovative methods developed
  by part of the European Climate Intelligence (CLINT) project to overcome data challenges and harness
  AI to improve our understanding of climate extremes. Dr. Ascenso will present his research on data augmentation
  methods to improve estimates of tropical cyclones using satellite data. His presentation will review
  established methods for data augmentation and explore opportunities and challenges for using generative
  AI to generate images of extreme, life-threatening tropical cyclones. Next, Dr. Plesiat will present
  his research on deep learning techniques to overcome limited observational data sets. His presentation
  will illustrate deep learning methods to develop AI reconstructions of four climate indices across Europe.
  Presenters : Dr. Guido Ascenso (post-doctoral researcher, Politecnico di Milano); Dr. Étienne Plésiat
  (German Climate Computing Centre - DKRZ) Moderator(s): Stefano Galelli (MSD CoP WG Co-Lead), David Gold
  (MSD CoP WG Co-Lead), Jillian Sturtevant (MSD CoP WG Communications Officer), Matteo Giuliani (Politecnico
  di Milano, MSD CoP WG Member, Moderator and Organizer) This webinar was held on: October 11, 2024 from
  11AM - 1PM ET'
