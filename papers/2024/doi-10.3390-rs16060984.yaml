summary: AWL-Net fuses multi-source satellite and structure features with 3D ConvGRU, achieving 10.62
  kt RMSE for 24-h northwest Pacific tropical cyclone intensity forecasts.
abstract: Tropical cyclones (TCs) can cause significant economic damage and loss of life in coastal areas.
  Therefore, TC prediction has become a crucial topic in current research. In recent years, TC track prediction
  has progressed considerably, and intensity prediction remains a challenge due to the complex mechanism
  of TC structure. In this study, we propose a model for short-term intensity prediction based on adaptive
  weight learning (AWL-Net) for the evolution of the TC’s structure as well as intensity changes, exploring
  the multidimensional fusion of features including TC morphology, structure, and scale. Furthermore,
  in addition to using satellite imageries, we construct a dataset that can more comprehensively explore
  the degree of TC cloud organization and structure evolution. Considering the information difference
  between multi-source data, a multi-branch structure is constructed and adaptive weight learning (AWL)
  is designed. In addition, according to the three-dimensional dynamic features of TC, 3D Convolutional
  Gated Recurrent (3D ConvGRU) is used to achieve feature enhancement, and then 3D Convolutional Neural
  Network (CNN) is used to capture and learn TC temporal and spatial features. Experiments on a sample
  of northwest Pacific TCs and official agency TC intensity prediction records are used to validate the
  effectiveness of our proposed model, and the results show that our model is able to focus well on the
  spatial and temporal features associated with TC intensity changes, with a root mean square error (RMSE)
  of 10.62 kt for the TC 24 h intensity forecast.
