summary: ANN optimized by a genetic algorithm reduces MAE from 1.69 to 0.87 for station weather variables
  in 2023 data.
abstract: This research integrates Artificial Neural Network (ANN) with Genetic Algorithm Optimization
  (GA) to improve the accuracy of weather prediction. This method utilizes ANN-optimized GA, creating
  a model that can adapt to the dynamics of weather patterns. Using a dataset that includes meteorological
  variables such as temperature, humidity, and precipitation from January 1, 2023, to October 28, 2023,
  the model was tested for its ability to predict weather conditions accurately. The process begins with
  data preprocessing, ANN training, and GA optimisation. The evaluation showed that the optimized model
  was able to reduce the Mean Absolute Error (MAE) from 1.6865 to 0.8701, the Mean Absolute Percentage
  Error (MAPE) from 5.9864 to 3.1408, and the Root Mean Squared Error (RMSE) from 2.253 to 1.039, signalling
  a significant improvement in prediction accuracy and efficiency. This research confirms the potential
  of ANN and GA integration in improving weather prediction, providing new insights for developing more
  accurate and reliable prediction models for various applications, from agriculture to disaster management.
