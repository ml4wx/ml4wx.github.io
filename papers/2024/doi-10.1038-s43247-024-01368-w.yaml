summary: Machine-learning clustering of atmospheric river activity shows high-density clusters yield more
  high-category landfalls on the US West Coast, increasing with warming.
abstract: Abstract The catastrophic December 2022-January 2023 nine atmospheric rivers in California underscore
  the urgent need to better understand such high-risk weather extremes. Here we applied a machine learning
  clustering tool to understand the activity of atmospheric river clusters. Reanalysis results show that
  clusters with high density, that is the time fraction under atmospheric river conditions within a cluster,
  exhibit more frequent high-category atmospheric rivers, alongside an increased likelihood for extreme
  precipitation and severe land surface responses. The key circulation patterns of atmospheric river clusters
  are primarily attributed to subseasonal variability. Furthermore, the occurrence and density of atmospheric
  river clusters are modulated by the daily variability of the geopotential height field. Climate model
  projections suggest that atmospheric river clusters with higher density and higher categories will be
  more frequent as warming level increases. Our findings emphasize the important role of atmospheric river
  clusters in the development of climate adaptation and resilience strategies.
