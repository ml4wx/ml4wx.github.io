summary: A machine-learning parameterization maps DNS-derived effective supersaturation to superdroplet
  growth rates in LES, reaching R² near 0.9 on preliminary tests.
abstract: Droplet growth and size spectra play a crucial role in the microphysics of atmospheric clouds.
  However, it is challenging to represent droplet growth rate accurately in cloud-resolving models such
  as Large Eddy Simulations (LESs). The assumption of "well-mixed" condition within each grid cell, often
  made by traditional LES solvers, typically falls short near the edges of clouds, where sharp gradients
  in water vapor supersaturation occur. This under-resolution of supersaturation gradients can lead to
  significant errors in prediction of droplet growth rate, which in turn affects the prediction of buoyancy
  at cloud edges, as well as forecast of precipitation. In "superdroplet" based LES model, a Lagrangian
  coarse-graining approach groups multiple droplets into superdroplets, each encompassing a specific number
  and size of actual droplets. The superdroplets are advected by the underlying LES velocity field, and
  the growth rate of these superdroplets is based on the filtered supersaturation field represented by
  the LES. To overcome the limitations of the "well-mixed" assumption, we propose a parameterization for
  superdroplet growth using high-fidelity Direct Numerical Simulation (DNS) data. We introduce a novel
  clustering algorithm to map droplets in DNS fields to superdroplets. The effective supersaturation at
  each superdroplet location is computed by averaging the unfiltered supersaturation of the associated
  droplets, which may differ from the value of filtered supersaturation at the superdroplet location.
  We then develop a machine learning-based parameterization to relate the effective growth rate of superdroplets
  to other filtered DNS flow variables. Preliminary results show a promising $R^2$ value of nearly 0.9
  between the predicted and true effective supersaturation values for the superdroplets, for a range of
  superdroplet multiplicities.
