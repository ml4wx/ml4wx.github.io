summary: ANNs trained on indoor sensors transfer regional climate projections to workplace heat stress,
  projecting +0.8 to +2.5 K indoor warming by 2070–2099.
abstract: Abstract Climate models predict meteorological variables for outdoor spaces. Nevertheless, most
  people work indoors and are affected by heat indoors. We present an approach to transfer climate projections
  from outdoors to climate projections of indoor air temperature (Ti) and thermal comfort based on a combination
  of indoor sensors, artificial neural networks (ANNs), and 22 regional climate projections. Human thermal
  comfort and Ti measured by indoor sensors at 90 different workplaces in the Upper Rhine Valley were
  used as training data for ANN models predicting indoor conditions as a function of outdoor weather.
  Workplace-specific climate projections were modeled for the time period 2070–2099 and compared to the
  historical period 1970–1999 using the same ANNs, but ERA5-Land reanalysis data as input. It is shown
  that heat stress indoors will increase in intensity, frequency, and duration at almost all investigated
  workplaces. The rate of increase depends on building and room properties, the workplace purpose, and
  the representative concentration pathway (RCP2.6, RCP4.5, or RCP8.5). The projected increase of the
  mean air temperature in the summer (JJA) outdoors, by + 1.6 to + 5.1 K for the different RCPs, is higher
  than the increase in Ti at all 90 workplaces, which experience on average an increase of + 0.8 to +
  2.5 K. The overall frequency of heat stress is higher at most workplaces than outdoors for the historical
  and the future period. The projected hours of indoor heat stress will increase on average by + 379 h,
  + 654 h, and + 1209 h under RCP2.6, RCP4.5, and RCP8.5, respectively.
