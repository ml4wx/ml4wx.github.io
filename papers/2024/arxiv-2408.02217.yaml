summary: Neural network Monte Carlo simulations driven by climate projections show U.S. Corn Belt maize
  insurance claim probability doubling by mid-century.
abstract: 'Climate change not only threatens agricultural producers but also strains related public agencies
  and financial institutions. These important food system actors include government entities tasked with
  insuring grower livelihoods and supporting response to continued global warming. We examine future risk
  within the U.S. Corn Belt geographic region for one such crucial institution: the U.S. Federal Crop
  Insurance Program. Specifically, we predict the impacts of climate-driven crop loss at a policy-salient
  "risk unit" scale. Built through our presented neural network Monte Carlo method, simulations anticipate
  both more frequent and more severe losses that would result in a costly doubling of the annual probability
  of maize Yield Protection insurance claims at mid-century. We also provide an open source pipeline and
  interactive visualization tools to explore these results with configurable statistical treatments. Altogether,
  we fill an important gap in current understanding for climate adaptation by bridging existing historic
  yield estimation and climate projection to predict crop loss metrics at policy-relevant granularity.'
