summary: Data-driven models using Nino3.4, Indian Ocean Dipole and historical rainfall outperform physical
  models, predicting about 790 mm for India's 2023 summer monsoon.
abstract: Inaccuracy in the All Indian Summer Monsoon Rainfall (AISMR) forecast has major repercussions
  for India's economy and people's daily lives. Improving the accuracy of AISMR forecasts remains a challenge.
  An attempt is made here to address this problem by taking advantage of recent advances in machine learning
  techniques. The data-driven models trained with historical AISMR data, the Niño3.4 index, and categorical
  Indian Ocean Dipole values outperform the traditional physical models, and the best-performing model
  predicts that the 2023 AISMR will be roughly 790 mm, which is typical of a normal monsoon year.
