summary: DNN with kernel PCA downscales GCM precipitation for Taichung and Hualien, Taiwan, separating
  typhoon effects and projecting dry and wet season changes under RCP scenarios.
abstract: This study proposes a deep neural network (DNN)-based downscaling model incorporating kernel
  principal component analysis (KPCA) to investigate the precipitation uncertainty influenced by typhoons
  in Taiwan, which has a complex island topography. The best tracking data of tropical cyclones from the
  Joint Typhoon Warning Center (JTWC) are utilized to calculate typhoon and non-typhoon precipitation.
  KPCA is applied to extract nonlinear features of the BCC-CSM1-1 (Beijing Climate Center Climate System
  Model version 1.1) and CanESM2 (second-generation Canadian Earth System Model) GCM models. The length
  of the data used in the two GCM models span from January 1950 to December 2005 (historical data) and
  from January 2006 to December 2099 (scenario out data). The rainfall data are collected from the weather
  stations in Taichung and Hualien (cities of Taiwan) operated by the Central Weather Administration (CWA),
  Taiwan. The period of rainfall data in Taichung and in Hualien spans from January 1950 to December 2005.
  The proposed model is constructed with features extracted from the GCMs and historical monthly precipitation
  from Taichung and Hualien. The model we have built is used to estimate monthly precipitation and uncertainty
  in both Taichung and Hualien for future scenarios (rcp 4.5 and 8.5) of the GCMs. The results suggest
  that, in Taichung and Hualien, the summer precipitation is mostly within the normal range. The rainfall
  in the long term (January 2071 to December 2080) for both Taichung and Hualien typically fall between
  100 mm and 200 mm. In the long term, the dry season (January to April, November, and December) precipitation
  for Taichung and that in the wet season (May to October) for Hualien are less and more affected by typhoons,
  respectively. The dry season precipitation is more affected by typhoons in Taichung than Hualien. In
  both Taichung and Hualien, the long-term probability of rainfall exceeding the historical average in
  the dry season is higher than that in the wet season.
