summary: Autoencoder-encoded tropical Pacific SST patterns feed an LSTM that predicts the Niño 3.4 index
  6–18 months ahead, with 0.91–0.94 correlation.
abstract: Abstract El Niño Southern Oscillation (ENSO) is the prominent recurrent climatic pattern in
  the tropical Pacific Ocean with global impacts on regional climates. This study utilizes deep learning
  to predict the Niño 3.4 index by encoding non-linear sea surface temperature patterns in the tropical
  Pacific using an autoencoder neural network. The resulting encoded patterns identify crucial centers
  of action in the Pacific that serve as predictors of the ENSO mode. These patterns are utilized as predictors
  for forecasting the Niño 3.4 index with a lead time of at least 6 months using the Long Short-Term Memory
  (LSTM) deep learning model. The analysis uncovers multiple non-linear dipole patterns in the tropical
  Pacific, with anomalies that are both regionalized and latitudinally oriented that should support a
  single inter-tropical convergence zone for modeling efforts. Leveraging these encoded patterns as predictors,
  the LSTM - trained on monthly data from 1950 to 2007 and tested from 2008 to 2022 - shows fidelity in
  predicting the Niño 3.4 index. The encoded patterns captured the annual cycle of ENSO with a 0.94 correlation
  between the actual and predicted Niño 3.4 index for lag 12 and 0.91 for lags 6 and 18. Additionally,
  the 6-month lag predictions excel in detecting extreme ENSO events, achieving an 85% hit rate, outperforming
  the 70% hit rate at lag 12 and 55% hit rate at lag 18. The prediction accuracy peaks from November to
  March, with correlations ranging from 0.94 to 0.96. The average correlations in the boreal spring were
  as large as 0.84, indicating the method has the capability to decrease the spring predictability barrier.
