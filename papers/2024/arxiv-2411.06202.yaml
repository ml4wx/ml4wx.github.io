summary: Releases a Morocco wildfire dataset combining satellite and station weather data, with ML models
  predicting next-day fire occurrence at up to 90% accuracy.
abstract: Wildfires pose significant threats to ecosystems, economies, and communities worldwide, necessitating
  advanced predictive methods for effective mitigation. This study introduces a novel and comprehensive
  dataset specifically designed for wildfire prediction in Morocco, addressing its unique geographical
  and climatic challenges. By integrating satellite observations and ground station data, we compile essential
  environmental indicators such as vegetation health (NDVI), population density, soil moisture levels,
  and meteorological data aimed at predicting next-day wildfire occurrences with high accuracy. Our methodology
  incorporates state-of-the-art machine learning and deep learning algorithms, demonstrating superior
  performance in capturing wildfire dynamics compared to traditional models. Preliminary results show
  that models using this dataset achieve an accuracy of up to 90%, significantly improving prediction
  capabilities. The public availability of this dataset fosters scientific collaboration, aiming to refine
  predictive models and develop innovative wildfire management strategies. Our work not only advances
  the technical field of dataset creation but also emphasizes the necessity for localized research in
  underrepresented regions, providing a scalable model for other areas facing similar environmental challenges.
