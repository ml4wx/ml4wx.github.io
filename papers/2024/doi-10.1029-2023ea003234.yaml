summary: A Swin-Transformer post-processes WRF fields constrained by CMORPH satellite precipitation, raising
  hourly skill scores by 21.7% to 60.5% across rain intensities.
abstract: Abstract Quantitative precipitation forecasting in numerical weather prediction (NWP) models
  is contingent upon physicals parameterization schemes. However, uncertainties abound due to limited
  knowledge of the precipitating processes, leading to degraded forecasting skills. In light of this,
  our study explores the application of a Swin‐Transformer based deep learning (DL) model as a supplementary
  tool for enhancing the mapping trajectory between the NWP fundamental variables and the most downstream
  variable precipitation. Constrained by the observational satellite precipitation product from NOAA CPC
  Morphing Technique (CMORPH), the DL model serves as the post‐processing tool that can better resolve
  the precipitation patterns compared to solely based on NWP estimation. Compared to the baseline Weather
  Research and Forecasting simulation, the DL post‐processing effectively extracts features over meteorological
  variables, leading to improved precipitation skill scores of 21.7%, 60.5%, and 45.5% for light rain,
  moderate rain, and heavy rain, respectively, on an hourly basis. We also evaluate two case studies under
  different driven synoptic conditions and show promising results in estimating heavy precipitation during
  strong convective precipitation events. Overall, the proposed DL model can provide a vital reference
  for capturing precipitation‐triggering mechanisms and enhancing precipitation forecasting skills. Additionally,
  we discuss the sensitivities of the fundamental meteorological variables used in this study, training
  strategies, and performance limitations.
