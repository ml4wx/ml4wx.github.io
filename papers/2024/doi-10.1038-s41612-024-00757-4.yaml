summary: Workshop report summarizing 2024 ESA-ECMWF discussions on machine learning for Earth system observation
  and prediction, with research directions across five thematic areas.
abstract: This report summarises the main outcomes of the 4th edition of the workshop on Machine Learning
  (ML) for Earth System Observation and Prediction (ESOP / ML4ESOP) co-organised by the European Space
  Agency (ESA) and the European Centre for Medium-Range Weather Forecasts (ECMWF). The 4-day workshop
  was held on 7-10 May 2024 in a hybrid format at the ESA Frascati site with an interactive online component,
  featuring over 46 expert talks with a record number of submissions and about 800 registrations. The
  workshop offered leading experts a platform to exchange on the current opportunities, challenges and
  future directions for applying ML methodology to ESOP. To structure the presentations and discussions,
  the workshop featured five main thematic areas covering key topics and emerging trends. The most promising
  research directions and significant outcomes were identified by each thematic area’s Working Group and
  are the focus of this document.
