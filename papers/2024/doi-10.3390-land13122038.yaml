summary: AutoML gradient boosting, trained on South Korean stations, estimates North Korean rainfall erosivity
  from ERA5 and maps regional soil erosion risk.
abstract: Soil erosion due to rainfall is a critical environmental issue in North Korea, exacerbated by
  deforestation and climate change. This study aims to estimate rainfall erosivity (RE) in North Korea
  using automated machine learning (AutoML), with a particular focus on regional soil erosion risks. North
  Korean data were sourced from the European Centre for Medium-Range Weather Forecasts (ECMWF) ReAnalysis
  5 dataset, while South Korean data were obtained from the Korea Meteorological Administration. Data
  from 50 stations in South Korea (2013–2019) and 27 stations in North Korea (1980–2020) were used. The
  GradientBoostingRegressor (GBR) model, optimized using the Tree-based Pipeline Optimization Tool (TPOT),
  was trained on South Korean data. The model’s performance was evaluated using metrics such as the root
  mean square error (RMSE), mean absolute error (MAE), and coefficient of determination (R2), achieving
  high predictive accuracy across eight stations in South Korea. Using the optimized model, RE in North
  Korea was estimated, and the spatial distribution of RE was analyzed using the Kriging interpolation.
  Results reveal significant regional variability, with the southern and western areas displaying the
  highest erosivity. These findings provide valuable insights into soil erosion management and the development
  of sustainable agricultural and environmental strategies in North Korea.
