summary: A 2017–2021 contiguous US satellite time-series dataset for active fire detection, burned area
  mapping and next-day wildfire prediction, with deep learning baselines.
abstract: 'Wildfire monitoring and prediction are essential for understanding wildfire behaviour. With
  extensive Earth observation data, these tasks can be integrated and enhanced through multi-task deep
  learning models. We present a comprehensive multi-temporal remote sensing dataset for active fire detection,
  daily wildfire monitoring, and next-day wildfire prediction. Covering wildfire events in the contiguous
  U.S. from January 2017 to October 2021, the dataset includes 3552 surface reflectance images and auxiliary
  data such as weather, topography, land cover, and fuel information, totalling 71 GB. The lifecycle of
  each wildfire is documented, with labels for active fires (AF) and burned areas (BA), supported by manual
  quality assurance of AF and BA test labels. The dataset supports three tasks: a) active fire detection,
  b) daily burned area mapping, and c) wildfire progression prediction. Detection tasks use pixel-wise
  classification of multi-spectral, multi-temporal images, while prediction tasks integrate satellite
  and auxiliary data to model fire dynamics. This dataset and its benchmarks provide a foundation for
  advancing wildfire research using deep learning.'
