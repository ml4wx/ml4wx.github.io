summary: A diffusion model best preserves wind speed distributions when super-resolving ERA5 for wind
  power estimates, outperforming other deep learning downscaling methods.
abstract: 'The efficient placement of wind turbines relies on accurate local wind speed forecasts. Climate
  projections provide valuable insight into long-term wind speed conditions, yet their spatial data resolution
  is typically insufficient for precise wind power forecasts. Deep learning methods, particularly models
  developed for image super-resolution, offer a promising solution to bridge this scale gap by increasing
  the spatial resolution of climate models. In this paper, we compare the performance of various deep
  learning models on two distinct tasks: super-resolution, where we map artificially coarsened ERA5 data
  to its native resolution, and downscaling, where we map native ERA5 to high-resolution COSMO-REA6 data.
  We evaluate the models on their downstream application in forecasting long-term wind power, emphasizing
  the impact of spatial wind speed resolution on wind power estimates. Our findings highlight the importance
  of aligning models and evaluation metrics with their specific downstream applications. We show that
  a diffusion model outperforms other models for estimating the wind power potential by better preserving
  the wind speeds'' distributional and physical properties.'
