summary: 'Evaluates four open AI weather models on 2023 Northern Hemisphere tropical cyclones: track errors
  rival operational models, but intensity is biased low and worse than climatology.'
abstract: In just the past few years multiple data-driven Artificial Intelligence Weather Prediction (AIWP)
  models have been developed, with new versions appearing almost monthly. Given this rapid development,
  the applicability of these models to operational forecasting has yet to be adequately explored and documented.
  To assess their utility for operational tropical cyclone (TC) forecasting, the NHC verification procedure
  is used to evaluate seven-day track and intensity predictions for northern hemisphere TCs from May-November
  2023. Four open-source AIWP models are considered (FourCastNetv1, FourCastNetv2-small, GraphCast-operational
  and Pangu-Weather). The AIWP track forecast errors and detection rates are comparable to those from
  the best-performing operational forecast models. However, the AIWP intensity forecast errors are larger
  than those of even the simplest intensity forecasts based on climatology and persistence. The AIWP models
  almost always reduce the TC intensity, especially within the first 24 h of the forecast, resulting in
  a substantial low bias. The contribution of the AIWP models to the NHC model consensus was also evaluated.
  The consensus track errors are reduced by up to 11% at the longer time periods. The five-day NHC official
  track forecasts have improved by about 2% per year since 2001, so this represents more than a five-year
  gain in accuracy. Despite substantial negative intensity biases, the AIWP models have a neutral impact
  on the intensity consensus. These results show that the current formulation of the AIWP models have
  promise for operational TC track forecasts, but improved bias corrections or model reformulations will
  be needed for accurate intensity forecasts.
