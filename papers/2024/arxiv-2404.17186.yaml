summary: Multi-frame encoder-decoder network detects mesoscale convective systems in FY-4A satellite imagery
  using spatiotemporal attention, and releases the MCSRSI dataset.
abstract: The accurate detection of Mesoscale Convective Systems (MCS) is crucial for meteorological monitoring
  due to their potential to cause significant destruction through severe weather phenomena such as hail,
  thunderstorms, and heavy rainfall. However, the existing methods for MCS detection mostly targets on
  single-frame detection, which just considers the static characteristics and ignores the temporal evolution
  in the life cycle of MCS. In this paper, we propose a novel encoder-decoder neural network for MCS detection(MCSDNet).
  MCSDNet has a simple architecture and is easy to expand. Different from the previous models, MCSDNet
  targets on multi-frames detection and leverages multi-scale spatiotemporal information for the detection
  of MCS regions in remote sensing imagery(RSI). As far as we know, it is the first work to utilize multi-scale
  spatiotemporal information to detect MCS regions. Firstly, we design a multi-scale spatiotemporal information
  module to extract multi-level semantic from different encoder levels, which makes our models can extract
  more detail spatiotemporal features. Secondly, a Spatiotemporal Mix Unit(STMU) is introduced to MCSDNet
  to capture both intra-frame features and inter-frame correlations, which is a scalable module and can
  be replaced by other spatiotemporal module, e.g., CNN, RNN, Transformer and our proposed Dual Spatiotemporal
  Attention(DSTA). This means that the future works about spatiotemporal modules can be easily integrated
  to our model. Finally, we present MCSRSI, the first publicly available dataset for multi-frames MCS
  detection based on visible channel images from the FY-4A satellite. We also conduct several experiments
  on MCSRSI and find that our proposed MCSDNet achieve the best performance on MCS detection task when
  comparing to other baseline methods.
