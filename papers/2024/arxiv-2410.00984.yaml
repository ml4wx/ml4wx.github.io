summary: Compares Gaussian, interpretable NN, scattering transform and CNN models for probabilistic French
  heatwave forecasts; ScatNet matches CNN accuracy with greater transparency.
abstract: When performing predictions that use Machine Learning (ML), we are mainly interested in performance
  and interpretability. This generates a natural trade-off, where complex models generally have higher
  skills but are harder to explain and thus trust. Interpretability is particularly important in the climate
  community, where we aim at gaining a physical understanding of the underlying phenomena. Even more so
  when the prediction concerns extreme weather events with high impact on society. In this paper, we perform
  probabilistic forecasts of extreme heatwaves over France, using a hierarchy of increasingly complex
  ML models, which allows us to find the best compromise between accuracy and interpretability. More precisely,
  we use models that range from a global Gaussian Approximation (GA) to deep Convolutional Neural Networks
  (CNNs), with the intermediate steps of a simple Intrinsically Interpretable Neural Network (IINN) and
  a model using the Scattering Transform (ScatNet). Our findings reveal that CNNs provide higher accuracy,
  but their black-box nature severely limits interpretability, even when using state-of-the-art Explainable
  Artificial Intelligence (XAI) tools. In contrast, ScatNet achieves similar performance to CNNs while
  providing greater transparency, identifying key scales and patterns in the data that drive predictions.
  This study underscores the potential of interpretability in ML models for climate science, demonstrating
  that simpler models can rival the performance of their more complex counterparts, all the while being
  much easier to understand. This gained interpretability is crucial for building trust in model predictions
  and uncovering new scientific insights, ultimately advancing our understanding and management of extreme
  weather events.
