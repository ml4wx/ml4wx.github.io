summary: Comparison of Pangu-Weather, GraphCast and IFS HRES finds data-driven models mostly beat IFS
  on global RMSE for 1-10 day forecasts and compete on temperature and wind extremes.
abstract: The last few years have witnessed the emergence of data-driven weather forecast models capable
  of competing with – and, in some respects, outperforming – physics-based numerical models. However,
  recent studies have questioned the capability of data-driven models to provide reliable forecasts of
  extreme events. Here, we aim to evaluate this claim by comparing the performance of leading data-driven
  models in a semi-operational setting, focusing on the prediction of near-surface temperature and wind
  speed extremes globally. We find that data-driven models mostly outperform ECMWF’s physics-based deterministic
  model in terms of global RMSE for forecasts made 1–10 d ahead and that they can also compete in terms
  of extreme weather predictions in most regions. However, the performance of data-driven models varies
  by region, type of extreme event, and forecast lead time. Notably, data-driven models appear to perform
  best for temperature extremes in regions closer to the tropics and at shorter lead times. We conclude
  that data-driven models may already be a useful complement to physics-based forecasts in regions where
  they display superior tail performance but note that some challenges still need to be overcome prior
  to operational implementation.
