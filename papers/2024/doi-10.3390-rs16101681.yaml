summary: DR2A-UNet with recurrent residual attention gates extrapolates radar echoes for nowcasting, outperforming
  U-Net, U-Net++ and ConvLSTM especially for intense rainfall.
abstract: Rainfall nowcasting is the basis of extreme rainfall monitoring, flood prevention, and water
  resource scheduling. Based on the structural features of the U-Net model, we proposed the Double Recurrent
  Residual Attention Gates U-Net (DR2A-UNet) deep-learning model to carry out radar echo extrapolation.
  The model was trained with mean square error (MSE) and balanced mean square error (BMSE) as loss functions,
  respectively. The dynamic Z-R relationship was applied for quantitative rainfall estimation. The reference
  U-Net model, U-Net++, and the ConvLSTM were used as control experiments to carry out radar echo extrapolation.
  The results showed that the model trained by BMSE had better extrapolation. For 1 h lead time, the rainfall
  nowcasted by each model could reflect the actual rainfall process. DR2A-UNet performed significantly
  better than other models for intense rainfall, with a higher extrapolation accuracy for echo intensity
  and variability processes. At the 2 h lead time, the nowcast accuracy of each model was significantly
  reduced, but the echo extrapolation and rainfall nowcasting of DR2A-UNet were better.
