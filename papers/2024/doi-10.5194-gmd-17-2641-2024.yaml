summary: XGBoost with SHAP attributes Southern Ocean cloud radiative biases in an atmosphere model to
  cloud property biases, explaining up to 55% of variance.
abstract: Abstract. The evaluation and quantification of Southern Ocean cloud-radiation interactions simulated
  by climate models is essential in understanding the sources and magnitude of the radiative bias that
  persists in climate models for this region. To date, most evaluation methods focus on specific synoptic
  or cloud type conditions and are unable to quantitatively define the impact of cloud properties on the
  radiative bias whilst considering the system as a whole. In this study, we present a new method of model
  evaluation, using machine learning, that can at once identify complexities within a system and individual
  contributions. To do this, we use an XGBoost model to predict the radiative bias within a nudged version
  of the Australian Community Climate and Earth System Simulator – Atmosphere-only Model, using cloud
  property biases as predictive features. We find that the XGBoost model can explain up to 55 % of the
  radiative bias from these cloud properties alone. We then apply SHapley Additive exPlanations feature
  importance analysis to quantify the role each cloud property bias plays in predicting the radiative
  bias. We find that biases in liquid water path is the largest contributor to the cloud radiative bias
  over the Southern Ocean, though important regional and cloud-type dependencies exist. We then test the
  usefulness of this method in evaluating model perturbations and find that it can clearly identify complex
  responses, including cloud property and cloud-type compensating errors.
