summary: EPT-1.5 earth system transformer beats GraphCast, FuXi, Pangu-Weather and IFS HRES on 10m and
  100m wind speed for European energy users.
abstract: We announce the release of EPT-1.5, the latest iteration in our Earth Physics Transformer (EPT)
  family of foundation AI earth system models. EPT-1.5 demonstrates substantial improvements over its
  predecessor, EPT-1. Built specifically for the European energy industry, EPT-1.5 shows remarkable performance
  in predicting energy-relevant variables, particularly 10m & 100m wind speed and solar radiation. Especially
  in wind prediction, it outperforms existing AI weather models like GraphCast, FuXi, and Pangu-Weather,
  as well as the leading numerical weather model, IFS HRES by the European Centre for Medium-Range Weather
  Forecasts (ECMWF), setting a new state of the art.
