summary: A machine-learned landslide hazard indicator driven by downscaled large-ensemble precipitation
  projects increasing landslide hazard across most of High Mountain Asia by 2100.
abstract: Abstract High Mountain Asia has long been known as a hotspot for landslide risk, and studies
  have suggested that landslide hazard is likely to increase in this region over the coming decades. Extreme
  precipitation may become more frequent, with a nonlinear response relative to increasing global temperatures.
  However, these changes are geographically varied. This article maps probable changes to landslide hazard,
  as shown by a landslide hazard indicator (LHI) derived from downscaled precipitation and temperature.
  In order to capture the nonlinear response of slopes to extreme precipitation, a simple machine‐learning
  model was trained on a database of landslides across High Mountain Asia to develop a regional LHI. This
  model was applied to statistically downscaled data from the 30 members of the Seamless System for Prediction
  and Earth System Research large ensembles to produce a range of possible outcomes under the Shared Socioeconomic
  Pathways 2‐4.5 and 5‐8.5. The LHI reveals that landslide hazard will increase in most parts of High
  Mountain Asia. Absolute increases will be highest in already hazardous areas such as the Central Himalaya,
  but relative change is greatest on the Tibetan Plateau. Even in regions where landslide hazard declines
  by year 2100, it will increase prior to the mid‐century mark. However, the seasonal cycle of landslide
  occurrence will not change greatly across High Mountain Asia. Although substantial uncertainty remains
  in these projections, the overall direction of change seems reliable. These findings highlight the importance
  of continued analysis to inform disaster risk reduction strategies for stakeholders across High Mountain
  Asia.
