abstract: 'Tellus A: Dynamic Meteorology and Oceanography is an open access journal focusing on all aspects
  of atmospheric dynamics related to Earth science processes. Tellus A, along with its sister journal
  Tellus B: Chemical and Physical Meteorology, are international, peer-reviewed journals of the International
  Meteorological Institute in Stockholm, an independent not-for-profit body integrated into the Department
  of Meteorology at the Faculty of Sciences of Stockholm University, Sweden. The two journals serve an
  international community of researchers, policymakers, managers, media and the general public. Together
  they promote the exchange of knowledge about meteorology from across a range of scientific sub-disciplines.
  Topics covered in Tellus A include:dynamic meteorology | physical oceanography | data assimilation techniques
  | numerical weather prediction | climate dynamics | climate modelling and observation. Types of papers
  accepted include original research papers, review articles, brief research notes, Letters to the Editor,
  and special issues and conference proceedings (from time to time). The journal operates a single-blind
  peer-review policy. All published articles are made freely and permanently available online through
  gold open access publication with a CC BY license. Read the Guidelines for Authors for more information
  on how to submit your manuscript for review.'
