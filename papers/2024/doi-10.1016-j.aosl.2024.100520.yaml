summary: CNN regression corrects dynamical S2S circulation fields, raising weekly East Asian summer monsoon
  precipitation correlation from 0.30 to 0.35 at one-week lead.
abstract: Accurate subseasonal forecasting of East Asian summer monsoon (EASM) precipitation is crucial,
  as it directly impacts the livelihoods of billions. However, the prediction skill of state-of-the-art
  subseasonal-to-seasonal (S2S) models for precipitation remains limited. In this study, we developed
  a convolutional neural network (CNN) regression model to enhance the prediction skill for weekly EASM
  precipitation by utilizing the more reliably predicted circulation fields from dynamic models. The outcomes
  of the CNN model are promising, as it led to a 14% increase in the anomaly correlation coefficient (ACC),
  from 0.30 to 0.35, and a 22% reduction in the root-mean-square error (RMSE), from 3.22 to 2.52, for
  predicting the weekly EASM precipitation index at a leading time of one week. Among the S2S models,
  the improvement in prediction skill through CNN correction depends on the model's performance in accurately
  predicting circulation fields. The CNN correction of EASM precipitation index can only rectify the systematic
  errors of the model and is independent of whether we correct each grid point or the entire area-averaged
  index. Furthermore, u200 (200-hPa zonal wind) is identified as the most important variable for efficient
  correction. 东亚夏季风(EASM)降水的准确次季节预报至关重要, 因为它直接影响着数十亿人的生计.然而, 最先进的次季节-季节(S2S)预测模型的预测技巧仍然有限.本研究开发了一种卷积神经网络(CNN)回归模型,
  通过利用动力预测模型预测的更可靠的环流场来提高EASM周降水的预测技巧.经过CNN模型的订正, 在提前一周预测EASM降水指数时, 11个S2S模式的平均距平相关系数从增加了14%, 从0.30增加到0.35;均方根误差减少了22%,
  从3.22减少到2.52.在这些S2S模式中, 通过CNN订正对预测技巧的提高程度取决于模式在准确预测大气环流变量方面的表现.对EASM降水指数的CNN订正只能订正模式的系统误差, 与逐个网格订正还是整个区域平均指数订正无关,
  并且在不同的提前期内CNN的订正效果基本不变.此外, 200hPa纬向风被认为是有效订正的最重要变量.
