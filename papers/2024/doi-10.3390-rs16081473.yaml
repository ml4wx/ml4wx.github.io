summary: A U-Net replaces the spectral centroid algorithm for incoherent Doppler wind lidar, giving more
  accurate wind profiles in low signal-to-noise regions.
abstract: The rapid development of artificial intelligence (AI) and deep learning has revolutionized the
  field of data analysis in recent years, including signal data acquired by remote sensors. Light Detection
  and Ranging (LiDAR) technology is widely used in atmospheric research for measuring various atmospheric
  parameters. Wind measurement using LiDAR data has traditionally relied on the spectral centroid (SC)
  algorithm. However, this approach has limitations in handling LiDAR data, particularly in low signal-to-noise
  ratio (SNR) regions. To overcome these limitations, this study leverages the capabilities of customized
  deep-learning techniques to achieve accurate wind profile reconstruction. The study uses datasets obtained
  from the European Centre for Medium Weather Forecasting (ECMWF) Reanalysis v5 (ERA5) and the mobile
  Incoherent Doppler LiDAR (ICDL) system constructed by the University of Science and Technology of China.
  We present a simulation-based approach for generating wind profiles from the statistical data and the
  associated theoretical calculations. Whereafter, our team constructed a convolutional neural network
  (CNN) model based on the U-Net architecture to replace the SC algorithm for LiDAR data post-processing.
  The CNN-generated results are evaluated and compared with the SC results and the ERA5 data. This study
  highlights the potential of deep learning-based techniques in atmospheric research and their ability
  to provide more accurate and reliable results.
