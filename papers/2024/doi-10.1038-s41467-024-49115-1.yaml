summary: Shows tropical cyclone heavy-rain footprint grows 0.34 km per year globally; XGBoost identifies
  wind speed and SST as main controls.
abstract: Abstract Precipitation from tropical cyclones (TCs) can cause massive damage from inland floods
  and is becoming more intense under a warming climate. However, knowledge gaps still exist in changes
  of spatial patterns in heavy TC precipitation. Here we define a metric, DIST30, as the mean radial distance
  from centers of clustered heavy rainfall cells (> 30 mm/3 h) to TC center, representing the footprint
  of heavy TC precipitation. There is significant global increase in DIST30 at a rate of 0.34 km/year.
  Increases of DIST30 cover 59.87% of total TC impact areas, with growth especially strong in the Western
  North Pacific, Northern Atlantic, and Southern Pacific. The XGBoost machine learning model showed that
  monthly DIST30 variability is majorly controlled by TC maximum wind speed, location, sea surface temperature,
  vertical wind shear, and total water column vapor. TC poleward migration in the Northern Hemisphere
  contributes substantially to the DIST30 upward trend globally.
