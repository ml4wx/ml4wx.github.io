summary: CNN statistical downscaling of WRF 3 km precipitation to 1 km over Jiangsu, with a 4 to 7 layer
  comparison giving mean errors of 8.86 to 9.71 mm.
abstract: High-resolution precipitation forecasts play a pivotal role in formulating comprehensive disaster
  prevention and mitigation plans. As spatial resolution enhances, striking a balance between computation,
  storage, and simulation accuracy becomes imperative to ensure optimal cost-effectiveness. Convolutional
  neural networks (CNNs), a cornerstone of deep learning, are examined in this study for their downscaling
  capabilities in precipitation simulation. During a precipitation event on 23 June 2022, in Jiangsu Province,
  China, distinct rain belts emerged in both southern and northern Jiangsu, precisely captured by a numerical
  model (the Weather Research and Forecasting, WRF) with a 3 km spatial resolution. Specifically, precipitation
  was prevalent in northern Jiangsu from 00:00 to 11:00 Beijing Time (BJT), transitioning to southern
  Jiangsu from 12:00 to 23:00 BJT on the same day. Upon dynamic downscaling, the model reproduced precipitation
  in these periods with an average error of 12.35 mm at 3 km and 12.48 mm at 1 km spatial resolutions.
  Employing CNN technology for statistical downscaling to a 1 km spatial resolution, samples from the
  initial period were utilized for training, while those from the subsequent period served for validation.
  Following dynamic downscaling, CNNs with four, five, six, and seven layers exhibited average errors
  of 8.86 mm, 8.93 mm, 9.71 mm, and 9.70 mm, respectively, accompanied by correlation coefficients of
  0.550, 0.570, 0.574, and 0.578, respectively. This analysis indicates that for this precipitation event,
  a shallower CNN depth yields a lower average error and correlation coefficient, whereas a deeper architecture
  enhances the correlation coefficient. By employing deep network architectures, CNNs are capable of capturing
  nonlinear patterns and subtle local features from complex meteorological data, thereby providing more
  accurate predictions during the downscaling process. Leveraging faster computation and reduced storage
  requirements, machine learning has demonstrated immense potential in high-resolution forecasting research.
  There is significant scope for advancing technologies that integrate numerical models with machine learning
  to achieve higher-resolution numerical forecasts.
