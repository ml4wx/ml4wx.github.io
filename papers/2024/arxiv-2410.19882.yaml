summary: Five recommendations for standardized, independent evaluation of ML-based Earth system models,
  stressing physical consistency for climate projections without historical analogues.
abstract: Machine learning (ML) is a revolutionary technology with demonstrable applications across multiple
  disciplines. Within the Earth science community, ML has been most visible for weather forecasting, producing
  forecasts that rival modern physics-based models. Given the importance of deepening our understanding
  and improving predictions of the Earth system on all time scales, efforts are now underway to develop
  forecasting models into Earth-system models (ESMs), capable of representing all components of the coupled
  Earth system (or their aggregated behavior) and their response to external changes. Modeling the Earth
  system is a much more difficult problem than weather forecasting, not least because the model must represent
  the alternate (e.g., future) coupled states of the system for which there are no historical observations.
  Given that the physical principles that enable predictions about the response of the Earth system are
  often not explicitly coded in these ML-based models, demonstrating the credibility of ML-based ESMs
  thus requires us to build evidence of their consistency with the physical system. To this end, this
  paper puts forward five recommendations to enhance comprehensive, standardized, and independent evaluation
  of ML-based ESMs to strengthen their credibility and promote their wider use.
