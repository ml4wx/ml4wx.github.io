summary: NeuralGCM reproduces the 2021 Pacific Northwest heatwave and gives stable mid-century projections,
  but underestimates warming because it lacks land feedbacks.
abstract: AI-based weather and climate models are emerging as accurate and computationally efficient tools.
  Beyond weather forecasting, they also show promise to accelerate storyline analyses. We evaluate NeuralGCM’s
  ability to simulate an extreme heatwave against the Energy Exascale Earth System Model (E3SM), a physics-based
  climate model. NeuralGCM accurately replicates the targeted event, and generates stable and realistic
  mid-century projections. However, due to the absence of land feedbacks, NeuralGCM underestimates the
  projected warming amplitude compared to physics-based model references.
