summary: MAM4WF combines masked modeling with autoregressive and lead-time embedding to reduce error accumulation
  in data-driven weather forecasts.
abstract: The growing impact of global climate change amplifies the need for accurate and reliable weather
  forecasting. Traditional autoregressive approaches, while effective for temporal modeling, suffer from
  error accumulation in long-term prediction tasks. The lead time embedding method has been suggested
  to address this issue, but it struggles to maintain crucial correlations in atmospheric events. To overcome
  these challenges, we propose the Masked Autoregressive Model for Weather Forecasting (MAM4WF). This
  model leverages masked modeling, where portions of the input data are masked during training, allowing
  the model to learn robust spatiotemporal relationships by reconstructing the missing information. MAM4WF
  combines the advantages of both autoregressive and lead time embedding methods, offering flexibility
  in lead time modeling while iteratively integrating predictions. We evaluate MAM4WF across weather,
  climate forecasting, and video frame prediction datasets, demonstrating superior performance on five
  test datasets.
