summary: Machine learning shows weather and environment, not socio-economic factors, mainly explain county-level
  tropical cyclone power outage duration and customer loss across 20 storms.
abstract: Abstract Tropical cyclones are the leading cause of major power outages in the U.S., and their
  effects can be devastating for communities. However, few studies have holistically examined the degree
  to which socio-economic variables can explain spatial variations in disruptions and reveal potential
  inequities thereof. Here, we apply machine learning techniques to analyze 20 tropical cyclones and predict
  county-level outage duration and percentage of customers losing power using a comprehensive set of weather,
  environmental, and socio-economic factors. Our models are able to accurately predict these outage response
  variables, but after controlling for the effects of weather conditions and environmental factors in
  the models, we find the effects of socio-economic variables to be largely immaterial. However, county-level
  data could be overlooking effects of socio-economic disparities taking place at more granular spatial
  scales, and we must remain aware of the fact that when faced with similar outage events, socio-economically
  vulnerable communities will still find it more difficult to cope with disruptions compared to less vulnerable
  ones.
