summary: Pixelwise convolutional LSTM nowcasts heavy rainfall over Korea, beating the McGill ANLLS Lagrangian
  method at 10-60 minute leads.
abstract: The recent decades have seen an increasing academic interest in leveraging machine learning
  approaches to nowcast, or forecast in a highly short-term manner, precipitation at a high resolution,
  given the limitations of the traditional numerical weather prediction models on this task. To capture
  the spatiotemporal associations of data on input variables, a deep learning (DL) architecture with the
  combination of a convolutional neural network and a recurrent neural network (RNN) can be an ideal design
  for nowcasting rainfall. In this study, a long short-term memory (LSTM) modeling structure was proposed
  with convolutional operations on input variables. To resolve the issue of underestimation of heavy rainfall
  that challenges most of the DL models, a pixelwise modeling approach was adopted to facilitate a stratified
  sampling process in generating training data points for calibrating models to predict rain rates at
  locations. The proposed pixelwise convolutional LSTM (CLSTM) models were applied to data on mesoscale
  convective systems during the warm seasons over the Korean Peninsula. Results showed a significant and
  consistent improvement in prediction skill scores produced by the CLSTM models than a traditional rainfall
  nowcasting method, the McGill Algorithm for Precipitation Nowcasting by Lagrangian Extrapolation, across
  all considered lead times from 10 to 60 minutes. Future work needs to reduce the relatively large false
  positive rates produced by the CLSTM models and their blurring effect in mapping spatial distributions
  of rain rates, in particular for longer lead times.
