summary: YingLong is a 3 km AI limited-area model that beats WRF-ARW on surface wind speed in two domains
  while running much faster, using Pangu-Weather boundaries.
abstract: Recently, artificial intelligence-based (AI-based) models for forecasting of global weather
  have been rapidly developed. Most of the global models are trained on reanalysis datasets with a spatial
  resolution of 0.25°*0.25°. However, research on AI-based high spatial resolution limited area weather
  forecasting models remains limited. In this study, YingLong, an AI-based limited area weather forecasting
  model with a spatial resolution of 3 km * 3 km is developed. YingLong employs a parallel structure of
  global and local blocks to capture multiscale meteorological features and operates much faster than
  the dynamical limited area model WRF-ARW. In two selected limited areas (one relatively flat and the
  other featuring significant mountain ranges), YingLong (with lateral boundary condition imposed by the
  global AI-based model Pangu-weather) demonstrates superior skill in forecasting surface wind speed compared
  to WRF-ARW. Additionally, it shows comparable skill in forecasting surface temperature and pressure.
  The accuracy of surface temperature and humidity forecasts can be further improved by applying better
  boundary conditions. YingLong also addresses issues related to the lateral boundary conditions of AI-based
  limited area models, such as selecting the width of the lateral boundary region and combining finer
  and coarser resolution predictions in this region. Therefore, YingLong has a great potential to generate
  cost-effective multiyear high-resolution synthetic wind speed that maintain meteorological realism both
  spatially and temporally, aiding in the planning and operations for wind power generation companies.
