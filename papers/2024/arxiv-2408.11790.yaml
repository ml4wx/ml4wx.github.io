summary: A statistical-physical adversarial downscaling method projects Bangladesh extreme rainfall to
  rise about 50 mm/day at the 100-year return period mid-century.
abstract: In Bangladesh, a nation vulnerable to climate change, accurately quantifying the risk of extreme
  weather events is crucial for planning effective adaptation and mitigation strategies. Downscaling coarse
  climate model projections to finer resolutions is key in improving risk and uncertainty assessments.
  This work develops a new approach to rainfall downscaling by integrating statistics, physics, and machine
  learning and applies it to assess Bangladesh's extreme rainfall risk. Our method successfully captures
  the observed spatial pattern and risks associated with extreme rainfall in the present climate. It also
  produces uncertainty estimates by rapidly downscaling multiple models in a future climate scenario(s).
  Our analysis reveals that the risk of extreme rainfall is projected to increase throughout Bangladesh
  mid-century, with the highest risk in the northeast. The daily maximum rainfall at a 100-year return
  period is expected to rise by approximately 50 mm per day. However, using multiple climate models also
  indicates considerable uncertainty in the projected risk.
