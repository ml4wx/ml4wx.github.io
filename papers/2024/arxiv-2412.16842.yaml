summary: Low-cost IoT rain gauge network with graph neural network predicts regional heavy rainfall events
  from 72 months of daily station data, targeting data-sparse rural areas.
abstract: 'Accurate and timely prediction of heavy rainfall events is crucial for effective flood risk
  management and disaster preparedness. By monitoring, analysing, and evaluating rainfall data at a local
  level, it is not only possible to take effective actions to prevent any severe climate variation but
  also to improve the planning of surface and underground hydrological resources. However, developing
  countries often lack the weather stations to collect data continuously due to the high cost of installation
  and maintenance. In light of this, the contribution of the present paper is twofold: first, we propose
  a low-cost IoT system for automatic recording, monitoring, and prediction of rainfall in rural regions.
  Second, we propose a novel approach to regional heavy rainfall prediction by implementing graph neural
  networks (GNNs), which are particularly well-suited for capturing the complex spatial dependencies inherent
  in rainfall patterns. The proposed approach was tested using a historical dataset spanning 72 months,
  with daily measurements, and experimental results demonstrated the effectiveness of the proposed method
  in predicting heavy rainfall events, making this approach particularly attractive for regions with limited
  resources or where traditional weather radar or station coverage is sparse.'
