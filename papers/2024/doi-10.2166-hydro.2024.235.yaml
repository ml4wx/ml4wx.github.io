summary: ConvLSTM rainfall nowcasting on NASA satellite precipitation tests eight interpolation-based
  augmentations; augmentation cut error by 59% in one Turkish region but not the other.
abstract: Abstract The significance of improving rainfall prediction methods has escalated due to climate
  change-induced flash floods and severe flooding. In this study, rainfall nowcasting has been studied
  utilizing NASA Giovanni satellite-derived precipitation products and the convolutional long short-term
  memory (ConvLSTM) approach. The goal of the study is to assess the impact of data augmentation on flood
  nowcasting. Due to data requirements of deep learning-based prediction methods, data augmentation is
  performed using eight different interpolation techniques. Spatial, temporal, and spatio-temporal interpolated
  rainfall data are used to conduct a comparative analysis of the results obtained through nowcasting
  rainfall. This research examines two catastrophic floods that transpired in Türkiye Marmara Region in
  2009 and the Central Black Sea Region in 2021, which are selected as the focal case studies. The Marmara
  and Black Sea regions are prone to frequent flooding, which, due to the dense population, has devastating
  consequences. Furthermore, these regions exhibit distinct topographical characteristics and precipitation
  patterns, and the frontal systems that impact them are also dissimilar. The nowcast results for the
  two regions exhibit a significant difference. Although data augmentation significantly reduced the error
  values by 59% for one region, it did not yield the same effectiveness for the other region.
