summary: Explainable machine learning with SHAP on satellite data shows higher droplet number raises liquid
  water path and reduces precipitating fraction in marine stratocumulus.
abstract: Aerosol–cloud–precipitation interactions (ACI) are a known major cause of uncertainties in simulations
  of the future climate. An improved understanding of the in-cloud processes accompanying ACI could help
  in advancing their implementation in global climate models. This is especially the case for marine stratocumulus
  clouds, which constitute the most common cloud type globally. In this work, a dataset composed of satellite
  observations and reanalysis data is used in explainable machine learning models to analyze the relationship
  between the cloud droplet number concentration (Nd), cloud liquid water path (LWP), and the fraction
  of precipitating clouds (PF) in five distinct marine stratocumulus regions. This framework makes use
  of Shapley additive explanation (SHAP) values, allowing to isolate the impact of Nd from other confounding
  factors, which proved to be very difficult in previous satellite-based studies. All regions display
  a decrease of PF and an increase in LWP with increasing Nd, despite marked inter-regional differences
  in the distribution of Nd. Polluted (high Nd) conditions are characterized by an increase of 12 gm−2
  in LWP and a decrease of 0.13 in PF on average when compared to pristine (low Nd) conditions. The negative
  Nd–PF relationship is stronger in high LWP conditions, while the positive Nd–LWP relationship is amplified
  in precipitating clouds. These findings indicate that precipitation suppression plays an important role
  in MSC adjusting to aerosol-driven perturbations in Nd.
