summary: Combines ARMA with a BP neural network to predict daily mean temperature in Hangzhou from 2013–2022
  data, improving accuracy over ARMA alone.
abstract: Weather changes have an important impact on human production and life as well as socio-economic
  activities. In recent years, people have also gradually paid attention to the study of weather, especially
  the study of temperature, and it is of great practical significance to find an accurate temperature
  prediction model. At the same time, the use of machine learning methods to construct a temperature model
  can predict temperature changes more accurately and quickly, and provide a more reliable basis for weather
  forecasting. Therefore, in response to the unsatisfactory accuracy of temperature prediction by traditional
  prediction models, this paper uses the time series of daily average temperature of Hangzhou City, China,
  from 2013 to 2022 as the sample data, and combines the traditional ARMA model with the BP neural network
  model, which enables the BP neural network model to better fit and predict the temperature changes.
  The study shows that the prediction accuracy of the BP neural network model is significantly improved
  compared with the ARMA model.
