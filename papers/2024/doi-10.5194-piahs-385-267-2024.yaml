summary: A hybrid EEMD-NARX neural network uses MEI and SOI climate indices to forecast monthly precipitation
  in northern Tunisia with correlations of 0.7 to 0.8.
abstract: Much of northern Tunisia regularly experiences extremes of drought and flooding, with high rainfall
  variability. The development of reliable and accurate seasonal rainfall forecasts can provide valuable
  information to help mitigate some of the outcome of floods and enhance water management and monitoring,
  particularly for agriculture. Whether climate indices oscillations contain some information to be useful
  for hydrological forecasting is worth investigating. Ensemble monthly rainfall forecasts are carried
  out using a hybrid neural network model. The hybrid model called EEMD-NARX based on a non-linear autoregressive
  network with exogenous inputs (NARX) coupled to Ensemble Empirical Mode Decomposition (EEMD) method
  is developed in this work. First, the EEMD is performed to extract significant information from modes
  of variability (IMF) associated to climate indices and precipitation. Each IMF of selected indices as
  well as precipitation IMFs are then used as inputs to the NARX forecasting model to forecast each IMF
  of precipitation. To make forecasts operational, we reconstruct precipitation by summing of all forecasted
  IMFs to make comparison with observed precipitation in the Medjerda river basin located in north Tunisia.
  Results show that IMFs of MEI and SOI indices can be distinguished from a white noise at the 95 % level.
  It is also found that an oscillatory forcing coming from the Atlantic influences the precipitation in
  the Mediterranean basin. The results indicate that exogenous inputs like climatic indices improve the
  accuracy of forecasts in some in some precipitation stations. The correlation coefficient between observed
  and forecasted monthly precipitation is ranging from 0.7 to 0.8. EEMD allows extracting significant
  components from exogenous inputs like climate indices that help reducing predictive uncertainty as well
  as improving forecasts of a NARX model at longer lead-times.
