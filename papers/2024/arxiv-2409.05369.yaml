summary: A 3D transformer predicts global S2S sea surface temperature, improving one to three month skill
  by 13.7% to 77.1% over physics-based models in seven ocean regions.
abstract: Accurate prediction of global sea surface temperature at sub-seasonal to seasonal (S2S) timescale
  is critical for drought and flood forecasting, as well as for improving disaster preparedness in human
  society. Government departments or academic studies normally use physics-based numerical models to predict
  S2S sea surface temperature and corresponding climate indices, such as El Niño-Southern Oscillation.
  However, these models are hampered by computational inefficiencies, limited retention of ocean-atmosphere
  initial conditions, and significant uncertainty and biases. Here, we introduce a novel three-dimensional
  deep learning neural network to model the nonlinear and complex coupled atmosphere-ocean weather systems.
  This model incorporates climatic and temporal features and employs a self-attention mechanism to enhance
  the prediction of global S2S sea surface temperature pattern. Compared to the physics-based models,
  it shows significant computational efficiency and predictive capability, improving one to three months
  sea surface temperature predictive skill by 13.7% to 77.1% in seven ocean regions with dominant influence
  on S2S variability over land. This achievement underscores the significant potential of deep learning
  for largely improving forecasting skills at the S2S scale over land.
