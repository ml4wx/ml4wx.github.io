summary: Review of machine and deep learning next-frame prediction networks for radar-based rainfall nowcasting,
  comparing their advantages and disadvantages.
abstract: 'Weather is influenced by several factors such as temperature, pressure, air movement, moisture/water
  vapor, and the Earth''s rotation. Forecasting weather with high geographic precision is both challenging
  and computationally demanding. This study explores a nowcasting method for meteorological radar images.
  Building on the concept of an unsupervised representation problem in deep learning, next-frame prediction
  is an emerging area in computer vision where future images are predicted based on previous ones. This
  has numerous applications, including in robotics and autonomous driving. The paper reviews the latest
  next-frame prediction networks, categorizing them into two main approaches: machine learning and deep
  learning. It compares these strategies by discussing their respective advantages and disadvantages.
  Lastly, the paper outlines the most promising directions for future research.'
