summary: Two-dimensional framework for reproducing and replicating atmospheric prediction studies, drawn
  from reproducing an operational tropical cyclogenesis product; a position piece with no quantitative
  result.
abstract: 'While extensive guidance exists for ensuring the reproducibility of one''s own study, there
  is little discussion regarding the reproduction and replication of external studies within one''s own
  research. To initiate this discussion, drawing lessons from our experience reproducing an operational
  product for predicting tropical cyclogenesis, we present a two-dimensional framework to offer guidance
  on reproduction and replication. Our framework, representing model fitting on one axis and its use in
  inference on the other, builds upon three key aspects: the dataset, the metrics, and the model itself.
  By assessing the trajectories of our studies on this 2D plane, we can better inform the claims made
  using our research. Additionally, we use this framework to contextualize the utility of benchmark datasets
  in the atmospheric sciences. Our two-dimensional framework provides a tool for researchers, especially
  early career researchers, to incorporate prior work in their own research and to inform the claims they
  can make in this context.'
