summary: Multiscale deep learning using SST and satellite sea surface salinity extends ENSO forecast lead
  to 24 months, with SSS dominating forecasts beyond six months.
abstract: Significant strides have been made in understanding El Niño-Southern Oscillation (ENSO) dynamics,
  yet its long-lead prediction remains challenging, especially for the El Niño events after 2000. Sea
  surface salinity (SSS) is known to affect ENSO development and intensity by influencing ocean stratification
  and heat redistribution and therefore, when combined with sea surface temperature (SST) data, can potentially
  enhance ENSO forecast skill. In this study, we develop a deep learning (DL) model that incorporates
  a multiscale-pyramid structure and spatiotemporal feature extraction blocks, and the model successfully
  extends effective ENSO forecast lead time to 24 months for 2000–2021 with reduced effect of the spring
  predictability barrier (SPB). Interpretable methods are then applied to reveal the time-dependent roles
  of SST and SSS in ENSO forecast. More specifically, SST is critical for short-medium lead forecasts
  (<1 year), while SSS is important for medium-long lead forecasts (>6 months). Furthermore, we track
  global SST and SSS spatiotemporal shifts related to subsequent ENSO development, highlighting the importance
  of ocean inter-basin and tropics-extratropics interactions. With increasing availability of satellite
  SSS observations, our findings unveil unprecedented potential for advancing ENSO long-lead forecast
  skills.
