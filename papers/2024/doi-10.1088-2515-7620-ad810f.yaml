summary: Kolmogorov-Arnold networks correct GFS wind forecasts at Madeira airport, reducing 3-h nowcast
  MSE by 48.5% with interpretable symbolic formulas.
abstract: Abstract This study examines the application of machine learning to enhance wind nowcasting
  by using a Kolmogorov-Arnold Network model to improve predictions from the Global Forecast System at
  Madeira International Airport, a site affected by complex terrain. The research addresses the limitations
  of traditional numerical weather prediction models, which often fail to accurately forecast localized
  wind patterns. Using the Kolmogorov-Arnold Network model led to a substantial reduction in wind speed
  and direction forecast errors, with a performance that reached a 48.5% improvement to the Global Forecast
  System 3 h nowcast, considering the mean squared error. A key outcome of this study comes from the model’s
  ability to generate mathematical formulas that provide insights into the physical and mathematical dynamics
  influencing local wind patterns and improve the transparency, explainability, and interpretability of
  the employed machine learning models for atmosphere modeling.
