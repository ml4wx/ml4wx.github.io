summary: A hybrid CNN-LSTM forecasts Delhi daily temperature from 1996-2017 records, reporting RMSE of
  1.81 and outperforming traditional statistical baselines.
abstract: As global climate change intensifies, accurate weather forecasting is increasingly crucial for
  sectors such as agriculture, energy management, and environmental protection. Traditional methods, which
  rely on physical and statistical models, often struggle with complex, nonlinear, and time-varying data,
  underscoring the need for more advanced techniques. This study explores a hybrid CNN-LSTM model to enhance
  temperature forecasting accuracy for the Delhi region, using historical meteorological data from 1996
  to 2017. We employed both direct and indirect methods, including comprehensive data preprocessing and
  exploratory analysis, to construct and train our model. The CNN component effectively extracts spatial
  features, while the LSTM captures temporal dependencies, leading to improved prediction accuracy. Experimental
  results indicate that the CNN-LSTM model significantly outperforms traditional forecasting methods in
  terms of both accuracy and stability, with a mean square error (MSE) of 3.26217 and a root mean square
  error (RMSE) of 1.80615. The hybrid model demonstrates its potential as a robust tool for temperature
  prediction, offering valuable insights for meteorological forecasting and related fields. Future research
  should focus on optimizing model architecture, exploring additional feature extraction techniques, and
  addressing challenges such as overfitting and computational complexity. This approach not only advances
  temperature forecasting but also provides a foundation for applying deep learning to other time series
  forecasting tasks.
