summary: A genetic-algorithm-optimized cascaded neural network retrieves hurricane rain rates from Sentinel-1
  SAR, with 3.05 mm/h RMSE against SFMR observations.
abstract: Spaceborne synthetic aperture radar (SAR) is gradually being applied to hurricane observation
  because of its all-weather, high-resolution observation capability. In particular, the retrieval of
  rain rate using SAR images holds significant scientific and practical importance. However, accurately
  retrieving rain rate over the sea surface, particularly for high rain rate events under hurricane conditions,
  remains a significant challenge. The study proposes a new method for rain rate retrieval from hurricane
  SAR images. We've developed a cascaded feedforward neural network (CFNN) model that based on Sentinel-1's
  double-polarized C-band SAR images of 46 hurricanes to retrieve rain rate under hurricane conditions.
  In order to overcome the problem of local optimal solution of neural network, genetic algorithm is employed
  for optimized model parameter selection. Preliminary results indicate that this approach not only enhances
  the neural network's iteration speed but also improves its prediction accuracy. Compared with the rain
  rate of the Stepped-Frequency Microwave Radiometers (SFMR), the RMSE of retrieved rain rate is 3.05
  mm/hr and the correlation coefficient is 0.88. Furthermore, we independently verify rain rate during
  hurricane Douglas and compared with Global Precipitation Mission (GPM) 2ADPR rain rate product, the
  results demonstrate that our model can effectively retrieve rain rate in the range of 0∼60 mm/hr under
  hurricane conditions. The encouraging results prove the feasibility of the method in SAR rain rate retrieval.
