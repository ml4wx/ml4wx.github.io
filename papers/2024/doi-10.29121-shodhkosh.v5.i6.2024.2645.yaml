summary: Compares a modified BPN ANN with BiLSTM and GRU for district rainfall forecasting in Kabirdham,
  finding the ANN slightly better; a single-region study.
abstract: Deep learning has emerged as a key area for modeling and forecasting complex time series data.
  The future performance of Kabirdham rainfall data was investigated in this machine learning project.
  To construct and validate the model, the dataset is divided into 35% test sets and 65% training sets.
  We utilized the Root Mean Square Error (RMSE) measure to compare these deep learning models. In this
  data set, the Modified BPN ANN model performs better than the BILSTM and GRU models. The predictions
  of these three models are comparable. The development of a comprehensive Kabirdham weather forecast
  book might benefit from this knowledge. Scholars and policymakers would both benefit from this information.
  Beyond statistical methods, we think this study can be utilized to apply machine learning to complicated
  time series data.
