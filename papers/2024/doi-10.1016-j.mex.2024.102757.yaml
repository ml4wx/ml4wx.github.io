summary: Wavelet-hybrid LSTM and RBF networks forecast daily precipitation at central Thai stations, reaching
  R² of 0.96 and beating plain LSTM and MLP baselines.
abstract: Climate change and increasing water demands underscore the importance of water resource management.
  Precise precipitation forecasting is critical to effective management. This study introduced a Daily
  Precipitation Forecasting Hybrid (DPFH) technique for central Thailand, which uses three different input-based
  models to improve prediction accuracy. • The proposed methods precisely combine the biorthogonal wavelet
  transformation (BWT) function through BWT-RBFNN (Radial Basis Function Neural Networks) and (BWT-LSTM-RNN)Long
  Short-Term Memory Recurrent Neural Networks. Comparative analyses reveal that hybrid models perform
  better than conventional deep LSTM-RNN and Multilayer Perceptron Artificial Neural Networks (MLP-ANN).
  Although MLP-ANN showed moderate effectiveness, LSTM-RNN displayed notable enhancements, particularly
  evidenced by an impressive R 2 (0.96) in Model M-2. • The combination of BWT-LSTM-RNN yielded substantial
  enhancements, constantly surpassing standalone models. Specifically, DPFH-3 exhibited superior performance
  across multiple observation stations. • The findings emphasize the efficiency of the BWT-LSTM-RNN models
  in capturing varied precipitation patterns, highlighting their potential to significantly improve the
  accuracy of precipitation forecasts, particularly in the context of water resource management in central
  Thailand.
