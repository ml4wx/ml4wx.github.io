summary: Proposes an artificial neural network for rainfall forecasts about one month ahead of the monsoon
  in Kabirdham, Chhattisgarh; no quantitative results are reported.
abstract: Existing climate prediction models are physics-based and use supercomputers to predict future
  climate evolution. Physics-based predictions require improved atmospheric models, which can be challenging
  to find and develop, and improving the fundamental resolution of simulations can be computationally
  demanding. Measuring rainfall around the world has many scientific and social benefits. These benefits
  include of the processes that cause global climate change, increased precipitation and hydrological
  processes, improved weather information, Better identification of severe storms, including predictions
  of storm size and landfall. The Global Precipitation Measure (GPM) has completed the work of defining
  the scientific and metric goals and framework needed to achieve those goals. Precipitation forecasting
  is the prediction of the amount and type of precipitation (rain, snow, sleet, etc.) that will fall in
  a specific location over a certain period of time. This is typically done using numerical weather prediction
  models, which take into a wide range of atmospheric and oceanic data to make predictions about the weather.
  Precipitation forecast is the process that predicts the possibility of weather conditions at an exact
  time and place. An artificial neural network is a type of machine learning model that can be used for
  long-term precipitation forecasting. This model is trained on a large amount of historical weather data
  and uses this data to predict future rainfall. Artificial neural networks can be used to model complex
  and linear relationships between atmospheric and oceanic variables and precipitation. The Model may
  help us in forecasting long-range precipitation, approximately before one month of monsoon season over
  Kabirdham.
