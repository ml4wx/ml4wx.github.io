summary: Tuned Random Forest on Bangladesh historical rainfall records reports 91% wet-day accuracy, outperforming
  other tested regressors and classifiers.
abstract: This study aims to explore the integration of historical weather data with machine learning
  methods for better rainfall forecasting in Bangladesh. It has the potential to identify rainfall early
  by observing their prediction on preventing natural disasters. Weather forecasting protects human lives
  and property but often struggles with manual, error-prone calculations due to the complex data involved.
  This research combines weather forecasting with machine learning techniques to improve the accuracy
  and precision of predictions. The main goal is to develop an accurate prediction system of rainfall
  forecasting in Bangladesh for the future. The model training data set is from historical meteorologic
  records of Bangladesh. After neatly hyper-tuning the Random Forest model, we achieve some impressive
  RMSE metrics. The results are compared with a baseline model, Randomized Search CV, using different
  evaluation metrics such as MAE, MSLE, and RMSLE, etc., and the observations of significantly better
  performance is observable. An extensive analysis of machine learning techniques was performed in the
  domain of rainfall prediction. Among all the tried models, the Random Forest model gave perfect predictions,
  as noted by its MSE of 12245.52 and absolute error value of 64.25. Furthermore, there was excellent
  precision of 95% and recall 92%, respectively, for the classification of wet days, corresponding to
  a total accuracy score of 91%. Based on the above result, we can conclude that the Random Forest model
  is both robust and promising for rainfall prediction problems. Various models such as Linear Regression,
  Support Vector Regressor, Decision Tree, K-Nearest Neighbors, AdaBoost, XG Boost, Ridge, Linear SVR
  and MLP Regressor showed variations in prediction accuracies and errors. Nevertheless, the Random Forest
  came out as a better choice in this case, showing its superiority.
