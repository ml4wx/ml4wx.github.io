summary: Relevance vector machine with PCA-selected predictors downscales daily rainfall in Selangor,
  Malaysia, as a regional case study with NSE and RMSE evaluation.
abstract: Due to the discrepancy in resolution between existing global climate model output and the resolution
  required by decision-makers, there is a persistent need for climate downscaling. We conducted a study
  to determine the effectiveness of Relevant Vector Machine (RVM), one of the machine learning approaches,
  in outperforming existing statistical methods in downscaling historical rainfall data in the complex
  terrain of Selangor, Malaysia. While machine learning eliminates the requirement for manual feature
  selection when extracting significant information from predictor fields, considering multiple pivotal
  factors is essential. These factors include identifying relevant atmospheric features contributing to
  rainfall, addressing missing data, and developing a significant model to predict daily rainfall intensity
  using appropriate machine-learning techniques. The Principal Component Analysis (PCA) technique was
  employed to choose relevant environmental variables as input for the machine learning model, and various
  imputation methods were utilized to manage missing data, such as mean imputation and the KNN algorithm.
  To assess the performance of the RVM-based rainfall model, we collected a dataset from the Department
  of Irrigation and Drainage Malaysia. We used Nash-Sutcliffe Efficiency (NSE) and Root Mean Square Error
  (RMSE) as evaluation metrics. This study concluded that Relevance Vector Machine (RVM) models are suitable
  for forecasting future rainfall since they can support large rainfall extremes and generate reliable
  daily rainfall estimates based on rainfall extremes. In this study, the RVM model was employed to determine
  a predictive association between predictand variables and predictors.
