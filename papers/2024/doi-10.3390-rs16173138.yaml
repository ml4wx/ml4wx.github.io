summary: Comparison of eight ML models on IBTrACS data finds Cubist and Random Forest best for tropical
  cyclone intensity, with central pressure the key predictor.
abstract: Estimating tropical cyclone (TC) intensity is crucial for disaster reduction and risk management.
  This study aims to estimate TC intensity using machine learning (ML) models. We utilized eight ML models
  to predict TC intensity, incorporating factors such as TC location, central pressure, distance to land,
  landfall in the next six hours, storm speed, storm direction, date, and number from the International
  Best Track Archive for Climate Stewardship Version 4 (IBTrACS V4). The dataset was divided into four
  sub-datasets based on the El Niño–Southern Oscillation (ENSO) phases (Neutral, El Niño, and La Niña).
  Our results highlight that central pressure has the greatest effect on TC intensity estimation, with
  a maximum root mean square error (RMSE) of 1.289 knots (equivalent to 0.663 m/s). Cubist and Random
  Forest (RF) models consistently outperformed others, with Cubist showing superior performance in both
  training and testing datasets. The highest bias was observed in SVM models. Temporal analysis revealed
  the highest mean error in January and November, and the lowest in February. Errors during the Warm phase
  of ENSO were notably higher, especially in the South China Sea. Central pressure was identified as the
  most influential factor for TC intensity estimation, with further exploration of environmental features
  recommended for model robustness.
