summary: Hybrid tree and neural ensemble uses EUMETSAT satellite pixels to forecast short-term solar irradiance
  up to 6 h ahead at three Austrian sites, beating persistence and NWP baselines.
abstract: Accurate short-term solar irradiance forecasting is crucial for the efficient operation of solar
  energy driven photovoltaic (PV) power plants. In this research, we introduce a novel hybrid ensemble
  forecasting model that amalgamates the strengths of machine learning tree-based models and deep learning
  neuron-based models. The hybrid ensemble model integrates the interpretability of tree-based models
  with the capacity of neuron-based models to capture complex temporal dependencies within solar irradiance
  data. Furthermore, stacking and voting ensemble strategies are employed to harness the collective strengths
  of these models, significantly enhancing prediction accuracy. This integrated methodology is enhanced
  by incorporating pixels from satellite images provided by the European Organization for the Exploitation
  of Meteorological Satellites (EUMETSAT). These pixels are converted into structured data arrays and
  employed as exogenous inputs in the algorithm. The primary objective of this study is to improve the
  accuracy of short-term solar irradiance predictions, spanning a forecast horizon up to 6 hours ahead.
  The incorporation of EUMETSAT satellite image pixels data enables the model to extract valuable spatial
  and temporal information, thus enhancing the overall forecasting precision. This research also includes
  detailed analysis of the derivation of GHI using satellite images. The study was carried out and the
  models tested across three distinct locations in Austria. A detailed comparative analysis was carried
  out for traditional Satellite (SAT) and Numerical Weather Prediction (NWP) models with hybrid models.
  Our findings demonstrate a higher skill score for all of the approaches compared to smart persistent
  model and consistently highlight the superiority of the hybrid ensemble model for short-term prediction
  window of 1 to 6 hours. This research underscores the potential for enhanced accuracy of the hybrid
  approach to advance short-term solar irradiance forecasting, emphasizing its effectiveness at understanding
  the intricate interplay of the meteorological variables affecting solar energy generation worldwide.
  The results of this investigation carry noteworthy implications for advancing solar energy systems,
  thereby supporting the sustainable integration of renewable energy sources into the electrical grid.
