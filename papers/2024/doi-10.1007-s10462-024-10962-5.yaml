summary: Review of machine learning, including deep learning and ensembles, for atmospheric boundary layer
  turbulence modelling, parameterization and boundary layer height estimation, with validation challenges.
abstract: Abstract Atmospheric boundary layer (ABL) structure and dynamics are important aspects to consider
  in human health. The ABL is characterized by a high degree of spatial and temporal variability that
  hinders their understanding. This paper aims to provide a comprehensive overview of machine learning
  (ML) methodologies, encompassing deep learning and ensemble approaches, within the scope of ABL research.
  The goal is to highlight the challenges and opportunities of using ML in turbulence modeling and parameterization
  in areas such as atmospheric pollution, meteorology, and renewable energy. The review emphasizes the
  validation of results to ensure their reliability and applicability. ML has proven to be a valuable
  tool for understanding and predicting how ABL spatial and seasonal variability affects pollutant dispersion
  and public health. In addition, it has been demonstrated that ML can be used to estimate several variables
  and parameters, such as ABL height, making it a promising approach to enhance air quality management
  and urban planning.
