summary: European Cloud Cover dataset maps satellite cloud fraction onto climate-variable grids for learning
  cloud relations, with autoregressive baselines showing cloud prediction is feasible.
abstract: Clouds are important factors when projecting future climate. Unfortunately, future cloud fractional
  cover (the portion of the sky covered by clouds) is associated with significant uncertainty, making
  climate projections difficult. In this paper, we present the European Cloud Cover dataset, which can
  be used to learn statistical relations between cloud cover and other environmental variables, to potentially
  improve future climate projections. The dataset was created using a novel technique called Area Weighting
  Regridding Scheme to map satellite observations to cloud fractional cover on the same grid as the other
  variables in the dataset. Baseline experiments using autoregressive models document that it is possible
  to use the dataset to predict cloud fractional cover.
