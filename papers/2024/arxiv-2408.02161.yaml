summary: Pareto-front model hierarchies compare semi-empirical and deep learning models for cloud cover,
  shortwave radiation and precipitation parameterizations, condensing ML gains into a ten-parameter equation.
abstract: The added value of machine learning for weather and climate applications is measurable through
  performance metrics, but explaining it remains challenging, particularly for large deep learning models.
  Inspired by climate model hierarchies, we propose that a full hierarchy of Pareto-optimal models, defined
  within an appropriately determined error-complexity plane, can guide model development and help understand
  the models' added value. We demonstrate the use of Pareto fronts in atmospheric physics through three
  sample applications, with hierarchies ranging from semi-empirical models with minimal parameters to
  deep learning algorithms. First, in cloud cover parameterization, we find that neural networks identify
  nonlinear relationships between cloud cover and its thermodynamic environment, and assimilate previously
  neglected features such as vertical gradients in relative humidity that improve the representation of
  low cloud cover. This added value is condensed into a ten-parameter equation that rivals deep learning
  models. Second, we establish a machine learning model hierarchy for emulating shortwave radiative transfer,
  distilling the importance of bidirectional vertical connectivity for accurately representing absorption
  and scattering, especially for multiple cloud layers. Third, we emphasize the importance of convective
  organization information when modeling the relationship between tropical precipitation and its surrounding
  environment. We discuss the added value of temporal memory when high-resolution spatial information
  is unavailable, with implications for precipitation parameterization. Therefore, by comparing data-driven
  models directly with existing schemes using Pareto optimality, we promote process understanding by hierarchically
  unveiling system complexity, with the hope of improving the trustworthiness of machine learning models
  in atmospheric applications.
