summary: Multi-fidelity Gaussian processes downscale ERA5 precipitation over the Himalayas, matching or
  beating gridded products with quantified uncertainty in data-sparse basins.
abstract: Abstract. The rivers of High Mountain Asia provide freshwater to around 2 billion people. However,
  precipitation, the main driver of river flow, is still poorly understood due to limited direct measurements
  in this area. Existing tools to interpolate these measurements or downscale and bias-correct precipitation
  models have several limitations. To overcome these challenges, this paper uses a probabilistic machine
  learning approach called Multi-Fidelity Gaussian Processes (MFGPs) to downscale ERA5 climate reanalysis.
  The method is first validated by downscaling ERA5 precipitation data over data-rich Europe and then
  data-sparse Upper Beas and Sutlej River Basins in the Himalayas. We find that MFGPs are simpler to implement
  and more applicable to smaller datasets than other state-of-the-art machine learning models. MFGPs are
  also able to quantify and narrow the uncertainty associated with the precipitation estimates, which
  is especially needed over ungauged areas, and can be used to estimate the likelihood of extreme events
  that lead to floods or droughts. Over the Upper Beas and Sutlej River Basins, the precipitation estimates
  from the MFGP model are similar to or more accurate than available gridded precipitation products (APHRODITE,
  TRMM, CRU, bias-corrected WRF). The MFGP model and APHRODITE annual mean precipitation estimates generally
  agree with each other for this region. The MFGP model predicting slightly higher average precipitation
  and variance. However, more significant spatial deviations between the MFGP model and APHRODITE over
  this region appear during the summer monsoon. The MFGP model also presents a more effective spatial
  resolution of precipitation, generating more structure at finer scales than ERA5 and APHRODITE. MFGP
  precipitation estimates for the Upper Beas and Sutlej Basins between 1980 and 2013 at a 0.0625° resolution
  (approx. 9 km) are jointly published with this paper.
