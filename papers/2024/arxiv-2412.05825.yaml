summary: Self-supervised masked pretraining on NWP atmospheric variables, transferred to precipitation
  segmentation, improves rainfall probability post-processing and extends lead time.
abstract: Numerical weather prediction (NWP) models are fundamental in meteorology for simulating and
  forecasting the behavior of various atmospheric variables. The accuracy of precipitation forecasts and
  the acquisition of sufficient lead time are crucial for preventing hazardous weather events. However,
  the performance of NWP models is limited by the nonlinear and unpredictable patterns of extreme weather
  phenomena driven by temporal dynamics. In this regard, we propose a \textbf{S}elf-\textbf{S}upervised
  \textbf{L}earning with \textbf{P}robabilistic \textbf{D}ensity \textbf{L}abeling (SSLPDL) for estimating
  rainfall probability by post-processing NWP forecasts. Our post-processing method uses self-supervised
  learning (SSL) with masked modeling for reconstructing atmospheric physics variables, enabling the model
  to learn the dependency between variables. The pre-trained encoder is then utilized in transfer learning
  to a precipitation segmentation task. Furthermore, we introduce a straightforward labeling approach
  based on probability density to address the class imbalance in extreme weather phenomena like heavy
  rain events. Experimental results show that SSLPDL surpasses other precipitation forecasting models
  in regional precipitation post-processing and demonstrates competitive performance in extending forecast
  lead times. Our code is available at https://github.com/joonha425/SSLPDL
