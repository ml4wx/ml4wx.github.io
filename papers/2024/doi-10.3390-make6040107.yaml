summary: Transformer decoders downscale large-scale to small-scale variables in a chaotic high-dimensional
  Lorenz model, outperforming linear and feedforward baselines with correlations above 0.9.
abstract: 'This paper investigates the feasibility of downscaling within high-dimensional Lorenz models
  through the use of machine learning (ML) techniques. This study integrates atmospheric sciences, nonlinear
  dynamics, and machine learning, focusing on using large-scale atmospheric data to predict small-scale
  phenomena through ML-based empirical models. The high-dimensional generalized Lorenz model (GLM) was
  utilized to generate chaotic data across multiple scales, which was subsequently used to train three
  types of machine learning models: a linear regression model, a feedforward neural network (FFNN)-based
  model, and a transformer-based model. The linear regression model uses large-scale variables to predict
  small-scale variables, serving as a foundational approach. The FFNN and transformer-based models add
  complexity, incorporating multiple hidden layers and self-attention mechanisms, respectively, to enhance
  prediction accuracy. All three models demonstrated robust performance, with correlation coefficients
  between the predicted and actual small-scale variables exceeding 0.9. Notably, the transformer-based
  model, which yielded better results than the others, exhibited strong performance in both control and
  parallel runs, where sensitive dependence on initial conditions (SDIC) occurs during the validation
  period. This study highlights several key findings and areas for future research: (1) a set of large-scale
  variables, analogous to multivariate analysis, which retain memory of their connections to smaller scales,
  can be effectively leveraged by trained empirical models to estimate irregular, chaotic small-scale
  variables; (2) modern machine learning techniques, such as FFNN and transformer models, are effective
  in capturing these downscaling processes; and (3) future research could explore both downscaling and
  upscaling processes within a triple-scale system (e.g., large-scale tropical waves, medium-scale hurricanes,
  and small-scale convection processes) to enhance the prediction of multiscale weather and climate systems.'
