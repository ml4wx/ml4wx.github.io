summary: Deep Interpolation raises temporal resolution of historical in-situ meteorological observations
  in China, achieving 0.934 mean correlation and beating linear interpolation and ERA5-Land.
abstract: Early meteorological in-situ observation is obtained by manual timing recording, and the temporal
  resolution is low. The above leads to limitations in the quality of historical data produced by land-surface
  data assimilation systems. Aiming at the problem of low temporal resolution of in-situ observation in
  the past, we propose a deep learning-based method to improve the resolution of observation time series,
  Deep Interpolation. DI introduces a training strategy using uncertainty to weight loss functions to
  solve the "seesaw phenomenon" in multi-task learning and realize collaborative temporal downscaling
  of multiple observation variables, including temperature, surface pressure, relative humidity, and wind
  speed. The experimental results in China show that the DI has achieved significant performance improvement
  compared with the linear interpolation method and ERA5-land, and the average correlation coefficient
  is as high as 0.934. DI can accurately capture the hourly fluctuation characteristics of various meteorological
  variables, especially in high latitude, grassland, and cultivated land regions, showing more vital correction
  ability and more stable model performance. This study provides an effective solution for improving the
  temporal resolution of historical meteorological observation data. It lays a foundation for further
  enhancing the accuracy and reliability of climate models and land surface assimilation systems. Improving
  the temporal resolution of meteorological observation data can better support the research on climate
  change, the construction of disaster early warning systems, and decision-making in many fields, such
  as agriculture and energy.
