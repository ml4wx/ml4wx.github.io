summary: Neural network trained on noisy IBTrACS labels maps ERA5 wind fields to tropical cyclone locations,
  denoising labels and outperforming the original tracks by human preference.
abstract: In climate science, we often want to compare across different datasets. Difficulties can arise
  in doing this due to inevitable mismatches that arise between observational and reanalysis data, or
  even between different reanalyses. This misalignment can raise problems for any work that seeks to make
  inferences about one dataset from another. We considered tropical cyclone location as an example task
  with one dataset providing atmospheric conditions (ERA5) and another providing storm tracks (IBTrACS).
  We found that while the examples often aligned well, there were a considerable proportion (around 25%)
  which were not well aligned. We trained a neural network to map from the wind field to the storm location;
  in this setting misalignment in the datasets appears as "label noise" (i.e. the labelled storm location
  does not correspond to the underlying wind field). We found that this neural network trained only on
  the often noisy labels from IBTrACS had a denoising effect, and performed better than the IBTrACS labels
  themselves, as measured by human preferences. Remarkably, this even held true for training points, on
  which we might have expected the network to overfit to the IBTrACS predictions.
