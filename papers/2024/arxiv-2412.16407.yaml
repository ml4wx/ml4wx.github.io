summary: A physics-and-ML downscaling method projects Bangladesh 100-year daily extreme rainfall rising
  by about 50 mm/day by mid-century and 100 mm/day by late century.
abstract: As climate change drives an increase in global extremes, it is critical for Bangladesh, a nation
  highly vulnerable to these impacts, to assess future risks for effective adaptation and mitigation planning.
  Downscaling coarse-resolution climate models to finer scales is essential for accurately evaluating
  the risk of extremes. In this study, we apply our downscaling method, which integrates data, physics,
  and machine learning, to quantify the risks of extreme precipitation in Bangladesh. The proposed approach
  successfully captures the observed spatial patterns and risks of extreme rainfall in the current climate
  while generating risk and uncertainty estimates by efficiently downscaling multiple models under future
  climate scenarios. Our findings project that the risk of extreme rainfall rises across the country,
  with the most significant increases in the northeastern hilly and southeastern coastal areas. Projections
  show that the daily maximum rainfall for a 100-year return period could increase by approximately 50
  mm/day by mid-century and around 100 mm/day by the end of the century. However, substantial uncertainties
  remain due to variations across multiple climate models and scenarios.
