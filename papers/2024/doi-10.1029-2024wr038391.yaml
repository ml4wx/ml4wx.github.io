summary: Causal effect networks identify Indian Ocean Dipole, Rossby wave teleconnections and other sources
  of US flash drought predictability, enabling 4-week-ahead forecasts.
abstract: 'Abstract Detecting and quantifying the global teleconnections with flash droughts (FDs) and
  understanding their causal relationships is crucial to improve their predictability. This study employs
  causal effect networks (CENs) to explore the global predictability sources of subseasonal soil moisture
  FDs in three regions of the United States (US): upper Mississippi, South Atlantic Gulf (SAG), and upper
  and lower Colorado river basins. We analyzed the causal relationships of FD events with global 2‐m air
  temperature, sea surface temperature, water deficit (precipitation minus evaporation), and geopotential
  height at 500 hPa at the weekly timescale over the warm season (April to September) from 1982 to 2018.
  CENs revealed that the Indian Ocean Dipole, Pacific North Atlantic patterns, Bermuda high‐pressure system,
  and teleconnection patterns via Rossby wave train and jet streams strongly influence FDs in these regions.
  Moreover, a strong link from South America suggests that atmospheric circulation forcings could affect
  the SAG through the low‐level atmospheric flow, reducing inland moisture transport, and leading to a
  precipitation deficit. Machine learning utilizing the identified causal regions and factors can well
  predict major FD events up to 4 weeks in advance, providing useful insights for improved subseasonal
  forecasting and early warnings.'
