summary: Position paper proposing AI applications for marine disaster risk reduction, including a CNN-LSTM
  tropical cyclone forecaster, social-media and crisis systems, and policy recommendations.
abstract: With the intensification of global warming and sea level rise, extreme weather and climate events
  occur frequently, increasing the probability and destructive power of marine disasters. The purpose
  of this paper is to propose the specific application of artificial intelligence (AI) in marine disaster
  risk reduction. First, this paper uses computer vision to assess the vulnerability of the target and
  then uses CNN-LSTM to forecast tropical cyclones. Second, this paper proposes a social media communication
  mechanism based on deep learning and a psychological crisis intervention mechanism based on AIGC. In
  addition, the rescue response system based on an intelligent unmanned platform is also the focus of
  this research. Third, this paper also attempts to discuss disaster loss assessment and reconstruction
  based on machine learning and smart city concepts. After proposing specific application measures, this
  paper proposes three policy recommendations. The first one is improving legislation to break the technological
  trap of AI. The second one is promoting scientific and technological innovation to break through key
  technologies of AI. The third one is strengthening coordination and cooperation to build a disaster
  reduction system that integrates man and machine. The purpose of this paper is to reduce the risk of
  marine disasters by applying AI. Furthermore, we hope to provide scientific references for sustainability
  and human adaptation to climate change.
