summary: Shows that multi-stage optimization, not network structure, closes the S2S skill gap, beating
  ECMWF-S2S by 19-91% on PCC and TCC with the same backbone.
abstract: Weather and climate forecasting is vital for sectors such as agriculture and disaster management.
  Although numerical weather prediction (NWP) systems have advanced, forecasting at the subseasonal-to-seasonal
  (S2S) scale, spanning 2 to 6 weeks, remains challenging due to the chaotic and sparse atmospheric signals
  at this interval. Even state-of-the-art deep learning models struggle to outperform simple climatology
  models in this domain. This paper identifies that optimization, instead of network structure, could
  be the root cause of this performance gap, and then we develop a novel multi-stage optimization strategy
  to close the gap. Extensive empirical studies demonstrate that our multi-stage optimization approach
  significantly improves key skill metrics, PCC and TCC, while utilizing the same backbone structure,
  surpassing the state-of-the-art NWP systems (ECMWF-S2S) by over \textbf{19-91\%}. Our research contests
  the recent study that direct forecasting outperforms rolling forecasting for S2S tasks. Through theoretical
  analysis, we propose that the underperformance of rolling forecasting may arise from the accumulation
  of Jacobian matrix products during training. Our multi-stage framework can be viewed as a form of teacher
  forcing to address this issue. Code is available at \url{https://anonymous.4open.science/r/Baguan-S2S-23E7/}
