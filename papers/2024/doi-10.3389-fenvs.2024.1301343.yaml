summary: An autoregressive LSTM trained on ensemble-mean ERA5 reproduces global climate trends and seasonal
  cycles over long periods as a baseline alternative to physical models.
abstract: Climate change is a pressing global issue. Mathematical models and global climate models have
  traditionally been invaluable tools in understanding the Earth’s climate system, however there are several
  limitations. Researchers are increasingly integrating machine learning techniques into environmental
  science related to time-series data; however, its application in the context of climate predictions
  remains open. This study develops a baseline machine learning model based on an autoregressive recurrent
  neural network with a long short-term memory implementation to predict the climate. The data were retrieved
  from the ensemble-mean version of the ERA5 dataset. The model developed in this study could predict
  the general trends of the Earth when used to predict both the climate and weather. When predicting climate,
  the model could achieve reasonable accuracy for a long period, with the ability to predict seasonal
  patterns, which is a feature that other researchers could not achieve with the complex reanalysis data
  utilized in this study. This study demonstrates that machine learning models can be utilized in a climate
  forecasting approach as a viable alternative to mathematical models and can be utilized to supplement
  current work that is mostly successful in short-term predictions.
