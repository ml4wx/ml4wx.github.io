summary: Compares standard machine learning classifiers for predicting whether it will rain tomorrow,
  aimed at agricultural planning in India; a routine comparative study.
abstract: Weather forecasts can be performed by collecting large amount of data about the present condition
  of the environment. The state of atmosphere or environment can be the temperature, humidity and wind.
  The future can be determined by the atmosphere evolution and this evolution can be done through meteorology
  with understanding of atmospherically processes. The foundation stone of Indian economy is the agriculture,
  which depends on the rain. Hence, early prediction of rain is highly necessary in India for agriculture.
  In worldwide, rainfall prediction is one among the challenging issues. Here, varied and most popular
  machine learning models are utilized for forecasting the rainfall. The outcome from the model gives
  the centre of the weather forecasts for predicting that whether tomorrow will rain or not. The experimental
  results will compare and show that good level of accuracy with the help of machine learning algorithms.
