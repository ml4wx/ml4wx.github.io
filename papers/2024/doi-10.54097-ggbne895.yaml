summary: Review compares statistical, dynamical and machine learning typhoon track prediction methods
  through case studies, concluding ML and ensemble models give higher accuracy.
abstract: This review paper aims to provide a comprehensive understanding of the various methodologies
  employed in predicting the paths of tropical cyclones, with a focus on their efficiency and accuracy.
  Traditional statistical models, dynamical models, and emerging machine learning models are thoroughly
  examined. Case studies are used to compare the performance of these methods in predicting the same typhoon
  events. The paper concludes that while traditional methods are still in use, advanced methods like machine
  learning and ensemble models offer higher accuracy and are recommended for future research and applications.
  The review serves as a guide for researchers, policymakers, and stakeholders in choosing the most effective
  typhoon track prediction methods.
