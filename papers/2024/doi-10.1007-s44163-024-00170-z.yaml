summary: Bibliometric analysis of millions of documents maps how AI methods are applied to climate research,
  finding Chinese institutions lead, followed by the United States.
abstract: Artificial Intelligence (AI) could revolutionize our ability to understand and address climate
  change. Studies to date have focused on specific AI applications to climate science, technologies, and
  policy. Yet despite the vast demonstrated potential for AI to change the way in which climate research
  is conducted, no study has presented a systematic and comprehensive understanding of the way in which
  AI is intersecting with climate research around the world. Using a novel merged corpus of scholarly
  literature which contains millions of unique scholarly documents in multiple languages, we review the
  community of knowledge at the intersection of climate change and AI to understand how AI methods are
  being applied to climate-related research and which countries are leading in this area. We find that
  Chinese research institutions lead the world in publishing and funding research at the intersection
  of climate and AI, followed by the United States. In mapping the specific AI tasks or methods being
  applied to specific climate research fields, we highlight gaps and identify opportunities to expand
  the use of AI in climate research. This paper can therefore greatly improve our understanding of both
  the current use and the potential use of AI for climate research.
