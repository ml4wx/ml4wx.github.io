summary: Comment reviews seasonal forecasts for the coming El Niño and showcases data-driven modelling
  of coastal waterline changes worldwide.
abstract: Abstract The central-eastern tropical Pacific is currently significantly warmer than normal,
  and the likelihood of a strong El Niño developing by early 2024 is 75–85%, according to the National
  Weather Service’s Climate Prediction Center. Disruptions in ecosystem services and increased vulnerability,
  in particular in the coastal zones, are expected in many parts of the world. In this comment, we review
  the latest seasonal forecasts and showcase the potential for predicting the world’s coastlines based
  on data-driven modeling.
