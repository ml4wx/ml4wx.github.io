summary: A DNN ensemble estimates planetary boundary layer height from surface and morning temperature
  data, producing a 27-year Southern Great Plains record that agrees with lidar and radiosonde measurements.
abstract: Abstract. The planetary boundary layer (PBL) height (PBLH) is an important parameter for various
  meteorological and climate studies. This study presents a multi-structure deep neural network (DNN)
  model, designed to estimate PBLH by integrating morning temperature profiles with surface meteorological
  observations. The DNN model is developed by leveraging a rich dataset of PBLH derived from long-standing
  radiosonde records and augmented with high-resolution micro-pulse lidar and Doppler lidar observations.
  We access the performance of the DNN with an ensemble of ten members, each featuring distinct hidden
  layer structures, which collectively yield a robust 27-year PBLH dataset over the Southern Great Plains
  from 1994 to 2020. The influence of various meteorological factors on PBLH is rigorously analyzed through
  the importance test. Moreover, the DNN model's accuracy is evaluated against radiosonde observations
  and juxtaposed with conventional remote sensing methodologies, including Doppler lidar, ceilometer,
  Raman lidar, and Micro-pulse lidar. The DNN model exhibits reliable performance across diverse conditions
  and demonstrates lower biases relative to remote sensing methods. In addition, the DNN model, originally
  trained over a plain region, demonstrates remarkable adaptability when applied to the heterogeneous
  terrains and climates encountered during the GoAmazon (Tropical Rainforest) and CACTI (Middle Latitude
  Mountain) campaigns. These findings demonstrate the effectiveness of deep learning models in estimating
  PBLH, enhancing our understanding of boundary layer dynamics with implications for enhancing the representation
  of PBL in weather forecasting and climate modeling.
