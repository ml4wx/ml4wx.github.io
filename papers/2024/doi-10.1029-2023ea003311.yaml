summary: Stacked tree-model ensemble estimates precipitation from FY-4A infrared brightness temperatures,
  validated against IMERG and rain gauges with a random-forest rain/no-rain classifier.
abstract: 'Abstract Satellite infrared detectors cannot penetrate clouds, especially precipitating clouds.
  Improving precipitation estimation accuracy based on infrared brightness temperature has always been
  important but challenging. In this paper, based on the infrared brightness temperature of the Advanced
  Geosynchronous Radiation Imager (AGRI) onboard China''s Feng‐Yun 4A satellite, we develop and evaluate
  a new precipitation estimation method. First, using static data, physical characteristics of clouds,
  cloud image texture features, temporal motion features, and AGRI infrared channel brightness temperature,
  we construct features for a machine learning model. Then, we develop precipitation estimation methods.
  Precipitation is estimated in two steps: classification and regression. We employ a random forest classification
  model to identify whether there is precipitation in a given field of view. If there is precipitation,
  a multi‐model ensemble regression learning method is used to estimate the areas with this precipitation.
  The ensemble learning method uses convex optimization to integrate prediction results based on the optimization
  of hyperparameters of five basic models (i.e., those of random forest, XGBoost, LightGBM, decision tree,
  and extra tree models). Furthermore, two regression stacking ensemble models—the Least Absolute Shrinkage
  and Selection Operator (herein referred to as Stacking1‐LASSO) and K‐nearest neighbor (herein referred
  to as Stacking2‐KNN)—are used to predict the results of the aforementioned basic models. The results
  of basic models are used as inputs of these two stacking models. Finally, based on the Integrated Multi‐satellitE
  Retrievals for GPM (IMERG) precipitation product and rain gauge precipitation data, we conduct precipitation
  estimation experiments and evaluate our methods. The results show that ensemble learning models have
  greater accuracy in estimating precipitation than the basic models. When using IMERG precipitation as
  the target precipitation, ensemble learning models can estimate the central area of heavy precipitation
  during typhoons Ampil and Maria. The ensemble learning estimation effect is better than that of Stacking2‐KNN.
  Moreover, when rain gauge data is used as the target precipitation, ensemble learning can also estimate
  the center of heavy precipitation and with good consistency with recorded satellite brightness temperature
  data.'
