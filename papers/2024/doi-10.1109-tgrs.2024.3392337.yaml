summary: Lightweight hybrid model combines satellite image ROI features and NWP inputs to predict hourly
  solar PV output, cutting MAE by up to 33.7% versus five ML baselines.
abstract: This study introduces a lightweight hybrid solar PV generation prediction model operating on
  1-hour intervals, utilizing remote sensing data to enhance power grid management. Multisource remote
  sensing data, including spatial features from infrared satellite images and temporal data from various
  hourly recorded datasets, capture spatiotemporal characteristics. The model defines and synthesizes
  regions of interest (ROI) and surrounding areas of ROI (ROIsurr) within satellite images to reduce computational
  load. Integration of image and numerical weather prediction (NWP) process modules ensures accurate prediction.
  Comparative analysis against five machine learning algorithms shows significant improvements, with up
  to a 33.7% decrease in mean absolute error (MAE) and a 19.51% decrease in root mean square error (RMSE).
  Additionally, the model consistently meets ASHRAE Guideline 14 standards and outperforms single-source
  data models. Experimentation highlights the effectiveness of smaller ROIs in enhancing predictive accuracy,
  demonstrating adaptability to climate variations. This lightweight multisource remote sensing-based
  hybrid model promises to guide smart grid operations and sustainable power grid systems, advancing remote
  sensing applications in renewable energy management.
