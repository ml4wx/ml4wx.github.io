summary: Forecasts surface solar irradiance 24 h ahead with 1D and 3D ML/deep models from satellite data,
  outperforming NWP, climatology and persistence across Austria, Switzerland and Italy.
abstract: 'In order to facilitate the shift towards sustainable practices and to support the transition
  to renewable energy, there is a requirement for faster and more accurate predictions of solar irradiance.
  Surface solar energy predictions are essential for the establishment of solar farms and the enhancement
  of energy grid management. This paper presents a novel approach to forecast surface solar irradiance
  up to 24 h in advance, utilizing various machine and deep learning architectures. Our proposed Machine
  Learning (ML) models include both point-based (1D) and grid-based (3D) solutions, offering a comprehensive
  exploration of different methodologies. Our forecasts leverage two days of input data to predict the
  next day of solar exposure at country scale. To assess the models’ performance, extensive testing is
  conducted across three distinct geographical areas of interest: Austria (where models were trained and
  validated), Switzerland and Italy (where we tested our models under a transfer learning regime), and
  sensitivity to the season is also discussed. The study incorporates comparisons with established benchmarks,
  including state-of-the-art numerical weather predictions, as well as fundamental predictors such as
  climatology and persistence. Our findings reveal that the ML-based methods clearly outperform traditional
  forecasting techniques, demonstrating high accuracy and reliability in predicting surface solar irradiance.
  This research not only contributes to the advancement of solar energy forecasting but also highlights
  the effectiveness of machine learning and deep learning models in being competitive to conventional
  methods for short-term solar irradiance predictions. • Surface solar irradiance predictions are done
  with several machine learning models. • Deep learning architectures outperform numerical weather forecasting
  for day-ahead predictions. • Forecast skill scores are strongly dependent on the time of the year. •
  Machine learning models are able to generalize to unseen regions and time periods.'
