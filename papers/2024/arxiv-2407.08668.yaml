summary: Simulation-based generative neural networks estimate spatial extremal dependence of precipitation
  maxima via max-stable processes, applied to Western German rainfall including the 2021 flood event.
abstract: In this work, we propose a simulation-based estimation approach using generative neural networks
  to determine dependencies of precipitation maxima and their underlying uncertainty in time and space.
  Within the common framework of max-stable processes for extremes under temporal and spatial dependence,
  our methodology allows estimating the process parameters and their respective uncertainty, but also
  delivers an explicit nonparametric estimate of the spatial dependence through the pairwise extremal
  coefficient function. We illustrate the effectiveness and robustness of our approach in a thorough finite
  sample study where we obtain good performance in complex settings for which closed-form likelihood estimation
  becomes intractable. We use the technique for studying monthly rainfall maxima in Western Germany for
  the period 2021-2023, which is of particular interest since it contains an extreme precipitation and
  consecutive flooding event in July 2021 that had a massive deadly impact. Beyond the considered setting,
  the presented methodology and its main generative ideas also have great potential for other applications.
