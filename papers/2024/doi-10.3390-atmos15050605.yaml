summary: Large-kernel convolutional network with hierarchical multi-step prediction forecasts Northwest
  Pacific typhoon tracks without recurrent networks, performing best at 24 h.
abstract: The prediction of typhoon tracks in the Northwest Pacific is key to reducing human casualties
  and property damage. Traditional numerical forecasting models often require substantial computational
  resources, are high-cost, and have significant limitations in prediction speed. This research is dedicated
  to using deep learning methods to address the shortcomings of traditional methods. Our method (AFR-SimVP)
  is based on a large-kernel convolutional spatio-temporal prediction network combined with multi-feature
  fusion for forecasting typhoon tracks in the Northwest Pacific. In order to more effectively suppress
  the effect of noise in the dataset to enhance the generalization ability of the model, we use a multi-branch
  structure, incorporate an atmospheric reconstruction subtask, and propose a second-order smoothing loss
  to further improve the prediction ability of the model. More importantly, we innovatively propose a
  multi-time-step typhoon prediction network (HTAFR-SimVP) that does not use the traditional recurrent
  neural network family of models at all. Instead, through fine-to-coarse hierarchical temporal feature
  extraction and dynamic self-distillation, multi-time-step prediction is achieved using only a single
  regression network. In addition, combined with atmospheric field reconstruction, the network achieves
  integrated prediction for multiple tasks, which greatly enhances the model’s range of applications.
  Experiments show that our proposed network achieves optimal performance in the 24 h typhoon track prediction
  task. Our regression network outperforms previous recurrent network-based typhoon prediction models
  in the multi-time-step prediction task and also performs well in multiple integration tasks.
