summary: A linear variational encoder-decoder with uncertainty identifies when cloud radiation matters
  for tropical cyclone intensification, highlighting deep convection's dominant role.
abstract: Cloud radiative feedback impacts early tropical cyclone (TC) intensification, but limitations
  in existing diagnostic frameworks make them unsuitable for studying asymmetric or transient radiative
  heating. We propose a linear Variational Encoder-Decoder (VED) to learn the hidden relationship between
  radiation and the surface intensification of realistic simulated TCs. Limiting VED model inputs enables
  using its uncertainty to identify periods when radiation has more importance for intensification. A
  close examination of the extracted 3D radiative structures suggests that longwave radiative forcing
  from inner core deep convection and shallow clouds both contribute to intensification, with the deep
  convection having the most impact overall. We find that deep convection downwind of the shallow clouds
  is critical to the intensification of Haiyan. Our work demonstrates that machine learning can discover
  thermodynamic-kinematic relationships without relying on axisymmetric or deterministic assumptions,
  paving the way towards the objective discovery of processes leading to TC intensification in realistic
  conditions.
