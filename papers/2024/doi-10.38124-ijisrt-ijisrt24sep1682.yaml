summary: Proposes a generic machine-learning model trained on historical station data to predict local
  weather, claiming better accuracy than traditional models without quantitative detail in the abstract.
abstract: Weather forecasting is the technical process of predicting atmospheric conditions at a location.
  Many scientists have also been trying to predict the weather, both formally and informally, for years.
  Weather forecasting is done by collecting data from specific locations with different climate attributes.
  Traditional numerical weather prediction models have made significant progress, but there are still
  limitations in their accuracy, especially in detecting local weather events. In recent years, machine
  learning techniques have become a powerful tool for improving weather forecasts by exploiting the large
  amounts of data and complex patterns inherent in atmospheric systems. We propose a machine- learning
  model that uses historical data to train the model. The model is then used to predict weather with better
  accuracy than traditional models.
