summary: Perspective proposing hybrid climate models that pair process-based parameterizations with AI-derived
  closure functions that respect conservation laws, at O(10 km) resolution.
abstract: Abstract. Accelerating progress in climate modeling is urgent for proactive and effective climate
  change adaptation. The central challenge lies in accurately representing processes that are small in
  scale yet are climatically important, such as turbulence and cloud formation. These processes are not
  explicitly resolvable, necessitating the use of parameterizations. We propose a balanced approach that
  leverages the strengths of traditional process-based parameterizations and contemporary AI-based data-driven
  methods to model subgrid-scale processes. This strategy focuses on employing AI to derive data-driven
  closure functions from both observational and simulated data, integrated within parameterizations that
  encode system knowledge and conservation laws. Increasing resolution to resolve a larger fraction of
  small-scale processes can aid progress toward improved and interpretable climate predictions outside
  the observed climate distributions, but it must still allow the generation of large ensembles for model
  calibration and the broad exploration of possible climate outcomes – currently O(10 km) horizontal resolutions
  are feasible. By synergizing decades of scientific development with advanced AI techniques, this approach
  aims to significantly boost the accuracy, interpretability, and trustworthiness of climate predictions.
