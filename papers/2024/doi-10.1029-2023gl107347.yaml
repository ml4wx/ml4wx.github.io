summary: Perturbation experiments on a transformer ENSO model identify upper-ocean thermal precursor pathways
  that explain how long-lead ENSO prediction skill arises.
abstract: Abstract Recent studies have demonstrated great values of deep‐learning (DL) methods for improving
  El Niño‐Southern Oscillation (ENSO) predictions. However, the black‐box nature of DL makes it challenging
  to physically interpret mechanisms responsible for successful ENSO predictions. Here, we demonstrate
  an interpretable method by performing perturbation experiments to predictors and quantifying input‐output
  relationships in predictions by using a transformer‐based model; ENSO‐related thermal precursors serving
  as initial conditions during multi‐month time intervals (TIs) are identified in the equatorial‐northern
  Pacific, acting to precondition input predictors to provide for long‐lead ENSO predictability. Results
  reveal the existence of upper‐ocean temperature anomaly pathways and consistent phase propagations of
  thermal precursors around the tropical Pacific. It is illustrated that three‐dimensional thermal fields
  and their basinwide evolution during long TIs act to enhance long‐lead prediction skills of ENSO. These
  physically explainable results indicate that neural networks can adequately represent predictable precursors
  in the input predictors for successful ENSO predictions.
