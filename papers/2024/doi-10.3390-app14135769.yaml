summary: An LSTM with genetic-algorithm hyperparameter tuning forecasts short- to medium-term weather
  at a single Douro vineyard station, with regression filling missing data.
abstract: Several sectors, such as agriculture and renewable energy systems, rely heavily on weather variables
  that are characterized by intermittent patterns. Many studies use regression and deep learning methods
  for weather forecasting to deal with this variability. This research employs regression models to estimate
  missing historical data and three different time horizons, incorporating long short-term memory (LSTM)
  to forecast short- to medium-term weather conditions at Quinta de Santa Bárbara in the Douro region.
  Additionally, a genetic algorithm (GA) is used to optimize the LSTM hyperparameters. The results obtained
  show that the proposed optimized LSTM effectively reduced the evaluation metrics across different time
  horizons. The obtained results underscore the importance of accurate weather forecasting in making important
  decisions in various sectors.
