summary: Multiple linear regression and neural networks project urban land surface temperature over Kolkata,
  forecasting 1–4 °C warming over existing and future urban areas.
abstract: 'The insinuations of the ailments associated with the unrestrained and disorganized proliferation
  of artificial impervious materials over natural surfaces are prevalent among city dwellers.These impacts
  can be comprehended by estimating land surface temperature (LST), as it is vital for evaluating urban
  climate, particularly to explain the intensity of urban heat islands and to define the health and welfare
  of the planet as well as the living beings.Urbanization-driven landscape changes severely disrupt comfortable
  living in almost every city, necessitating monitoring and modelling historical, current, and likely
  future LSTs.This research article proposes two forecasting techniques: Multiple Linear Regression (MLR)
  and Artificial Neural Network (ANN) models.These models have been widely accepted for the efficient
  prediction of climatic parameters, including LST, over an urban area.The landscape, elevation, and LST
  trend served as input to the models for an accurate prediction of LST.The analysis was performed over
  the Kolkata Metropolitan Area (KMA) with an additional 10 km buffer to understand urban growth and its
  effect on the LST of the entire region.The two developed models (MLR and ANN) effectively anticipated
  the LST over the KMA region.A continual increment in the surface temperatures ranging from 1 � C to
  4 � C, over existing and likely-predicted urban areas was comprehended.It was anticipated that the regions
  near the urban areas will also experience severe discomfort and heat waves without proper mitigation
  measures.This scientific literature provides essential insights for decision-makers, stakeholders, and
  government officials to articulate new policies and modify the existing ones to create a sustainable
  and livable urban environment for the inhabitants.'
