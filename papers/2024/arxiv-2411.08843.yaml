summary: A neural operator estimates 6-hourly global surface solar irradiance from NWP and AI weather
  model outputs, improved by satellite fine-tuning for renewable energy forecasting.
abstract: Accurate surface solar irradiance (SSI) forecasting is essential for optimizing renewable energy
  systems, particularly in the context of long-term energy planning on a global scale. This paper presents
  a pioneering approach to solar radiation forecasting that leverages recent advancements in numerical
  weather prediction (NWP) and data-driven machine learning weather models. These advances facilitate
  long, stable rollouts and enable large ensemble forecasts, enhancing the reliability of predictions.
  Our flexible model utilizes variables forecast by these NWP and AI weather models to estimate 6-hourly
  SSI at global scale. Developed using NVIDIA Modulus, our model represents the first adaptive global
  framework capable of providing long-term SSI forecasts. Furthermore, it can be fine-tuned using satellite
  data, which significantly enhances its performance in the fine-tuned regions, while maintaining accuracy
  elsewhere. The improved accuracy of these forecasts has substantial implications for the integration
  of solar energy into power grids, enabling more efficient energy management and contributing to the
  global transition to renewable energy sources.
