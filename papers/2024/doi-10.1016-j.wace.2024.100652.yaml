summary: Deep learning nowcasts of South Korean heavy rainfall beat operational NWP at 1-6 h lead times,
  with 162%-31% accuracy improvement reported.
abstract: Accurate nowcasting is critical for preemptive action in response to heavy rainfall events (HREs).
  However, operational numerical weather prediction models have difficulty predicting HREs in the short
  term, especially for rapidly and sporadically developing cases. Here, we present multi-year evaluation
  statistics showing that deep-learning-based HRE nowcasting, trained with radar images and ground measurements,
  outperforms short-term numerical weather prediction at lead times of up to 6 h. The deep learning nowcasting
  shows an improved accuracy of 162%–31% over numerical prediction, at the 1-h to 6-h lead times, for
  predicting HREs in South Korea during the Asian summer monsoon. The spatial distribution and diurnal
  cycle of HREs are also well predicted. Isolated HRE predictions in the late afternoon to early evening
  which mostly result from convective processes associated with surface heating are particularly useful.
  This result suggests that the deep learning algorithm may be available for HRE nowcasting, potentially
  serving as an alternative to the operational numerical weather prediction model.
