summary: A machine learning framework projects Southeast Asian crop production and cropland suitability
  to 2028 using CMIP5 climate projections, showing declines of up to 19% in Viet Nam rice output.
abstract: Agriculture, a cornerstone of human civilization, faces rising challenges from climate change,
  resource limitations, and stagnating yields. Precise crop production forecasts are crucial for shaping
  trade policies, development strategies, and humanitarian initiatives. This study introduces a comprehensive
  machine learning framework designed to predict crop production. We leverage CMIP5 climate projections
  under a moderate carbon emission scenario to evaluate the future suitability of agricultural lands and
  incorporate climatic data, historical agricultural trends, and fertilizer usage to project yield changes.
  Our integrated approach forecasts significant regional variations in crop production across Southeast
  Asia by 2028, identifying potential cropland utilization. Specifically, the cropland area in Indonesia,
  Malaysia, Philippines, and Viet Nam is projected to decline by more than 10% if no action is taken,
  and there is potential to mitigate that loss. Moreover, rice production is projected to decline by 19%
  in Viet Nam and 7% in Thailand, while the Philippines may see a 5% increase compared to 2021 levels.
  Our findings underscore the critical impacts of climate change and human activities on agricultural
  productivity, offering essential insights for policy-making and fostering international cooperation.
