summary: RA-UNet, a residual attention UNet on Himawari-8 imagery, nowcasts oceanic precipitation 90 minutes
  ahead with better detection and fewer false alarms than UNet baselines.
abstract: Qualitative precipitation forecasting plays a vital role in marine operational services. However,
  predicting heavy precipitation over the open ocean presents a significant challenge due to the limited
  availability of ground-based radar observations far from coastal regions. Recent advancements in deep
  learning models offer potential for oceanic precipitation nowcasting using satellite images. This study
  implemented an enhanced UNet model with an attention mechanism and a residual architecture (RA-UNet)
  to predict the precipitation rate within a 90 min time frame. A comparative analysis with the standard
  UNet and UNet with an attention algorithm revealed that the RA-UNet method exhibited superior accuracy
  metrics, such as the critical ratio index and probability of detection, with fewer false alarms. Two
  typical cases demonstrated that RA-UNet had a better ability to forecast monsoon precipitation as well
  as intense precipitation in a tropical cyclone. These findings indicate the greater potential of the
  RA-UNet approach for nowcasting heavy precipitation over the ocean using satellite imagery.
