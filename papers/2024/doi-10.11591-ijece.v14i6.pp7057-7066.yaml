summary: Luong-attention seq2seq model forecasts monthly Niño indices from 1870–2022 data, reducing RMSE
  by about 0.035–0.046 relative to a baseline seq2seq model.
abstract: The ability to accurately predict the EI Nino-Southern oscillation (ENSO) is essential for seasonal
  climate forecasting. Monitoring the Pacific Ocean's surface temperature has many benefits for human
  life, including a better understanding of climate and weather, the ability to predict summer and winter,
  the ability to manage natural resources, serving as a reference for maritime transportation and navigation
  needs, serving as a reference for climate change monitoring needs, and even serving as a renewable energy
  source by utilizing high sea surface temperatures. This study introduces a deep learning (DL) model
  with AttentionSeq2Luong model as our proposed model to the ENSO research community. The present study
  showcases the capability of our proposed model to effectively forecast the forthcoming monthly average
  Nino index compared to the baseline seq2seq architecture model. For the dataset, this study utilized
  monthly observations of Nino 12, Nino 3, Nino 34, and Nino 4 between January 1870 and August 2022. The
  brief result of our experiment was that applying Luong Attention in the seq2seq model reduced the RMSE
  error by around 0.03494, 0.04635, 0.03853, and 0.03892 for forecasting Nino 12, Nino 3, Nino 34, and
  Nino 4, respectively.
