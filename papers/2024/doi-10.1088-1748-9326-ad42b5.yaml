summary: Compares climate aggregation and dimension reduction methods for soybean yield prediction at
  3,447 global sites, finding random forests robust and monthly data sufficient.
abstract: Abstract High-dimensional climate data collected on a daily, monthly or seasonal time step are
  now commonly used to predict crop yields worldwide with standard statistical models or machine learning
  models. Since the use of all available individual climate variables generally leads to calculation problems,
  over-fitting, and over-parameterization, it is necessary to aggregate the climate data used as predictors.
  However, there is no consensus on the best way to perform this task, and little is known about the impacts
  of the type of aggregation method used and of the temporal resolution of weather data on model performances.
  Based on historical data from 1981 to 2016 of soybean yield and climate on 3,447 sites worldwide, this
  study compares different temporal resolutions (daily, monthly, or seasonal) and dimension reduction
  techniques (principal component analysis, partial least square regression, and their functional counterparts)
  to aggregate climate data used as inputs of machine learning and linear regression models predicting
  yields. Results showed that random forest models outperformed and were less sensitive to climate aggregation
  methods than linear regressions when predicting soybean yields. With our models, the use of daily climate
  data did not improve predictive performance compared to monthly data. Models based on principal component
  analysis or averages of monthly data showed better predictive performance compared to those relying
  on more sophisticated dimension reduction techniques. By highlighting the high sensitivity of projected
  impact of climate on crop yields to the temporal resolution and aggregation of climate input data, this
  study reveals that model performances can be improved by choosing the most appropriate time resolution
  and aggregation techniques. Practical recommendations are formulated in this article based on our results.
