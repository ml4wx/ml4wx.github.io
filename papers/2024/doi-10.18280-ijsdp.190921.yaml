summary: Stacked ensemble of Random Forest, CatBoost and LightGBM reports MAPE 0.765 and R2 0.90 for continental
  temperature patterns, with limited methodological novelty.
abstract: The increasing severity of climate change, including global warming, makes it crucial to act
  quickly to adapt and reduce its impact.To address the complex issues of climate change, we need to understand
  how it affects different continents.Traditional methods of predicting climate change often fail due
  to the inherent complexities and nonlinearities of climate systems.Thus, to overcome these limitations,
  this study proposes a machine learning-based stacking model.Initially, the state of art models was trained
  while the results are unsatisfactory, the grid search optimization was employed to improve the results.However,
  the results produced were in a mediocre state.Thus, a stacking based, Stack-ClimaBoost model was proposed.This
  model optimizes the integration of Random Forest (RF), CatBoost (CB), and Light Gradient Boosting Machine
  (LGBM) using grid search optimization.The Stack-ClimaBoost model outperforms previous state-of-the-art
  models obtaining a low MAPE 0.765, an RMSE of 2.254, and an R 2 value of 0.9003.In addition, for each
  of the seven continents Stack-ClimaBoost model performed better with a low MAPE (1.8653-5.8280), an
  RMSE (1.2-4.57), with a higher R² value of (0.65-0.94).With its adaptable solutions, the proposed Stack-ClimaBoost
  Regressor model could excel in environmental research and climate modeling on multiple continents.Enhancing
  precision facilitates more dependable prognostications of temperature patterns, thereby supporting proactive
  strategizing and decision-making aimed at alleviating the consequences of climate change.
