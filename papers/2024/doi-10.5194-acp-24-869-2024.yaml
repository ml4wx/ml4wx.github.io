summary: Emulators trained on large-eddy simulations replace subgrid updraft and precipitation processes
  in a GCM at little extra cost, without consistently improving observational fit.
abstract: 'Abstract. Here we present for the first time a proof of concept for an emulation-based method
  that uses a large-eddy simulations (LES) to present sub-grid cloud processes in a general circulation
  model (GCM). We focus on two key variables affecting the properties of shallow marine clouds: updraft
  velocity and precipitation formation. The LES is able to describe these processes with high resolution
  accounting for the realistic variability in cloud properties. We show that the selected emulation method
  is 5 able to represent the LES outcome with relatively good accuracy and that the updraft velocity and
  precipitation emulators can be coupled with the GCM practically without increasing the computational
  costs. We also show that the emulators influence the climate simulated by the GCM, but do not consistently
  improve or worsen the agreement with observations on cloud related properties. Although especially the
  updraft velocity at cloud base is better captured. A more quantitative evaluation of the emulator impacts
  against observations would, however, have required model re-tuning, which is a significant task and
  thus could 10 not be included in this proof-of-concept study. All in all, the approach introduced here
  is a promising candidate for representing detailed cloud and aerosol related sub-grid processes in GCMs.
  Further development work together with increasing computing capacity can be expected to improve the
  accuracy and the applicability of the approach in climate simulations.'
