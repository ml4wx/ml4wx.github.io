summary: trajPredRNN+ combines trajectory segmentation, PredRNN, attention, residuals and a GAN-style
  loss to improve radar-based heavy rainfall nowcasting over Shenzhen.
abstract: ：Short-term rainfall prediction is a crucial and practical research area, with the accuracy
  of rainfall prediction, particularly for heavy rainfall, significantly impacting people's lives, property,
  and even their safety. Existing models, such as ConvLSTM, TrajGRU, and PredRNN, exhibit limitations
  in capturing fine-grained appearances due to insufficient memory units or addressing positional misalignment
  issues, thereby compromising the accuracy of model predictions. In this study, we propose trajPredRNN+,
  an innovative approach that integrates the trajectory segmentation model and the PredRNN deep learning
  model to address both limitations in nowcasting precipitation using weather radar echo images. By incorporating
  attention mechanisms, the model demonstrates an enhanced focus on short-term and imminent heavy rainfall
  events. To ensure improved stability during training, a residual network is introduced. Lastly, a more
  rational and effective training loss function is proposed, encompassing weight mechanism, SSIM index,
  and GAN loss. To validate the proposed model, we conducted a comparative experiment and an ablation
  experiment using the radar echo map dataset obtained from the Shenzhen Meteorological Bureau. The results
  of these experiments demonstrate that our model has achieved significant improvements across multiple
  key performance indicators.
