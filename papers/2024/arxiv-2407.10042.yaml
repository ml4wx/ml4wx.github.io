summary: VAE with feature clustering and dynamic thresholds detects anomalies in Arctic climate time series
  linked to snowmelt extremes, with improved F1 on benchmarks.
abstract: We introduce an anomaly detection method for multivariate time series data with the aim of identifying
  critical periods and features influencing extreme climate events like snowmelt in the Arctic. This method
  leverages the Variational Autoencoder (VAE) integrated with dynamic thresholding and correlation-based
  feature clustering. This framework enhances the VAE's ability to identify localized dependencies and
  learn the temporal relationships in climate data, thereby improving the detection of anomalies as demonstrated
  by its higher F1-score on benchmark datasets. The study's main contributions include the development
  of a robust anomaly detection method, improving feature representation within VAEs through clustering,
  and creating a dynamic threshold algorithm for localized anomaly detection. This method offers explainability
  of climate anomalies across different regions.
