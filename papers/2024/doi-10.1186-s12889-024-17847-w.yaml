summary: Uses SVM and regression on climate variables from CORDEX projections to predict malaria incidence
  in northern Benin, reporting 82% incidence prediction and rising risk under RCP scenarios.
abstract: 'BACKGROUND: Malaria is one of the major vector-borne diseases most sensitive to climatic change
  in West Africa. The prevention and reduction of malaria are very difficult in Benin due to poverty,
  economic insatiability and the non control of environmental determinants. This study aims to develop
  an intelligent outbreak malaria early warning model driven by monthly time series climatic variables
  in the northern part of Benin. METHODS: Climate data from nine rain gauge stations and malaria incidence
  data from 2009 to 2021 were extracted from the National Meteorological Agency (METEO) and the Ministry
  of Health of Benin, respectively. Projected relative humidity and temperature were obtained from the
  coordinated regional downscaling experiment (CORDEX) simulations of the Rossby Centre Regional Atmospheric
  regional climate model (RCA4). A structural equation model was employed to determine the effects of
  climatic variables on malaria incidence. We developed an intelligent malaria early warning model to
  predict the prevalence of malaria using machine learning by applying three machine learning algorithms,
  including linear regression (LiR), support vector machine (SVM), and negative binomial regression (NBiR).
  RESULTS: Two ecological factors such as factor 1 (related to average mean relative humidity, average
  maximum relative humidity, and average maximal temperature) and factor 2 (related to average minimal
  temperature) affect the incidence of malaria. Support vector machine regression is the best-performing
  algorithm, predicting 82% of malaria incidence in the northern part of Benin. The projection reveals
  an increase in malaria incidence under RCP4.5 and RCP8.5 over the studied period. CONCLUSION: These
  results reveal that the northern part of Benin is at high risk of malaria, and specific malaria control
  programs are urged to reduce the risk of malaria.'
