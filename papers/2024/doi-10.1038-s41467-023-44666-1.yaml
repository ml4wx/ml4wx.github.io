summary: RNN nowcasts geostationary-satellite cloud fraction 0-4 h ahead at PV plants in China, with about
  0.8 correlation for clear-sky ratio in the first 2 hours.
abstract: Accurate nowcasting for cloud fraction is still intractable challenge for stable solar photovoltaic
  electricity generation. By combining continuous radiance images measured by geostationary satellite
  and an advanced recurrent neural network, we develop a nowcasting algorithm for predicting cloud fraction
  at the leading time of 0-4 h at photovoltaic plants. Based on this algorithm, a cyclically updated prediction
  system is also established and tested at five photovoltaic plants and several stations with cloud fraction
  observations in China. The results demonstrate that the cloud fraction nowcasting is efficient, high
  quality and adaptable. Particularly, it shows an excellent forecast performance within the first 2-hour
  leading time, with an average correlation coefficient close to 0.8 between the predicted clear sky ratio
  and actual power generation at photovoltaic plants. Our findings highlight the benefits and potential
  of this technique to improve the competitiveness of solar photovoltaic energy in electricity market.
