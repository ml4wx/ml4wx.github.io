summary: IoT and big-data framework applies k-means clustering and sensor identification to public weather
  data; limited technical novelty and no quantitative results.
abstract: Recent times have seen a rise in the amount of focus placed on the configurations of big data
  and the Internet of Things (IoT). The primary focus of the researchers was the development of big data
  analytics solutions based on machine learning. Machine learning is becoming more prevalent in this sector
  because of its ability to unearth hidden traits and patterns, even within exceedingly complicated datasets.
  This is one reason why this is the case. For the purpose of this study, we applied our Big Data and
  Internet of Things (IoT)-based system to a use case that involved the processing of weather information.
  We put climate clustering and sensor identification algorithms into practice by using data that was
  available to the general public. For this particular application, the execution information was shown
  as follows:every single level of the construction. The training method that we've decided to use for
  the package is a k-means cluster that's based on Scikit-Learn. According to the results of the information
  analyses, our strategy has the potential to be utilized in usefully retrieving information from a database
  that is rather complicated.
