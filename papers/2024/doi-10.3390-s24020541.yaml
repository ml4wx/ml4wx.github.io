summary: Neural networks trained on CALIOP lidar retrieve MODIS cloud top height, with combined inputs
  performing best and tested on a typhoon case.
abstract: 'In order to enhance the retrieval accuracy of cloud top height (CTH) from MODIS data, neural
  network models were employed based on Cloud-Aerosol Lidar with Orthogonal Polarization (CALIOP) data.
  Three types of methods were established using MODIS inputs: cloud parameters, calibrated radiance, and
  a combination of both. From a statistical standpoint, models with combination inputs demonstrated the
  best performance, followed by models with calibrated radiance inputs, while models relying solely on
  calibrated radiance had poorer applicability. This work found that cloud top pressure (CTP) and cloud
  top temperature played a crucial role in CTH retrieval from MODIS data. However, within the same type
  of models, there were slight differences in the retrieved results, and these differences were not dependent
  on the quantity of input parameters. Therefore, the model with fewer inputs using cloud parameters and
  calibrated radiance was recommended and employed for individual case studies. This model produced results
  closest to the actual cloud top structure of the typhoon and exhibited similar cloud distribution patterns
  when compared with the Cloud-Aerosol Lidar and Infrared Pathfinder Satellite Observation (CALIPSO) CTHs
  from a climatic statistical perspective. This suggests that the recommended model has good applicability
  and credibility in CTH retrieval from MODIS images. This work provides a method to improve accurate
  CTHs from MODIS data for better utilization.'
