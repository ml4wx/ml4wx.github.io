summary: Extra-Trees and geographically weighted regression estimate hurricane-impacted areas from Twitter
  VGI, reaching R² of 0.99 under suitable geographic splits.
abstract: Abstract Natural hazards have occurred more frequently in the past years and pose a severe risk
  to human life. Their extents and, thereby, the most heavily affected areas must be estimated at the
  earliest to limit damages or initiate rescue services. For such estimations, a widely available data
  source, which is comparatively responsive to short-time changes, is needed and provided by volunteered
  geographic information (VGI) data. Tropical cyclones are natural hazard events that can cause enormous
  spatially extended damage. In this study, we introduce Machine Learning approaches such as Extremely
  Randomized Tree (ET) and Geographically Weighted Regression for estimating hurricane-impacted regions
  from VGI data. In addition to the general approximate track extent estimation, we also evaluate the
  possibilities of temporal estimation of track development from VGI data. Different scenarios are evaluated,
  and we find that the results mainly depend on the choice of the geographical splits for training and
  test data for the underlying regression task. Suitable splits lead to $$R^2$$ R 2 of 99% in the best
  cases with the ET model. The estimation results are satisfying when considering the temporal aspect
  and represent a use-case scenario. Such a combination of Machine Learning approaches and VGI is a simple
  and fast approach for early natural hazard estimation.
