summary: Soft-voting ensembles of classical classifiers predict weather condition from 33,746 station
  records, reaching 99.03% accuracy; the gains are small relative to single models.
abstract: Weather conditions are one of the crucial factors that need attention. Changes in weather conditions
  significantly impact various activities. Weather condition changes are determined by numerous factors,
  often occurring within a relatively short period in the atmosphere, such as pressure, wind speed, rainfall,
  temperature, and other atmospheric phenomena. Issues in weather forecasting arise due to several factors,
  namely the fluctuating atmospheric conditions. This research proposes the development of a weather forecasting
  model using the ensemble learning method approach. The weather data used consist of 33746 records with
  attributes used after preprocessing, namely Temperature, Dew Point, Humidity, Wind Speed, Wind Gust,
  Pressure, Precipitation, and Condition. Testing in this research employs several single-machine learning
  methods such as K-Nearest Neighbor (KNN), Logistic Regression, Random Forest, Naive Bayes, and Multi-Layer
  Perceptron. The Naive Bayes method using default parameters achieves a high accuracy of 99.00%. In the
  ensemble method, combinations of three methods exhibit excellent accuracy for all combinations. The
  best combination methods are found in the Soft Voting Classifier method (Random Forest, MLP, Naive Bayes),
  Soft Voting Classifier (Logistic Regression, MLP, Naive Bayes), and Soft Voting Classifier (Random Forest,
  KNN, Naive Bayes) with an accuracy of 99.03%.
