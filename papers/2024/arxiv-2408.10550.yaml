summary: EOF-based ocean predictors feed neural networks to forecast spring rainfall in SE Australia,
  with accurate hindcasts for September and October but weaker for November.
abstract: Quantitative forecasting of average rainfall into the next season remains highly challenging,
  but in some favourable isolated cases may be possible with a series of relatively simple steps. We chose
  to explore predictions of austral springtime rainfall in SE Australia regions based on the surrounding
  ocean surface temperatures during the winter. In the first stage, we search for correlations between
  the target rainfall and both the standard ocean climate indicators as well as the time series of surface
  temperature data expanded in terms of Empirical Orthogonal Functions (EOFs). In the case of the Indian
  Ocean, during the winter the dominant EOF shows stronger correlation with the future rainfall than the
  commonly used Indian Ocean Dipole. Information sources with the strongest correlation to the historical
  rainfall data are then used as inputs into deep learning artificial neural networks. The resulting hindcasts
  appear accurate for September and October and less reliable for November. We also attempt to forecast
  the rainfall in several regions for the coming austral spring.
