summary: Neural-network ensembling of eight CORDEX regional climate models for Turkey beats simple averaging
  and linear superensembles for monthly precipitation, though extremes remain poorly represented.
abstract: Abstract Ensemble analysis is proven to provide advantages in climate change impact assessment
  based on outputs from climate models. Ensembled series are shown to outperform single-model assessments
  through increased consistency and stability. This study aims to test the improvement of precipitation
  estimates through the use of ensemble analysis for south and southwestern Turkey which is known to have
  complex climatic features due to varying topography and interacting climate forcings. The analysis covers
  an evaluation of the performance of eight regional climate models (RCMs) from the EUR-11 domain available
  from the CORDEX database. The historical outputs are evaluated for their representativeness of the current
  climate of the Mediterranean region and its surroundings in Turkey through a comparison with long-term
  monthly precipitation time series obtained from ground-based precipitation observations by the use of
  statistical performance indicators and Taylor diagrams. This is followed by a comparative evaluation
  of three ensemble methodologies, simple average of the models, multiple linear regression for superensemble,
  and artificial neural networks (ANN). The analysis results show that the overall performance of ensembled
  time series is better compared to individual RCMs. ANN generally provided the best performance when
  all RCMs are used as inputs. Improvement in the performance of ensembling due to the use of nonlinear
  models is further confirmed by fuzzy inference systems (FIS). Both ANN and FIS generated monthly precipitation
  time series with higher correlations with those of observations. However, extreme events are poorly
  represented in the ensembled time series, and this may result in inefficiency in the design of various
  water structures such as spillways and storm water drainage systems that are based on high return period
  events.
