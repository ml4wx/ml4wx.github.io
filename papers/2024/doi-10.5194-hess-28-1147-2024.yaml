summary: D-vine copula quantile regression merges four satellite rainfall products with rain gauges in
  Ethiopia, reducing uncertainty relative to simple averaging methods.
abstract: Abstract. Precipitation is a vital key element in various studies of hydrology, flood prediction,
  drought monitoring, and water resource management. The main challenge in conducting studies over remote
  regions with rugged topography is that weather stations are usually scarce and unevenly distributed.
  However, open-source satellite-based precipitation products (SPPs) with a suitable resolution provide
  alternative options in these data-scarce regions, which are typically associated with high uncertainty.
  To reduce the uncertainty of individual satellite products, we have proposed a D-vine copula-based quantile
  regression (DVQR) model to merge multiple SPPs with rain gauges (RGs). The DVQR model was employed during
  the 2001–2017 summer monsoon seasons and compared with two other quantile regression methods based on
  the multivariate linear (MLQR) and the Bayesian model averaging (BMAQ) techniques, respectively, and
  with two traditional merging methods – the simple modeling average (SMA) and the one-outlier-removed
  average (OORA) – using descriptive and categorical statistics. Four SPPs have been considered in this
  study, namely, Tropical Applications of Meteorology using SATellite (TAMSAT v3.1), the Climate Prediction
  Center MORPHing Product Climate Data Record (CMORPH-CDR), Global Precipitation Measurement (GPM) Integrated
  Multi-satellitE Retrievals for GPM (IMERG v06), and Precipitation Estimation from Remotely Sensed Information
  using Artificial Neural Networks (PERSIANN-CDR). The bilinear (BIL) interpolation technique was applied
  to downscale SPPs from a coarse to a fine spatial resolution (1 km). The rugged-topography region of
  the upper Tekeze–Atbara Basin (UTAB) in Ethiopia was selected as the study area. The results indicate
  that the precipitation data estimates with the DVQR, MLQR, and BMAQ models and with traditional merging
  methods outperform the downscaled SPPs. Monthly evaluations reveal that all products perform better
  in July and September than in June and August due to precipitation variability. The DVQR, MLQR, and
  BMAQ models exhibit higher accuracy than the traditional merging methods over the UTAB. The DVQR model
  substantially improved all of the statistical metrics (CC = 0.80, NSE = 0.615, KGE = 0.785, MAE = 1.97
  mm d−1, RMSE = 2.86 mm d−1, and PBIAS = 0.96 %) considered compared with the BMAQ and MLQR models. However,
  the DVQR model did not outperform the BMAQ and MLQR models with respect to the probability of detection
  (POD) and false-alarm ratio (FAR), although it had the best frequency bias index (FBI) and critical
  success index (CSI) among all of the employed models. Overall, the newly proposed merging approach improves
  the quality of SPPs and demonstrates the value of the proposed DVQR model in merging multiple SPPs over
  regions with rugged topography such as the UTAB.
