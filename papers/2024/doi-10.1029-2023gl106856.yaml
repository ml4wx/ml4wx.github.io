summary: Explainable machine learning on Lagrangian CESM2 output links stratocumulus biases to overestimated
  sea surface temperature drying, suggesting a cause of high climate sensitivity.
abstract: Abstract This study leveraged a Lagrangian framework to examine the evolution of stratocumulus
  clouds under cold and warm advections (CADV and WADV) in the Community Earth System Model 2 (CESM2)
  against observations. We found that CESM2 simulates a too rapid decline in low‐cloud fraction (LCF)
  and cloud liquid water path (CLWP) under CADV conditions, while it better aligns closely with observed
  LCF under WADV conditions but overestimates the increase in CLWP. Employing an explainable machine learning
  approach, we found that too rapid decreases in LCF and CLWP under CADV conditions are related to overestimated
  drying effects induced by sea surface temperature, whereas the substantial increase in CLWP under WADV
  conditions is associated with the overestimated moistening effects due to free‐tropospheric moisture
  and surface winds. Our findings suggest that overestimated drying effects of sea surface temperature
  on cloud properties might be one of crucial causes for the high equilibrium climate sensitivity in CESM2.
