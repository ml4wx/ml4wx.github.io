summary: A two-layer LSTM forecasts daily temperature, precipitation and humidity for Delhi from historical
  station data, with satisfactory temperature accuracy reported but no quantified skill.
abstract: Climaate prediction plays a vital role in various sectors, including agriculture, disaster management,
  and urban planning. Traditional methods for climate forecasting often rely on complex physical models,
  which require substantial computational resources and may not accurately capture local weather patterns.
  This study explores the potential of Long Short-Term Memory (LSTM) networks, a type of recurrent neural
  network, for predicting daily climate variables such as temperature, precipitation, and humidity. Utilizing
  historical climate data from the city of Delhi, we developed an LSTM model to forecast short-term climate
  trends. The model consists of two LSTM layers followed by three Dense layers and is compiled with the
  Adam optimizer, mean squared error loss, and mean absolute error as a metric. Our results demonstrate
  the model's capability to capture temporal dependencies in climate data, achieving a satisfactory level
  of accuracy in temperature forecasting. This research underscores the potential of machine learning
  techniques, particularly LSTM networks, in enhancing climate prediction and contributing to more informed
  decision-making in weather-sensitive sectors.
