summary: Trains a network to jointly predict climate extremes and their spatio-temporal physical drivers,
  identifying drivers with binary masks on three new synthetic and reanalysis-based benchmarks.
abstract: The spatio-temporal relations of impacts of extreme events and their drivers in climate data
  are not fully understood and there is a need of machine learning approaches to identify such spatio-temporal
  relations from data. The task, however, is very challenging since there are time delays between extremes
  and their drivers, and the spatial response of such drivers is inhomogeneous. In this work, we propose
  a first approach and benchmarks to tackle this challenge. Our approach is trained end-to-end to predict
  spatio-temporally extremes and spatio-temporally drivers in the physical input variables jointly. By
  enforcing the network to predict extremes from spatio-temporal binary masks of identified drivers, the
  network successfully identifies drivers that are correlated with extremes. We evaluate our approach
  on three newly created synthetic benchmarks, where two of them are based on remote sensing or reanalysis
  climate data, and on two real-world reanalysis datasets. The source code and datasets are publicly available
  at the project page https://hakamshams.github.io/IDE.
