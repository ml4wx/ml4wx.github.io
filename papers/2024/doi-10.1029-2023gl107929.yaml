summary: Global ~9 km data-driven Probability of Fire model using vegetation and weather forecasts outperforms
  fire danger indices up to 10 days ahead, sometimes 30.
abstract: Abstract Accurate wildfire forecasting can inform regional management and mitigation strategies
  in advance of fire occurrence. Existing systems typically use fire danger indices to predict landscape
  flammability, based on meteorological forecasts alone, often using little or no direct information on
  land surface or vegetation state. Here, we use a vegetation characteristic model, weather forecasts
  and a data‐driven machine learning approach to construct a global daily ∼9 km resolution Probability
  of Fire (PoF) model operating at multiple lead times. The PoF model outperforms existing indices, providing
  accurate forecasts of fire activity up to 10 days in advance, and in some cases up to 30 days. The model
  can also be used to investigate historical shifts in regional fire patterns. Furthermore, the underlying
  data driven approach allows PoF to be used for fire attribution, isolating key variables for specific
  fire events or for looking at the relationships between variables and fire occurrence.
