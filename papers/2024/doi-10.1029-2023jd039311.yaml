summary: GAN-UNet forecasts East Asian atmospheric river occurrence and intensity; averaged with ECMWF
  it raises 5-day F1 to 0.777 from 0.712.
abstract: Abstract Accurate forecasting of atmospheric rivers (ARs) holds significance in preventing losses
  from extreme precipitation. However, traditional numerical weather prediction (NWP) models are computationally
  expensive and can be limited in accuracy due to inaccurate physical parameter settings. To overcome
  these limitations, we propose a deep learning (DL) model, called GAN‐UNet, to forecast the AR occurrence,
  position, and intensity in East Asia. GAN‐UNet can capture the complex nonlinear relationship between
  the inputs at the past moment, including the vertically integrated water vapor transport (IVT), zonal
  wind at 850 hPa (U850), and meridional wind at 850 hPa (V850), and the forecast output (IVT, U850, or
  V850), whose results are comparable to NWP models. In addition, the average model (AM) by integrating
  the results generated by GAN‐UNet and European Centre for Medium‐Range Weather Forecasts (ECMWF) outperforms
  all the NWP models selected in this study, demonstrating its potential to improve the performance of
  NWP through the DL method. Specifically, the 5‐day average F1 scores of the AM are 0.777 and 0.845,
  whose values are significantly better than those obtained by ECMWF (0.712 and 0.794) in the two key
  regions of East Asia; The AM 5‐day average intersection over unions are 0.706 and 0.688 while the values
  of ECMWF are 0.675 and 0.64; in terms of intensity forecast, GAN‐UNet and AM exhibited lower differences
  in most of the intensity bins, except for the final bin with IVT more than 825 kg m −1 s −1 . With this
  thorough analysis, GAN‐UNet is shown as an effective model to forecast ARs.
