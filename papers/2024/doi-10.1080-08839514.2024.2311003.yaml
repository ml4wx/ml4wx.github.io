summary: SA-TrajGRU adds self-attention to TrajGRU for radar echo extrapolation, achieving higher HSS
  and CSI at 25 dBZ than comparable convolutional recurrent models.
abstract: Radar echo extrapolation is an important approach in precipitation nowcasting which utilizes
  historical radar echo images to predict future echo images.In this paper, we introduce the selfattention
  mechanism into Trajectory Gated Recurrent Unit (TrajGRU) model.Under the sequence-to-sequence framework,
  we have developed a novel convolutional recurrent neural network called Self-attention Trajectory Gated
  Recurrent Unit (SA-TrajGRU), which incorporates the self-attention mechanism.The SA-TrajGRU model which
  combines spatiotemporal variant structure in TrajGRU and self-attention module is simple and effective.We
  evaluate our approach on the Moving MNIST-2 dataset and the CIKM AnalytiCup 2017 radar echo dataset.The
  experimental results show that the performance of the proposed SA-TrajGRU model is comparable to other
  convolutional recurrent neural network models.HSS and CSI scores of the SA-TrajGRU model are higher
  than scores of other models under the radar echo threshold of 25 dBZ, indicating that the SA-TrajGRU
  model has the most accurate prediction results under this threshold.
