summary: Deep learning emulates boundary-layer cloud occurrence and base height over the Southern Great
  Plains using 20 years of ARM data, usable as a cloud parameterization.
abstract: Abstract. This study developed a deep learning model to simulate the complex dynamics of boundary
  layer clouds (BLCs) over the US Southern Great Plains. Using over twenty years of extensive observations
  from the Atmospheric Radiation Measurement program for training and validation, the model diagnoses
  the BLCs from the perspective of cloud-land coupling. Morning meteorological profiles set as the initial
  conditions and then identifying triggers for BLCs formation from surface meteorology. The deep learning
  model offer accurate simulation of the convection initiation and cloud base of BLCs. In comparison with
  reanalysis data (i.e., ERA-5 and MERRA-2), it provides a notable improvement in the vertical structure
  of low clouds from a climatological perspective. The deep learning model can serve as the cloud parameterization
  and extend to analyzing stratiform and cumulus clouds within reanalysis frameworks, offering insights
  into improving the simulation of BLCs. By quantifying biases due to various meteorological factors and
  parameterizations, this deep learning-driven approach bridges the observational-modeling divide. Surface
  humidity and parameterization emerge as key limiting factors to affect the representation of BLCs in
  the reanalysis data. This deep learning approach holds promise for improving the convection parameterization
  and advancing model diagnostics in weather forecasting and climate modelling.
