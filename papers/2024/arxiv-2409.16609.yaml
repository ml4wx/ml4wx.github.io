summary: Ranks climate impact pathways by training random forests and applying SHAP importances, verified
  on a simulated Mount Pinatubo eruption in E3SMv2.
abstract: 'Disturbances to the climate system, both natural and anthropogenic, have far reaching impacts
  that are not always easy to identify or quantify using traditional climate science analyses or causal
  modeling techniques. In this paper, we develop a novel technique for discovering and ranking the chain
  of spatio-temporal downstream impacts of a climate source, referred to herein as a source-impact pathway,
  using Random Forest Regression (RFR) and SHapley Additive exPlanation (SHAP) feature importances. Rather
  than utilizing RFR for classification or regression tasks (the most common use case for RFR), we propose
  a fundamentally new workflow in which we: (i) train random forest (RF) regressors on a set of spatio-temporal
  features of interest, (ii) calculate their pair-wise feature importances using the SHAP weights associated
  with those features, and (iii) translate these feature importances into a weighted pathway network (i.e.,
  a weighted directed graph), which can be used to trace out and rank interdependencies between climate
  features and/or modalities. Importantly, while herein we employ RFR and SHAP feature importance in steps
  (i) and (ii) of our algorithm, our novel workflow is in no way tied to these approaches, which could
  be replaced with any regression method and sensitivity method. We adopt a tiered verification approach
  to verify our new pathway identification methodology. In this approach, we apply our method to ensembles
  of data generated by running two increasingly complex benchmarks: (i) a set of synthetic coupled equations,
  and (ii) a fully coupled simulation of the 1991 eruption of Mount Pinatubo in the Philippines performed
  using a modified version 2 of the U.S. Department of Energy''s Energy Exascale Earth System Model (E3SMv2).
  We find that our RFR feature importance-based approach can accurately detect known pathways of impact
  for both test cases.'
