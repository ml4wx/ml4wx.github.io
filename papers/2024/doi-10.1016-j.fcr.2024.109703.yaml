summary: Machine learning with a disease model projects French wheat yield losses under CMIP6 climates,
  with heatwave losses doubling and extreme low yields becoming decadal by 2100.
abstract: In recent decades, compounding weather extremes and plant diseases have increased wheat yield
  variability in France, the largest wheat producer in the European Union. How these extremes might affect
  future wheat production remains unclear. Based on department level wheat yields, disease, and climate
  indices from 1980 to 2019 in France, we combined an existing disease model with machine learning algorithms
  to estimate future grain yields. This approach explains about 59% of historical yield variability. Projections
  from five CMIP6 climate models suggest that extreme low wheat yields, which used to occur once every
  20 years, could occur every decade by the end of this century, but elevated CO 2 levels might lessen
  these events. Heatwave-related yield losses are expected to double, while flooding-related yield losses
  will potentially decline by one third, depending on the representative concentration pathway. Ear blight
  disease is projected to contribute to 20% of the expected 400 kg ha -1 average yield losses by the end
  of the century, compared with 12% in the historical baseline period. These projections depend on the
  timing of anthesis, currently between late May and early June in most departments. Anthesis advancing
  to early May would shift losses primarily to heavy rainfall and low solar radiation. French wheat production
  must adapt to these emerging threats, such as heat stress, which until recently had little impact but
  may become the primary cause of future yield losses. • Machine learning predicts wheat yield losses
  from climate and disease factors. • Heatwave losses may double, while flooding losses may decrease by
  one-third. • Ear blight may account for 20 % of yield losses by century's end.
