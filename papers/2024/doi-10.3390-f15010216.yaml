summary: Proposes SLA-ConvLSTM, a ConvLSTM that adds static location information and teleconnection indices
  for global wildfire danger prediction, outperforming baseline deep models.
abstract: Climate change will intensify the danger of wildfires, significantly impacting human life. Deep
  Learning (DL) has been extensively applied in wildfire prediction research. In the realm of wildfire
  prediction, previous deep learning methods have overlooked the inherent differences between static positional
  information and dynamic variables. Additionally, most existing deep learning models have not integrated
  the global system characteristics of the Earth’s features and teleconnection during the learning phase.
  Here, we propose a static location-aware ConvLSTM (SLA-ConvLSTM) model that is aware of static positional
  elements and interconnected with global information and teleconnection. The model we propose can discern
  the influence of dynamic variables across various geographical locations on predictive outcomes. Compared
  with other deep learning models, our SLA-ConvLSTM model has achieved commendable performance. The outcomes
  indicate that the collaborative interplay of spatiotemporal features and the extraction of static positional
  information present a promising technique for wildfire prediction. Moreover, the incorporation of climate
  indices and global feature variables enhances the predictive capability of the model in wildfire prediction.
