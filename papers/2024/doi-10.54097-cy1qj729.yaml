summary: QpefQH is a radar-based benchmark of over 15,000 images for deep-learning precipitation estimation
  and echo extrapolation in Qinghai Province.
abstract: We collected short-duration heavy precipitation events around weather radar since 2020 and get
  radar base data of these events. Then, we extracted radar products like Composite Reflectivity (CR),
  echo top height (ET) and Vertically Integrated Liquid Water (VIL) from radar base data after quality
  control as the input of dataset, and merge the surface precipitation of 6 minutes with background field
  using multi-grid variation to generate precipitation label by 6 minutes. Thus, we constructed two datasets
  artificial intelligence application QpefQH for short-duration heavy precipitation. QpefQH dataset has
  a scale of more than 15,000 images available for radar echo extrapolation and quantitative precipitation
  estimation tasks based on deep learning. QpefQH dataset also includes multi-source data such as satellite,
  numerical model, sounding, lightning, land surface temperature, pressure, wind and other observation
  data. QpefQH can be shared as a benchmark dataset for artificial intelligence research on short-duration
  heavy precipitation in Qinghai Province.
