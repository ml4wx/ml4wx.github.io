summary: Sequence parallelism lets Vision Transformers handle 1M-token inputs on 2,048 GPUs at 94% scaling
  efficiency, improving climate temperature prediction accuracy by 20%.
abstract: Vision Transformers (ViTs) are pivotal for foundational models in scientific imagery, including
  Earth science applications, due to their capability to process large sequence lengths. While transformers
  for text has inspired scaling sequence lengths in ViTs, yet adapting these for ViTs introduces unique
  challenges. We develop distributed sequence parallelism for ViTs, enabling them to handle up to 1M tokens.
  Our approach, leveraging DeepSpeed-Ulysses and Long-Sequence-Segmentation with model sharding, is the
  first to apply sequence parallelism in ViT training, achieving a 94% batch scaling efficiency on 2,048
  AMD-MI250X GPUs. Evaluating sequence parallelism in ViTs, particularly in models up to 10B parameters,
  highlighted substantial bottlenecks. We countered these with hybrid sequence, pipeline, tensor parallelism,
  and flash attention strategies, to scale beyond single GPU memory limits. Our method significantly enhances
  climate modeling accuracy by 20% in temperature predictions, marking the first training of a transformer
  model on a full-attention matrix over 188K sequence length.
