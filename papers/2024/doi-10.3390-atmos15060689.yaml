summary: Reviews data-driven weather and climate models, noting ML models trained on reanalysis reach
  useful skill to 15 days and match NWP for 90% of variables.
abstract: Accurate and rapid weather forecasting and climate modeling are universal goals in human development.
  While Numerical Weather Prediction (NWP) remains the gold standard, it faces challenges like inherent
  atmospheric uncertainties and computational costs, especially in the post-Moore era. With the advent
  of deep learning, the field has been revolutionized through data-driven models. This paper reviews the
  key models and significant developments in data-driven weather forecasting and climate modeling. It
  provides an overview of these models, covering aspects such as dataset selection, model design, training
  process, computational acceleration, and prediction effectiveness. Data-driven models trained on reanalysis
  data can provide effective forecasts with an accuracy (ACC) greater than 0.6 for up to 15 days at a
  spatial resolution of 0.25°. These models outperform or match the most advanced NWP methods for 90%
  of variables, reducing forecast generation time from hours to seconds. Data-driven climate models can
  reliably simulate climate patterns for decades to 100 years, offering a magnitude of computational savings
  and competitive performance. Despite their advantages, data-driven methods have limitations, including
  poor interpretability, challenges in evaluating model uncertainty, and conservative predictions in extreme
  cases. Future research should focus on larger models, integrating more physical constraints, and enhancing
  evaluation methods.
