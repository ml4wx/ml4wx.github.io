summary: VMD, African Vulture optimization and LSSVM coupled model with stepwise decomposition forecasts
  monthly precipitation at North China Plain stations; stepwise sampling avoids data leakage.
abstract: Traditional decomposition integration models decompose the original sequence into subsequences,
  which are then proportionally divided into training and testing periods for modeling. Decomposition
  may cause data aliasing, then the decomposed training period may contain part of the test period data.
  A more effective method of sample construction is sought in order to accurately validate the model prediction
  accuracy. Semi-stepwise decomposition (SSD), full stepwise decomposition (FSD), single model semi-stepwise
  decomposition (SMSSD), and single model full stepwise decomposition (SMFSD) techniques were used to
  create the samples. This study integrates Variational Mode Decomposition (VMD), African Vulture Optimization
  Algorithm (AVOA), and Least Squares Support Vector Machine (LSSVM) to construct a coupled rainfall prediction
  model. The influence of different VMD parameters α is examined, and the most suitable stepwise decomposition
  machine learning coupled model algorithm for various stations in the North China Plain is selected.
  The results reveal that SMFSD is relatively the most suitable tool for monthly precipitation forecasting
  in the North China Plain. Among the predictions for the five stations, the best overall performance
  is observed at Huairou Station (RMSE of 18.37 mm, NSE of 0.86, MRE of 107.2%) and Jingxian Station (RMSE
  of 24.74 mm, NSE of 0.86, MRE of 51.71%), while Hekou Station exhibits the poorest performance (RMSE
  of 25.11 mm, NSE of 0.75, MRE of 173.75%).
