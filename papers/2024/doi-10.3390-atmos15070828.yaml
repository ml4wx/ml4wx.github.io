summary: Extended Kalman filter with neural-network-tuned covariances post-processes NWP wind, temperature
  and wave height, cutting systematic error by over 75%.
abstract: A hybrid optimization filter for weather and wave numerical models is proposed and tested in
  this study. Parametrized Artificial Neural Networks are utilized in conjunction with Extended Kalman
  Filters to provide a novel postprocess strategy for 10 m wind speed, 2 m air temperature, and significant
  wave height simulations. The innovation of the developed model is the implementation of Feedforward
  Neural Networks and Radial Basis Function Neural Networks as estimators of an exogenous parameter that
  adjusts the covariance matrices of the Extended Kalman Filter process. This hybrid system is evaluated
  through a time window process leading to promising results, thus enabling a decrease in systematic errors
  alongside the restriction of the error variability and the corresponding forecast uncertainty. The obtained
  results showed that the average reduction of the systematic error exceeded 75%, while the corresponding
  nonsystematic part of that error decreased by 35%.
