summary: A hybrid model adds a deep-learning non-Markovian correction to a Linear Inverse Model trained
  on short observational records, beating both the LIM and a full deep-learning model for ENSO up to 1
  year.
abstract: While deep-learning models have demonstrated skillful El Niño Southern Oscillation (ENSO) forecasts
  up to one year in advance, they are predominantly trained on climate model simulations that provide
  thousands of years of training data at the expense of introducing climate model biases. Simpler Linear
  Inverse Models (LIMs) trained on the much shorter observational record also make skillful ENSO predictions
  but do not capture predictable nonlinear processes. This motivates a hybrid approach, combining the
  LIMs modest data needs with a deep-learning non-Markovian correction of the LIM. For O(100 yr) datasets,
  our resulting Hybrid model is more skillful than the LIM while also exceeding the skill of a full deep-learning
  model. Additionally, while the most predictable ENSO events are still identified in advance by the LIM,
  they are better predicted by the Hybrid model, especially in the western tropical Pacific for leads
  beyond about 9 months, by capturing the subsequent asymmetric (warm versus cold phases) evolution of
  ENSO.
