summary: YanTian is a plug-in platform wrapping open-source AI global forecast models with local accuracy,
  high-resolution, and GUI features so meteorologists can use them without coding.
abstract: To promote the practical application of AI Global Weather Forecasting Models (AIGWFM), we have
  developed an adaptable application platform named 'YanTian'. This platform enhances existing open-source
  AIGWFM with a suite of capability-enhancing modules and is constructed by a "loosely coupled" plug-in
  architecture. The goal of 'YanTian' is to address the limitations of current open-source AIGWFM in operational
  application, including improving local forecast accuracy, providing spatial high-resolution forecasts,
  increasing density of forecast intervals, and generating diverse products with the provision of AIGC
  capabilities. 'YianTian' also provides a simple, visualized user interface, allowing meteorologists
  easily access both basic and extended capabilities of the platform by simply configuring the platform
  UI. Users do not need to possess the complex artificial intelligence knowledge and the coding techniques.
  Additionally, 'YianTian' can be deployed on a PC with GPUs. We hope 'YianTian' can facilitate the operational
  widespread adoption of AIGWFMs.
