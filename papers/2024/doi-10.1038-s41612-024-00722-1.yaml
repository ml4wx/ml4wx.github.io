summary: Explainable ML identifies Gobi and Tianshan snow-depth variability as key teleconnection drivers
  predicting annual heatwave frequency in South Korea.
abstract: Abstract Increasing heatwave intensity and mortality demand timely and accurate heatwave prediction.
  The present study focused on teleconnection, the influence of distant land and ocean variability on
  local weather events, to drive long-term heatwave predictions. The complexity of teleconnection poses
  challenges for physical-based prediction models. In this study, we employed a machine learning model
  and explainable artificial intelligence to identify the teleconnection drivers for heatwaves in South
  Korea. Drivers were selected based on their statistical significance with annual heatwave frequency
  ( | R | > 0.3, p < 0.05). Our analysis revealed that two snow depth (SD) variabilities—a decrease in
  the Gobi Desert and increase in the Tianshan Mountains—are the most important and predictive teleconnection
  drivers. These drivers exhibit a high correlation with summer climate conditions conducive to heatwaves.
  Our study lays the groundwork for further research into understanding land–atmosphere interactions over
  these two SD regions and their significant impact on heatwave patterns in South Korea.
