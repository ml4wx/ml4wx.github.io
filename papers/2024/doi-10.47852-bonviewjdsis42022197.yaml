summary: Self-attention PredRNN++ extrapolates radar echoes two hours ahead for severe convective weather,
  outperforming other models on a competition dataset.
abstract: 'Severe convective weather, characterized by short-term intense precipitation, thunderstorms,
  and strong winds, poses significant threats to human life and property. Therefore, accurate and efficient
  prediction of severe convective weather is crucial for disaster prevention. Currently, utilizing deep
  learning for radar echo extrapolation stands as the primary method for forecasting severe convective
  weather. We propose a predictive recurrent neural network model that integrates a self-attention mechanism,
  specifically designed for radar echo extrapolation in severe convective weather forecasting. The self-attention
  mechanism offers the advantage of being lightweight, as it does not substantially increase the model
  parameters. Additionally, it facilitates global attention extraction, thereby enhancing the model’s
  accuracy to some extent. By utilizing radar echo images from the previous hour as input, the model undergoes
  self-learning to achieve the best forecast for radar echo extrapolation in the subsequent two hours.
  Research findings demonstrate that our model outperforms other models in accurately predicting severe
  convective weather within this two-hour timeframe. Received: 30 November 2023| Revised: 19 April 2024
  | Accepted: 16 May 2024 Conflicts of Interest The authors declare that they have no conflicts of interest
  to this work. Data Availability Statement The data used in this study is a competition dataset, which
  is not an open source at this time. It is available from the corresponding author upon reasonable request.
  Author Contribution Statement Qiongying Xue: Conceptualization, Methodology, Software, Validation, Formal
  analysis, Investigation, Writing - original draft, Writing - review & editing, Supervision, Project
  administration. Fei Fang: Conceptualization, Methodology, Investigation, Resources, Data curation, Writing
  - original draft, Writing - review & editing, Supervision, Project administration, Funding acquisition.'
