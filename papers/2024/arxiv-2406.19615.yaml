summary: VarteX proposes a distributed variable aggregation scheme for data-driven global weather forecasting
  that beats a baseline with fewer parameters and resources.
abstract: Weather forecasting is essential for various human activities. Recent data-driven models have
  outperformed numerical weather prediction by utilizing deep learning in forecasting performance. However,
  challenges remain in efficiently handling multiple meteorological variables. This study proposes a new
  variable aggregation scheme and an efficient learning framework for that challenge. Experiments show
  that VarteX outperforms the conventional model in forecast performance, requiring significantly fewer
  parameters and resources. The effectiveness of learning through multiple aggregations and regional split
  training is demonstrated, enabling more efficient and accurate deep learning-based weather forecasting.
