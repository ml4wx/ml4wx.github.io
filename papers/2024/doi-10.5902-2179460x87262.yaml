summary: Applies PredRNN++ recurrent convolutional network to Chapecó radar images for 3-hour storm nowcasting,
  evaluated with MSE and SSIM on case studies.
abstract: This work proposes a new computational approach that makes use of Recurrent Convolutional Neural
  Networks, in which weather radar images a r e used to predict the spread and intensity of storms up
  to 3 hours in advance, known as nowcasting. To this end, we used images from the meteorological radar
  located in the city of Chapecó - SC. This data is public and available on the website of the Institute
  for Space Research (INPE). To this end, we propose to evaluate the use of a recurrent convolutional
  neural network with spatiotemporal learning called PredRNN++. The results were validated through case
  studies of storms that occurred in the region covered by the radar used. To evaluate the performance
  of the neural network, in addition to a visual analysis of the results, the MSE and SSIM metrics were
  used. The results show that PredRNN++ was able to simulate the shape and location of the weather system.
