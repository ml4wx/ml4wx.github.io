summary: Combines statistical/ML models with regional climate models to project pluvial flood losses for
  insurance portfolios across Canada and the US at 10–25 km resolution.
abstract: Abstract There is mounting pressure on (re)insurers to quantify the impacts of climate change,
  notably on the frequency and severity of claims due to weather events such as flooding. This is however
  a very challenging task for (re)insurers as it requires modeling at the scale of a portfolio and at
  a high enough spatial resolution to incorporate local climate change effects. In this paper, we introduce
  a data science approach to climate change risk assessment of pluvial flooding for insurance portfolios
  over Canada and the United States (US). The underlying flood occurrence model quantifies the financial
  impacts of short-term (12–48 h) precipitation dynamics over the present (2010–2030) and future climate
  (2040–2060) by leveraging statistical/machine learning and regional climate models. The flood occurrence
  model is designed for applications that do not require street-level precision as is often the case for
  scenario and trend analyses. It is applied at the full scale of Canada and the US over 10–25 km grids.
  Our analyses show that climate change and urbanization will typically increase losses over Canada and
  the US, while impacts are strongly heterogeneous from one state or province to another, or even within
  a territory. Portfolio applications highlight the importance for a (re)insurer to differentiate between
  future changes in hazard and exposure, as the latter may magnify or attenuate the impacts of climate
  change on losses.
