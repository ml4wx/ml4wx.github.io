summary: AI greenhouse controller combines gridded weather forecasts with a CLSTM-CNN-BP model to predict
  hourly microclimate and enable preemptive cooling in a field test.
abstract: The rise in extreme weather events due to climate change challenges the balance of supply and
  demand for high-quality agricultural products. In Taiwan, greenhouse cultivation, a key agricultural
  method, faces increasing summer temperatures and higher operational costs. This study presents the innovative
  AI-powered greenhouse environmental control system (AI-GECS), which integrates customized gridded weather
  forecasts, microclimate forecasts, crop physiological indicators, and automated greenhouse operations.
  This system utilizes a Multi-Model Super Ensemble (MMSE) forecasting framework to generate accurate
  hourly gridded weather forecasts. Building upon these forecasts, combined with real-time in-greenhouse
  meteorological data, the AI-GECS employs a hybrid deep learning model, CLSTM-CNN-BP, to project the
  greenhouse’s microclimate on an hourly basis. This predictive capability allows for the assessment of
  crop physiological indicators within the anticipated microclimate, thereby enabling preemptive adjustments
  to cooling systems to mitigate adverse conditions. All processes run on a cloud-based platform, automating
  operations for enhanced environmental control. The AI-GECS was tested in an experimental greenhouse
  at the Taiwan Agricultural Research Institute, showing strong alignment with greenhouse management needs.
  This system offers a resource-efficient, labor-saving solution, fusing microclimate forecasts with crop
  models to support sustainable agriculture. This study represents critical advancements in greenhouse
  automation, addressing the agricultural challenges of climate variability.
