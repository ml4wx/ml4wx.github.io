summary: Machine learning emulates urban climate models to predict street-level air temperature, humidity,
  wind and UTCI at 1 m resolution, with 2.3 K mean absolute error.
abstract: Abstract. As the frequency and intensity of heatwaves will continue to increase in the future,
  accurate and high-resolution mapping and forecasting of human outdoor thermal comfort in urban environments
  are of great importance. This study presents a machine-learning-based outdoor thermal comfort model
  with a good trade-off between computational cost, complexity, and accuracy compared to common numerical
  urban climate models. The machine learning approach is basically an emulation of different numerical
  urban climate models. The final model consists of four submodels that predict air temperature, relative
  humidity, wind speed, and mean radiant temperature based on meteorological forcing and geospatial data
  on building forms, land cover, and vegetation. These variables are then combined into a thermal index
  (universal thermal climate index – UTCI). All four submodel predictions and the final model output are
  evaluated using street-level measurements from a dense urban sensor network in Freiburg, Germany. The
  final model has a mean absolute error of 2.3 K. Based on a city-wide simulation for Freiburg, we demonstrate
  that the model is fast and versatile enough to simulate multiple years at hourly time steps to predict
  street-level UTCI at 1 m spatial resolution for an entire city. Simulations indicate that neighbourhood-averaged
  thermal comfort conditions vary widely between neighbourhoods, even if they are attributed to the same
  local climate zones, for example, due to differences in age and degree of urban vegetation. Simulations
  also show contrasting differences in the location of hotspots during the day and at night.
