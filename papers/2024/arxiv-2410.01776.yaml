summary: Combining RCM dynamical downscaling with diffusion refinement lets large CMIP6 ensembles be downscaled
  cheaply, giving better uncertainty bounds than BCSD and smaller dynamical ensembles.
abstract: Regional high-resolution climate projections are crucial for many applications, such as agriculture,
  hydrology, and natural hazard risk assessment. Dynamical downscaling, the state-of-the-art method to
  produce localized future climate information, involves running a regional climate model (RCM) driven
  by an Earth System Model (ESM), but it is too computationally expensive to apply to large climate projection
  ensembles. We propose a novel approach combining dynamical downscaling with generative artificial intelligence
  to reduce the cost and improve the uncertainty estimates of downscaled climate projections. In our framework,
  an RCM dynamically downscales ESM output to an intermediate resolution, followed by a generative diffusion
  model that further refines the resolution to the target scale. This approach leverages the generalizability
  of physics-based models and the sampling efficiency of diffusion models, enabling the downscaling of
  large multi-model ensembles. We evaluate our method against dynamically-downscaled climate projections
  from the CMIP6 ensemble. Our results demonstrate its ability to provide more accurate uncertainty bounds
  on future regional climate than alternatives such as dynamical downscaling of smaller ensembles, or
  traditional empirical statistical downscaling methods. We also show that dynamical-generative downscaling
  results in significantly lower errors than bias correction and spatial disaggregation (BCSD), and captures
  more accurately the spectra and multivariate correlations of meteorological fields. These characteristics
  make the dynamical-generative framework a flexible, accurate, and efficient way to downscale large ensembles
  of climate projections, currently out of reach for pure dynamical downscaling.
