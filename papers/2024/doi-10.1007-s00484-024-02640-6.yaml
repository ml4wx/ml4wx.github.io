summary: Linear regression and neural networks post-process operational UTCI thermal-comfort forecasts
  at 42 Slovenian stations, cutting mean error from 2.6°C to near zero.
abstract: Abstract The Universal Thermal Climate Index (UTCI) is a thermal comfort index that describes
  how the human body experiences ambient conditions. It has units of temperature and considers physiological
  aspects of the human body. It takes into account the effect of air temperature, humidity, wind, radiation,
  and clothes. It is increasingly used in many countries as a measure of thermal comfort for outdoor conditions,
  and its value is calculated as part of the operational meteorological forecast. At the same time, forecasts
  of outdoor UTCI tend to have a relatively large error caused by the error of meteorological forecasts.
  In Slovenia, there is a relatively dense network of meteorological stations. Crucially, at these stations,
  global solar radiation measurements are performed continuously, which makes estimating the actual value
  of the UTCI more accurate compared to the situation where no radiation measurements are available. We
  used seven years of measurements in hourly resolution from 42 stations to first verify the operational
  UTCI forecast for the first forecast day and, secondly, to try to improve the forecast via post-processing.
  We used two machine-learning methods, linear regression, and neural networks. Both methods have successfully
  reduced the error in the operational UTCI forecasts. Both methods reduced the daily mean error from
  about 2.6 $$^{\circ }$$ ∘ C to almost zero, while the daily mean absolute error decreased from 5 $$^{\circ
  }$$ ∘ C to 3 $$^{\circ }$$ ∘ C for the neural network and 3.5 $$^{\circ }$$ ∘ C for linear regression.
  Both methods, especially the neural network, also substantially reduced the dependence of the error
  on the time of the day.
