summary: Autodifferentiated physics-based simulator with invertible neural surrogates infers atmospheric
  transmission profiles for atmospheric correction of spectral imagery.
abstract: We present a framework for inferring an atmospheric transmission profile from a spectral scene.
  This framework leverages a lightweight, physics-based simulator that is automatically tuned - by virtue
  of autodifferentiation and differentiable programming - to construct a surrogate atmospheric profile
  to model the observed data. We demonstrate utility of the methodology by (i) performing atmospheric
  correction, (ii) recasting spectral data between various modalities (e.g. radiance and reflectance at
  the surface and at the sensor), and (iii) inferring atmospheric transmission profiles, such as absorbing
  bands and their relative magnitudes.
