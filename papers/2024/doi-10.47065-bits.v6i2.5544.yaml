summary: Random forest and neural networks predict hourly airport fog at Radin Inten II, Indonesia, from
  2020–2024 weather attributes, with random forest reaching 69.44% accuracy.
abstract: Fog at airports greatly disrupts flight operations, limiting visibility and thus having a significant
  impact on flight operations such as taxiing, takeoff and landing. The biggest challenge in fog prediction
  is the inconsistent and chaotic complexity of atmospheric processes. This research uses the Neural Network
  algorithm and random forest algorithm to predict fog at Radin Inten II Airport in Lampung. The data
  used in this study include 14 weather attributes collected hourly from 2020 to 2024. Meteorological
  variables analyzed include dry bulb temperature, wet bulb temperature, dew point, relative humidity,
  barometric pressure QFE and QFF, and fog-related weather conditions . The predictive model was optimized
  by hyperparameter tuning including optimizer selection (SGD, Adam), learning rate ( 0.001), and number
  of epochs ( 300). The research results show that the random forest model with optimal configuration
  provides the highest accuracy of 69.44% in fog prediction. The Backpropagasi Neural Network also shows
  good performance well with an accuracy of 67.23%. By using this model, fog predictions can be made more
  accurate and faster, providing significant benefits to aviation safety. This research highlights the
  importance of using diverse data and rigorous evaluation methods to create reliable and effective weather
  prediction models.
