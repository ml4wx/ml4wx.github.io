summary: Classifiers predict heat-wave risk alerts for lactating cows from station weather and thermal
  stress indices, with logistic regression reaching 98.4% accuracy.
abstract: 'Thermal comfort indices are risk indicators for environmental conditions in livestock production.
  Predictive models based on these indices of heat stress, respiratory frequency, and presence of heat
  waves for lactating cows, comparing the prediction and correlation between these factors, generate responses
  that can improve animal management regarding physiological responses to heat stress during the incidence
  of heat waves. Therefore, the objective was to develop predictive models for heat wave risk alerts based
  on thermal stress indices, physiological responses, and surface temperature of lactating cows. The region''s
  climatic conditions were evaluated based on data on temperature, air humidity, wind speed, black globe
  temperature, solar radiation, dew point temperature, and precipitation compiled from a meteorological
  station. In the processing phase, a data set was discretized into classes to apply machine learning
  techniques to generate a classification model with cross-validation of the data. The performance of
  the classifiers was evaluated based on the metrics: accuracy, precision, sensitivity (recall), and Kappa
  statistics. Predicting the risk of heat waves for lactating cows can meet the need to predict the frequency
  of heat waves for decision-making in environmental, nutritional, and health management to minimize adverse
  impacts on production. The accuracy of Decision Tree models (J48), Naive Bayes, and Logistic Regression
  was equal to 96.72%, 96.72%, and 98.36%, respectively. The performance in the evaluation metrics of
  the Logistic Regression prediction model was better than that of the decision tree and Naive Bayes models.'
