summary: WaveNet-LSTM with ENSO, IOD, MJO and other climate-driver inputs improves seasonal precipitation
  forecasts in Eastern Thailand, with rainy-season R² of 0.91 versus 0.85 for LSTM.
abstract: Seasonal precipitation forecasting (SPF) is critical for effective water resource management
  and risk mitigation. Large-scale climate drivers significantly influence regional climatic patterns
  and forecast accuracy. This study establishes relationships between key climate drivers—El Niño–Southern
  Oscillation (ENSO), Southern Oscillation Index (SOI), Indian Ocean Dipole (IOD), Real-time Multivariate
  Madden–Julian Oscillation (MJO), and Multivariate ENSO Index (MEI)—and seasonal precipitation anomalies
  (rainy, summer, and winter) in Eastern Thailand, utilizing Pearson’s correlation coefficient. Following
  the establishment of these correlations, the most influential drivers were incorporated into the forecasting
  models. This study proposed an advanced SPF methodology for Eastern Thailand through a Seasonal WaveNet-LSTM
  model, which integrates Long Short-Term Memory (LSTM) and Recurrent Neural Networks (RNNs) with Wavelet
  Transformation (WT). By integrating large-scale climate drivers alongside key meteorological variables,
  the model achieves superior predictive accuracy compared to traditional LSTM models across all seasons.
  During the rainy season, the WaveNet-LSTM model (SPF-3) achieved a coefficient of determination (R2)
  of 0.91, a normalized root mean square error (NRMSE) of 8.68%, a false alarm rate (FAR) of 0.03, and
  a critical success index (CSI) of 0.97, indicating minimal error and exceptional event detection capabilities.
  In contrast, traditional LSTM models yielded an R2 of 0.85, an NRMSE of 10.28%, a FAR of 0.20, and a
  CSI of 0.80. For the summer season, the WaveNet-LSTM model (SPF-1) outperformed the traditional model
  with an R2 of 0.87 (compared to 0.50 for the traditional model), an NRMSE of 12.01% (versus 25.37%),
  a FAR of 0.09 (versus 0.30), and a CSI of 0.83 (versus 0.60). In the winter season, the WaveNet-LSTM
  model demonstrated similar improvements, achieving an R2 of 0.79 and an NRMSE of 13.69%, with a FAR
  of 0.23, compared to the traditional LSTM’s R2 of 0.20 and NRMSE of 41.46%. These results highlight
  the superior reliability and accuracy of the WaveNet-LSTM model for operational seasonal precipitation
  forecasting (SPF). The integration of large-scale climate drivers and wavelet-decomposed features significantly
  enhances forecasting performance, underscoring the importance of selecting appropriate predictors for
  climatological and hydrological studies.
