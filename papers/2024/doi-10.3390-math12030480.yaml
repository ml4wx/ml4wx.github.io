summary: Groups neural networks to improve station-based weather forecasts, using Weather Underground
  station data and NDFD forecasts across several US locations.
abstract: In this paper, we investigate mathematical models of meteorological forecasting based on the
  work of neural networks, which allow us to calculate presumptive meteorological parameters of the desired
  location on the basis of previous meteorological data. A new method of grouping neural networks to obtain
  a more accurate output result is proposed. An algorithm is presented, based on which the most accurate
  meteorological forecast was obtained based on the results of the study. This algorithm can be used in
  a wide range of situations, such as obtaining data for the operation of equipment in a given location
  and studying meteorological parameters of the location. To build this model, we used data obtained from
  personal weather stations of the Weather Underground company and the US National Digital Forecast Database
  (NDFD). Also, a Google remote learning machine was used to compare the results with existing products
  on the market. The algorithm for building the forecast model covered several locations across the US
  in order to compare its performance in different weather zones. Different methods of training the machine
  to produce the most effective weather forecast result were also considered.
