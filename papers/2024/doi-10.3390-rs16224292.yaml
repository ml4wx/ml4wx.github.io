summary: Transformer-based precipitation downscaling of WRF regional climate simulations from 50 km to
  12 km resolution reproduces high-resolution statistics and extremes.
abstract: In this research, we introduce a novel method leveraging the Transformer architecture to generate
  high-fidelity precipitation model outputs. This technique emulates the statistical characteristics of
  high-resolution datasets while substantially lowering computational expenses. The core concept involves
  utilizing a blend of coarse and fine-grained simulated precipitation data, encompassing diverse spatial
  resolutions and geospatial distributions, to instruct Transformer in the transformation process. We
  have crafted an innovative ST-Transformer encoder component that dynamically concentrates on various
  regions, allocating heightened focus to critical spatial zones or sectors. The module is capable of
  studying dependencies between different locations in the input sequence and modeling at different scales,
  which allows it to fully capture spatiotemporal correlations in meteorological element data, which is
  also not available in other downscaling methods. This tailored module is instrumental in enhancing the
  model’s ability to generate outcomes that are not only more realistic but also more consistent with
  physical laws. It adeptly mirrors the temporal and spatial distribution in precipitation data and adeptly
  represents extreme weather events, such as heavy and enduring storms. The efficacy and superiority of
  our proposed approach are substantiated through a comparative analysis with several cutting-edge forecasting
  techniques. This evaluation is conducted on two distinct datasets, each derived from simulations run
  by regional climate models over a period of 4 months. The datasets vary in their spatial resolutions,
  with one featuring a 50 km resolution and the other a 12 km resolution, both sourced from the Weather
  Research and Forecasting (WRF) Model.
