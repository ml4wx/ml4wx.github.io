summary: Review of ML across climate physics, covering observation reconstruction, subgrid parameterization,
  causal inference and climate and weather prediction.
abstract: An exponential growth in computing power, which has brought more sophisticated and higher resolution
  simulations of the climate system, and an exponential increase in observations since the first weather
  satellite was put in orbit, are revolutionizing climate science. Big data and associated algorithms,
  coalesced under the field of Machine Learning (ML), offer the opportunity to study the physics of the
  climate system in ways, and with an amount of detail, infeasible few years ago. The inference provided
  by ML has allowed to ask causal questions and improve prediction skills beyond classical barriers. Furthermore,
  when paired with modeling experiments or robust research in model parameterizations, ML is accelerating
  computations, increasing accuracy and allowing for generating very large ensembles at a fraction of
  the cost. In light of the urgency imposed by climate change and the rapidly growing role of ML, we review
  its broader accomplishments in climate physics. Decades long standing problems in observational data
  reconstruction, representation of sub-grid scale phenomena and climate (and weather) prediction are
  being tackled with new and justified optimism. Ultimately, this review aims at providing a perspective
  on the benefits and major challenges of exploiting ML in studying complex systems.
