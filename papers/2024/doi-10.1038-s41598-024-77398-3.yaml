summary: Echo state network links 2 m temperature from climate storyline simulations to German mortality,
  projecting higher summer and lower winter mortality under 2K and 4K warming.
abstract: The aim of this work is the prediction of heat-related mortality for Germany under future, i.e.
  hotter, climate conditions. The prediction is made based on 2m temperature data from climate storyline
  simulations using machine learning techniques. We use an echo state network for linking the outputs
  of storyline climate simulations to the target data. The target data are all-cause mortality rates of
  Germany for all ages. The network is trained with present day climate model outputs. Model outputs of
  future, i.e. 2K and 4K warmer, storylines are used to predict mortality rates under such climatic conditions.
  We find that we can train an echo state network with recent temperature data and mortality and make
  plausible predictions about expected developments of mortality in Germany based on future climate storylines.
  The trained network can successfully predict mortality rates for future climate conditions. We find
  increased mortality during the summer months which is attributed to the presence of more severe heat
  waves. The mortality decrease found during winter can be explained milder winters leading to fewer deaths
  caused by respiratory diseases. However, mortality in winter is largely influenced by other factors
  such as influenza waves or vaccination rate and explainability due to temperature is limited.
