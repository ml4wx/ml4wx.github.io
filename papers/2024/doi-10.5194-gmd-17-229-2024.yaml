summary: Four CNN architectures downscale seven CMIP6 models to 0.1° over Iberia, yielding a multi-model
  ensemble of 21st-century temperature and precipitation projections.
abstract: 'Abstract. Deep learning (DL) methods have recently garnered attention from the climate change
  community, as an innovative approach for downscaling climate variables from Earth System and Global
  Climate Models (ESGCMs) with horizontal resolutions still too coarse to represent regional-to-local-scale
  phenomena. In the context of the Coupled Model Intercomparison Project phase 6 (CMIP6), ESGCMs simulations
  were conducted for the Sixth Assessment Report (AR6) of the Intergovernmental Panel on Climate Change
  (IPCC), at resolutions ranging from 0.70º to 3.75º. Here, four Convolutional Neural Network (CNN) architectures
  were evaluated for their ability to downscale, to a resolution of 0.1º, seven CMIP6 ESGCMs over the
  Iberian Peninsula - a known climate change hotspot, due to its increased vulnerability to projected
  future warming and drying conditions. The study is divided into three stages: (1) evaluating the performance
  of the four CNN architectures in predicting mean, minimum, and maximum temperatures, as well as daily
  precipitation, trained using ERA5 data, and compared with the Iberia01 observational dataset; (2) downscaling
  the CMIP6 ESGCMs using the trained CNN architectures and further evaluating the ensemble against Iberia01;
  and (3) constructing a multi-model ensemble of CNN-based downscaled projections for temperature and
  precipitation over the Iberian Peninsula at 0.1º resolution throughout the 21st century, under four
  Shared Socioeconomic Pathway (SSP) scenarios. Upon validation and satisfactory performance evaluation,
  the DL downscaled projections demonstrate overall agreement with the CMIP6 ESGCM ensemble in terms of
  temperature and precipitation projections. Moreover, the advantages of using a high-resolution DL downscaled
  ensemble of ESGCM climate projections are evident, offering substantial added value in representing
  regional climate change over Iberia. Notably, a clear warming trend is observed, consistent with previous
  studies in this area, with projected temperature increases ranging from 2 ºC to 6 ºC depending on the
  climate scenario. Regarding precipitation, robust projected decreases are observed in western and southwestern
  Iberia, particularly after 2040. These results may offer a new tool for providing regional climate change
  information for adaptation strategies based on CMIP6 ESGCMs prior to the next phase of the European
  branch from the Coordinated Regional Climate Downscaling Experiment (EURO-CORDEX) experiments.'
