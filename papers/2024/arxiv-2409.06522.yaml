summary: Refines Koopman operator estimation and introduces CNN architectures to give linear, interpretable
  representations of idealized atmospheric dynamics.
abstract: Deep learning is revolutionizing weather forecasting, with new data-driven models achieving
  accuracy on par with operational physical models for medium-term predictions. However, these models
  often lack interpretability, making their underlying dynamics difficult to understand and explain. This
  paper proposes methodologies to estimate the Koopman operator, providing a linear representation of
  complex nonlinear dynamics to enhance the transparency of data-driven models. Despite its potential,
  applying the Koopman operator to large-scale problems, such as atmospheric modeling, remains challenging.
  This study aims to identify the limitations of existing methods, refine these models to overcome various
  bottlenecks, and introduce novel convolutional neural network architectures that capture simplified
  dynamics.
