summary: Machine learning forecasts reference evapotranspiration for irrigation planning, with forecast-corrected
  weather inputs giving RMSE of 0.52 to 0.81 mm/day.
abstract: 'Water scarcity is a global problem. Deficit irrigation (DI) reduces evapotranspiration, improving
  water efficiency in agriculture. Reference evapotranspiration (ET0) is an important factor in determining
  DI. ET0 forecasting predicts field water consumption and enables proactive irrigation decisions, offering
  guidance for water resource management. However, implementation of ET0 forecasting faces challenges
  due to complex calculations and extensive meteorological data requirements. This project aims to develop
  a machine learning system for ET0 forecasting. The project involves studying ET0 methods and identifying
  required meteorological parameters. Historical meteorological data and weather forecasts were obtained
  from meteorological websites and analyzed for accuracy after preprocessing. A machine learning-based
  model was created to forecast reference crop evapotranspiration. The model’s input parameters were selected
  through path analysis before it was optimized using Bayesian optimization to reduce overfitting and
  improve accuracy. Three forecasting models were developed: one based on historical meteorological data,
  one based on weather forecasts, and one that corrects the weather forecasts. All three models achieved
  good accuracy, with root mean square errors ranging from 0.52 to 0.81 mm/day. Among them, the model
  based on weather forecast had the highest accuracy; the RMSE six days before the forecast period was
  between 0.52 and 0.75 mm/day, and the RMSE on the seventh day of the forecast period was 1.12 mm/day.
  In summary, this project has established a mathematical model of ET0 prediction based on machine learning,
  which can achieve more accurate predictions for within a few days.'
