summary: SuperdropNet, a neural emulator of warm-rain microphysics, is coupled into the ICON model via
  three strategies, with stable, physically consistent warm-bubble results.
abstract: 'Abstract. Machine learning (ML) algorithms can be used in Earth System models (ESMs) to emulate
  sub-grid-scale processes. Due to the statistical nature of ML algorithms and the high complexity of
  ESMs, these hybrid ML-ESMs require careful validation. Simulation stability needs to be monitored in
  fully coupled simulations, and the plausibility of results needs to be evaluated in suitable experiments.
  We present the coupling of SuperdropNet, a machine learning model for emulating warm rain processes
  in cloud microphysics, into ICON~2.6.5. SuperdropNet is trained on superdroplet simulations and predicts
  updates of the bulk moments for cloud and rain. It replaces the accretion, autoconversion, and self-collection
  of rain and cloud droplets in two-moment cloud microphysics. We address the technical challenge of integrating
  SuperdropNet, developed in Python and PyTorch, into ICON, written in Fortran, by implementing three
  different coupling strategies: embedded Python via the C Foreign Function Interface, pipes, and coupling
  of program components via YetAnotherCoupler (YAC). We validate the emulator in the warm bubble scenario
  and find that SuperdropNet runs stable within the experiment. In comparing experiment outcomes from
  the bulk moment scheme and SuperdropNet, we find that the results are physically consistent, and discuss
  differences that are observed for several diagnostic variables. In addition, we provide a quantitative
  and qualitative computational benchmark for three different coupling strategies—embedded Python, coupler
  YAC, and pipes—and find that embedded Python is a useful software tool for validating hybrid ML-ESMs.'
