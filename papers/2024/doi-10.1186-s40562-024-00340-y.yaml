summary: Hierarchical multi-scale residual network downscales Taiwan daily rainfall from 0.25° to 0.0125°,
  beating interpolation by 15% MAE and improving ECMWF rainfall forecasts for extreme thresholds.
abstract: Abstract In response to the growing demand for high-resolution rainfall data to support disaster
  prevention in Taiwan, this study presents an innovative approach for downscaling precipitation data.
  We employed a hierarchical architecture of Multi-Scale Residual Networks (MSRN) to downscale rainfall
  from a coarse 0.25-degree resolution to a fine 0.0125-degree resolution, representing a substantial
  challenge due to a resolution increase of over 20 times. Our results demonstrate that the hierarchical
  MSRN outperforms both the one-step MSRN and linear interpolation methods when reconstructing high-resolution
  daily rainfall. It surpasses the linear interpolation method by 15.1 and 9.1% in terms of mean absolute
  error and root mean square error, respectively. Furthermore, the hierarchical MSRN excels in accurately
  reproducing high-resolution rainfall for various rainfall thresholds, displaying minimal biases. The
  threat score (TS) highlights the hierarchical MSRN's capability to replicate extreme rainfall events,
  achieving TS scores exceeding 0.54 and 0.46 at rainfall thresholds of 350 and 500 mm per day, outperforming
  alternative methods. This method is also applied to an operational global model, the ECMWF’s daily rainfall
  forecasts over Taiwan. The evaluation results indicate that our approach is effective at improving rainfall
  forecasts for thresholds greater than 100 mm per day, with more significant improvement for the 1- to
  3-day lead forecast. This approach also offers a realistic visual representation of fine-grained rainfall
  distribution, showing promise for making significant contributions to disaster preparedness and weather
  forecasting in Taiwan.
