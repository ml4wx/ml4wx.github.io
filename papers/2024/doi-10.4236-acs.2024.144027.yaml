summary: Hybrid wavelet, LSTM-autoencoder, CNN and SVR model forecasts ENSO index with a 0.93 correlation
  at 4-month lead, using ERSSTv5 sea surface temperature data.
abstract: 'The El Niño-Southern Oscillation (ENSO) is a significant climate phenomenon with far-reaching
  impacts on global weather patterns, ecosystems, and economies. This study aims to enhance ENSO forecasting
  with the Extended Reconstruction Sea Surface Temperature v5 (ERSSTv5) climate model. The M-band discrete
  wavelet transforms (DWT) are utilized to capture multi-scale temporal and spatial features effectively.
  Long-short term memory (LSTM) autoencoders are also used to capture significant spatial and temporal
  patterns in sea surface temperature (SST) anomaly data. Deep learning techniques such as the convolutional
  neural networks (CNN) are used with non-image and image time series data. We also employ parallel computing
  in a various support vector regression (SVR) approximators to enhance accuracy. Preliminary results
  indicate that this hybrid model effectively identifies key precursors and patterns associated with El
  Niño events, surpassing traditional forecasting methods. Results of the hybrid model produce a correlation
  of 0.93 in 4-month lagged forecasting of the Oceanic Niño Index (ONI)—indicative of high success rate
  of the model. Future work will focus on evaluating the model’s performance using additional reanalysis
  datasets and other methods of deep learning to further refine its robustness and applicability. We propose
  wavelet-based deep learning models which have potential to shine a light on achieving United Nations’
  2030 Agenda for Sustainable Development’s goal 13: “Climate Action”, as an innovation with potential
  in improving time series image forecasting in all fields.'
