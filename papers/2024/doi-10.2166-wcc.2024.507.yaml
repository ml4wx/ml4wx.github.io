summary: A super-resolution CNN (SRCNN) downscales ECMWF winds off India's east coast four times, beating
  interpolation and improving storm surge simulations for an extreme event.
abstract: ABSTRACT Downscaling is reconstructing data from low to high resolution, capturing local effects
  and magnitudes. Widely employed methods for downscaling are dynamic and statistical methods with pros
  and cons. With ample data, machine learning (ML) and deep learning (DL) techniques can be employed to
  learn mapping from low to high resolution. This article investigates convolutional neural network capabilities
  for downscaling winds. The speed and direction of the wind are guided by a complex relation among pressure,
  Coriolis force, friction, and temperature, which leads to highly nonlinear wind patterns and poses a
  significant challenge for downscaling. The problem can be formulated as a super-resolution technique
  called a super-resolution convolutional neural network (SRCNN) for data reconstruction. Few variations
  of SRCNN are studied for wind downscaling. Six years of European Centre for Medium-Range Weather Forecasts
  (ECMWF) wind datasets along the east coast of India are used in the current study and are downscaled
  up to four times. Downscaled winds provide better results than traditional interpolation methods. Simulations
  for an extreme event are conducted with SRCNN downscaled winds and are compared against interpolation
  methods and original data. The numerical simulation results show that DL-based methods provide results
  closer to the ground truth than interpolation methods.
