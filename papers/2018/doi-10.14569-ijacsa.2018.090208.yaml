summary: Takagi-Sugeno fuzzy neural network detects failures ('crashes') in climate model simulations,
  reaching 97.96% accuracy versus 94.4% for SVM.
abstract: In this paper the detection of the climate crashes or failure that are associated with the use
  of climate models based on parameters induced from the climate simulation is considered. Detection and
  analysis of the crashes allows one to understand and improve the climate models. Fuzzy neural networks
  (FNN) based on Takagi-Sugeno-Kang (TSK) type fuzzy rule is presented to determine chances of failure
  of the climate models. For this purpose, the parameters characterising the climate crashes in the simulation
  are used. For comparative analysis, Support Vector Machine (SVM) is applied for simulation of the same
  problem. As a result of the comparison, the accuracy rates of 94.4% and 97.96% were obtained for SVM
  and FNN model correspondingly. The FNN model was discovered to be having better performance in modelling
  climate crashes.
