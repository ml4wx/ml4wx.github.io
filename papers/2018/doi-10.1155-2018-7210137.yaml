summary: Machine learning error correction makes low-cost Mini-AWS pressure readings meet WMO ±0.1 hPa
  accuracy, offering a cheap complement to automatic weather stations.
abstract: Severe weather events occur more frequently due to climate change; therefore, accurate weather
  forecasts are necessary, in addition to the development of numerical weather prediction (NWP) of the
  past several decades. A method to improve the accuracy of weather forecasts based on NWP is the collection
  of more meteorological data by reducing the observation interval. However, in many areas, it is economically
  and locally difficult to collect observation data by installing automatic weather stations (AWSs). We
  developed a Mini-AWS, much smaller than AWSs, to complement the shortcomings of AWSs. The installation
  and maintenance costs of Mini-AWSs are lower than those of AWSs; Mini-AWSs have fewer spatial constraints
  with respect to the installation than AWSs. However, it is necessary to correct the data collected with
  Mini-AWSs because they might be affected by the external environment depending on the installation area.
  In this paper, we propose a novel error correction of atmospheric pressure data observed with a Mini-AWS
  based on machine learning. Using the proposed method, we obtained corrected atmospheric pressure data,
  reaching the standard of the World Meteorological Organization (WMO; ±0.1 hPa), and confirmed the potential
  of corrected atmospheric pressure data as an auxiliary resource for AWSs.
