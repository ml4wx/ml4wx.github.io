summary: An LSTM forecasts 5-minute solar irradiance minutes ahead from one year of plant radiometer data,
  beating standard time-series baselines.
abstract: This work considers the problem of forecasting the normal solar irradiance with high spatial
  and temporal resolution (5 minutes). The forecasting is based on a dataset registered during one year
  from the high resolution radiometric network at a operational solar power plan at Almeria, Spain. In
  particular, we show a technique for forecasting the irradiance in the next few minutes from the irradiance
  values obtained on the previous hour. Our proposal employs a type of recurrent neural network known
  as LSTM, which can learn complex patterns and that has proven its usability for forecasting temporal
  series. The results show a reasonable improvement with respect to other prediction methods typically
  employed in the studies of temporal series.
