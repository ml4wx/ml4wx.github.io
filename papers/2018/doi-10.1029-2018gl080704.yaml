summary: Deep network emulates a simple general circulation model, forecasting its states and producing
  stable climate runs with matching statistics and no long-term drift.
abstract: Abstract It is shown that it is possible to emulate the dynamics of a simple general circulation
  model with a deep neural network. After being trained on the model, the network can predict the complete
  model state several time steps ahead—which conceptually is making weather forecasts in the model world.
  Additionally, after being initialized with an arbitrary model state, the network can through repeatedly
  feeding back its predictions into its inputs create a climate run, which has similar climate statistics
  to the climate of the general circulation model. This network climate run shows no long‐term drift,
  even though no conservation properties were explicitly designed into the network.
