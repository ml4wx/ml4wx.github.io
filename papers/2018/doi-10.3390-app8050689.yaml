summary: Gradient boosted decision trees predict short-term photovoltaic power from historical weather
  and weather forecast inputs for grid operation.
abstract: Due to the development of photovoltaic (PV) technology and the support from governments across
  the world, the conversion efficiency of solar energy has been improved. However, the PV power output
  is influenced by environment factors, resulting in features of randomness and intermittency. These features
  may have a negative influence on power systems. As a result, accurate and timely power prediction data
  is necessary for power grids to absorb solar energy. In this paper, we propose a new PV power prediction
  model based on the Gradient Boost Decision Tree (GBDT), which ensembles several binary trees by the
  gradient boosting ensemble method. The Gradient Boost method builds a strong learner by combining weak
  learners through iterative methods and the Decision Tree is a basic classification and regression method.
  As an ensemble machine learning algorithm, the Gradient Boost Decision Tree algorithm can offer higher
  forecast accuracy than one single learning algorithm. So GBDT is of value in both theoretical research
  and actual practice in the field of photovoltaic power prediction. The prediction model based on GBDT
  uses historical weather data and PV power output data to iteratively train the model, which is used
  to predict the future PV power output based on weather forecast data. Simulation results show that the
  proposed model based on GBDT has advantages of strong model interpretation, high accuracy, and stable
  error performance, and thus is of great significance for supporting the secure, stable and economic
  operation of power systems.
