summary: Opinion article arguing machine learning should be adopted for S2S forecasting, showing statistical
  methods beat dynamical models on a polar vortex case.
abstract: 'The discipline of seasonal climate prediction began as an exercise in simple statistical techniques.
  However, today the large government forecast centers almost exclusively rely on complex fully coupled
  dynamical forecast systems for their subseasonal to seasonal (S2S) predictions while statistical techniques
  are mostly neglected and those techniques still in use have not been updated in decades. In this Opinion
  Article, we argue that new statistical techniques mostly developed outside the field of climate science,
  collectively referred to as machine learning, can be adopted by climate forecasters to increase the
  accuracy of S2S predictions. We present an example of where unsupervised learning demonstrates higher
  accuracy in a seasonal prediction than the state‐of‐the‐art dynamical systems. We also summarize some
  relevant machine learning methods that are most applicable to climate prediction. Finally, we show by
  comparing real‐time dynamical model forecasts with observations from winter 2017/2018 that dynamical
  model forecasts are almost entirely insensitive to polar vortex (PV) variability and the impact on sensible
  weather. Instead, statistical forecasts more accurately predicted the resultant sensible weather from
  a mid‐winter PV disruption than the dynamical forecasts. The important implication from the poor dynamical
  forecasts is that if Arctic change influences mid‐latitude weather through PV variability, then the
  ability of dynamical models to demonstrate the existence of such a pathway is compromised. We conclude
  by suggesting that S2S prediction will be most beneficial to the public by incorporating mixed or a
  hybrid of dynamical forecasts and updated statistical techniques such as machine learning. This article
  is categorized under: Climate Models and Modeling &gt; Knowledge Generation with Models'
