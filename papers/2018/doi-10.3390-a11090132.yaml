summary: Applies deep belief networks to precipitation forecasting, claiming better results than conventional
  forecasting methods; quantitative results are not given in the abstract.
abstract: Due to the impact of weather forecasting on global human life, and to better reflect the current
  trend of weather changes, it is necessary to conduct research about the prediction of precipitation
  and provide timely and complete precipitation information for climate prediction and early warning decisions
  to avoid serious meteorological disasters. For the precipitation prediction problem in the era of climate
  big data, we propose a new method based on deep learning. In this paper, we will apply deep belief networks
  in weather precipitation forecasting. Deep belief networks transform the feature representation of data
  in the original space into a new feature space, with semantic features to improve the predictive performance.
  The experimental results show, compared with other forecasting methods, the feasibility of deep belief
  networks in the field of weather forecasting.
