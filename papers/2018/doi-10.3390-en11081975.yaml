summary: Hybrid PSR, mRMR, K-means and ANFIS-PSO model combines NWP inputs for multi-step wind farm power
  prediction, with improved accuracy reported on two real wind farms.
abstract: Accurate generation prediction at multiple time-steps is of paramount importance for reliable
  and economical operation of wind farms. This study proposed a novel algorithmic solution using various
  forms of machine learning techniques in a hybrid manner, including phase space reconstruction (PSR),
  input variable selection (IVS), K-means clustering and adaptive neuro-fuzzy inference system (ANFIS).
  The PSR technique transforms the historical time series into a set of phase-space variables combining
  with the numerical weather prediction (NWP) data to prepare candidate inputs. A minimal redundancy maximal
  relevance (mRMR) criterion based filtering approach is used to automatically select the optimal input
  variables for the multi-step ahead prediction. Then, the input instances are divided into a set of subsets
  using the K-means clustering to train the ANFIS. The ANFIS parameters are further optimized to improve
  the prediction performance by the use of particle swarm optimization (PSO) algorithm. The proposed solution
  is extensively evaluated through case studies of two realistic wind farms and the numerical results
  clearly confirm its effectiveness and improved prediction accuracy compared to benchmark solutions.
