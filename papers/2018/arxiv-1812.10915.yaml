summary: Computer-vision pipeline with soft-mask inpainting fuses satellite and radar observations to
  extend precipitation nowcasting beyond radar coverage.
abstract: Precipitation nowcasting using neural networks and ground-based radars has become one of the
  key components of modern weather prediction services, but it is limited to the regions covered by ground-based
  radars. Truly global precipitation nowcasting requires fusion of radar and satellite observations. We
  propose the data fusion pipeline based on computer vision techniques, including novel inpainting algorithm
  with soft masking.
