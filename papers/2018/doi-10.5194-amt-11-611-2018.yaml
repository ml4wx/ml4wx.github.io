summary: Neural network retrieves snow and liquid water path and water vapour from airborne millimetre
  radiometer data; submillimetre channels halve snow retrieval error.
abstract: Abstract. A neural network (NN)-based retrieval method to determine the snow ice water path
  (SIWP), liquid water path (LWP), and integrated water vapor (IWV) from millimeter and sub-millimeter
  brightness temperatures, measured by using airborne radiometers (ISMAR and MARSS), is presented. The
  NNs were trained by using atmospheric profiles from the ICON numerical weather prediction (NWP) model
  and by radiative transfer simulations using the Atmospheric Radiative Transfer Simulator (ARTS). The
  basic performance of the retrieval method was analyzed in terms of offset (bias) and the median fractional
  error (MFE), and the benefit of using submillimeter channels was studied in comparison to pure microwave
  retrievals. The retrieval is offset free for SIWP > 0.01 kg/m2, LWP > 0.1 kg/m2 and IWV > 3 kg/m2. The
  MFE of SIWP decreases from 100 % at SIWP = 0.01 kg/m2 to 20 % at SIWP = 1 kg/m2 and the MFE of LWP from
  100 % at LWP = 0.05 kg/m2 to 30 % at LWP = 1 kg/m2. The MFE of IWV for IWV > 3 kg/m2 is 5 % to 8 %.
  The SIWP retrieval strongly benefits from sub-millimeter channels, which reduce the MFE by a factor
  of two, compared to pure microwave retrievals. The IWV and the LWP retrieval also benefit from sub-millimeter
  channels, albeit to a lesser degree. The retrieval was applied to ISMAR and MARSS brightness temperatures
  from FAAM flight B897 on 18 March 2015 of a precipitating frontal system west of the coast of Iceland.
  Considering the given uncertainties, the retrieval is in reasonable agreement with the SIWP, LWP, and
  IWV values simulated by the ICON NWP model for that flight. A comparison of the retrieved IWV with IWV
  from 12 dropsonde 15 measurements shows an offset of 0.5 kg/m2 and an rms difference of 0.8 kg/m2, showing
  that the retrieval of IWV is highly effective even under cloudy conditions.
