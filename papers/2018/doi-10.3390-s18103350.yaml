summary: An ANN combined with a particle filter retrieves ocean surface wind speed from BeiDou GEO GNSS
  reflections, reaching about 1.9 m/s RMSE against buoys.
abstract: Oceanographic remote sensing, which is based on the sensitivity of reflected signals from the
  Global Navigation Satellite Systems (GNSS), so-called GNSS-Reflectometry (GNSS-R), is very useful for
  the observation of ocean wind speed. Wind speed estimation over the ocean is the core factor in maritime
  transportation management and the study of climate change. The main concept of the GNSS-R technique
  is using the different times between the reflected and the direct signals to measure the wind speed
  and wind direction. Accordingly, this research proposes a novel technique for wind speed estimation
  involving the integration of an artificial neural network and the particle filter based on a theoretical
  model. Moreover, particle swarm optimization was applied to find the optimal weight and bias of the
  artificial neural network, in order to improve the accuracy of the estimation result. The observation
  dataset of the reflected signal information from BeiDou Geostationary Earth Orbit (GEO) satellite number
  4 was used as an input for the estimation model. The data consisted of two phases with I and Q components.
  Two periods of BeiDou data were selected, the first period was from 3 to 8 August 2013 and the second
  period was from 12 to 14 August 2013, which corresponded to events from the typhoon Utor. The in situ
  wind speed measurement collected from the buoy station was used to validate the results. A coastal experiment
  was conducted at the Yangjiang site located in the South China Sea. The results show the ability of
  the proposed technique to estimate wind speed with a root mean square error of approximately 1.9 m/s.
