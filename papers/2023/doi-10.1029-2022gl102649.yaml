summary: A hybrid AGCM with an ML component captures dynamical processes missed by its physics and gives
  a stable, realistic decades-long climate.
abstract: A hybrid system combining an AGCM with a machine-learning component can capture processes not
  captured by the AGCM.• Machine learning provides a flexible framework to introduce additional prognostic
  variables into the hybrid model.• The prototype hybrid model tested in the paper is stable and has a
  realistic climate in decades-long simulation experiments.
