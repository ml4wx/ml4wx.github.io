summary: A CNN trained on 10,000 station records learns non-stationary GEV parameters, giving ~1.5 km
  maps of extreme precipitation sensitivity to global warming.
abstract: Abstract Evaluating changes in extreme precipitation, and how those extremes will change with
  climate, is challenged by the paucity, brevity and inhomogeneity of observational time series. Using
  global precipitation measurements from 10,000 stations, we successfully demonstrate an artificial intelligence-based
  method for quantifying the sensitivity of extreme precipitation to climate change that is robust against
  the limitations of the observational record; a convolutional neural network (CNN) is trained to learn
  the spatial structure of Generalized Extreme Value (GEV) parameters describing the statistics of precipitation
  extremes. Given an annual mean, global mean surface temperature time series as a climate covariate,
  the CNN also learns the non-stationarity of the GEV fit parameters. The trained CNN is used to generate
  maps of the sensitivity of extreme precipitation to global temperature change on ∼1.5km×1.5km grids
  over North America, Europe, Australia and New Zealand. This observations based method avoids the short-comings
  of regional and global climate models in simulating expected changes in extreme precipitation.
