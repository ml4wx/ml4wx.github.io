summary: IDW-ANN combines interpolation with a neural network to downscale IPSL GCM temperature and precipitation
  to 1 km over Thailand under SSP scenarios.
abstract: Climate change, a global problem, is now impacting human life and nature in many sectors. To
  reduce the severity of the impacts, General Circulation Models (GCMs) are used for predicting future
  climate. The prediction output of a GCM requires a downscaling process to increase its spatial resolution
  before projecting on local area. In order to downscale the output to a higher spatial resolution (less
  than 20 km), a statistical method is typically considered. By using this method, a large amount of historical
  observed data, up to 30 years, is essential. In some areas, the historical data is insufficient. Hence,
  the statistical method may not be suitable to downscale the output on the area which lacks the required
  data. Hence, this research aims to explore a high spatial resolution downscaling process that is able
  to provide a valid and high accuracy result in the Thailand area with a limitation in quantity of historical
  data. In this research, a combination of an interpolation and machine learning model called `IDW-ANN’
  is proposed for downscaling the data under the condition. The prediction of temperature and precipitation
  from a GCM, IPSL-CM6A-LR in CMIP6 is downscaled by the proposed combination into a 1 km spatial resolution.
  After the performance evaluation, the IDW-ANN downscaling process showed good accuracy (RMSE, MAE, and
  R2) and valid downscaled results. The future climate situation in Thailand, in particular temperature,
  and precipitation level, in 2040 and 2100 under two scenarios of SSPs (SSP1-2.6 and SSP3-7.0) is also
  projected at 1 km resolution by using IDW-ANN. From the projection, the level of precipitation sums,
  and temperature seem to be increased in most of Thailand in all future scenarios.
