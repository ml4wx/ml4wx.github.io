summary: A variational mode decomposition plus LSTM hybrid forecasts next-hour wind speed in Saudi Arabia
  with 61–74% skill, outperforming other hybrid and deep models.
abstract: Advancements in technology, policies, and cost reductions have led to rapid growth in wind power
  production. One of the major challenges in wind energy production is the instability of wind power generation
  due to weather changes. Efficient power grid management requires accurate power output forecasting.
  New wind energy forecasting methods based on deep learning are better than traditional methods, like
  numerical weather prediction, statistical models, and machine learning models. This is more true for
  short-term prediction. Since there is a relationship between methods, climates, and forecasting complexity,
  forecasting methods do not always perform the same depending on the climate and terrain of the data
  source. This paper proposes a novel model that combines the variational mode decomposition method with
  a long short-term memory model, developed for next-hour wind speed prediction in a hot desert climate,
  such as the climate in Saudi Arabia. We compared the proposed model performance to two other hybrid
  models, six deep learning models, and four machine learning models using different feature sets. Also,
  we tested the proposed model on data from different climates, Caracas and Toronto. The proposed model
  showed a forecast skill between 61% to 74% based on mean absolute error, 64% to 72% based on root mean
  square error, and 59% to 68% based on mean absolute percentage error for locations in Saudi Arabia.
