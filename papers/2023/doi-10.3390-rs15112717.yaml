summary: An MLP-CNN network retrieves atmospheric temperature profiles from ground measurements and historical
  observations, with low bias and RMSE at all altitudes.
abstract: The atmospheric temperature profile is an important parameter to describe the state of the atmosphere,
  and it is crucial to climate change research, weather forecasting, and atmospheric parameter retrieval.
  A machine learning algorithm that incorporates historical observations and ground-based measurements
  was developed in this study to retrieve the atmospheric temperature profile. Specifically, the deep
  learning network considered historical observations for the same period and temporally correlated temperature
  profiles. It combined multi-layer perceptron (MLP) and the convolutional neural network (CNN). MLP derived
  the features from the ground factors, and CNN captured the essential features associated with the temperature
  profiles at the current time from latent historical data. Then, the features of the two parts were concatenated
  to obtain the final network. The construction and parameters of the model were optimized to determine
  the best model configuration and retrieval performance. The results of the model were evaluated against
  those of other methods on the same dataset. The model showed a good retrieval precision, which was equivalent
  to a small retrieval bias, root-mean-square error, and mean absolute error at all altitudes. The analysis
  of the application of this model to the retrieval of atmospheric temperature profiles indicates that
  the method is feasible.
