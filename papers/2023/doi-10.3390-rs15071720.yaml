summary: CNN estimates downward shortwave radiation over the ocean from all-sky RGB images, outperforming
  empirical parameterizations and MODIS-based methods.
abstract: Downward short-wave (SW) solar radiation is the only essential energy source powering the atmospheric
  dynamics, ocean dynamics, biochemical processes, and so forth on our planet. Clouds are the main factor
  limiting the SW flux over the land and the Ocean. For the accurate meteorological measurements of the
  SW flux one needs expensive equipment-pyranometers. For some cases where one does not need golden-standard
  quality of measurements, we propose estimating incoming SW radiation flux using all-sky optical RGB
  imagery which is assumed to incapsulate the whole information about the downward SW flux. We used DASIO
  all-sky imagery dataset with corresponding SW downward radiation flux measurements registered by an
  accurate pyranometer. The dataset has been collected in various regions of the World Ocean during several
  marine campaigns from 2014 to 2021, and it will be updated. We demonstrate the capabilities of several
  machine learning models in this problem, namely multilinear regression, Random Forests, Gradient Boosting
  and convolutional neural networks (CNN). We also applied the inverse target frequency (ITF) re-weighting
  of the training subset in an attempt of improving the SW flux approximation quality. We found that the
  CNN is capable of approximating downward SW solar radiation with higher accuracy compared to existing
  empiric parameterizations and known algorithms based on machine learning methods for estimating downward
  SW flux using remote sensing (MODIS) imagery. The estimates of downward SW radiation flux using all-sky
  imagery may be of particular use in case of the need for the fast radiative budgets assessment of a
  site.
