summary: Uses an AlexNet-based CNN to identify tropical cyclones from aerial imagery for an alert system;
  a basic classification application.
abstract: Tropical cyclones (TCs) are catastrophic weather occurrences that can inflict massive damage
  in coastal regions across the world. Weather nowcasting, which is the weather forecast for a short time
  period, is one of the most challenging topics in meteorology. Weather radar and satellite are essential
  technologies for nowcasting, but issuing nowcasting warnings based on radar and satellite data is a
  difficult process. This proposed approach is of a deep learning approach for TC identification from
  aerial imagery, which includes a Deep Convolutional Neural Network of Alex-Net architecture as the classifier.
