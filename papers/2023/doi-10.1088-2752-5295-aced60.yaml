summary: Neural networks with explainable AI identify decadal variability in tropically driven subseasonal
  precipitation skill in CESM2 and confirm the relationships in ERA5 reanalysis.
abstract: Abstract Identifying predictable states of the climate system allows for enhanced prediction
  skill on the generally low-skill subseasonal timescale via forecasts with higher confidence and accuracy,
  known as forecasts of opportunity. This study takes a neural network approach to explore decadal variability
  of subseasonal predictability, particularly during forecasts of opportunity. Specifically, this work
  quantifies subseasonal prediction skill provided by the tropics within the Community Earth System Model
  Version 2 (CESM2) Large Ensemble and assesses how this skill evolves on decadal timescales. Utilizing
  the networks’ confidence and explainable artificial intelligence, physically meaningful sources of predictability
  associated with periods of enhanced skill are identified. Using these networks, we find that tropically-driven
  subseasonal predictability varies on decadal timescales during forecasts of opportunity. Further, we
  investigate the drivers of the low frequency modulation of the tropical-extratropical teleconnection
  and discuss the implications. Analysis is extended to ECMWF Reanalysis v5 data, revealing that the relationships
  learned within the CESM2-Large Ensemble holds in modern reanalysis data. These results indicate that
  the neural networks are capable of identifying predictable decadal states of the climate system within
  CESM2 that are useful for making confident, accurate subseasonal precipitation predictions in the real
  world.
