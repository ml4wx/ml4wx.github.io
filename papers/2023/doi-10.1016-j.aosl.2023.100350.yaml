summary: A residual network with automatically selected precursors predicts ENSO up to 8 months ahead,
  with a 6-month correlation of 0.82 beating the multi-model mean of 0.70.
abstract: A novel multivariable prediction system based on a deep learning (DL) algorithm, i.e., the residual
  neural network and pure observations, was developed to improve the prediction of the El Niño–Southern
  Oscillation (ENSO). Optimal predictors are automatically determined using the maximal information for
  spatial filtering and the Taylor diagram criteria, enabling the best prediction skills at lead times
  of eight months compared with most operational prediction models. The hindcast skill for the most challenging
  decade (2011–18) outperforms the multi-model ensemble operational forecasts. At the six-month lead,
  the correlation (COEF) skill of the DL model reaches 0.82 with a normalized root-mean-square error (RMSE)
  of 0.58 °C, which is significantly better than the average multi-model performance (COEF = 0.70 and
  RMSE = 0.73°C). DL prediction can effectively alleviate the long-standing spring predictability barrier
  problem. The automatically selected optimal precursors can explain well the typical ENSO evolution driven
  by both tropical dynamics and extratropical impacts. 摘要 本文基于残差神经网络和观测数据构建了一套深度学习多因子预报测模型, 以改进厄尔尼诺-南方涛动(ENSO)的预报.
  该模型基于最大信息系数进行因子时空特征提取, 并根据泰勒图的评估标准可自动确定关键预报因子进行预报. 该模型在超前8个月以内的预报性能要优于当前传统的业务预报模式. 2011–2018年间, 该模型的预报性能优于多模式集成预报的结果.
  在超前6个月预报时效上, 模型预报相关性可达0.82, 标准化后的均方根误差仅为0.58°C, 多模式集成预报的相关性和标准化后的均方根误差分别为0.70和0.73°C. 该模型春季预报障碍问题有所缓解,
  并且自动选取的关键预报因子可用于解释热带和副热带热动力过程对于ENSO变化的影响.
