summary: Interpretable deep learning ENSO model uses global ocean heat signatures to reach 22-month effective
  forecast length, with skill maintained using SST alone.
abstract: The El Niño-Southern Oscillation (ENSO) dominates Earth’s year-to-year climate variability and
  can often cause severe environmental and socioeconomic impacts globally. However, despite continuous
  ENSO theory and modeling advances, the global heat signature variations preceding ENSO events have not
  been fully understood, especially for long-lead ENSO forecasts more than 12 months in advance. Here,
  we develop an interpretable, deep learning (DL)-based ENSO forecast model that uses artificial intelligence
  to discover the long-term spatial and temporal processes of heat signatures associated with ENSO in
  the global ocean. More specifically, our results highlight the critical roles of ocean interbasin interactions
  and tropic–extratropic interactions in ENSO forecasts and are confirmed by our sensitivity forecasting
  experiments. The model has good forecast performance, with an effective ENSO forecast length of 22 months
  on the test set (1982 to 2020) and minimal influence from the spring predictability barrier (SPB). Moreover,
  our experimentally validated model performance does not degrade much even with using sea surface temperature
  (SST) alone, which has direct implications for operational forecasts since globally complete ocean subsurface
  measurements are not always available.
