summary: A CNN with statistical downscaling to 1 km forecasts extreme low apparent temperature 1 to 12
  hours ahead for Gansu marathon hypothermia warnings, beating persistence and climatology.
abstract: Abrupt changes in environmental temperature, wind and humidity can lead to great threats to
  human life safety. The Gansu marathon disaster of China highlights the importance of early warning of
  hypothermia from extremely low apparent temperature (AT). Here a deep convolutional neural network model
  together with a statistical downscaling framework is developed to forecast environmental factors for
  1 to 12 h in advance to evaluate the effectiveness of deep learning for AT prediction at 1 km resolution.
  The experiments use data for temperature, wind speed and relative humidity in ERA-5 and the results
  show that the developed deep learning model can predict the upcoming extreme low temperature AT event
  in the Gansu marathon region several hours in advance with better accuracy than climatological and persistence
  forecasting methods. The hypothermia time estimated by the deep learning method with a heat loss model
  agrees well with the observed estimation at 3-hour lead. Therefore, the developed deep learning forecasting
  method is effective for short-term AT prediction and hypothermia warnings at local areas.
