summary: A feature-selected multilayer perceptron classifier (LEGEMP) predicts cyclone intensity classes
  with improved accuracy, time and memory over conventional methods; the abstract gives no headline number.
abstract: Accurate cyclone intensity prediction is crucial for smart cities to effectively prepare and
  mitigate the potential devastation caused by these extreme weather events. Traditional meteorological
  models often face challenges in accurately forecasting cyclone intensity due to cyclonic systems’ complex
  and dynamic nature. Predicting the intensity of cyclones is a challenging task in meteorological research,
  as it requires expertise in extracting spatio-temporal features. To address this challenge, a new technique,
  called linear support vector regressive gradient descent Jaccardized deep multilayer perceptive classifier
  (LEGEMP), has been proposed to improve the accuracy of cyclone intensity prediction. This technique
  utilizes a dataset that contains various attributes. It employs the Herfindahl correlative linear support
  vector regression feature selection to identify the most important characteristics for enhancing cyclone
  intensity forecasting accuracy. The selected features are then used in conjunction with the Nesterov
  gradient descent jeopardized deep multilayer perceptive classifier to predict the intensity classes
  of cyclones, including depression, deep depression, cyclone, severe cyclone, very severe cyclone, and
  extremely severe cyclone. Experimental results have demonstrated that LEGEMP outperforms conventional
  methods in terms of cyclone intensity prediction accuracy, requiring minimum time, error rate, and memory
  consumption. By leveraging advanced techniques and feature selection, LEGEMP provides more reliable
  and precise predictions for cyclone intensity, enabling better preparedness and response strategies
  to mitigate the impact of these destructive storms. The LEGEMP technique offers an improved approach
  to cyclone intensity prediction, leveraging advanced classifiers and feature selection methods to enhance
  accuracy and reduce error rates. We demonstrate the effectiveness of our approach through rigorous evaluation
  and comparison with conventional prediction methods, showcasing significant improvements in prediction
  accuracy. Integrating our enhanced prediction model into smart city disaster management systems can
  substantially enhance preparedness and response strategies, ultimately contributing to the safety and
  resilience of communities in cyclone-prone regions.
