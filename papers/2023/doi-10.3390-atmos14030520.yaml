summary: CNN and FNN multi-model ensembles of ECMWF and CMA forecasts reduce 12-72 h surface air temperature
  errors in Henan, with the CNN best at short range.
abstract: Based on the China Meteorological Administration Land Data Assimilation System (CLDAS) reanalysis
  data and 12–72 h forecasts of the surface (2-m) air temperature (SAT) from the European Centre for Medium-Range
  Weather Forecasts (ECMWF) and three numerical weather prediction (NWP) models of the China Meteorological
  Administration (CMA-GFS, CMA-SH, and CMA-MESO), multi-model ensemble forecasts are conducted with a
  convolutional neural network (CNN) and a feed-forward neural network (FNN) to improve the SAT forecast
  in Henan Province, China. The results show that there are large errors in the 12–72 h forecasts of SAT
  from the CMA, while the ECMWF outperforms the other raw NWP models, especially in eastern and southern
  Henan. The CNN has the best short-term forecasting skills. The difference in the geographical distribution
  of the CNN forecast errors is small, without any apparent large-value areas. The CNN shows its advantages
  in its bias correction in the mountainous region (western Henan), indicating that the CNN can capture
  the spatial features of the atmospheric fields and is therefore more robust in regions with varied topography.
  In addition, the CNN can extract data features through the convolution kernel and focus on local features;
  it can assimilate the local features at a higher level and obtain global features. Therefore, the CNN
  takes advantage of the four models in the SAT forecast and further improves the forecast skill.
