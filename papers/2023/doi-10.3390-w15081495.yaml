summary: An LSTM driven by ERA5-Land inputs forecasts drinking water demand from 7 days to two months;
  ERA5-Land is usable but needs bias correction.
abstract: Drinking water demand modelling and forecasting is a crucial task for sustainable management
  and planning of water supply systems. Despite many short-term investigations, the medium-term problem
  needs better exploration, particularly the analysis and assessment of meteorological data for forecasting
  drinking water demand. This work proposes to analyse the suitability of ERA5-Land reanalysis data as
  weather input in water demand modelling. A multivariate deep learning model based on the long short-term
  memory architecture is used in this study over a prediction horizon ranging from seven days to two months.
  The performance of the model, fed by ground station data and ERA5-Land data, is compared and analysed.
  Close-to-operative forecasting is then presented using observed data for training and ERA5-Land dataset
  for testing. The results highlight the reliability of the proposed architecture fed by ERA5-Land data
  for different time horizons. In particular, the ERA5-Land shows promising performance as input of the
  multivariate machine learning forecasting model, although some meteorological biases are present, which
  can be improved, especially in close-to-operative application with bias correction techniques. The proposed
  study leads to practical implications in the use of regional climate model outputs to support drinking
  water forecasting for sustainable and efficient management of water distribution systems.
