summary: A divided 3D CNN (TS-3DCNN) predicts the 2020–22 multi-year La Niña, comparable to a dynamical
  intermediate coupled model.
abstract: Many coupled models are unable to accurately depict the multi-year La Niña conditions in the
  tropical Pacific during 2020–22, which poses a new challenge for real-time El Niño–Southern Oscillation
  (ENSO) predictions. Yet, the corresponding processes responsible for the multi-year coolings are still
  not understood well. In this paper, reanalysis products are analyzed to examine the ocean–atmosphere
  interactions in the tropical Pacific that have led to the evolution of sea surface temperature (SST)
  in the central-eastern equatorial Pacific, including the strong anomalous southeasterly winds over the
  southeastern tropical Pacific and the related subsurface thermal anomalies. Meanwhile, a divided temporal
  and spatial (TS) 3D convolution neural network (CNN) model, named TS-3DCNN, was developed to make predictions
  of the 2020/21 La Niña conditions; results from this novel data-driven model are compared with those
  from a physics-based intermediate coupled model (ICM). The prediction results made using the TS-3DCNN
  model for the 2020–22 La Niña indicate that this deep learning–based model can capture the two-year
  La Niña event to some extent, and is comparable to the IOCAS ICM; the latter dynamical model yields
  a successful real-time prediction of the Niño3.4 SST anomaly in late 2021 when it is initiated from
  early 2021. For physical interpretability, sensitivity experiments were designed and carried out to
  confirm the dominant roles played by the anomalous southeasterly wind and subsurface temperature fields
  in sustaining the second-year cooling in late 2021. As a potential approach to improving predictions
  for diversities of ENSO events, additional studies on effectively combining neural networks with dynamical
  processes and mechanisms are expected to significantly enhance the ENSO prediction capability. 2020–22年间热带太平洋经历了持续性多年的拉尼娜事件,
  多数耦合模式都难以准确预测其演变过程, 这为厄尔尼诺-南方涛动(ENSO)的实时预测带来了很大的挑战.同时, 目前学术界对此次持续性双拉尼娜事件的发展仍缺乏合理的物理解释, 其所涉及的物理过程和机制有待于进一步分析.本研究利用再分析数据产品分析了热带东南太平洋东南风异常及其引起的次表层海温异常在此次热带太平洋海表温度(SST)异常演变中的作用,
  并构建了一个时空分离(Time-Space)的三维(3D)卷积神经网络模型(TS-3DCNN)对此次双拉尼娜事件进行实时预测和过程分析.通过将TS-3DCNN与中国科学院海洋研究所(IOCAS)中等复杂程度海气耦合模式(IOCAS
  ICM)的预测结果对比, 表明TS-3DCNN模型对2020–22年双重拉尼娜事件的预测能力与IOCAS ICM相当, 二者均能够从2021年初的初始场开始较好地预测2021年末 区SST的演变.此外,
  基于TS-3DCNN和IOCAS ICM的敏感性试验也验证了赤道外风场异常和次表层海温异常在2021年末赤道中东太平洋海表二次变冷过程中的关键作用.未来将神经网络与动力模式有效结合, 进一步发展神经网络与物理过程相结合的混合建模是进一步提高ENSO事件预测能力的有效途径.
