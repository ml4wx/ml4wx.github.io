summary: Open-source Python framework implementing the full perfect-prognosis empirical-statistical downscaling
  cycle with a range of ML estimators for climate information.
abstract: Abstract. The nature and severity of climate change impacts vary significantly from region to
  region. Consequently, high-resolution climate information is needed for meaningful impact assessments
  and the design of mitigation strategies. This demand has led to an increase in the application of empirical-statistical
  downscaling (ESD) models to general circulation model (GCM) simulations of future climate. In contrast
  to dynamical downscaling, the perfect prognosis ESD (PP-ESD) approach has several benefits, including
  low computation costs, the prevention of the propagation of GCM-specific errors, and high compatibility
  with different GCMs. Despite their advantages, the use of ESD models and the resulting data products
  is hampered by (1) the lack of accessible and user-friendly downscaling software packages that implement
  the entire downscaling cycle, (2) difficulties reproducing existing data products and assessing their
  credibility, and (3) difficulties reconciling different ESD-based predictions for the same region. We
  address these issues with a new open-source Python PP-ESD modeling framework called pyESD. pyESD implements
  the entire downscaling cycle, i.e., routines for data preparation, predictor selection and construction,
  model selection and training, evaluation, utility tools for relevant statistical tests, visualization,
  and more. The package includes a collection of well-established machine learning algorithms and allows
  the user to choose a variety of estimators, cross-validation schemes, objective function measures, and
  hyperparameter optimization in relatively few lines of code. The package is well-documented, highly
  modular, and flexible. It allows quick and reproducible downscaling of any climate information, such
  as precipitation, temperature, wind speed, or even short-term glacier length and mass changes. We demonstrate
  the use and effectiveness of the new PP-ESD framework by generating weather-station-based downscaling
  products for precipitation and temperature in complex mountainous terrain in southwestern Germany. The
  application example covers all important steps of the downscaling cycle and different levels of experimental
  complexity. All scripts and datasets used in the case study are publicly available to (1) ensure the
  reproducibility and replicability of the modeled results and (2) simplify learning to use the software
  package.
