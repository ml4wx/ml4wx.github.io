summary: Compares U-Net and Transformer for precipitation prediction from cloud-layer information; U-Net
  reaches 96.89% accuracy versus 94.13% for the Transformer.
abstract: Accurate precipitation prediction has a huge socio-economic impact. With the development of
  algorithms, architectures, and hardware technologies in the field of machine learning, the disadvantages
  of traditional numerical weather prediction methods are becoming more and more obvious. Noting that
  related studies have attempted to use the latest machine learning architectures for precipitation prediction,
  this work uses Unet and Transformer for precipitation prediction based on cloud layer information and
  compares them. The results indicate that Transformer can achieve 94.13% accuracy, while Unet has 96.89%.
  Finally, in conducting the data comparison, a conjecture related to the lagging of Transformer data
  is proposed based on the results of this experiment.
