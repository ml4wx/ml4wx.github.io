summary: Reviews and analyses inductive biases (data, objectives, losses, architectures, optimisation)
  of deep-learning weather prediction models to guide more efficient, probabilistic designs.
abstract: 'Deep learning has gained immense popularity in the Earth sciences as it enables us to formulate
  purely data-driven models of complex Earth system processes. Deep learning-based weather prediction
  (DLWP) models have made significant progress in the last few years, achieving forecast skills comparable
  to established numerical weather prediction models with comparatively lesser computational costs. In
  order to train accurate, reliable, and tractable DLWP models with several millions of parameters, the
  model design needs to incorporate suitable inductive biases that encode structural assumptions about
  the data and the modelled processes. When chosen appropriately, these biases enable faster learning
  and better generalisation to unseen data. Although inductive biases play a crucial role in successful
  DLWP models, they are often not stated explicitly and their contribution to model performance remains
  unclear. Here, we review and analyse the inductive biases of state-of-the-art DLWP models with respect
  to five key design elements: data selection, learning objective, loss function, architecture, and optimisation
  method. We identify the most important inductive biases and highlight potential avenues towards more
  efficient and probabilistic DLWP models.'
