summary: Surveys over 20 ML and ML-enhanced weather and climate methods, finding ML strong for short-range
  forecasting but supplementary for medium-to-long-range climate prediction.
abstract: Weather and climate prediction have been crucial in human history for enabling effective agricultural
  planning, safeguarding against natural disasters, and facilitating strategic decision-making in various
  sectors. In this context, the need for accurate and timely forecasting is highly significant. Machine
  learning has the potential to improve the accuracy and speed of weather and climate prediction. This
  comprehensive survey assesses the efficacy of Machine Learning (ML) and Machine Learning-Enhanced (ML-Enhanced)
  methodologies in short-term weather forecasting and medium-to-long-term climate prediction. Acknowledging
  the historical importance of weather and climate prediction as crucial tools affecting human life and
  societal functions, the paper scrutinizes over 20 methods, highlighting six that appear to be at the
  forefront of ML applications in meteorological forecasting. While ML shows promising results in short-term
  weather prediction, its role remains supplementary in medium-to-long-term climate forecasting due to
  the complexity of climate conditions and limited data samples. The study finds ML to be fast, scalable,
  and relatively accurate; however, traditional methods remain indispensable, particularly for medium-to-long-term
  forecasts, where understanding the mechanisms of meteorological changes is pivotal.
