summary: Attentional GAN with a spatial variability loss reduces the blurry effect in radar nowcasts and
  outperforms competing models on the test set and storm cases.
abstract: Weather radar plays an important role in accurate weather monitoring and modern weather forecasting,
  as it can provide timely and refined weather forecasts for the public and for decision makers. Deep
  learning has been applied in radar nowcasting tasks and has exhibited a better performance than traditional
  radar echo extrapolation methods. However, current deep learning-based radar nowcasting models are found
  to suffer from a spatial “blurry” effect that can be attributed to a deficiency in spatial variability
  representation. This study proposes a Spatial Variability Representation Enhancement (SVRE) loss function
  and an effective nowcasting model, named the Attentional Generative Adversarial Network (AGAN), to alleviate
  this blurry effect by enhancing the spatial variability representation of radar nowcasting. An ablation
  experiment and a comparison experiment were implemented to assess the effect of the generative adversarial
  (GA) training strategy and the SVRE loss, as well as to compare the performance of the AGAN and SVRE
  loss function with the current advanced radar nowcasting models. The performances of the models were
  validated on the whole test set and inspected in two storm cases. The results showed that both the GA
  strategy and SVRE loss function could alleviate the blurry effect by enhancing the spatial variability
  representation, which helps the AGAN to achieve better nowcasting performance than the other competitor
  models. Our study provides a feasible solution for high-precision radar nowcasting applications.
