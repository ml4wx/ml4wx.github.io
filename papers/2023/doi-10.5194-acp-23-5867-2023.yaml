summary: Neural networks trained on A-Train radar-lidar data add cloud height, layering and rain intensity
  to tropical cloud systems, enabling convective organization analysis for model evaluation.
abstract: Abstract. We are building a 3D description of upper tropospheric (UT) cloud systems in order
  to study the relation between convection and cirrus anvils. For this purpose we used cloud data from
  the Atmospheric InfraRed Sounder and the Infrared Atmospheric Sounding Inferometer and atmospheric and
  surface properties from the meteorological reanalyses ERA-Interim and machine learning techniques. The
  different artificial neural network models were trained on collocated radar – lidar data from the A-Train
  in order to add cloud top height, cloud vertical extent, cloud layering, as well as a rain intensity
  classification (no, light or heavy) to other variables describing the UT cloud systems. The rain intensity
  classification has an accuracy of about 65 to 70 % and allows to build objects of strong precipitation,
  used to identify convective organization. This classification is more efficient to detect large latent
  heating compared to cold cloud temperature. The cloud system concept allows a process-oriented evaluation
  of parameterizations in climate models. In agreement with earlier studies, we found that the rain intensity
  is maximum after the first development of anvils and that deeper convection leads to larger heavy rain
  areas and a larger detrainment. Finally we have shown the usefulness of our data to investigate tropical
  convective organization. A comparison of different tropical convective organization indices and proxies
  to define convective areas has revealed that all indices show a similar annual cycle in convective organization,
  in phase with the one of convective core height, anvil vertical extent, and horizontal detrainment of
  the mesoscale convective systems and in opposite phase with the one of the ratio of thin cirrus over
  total anvil size. Differences can be understood by seasonal cycles of size and number of areas in phase
  for intense precipitation and opposite phase for cold clouds as proxies. The geographical patterns and
  magnitudes in radiative heating rate inter-annual changes with respect to one specific convective organization
  index (Iorg) for the period 2008 to 2018 are similar for both proxies, but slightly larger for rain
  intensity, and they are similar to the ones related to the El Niño Southern Oscillation. However, the
  time series of the inter-annual anomalies of convective organization depend on the convective organization
  index.
