summary: An LSTM trained on paleo and instrumental records projects global temperature rising 4.8°C and
  CO2 reaching 713 ppm by 2100.
abstract: Abstract This work is executed to predict the variation in global temperature and greenhouse
  gas (GHG) emissions resulting from climate change and global warming, taking into consideration the
  natural climate cycle. A mathematical model was developed using a Recurrent Neural Network (RNN) with
  Long Short-Term Memory (LSTM) model. Datasets of global temperature were collected from 800,000 BC to
  1950 AD from the National Oceanic and Atmospheric Administration (NOAA). Furthermore, another dataset
  was obtained from The National Aeronautics and Space Administration (NASA) climate website. This contained
  records from 1880 to 2019 of global temperature and carbon dioxide levels. The numerical analysis and
  forecasting via the LSTM model revealed that the global temperature shows a trend of a sharp increase,
  reaching a temperature rise of 4.8°C by 2100. Moreover, carbon dioxide concentrations will continue
  to boom, attaining a value of 713 ppm in 2100. Also, the findings indicated that the RNN algorithm (LSTM
  model) provided higher accuracy and reliable forecasting results as the prediction outputs were closer
  to the international climate models and were found to be in good agreement.
