summary: Sky-camera images feed ANN and SVM models that nowcast photovoltaic output 3 hours ahead, with
  errors close to the uncertainty of the solar resource itself.
abstract: The alternation between cloudy and clear skies alters the photovoltaic production. This makes
  it necessary to anticipate these disturbances hours in advance for the correct operation of the electricity
  distribution plants and networks. In this paper, two short-term forecasting models (3 h) are developed
  to forecast the photovoltaic production in an integrated plant in the CIESOL building of the University
  of Almería. The methodology used is based on sky camera images and Artificial Intelligence techniques.
  Two models have been developed and compared applying artificial neural network (ANN) and support vector
  machine (SVM) techniques. The global irradiance predicted using sky camera images is used as an input
  variable in both models. In addition, the operational status of the plants has been included as an input
  parameter through the performance ratio. The results have shown that the errors made by ANN and SVM
  are very similar. For all sky conditions, the uncertainty of the production forecast differs by less
  than 2% from the uncertainty of the solar resource, which is the main source of error in the production
  models developed.
