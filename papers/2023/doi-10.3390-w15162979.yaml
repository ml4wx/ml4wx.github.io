summary: Reviews AI and deep learning rainfall forecasting studies for Thailand from 2000 to 2022, concluding
  hybrid ANN-wavelet models are most promising.
abstract: Rainfall forecasting is one of the most challenging factors of weather forecasting all over
  the planet. Due to climate change, Thailand has experienced extreme weather events, including prolonged
  lacks of and heavy rainfall. Accurate rainfall forecasting is crucial for Thailand’s agricultural sector.
  Agriculture depends on rainfall water, which is important for water resources, adversity management,
  and overall socio-economic development. Artificial intelligence techniques (AITs) have shown remarkable
  precision in rainfall forecasting in the past two decades. AITs may accurately forecast rainfall by
  identifying hidden patterns from past weather data features. This research investigates and reviews
  the most recent AITs focused on advanced machine learning (ML), artificial neural networks (ANNs), and
  deep learning (DL) utilized for rainfall forecasting. For this investigation, academic articles from
  credible online search libraries published between 2000 and 2022 are analyzed. The authors focus on
  Thailand and the worldwide applications of AITs for rainfall forecasting and determine the best methods
  for Thailand. This will assist academics in analyzing the most recent work on rainfall forecasting,
  with a particular emphasis on AITs, but it will also serve as a benchmark for future comparisons. The
  investigation concludes that hybrid models combining ANNs with wavelet transformation and bootstrapping
  can improve the current accuracy of rainfall forecasting in Thailand.
