summary: DSRSS-Net jointly super-resolves and segments FY-4A imagery for snow-cover mapping on the Tibetan
  Plateau, improving classification accuracy by 4.45% over MOD10A1.
abstract: The Qinghai–Tibet Plateau is one of the regions with the highest snow accumulation in China.
  Although the Fengyun-4A (FY4A) satellite is capable of monitoring snow-covered areas in real time and
  on a wide scale at high temporal resolution, its spatial resolution is low. In this study, the Qinghai–Tibet
  Plateau, which has a harsh climate with few meteorological stations, was selected as the study area.
  We propose a deep learning model called the Dual-Branch Super-Resolution Semantic Segmentation Network
  (DSRSS-Net), in which one branch focuses with super resolution to obtain high-resolution snow distributions
  and the other branch carries out semantic segmentation to achieve accurate snow recognition. An edge
  enhancement module and coordinated attention mechanism were introduced into the network to improve the
  classification performance and edge segmentation effect for cloud versus snow. Multi-task loss is also
  used for optimization, including feature affinity loss and edge loss, to obtain fine structural information
  and improve edge segmentation. The 1 km resolution image obtained by coupling bands 1, 2, and 3; the
  2 km resolution image obtained by coupling bands 4, 5, and 6; and the 500 m resolution image for a single
  channel, band 2, were inputted into the model for training. The accuracy of this model was verified
  using ground-based meteorological station data. Snow classification accuracy, false detection rate,
  and total classification accuracy were compared with the MOD10A1 snow product. The results show that,
  compared with MOD10A1, the snow classification accuracy and the average total accuracy of DSRSS-Net
  improved by 4.45% and 5.1%, respectively. The proposed method effectively reduces the misidentification
  of clouds and snow, has higher classification accuracy, and effectively improves the spatial resolution
  of FY-4A satellite snow cover products.
