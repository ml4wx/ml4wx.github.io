summary: Presents a RetinaNet detector, labeled dataset and annotation tool for mesoscale convective systems
  in Meteosat SEVIRI imagery, achieving mAP 0.75.
abstract: Mesoscale convective systems (MCSs) and associated hazardous meteorological phenomena cause
  considerable economic damage and even loss of lives in the mid-latitudes. The mechanisms behind the
  formation and intensification of MCSs are still not well understood due to limited observational data
  and inaccurate climate models. Improving the prediction and understanding of MCSs is a high-priority
  area in hydrometeorology. One may study MCSs either employing high-resolution atmospheric modeling or
  through the analysis of remote sensing images which are known to reflect some of the characteristics
  of MCSs, including high temperature gradients of cloud-top, specific spatial shapes of temperature patterns,
  etc. However, research on MCSs using remote sensing data is limited by inadequate (in size) databases
  of satellite-identified MCSs and poorly equipped automated tools for MCS identification and tracking.
  In this study, we present (a) the GeoAnnotateAssisted tool for fast and convenient visual identification
  of MCSs in satellite imagery, which is capable of providing AI-generated suggestions of MCS labels;
  (b) the Dataset of Mesoscale Convective Systems over the European Territory of Russia (DaMesCoS-ETR),
  which we created using this tool, and (c) the Deep Convolutional Neural Network for the Identification
  of Mesoscale Convective Systems (MesCoSNet), constructed following the RetinaNet architecture, which
  is capable of identifying MCSs in Meteosat MSG/SEVIRI data. We demonstrate that our neural network,
  optimized in terms of its hyperparameters, provides high MCS identification quality (mAP=0.75, true
  positive rate TPR=0.61) and a well-specified detection uncertainty (false alarm ratio FAR=0.36). Additionally,
  we demonstrate potential applications of the GeoAnnotateAssisted labelling tool, the DaMesCoS-ETR dataset,
  and the MesCoSNet neural network in addressing MCS research challenges. Specifically, we present the
  climatology of axisymmetric MCSs over the European territory of Russia from 2014 to 2020 during summer
  seasons (May to September), obtained using MesCoSNet with Meteosat MSG/SEVIRI data. The automated identification
  of MCSs by the MesCoSNet artificial neural network opens up new avenues for previously unattainable
  MCS research topics.
