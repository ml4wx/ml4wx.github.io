summary: Six ML algorithms merge multi-source satellite and model precipitation with gauges over South
  Korea, improving rain detection and intensity estimates.
abstract: South Korea is situated in the northeastern region of Asia Recent technological developments
  have enabled multi-source precipitation products (MSPs), including satellite-based and model-based,
  to be useful data sources for quantifying the spatiotemporal variations in precipitation. Unfortunately,
  the main limitation of MSPs in potential applications is inheritance errors with high uncertainty. To
  tackle this problem, the capabilities of six machine learning algorithms (Ridge Linear Regression, k-Nearest
  Neighbors, Support Vector Regression, Gradient Boosting Decision Tree, Light Gradient Boosting Machine,
  and Random Forest) to produce new precipitation product by merging MSPs with ground-based data have
  investigated. Ground-based data from 2003 to 2017 were utilized for train and valid process. The robustness
  of the ML algorithms was highlighted using several evaluation metrics such as continuous indices (modified
  Kling-Gupta Efficiency and root mean square error) and categorical indices (probability of detection,
  false alarm rate, and critical success index). The results indicate that (1) the ML approaches can merge
  MSPs with observed data for accurately estimate rainfall, particularly in basins with sparsely distributed
  rain gauge stations. (2) The merged precipitation products generated from the six ML approaches showed
  significant agreement and high accuracy with observation data considering rainfall intensity estimation
  and improved the capability of detecting rain and non-rain events over South Korea.
