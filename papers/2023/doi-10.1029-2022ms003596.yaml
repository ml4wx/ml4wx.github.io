summary: Transfer-learned CNN ensemble emulates seasonal tropical cyclone activity from large-scale fields,
  with skill on operational forecasts and projected global TC decline under warming.
abstract: Abstract It has been widely recognized that tropical cyclone (TC) genesis requires favorable
  large‐scale environmental conditions. Based on these linkages, numerous efforts have been made to establish
  an empirical relationship between seasonal TC activities and large‐scale environmental favorability
  in a quantitative way, which lead to conceptual functions such as the TC genesis index. However, due
  to the limited amount of reliable TC observations and complexity of the climate system, a simple analytic
  function may not be an accurate portrait of the empirical relationship between TCs and their ambiences.
  In this research, we use convolution neural networks (CNNs) to disentangle this complex relationship.
  To circumvent the limited amount of seasonal TC observation records, we implement transfer‐learning
  technique to train ensemble of CNNs first on suites of high‐resolution climate model simulations with
  realistic seasonal TC activities and large‐scale environmental conditions, and then on a state‐of‐the‐art
  reanalysis from 1950 to 2019. The trained CNNs can well reproduce the historical TC records and yields
  significant seasonal prediction skills when the large‐scale environmental inputs are provided by operational
  climate forecasts. Furthermore, by inputting the ensemble CNNs with 20th century reanalysis products
  and Phase 6 of the Coupled Model Intercomparison Project (CMIP6) simulations, we investigated TC variability
  and its changes in the past and future climates. Specifically, our ensemble CNNs project a decreasing
  trend of global mean TC activity in the future warming scenario, which is consistent with our future
  projections using high‐resolution climate model.
