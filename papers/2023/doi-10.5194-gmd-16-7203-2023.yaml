summary: Machine learning statistical emulators reproduce interannual crop yield responses to CO2, temperature,
  water and nitrogen perturbations from GGCMI phase 2, explaining over 52% of yield variance.
abstract: Abstract. Understanding the impact of climate change on year-to-year variation of crop yield
  is critical to global food stability and security. While crop model emulators are believed to be lightweight
  tools to replace the models, few emulators have been developed to capture such interannual variation
  of crop yield in response to climate variability. In this study, we developed a statistical emulator
  with a machine learning algorithm to reproduce the response of year-to-year variation of four crop yields
  to CO2 (C), temperature (T), water (W), and nitrogen (N) perturbations defined in the Global Gridded
  Crop Model Intercomparison Project (GGCMI) phase 2. The emulators were able to explain more than 52
  % of the variance of simulated yield and performed well in capturing the year-to-year variation of global
  average and gridded crop yield over current croplands in the baseline. With the changes in CO2–temperature–water–nitrogen
  (CTWN) perturbations, the emulators could reproduce the year-to-year variation of crop yield well over
  most current cropland. The variation of R and the mean absolute error was small under the single CTWN
  perturbations and dual-factor perturbations. These emulators thus provide statistical response surfaces
  of yield, including both its mean and interannual variability, to climate factors. They could facilitate
  spatiotemporal downscaling of crop model simulation, projecting the changes in crop yield variability
  in the future and serving as a lightweight tool for multi-model ensemble simulation. The emulators enhanced
  the flexibility of crop yield estimates and expanded the application of large-ensemble simulations of
  crop yield under climate change.
