summary: Builds a city-level weather app combining XGBoost, Random Forest and LSTM forecasts with speech
  queries for visually impaired users; no skill scores reported.
abstract: Weather forecasting plays a crucial role in our daily lives, influencing decisions in agriculture,
  transportation, event planning, and personal safety. This project presents an intelligent weather prediction
  system powered by advanced machine learning techniques to forecast weather parameters such as temperature,
  humidity, rainfall, wind speed, and atmospheric pressure. The system collects real-time weather data
  using an API and leverages historical weather datasets for model training and evaluation.To achieve
  high prediction accuracy, this system incorporates robust machine learning algorithms, including XGBoost
  and Random Forest Regression, known for their effectiveness in handling non-linear relationships and
  feature interactions. For time-series forecasting tasks, particularly in predicting future rainfall
  and temperature trends, the project employs Long Short-Term Memory (LSTM) networks due to their capacity
  to learn temporal dependencies over time.An innovative feature of this application is its speech recognition
  interface, enabling voice-based interaction for querying weather reports. This makes the system especially
  accessible to visually impaired users, allowing them to receive current weather updates hands-free.
  Additionally, users can access a graphical dashboard that visualizes real-time weather insights and
  predictions after entering the city name.
