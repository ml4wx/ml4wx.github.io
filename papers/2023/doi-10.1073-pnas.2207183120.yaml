summary: ANNs trained on climate model output estimate observed timing of 1.5°C and 2°C warming, with
  a 2033–2035 central estimate for 1.5°C.
abstract: Leveraging artificial neural networks (ANNs) trained on climate model output, we use the spatial
  pattern of historical temperature observations to predict the time until critical global warming thresholds
  are reached. Although no observations are used during the training, validation, or testing, the ANNs
  accurately predict the timing of historical global warming from maps of historical annual temperature.
  The central estimate for the 1.5 °C global warming threshold is between 2033 and 2035, including a ±1σ
  range of 2028 to 2039 in the Intermediate (SSP2-4.5) climate forcing scenario, consistent with previous
  assessments. However, our data-driven approach also suggests a substantial probability of exceeding
  the 2 °C threshold even in the Low (SSP1-2.6) climate forcing scenario. While there are limitations
  to our approach, our results suggest a higher likelihood of reaching 2 °C in the Low scenario than indicated
  in some previous assessments—though the possibility that 2 °C could be avoided is not ruled out. Explainable
  AI methods reveal that the ANNs focus on particular geographic regions to predict the time until the
  global threshold is reached. Our framework provides a unique, data-driven approach for quantifying the
  signal of climate change in historical observations and for constraining the uncertainty in climate
  model projections. Given the substantial existing evidence of accelerating risks to natural and human
  systems at 1.5 °C and 2 °C, our results provide further evidence for high-impact climate change over
  the next three decades.
