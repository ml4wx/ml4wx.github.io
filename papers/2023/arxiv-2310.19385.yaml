summary: Trains neural subgrid parametrizations with a posteriori losses via a neural emulator that propagates
  gradients through non-differentiable solvers, tested on Lorenz-96 and quasi-geostrophic systems.
abstract: In this paper, we propose a generic algorithm to train machine learning-based subgrid parametrizations
  online, i.e., with $\textit{a posteriori}$ loss functions, but for non-differentiable numerical solvers.
  The proposed approach leverages a neural emulator to approximate the reduced state-space solver, which
  is then used to allow gradient propagation through temporal integration steps. We apply this methodology
  on a chaotic two-timescales Lorenz-96 system and a single layer quasi-geostrophic system with zonal
  dynamics, known to be highly unstable with offline strategies. Using our algorithm, we are able to train
  a parametrization that recovers most of the benefits of online strategies without having to compute
  the gradient of the original solver. We found that training the neural emulator and parametrization
  components separately with different loss quantities is necessary in order to minimize the propagation
  of approximation biases. Experiments on emulator architectures with different complexities also indicates
  that emulator performance is key in order to learn an accurate parametrization. This work is a step
  towards learning parametrization with online strategies for climate models.
