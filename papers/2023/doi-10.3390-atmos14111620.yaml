summary: Hybrid ANN plus quantile-mapping post-processing of GEFSv12 reforecasts reduces warm bias and
  improves summer Tmax and extreme-day forecasts over Taiwan at extended ranges.
abstract: Taiwan is highly susceptible to global warming, experiencing a 1.4°C increase in air temperatures
  from 1911-2005, which is twice the average for the Northern Hemisphere. This has led to higher rates
  of respiratory and cardiovascular mortality. Accurately predicting maximum temperatures during the summer
  season is crucial, but numerical weather models become less accurate and more uncertain beyond five
  days. To improve forecast reliability, statistical post-processing is needed to address systematic errors.
  In September 2020, NOAA NCEP implemented the Global Ensemble Forecast System version 12 (GEFSv12) to
  help manage climate risks. This study developed a Hybrid statistical post-processing method that combines
  Artificial Neural Networks (ANN) and Quantile mapping (QQ) approaches to predict daily maximum temperatures
  and extremes in Taiwan during the summer season. The Hybrid technique, utilizing deep learning techniques,
  was applied to the GEFSv12 reforecast data and evaluated against ERA5 reanalysis. The Hybrid technique
  was the most effective among the three techniques tested. It had the lowest bias, RMSE, and highest
  correlation coefficient. It successfully reduced the warm bias and overestimation of Tmax extreme days.
  This led to improved prediction skills for all forecast lead times. Compared to ANN and QQ, the Hybrid
  method was more effective in predicting summer daily Tmax and its extremes on an extended-range time
  scale deterministic and ensemble probabilistic forecasts over Taiwan.
