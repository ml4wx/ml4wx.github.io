summary: Releases LSDSSIMR, a 2020–2022 dataset of FY-4A satellite dust images at 15-minute, 4 km resolution,
  paired with reanalysis for dust storm prediction.
abstract: In recent years, dust storms have occurred frequently, significantly affecting people's daily
  lives. Therefore, the detection, monitoring, and early warning of dust storms have a great social significance.
  Previous methods have mainly been based on atmospheric motion to build physical models for weather forecasting.
  Although there are many meteorological applications based on deep learning, to the best of our knowledge,
  there is no dust storm database with a high spatiotemporal resolution, which is essential for deep learning
  methods. Since meteorological satellites can observe the Earth's atmosphere from a spatial perspective
  at a large scale, in this paper, a dust storm database is constructed using multi-channel and dust label
  data from the Fengyun-4A (FY-4A) geosynchronous orbiting satellite, namely, the Large-Scale Dust Storm
  database based on Satellite Images and Meteorological Reanalysis data (LSDSSIMR), with a temporal resolution
  of 15 minutes and a spatial resolution of 4km from March to May of each year during 2020–2022. Meteorological
  reanalysis data are added to LSDSSIMR for spatiotemporal prediction methods. Each data file is stored
  in HDF5 format, and the final LSDSSIMR contains nearly 5400 HDF5 files. Moreover, some traditional dust
  detection methods based on spectral analysis are executed as a benchmark
