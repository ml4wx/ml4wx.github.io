summary: A machine learning model trained on GIMMS NDVI projects global vegetation decline under SSP585
  after 2060, using CMIP6 climate projections.
abstract: In this study, a machine learning model was used to investigate the potential consequences of
  climate change on vegetation growth. The methodology involved analyzing the historical Normalized Difference
  Vegetation Index (NDVI) data and future climate projections under four Shared Socioeconomic Pathways
  (SSPs). Data from the Global Inventory Monitoring and Modeling System (GIMMS) dataset for the period
  1981–2000 were used to train the machine learning model, while CMIP6 (Coupled Model Intercomparison
  Project Phase 6) global climate projections from 2021–2100 were employed to predict future NDVI values
  under different SSPs. The study results revealed that the global mean NDVI is projected to experience
  a significant increase from the period 1981–2000 to the period 2021–2040. Following this, the mean NDVI
  slightly increases under SSP126 and SSP245 while decreasing substantially under SSP370 and SSP585. In
  the near-term span of 2021–2040, the average NDVI value of SSP585 slightly exceeds that of SSP245 and
  SSP370, suggesting a positive vegetation development in response to a more pronounced temperature increase
  in the near term. However, if the trajectory of SSP585 persists, the mean NDVI will commence a decline
  over the subsequent three periods (2041–2060, 2061–2080, and 2080–2100) with a faster speed than that
  of SSP370. This decline is attributed to the adverse effects of a rapid temperature rise on vegetation.
  Based on the examination of individual continents, it is projected that the NDVI values in Africa, South
  America, and Oceania will decline over time, except under the scenario SSP126 during 2081–2100. On the
  other hand, the NDVI values in North America and Europe are anticipated to increase, with the exception
  of the scenario SSP585 during 2081–2100. Additionally, Asia is expected to follow an increasing trend,
  except under the scenario SSP126 during 2081–2100. In the larger scope, our research findings carry
  substantial implications for biodiversity preservation, greenhouse gas emission reduction, and efficient
  environmental management. The utilization of machine learning technology holds the potential to accurately
  predict future changes in vegetation growth and pinpoint areas where intervention is imperative.
