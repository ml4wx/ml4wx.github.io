summary: Gradient-boosted models forecast short-term local wind for a Moroccan chemical plant, cutting
  errors 38-52% versus official forecasts and enabling pollution-aware production decisions.
abstract: This paper presents a data-driven approach to mitigate the effects of air pollution from industrial
  plants on nearby cities by linking operational decisions with weather conditions. Our method combines
  predictive and prescriptive machine learning models to forecast short-term wind speed and direction
  and recommend operational decisions to reduce or pause the industrial plant's production. We exhibit
  several trade-offs between reducing environmental impact and maintaining production activities. The
  predictive component of our framework employs various machine learning models, such as gradient-boosted
  tree-based models and ensemble methods, for time series forecasting. The prescriptive component utilizes
  interpretable optimal policy trees to propose multiple trade-offs, such as reducing dangerous emissions
  by 33-47% and unnecessary costs by 40-63%. Our deployed models significantly reduced forecasting errors,
  with a range of 38-52% for less than 12-hour lead time and 14-46% for 12 to 48-hour lead time compared
  to official weather forecasts. We have successfully implemented the predictive component at the OCP
  Safi site, which is Morocco's largest chemical industrial plant, and are currently in the process of
  deploying the prescriptive component. Our framework enables sustainable industrial development by eliminating
  the pollution-industrial activity trade-off through data-driven weather-based operational decisions,
  significantly enhancing factory optimization and sustainability. This modernizes factory planning and
  resource allocation while maintaining environmental compliance. The predictive component has boosted
  production efficiency, leading to cost savings and reduced environmental impact by minimizing air pollution.
