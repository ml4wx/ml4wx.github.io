summary: Random Forest, GAM and LightGBM map landslide susceptibility under CMIP6 warming, finding high-susceptibility
  zones grow by up to 4.0% at 4 °C warming.
abstract: Landslides are one of the most prevalent environmental disasters in the Hengduan Mountain Region.
  Landslides lead to severe economic damage and property loss, as well as fatalities. Furthermore, they
  tend to increase in the context of climate change. The purpose of this study is to comprehensively assess
  landslide susceptibility across the Hengduan Mountain Region in southwest China. Specifically, the analysis
  is focused on the eastern boundary of the Tibetan Plateau within the context of future climate change
  scenarios, which are based on the latest Coupled Model Intercomparison Project Phase 6 (CMIP6) global
  climate model ensemble. The Generalized Additive Model (GAM), Random Forest (RF), and Light Gradient
  Boosting Machine (LightGBM) were selected in order to map landslide susceptibility within the context
  of 1.5–4.0 °C warming scenarios. This was achieved by considering the changes in extreme rainfall that
  exceeded the landslide triggering thresholds. The results show that the frequency over extreme rainfall
  thresholds (FOERT) tend to increase in conjunction with warming targets, thereby ranging from 2.3/a
  (at a 1.5 °C warming) to 9.0/a (at a 4.0 °C warming) on average. Such elevated extreme precipitation
  events contribute to an increase in projected future zones of high landslide susceptibility when compared
  to the historical baseline period ranging from −1.2% (at a 1.5 °C warming) to 4.0% (at a 4.0 °C warming)
  using different machine learning models. Moreover, the extent of high susceptibility zones increases
  more significantly in the context of 4.0 °C warming when compared to the historical baseline results.
  These results indicate the importance of limiting the global temperature rise to 1.5 as well as 2 °C.
  The high landslide susceptibility zones estimated by the CMIP6 multi-models ensemble are mainly located
  in the central and southeastern regions of the Hengduan Mountain Region. The possible changes in terms
  of introducing extreme precipitation in order to assess landslide susceptibility in the context of climate
  change that is proposed in this study may be further applied to additional study areas. These projections
  under different targets can provide scientific guidelines for the purposes of the development of climate
  change adaptation strategies.
