summary: Radial basis function neural network forecasts temperature and humidity in Warangal, India, from
  one year of station data and outperforms other ML models.
abstract: Weather forecasting is an essential task in any region of the world for proper planning of various
  sectors that are affected by climate change. In Warangal, most sectors, such as agriculture and electricity,
  are mainly influenced by climate conditions. In this study, weather (WX) in the Warangal region was
  forecast in terms of temperature and humidity. A radial basis function neural network was used in this
  study to forecast humidity and temperature. Humidity and temperature data were collected for the period
  of January 2021 to December 2021. Based on the simulation results, it is observed that the radial basis
  function neural network model performs better than other machine learning models when forecasting temperature
  and humidity.
