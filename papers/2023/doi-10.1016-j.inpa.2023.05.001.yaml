summary: Review of statistical machine learning for fishery weather scenario generation, forecasting and
  extreme-weather warnings.
abstract: 'As the new generation of artificial intelligence (AI) continues to evolve, weather big data
  and statistical machine learning (SML) technologies complement each other and are deeply integrated
  to significantly improve the processing and forecasting accuracy of fishery weather. Accurate fishery
  weather services play a crucial role in fishery production, serving as a great safeguard for economic
  benefits and personal safety, enabling fishermen to carry out fishery production better, and contributing
  to the sustainable development of the fishery industry. The objective of this paper is to offer an understanding
  of the present state of research and development in SML technology for simulating and forecasting fishery
  weather. Specifically, we analyze the current state of research and technical features of SML in weather
  and summarize the applications of SML in simulation and forecasting of fishery weather, which mainly
  include three aspects: fishery weather scenario generation, fishery weather forecasting, and fishery
  extreme weather warning. We also illustrate the main technical means and principles of SML technology.
  Finally, we summarize the most advanced SML fields and provide an outlook on their application value
  in the field of fishery weather.'
