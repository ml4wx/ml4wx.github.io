summary: CNNs, notably a fully convolutional network, beat an MLP for thunderstorm prediction from satellite
  and NWP data, extending lead time for air-traffic management.
abstract: Thunderstorms can be a large source of disruption for European air-traffic management causing
  a chaotic state of operation within the airspace system. In current practice, air-traffic managers are
  provided with imprecise forecasts which limit their ability to plan strategically. As a result, weather
  mitigation is performed using tactical measures with a time horizon of three hours. Increasing the lead
  time of thunderstorm predictions to the day before operations could help air-traffic managers plan around
  weather and improve the efficiency of air-traffic-management operations. Emerging techniques based on
  machine learning have provided promising results, partly attributed to reduced human bias and improved
  capacity in predicting thunderstorms purely from numerical weather prediction data. In this paper, we
  expand on our previous work on thunderstorm forecasting, by applying convolutional neural networks (CNNs)
  to exploit the spatial characteristics embedded in the weather data. The learning task of predicting
  convection is formulated as a binary-classification problem based on satellite data. The performance
  of multiple CNN-based architectures, including a fully-convolutional neural network (FCN), a CNN-based
  encoder-decoder, a U-Net, and a pyramid-scene parsing network (PSPNet) are compared against a multi-layer-perceptron
  (MLP) network. Our work indicates that CNN-based architectures improve the performance of point-prediction
  models, with a fully-convolutional neural-network architecture having the best performance. Results
  show that CNN-based architectures can be used to increase the prediction lead time of thunderstorms.
  Lastly, a case study illustrating the applications of convection-prediction models in an air-traffic-management
  setting is presented.
