summary: Transfer learning merges Earth system model simulations with historical observations to cut the
  spread of 21st-century global temperature projections by more than 50%.
abstract: Precise and reliable climate projections are required for climate adaptation and mitigation,
  but Earth system models still exhibit great uncertainties. Several approaches have been developed to
  reduce the spread of climate projections and feedbacks, yet those methods cannot capture the nonlinear
  complexity inherent in the climate system. Using a Transfer Learning approach, we show that Machine
  Learning can be used to optimally leverage and merge the knowledge gained from global temperature maps
  simulated by Earth system models and observed in the historical period to reduce the spread of global
  surface air temperature fields projected in the 21st century. We reach an uncertainty reduction of more
  than 50% with respect to state-of-the-art approaches while giving evidence that our method provides
  improved regional temperature patterns together with narrower projections uncertainty, urgently required
  for climate adaptation.
