summary: Physics-informed neural architecture uses 3D point clouds and satellite data to downscale urban
  land surface temperature to 30 m, with error under 0.2 K.
abstract: 'Abstract. High-resoulution downscaling of surface climate metrics like urban surface temperature,
  is a crucial and ongoing research challenge in urban climatology and environmental studies. In this
  study we propose a groundbreaking Physics-Inspired Neural Architecture for Modeling (PINAM) called DeepUrbanModeller(DUM),
  designed specifically for urban microclimate temperature estimation. DeepUrbanModeller(DUM) harnesses
  process-based modelling and satellite remote sensing, and draws upon high-accuracy 3D point clouds to
  deliver precise estimations of urban Land Surface Temperature (LST) at ultra-high resolutions. By incorporating
  high-accuracy land surface geometric data sourced from 3D point clouds and guided by the principles
  of atmospheric physics linked to surface temperature, DeepUrbanModeller(DUM) creates a data-driven framework,
  informed by physical laws, to accurately model high-resolution temperature distributions a task challenging
  for numerical simulations or conventional machine learning. The DeepUrbanModeller(DUM) design integrates
  two key components: Global Physical Feature Interpretation (GPFI) and Local Urban Surface Insight (LUSI).
  The GPFI captures broader urban physical parameters, ensuring the estimates comply with relevant physical
  laws. The LUSI enhances estimation performance at high-resolution levels by utilizing a newly proposed
  Urban Detail Orientation Index (UDOI) derived from 3D point clouds. Experimental results demonstrate
  the DeepUrbanModeller(DUM)’s superior capability in estimating urban LST on a detailed 30-by-30 meter
  grid, achieving an estimation error of less than 0.2 Kelvin compared to satellite measurements, a performance
  surpassing traditional methodologies.'
