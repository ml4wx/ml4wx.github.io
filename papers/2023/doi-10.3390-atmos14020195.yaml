summary: CNN-derived ERA-Interim features (humidity, vorticity, ozone) added to SHIPS predictors improve
  tropical cyclone rapid intensification prediction by 23–43%.
abstract: Rapid Intensification (RI) in Tropical Cyclone (TC) development is one of the most difficult
  and still challenging tasks in weather forecasting. In addition to the dynamical numerical simulations,
  commonly used techniques for RI (as well as TC intensity changes) analysis and prediction are the composite
  analysis and statistical models based on features derived from the composite analysis. Quite a large
  number of such selected and pre-determined features related to TC intensity change and RI have been
  accumulated by the domain scientists, such as those in the widely used SHIPS (Statistical Hurricane
  Intensity Prediction Scheme) database. Moreover, new features are still being added with new algorithms
  and/or newly available datasets. However, there are very few unified frameworks for systematically distilling
  features from a comprehensive data source. One such unified Artificial Intelligence (AI) system was
  developed for deriving features from TC centers, and here, we expand that system to large-scale environmental
  condition. In this study, we implemented a deep learning algorithm, the Convolutional Neural Network
  (CNN), to the European Centre for Medium-Range Weather Forecasts (ECMWF) ERA-Interim reanalysis data
  and identified and refined potentially new features relevant to RI such as specific humidity in east
  or northeast, vorticity and horizontal wind in north and south relative to the TC centers, as well as
  ozone at high altitudes that could help the prediction and understanding of the occurrence of RI based
  on the deep learning network (named TCNET in this study). By combining the newly derived features and
  the features from the SHIPS database, the RI prediction performance can be improved by 43%, 23%, and
  30% in terms of Kappa, probability of detection (POD), and false alarm rate (FAR) against the same modern
  classification model but with the SHIPS inputs only.
