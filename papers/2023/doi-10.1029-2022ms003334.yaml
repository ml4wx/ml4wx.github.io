summary: Random forest, XGBoost and ANN with Shapley analysis identify latent heat flux, humidity and
  soil moisture as key drivers of US extreme precipitation, plus return-period emulators.
abstract: Abstract Amplification in extreme precipitation intensity and frequency can cause severe flooding
  and impose significant social and economic consequences. Variations in extreme precipitation intensity,
  frequencies, and return periods can be attributed to many physical variables across spatial and temporal
  scales. Here we employ ensemble machine learning (ML) methods, namely random forest (RF), eXtreme Gradient
  Boosting (XGB), and artificial neural networks (ANN), to explore key contributing variables to monthly
  extreme precipitation intensity and frequency in six regions over the United States. We further establish
  emulators for return periods. Results show that the ML models for intensity perform better in regions
  with obvious seasonality (i.e., Northern Great Plains, Southern Great Plains, and West Coast) than the
  other three regions (Northeast, Southwest, and Rocky Mountains), while for frequency the models perform
  well for most regions. The Shapley additive explanation is used to help explain the relationships between
  extreme precipitation characteristics and identify top variables for RF and XGB. We find that latent
  heat flux, relative humidity, soil moisture, and large‐scale subsidence are key common variables across
  the regions for both monthly intensity and frequency, and their compound effects are non‐negligible.
  The developed ML models capture the probability and return period of extreme precipitation well for
  all regions and may be used for decision making (e.g., infrastructure planning and design).
