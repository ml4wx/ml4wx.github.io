summary: Hybrid ML and physics models attribute projected photosynthetically active radiation changes
  in China and India to climate change versus urban expansion, using CMIP6 models.
abstract: Given the interdependence of climate change (CLC) and urban expansion (URE) on ecosystem productivity
  in China and India, hybrid physics-based models were fitted in this study to evaluate the effects of
  these variables on photosynthetically active radiation (PAR). This was accomplished by interpolating
  the most recent five general circulation models (GCMs) from coupled model intercomparison project phase
  6 (CMIP6) into the CMIP6 multi-ensemble model. The potential of PAR is projected to increase by 0.001
  to 2.077% in China and by 0.002 to 6.737% in India, on a seasonal and annual basis, if the warming is
  kept at 1.5 °C from now until the end of this century. The effects of CLC and URE on the changes in
  PAR in China and India were investigated, and URE had a greater impact than CLC when compared to effective
  contributions, with 49.47% for China and 28.41% for India in the entire case scenario. In contrast,
  CLC and PAR residual factor (PRF) have a greater impact in India than in China, with effects of 13.79%
  and 57.79% compared to 0.89% and 49.64%, respectively. Preferences for exotic, high-productivity plant
  species, irrigation, CO2 fertilization, and nitrogen deposition are suggested as measures for replenishing
  PAR in both countries.
