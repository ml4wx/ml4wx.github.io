summary: Adas is an AI data assimilation model that, combined with FengWu, forms an end-to-end AI forecast
  system with skill comparable to IFS.
abstract: 'The weather forecasting system is important for science and society, and significant achievements
  have been made in applying artificial intelligence (AI) to medium-range weather forecasting. However,
  existing AI-based weather forecasting models rely on analysis or reanalysis products from traditional
  numerical weather prediction (NWP) systems as initial conditions for making predictions. The initial
  states are typically generated by traditional data assimilation components, which are computationally
  expensive and time-consuming. Here, by cyclic training to model the steady-state background error covariance
  and introducing the confidence matrix to characterize the quality of observations, we present an AI-based
  data assimilation model, i.e., Adas, for global weather variables. Further, we combine Adas with the
  advanced AI-based forecasting model (i.e., FengWu) to construct an end-to-end AI-based global weather
  forecasting system: FengWu-Adas. We demonstrate that Adas can assimilate global conventional observations
  to produce high-quality analysis, enabling the system to operate stably for long term. Moreover, the
  system can generate accurate end-to-end weather forecasts with comparable skill to those of the IFS,
  demonstrating the promising potential of data-driven approaches.'
