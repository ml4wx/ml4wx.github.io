summary: Ensembles combining GEP, SVR and GMDH improve hybrid precipitation forecasts at two Iranian stations,
  with MSE reduced by 67% at Rasht.
abstract: Abstract Precipitation forecast is key for water resources management in semi-arid climates.
  The traditional hybrid models simulate linear and nonlinear components of precipitation series separately.
  But they do not still provide accurate forecasts. This research aims to improve hybrid models by using
  an ensemble of linear and nonlinear models. Preprocessing configurations and each of the Gene Expression
  Programming (GEP), Support Vector Regression (SVR), and Group Method of Data Handling (GMDH) models
  were used as in the traditional hybrid models. They were compared against the proposed hybrid models
  with a combination of all these three models. The performance of the hybrid models was improved by different
  methods. Two weather stations of Tabriz and Rasht in Iran with respectively annual and monthly time
  steps were selected to test the improved models. The results showed that Theil’s coefficient, which
  measures the inequality degree to which forecasts differ from observations, improved by 9% and 15% for
  SVR and GMDH relative to GEP for the Tabriz station. The applied error criteria indicated that the proposed
  hybrid models have a better representation of observations than the traditional hybrid models. Mean
  square error decreased by 67% and Nash Sutcliffe increased by 5% in the Rasht station when we combined
  the three machine learning models using genetic algorithm instead of SVR. Generally, the representation
  of the nonlinear models within the improved hybrid models showed better performance than the traditional
  hybrid models. The improved models have implications for modeling highly nonlinear systems using the
  full advantages of machine learning methods.
