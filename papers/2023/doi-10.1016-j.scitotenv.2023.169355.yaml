summary: Gaussian process and AutoML models assess heatwave vulnerability in Quebec, linking mortality
  to socioeconomic variables with SHAP explanations.
abstract: Current efforts to adapt to climate change are not sufficient to reduce projected impacts. Vulnerability
  assessments are essential to allocate resources where they are needed most. However, current assessments
  that use principal component analysis suffer from multiple shortcomings and are hard to translate into
  concrete actions. To address these issues, this article proposes a novel data-driven vulnerability assessment
  within a risk framework. The framework is based on the definitions from the Sixth Assessment Report
  of the Intergovernmental Panel on Climate Change, but some definitions, such as sensitivity and adaptive
  capacity, are clarified. Heat waves that occurred between 2001 and 2018 in Quebec (Canada) are used
  to validate the framework. The studied impact is the daily mortality rates per cooling degree-days (CDD)
  region. A vulnerability map is produced to identify the distributions of summer mortality rates in aggregate
  dissemination areas within each CDD region. Socioeconomic and environmental variables are used to calculate
  impact and vulnerability. We compared abilities of AutoGluon (an AutoML framework), Gaussian process,
  and deep Gaussian process to model the impact and vulnerability. We offer advice on how to avoid common
  pitfalls with artificial intelligence and machine-learning algorithms. Gaussian process is a promising
  approach for supporting the proposed framework. SHAP values provide an explanation for the model results
  and are consistent with current knowledge of vulnerability. Recommendations are made to implement the
  proposed framework quantitatively or qualitatively.
