abstract: Accurate precipitation forecasting is indispensable for informed decision-making across various
  industries. However, the computational demands of current models raise environmental concerns. We address
  the critical need for accurate precipitation forecasting while considering the environmental impact
  of computational resources and propose a minimalist U-Net architecture to be used as a baseline for
  future weather forecasting initiatives.
