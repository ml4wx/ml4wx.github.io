summary: Weighted U-Net corrects ECMWF-IFS precipitation over China, improving heavy-rainfall forecast
  skill over the ordinary U-Net, with gains growing at longer lead times.
abstract: Weather forecasting has been playing an important role in socio-economics. However, operational
  numerical weather prediction (NWP) is insufficiently accurate in terms of precipitation forecasting,
  especially for heavy rainfalls. Previous works on NWP bias correction utilizing deep learning (DL) methods
  mostly focused on a local region, and the China-wide precipitation forecast correction had not been
  attempted. Meanwhile, earlier studies imposed no particular focus on strong rainfalls despite their
  severe catastrophic impacts. In this study, we propose a DL model called weighted U-Net (WU-Net) that
  incorporates sample weights for various precipitation events to improve the forecasts of intensive precipitation
  in China. It is found that WU-Net can further improve the forecasting skill of heaviest rainfall comparing
  with the ordinary U-Net and ECMWF-IFS. Further analysis shows that this improvement increases with growing
  lead time, and distributes mainly in the eastern parts of China. This study suggests that a DL model
  considering the imbalance of the meteorological data could further improve the precipitation forecasting
  generated by numerical weather prediction.
