summary: A random forest tuned on station observations forecasts three-hour visibility with about 78%
  accuracy and a 6% false alarm rate, relevant to aviation.
abstract: Accurate visibility forecasting is essential for safe aircraft operations. This study examines
  how various configurations of the Random Forest model can enhance visibility predictions. Preprocessing
  techniques are employed, including correlation analysis to identify fundamental relationships in weather
  observations. Time-series data is transformed into a regular Data Frame to facilitate analysis. This
  study proposes a classification framework for organizing visibility data and phenomena, which is then
  used to develop a visibility forecast using the Random Forest method. The study also presents procedures
  for hyperparameter tuning, feature selection, data balancing, and accuracy evaluation for this dataset.
  The main outcomes are the Random Forest model parameters for a three-hour visibility forecast, along
  with an analysis of errors in low visibility forecasts. Additionally, models for one-hour forecasts
  and visibility forecasting under precipitation are also examined. The resulting models demonstrate a
  deterministic forecast accuracy of approximately 78%, with a false alarm rate of around 6%, providing
  a comprehensive overview of the capabilities of the Random Forest model for visibility forecasting.
  As anticipated, the model demonstrated limitations in accurately simulating fast radiative cooling or
  abrupt decreases in visibility caused by precipitation. Specifically, in relation to precipitation,
  the model achieved an accuracy of 79%, yet exhibited a false alarm rate of 19%. Additionally, this method
  sets a foundation for enhancing prediction accuracy through the inclusion of supplementary forecast
  data, while its implementation on real-world datasets expands the reach of machine learning techniques
  to the members of the meteorological community.
