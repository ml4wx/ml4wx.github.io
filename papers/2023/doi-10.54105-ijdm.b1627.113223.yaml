summary: Bagging, boosting and stacking ensembles with neural-network learners predict daily rainfall
  from 1988–2022 station data, compared against existing rainfall prediction methods.
abstract: Weather prediction is a very old practice and people are doing predictions about weather much
  before the discovery of the weather measuring instrument. In ancient times, people give weather predictions
  by observing the sky for a long time and patterns of the stars at night. Things are a bit different
  now. People more relay on the past trends and patterns followed by the weather parameters. Data mining
  and machine leaning is used to analysis the historical weather trends by analyzing weather data using
  various Data mining techniques. In this paper three rainfall prediction model based on data mining techniques
  are proposed and compared with the other rainfall prediction model. The comparison has been done on
  the basis of accuracy, precision, Recall and RMSE. The proposed models are based on ensemble methods
  such as bagging, boosting, and stacking. Ensemble methods are used to enhance the overall performance
  and accuracy of the prediction. In both bagging and boosting based proposed rainfall prediction models,
  artificial neural network is used as a base leaner and daily weather data from the year 1988 to 2022
  is used. In stacking based proposed rainfall prediction model, random forest, Logistic regression, and
  K-Nearest neighbor are used as base leaners or level -0 learners and Artificial neural network is used
  as Meta model.
