summary: A neural-network subgrid momentum parameterization trained on high-resolution aquaplanet output
  conserves momentum and gives stable coarse-model runs with reduced wind biases.
abstract: Abstract Attempts to use machine learning to develop atmospheric parameterizations have mainly
  focused on subgrid effects on temperature and moisture, but subgrid momentum transport is also important
  in simulations of the atmospheric circulation. Here, we use neural networks to develop a subgrid momentum
  transport parameterization that learns from coarse‐grained output of a high‐resolution atmospheric simulation
  in an idealized aquaplanet domain. We show that substantial subgrid momentum transport occurs due to
  convection. The neural‐network parameterization has skill in predicting momentum fluxes associated with
  convection, although its skill for subgrid momentum fluxes is lower compared to subgrid energy and moisture
  fluxes. The parameterization conserves momentum, and when implemented in the same atmospheric model
  at coarse resolution it leads to stable simulations and tends to reduce wind biases, although it over‐corrects
  for one configuration tested. Overall, our results show that it is challenging to predict subgrid momentum
  fluxes and that machine‐learning momentum parameterization gives promising results.
