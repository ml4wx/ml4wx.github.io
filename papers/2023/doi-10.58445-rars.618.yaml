summary: Compares logistic regression, MLP and SVM for next-day rain prediction, showing how accuracy
  changes with training data volume.
abstract: Understanding upcoming weather patterns is extremely important for several different reasons
  in a community.For instance, weather patterns can hint at upcoming threats to a community such as hurricanes
  or tornados and give people a proper amount of time to prepare or evacuate the area.Also, weather patterns
  can give members of the agricultural field notice of rainfall the following day, week, or even month.This
  allows them to make better grounded decisions in order to produce better produce for their community.Today,
  numerical weather predictions models serve as the basis for weather predictions for several different
  weather news sources.However, the recent influx of Machine Learning has made few question whether machine
  learning models might be a better fit for weather predictions.Machine Learning consists of several different
  models and algorithms which all perform in different ways.The aim of this research is to compare three
  different machine learning models in both their accuracy and their progressive learning given more training
  data by using the field of meteorology as a testbed.The models were given several points of data and
  expected to return a value predicting whether it would rain the following day with varying amounts of
  training data.The three different models used were a Logistic Regression, Multilayer Perceptron, and
  Support Vector Machine models.After
