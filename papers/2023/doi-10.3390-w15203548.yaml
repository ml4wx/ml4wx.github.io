summary: A hybrid dynamic-factor, random forest and neural network model predicts greenhouse temperature,
  humidity, PAR and CO2 at multiple horizons, beating LSTM and BPNN baselines.
abstract: 'Climate change has led to more frequent extreme weather events such as heatwaves, droughts,
  and storms, which significantly impact agriculture, causing crop damage. Greenhouse cultivation not
  only provides a manageable environment that protects crops from external weather conditions and pests
  but also requires precise microclimate control. However, greenhouse microclimates are complex since
  various heat transfer mechanisms would be difficult to model properly. This study proposes an innovative
  hybrid model (DF-RF-ANN), which seamlessly fuses three components: the dynamic factor (DF) model to
  extract unobserved factors, the random forest (RF) to identify key input factors, and a backpropagation
  neural network (BPNN) to predict greenhouse microclimate, including internal temperature, relative humidity,
  photosynthetically active radiation, and carbon dioxide. The proposed model utilized gridded meteorological
  big data and was applied to a greenhouse in Taichung, Taiwan. Two comparative models were configured
  using the BPNN and the Long short-term memory neural network (LSTM). The results demonstrate that DF-RF-ANN
  effectively captures the trends of the observations and generates predictions much closer to the observations
  compared to LSTM and BPNN. The proposed DF-RF-ANN model hits a milestone in multi-horizon and multi-factor
  microclimate predictions and offers a cost-effective and easily accessible approach. This approach could
  be particularly beneficial for small-scale farmers to make the best use of resources under extreme climatic
  events for contributing to sustainable development goals (SDGs) and the transition towards a green economy.'
