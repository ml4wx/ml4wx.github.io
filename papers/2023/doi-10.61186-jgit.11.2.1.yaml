summary: An LSTM with wind speed and storm direction context predicts North Atlantic tropical cyclone
  tracks at 3 to 12 hours, cutting path error by a reported 1.9 to 4.5 km.
abstract: Tropical Cyclones are natural and complex phenomena that threaten the life and property of human
  society.The accuracy of predicting their trajectories is critical to reducing the economic loss and
  saving human lives.When a storm occurs, context information such as wind speed and intensity, air pressure,
  storm direction, water surface temperature, etc. are effective in changing the direction of the storm
  trajectory.Accordingly, considering this information can improve the forecasting accuracy.Researchers
  have used various methods to predict the direction of the hurricane movements in order to achieve the
  highest accuracy in forecasting.Nowadays, deep learning methods have shown a potential capability in
  processing the complex data efficiently and accurately.In this paper, we used the Long Short-Term Memory
  method to predict the future path and location of the tropical cyclones in the North Atlantic Ocean
  by measuring the similarity of the tropical cyclone trajectories and taking into account the positional
  parameters and context information such as wind speed and storm direction.The obtained results show
  an improvement in the accuracy of the prediction compared to the lack of context information for the
  3, 6, 9, and 12 hour time periods.If the context information is taken into account, the distance between
  the predicted trajectory path and the actual trajectory path has been reduced from 1.9 to 4.5 km.
