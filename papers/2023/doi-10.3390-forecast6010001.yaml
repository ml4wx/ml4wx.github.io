summary: Applies random forest, gradient boosting and decision trees to downscale GCM temperatures over
  Southeast Asia, with random forest reaching r=0.94 against observations.
abstract: 'Southeast Asia (SEA), known for its diverse climate and broad coastal regions, is particularly
  vulnerable to the effects of climate change. The purpose of this study is to enhance the spatial resolution
  of temperature projections over Southeast Asia (SEA) by employing three machine learning methods: Random
  Forest (RF), Gradient Boosting Machine (GBM), and Decision Tree (DT). Preliminary analyses of raw General
  Circulation Model (GCM) data between the years 1990 and 2014 have shown an underestimation of temperatures,
  which is mostly due to the insufficient amount of precision in its spatial resolution. Our findings
  show that the RF method has a significant concordance with high-resolution observational data, as evidenced
  by a low mean squared error (MSE) value of 2.78 and a high Pearson correlation coefficient of 0.94.
  The GBM method, while effective, had a broader range of predictions, indicated by a mean squared error
  (MSE) score of 5.90. The Decision Tree (DT) method performed the best, with the lowest mean squared
  error (MSE) value of 2.43, which closely matched the actual data. The first General Circulation Model
  (GCM) data, on the other hand, exhibited significant forecast errors, as evidenced by a mean squared
  error (MSE) value of 7.84. The promise of machine learning methods, notably the Random Forest (RF) and
  Decision Tree (DT) algorithms, in improving temperature predictions for the Southeast Asian region is
  highlighted in the present study.'
