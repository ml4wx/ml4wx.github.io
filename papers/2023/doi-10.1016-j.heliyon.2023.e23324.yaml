summary: Deep neural network predicts building loss from Typhoon Rusa, outperforming a multi-regression
  baseline on MAE and RMSE for disaster-management use.
abstract: Climate crises such as extreme weather events, natural disasters and climate change caused by
  climate transformations are causing much damage worldwide enough to be called a climate catastrophe.
  The private sector and the government across industries are making every effort to prevent and limit
  the increasing damage, but the results have yet to meet market demand. Therefore, this study proposes
  a method that uses a deep learning algorithm to predict the damage caused by typhoons. Model development
  is based on a Deep Neural Network (DNN) algorithm, and learning data is obtained by fine-tuning the
  network structure and hyperparameters; the amount of damage caused by Typhoon Rusa was known as training
  data. The constructed DNN model underwent evaluation and validation by computation of mean absolute
  error (MAE) and root mean square error (RMSE). Furthermore, a comparative analysis was conducted to
  confirm the applicability of the proposed framework against a traditional multi-regression model to
  ensure the model's accuracy and resilience. Finally, this study offers a novel approach to predicting
  typhoon damage using advanced deep-learning techniques. Subsequently, government disaster management
  officials, facility managers, and insurance companies can utilize this method to accurately predict
  the extent of damage caused by typhoons. Preventive actions such as improved risk assessment, expanded
  insurance companies, and enhanced disaster responses plans can be implemented using these outcomes.
  Ultimately, the proposed model will help to reduce typhoon damage and strengthen general resilience
  to climate crises.
