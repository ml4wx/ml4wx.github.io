summary: Fuses random forest, KNN, extra trees and GBDT into a CMIP6 multimodel ensemble for Hanjiang
  Basin precipitation, reaching correlation 0.88 and Taylor skill 0.764.
abstract: 'Abstract Projecting precipitation changes is essential for researchers to understand climate
  change impacts on hydrological cycle. This study projected future precipitation over the Hanjiang River
  Basin (HRB) based on the multimodel ensemble (ME) of six global climate models from Phase 6 of the Coupled
  Model Intercomparison Project (CMIP6). An ME method using the fusion of four machine learning (ML) algorithms
  (random forest [RF], K‐nearest neighbors [KNN], extra tree [ET], and gradient boosting decision tree
  [GBDT]) was proposed in this study. The future precipitation changes were investigated during 2023–2042
  (Near‐term), 2043–2062 (Mid‐term), and 2081–2100 (Long‐term) periods, with reference to the base period
  1995–2014, under three integrated scenarios (SSP1‐2.6, SSP2‐4.5, and SSP5‐8.5) of the Shared Socioeconomic
  Pathways (SSPs) and the representative concentration pathways (RCPs). The results show that: (1) the
  proposed ME method performs better than the ME mean and individual ML algorithms, with a correlation
  coefficient value reaching 0.88 and Taylor skill score reaching 0.764. (2) The precipitation under SSP5‐8.5
  has the largest upward trend with the annual precipitation variation range of −9.27% to 112.84% from
  2023 to 2100, followed by SSP2‐4.5 with −30.48% to 44.67%, and the smallest under SSP1‐2.6 with −37.19%
  to 37.78%, which show a significant trend of humidification over the HRB in the future. (3) The precipitation
  changes over the HRB are projected to increase over time, with the largest in the Long‐term, followed
  by Mid‐term, and the smallest in the Near‐term. (4) The northeastern parts of the HRB are projected
  to experience a large precipitation in the future, and the southeastern parts are smaller. (5) Uncertainties
  in the projected precipitation over the HRB still exist, which can be reduced by ME. The findings obtained
  in this study have important implications for hydrological policymakers to make adaptive strategies
  to reduce the risks of climate change.'
