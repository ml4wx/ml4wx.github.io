summary: ConvLSTM predicts spatial storm surge water levels for typhoons in China without boundary conditions,
  with random forest estimating peak surge increase.
abstract: Storm surge, which impacts the entire coastline region, is China's most serious marine calamity.
  Storm surge disaster loss (SSDL) estimation is important for decision-making, sustainability, and disaster
  prevention. For early warning systems, disaster management, and disaster evaluation, an accurate storm
  surge water level forecast is essential. Comparing machine learning techniques to numerical simulation
  techniques, the former is more straightforward and efficient. Still, point predictions are the main
  focus of the majority of current machine learning-based research on storm surge prediction. In this
  paper, we explore the feasibility of employing the ConvLSTM model for spatial water level prediction.
  The ConvLSTM-based methodology is simpler, faster, and more accurate in predicting water levels without
  the need for boundary conditions or topography than standard numerical simulation methods. In addition,
  we take worst-case situations into account by employing the random forest model to anticipate the highest
  possible water increase. Based on our findings, the random forest model may prove to be a useful instrument
  in determining the highest water increase value linked to typhoon storm surges, which can help with
  efficient emergency reactions during natural disasters.
