summary: Neural networks forecast Nigerian weather parameters from 19 years of NASA data to assess solar
  PV siting, reaching 96% training correlation.
abstract: The major challenge facing renewable energy systems in Nigeria is the lack of appropriate, affordable,
  and available meteorological stations that can accurately provide present and future trends in weather
  data and solar PV performance. It is crucial to find a solution to this because information on present
  and future solar PV performance is important to renewable energy investors so that they can assess the
  potential of renewable energy systems in various locations across the country. Although Nigerian weather
  provides favorable weather conditions for clean power generation, there is little penetration of renewable
  energy systems in the region, since over 95% of the power is fossil-fuel-generated. This is because
  there has been no detailed report showing the potential of clean power generation systems due to the
  dysfunctional meteorological stations in the country. This paper sought to fill this knowledge gap by
  providing a machine-learning-inspired forecasting of environmental weather parameters that can be used
  by manufacturing companies in evaluating the profitability of siting renewable energy systems in the
  region. Crucial weather parameters such as daily air temperature, relative humidity, atmospheric pressure,
  wind speed, and rainfall were obtained from NASA for a period of 19 years (viz. 2004–2022), resulting
  in the collection of 6664 high-resolution data points. These data were used to build diverse regressive
  neural networks with varying hyperparameters to find the best network arrangement. In summary, a low
  mean-squared error of 7 × 10−3 and high regression correlations of 96% were obtained during the training.
