summary: Hybrid neural and neuro-symbolic approach uses a surrogate ocean model to predict Atlantic Meridional
  Overturning Circulation collapse with high accuracy, adding explainability.
abstract: We propose a hybrid Artificial Intelligence (AI) climate modeling approach that enables climate
  modelers in scientific discovery using a climate-targeted simulation methodology based on a novel combination
  of deep neural networks and mathematical methods for modeling dynamical systems. The simulations are
  grounded by a neuro-symbolic language that both enables question answering of what is learned by the
  AI methods and provides a means of explainability. We describe how this methodology can be applied to
  the discovery of climate tipping points and, in particular, the collapse of the Atlantic Meridional
  Overturning Circulation (AMOC). We show how this methodology is able to predict AMOC collapse with a
  high degree of accuracy using a surrogate climate model for ocean interaction. We also show preliminary
  results of neuro-symbolic method performance when translating between natural language questions and
  symbolically learned representations. Our AI methodology shows promising early results, potentially
  enabling faster climate tipping point related research that would otherwise be computationally infeasible.
