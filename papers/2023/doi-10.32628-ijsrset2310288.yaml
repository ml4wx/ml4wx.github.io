abstract: Through the use of scientific knowledge and weather measurements, weather forecasting is a technique
  for predicting what the atmosphere will be like in a certain location. In other words, it's a method
  by which the characteristics of a meteorological state are determined in advance by factors such as
  temperature, wind, humidity, rainfall, and the quantity of the data set. In an effort to foretell weather
  conditions now and in the future, meteorologists use a process called weather forecasting. For everyday
  operations, accurate weather forecasts are required, and this has been one of the most difficult problems
  to solve globally since the data is multidimensional and nonlinear. According to the survey, supervised
  and unsupervised machine learning algorithms, artificial neural networks, naive bayes algorithms, and
  random forest algorithms are some of the different techniques and algorithms utilised for weather prediction
  in the field of data mining.
