summary: Score-based data assimilation with a memory-efficient score network is tested on a two-layer
  quasi-geostrophic atmosphere-like model, demonstrating scalability to high-dimensional geophysical systems.
abstract: Data assimilation addresses the problem of identifying plausible state trajectories of dynamical
  systems given noisy or incomplete observations. In geosciences, it presents challenges due to the high-dimensionality
  of geophysical dynamical systems, often exceeding millions of dimensions. This work assesses the scalability
  of score-based data assimilation (SDA), a novel data assimilation method, in the context of such systems.
  We propose modifications to the score network architecture aimed at significantly reducing memory consumption
  and execution time. We demonstrate promising results for a two-layer quasi-geostrophic model.
