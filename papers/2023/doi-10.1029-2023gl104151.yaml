summary: Neural network sensitivity analysis of observations separates aerosol primary convective invigoration
  (72% of cloud-top cooling) from meteorological effects in deep convection.
abstract: Abstract Aerosols can invigorate deep convective clouds (DCCs) directly by nucleating more cloud
  droplets, named as Primary Aerosol Convective Invigoration (PAI). However, the covarying Meteorology‐Aerosol
  Invigoration (MAI) effect on DCC has been a long‐standing issue in quantifying PAI's contribution. Here,
  observations show that PAI causes positive feedback from DCC to meteorology, further invigorating DCC
  through enhanced humidity, updraft and destabilization, thereby adding to MAI. Further, PAI is separated
  from MAI observationally by quantifying the sensitivity of DCC properties to aerosol changes under fixed
  meteorology through the artificial neural network. When fine aerosol changes from the cleanest to optimal
  concentration (5 μg m −3 ), PAI contributes 72% ± 2% of the total aerosol‐associated cloud top cooling
  by 12°C, 42% ± 4% of the 30% prolonged lifetime, and 50% ± 4% of the more than doubled rainfall. This
  result underlines the comparable magnitudes of PAI and MAI, which have not been considered until now
  in weather and climate prediction.
