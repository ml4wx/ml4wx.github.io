summary: A CNN (PCINet) identifies day and night precipitation clouds from FY-4A imagery, outperforming
  five segmentation baselines and enabling near-real-time monitoring.
abstract: Rapid and accurate identification of precipitation clouds from satellite observations is essential
  for the research of quantitative precipitation estimation and precipitation nowcasting. In this study,
  we proposed a novel Convolutional Neural Network (CNN)-based algorithm for precipitation cloud identification
  (PCINet) in the daytime, nighttime, and nychthemeron. High spatiotemporal and multi-spectral information
  from the Fengyun-4A (FY-4A) satellite is utilized as the inputs, and a multi-scale structure and skip
  connection constraint strategy are presented in the framework of the algorithm to improve the precipitation
  cloud identification. Moreover, the effectiveness of visible/near-infrared spectral information in improving
  daytime precipitation cloud identification is explored. To evaluate this algorithm, we compare it with
  five other deep learning models used for image segmentation and perform qualitative and quantitative
  analyses of long-time series using data from 2021. In addition, two heavy precipitation events are selected
  to analyze the spatial distribution of precipitation cloud identification. Statistics and visualization
  of the experiment results show that the proposed model outperforms the baseline models in this task,
  and adding visible/near-infrared spectral information in the daytime can effectively improve model performance.
  More importantly, the proposed model can provide accurate and near-real-time results, which has important
  application in observing precipitation clouds.
