summary: VAE-based 3D-Var assimilates simulated temperature observations in a learned latent space, yielding
  flow-dependent background covariances across tropical and extratropical regions.
abstract: Data assimilation of atmospheric observations traditionally relies on variational and Kalman
  filter methods. Here, an alternative neural-network data assimilation (NNDA) with variational autoencoder
  (VAE) is proposed. The three-dimensional variational (3D-Var) data assimilation cost function is utilised
  to determine the analysis that optimally fuses simulated observations and the encoded short-range persistence
  forecast (background), accounting for their errors. The minimisation is performed in the reduced-order
  latent space, discovered by the VAE. The variational problem is auto-differentiable, simplifying the
  computation of the cost function gradient necessary for efficient minimisation. We demonstrate that
  the background-error covariance ($\mathbf{B}$) matrix measured and represented in the latent space is
  quasi-diagonal. The background-error covariances in the grid-point space are flow-dependent, evolving
  seasonally and depending on the current state of the atmosphere. Data assimilation experiments with
  a single temperature observation in the lower troposphere indicate that the $\mathbf{B}$-matrix simultaneously
  describes both tropical and extratropical background-error covariances.
