summary: Random-forest blending of sky-imager, satellite and data-driven forecasts improves 90-minute
  solar irradiance nowcasts by up to 30% for GHI and 40% for DNI.
abstract: Accurate solar radiation nowcasting models are critical for the integration of the increasing
  solar energy in power systems. This work explored the benefits obtained by the blending of four all-sky-imagers
  (ASI)-based models, two satellite-images-based models and a data-driven model. Two blending approaches
  (general and horizon) and two blending models (linear and random forest (RF)) were evaluated. The relative
  contribution of the different forecasting models in the blended-models-derived benefits was also explored.
  The study was conducted in Southern Spain; blending models provide one-minute resolution 90 min-ahead
  GHI and DNI forecasts. The results show that the general approach and the RF blending model present
  higher performance and provide enhanced forecasts. The improvement in rRMSE values obtained by model
  blending was up to 30% for GHI (40% for DNI), depending on the forecasting horizon. The greatest improvement
  was found at lead times between 15 and 30 min, and was negligible beyond 50 min. The results also show
  that blending models using only the data-driven model and the two satellite-images-based models (one
  using high resolution images and the other using low resolution images) perform similarly to blending
  models that used the ASI-based forecasts. Therefore, it was concluded that suitable model blending might
  prevent the use of expensive (and highly demanding, in terms of maintenance) ASI-based systems for point
  nowcasting.
