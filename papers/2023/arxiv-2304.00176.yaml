summary: Modified light-weight Context Guided CNN with weighted loss raises recall for tropical cyclone
  detection in climate simulation data.
abstract: To advance automated detection of extreme weather events, which are increasing in frequency
  and intensity with climate change, we explore modifications to a novel light-weight Context Guided convolutional
  neural network architecture trained for semantic segmentation of tropical cyclones and atmospheric rivers
  in climate data. Our primary focus is on tropical cyclones, the most destructive weather events, for
  which current models show limited performance. We investigate feature engineering, data augmentation,
  learning rate modifications, alternative loss functions, and architectural changes. In contrast to previous
  approaches optimizing for intersection over union, we specifically seek to improve recall to penalize
  under-counting and prioritize identification of tropical cyclones. We report success through the use
  of weighted loss functions to counter class imbalance for these rare events. We conclude with directions
  for future research on extreme weather events detection, a crucial task for prediction, mitigation,
  and equitable adaptation to the impacts of climate change.
