summary: Stacked LSTM with Gaussian-noise augmentation gives the best daily precipitation forecasts at
  56 Jilin stations versus Transformer and SVR baselines.
abstract: 'Abstract This article presents an investigation into the performance of various models in daily
  precipitation prediction using the dataset introduced in this study. The study involves the application
  of multiple models for daily precipitation forecasting across 56 meteorological stations in China''s
  Jilin Province. The models under consideration include Stacked Long Short-Term Memory (LSTM), Transformer,
  and Support Vector Regression (SVR). A year-long continuous daily precipitation forecasting experiment
  was conducted using these diverse models on the same dataset, resulting in 365 consecutive daily precipitation
  forecasts. Subsequently, model evaluations were performed at an annual scale using Root Mean Square
  Error (RMSE). Notably, the study goes beyond modeling by introducing Gaussian noise into the dataset,
  enhancing the overall robustness of the models. The results show the superior performance of the Stacked-LSTM
  model, characterized by exceptional prediction accuracy and stability. Additionally, a comprehensive
  variable attribution analysis using LightGBM sheds light on the key factors influencing daily precipitation
  prediction, including temperature, dew point, precipitation from previous days, and air pressure, aligning
  with established meteorological principles. Moreover, the paper provides an intricate account of data
  preprocessing, model training procedures, and parameter configurations, making it a valuable reference
  for future daily precipitation forecasting initiatives. The findings emphasize the effectiveness of
  incorporating Gaussian noise into the dataset, particularly in improving prediction accuracy for days
  with zero precipitation. In an innovative extension, the study delves into the impact of precipitation
  predictions on water resource allocation, conducting experiments to optimize daily water distribution
  for farmland irrigation. Using the 2022 Beidahu precipitation data, two strategies were explored: Strategy
  A, involving equal water resource distribution, and Strategy B, which allocates resources based on predictive
  values. The results demonstrate that allocating resources based on predictions leads to a more rational
  and effective distribution, contributing to improved water resource management. In conclusion, this
  research not only provides valuable insights into daily precipitation prediction with deep learning
  models but also extends its contributions to the realm of water resource management, underscoring its
  relevance in meteorological forecasting and broader applications.'
