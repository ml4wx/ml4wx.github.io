summary: Releases EUPPBench, a time-aligned forecast-observation dataset with evaluation methods and a
  first benchmark of 2 m temperature postprocessing.
abstract: Statistical postprocessing of medium-range weather forecasts is an important component of modern
  forecasting systems. Since the beginning of modern data science, numerous new postprocessing methods
  have been proposed, complementing an already very diverse field. However, one of the questions that
  frequently arises when considering different methods in the framework of implementing operational postprocessing
  is the relative performance of the methods for a given specific task. It is particularly challenging
  to find or construct a common comprehensive dataset that can be used to perform such comparisons. Here,
  we introduce the first version of EUPPBench (EUMETNET postprocessing benchmark), a dataset of time-aligned
  forecasts and observations, with the aim to facilitate and standardize this process. This dataset is
  publicly available at https://github.com/EUPP-benchmark/climetlab-eumetnet-postprocessing-benchmark
  (31 December 2022) and on Zenodo (https://doi.org/10.5281/zenodo.7429236, Demaeyer, 2022b and https://doi.org/10.5281/zenodo.7708362,
  Bhend et al., 2023). We provide examples showing how to download and use the data, we propose a set
  of evaluation methods, and we perform a first benchmark of several methods for the correction of 2 m
  temperature forecasts.
