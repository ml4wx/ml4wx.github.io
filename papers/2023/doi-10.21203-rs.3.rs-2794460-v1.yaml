abstract: Abstract The activities of most sectors rely upon the climate. The environment is changing at
  an exceptional rate these days, which makes the old forecast strategies less powerful. To foresee the
  climate, a model is proposed, which combines data preparing, sensors, Google Dataset and machine learning
  to provide real-time weather monitoring and accomplish climate figures through prescient models valuable
  for individuals to know the climate conditions constantly.
