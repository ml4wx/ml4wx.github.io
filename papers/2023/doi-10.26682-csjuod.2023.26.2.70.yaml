summary: M5P decision-tree model downscales CMIP6 precipitation and temperature for the Erbil Plain, with
  maximum depth 5 identified as optimal.
abstract: Downscaling the effective parameters of Global Climate Models is crucially required to project
  climate conditions in the future. The capability of machine learning approaches in downscaling Global
  Climate Models is getting interesting these days. The present study evaluates the M5p Decision Tree
  (DT) skill in reproducing high resolution monthly precipitation and temperature (predictands) data.
  To this end, the significant climate-related parameters (predictors) were derived from the General Climate
  Model of the Coupled Model Intercomparison Project Phase 6 (CMIP6) for the Erbil Plain. Initially, the
  effective parameters were carefully chosen for developing a downscaling model. Subsequently, multiple
  models were formulated to accommodate various maximum depths of decision trees (DT). Results obtained
  from the training process revealed a notably higher correlation between precipitation and temperature
  predictors in contrast to wind speed and direction. The evaluation of skill indicated enhanced accuracy
  in downscaling when increasing the maximum depth (MD) of M5p models up to an optimal threshold, with
  MD = 5 identified as the optimal depth for generating predictive DTs. Finally, it was proved that the
  M5p model serves as a highly effective tool for downscaling the hydroclimatic parameters in climate
  change studies.
