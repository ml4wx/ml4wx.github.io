summary: Argues machine learning in climate model parameterization still requires expert judgment, so
  it is no more objective than conventional tuning.
abstract: Parameterization and parameter tuning are central aspects of climate modeling, and there is
  widespread consensus that these procedures involve certain subjective elements. Even if the use of these
  subjective elements is not necessarily epistemically problematic, there is an intuitive appeal for replacing
  them with more objective (automated) methods, such as machine learning. Relying on several case studies,
  we argue that, while machine learning techniques may help to improve climate model parameterization
  in several ways, they still require expert judgment that involves subjective elements not so different
  from the ones arising in standard parameterization and tuning. The use of machine learning in parameterizations
  is an art as well as a science and requires careful supervision.
