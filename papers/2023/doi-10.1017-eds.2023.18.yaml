summary: Super-resolution deconvolution network with orography downscales hourly precipitation from 100
  to 12.5 km over Australia, improving fine-scale extremes over DeepSD.
abstract: 'Abstract Coarse spatial resolution in gridded precipitation datasets, reanalysis, and climate
  model outputs restricts their ability to characterize the localized extreme rain events and limits the
  use of the coarse resolution information for local to regional scale climate management strategies.
  Deep learning models have recently been developed to rapidly downscale the coarse resolution precipitation
  to the high local scale resolution at a much lower cost than dynamic downscaling. However, these existing
  super-resolution deep learning modeling studies have not rigorously evaluated the model’s skill in producing
  fine-scale spatial variability, particularly over topographic features. These current deep-learning
  models also have difficulty predicting the complex spatial structure of extreme events. Here, we develop
  a model based on super-resolution deconvolution neural network (SRDN) to downscale the hourly precipitation
  and evaluate the predictions. We apply three versions of the SRDN model: (a) SRDN (no orography), (b)
  SRDN-O (orography only at final resolution enhancement), and (c) SRDN-SO (orography at each step of
  resolution enhancement). We assess the ability of SRDN-based models to reproduce the fine-scale spatial
  variability and compare it with the previously used deep learning model (DeepSD). All the models are
  trained and tested using the Conformal Cubic Atmospheric Model (CCAM) data to perform a 100 to 12.5
  km of hourly precipitation downscaling over the Australian region. We found that SRDN-based models,
  including orography, deliver better fine-scale spatial structures of both climatology and extremes,
  and significantly improved the deep-learning downscaling. The SRDN-SO model performs well both qualitatively
  and quantitatively in reconstructing the fine-scale spatial variability of climatology and rainfall
  extremes over complex orographic regions.'
