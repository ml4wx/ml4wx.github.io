summary: Wavelet-based bias correction outperforms quantile mapping for climate model precipitation in
  Iran, with wavelet-ANN predictor screening for downscaling.
abstract: Climate model (CM) statistical downscaling requires quality and quantity modifications of the
  CM’s outputs to increase further modeling accuracy. In this respect, multi-resolution wavelet transform
  (WT) was employed to determine the hidden resolutions of climate signals and eliminate bias in a CM.
  The results revealed that the newly developed discrete wavelet transform (DWT)-based bias correction
  method can outperform the quantile mapping (QM) method. In this study, wavelet coherence analysis was
  utilized to assess the high common powers and the multi-scale correlation between the predictors and
  predictand as a function of time and frequency. Thereafter, to rate the most contributing predictors
  based on potential periodicity, the average variance was calculated, which is named the Scaled Average
  (SA) measure. Consequently, WT along with Artificial Neural Network (ANN) were applied for bias correction
  and identifying the dominant predictors for statistical downscaling. The CAN-ESM5 data of Canadian climate
  models and INM-CM5 data of Russian climate models over two climatic areas of Iran with semi-arid (Tabriz)
  and humid (Rasht) weather were applied. The projection of future precipitation revealed that Tabriz
  will experience a 3.4–6.1% decrease in precipitation, while Rasht’s precipitation will decrease by 1.5–2.5%.
  These findings underscore the importance of refining CM data and employing advanced techniques to assess
  the potential impacts of climate change on regional precipitation patterns.
