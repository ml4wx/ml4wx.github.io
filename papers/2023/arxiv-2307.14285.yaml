summary: Compares ARIMA, exponential smoothing, MLP and Gaussian processes for extreme temperature in
  five US cities; MLP performs best and projects temperatures to 2030.
abstract: In this paper, we present a comprehensive analysis of extreme temperature patterns using emerging
  statistical machine learning techniques. Our research focuses on exploring and comparing the effectiveness
  of various statistical models for climate time series forecasting. The models considered include Auto-Regressive
  Integrated Moving Average, Exponential Smoothing, Multilayer Perceptrons, and Gaussian Processes. We
  apply these methods to climate time series data from five most populated U.S. cities, utilizing Python
  and Julia to demonstrate the role of statistical computing in understanding climate change and its impacts.
  Our findings highlight the differences between the statistical methods and identify Multilayer Perceptrons
  as the most effective approach. Additionally, we project extreme temperatures using this best-performing
  method, up to 2030, and examine whether the temperature changes are greater than zero, thereby testing
  a hypothesis.
