summary: Reviews quantum artificial intelligence for climate change, including pattern identification
  and parameterization, but offers no quantitative results and little demonstrated weather-ML content.
abstract: Pattern identification for weather and climate research can benefit from quantum machine learning.
  The issues that will benefit the most from quantum speedup are those that are naturally parallelizable.
  Future predictions indicate that quantum artificial intelligence will be a potent technology. Computer
  vision and sequencing algorithms that can be used on powerful quantum computers are among the advancements
  in the field of quantum artificial intelligence. One component, namely the creation of high performance
  quantum computing hardware, would be the driving force behind all these developments. For huge N, a
  quantum processor's simulation capabilities seem to be simply unmatched by their conventional equivalent,
  which might allow for the resolution of difficult and technologically relevant physics and chemistry
  problems. Assuming that feasible large -scale devices can be constructed and installed in a reasonable
  length of time, the objective of quantum computers is not merely to speed up present calculations. Models
  based on partial differential equations only explicitly resolve physical processes operating at spatial
  scales greater than the grid size; processes operating at smaller scales, such as clouds and deep convection,
  are represented by approximate empirical relationships known as parameterizations. It is still unclear
  i) to what extent quantum computers can offer optimisation advantages over classical algorithms in important
  applications of interest, and ii) when we can expect to realise such advantages in terms of both hardware
  and algorithm development. This is true even though optimisation offers a wide range of potential quantum
  computing applications related to climate change. This review paper analyses the three types of quantum
  processes that can be used to solve climate issues. Some of them are Quantum Simulation, Quantum Optimization
  and Quantum Sensing.
