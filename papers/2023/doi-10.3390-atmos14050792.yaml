summary: NAO-MCD couples causal discovery with a deep learning air-sea model, outperforming numerical
  models for 1–6 month NAO seasonal forecasts, especially in winter.
abstract: The North Atlantic Oscillation (NAO) is a major climatic phenomenon in the Northern Hemisphere,
  but the underlying air–sea interaction and physical mechanisms remain elusive. Despite successful short-term
  forecasts using physics-based numerical models, longer-term forecasts of NAO continue to pose a challenge.
  In this study, we employ advanced data-driven causal discovery techniques to explore the causality between
  multiple ocean–atmosphere processes and NAO. We identify the best NAO predictors based on this causality
  analysis and develop NAO-MCD, a multivariate air–sea coupled model that incorporates causal discovery
  to provide 1–6 month lead seasonal forecasts of NAO. Our results demonstrate that the selected predictors
  are strongly associated with NAO development, enabling accurate forecasts of NAO. NAO-MCD significantly
  outperforms conventional numerical models and provides reliable seasonal forecasts of NAO, particularly
  for winter events. Moreover, our model extends the range of accurate forecasts, surpassing state-of-the-art
  performance at 2- to 6-month lead-time NAO forecasts, substantially outperforming conventional numerical
  models.
