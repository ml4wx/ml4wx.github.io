summary: Kazakhstan avalanche bulletin uses a trained neural network on mountain weather station data,
  reaching 84-90% danger-level classification accuracy.
abstract: Самым распространенным методом доведения снеголавинных прогнозов до населения является снеголавинный
  бюллетень. Они составляются в большинстве крупных центров прогнозирования и изучения снежных лавин.
  В бюллетенях указывается актуальная информация о стабильности снежного покрова, уровне лавинной опасности,
  основных лавинных проблемах и прогнозе погоды. Потребителями информации являются туристы, горнолыжники,
  администрации туристических объектов. На их основе они могут планировать работу горнолыжных баз и другую
  рекреационную деятельность. В Республике Казахстан справка-рекомендация о лавинной опасности в горах
  составляется только для государственных органов, а население лишено информации о лавинах. В течение
  нескольких лет в лаборатории природных опасностей Института географии и водной безопасности Министерства
  науки и высшего образования Республики Казахстан проводится эксперимент по выпуску снеголавинного бюллетеня.
  Для этого собирается текущая снеголавинная и метеорологическая информация на трех горных метеорологических
  станциях – Большое Алматинское озеро, Мынжилки и Чимбулак. Еженедельно проводится оценка уровня лавинной
  опасности по Казахстанскому варианту Европейской пятибалльной шкалы опасности. Классификация уровней
  лавинной опасности проводится с помощью специально обученной нейронной сети. Информация об уровне лавинной
  опасности, состоянии снежного покрова и прогноз погоды указывается в еженедельном снеголавинном бюллетене.
  Бюллетень публикуется в сети интернет и телеграмм-канале перед каждыми выходными. Точность классификации
  лавиноопасной обстановки с помощью искусственного интеллекта составила 84–90%. Итоговая точность прогнозов
  уровня лавинной опасности с учетом прогноза погоды составила 73–82%. В дальнейшем планируется внедрить
  полученный опыт в работу официальной снеголавинной службы Республики Казахстан. The most common method
  of communicating avalanche forecasts to the public is the avalanche bulletin. They are compiled at most
  major avalanche forecasting and research centers. Bulletins provide up-to-date information on snow cover
  stability, avalanche danger level, main avalanche problems and weather forecast. Consumers of information
  are tourists, skiers, administrations of tourist facilities. On their basis, they can plan the work
  of ski resorts and other recreational activities. In the Republic of Kazakhstan, a reference-recommendation
  on avalanche danger in the mountains is compiled only for government apparatus, and the population is
  deprived of information about avalanches. For several years, an experiment has been carried out in the
  laboratory of natural hazards of the Institute of Geography to issue an avalanche bulletin. For this,
  current avalanche and meteorological information is collected at three mountain meteorological stations
  – Lake Ulken Almaty, Mynzhylki and Shymbulak. The level of avalanche danger is assessed weekly according
  to the Kazakhstan version of the European five-point danger scale. Classification of avalanche danger
  levels is carried out using a specially created neural network. Information about the level of avalanche
  danger, the state of the snow cover and the weather forecast is indicated in the weekly avalanche bulletin.
  The accuracy of the classification of avalanche situations using artificial intelligence was 84–90%.
  The final accuracy of forecasts of the level of avalanche danger, taking into account the weather forecast,
  was 73–82%. The bulletin is published on the Internet and telegram channel before every weekend. In
  the future, it is planned to introduce the experience gained into the work of the official avalanche
  service of the Republic of Kazakhstan.
