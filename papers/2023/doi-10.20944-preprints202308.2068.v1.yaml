summary: LSTM uses raindrop size distribution with radar and gauge data to predict Guizhou precipitation
  0–180 min, with 60-min correlations near 0.93.
abstract: Raindrop size distribution (RSD) is an index for reflecting precipitation characteristics. Analyzing
  the differences of RSD plays an important role in understanding the precipitation microphysical processes
  and improving quantitative precipitation prediction of radar. In this paper, the RSD data of Dafang
  (57708) station, Majang (57828) station, and Luodian (57916) station (with an altitude of 1722.7m, 985.0m,
  and 441.5m, respectively) in Guizhou are analyzed according to the precipitation microphysical characteristics.
  First,Particles with particle size less than 1mm contributes the highest value to the density of particle
  number , and decrease with the descending altitude. Second, the GAMMA distribution fit shows a better
  fit compare to M-P distribution fit, and GAMMA distribution fit increases with the ascending altitude.
  Third, the mass-weighted average diameter is not sensitive enough to the change of precipitation intensity
  with correlation coefficients of 54.84%, but there is a obvious relationship between the average volume
  diameter and the precipitation intensity with correlation coefficients of 69.15%. Then, the precipitation
  prediction model is established using LSTM neural network after fusing the representative microphysical
  characteristics of RSD with radar and rain gauge data. The precipitation prediction model is applied
  to the Dafang (57708) site to predict precipitation for time range of 0-180 minutes, and it is found
  that for the prediction of convective cloud and stratiform cloud precipitation, the 60-minute prediction
  results are the most consistent with the actual precipitation, where the correlation coefficients are
  92.87% and 92.57%, respectively. Conclusively, the results demonstrate that combining with the RSD base
  data could improve the reliability of precipitation forecasting.
