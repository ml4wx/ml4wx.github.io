summary: Bias-corrects WRF-Solar irradiance with a decaying average method, then feeds it to a transformer
  for day-ahead solar power forecasts, improving accuracy by 15% across five Taiwan cities.
abstract: Climate change poses a significant threat to humanity. Achieving net-zero emissions is a key
  goal in many countries. Among various energy resources, solar power generation is one of the prominent
  renewable energy sources. Previous studies have demonstrated that post-processing techniques such as
  bias correction can enhance the accuracy of solar power forecasting based on numerical weather prediction
  (NWP) models. To improve the post-processing technique, this study proposes a new day-ahead forecasting
  framework that integrates weather research and forecasting solar (WRF-Solar) irradiances and the total
  solar power generation measurements for five cities in northern, central, and southern Taiwan. The WRF-Solar
  irradiances generated by the Taiwan Central Weather Bureau (CWB) were first subjected to bias correction
  using the decaying average (DA) method. Then, the effectiveness of this correction method was verified,
  which led to an improvement of 22% in the forecasting capability from the WRF-Solar model. Subsequently,
  the WRF-Solar irradiances after bias correction using the DA method were utilized as inputs into the
  transformer model to predict the day-ahead total solar power generation. The experimental results demonstrate
  that the application of bias-corrected WRF-Solar irradiances enhances the accuracy of day-ahead solar
  power forecasts by 15% compared with experiments conducted without bias correction. These findings highlight
  the necessity of correcting numerical weather predictions to improve the accuracy of solar power forecasts.
