summary: LSTM post-processing uses MJO and jet-stream quasi-periodic signals to weight operational S2S
  ensembles for Asian minimum 2 m temperature.
abstract: The quasi-periodic signals in the earth system could be the predictability source for sub-seasonal
  to seasonal (S2S) climate prediction because of the connections among the lead-lag time of those signals.
  The Madden-Julian Oscillation (MJO) is a typical quasi-periodic signal, which is the dominant S2S variability
  in the tropics. Besides, significantly periodic features in terms of both intensity and location are
  identified in 10-40 days for the concurrent variation of the subtropical and polar jet streams over
  Asia in this study. So far, those signals contribute less and are not fully applied to the S2S prediction.
  The deep learning (DL) approach, especially the long-short term memory (LSTM) networks, has the ability
  to take advantage of the information at the previous time to improve the prediction after then. This
  study presents the application of the DL in the postprocessing of S2S prediction using quasi-periodic
  signals predicted by the operational model to improve the prediction of minimum 2-m air temperature
  over Asia. With the help of deep learning, it finds the best weights for the ensemble predictions, and
  the quasi-periodic signals in the atmosphere can further benefit the S2S operational prediction.
