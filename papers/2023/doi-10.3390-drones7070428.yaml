summary: GUMP combines ML sensor predictions with CFD flow fields to give hyper-local urban wind forecasts
  and a risk map for drone operations.
abstract: This paper presents enhancements to, and the demonstration of, the General Urban area Microclimate
  Predictions tool (GUMP), which is designed to provide hyper-local weather predictions by combining machine-learning
  (ML) models and computational fluid dynamic (CFD) simulations. For the further development and demonstration
  of GUMP, the Embry–Riddle Aeronautical University (ERAU) campus was used as a test environment. Local
  weather sensors provided data to train ML models, and CFD models of urban- and suburban-like areas of
  ERAU’s campus were created and iterated through with a wide assortment of inlet wind speed and direction
  combinations. ML weather sensor predictions were combined with best-fit CFD models from a database of
  CFD flow fields, providing flight operational areas with a fully expressed wind flow field. This field
  defined a risk map for uncrewed aircraft operators based on flight plans and individual flight performance
  metrics. The potential applications of GUMP are significant due to the immediate availability of weather
  predictions and its ability to easily extend to arbitrary urban and suburban locations.
