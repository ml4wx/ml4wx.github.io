summary: A multi-kernel CNN predicts wildfire spread across the United States from weather and vegetation
  variables, reaching 98.6% overall accuracy.
abstract: Abstract. In the last twenty years, destructive wildfires have affected the environment to the
  tune of billions of dollars. An accurate model is crucial for predicting the spreading of wildfires
  in a variety of conditions. In this study, a multi-kernel convolution neural network (CNN) deep learning
  model was proposed based on elevation, wind direction, and speed, minimum and maximum temperatures,
  humidity, precipitation, drought index, normalized difference vegetation index (NDVI), and energy release
  component to predict wildfire spread across the United States. Using multi-kernel CNN, it is possible
  to predict whether a pixel will be on fire at a future time. Compared to the model presented by other
  authors, the multi-kernel CNN model achieved high accuracy and F1 score. In comparison with CNNs without
  a multi-kernel mechanism and fixed kernel size, the proposed model predicted more accurate results based
  on the test data set. The multi-kernel CNN model reached an overall accuracy of 98.6 and F1 score of
  70.97 on test data.
