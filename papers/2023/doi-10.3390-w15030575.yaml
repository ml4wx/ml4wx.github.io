summary: An energy-function merging method fuses downscaled GPM IMERG with gauge data to produce 1 km
  monthly precipitation over China, outperforming IMERG in cross-validation.
abstract: Accurate estimation of precipitation is critically important for a variety of fields, such as
  climatology, meteorology, and water resources. However, the availability of precipitation measurements
  has proved to be spatially inadequate for many applications. In this study, to acquire high-quality
  precipitation fields with enhanced accuracy and a fine-scale spatial resolution of 1 km × 1 km, we developed
  a new data fusion method by establishing an energy function model using the downscaled Global Precipitation
  Measurement (GPM) Integrated Multi-satellite Retrievals (IMERG) precipitation product and high-density
  station observation in mainland China. Our merging approach was inspired by the interdisciplinary research
  framework integrating the methods in the fields of image processing, earth science, and machine learning.
  Cross-validation analyses were performed for the monthly precipitation over the period 2009–2018. It
  was found that the results of the newly developed method were more accurate than the original IMERG
  products in terms of root mean squared error (RMSE), mean absolute error (MAE), correlation coefficient
  (CC), and Kling–Gupta efficiency (KGE). The merging precipitation results exhibit consistent spatial
  patterns with the original IMERG products, yet have good agreement with station observations. The gauge
  observations were the major source of the prediction skill of precipitation for the proposed method,
  and the downscaled-IMERG precipitation products added additional spatial details in the final merging
  results. Results indicate that the proposed merging method can reproduce the spatial details of the
  precipitation fields as well as enhance their accuracy. In addition, the time evolution of the error
  index indicates that the improvement in the merged result was stable over time, with KGE improving by
  14% on average. The developed approach provides a promising way of estimating precipitation with high
  spatial resolution and high accuracy, which will benefit hydrological and climatological studies.
