summary: A clustered ANN trained with particle swarm optimisation forecasts wind power from 16 local observation
  points, cutting MAPE up to 59.47% versus persistence.
abstract: 'This study introduces a novel hybrid forecasting model for wind power generation. It integrates
  Artificial Neural Networks, data clustering, and Particle Swarm Optimization algorithms. The methodology
  employs a systematic framework: initial clustering of weather data via the k-means algorithm, followed
  by Pearson’s analysis to pinpoint pivotal elements in each cluster. Subsequently, a Multi-Layer Perceptron
  Artificial Neural Network undergoes training with a Particle Swarm Optimization algorithm, enhancing
  convergence and minimizing prediction discrepancies. An important focus of this study is to streamline
  wind forecasting. By judiciously utilizing only sixteen observation points near a wind farm plant, in
  contrast to the complex global numerical weather prediction systems employed by the European Center
  Medium Weather Forecast, which rely on thousands of data points, this approach not only enhances forecast
  accuracy but also significantly simplifies the modeling process. Validation is performed using data
  from the Italian National Meteorological Centre. Comparative assessments against both a persistence
  model and actual wind farm data from Southern Italy substantiate the superior performance of the proposed
  hybrid model. Specifically, the clustered Particle Swarm Optimization-Artificial Neural Network-Wind
  Forecasting Method demonstrates a noteworthy improvement, with a reduction in mean absolute percentage
  error of up to 59.47% and a decrease in root mean square error of up to 52.27% when compared to the
  persistence model.'
