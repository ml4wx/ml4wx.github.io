summary: Review of neural emulators for downscaling regional climate projections, concluding that selective,
  context-specific use is best supported; it contains no new results.
abstract: Downscaling Regional Climate Projections With Neural Emulators is an area of active development
  in applied machine learning, with evidence that has accumulated unevenly across its component questions.
  We review the current evidence base for downscaling regional climate projections with neural emulators,
  spanning methodological, implementation, governance, and cost dimensions, focusing on where practice
  has converged and where it continues to vary, and set out the practical considerations relevant to a
  team considering its adoption. We conclude that selective, context-specific use is best supported by
  the evidence currently available, rather than uniform adoption or avoidance.
