summary: AdaBoost with MLP base predicts India's March–June Tmax anomalies 10 days ahead, matching CFS
  reforecast skill in April–May but not in March or June.
abstract: In the months of March-June, India experiences high daytime temperatures (Tmax), which sometimes
  lead to heatwave-like conditions over India. In this study, 10 different machine learning models are
  evaluated for their ability to predict the daily Tmax anomalies 10 days ahead in the months of March-June.
  Several model experiments were carried out to identify an optimal model to predict daily Tmax anomalies
  over India. The results indicate that the AdaBoost regressor with Multi-layer Perceptron as the base
  estimator is an optimal model to predict the Tmax anomalies over India in the months of March-June.
  The optimal model predictions are benchmarked against 10-day persistence predictions and the predictions
  from the Climate Forecast System (CFS) reforecast. The results indicate that the machine learning model
  skill is higher than persistence and comparable to CFS reforecast 10-day predictions in April and May.
  In March and June, the machine learning models have low skill scores and perform no better than persistence.
  These results indicate that the machine learning models are promising tools to predict the surface air
  maximum temperature anomalies over India in April and May and can complement predictions from more sophisticated
  numerical models.
