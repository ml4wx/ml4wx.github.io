summary: Downscales GPM satellite precipitation from 0.1° to 1 km using a BP neural network with terrain
  and vegetation predictors, improving accuracy in complex terrain with sparse gauges.
abstract: 'Precipitation products with high spatial and temporal resolutions are crucial in hydrological
  monitoring, meteorological forecasting, and disaster warning. However, obtaining such products in regions
  with complex terrain and limited observation conditions is a challenging task. To address this issue,
  a statistical downscaling model for satellite precipitation products using an optimized Back Propagation
  (BP) neural network was developed. The model employed key environmental variables selected by the Mean
  Impact Value (MIV) index, including enhanced vegetation (EVI), land surface temperature (LST_D, LST_N),
  evapotranspiration (ET), digital elevation model (DEM), slope, and latitude and longitude (Lon, Lat).
  The downscaled precipitation products were corrected twice using a combination of the model error correction
  and observation data merging methods. Finally, the satellite precipitation products with a resolution
  of 0.1° (∼10 km) were downscaled to 1 km. A comprehensive evaluation of the results showed that: (1)
  the accuracy of the precipitation products obtained using this method was better than that of the original
  satellite precipitation products; (2) the method effectively supplemented precipitation data in areas
  with few ground stations, with better results in areas with a dense distribution of ground stations;
  (3) this method demonstrated the efficacy of satellite precipitation products for downscaling in areas
  with complex terrain.'
