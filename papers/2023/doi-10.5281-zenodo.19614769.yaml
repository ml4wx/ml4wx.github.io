summary: Evaluates seven AI approaches for European climate risk, reporting 12–19% AUC gains for extreme-event
  prediction; results are unverified and lack detailed methods.
abstract: 'Climate risk assessment -- quantifying physical climate hazards, economic exposure, and vulnerability
  acrossgeographies and sectors -- has historically relied on deterministic climate models and expert-driven
  scenario analysis.The escalating complexity of compound climate risks, the explosion of Earth-observation
  data, and the urgent need forhigh-resolution, actionable risk estimates have created conditions where
  AI methods can make a decisive contribution.This study evaluates seven AI approaches for climate risk
  assessment across four risk dimensions: extreme eventfrequency prediction (floods, heatwaves, wildfires),
  physical asset damage estimation, agricultural yield impactforecasting, and compound risk interaction
  modelling. Models evaluated include gradient-boosted trees (XGBoost,LightGBM), convolutional neural
  networks applied to satellite imagery, graph neural networks for infrastructure networkrisk propagation,
  physics-informed neural networks (PINNs) for hydrological downscaling, and a large climate foundationmodel
  (ClimaX). Evaluation used ERA5 reanalysis data, Copernicus Sentinel-2 imagery, and asset-level exposuredatabases
  across 14 European countries (2000-2022). AI models outperform statistical baselines on extreme eventfrequency
  prediction by 12.4-18.6% in AUC; PINN-based hydrological downscaling reduces bias in 10km flood-depthestimates
  by 34.2% vs. statistical downscaling. Compound risk modelling using GNNs captures 28.4% more co-occurringextreme
  event pairs than single-hazard approaches. Critical uncertainty quantification gaps and regulatory implicationsfor
  the EU Taxonomy and TCFD disclosure frameworks are discussed.'
