summary: EarthFormer transformer forecasts Palmer Drought Severity Index up to six months ahead, while
  ConvLSTM performs better at longer lead times, using open monthly climate data.
abstract: The problem of high-quality drought forecasting up to a year in advance is critical for agriculture
  planning and insurance. Yet, it is still unsolved with reasonable accuracy due to data complexity and
  aridity stochasticity. We tackle drought data by introducing an end-to-end approach that adopts a spatio-temporal
  neural network model with accessible open monthly climate data as the input. Our systematic research
  employs diverse proposed models and five distinct environmental regions as a testbed to evaluate the
  efficacy of the Palmer Drought Severity Index (PDSI) prediction. Key aggregated findings are the exceptional
  performance of a Transformer model, EarthFormer, in making accurate short-term (up to six months) forecasts.
  At the same time, the Convolutional LSTM excels in longer-term forecasting.
