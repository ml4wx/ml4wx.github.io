summary: Proposes a machine-learning approach to estimate solar radiation from meteorological inputs,
  aimed at renewable energy planning and climate studies.
abstract: Solar irradiation (Rs) is the electromagnetic radiation energy emitted by the Sun. It plays
  a crucial role in sustaining life on Earth by providing light, heat, and energy. Furthermore, it serves
  as a key driver of Earth’s climate and weather systems, influencing the distribution of heat across
  the planet, shaping global air and ocean currents, and determining weather patterns. Variations in Rs
  levels have significant implications for climate change and long-term climate trends. Moreover, Rs represents
  an abundant and renewable energy resource, offering a clean and sustainable alternative to fossil fuels.
  By harnessing solar energy, we can actively reduce greenhouse gas emissions. However, the utilization
  of Rs comes with its own challenges that must be addressed. One problem is its variability, which makes
  it difficult to predict and plan for consistent solar energy generation. Its intermittent nature also
  poses difficulties in meeting continuous energy demand unless appropriate energy storage or backup systems
  are in place. Integrating large-scale solar energy systems into existing power grids can present technical
  challenges. Rs levels are influenced by various factors; understanding these factors is crucial for
  various applications, such as renewable energy planning, climate modeling, and environmental studies.
  Overcoming the associated challenges requires advancements in technology and innovative solutions. Measuring
  and harnessing Rs for various applications can be achieved using various devices; however, the expense
  and scarcity of measuring equipment pose challenges in accurately assessing and monitoring Rs levels.
  In order to address this, alternative methods have been developed with which to estimate Rs, including
  artificial intelligence and machine learning (ML) models, like neural networks, kernel algorithms, tree-based
  models, and ensemble methods. To demonstrate the impact of feature selection methods on Rs predictions,
  we propose a Multivariate Time Series (MVTS) model using Recursive Feature Elimination (RFE) with a
  decision tree (DT), Pearson correlation (Pr), logistic regression (LR), Gradient Boosting Models (GBM),
  and a random forest (RF). Our article introduces a novel framework that integrates various models and
  incorporates overlooked factors. This framework offers a more comprehensive understanding of Recursive
  Feature Elimination and its integrations with different models in multivariate solar radiation forecasting.
  Our research delves into unexplored aspects and challenges existing theories related to solar radiation
  forecasting. Our results show reliable predictions based on essential criteria. The feature ranking
  may vary depending on the model used, with the RF Regressor algorithm selecting features such as maximum
  temperature, minimum temperature, precipitation, wind speed, and relative humidity for specific months.
  The DT algorithm may yield a slightly different set of selected features. Despite the variations, all
  of the models exhibit impressive performance, with the LR model demonstrating outstanding performance
  with low RMSE (0.003) and the highest R2 score (0.002). The other models also show promising results,
  with RMSE scores ranging from 0.006 to 0.007 and a consistent R2 score of 0.999.
