summary: Hybrid SOPDEL model combining decomposition, DBN-ELM and LSTM improves long-time-series climate
  prediction; the abstract gives no quantitative result.
abstract: Long-time-series climate prediction is of great significance for mitigating disasters; promoting
  ecological civilization; identifying climate change patterns and preventing floods, drought and typhoons.
  However, the general public often struggles with the complexity and extensive temporal range of meteorological
  data when attempting to accurately forecast climate extremes. Sequence disorder, weak robustness, low
  characteristics and weak interpretability are four prevalent shortcomings in predicting long-time-series
  data. In order to resolve these deficiencies, our study gives a novel hybrid spatiotemporal model which
  offers comprehensive data preprocessing techniques, focusing on data decomposition, feature extraction
  and dimensionality upgrading. This model provides a feasible solution to the puzzling problem of long-term
  climate prediction. Firstly, we put forward a Period Division Region Segmentation Property Extraction
  (PD-RS-PE) approach, which divides the data into a stationary series (SS) for an Extreme Learning Machine
  (ELM) prediction and an oscillatory series (OS) for a Long Short-term Memory (LSTM) prediction to accommodate
  the changing trend of data sequences. Secondly, a new type of input-output mapping mode in a three-dimensional
  matrix was constructed to enhance the robustness of the prediction. Thirdly, we implemented a multi-layer
  technique to extract features of high-speed input data based on a Deep Belief Network (DBN) and Particle
  Swarm Optimization (PSO) for parameter searching of a neural network, thereby enhancing the overall
  system’s learning ability. Consequently, by integrating all the above innovative technologies, a novel
  hybrid SS-OS-PSO-DBN-ELM-LSTME (SOPDEL) model with comprehensive data preprocessing was established
  to improve the quality of long-time-series forecasting. Five models featuring partial enhancements are
  discussed in this paper and three state-of-the-art classical models were utilized for comparative experiments.
  The results demonstrated that the majority of evaluation indices exhibit a significant optimization
  in the proposed model. Additionally, a relevant evaluation system showed that the quality of “Excellent
  Prediction” and “Good Prediction” exceeds 90%, and no data with “Bad Prediction” appear, so the accuracy
  of the prediction process is obviously insured.
