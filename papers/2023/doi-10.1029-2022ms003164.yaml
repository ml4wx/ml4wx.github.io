summary: Recurrent neural networks learn model bias from analysis increments in an idealized Lorenz-96
  setup, outperforming linear regression and reducing extended-range forecast error growth.
abstract: Abstract Systematic biases in numerical weather prediction models cause forecast deviation from
  reality. While model biases also affect data assimilation and degrade the analysis accuracy, observation
  information incorporated through data assimilation can provide information for detecting and alleviating
  such biases. In this study, the application of machine learning to model bias correction is demonstrated,
  emphasizing the effectiveness of recurrent neural networks. Idealized experiments are performed using
  the two‐scale coupled Lorenz‐96 model as the true system and single Lorenz‐96 model as the imperfect
  forecast model, to compare the effectiveness of bias correction methods based on various architectures
  of neural networks and simple linear regression. The neural networks generally outperformed linear regression,
  and recurrent neural networks showed the best ability in finding the systematic bias component from
  the analysis increment data. Bias correction using the recurrent neural networks also gives the most
  significant improvement in reducing the error growth rate in extended range forecasts. The results suggest
  that including past time series of the forecast variables improve model bias correction when limited
  information of the observation is incorporated through data assimilation.
