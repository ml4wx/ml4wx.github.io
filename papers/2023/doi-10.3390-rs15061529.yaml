summary: A 3D-UNet-LSTM extractor-forecaster for 0-1 h radar echo extrapolation on MeteoNet outperforms
  baselines in quantitative and case-study evaluation.
abstract: Radar echo extrapolation is a commonly used approach for convective nowcasting. The evolution
  of convective systems over a very short term can be foreseen according to the extrapolated reflectivity
  images. Recently, deep neural networks have been widely applied to radar echo extrapolation and have
  achieved better forecasting performance than traditional approaches. However, it is difficult for existing
  methods to combine predictive flexibility with the ability to capture temporal dependencies at the same
  time. To leverage the advantages of the previous networks while avoiding the mentioned limitations,
  a 3D-UNet-LSTM model, which has an extractor-forecaster architecture, is proposed in this paper. The
  extractor adopts 3D-UNet to extract comprehensive spatiotemporal features from the input radar images.
  In the forecaster, a newly designed Seq2Seq network exploits the extracted features and uses different
  convolutional long short-term memory (ConvLSTM) layers to iteratively generate hidden states for different
  future timestamps. Finally, the hidden states are transformed into predicted radar images through a
  convolutional layer. We conduct 0–1 h convective nowcasting experiments on the public MeteoNet dataset.
  Quantitative evaluations demonstrate the effectiveness of the 3D-UNet extractor, the newly designed
  forecaster, and their combination. In addition, case studies qualitatively demonstrate that the proposed
  model has a better spatiotemporal modeling ability for the complex nonlinear processes of convective
  echoes.
