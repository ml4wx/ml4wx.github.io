summary: Dual-polarization radar features with classical machine learning improve hail identification
  through new mechanism-based feature sets designed for hail clouds.
abstract: Hail is a type of severe convective weather disaster characterized by abundant water vapor and
  strong updrafts, resulting in intense and high reflectivity echoes in hail clouds, often accompanied
  by an overhanging form. Although hail research has made great progress, it is still challenging to achieve
  accurate identification of hail. Compared with traditional radar, dual-polarization radar can output
  a variety of polarization parameters and provide information about the shape and phase of precipitation
  particles, which is conducive to the identification of hail particles. In this study, dual-polarization
  radar data are used to explore more hail features from various perspectives, starting with the morphological
  characteristics of hail clouds and using common feature extraction methods in the field of image processing.
  A comprehensive approach to high-dimensional features is developed. Using machine learning methods,
  hail identification models are constructed in both the traditional mechanism feature space and the new
  feature space constructed in this study. Experimental results strongly confirm the significant effectiveness
  of the five-dimensional new mechanism features developed in this paper for hail identification.
