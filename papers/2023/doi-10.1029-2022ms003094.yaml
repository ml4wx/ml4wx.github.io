summary: Particle filter with linear inverse model emulators of CMIP-class GCMs produces ensemble millennial
  temperature reconstructions and skillful one-year-ahead forecasts in a perfect-model test.
abstract: Abstract Proxy records that document the last 2000 years of climate provide evidence for the
  wide range of the natural climate variability from inter‐annual to secular timescales not captured by
  the short window of recent direct observations. Assessing climate models ability to reproduce such natural
  variations is crucial to understand climate sensitivity and impacts of future climate change. Paleoclimate
  data assimilation (PDA) offers a powerful way to extend the short instrumental period by optimally combining
  the physics described by General Circulation Climate Models (GCMs) with information from available proxy
  records while taking into account their uncertainties. Here we present a new PDA approach based on a
  sequential importance resampling (SIR) Particle filter (PF) that uses Linear Inverse Modeling (LIM)
  as an emulator of several CMIP‐class GCMs. We examine in a perfect‐model framework the skill of the
  various LIMs to forecast the dynamics of the surface temperatures and provide spatial field reconstructions
  over the last millennium in a SIR PF. Our results show that the LIMs allow for skillful ensemble forecasts
  at 1‐year lead‐time based on GCMs dynamical knowledge with best prediction in the tropics and the North
  Atlantic. The PDA further provides a set of physically consistent spatial fields allowing robust uncertainty
  quantification related to climate models biases and proxy spatial sampling. Our results indicate that
  the LIM yields dynamical memory improving climate variability reconstructions and support the use of
  the LIM as a GCM‐emulator in real reconstruction to propagate large ensembles of particles at low cost
  in SIR PF.
