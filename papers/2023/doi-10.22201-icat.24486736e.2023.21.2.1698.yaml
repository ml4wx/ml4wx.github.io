summary: Applies artificial neural networks to predict daily weather for several cities, claiming very
  low deviations, though without a quantified benchmark in the abstract.
abstract: Currently, weather forecasting is the most commonly discussed topic by social and economic activists.
  It is also attracting widespread interest due to its application in various public and private sectors
  that include marine, agriculture, air traffic, and forestry. Recent developments have made climatic
  changes happen at a dramatic rate, making old methods of weather forecasting less effective, more hectic,
  and unreliable. Improved and efficient methods of weather prediction are needed to overcome these difficulties.
  This paper describes machine learning approaches using artificial neural networks to predict the weather
  of a particular city and compare the different weather conditions in different cities. We demonstrate
  empirically that Artificial Neural Networks produce very low deviations hence providing nearly accurate
  results for weather forecasts on a daily basis.
