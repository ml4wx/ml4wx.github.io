summary: Deep learning ENSO model with explainable AI predicts eastern Pacific El Niño diversity and strong
  events, forecasting persistence into 2024 after a May 2023 initialisation.
abstract: Global and regional impacts of El Niño-Southern Oscillation (ENSO) are sensitive to the details
  of the pattern of anomalous ocean warming and cooling, such as the contrasts between the eastern and
  central Pacific. However, skillful prediction of such ENSO diversity remains a challenge even a few
  months in advance. Here, we present an experimental forecast with a deep learning model (IGP-UHM AI
  model v1.0) for the E (eastern Pacific) and C (central Pacific) ENSO diversity indices, specialized
  on the onset of strong eastern Pacific El Niño events by including a classification output. We find
  that higher ENSO nonlinearity is associated with better skill, with potential implications for ENSO
  predictability in a warming climate. When initialized in May 2023, our model predicts the persistence
  of El Niño conditions in the eastern Pacific into 2024, but with decreasing strength, similar to 2015-2016
  but much weaker than 1997-1998. In contrast to the more typical El Niño development in 1997 and 2015,
  in addition to the ongoing eastern Pacific warming, an eXplainable Artificial Intelligence analysis
  for 2023 identifies weak warm surface, increased sea level and westerly wind anomalies in the western
  Pacific as precursors, countered by warm surface and southerly wind anomalies in the northern Atlantic.
