summary: Proposes compact U-Nets with Self-ONN layers for satellite active fire detection, reporting superior
  detection with reduced computational complexity.
abstract: As a consequence of global warming and climate change, the risk and extent of wildfires have
  been increasing in many areas worldwide. Warmer temperatures and drier conditions can cause quickly
  spreading fires and make them harder to control; therefore, early detection and accurate locating of
  active fires are crucial in environmental monitoring. Using satellite imagery to monitor and detect
  active fires has been critical for managing forests and public land. Many traditional statistical-based
  methods and more recent deep-learning techniques have been proposed for active fire detection. In this
  study, we propose a novel approach called Operational U-Nets for the improved early detection of active
  fires. The proposed approach utilizes Self-Organized Operational Neural Network (Self-ONN) layers in
  a compact U-Net architecture. The preliminary experimental results demonstrate that Operational U-Nets
  not only achieve superior detection performance but can also significantly reduce computational complexity.
