summary: Hybrid BP-GA network predicts gust wind speeds half an hour ahead at a high-speed railway bridge
  site during typhoon, supporting hierarchical construction warnings.
abstract: Measuring the impact of extreme winds is important in high-speed railway bridge construction
  to avoid the risk of engineering accidents. This study presents an early-warning framework for high-speed
  railway (HSR) bridge construction under extreme wind conditions, using a long-span continuous beam bridge
  constructed in a typhoon-prone area as a case study. Specifically, on-site wind environment measurements
  during a typhoon are utilized, and parameters such as fluctuating wind turbulence intensity, gust factor,
  turbulence integral scale, and power spectral density are employed to characterize the wind environment.
  Multi-step prediction of gust wind speed during the bridge construction is performed using the hybrid
  Back Propagation-Genetic Algorithm (BP-GA). Hierarchical warnings and control actions are proposed and
  implemented based on the prediction results. The analysis results of wind parameters revealed a discrepancy
  between the measured and specified typhoon turbulence intensities, with the windward turbulence intensity
  being lower than specified. The longitudinal average gust factor exceeded the transverse value. The
  prediction curve based on the BP-GA algorithm closely resembles the actual curve, meeting accuracy requirements.
  Notably, the one-step prediction provided the most accurate results. Based on the predicted wind speed
  trend for the upcoming half-hour, appropriate hierarchical warnings and control measures were conducted.
