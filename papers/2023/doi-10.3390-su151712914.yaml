summary: Review of machine learning methods for wind flow and wind-power forecasting, covering ensembles,
  SVR and neural networks, with future directions.
abstract: The wind is a crucial factor in various domains such as weather forecasting, the wind power
  industry, agriculture, structural health monitoring, and so on. The variability and unpredictable nature
  of the wind is a challenge faced by most wind-energy-based sectors. Several atmospheric and geographical
  factors influence wind characteristics. Many wind forecasting methods and tools have been introduced
  since early times. Wind forecasting can be carried out short-, medium-, and long-term. The uncertainty
  factors of the wind challenge the accuracy of techniques. This article brings the general background
  of physical, statistical, and intelligent approaches and their methods used to predict wind characteristics
  and their challenges—this work’s objective is to improve effective data-driven models for forecasting
  wind-power production. The investigation and listing of the effectiveness of improved machine learning
  models to estimate univariate wind-energy time-based data is crucially the prominent focus of this work.
  The performance of various ML predicting models was examined using ensemble learning (ES) models, such
  as boosted trees and bagged trees, Support Vector Regression (SVR) with distinctive kernels etc. Numerous
  neural networks have recently been constructed for forecasting wind speed and power due to artificial
  intelligence (AI) advancement. Based on the model summary, further directions for research and application
  developments can be planned.
