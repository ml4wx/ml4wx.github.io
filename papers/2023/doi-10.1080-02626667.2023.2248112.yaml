summary: Fusion of machine learning models on bias-corrected satellite precipitation forecasts 12 months
  ahead at 126 California stations reaches Nash-Sutcliffe efficiency of 0.937 at the final step.
abstract: This study presented a novel paradigm for forecasting 12-step-ahead monthly precipitation at
  126 California gauge stations. First, the satellite-based precipitation time series from Climate Hazards
  Group InfraRed Precipitation with Station data (CHIRPS), TerraClimate, ECMWF Reanalysis V5 (ERA5), and
  Precipitation Estimation from Remotely Sensed Information using Artificial Neural Networks-Climate Data
  Record (PERSIANN-CDR) products were bias-corrected using historical precipitation data. Four methods
  were tested, and quantile mapping (QM) was the best. After pre-processing data, 19 machine-learning
  models were developed. random forest, Extreme Gradient Boosting (XGBoost), extreme gradient boosting,
  support vector machine, multi-layer perceptron, and K-nearest-neighbours were chosen as the best models
  based on Complex Proportional Assessment (COPRAS) measurement. After hyperparameter adjustment, the
  Bayesian back-propagation regularization algorithm fused the results. The superior models’ predictions
  were considered inputs, and the target’s initial step was labeled. The next 11 steps at each station
  followed this approach, and the fusion models accurately predicted all steps. The 12th step’s average
  Nash-Sutcliffe efficiency (NSE), mean square error (MSE), coefficient of determination (R2), correlation
  coefficient (R) were 0.937, 52.136, 0.880, and 0.869, respectively, demonstrating the framework’s effectiveness
  at high forecasting horizons to help policymakers manage water resources.
