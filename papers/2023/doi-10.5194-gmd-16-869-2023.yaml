summary: Interpretable attention-based fire model for African and South American burned area reveals lagged
  climate-wetness controls and projects South American burned-area recovery under high emissions.
abstract: Abstract. African and South American (ASA) wildfires account for more than 70 % of global burned
  areas and have strong connection to local climate for sub-seasonal to seasonal wildfire dynamics. However,
  representation of the wildfire-climate relationship remains challenging, due to spatiotemporally heterogenous
  responses of wildfires to climate variability and human influences. Here, we developed an interpretable
  Machine Learning (ML) fire model (AttentionFire_v1.0) to resolve the complex spatial- heterogenous and
  time-lagged controls from climate on burned area and to better predict burned areas over ASA regions.
  Our ML fire model substantially improved predictability of burned area for both spatial and temporal
  dynamics compared with five commonly used machine learning models. More importantly, the model revealed
  strong time-lagged control from climate wetness on the burned areas. The model also predicted that under
  a high emission future climate scenario, the recently observed declines in burned area will reverse
  in South America in the near future due to climate changes. Our study provides reliable and interpretable
  fire model and highlights the importance of lagged wildfire-climate relationships in historical and
  future predictions.
