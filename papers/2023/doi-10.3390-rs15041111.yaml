summary: RRED-Net, an attention U-Net for radar QPE, raises threat score for ≥20 mm/h precipitation from
  17.6% to 39.6%.
abstract: Quantitative precipitation estimation (QPE) plays an important role in meteorology and hydrology.
  Currently, multichannel Doppler radar image is used for QPE based on some traditional methods like the
  Z − R relationship, which struggles to capture the complicated non-linear spatial relationship. Encouraged
  by the great success of using Deep Learning (DL) segmentation networks in medical science and remoting
  sensing, a UNet-based network named Reweighted Regression Encoder–Decoder Net (RRED-Net) is proposed
  for QPE in this paper, which can learn more complex non-linear information from the training data. Firstly,
  wavelet transform (WT) is introduced to alleviate the noise in radar images. Secondly, a wider receptive
  field is obtained by taking advantage of attention mechanisms. Moreover, a new Regression Focal Loss
  is proposed to handle the imbalance problem caused by the extreme long-tailed distribution in precipitation.
  Finally, an efficient feature selection strategy is designed to avoid exhaustion experiments. Extensive
  experiments on 465 real processes data demonstrate that the superiority of our proposed RRED-Net not
  only in the threat score (TS) in the severe precipitation (from 17.6% to 39.6%, ≥20 mm/h) but also the
  root mean square error (RMSE) comparing to the traditional Z-R relationship-based method (from 2.93
  mm/h to 2.58 mm/h, ≥20 mm/h), baseline models and other DL segmentation models.
