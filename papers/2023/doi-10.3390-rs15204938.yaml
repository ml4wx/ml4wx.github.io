summary: TC-TrajGRU fuses track time series with meteorological fields for 12-hour tropical cyclone track
  forecasts that are comparable to official forecasts.
abstract: The prediction of a tropical cyclone’s trajectory is crucial for ensuring marine safety and
  promoting economic growth. Previous approaches to this task have been broadly categorized as either
  numerical or statistical methods, with the former being computationally expensive. Among the latter,
  multilayer perceptron (MLP)-based methods have been found to be simple but lacking in time series capabilities,
  while recurrent neural network (RNN)-based methods excel at processing time series data but do not integrate
  external information. Recent works have attempted to enhance prediction performance by simultaneously
  utilizing both time series and meteorological field data through feature fusion. However, these approaches
  have relatively simplistic methods for data fusion and do not fully explore the correlations between
  different modalities. To address these limitations, we propose a systematic solution called TC-TrajGRU
  for predicting tropical cyclone tracks. Our approach improves upon existing methods in two main ways.
  Firstly, we introduce a Spatial Alignment Feature Fusion (SAFF) module to address feature misalignment
  issues in different dimensions. Secondly, our Track-to-Velocity (T2V) module leverages time series differences
  to integrate external information. Our experiments demonstrate that our approach yields highly accurate
  predictions comparable to the official optimal forecast for a 12 h period.
