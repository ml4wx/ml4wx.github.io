summary: A multi-scale loss added to AIFS-CRPS better constrains small-scale variability in ECMWF's probabilistic
  ML forecasts without hurting forecast skill.
abstract: We assess the impact of a multi-scale loss formulation for training probabilistic machine-learned
  weather forecasting models. The multi-scale loss is tested in AIFS-CRPS, a machine-learned weather forecasting
  model developed at the European Centre for Medium-Range Weather Forecasts (ECMWF). AIFS-CRPS is trained
  by directly optimising the almost fair continuous ranked probability score (afCRPS). The multi-scale
  loss better constrains small scale variability without negatively impacting forecast skill. This opens
  up promising directions for future work in scale-aware model training.
