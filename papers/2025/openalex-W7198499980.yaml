summary: Evaluates seven shortwave radiation datasets against twelve Chinese stations and develops a deep
  learning radiation forecast for PV applications.
abstract: 'The large-scale development of China''s photovoltaic (PV) industry is crucial for achieving
  the nation''s dual-carbon goals. However, significant technical bottlenecks remain, particularly concerning
  the accuracy of radiation observations and forecast data. Limited and unevenly distributed radiation
  observation stations in China fail to provide sufficient high-resolution spatiotemporal radiation data,
  which hinders numerical model assimilation, power plant efficiency assessments, and other practical
  applications. Additionally, current short- to medium-term radiation prediction methods exhibit limitations
  in physical mechanism modeling and data assimilation, resulting in insufficient accuracy to meet the
  high-resolution radiation prediction requirements of renewable energy system scenarios such as market
  scheduling and virtual power plant coordination. These technical barriers significantly constrain solar
  PV power predictability and grid integration capabilities. In response to the above problems, this paper
  systematically evaluates the accuracy of the current mainstream shortwave radiation data products, and
  further uses deep learning models to establish a shortwave radiation prediction model. This study addresses
  the following main research areas: (1) Ground-based observational data from twelve meteorological stations
  across China were used to systematically evaluate several widely utilized downward surface shortwave
  radiation (SSRD) datasets, including CERES, CLARA, CMFD, ERA5, GEWEX-SRB, GLASS, and ISCCP. The results
  revealed notable differences in spatial and temporal variations of SSRD among various datasets. Surface
  shortwave radiation from CERES, CLARA, and CMFD demonstrated higher accuracy, with higher correlation
  coefficients (typically above 0.95) and lower root mean square errors (less than 40W/m2 ), indicating
  the capability in capturing temporal trends and radiation intensity under varying climatic conditions.
  (2) Taking nine major cities in China as an example, using Japan''s Sunflower-8 solar shortwave radiation
  data combined with site observation data, a multifactor input prediction model with bidirectional long
  short-term memory (Attention-Bi-LSTM) with an attention mechanism was established to capture the temporal
  dependency of radiation variations. The model uses seven meteorological parameters such as ground shortwave
  radiation, temperature, and weather conditions as input variables, and makes hourly forecasts of ground
  shortwave radiation parameters for the next 24 hours, effectively capturing the time dependence of radiation
  data. The results show that the attention-Bi-LSTM model performs better than the traditional LSTM method
  does, overcoming the inability of the traditional LSTM method to accurately predict radiation fluctuations
  in cloudy weather and low radiation in overcast weather. It shows robustness and generalizability in
  various weather scenarios, especially under complex or transitional weather conditions. For attention-Bi-LSTM
  model, the maximum error is approximately 90–100 W/m²at noon, and the error values in the morning and
  afternoon are lower, indicating a more stable and accurate predicting performance than those of other
  classic models.'
