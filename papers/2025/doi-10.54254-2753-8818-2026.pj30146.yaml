summary: Review of how deep learning and hybrid AI approaches are improving ENSO prediction, including
  overcoming the spring predictability barrier and interpretable AI directions.
abstract: 'The El Niño-Southern Oscillation (ENSO) is basically an air-sea interaction phenomenon of the
  tropical Pacific capable of initiating global extreme weather events by modifying atmospheric circulation
  and ocean temperature distribution, with profound impacts on society and economy. While the basic mechanisms
  of ENSO are fairly well-appreciated, accurate prediction remains a big challenge in climate science.
  Traditional dynamical and statistical models are limited in long-term predictions and addressing issues
  such as the "spring predictability barrier." This article highlights how artificial intelligence (AI)
  is revolutionizing ENSO prediction research through three key areas: direct application of deep learning
  models, development of hybrid forecasting strategies, and overcoming key scientific challenges. Building
  on this foundation, this article proposes that future research trends will further deepen the integration
  of AI and physical dynamics, leveraging interpretable AI to improve forecast accuracy while simultaneously
  uncovering new dynamical mechanisms underlying ENSO, thereby advancing climate science to new levels
  of sophistication.'
