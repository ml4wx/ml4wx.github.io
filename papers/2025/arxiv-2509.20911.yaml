summary: MIGN, a mesh-interpolation graph network with spherical-harmonic embeddings, forecasts weather
  at irregular global stations and generalizes to unseen locations.
abstract: 'Graph neural networks have shown promising results in weather forecasting, which is critical
  for human activity such as agriculture planning and extreme weather preparation. However, most studies
  focus on finite and local areas for training, overlooking the influence of broader areas and limiting
  their ability to generalize effectively. Thus, in this work, we study global weather forecasting that
  is irregularly distributed and dynamically varying in practice, requiring the model to generalize to
  unobserved locations. To address such challenges, we propose a general Mesh Interpolation Graph Network
  (MIGN) that models the irregular weather station forecasting, consisting of two key designs: (1) learning
  spatially irregular data with regular mesh interpolation network to align the data; (2) leveraging parametric
  spherical harmonics location embedding to further enhance spatial generalization ability. Extensive
  experiments on an up-to-date observation dataset show that MIGN significantly outperforms existing data-driven
  models. Besides, we show that MIGN has spatial generalization ability, and is capable of generalizing
  to previous unseen stations.'
