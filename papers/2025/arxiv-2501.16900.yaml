summary: Grid-search-tuned ensemble of classical and neural models, including KAN, with engineered meteorological
  features for rainfall prediction from observations.
abstract: Rainfall prediction remains a persistent challenge due to the highly nonlinear and complex nature
  of meteorological data. Existing approaches lack systematic utilization of grid search for optimal hyperparameter
  tuning, relying instead on heuristic or manual selection, frequently resulting in sub-optimal results.
  Additionally, these methods rarely incorporate newly constructed meteorological features such as differences
  between temperature and humidity to capture critical weather dynamics. Furthermore, there is a lack
  of systematic evaluation of ensemble learning techniques and limited exploration of diverse advanced
  models introduced in the past one or two years. To address these limitations, we propose a robust ensemble
  learning grid search-tuned framework (RAINER) for rainfall prediction. RAINER incorporates a comprehensive
  feature engineering pipeline, including outlier removal, imputation of missing values, feature reconstruction,
  and dimensionality reduction via Principal Component Analysis (PCA). The framework integrates novel
  meteorological features to capture dynamic weather patterns and systematically evaluates non-learning
  mathematical-based methods and a variety of machine learning models, from weak classifiers to advanced
  neural networks such as Kolmogorov-Arnold Networks (KAN). By leveraging grid search for hyperparameter
  tuning and ensemble voting techniques, RAINER achieves promising results within real-world datasets.
