summary: Deep neural network links CMIP6 SSP5-8.5 temperature and precipitation projections to Pakistan
  rice yields, projecting higher vulnerability from warming and rainfall variability.
abstract: Ensuring food security in Pakistan, particularly for rice production, is a critical challenge
  due to increasing population demands and the growing impact of climate change variability. Accurate
  estimation of rice crop yields is essential for optimizing resource allocation, managing supply chains,
  and forecasting economic growth while minimizing agricultural losses. This study utilizes a Deep Neural
  Network (DNN) to predict rice yields in Pakistan by analyzing the effects of maximum temperature and
  precipitation trends under high-emission scenarios (SSP5-8.5) derived from CMIP6 climate models. Historical
  (1980–2014) and future (2015–2100) climate projections were evaluated using key variables, including
  precipitation, meteorological conditions, cultivated area, and crop yields. Results from CMIP6 SSP5-8.5
  indicate a significant rise in maximum temperatures and increased precipitation variability, exacerbating
  risks to rice crop yields. DNN demonstrated superior accuracy in forecasting these trends, achieving
  high R-squared values and low error metrics, including Mean Absolute Error (MAE) and Root Mean Squared
  Error (RMSE). The findings reveal that Pakistan, particularly Eastern South Asia, is highly vulnerable
  to climate extremes, with severe implications for rice production and agricultural sustainability. These
  results highlight the urgent need for policymakers to adopt climate adaptation strategies, including
  advanced predictive modeling and resilient agricultural practices, to safeguard rice production and
  ensure long-term food security in Pakistan’s monsoon-dependent regions. This study aligns with Sustainable
  Development Goal 2 (Zero Hunger) by contributing to food security and sustainable agricultural development,
  and with Sustainable Development Goal 13 (Climate Action) by addressing climate change impacts on agriculture
  and promoting resilience in rice production systems.
