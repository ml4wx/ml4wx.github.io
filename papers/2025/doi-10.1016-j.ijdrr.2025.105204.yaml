summary: CatBoost county-level tropical cyclone loss model using multi-hazard features reaches 0.82 accuracy
  and a 19% gain over single-hazard inputs.
abstract: Reliable loss assessment of tropical cyclones (TCs) is essential to effective disaster emergency
  response. Currently, most existing methods do not consider the joint effects of multiple hazards of
  TCs, which may decrease loss estimation accuracy. To address this issue, a novel assessment framework
  is proposed that incorporates the effects of wind, rainfall, storm surge, wave, and flood, brought by
  TC, to improve disaster loss modeling. First, the multi-hazard features of TC are selected, including
  maximum gust wind (3s), total rainfall, daily rainfall, hourly rainfall, surge heights, significant
  wave heights , and daily runoff. The model was then trained on 1341 county-level records, optimizing
  four machine learning algorithms, i.e., Categorical Boosting (CatBoost), Transformer, Backpropagation
  Neural Network (BPNN), and Support Vector Machine (SVM). Next, the impact of feature variables and training
  samples was analyzed based on the best-performing model. Finally, Shapley additive explanations (SHAP)
  were employed to interpret the model. The results demonstrated that CatBoost outperformed the other
  machine learning algorithms, achieving an accuracy of 0.8196. Notably, the model incorporating all feature
  variables achieves a maximum performance improvement of 19.06 % compared to scenarios involving single,
  double, or triple hazards. Furthermore, the county-level model at the national scale demonstrates good
  applicability in coastal and inland scales, maintaining an accuracy exceeding 0.79. The inclusion of
  SHAP provides interpretable insights into factor weights and the interrelationship between multiple
  hazards. This approach not only improves the reliability of loss assessments but also reduces the ‘black
  box’ limitations of machine learning, offering vital insights for better disaster response.
