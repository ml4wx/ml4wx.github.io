summary: A deep learning framework is proposed to embed complex hazard models in operational multi-hazard
  early-warning systems across European sites covering heatwaves, wildfires and floods.
abstract: The C2IMPRESS project (Co-creative improved understanding and awareness of multi-hazard risks
  for disaster-resilient society, www.c2impress.com) is funded by the European Union through the Horizon
  Europe Programme. It aims to develop an innovative set of products that contribute to a more resilient
  society in the face of risks due to extreme weather events under different climate change scenarios.
  There are four case study areas, Egaleo (Greece), Mallorca (Balearic Islands, Spain), Ordu (Turkey)
  and Centro Region (Portugal). In each of those study areas, different hazards will be studied, e.g.,
  heat waves, wildfires, river floods, wave overtopping, and coastal floods.
