summary: IoT system with blockchain-secured data transmission forecasts short-term weather with LSTM,
  which beats MLP by 0.41% in MAPE.
abstract: The purpose of this paper is to develop an Internet of Things-based weather forecasting system
  with blockchain-enabled transmission, employing deep learning algorithms to perform short-term predictions.
  The system uses a SparkFun® Meter Kit connected to an Arduino Uno, with data transmitted to a Raspberry
  Pi, which relayed the data to a Java server via Wi-Fi. The blockchain transmission involves asymmetric
  encryption using pre-shared keys. Deep learning models such as Multilayer Perceptron (MLP) and Long
  Short-Term Memory (LSTM) were employed for weather forecasting, and predictions were made using data
  from a local MySQL database. Results obtained showed that the LSTM algorithm outperformed MLP, with
  a difference of 0.41% and 0.79% in their mean absolute percentage error values for the experiments conducted.
  The blockchain analysis revealed that larger reading sets increased the block size, while decreasing
  the total number of generated blocks due to longer processing times. Time complexity, latency and throughput
  increased with more readings being taken per block. The main novelty of the paper is the development
  of a real-time weather forecasting system with secure, tamper-proof data transmission that provides
  a framework for the performance analysis of both weather prediction accuracy and metrics to assess the
  blockchain performance of the application.
