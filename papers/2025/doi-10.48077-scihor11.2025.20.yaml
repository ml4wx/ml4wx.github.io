summary: Random forest and regression identify climatic predictors of Ukrainian winter wheat and maize
  yields, with Random Forest explaining up to 81% of maize variability.
abstract: The purpose of the study was to identify the key climatic predictors that shaped the variability
  of winter wheat and maize yields under the agroclimatic conditions of the Polissia and Forest-Steppe
  regions. The methodology was based on the use of long-term meteorological data combined with statistical
  and machine-learning modelling algorithms, among which multiple linear regression and the Random Forest
  method were applied for a comparative assessment of predictive performance. A variable importance mechanism
  was also implemented in order to determine the most informative climatic indicators. The study analysed
  the influence of temperature extremes, total atmospheric precipitation patterns, and hydrothermal indices
  during the key phenological stages of crop development. It was established that April-June conditions
  played a dominant role for winter wheat, whereas July-August thermal and moisture-related parameters
  were most influential for maize. It was identified that integral indicators, particularly the hydrothermal
  coefficient, provided considerably higher predictive power compared to individual temperature- or precipitation-based
  metrics. The presence of threshold crop responses to extreme climatic factors was confirmed, which resulted
  in regional differences in sensitivity to heatwaves and droughts. The analysis demonstrated that the
  Random Forest algorithm delivered the highest predictive accuracy, explaining up to 81% of maize yield
  variability in the ForestSteppe region and up to 74% for winter wheat. The practical value of the study
  lay in the potential use of the obtained results by analytical institutions, agrometeorological services,
  and agricultural producers for planning sowing areas, assessing seasonal yield risks, and shaping adaptation
  strategies under climate-change conditions
