summary: XGBoost model using GRAPES_MESO NWP inputs estimates GNSS weighted mean temperature, improving
  RMSE by 29.7% over NWP and 57.6% over GPT3 against radiosondes.
abstract: An accurate calculation of weighted mean temperature (Tm) is highly critical for global navigation
  satellite system (GNSS) based precipitable water vapour retrieval. The widely used empirical models
  have drawbacks in capturing the fast-changing peaks in Tm, and their achievements are limited. To overcome
  this drawback, we utilise the advantage of machine learning and numerical weather prediction (NWP) forecasts,
  which is able to regularly update the modelling data to reflect the latest weather situation, to estimate
  Tm more precisely. We propose a Tm model using the NWP products of the mesoscale version of the Global/Regional
  Assimilation and PrEdiction System (GRAPES_MESO) as the input and the eXtreme Gradient Boosting (XGBoost)
  as the frame, namely CGTm. The CGTm model is then assessed with radiosonde (RS) observations and compared
  with the GPT3 model (the exemplary model worldwide) and GRAPES_MESO model. The CGTm exhibits a mean
  bias close to 0, and an RMSE improvement of 29.71% and 57.64% compared to GRAPES_MESO and GPT3, respectively.
  The CGTm Tm agrees well with RS Tm especially for the fast-changing peaks, which is the key source of
  the higher accuracy. In summary, the CGTm model manifests high accuracy and behaves in a much more stable
  manner in Tm estimating.
