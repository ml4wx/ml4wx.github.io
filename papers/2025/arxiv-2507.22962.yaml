summary: Combines BiLSTM-style sequential models with TimeSHAP explanations to forecast six agricultural
  weather hazards across four US regions, showing when climatic features matter.
abstract: Climate extremes present escalating risks to agriculture intensifying the need for reliable
  multi-hazard early warning systems (EWS). The situation is evolving due to climate change and hence
  such systems should have the intelligent to continue to learn from recent climate behaviours. However,
  traditional single-hazard forecasting methods fall short in capturing complex interactions among concurrent
  climatic events. To address this deficiency, in this paper, we combine sequential deep learning models
  and advanced Explainable Artificial Intelligence (XAI) techniques to introduce a multi-hazard forecasting
  framework for agriculture. In our experiments, we utilize meteorological data from four prominent agricultural
  regions in the United States (between 2010 and 2023) to validate the predictive accuracy of our framework
  on multiple severe event types, which are extreme cold, floods, frost, hail, heatwaves, and heavy rainfall,
  with tailored models for each area. The framework uniquely integrates attention mechanisms with TimeSHAP
  (a recurrent XAI explainer for time series) to provide comprehensive temporal explanations revealing
  not only which climatic features are influential but precisely when their impacts occur. Our results
  demonstrate strong predictive accuracy, particularly with the BiLSTM architecture, and highlight the
  system's capacity to inform nuanced, proactive risk management strategies. This research significantly
  advances the explainability and applicability of multi-hazard EWS, fostering interdisciplinary trust
  and effective decision-making process for climate risk management in the agricultural industry.
