summary: Support vector regression on NWS forecasts and station irradiance predicts solar generation;
  it is 36% more accurate than forecast-only baselines.
abstract: The increasing percentage of grid power contributed by renewable sources is one of the main
  objectives of smart grid development. The intermittent and unpredictable nature of renewable energy
  sources' power supply makes grid integration difficult. Since dispatching generators of the grid to
  meet demand varies across the grid, forecasting future renewable generation is crucial. While manually
  creating complex prediction models for massive solar farms may be viable, doing so for the grid, for
  millions of households with distributed generation, is a difficult task. To address the issue of National
  Weather Service (NWS) weather forecasts, this research investigates the use of machine learning approaches
  to automatically generate solar power generation predictions through site-specific models. This research
  contrasts different methods of multiple regression, such as different kernel functions in support vector
  machines and linear least squares, for creating prediction models. Using historical NWS forecasts and
  solar intensity values from a weather station spanning almost a year, the work assesses each model's
  accuracy. NWS forecasts provide essential, current, and comprehensive information that can greatly enhance
  solar energy harvesting forecasts. These forecasts make expectation models more likely to record ongoing
  and anticipated weather patterns, leading to more accurate and dependable solar energy generation forecasts.
  The findings of this research demonstrate that existing forecast-based models are 36% less accurate
  than the prediction models of support vector machines developed using seven separate weather forecast
  parameters. The performance of the models is evaluated by the root mean square error.
