summary: Physics-informed ML combining the TTOP model with CMIP6 projections projects over 90% permafrost
  loss in Northeast China by 2100 under SSP5-8.5.
abstract: Abstract. The degradation of marginal permafrost is a sensitive indicator of climate change,
  with far-reaching implications on regional ecosystems, hydrology, and infrastructure. Located near the
  southern limit of latitudinal permafrost (SLLP) in Eastern Asia, Northeast China has experienced pronounced
  permafrost retreat and persistent ground warming in recent decades. This study develops a physics-informed
  machine learning (PIML) framework that integrates the Temperature at the Top of Permafrost (TTOP) model,
  observed changes in land use and land cover (LULC), and climate projections from the Coupled Model Intercomparison
  Project 6 (CMIP6) to improve the understanding and prediction of permafrost dynamics in the region.
  Results indicate that, under the SSP5-8.5 scenario, permafrost extent may decline by more than 90 %
  by the end of the 21st century, primarily driven by a sharp reduction in the air freezing index (AFI),
  especially in high-latitude and high-elevation zones. Land use and cover changes (LUCC), particularly
  urban expansion and deforestation, further exacerbate ground thermal disturbances. Spatially, mountainous
  forested areas, such as the Da Xing’anling Mountains, exhibit relatively greater resilience to warming
  due to dense vegetation and complex topography that help buffer surface energy fluxes. Feature attribution
  analysis identifies surface temperature, snow cover duration, and vegetation as dominant drivers of
  permafrost stability, while Uniform Manifold Approximation and Projection (UMAP) clustering reveals
  distinct degradation trajectories across different land cover types. This study highlights the complex
  interplay of climatic and anthropogenic factors in permafrost evolution and demonstrates the utility
  of integrating physical modelling with machine learning to support ecological conservation and infrastructure
  risk management in cold regions environment.
