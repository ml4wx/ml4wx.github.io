summary: Machine learning trained on radiosondes adds vertical detail to modelled temperature and humidity
  profiles, improving low-level cloud fraction and inversion representation without raising vertical resolution.
abstract: Abstract Atmospheric models used for weather forecasting and climate predictions discretise
  the atmosphere onto a vertical grid. There are however atmospheric phenomena that occur on scales smaller
  than the thickness of those model layers. The formation of low‐level clouds due to temperature inversions
  is an example. This leads to atmospheric models underestimating, or even missing, these clouds and their
  radiative effects. Using radiosonde observations as training data, a machine learning model is used
  to improve the vertical detail of modelled profiles of temperature and specific humidity. In addition,
  a physics‐informed machine learning model is developed and compared to the traditional approach; showing
  improvements in the cloud fraction profiles calculated from its predictions. The vertically enhanced
  profiles also improve the representation of layers of convective inhibition and anomalous refractivity
  gradients. This work facilitates targeted improvements to the representation of certain atmospheric
  processes without the burden of increased memory and computational cost from increasing vertical resolution
  throughout the whole model.
