summary: A transformer forecasts Volos summer temperatures to 2030 and 2040 from ERA5-based data, feeding
  building energy simulations of heatwave-driven HVAC demand.
abstract: The construction of nearly zero-emission buildings in Europe and internationally has become
  mandatory by legislation. In parallel with these developments, the non-reversible increase in ambient
  temperatures stresses the buildings’ energy systems during the summer months with extreme temperatures,
  with their severity varying according to the local microclimate. These phenomena result in an increase
  in the summer cooling loads. Thus, the HVAC system’s performance during summer needs more careful study,
  especially for the residential sector and wherever the night cooling effect is no longer capable of
  releasing the stress. In the present work, the impact of climate change on a residential building’s
  energy performance is studied through energy simulations. The effect of the future increases in the
  intensity and duration of summer heat waves is assessed by exploiting the long-term forecasting capabilities
  of a transformer neural network model, trained by existing meteorological data for the period 2007–2023.
  Based on the forecasted climatic conditions for 2030 and 2040 produced in this way, the projected effects
  on the system’s energy performance are assessed. The long-term forecast was aided by 43 years of ambient
  temperature data for Europe, available through the ERA5 Copernicus program datasets. The respective
  predictions of the building’s HVAC electricity consumption during future summer heat wave episodes of
  long durations point to the necessity of special measures to keep the internal grid’s autonomy and reduce
  unwanted interactions with the external grid. Moreover, further improvements in nZEB building design
  for improved summer energy performance would be critical to the success of this policy during the next
  two decades.
