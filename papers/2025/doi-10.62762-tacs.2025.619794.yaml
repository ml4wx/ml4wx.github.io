summary: DSTFGN fuses causal graph learning with spatiotemporal modelling of weather stations, reporting
  up to 10.58% temperature and 8.88% humidity gains over baselines.
abstract: The rapid accumulation of large-scale, long-term meteorological data presents unprecedented
  opportunities for data-driven weather modeling and high-resolution atmospheric prediction. While various
  deep learning techniques-such as Long Short-Term Memory (LSTM), Recurrent Neural Networks (RNNs), and
  Graph Neural Networks (GNNs)-have been explored for weather forecasting, the complex spatial dependencies
  within historical meteorological data, particularly dynamic spatial correlations among distributed observation
  stations, remain insufficiently addressed. To tackle this challenge, we propose a Dynamic Spatio-Temporal
  Fusion Graph Network (DSTFGN), a novel framework that integrates multivariate time-series analysis with
  graph-based causal inference to capture intricate and time-varying interdependencies among weather variables
  across meteorological observation networks. The DSTFGN module fuses real-time inputs (e.g., sensor data,
  live weather feeds, satellite observations) with historical records to model the propagation of atmospheric
  disturbances-such as storm systems, pressure fronts, or humidity anomalies-through the meteorological
  observation network. By effectively capturing dynamic spatial-temporal interactions among weather stations,
  our approach significantly enhances forecasting accuracy and supports adaptive meteorological monitoring
  strategies. Experimental evaluations on two real-world meteorological datasets demonstrate that DSTFGN
  consistently outperforms existing baseline models across short-term, medium-term, and long-term forecasting
  horizons, achieving improvements of up to 10.58\% in temperature forecasting and 8.88\% in humidity
  forecasting over the best competing baseline.
