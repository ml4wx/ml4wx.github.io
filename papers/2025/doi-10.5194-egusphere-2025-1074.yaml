summary: CNN framework (TCNN) retrieves tropical cyclone intensity, central pressure and wind radius from
  MERRA-2 gridded data, with RMSE of 3–4 m/s at 0.5°.
abstract: Abstract. This study presents a deep learning (DL) framework to retrieve tropical cyclone (TC)
  intensity and size from gridded climate data. Using a DL architecture based on convolutional neural
  networks (CNN) and the Modern-Era Retrospective analysis for Research and Applications (MERRA-2) reanalysis
  dataset, it is shown that our optimal CNN model for TC intensity retrieval (TCNN) can achieve a root
  mean squared error of 3–4 m s-1 at 0.5-degree resolution. With inherent constraints learned from the
  training data, the TCNN model can also retrieve the minimum central pressure and the radius of maximum
  wind with the mean squared errors of 10–12 hPa and 18–20 km, respectively, using the same unified model.
  Sensitivity analyses with different model configurations and input channels help identify the key factors
  and hyperparameters for TC intensity and structure retrieval in the MERRA-2 data. Examining the model
  performance using different data sampling methods reveals further that the TC information retrieval
  problem strongly depends on data sampling strategies. An improper sampling data could result in an overfitting
  of the model performance, which limits the application of DL models for downscaling or forecast purposes.
  Several potential improvements and challenges to handle this TC intensity data sampling will be also
  discussed.
