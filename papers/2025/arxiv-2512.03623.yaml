summary: Explores a vision language model that writes UK Shipping Forecast text directly from video-encoded
  gridded weather fields, showing early promise.
abstract: Despite the promising capability of multimodal foundation models, their application to the generation
  of meteorological products and services remains nascent. To accelerate aspiration and adoption, we explore
  the novel use of a vision language model for writing the iconic Shipping Forecast text directly from
  video-encoded gridded weather data. These early results demonstrate promising scalable technological
  opportunities for enhancing production efficiency and service innovation within the weather enterprise
  and beyond.
