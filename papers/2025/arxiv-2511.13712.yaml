summary: Applies SHAP explanations to wildfire prediction models to reveal key drivers, potential biases
  and seasonal patterns that support disaster-preparedness decisions.
abstract: As climate change accelerates the frequency and severity of extreme events such as wildfires,
  the need for accurate, explainable, and actionable forecasting becomes increasingly urgent. While artificial
  intelligence (AI) models have shown promise in predicting such events, their adoption in real-world
  decision-making remains limited due to their black-box nature, which limits trust, explainability, and
  operational readiness. This paper investigates the role of explainable AI (XAI) in bridging the gap
  between predictive accuracy and actionable insight for extreme event forecasting. Using wildfire prediction
  as a case study, we evaluate various AI models and employ SHapley Additive exPlanations (SHAP) to uncover
  key features, decision pathways, and potential biases in model behavior. Our analysis demonstrates how
  XAI not only clarifies model reasoning but also supports critical decision-making by domain experts
  and response teams. In addition, we provide supporting visualizations that enhance the interpretability
  of XAI outputs by contextualizing feature importance and temporal patterns in seasonality and geospatial
  characteristics. This approach enhances the usability of AI explanations for practitioners and policymakers.
  Our findings highlight the need for AI systems that are not only accurate but also interpretable, accessible,
  and trustworthy, essential for effective use in disaster preparedness, risk mitigation, and climate
  resilience planning.
