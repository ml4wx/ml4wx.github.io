summary: Spatiotemporal Vision Transformer inside a campus digital twin forecasts high-resolution human
  heat stress from physics simulations and meteorological data; a local, single-site demonstration.
abstract: Extreme heat events, exacerbated by climate change, pose significant challenges to urban resilience
  and planning. This study introduces a climate-responsive digital twin framework integrating the Spatiotemporal
  Vision Transformer (ST-ViT) model to enhance heat stress forecasting and decision-making. Using a Texas
  campus as a testbed, we synthesized high-resolution physical model simulations with spatial and meteorological
  data to develop fine-scale human thermal predictions. The ST-ViT-powered digital twin enables efficient,
  data-driven insights for planners and stakeholders, supporting targeted heat mitigation strategies and
  advancing climate-adaptive urban design. This campus-scale demonstration offers a foundation for future
  applications across broader and more diverse urban contexts.
