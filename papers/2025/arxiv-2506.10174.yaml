summary: Temporo-spatial ViT retrieves surface solar radiation from SEVIRI imagery without albedo maps
  or cloud masks, matching albedo-informed models over snowy Swiss terrain.
abstract: Accurate retrieval of surface solar radiation (SSR) from satellite imagery critically depends
  on estimating the background reflectance that a spaceborne sensor would observe under clear-sky conditions.
  Deviations from this baseline can then be used to detect cloud presence and guide radiative transfer
  models in inferring atmospheric attenuation. Operational retrieval algorithms typically approximate
  background reflectance using monthly statistics, assuming surface properties vary slowly relative to
  atmospheric conditions. However, this approach fails in mountainous regions where intermittent snow
  cover and changing snow surfaces are frequent. We propose an attention-based emulator for SSR retrieval
  that implicitly learns to infer clear-sky surface reflectance from raw satellite image sequences. Built
  on the Temporo-Spatial Vision Transformer, our approach eliminates the need for hand-crafted features
  such as explicit albedo maps or cloud masks. The emulator is trained on instantaneous SSR estimates
  from the HelioMont algorithm over Switzerland, a region characterized by complex terrain and dynamic
  snow cover. Inputs include multi-spectral SEVIRI imagery from the Meteosat Second Generation platform,
  augmented with static topographic features and solar geometry. The target variable is HelioMont's SSR,
  computed as the sum of its direct and diffuse horizontal irradiance components, given at a spatial resolution
  of 1.7 km. We show that, when provided a sufficiently long temporal context, the model matches the performances
  of albedo-informed models, highlighting the model's ability to internally learn and exploit latent surface
  reflectance dynamics. Our geospatial analysis shows this effect is most powerful in mountainous regions
  and improves generalization in both simple and complex topographic settings. Code and datasets are publicly
  available at https://github.com/frischwood/HeMu-dev.git
