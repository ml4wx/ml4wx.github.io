summary: An ML fusion model builds a 1961–2022 precipitation δ18O isoscape for China, showing higher values
  in southern El Niño years and lower values in La Niña years.
abstract: Abstract Water stable isotopes serve as essential natural tracers, offering broad applications
  in water cycle, atmosphere science and paleoclimate rebuilding. In this study, we created a precipitation
  stable isotope dataset for 1961–2022 by developing a fusion machine learning model, and mapped the time-series
  precipitation isoscape (δ 18 O) across the mainland of China over the past 62 years. This dataset allows
  for a further discussion on spatially different behavior of precipitation δ 18 O to the strong ENSO
  events, and we found that δ 18 O values are higher in El Niño years and lower in La Niña years in the
  southern of the line roughly from 30°N 80°E to 40°N 120°E, not fully consistent with the northern region.
  We also revealed an increasing trend in precipitation δ 18 O in the Western arid region and Eastern
  monsoon region in the past decades, while no significant trend on the Tibetan Plateau. These findings
  enhance our understanding of the climatic control mechanisms influencing precipitation isotopes and
  benefit paleoclimate rebuilding.
