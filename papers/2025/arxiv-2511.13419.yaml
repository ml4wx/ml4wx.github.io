summary: A hybrid BiLSTM and BiGRU attention model with an extreme-weighted loss forecasts daily maximum
  temperature extremes from time series.
abstract: Accurate short-range prediction of extreme air temperature events remains a fundamental challenge
  in operational climate-risk management. We present Multi-Modal Weather State Transition Model with Anomaly-Driven
  Recurrent Attention Network Plus (MMWSTM-ADRAN+), a dual-stream deep learning architecture that couples
  a regime-aware dynamics model with an anomaly-focused attention mechanism to forecast daily maximum
  temperature and its extremes. The first stream, MMWSTM, combines bidirectional Long Short-Term Memory
  (BiLSTM) units with a learnable Markov state transition matrix to capture synoptic-scale weather regime
  changes. The second stream, ADRAN, integrates bidirectional Gated Recurrent Units (BiGRUs), multi-head
  self-attention, and a novel anomaly amplification layer to enhance sensitivity to low-probability signals.
  A lightweight attentive fusion gate adaptively determines the contribution of each stream to the final
  prediction. Model optimization employs a custom ExtremeWeatherLoss function that up-weights errors on
  the upper 5% and lower 5% of the temperature distribution, and a time-series data augmentation suite
  (jittering, scaling, time/magnitude warping) that effectively quadruples the training data
