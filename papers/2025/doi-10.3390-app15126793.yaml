summary: An LSTM model trained on CERRA data forecasts air temperature at a Slovenian micro-location,
  validated against a local station and compared with ICON-D2.
abstract: Nowadays, technological progress has promoted the integration of artificial intelligence into
  modern human lives rapidly. On the other hand, extreme weather events in recent years have started to
  influence human well-being. As a result, these events have been addressed by artificial intelligence
  methods more and more frequently. In line with this, the paper focuses on searching for predicting the
  air temperature in a particular Slovenian micro-location by using a weather prediction model Maximus
  based on a long-short term memory neural network learned by the long-term, lower-resolution dataset
  CERRA. During this huge experimental study, the Maximus prediction model was tested with the ICON-D2
  general-purpose weather prediction model and validated with real data from the mobile weather station
  positioned at a specific micro-location. The weather station employs Internet of Things sensors for
  measuring temperature, humidity, wind speed and direction, and rain, while it is powered by solar cells.
  The results of comparing the Maximus proposed prediction model for predicting the air temperature in
  micro-locations with the general-purpose weather prediction model ICON-D2 has encouraged the authors
  to continue searching for an air temperature prediction model at the micro-location in the future.
