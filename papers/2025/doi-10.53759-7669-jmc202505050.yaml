abstract: This paper discusses the contribution of AI and ML in the information systems of a smart city,
  particularly being concerned with enhancing the precision of weather forecasts and the effectiveness
  of emergency responses. Satellite imagery forms part of the complex data sets incorporated in the study,
  along with historical data regarding emergencies. The datasets were analyzed with the help of AI and
  ML models, such as LSTM and CNNs. Results show that the AI-based systems performed better than the traditional
  method, as it accounted for 92% of accuracy in short-range weather forecasting, while the legacy model
  only accounted for 78%. During extreme events such as heat waves and wildfires, AI models produced more
  timely and accurate warnings, cutting the response time for emergencies by as much as 25%. The paper
  also touches on broader implications of AI in relation to its potential and contribution toward the
  betterment of enhanced urban resilience, sustainability, and public safety. Although there are considerable
  merits with AI, the issues of data privacy and ethical concerns along with computational overheads pose
  challenges and drawbacks. Such a research effort is hoped to conclude in hybrid AI models and advanced
  IoT sensor networks as possibleF futures toward optimizing the smarts for smart city applications.
