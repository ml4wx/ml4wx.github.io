summary: Interpretable XGBoost framework with genetic-algorithm feature selection predicts tropical-cyclone
  extreme rainfall occurrence and magnitude in Guangxi, beating TIGGE ensembles in case studies.
abstract: ABSTRACT Accurate prediction of tropical cyclone‐induced extreme rainfall (TCER) is of utmost
  importance for disaster mitigation in coastal regions. However, it remains a formidable challenge due
  to the intricate interactions among multi‐scale meteorological factors and the inherent data imbalances.
  This study presented an interpretable machine learning (ML) framework aimed at predicting both the occurrence
  and magnitude of TCER in Guangxi (GX), China. The framework integrated three supervised learning algorithms,
  namely XGBoost, Random Forest, and AdaBoost, along with feature selection techniques and an explainable
  method. A total of 202 experiments were conducted to comprehensively evaluate the framework's performance.
  Genetic Algorithm (GA) optimization and Shapley additive explanations (SHAP) were utilized to identify
  the optimal subsets of features and accurately quantify the contributions of each variable. Results
  showed that the optimized XGBoost model exhibited outstanding performance, integrating 18 predictors
  across dynamic, thermodynamic, moisture, and precursor variables, with a Threat Score of 0.41 for the
  classification of TCER occurrence and a Threat Score of 0.49 for the regression of rainfall magnitude,
  outperforming the TIGGE ensemble data in case studies of typhoons Chaba (2022) and Doksuri (2023). SHAP
  analysis revealed that Distance to Track is the most crucial factor for TCER occurrence. It also unveiled
  the existence of nonlinear interactions. For instance, an increase in vertical wind shear, favorable
  thermal conditions, ascending motion, and subtropical high activity can substantially amplify the likelihood
  of TCER when coupled with low‐level humidity accumulation. Moreover, time‐lagged variables and time‐evolution
  variables demonstrated their ability to capture the precursor signals of TCER events, like humidity
  accumulation, circulation adjustment, and typhoon intensity changes, highlighting the model's effectiveness
  in considering these factors. Therefore, this study showcases the great potential of ML in enhancing
  TCER prediction while maintaining physical interpretability. Additionally, it offers a valuable reference
  for addressing imbalance issues in similar research fields.
