summary: Checkpoint analysis of an SFNO shows it learns atmospheric river and tropical cyclone skill early
  then loses it, motivating checkpoint-retention training strategies.
abstract: In a warming climate with more frequent severe weather, artificial intelligence (AI) weather
  models have the potential to provide cheaper, faster, and more accurate forecasts of high-impact weather
  events. To realize this potential, there is a need for more research on how models learn extreme events
  and how that learning might be improved. We investigate how a spherical Fourier neural operator model
  (SFNO) learns extreme weather by saving every checkpoint throughout training and analyzing a collection
  of 9 extreme weather events including heatwaves, atmospheric rivers, and tropical cyclones. The SFNO
  learns heatwaves similarly to other weather days, but we find evidence that the model learns information
  about atmospheric river and tropical cyclone forecasts that it loses later in training. We propose a
  possible training strategy to improve the forecasting of extreme events by retaining information from
  earlier training checkpoints, and provide initial evidence of its utility.
