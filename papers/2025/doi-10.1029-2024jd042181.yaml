summary: U-Net, Efficient-UNet and cGAN with elevation inputs correct PDIR-Now satellite precipitation
  over the Western US, outperforming the raw product and baseline U-Net.
abstract: Abstract Satellite‐based precipitation products (SPPs) have gained popularity among researchers
  due to their utility in hydrologic studies. Several gridded satellite‐based precipitation products with
  global coverage, such as the Integrated Multi‐satellitE Retrievals for GPM (IMERG) and the Precipitation
  Estimation from Remotely Sensed Information using Artificial Neural Networks (PERSIANN) family of products,
  are available worldwide. However, the accuracy of these products may vary due to retrieval algorithms
  or geographic location. Numerous correction techniques have been implemented, and machine learning techniques,
  especially Deep Neural Networks, have proven to be the most effective in improving precipitation estimation.
  This study aims to investigate the performance of the PERSIANN‐Dynamic Infrared Rain Rate near real‐time
  product (PDIR‐Now) in the Western U.S. and assess the effectiveness of three deep learning models including
  U‐Net, Efficient‐UNet, and a conditional Generative Adversarial Network (cGAN) in correcting biases
  present in the product. The developed models are expected to be more accurate than traditional methods,
  as they include digital elevation information and can resolve complex orographic enhancements in precipitation
  processes. This incorporation will mitigate the bias associated with SPPs, enabling further potential
  applications in water resource management. The findings revealed that the corrected results, utilizing
  the Efficient‐UNet and cGAN models, surpassed the original PDIR‐Now product and U‐Net model across various
  statistical and categorical metrics at different temporal scales. This bias‐correction scheme will enhance
  the assessment and understanding of precipitation patterns and can be used to improve the quality of
  precipitation estimates in other regions.
