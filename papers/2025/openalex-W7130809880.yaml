summary: Evaluates ECMWF ensemble Extreme Forecast Index and AIFS for heatwave and flash-drought predictability
  in southern South America, plus logistic regression on ERA5-Land.
abstract: Las sequías de rápido desarrollo (SRD) son un tipo particular de sequía que se desarrolla repentinamente,
  pudiendo generar impactos significativos en el sector agrícola. Si bien las sequías en general son desastres
  de evolución lenta, con efectos de gran extensión espacial y larga duración, las SRD se caracterizan
  por un rápido agotamiento de la humedad del suelo, provocado por una combinación de déficit de precipitación,
  olas de calor y baja humedad atmosférica. A pesar de su importancia, el conocimiento sobre las SRD sigue
  siendo limitado, desde su detección y caracterización hasta el desarrollo de indicadores de monitoreo
  y herramientas de pronóstico. Aunque el Sistema de Información sobre Sequías para el Sur de Sudamérica
  (SISSA) ha avanzado en el monitoreo, el pronóstico de las SRD y de las olas de calor, siguen siendo
  un gran desafío debido a la escala temporal en la que se desarrollan y su baja frecuencia de ocurrencia,
  dificultando ciertos enfoques de machine learning. Este estudio busca evaluar la predictibilidad de
  eventos de ola de calor y SRD mediante el uso del Extreme Forecast Index (EFI) del modelo por ensambles
  del ECMWF y del Artificial Intelligence Forecast System (AIFS). Por otro lado, se analizará la utilización
  de regresiones logísticas univariada/multivariada a variables atmosféricas y del suelo de los reanálisis
  del ERA5-Land para estimar la probabilidad de ocurrencia de SRD.
