summary: CRPS-trained stochastic parametrizations of the Lorenz '96 system give sharper, more accurate
  short-term ensembles than derivative-fitting approaches.
abstract: This paper demonstrates the feasibility of trajectory learning for ensemble forecasts by employing
  the continuous ranked probability score (CRPS) as a loss function. Using the two-scale Lorenz '96 system
  as a case study, we develop and train both additive and multiplicative stochastic parametrizations to
  generate ensemble predictions. Results indicate that CRPS-based trajectory learning produces parametrizations
  that are both accurate and sharp. The resulting parametrizations are straightforward to calibrate and
  outperform derivative-fitting-based parametrizations in short-term forecasts. This approach is particularly
  promising for data assimilation applications due to its accuracy over short lead times.
