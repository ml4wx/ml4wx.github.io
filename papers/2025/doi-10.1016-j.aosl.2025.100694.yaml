summary: TCI-KAN, a Kolmogorov-Arnold network with iterative predictor pruning, forecasts 6-h tropical
  cyclone intensity with 2.85 kt MAE, 31% better than the official operational forecast.
abstract: Accurate tropical cyclone (TC) intensity prediction is crucial for disaster mitigation and public
  safety. However, current TC intensity prediction models are facing significant challenges, including
  intricate predictor selection and limited accuracy. To address these challenges, the authors propose
  a novel TC intensity prediction framework that integrates Kolmogorov–Arnold networks (KANs) with a dynamic
  predictor pruning optimization module—namely, TCI–KAN. This model develops a data-driven predictor selection
  method that implements iterative elimination of low-impact predictors through weight ranking analysis.
  Testing results demonstrate that TCI–KAN achieves superior accuracy in 6-h intensity forecasts, with
  a mean absolute error (MAE) of 2.85 kt. TCI–KAN significantly outperforms the referenced best records
  by 31%, 13%, and 6% in MAE compared to the official operational forecast, single deep learning models,
  and hybrid deep learning models, respectively. Further analysis demonstrates that TCI–KAN is suitable
  for different basins and TC categories. 摘要 准确的热带气旋 (TC) 强度预报对减灾和公共安全至关重要. 然而, 目前TC强度预报存在因子筛选复杂, 预报精度不足等问题.
  为此, 本文构建了具备因子剪枝优选能力的Kolmogorov-Arnold网络 (KANs) 全球TC强度智能预报模型 (TCI–KAN) . 该模型设计了数据驱动的预报因子筛选方法, 通过权重排序分析实现了低影响预报因子的迭代剪枝.
  结果表明, TCI–KAN在6小时TC强度预报中表现优异, 独立测试集平均绝对误差 (MAE) 为2.85 kt, 较美国国家飓风中心官方预报, 最优单深度学习模型及最优混合模型分别降低31%, 13%和6%.
  进一步分析表明, TCI–KAN适用于不同海域和TC强度类别.
