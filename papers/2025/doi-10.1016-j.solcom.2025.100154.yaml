summary: Review of solar irradiance forecasting from intra-hour to multi-day horizons, linking physical,
  satellite and AI-based methods to accuracy outcomes.
abstract: Solar energy is a key renewable resource, yet synchronizing its production with grid demand
  remains challenging due to irradiance variability. This review systematically examines the evolution
  of solar irradiance forecasting methods, from physical and numerical weather prediction (NWP) models
  to modern data-driven and hybrid AI-based approaches. It integrates analyses of All-Sky Imager (ASI)
  and satellite datasets and categorizes forecasting techniques by temporal horizons from intra-hour to
  multi-day forecasts. The paper uniquely contributes a comparative taxonomy linking forecast horizon,
  input data type, and model architecture to accuracy outcomes. The findings highlight the growing benefits
  of physics-informed deep learning for improving operational solar forecasts.
