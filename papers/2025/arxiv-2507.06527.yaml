summary: Generative-AI downscaling for New Zealand shows internal variability dominates fine-scale extreme
  precipitation projections, exceeding scenario spread by up to tenfold for decadal extremes.
abstract: The computational cost of dynamical downscaling limits ensemble sizes in regional downscaling
  efforts. We present a newly developed generative-AI approach to greatly expand the scope of such downscaling,
  enabling fine-scale future changes to be characterised including rare extremes that cannot be addressed
  by traditional approaches. We test this approach for New Zealand, where strong regional effects are
  anticipated. At fine scales, the forced (predictable) component of precipitation and temperature extremes
  for future periods (2080--2099) is spatially smoother than changes in individual simulations, and locally
  smaller. Future changes in rarer (10-year and 20-year) precipitation extremes are more severe and have
  larger internal variability spread than annual extremes. Internal variability spread is larger at fine
  scales that at the coarser scales simulated in climate models. Unpredictability from internal variability
  dominates model uncertainty and, for precipitation, its variance increases with warming, exceeding the
  variance across emission scenarios by fourfold for annual and tenfold for decadal extremes. These results
  indicate that fine-scale changes in future precipitation are less predictable than widely assumed and
  require much larger ensembles to assess reliably than changes at coarser scales.
