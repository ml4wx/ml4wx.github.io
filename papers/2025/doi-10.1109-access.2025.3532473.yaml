summary: STGAMAM combines spatial-temporal graph attention with a mixed adjacency matrix and self-attention
  for weather forecasting on two real datasets.
abstract: Rapidly accumulating, large-scale and long-term meteorological data provide unprecedented opportunities
  for data-driven meteorological models and fine-grained numerical weather prediction. Many existing approaches
  based on deep learning models, e.g., recurrent neutral networks and graph neural networks, have been
  proposed for weather forecasting. However, the subtle spatial correlations hidden in the vast amount
  of historical meteorological data have not been fully explored, such as dynamic spatial correlation.
  In this paper, we propose STGAMAM, which integrates Spatial-Temporal fusion Graph neural networks with
  a novel Adjacency Matrix and self-Attention Mechanisms to capture both long-term temporal periodicity
  and short-term spatial-temporal dependencies based on mixed adjacency via graph attention networks and
  then makes fine-grained prediction on concatenated features which combines diverse correlations. Our
  approach is validated by extensive experiment on two real-world datasets, which demonstrates the superiority
  of the proposed method over existing methods.
