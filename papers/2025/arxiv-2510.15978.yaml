summary: DAWP assimilates irregular satellite observation tokens with a masked autoencoder and forecasts
  in observation space, removing reliance on reanalysis for global weather prediction.
abstract: Weather prediction is a critical task for human society, where impressive progress has been
  made by training artificial intelligence weather prediction (AIWP) methods with reanalysis data. However,
  reliance on reanalysis data limits the AIWPs with shortcomings, including data assimilation biases and
  temporal discrepancies. To liberate AIWPs from the reanalysis data, observation forecasting emerges
  as a transformative paradigm for weather prediction. One of the key challenges in observation forecasting
  is learning spatiotemporal dynamics across disparate measurement systems with irregular high-resolution
  observation data, which constrains the design and prediction of AIWPs. To this end, we propose our DAWP
  as an innovative framework to enable AIWPs to operate in a complete observation space by initialization
  with an artificial intelligence data assimilation (AIDA) module. Specifically, our AIDA module applies
  a mask multi-modality autoencoder(MMAE)for assimilating irregular satellite observation tokens encoded
  by mask ViT-VAEs. For AIWP, we introduce a spatiotemporal decoupling transformer with cross-regional
  boundary conditioning (CBC), learning the dynamics in observation space, to enable sub-image-based global
  observation forecasting. Comprehensive experiments demonstrate that AIDA initialization significantly
  improves the roll out and efficiency of AIWP. Additionally, we show that DAWP holds promising potential
  to be applied in global precipitation forecasting.
