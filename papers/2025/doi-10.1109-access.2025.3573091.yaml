summary: Compares feature importance and CART, SVM and dense networks for rainfall prediction from five
  years of data at three stations, finding reduced feature sets perform better.
abstract: Accurate rainfall prediction is of paramount significance across diverse sectors, particularly
  in agriculture, where accurate predictions play a pivotal role in effective resource management and
  decision-making. However, due to the complexity and dynamic structure of climate systems, rainfall prediction
  is a difficult task. This study shifts the focus towards exploring correlations and feature selection
  in the context of rainfall prediction, contributing to a more sophisticated understanding of the process.
  By analyzing five years of weather data from three weather stations in the United States, Canada, and
  Ireland, the study delves into the interactions between meteorological features and rainfall occurrences.
  The use of a machine learning (ML)-based feature importance technique, which enables the identification
  of key meteorological features that significantly contribute to rainfall prediction, is central to the
  work. As a result, this method improves understanding of meteorological conditions, which act as accurate
  forecasters of rainfall outcomes and can help to develop accurate decision-support systems. The study
  also conducts a thorough assessment of prediction performance of various ML and deep learning (DL) techniques
  such as Classification and Regression Trees (CART), Support Vector Machine (SVM) and Dense Neural Networks
  (DNN).The findings show that the models using only the important meteorological features in the dataset
  perform better than using all the features. This rigorous examination also supports the selection of
  appropriate rainfall forecast models for specific use cases. Overall, this study increases our understanding
  of rainfall prediction by focusing on the investigation of correlations between meteorological indicators
  and the identification of key meteorological features using ML approaches, offering valuable insights
  for weather forecasting applications. This nuanced analysis contributes to the advancement of predictive
  modeling in the realm of rainfall forecasting, offering potential implications for decision-making across
  sectors reliant on precise weather forecasts.
