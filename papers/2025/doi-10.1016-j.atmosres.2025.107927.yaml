summary: A random forest dynamical-statistical model extends weekly precipitation skill over Southern
  China to 4-week lead, raising TCC by about 0.1 over ECMWF ensemble mean.
abstract: Rainfall in southern China (SC) reaches its annual peak in early summer (May–June), which is
  often accompanied by the occurrence of rainstorm and flooding disasters. Reliable subseasonal precipitation
  forecasts play important roles in disaster prevention and mitigation. In this study, the four leading
  predictable patterns (accounts for 63.24 % of the total variance) of weekly precipitation anomalies
  (WPA) over Southern China (SC) during early summer and the corresponding signal sources in European
  Centre for Medium-Range Weather Forecasts (ECMWF) are analyzed. The first and second predictable patterns
  present uniform and meridional dipole pattern over SC, respectively, while the third and fourth predictable
  patterns feature with the tripole patterns. Further analysis indicates that the low-level anomalous
  anticyclone centered over the tropical western Pacific and the lower-level subtropical western North
  Pacific anomalous anticyclone are the key predictability sources for the first and second predictable
  patterns, respectively. Although ECMWF shows limited forecast skills in predicting the four leading
  predictable patterns after 2-week lead time, it can capture the associated large-scale circulation features
  to a large extent even up to 4-week lead time. Against this backdrop, we develop a dynamical-statistical
  model (DSM) using random forest to reconstruct these predictable patterns of WPA based on the associated
  large-scale features in ECMWF. The DSM can extend the forecast skills of WPA up to 4-week lead time
  over the majority area of SC and increase regional average TCC by ∼0.1 compared to the ensemble mean
  forecast from ECMWF for 3–4-week lead times. Further analysis indicates that the enhanced TCCs of DSM
  compared with ECMWF can be largely attributed to the enhancement in predicting the second predictable
  pattern. The proposed DSM is very promising in subseasonal precipitation forecasts and can also be applied
  to the routine forecast of other atmospheric and ocean phenomena in the future.
