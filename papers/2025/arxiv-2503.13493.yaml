summary: Compares learning models for offshore wind prediction at a Gulf of Mexico site, finding predicting
  wind speed as output improves accuracy by about 10% over wind power.
abstract: Accurate wind speed prediction is crucial for designing and selecting sites for offshore wind
  farms. This paper investigates the effectiveness of various machine learning models in predicting offshore
  wind power for a site near the Gulf of Mexico by analyzing meteorological data. After collecting and
  preprocessing meteorological data, nine different input feature combinations were designed to assess
  their impact on wind power predictions at multiple heights. The results show that using wind speed as
  the output feature improves prediction accuracy by approximately 10% compared to using wind power as
  the output. In addition, the improvement of multi-feature input compared with single-feature input is
  not obvious mainly due to the poor correlation among key features and limited generalization ability
  of models. These findings underscore the importance of selecting appropriate output features and highlight
  considerations for using machine learning in wind power forecasting, offering insights that could guide
  future wind power prediction models and conversion techniques.
