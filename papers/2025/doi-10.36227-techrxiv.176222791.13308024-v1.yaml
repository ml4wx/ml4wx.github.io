summary: Compares TCN-LSTM, LSTM and GRU on Jena temperature data; a standalone GRU gives the lowest MAE
  (1.85 °C) over the hybrid model.
abstract: This study compares a TCN-LSTM hybrid deep learning model with simpler GRU and LSTM standalone
  models. Although hybrid models are often proposed for their potential to achieve state-of-the-art performance
  in time series forecasting, this study finds that a standalone model with moderate complexity achieves
  the best MAE. This paper focuses on validating architectural complexity against simpler baselines. In
  this paper a comparative study of a TCN-LSTM hybrid, a standalone GRU, and a standalone LSTM is presented
  for temperature forecasting on the benchmark Jena Climate dataset. A fair comparison was ensured by
  training all the models on the same feature-engineered data and individually optimizing through a systematic
  hyperparameter search. The results show a clear performance hierarchy, though the simplest model is
  not superior. The standalone GRU achieves the best performance with a final test set MAE of 1.8458 •
  C, outperforming both the LSTM (1.8890 • C) and the TCN-LSTM hybrid (1.9978 • C). However, a qualitative
  analysis reveals that the hybrid model excels in capturing the high-frequency patterns of the data,
  an advantage that is not reflected in the MAE metric. This study emphasizes the importance of both quantitative
  and qualitative evaluation in model selection.
