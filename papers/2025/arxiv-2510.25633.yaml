summary: CNN with explainable-AI sensitivity maps shows jet meanders and baroclinicity reduce predictability
  of 200,000 aquaplanet storms, nearly doubling error growth.
abstract: The midlatitude climate and weather are shaped by storms, yet the factors governing their predictability
  remain insufficiently understood. Here, we use a Convolutional Neural Network (CNN) to predict and quantify
  uncertainty in the intensity growth and trajectory of over 200,000 storms simulated in a 200-year aquaplanet
  GCM. This idealized framework provides a controlled climate background for isolating factors that govern
  predictability. Results show that storm intensity is less predictable than trajectory. Strong baroclinicity
  accelerates storm intensification and reduces its predictability, consistent with theory. Crucially,
  enhanced jet meanders further degrade forecast skill, revealing a synoptic source of uncertainty. Using
  sensitivity maps from explainable AI, we find that the error growth rate is nearly doubled by the more
  meandering structure. These findings highlight the potential of machine learning for advancing understanding
  of predictability and its governing mechanisms.
