summary: Seq2seq TelNet trained on many CMIP6 simulations beats ERA5-trained models and dynamical systems
  for South American seasonal precipitation forecasts.
abstract: 'The limited availability of observational and reanalysis data presents a significant challenge
  in training machine learning (ML) models for seasonal climate forecasting. Here, we show that training
  ML-based seasonal forecasting models with a larger number of individual simulations from CMIP6 models
  enhances their generalization ability and improves precipitation forecasts over South America. Using
  TelNet, a sequence-to-sequence machine learning model, we assess the performance of models trained with
  different numbers of CMIP6 simulations compared to those trained with ERA5 reanalysis and the CMIP6
  ensemble mean. The results reveal that models trained with only a few CMIP6 simulations perform worse
  than those trained with ERA5, primarily due to instability during ML model tuning and reduced generalization
  ability. However, as the number of CMIP6 models increases, performance improves and surpasses both ERA5-
  and ensemble-mean-based ML models. Reliability and sharpness diagrams analysis further demonstrate that
  ML models trained with more CMIP6 simulations yield more confident and calibrated forecasts. Moreover,
  CMIP6-based TelNet constantly outperformed state-of-the-art dynamical models across different initialization
  months and lead times. This study underscores the potential of leveraging large multi-model dynamical
  simulations for robust ML-based seasonal climate forecasting. • Data Limitation Challenge: ML models
  struggle due to limited observational and reanalysis climate data. • Benefit of Using Many Simulations:
  Training on many CMIP6 simulations improves ML accuracy, surpassing ERA5 or ensemble models. • Improved
  Reliability and Performance: More CMIP6 simulations yield confident, well-calibrated forecasts that
  beat leading dynamical models.'
