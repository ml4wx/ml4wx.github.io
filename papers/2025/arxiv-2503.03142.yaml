summary: Survey of foundation models across environmental science covering forecasting, data assimilation
  and downscaling, with weather and climate as one major strand.
abstract: Modeling environmental ecosystems is essential for effective resource management, sustainable
  development, and understanding complex ecological processes. However, traditional methods frequently
  struggle with the inherent complexity, interconnectedness, and limited data of such systems. Foundation
  models, with their large-scale pre-training and universal representations, offer transformative opportunities
  by integrating diverse data sources, capturing spatiotemporal dependencies, and adapting to a broad
  range of tasks. This survey presents a comprehensive overview of foundation model applications in environmental
  science, highlighting advancements in forward prediction, data generation, data assimilation, downscaling,
  model ensembling, and decision-making across domains. We also detail the development process of these
  models, covering data collection, architecture design, training, tuning, and evaluation. By showcasing
  these emerging methods, we aim to foster interdisciplinary collaboration and advance the integration
  of cutting-edge machine learning for sustainable solutions in environmental science.
