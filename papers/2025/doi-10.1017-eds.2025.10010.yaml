summary: Position paper on how quantum computing and quantum machine learning could accelerate climate
  models and improve subgrid parameterizations in hybrid Earth system models.
abstract: Abstract Adaptation to climate change requires robust climate projections, yet the uncertainty
  in these projections performed by ensembles of Earth system models (ESMs) remains large. This is mainly
  due to uncertainties in the representation of subgrid-scale processes such as turbulence or convection
  that are partly alleviated at higher resolution. New developments in machine learning-based hybrid ESMs
  demonstrate great potential for systematically reduced errors compared to traditional ESMs. Building
  on the work of hybrid (physics + AI) ESMs, we here discuss the additional potential of further improving
  and accelerating climate models with quantum computing. We discuss how quantum computers could accelerate
  climate models by solving the underlying differential equations faster, how quantum machine learning
  could better represent subgrid-scale phenomena in ESMs even with currently available noisy intermediate-scale
  quantum devices, how quantum algorithms aimed at solving optimization problems could assist in tuning
  the many parameters in ESMs, a currently time-consuming and challenging process, and how quantum computers
  could aid in the analysis of climate models. We also discuss hurdles and obstacles facing current quantum
  computing paradigms. Strong interdisciplinary collaboration between climate scientists and quantum computing
  experts could help overcome these hurdles and harness the potential of quantum computing for this urgent
  topic.
