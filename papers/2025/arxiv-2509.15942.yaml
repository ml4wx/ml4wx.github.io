summary: ArchesClimate, a flow-matching emulator trained on IPSL decadal hindcasts, autoregressively generates
  stable, physically consistent climate states for up to 10 years at monthly steps.
abstract: Internal variability is a dominant contributor to the uncertainty of predictions at the interannual
  to decadal timescale. A typical approach to separating the internal variability from forced climate
  responses is to generate large ensembles of simulations under different initial conditions. Due to the
  complexity of Earth System Models, generating these large ensembles is computationally expensive. In
  this work, we present ArchesClimate, a deep learning-based climate model emulator designed to reduce
  the cost of exploring internal variability at timescales ranging from monthly to decadal. ArchesClimate
  is trained on decadal hindcasts of the IPSL-CM6A-LR climate model. We train a flow matching model following
  ArchesWeatherGen, which we adapt to predict near-term climate. Once trained, the model generates states
  at a one-month lead time from the states of the two preceding months, and can be used to auto-regressively
  emulate climate model simulations. We show that for up to 10 years, these generations are stable and
  physically consistent. We also show that for several important climate variables, ArchesClimate generates
  simulations that are interchangeable with the IPSL model. This work suggests that climate model emulators
  could reduce the cost of generating large ensembles with climate models.
