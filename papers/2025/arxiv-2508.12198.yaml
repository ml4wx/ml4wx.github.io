summary: Fine-tuned small vision-language model reads Skew-T diagrams and estimates precipitation probability
  with skill comparable to an operational NWP model.
abstract: Forecasting from atmospheric soundings is a fundamental task in operational meteorology, often
  requiring structured visual reasoning over Skew-T log-P diagrams by human forecasters. While recent
  advances in Vision-Language Models (VLMs) have shown promise in other scientific domains, their application
  to meteorological diagram interpretation remains largely unexplored. In this study, we present a lightweight
  AI assistant that interprets Skew-T diagrams using a small language model (LM) and a small VLM fine-tuned
  to emulate human forecasters. Using a curriculum learning framework, we first train the models to identify
  key atmospheric features from diagrams through visual question answering, followed by chain-of-thought
  reasoning tasks that estimate precipitation probability based on the derived visual groundings. Model
  inputs include either textual summaries or generated Skew-T diagrams derived from operational Numerical
  Weather Prediction (NWP) forecasts, paired with three-hour precipitation observations from South Korea's
  Auto Weather Stations network. Evaluation results demonstrate that the fine-tuned VLM achieves skill
  comparable to an operational NWP model, despite relying solely on static atmospheric profiles. Ablation
  studies reveal that visual grounding and reasoning supervision are critical for performance, while attention
  map analysis confirms that the model learns to focus on relevant meteorological features. These findings
  highlight the potential of compact, interpretable multimodal models to support weather forecasting tasks.
  The approach offers a computationally efficient alternative to large-scale systems, and future work
  could extend it to more complex applications.
