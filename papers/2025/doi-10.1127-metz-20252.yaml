summary: Conference report summarizing ENWFC-2024 talks on nowcasting, statistical post-processing and
  AI-based weather forecasting, with a focus on machine learning.
abstract: 'The first European Nowcasting and Weather Forecasting Conference (ENWFC-2024) dedicated to
  nowcasting, seamless forecasting, statistical postprocessing and ensemble prediction took place in Oslo,
  Norway (Oslo Science Park) from 4 to 8 November 2024, organized by EUMETNET (European National Meteorological
  and Hydrological Services Network) within the Weather Forecasting Cooperation Programme (E-WFC).More
  than 70 participants attended the conference in person; and ca. 100 more were joining via livestream.67
  conference''s presentations (45 oral and 22 posters) were given.The sections in this conference report
  summarize key topics and discussions of the ENWFC-2024 within: Innovations in satellite and radar technology,
  early warnings, and crowdsourced data; Advancements in statistical and AI-based weather forecasting;
  Verification and societal impacts; and Applications.A particular focus was provided to the use of Machine
  Learning techniques and their applications in the context of the listed key topics.'
