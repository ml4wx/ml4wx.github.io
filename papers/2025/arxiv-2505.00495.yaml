summary: A Transformer predicts tropical cyclone trajectories for the next 6 hours from NOAA storm records,
  reported as more accurate and cheaper than traditional methods.
abstract: A storm is a type of extreme weather. Therefore, forecasting the path of a storm is extremely
  important for protecting human life and property. However, storm forecasting is very challenging because
  storm trajectories frequently change. In this study, we propose an improved deep learning method using
  a Transformer network to predict the movement trajectory of a storm over the next 6 hours. The storm
  data used to train the model was obtained from the National Oceanic and Atmospheric Administration (NOAA)
  [1]. Simulation results show that the proposed method is more accurate than traditional methods. Moreover,
  the proposed method is faster and more cost-effective
