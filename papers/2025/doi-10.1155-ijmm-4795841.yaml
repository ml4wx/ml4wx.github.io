summary: Hybrid VMD-ARIMA-GRU models forecast daily temperature in Nairobi, with the best model reaching
  RMSE 0.71 and R² 0.78.
abstract: Accurate temperature forecasting is of paramount importance across various sectors, influencing
  decision‐making processes and impacting numerous aspects of daily life. This study analyzes temperature
  time series data from the Nairobi County in Kenya, aiming to develop accurate hybrid time series forecasting
  models. Initial statistical tests revealed significant nonstationarity and nonlinearity in the data,
  prompting the adoption of specialized modeling techniques. Using variational mode decomposition (VMD),
  the raw time series was decomposed into interpretable components, enhancing feature representation and
  understanding of temperature dynamics. Hybrid forecasting models were then constructed by integrating
  VMD with both statistical (autoregressive integrated moving average [ARIMA]) and deep learning (gated
  recurrent unit [GRU], long short‐term memory [LSTM], and Transformer) architectures. Evaluation metrics,
  including root mean squared error (RMSE), mean absolute error (MAE), mean absolute percentage error
  (MAPE), and R ‐squared, highlighted the superiority of hybrid models over individual approaches, particularly
  those combining VMD with ARIMA, GRU, LSTM, and Transformer. The experimental results for temperature
  prediction show that the hybrid models combining VMD with statistical and deep learning networks achieved
  improved forecasting accuracy compared with baseline models. Specifically, the VMD–ARIMA–GRU model emerged
  as the top performer, demonstrating the lowest error metrics and highest explanatory power. With a low
  RMSE of 0.710090, MAE of 0.561726, and MAPE of 2.808193%, the model demonstrates remarkable accuracy
  in predicting temperature values. In addition, the high R‐squared value of 0.779234 indicates that approximately
  77.92% of the variance in the observed data is explained by the model, showcasing its robustness and
  effectiveness in capturing the underlying patterns in temperature time series data. Overall, this study
  underscores the importance of VMD in preprocessing data to enhance feature representation and forecasting
  accuracy. By combining statistical and deep learning methods, hybrid models incorporating VMD offer
  a comprehensive solution for accurate temperature prediction, with implications for climate modeling
  and environmental monitoring.
