summary: Proposes MSRGAN, a multi-scale residual GAN that downscales WRF precipitation over the US and
  improves heavy-precipitation detection.
abstract: To address the challenge of insufficient spatial resolution in remote sensing precipitation
  data, this paper proposes a novel Multi-Scale Residual Generative Adversarial Network (MSRGAN) for reconstructing
  high-resolution precipitation images. The model integrates multi-source meteorological information and
  topographic priors, and it employs a Deep Multi-Scale Perception Module (DeepInception), a Multi-Scale
  Feature Modulation Module (MSFM), and a Spatial-Channel Attention Network (SCAN) to achieve high-fidelity
  restoration of complex precipitation structures. Experiments conducted using Weather Research and Forecasting
  (WRF) simulation data over the continental United States demonstrate that MSRGAN outperforms traditional
  interpolation methods and state-of-the-art deep learning models across various metrics, including Critical
  Success Index (CSI), Heidke Skill Score (HSS), False Alarm Rate (FAR), and Jensen–Shannon divergence.
  Notably, it exhibits significant advantages in detecting heavy precipitation events. Ablation studies
  further validate the effectiveness of each module. The results indicate that MSRGAN not only improves
  the accuracy of precipitation downscaling but also preserves spatial structural consistency and physical
  plausibility, offering a novel technological approach for urban flood warning, weather forecasting,
  and regional hydrological modeling.
