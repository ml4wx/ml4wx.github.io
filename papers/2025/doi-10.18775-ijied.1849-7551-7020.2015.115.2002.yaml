summary: XGBoost, SVR and LSTM predict global temperature anomalies from historical records; LSTM performs
  best but test window spans only 2-3 years.
abstract: This study investigates the use of machine learning methods to predict global temperature anomalies
  in the context of anthropogenic climate change. The research uses a comprehensive dataset comprising
  historical temperature records, greenhouse gas concentrations, sea level trends, and key atmospheric
  and oceanic indices to evaluate the predictive capabilities of three time series models (XGBoost, SVR,
  and LSTM). The dataset, compiled from several authoritative sources, underwent rigorous preprocessing,
  including imputation, interpolation, and correlation-based feature selection. The models were trained
  and validated using a time series cross-validation approach and evaluated using standard error metrics
  such as MAPE, RMSE, and MAE. Due to data limitations, the test dataset spans only about 2-3 years, so
  any assessment of long-term trends in model performance should be interpreted conceptually. Taking this
  into account, the LSTM network demonstrated the best forecast performance, especially in capturing long-term
  warming trends, while the SVR model showed comparable results with slightly lower precision. The XGBoost
  model showed a tendency to underperform, particularly in its ability to represent values at the extremes
  of the data distribution. Despite the limitations of the models in fully capturing short-term fluctuations
  or extreme anomalies, the results underscore the potential of deep learning approaches, particularly
  LSTM, for improving climate forecasts. The results of the study suggest that machine learning has the
  potential to be a valuable complement to traditional physical climate models but cannot completely replace
  them. The research suggests that machine learning models could be trained primarily with input and output
  data from established climate models in the future in order to quickly and efficiently reproduce the
  results of climate models and analyze various climate scenarios.
