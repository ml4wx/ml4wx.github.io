summary: ML interpolates Hong Kong radiosonde and ERA5 data to estimate cloud liquid water content profiles
  with improved accuracy.
abstract: Accurate prediction of Cloud Liquid Water Content (CLWC) is important in atmospheric science
  for understanding and forecasting weather phenomena, particularly in locations with complex microclimates.
  We cross-validated the Medium-Range Weather Forecasts (ECMWF) ERA5 data with high-precision radiosonde
  observations from the Hong Kong area. Machine learning (ML) techniques are used for interpolating radiosonde
  data to enhance data coverage and resolution and estimate CLWC. This is complemented by applying a metaheuristic
  algorithm for data cleansing, which enhances the correlation between the input features - temperature,
  pressure levels, relative humidity, and specific humidity - and the CLWC. Our approach, tested against
  various ML algorithms for robustness and performance, demonstrates marked improvements in the accuracy
  and reliability of CLWC profiles.The methodology developed is designed to be applicable beyond Hong
  Kong's unique atmospheric conditions, demonstrating how similar machine learning approaches can be adapted
  for various climates globally. This enhances weather prediction models worldwide, highlighting the global
  significance of this work in atmospheric science.
