summary: Machine learning links weekly weather and air-pollution anomalies to mortality across 550 European
  regions, with temperature features most influential and a heat-wave harvesting effect.
abstract: Abstract Using fine-grained, publicly available data, this article studies the short-term association
  between environmental factors, i.e. weather and air pollution characteristics, and weekly mortality
  rates in small European regions. Hereto, we develop a mortality modelling framework where a baseline
  model captures a region-specific, seasonal trend observed within the historical weekly mortality rates.
  Using a machine learning algorithm, we then explain deviations from this baseline using features constructed
  from environmental data that capture anomalies and extreme events. We illustrate our proposed modelling
  framework through a case study on more than 550 NUTS 3 regions (Nomenclature of Territorial Units for
  Statistics, level 3) in 20 European countries. We show that temperature-related features are most influential
  in explaining mortality deviations from the baseline over short time periods. Furthermore, we find that
  environmental features prove particularly beneficial in southern regions for explaining elevated levels
  of mortality, and we observe evidence of a harvesting effect related to heat waves.
