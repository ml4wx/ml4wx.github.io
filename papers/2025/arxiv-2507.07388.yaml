summary: Graph transformer predicts Greenland internal ice layer thickness from radar images, achieving
  lower errors than baseline graph neural networks; relevant to snow accumulation monitoring.
abstract: Gaining a deeper understanding of the thickness and variability of internal ice layers in Radar
  imagery is essential in monitoring the snow accumulation, better evaluating ice dynamics processes,
  and minimizing uncertainties in climate models. Radar sensors, capable of penetrating ice, capture detailed
  radargram images of internal ice layers. In this work, we introduce GRIT, graph transformer for ice
  layer thickness. GRIT integrates an inductive geometric graph learning framework with an attention mechanism,
  designed to map the relationships between shallow and deeper ice layers. Compared to baseline graph
  neural networks, GRIT demonstrates consistently lower prediction errors. These results highlight the
  attention mechanism's effectiveness in capturing temporal changes across ice layers, while the graph
  transformer combines the strengths of transformers for learning long-range dependencies with graph neural
  networks for capturing spatial patterns, enabling robust modeling of complex spatiotemporal dynamics.
