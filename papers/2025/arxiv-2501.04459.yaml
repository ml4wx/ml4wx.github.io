summary: Mask R-CNN with transfer learning maps clouds in Cassini images of Titan, giving automated area
  and centroid measures comparable to Earth cloud studies.
abstract: Despite widespread adoption of deep learning models to address a variety of computer vision
  tasks, planetary science has yet to see extensive utilization of such tools to address its unique problems.
  On Titan, the largest moon of Saturn, tracking seasonal trends and weather patterns of clouds provides
  crucial insights into one of the most complex climates in the Solar System, yet much of the available
  image data are still analyzed in a conventional way. In this work, we apply a Mask R-CNN trained via
  transfer learning to perform instance segmentation of clouds in Titan images acquired by the Cassini
  spacecraft - a previously unexplored approach to a big data problem in planetary science. We demonstrate
  that an automated technique can provide quantitative measures for clouds, such as areas and centroids,
  that may otherwise be prohibitively time-intensive to produce by human mapping. Furthermore, despite
  Titan specific challenges, our approach yields accuracy comparable to contemporary cloud identification
  studies on Earth and other worlds. We compare the efficiencies of human-driven versus algorithmic approaches,
  showing that transfer learning provides speed-ups that may open new horizons for data investigation
  for Titan. Moreover, we suggest that such approaches have broad potential for application to similar
  problems in planetary science where they are currently under-utilized. Future planned missions to the
  planets and remote sensing initiatives for the Earth promise to provide a deluge of image data in the
  coming years that will benefit strongly from leveraging machine learning approaches to perform the analysis.
