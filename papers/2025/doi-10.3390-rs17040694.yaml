summary: Compares gradient boosting, random forest, GP, neural networks and stacking to fill cloud gaps
  in IASI land surface temperature over the Po Valley.
abstract: Retrieving LST from infrared spectral observations is challenging because it needs separation
  from emissivity in surface radiation emission, which is feasible only when the state of the surface–atmosphere
  system is known. Thanks to its high spectral resolution, the Infrared Atmospheric Sounding Interferometer
  (IASI) instrument onboard Metop polar-orbiting satellites is the only sensor that can simultaneously
  retrieve LST, the emissivity spectrum, and atmospheric composition. Still, it cannot penetrate thick
  cloud layers, making observations blind to surface emissions under cloudy conditions, with surface and
  atmospheric parameters being flagged as voids. The present paper aims to discuss a downscaling–fusion
  methodology to retrieve LST missing values on a spatial field retrieved from spatially scattered IASI
  observations to yield level 3, regularly gridded data, using as proxy data LST from the Spinning Enhanced
  Visible and Infrared Imager (SEVIRI) flying on Meteosat Second Generation (MSG) platform, a geostationary
  instrument, and from the Advanced Very High-Resolution Radiometer (AVHRR) onboard Metop polar-orbiting
  satellites. We address this problem by using machine learning techniques, i.e., Gradient Boosting, Random
  Forest, Gaussian Process Regression, Neural Network, and Stacked Regression. We applied the methodology
  over the Po Valley region, a very heterogeneous area that allows addressing the trained models’ robustness.
  Overall, the methods significantly enhanced spatial sampling, keeping errors in terms of Root Mean Square
  Error (RMSE) and bias (Mean Absolute Error, MAE) very low. Although we demonstrate and assess the results
  primarily using IASI data, the paper is also intended for applications to the IASI follow-on, that is,
  IASI Next Generation (IASI-NG), and much more to the Infrared Sounder (IRS), which is planned to fly
  this year, 2025, on the Meteosat Third Generation platform (MTG).
