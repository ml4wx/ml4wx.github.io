summary: Deep learning on six airport weather stations at Madeira predicts wind speed and direction 30
  minutes ahead at 1-minute resolution, with 0.78 m/s speed MAE for aviation use.
abstract: This study introduces a high-resolution wind nowcasting model designed for aviation applications
  at Madeira International Airport, a location known for its complex wind patterns. By using data from
  a network of six meteorological stations and deep learning techniques, the produced model is capable
  of predicting wind speed and direction up to 30-minute ahead with 1-minute temporal resolution. The
  optimized architecture demonstrated robust predictive performance across all forecast horizons. For
  the most challenging task, the 30-minute ahead forecasts, the model achieved a wind speed Mean Absolute
  Error (MAE) of 0.78 m/s and a wind direction MAE of 33.06°. Furthermore, the use of Gaussian noise concatenation
  to both input and label training data yielded the most consistent results. A case study further validated
  the model's efficacy, with MAE values below 0.43 m/s for wind speed and between 33.93° and 35.03° for
  wind direction across different forecast horizons. This approach shows that combining strategically
  deployed sensor networks with machine learning techniques offers improvements in wind nowcasting for
  airports in complex environments, possibly enhancing operational efficiency and safety.
