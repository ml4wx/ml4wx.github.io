summary: Review of climate model emulators, from linear regression and Gaussian processes to machine learning,
  with guidance on fitness for purpose.
abstract: Demand for climate information for research and decisionmaking has outpaced the ability of computationally
  intensive Earth System Models (ESMs) to provide targeted climate projections, particularly where a diverse
  range of users require output tailored to their specific needs.Emulators of these ESMs -computational
  tools significantly more efficient than the original models they are trained on -have the potential
  to produce such information and have seen an accelerated period of development.The most recent generation
  of emulators are diverse in their methods, degree of complexity, inputs required and scope of their
  outputs.Some emulators produce only patterns of average quantities, targeting the response to anthropogenic
  forcings of the climate system, while others tackle the simulation of quantities at high temporal and
  spatial frequency, accounting for the effect of the chaotic dynamics of the climate system, its internal
  variability.Some focus on single climate variables, while others tackle the emulation of a number of
  them.We survey and categorize different methods of implementation and their advantages and limitations,
  including statistical approaches of various levels of complexity, from simple linear regression to Gaussian
  process modeling, and methods drawn from computational advances in machine learning.We discuss how a
  user's choice of emulator, based on different methods, inputs, and outputs available, might influence
  its fit for purpose for research in climate and sustainability science.We also identify gaps and research
  needs that could inform future development of more useful and relevant emulators.
