summary: SynCast applies diffusion preference optimization to radar precipitation nowcasting, cutting
  false alarms first then raising CSI, to resolve the CSI-FAR trade-off.
abstract: Precipitation nowcasting based on radar echoes plays a crucial role in monitoring extreme weather
  and supporting disaster prevention. Although deep learning approaches have achieved significant progress,
  they still face notable limitations. For example, deterministic models tend to produce over-smoothed
  predictions, which struggle to capture extreme events and fine-scale precipitation patterns. Probabilistic
  generative models, due to their inherent randomness, often show fluctuating performance across different
  metrics and rarely achieve consistently optimal results. Furthermore, precipitation nowcasting is typically
  evaluated using multiple metrics, some of which are inherently conflicting. For instance, there is often
  a trade-off between the Critical Success Index (CSI) and the False Alarm Ratio (FAR), making it challenging
  for existing models to deliver forecasts that perform well on both metrics simultaneously. To address
  these challenges, we introduce preference optimization into precipitation nowcasting for the first time,
  motivated by the success of reinforcement learning from human feedback in large language models. Specifically,
  we propose SynCast, a method that employs the two-stage post-training framework of Diffusion Sequential
  Preference Optimization (Diffusion-SPO), to progressively align conflicting metrics and consistently
  achieve superior performance. In the first stage, the framework focuses on reducing FAR, training the
  model to effectively suppress false alarms. Building on this foundation, the second stage further optimizes
  CSI with constraints that preserve FAR alignment, thereby achieving synergistic improvements across
  these conflicting metrics.
