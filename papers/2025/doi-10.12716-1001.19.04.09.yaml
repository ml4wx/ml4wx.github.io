summary: Compares ARIMA, random forest, SVM and ANN for maritime weather variables, finding ARIMA and
  regression most accurate for air temperature.
abstract: 'Objectives: This study aims to develop an AI-based early warning system for maritime navigation
  by integrating machine learning techniques to predict weather conditions and assess navigation risks.
  The research focuses on improving forecasting accuracy for key meteorological and oceanographic variables
  to enhance navigational safety. Theoretical Framework: The study is grounded in predictive analytics
  and artificial intelligence applications in maritime risk assessment. It leverages machine learning
  models, including ARIMA, Random Forest, SVM, and Artificial Neural Networks, to enhance the accuracy
  of weather and sea condition forecasts, providing valuable insights for maritime operations. Method:
  The research employs a data-driven approach, utilizing historical meteorological and oceanographic data
  to train and evaluate machine learning models. Variables such as air temperature, wind speed, sea temperature,
  rainfall, and air pressure are analyzed using regression, time-series analysis, and statistical modeling
  techniques to develop an effective predictive system. Results and Discussion: The findings reveal that
  AI models, particularly ARIMA and regression analysis, demonstrate high predictive capability for air
  temperature variations. However, dataset limitations and model parameter tuning impact accuracy. The
  results highlight the importance of selecting appropriate variables and optimizing model structures
  to improve forecasting reliability. Research Implications: The study contributes to maritime safety
  by providing a framework for real-time weather forecasting and risk assessment. The findings can inform
  decision-making in vessel operations and policy development for maritime safety regulations. Originality/Value:
  This research integrates AI and predictive analytics to enhance maritime navigation safety, addressing
  gaps in real-time risk assessment and forecasting. The proposed framework provides a foundation for
  further advancements in AI-driven maritime decision support systems.'
