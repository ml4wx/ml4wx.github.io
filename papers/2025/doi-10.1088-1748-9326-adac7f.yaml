summary: Calibrated machine learning with satellite pre-storm sea surface salinity improves tropical cyclone
  rapid intensification probability forecasts in several ocean basins.
abstract: Abstract Forecasting rapid intensification (RI) of tropical cyclones (TC) is a mission known
  for large errors. One under-researched factor that affects TC intensification is salinity, which is
  important for density stratification in certain ocean regions and can affect the surface enthalpy flux
  under a strengthening hurricane. To investigate the impact and efficacy of using salinity information
  in state-of-the-art forecasting, we use a statistical model consisting of a variety of machine learning
  (ML) methods. For salinity data, we use satellite measurements of pre-storm sea surface salinity (SSS)
  as a proxy for the salinity stratification. We train and test the model on various ocean basins, including
  the Atlantic, eastern North Pacific and western North Pacific. A calibrator is trained on top of the
  ML models to correct and enhance probability forecasts. The calibrator significantly improves probability
  forecasts relative to recent works. The ML model performance is improved with the addition of SSS in
  the Eastern North Pacific, western North Pacific, and the Caribbean subregion of the North Atlantic,
  and the overall model performance is better than previous studies. SSS decreases model skill for a model
  trained on the full Atlantic basin. In the Indian Ocean, SSS is also notably correlated with RI occurrence,
  but the TC samples are not sufficient to train ML models.
