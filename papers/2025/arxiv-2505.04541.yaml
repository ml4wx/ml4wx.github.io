summary: Compares an AI-based ensemble filter with LETKF in a surface quasi-geostrophic model, showing
  how analysis error responds to observation number, distribution and nonlinearity.
abstract: Recent advances in data assimilation (DA) have focused on developing more flexible approaches
  that can better accommodate nonlinearities in models and observations. However, it remains unclear how
  the performance of these advanced methods depends on the observation network characteristics. In this
  study, we present initial experiments with the surface quasi-geostrophic model, in which we compare
  a recently developed AI-based ensemble filter with the standard Local Ensemble Transform Kalman Filter
  (LETKF). Our results show that the analysis solutions respond differently to the number, spatial distribution,
  and nonlinear fraction of assimilated observations. We also find notable changes in the multiscale characteristics
  of the analysis errors. Given that standard DA techniques will be eventually replaced by more advanced
  methods, we hope this study sets the ground for future efforts to reassess the value of Earth observation
  systems in the context of newly emerging algorithms.
