summary: Monte Carlo masked autoencoder fills gaps in lidar and radar atmospheric profiles, restoring
  fine convective structures and providing per-pixel uncertainty maps.
abstract: Accurate atmospheric profiles from remote sensing instruments such as Doppler Lidar, Radar,
  and radiometers are frequently corrupted by low-SNR (Signal to Noise Ratio) gates, range folding, and
  spurious discontinuities. Traditional gap filling blurs fine-scale structures, whereas deep models lack
  confidence estimates. We present CuMoLoS-MAE, a Curriculum-Guided Monte Carlo Stochastic Ensemble Masked
  Autoencoder designed to (i) restore fine-scale features such as updraft and downdraft cores, shear lines,
  and small vortices, (ii) learn a data-driven prior over atmospheric fields, and (iii) quantify pixel-wise
  uncertainty. During training, CuMoLoS-MAE employs a mask-ratio curriculum that forces a ViT decoder
  to reconstruct from progressively sparser context. At inference, we approximate the posterior predictive
  by Monte Carlo over random mask realisations, evaluating the MAE multiple times and aggregating the
  outputs to obtain the posterior predictive mean reconstruction together with a finely resolved per-pixel
  uncertainty map. Together with high-fidelity reconstruction, this novel deep learning-based workflow
  enables enhanced convection diagnostics, supports real-time data assimilation, and improves long-term
  climate reanalysis.
