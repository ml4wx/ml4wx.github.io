summary: Stacked ML ensemble with a physics-based sensitivity term projects pan-Arctic permafrost loss
  of about 20 percentage points under RCP8.5 warming for infrastructure risk.
abstract: 'Arctic warming threatens over 100 billion in permafrost-dependent infrastructure across Northern
  territories, yet existing risk assessment frameworks lack spatiotemporal validation, uncertainty quantification,
  and operational decision-support capabilities. We present a hybrid physics-machine learning framework
  integrating 2.9 million observations from 171,605 locations (2005-2021) combining permafrost fraction
  data with climate reanalysis. Our stacked ensemble model (Random Forest + Histogram Gradient Boosting
  + Elastic Net) achieves R2=0.980 (RMSE=5.01 pp) with rigorous spatiotemporal cross-validation preventing
  data leakage. To address machine learning limitations in extrapolative climate scenarios, we develop
  a hybrid approach combining learned climate-permafrost relationships (60%) with physical permafrost
  sensitivity models (40%, -10 pp/C). Under RCP8.5 forcing (+5C over 10 years), we project mean permafrost
  fraction decline of -20.3 pp (median: -20.0 pp), with 51.5% of Arctic Russia experiencing over 20 percentage
  point loss. Infrastructure risk classification identifies 15% high-risk zones (25% medium-risk) with
  spatially explicit uncertainty maps. Our framework represents the largest validated permafrost ML dataset
  globally, provides the first operational hybrid physics-ML forecasting system for Arctic infrastructure,
  and delivers open-source tools enabling probabilistic permafrost projections for engineering design
  codes and climate adaptation planning. The methodology is generalizable to other permafrost regions
  and demonstrates how hybrid approaches can overcome pure data-driven limitations in climate change applications.'
