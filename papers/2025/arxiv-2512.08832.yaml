summary: WAAPO crafts sparse, smooth adversarial perturbations that steer FourCastNet forecasts toward
  chosen targets on ERA5, exposing vulnerabilities in AI weather models.
abstract: With the increasing reliance on AI models for weather forecasting, it is imperative to evaluate
  their vulnerability to adversarial perturbations. This work introduces Weather Adaptive Adversarial
  Perturbation Optimization (WAAPO), a novel framework for generating targeted adversarial perturbations
  that are both effective in manipulating forecasts and stealthy to avoid detection. WAAPO achieves this
  by incorporating constraints for channel sparsity, spatial localization, and smoothness, ensuring that
  perturbations remain physically realistic and imperceptible. Using the ERA5 dataset and FourCastNet
  (Pathak et al. 2022), we demonstrate WAAPO's ability to generate adversarial trajectories that align
  closely with predefined targets, even under constrained conditions. Our experiments highlight critical
  vulnerabilities in AI-driven forecasting models, where small perturbations to initial conditions can
  result in significant deviations in predicted weather patterns. These findings underscore the need for
  robust safeguards to protect against adversarial exploitation in operational forecasting systems.
