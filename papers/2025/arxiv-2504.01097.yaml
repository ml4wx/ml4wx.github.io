summary: Extended convolutional autoencoder with reservoir computing yields reduced-order atmospheric
  flow predictions with under 1% error in 2D and 8% in 3D benchmarks.
abstract: Forecasting atmospheric flows with traditional discretization methods, also called full order
  methods (e.g., finite element methods or finite volume methods), is computationally expensive. We propose
  to reduce the computational cost with a Reduced Order Model (ROM) that combines Extended Convolutional
  Autoencoders (E-CAE) and Reservoir Computing (RC). Thanks to an extended network depth, the E-CAE encodes
  the high-resolution data coming from the full order method into a compact latent representation and
  can decode it back into high-resolution with 75% lower reconstruction error than standard CAEs. The
  compressed data are fed to an RC network, which predicts their evolution. The advantage of RC networks
  is a reduced computational cost in the training phase compared to conventional predictive models. We
  assess our data-driven ROM through well-known 2D and 3D benchmarks for atmospheric flows. We show that
  our ROM accurately reconstructs and predicts the future system dynamics with errors below 1% in 2D and
  8% in 3D, while significantly reducing the computational cost of a full order simulation. Compared to
  other ROMs available in the literature, such as Dynamic Mode Decomposition and Proper Orthogonal Decomposition
  with Interpolation, our ROM is as efficient but more accurate. Thus, it is a promising alternative to
  high-dimensional atmospheric simulations.
