summary: Survey of machine learning weather forecasting covering global forecasting, downscaling, extremes,
  and physics integration, with open challenges in interpretability and rare events.
abstract: Weather forecasting, a vital task for agriculture, transportation, energy, etc., has evolved
  significantly over the years. Comprehensive surveys play a crucial role in synthesizing knowledge, identifying
  trends, and addressing emerging challenges in this dynamic field. In this survey, we critically examines
  machine learning (ML)-based weather forecasting methods, which demonstrate exceptional capability in
  handling complex, high-dimensional datasets and leveraging large volumes of historical and real-time
  data, enabling the identification of subtle patterns and relationships among weather variables. Research
  on specific tasks such as global weather forecasting, downscaling, extreme weather prediction, and how
  to combine machine learning methods with physical principles are very active in the current field. However,
  several unresolved or challenging issues remain, including the interpretability of models and the ability
  to predict rare weather events. By identifying these gaps, this research provides a roadmap for advancing
  machine learning-based weather forecasting techniques to complement and enhance weather prediction results.
