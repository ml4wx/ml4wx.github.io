summary: Adding Himawari-8 cloud-phase products to multichannel deep learning improves 4-hour precipitation
  forecast CSI by 8.0% and correlation by 5.8%.
abstract: Clouds are closely related to precipitation, as their type, microphysical characteristics, and
  dynamic properties determine the intensity, duration, and form of rainfall. While geostationary satellites
  offer continuous cloud-top observations, they cannot capture the full three-dimensional structure of
  clouds, limiting the accuracy of precipitation forecasting based on geostationary satellite data. However,
  cloud–precipitation relationships contain valuable physical information that can be leveraged to improve
  forecasting performance. To further enhance the precision of satellite precipitation forecasting, this
  study proposes a multi-channel satellite precipitation forecasting method that integrates cloud classification
  products. The method combines precipitation-prior information from Himawari-8 satellite cloud classification
  products with multi-channel satellite observations to generate precipitation forecasts for the next
  four hours. This approach further exploits the potential of satellite observations in precipitation
  forecasting. Experimental results show that integrating cloud classification products improves the Critical
  Success Index by 8.0%, improves the Correlation Coefficient by 5.8%, and reduces the Mean Squared Error
  by 3.0%, but increases the MAE by 4.5%. It is proven that this method can effectively improve the accuracy
  of multi-channel satellite precipitation forecasting.
