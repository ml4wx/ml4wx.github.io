summary: An LLM agent framework automates extreme-weather diagnostic analysis from raw meteorological
  data, with a 103-event benchmark and a step-wise evaluation metric.
abstract: Extreme weather events pose escalating risks to global society, underscoring the urgent need
  to unravel their underlying physical mechanisms. Yet the prevailing expert-driven, labor-intensive diagnostic
  paradigm has created a critical analytical bottleneck, stalling scientific progress. While AI for Earth
  Science has achieved notable advances in prediction, the equally essential challenge of automated diagnostic
  reasoning remains largely unexplored. We present the Extreme Weather Expert (EWE), the first intelligent
  agent framework dedicated to this task. EWE emulates expert workflows through knowledge-guided planning,
  closed-loop reasoning, and a domain-tailored meteorological toolkit. It autonomously produces and interprets
  multimodal visualizations from raw meteorological data, enabling comprehensive diagnostic analyses.
  To catalyze progress, we introduce the first benchmark for this emerging field, comprising a curated
  dataset of 103 high-impact events and a novel step-wise evaluation metric. EWE marks a step toward automated
  scientific discovery and offers the potential to democratize expertise and intellectual resources, particularly
  for developing nations vulnerable to extreme weather.
