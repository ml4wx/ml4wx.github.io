summary: A cGAN post-processing of the ECMWF ensemble gives East African rainfall skill comparable to
  IDR-calibrated FuXi and GraphCast, and was assessed operationally in Kenya and Ethiopia.
abstract: Ensemble forecasting has proven to be a vital tool for predicting extreme, life-threatening
  or only partially predictable weather events. As well as providing probabilistic products, individual
  ensemble members provide context and realisations of possible extreme weather. However, many National
  Meteorological Services in East Africa do not have the computing resources to enable them to run their
  local area models in ensemble mode over the full period of the two-week medium range. In this paper
  we test the performance of a forecast system, comprising the global ECMWF ensemble forecast, post-processed
  using cGAN, a neural network model, and forecasts calibrated using IDR, a recent statistical method,
  against the probabilistic climatology. cGAN provides comparable levels of probabilistic skill as IDR
  applied to the ECMWF ensemble or IDR applied to the machine-learning models FuXi and GraphCast. These
  methods improve the raw ECMWF ensemble forecast substantially, which is itself an improvement on deterministic
  forecasts. The ability of cGAN to produce individual realisations of future rainfall was important when
  assessed in an operational context by the National Meteorological and Hydrological Services of Kenya
  and Ethiopia. Moreover, in common with IDR, cGAN is cheap to train/run and requires no additional post-processing.
  It is run on laptops to generate many thousands of ensemble members, making it suitable for Meteorological
  Services with limited computational facilities.
