summary: SVR with RBF kernel estimates daily wind speed in Surabaya from temperature, humidity and pressure,
  reaching R² of 0.92 on a single-city dataset.
abstract: 'This study aims to evaluate the performance of the Support Vector Regression (SVR) model with
  a Radial Basis Function (RBF) kernel in predicting wind speed. The meteorological parameters used include
  temperature, humidity, and air pressure. The data were obtained from daily weather observations in Surabaya
  City during 2022–2023, and the predictions were compared with the actual wind speed data. The research
  method involved several stages, namely data collection, preprocessing, splitting the dataset into training
  and testing sets with a ratio of 80:20, implementing the SVR-RBF model, and performance evaluation using
  MAE, MSE, and R². The results show that the SVR model has good capability in capturing the non-linear
  patterns between input and output variables, with performance evaluation yielding a Mean Absolute Error
  (MAE) of 0.25, a Mean Squared Error (MSE) of 0.14, and a Coefficient of Determination (R²) of 0.92,
  indicating that the model explains 92% of the variation in wind speed. Based on these findings, it can
  be concluded that SVR with an RBF kernel has strong potential to be applied as a reliable tool for wind
  speed prediction systems in Surabaya. Keywords: Wind Speed, Weather Prediction, Radial Basis Function
  (RBF), Support Vector Regression (SVR)'
