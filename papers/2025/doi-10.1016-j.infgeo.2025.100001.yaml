summary: Frames data assimilation and machine learning under one Bayesian MAP framework, arguing for integration
  that combines DA's physics with ML's data-driven power.
abstract: Data Assimilation (DA) and Machine Learning (ML) possess complementary strengths that are vital
  to improving state estimation and prediction in Earth system science. However, comprehensive comparisons
  of their methodologies are rare and complex. This study explores DA and ML through a mathematical framework
  based on Bayesian inference. We establish a unified framework to address state estimation and prediction,
  deriving cost functions of DA and ML using maximum a posteriori estimation. While DA and ML share similarities
  in cost function structures, they diverge in principles and applications. DA is rooted in physical models,
  while ML excels with large datasets. Despite their similarities in motivations, distinctions arise in
  equations, algorithms, cost functions, parameters, uncertainty handling, and data requirements. Integrating
  DA's theoretical robustness with ML's data leveraging capabilities is essential for advancing state
  estimation and prediction. DA can bolster ML's interpretability, while ML can boost DA's operational
  efficiency. This paper contributes to the discourse on how best to integrate these methodologies for
  improving state estimation and prediction in Earth system science. • The state estimation of DA and
  ML is reformulated by maximizing posterior probability conditioned by prior observations. • DA and ML
  differ in their methodologies; DA incorporates Earth system dynamics while ML learns from dense data.
  • DA can enhance ML's interpretability and ML can increase DA's operationability.
