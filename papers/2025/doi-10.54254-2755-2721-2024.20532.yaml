summary: Conv-Bi-LSTM model forecasts tropical cyclone trajectories from HURDAT2 best-track data, outperforming
  RNN, LSTM and GRU baselines.
abstract: Tropical cyclones are calamitous natural disasters that frequently result in severe economic
  losses. In order to enhance disaster response and management, as well as to reduce economic and humanitarian
  losses, it is imperative to forecast cyclones. This paper presents a deep learning approach using a
  Conv-Bi-LSTM model to forecast cyclone trajectories utilizing the HURDAT2 dataset. By integrating Convolutional
  layers with Bidirectional LSTM networks, the model effectively captures both spatial and temporal patterns
  in the data. After comparing with basic RNN, LSTM and GRU, proposed model illustrates better accuracy
  in trajectory predictions, even with relative complex routes. And thus, the proposed solution possesses
  potential in cyclone prediction so as to reinforce disaster responsiveness and further management.
