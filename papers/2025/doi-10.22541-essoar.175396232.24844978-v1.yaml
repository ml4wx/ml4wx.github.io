summary: DBSCAN clustering combined across four hazards maps present and future multi-hazard footprints
  in Veneto under RCP4.5 and RCP8.5.
abstract: Understanding the complex interactions and impacts of extreme climate events on socio-economic
  and natural systems is a necessary step for developing effective risk reduction and preparedness strategies,
  particularly with extreme events driven by the combination of concurrent and cascading hazards. This
  study aims to introduce a globally applicable, data driven methodology for identifying multi-hazard
  spatio-temporal footprints on present and future extreme events under different climate change projections.
  Four climate-dependent hazards (extreme precipitation, extreme wind, heat anomalies and droughts) are
  analysed in the Veneto Region. The occurrences of extreme events for each hazard are first clustered
  using the DBSCAN (Density Based Spatial Clustering Application with Noise) algorithm and then combined
  to analyze spatio-temporally compounding and consecutive events, using spatial overlap and time lags
  functions to create multi-hazard footprints. This approach was first applied to climate reanalysis data
  in the reference scenario (1991-2022) and then to future climate projections (2023-2070), for RCP 4.5
  and 8.5. The analysis of the multi-hazard footprints shows specific spatial trends, with wind-precipitation
  dominating the coastal areas, while heat-drought is more common along the central plains of the region.
  Moreover, there is an increasing trend in heat-drought combination across all scenarios, particularly
  during the second half of future scenario of RCP 8.5, which is also characterized by the emergence of
  novel consecutive multi-hazard combinations, such as heat-precipitation, precipitation-drought and heat-wind.
  By pin-pointing multi-hazard hotspots and their evolution in future scenarios, it can provide a first
  step for developing local climate adaptation and risk management strategies.
