summary: FengShun-CSM is an AI fully coupled climate system model giving 60-day global forecasts of 29
  variables, outperforming ECMWF S2S on most variables and MJO skill.
abstract: Climate system models (CSMs), through integrating cross-sphere interactions among the atmosphere,
  ocean, land, and cryosphere, have emerged as pivotal tools for deciphering climate dynamics and improving
  forecasting capabilities. Recent breakthroughs in artificial intelligence (AI)-driven meteorological
  modeling have demonstrated remarkable success in single-sphere systems and partially spheres coupled
  systems. However, the development of a fully coupled AI-based climate system model encompassing atmosphere-ocean-land-sea
  ice interactions has remained an unresolved challenge. This paper introduces FengShun-CSM, an AI-based
  CSM model that provides 60-day global daily forecasts for 29 critical variables across atmospheric,
  oceanic, terrestrial, and cryospheric domains. The model significantly outperforms the European Centre
  for Medium-Range Weather Forecasts (ECMWF) subseasonal-to-seasonal (S2S) model in predicting most variables,
  particularly precipitation, land surface, and oceanic components. This enhanced capability is primarily
  attributed to its improved representation of intra-seasonal variability modes, most notably the Madden-Julian
  Oscillation (MJO). Remarkably, FengShun-CSM exhibits substantial potential in predicting subseasonal
  extreme events. Such breakthroughs will advance its applications in meteorological disaster mitigation,
  marine ecosystem conservation, and agricultural productivity enhancement. Furthermore, it validates
  the feasibility of developing AI-powered CSMs through machine learning technologies, establishing a
  transformative paradigm for next-generation Earth system modeling.
