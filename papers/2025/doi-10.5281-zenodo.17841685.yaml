summary: Literature review and proposed framework on compound effects of ENSO, MJO, IOD and NAO on monsoon
  extremes, hypothesizing non-linear amplification relevant to sub-seasonal prediction.
abstract: Monsoon systems across the globe are critical components of the Earth's climate, directly influencing
  water resources, agriculture, and socio-economic stability for billions. In recent decades, an increasing
  trend in the frequency and intensity of monsoon-related extreme events, such as severe floods and prolonged
  droughts, has been observed, posing significant challenges to regional resilience and adaptation efforts.
  While individual large-scale climate drivers like the El Ni~no-Southern Oscillation (ENSO), Madden-Julian
  Oscillation (MJO), Indian Ocean Dipole (IOD), and North Atlantic Oscillation (NAO) are known to modulate
  monsoon variability, their isolated impacts often fall short in explaining the full spectrum and severity
  of observed extremes. This paper investigates the synergistic interactions among these four prominent
  climate drivers and their compound effects on shaping monsoon extremes. We hypothesize that non-linear,
  multi-scale interactions between these drivers create unique atmospheric configurations that significantly
  amplify or mitigate extreme rainfall and dry spells, leading to compound climate events that are more
  severe than when any single driver acts alone. Through a comprehensive review of existing literature
  and a proposed methodological framework integrating observational data and reanalysis products with
  advanced statistical and machine learning techniques, this study aims to elucidate the intricate teleconnections
  and physical mechanisms underpinning these synergistic relationships. Understanding these compound climate
  drivers is paramount for enhancing sub-seasonal to seasonal monsoon prediction capabilities, improving
  climate change projections, and developing more effective strategies for disaster risk reduction in
  vulnerable monsoon-dependent regions.
