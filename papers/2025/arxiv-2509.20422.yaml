summary: mloz is a machine-learning ozone parameterization that runs about 31 times faster than UKESM
  chemistry, enables interactive ozone in CMIP-style runs and transfers to ICON.
abstract: Atmospheric ozone is a crucial absorber of solar radiation and an important greenhouse gas.
  However, most climate models participating in the Coupled Model Intercomparison Project (CMIP) still
  lack an interactive representation of ozone due to the high computational costs of atmospheric chemistry
  schemes. Here, we introduce a machine learning parameterization (mloz) to interactively model daily
  ozone variability and trends across the troposphere and stratosphere in standard climate sensitivity
  simulations, including two-way interactions of ozone with the Quasi-Biennial Oscillation. We demonstrate
  its high fidelity on decadal timescales and its flexible use online across two different climate models
  -- the UK Earth System Model (UKESM) and the German ICOsahedral Nonhydrostatic (ICON) model. With atmospheric
  temperature profile information as the only input, mloz produces stable ozone predictions around 31
  times faster than the chemistry scheme in UKESM, contributing less than 4 percent of the respective
  total climate model runtimes. In particular, we also demonstrate its transferability to different climate
  models without chemistry schemes by transferring the parameterization from UKESM to ICON. This highlights
  the potential for widespread adoption in CMIP-level climate models that lack interactive chemistry for
  future climate change assessments, particularly when focusing on climate sensitivity simulations, where
  ozone trends and variability are known to significantly modulate atmospheric feedback processes.
