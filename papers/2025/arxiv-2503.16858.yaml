summary: MTBench pairs text news and time series across finance and weather domains to test LLM reasoning;
  weather is one of two domains, with temperature records and forecasting tasks.
abstract: Understanding the relationship between textual news and time-series evolution is a critical
  yet under-explored challenge in applied data science. While multimodal learning has gained traction,
  existing multimodal time-series datasets fall short in evaluating cross-modal reasoning and complex
  question answering, which are essential for capturing complex interactions between narrative information
  and temporal patterns. To bridge this gap, we introduce Multimodal Time Series Benchmark (MTBench),
  a large-scale benchmark designed to evaluate large language models (LLMs) on time series and text understanding
  across financial and weather domains. MTbench comprises paired time series and textual data, including
  financial news with corresponding stock price movements and weather reports aligned with historical
  temperature records. Unlike existing benchmarks that focus on isolated modalities, MTbench provides
  a comprehensive testbed for models to jointly reason over structured numerical trends and unstructured
  textual narratives. The richness of MTbench enables formulation of diverse tasks that require a deep
  understanding of both text and time-series data, including time-series forecasting, semantic and technical
  trend analysis, and news-driven question answering (QA). These tasks target the model's ability to capture
  temporal dependencies, extract key insights from textual context, and integrate cross-modal information.
  We evaluate state-of-the-art LLMs on MTbench, analyzing their effectiveness in modeling the complex
  relationships between news narratives and temporal patterns. Our findings reveal significant challenges
  in current models, including difficulties in capturing long-term dependencies, interpreting causality
  in financial and weather trends, and effectively fusing multimodal information.
