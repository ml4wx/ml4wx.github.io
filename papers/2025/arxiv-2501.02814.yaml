summary: An autoencoder-enhanced analogue forecast system using ERA5 and ECMWF output improves 9-day daily
  rain-class forecasts for Hong Kong, especially for heavy rain.
abstract: 'In the Hong Kong Observatory, the Analogue Forecast System (AFS) for precipitation has been
  providing useful reference in predicting possible daily rainfall scenarios for the next 9 days, by identifying
  historical cases with similar weather patterns to the latest output from the deterministic model of
  the European Centre for Medium-Range Weather Forecasts (ECMWF). Recent advances in machine learning
  allow more sophisticated models to be trained using historical data and the patterns of high-impact
  weather events to be represented more effectively. As such, an enhanced AFS has been developed using
  the deep learning technique autoencoder. The datasets of the fifth generation of the ECMWF Reanalysis
  (ERA5) are utilised where more meteorological elements in higher horizontal, vertical and temporal resolutions
  are available as compared to the previous ECMWF reanalysis products used in the existing AFS. The enhanced
  AFS features four major steps in generating the daily rain class forecasts: (1) preprocessing of gridded
  ERA5 and ECMWF model forecast, (2) feature extraction by the pretrained autoencoder, (3) application
  of optimised feature weightings based on historical cases, and (4) calculation of the final rain class
  from a weighted ensemble of top analogues. The enhanced AFS demonstrates a consistent and superior performance
  over the existing AFS, especially in capturing heavy rain cases, during the verification period from
  2019 to 2022. This paper presents the detailed formulation of the enhanced AFS and discusses its advantages
  and limitations in supporting precipitation forecasting in Hong Kong.'
