summary: A metamodel-aided joint probability method uses machine learning to improve hurricane coastal
  hazard estimates where historical intense-storm observations are scarce.
abstract: The quantification of coastal hazards caused by tropical cyclones (TCs) faces challenges due
  to insufficient historical observations, particularly for intense hurricanes, and other data limitations.
  In the wake of Hurricane Katrina in 2005, a hybrid probabilistic/process-based modeling approach known
  as the Joint Probability Method (JPM) went through in-depth scruntinity and significant improvements,
  spurred by the Interagency Performance Evaluation Taskforce (IPET 2009). As a result of this forensic
  study, IPET developed the JPM with Optimal Sampling (JPM-OS) technique for the analysis of extreme coastal
  flooding resulting from hurricanes. This collaborative effort involved several U.S. federal agencies,
  the private sector, and academic researchers. The IPET’s JPM-OS became a standard for U.S. federal agencies,
  including the U.S. Army Corps of Engineers (USACE) and the Federal Emergency Management Agency (FEMA),
  for assessing coastal storm risks in areas susceptible to hurricanes. However, this led to the development
  of two distinct JPM-OS variants, each with different advantantages and limitations. Since then, JPM
  has informed numerous storm surge and hurricane hazard studies led by the federal government, academia,
  and private sector. During the last decade, considerable effort was made to address limitations of existing
  JPM-OS approaches. Advancements in multi-variate statistics and machine learning (ML) led to the development
  of a more robust version of the JPM called JPM Aided by Metamodel Prediction (JPM-AMP).
