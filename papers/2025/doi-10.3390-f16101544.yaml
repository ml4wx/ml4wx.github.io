summary: Machine learning with structural equation modelling shows temperature and vapour pressure deficit
  drive tropical Asian fire behaviour and carbon emissions, varying by forest type.
abstract: Forest fires significantly impact the global climate through carbon emissions, yet the multi-scale
  coupling mechanisms among meteorological factors, fire behavior, and emissions remain uncertain. Focusing
  on tropical Asia, this study integrated satellite-based fire behavior products, meteorological datasets,
  and emission factors, and employed machine learning together with structural equation modeling (SEM)
  to explore the mediating role of fire behavior in the meteorological regulation of carbon emissions.
  The results revealed significant differences among vegetation types in both carbon emission intensity
  and sensitivity to meteorological drivers. For example, average gas emissions (GEs) and particle emissions
  (PEs) in mixed forests (MF, 323.68 g/m2/year for GE and 0.73 g/m2/year for PE) were approximately 172%
  and 151% higher, respectively, than those in evergreen broadleaf forests (EBF, 118.92 g/m2/year for
  GE and 0.29 g/m2/year for PE), which exhibited the lowest emission intensity. Mixed forests and deciduous
  broadleaf forests exhibited stronger meteorological regulation effects, whereas evergreen broadleaf
  forests were comparatively stable. Temperature and vapor pressure deficit emerged as the core drivers
  of fire behavior and carbon emissions, exerting indirect control through fire behavior. Overall, the
  findings highlight fire behavior as a critical link between meteorological conditions and carbon emissions,
  with ecosystem-specific differences determining the responsiveness of carbon emissions to meteorological
  drivers. These insights provide theoretical support for improving the accuracy of wildfire emission
  simulations in climate models and for developing vegetation-specific fire management and climate adaptation
  strategies.
