summary: Deep learning reconstructs AMOC strength from 1900 using climate model simulations, finding a
  21st-century decline consistent with models and 26.5°N observations, unlike older SST-based indices.
abstract: Abstract Gaining knowledge of the past and present variations of the Atlantic meridional overturning
  circulation (AMOC) is crucial for the development of accurate future climate projections. The short
  range covered by direct AMOC observations, inconsistent paleoclimate records, and scattered hydrographic
  data are insufficient to realistically reconstruct the AMOC strength since 1900. An AMOC proxy index
  based on sea surface temperatures suggests that the AMOC has declined by 15% since the late 19th century
  but this index received extensive scientific criticism. Here, we use a deep learning algorithm and climate
  model simulations to accurately reconstruct the AMOC strength between 20° N and 60° N since 1900. In
  contrast with the existing indices, our reconstructions are well in agreement with AMOC strength variations
  simulated by climate models and direct observations at 26.5° N. Our novel set of AMOC reconstructions
  contribute to a larger confidence in 21st century AMOC decline projections from climate models.
