summary: NWS adapts LLM-based neural machine translation for weather products, with Spanish and Chinese
  warnings and forecasts in development; a weather-communication application.
abstract: To advance a Weather-Ready Nation, the National Weather Service (NWS) is developing a systematic
  translation program to better serve the 68.8 million people in the U.S. who do not speak English at
  home. This article outlines the foundation of an automated translation tool for NWS products, powered
  by artificial intelligence. The NWS has partnered with LILT, whose patented training process enables
  large language models (LLMs) to adapt neural machine translation (NMT) tools for weather terminology
  and messaging. Designed for scalability across Weather Forecast Offices (WFOs) and National Centers,
  the system is currently being developed in Spanish, Simplified Chinese, Vietnamese, and other widely
  spoken non-English languages. Rooted in best practices for multilingual risk communication, the system
  provides accurate, timely, and culturally relevant translations, significantly reducing manual translation
  time and easing operational workloads across the NWS. To guide the distribution of these products, GIS
  mapping was used to identify language needs across different NWS regions, helping prioritize resources
  for the communities that need them most. We also integrated ethical AI practices throughout the program's
  design, ensuring that transparency, fairness, and human oversight guide how automated translations are
  created, evaluated, and shared with the public. This work has culminated into a website featuring experimental
  multilingual NWS products, including translated warnings, 7-day forecasts, and educational campaigns,
  bringing the country one step closer to a national warning system that reaches all Americans.
