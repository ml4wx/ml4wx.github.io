summary: A 3D U-Net reconstructs Korean atmospheric refractivity from 11 radiosonde stations (r=0.846),
  running in 0.3 s, thousands of times faster than 4D-Var.
abstract: In this study, we propose a deep learning-based data assimilation method for the real-time reconstruction
  of 3D atmospheric refractivity over the Korean Peninsula from radiosonde observations. Using a 3D U-Net-based
  CNN model, we reconstructed the atmospheric state across the entire Korean Peninsula on a 53×43×37 grid
  using data from only 11 observation stations (0.48 % of the total grid points). The model, trained on
  394,488 ERA5 reanalysis datasets from 1980 to 2024, achieved an average correlation coefficient of 0.846
  for five meteorological variables, outperforming traditional spatial interpolation methods. Notably,
  relative humidity, crucial for atmospheric refractivity calculations, achieved an RMSE of 14.8 %, meeting
  practical requirements. Furthermore, the model performs inference within 0.3 seconds—thousands of times
  faster than 4D-Var—even with limited computing resources (4 GB memory). Based on this performance and
  computational efficiency, the proposed model provides a practical solution for applications requiring
  real-time atmospheric environment, such as electronic warfare and radar operations.
