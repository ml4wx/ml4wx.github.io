summary: Compares seven ML and DL models for daily precipitation at five western Iran stations; DQN-LSTM
  explains over 84% of variability and best predicts extremes.
abstract: 'ABSTRACT Accurate forecasting of daily precipitation is critical for agricultural planning
  and effective water resource management. This study evaluates the capability of machine learning (ML)
  and deep learning (DL) models to predict daily precipitation using 40 years (1983–2023) of data from
  five synoptic stations in western Iran. Seven models were tested: Multiple Linear Regression (MLR),
  Polynomial Regression (PR), Support Vector Regression (SVR), Decision Tree (DT), Random Forest (RF),
  Extreme Gradient Boosting (XGBoost), and Q‐learning with Long Short‐Term Memory (DQN‐LSTM). Each model
  was trained on 10‐day input sequences to predict precipitation with a one‐day lead time, capturing short‐term
  temporal dependencies. Model performance, assessed using R 2 and RMSE, varied across stations, with
  DQN‐LSTM achieving the best results, explaining over 84% of daily precipitation variability and yielding
  the lowest RMSE values. Although PR, RF, and XGBoost provided reasonable accuracy, DT and SVR underperformed.
  However, it is important to note that the models that achieved the best RMSE and R 2 may not necessarily
  perform as well in predicting maximum precipitation values at stations. In general, all forecasting
  methods tend to underestimate the R95p index across stations. Nevertheless, the DQN‐LSTM model demonstrates
  superior overall skill in predicting extreme precipitation indices such as R95p and RX1day. However,
  for the frequency of extreme precipitation days, the predictions from PR, DT, RF, and XGBoost exhibit
  closer agreement with the observed values. These findings demonstrate the potential of hybrid DL models
  like DQN‐LSTM to improve both overall forecast accuracy and extreme event prediction, providing valuable
  insights for water management and disaster mitigation in regions with variable climates such as western
  Iran.'
