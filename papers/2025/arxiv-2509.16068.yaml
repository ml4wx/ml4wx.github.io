summary: G-WindCast infers 3D wind fields from 5G GNSS signal strength with FNN and Transformer models,
  forecasting up to 30 minutes and beating ERA5 against radar wind profilers.
abstract: Accurate atmospheric wind field information is crucial for various applications, including weather
  forecasting, aviation safety, and disaster risk reduction. However, obtaining high spatiotemporal resolution
  wind data remains challenging due to limitations in traditional in-situ observations and remote sensing
  techniques, as well as the computational expense and biases of numerical weather prediction (NWP) models.
  This paper introduces G-WindCast, a novel deep learning framework that leverages signal strength variations
  from 5G Global Navigation Satellite System (GNSS) signals to forecast three-dimensional (3D) atmospheric
  wind fields. The framework utilizes Forward Neural Networks (FNN) and Transformer networks to capture
  complex, nonlinear, and spatiotemporal relationships between GNSS-derived features and wind dynamics.
  Our preliminary results demonstrate promising accuracy in real-time wind forecasts (up to 30 minutes
  lead time). The model exhibits robustness across forecast horizons and different pressure levels, and
  its predictions for wind fields show superior agreement with ground-based radar wind profiler compared
  to concurrent European Centre for Medium-Range Weather Forecasts (ECMWF) Reanalysis v5 (ERA5). Furthermore,
  we show that the system can maintain excellent performance for localized forecasting even with a significantly
  reduced number of GNSS stations (e.g., around 100), highlighting its cost-effectiveness and scalability.
  This interdisciplinary approach underscores the transformative potential of exploiting non-traditional
  data sources and deep learning for advanced environmental monitoring and real-time atmospheric applications.
