summary: Hybrid CNN-RNN with attention predicts long-term hail frequency from geospatial data for insurance
  risk assessment, benchmarked against tree-based and statistical models.
abstract: This paper addresses the critical requirement for accurate long-term hail risk assessment to
  reduce property and infrastructure losses, which significantly affect insurance liabilities. For the
  insurance industry, precise hail prediction is vital for underwriting, pricing, reinsurance planning,
  and mitigating climate-induced financial volatility. An advanced artificial intelligence framework is
  presented, leveraging a hybrid convolutional and recurrent neural network architecture with attention
  mechanisms to predict variations in hail frequency from complex geospatial datasets. The methodology
  incorporates rigorous comparisons with tree-based and statistical approaches to validate its predictive
  reliability. Experimental results demonstrate strong forecasting capability, highlighting the potential
  of the system to support proactive risk management and inform mitigation strategies for businesses,
  insurers, and infrastructure planners.
