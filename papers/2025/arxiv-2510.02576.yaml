summary: Interpretable Transformer forecasts contiguous US soil moisture 42 days ahead and flash droughts
  11 days ahead, outperforming existing systems that cannot forecast flash drought.
abstract: Flash droughts are increasingly occurring worldwide due to climate change, causing widespread
  socioeconomic and agricultural losses. However, timely and accurate flash drought forecasting remains
  challenging for operational forecast systems due to uncertain representations of interactive hydroclimate
  processes. Here, we introduce the Interpretable Transformer for Drought (IT-Drought), a deep learning
  model based on publicly available hydroclimate data. IT-Drought skillfully forecasts soil moisture up
  to 42 days and flash droughts up to 11 days ahead on average across the contiguous U.S., substantially
  outperforming existing forecast systems limited to 10-day skillful soil moisture forecasting and unable
  to forecast flash droughts. IT-Drought offers novel data-driven interpretability on flash drought onset,
  benchmarking the memory effects of soil moisture, and revealing heterogeneous impacts and effective
  time ranges of climatic conditions, predominantly radiation and temperature. The findings highlight
  the potential of leveraging IT-Drought for early warning and mechanistic investigation of flash droughts,
  ultimately supporting drought risk mitigation.
