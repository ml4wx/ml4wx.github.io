summary: A multi-stage deep network fusing FY-4A/AGRI radiances with cloud-top temperature and pressure
  cuts cloud-top height error by 49% to 2.03 km versus the official product, validated against CALIPSO.
abstract: Cloud Top Height (CTH), defined as the altitude of the highest cloud layer above mean sea level,
  is a crucial geophysical parameter for quantifying cloud radiative effects, analyzing severe weather
  systems, and improving climate models. To enhance the accuracy of CTH retrieval from Fengyun-4A (FY-4A)
  satellite data, this study proposes a multi-stage deep learning framework that progressively refines
  cloud parameter estimation. The method utilizes cloud information from the FY-4A/AGRI (Advanced Geosynchronous
  Radiation Imager) Level 1 calibrated scanning imager radiance data product to construct a multi-source
  data fusion neural network model. The model inputs combine multi-channel radiance data with cloud parameters,
  including Cloud Top Temperature (CTT) and Cloud Top Pressure (CTP). We used the CTH measurement data
  from the Cloud-Aerosol Lidar and Infrared Pathfinder Satellite Observations (CALIPSO) satellite as a
  reference to verify the model output. Results demonstrate that the proposed multi-stage model significantly
  improves retrieval accuracy. Compared to the official FY-4A CTH product, the Mean Absolute Error (MAE)
  was reduced by 49.12% to 2.03 km, and the Pearson Correlation Coefficient (PCC) reached 0.85. To test
  the applicability of the model under complex weather conditions, we applied it to the CTH inversion
  of the double typhoon event on 10 August 2019. The model successfully characterized the spatial distribution
  of CTH within the typhoon regions. The results are consistent with the National Satellite Meteorological
  Centre (NSMC) reports and clearly reveal the different intensity evolutions of the two typhoons. This
  research provides an effective solution for high-precision retrieval of high-level cloud CTH at a large
  scale, using geostationary meteorological satellite remote sensing data.
