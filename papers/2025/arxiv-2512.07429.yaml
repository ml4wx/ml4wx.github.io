summary: An ML emulator trained on CMIP5 and CORDEX downscales CMIP6, projecting fewer future Central
  European wind-solar energy drought days.
abstract: 'Reliable regional climate information is essential for assessing the impacts of climate change
  and for planning in sectors such as renewable energy; yet, producing high-resolution projections through
  coordinated initiatives like CORDEX that run multiple physical regional climate models is both computationally
  demanding and difficult to organize. Machine learning emulators that learn the mapping between global
  and regional climate fields offer a promising way to address these limitations. Here we introduce the
  application of such an emulator: trained on CMIP5 and CORDEX simulations, it reproduces regional climate
  model data with sufficient accuracy. When applied to CMIP6 simulations not seen during training, it
  also produces realistic results, indicating stable performance. Using CORDEX data, CMIP5 and CMIP6 simulations,
  as well as regional data generated by two machine learning models, we analyze the co-occurrence of low
  wind speed and low solar radiation and find indications that the number of such energy drought days
  is likely to decrease in the future. Our results highlight that downscaling with machine learning emulators
  provides an efficient complement to efforts such as CORDEX, supplying the higher-resolution information
  required for impact assessments.'
