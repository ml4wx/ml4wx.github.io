summary: Releases a 45-year (1979-2024) daily 15-day GraphCast forecast archive at about 25 km, providing
  a reusable ML weather hindcast dataset for applications and climate research.
abstract: The UT GraphCast Hindcast Dataset from 1979 to 2024 is a comprehensive global weather forecast
  archive generated using the Google DeepMind GraphCast Operational model. Developed by researchers at
  The University of Texas at Austin under the WCRP umbrella, this dataset provides daily 15 day deterministic
  forecasts at 00UTC on an approximately 25 km global grid for a 45 year period. GraphCast is a physics
  informed graph neural network that was trained on ECMWF ERA5 reanalysis. It predicts more than a dozen
  key atmospheric and surface variables on 37 vertical levels, delivering a full medium range forecast
  in under one minute on modern hardware.
