summary: Review of classical ML and deep learning (CNN, RNN, LSTM) for temperature, precipitation and
  wind forecasting, covering hybrid models, data quality and interpretability.
abstract: Weather forecasting is a crucial point of discussion in agriculture, aviation, disaster management,
  and energy decision-making. Conventional numerical weather prediction (NWP) models are efficient but
  need a lot of computer resources and can be inaccurate in the beginning. Machine learning (ML) has become
  a powerful alternative and addition to traditional forecasting approaches, giving data-driven methodologies
  that can simulate complex meteorological patterns more efficiently and adaptably. This review covers
  weather forecasting machine learning methods, including supervised learning models like Support Vector
  Machines (SVM), Random Forests, and Gradient Boosting and deep learning frameworks like CNNs, RNNs,
  and LSTM networks. This review focuses on using these models to anticipate temperature, precipitation,
  wind speed, and humidity across various temporal and spatial scales. Modern model designs, hybrid models,
  ensemble learning, and satellite and sensor data to improve forecast accuracy are examined. It addresses
  crucial issues such data quality and accessibility, model interpretability, overfitting, and real-time
  forecasting. Explainable AI and uncertainty quantification are crucial to trusting machine learning-based
  weather systems, according to the review. This paper reviews the current and future state of machine
  learning in meteorological forecasting.
