summary: AI surrogates and a bandit optimizer select sea wall and oyster reef interventions against storm-surge
  damage near Tyndall AFB, projecting savings of billions of dollars.
abstract: Tropical storms cause extensive property damage and loss of life, making them one of the most
  destructive types of natural hazards. The development of predictive models that identify interventions
  effective at mitigating storm impacts has considerable potential to reduce these adverse outcomes. In
  this study, we use an artificial intelligence (AI)-driven approach for optimizing intervention schemes
  that improve resilience to coastal flooding. We combine three different AI models to optimize the selection
  of intervention types, sites, and scales in order to minimize the expected cost of flooding damage in
  a given region, including the cost of installing and maintaining interventions. Our approach combines
  data-driven generation of storm surge fields, surrogate modeling of intervention impacts, and the solving
  of a continuous-armed bandit problem. We applied this methodology to optimize the selection of sea wall
  and oyster reef interventions near Tyndall Air Force Base (AFB) in Florida, an area that was catastrophically
  impacted by Hurricane Michael. Our analysis predicts that intervention optimization could be used to
  potentially save billions of dollars in storm damage, far outpacing greedy or non-optimal solutions.
