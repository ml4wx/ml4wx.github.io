summary: ByteStorm detects tropical cyclone centres with deep learning from vorticity and sea-level pressure,
  linked by BYTE tracking, matching state-of-the-art deterministic trackers.
abstract: Accurate tropical cyclones (TCs) tracking represents a critical challenge in the context of
  weather and climate science. Traditional tracking schemes mainly rely on subjective thresholds, which
  may introduce biases in their skills on the geographical region of application and are often computationally
  and data-intensive, due to the management of a large number of variables. We present \textit{ByteStorm},
  an efficient data-driven framework for reconstructing TC tracks. It leverages deep learning networks
  to detect TC centers (via classification and localization), using only relative vorticity (850 mb) and
  mean sea-level pressure. Then, detected centers are linked into TC tracks through the BYTE algorithm.
  \textit{ByteStorm} is benchmarked with state-of-the-art deterministic trackers on the main global TC
  formation basins. The proposed framework achieves good tracking skills in terms of Probability of Detection
  and False Alarm Rate, accurately reproduces Seasonal and Inter-Annual Variability, and reconstructs
  reliable, smooth and coherent TC tracks. These results highlight the potential of integrating deep learning
  and computer vision to provide robust, computationally efficient and skillful data-driven alternatives
  to TC tracking.
