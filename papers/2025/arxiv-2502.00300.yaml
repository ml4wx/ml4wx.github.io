summary: Evidential neural network gives wind gust predictions with uncertainty without an ensemble, cutting
  WRF RMSE by 47% and capturing 95% of gusts at 179 of 266 stations.
abstract: Machine learning algorithms have shown promise in reducing bias in wind gust predictions, while
  still underpredicting high gusts. Uncertainty quantification (UQ) supports this issue by identifying
  when predictions are reliable or need cautious interpretation. Using data from 61 extratropical storms
  in the Northeastern USA, we introduce evidential neural network (ENN) as a novel approach for UQ in
  gust predictions, leveraging atmospheric variables from the Weather Research and Forecasting (WRF) model.
  Explainable AI techniques suggested that key predictive features contributed to higher uncertainty,
  which correlated strongly with storm intensity and spatial gust gradients. Compared to WRF, ENN demonstrated
  a 47% reduction in RMSE and allowed the construction of gust prediction intervals without an ensemble,
  successfully capturing at least 95% of observed gusts at 179 out of 266 stations. From an operational
  perspective, providing gust forecasts with quantified uncertainty enhances stakeholders' confidence
  in risk assessment and response planning for extreme gust events.
