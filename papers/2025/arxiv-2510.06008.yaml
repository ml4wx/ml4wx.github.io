summary: Off-the-shelf multimodal LLMs estimate hailstone diameters from 474 crowdsourced Austrian images
  with 1.12 cm mean absolute error, complementing traditional hail sensors.
abstract: This study examines the use of social media and news images to detect and measure hailstones,
  utilizing pre-trained multimodal large language models. The dataset for this study comprises 474 crowdsourced
  images of hailstones from documented hail events in Austria, which occurred between January 2022 and
  September 2024. These hailstones have maximum diameters ranging from 2 to 11cm. We estimate the hail
  diameters and compare four different models utilizing one-stage and two-stage prompting strategies.
  The latter utilizes additional size cues from reference objects, such as human hands, within the image.
  Our results show that pretrained models already have the potential to measure hailstone diameters from
  images with an average mean absolute error of 1.12cm for the best model. In comparison to a single-stage
  prompt, two-stage prompting improves the reliability of most models. Our study suggests that these off-the-shelf
  models, even without fine-tuning, can complement traditional hail sensors by extracting meaningful and
  spatially dense information from social media imagery, enabling faster and more detailed assessments
  of severe weather events. The automated real-time image harvesting from social media and other sources
  remains an open task, but it will make our approach directly applicable to future hail events.
