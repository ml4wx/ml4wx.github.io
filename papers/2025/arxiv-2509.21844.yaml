summary: Generative AI downscales 20 GCM large ensembles to 12 km over New Zealand, projecting more intense
  droughts and multi-year droughts up to 30 months under SSP3-7.0.
abstract: Understanding how droughts may change in the future is essential for anticipating and mitigating
  their adverse impacts. However, robust climate projections require large amounts of high-resolution
  climate simulations, particularly for assessing extreme events. Here, we use a novel dataset, multiple
  large-ensembles of Global Climate Models (GCMs), downscaled to 12km using generative AI, to quantify
  the future risk of meteorological drought across New Zealand. The ensembles consists of 20 GCMs, including
  two single-model initial condition large ensembles. The AI is trained to emulate a physics-based regional
  climate model (RCM) used in dynamically downscaling, and adds a similar amount of value as the RCM across
  precipitation and drought metrics. Marked increases in precipitation variability are found across all
  ensembles, alongside highly uncertain changes in mean precipitation. Future projections show droughts
  will become more intense across the majority of the country, however, internal variability and model
  uncertainty obscure future changes in drought durations and frequency across large portions of the country.
  This uncertainty is understated using a smaller number of dynamically-downscaled simulations. We find
  evidence that extreme droughts up to twice as long as those found in smaller ensembles, could occur
  across the entirety of the country in the current climate, highlighting the value of long-duration downscaled
  simulations to sample rare events. These extremely long droughts increase in length in many locations
  under a high emissions SSP3-7.0 scenario giving rise to events around 30 months long in some locations.
