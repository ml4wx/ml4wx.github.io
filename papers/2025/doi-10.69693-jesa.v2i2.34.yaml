summary: Tests imputation methods and SVR settings for rainfall forecasting, finding kNN imputation best
  by MSE and ANN imputation best by MAE.
abstract: Rainfall plays a vital role in various sectors such as transportation, agriculture, and industry.
  Having accurate rainfall information enables stakeholders in these fields to take proper measures and
  minimize potential losses caused by inaccurate data. This study focuses on identifying an effective
  method for rainfall forecasting by examining imputation techniques in data preprocessing and parameter
  settings within Support Vector Regression (SVR). The experimental findings indicate that the most effective
  imputation method for SVR is determined using the Mean Squared Error (MSE) and Mean Absolute Error (MAE)
  evaluation metrics. Based on MSE, the k-nearest neighbor method proves to be the most reliable approach
  for data imputation preprocessing. The preprocessing results were then applied to Polynomial SVR with
  parameters C = 1000, tolerance = 0.001, epsilon = 0.01, and unlimited iterations. Conversely, MAE results
  highlight Artificial Neural Network (ANN) as the optimal imputation method. ANN, when combined with
  a radial basis function kernel, gamma = 0.001, C = 1000, tolerance = 0.001, and unlimited iterations,
  was further tested using RBF SVR under the same parameter settings.
