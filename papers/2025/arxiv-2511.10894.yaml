summary: Frozen DINOv3 satellite encoder with a V-JEPA transformer head predicts CRPS-optimized rainfall
  distributions, cutting CRPS about 26% versus the best 3D-UNet on Weather4cast 2025.
abstract: This paper proposes a competitive and computationally efficient approach to probabilistic rainfall
  nowcasting. A video projector (V-JEPA Vision Transformer) associated to a lightweight probabilistic
  head is attached to a pre-trained satellite vision encoder (DINOv3-SAT493M) to map encoder tokens into
  a discrete empirical CDF (eCDF) over 4-hour accumulated rainfall. The projector-head is optimized end-to-end
  over the Ranked Probability Score (RPS). As an alternative, 3D-UNET baselines trained with an aggregate
  Rank Probability Score and a per-pixel Gamma-Hurdle objective are used. On the Weather4Cast 2025 benchmark,
  the proposed method achieved a promising performance, with a CRPS of 3.5102, which represents $\approx$
  26% in effectiveness gain against the best 3D-UNET.
