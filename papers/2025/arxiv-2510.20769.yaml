summary: CSU-PCAST, a Swin-transformer ensemble trained on ERA5 and IMERG, gives 30-member 15-day precipitation
  forecasts with lower CRPS than GEFS through 2023.
abstract: Accurate medium-range precipitation forecasting is essential for hydrometeorological risk management
  but remains challenging for both numerical weather prediction (NWP) systems and data-driven models.
  We present CSU-PCAST, a deep learning-based ensemble forecasting framework for global precipitation
  prediction. The model is trained using ERA5 atmospheric and surface variables at 0.25° resolution with
  precipitation labels from NASA's IMERG dataset. CSU-PCAST uses 57 prognostic variables and static geographical
  fields to predict both atmospheric states and 6-h accumulated precipitation. The framework employs a
  Swin Transformer backbone with stochastic noise conditioning, temporal embeddings, and a dual-branch
  decoder for precipitation and non-precipitation variables. During inference, CSU-PCAST is initialized
  from operational GFS analyses and generates 30 ensemble members out to 15 days using an autoregressive
  strategy. Evaluation against GEFS over the full year of 2023 shows improved precipitation forecast skill
  at short lead times, including higher Critical Success Index (CSI) and lower RMSE during the first several
  forecast days. CSU-PCAST also reduces GEFS wet bias for light precipitation and dry bias at heavier
  precipitation thresholds. Probabilistic verification demonstrates lower CRPS, higher Brier Skill Scores
  at several thresholds, and improved ensemble reliability relative to GEFS, although both systems remain
  underdispersive. A case study of the Sanba extreme precipitation event further shows improved spatial
  structure and exceedance-probability guidance. These results demonstrate the potential of CSU-PCAST
  for short-to-medium-range ensemble precipitation forecasting while highlighting remaining challenges
  in extreme precipitation prediction and ensemble calibration.
