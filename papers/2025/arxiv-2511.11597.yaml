summary: CLINB is an expert-curated multimodal benchmark testing LLMs on climate science questions, finding
  strong synthesis but frequent hallucinated references.
abstract: Evaluating how Large Language Models (LLMs) handle complex, specialized knowledge remains a
  critical challenge. We address this through the lens of climate change by introducing CLINB, a benchmark
  that assesses models on open-ended, grounded, multimodal question answering tasks with clear requirements
  for knowledge quality and evidential support. CLINB relies on a dataset of real users' questions and
  evaluation rubrics curated by leading climate scientists. We implement and validate a model-based evaluation
  process and evaluate several frontier models. Our findings reveal a critical dichotomy. Frontier models
  demonstrate remarkable knowledge synthesis capabilities, often exhibiting PhD-level understanding and
  presentation quality. They outperform "hybrid" answers curated by domain experts assisted by weaker
  models. However, this performance is countered by failures in grounding. The quality of evidence varies,
  with substantial hallucination rates for references and images. We argue that bridging this gap between
  knowledge synthesis and verifiable attribution is essential for the deployment of AI in scientific workflows
  and that reliable, interpretable benchmarks like CLINB are needed to progress towards building trustworthy
  AI systems.
