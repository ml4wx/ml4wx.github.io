summary: Hybrid MODWET wavelet-entropy and GRU model improves monthly precipitation forecasts at three
  CAMELS stations in the US, reaching r² of 0.78.
abstract: Accurate precipitation forecasting is essential for disaster preparedness and climate-responsive
  urban planning such as drainage designing under increasing climatic variability. This study investigates
  an entropy-guided deep learning framework to improve monthly precipitation forecasting by integrating
  the Maximal Overlap Discrete Wavelet Entropy Transform (MODWET) with a Gated Recurrent Unit (GRU) model.
  Unlike the conventional Maximal Overlap Discrete Wavelet Transform (MODWT), MODWET employs entropy to
  objectively determine the optimal wavelet filter and decomposition level, addressing a key limitation
  in wavelet-based preprocessing related to over- or under-decomposition of hydroclimatic signals. While
  the effectiveness of MODWET has previously been demonstrated for streamflow forecasting, its application
  to precipitation prediction has not yet been explored. The proposed framework is evaluated using monthly
  precipitation data from three hydrometeorological case studies close to urbane are, selected from the
  CAMELS dataset across the United States. Model performance is assessed using multiple statistical metrics,
  including NSE, RMSE, percent bias (PBIAS), and correlation coefficient (r2). In addition, the Partial
  Correlation Index (PCI) is employed to identify informative predictors and reduce input redundancy.
  Results show that the hybrid PCI–MODWET–GRU model consistently outperforms the standalone GRU model,
  achieving improved correlation (up to r2 = 0.78 at selected stations) and overall predictive accuracy.
  These findings highlight the potential of combining entropy-based wavelet preprocessing with deep learning
  models to enhance precipitation forecasting reliability, with direct relevance for urban and peri-urban
  water management and climate-responsive design applications.
