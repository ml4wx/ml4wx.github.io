summary: Systematically tests state-of-the-art ML climate models under out-of-distribution shifts, revealing
  large performance variability across scenarios that matters for climate risk use.
abstract: Climate change is accelerating the frequency and severity of unprecedented events, deviating
  from established patterns. Predicting these out-of-distribution (OOD) events is critical for assessing
  risks and guiding climate adaptation. While machine learning (ML) models have shown promise in providing
  precise, high-speed climate predictions, their ability to generalize under distribution shifts remains
  a significant limitation that has been underexplored in climate contexts. This research systematically
  evaluates state-of-the-art ML-based climate models in diverse OOD scenarios by adapting established
  OOD evaluation methodologies to climate data. Experiments on large-scale datasets reveal notable performance
  variability across scenarios, shedding light on the strengths and limitations of current models. These
  findings underscore the importance of robust evaluation frameworks and provide actionable insights to
  guide the reliable application of ML for climate risk forecasting.
