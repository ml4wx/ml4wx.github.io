summary: Environment-conditioned deep learning using 3D atmospheric forecasts and radar beats operational
  NWP for East China reflectivity and precipitation up to 12 h ahead.
abstract: Severe convection produces localized hazards that often require warnings before radar echoes
  fully reveal storm development. Convective initiation and the maintenance of intense convection remain
  challenging for radar-only nowcasting because pre-convective signals may be absent from recent radar
  observations and strong echoes often decay rapidly in forecasts. Here we present FuXi-Nowcast, an environment-conditioned
  deep learning system that combines high-resolution observations with three-dimensional atmospheric forecasts
  to predict composite reflectivity, precipitation, wind gusts, and surface variables up to 12 h ahead.
  In April--July 2024 evaluations over East China, FuXi-Nowcast outperforms operational numerical, persistence
  and extrapolation baselines for reflectivity and precipitation. Case studies, diagnostics, and ablation
  experiments suggest that atmospheric moisture information and explicit preservation of strong convective
  signals contribute to forecasts of convective initiation and maintenance. These results show that environmental
  conditioning can mitigate important failure modes of radar-only nowcasting for high-impact convective
  weather.
