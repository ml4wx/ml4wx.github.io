summary: Predicts planetary boundary layer height from ceilometer data with a fully connected network
  and links prediction error to the Lyapunov exponent of the series.
abstract: The Planetary Boundary Layer (PBL) is a crucial parameter to investigate for characterizing
  the atmosphere, particularly concerning aerosol concentrations. Understanding the PBL allows us to estimate
  air quality, provide weather forecasts, and establish correlations with astronomical seeing conditions
  and atmospheric turbulence intensity. The planetary boundary layer can be defined in many ways, but
  its importance remains constant as it is the atmospheric layer where most socio-economic activities
  occur. In this letter, we present a method to predict the stochastic PBL height (SPBLH) using ceilometer
  data and a deep learning approach based on a fully connected neural network. We found a correlation
  between the Lyapunov coefficient calculated for each SPBLH time series and the loss function, which
  is influenced by various factors such as atmospheric parameters, pollution, aerosols, and more. The
  performance of a typical neural network used to predict a time series is significantly affected by the
  degree of chaos, quantified by the largest Lyapunov exponents (LLE). Our results show a decrease in
  accuracy as a function of increasing LLE. Moreover, an increased number of virtual neurons in the neural
  network can be detrimental to SPBLH prediction for the complex dynamics of the PBL due to atmospheric
  conditions and unforeseen events.
