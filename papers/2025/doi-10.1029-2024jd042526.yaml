summary: A TimeSformer-based network nowcasts convection initiation from Fengyun-4B imagery, achieving
  TS 0.342 with an 18-minute lead time, beating LightGBM.
abstract: Abstract Based on the neighborhood matching of the satellite Fengyun‐4B and radar observations
  made during the warm seasons of 2022–2023, a small convection initiation (CI) data set was constructed.
  Further analyses showed that CI clouds are immersed in an obviously warmer environment (≥290 K) in a
  “ring‐like” appearance relative to non‐CI clouds. Following this ring‐like feature, an intelligent CI
  nowcasting method is proposed, the Time‐Space Transformer‐Azimuth Feature Fusion Network (TimeSformer‐AFNet),
  which is enhanced by an innovative azimuthal patch transformation and high‐level feature fusion. The
  results show that this novel approach provides highly accurate CI predictions, achieving a threat score
  (TS) of 0.342, a false alarm ratio (FAR) of 0.529, and a significant lead time of 18 min—an improvement
  of 59.8%, 31.7%, and 5 min, respectively, over the traditional thresholding method, and an improvement
  of 13.6%, 12.6%, and 4 min, respectively, over a common machine learning‐based method, called LightGBM.
  These results highlight the effectiveness of the TimeSformer‐AFNet in CI nowcasting and its potential
  for broader applications to feature learning in various tasks.
