summary: Multi-task LSTM on GNSS zenith delays flags 93% of California flash-flood warnings, giving 15–30
  minute latency guidance.
abstract: Extreme hydrometeorological events replenish water resources but can also trigger catastrophic
  flash floods, infrastructure damage, and loss of life. In California, landfalling atmospheric rivers
  account for ~85% of the most intense rainfall and flooding, with additional hazards from summer monsoons
  and rare tropical storms. We use 5-minute zenith tropospheric delays from a dense GNSS monitoring network
  (2004-2023), together with atmospheric-river catalogs, precipitation records, and historical flash-flood
  warnings, to train a multi-task Long Short-Term Memory deep learning model that tracks extreme-weather
  events and predicts flash-flood timing and location. The model identifies 93% of recorded warnings when
  tested on ninety atmospheric rivers (2017-2023) and fifty-five other storms, including the 2017 summer
  monsoons and Tropical Storm Hilary (2023), and generalizes outside the training domain. By exploiting
  GNSS-resolved moisture surges and horizontal gradients that reflect mesoscale meteorology and land-atmosphere
  interactions, this observation-driven system provides near-real-time guidance (15-30 min latency) that
  complements radar and numerical weather prediction and offers a scalable pathway for operational flash-flood
  early warning.
