summary: A CNN detects overshooting tops in MSG SEVIRI visible imagery with 97% detection probability
  and 0.25 km height error, using shadow length as ground truth.
abstract: Overshooting tops (OTs) are informative indicators of convective storm intensity and are widely
  utilized in meteorological analyses. This study presents an automated algorithm for OT detection and
  OT height estimation using convolutional neural networks applied to visible satellite imagery. The models
  are trained and validated on an extensive OT dataset comprising approximately 10,000 manually detected
  cases over Europe. The OTs were identified from high-resolution visible (HRV) channel of the SEVIRI
  instrument on board the MSG geostationary satellite, with the heights determined from the length of
  their shadows in the imagery. While conventional OT detection methods primarily rely on the identification
  of cold features in thermal infrared channels, our approach extracts information from visible channels,
  leveraging the ground truth data on OT shadow length provided by the training dataset. In the morning
  and afternoon hours, when the shadows are visible, the proposed models detect OTs with a probability
  of detection reaching 97% and estimate their height with an average error of 0.25 km. The performance
  is expected to further improve once the model is applied to polar and new generation geostationary satellites
  with increased spatial resolution.
