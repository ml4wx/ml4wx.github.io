summary: CNNs trained on 84 years of ERA5 explain over 90% of mean storm activity variability but only
  a third of individual storm intensity, with climate change contributing 0.1%.
abstract: Extratropical storms shape midlatitude weather and vary due to the slowly evolving climate and
  the rapid changes in synoptic conditions. While the influence of each factor has been studied extensively,
  their relative importance remains unclear. Here, we quantify the climate's relative importance in mean
  storm activity and individual storm development using 84 years of ERA-5 data and convolutional neural
  networks. We find that the constructed model predicts over 90% of the variability in the mean storm
  activity. However, a similar model predicts about a third of the variability in individual storm properties,
  such as maximum intensity, showing their variability is dominated by synoptic conditions. Isolating
  the impact of present-day climate change on individual storms shows it contributes to about 0.1% for
  storm-intensity variability, whereas its contribution to storms' heat-anomaly variability is over three
  times greater, highlighting that focusing on variables directly tied to global warming offers a clearer
  attribution pathway.
