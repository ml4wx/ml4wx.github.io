summary: Hybrid neural networks combining station observations with Arome/Arpege NWP outputs best predict
  Mediterranean heavy rainfall occurrence from 1 to 24 h across rarity levels.
abstract: Forecasting Heavy Precipitation Events (HPE) in the Mediterranean is crucial but challenging
  due to the complexity of the processes involved. In this context, Artificial Intelligence methods have
  recently proven to be competitive with state-of-the-art Numerical Weather Prediction (NWP). This work
  focuses on improving the prediction of the occurrence of HPE over periods from 1 h to 24 h based on
  Neural Network (NN) models. The proposed method uses both ground-station observations and data from
  Météo France's Arome and Arpege NWP models, on two regions with oceanic and Mediterranean climates for
  the period 2016-2018. The verification metric is the Peirce Skill Score. Results show that the NN model
  using only observations or NWP data performs better for shorter and longer rainfall accumulation period
  respectively. In contrast, a hybrid method combining both observations and NWP data offers the best
  performance and remains stable with the rainfall accumulation period. The hybrid method also improves
  the performance in predicting increasingly intense rainfall, from the 5% to the 0.1% rarest events.
  The choice of the loss function is found to be an important aspect of this work, where only balanced
  loss functions provide results insensitive to rare event frequency. Finally, the hybrid method is particularly
  well suited for the prediction of HPE in the Mediterranean climate, especially during the fall season,
  period during which most HPE occur.
