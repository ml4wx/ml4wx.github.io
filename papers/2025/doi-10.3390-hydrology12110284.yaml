summary: Hybrid GEV-LSTM model with a tail-weighted loss forecasts monthly maximum precipitation extremes
  via CDF values, aimed at identifying anomalously high precipitation months.
abstract: Accurate prediction of extreme precipitation events remains a critical challenge in hydrological
  forecasting due to their rare occurrence and complex statistical behavior. These extreme events are
  becoming more frequent and intense under the influence of climate change. Their unpredictability not
  only hampers water resource management and disaster preparedness but also leads to disproportionate
  impacts on vulnerable communities and critical infrastructure. Therefore, in this article, we introduce
  a hybrid modeling framework that combines Generalized Extreme Value (GEV) distribution fitting with
  deep learning models to forecast monthly maximum precipitation extremes. Long Short-term Memory models
  (LSTMs) are proposed to predict the cumulative distribution (CDF) values of the GEV-fitted remainder
  series. This approach transforms the forecasting problem into a bounded probabilistic learning task,
  improving model stability and interpretability. Crucially, a tail-weighted loss function is designed
  to emphasize rare but high-impact events in the training process, addressing the inherent class imbalance
  in extreme precipitation predictions. Results demonstrate strong predictive performance in both the
  CDF and residual domains, with the proposed model accurately identifying anomalously high precipitation
  months. This hybrid GEV–deep learning approach offers a promising solution for early warning systems
  and long-term climate resilience planning in hydrologically sensitive regions.
