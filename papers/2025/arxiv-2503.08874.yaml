summary: Proposes interactive dimensionality reduction to identify biosphere-atmosphere-socioeconomic
  syndromes from big data, a perspective with no quantitative results.
abstract: It is increasingly recognized that the multiple and systemic impacts of Earth system change
  threaten the prosperity of society through altered land carbon dynamics, freshwater variability, biodiversity
  loss, and climate extremes. For example, in 2022, there are about 400 climate extremes and natural hazards
  worldwide, resulting in significant losses of lives and economic damage. Beyond these losses, comprehensive
  assessment on societal well-being, ecosystem services, and carbon dynamics are often understudied. The
  rapid expansion of geospatial, atmospheric, and socioeconomic data provides an unprecedented opportunity
  to develop systemic indices to account for a more comprehensive spectrum of Earth system change risks
  and to assess their socioeconomic impacts. We propose a novel approach based on the concept of syndromes
  that can integrate synchronized changes in biosphere, atmosphere, and socioeconomic trajectories into
  distinct co-evolving phenomena. While the syndrome concept was applied in policy related to environmental
  conservation, it has not been deciphered from systematic data-driven approaches capable of providing
  a more comprehensive diagnosis of anthropogenic impacts. By advocating interactive dimensionality reduction
  approaches, we can identify key interconnected socio-environmental changes as syndromes from big data.
  We recommend future research tailoring syndromes by incorporating granular data, particularly socio-economic,
  into dimensionality reduction at different spatio-temporal scales to better diagnose regional-to-global
  atmospheric and environmental changes that are relevant for socioeconomic changes.
