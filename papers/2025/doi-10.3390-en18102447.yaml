summary: Nearest-neighbor random forest and Gaussian process models downscale global solar irradiance
  to site level; the random forest reaches 90.6% goodness of fit and runs 2.5x faster.
abstract: Accurate solar photovoltaic (PV) capacity estimation requires high-resolution, site-specific
  solar irradiance data to account for localized variability. However, global datasets, such as the National
  Solar Radiation Database (NSRDB), provide regional averages that fail to capture the fine-scale fluctuations
  critical for large-scale grid integration. This limitation is particularly relevant in the context of
  increasing distributed energy resources (DERs) penetration, such as rooftop PV. Additionally, it is
  critical to the implementation of Federal Energy Regulatory Commission (FERC) Order 2222, which facilitates
  DER participation in bulk power markets. To address this challenge, this study evaluates Nearest-Neighbor
  Random Forest (NNRF) and Nearest-Neighbor Gaussian Process (NNGP) models for spatiotemporal downscaling
  of global solar irradiance data. By leveraging historical irradiance and meteorological data, these
  models incorporate spatial, temporal, and feature-based correlations to enhance local irradiance predictions.
  The NNRF model, a machine learning approach, prioritizes computational efficiency and predictive accuracy,
  while the NNGP model offers a level of interpretability and prediction uncertainty by numerically quantifying
  correlations and dependencies in the data. Model validation was conducted using day-ahead predictions.
  The results showed that the average goodness of fit (GoF) of the NNRF model of 90.61% across all eights
  sites outperformed the GoF of the NNGP of 85.88%. Additionally, the computational speed of NNRF was
  2.5 times faster than the NNGP. Finally, the NNGP displayed polynomial scaling while the NNRF scaled
  linearly with increasing number of nearest neighbors. These findings highlight the robustness and computational
  efficiency of NNRF for large-scale solar irradiance downscaling, making it a strong candidate for improving
  PV capacity estimation and real-time electricity market integration.
