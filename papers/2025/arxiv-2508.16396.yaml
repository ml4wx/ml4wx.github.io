summary: Flow-matching downscaler with MMD domain alignment improves CMIP projections across spatial,
  temporal and multivariate downscaling, including compound extremes such as tropical cyclones.
abstract: Climate change is amplifying extreme events, posing escalating risks to biodiversity, human
  health, and food security. GCMs are essential for projecting future climate, yet their coarse resolution
  and high computational costs constrain their ability to represent extremes. Here, we introduce FuXi-CMIPAlign,
  a generative deep learning framework for downscaling CMIP outputs. The model integrates Flow Matching
  for generative modeling with domain adaptation via MMD loss to align feature distributions between training
  data and inference data, thereby mitigating input discrepancies and improving accuracy, stability, and
  generalization across emission scenarios. FuXi-CMIPAlign performs spatial, temporal, and multivariate
  downscaling, enabling more realistic simulation of compound extremes such as TCs.
