summary: Systematic PRISMA review of 374 studies on machine learning and remote sensing for climate hazard
  impacts on crop yield, finding random forest dominant.
abstract: Abstract This review critically assesses the application of machine learning (ML) algorithms
  and remote sensing (RS) products in detecting and predicting climate hazards, as well as their impacts
  on crop yields. Using the PRISMA approach, it examines 177 studies on climate hazards and 197 on RS–ML
  applications in crop yield modeling. Research is most concentrated in Asia, followed by Africa and the
  Americas, with agricultural drought emerging as the most frequently studied hazard. Statistical approaches,
  such as the coefficient of variation, remain the dominant methods for analyzing climate variability.
  For drought detection, Random Forest (RF) was the most used ML algorithm (17%), followed by Support
  Vector Machines (SVM, 11%), Artificial Neural Networks (ANN, 8%), Adaptive Neuro-Fuzzy Inference System
  (ANFIS, 5%), and Extreme Gradient Boosting (XGBoost, 5%). For drought impacts on crop productivity,
  RF dominated (39%) followed by Least Absolute Shrinkage and Selection Operator (LASSO, 11%), while for
  climate variability impacts, RF (21%) led alongside SVM (10%), ANN (9%), Long Short-Term Memory (LSTM)
  (8%), Multiple Linear Regression (MLR) (8%), and Convolutional Neural Network (CNN) (7%). Asia leads
  in the integration of advanced ML/DL techniques. In contrast, due to infrastructure and data limitations,
  Africa predominantly employs simpler and more interpretable models. RS products, namely MODIS, TRMM,
  CHIRPS, and ERA5, are widely used due to their accessibility. However, their limited spatial resolution
  restricts their effectiveness. The research gaps include a limited investigation at the sub-national
  level, insufficient ground-truth validation, and inadequate monitoring of complex, compounding hazards
  like drought–flood–heatwave interactions. Moreover, the research remains skewed toward economically
  dominant crops (maize, cotton, and soybeans, neglecting marginal crops (cocoa, cashew, cassava, plantain,
  and coffee) critical to food-insecure regions. The review recommends hybrid modeling frameworks integrating
  process-based and data-driven methods, broader spatial and crop coverage, standardized protocols, and
  real-time, microclimate-aware monitoring systems, for improving model reliability and applicability
  in underrepresented, data-scarce regions such as sub-Saharan Africa, thereby strengthening climate-resilient
  agriculture and global food security.
