summary: Random forest downscales vapour pressure deficit across China using ERA5-Land, remote sensing
  and 2,481 stations, reaching R² of 0.98 in validation.
abstract: China. This research aims to address the limitations of existing VPD reanalysis data, which
  are characterized by coarse spatial resolution and insufficient accuracy validation. Using ERA5-Land,
  TerraClimate, GLDAS time series data, and additional predictors such as vegetation indices, land cover
  types, terrain, and surface temperature, the study developed a random forest (RF) model to estimate
  VPD (named RF-VPD). Two independent experiments, station-to-station and year-to-year, were conducted
  to evaluate the models accuracy against in-situ data. Machine learning-based downscaling methods offer
  a potential solution to enhance the accuracy of VPD spatiotemporal distribution. In this study, we utilized
  ERA5-Land, TerraClimate, and GLDAS time series, vegetation indices, land cover types, terrain, and surface
  temperature data as predictors to estimate VPD using three machine learning models, named RF-VPD. VPD
  station data were computed based on meteorological data from 2481 meteorological stations in China,
  and two independent experiments (station-to-station and year-to-year) were employed to evaluate the
  estimation accuracy of RF-VPD using this data as a reference. Additionally, the station-to-station statistics
  of the VPD reanalysis data and the consistency between the RF-VPD and in-situ VPD data were examined.
  Overall, the random forest model performed the best in predicting VPD (R²=0.98, NSE=0.98, MAE=0.04,
  RMSE=0.06, RSR=0.13, and KGE=0.98). The high accuracy demonstrated in year-to-year and station-to-station
  experiments, coupled with the strong consistency between RF-VPD data and in-situ observations, underscores
  the robustness and applicability of RF-VPD models in capturing spatiotemporal patterns. Furthermore,
  our study demonstrates the dynamic impact of hydrothermal transfer processes and meteorological factors
  on RF-VPD products. The high-resolution RF-VPD product derived from this method has significant potential
  for practical applications, including drought monitoring, agricultural productivity assessments, fire
  risk evaluations, and water resource management. Furthermore, the developed RF-VPD model can be a valuable
  complement to existing VPD datasets, offering higher accuracy and resolution. By improving the prediction
  of VPD dynamics, this research provides important tools for climate change adaptation, ecosystem monitoring,
  and sustainable resource management. • A new method for estimating VPD based on in-situ observations
  was proposed. • This method can generate high-resolution and high-precision VPD products. • We demonstrates
  the dynamic impact of hydrothermal transfer processes and meteorological factors on VPD products.
