summary: Two-stage elucidated diffusion Transformer models NWP-based wind power forecast residuals on
  GEFCom2014, improving calibration and sharpness over GAN baselines.
abstract: Accurate and uncertainty-aware wind power forecasting is essential for reliable and cost-effective
  power system operations. This paper presents a novel probabilistic forecasting framework based on diffusion
  probabilistic models. We adopted a two-stage modeling strategy—a deterministic predictor first generates
  baseline forecasts, and a conditional diffusion model then learns the distribution of residual errors.
  Such a two-stage decoupling strategy improves learning efficiency and sharpens uncertainty estimation.
  We employed the elucidated diffusion model (EDM) to enable flexible noise control and enhance calibration,
  stability, and expressiveness. For the generative backbone, we introduced a time-series-specific diffusion
  Transformer (TimeDiT) that incorporates modular conditioning to separately fuse numerical weather prediction
  (NWP) inputs, noise, and temporal features. The proposed method was evaluated using the public database
  from ten wind farms in the Global Energy Forecasting Competition 2014 (GEFCom2014). We further compared
  our approach with two popular baseline models, i.e., a distribution parameter regression model and a
  generative adversarial network (GAN)-based model. Results showed that our method consistently achieves
  superior performance in both deterministic metrics and probabilistic accuracy, offering better forecast
  calibration and sharper distributions.
