summary: Machine learning parametric model of atmospheric transmittance forecasts short-term solar irradiance
  at Mozambique Mid-North sites, with correlations of 0.899–0.999.
abstract: Because of variations in the amount of solar energy that reaches the Earth’s surface, the output
  of solar power plants can undergo significant variability in the electricity generated. To solve this
  conundrum, modeling the parametric forecast of short-scale solar energy across Mozambique’s Mid-North
  region was the goal of this study. The parametric model applied consists of machine learning models
  based on the parametric analysis of all atmospheric, geographic, climatic, and spatiotemporal elements
  that impact the fluctuation in solar energy. It highlights the essential importance of the exact management
  of the interferential power density of each parameter influencing the availability of super solar energy.
  It enhances the long and short forecasts, estimates and scales, and geographic location, and provides
  greater precision, compared to other forecasting models. We selected eleven Mid-North region sites that
  collected data between 2019 and 2021 for the validation sample. The findings demonstrate a significant
  connection in the range of 0.899 to 0.999 between transmittances and irradiances caused by aerosols,
  water vapor, evenly mixed gases, and ozone. Uniformly mixed gases exhibit minimal attenuation, with
  a transmittance of about 0.985 in comparison to other atmospheric constituents. Despite the increased
  precision obtained by parameterization, the area still offers potential for solar application, with
  average values of 25% and 51% for clear skies and intermediate conditions, respectively. The estimated
  solar energy allows the model to be evaluated in any reality since it is within the theoretical irradiation
  spectrum under clear skies.
