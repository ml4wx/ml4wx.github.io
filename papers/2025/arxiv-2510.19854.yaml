summary: Wavelet multi-resolution analysis of satellite imagery quantifies tropical cyclone convective
  structure linked to rapid intensification, offering interpretable features for 24-hour intensity guidance.
abstract: Accurate tropical cyclone (TC) short-term intensity forecasting with a 24-hour lead time is
  essential for disaster mitigation in the Atlantic TC basin. Since most TCs evolve far from land-based
  observing networks, satellite imagery is critical to monitoring these storms; however, these complex
  and high-resolution spatial structures can be challenging to qualitatively interpret in real time by
  forecasters. Here we propose a concise, interpretable, and descriptive approach to quantify fine TC
  structures with a multi-resolution analysis (MRA) by the discrete wavelet transform, enabling data analysts
  to identify physically meaningful structural features that strongly correlate with rapid intensity change.
  Furthermore, deep-learning techniques can build on this MRA for short-term intensity guidance.
