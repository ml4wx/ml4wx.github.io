summary: Evaluates Pangu-Weather one-day forecasts of tornadic environments, beating GFS on bulk shear
  and helicity at the nearest grid point but underpredicting convective maxima.
abstract: Abstract The development of deep learning (DL) weather forecasting models has made rapid progress
  and achieved comparable or better skill than traditional Numerical Weather prediction (NWP) models,
  which are generally computationally intensive. However, applications of these DL models have yet to
  be fully explored, including for severe convective events. We evaluate the DL model Pangu‐Weather in
  forecasting tornadic environments with one‐day lead times using convective available potential energy
  (CAPE), 0–6 bulk wind difference (BWD6), and 0–3 km storm‐relative helicity (SRH3). We also compare
  its performance to the National Centers for Environmental Prediction (NCEP)'s Global Forecast System
  (GFS), a traditional NWP model. Pangu‐Weather generally outperforms GFS in predicting BWD6 and SRH3
  at the closest grid point and hour of the storm report. However, Pangu‐Weather tends to underpredict
  the maximum values of all convective parameters in the 1–2 hr before the storm across the surrounding
  grid points compared to the GFS.
