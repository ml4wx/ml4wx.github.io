summary: Filtering unfaithful instruction-tuning data yields ClimateGPT Faithful+, raising faithfulness
  of climate-question RAG answers from 30% to 57% of claims.
abstract: Large language models that use retrieval augmented generation have the potential to unlock valuable
  knowledge for researchers, policymakers, and the public by making long and technical climate-related
  documents more accessible. While this approach can help alleviate factual hallucinations by relying
  on retrieved passages as additional context, its effectiveness depends on whether the model's output
  remains faithful to these passages. To address this, we explore the automatic assessment of faithfulness
  of different models in this setting. We then focus on ClimateGPT, a large language model specialised
  in climate science, to examine which factors in its instruction fine-tuning impact the model's faithfulness.
  By excluding unfaithful subsets of the model's training data, we develop ClimateGPT Faithful+, which
  achieves an improvement in faithfulness from 30% to 57% in supported atomic claims according to our
  automatic metric.
