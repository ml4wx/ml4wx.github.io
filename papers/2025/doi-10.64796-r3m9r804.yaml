summary: Compares Naive Bayes, decision tree and MLP classifiers on a Kaggle weather dataset; MLP reaches
  84% accuracy for nominal humidity classes.
abstract: Weather prediction is one of the most difficult activities in meteorology because atmospheric
  dynamics is very nonlinear and dynamic. The prediction of humidity is an essential variable in many
  meteorological factors that have direct effects on agriculture, disaster management, safety in the aviation
  industry and energy planning. Conventional forecasts models, based on extensive physical modeling of
  atmospheric behavior, are usually unstable when using uncertain initial conditions and are also constrained
  in their forecast range. In order to help overcome these constraints, the paper examines the use of
  intelligent machine learning classifiers in predicting nominal weather humidity. An open source dataset
  provided at Kaggle was utilized, which included the characteristics of the outlook, temperature, humidity,
  and wind. Three classifiers which included Naive Bayes, Decision Tree and Multilayer Perceptron (MLP)
  were instantiated and tested with accuracy, precision, recall, F1-score and confusion memory dispensation.
  The experimental findings suggest that the MLP was more effective than the other classifiers with accuracy,
  precision, recall, and F1-score of 84, 0.981, 0.980, and 0.98, respectively. On the contrary, the Decision
  Tree was found to have 83 percent accuracy compared to Naivete Bayes with 76 percent. The study illustrates
  that MLP is efficient in predicting weather humidity and that future research might involve larger datasets
  and deep time-based frameworks like recurrent neural networks to improve the level of accuracy and reliability
  of future predictions
