summary: SelectKBest feature selection cuts training time by up to 96% for rainfall classification on
  Australian weather data, with Random Forest and MLP reaching ROC-AUC 1.00.
abstract: Accurate rainfall prediction is essential for managing water resources, mitigating disasters,
  and supporting sustainable agriculture in the face of increasing climate variability. However, the high
  dimensionality and heterogeneity of meteorological data often hinder the efficiency and interpretability
  of traditional models. This study introduces a feature selection driven machine learning framework that
  enhances rainfall classification accuracy and computational sustainability using Australia's comprehensive
  weather dataset. Three classifiers Logistic Regression, Random Forest, and a Multi-Layer Perceptron
  (MLP) neural network were evaluated before and after applying the feature selection. The proposed framework
  demonstrates that dimensionality reduction significantly improves efficiency while preserving or enhancing
  predictive capability. Experimental results show up to 96 % reduction in training time and a perfect
  ROC-AUC score (1.00) for both Random Forest and Neural Network models, with false negatives reduced
  by 30–68 %, leading to more reliable rain-event detection. The study's novelty lies in systematically
  quantifying the effect of feature selection on model robustness and efficiency for rainfall prediction
  a topic that has received limited attention in prior research. These findings provide a sustainable
  and generalizable approach for real-time rainfall forecasting and can be extended to other climate prediction
  tasks requiring efficient model deployment under computational constraints. • Feature selection via
  SelectKBest reduces training time by up to 96 % without sacrificing classification accuracy. • Random
  Forest and Neural Network models achieve perfect ROC-AUC (1.00) after dimensionality reduction. • False
  negatives drop by 30–68 % post-selection, enhancing rainfall event detection sensitivity. • Neural Network
  shows 89 % training time reduction with a 5 % accuracy gain, confirming efficient learning with top
  30 features. • Study supports sustainable water management through faster, interpretable, and highly
  accurate rainfall prediction models.
