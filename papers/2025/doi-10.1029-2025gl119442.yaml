summary: A probability-matching loss replaces MSE for ML precipitation nowcasting, reducing smoothing
  and heavy-rain underestimation and better matching the observed intensity distribution.
abstract: Abstract Machine learning (ML) precipitation forecasting models typically employ a mean squared
  error (MSE) loss function for optimization. However, due to the well‐known “double penalty” effect,
  MSE‐based losses often lead to overly smoothed prediction fields and a systematic underestimation of
  the frequency of heavy rainfall. To address this limitation, we propose a novel probability‐matching
  (PM) based loss for ML precipitation nowcasting and short‐term forecasting, comparing its performance
  with other classical losses. Comprehensive skill evaluation demonstrates that PM‐based loss offers relatively
  more balanced and consistent performance across metrics, particularly its lower forecast bias from light
  to heavy rainfall intensities. Spectral power analysis further indicates that PM‐based loss better preserves
  small‐scale precipitation variability throughout the forecast period. Additionally, it results in a
  forecast frequency distribution of precipitation that more closely aligns with the observed distribution.
  These findings indicate consistent improvements in predictive skill and reliability of ML precipitation
  forecasts when trained with the PM‐based loss.
