summary: Decision tree and extra trees classify daily weather conditions in Kabul from one year of station
  data, with the decision tree reaching 99% accuracy.
abstract: As global climate variability intensifies, the need for accurate and reliable weather forecasting
  becomes increasingly important. This study aimed to classify daily weather conditions in Kabul, Afghanistan,
  by comparing two decision-tree-based machine learning (ML) models that includes Decision Tree Classifier
  (DTC) and Extra Trees Classifier (ETC). A complete year dataset consisting of 366 daily meteorological
  observations collected from a central weather station in the region for 2024 was used. Results revealed
  that the DTC model consistently outperformed the ETC model, obtained an overall accuracy of 99% in both
  the training and testing phases, compared to the ETC model's accuracy of 96% (training) and 89% (testing).
  Specifically, the DTC model showed almost perfect weighted-average precision (0.99), recall (0.99),
  and F1-scores (0.99) for both phases training and testing respectively, whereas ETC demonstrated lower
  metrics in testing phase with weighted-average precision of 0.90, recall of 0.89, and F1-score of 0.88.
  Furthermore, sensitivity analysis demonstrated that precipitation probability is 40%, cloud cover is
  31%, snow is 18%, temperature fleeks like max is 8%, and solar radiation is 3% as the most impactful
  variables in weather classification. Scientifically, this study contributes to enhancing the effectiveness
  of localized weather prediction, providing critical support for urban planning, agriculture, and disaster
  management decisions in regions with similar climatic conditions.
