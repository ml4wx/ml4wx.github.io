summary: Phase-based physics-informed seq2seq network forecasts typhoon track and intensity with 17.83
  km and 7.28 kt MAE, using only 3 hours of history.
abstract: Typhoons are among the most destructive natural disasters in the Asia-Pacific region, causing
  extensive damage to infrastructure, agriculture, and human lives. Accurate and timely prediction of
  a typhoon's intensity and trajectory is crucial for effective disaster response and risk mitigation.
  However, existing forecasting models often struggle to capture the highly dynamic and heterogeneous
  nature of a typhoon’s lifecycle, leading to inaccuracies during periods of rapid intensification or
  abrupt trajectory shifts. This study proposes a novel phase-based, physics-informed sequence-to-sequence
  neural network to address these limitations. The framework decomposes the forecasting task into distinct
  lifecycle phases—formation, intensification, and dissipation—using specialized deep learning models
  for each. A key innovation is the integration of physical constraints derived from the Navier–Stokes
  equations directly into the model’s loss function, ensuring that predictions are both data-driven and
  physically consistent. Using the Digital Typhoon Dataset, the proposed method achieves a mean absolute
  error (MAE) of 17.83 km for trajectory prediction and 7.28 kt for intensity forecasting, representing
  a significant improvement over existing approaches. Moreover, the proposed method also requires only
  3 hours of historical data to generate forecasts, compared to more (e.g., 48) hours needed by entire-time
  series approaches, providing earlier inference critical for disaster preparedness and protection of
  infrastructure such as offshore wind farms.
