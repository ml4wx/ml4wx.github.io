summary: A 42-year, 1 km twice-daily pan-Arctic land surface temperature dataset, produced by diffusion-based
  super-resolution of AVHRR GAC data trained on MODIS.
abstract: Land surface temperature (LST) is an essential climate variable (ECV) crucial for understanding
  land-atmosphere energy exchange and monitoring climate change, especially in the rapidly warming Arctic.
  Long-term satellite-based LST records, such as those derived from the Advanced Very High Resolution
  Radiometer (AVHRR), are essential for detecting climate trends. However, the coarse spatial resolution
  of AVHRR's global area coverage (GAC) data limit their utility for analyzing fine-scale permafrost dynamics
  and other surface processes in the Arctic. This paper presents a new 42 years pan-Arctic LST dataset,
  downscaled from AVHRR GAC to 1 km with a super-resolution algorithm based on a deep anisotropic diffusion
  model. The model is trained on MODIS LST data, using coarsened inputs and native-resolution outputs,
  guided by high-resolution land cover, digital elevation, and vegetation height maps. The resulting dataset
  provides twice-daily, 1 km LST observations for the entire pan-Arctic region over four decades. This
  enhanced dataset enables improved modelling of permafrost, reconstruction of near-surface air temperature,
  and assessment of surface mass balance of the Greenland Ice Sheet. Additionally, it supports climate
  monitoring efforts in the pre-MODIS era and offers a framework adaptable to future satellite missions
  for thermal infrared observation and climate data record continuity.
