summary: RetinaNet with ResNet152 detects typhoons in reanalysis and climate-simulation fields over the
  South China Sea, with over 90% detection rate.
abstract: This study proposes a fully automated method for typhoon area identification from numerical
  weather prediction (NWP) model data using the RetinaNet model combined with the ResNet152 backbone network.
  The input training data consisting of physical fields such as pressure, wind, and temperature from the
  reanalysis are processed into multi-channel images to train an object detection model in which the data
  labels are determined from the Japan Meteorological Agency (JMA) best-track standard typhoon trajectory
  data. Experimental results on reanalysis data show that the model achieves high accuracy (detection
  rate over 90%), thereby identifying well the information areas related to storm activity without the
  need for initial information (first guess) like the traditional tracking method. When applied to climate
  change simulation data, the model still effectively detects cyclones, reflecting the trend of spatial-temporal
  changes in storm activity in the future. The experiment in the Bien Dong Sea region showed realistic
  detection capabilities, while also identifying some weak systems that were missed by traditional algorithms.
  The results show that deep learning has great potential to automate storm detection from NWP data without
  the need for subjective initial processing.
