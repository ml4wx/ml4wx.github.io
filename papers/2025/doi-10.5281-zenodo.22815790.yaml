summary: Random forests, gradient boosting and neural networks predict heatwave, heavy-precipitation and
  storm frequency better than traditional statistics, with tests of transferability across regions.
abstract: This study explores the application of machine learning approaches for predicting the frequency
  of extreme weather events, including heatwaves, heavy precipitation events, and severe storms, under
  current and projected future climate conditions. We develop and evaluate a suite of machine learning
  models, including random forests, gradient boosting, and deep neural networks, trained on historical
  meteorological reanalysis data and validated against observed extreme event records across multiple
  climate regions. Our results demonstrate that ensemble machine learning approaches substantially outperform
  traditional statistical methods in capturing the nonlinear relationships between atmospheric variables
  and extreme weather occurrence, achieving improved predictive skill particularly for compound and rapidly-evolving
  extreme events. We further assess model transferability across geographic regions and examine the relative
  importance of different predictor variables, including sea surface temperature anomalies, atmospheric
  circulation patterns, and soil moisture conditions. The findings have direct implications for early
  warning systems and climate risk assessment, offering a pathway toward more accurate, computationally
  efficient tools for anticipating extreme weather frequency shifts as the climate continues to change.
  We discuss limitations related to data availability and model interpretability, and outline priorities
  for future research integrating machine learning with physically-based climate models.
