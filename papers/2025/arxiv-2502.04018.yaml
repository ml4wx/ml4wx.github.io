summary: Physics-informed RNN/LSTM/GRU using a harmonic-oscillator prior forecasts ERA5 2m temperature
  for two years from 90 days of data; modest benchmark-scale contribution.
abstract: 'This paper introduces PINT (Physics-Informed Neural Time Series Models), a framework that integrates
  physical constraints into neural time series models to improve their ability to capture complex dynamics.
  We apply PINT to the ERA5 WeatherBench dataset, focusing on long-term forecasting of 2m-temperature
  data. PINT incorporates the Simple Harmonic Oscillator Equation as a physics-informed prior, embedding
  its periodic dynamics into RNN, LSTM, and GRU architectures. This equation''s analytical solutions (sine
  and cosine functions) facilitate rigorous evaluation of the benefits of incorporating physics-informed
  constraints. By benchmarking against a linear regression baseline derived from its exact solutions,
  we quantify the impact of embedding physical principles in data-driven models. Unlike traditional time
  series models that rely on future observations, PINT is designed for practical forecasting. Using only
  the first 90 days of observed data, it iteratively predicts the next two years, addressing challenges
  posed by limited real-time updates. Experiments on the WeatherBench dataset demonstrate PINT''s ability
  to generalize, capture periodic trends, and align with physical principles. This study highlights the
  potential of physics-informed neural models in bridging machine learning and interpretable climate applications.
  Our models and datasets are publicly available on GitHub: https://github.com/KV-Park.'
