summary: Shows CorrDiff-type generative downscaling fails to generalize across European regions and misrepresents
  divergence and vorticity; a PSD loss improves geographic generalization.
abstract: 'Kilometer-scale weather data is crucial for real-world applications but remains computationally
  intensive to produce using traditional weather simulations. An emerging solution is to use deep learning
  models, which offer a faster alternative for climate downscaling. However, their reliability is still
  in question, as they are often evaluated using standard machine learning metrics rather than insights
  from atmospheric and weather physics. This paper benchmarks recent state-of-the-art deep learning models
  and introduces physics-inspired diagnostics to evaluate their performance and reliability, with a particular
  focus on geographic generalization and physical consistency. Our experiments show that, despite the
  seemingly strong performance of models such as CorrDiff, when trained on a limited set of European geographies
  (e.g., central Europe), they struggle to generalize to other regions such as Iberia, Morocco in the
  south, or Scandinavia in the north. They also fail to accurately capture second-order variables such
  as divergence and vorticity derived from predicted velocity fields. These deficiencies appear even in
  in-distribution geographies, indicating challenges in producing physically consistent predictions. We
  propose a simple initial solution: introducing a power spectral density loss function that empirically
  improves geographic generalization by encouraging the reconstruction of small-scale physical structures.
  The code for reproducing the experimental results can be found at https://github.com/CarloSaccardi/PSD-Downscaling'
