summary: Survey of foundation models for environmental science covering forecasting, data assimilation
  and downscaling; weather and climate form part of a broad environmental scope.
abstract: Modeling environmental ecosystems is essential for effective resource management, sustainable
  development, and understanding complex ecological processes. However, traditional data-driven methods
  face challenges in capturing inherently complex and interconnected processes and are further constrained
  by limited observational data in many environmental applications. Foundation models, which leverages
  large-scale pre-training and universal representations of complex and heterogeneous data, offer transformative
  opportunities for capturing spatiotemporal dynamics and dependencies in environmental processes, and
  facilitate adaptation to a broad range of applications. This survey presents a comprehensive overview
  of foundation model applications in environmental science, highlighting advancements in common environmental
  use cases including forward prediction, data generation, data assimilation, downscaling, inverse modeling,
  model ensembling, and decision-making across domains. We also detail the process of developing these
  models, covering data collection, architecture design, training, tuning, and evaluation. Through discussions
  on these emerging methods as well as their future opportunities, we aim to promote interdisciplinary
  collaboration that accelerates advancements in machine learning for driving scientific discovery in
  addressing critical environmental challenges.
