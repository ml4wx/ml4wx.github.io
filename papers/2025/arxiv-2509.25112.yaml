summary: HeDA, an LLM agent, builds a knowledge graph from 8,111 papers to map compound heatwave cascades,
  finding biological systems as key nonlinear amplifiers of thermal stress.
abstract: Compound heatwaves increasingly trigger complex cascading failures that propagate through interconnected
  physical and human systems, yet the fragmentation of disciplinary knowledge hinders the comprehensive
  mapping of these systemic risk topologies. This study introduces the Heatwave Discovery Agent HeDA as
  an autonomous scientific synthesis framework designed to bridge cognitive gaps by constructing a high
  fidelity knowledge graph from 8,111 academic publications. By structuring 70,297 evidence nodes, the
  system exhibits enhanced inferential fidelity in capturing long tail risk mechanisms and achieves a
  significant accuracy margin compared to standard foundation models including GPT 5.2 and Claude Sonnet
  4.5 in complex reasoning tasks. The resulting topological analysis reveals a critical bio ecological
  mediation effect where biological systems function as the primary non linear amplifiers of thermal stress
  that transform physical meteorological hazards into systemic socioeconomic losses. We further identify
  latent functional couplings between theoretically distinct sectors such as the heat induced synchronization
  of power grid failures and emergency medical capacity saturation. These findings elucidate the dynamics
  of compound climate risks and provide an empirical basis for shifting adaptation strategies from static
  sectoral defense to dynamic cross system resilience.
