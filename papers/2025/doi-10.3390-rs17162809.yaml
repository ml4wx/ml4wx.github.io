summary: Two-stage random forest plus quantile-mapping and ground-based residual correction of satellite
  and reanalysis precipitation over the Huang-Huai-Hai Plain; CHIRPS gains most, with correlations above
  0.8.
abstract: The acquisition of high-precision spatiotemporal precipitation data with long-term continuity
  plays an irreplaceable role in supporting agricultural modeling, hydrological forecasting, disaster
  prevention, and climate research. This study evaluates and corrects daily precipitation from satellite
  products (GPM, PERSIANN-CDR, CMORPH, GSMaP), merged datasets (GPCP, MSWEP, CHIRPS), and reanalysis products
  (ERA5, GLDAS) over the Huang-Huai-Hai Plain from 2000 to 2020. The study proposes a two-stage “error
  correction and residual correction” optimization framework. The error correction stage integrates machine
  learning with statistical methods (RF-DQDM), while the residual correction stage uses ground observations
  to dynamically adjust systematic biases. Results show that all corrected products outperform their original
  versions in spatial patterns and statistical metrics. Original precipitation data exhibit significant
  systematic errors modulated by topography, with eastern lowlands showing smaller errors. After correction,
  correlation coefficients rise above 0.8, and RMSE reductions average 60%. And product responses diverge
  significantly. CHIRPS improves from weakest to top performer, while model limitations constrain GLDAS
  enhancements. This framework establishes a transferable monsoon region optimization paradigm. This study
  provides a transferable bias correction framework for monsoon regions and builds a homogenized high-precision
  precipitation benchmark. It also recommends using CHIRPS or ERA5 for extreme rainfall analysis and MSWEP
  or GPCP for hydrological applications.
