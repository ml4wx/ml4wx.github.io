summary: ClimateChat builds an automated instruction-data pipeline and fine-tuned LLM for climate change
  question answering, with improved QA performance over base models.
abstract: As the issue of global climate change becomes increasingly severe, the demand for research in
  climate science continues to grow. Natural language processing technologies, represented by Large Language
  Models (LLMs), have been widely applied to climate change-specific research, providing essential information
  support for decision-makers and the public. Some studies have improved model performance on relevant
  tasks by constructing climate change-related instruction data and instruction-tuning LLMs. However,
  current research remains inadequate in efficiently producing large volumes of high-precision instruction
  data for climate change, which limits further development of climate change LLMs. This study introduces
  an automated method for constructing instruction data. The method generates instructions using facts
  and background knowledge from documents and enhances the diversity of the instruction data through web
  scraping and the collection of seed instructions. Using this method, we constructed a climate change
  instruction dataset, named ClimateChat-Corpus, which was used to fine-tune open-source LLMs, resulting
  in an LLM named ClimateChat. Evaluation results show that ClimateChat significantly improves performance
  on climate change question-and-answer tasks. Additionally, we evaluated the impact of different base
  models and instruction data on LLM performance and demonstrated its capability to adapt to a wide range
  of climate change scientific discovery tasks, emphasizing the importance of selecting an appropriate
  base model for instruction tuning. This research provides valuable references and empirical support
  for constructing climate change instruction data and training climate change-specific LLMs.
