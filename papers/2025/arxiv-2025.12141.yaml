summary: Compares LSTM and GRU for precipitation occurrence at five European stations; reports near-identical
  skill with no statistically significant difference.
abstract: در این مطالعه، مقایسه الگوریتم‌های LSTM و GRU در پیش‌بینی وقوع بارش با استفاده از داده‌های هواشناسی
  تاریخی مد نظر است. با توجه به عدم دسترسی به داده‌های کامل هواشناسی داخلی چندساله، در این مطالعه از یک
  پایگاه داده از داده‌های هواشناسی برخی از شهرهای اروپا استفاده شد. پنج ایستگاه هواشناسی که هر کدام متعلق
  به اقلیم متفاوتی بودند، انتخاب شدند و دقت مدل بر روی داده‌های به‌دست ‌آمده از این ایستگاه‌ها محاسبه
  شد. در این تحقیق از دو الگوریتم حافظه کوتاه‌مدت بلند (LSTM) و واحد بازگشتی دروازه‌ای (GRU) استفاده شد.
  برای ارزیابی کارایی مدل‌های توسعه‌یافته در این مطالعه، از معیارهای ماتریس درهم‌ریختگی و نمودارهای مشخصه
  عملکرد گیرنده (ROC) و دقت-فراخوانی استفاده شد. نتایج به‌دست ‌آمده از تجزیه و تحلیل ماتریس‌های درهم‌ریختگی
  نشان داد که کارایی دو الگوریتم در پیش‌بینی وقوع بارش تقریباً مشابه است. از نظر عددی، میانگین مقادیر
  فراخوانی، ویژگی، دقت و صحت الگوریتم LSTM به‌ترتیب 67/0، 84/0، 75/0 و 79/0 و مقادیر مربوطه برای الگوریتم
  GRU به‌ترتیب 65/0، 84/0، 74/0 و 78/0 بود. از نظر مقایسه عملکرد این دو الگوریتم، اگرچه با توجه به بالاتر
  بودن مقادير بيشتر شاخص‌هاي ارزيابي كننده مربوط به الگوريتم LSTM نسبت به GRU، به ظاهر الگوریتم LSTM عملکرد
  بهتری داشته است؛ اما عملکرد کلی آن‌ها از نظر آماري با توجه به عدم وجود اختلاف معنی‎‌دار بین شاخص‌های
  ارزیابی کننده مشابه بوده است.
