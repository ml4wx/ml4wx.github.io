summary: Hybrid Holland-type pressure model with Kriging surrogates and analytical boundary-layer winds
  simulates asymmetric Nor'easter fields, mostly physics-based with limited ML.
abstract: Nor'easters frequently impact the North American East Coast, bringing hazardous precipitation,
  winds, and coastal flooding. Accurate simulation of their pressure and wind fields is essential for
  forecasting, risk assessment, and infrastructure planning, yet remains challenging due to their complex,
  asymmetric structure. This study introduces a novel hybrid analytical-data-driven model designed to
  efficiently simulate Nor'easter pressure and boundary layer wind fields. The pressure field is modeled
  using an adapted Holland-type formulation, with azimuthally varying parameters estimated through Kriging
  surrogate models informed by sensitivity analysis of reanalysis data. The wind field is then derived
  analytically from the momentum equations by decomposing the wind flow into gradient and frictional components.
  Model performance is assessed against ERA-Interim reanalysis data and surface wind observations from
  a historical event. Results show that the proposed pressure model accurately reproduces elliptical isobars
  and key asymmetrical patterns, while the wind model captures the fundamental structure and intensity
  of the boundary layer flow, including the presence of supergradient winds. Owing to its physical basis,
  computational efficiency, and ability to represent critical storm asymmetries, the model offers a valuable
  alternative to computationally expensive numerical simulations for hazard assessment and scenario analysis
  of extreme Nor'easters.
