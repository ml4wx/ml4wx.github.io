summary: Evaluates Pangu-Weather for western North Pacific tropical cyclone tracks against JMA NWP over
  64 storms in 2021-2023, finding smaller position errors and sub-minute runtime.
abstract: Tropical cyclones (TCs) are a threat to coastal regions in countries and areas situated in the
  tropics to, at times, mid-latitudes, and their threat is expected to escalate due to factors like global
  warming and urbanization. This emphasizes imperative need that warnings based on accurate and reliable
  forecasts be delivered to those who need them in order to prevent or mitigate TC impacts effectively.
  While conventional Numerical Weather Prediction (NWP) models have traditionally dominated TC forecasting
  at short to medium range lead times (i.e., up to two weeks), the emergence of Artificial Intelligence
  (AI) models, i.e., Machine Learning (ML) models trained on global reanalysis, has raised the possibility
  of such models competing and thus supplementing NWP models. Here, we examine the potential of ML models
  in operational TC forecasting, comparing them with conventional NWP models. The ML model used in this
  study is Pangu-Weather and TC forecasts by this ML model are compared with those from the operational
  global NWP model at the Japan Meteorological Agency, especially focusing on the track. All 64 named
  TCs for a period of 2021 to 2023 in the western North Pacific basin are verified. Results indicate that
  the ML forecasts exhibit smaller position errors compared to the NWP model, alleviate the westward bias
  around Japan, and retain its forecast accuracy for TCs with unusual paths, offering potential operational
  utility. Another benefit would be the ability to deliver forecast results to forecasters quicker than
  before, since the ML model’s forecast takes less than a minute. Meanwhile, challenges such as forecast
  bust cases and TC intensity, which are also present in NWP models, persist. A proposed way to utilize
  ML models at current operational systems would be to add ML-based track forecasts as one independent
  member of consensus forecasts.
