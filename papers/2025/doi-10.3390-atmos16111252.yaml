summary: Vision-language model classifies MODIS marine low cloud morphologies with 0.84 accuracy on SGFF
  and 0.86 on stratocumulus, working well with very small training sets.
abstract: 'Marine low clouds have a strong impact on Earth’s system but remain a major source of uncertainty
  in anthropogenic radiative forcing simulated by general circulation models. This uncertainty arises
  from incomplete understanding of the many processes controlling their evolution and interactions. A
  key feature of these clouds is their diverse mesoscale morphologies, which are closely tied to their
  microphysical and radiative properties but remain difficult to characterize with satellite retrievals
  and numerical models. Here, we develop and apply a vision–language model (VLM) to classify marine low
  cloud morphologies using two independent datasets based on Moderate Resolution Imaging Spectroradiometer
  (MODIS) satellite imagery: (1) mesoscale cellular convection types of sugar, gravel, fish, and flower
  (SGFF; 8800 total samples), and (2) marine stratocumulus (Sc) types of stratus, closed cells, open cells,
  and other cells (260 total samples). By conditioning frozen image encoders on descriptive prompts, the
  VLM leverages multimodal priors learned from large-scale image–text training, making it less sensitive
  to limited sample size. Results show that the k-fold cross-validation of VLM achieves an overall accuracy
  of 0.84 for SGFF, comparable to prior deep learning benchmarks for the same cloud types, and retains
  robust performance under the reduction of SGFF training size. For the Sc dataset, the VLM attains 0.86
  accuracy, whereas image-only model is unreliable under such limited training set. These findings highlight
  the potential of VLMs as efficient and accurate tools for cloud classification under very low samples,
  offering new opportunities for satellite remote sensing and climate model evaluation.'
