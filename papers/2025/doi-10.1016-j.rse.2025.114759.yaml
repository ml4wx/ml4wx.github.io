summary: A machine learning model on GOES-R ABI imagery yields near-real-time five-minute gross primary
  productivity estimates, reaching R² of 0.78 at daily scale against eddy covariance towers.
abstract: The terrestrial carbon cycle responds dynamically to human activity, weather and climate variability,
  and extreme events. Satellite remote sensing has revolutionized our ability to estimate ecosystem carbon
  uptake via gross primary productivity (GPP) with increasing accuracy and spatial resolution. Many aspects
  of terrestrial carbon cycling happen quickly, and may not be captured at the temporal scales of most
  remote sensing products – often multiple days or longer. Imagers onboard geostationary satellites measure
  the Earth system at “hypertemporal” time scales of minutes or less, and often have the spectral capabilities
  to estimate GPP and other surface-atmosphere fluxes at this rapid cadence. Here, we build upon established
  approaches for estimating GPP using the Advanced Baseline Imager (ABI) on the Geostationary Environmental
  Operational Satellite – R Series (GOES-R) to create ALIVEGPP (Advanced Baseline Imager Live Imaging
  of Vegetated Ecosystems), a GPP product that provides open data on the native five-minute basis of GOES-R
  CONUS scenes with latency under one day. Our machine learning model, trained on GPP estimates from over
  100 eddy covariance flux towers spanning tropical to boreal ecosystems, captures 66% of the variability
  in half-hourly GPP estimates when 20% of the data from all training sites are withheld, and 63% when
  20% of tower sites are withheld, with R2 values of 0.78 (0.82) when aggregating to daily (weekly) periods.
  We compared ALIVE predictions against eight-day MODIS MOD17A2 GPP estimates and daily GPP estimates
  from the Breathing Earth System Simulator v2 (BESSv2), and applied ALIVE to demonstrate how it simulates
  the impacts of fire, wildfire smoke, synoptic meteorology, phenological transitions, flash drought,
  and hurricanes on GPP. Advancements to geostationary satellite imagery, machine learning, and cloud
  computing make it possible to estimate carbon flux in near real-time, and provide new ways to understand
  the ever-changing carbon cycle and the processes that define it.
