summary: Case study of Typhoon Danas finds AI global models tracked the erratic path better than physics
  NWP, though they underestimate intensity.
abstract: 'Severe Typhoon Danas over the northern part of the South China Sea and seas near Taiwan in
  early July 2025 had an erratic path that had not been observed before, according to historical data
  in the region. Its formation, movement, and intensification posed significant challenges to the timely
  tropical cyclone (TC) warning services. This paper documents the observational aspect and forecasting
  aspect of this cyclone. There are key findings: (a) when Danas interacted with the Central Mountain
  Range of Taiwan, a “secondary cyclone” appeared over the northeastern part of Taiwan, which was observed
  by both weather radars and meteorological satellite winds, and was simulated to a certain extent by
  a mesoscale numerical weather prediction (NWP) model; (b) data-driven AI global models performed better
  than physics-based global NWP models in capturing the formation and the rather erratic track of Danas
  a couple of days earlier, although AI models generally underestimate the intensity forecasts; and (c)
  an atmosphere–ocean–wave coupled model was found to perform the best in capturing both the track changes
  of Danas (because of being driven by an AI global model) and its intensity changes (because of better
  physical representation of the oceanic impact on the intensity of this TC), whereas AI global models,
  though with various recent enhancements, still tended to underestimate the strength of Danas. This paper
  serves as a reference of this rather unusual TC for the weather forecasting services in the region.'
