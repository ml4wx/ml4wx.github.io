summary: Autoregressive conditional GAN predicts probabilistic wildfire spread, producing sharper fire
  perimeters than conventional deep learning baselines.
abstract: Climate change has intensified the frequency and severity of wildfires, making rapid and accurate
  prediction of fire spread essential for effective mitigation and response. Physics-based simulators
  such as FARSITE offer high-fidelity predictions but are computationally intensive, limiting their applicability
  in real-time decision-making, while existing deep learning models often yield overly smooth predictions
  that fail to capture the complex, nonlinear dynamics of wildfire propagation. This study proposes an
  autoregressive conditional generative adversarial network (CGAN) for probabilistic wildfire spread prediction.
  By formulating the prediction task as an autoregressive problem, the model learns sequential state transitions,
  ensuring long-term prediction stability. Experimental results demonstrate that the proposed CGAN-based
  model outperforms conventional deep learning models in both overall predictive accuracy and boundary
  delineation of fire perimeters. These results demonstrate that adversarial learning allows the model
  to capture the strong nonlinearity and uncertainty of wildfire spread, instead of simply fitting the
  pixel average. Furthermore, the autoregressive framework facilitates systematic temporal forecasting
  of wildfire evolution. The proposed CGAN-based autoregressive framework enhances both the accuracy and
  physical interpretability of wildfire spread prediction, offering a promising foundation for time-sensitive
  response and evacuation planning.
