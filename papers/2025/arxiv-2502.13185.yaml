summary: CondensNet embeds an adaptive physical constraint to stop water vapour oversaturation, giving
  stable hybrid GCM climate runs that are more efficient than super-parameterization.
abstract: Accurate and efficient climate simulations are crucial for understanding Earth's evolving climate.
  However, current general circulation models (GCMs) face challenges in capturing unresolved physical
  processes, such as cloud and convection. A common solution is to adopt cloud resolving models, that
  provide more accurate results than the standard subgrid parametrisation schemes typically used in GCMs.
  However, cloud resolving models, also referred to as super paramtetrizations, remain computationally
  prohibitive. Hybrid modeling, which integrates deep learning with equation-based GCMs, offers a promising
  alternative but often struggles with long-term stability and accuracy issues. In this work, we find
  that water vapor oversaturation during condensation is a key factor compromising the stability of hybrid
  models. To address this, we introduce CondensNet, a novel neural network architecture that embeds a
  self-adaptive physical constraint to correct unphysical condensation processes. CondensNet effectively
  mitigates water vapor oversaturation, enhancing simulation stability while maintaining accuracy and
  improving computational efficiency compared to super parameterization schemes. We integrate CondensNet
  into a GCM to form PCNN-GCM (Physics-Constrained Neural Network GCM), a hybrid deep learning framework
  designed for long-term stable climate simulations in real-world conditions, including ocean and land.
  PCNN-GCM represents a significant milestone in hybrid climate modeling, as it shows a novel way to incorporate
  physical constraints adaptively, paving the way for accurate, lightweight, and stable long-term climate
  simulations.
