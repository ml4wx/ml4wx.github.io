summary: A customized SVM classifies tropical cyclone nature from satellite images with 95% accuracy,
  modestly above random forest and other baselines.
abstract: Efficiently predicting the nature of tropical cyclones through machine learning techniques has
  always posed a challenge in the quest to save human lives. While existing research has proposed various
  methods to accurately predict cyclone behavior and reduce its impact on humanity, this paper introduces
  a unique customized Support Vector Machine (SVM) model. Unlike existing models, this machine learning-based
  custom model enhances evaluation metrics, offering significant improvements in binary classification
  forecasting. The paper also presents a schematic diagram outlining an architectural design for cyclone
  nature detection utilizing satellite images. The proposed customized SVM model achieves impressive classification
  metrics, with accuracy at 95%, precision at 94.78%, recall at 94.5%, and an F1-score of 94.9%. In contrast,
  other models such as Random Forest (RF), SVM, decision tree (DT), and Logistic Regression (LR) fall
  short, failing to reach an accuracy exceeding 92%. Furthermore, future work may involve the development
  of hybrid models.
