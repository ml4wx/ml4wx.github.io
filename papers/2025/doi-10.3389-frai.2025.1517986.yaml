summary: Mini review of AI and deep learning for climate modeling in sustainable urban planning, covering
  risk assessment, interpretability and scalability challenges.
abstract: Artificial Intelligence (AI) is revolutionizing climate modeling by enhancing predictive accuracy,
  computational efficiency, and multi-source data integration, playing a crucial role in sustainable urban
  planning. This Mini Review examines recent advancements in machine learning (ML) and deep learning (DL)
  techniques that improve climate risk assessment, resource optimization, and infrastructure resilience.
  Despite these innovations, significant challenges persist, including data quality inconsistencies, model
  interpretability limitations, ethical concerns, and the scalability of AI models across diverse urban
  contexts. To bridge these gaps, this review highlights key research directions, emphasizing the development
  of interpretable AI models, robust data governance frameworks, and scalable AI-driven solutions that
  help climate adaptation. By addressing these challenges, AI-based climate modeling can provide actionable
  insights for policymakers, urban planners, and researchers fostering climate-resilient and sustainable
  urban environments.
