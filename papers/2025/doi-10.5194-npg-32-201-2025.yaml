summary: Uses conditional nonlinear optimal perturbations to explain why reservoir computers forecast
  ENSO to 21-month lead better than a Zebiak-Cane model.
abstract: Abstract. Accurate prediction of the extreme phases of the El Niño Southern Oscillation (ENSO)
  is important to mitigate the socioeconomic impacts of this phenomenon. It has long been thought that
  prediction skill was limited to a 6 months lead time. However, Machine Learning methods have shown to
  have skill at lead times up to 21 months. In this paper we aim to explain for one class of such methods,
  i.e. Reservoir Computers (RCs), the origin of this high skill. Using a Conditional Nonlinear Optimal
  Perturbation (CNOP) approach, we compare the initial error propagation in a deterministic Zebiak-Cane
  (ZC) ENSO model and that in an RC trained on synthetic observations derived from a stochastic ZC model.
  Optimal initial perturbations at long lead times in the RC involve both sea surface temperature and
  thermocline anomalies which leads to a decreased error propagation compared to the ZC model, where mainly
  thermocline anomalies dominate the optimal initial perturbations. This reduced error propagation allows
  the RC to provide a higher skill at long lead times than the deterministic ZC model.
