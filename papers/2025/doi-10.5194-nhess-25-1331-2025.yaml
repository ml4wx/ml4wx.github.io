summary: Random forest avalanche danger model driven by weather and snowpack simulations matches published
  Swiss danger levels about 70% of the time, with SHAP explanations.
abstract: Abstract. During winter, public avalanche forecasts provide crucial information for professional
  decision-makers as well as recreational backcountry users in the Swiss Alps. While avalanche forecasting
  has traditionally relied exclusively on human expertise, the Swiss avalanche warning service has recently
  integrated machine-learning models to support the forecasting process. This study assesses a random
  forest classifier trained with weather data and physical snow-cover simulations as input for predicting
  dry-snow avalanche danger levels during the initial live-testing in the winter season of 2020–2021.
  The model achieved ∼70 % agreement with published danger levels, performing equally well in nowcast-
  and forecast-mode. By using model-predicted probabilities, continuous expected danger values were computed,
  showing a high correlation with the sub-levels as published in the Swiss forecast. The model effectively
  captured temporal dynamics and variations across different slope aspects and elevations, though it decreased
  the performance during periods with persistent weak layers in the snowpack. SHapley Additive exPlanations
  (SHAP) were employed to make the model's decision process more transparent, reducing its 'black-box'
  nature. Beyond increasing the explainability of model predictions, the model encapsulates twenty years
  of forecasters' experience in aligning weather and snowpack conditions with danger levels. Therefore,
  the presented approach and visualization could also be employed as a training tool for new forecasters,
  highlighting relevant parameters and thresholds. In summary, machine-learning models as the danger-level
  model, often considered 'black-box' models, can provide high-resolution, comparably transparent "second
  opinions" that complement human forecasters' danger assessments.
