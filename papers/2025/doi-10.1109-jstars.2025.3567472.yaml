summary: Multitask learning with multi-teacher distillation estimates tropical cyclone wind radii more
  accurately than single-task state-of-the-art methods.
abstract: Wind radii provide a quantitative measure of the structural characteristics of tropical cyclones
  (TCs), and accurate estimation of wind radii is crucial for disaster prevention and emergency response.
  In recent years, deep learning has exhibited tremendous potential in estimating TC wind radii. However,
  the widely deployed single-task models limit the sharing of feature representations and hinder the interaction
  of complementary information. To address these issues and improve both the accuracy and efficiency of
  wind radii estimation, this paper presents a novel collaborative TC wind radii estimation method with
  multi-task learning and multi-teacher knowledge distillation. First, to fully leverage the correlations
  between different wind radii estimation tasks, we construct a multi-task model with a parameter hard-sharing
  mechanism. Specifically, the estimation of gale-force wind radius (R34), radius of maximum wind speed
  (RMW), and an auxiliary task of TC fullness (TCF) estimation share common feature extraction and fusion
  sub-networks, while each task has its own task-specific regression sub-network. The TCF task explicitly
  enforces the relationship between R34 and RMW. Additionally, we introduce a multi-teacher knowledge
  distillation strategy to transfer knowledge from multiple single-task teacher models to the multi-task
  student model. Extensive experiments demonstrate that the proposed collaborative wind radii estimation
  method with multi-task learning and multi-teacher knowledge distillation outperforms state-of-the-art
  methods, showcasing its superior performance and effectiveness.
