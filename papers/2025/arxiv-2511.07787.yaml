summary: Linear probes show Aurora's encoder linearly encodes land-sea boundaries, extreme temperatures
  and instability, though rare events are poorly captured.
abstract: 'The high accuracy of large-scale weather forecasting models like Aurora is often accompanied
  by a lack of transparency, as their internal representations remain largely opaque. This "black box"
  nature hinders their adoption in high-stakes operational settings. In this work, we probe the physical
  consistency of Aurora''s encoder by investigating whether its latent representations align with known
  physical and meteorological concepts. Using a large-scale dataset of embeddings, we train linear classifiers
  to identify three distinct concepts: the fundamental land-sea boundary, high-impact extreme temperature
  events, and atmospheric instability. Our findings provide quantitative evidence that Aurora learns physically
  consistent features, while also highlighting its limitations in capturing the rarest events. This work
  underscores the critical need for interpretability methods to validate and build trust in the next generation
  of Al-driven weather models.'
