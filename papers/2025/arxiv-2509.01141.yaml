summary: Hybrid CNN-Transformer (CT-MVP) imputes missing multivariate atmospheric fields from SD-WACCM-X,
  outperforming traditional methods, especially over long data gaps.
abstract: Continuous physical domains are important for scientific investigations of dynamical processes
  in the atmosphere. However, missing data arising from operational constraints and adverse environmental
  conditions pose significant challenges to accurate analysis and modeling. To address this limitation,
  we propose a novel hybrid Convolutional Neural Network (CNN) Transformer machine learning model for
  multivariable atmospheric data imputation, termed CT-MVP. This framework integrates CNNs for local feature
  extraction with transformers for capturing long-range dependencies across time and altitude. The model
  is trained and evaluated on a testbed using the Specified Dynamics Whole Atmosphere Community Climate
  Model with thermosphere and ionosphere extension (SD-WACCM-X) dataset spanning 13 years, which provides
  continuous global coverage of atmospheric variables, including temperature and zonal and meridional
  winds. This setup ensures that the ML approach can be rigorously assessed under diverse data-gap conditions.
  The hybrid framework enables effective reconstruction of missing values in high-dimensional atmospheric
  datasets, with comparative evaluations against traditional methods and a simple transformer. The results
  demonstrate that CT-MVP achieves superior performance compared with traditional approaches, particularly
  in cases involving extended periods of missing data, and slightly outperforms a simple transformer with
  the same hyper-parameters.
