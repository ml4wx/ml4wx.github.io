summary: A U-Net CNN applied to eight years of ARM Graciosa radar data classifies open and closed mesoscale
  cellular convection, revealing their distinct cloud and wind properties.
abstract: 'Abstract Marine boundary layer clouds are crucial in Earth''s climate system. They frequently
  manifest as closed or open cell mesoscale cellular convection (MCC). MCC clouds are challenging to represent
  accurately in current climate models, highlighting the need for detailed observational data sets and
  in‐depth analyses. This study utilizes over 8 years of observations from the U.S. Department of Energy
  (DOE) Atmospheric Radiation Measurement (ARM) User Facility Eastern North Atlantic (ENA) site at Graciosa
  Island, Azores, to investigate these clouds. We first apply a convolutional neural network with a U‐Net
  architecture to classify open and closed cells, marking the first application of such an approach for
  automatically detecting MCC patterns from ground‐based radar measurements. This method addresses some
  observational gaps in satellite data related to low temporal resolution, nighttime challenges, and limited
  vertical structure capture. The analysis of the MCC cases shows clear differences between closed and
  open MCCs: Closed MCC clouds are characterized by lower cloud tops and bases, shallower cloud geometrical
  depth, weaker horizontal wind speeds, stronger atmospheric stability, and a more homogeneous liquid
  water path than open MCCs. Finally, we demonstrate two potential applications of our radar‐based MCC
  classifications: (a) facilitating the investigation of aerosol‐cloud interactions and (b) exploring
  meteorological factors along with MCC''s evolution by integrating satellite imagery and back‐trajectory
  analysis. The identified MCC cases offer a valuable resource for the scientific community to study MCC
  processes further and improve climate model accuracy.'
