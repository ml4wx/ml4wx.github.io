summary: Reviews more than 40 AI-based weather forecasting models, covering methods, datasets, extreme-weather
  skill, data assimilation and challenges such as explainability and physical constraints.
abstract: The field of Artificial Intelligence (AI)-based weather forecasting is growing rapidly, with
  continuous progress in model development, techniques, and performance improvements. This paper provides
  a comprehensive overview of AI-based weather forecasting models, focusing on their current status, challenges,
  and directions for further development. A review of more than 40 models, primarily proposed after 2015,
  underscores the importance of critically examining various aspects of AI-based forecasting. Unlike previous
  reviews that targeted only a limited number of models or features, this study addresses a complete set
  of aspects and analyzes existing challenges from multiple perspectives. These aspects include the Machine
  Learning (ML) and Deep Learning (DL) methods used, datasets, predictand parameters, overfitting, and
  capability for forecasting extreme weather, lead time, spatiotemporal scale, performance criteria, overfitting,
  data assimilation, data-driven models, and the analysis of state-of-the-art (SOTA) models such as FengWu,
  ClimaX, Pangu-Weather, FourCastNet, GraphCast, GenCast, and Artificial Intelligence Forecasting System
  (AIFS) from various viewpoints. The review also discusses current challenges, including limited historical
  data and data quality, small-scale weather forecasting, model explainability, uncertainty, extreme weather
  prediction, physical constraints, temporal adaptation, and generalization, and outlines potential future
  directions.
