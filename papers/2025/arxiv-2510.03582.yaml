summary: A CNN forecasts MJO indices up to 21 (RMM) and 33 (ROMI) days ahead, and spectral analysis shows
  large-scale patterns dominate the predictability.
abstract: 'The Madden-Julian oscillation (MJO) is a planetary-scale, intraseasonal tropical rainfall phenomenon
  crucial for global weather and climate; however, its dynamics and predictability remain poorly understood.
  Here, we leverage deep learning (DL) to investigate the sources of MJO predictability, motivated by
  a central difference in MJO theories: which spatial scales are essential for driving the MJO? We first
  develop a deep convolutional neural network (DCNN) to forecast the MJO indices (RMM and ROMI). Our model
  predicts RMM and ROMI up to 21 and 33 days, respectively, achieving skills comparable to leading subseasonal-to-seasonal
  models such as NCEP. To identify the spatial scales most relevant for MJO forecasting, we conduct spectral
  analysis of the latent feature space and find that large-scale patterns dominate the learned signals.
  Additional experiments show that models using only large-scale signals as the input have the same skills
  as those using all the scales, supporting the large-scale view of the MJO. Meanwhile, we find that small-scale
  signals remain informative: surprisingly, models using only small-scale input can still produce skillful
  forecasts up to 1-2 weeks ahead. We show that this is achieved by reconstructing the large-scale envelope
  of the small-scale activities, which aligns with the multi-scale view of the MJO. Altogether, our findings
  support that large-scale patterns--whether directly included or reconstructed--may be the primary source
  of MJO predictability.'
