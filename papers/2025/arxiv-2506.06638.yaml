summary: Covariate-adaptive conformal prediction adjusts tropical cyclone intensity forecast intervals
  using intensity and evolution stage, improving point accuracy and interval physical consistency.
abstract: Rapid intensification (RI) of tropical cyclones (TCs) poses a great challenge due to their highly
  nonlinear dynamics and inherent uncertainties. Conventional statistical dynamics and artificial intelligence
  prediction models typically rely on static parameterization schemes, which limits their ability to capture
  the non-stationary error structure in the intensity evolution. To address this issue, we propose a physically-inspired
  covariate adaptive conformal prediction framework that dynamically adjusts uncertainty quantification
  by incorporating process information such as intensity and evolutionary stage. Our approach not only
  surpasses state-of-the-art models in point prediction accuracy, but also delivers physically consistent
  and interpretable forecast intervals, establishing a more process-aware framework for probabilistic
  prediction of extreme weather events.
