summary: Autoencoder clustering reveals a six-phase MJO life cycle and a monitoring index that cuts spurious
  propagation more than tenfold versus RMM.
abstract: 'Accurately defining the life cycle of the Madden-Julian Oscillation (MJO), the dominant mode
  of intraseasonal climate variability, remains a foundational challenge due to its propagating nature.
  The established linear-projection method (RMM index) often conflates mathematical artifacts with physical
  states, while direct clustering in raw data space is confounded by a "propagation penalty." Here, we
  introduce an "AI-for-theory" paradigm to objectively discover the MJO''s intrinsic structure. We develop
  a deep learning model, PhysAnchor-MJO-AE, to learn a latent representation where vector distance corresponds
  to physical-feature similarity, enabling objective clustering of MJO dynamical states. Clustering these
  "MJO fingerprints" reveals the first complete, six-phase anatomical map of its life cycle. This taxonomy
  refines and critically completes the classical view by objectively isolating two long-hypothesized transitional
  phases: organizational growth over the Indian Ocean and the northward shift over the Philippine Sea.
  Derived from this anatomy, we construct a new physics-coherent monitoring framework that decouples location
  and intensity diagnostics. This framework reduces the rates of spurious propagation and convective misplacement
  by over an order of magnitude compared to the classical index. Our work transforms AI from a forecasting
  tool into a discovery microscope, establishing a reproducible template for extracting fundamental dynamical
  constructs from complex systems.'
