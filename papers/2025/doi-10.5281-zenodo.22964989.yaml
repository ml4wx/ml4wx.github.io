summary: CNN refines ECMWF turbulence diagnostics for 0–60 h aviation turbulence forecasts, beating SIGWX
  charts using 53,380 pilot and QAR reports.
abstract: 'Aviation turbulence poses significant operational and safety challenges, requiring accurate
  forecasting to improve flight planning and passenger safety. Traditional numerical weather prediction
  (NWP) models forecast atmospheric states by numerically solving mathematical equations of known physical
  laws, serving as the primary method for predicting weather phenomena, including aviation turbulence.
  In this study, we leveraged deep learning to enhance NWP-based turbulence predictions. We employ a convolutional
  neural network (CNN) variant to process NWP diagnostic indices derived from the European Centre for
  Medium-Range Weather Forecasts (ECMWF), generating refined turbulence predictions with a forecast time
  ranging from 0 to 60 hours. The experiments were performed on a dataset of 53,380 turbulence observations
  from Pilot Reports (PIREPs) and Quick Access Recorder (QAR) data collected from 2018 to 2022. We categorize
  turbulence into three intensity levels: (i) nil or light, (ii) moderate, and (iii) severe, aligning
  with International Civil Aviation Organization (ICAO) thresholds. The results demonstrate that our approach
  outperforms commonly used turbulence forecasting baselines, including significant weather (SIGWX) charts
  issued by the World Area Forecast Center (WAFC) and diagnostic indices generated by NWP models.'
