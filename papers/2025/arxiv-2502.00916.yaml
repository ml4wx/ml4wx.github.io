summary: Compares LLM-generated definitions of 300 IPCC glossary terms against official text, finding
  adherence around 0.57-0.59 and lower readability.
abstract: A common language with standardized definitions is crucial for effective climate discussions.
  However, concerns exist about LLMs misrepresenting climate terms. We compared 300 official IPCC glossary
  definitions with those generated by GPT-4o-mini, Llama3.1 8B, and Mistral 7B, analyzing adherence, robustness,
  and readability using SBERT sentence embeddings. The LLMs scored an average adherence of $0.57-0.59
  \pm 0.15$, and their definitions proved harder to read than the originals. Model-generated definitions
  vary mainly among words with multiple or ambiguous definitions, showing the potential to highlight terms
  that need standardization. The results show how LLMs could support environmental discourse while emphasizing
  the need to align model outputs with established terminology for clarity and consistency.
