summary: LWFNet, a Transformer and Kolmogorov-Arnold network, retrieves tropospheric wind fields from
  coherent Doppler lidar, extending the detection range where classical methods fail.
abstract: Accurate detection of wind fields within the troposphere is essential for atmospheric dynamics
  research and plays a crucial role in extreme weather forecasting. Coherent Doppler wind lidar (CDWL)
  is widely regarded as the most suitable technique for high spatial and temporal resolution wind field
  detection. However, since coherent detection relies heavily on the concentration of aerosol particles,
  which cause Mie scattering, the received backscattering lidar signal exhibits significantly low intensity
  at high altitudes. As a result, conventional methods, such as spectral centroid estimation, often fail
  to produce credible and accurate wind retrieval results in these regions. To address this issue, we
  propose LWFNet, the first Lidar-based Wind Field (WF) retrieval neural Network, built upon Transformer
  and the Kolmogorov-Arnold network. Our model is trained solely on targets derived from the traditional
  wind retrieval algorithm and utilizes radiosonde measurements as the ground truth for test results evaluation.
  Experimental results demonstrate that LWFNet not only extends the maximum wind field detection range
  but also produces more accurate results, exhibiting a level of precision that surpasses the labeled
  targets. This phenomenon, which we refer to as super-accuracy, is explored by investigating the potential
  underlying factors that contribute to this intriguing occurrence. In addition, we compare the performance
  of LWFNet with other state-of-the-art (SOTA) models, highlighting its superior effectiveness and capability
  in high-resolution wind retrieval. LWFNet demonstrates remarkable performance in lidar-based wind field
  retrieval, setting a benchmark for future research and advancing the development of deep learning models
  in this domain.
