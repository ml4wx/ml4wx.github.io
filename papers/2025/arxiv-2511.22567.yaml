summary: Epistemic-uncertainty acquisition with ConvCNPs for sensor placement in environmental and climate
  fields reduces model error better than total-uncertainty baselines.
abstract: Accurate sensor placement is critical for modeling spatio-temporal systems such as environmental
  and climate processes. Neural Processes (NPs), particularly Convolutional Conditional Neural Processes
  (ConvCNPs), provide scalable probabilistic models with uncertainty estimates, making them well-suited
  for data-driven sensor placement. However, existing approaches rely on total predictive uncertainty,
  which conflates epistemic and aleatoric components, that may lead to suboptimal sensor selection in
  ambiguous regions. To address this, we propose expected reduction in epistemic uncertainty as a new
  acquisition function for sensor placement. To enable this, we extend ConvCNPs with a Mixture Density
  Networks (MDNs) output head for epistemic uncertainty estimation. Preliminary results suggest that epistemic
  uncertainty driven sensor placement more effectively reduces model error than approaches based on overall
  uncertainty.
