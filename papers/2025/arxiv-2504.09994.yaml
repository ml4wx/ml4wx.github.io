summary: Advection-informed ResU-Nets for satellite thunderstorm nowcasting show skill gains only beyond
  about 2 h forecast time, consistent with a receptive-field scale argument.
abstract: The focus of nowcasting development is transitioning from physically motivated advection methods
  to purely data-driven Machine Learning (ML) approaches. Nevertheless, recent work indicates that incorporating
  advection into the ML value chain has improved skill for radar-based precipitation nowcasts. However,
  the generality of this approach and the underlying causes remain unexplored. This study investigates
  the generality by probing the approach on satellite-based thunderstorm nowcasts for the first time.
  Resorting to a scale argument, we then put forth an explanation when and why skill improvements can
  be expected. In essence, advection guarantees that thunderstorm patterns relevant for nowcasting are
  contained in the receptive field at long forecast times. To test our hypotheses, we train ResU-Nets
  solving segmentation tasks with lightning observations as ground truth. The input of the Baseline Neural
  Network (BNN) are short time series of multispectral satellite imagery and lightning observations, whereas
  the Advection-Informed Neural Network (AINN) additionally receives the Lagrangian persistence nowcast
  of all input channels at the desired forecast time. Overall, we find only a minor skill improvement
  of the AINN over the BNN when considering fully averaged scores. However, assessing skill conditioned
  on forecast time and advection speed, we demonstrate that our scale argument correctly predicts the
  onset of skill improvement of the AINN over the BNN after 2h forecast time. We confirm that, generally,
  advection becomes gradually more important with longer forecast times and higher advection speeds. Our
  work accentuates the importance of considering and incorporating the underlying physical scales when
  designing ML-based forecasting models.
