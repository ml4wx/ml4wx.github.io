summary: K-means clustering and correlation analysis group typhoon intensities and paths, with silhouette
  scores of 0.545 and 0.615; a basic exploratory study.
abstract: 'Given the increasing frequency of typhoon disasters and persistent prediction challenges, this
  study develops a typhoon classification model using machine learning to improve forecast accuracy. The
  research analyzed correlations between typhoon characteristics and environmental factors using Spearman
  coefficients, then visualized typhoon paths of different intensities. Recognizing multiple influencing
  factors, the study performed clustering analysis based on two key features: typhoon intensity and moving
  path, integrating these results for a comprehensive classification model. The model was validated by
  predicting typhoons in 2024. Results showed typhoon intensity significantly correlates positively with
  class and wind speed, while negatively with air pressure, and typhoon paths exhibit strong seasonal
  and geographical differences. K-means clustering determined the optimal number of clusters as 3 for
  intensity (silhouette coefficient: 0.545) and 4 for paths (silhouette coefficient: 0.615), indicating
  effective clustering. This model optimizes disaster response strategies and improves emergency management
  efficiency, offering substantial socioeconomic value for protecting lives and property in the context
  of increasing extreme weather events due to climate change.'
