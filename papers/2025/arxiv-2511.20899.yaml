summary: Pacific pacemaker experiments with a coupled deep-learning emulator show amplified forced ENSO
  teleconnections, overestimating blocking frequency and duration while underestimating peak intensity.
abstract: Coupled atmosphere-ocean deep learning (DL) climate emulators are a new frontier but are known
  to exhibit weak ENSO variability, raising questions about their ability to simulate teleconnections.
  Here, we present the first Pacific pacemaker (PACE) experiments using a coupled DL emulator (DLESyM)
  to bypass this weak variability and isolate the atmospheric response to observed ENSO forcing. We find
  that while the emulator realistically captures internal atmospheric variability, it produces a significantly
  amplified forced teleconnection response to ENSO. This amplified response leads to biases in simulating
  extremes, notably an overestimation of atmospheric blocking frequency and duration with the underestimation
  of peak intensity. Our findings underscore that coupled DL climate models require in-depth and physically-grounded
  validation, analogous to traditional numerical models, to build confidence in their use for physical
  climate analysis.
