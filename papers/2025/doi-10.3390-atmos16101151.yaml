summary: AI-based bias correction of ZJWARMS 72-hour forecasts at four mountain stations cuts temperature
  MAE from up to 3.3 °C to below 0.8 °C.
abstract: This study assesses the efficacy of the ZJWARMS model’s AI-based post-processing correction
  method for temperature and wind speed forecasts in complex terrain. By analyzing 72 h forecasts at four
  stations with varying elevations (from 273 m to 1327 m) in the Liuchun Lake region during December 2021–December
  2022, the study found that AI-based corrections substantially enhanced both forecast accuracy and stability.
  The results indicate that, after correction, temperature forecast accuracy at all stations exceeded
  99%, with the most notable relative gains at higher elevations (up to 48.1%). The mean absolute error
  (MAE) for temperature declined from 3.08 °C to below 0.8 °C at Octagonal Palace, and from 3.29 °C to
  below 0.6 °C at Mountaintop. Wind speed forecast accuracy also increased from approximately 60–70% to
  nearly 100%, with MAE generally constrained to the range of 0.2–0.4 m/s. In terms of extreme error control,
  the number of samples with temperature errors exceeding ±2 °C was markedly reduced. For instance, at
  Mountainside, the count dropped from 127 to 0. Extreme wind speed errors were also effectively eliminated.
  After correction, error distributions became more concentrated, and both temporal stability and spatial
  consistency showed notable improvement. These gains enhance operational forecasting and risk management
  in mountainous regions, for example, through threshold-based wind-hazard alerts and support for mountain-road
  icing, by providing more reliable, high-confidence guidance.
