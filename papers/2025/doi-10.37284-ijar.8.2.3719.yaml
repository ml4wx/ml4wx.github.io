summary: Compares LSTM and GRU with KNN and SVM for daily rainfall in Kilimanjaro, Tanzania; deep learning
  gave test RMSE of 6.35 mm versus 6.61 mm for the best classical model.
abstract: Accurate rainfall forecasting is crucial in activities such as agricultural planning, water
  resource management, and flood preparedness, so failure to accurately forecast rainfall might undermine
  these activities. This study aimed to improve the accuracy of daily rainfall prediction in Hai district,
  Kilimanjaro region, Tanzania, a region characterised by a bimodal rainfall pattern, by comparing rainfall
  prediction accuracies of Traditional Machine Learning (TML) and Deep Learning (DL) models. The 25-year
  daily rainfall dataset for Hai district was first pre-processed by cleaning, normalisation, and splitting
  into training (first 60%), validation (next 20%), and test (last 20%) sets. TML models (K-Nearest Neighbours
  (KNN) through its variant KNN Regressor and Support Vector Machine (SVM) through its variant Support
  Vector Regressor (SVR)) were developed, trained, and their performances compared with developed and
  trained DL models (Long Short-Term Memory (LSTM) and Gated Recurrent Units (GRU)). Each model’s test
  performance was evaluated using the Root Mean Squared Error (RMSE) metric. The findings revealed that
  the DL models, LSTM and GRU, achieved test RMSE scores of 6.35 mm and 6.49 mm, respectively, while the
  TML models, KNN and SVM, achieved test RMSE scores of 6.61 mm and 10.42 mm, respectively. The study
  demonstrated that DL models are more effective for accurate rainfall forecasting than TML models in
  regions with complex rainfall patterns. The insights gained will guide the development of more reliable,
  location-specific weather prediction systems, ultimately supporting informed decision-making in agriculture,
  environmental management, and flood risk reduction in Tanzania and other regions facing similar climatic
  challenges
