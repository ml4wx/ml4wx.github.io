summary: A 10-qubit quantum CNN-LSTM hybrid forecasts bow-echo convective evolution for one Corsican storm,
  claimed to be more robust to noise than classical CNN-LSTM; single-case evaluation.
abstract: 'We present a quantum-enhanced deep learning framework for short-term forecasting of extreme
  convective weather systems, specifically targeting the formation of bow echo structures through prediction
  clouds. Our approach integrates a quantum convolutional neural network (QCNN) into a classical convolutional
  neural network-long short-term memory (CNN-LSTM) pipeline, incorporating a 10-qubit variational quantum
  circuit executed on the lightning.qubit simulator. The model is trained using heterogeneous meteorological
  data (satellite images, convective available potential energy (CAPE) fields, lightning activity) from
  the extreme storm that hit the Corsican coast on August 18, 2022, preceding the convective event and
  evaluated during the critical intensification window (0700–0800 h). We compare this hybrid quantum model
  with classical CNN-LSTM and CNN-LSTM-Transformer architectures using three complementary metrics: Root
  mean squared error (RMSE), structural similarity index (SSIM), and Wasserstein distance. The quantum
  model demonstrates superior robustness to input noise and adversarial perturbations fast gradient sign
  method (FGSM), maintaining spatial coherence and stable prediction under degradation. These findings
  highlight the capacity of quantum circuits to encode more resilient representations for meteorological
  inference. This study provides a concrete application of hybrid QCNN architectures in the domain of
  extreme weather forecasting and lays the groundwork for future integration of topological data analysis
  to assess the preservation of topological features in quantum predictions.'
