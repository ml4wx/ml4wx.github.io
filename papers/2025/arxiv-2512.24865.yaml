summary: Latent twin autoencoders enable fast FORUM far-infrared all-sky radiative transfer inversion
  and scene classification, serving as a fast surrogate for full-physics retrievals.
abstract: 'The FORUM (Far-infrared Outgoing Radiation Understanding and Monitoring) mission will provide,
  for the first time, systematic far-infrared spectral measurements of Earth''s outgoing radiation, enabling
  improved understanding of atmospheric processes and the radiation budget. Retrieving atmospheric states
  from these observations constitutes a high-dimensional, ill-posed inverse problem, particularly under
  cloudy-sky conditions where multiple-scattering effects are present. In this work, we develop a data-driven,
  physics-aware inversion framework for FORUM all-sky retrievals based on latent twins: coupled autoencoders
  for atmospheric states and spectra, combined with bidirectional latent-space mappings. A lightweight
  model-consistency correction ensures physically plausible cloud variable reconstructions. The resulting
  framework demonstrates potential for retrievals of atmospheric, cloud and surface variables, providing
  information that can serve as a prior, initial guess, or surrogate for computationally expensive full-physics
  inversion methods. It also enables robust scene classification and near-instantaneous inference, making
  it suitable for operational near-real-time applications. We demonstrate its performance on synthetic
  FORUM-like data and discuss implications for future data assimilation and climate studies.'
