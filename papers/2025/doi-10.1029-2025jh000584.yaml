summary: SWANN neural network converts aircraft flight-level winds to tropical cyclone surface winds,
  improving on the operational wind-reduction procedure.
abstract: Abstract Estimates of the surface wind field in a tropical cyclone (TC) are required in real
  time by operational forecast centers to warn the public about potential impacts to life and property.
  In‐situ aircraft data must be adjusted from flight level to surface using wind reductions (WRs) since
  the aircraft cannot fly too low due to safety concerns. Current operational WRs do not capture all the
  variability in the TC surface wind field. In this study, an observational data set of Stepped Frequency
  Microwave Radiometer (SFMR) surface wind speeds that are collocated with flight‐level predictors is
  used to analyze the variability of WRs with respect to aircraft altitude and TC storm motion and intensity.
  The Surface Winds from Aircraft with a Neural Network (SWANN) model is trained on the observations with
  a custom loss function that prioritizes accurate prediction of relatively rare high‐wind observations
  and minimization of variance in the WRs. The model is capable of learning physical relationships that
  are consistent with theoretical understanding of the TC boundary layer. Radar‐derived wind fields at
  flight level and independent dropwindsonde in‐situ surface wind measurements are used to validate the
  SWANN model and show improvement over the current operational procedure. A test case shows that SWANN
  can produce a realistic asymmetric surface wind field from a radar‐derived flight‐level wind field which
  has a maximum wind speed similar to the operational intensity, suggesting promise for the method to
  lead to improved real‐time TC intensity estimation and prediction in the future.
