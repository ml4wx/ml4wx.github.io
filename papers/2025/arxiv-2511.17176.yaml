summary: Shows simple Gaussian and Perlin perturbations give AI deterministic models ensemble spread comparable
  to flow-based methods for Pakistan floods and China heatwave cases.
abstract: Accurate prediction of extreme weather events remains a major challenge for artificial intelligence-based
  weather prediction systems. While deterministic models such as FuXi, GraphCast, and SFNO have achieved
  competitive forecast skill relative to numerical weather prediction, their ability to represent uncertainty
  and capture extremes is still limited. This study investigates how state-of-the-art deterministic artificial
  intelligence-based models respond to initial-condition perturbations and evaluates the resulting ensembles
  in forecasting extremes. Using four perturbation strategies (Gaussian, Perlin noise, Hemispheric Centered
  Bred Vectors, and Huge Ensembles), we generate 50 member ensembles for the August 2022 Pakistan floods
  and China heatwave, and complement these case studies with a global threshold-based evaluation. Ensemble
  skill is assessed against ERA5 and compared with IFS ENS and the AIFS ENS probabilistic model using
  deterministic and probabilistic metrics. Results show that simpler perturbations like Gaussian and Perlin
  noise produce similarly realistic ensemble spread and probabilistic skill as flow-based approaches like
  HCBV and HENS, narrowing but not closing the performance gap with numerical weather prediction ensembles,
  or native probabilistic models which retain the highest probabilistic skill across variables. Model
  choice is the dominant factor for ensemble performance, not perturbation method. Across variables, models
  capture temperature extremes more effectively than precipitation. These findings demonstrate that simple
  input perturbations can extend deterministic models toward probabilistic forecasting in hardware-constrained
  settings, supporting artificial intelligence-driven early warning systems.
