summary: Combines graph neural networks with TCNN, LSTM or DeepAR to forecast 4 km CONUS Fire Weather
  Index 14 days ahead; GNN-TCNN gives the best skill.
abstract: 'Wildfires in the United States have increased in frequency and severity over recent decades,
  driven by climate change, altered weather patterns, and accumulated flammable materials. Accurately
  forecasting the Fire Weather Index (FWI) is crucial for mitigating wildfire risks and protecting ecosystems,
  human health, and infrastructure. This study analyzed FWI trends across the Continental United States
  (CONUS) from 2014 to 2023, using meteorological data from the gridMET dataset. Key variables, including
  temperature, relative humidity, wind speed, and precipitation, were utilized to calculate the FWI at
  a fine spatial resolution of 4 km, ensuring the precise identification of wildfire-prone areas. Based
  on this, our study developed a hybrid modeling framework to forecast FWI over a 14-day horizon, integrating
  Graph Neural Networks (GNNs) with Temporal Convolutional Neural Networks (TCNNs), Long Short-Term Memory
  (LSTM), and Deep Autoregressive Networks (DeepAR). The models were evaluated using the Index of Agreement
  (IOA) and root mean squared error (RMSE). The results revealed that the Southwest and West regions of
  CONUS consistently exhibited the highest mean FWI values, with the summer months demonstrating the greatest
  variability across all climatic zones. In terms of model performance on forecasting, Day 1 results highlighted
  the superior performance of the GNN-TCNN model, achieving an IOA of 0.95 and an RMSE of 1.21, compared
  to the GNN-LSTM (IOA: 0.93, RMSE: 1.25) and GNN-DeepAR (IOA: 0.92, RMSE: 1.30). On average, across all
  14 days, the GNN-TCNN outperformed others with a mean IOA of 0.885 and an RMSE of 1.325, followed by
  the GNN-LSTM (IOA: 0.852, RMSE: 1.590) and GNN-DeepAR (IOA: 0.8225, RMSE: 1.755). The GNN-TCNN demonstrated
  robust accuracy across short-term (days 1–7) and long-term (days 8–14) forecasts. This study advances
  wildfire risk assessment by combining descriptive analysis with hybrid modeling, offering a scalable
  and robust framework for FWI forecasting and proactive wildfire management amidst a changing climate.'
