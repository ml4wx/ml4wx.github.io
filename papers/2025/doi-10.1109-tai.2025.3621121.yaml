summary: A VAE plus spatiotemporal-transformer latent diffusion model generates large climate ensembles
  on the fly from the MPI Grand Ensemble, avoiding storage of pre-computed simulations.
abstract: Accurately estimating uncertainty in climate scenarios typically demands the generation of large
  ensembles of high-resolution simulations, a process that is both computationally expensive and memory
  intensive. To address this challenge, we present a novel deep learning framework that efficiently generates
  climate simulation ensembles by combining a variational autoencoder for dimensionality reduction with
  a denoising diffusion probabilistic model based on a spatio-temporal transformer architecture. This
  innovative approach not only captures the variability of the original ensemble, as validated on the
  Max Planck Institute Grand Ensemble, but also enables the rapid generation of large ensembles on-the-fly
  with minimal memory usage. This capability can transform climate research by eliminating the need to
  store vast amounts of pre-calculated simulation data, allowing for more extensive exploration of climate
  scenarios. These advances support more efficient uncertainty quantification, providing a broad range
  of possible outcomes that can effectively inform climate policy and adaptation strategies.
