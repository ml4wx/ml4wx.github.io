summary: Augmented-data CNN forecasts ENSO six months ahead from SST anomaly maps, reaching correlation
  0.83 versus 0.71 for a standard CNN.
abstract: Ability of predicting climate phenomena enables international organization and governments to
  manage natural disasters such as droughts. El Niño Sothern Oscillation (ENSO) is one the most influential
  and crucial phenomenon follows with large scale climatic events and can be used for predicting droughts
  and floods all around the world. Due to such a great importance, a new Convolutional Neural Network
  method based on augmented data (ACNN) for predicting ENSO on a relatively long period is developed in
  this research. The method is developed based on CNN to forecast ENSO six month earlier. Sea Surface
  Temperature (SST) anomaly maps are given to the model as the predictors and Niño 3.4 Index is the predictand.
  The method applies convolutional tensors to extract features from the maps, and delivers them to a fully
  connected neural network to discover connections between Niño Index and the features. A tricky augmentation
  process is used to increase the number of input data to compensate lack of observations. The model’s
  skill correlation is over 0.83 for January-February-March season, while, the original CNN method’ correlation
  is 0.71. The model can be executed on GPUs of a laptop without any need to super computers. The feature
  that makes it a great tool for predicting ENSO even for research institutions in low income countries.
