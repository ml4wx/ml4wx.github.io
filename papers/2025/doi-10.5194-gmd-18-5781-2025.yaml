summary: Extends WeatherBench 2 with sixteen binary verification metrics for wet and warm extremes, finding
  ROCSS suitable and IFS ENS most skilful across lead times.
abstract: Abstract. Binary forecasts on hydroclimatic extremes play a critical part in disaster prevention
  and risk management. While the recent WeatherBench 2 provides a versatile framework for the verification
  of deterministic and ensemble forecasts, this paper presents an extension to binary forecasts on the
  occurrence versus non-occurrence of hydroclimatic extremes. Specifically, sixteen verification metrics
  on the accuracy and discrimination of binary forecasts are employed and scorecards are generated to
  showcase the predictive performance. A case study is devised for binary forecasts of wet and warm extremes
  obtained from both deterministic and ensemble forecasts generated by three data-driven models, i.e.,
  Pangu-Weather, GraphCast and FuXi, and two numerical weather prediction products, i.e., ECMWF’s IFS
  HRES and IFS ENS. The results show that the receiver operating characteristic skill score (ROCSS) serves
  as a suitable metric due to its relative insensitivity to the rarity of hydroclimatic extremes. For
  wet extremes, the GraphCast tends to outperform the IFS HRES with the total precipitation of ERA5 data
  as ground truth. For warm extremes, the Pangu-Weather, GraphCast and FuXi tends to be more skilful than
  the IFS HRES within 3-day lead time but become less skilful as lead time increases. In the meantime,
  the IFS ENS tends to provide skilful forecasts of both wet and warm extremes at different lead times
  and at the global scale. Through diagnostic plots of forecast time series at selected grid cells, it
  is observed that at longer lead times, forecasts generated by data-driven models tend to be smoother
  and less skilful compared to those generated by physical models. Overall, the extension of the WeatherBench
  2 facilitates more comprehensive comparisons of hydroclimatic forecasts and provides useful information
  for forecast applications.
