summary: Feedforward neural network merges eight precipitation products into MoHiPr-TB, a 0.1° monthly
  Tarim Basin dataset for 1990–2022, bias-corrected with CLDAS.
abstract: A reliable precipitation dataset with high spatial resolution is essential for climate research
  in the Tarim Basin. This study evaluated the performances of four models, namely a random forest (RF),
  a long short-term memory network (LSTM), a support vector machine (SVM), and a feedforward neural network
  (FNN). FNN, which was found to be superior to the other models, was used to integrate eight precipitation
  datasets spanning from 1990 to 2022 across the Tarim Basin, resulting in a new monthly high-resolution
  (0.1°) precipitation dataset named MoHiPr-TB. This dataset was subsequently bias-corrected by the China
  Land Data Assimilation System version 2.0 (CLDAS2.0). Validation results indicate that the corrected
  MoHiPr-TB not only accurately reflects the spatial distribution of precipitation but also effectively
  simulates its intensity and interannual and seasonal variations. Moreover, MoHiPr-TB is capable of detecting
  the precipitation–elevation relationship in the Pamir Plateau, where precipitation initially increases
  and then decreases with elevation, as well as the synchronous variation of precipitation and elevation
  in the Tianshan region. Collectively, this study delivers a high-accuracy precipitation dataset for
  the Tarim Basin, which is anticipated to have extensive applications in meteorological, hydrological,
  and ecological research.
