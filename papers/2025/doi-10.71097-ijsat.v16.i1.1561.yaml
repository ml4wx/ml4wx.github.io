summary: Applies Bayesian neural networks, gradient boosting and decision trees to predict rain tomorrow
  from archived atmospheric data, with interactive visualization tools. Generic, with few quantitative
  results.
abstract: Everything, from farming to air travel, in our contemporary world is dependent on the weather
  forecast. However, traditional methods often ignore the intrinsic uncertainty in weather patterns leading
  to inaccurate predictions. This paper presents a groundbreaking method of predicting weather using Bayesian
  deep learning models; specifically, Bayesian neural networks are employed to capture the probabilistic
  nature of weather events and produce more accurate and reliable forecasts. These models represent a
  significant milestone in foretelling strategies as they are evaluated against popular metrics and trained
  with archived atmospheric data. Additionally, gradient boosting classifiers and decision tree classifiers
  have been performed as queries for performing comparative analyses about different machine learning
  algorithms used for predicting occurrence of rain tomorrow or any other type of climate-related information.
  For enhanced interpretability, this paper has developed interactive visualization tools that allow users
  to interactively explore predicted weather patterns and analyze levels of uncertainty with an aim of
  advancing the field of meteorology through providing actionable insights for responsible decision making
  within weather sensitive domains.
