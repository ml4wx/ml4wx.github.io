summary: Adds a learned triggering mechanism to a neural deep-convection parameterization in ARP-GEM,
  which runs stably online and generalizes to a warmer climate.
abstract: In this study, we improve a neural network (NN) parameterization of deep convection in the global
  atmosphere model ARP-GEM. To take into account the sporadic nature of convection, we develop a NN parameterization
  that includes a triggering mechanism that can detect whether deep convection is active or not within
  a grid-cell. This new data-driven parameterization outperforms the existing NN parameterization in present
  climate when replacing the original deep convection scheme of ARP-GEM. Online simulations with the NN
  parameterization run without stability issues. Then, this NN parameterization is evaluated online in
  a warmer climate. We confirm that using relative humidity instead of the specific total humidity as
  input for the NN (trained with present data) improves the performance and generalization in warmer climate.
  Finally, we perform the training of the NN parameterization with data from a warmer climate and this
  configuration get similar results when used in simulations in present or warmer climates.
