summary: Updates ECMWF's AIFS with bounding layers for physical consistency, better precipitation and
  new variables; operational at ECMWF since February 2025.
abstract: We present an update to ECMWF's machine-learned weather forecasting model AIFS Single with several
  key improvements. The model now incorporates physical consistency constraints through bounding layers,
  an updated training schedule, and an expanded set of variables. The physical constraints substantially
  improve precipitation forecasts and the new variables show a high level of skill. Upper-air headline
  scores also show improvement over the previous AIFS version. The AIFS has been fully operational at
  ECMWF since the 25th of February 2025.
