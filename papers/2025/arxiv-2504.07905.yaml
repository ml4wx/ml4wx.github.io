summary: Data-driven symbolic equations link winter storm precursors, notably low-tropospheric drying,
  to European extreme wind gusts, using GEV-informed transforms to curb overfitting while staying interpretable.
abstract: Reliably identifying and understanding temporal precursors to extreme wind gusts is crucial
  for early warning and mitigation. This study proposes a simple data-driven approach to extract key predictors
  from a dataset of historical extreme European winter windstorms and derive simple equations linking
  these precursors to extreme gusts over land. A major challenge is the limited training data for extreme
  events, increasing the risk of model overfitting. Testing various mitigation strategies, we find that
  combining dimensionality reduction, careful cross-validation, feature selection, and a nonlinear transformation
  of maximum wind gusts informed by Generalized Extreme Value distributions successfully reduces overfitting.
  These measures yield interpretable equations that generalize across regions while maintaining satisfactory
  predictive skill. The discovered equations reveal the association between a steady drying low-troposphere
  before landfall and wind gust intensity in Northwestern Europe.
