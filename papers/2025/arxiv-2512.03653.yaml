summary: Extrapolates neural network weights via regression on weight anomalies from data subsets, improving
  out-of-distribution climate predictions across three use cases.
abstract: 'This study proposes a method to enhance neural network performance when training data and application
  data are not very similar, e.g., out of distribution problems, as well as pattern and regime shifts.
  The method consists of three main steps: 1) Retrain the neural network towards reasonable subsets of
  the training data set and note down the resulting weight anomalies. 2) Choose reasonable predictors
  and derive a regression between the predictors and the weight anomalies. 3) Extrapolate the weights,
  and thereby the neural network, to the application data. We show and discuss this method in three use
  cases from the climate sciences, which include successful temporal, spatial and cross-domain extrapolations
  of neural networks.'
