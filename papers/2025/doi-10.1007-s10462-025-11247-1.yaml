summary: Proposes a deep LSTM tuned with genetic algorithms and mountain gazelle optimizer to forecast
  maximum temperatures in nine Egyptian cities, claiming better accuracy than baselines.
abstract: 'Abstract Climate change significantly impacts plant growth, food production, ecosystems, sustainable
  socio-economic development, and human health. With the growing availability of extensive historical
  climate data and the increasing demand for accurate production forecasting, there is a pressing need
  for reliable methods to determine the stochastic relationship between past and future values. This article
  introduces a novel deep learning model designed to overcome the limitations of traditional forecasting
  methods and achieve highly accurate predictions. The proposed approach is a deep long short-term memory
  (DLSTM) model optimized using genetic algorithms (GAs) and the mountain gazelle optimizer (MGO), which
  collectively fine-tune the architecture of the DLSTM model. The experiment utilized historical climate
  data from nine Egyptian cities: Asswan, Bane-Suef, Behira, Dakhalia, Menoufia, Minia, Qalyubia, Sharkia,
  and Sohag to evaluate the model’s performance. To ensure a fair and comprehensive evaluation, the effectiveness
  of the proposed MGO-GA-DLSTM model was compared with other established forecasting techniques. The evaluation
  metrics included mean absolute error (MAE), root mean square error (RMSE), mean absolute percentage
  error (MAPE), and R-squared ( $$R^2$$ ) to quantify prediction accuracy and model robustness. The findings
  demonstrate that the MGO-GA-DLSTM model outperforms existing methods in climate prediction, offering
  improved accuracy and reliability.'
