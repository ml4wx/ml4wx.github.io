summary: Dense neural network and XGBoost emulate 3D temperature and wind fields of tidally locked exoplanets
  from a 60-planet GCM grid, reproducing spectra within 32 ppm.
abstract: With the development of ever-improving telescopes capable of observing exoplanet atmospheres
  in greater detail and number, there is a growing demand for enhanced 3D climate models to support and
  help interpret observational data from space missions like CHEOPS, TESS, JWST, PLATO, and Ariel. However,
  the computationally intensive and time-consuming nature of general circulation models (GCMs) poses significant
  challenges in simulating a wide range of exoplanetary atmospheres. This study aims to determine whether
  machine learning (ML) algorithms can be used to predict the 3D temperature and wind structure of arbitrary
  tidally-locked gaseous exoplanets in a range of planetary parameters. A new 3D GCM grid with 60 inflated
  hot Jupiters orbiting A, F, G, K, and M-type host stars modelled with Exorad has been introduced. A
  dense neural network (DNN) and a decision tree algorithm (XGBoost) are trained on this grid to predict
  local gas temperatures along with horizontal and vertical winds. To ensure the reliability and quality
  of the ML model predictions, WASP-121 b, HATS-42 b, NGTS-17 b, WASP-23 b, and NGTS-1 b-like planets,
  which are all targets for PLATO observation, are selected and modelled with ExoRad and the two ML methods
  as test cases. The DNN predictions for the gas temperatures are to such a degree that the calculated
  spectra agree within 32 ppm for all but one planet, for which only one single HCN feature reaches a
  100 ppm difference. The developed ML emulators can reliably predict the complete 3D temperature field
  of an inflated warm to ultra-hot tidally locked Jupiter around A to M-type host stars. It provides a
  fast tool to complement and extend traditional GCM grids for exoplanet ensemble studies. The quality
  of the predictions is such that no or minimal effects on the gas phase chemistry, hence on the cloud
  formation and transmission spectra, are to be expected.
