summary: A conditional diffusion model extends ENSO forecast lead times beyond state-of-the-art, captures
  the spring predictability barrier, and links reverse diffusion to recharge-discharge dynamics.
abstract: Accurate long-range forecasting of the El \Nino-Southern Oscillation (ENSO) is vital for global
  climate prediction and disaster risk management. Yet, limited understanding of ENSO's physical mechanisms
  constrains both numerical and deep learning approaches, which often struggle to balance predictive accuracy
  with physical interpretability. Here, we introduce a data driven model for ENSO prediction based on
  conditional diffusion model. By constructing a probabilistic mapping from historical to future states
  using higher-order Markov chain, our model explicitly quantifies intrinsic uncertainty. The approach
  achieves extending lead times of state-of-the-art methods, resolving early development signals of the
  spring predictability barrier, and faithfully reproducing the spatiotemporal evolution of historical
  extreme events. The most striking implication is that our analysis reveals that the reverse diffusion
  process inherently encodes the classical recharge-discharge mechanism, with its operational dynamics
  exhibiting remarkable consistency with the governing principles of the van der Pol oscillator equation.
  These findings establish diffusion models as a new paradigm for ENSO forecasting, offering not only
  superior probabilistic skill but also a physically grounded theoretical framework that bridges data-driven
  prediction with deterministic dynamical systems, thereby advancing the study of complex geophysical
  processes.
