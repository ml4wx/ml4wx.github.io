summary: Compares Transformer, iTransformer and TVFormer with RNNs for short-term tropical cyclone track
  and intensity; iTransformer and TVFormer cut errors by up to 50% over RNNs.
abstract: 'Tropical cyclones (TCs) are destructive meteorological phenomena, necessitating accurate predictions
  of TC track and intensity to reduce risks to human life. This study evaluates three Transformer-based
  models – vanilla Transformer (Transformer), inverted Transformer (iTransformer), and temporal-variate
  Transformer (TVFormer) – which are trained, validated, and tested on best track data from 1980 to 2021
  from the China Meteorological Administration for TC prediction, integrating temporal, variate, and hybrid
  token embeddings to analyze temporal and variate correlations. Comparative analysis with four recurrent
  neural network (RNN) models demonstrates the superiority of the refined Transformer models over RNNs:
  iTransformer reduces mean absolute error (MAE) and root mean square error (RMSE) by 29.55% and 25.80%
  (latitude), 50.31% and 46.18% (longitude), 8.71% and 9.98% (pressure), and 8.68% and 9.45% (wind speed),
  while TVFormer achieves MAE and RMSE reductions of 13.98% and 13.84% (latitude), 39.11% and 38.02% (longitude),
  13.69% and 14.02% (pressure), and 12.84% and 12.94% (wind speed) on average. Among Transformer variants,
  iTransformer excels in track prediction, outperforming Transformer with 21.74% lower MAE and 18.26%
  lower RMSE for latitude, and 32.73% lower MAE and 24.01% lower RMSE for longitude. TVFormer dominates
  intensity prediction, reducing pressure errors by 4.42% (MAE) and 3.92% (RMSE) and wind speed errors
  by 19.21% (MAE) and 14.79% (RMSE) compared to Transformer, while outperforming iTransformer with 4.59%
  lower MAE and 3.68% lower RMSE for pressure and 3.83% lower MAE and 3.18% lower RMSE for wind speed.
  Notably, TVFormer also enhances track prediction, with 7.10% reduction in MAE and 7.02% reduction in
  RMSE for latitude, and 22.84% reduction in MAE and 17.09% reduction in RMSE for longitude compared to
  Transformer. These results highlight the superiority of iTransformer in track prediction and the efficacy
  of TVFormer in intensity prediction, thanks to their ability to exploit temporal and variate dependencies,
  offering potential for TC disaster preparedness systems.'
