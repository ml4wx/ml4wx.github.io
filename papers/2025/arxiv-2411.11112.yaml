summary: Comparison finds quantile regression outperforms machine learning for forecasting the next year's
  Atlantic hurricane count and introduces a directional anticipation index.
abstract: ABSTRACT In this article, we study the problem of forecasting the next year's number of Atlantic
  hurricanes, which is relevant in many fields of applications such as land‐use planning, hazard mitigation,
  reinsurance and long‐term weather derivative market. Considering a set of well‐known predictors, we
  compare the forecasting accuracy of both machine learning and classical statistical models, showing
  that the latter may be more adequate than the first. Quantile regression models, which are adopted for
  the first time for forecasting hurricane numbers, provide the best results. Moreover, we construct a
  new index showing good properties in anticipating the direction of the future number of hurricanes.
  We consider different evaluation metrics based on both magnitude forecasting errors and directional
  accuracy.
