summary: TFA-Net, a dual-branch Transformer fusing satellite images and intensity histories, estimates
  tropical cyclone intensity with RMSE 7.21 knots on the TCIR dataset.
abstract: Deep learning models have significantly advanced tropical cyclone (TC) intensity estimation
  from satellite images. While the potential of temporal information for improving TC intensity prediction
  is recognized, existing methods have not fully leveraged this aspect. To address this, we propose TFA-Net,
  a deep-learning temporal feature aggregation framework based on a dual-branch Transformer, for TC intensity
  estimation. To enrich the available data features, our TFA-Net utilizes both image and historical intensity
  sequences. To enhance feature exchange within and between these sequences, the framework employs global
  attention tokens and cross-attention modules. Furthermore, to adaptively focus on different temporal
  lengths, a gated feature fusion module combines models with varying input sequence lengths, allowing
  TFA-Net to consider both long-term and short-term TC features for improved prediction. Experimental
  results show that the estimation performance is improved through our model's in-depth consideration
  of the temporal continuity of TC. Our model achieved a root mean square error (RMSE) of 7.21 knots on
  the TCIR dataset, demonstrating the Transformer's potential for real-time TC intensity estimation by
  effectively extracting time-series information from satellite imagery
