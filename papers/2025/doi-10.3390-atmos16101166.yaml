summary: PSO-tuned TabTransformer maps heatwave susceptibility across Central Asia from ERA5-derived heatwave
  evidence, reaching R2 0.938 and AUROC 0.940.
abstract: This study pioneers a fully remote sensing-based framework for mapping heatwave susceptibility,
  integrating the TabTransformer deep learning model with Particle Swarm Optimization (PSO) for robust
  hyperparameter tuning. The central question addressed is whether a fully remote sensing-driven, PSO-optimized
  TabTransformer can achieve accurate, scalable, and spatially detailed heatwave susceptibility mapping
  in data-scarce regions such as Central Asia. Utilizing ERA5-derived heatwave evidence and thirteen environmental
  and socio-economic predictors, the workflow produces high-resolution susceptibility maps spanning five
  Central Asian countries. Comparative analysis evidences that the PSO-optimized TabTransformer model
  outperforms the baseline across multiple metrics. On the test set, the optimized model achieved an RMSE
  of 0.123, MAE of 0.034, and R2 of 0.938, outperforming the standalone TabTransformer (RMSE = 0.132,
  MAE = 0.038, R2 = 0.93). Discriminative capacity also improved, with AUROC increasing from 0.933 to
  0.940. The PSO-tuned model delivered faster convergence, lower final loss, and more stable accuracy
  during training and validation. Spatial outputs reveal heightened susceptibility in southern and southwestern
  sectors—Turkmenistan, Uzbekistan, southern Kazakhstan, and adjacent lowlands—with statistically significant
  improvements in spatial precision and class delineation confirmed by Chi-squared, Friedman, and Wilcoxon
  tests, all with congruent p-values of <0.0001. Feature importance analysis consistently identifies maximum
  temperature, frequency of hot days, and rainfall as dominant predictors. These advancements validate
  the potential of data-driven, deep learning approaches for reliable, scalable environmental hazard assessment,
  crucial for climate adaptation planning in vulnerable regions.
