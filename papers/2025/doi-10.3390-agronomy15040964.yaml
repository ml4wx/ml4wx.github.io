summary: Reinforcement learning guides UAV cruises while a Transformer predicts extreme weather for farms,
  reporting 0.91 overall accuracy and 0.92 for hail.
abstract: Extreme weather prediction plays a crucial role in agricultural production and disaster prevention.
  This study proposes a lightweight extreme weather early warning model based on UAV cruise monitoring,
  a density-aware attention mechanism, and edge computing. Reinforcement learning is utilized to optimize
  UAV cruise paths, while a Transformer-based model is employed for weather prediction. Experimental results
  demonstrate that the proposed method achieves an overall prediction accuracy of 0.91, a precision of
  0.93, a recall of 0.88, and an F1-score of 0.91. In the prediction of different extreme weather events,
  the proposed method attains an accuracy of 0.89 for strong wind conditions, 0.92 for hail, and 0.89
  for late spring cold, all outperforming state-of-the-art methods. These results validate the effectiveness
  and applicability of the proposed approach in extreme weather forecasting.
