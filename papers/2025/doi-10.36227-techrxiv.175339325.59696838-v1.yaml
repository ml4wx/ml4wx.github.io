summary: IoT weather sensors in Chennai feed LSTM, random forest and other models; LSTM gives the best
  temperature forecast accuracy in a small local study.
abstract: Using real-time environmental data from Internet of Things-based weather sensors, this project
  offers a smart weather forecasting system. The Meenambakkam region's temperature, humidity, pressure,
  wind speed, and solar radiation are all included in the dataset. We used a number of machine learning
  models, such as K-Means Clustering, LSTM (Long Short-Term Memory), Random Forest Regressor, Decision
  Tree Regressor, and Linear Regression, to increase forecasting accuracy. We used metrics such as the
  accuracy percentage and R2 score to assess each model's performance. The best accuracy in temperature
  forecasting was attained by the LSTM model, which is perfect for time series prediction. K-Means While
  traditional models provided accurate and timely forecasts, clustering revealed hidden patterns in weather
  behaviour This system demonstrates how effective and automated weather forecasting is made possible
  by fusing IoT and machine learning.
