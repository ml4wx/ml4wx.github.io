summary: Proposes a climate OSSE framework that uses machine learning to calibrate GISS-E3 physics against
  satellite data, quantifying the value of boundary-layer measurements.
abstract: The rich history of observing system simulation experiments (OSSEs) does not yet include a well-established
  framework for using climate models. The need for a climate OSSE is triggered by the need to quantify
  the value of a particular measurement for reducing the uncertainty in climate predictions, which differ
  from numerical weather predictions in that they depend on future atmospheric composition rather than
  the current state of the weather. However, both weather and climate modeling communities share a need
  for motivating major observing system investments. Here we outline a new framework for climate OSSEs
  that leverages the use of machine-learning to calibrate climate model physics against existing satellite
  data. We demonstrate its application using NASA's GISS-E3 model to objectively quantify the value of
  potential future improvements in spaceborne measurements of Earth's planetary boundary layer. A mature
  climate OSSE framework should be able to quantitatively compare the ability of proposed observing system
  architectures to answer a climate-related question, thus offering added value throughout the mission
  design process, which is subject to increasingly rapid advances in instrument and satellite technology.
  Technical considerations include selection of observational benchmarks and climate projection metrics,
  approaches to pinpoint the sources of model physics uncertainty that dominate uncertainty in projections,
  and the use of instrument simulators. Community and policy-making considerations include the potential
  to interface with an established culture of model intercomparison projects and a growing need to economically
  assess the value-driven efficiency of social spending on Earth observations.
