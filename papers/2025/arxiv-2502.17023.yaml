summary: Open 13-month Russian wildfire dataset with meteorological conditions, plus ML models identifying
  environmental drivers of fire occurrence and spread.
abstract: Modern fire management systems increasingly rely on satellite data and weather forecasting;
  however, access to comprehensive datasets remains limited due to proprietary restrictions. Despite the
  ecological significance of wildfires, large-scale, multi-regional research is constrained by data scarcity.
  Russian diverse ecosystems play a crucial role in shaping Eurasian fire dynamics, yet they remain underexplored.
  This study addresses existing gaps by introducing an open-access dataset that captures detailed fire
  incidents alongside corresponding meteorological conditions. We present one of the most extensive datasets
  available for wildfire analysis in Russia, covering 13 consecutive months of observations. Leveraging
  machine learning techniques, we conduct exploratory data analysis and develop predictive models to identify
  key fire behavior patterns across different fire categories and ecosystems. Our results highlight the
  critical influence of environmental factor patterns on fire occurrence and spread behavior. By improving
  the understanding of wildfire dynamics in Eurasia, this work contributes to more effective, data-driven
  approaches for proactive fire management in the face of evolving environmental conditions.
