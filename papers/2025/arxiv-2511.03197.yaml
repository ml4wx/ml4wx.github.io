summary: Probabilistic U-Net with a variational latent space downscales precipitation and temperature
  16x; WMSE-MS-SSIM handles extremes best, while afCRPS better captures spatial variability.
abstract: Climate models are limited by heavy computational costs, often producing outputs at coarse spatial
  resolutions, while many climate change impact studies require finer scales. Statistical downscaling
  bridges this gap, and we adapt the probabilistic U-Net for this task, combining a deterministic U-Net
  backbone with a variational latent space to capture aleatoric uncertainty. We evaluate four training
  objectives, afCRPS and WMSE-MS-SSIM with three settings for downscaling precipitation and temperature
  from $16\times$ coarser resolution. Our main finding is that WMSE-MS-SSIM performs well for extremes
  under certain settings, whereas afCRPS better captures spatial variability across scales.
