summary: STCast uses spatial-aligned attention to adaptively optimize regional boundaries and a temporal
  mixture-of-experts for monthly routing, outperforming baselines on global, regional, extreme and ensemble
  tasks.
abstract: 'To gain finer regional forecasts, many works have explored the regional integration from the
  global atmosphere, e.g., by solving boundary equations in physics-based methods or cropping regions
  from global forecasts in data-driven methods. However, the effectiveness of these methods is often constrained
  by static and imprecise regional boundaries, resulting in poor generalization ability. To address this
  issue, we propose Spatial-Temporal Weather Forecasting (STCast), a novel AI-driven framework for adaptive
  regional boundary optimization and dynamic monthly forecast allocation. Specifically, our approach employs
  a Spatial-Aligned Attention (SAA) mechanism, which aligns global and regional spatial distributions
  to initialize boundaries and adaptively refines them based on attention-derived alignment patterns.
  Furthermore, we design a Temporal Mixture-of-Experts (TMoE) module, where atmospheric variables from
  distinct months are dynamically routed to specialized experts using a discrete Gaussian distribution,
  enhancing the model''s ability to capture temporal patterns. Beyond global and regional forecasting,
  we evaluate our STCast on extreme event prediction and ensemble forecasting. Experimental results demonstrate
  consistent superiority over state-of-the-art methods across all four tasks. Code: https://github.com/chenhao-zju/STCast'
