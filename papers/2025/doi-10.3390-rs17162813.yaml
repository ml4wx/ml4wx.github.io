summary: A backpropagation neural network retrieves ocean surface wind speed and direction from FY-3E
  WindRAD radar, beating official products at 1.00 m/s speed RMSE against ERA5.
abstract: Ocean surface wind fields are crucial for marine environmental research and applications in
  weather forecasting, ocean disaster monitoring, and climate change studies. However, traditional wind
  retrieval methods often struggle with modeling complexity and ambiguity due to the nonlinear nature
  of geophysical model functions (GMFs), leading to increased computational costs and reduced accuracy.
  To tackle these challenges, this study establishes a sea surface wind field retrieval model employing
  a backpropagation (BP) neural network, which integrates multi-angular observations from the Wind Radar
  (WindRAD) sensor aboard the Fengyun-3E (FY-3E) satellite. Experimental results show that the proposed
  model achieves high precision in retrieving both wind speed and direction. The wind speed model achieves
  a root-mean-square error (RMSE) of 1.20 m/s for the training set and 1.00 m/s for the selected test
  set when using ERA5 data as the reference, outperforming the official WindRAD products. For wind direction,
  the model attains an RMSE of 23.99° on the training set and 24.58° on the test set. Independent validation
  using Tropical Atmosphere Ocean (TAO) buoy observations further confirms the model’s effectiveness,
  yielding an RMSE of 1.29 m/s for wind speed and 24.37° for wind direction, also surpassing official
  WindRAD products. The BP neural network effectively captures the nonlinear relationship between wind
  parameters and radar backscatter signals, showing significant advantages over traditional methods and
  maintaining good performance across different wind speeds, particularly in the moderate range (4–10
  m/s). In summary, the method proposed herein significantly enhances wind field retrieval accuracy from
  space; it has the potential to optimize satellite wind field products and improve global wind monitoring
  and meteorological forecasting.
