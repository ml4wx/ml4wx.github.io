summary: GEN2 couples a conditional Gaussian emulator with an ML correction step to emulate climate extremes
  over long runs, extrapolating to unseen warming scenarios from one training realization.
abstract: Accurately quantifying the increased risks of climate extremes requires generating large ensembles
  of climate realization across a wide range of emissions scenarios, which is computationally challenging
  for conventional Earth System Models. We propose GEN2, a generative prediction-correction framework
  for an efficient and accurate forecast of the extreme event statistics. The prediction step is constructed
  as a conditional Gaussian emulator, followed by a non-Gaussian machine-learning (ML) correction step.
  The ML model is trained on pairs of the reference data and the emulated fields nudged towards the reference,
  to ensure the training is robust to chaos. We first validate the accuracy of our model on historical
  ERA5 data and then demonstrate the extrapolation capabilities on various future climate change scenarios.
  When trained on a single realization of one warming scenario, our model accurately predicts the statistics
  of extreme events in different scenarios, successfully extrapolating beyond the distribution of training
  data.
