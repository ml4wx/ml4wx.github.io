summary: Uses gradient boosting surrogate models in a multilevel tuning framework to optimise CAM5 precipitation
  parameters, giving a 19% average improvement in selected regions.
abstract: The uncertainty of physical parameters is a major factor contributing to poor precipitation
  simulation performance in Earth system models (ESMs), particularly in tropical and Pacific regions.
  To address the high computational cost of repetitive ESM runs, this study proposes a multilevel surrogate
  model-based parameter optimization framework and applies it to improve the precipitation performance
  of CAM5. A top-level surrogate model using gradient boosting regression trees (GBRTs) was constructed,
  leveraging the candidate point (CAND) approach applied to balance exploration and exploitation. A bottom-level
  surrogate model was then built based on a small, selected dataset; we designed a trust region approach
  to adjust the sampling region during the bottom-level tuning process. Experimental results demonstrate
  that the proposed method achieves fast convergence and significantly enhances precipitation simulation
  accuracy, with an average improvement of 19% in selected regions. In integrating optimization results
  through a nonuniform parameterization scheme and parameter smoothing, substantial improvements were
  observed in the South Pacific, Niño, South America, and East Asia. Comparisons with remote sensing data
  confirm that the optimized precipitation simulations do not introduce significant biases to other variables,
  validating the effectiveness and robustness of the proposed method.
