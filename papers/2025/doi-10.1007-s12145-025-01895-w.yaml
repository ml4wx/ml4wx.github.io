summary: TGPM deep learning fuses ERA5, MERRA-2 and auxiliary data to reconstruct a 10-year hourly 0.01°
  surface air temperature dataset for Qinghai that outperforms five other ML methods.
abstract: Abstract The Qinghai-Tibet Plateau, often referred to as the “Roof of the World”, has temperature
  variations that significantly affect both the local and surrounding ecosystems. Qinghai Province, located
  at the northeastern gateway to the plateau, serves as a microcosm of the plateau’s broader temperature
  changes. Therefore, it is crucial to study the temperature changes in Qinghai Province. However, existing
  meteorological data, including ground observations, atmospheric reanalysis data, and satellite remote
  sensing data, suffer from low accuracy due to limitations in time and space. In this research, we introduce
  a deep learning approach to integrate multi-source temperature data and reconstruct a 10-year near-surface
  temperature dataset with a temporal resolution of 1 hour and a spatial resolution of 0.01°. The reconstruction
  of near-surface temperature was performed by inputting two atmospheric reanalysis products-European
  Centre for Medium-Range Weather Forecasts Regional Reanalysis Version 5 (ERA5) and Modern-Era Retrospective
  Analysis for Research and Applications, Version 2 (MERRA-2)-along with auxiliary variables that influence
  temperature, into the newly developed Temporal Gated Positional Model (TGPM) deep learning model. The
  reconstructed dataset from the TGPM model was then compared to ground observation data and evaluated
  against datasets generated by five other machine learning methods. The results show that the fusion
  dataset generated by the TGPM model closely fits the target data, outperforming the products from the
  other five methods across all evaluation metrics. The correlation coefficient (CC), coefficient of determination
  (R2), mean absolute error (MAE), root mean square error (RMSE), mean square error (MSE), and relative
  bias (RB) for the TGPM near-surface temperature dataset were 0.9949, 0.9896, 0.7713°C, 1.0901°C, 1.1888
  °C2, and 4.02%, respectively. Overall, the deep learning method proposed in this study is more suitable
  for near-surface temperature reconstruction in Qinghai Province, providing a robust foundation for further
  research on temperature variations and ecological conservation in both Qinghai and the broader Qinghai-Tibet
  Plateau. The reconstructed dataset also offers actionable insights for climate policy formulation, disaster
  risk reduction, and ecosystem management in high-altitude regions.
