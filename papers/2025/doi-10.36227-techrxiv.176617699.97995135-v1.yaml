summary: Week-ahead offshore wind power forecaster fusing NWP and SCADA data, with a decision-aware proxy
  metric that reduces MAE and curtailment regret versus operational baselines on Belgian data.
abstract: This paper presents a week-ahead offshore wind power forecasting framework aimed at improving
  maintenance scheduling decisions. The proposed forecaster fuses numerical weather predictions, an operational
  auxiliary machine-learning forecast, and high-resolution SCADA measurements to produce 15-minute predictions
  up to seven days ahead. Because the downstream outage scheduler is an industrial mixed-integer linear
  program whose internal objective and constraints are partially unavailable, we treat it as a black box
  and avoid end-to-end decision-focused training. Instead, we introduce a decision-aware proxy metric
  based on (i) window-average power relative to operator thresholds and (ii) high-frequency behavior relevant
  to asset limits. The proxy is used for model selection and hyperparameter tuning. Experiments on Belgian
  offshore grid data show improvements over two operational baselines in mean absolute error and in scheduling-oriented
  metrics, including reduced curtailment regret and higher recovery of wind-perfect maintenance windows.
