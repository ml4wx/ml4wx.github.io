summary: A systematic review of neural network and fuzzy logic approaches to basin-scale precipitation
  estimation, finding growing use of hybrid models with persistent resolution and accuracy challenges.
abstract: Precipitation estimation at the river basin level is essential for watershed management, the
  analysis of extreme events and weather and climate dynamics, and hydrologic modeling. In recent years,
  new approaches and tools such as artificial intelligence techniques have been used for precipitation
  estimation, offering advantages over traditional methods. Two major paradigms are artificial neural
  networks and fuzzy logic systems, which can be used in a wide variety of configurations, including hybrid
  and modular models. This work presents a literature review on hybrid metaheuristic and artificial intelligence
  models based on signal processes, focusing on the applications of these techniques in precipitation
  analysis and estimation. The selection and comparison criteria used were the model type, the input and
  output variables, the performance metrics, and the fields of application. An increase in the number
  of this type of studies was identified, mainly in applications involving neural network models, which
  tend to get more sophisticated according to the availability and quality of training data. On the other
  hand, fuzzy logic models tend to hybridize with neural models. There are still challenges related to
  prediction performance and spatial and temporal resolution at the basin and micro-basin levels, but,
  overall, these paradigms are very promising for precipitation analysis.
