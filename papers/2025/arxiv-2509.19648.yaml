summary: S2Transformer uses structured subgraph attention for global station weather forecasting, achieving
  up to 16.8% gains over time series baselines at low cost.
abstract: Global Station Weather Forecasting (GSWF) is a key meteorological research area, critical to
  energy, aviation, and agriculture. Existing time series forecasting methods often ignore or unidirectionally
  model spatial correlation when conducting large-scale global station forecasting. This contradicts the
  intrinsic nature underlying observations of the global weather system, limiting forecast performance.
  To address this, we propose a novel Spatial Structured Attention Block in this paper. It partitions
  the spatial graph into a set of subgraphs and instantiates Intra-subgraph Attention to learn local spatial
  correlation within each subgraph, and aggregates nodes into subgraph representations for message passing
  among the subgraphs via Inter-subgraph Attention -- considering both spatial proximity and global correlation.
  Building on this block, we develop a multiscale spatiotemporal forecasting model S$^2$Transformer by
  progressively expanding subgraph scales. The resulting model is both scalable and able to produce structured
  spatial correlation, and meanwhile, it is easy to implement. The experimental results show that it can
  achieve performance improvements up to 16.8% over time series forecasting baselines at low running costs.
