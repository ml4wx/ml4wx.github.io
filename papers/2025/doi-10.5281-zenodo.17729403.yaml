summary: Framework combining statistical and ML methods to attribute global monsoon extremes to ENSO,
  MJO, IOD and NAO teleconnections; no quantitative results reported.
abstract: Global monsoon systems are vital components of the Earth's climate, providing essential water
  resources to billions while also posing significant risks through extreme rainfall and drought events.
  The variability of these monsoon systems, particularly their extreme phases, is influenced by a complex
  interplay of internal dynamics and remote atmospheric and oceanic teleconnections. While individual
  impacts are well-documented, a comprehensive and quantified understanding of their collective, often
  non-linear, and regionally specific interactions in driving compound extreme events across multiple
  monsoon domains remains an active area of research. This paper investigates the intricate roles of four
  prominent cross-basin teleconnection phenomena—the El Ni~no-Southern Oscillation (ENSO), the Madden-Julian
  Oscillation (MJO), the Indian Ocean Dipole (IOD), and the North Atlantic Oscillation (NAO)—as drivers
  of global monsoon extremes. To address the existing research gap, we propose a novel and robust methodological
  framework that integrates advanced statistical and machine learning approaches to systematically identify,
  attribute, and quantify the interactive contributions of ENSO, MJO, IOD, and NAO. This framework aims
  to precisely determine how these phenomena modulate the intensity, spatial extent, and timing of extreme
  precipitation and dry spells across major global monsoon regions, offering a holistic perspective for
  enhanced prediction and climate resilience. The paper underscores the necessity of such a multi-teleconnection
  approach for enhancing long-range monsoon forecasting capabilities and informing climate resilience
  strategies.
