summary: Random Forest analysis of ERA5 sea surface temperature for six events links 31–33°C SST to tropical
  cyclone formation near Indonesia, with high accuracy.
abstract: Tropical cyclones are atmospheric phenomena that occur in warm ocean areas, including the northern
  and southern regions of Indonesia. Although rarely formed directly in Indonesia, tropical cyclones from
  the Pacific and Indian Oceans often have a significant impact on weather conditions in Indonesia. This
  study was conducted to identify the influence of Sea Surface Temperature (SST) on the formation and
  development of tropical cyclones using a machine learning approach with a Random Forest model. The data
  used was in the form of reanalysis of SST data sourced from ECMWF (European Center for Medium - Range
  Weather Forecast) and analyzed for six tropical cyclone events representing the northern and southern
  regions of Indonesia. In addition, this study also aims to evaluate the effectiveness of machine learning-based
  prediction models in predicting SST parameters by using evaluation metrics such as RMSE, MAE, and R²
  to ensure prediction accuracy. The results showed that the SST values that supported the formation of
  tropical cyclones ranged from 31–33°C, which corresponds to the minimum temperature criteria for the
  formation of tropical cyclone systems. The Random Forest model showed excellent performance with low
  RMSE and MAE scores, and an R² value close to 1 in all cases tested with Tropical Cyclone Dahlia being
  the best case with the highest prediction accuracy. This study shows that the Random Forest model is
  able to effectively capture complex patterns of SST and provide accurate predictions, potentially as
  an instrument to understand and mitigate risks associated with tropical cyclone events in Indonesia.
