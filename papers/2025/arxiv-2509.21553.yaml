summary: AutoClimDS pairs a climate knowledge graph with LLM agents that reproduce published climate figures
  from natural-language instructions, where general LLMs fail to find datasets.
abstract: Climate data science remains constrained by fragmented data sources, heterogeneous formats,
  and steep technical expertise requirements. These barriers slow discovery, limit participation, and
  undermine reproducibility. We present AutoClimDS, a Minimum Viable Product (MVP) Agentic AI system that
  addresses these challenges by integrating a curated climate knowledge graph (KG) with a set of Agentic
  AI workflows designed for cloud-native scientific analysis. The KG unifies datasets, metadata, tools,
  and workflows into a machine-interpretable structure, while AI agents, powered by generative models,
  enable natural-language query interpretation, automated data discovery, programmatic data acquisition,
  and end-to-end climate analysis. A key result is that AutoClimDS can reproduce published scientific
  figures and analyses from natural-language instructions alone, completing the entire workflow from dataset
  selection to preprocessing to modeling. When given the same tasks, state-of-the-art general-purpose
  LLMs (e.g., ChatGPT GPT-5.1) cannot independently identify authoritative datasets or construct valid
  retrieval workflows using standard web access. This highlights the necessity of structured scientific
  memory for agentic scientific reasoning. By encoding procedural workflow knowledge into a KG and integrating
  it with existing technologies (cloud APIs, LLMs, sandboxed execution), AutoClimDS demonstrates that
  the KG serves as the essential enabling component, the irreplaceable structural foundation, for autonomous
  climate data science. This approach provides a pathway toward democratizing climate research through
  human-AI collaboration.
