summary: Green's function experiments with the ACE emulator test its top-of-atmosphere radiative response
  to SST patterns, finding it likely underestimates historical warming feedbacks.
abstract: The sensitivity of the radiative flux at the top of the atmosphere to surface temperature perturbations
  cannot be directly observed. The relationship between sea surface temperature (SST) and top-of-atmosphere
  radiation can be estimated with Green's function simulations by locally perturbing the sea surface temperature
  boundary conditions in atmospheric climate models. We perform such simulations with the Ai2 Climate
  Emulator (ACE), a machine learning-based emulator trained on ERA5 reanalysis data (ACE2-ERA5). This
  produces a sensitivity map of the top-of-atmosphere radiative response to surface warming that aligns
  with our physical understanding of radiative feedbacks. However, ACE2-ERA5 likely underestimates the
  radiative response to historical warming. We compare to two additional versions of ACE and traditional
  climate models. We argue that Green's function experiments can be used to evaluate the performance and
  limitations of machine learning-based climate emulators by examining if causal physical relationships
  are correctly represented and testing their capability for out-of-distribution predictions.
