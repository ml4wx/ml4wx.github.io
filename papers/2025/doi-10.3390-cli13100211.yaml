summary: Automatic ERA5-based cold front labelling combining thermal front parameter and advection yields
  spatially aligned training labels for South America, detecting 58% more fronts over the South Atlantic.
abstract: Deep learning models for atmospheric pattern recognition require spatially consistent training
  labels that align precisely with input meteorological fields. This study introduces an automatic cold
  front detection method using the ERA5 reanalysis dataset from the European Centre for Medium-Range Weather
  Forecasts (ECMWF) at 850 hPa, specifically designed to generate physically consistent labels for machine
  learning applications. The approach combines the Thermal Front Parameter (TFP) with temperature advection
  (AdvT), applying optimized thresholds (TFP < 5 × 10−11 K m−2; AdvT < −1 × 10−4 K s−1), morphological
  filtering, and polynomial smoothing. Comparison against 1426 manual charts from 2009 revealed systematic
  spatial displacement, with mean offsets of ~502 km. Although pixel-level overlap was low, with Intersection
  over Union (IoU) = 0.013 and Dice coefficient (Dice) = 0.034, spatial concordance exceeded 99%, confirming
  both methods identify the same synoptic systems. The automatic method detects 58% more fronts over the
  South Atlantic and 44% fewer over the Andes compared to manual charts. Seasonal variability shows maximum
  activity in austral winter (31.3%) and minimum in summer (20.1%). This is the first automatic front
  detection system calibrated for South America that maintains direct correspondence between training
  labels and reanalysis input fields, addressing the spatial misalignment problem that limits deep learning
  applications in atmospheric sciences.
