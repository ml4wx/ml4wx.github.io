summary: CaStLe scales space-time causal discovery via local stencils and recovers atmospheric dynamics
  behind the 1991 Pinatubo climate response.
abstract: Abstract Causal discovery tools enable scientists to infer meaningful relationships from observational
  data, spurring advances in fields as diverse as biology, economics, and climate science. Despite these
  successes, the application of causal discovery to space‐time systems remains immensely challenging due
  to the high‐dimensional nature of the data. For example, in climate sciences, modern observational temperature
  records over the past few decades regularly measure thousands of locations around the globe. To address
  these challenges, we introduce Ca usal S pace‐Time S t encil Le arning (CaStLe), a novel meta‐algorithm
  for discovering causal structures in complex space‐time systems. CaStLe leverages regularities in local
  space‐time dependencies to learn governing global dynamics. This local perspective eliminates spurious
  confounding and drastically reduces sample complexity, making space‐time causal discovery practical
  and effective. For causal discovery, CaStLe flexibly accepts any appropriately adapted time series causal
  discovery algorithm to recover local causal structures. These advances enable causal discovery of geophysical
  phenomena that were previously unapproachable, including non‐periodic, transient phenomena such as volcanic
  eruption plumes. Regularities in local space‐time dependencies are transformed into informative spatial
  replicates , which actually improve CaStLe's performance when applied to ever‐larger spatial grids.
  We successfully apply CaStLe to discover the atmospheric dynamics governing the climate response to
  the 1991 Mount Pinatubo volcanic eruption. We provide validation experiments to demonstrate the effectiveness
  of CaStLe over existing causal‐discovery frameworks on a range of geophysics‐inspired benchmarks while
  identifying the method's limitations and domains where its assumptions may not hold.
