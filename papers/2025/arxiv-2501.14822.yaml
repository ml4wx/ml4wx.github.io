summary: Shows DDIM step count controls ensemble variance, and builds a diffusion model downscaling ERA5
  wind to CERRA with calibrated spread.
abstract: In recent years, diffusion models have emerged as powerful tools for generating ensemble members
  in meteorology. In this work, we demonstrate how a Denoising Diffusion Implicit Model (DDIM) can effectively
  control ensemble variance by varying the number of diffusion steps. Introducing a theoretical framework,
  we relate diffusion steps to the variance expressed by the reverse diffusion process. Focusing on reanalysis
  downscaling, we propose an ensemble diffusion model for the full ERA5-to-CERRA domain, generating variance-calibrated
  ensemble members for wind speed at full spatial and temporal resolution. Our method aligns global mean
  variance with a reference ensemble dataset and ensures spatial variance is distributed in accordance
  with observed meteorological variability. Additionally, we address the lack of ensemble information
  in the CARRA dataset, showcasing the utility of our approach for efficient, high-resolution ensemble
  generation.
