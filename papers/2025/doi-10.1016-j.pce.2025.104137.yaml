summary: A random forest trained on Princeton satellite and station data estimates Upper Awash temperature
  and precipitation trends, contrasting with CMIP6 projections of drying and warming.
abstract: Climate change presents a critical challenge for the Upper Awash Sub-basin in Ethiopia, exacerbated
  by rapid urbanisation and growing agricultural water demand. This study integrates satellite (Princeton)
  and observational datasets (1948–2010) with future projections (2025–2075), applying both machine learning
  (ML) and climate modelling approaches to assess long-term climate trends. A Random Forest model trained
  on satellite and ground-based data demonstrated high predictive accuracy (R 2 = 0.97 for training, 0.96
  for testing; RMSE = 0.12°C), enabling robust estimation of temperature and precipitation patterns. Historical
  comparisons revealed that Princeton data showed 6.3% more precipitation and 10.2% lower temperature
  than observed records, while Coupled Model Intercomparison Project Phase 6 (CMIP6) data indicated 57.9%
  less precipitation and an 18.2% increase in temperature. For 2025 to 2075, the Princeton ML model projects
  a slight 0.4% rise in precipitation and a 10.2% decrease in temperature. In contrast, the Shared Socioeconomic
  Pathway (SSP5-8.5) scenario anticipates a 52.1% decline in precipitation and a 26.1% rise in temperature.
  These disparities reflect fundamental differences in model assumptions, spatial sensitivity, and data
  sources. While CMIP6 suggests intensified warming and drying, the ML-based results indicate possible
  localised climate buffering effects, potentially influenced by land use, vegetation cover, or data limitations.
  The findings underscore the importance of multi-model comparisons and region-specific analyses to support
  effective climate adaptation. Recommended strategies include early warning systems, drought-resilient
  agriculture, and integrated urban–rural water management tailored to the sub-basin’s evolving climate
  conditions. • Urbanisation & agriculture rising in Upper Awash are posing significant climate change
  impacts. • Research employs climate models and Machine Learning (ML) to analyse data from 1948 to 2010.
  • Random forest ML model displays exceptional performance analysing Precipitation datasets. • ML projections
  contrast climate model forecast underscoring the necessity of additional data. • Using long-term data
  with climate models is recommended to improve accuracy of ML.
