summary: A Fortran–Python interface lets PyTorch, TensorFlow and scikit-learn parameterizations run inside
  Earth system models, demonstrated with a convection trigger and a wildfire model.
abstract: 'Abstract. Parameterizations in Earth System Models (ESMs) are subject to biases and uncertainties
  arising from subjective empirical assumptions and incomplete understanding of the underlying physical
  processes. Recently, the growing representational capability of machine learning (ML) in solving complex
  problems has spawned immense interests in climate science applications. Specifically, ML-based parameterizations
  have been developed to represent convection, radiation and microphysics processes in ESMs by learning
  from observations or high-resolution simulations, which have the potential to improve the accuracies
  and alleviate the uncertainties. Previous works have developed some surrogate models for these processes
  using ML. These surrogate models need to be coupled with the dynamical core of ESMs to investigate the
  effectiveness and their performance in a coupled system. In this study, we present a novel Fortran-Python
  interface designed to seamlessly integrate ML parameterizations into ESMs. This interface showcases
  high versatility by supporting popular ML frameworks like PyTorch, TensorFlow, and Scikit-learn. We
  demonstrate the interface''s modularity and reusability through two cases: a ML trigger function for
  convection parameterization and a ML wildfire model. We conduct a comprehensive evaluation of memory
  usage and computational overhead resulting from the integration of Python codes into the Fortran ESMs.
  By leveraging this flexible interface, ML parameterizations can be effectively developed, tested, and
  integrated into ESMs.'
