summary: Uses recurrent networks on grapevine bioelectrical signals to infer local temperature and humidity
  within 1-2 °C of sensor benchmarks, including rapid weather transitions.
abstract: 'Recent advances in plant electrophysiology and machine learning suggest that bioelectric signals
  in plants may encode environmentally relevant information beyond physiological processes. In this study,
  we present a novel framework to analyse waveforms from real-time bioelectrical potentials recorded in
  vascular plants. Using a multi-channel electrophysiological monitoring system, we acquired continuous
  data from Vitis vinifera samples in a vineyard plantation under natural conditions. Plants were in different
  health conditions: healthy; under the infection of Flavescence dorée; plants in recovery from the same
  disease; and dead stumps. These signals were used as input features for an ensemble of complex machine
  learning models, including recurrent neural networks, trained to infer short-term meteorological parameters
  such as temperature and humidity. The models demonstrated predictive capabilities, with accuracy comparable
  to sensor-based benchmarks between one and two degree Celsius for temperature, particularly in forecasting
  rapid weather transitions. Feature importance analysis revealed plant-specific electrophysiological
  patterns that correlated with ambient conditions, suggesting the existence of biological pre-processing
  mechanisms sensitive to microclimatic fluctuations. This bioinspired approach opens new directions for
  developing plant-integrated environmental intelligence systems, offering passive and biologically rooted
  strategies for ultra-local forecasting—especially valuable in remote, sensor-sparse, or climate-sensitive
  regions. Our findings contribute to the emerging field of plant-based sensing and biomimetic environmental
  monitoring, expanding the role of flora to biosensors, useful in Earth system observation tasks.'
