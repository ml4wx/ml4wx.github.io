summary: A deep-learning model retrieves precipitable water vapour from GNSS without the weighted mean
  temperature, cutting BIAS, MAE and RMSE by about 38% versus traditional models.
abstract: Precipitable water vapor (PWV) is an important indicator to characterize the spatial and temporal
  variability of water vapor. A high spatial and temporal resolution of atmospheric precipitable water
  can be obtained using ground-based GNSS, but its inversion accuracy is usually limited by the weighted
  mean temperature, Tm. For this reason, based on the data of 17 ground-based GNSS stations and water
  vapor reanalysis products over 2 years in the Hong Kong region, a new model for water vapor inversion
  without the Tm parameter is established by deep learning in this paper, the research results showed
  that, compared with the PWV information calculated by the traditional model using Tm parameter, the
  accuracy of the PWV retrieved by the new model proposed in this paper is higher, and its accuracy index
  parameters BIAS, MAE, and RMSE are improved by 38% on average. At the same time, the PWV was inverted
  by radiosonde data in the study area as a reference to verify the water vapor inversion results of the
  new model, and it was found that the BIAS of the new model is only 0.8 mm, which has high accuracy.
  Further, compared with the LSTM model, the new model is more universal when the accuracy is comparable.
  In addition, in order to evaluate the spatial and temporal variation characteristics of the atmospheric
  water vapor retrieved by the new model, based on the rainstorm event caused by typhoon in Hong Kong
  of September 2023, the ERA5 GSMaP rainfall products and inverted PWV information were comprehensively
  used for analysis. The results show that the PWV increased sharply with the arrival of the typhoon and
  the occurrence of a rainstorm event. After the rain stopped, the PWV gradually decreased and tended
  to be stable. The spatial and temporal variation in the PWV have a strong correlation with the occurrence
  of extreme rainstorm events. This shows that the PWV inverted by the new model can respond well to extreme
  rainstorm events, which proves the feasibility and reliability of the new model and provides a reference
  method for meteorological monitoring and weather forecasting.
