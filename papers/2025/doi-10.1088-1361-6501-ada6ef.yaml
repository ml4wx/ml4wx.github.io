summary: A random forest model (RPWV) converts GNSS zenith total delay directly to precipitable water
  vapour over North America, with 0.01 mm bias and 1.87 mm RMS.
abstract: Abstract Precipitable water vapor (PWV) is crucial for weather forecasting and climate change
  research. However, accurate PWV estimation is challenging, especially in the absence of measured meteorological
  data. In this study, we develop a conversion model based on the random forest algorithm, called RPWV,
  which can directly derive PWV from zenith total delay without measured meteorological data. The results
  indicate that the RPWV model demonstrates high accuracy and reliability for PWV retrieval across North
  America. Specifically, using global navigation satellite system PWV as a reference, the bias and root
  mean square (RMS) values for RPWV are 0.01 mm and 1.87 mm, respectively. Moreover, compared with the
  conventional linear model and backpropagation neural network model, the accuracy of the RPWV is improved
  by 81.3% and 13.4%, respectively. In contrast to radiosonde PWV, the bias and RMS values of the RPWV
  are 1.85 mm and 3.40 mm, respectively. This model provides a straightforward and efficient method for
  estimating PWV and has potential for weather forecasting and climate research in environments where
  meteorological data is scarce.
