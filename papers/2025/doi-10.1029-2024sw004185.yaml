summary: Deep-learning dimensionality reduction improves a TIE-GCM thermosphere emulator over PCA, especially
  during storms, while keeping full resolution up to 1000 km.
abstract: 'Abstract Physics‐based models of the ionosphere‐thermosphere system have been touted as the
  next big thing in the context of drag modeling and space operations for decades. However, the computational
  complexity of such models have primarily kept them being used operationally. We recently demonstrated
  a proof‐of‐concept for developing what we call a reduced order probabilistic emulator (ROPE) for the
  thermosphere using the thermosphere ionosphere electrodynamics ‐ general circulation model (TIE‐GCM).
  The methodology uses a page out of dynamical systems theory to first reduce the order of the state using
  dimensionality reduction and then modeling the temporal dynamics in the reduced state space. The methodology
  uses an ensemble of temporal dynamic models to provide uncertainty estimates in the prediction. This
  work focuses on the dimensionality reduction step of the ROPE development process and addresses three
  limitations of the proof‐of‐concept: (a) extending the altitude upper boundary from 450 km to nearly
  1000 km, (b) employing deep learning for nonlinear dimensionality reduction over principal component
  analysis (PCA) for improved performance during storm periods, and (c) maintaining the spatial resolution
  of the physical TIE‐GCM model, without down‐sampling, to preserve the spatial scales and variations.
  Results show overall performance boost over PCA for the high‐resolution and extrapolated data set as
  well as reduced reconstruction errors during storm‐time conditions. This work represents a major step
  toward operationalization.'
