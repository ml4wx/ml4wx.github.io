summary: Review of machine learning and deep learning for airport visibility forecasting, noting correlations
  above 0.90 and RMSE below 1 km but limited real-time integration.
abstract: Abstract Low visibility conditions caused by phenomena such as fog, heavy rain, or snowfall
  impose major operational and safety challenges at airports. Conventional numerical weather prediction
  models, although improved over time, still struggle to forecast low visibility accurately due to scale
  mismatches and uncertainties in physical parameterizations, among other factors. This review synthesizes
  findings on data-driven solutions, including machine learning and deep learning, that harness large
  datasets to reveal hidden patterns, offering better performance and adaptability. Ensemble methods and
  the integration of multiple data sources further enhance accuracy, particularly for short lead times.
  Several methods achieve correlation coefficients above 0.90 and root mean square error below 1 km, yet
  generalization and integration into real-time airport operations remain underexplored. Future work should
  focus on transferability across diverse climates, integration with advanced operational tools, and bridging
  gaps between model complexity and user interpretability. The next generation of hybrid forecasting frameworks
  has the potential to enhance safety, limit economic losses, and improve resilience in airport operations.
