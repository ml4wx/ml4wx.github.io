summary: Wavelet-processed BiLSTM on IoT sensor data forecasts temperature with 97% test accuracy, validated
  against Turkish State Meteorological Service observations with 94% concordance.
abstract: 'Temperature forecasting is critical for public safety, environmental risk management, and energy
  conservation. However, reliable forecasting becomes challenging in regions where governmental institutions
  lack adequate measurement infrastructure. To address this limitation, the present study aims to improve
  temperature forecasting by collecting temperature, pressure, and humidity data through IoT sensor networks.
  The study further seeks to identify the most effective method for the real-time processing of large-scale
  datasets generated by sensor measurements and to ensure data reliability. The collected data were pre-processed
  using Discrete Wavelet Transform (DWT) to extract essential features and reduce noise. Subsequently,
  three wavelet-processed deep-learning models were employed: Wavelet-processed Artificial Neural Networks
  (W-ANN), Wavelet-processed Long Short-Term Memory Networks (W-LSTM), and Wavelet-processed Bidirectional
  Long Short-Term Memory Networks (W-BiLSTM). Among these, the W-BiLSTM model yielded the highest performance,
  achieving a test accuracy of 97% and a Mean Absolute Percentage Error (MAPE) of 2%. It significantly
  outperformed the W-LSTM and W-ANN models in predictive accuracy. Forecasts were validated using data
  obtained from the Turkish State Meteorological Service (TSMS), yielding a 94% concordance, thereby confirming
  the robustness of the proposed approach. The findings demonstrate that the W-BiLSTM-based model enables
  reliable temperature forecasting, even in regions with insufficient governmental measurement infrastructure.
  Accordingly, this approach holds considerable potential for supporting data-driven decision-making in
  environmental risk management and energy conservation.'
