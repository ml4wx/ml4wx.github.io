summary: A parameter-free spherical harmonic loss fine-tunes GraphCast to raise effective resolution from
  1,250 km to 160 km while keeping sharp forecasts and better cyclone strength.
abstract: Recent advancements in data-driven weather forecasting models have delivered deterministic models
  that outperform the leading operational forecast systems based on traditional, physics-based models.
  However, these data-driven models are typically trained with a mean squared error loss function, which
  causes smoothing of fine scales through a "double penalty" effect. We develop a simple, parameter-free
  modification to this loss function that avoids this problem by separating the loss attributable to decorrelation
  from the loss attributable to spectral amplitude errors. Fine-tuning the GraphCast model with this new
  loss function results in sharp deterministic weather forecasts, an increase of the model's effective
  resolution from 1,250km to 160km, improvements to ensemble spread, and improvements to predictions of
  tropical cyclone strength and surface wind extremes.
