summary: ML-AMPSIT uses surrogate regressors to rank WRF/Noah-MP parameter sensitivity from few model
  runs for a sea breeze case.
abstract: Abstract. The accurate calibration of parameters in atmospheric and Earth system models is crucial
  for improving their performance, but remains a challenge due to their inherent complexity, which is
  reflected in input-output relationships often characterized by multiple interactions between the parameters
  and thus hindering the use of simple sensitivity analysis methods. This paper introduces the Machine
  Learning-based Automated Multi-method Parameter Sensitivity and Importance analysis Tool (ML-AMPSIT),
  a new tool designed with the aim of providing a simple and flexible framework to estimate the sensitivity
  and importance of parameters in complex numerical weather prediction models. This tool leverages the
  strengths of multiple regression-based and probabilistic machine learning methods including LASSO, Support
  Vector Machine, Classification and Decision Trees, Random Forest, Extreme Gradient Boosting, Gaussian
  Process Regression, and Bayesian Ridge Regression. These regression algorithms are used to construct
  computationally inexpensive surrogate models to effectively predict model outputs from input parameters,
  thereby significantly reducing the computational burden of running high-fidelity models for sensitivity
  analysis. Moreover, the multi-method approach allows for a comparative analysis of the results. Through
  a detailed case study with the Weather Research and Forecasting (WRF) model coupled with the Noah-MP
  land surface model, ML-AMPSIT is demonstrated to efficiently predict the behavior of Noah-MP model parameters
  with a relatively small number of model runs, by simulating a sea breeze circulation over an idealized
  flat domain. This paper points out how ML-AMPSIT can be an efficient tool for performing sensitivity
  and importance analysis also for complex models, guiding the user through the different steps and allowing
  for a simplification and automatization of the process.
