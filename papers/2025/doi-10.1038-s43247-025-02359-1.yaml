summary: An ensemble machine learning drought index applied to climate model simulations projects 25–35%
  drought intensification in central and southern Middle East under high emissions.
abstract: Drought conditions could intensify by 25–35% in the future in the Middle East under a high-emissions
  scenario, with the most affected regions concentrated in central and southern areas, according to a
  drought index based on ensemble machine learning methods and climate model simulations.
