summary: Graph neural networks using NWP predictors achieve performance comparable to a CNN benchmark
  for 24–36 hour wind power forecasts across three facilities over five years.
abstract: We study the applicability of GNNs to the problem of wind energy forecasting. We find that certain
  architectures achieve performance comparable to our best CNN-based benchmark. The study is conducted
  on three wind power facilities using five years of historical data. Numerical Weather Prediction (NWP)
  variables were used as predictors, and models were evaluated on a 24 to 36 hour ahead test horizon.
