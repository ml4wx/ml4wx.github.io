summary: Semantic-segmentation regional 5-day forecaster with learnable Gaussian noise and cascade prediction,
  competitive in an East China AI forecasting contest.
abstract: 'ABSTRACT Deep learning–based methods have become alternatives to traditional numerical weather
  prediction systems, offering faster computation and the ability to utilize large historical datasets.
  However, the application of deep learning to medium-range regional weather forecasting with limited
  data remains a significant challenge. In this work, we propose three key solutions: (1) motivated by
  the need to improve model performance in data-scarce regional forecasting scenarios, we innovatively
  apply semantic segmentation models, to better capture spatiotemporal features and improve prediction
  accuracy; (2) recognizing the challenge of overfitting and the inability of traditional noise-based
  data augmentation methods to effectively enhance model robustness, we introduce a novel learnable Gaussian
  noise mechanism that allows the model to adaptively optimize perturbations for different locations,
  ensuring more effective learning; and (3) to address the issue of error accumulation in autoregressive
  prediction, as well as the challenge of learning difficulty and the lack of intermediate data utilization
  in one-shot prediction, we propose a cascade prediction approach that effectively resolves these problems
  while significantly improving model forecasting performance. Our method achieves a competitive result
  in The East China Regional AI Medium Range Weather Forecasting Competition . Ablation experiments further
  validate the effectiveness of each component, highlighting their contributions to enhancing prediction
  performance.'
