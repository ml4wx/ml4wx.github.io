summary: Regional Swin-Transformer-3D forecaster with diffusion-based 5 km precipitation diagnosis, outperforming
  Pangu on most variables for 1 hour to 5 day forecasts.
abstract: This study introduces a cutting-edge regional weather forecasting model based on the SwinTransformer
  3D architecture. This model is specifically designed to deliver precise hourly weather predictions ranging
  from 1 hour to 5 days, significantly improving the reliability and practicality of short-term weather
  forecasts. Our model has demonstrated generally superior performance when compared to Pangu, a well-established
  global model. The evaluation indicates that our model excels in predicting most weather variables, highlighting
  its potential as a more effective alternative in the field of limited area modeling. A noteworthy feature
  of this model is the integration of enhanced boundary conditions, inspired by traditional numerical
  weather prediction (NWP) techniques. This integration has substantially improved the model's predictive
  accuracy. Additionally, the model includes an innovative approach for diagnosing hourly total precipitation
  at a high spatial resolution of approximately 5 kilometers. This is achieved through a latent diffusion
  model, offering an alternative method for generating high-resolution precipitation data.
