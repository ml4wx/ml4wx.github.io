summary: Uses an emulator of integrated assessment models to extend emissions scenarios from 2100 to 2150
  for long-term overshoot and tipping-element studies.
abstract: Whereas there is growing interest in exploring longer-term climate with overshoot, including
  tipping elements, beyond 2100, most Integrated Assessment Models (IAMs) generate emissions scenarios
  only till 2100. Here we propose a framework to extend scenarios until 2150 using an emulator of IAMs.
  Our framework offers a potential interim solution for developing very long-term scenarios, such as the
  Scenario Model Intercomparison Project (ScenarioMIP), circumventing the challenges of fully simulating
  IAMs beyond 2100.
