summary: Light gradient boosting predicts Bahir Dar daily and monthly rainfall with R² of 0.991 and 0.996,
  outperforming regression trees and the ECMWF model.
abstract: ABSTRACT This study aims to provide an efficient and accurate model by comparing the tree-based
  machine learning approach and the global prediction model with the European Center for Medium Weather
  Forecast (ECMWF) model for predicting long-term rainfall. Light gradient boosting (LGB) and regression
  tree (RT) tree-based machine learning algorithms are utilized in this study and compared with the global
  model. Local metrological parameters such as relative humidity, dew point temperature, minimum temperature,
  maximum temperature, wind speed, convective available potential energy, and sunshine and large-scale
  climate variable (sea surface temperature) were used as input during model development. Initially, the
  database was preprocessed and then partitioned into a training set and a testing set. GridsearchCV technique
  was used for tuning the parameters of the models. For daily rainfall variation, LGB exhibits strong
  performance with the highest coefficient of determination (R2 = 0.991; 0.996), lowest root mean squared
  error (RMSE = 1.14 mm; 0.383 mm), lowest mean squared error (MSE = 1.992; 0.146), and lowest mean absolute
  error (MAE = 0.899 mm; 0.302 mm) for daily and monthly time scales. For both temporal variations, the
  LGB model shows significantly higher accuracy than both RT and ECMWF. Relative humidity is the most
  influential meteorological parameter for rainfall prediction identified by the important random forest
  (RF) feature with a value of 0.4129. An agricultural decision support system that is still in development
  will incorporate the suggested models in Ethiopia.
