summary: Review of machine learning for weather prediction covering short-term, extreme-weather and regional
  modelling, with remarks on future research gaps.
abstract: 'Weather prediction is of great significance for public safety, disease prevention, agriculture,
  transportation, and natural disasters. Despite being well-established and extensively studied, current
  Numerical Weather Prediction (NWP) models continue to encounter certain limitations. For example, they
  rely on high-performance computing environments, consume a large amount of energy, and involve high
  computational costs. Therefore, using Machine Learning (ML) algorithms for weather prediction, integrating
  data with numerically driven models, and improving prediction accuracy by learning historical data are
  of crucial importance. However, most existing research tends to concentrate on particular use cases
  and technical implementations of ML in weather forecasting, without offering a thorough and in-depth
  overview of its broader application methods. This paper begins by outlining various ML techniques and
  the distinct features of meteorological data. It then explores the role of ML in weather forecasting
  from three key perspectives: short-term weather prediction, extreme weather prediction, and spatial
  regional modeling, and summarizes the common application methods of ML. Finally, this paper points out
  the deficiencies of future research and suggests the directions for future research.'
