summary: Compares decision tree, random forest and XGBoost for classifying Southwest Pacific tropical
  cyclone rapid intensification; XGBoost performs best with the highest AUC.
abstract: This study evaluates the ability of three machine learning methods—decision tree classifier
  (DTC), random forest classifier (RFC), and XGBoost classifier (XGBC)—to classify and predict tropical
  cyclone (TC) rapid intensification (RI) and non-RI over the Southwest Pacific Ocean basin (SWPO) from
  1982 to 2023. Among the 324 TCs within the domain, 81 were identified as RI TCs, exhibiting a 24-h intensity
  increase of at least 15 ms−1 at least once in their lifetime. Environmental variables used for the input
  matrix are extracted from the nearest grid cell corresponding to each RI and non-RI event’s geographic
  location and time of occurrence. Additionally, the geographic location of each event and its initial
  intensity positions (24-h prior) are also included in the model. The XGBC, with 10-fold cross-validation,
  became the optimum classifier by achieving the highest classification accuracy, as well as the lowest
  probability of false detection and the highest AUC score on the unseen data. The model identified the
  longitude of RI and non-RI events, initial intensity latitude, extent of initial intensity, and relative
  humidity at 850 hPa as the most important variables in the classification decision. This study will
  advance storm preparedness strategies for the SWPO nations through correctly predicting RI-TCs and prioritizing
  early prediction of contributing environmental variables.
