summary: XGBoost outperforms ARIMA, random forest and SVR for predicting Chengdu precipitation from 1990–2023
  meteorological records, though the study is a regional comparison.
abstract: Chengdu is located in the western part of the Sichuan Basin, with a humid climate and fertile
  soil, making it an important agricultural production base. In recent years, seasonal precipitation distribution
  in Chengdu has been uneven, and extreme precipitation events are frequent. This paper uses a machine
  learning method to predict precipitation based on seven types of meteorological data including precipitation
  from January 1990 to December 2023 in Chengdu. Autoregressive Moving Average Model (ARIMA), eXtreme
  Gradient Boosting (XGBoost), and Random Forest Regression (RFR) are established, support vector Regression
  (SVR) four machine learning models. The results show that the XGBoost model performs the best among
  these methods, and it can accurately capture the trend of precipitation, thus providing a reliable means
  for precipitation prediction and rational planning of water resources in Chengdu. This study contributes
  by offering a practical application of machine learning techniques to precipitation forecasting, which
  could inform future strategies for water resource management in the region.
