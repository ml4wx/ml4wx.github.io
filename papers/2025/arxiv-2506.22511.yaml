summary: RefDiff, a diffusion model, generates nighttime visible reflectance from FY-4B infrared bands
  with SSIM 0.90 and uncertainty estimates, enabling all-day cloud monitoring.
abstract: The visible light reflectance data from geostationary satellites is crucial for meteorological
  observations and plays an important role in weather monitoring and forecasting. However, due to the
  lack of visible light at night, it is impossible to conduct continuous all-day weather observations
  using visible light reflectance data. This study pioneers the use of generative diffusion models to
  address this limitation. Based on the multi-band thermal infrared brightness temperature data from the
  Advanced Geostationary Radiation Imager (AGRI) onboard the Fengyun-4B (FY4B) geostationary satellite,
  we developed a high-precision visible light reflectance generative model, called Reflectance Diffusion
  (RefDiff), which enables 0.47~μ\mathrm{m}, 0.65~μ\mathrm{m}, and 0.825~μ\mathrm{m} bands visible light
  reflectance generation at night. Compared to the classical models, RefDiff not only significantly improves
  accuracy through ensemble averaging but also provides uncertainty estimation. Specifically, the SSIM
  index of RefDiff can reach 0.90, with particularly significant improvements in areas with complex cloud
  structures and thick clouds. The model's nighttime generation capability was validated using VIIRS nighttime
  product, demonstrating comparable performance to its daytime counterpart. In summary, this research
  has made substantial progress in the ability to generate visible light reflectance at night, with the
  potential to expand the application of nighttime visible light data.
