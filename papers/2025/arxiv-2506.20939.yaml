summary: AIR-VIEW releases a year-long dataset of FAA weather camera images labelled with visibility,
  with benchmarks against an ASTM standard for aviation visibility estimation.
abstract: Machine Learning for aviation weather is a growing area of research for providing low-cost alternatives
  for traditional, expensive weather sensors; however, in the area of atmospheric visibility estimation,
  publicly available datasets, tagged with visibility estimates, of distances relevant for aviation, of
  diverse locations, of sufficient size for use in supervised learning, are absent. This paper introduces
  a new dataset which represents the culmination of a year-long data collection campaign of images from
  the FAA weather camera network suitable for this purpose. We also present a benchmark when applying
  three commonly used approaches and a general-purpose baseline when trained and tested on three publicly
  available datasets, in addition to our own, when compared against a recently ratified ASTM standard.
