summary: Random Forest and SVC classifiers using NASA POWER variables simulate daily precipitation and
  extremes at North Indian capitals, reaching about 83% accuracy with AUC near 0.90 for extremes.
abstract: Climate change-induced precipitation extremes are a pressing global concern. This study investigates
  the predictability of precipitation patterns and extremes across North Indian states from 1984 to 2023
  using NASA's Prediction of Worldwide Energy Resources (POWER) datasets and machine learning (ML) models.
  The current ML model builds on the relationship between rainfall and key climatic parameters such as
  dew point temperature and relative humidity, showing a strong positive correlation (CC = 0.4) significant
  at the 0.05 level. In simulating precipitation, Random Forest Classifier (RFC) achieved the highest
  accuracy (~ 83%) for Rajasthan and Uttar Pradesh, while Support Vector Classifier (SVC) performed best
  (79-83% accuracy) in other states. However, ML models exhibited approximately 5% lower skill in higher
  elevated stations as compared to lower ones, due to differing atmospheric mechanisms. For extreme precipitation
  events (10th and 95th percentiles of intensity), RFC consistently outperformed SVC across all states
  showing superior ability to distinguish extreme from non-extreme events (Area Under Curve ~ 0.90) and
  better model calibration (Brier Scores ~ 0.01). The developed ML models effectively simulated precipitation
  and extreme patterns, with RFC excelling at classifying extreme events. These findings can aid disaster
  preparedness and water resource management in regions with varied topography and complex terrain.
