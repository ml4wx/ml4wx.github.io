summary: FuXi-CFD downscales 10 m coarse winds to 30 m 3D wind fields over complex terrain, matching CFD
  accuracy while cutting inference time from hours to seconds.
abstract: High-resolution wind information is essential for wind energy planning and power forecasting,
  particularly in regions with complex terrain. However, most AI-based weather forecasting models operate
  at kilometer-scale resolution, constrained by the reanalysis datasets they are trained on. Here we introduce
  FuXi-CFD, an AI-based downscaling framework designed to generate detailed three-dimensional wind fields
  at 30-meter horizontal resolution, using only coarse-resolution atmospheric inputs. The model is trained
  on a large-scale dataset generated via computational fluid dynamics (CFD), encompassing a wide range
  of terrain types, surface roughness, and inflow conditions. Remarkably, FuXi-CFD predicts full 3D wind
  structures -- including vertical wind and turbulent kinetic energy -- based solely on horizontal wind
  input at 10 meters above ground, the typical output of AI-based forecast systems. It achieves CFD-comparable
  accuracy while reducing inference time from hours to seconds. By bridging the resolution gap between
  regional forecasts and site-specific wind dynamics, FuXi-CFD offers a scalable and operationally efficient
  solution to support the growing demands of renewable energy deployment.
