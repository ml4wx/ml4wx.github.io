summary: A Schrödinger bridge super-resolves urban 2-m temperature with 10 network evaluations versus
  50 for diffusion, matching accuracy at one-fifth the cost with larger sample variance.
abstract: This study employs a neural network that represents the solution to a Schrödinger bridge problem
  to perform super-resolution of 2-m temperature in an urban area. Schrödinger bridges generally describe
  transformations between two data distributions based on diffusion processes. We use a specific Schrödinger-bridge
  model (SM) that directly transforms low-resolution data into high-resolution data, unlike denoising
  diffusion probabilistic models (simply, diffusion models; DMs) that generate high-resolution data from
  Gaussian noise. Low-resolution and high-resolution data were obtained from separate numerical simulations
  with a physics-based model under common initial and boundary conditions. Compared with a DM, the SM
  attains comparable accuracy at one-fifth the computational cost, requiring 50 neural-network evaluations
  per datum for the DM and only 10 for the SM. Furthermore, high-resolution samples generated by the SM
  exhibit larger variance, implying superior uncertainty quantification relative to the DM. Owing to the
  reduced computational cost of the SM, our results suggest the feasibility of real-time ensemble micrometeorological
  prediction using SM-based super-resolution.
