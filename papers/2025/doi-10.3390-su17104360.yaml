summary: CNN-BMA-QDM hybrid downscales CMIP6 daily Tmax over Fujian, projecting 0.0526 °C/yr warming under
  SSP585 and outperforming RF, SVM and SDSM.
abstract: The rise in global temperatures and increased extreme weather events, such as heatwaves, underscore
  the need for accurate regional projections of daily maximum temperature (Tmax) to inform effective adaptation
  strategies. This study develops the CNN-BMA-QDM model, which integrates convolutional neural networks
  (CNNs), Bayesian model averaging (BMA), and quantile delta mapping (QDM) to downscale and project Tmax
  under future climate scenarios. The CNN-BMA-QDM model stands out for its ability to capture nonlinear
  relationships between Tmax and atmospheric circulation factors, reduce model uncertainty, and correct
  bias, thus improving simulation accuracy. The CNN-BMA-QDM model is applied to Fujian Province, China,
  using three CMIP6 GCMs and four shared socioeconomic pathways (SSPs) to project Tmax from 2015 to 2100.
  The results show that CNN-BMA-QDM outperforms CNN-BMA, CNNs, and other downscaling methods (e.g., RF,
  BPNN, SVM, LS-SVM, and SDSM), particularly in simulating extreme value at the 99% and 95% percentiles.
  Projections of Tmax indicate consistent warming trends across all SSP scenarios, with spatially averaged
  warming rates of 0.0077 °C/year for SSP126, 0.0269 °C/year for SSP245, 0.0412 °C/year for SSP370, and
  0.0526 °C/year for SSP585. Coastal areas experience the most significant warming, with an increase of
  4.62–5.73 °C under SSP585 by 2071–2100, while inland regions show a smaller rise of 3.64–3.67 °C. Monthly
  projections indicate that December sees the largest increase (5.30 °C under SSP585 by 2071–2100), while
  July experiences the smallest (2.40 °C). On a seasonal scale, winter experiences the highest warming,
  reaching 4.88 °C under SSP585, whereas summer shows a more modest rise of 3.10 °C. Notably, the greatest
  discrepancy in Tmax rise between the south and north occurs during the summer. These findings emphasize
  the importance of developing tailored adaptation strategies based on spatial and seasonal variations.
  The results provide valuable insights for policymakers and contribute to the advancement of regional
  climate projection research.
