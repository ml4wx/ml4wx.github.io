summary: Random Forest with Genetic Algorithm feature selection on 13,202 station records raises weather
  classification accuracy to 92.65% from 91.31%.
abstract: 'Weather prediction plays a vital role in numerous fields, including agriculture, transportation,
  and emergency response. However, the intricate and nonlinear nature of atmospheric progressions makes
  accurate forecasting a persistent challenge. This research explores the application of machine learning,
  particularly Random Forest (RF) algorithm to improve weather prediction using historical meteorological
  data. The study employs a dataset comprising 13,202 records with 11 weather-related variables. Two distinct
  models were developed: one using raw, unprocessed data and another incorporating Genetic Algorithm (GA)-based
  feature selection to identify optimal predictors. Both models were evaluated on a test of 3,960 instances.
  Results indicate that the GA-enhanced model outperformed the baseline, achieving an accuracy of 92.65%
  compared to 91.31%. Additional metrics, including kappa statistics, MAE, RMSE, precision, recall, and
  F-measure further validated the model’s robustness. Notably, both models exhibited strong discriminative
  ability, with ROC and PRC areas exceeding 0.98, while the optimized model maintained high performance
  with reduced dimensionality. This study demonstrates that combining Random Forest with Genetic Algorithm-driven
  feature selection significantly enhances weather prediction accuracy. The proposed approach offers a
  reliable framework for developing efficient forecasting systems, with potential applications in real-time
  and long-term meteorological analysis.'
