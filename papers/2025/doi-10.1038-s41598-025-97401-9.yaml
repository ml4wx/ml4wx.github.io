summary: Hybrid CNN-ResNet50-LSTM model forecasts temperature and wind power on three public datasets,
  outperforming five baseline regression models; framed around climate change.
abstract: 'Climate change poses a significant challenge to wind energy production. It involves long-term,
  noticeable changes in key climatic factors such as wind power, temperature, wind speed, and wind patterns.
  Addressing climate change is essential to safeguarding our environment, societies, and economies. In
  this context, accurately forecasting temperature and wind power becomes crucial for ensuring the stable
  operation of wind energy systems and for effective power system planning and management. Numerous approaches
  to wind change forecasting have been proposed including both traditional forecasting models and deep
  learning models. Traditional forecasting models have limitations since they cannot describe the complex
  nonlinear relationship in climatic data, resulting in low forecasting accuracy. Deep learning techniques
  have promising non-linear processing capabilities in weather forecasting. To further advance the integration
  of deep learning in climate change forecasting, we have developed a hybrid model called CNN-ResNet50-LSTM,
  comprising a Convolutional Neural Network (CNN), a Deep Convolutional Network (ResNet50), and a Long
  Short-Term Memory (LSTM) model to predict two climate change factors: temperature and wind power. The
  experiment was conducted using three publicly available datasets: Wind Turbine Scada (Scada) Dataset,
  Saudi Arabia Weather history (SA) dataset, and Wind Power Generation Data for 4 locations (WPG) dataset.
  The forecasting accuracy is evaluated using several evaluation metrics, including the coefficient of
  determination ([Formula: see text]), Mean Squared Error (MSE), Mean Absolute Error (MAE), Median Absolute
  Error (MedAE) and Root Mean Squared Error (RMSE). The proposed CNN-ResNet50-LSTM model was also compared
  to five regression models: Dummy Regressor (DR), Kernel Ridge Regressor (KRR), Decision Tree Regressor
  (DTR), Extra Trees Regressor (ETR), and Stochastic Gradient Descent Regressor (SGDR). Findings revealed
  that CNN-ResNet50-LSTM model achieved the best performance, with [Formula: see text] scores of 98.84%
  for wind power forecasting in the Scada dataset, 99.01% for temperature forecasting in the SA dataset,
  98.58% for temperature forecasting and 98.35% for wind power forecasting in the WPG dataset. The CNN-ResNet50-LSTM
  model demonstrated promising potential in forecasting both temperature and wind power. Additionally,
  we applied the CNN-ResNet50-LSTM model to predict climate changes up to 2030 using historical data,
  providing insights that highlight its potential for future forecasting and decision-making.'
