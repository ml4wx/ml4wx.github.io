summary: GMG video prediction model adds a global focus module and motion-guided module to capture teleconnections
  and non-rigid weather dynamics; evaluation is generic and results are modest.
abstract: Recent years, weather forecasting has gained significant attention. However, accurately predicting
  weather remains a challenge due to the rapid variability of meteorological data and potential teleconnections.
  Current spatiotemporal forecasting models primarily rely on convolution operations or sliding windows
  for feature extraction. These methods are limited by the size of the convolutional kernel or sliding
  window, making it difficult to capture and identify potential teleconnection features in meteorological
  data. Additionally, weather data often involve non-rigid bodies, whose motion processes are accompanied
  by unpredictable deformations, further complicating the forecasting task. In this paper, we propose
  the GMG model to address these two core challenges. The Global Focus Module, a key component of our
  model, enhances the global receptive field, while the Motion Guided Module adapts to the growth or dissipation
  processes of non-rigid bodies. Through extensive evaluations, our method demonstrates competitive performance
  across various complex tasks, providing a novel approach to improving the predictive accuracy of complex
  spatiotemporal data.
