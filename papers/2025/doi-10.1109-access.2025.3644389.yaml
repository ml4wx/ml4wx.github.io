summary: Vanilla GANs fill gaps in station records before SARIMA forecasts six environmental variables
  for Jaipur and Kanpur, lowering nMAE from 0.16 to 0.10.
abstract: Weather predictions empower authorities to proactively manage critical sectors like water resources,
  agriculture, and emergency services. By anticipating weather patterns, they can deploy early warning
  systems, formulate comprehensive response plans, and implement preventative measures, minimizing potential
  disruptions and protecting public safety. These points primarily motivate us to predict environmental
  parameters, recognizing their growing susceptibility to unsustainable development and environmental
  pollution, exacerbating natural calamities. Based on historical data, this study predicts six essential
  environmental parameters:temperature, precipitation, cloud cover, wind speed, wind direction, anddew
  pointfor Jaipur and Kanpur, India. Cloud-based services enable scalability and computational efficiency
  in organising and transmitting environmental data, offering practical support for the implementation
  pipeline. Vanilla GANs are implemented to address data gaps by generating missing values within these
  parameters. The present work focuses on predicting six significant environmental parameters by utilising
  ARIMA, SARIMA, SES, DES, and TES models. The comparative analysis demonstrates the superior performance
  of the SARIMA model overall for most parameters, as measured by the nMAE and nMSE. For a single parameter,
  the nMAE and nMSE were (0.16, 0.04) before data generation and (0.10, 0.03) after data generation for
  a single city, respectively, in forecasting all specified environmental parameters.
