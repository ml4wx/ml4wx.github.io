summary: Perspective argues integrated AI, including meteorological foundation models and generative methods,
  should drive multi-hazard early warning and decadal climate risk systems.
abstract: As climate change accelerates, human societies face growing exposure to disasters and stress,
  highlighting the urgent need for effective early warning systems (EWS). These systems monitor, assess,
  and communicate risks to support resilience and sustainable development, but challenges remain in hazard
  forecasting, risk communication, and decision-making. This perspective explores the transformative potential
  of integrated Artificial Intelligence (AI) modeling. We highlight the role of AI in developing multi-hazard
  EWSs that integrate Meteorological and Geospatial foundation models (FMs) for impact prediction. A user-centric
  approach with intuitive interfaces and community feedback is emphasized to improve crisis management.
  To address climate risk complexity, we advocate for causal AI models to avoid spurious predictions and
  stress the need for responsible AI practices. We highlight the FATES (Fairness, Accountability, Transparency,
  Ethics, and Sustainability) principles as essential for equitable and trustworthy AI-based Early Warning
  Systems for all. We further advocate for decadal EWSs, leveraging climate ensembles and generative methods
  to enable long-term, spatially resolved forecasts for proactive climate adaptation.
