summary: Applying the IMPROVER post-processing system to ECMWF AIFS yields accuracy gains comparable to
  NWP, and blending AIFS with NWP improves skill, enabling low-risk AI adoption.
abstract: Artificial Intelligence (AI) weather models are now reaching operational-grade performance for
  some variables, but like traditional Numerical Weather Prediction (NWP) models, they exhibit systematic
  biases and reliability issues. We test the application of the Bureau of Meteorology's existing statistical
  post-processing system, IMPROVER, to ECMWF's deterministic Artificial Intelligence Forecasting System
  (AIFS), and compare results against post-processed outputs from the ECMWF HRES and ENS models. Without
  any modification to processing workflows, post-processing yields comparable accuracy improvements for
  AIFS as for traditional NWP forecasts, in both expected value and probabilistic outputs. We show that
  blending AIFS with NWP models improves overall forecast skill, even when AIFS alone is not the most
  accurate component. These findings show that statistical post-processing methods developed for NWP are
  directly applicable to AI models, enabling national meteorological centres to incorporate AI forecasts
  into existing workflows in a low-risk, incremental fashion.
