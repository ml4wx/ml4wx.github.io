summary: Review of neural lossy compression for Earth observation and Earth system model data, highlighting
  petabyte-scale climate model output as a key compression challenge.
abstract: Over the past decades, there has been an explosion in the amount of available Earth Observation
  (EO) data. The unprecedented coverage of the Earth's surface and atmosphere by satellite imagery has
  resulted in large volumes of data that must be transmitted to ground stations, stored in data centers,
  and distributed to end users. Modern Earth System Models (ESMs) face similar challenges, operating at
  high spatial and temporal resolutions, producing petabytes of data per simulated day. Data compression
  has gained relevance over the past decade, with neural compression (NC) emerging from deep learning
  and information theory, making EO data and ESM outputs ideal candidates due to their abundance of unlabeled
  data. In this review, we outline recent developments in NC applied to geospatial data. We introduce
  the fundamental concepts of NC including seminal works in its traditional applications to image and
  video compression domains with focus on lossy compression. We discuss the unique characteristics of
  EO and ESM data, contrasting them with "natural images", and explain the additional challenges and opportunities
  they present. Moreover, we review current applications of NC across various EO modalities and explore
  the limited efforts in ESM compression to date. The advent of self-supervised learning (SSL) and foundation
  models (FM) has advanced methods to efficiently distill representations from vast unlabeled data. We
  connect these developments to NC for EO, highlighting the similarities between the two fields and elaborate
  on the potential of transferring compressed feature representations for machine--to--machine communication.
  Based on insights drawn from this review, we devise future directions relevant to applications in EO
  and ESM.
