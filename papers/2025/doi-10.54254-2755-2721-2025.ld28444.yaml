summary: Gradient-boosted trees forecast western North Pacific typhoon peak intensity 24 h ahead, reaching
  R² ≈ 0.81 for minimum pressure on 151 held-out storms.
abstract: This study forecasts tropical-cyclone peak intensity 24 hours in advance using a parsimonious,
  track-centric feature set. From 400 Western North Pacific storms (2012–2025), standardized pre-peak
  histories are constructed from 37 three-hourly coordinates and augmented with month, initial wind and
  pressure, and 24-hour prior wind and pressure. Best-track records provide targets for peak maximum sustained
  wind and minimum central pressure, and models are assessed on a temporally held-out cohort of 151 post-2020
  storms. Compared with a linear baseline, nonlinear learners substantially improve accuracy for peak
  wind (R² ≈ 0.82–0.83; RMSE ≈ 16.3–16.6 kt versus 22.8 kt) and for minimum pressure, where gradient-boosted
  trees perform best (R² ≈ 0.81; RMSE ≈ 13.2 hPa). Stratified analyses show consistent gains across months,
  latitude bands, and intensity classes, though errors increase for major and super typhoons. Interpretation
  of model behavior indicates that 24-hour prior wind and pressure dominate predictive skill, while latitude
  and longitude primarily modulate outcomes rather than acting as strong main effects. The approach is
  fast, portable, and interpretable, offering a low-latency prior when richer environmental or satellite
  inputs are unavailable.
