summary: U-Net family CONSTRAINN retrieves convective versus stratiform masks for the WIVERN wind mission,
  reaching equitable threat score above 0.6 and showing Doppler velocity is most informative.
abstract: The WIVERN mission promises to deliver the first global observations of the three-dimensional
  wind field and the associated cloud and precipitation structure in a wide range of atmospheric phenomena,
  including isolated thunderstorms, tropical cyclones, mid-latitude frontal systems, and polar lows. A
  critical element in the development of the mission’s wind products is the differentiation between stratiform
  and convective regions. Convective regions are defined as those where vertical wind velocities exceed
  1 m/s. This work introduces CONSTRAINN, a family of U-Net-based neural network models that utilise all
  of WIVERN observables—including vertical profiles of reflectivity and Doppler velocity, as well as brightness
  temperatures—to reconstruct convective wind activity within the Earth’s atmosphere. Results show that
  the retrieved convective/stratiform masks are well reconstructed, with an equitable threat score exceeding
  0.6. Ablation experiments further reveal that Doppler velocity signals are the most informative for
  the reconstruction task.
