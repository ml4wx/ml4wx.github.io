summary: Applies machine learning to Open-Meteo historical data to predict rain for cricket matches in
  Karachi, Lahore and Rawalpindi.
abstract: 'With an emphasis on the upcoming ICC Champions Trophy 2025, which will be staged in Pakistan,
  our research paper examines the complex relationship between weather and cricket. Correct forecasting
  of the weather is crucial for outdoor sporting events to avoid cancellations and guarantee peak athlete
  performance since climate change has an increasing impact on weather patterns. Pakistan''s varied terrain,
  which encompasses plains, hilly areas, and coastal regions, contributes to the country''s notable variety
  in climate. It is vital for event planners to comprehend local climate dynamics since this variability
  causes unpredictable weather patterns, such as monsoon rains, intense heat waves, and droughts. Our
  approach comprised combining real-time analytics with historical weather data from Open-Meteo, as well
  as using Python tools and the Machine Learning algorithm to predict rain during a game. Power BI is
  used to show the results, giving a thorough understanding of the climatic trends in three important
  cities: Karachi, Lahore, and Rawalpindi. The research highlights the significance of data-driven decision-making
  for event planners, as it empowers them to execute efficient backup plans The main objective of this
  research is to improve the sports environment for both players and spectators while tackling the urgent
  problems caused by climate variability.'
