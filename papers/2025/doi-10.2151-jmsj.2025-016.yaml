summary: Surrogate super-resolution downscaling produces 1-km wind fields from 5-km forecasts, and the
  wind-driven dispersion model beats the 5-km physics model over Tokyo terrain.
abstract: Surrogate downscaling is one of the most promising applications of deep learning techniques
  in meteorology. Sekiyama et al. (2023), a companion paper to this study, employed a super-resolution
  surrogate downscaling (SRSD) scheme to construct 1-km gridded wind fields from 5-km gridded operational
  weather forecasts. The SRSD model functions at a much lower computational load than physics-based weather
  forecast models do to downscale wind fields. This study presents a dispersion simulation, in which fluid
  dynamics are physics-based but driven by the SRSD’s wind fields, reproducing air pollution plumes over
  complex terrain near Tokyo. The purpose of this study is to demonstrate the accuracy of not only the
  SRSD’s wind fields but also the dispersion simulation driven by the SRSD’s wind fields. The SRSD’s wind-driven
  dispersion model (1-km grid) yielded better statistical scores than a lower-resolution physics-based
  model (5-km grid). In the snapshots of air pollution plumes, the SRSD’s wind-driven dispersion reproduced
  reasonable distributions in physics, such as horizontally diverted and blocked plumes around steep terrain
  and highland areas, better than the lower-resolution physics-based model did. Although a perfect surrogate
  of higher-resolution physics-based dispersion models cannot be achieved, our strategy can support air
  pollution dispersion simulations considering the overwhelming difference in the wind downscaling forecast
  speed between the SRSD and physics-based schemes. This strategy must be beneficial for environmental
  emergency responses.
