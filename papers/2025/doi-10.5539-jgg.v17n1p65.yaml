summary: Machine learning on remote sensing shows Xi'an urban parks cool land surface most in summer,
  with water index NDWI outperforming NDVI in high-temperature areas.
abstract: 'As a consequence of the dual challenges of global warming and increasingly frequent extreme
  heatwaves, the Urban Heat Island (UHI) effect has become a major threat to urban ecological environments
  and the quality of life in densely built-up areas. Heat risk (HR) poses significant challenges to public
  health and urban resilience. As nature-based solutions, urban parks play an important role in mitigating
  HR and enhancing urban adaptability. This study examines 45 urban parks of various types within Xi’an’s
  built-up area, integrating multi-source remote sensing data and machine learning approaches to evaluate
  their regulatory effects on land surface temperature (LST), capacity to alleviate summer HR, and the
  underlying mechanisms driving these effects. The results reveal that: (1) The cooling effects of urban
  parks in Xi’an exhibit marked seasonal variation, with the greatest cooling intensity and spatial extent
  of influence (typically within a 100–200 m radius) occurring in summer; (2) Ecological and comprehensive
  parks, characterized by abundant vegetation and integrated water features, exhibit year-round regulatory
  capacity, whereas community, recreational, and cultural heritage parks, predominantly composed of deciduous
  vegetation, demonstrate limited cooling effects during winter; and (3) The Normalized Difference Water
  Index (NDWI) exerts a greater cooling influence in high-LST areas than the Normalized Difference Vegetation
  Index (NDVI), highlighting the synergistic role of water and vegetation in enhancing park cooling efficacy.
  This study highlights the essential function of urban green spaces in sustainable urban development
  and offers scientific evidence and practical guidance for improving urban planning and optimizing the
  configuration of green and water elements.'
