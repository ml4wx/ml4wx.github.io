summary: CRPS-LAM uses a hybrid CNN/GNN backbone trained with a CRPS objective for single-pass regional
  ensemble forecasts, about 39x faster than diffusion baselines.
abstract: Limited-Area Models (LAMs) enable weather forecasting over regional domains at higher resolutions
  than what is computationally feasible for global models. At such high resolutions, machine learning
  approaches for weather prediction increasingly rely on ensemble methods to produce probabilistic forecasts.
  However, existing machine learning LAMs are not scalable due to relying on computationally costly diffusion
  models or inefficient graph neural networks. We tackle this by introducing a new hybrid CNN/GNN architecture,
  tailored to the LAM weather forecasting problem. Using this architecture, we construct the DET-LAM deterministic
  model, producing LAM forecasts both more efficiently and accurately than its graph-based competitor.
  We then tackle the ensemble forecasting problem, by using this architecture as a backbone for the generative
  model CRPS-LAM. CRPS-LAM is trained using a Continuous Ranked Probability Score (CRPS) objective, enabling
  efficient training and sampling in a single forward pass. This yields a speedup of $\approx \times 39$
  compared to diffusion-based baselines. We evaluate our approach on regional domains in northern Europe,
  demonstrating that CRPS-LAM produces skillful and well-calibrated forecasts across a range of atmospheric
  variables.
