summary: Ensemble ML gap-filling of six years of tall-tower turbulence data; amplitude-based consistency
  checks expose distortions that standard metrics miss.
abstract: Machine learning modeling is a valuable tool for gap-filling or prediction, and its performance
  is typically evaluated using standard metrics. To enable more precise assessments for time-series data,
  this study emphasizes the importance of considering time-series consistency, which can be evaluated
  through amplitude—specifically, the interquartile range and the lower bound of the band in gap-filled
  time series. To test this hypothesis, a gap-filling technique was applied using long-term (~6 years)
  high-frequency flux and meteorological data collected at four different levels (1.5, 60, 140, and 300
  m above sea level) on a ~300 m tall flux tower. This study focused on turbulent kinetic energy among
  several variables, which is important for estimating sensible and latent heat fluxes and net ecosystem
  exchange. Five ensemble machine learning algorithms were selected and trained on three different datasets.
  Among several modeling scenarios, the stacking model with a dataset combined with derivative data produced
  the best metrics for predicting turbulent kinetic energy. Although the metrics before and after gap-filling
  reported fewer differences among the scenarios, large distortions were found in the consistency of the
  time series in terms of amplitude. These findings underscore the importance of evaluating time-series
  consistency alongside traditional metrics, not only to accurately assess modeling performance but also
  to ensure reliability in downstream applications such as forecasting, climate modeling, and energy estimation.
