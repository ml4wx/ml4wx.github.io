summary: Physics-informed graph attention-LSTM with a spatial season-aware GPD forecasts extreme rainfall
  at Thai gauge stations, outperforming baselines and SEAS5 on extremes.
abstract: Accurate rainfall forecasting, particularly for extreme events, remains a significant challenge
  in climatology and the Earth system. This paper presents novel physics-informed Graph Neural Networks
  (GNNs) combined with extreme-value analysis techniques to improve gauge-station rainfall predictions
  across Thailand. The model leverages a graph-structured representation of gauge stations to capture
  complex spatiotemporal patterns, and it offers explainability through teleconnections. We preprocess
  relevant climate indices that potentially influence regional rainfall. The proposed Graph Attention
  Network with Long Short-Term Memory (Attention-LSTM) applies the attention mechanism using initial edge
  features derived from simple orographic-precipitation physics formulation. The embeddings are subsequently
  processed by LSTM layers. To address extremes, we perform Peak-Over-Threshold (POT) mapping using the
  novel Spatial Season-aware Generalized Pareto Distribution (GPD) method, which overcomes limitations
  of traditional machine-learning models. Experiments demonstrate that our method outperforms well-established
  baselines across most regions, including areas prone to extremes, and remains strongly competitive with
  the state of the art. Compared with the operational forecasting system SEAS5, our real-world application
  improves extreme-event prediction and offers a practical enhancement to produce high-resolution maps
  that support decision-making in long-term water management.
