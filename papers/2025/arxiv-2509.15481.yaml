summary: SolarCAST uses causally structured graph and gated transformer components on station GHI data
  alone, cutting error 25.9% versus Solcast for solar forecasting.
abstract: 'Accurate solar forecasting underpins effective renewable energy management. We present SolarCAST,
  a causally informed model predicting future global horizontal irradiance (GHI) at a target site using
  only historical GHI from site X and nearby stations S - unlike prior work that relies on sky-camera
  or satellite imagery requiring specialized hardware and heavy preprocessing. To deliver high accuracy
  with only public sensor data, SolarCAST models three classes of confounding factors behind X-S correlations
  using scalable neural components: (i) observable synchronous variables (e.g., time of day, station identity),
  handled via an embedding module; (ii) latent synchronous factors (e.g., regional weather patterns),
  captured by a spatio-temporal graph neural network; and (iii) time-lagged influences (e.g., cloud movement
  across stations), modeled with a gated transformer that learns temporal shifts. It outperforms leading
  time-series and multimodal baselines across diverse geographical conditions, and achieves a 25.9% error
  reduction over the top commercial forecaster, Solcast. SolarCAST offers a lightweight, practical, and
  generalizable solution for localized solar forecasting.'
