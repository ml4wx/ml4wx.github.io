summary: Hybrid K-Means, SARIMA and LSTM model for daily rainfall at one Indonesian station, reporting
  MAPE of 8.76% and RMSE of 9.13% for extreme-weather early warning.
abstract: 'This study aims to develop and evaluate an adaptive hybrid weather prediction model that combines
  pattern classification techniques with a deep learning approach to improve forecasting accuracy, especially
  for extreme weather events. Using a quantitative-based Research and Development (R&D) approach, this
  study utilizes ten years of daily rainfall time series data from the Juanda Meteorological Station.
  The method developed comprises three main phases: weather pattern classification using K-Means clustering
  to separate normal and extreme patterns; development of a specialist prediction model using SARIMA for
  seasonal patterns and LSTM for non-linear patterns; and integration of both models into a single adaptive
  framework. The results show that the adaptive hybrid model performs significantly better than the single
  model, with a Mean Absolute Percentage Error (MAPE) of 8.76% and a Root Mean Square Error (RMSE) of
  9.13%. The main contribution of this study is the development of an intelligent, accurate prediction
  framework with strong potential for integration into the national early warning system, thereby supporting
  more effective disaster mitigation efforts in Indonesia. Further research is recommended to validate
  the model in various regions and add additional climate variables to improve prediction accuracy.'
