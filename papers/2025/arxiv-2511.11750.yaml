summary: Physics-guided identity tokens (wind field model) improve tropical cyclone wind, pressure and
  size estimation under distribution shifts, a multi-task setup.
abstract: Tropical Cyclone (TC) estimation aims to accurately estimate various TC attributes in real time.
  However, distribution shifts arising from the complex and dynamic nature of TC environmental fields,
  such as varying geographical conditions and seasonal changes, present significant challenges to reliable
  estimation. Most existing methods rely on multi-modal fusion for feature extraction but overlook the
  intrinsic distribution of feature representations, leading to poor generalization under out-of-distribution
  (OOD) scenarios. To address this, we propose an effective Identity Distribution-Oriented Physical Invariant
  Learning framework (IDOL), which imposes identity-oriented constraints to regulate the feature space
  under the guidance of prior physical knowledge, thereby dealing distribution variability with physical
  invariance. Specifically, the proposed IDOL employs the wind field model and dark correlation knowledge
  of TC to model task-shared and task-specific identity tokens. These tokens capture task dependencies
  and intrinsic physical invariances of TC, enabling robust estimation of TC wind speed, pressure, inner-core,
  and outer-core size under distribution shifts. Extensive experiments conducted on multiple datasets
  and tasks demonstrate the outperformance of the proposed IDOL, verifying that imposing identity-oriented
  constraints based on prior physical knowledge can effectively mitigates diverse distribution shifts
  in TC estimation.Code is available at https://github.com/Zjut-MultimediaPlus/IDOL.
