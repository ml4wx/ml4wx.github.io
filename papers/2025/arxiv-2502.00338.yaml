summary: OneForecast uses multi-scale graph neural networks with neural nested grids to link global and
  high-resolution regional forecasts, improving extreme event prediction across scales.
abstract: Accurate weather forecasts are important for disaster prevention, agricultural planning, etc.
  Traditional numerical weather prediction (NWP) methods offer physically interpretable high-accuracy
  predictions but are computationally expensive and fail to fully leverage rapidly growing historical
  data. In recent years, deep learning models have made significant progress in weather forecasting, but
  challenges remain, such as balancing global and regional high-resolution forecasts, excessive smoothing
  in extreme event predictions, and insufficient dynamic system modeling. To address these issues, this
  paper proposes a global-regional nested weather forecasting framework (OneForecast) based on graph neural
  networks. By combining a dynamic system perspective with multi-grid theory, we construct a multi-scale
  graph structure and densify the target region to capture local high-frequency features. We introduce
  an adaptive messaging mechanism, using dynamic gating units to deeply integrate node and edge features
  for more accurate extreme event forecasting. For high-resolution regional forecasts, we propose a neural
  nested grid method to mitigate boundary information loss. Experimental results show that OneForecast
  performs excellently across global to regional scales and short-term to long-term forecasts, especially
  in extreme event predictions. Codes link https://github.com/YuanGao-YG/OneForecast.
