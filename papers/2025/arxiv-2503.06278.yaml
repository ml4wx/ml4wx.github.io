summary: Tutorial-style application of LSTM recurrent networks to multivariate temperature time-series
  forecasting, with short-horizon skill and clear limitations.
abstract: This paper gives an overview on how to develop a dense and deep neural network for making a
  time series prediction. First, the history and cornerstones in Artificial Intelligence and Machine Learning
  will be presented. After a short introduction to the theory of Artificial Intelligence and Machine Learning,
  the paper will go deeper into the techniques for conducting a time series prediction with different
  models of neural networks. For this project, Python's development environment Jupyter, extended with
  the TensorFlow package and deep-learning application Keras is used. The system setup and project framework
  are explained in more detail before discussing the time series prediction. The main part shows an applied
  example of time series prediction with weather data. For this work, a deep recurrent neural network
  with Long Short-Term Memory cells is used to conduct the time series prediction. The results and evaluation
  of the work show that a weather prediction with deep neural networks can be successful for a short time
  period. However, there are some drawbacks and limitations with time series prediction, which will be
  discussed towards the end of the paper.
