summary: Perspective on how ML, differentiable programming and observational constraints could reduce
  parametric and structural uncertainty in cloud microphysics schemes.
abstract: Abstract Cloud microphysics—the collection of processes that govern the small‐scale formation,
  evolution, and interactions of liquid droplets and ice crystals in clouds and precipitation—remains
  a major source of uncertainty in weather and climate models. Although too small in scale to be explicitly
  resolved in any large‐eddy simulation, weather, or climate model, the representation of cloud microphysical
  processes has significant impact at the climate scale. Current microphysical schemes are limited by
  both parametric uncertainty, linked to uncertainty in physical parameter values, and structural uncertainty,
  arising from incomplete physical understanding of the processes at play or approximations made for computational
  efficiency. Recent advances in the application of machine learning (ML) to the physical sciences show
  significant potential for minimizing these limitations by leveraging high‐fidelity simulations and observations.
  Here we outline the challenges that must be addressed to apply ML toward cloud microphysics scheme development.
  This perspectives paper synthesizes recent progress in using data‐driven methods, including ML, to improve
  cloud microphysics parameterizations and highlights opportunities to address key uncertainties. We discuss
  the roles of aleatoric (irreducible, or statistical) and epistemic (reducible, or systematic) errors
  in contributing to microphysics parameterization uncertainty. ML can leverage observations to improve
  microphysical schemes via bottom‐up and top‐down constraints. Methods such as differentiable programming
  and ML‐enhanced sampling strategies and the creation of large scale benchmark data sets promise to bridge
  the gap between observations and models and to improve the consistency of cloud microphysical representation
  across temporal and spatial scales.
