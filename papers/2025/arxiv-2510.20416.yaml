summary: GraphDOP forecasts coupled Earth-system events directly from raw satellite and in-situ observations,
  with case studies on Arctic sea ice, Hurricane Ian and the 2022 heatwave.
abstract: Interactions between different components of the Earth System (e.g. ocean, atmosphere, land
  and cryosphere) are a crucial driver of global weather patterns. Modern Numerical Weather Prediction
  (NWP) systems typically run separate models of the different components, explicitly coupled across their
  interfaces to additionally model exchanges between the different components. Accurately representing
  these coupled interactions remains a major scientific and technical challenge of weather forecasting.
  GraphDOP is a graph-based machine learning model that learns to forecast weather directly from raw satellite
  and in-situ observations, without reliance on reanalysis products or traditional physics-based NWP models.
  GraphDOP simultaneously embeds information from diverse observation sources spanning the full Earth
  system into a shared latent space. This enables predictions that implicitly capture cross-domain interactions
  in a single model without the need for any explicit coupling. Here we present a selection of case studies
  which illustrate the capability of GraphDOP to forecast events where coupled processes play a particularly
  key role. These include rapid sea-ice freezing in the Arctic, mixing-induced ocean surface cooling during
  Hurricane Ian and the severe European heat wave of 2022. The results suggest that learning directly
  from Earth System observations can successfully characterise and propagate cross-component interactions,
  offering a promising path towards physically consistent end-to-end data-driven Earth System prediction
  with a single model.
