summary: Distills 10,000 simulated years from the DLESyM teacher into long-timestep student models; a
  diffusion student matches ECMWF IFS ensemble S2S skill, showing synthetic pretraining helps.
abstract: Accurate long-range weather forecasting remains a major challenge for AI models, both because
  errors accumulate over autoregressive rollouts and because reanalysis training datasets provide limited
  sampling of the slow modes of variability underpinning predictability. Most AI and all numerical weather
  prediction models are autoregressive, repeatedly applying short-lead forecasts to reach subseasonal-to-seasonal
  (S2S) or seasonal lead times, often causing instability and miscalibration. Long-timestep probabilistic
  models that generate long-range forecasts in a single step offer an alternative, but training on the
  40-year reanalysis record leads to overfitting, suggesting orders of magnitude more data are required.
  We introduce long-range distillation, whereby a long-timestep probabilistic ``student'' model is trained
  to forecast directly at long-range using a huge synthetic dataset generated by an autoregressive ``teacher''
  model. Using the Deep Learning Earth System Model (DLESyM) as teacher, we generate over 10,000 years
  of simulated climate to train student models across a range of timescales. In perfect-model experiments,
  the distilled models outperform climatology and approach their teacher's skill while replacing hundreds
  of autoregressive steps with a single timestep. In the real world, both a diffusion model student fine-tuned
  on ERA5 and a linear inverse model student with mixed DLESyM-ERA5 training achieve S2S forecast skill
  competitive with the ECMWF IFS ensemble, with synthetic pre-training providing improvements beyond ERA5-only
  training. This demonstrates the benefit of synthetic pre-training for both deep learning and classical
  data-driven methods, and represents the first demonstration that real-world skill can be improved by
  training on AI-generated synthetic data in volumes far exceeding the observational record.
