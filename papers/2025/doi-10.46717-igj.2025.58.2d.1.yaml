summary: Artificial neural network outperforms regression and tree-based models for monthly rainfall in
  Erbil, Iraq, using station records from 2004 to 2023.
abstract: Accurate precipitation predictions are critical for the effective management of water resources,
  agricultural practices, and disaster mitigation, especially in hot-summer Mediterranean climatic regions,
  as in Erbil, Iraq. The current study presents an iterative development of machine learning models, Artificial
  Neur al Application, Multiple Linear Regression, Extreme Gradient Boosted, Support Vector Regression
  and Random Forest for the prediction of monthly rainfall from the years of historical data published
  from 2004 to 2023. The models underwent training and validation utilizing a range of meteorological
  features, with their performance evaluated through statistical metrics including Root Mean Square Error,
  normalized root mean square error, Mean Bias Error, and Coefficient of Determination. Among the evaluated
  scenarios, Scenario Model 6 (M6) utilizing Artificial Neural Application was the most effective model,
  shows casing exceptional validation accuracy and strong calibration performance. The Artificial Neural
  Application model successfully identified intricate, non-linear relationships in rainfall patterns,
  surpassing the performance of conventional regression and ensemble-based techniques. This study's findings
  underscore the promise of machine learning methods in improving weather forecasts in areas sensitive
  to climate variations. Future studies should investigate additional meteorological variables such as
  humidity, wind speed, climate mode indices and input data such as these have been demonstrated to greatly
  increase forecasting accuracy in machine learning models. By using the strengths of each method, so
  lowering systematic mistakes, and capturing both linear and nonlinear trends in climate data, hybrid
  modelling approaches combining machine learning with physics-based or statistical models might further
  improve prediction quality.
