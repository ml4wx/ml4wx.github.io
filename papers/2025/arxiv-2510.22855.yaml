summary: Review of neural precipitation forecasting from ANNs to transformers and GNNs, noting persistent
  gaps in extreme rainfall and physical consistency.
abstract: Precipitation prediction has undergone a profound transformation. A notable limitation of traditional
  NWP is the need for extensive statistical post-processing. To address this challenge, neural network-based
  approaches were developed. These approaches offer a framework that directly learns the mapping from
  atmospheric predictors to precipitation targets. Based on the technological development, this article
  first reviews the traditional precipitation forecasting methods and summarizes the development trends
  of precipitation forecasting based on neural networks. We then outline the training process, loss functions,
  and some datasets for precipitation prediction. In the main body of the article, we detail the basic
  artificial neural networks (ANNs), spatial feature extraction models, time feature extraction models,
  generative models, Transformer models, graph neural networks (GNNs), and emerging hybrid models. Finally,
  in the appendix, we supplement the commonly used evaluation metrics. This paper focuses on the advantages
  and disadvantages of various neural network models in precipitation forecasting applications, and also
  pays attention to the latest progress of neural network-based methods. Overall, neural networks have
  significantly improved the accuracy of short-term and medium-term precipitation forecasting, but still
  face challenges in representing extreme rainfall, handling imbalanced data, and ensuring physical consistency.
  The latest progress shows that future prediction systems will increasingly rely on the integration of
  multiple sources of data and hybrid physical-data-driven models to enhance their robustness and applicability.
  By compositing research covering multiple eras and paradigms, we not only depict the history of neural
  networks in precipitation prediction but also outline future directions in next generation forecasting
  systems.
