summary: Appa is a 565M-parameter latent diffusion model that performs score-based global data assimilation
  at 0.25° and hourly resolution, conditioning on arbitrary observations without retraining.
abstract: Deep learning has advanced weather forecasting, but accurate predictions first require identifying
  the current state of the atmosphere from observational data. In this work, we introduce Appa, a score-based
  data assimilation model generating global atmospheric trajectories at 0.25\si{\degree} resolution and
  1-hour intervals. Powered by a 565M-parameter latent diffusion model trained on ERA5, Appa can be conditioned
  on arbitrary observations to infer plausible trajectories, without retraining. Our probabilistic framework
  handles reanalysis, filtering, and forecasting, within a single model, producing physically consistent
  reconstructions from various inputs. Results establish latent score-based data assimilation as a promising
  foundation for future global atmospheric modeling systems.
