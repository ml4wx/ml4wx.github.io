summary: IPCA-MHA-DSRU-Net, a lightweight U-Net with attention, predicts high-resolution 2D marine wind
  fields from reanalysis data for onboard ship routing.
abstract: 'Large-scale weather forecasting is critical for ensuring maritime safety and optimizing transoceanic
  voyages. However, sparse meteorological data, incomplete forecasts, and unreliable communication hinder
  accurate, high-resolution wind system predictions. This study addresses these challenges to enhance
  dynamic voyage planning and intelligent ship navigation. We propose IPCA-MHA-DSRU-Net, a novel deep
  learning model integrating incremental principal component analysis (IPCA) with a spatial-temporal depthwise
  separable U-Net. Key components include: (1) IPCA preprocessing to reduce dimensionality and noise in
  2D wind field data; (2) depthwise-separable convolution (DSC) blocks to minimize parameters and computational
  costs; (3) multi-head attention (MHA) and residual mechanisms to improve spatial-temporal feature extraction
  and prediction accuracy. The framework is optimized for real-time onboard deployment under communication
  constraints. The model achieves high accuracy in high-resolution wind predictions, validated through
  reanalysis datasets. Experiments demonstrated enhanced path planning efficiency and robustness in dynamic
  oceanic conditions. The IPCA-MHA-DSRU-Net balances computational efficiency and accuracy, making it
  viable for resource-limited ships. This novel IPCA application provides a promising alternative for
  preprocessing large-scale meteorological data.'
