summary: Evaluates seven AI weather models over the South Asian monsoon against stations and satellites;
  errors run 15-45% larger than versus reanalysis, with AIFS performing best.
abstract: Accurate weather forecasts are critical for societal planning and disaster preparedness. Yet
  these forecasts remain challenging to produce and evaluate, especially in regions with sparse observational
  coverage. Current evaluation of artificial intelligence (AI) weather prediction relies primarily on
  reanalyses, which can obscure important deficiencies. Here we present MAUSAM (Measuring AI Uncertainty
  during South Asian Monsoon), an evaluation of seven leading AI-based forecasting systems - FourCastNet,
  FourCastNet-SFNO, Pangu-Weather, GraphCast, Aurora, AIFS, and GenCast - during the South Asian Monsoon,
  using ground-based weather stations, rain gauge networks, and geostationary satellite imagery. The AI
  models demonstrate impressive forecast skill during monsoon across a broad range of variables, ranging
  from large-scale surface temperature and winds to precipitation, cloud cover, and subseasonal to seasonal
  eddy statistics, highlighting the strength of data-driven weather prediction. However, the models still
  exhibit systematic errors at finer scales like the underprediction of extreme precipitation, divergent
  cyclone tracks, and the mesoscale kinetic energy spectra, highlighting avenues for future improvement.
  A comparison against observations reveals forecast errors up to 15-45% larger than those relative to
  reanalysis and traditional forecasts, indicating that reanalysis-centric benchmarks can overstate forecast
  skill. Of the models assessed, AIFS achieves the most consistent representation of atmospheric variables,
  with GraphCast and GenCast also showing strong skill. The analysis presents a framework for evaluating
  AI weather models on regional prediction and highlights both the promise and current limitations of
  AI weather prediction in data-sparse regions, underscoring the importance of observational evaluation
  for future operational adoption.
