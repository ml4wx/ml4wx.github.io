summary: Graph neural networks post-process ensemble precipitation forecasts to model distribution tails
  and spatial dependence, aiming for more reliable extreme rainfall predictions.
abstract: Climate change is increasing the occurrence of extreme precipitation events, threatening infrastructure,
  agriculture, and public safety. Ensemble prediction systems provide probabilistic forecasts but exhibit
  biases and difficulties in capturing extreme weather. While post-processing techniques aim to enhance
  forecast accuracy, they rarely focus on precipitation, which exhibits complex spatial dependencies and
  tail behavior. Our novel framework leverages graph neural networks to post-process ensemble forecasts,
  specifically modeling the extremes of the underlying distribution. This allows to capture spatial dependencies
  and improves forecast accuracy for extreme events, thus leading to more reliable forecasts and mitigating
  risks of extreme precipitation and flooding.
