summary: Combines ensemble learning with adaptive neuro-fuzzy inference to project monthly rainfall at
  two Taiwanese stations from three AR5 GCMs under RCP scenarios.
abstract: 'This study integrated the strengths of ensemble learning and soft computing to develop a future
  regional rainfall model for evaluating the complex characteristics of island precipitation. Soft computing
  uses the well-developed adaptive neuro-fuzzy inference system, which has been successfully applied in
  atmospheric hydrology and combines the features of neural networks and fuzzy logic. This combination
  enables artificial intelligence (AI) to effectively represent reasoning derived from complex data and
  expert experience. Due to the multiple atmospheric and hydrological factors that influence rainfall,
  the nonlinear interrelations among them are highly intricate. Nonlinear principal component analysis
  can extract nonlinear features from the data, reduce dimensionality, and minimize the adverse effects
  of data noise and excessive input factors on soft computing, which may otherwise result in poor model
  performance. Ultimately, ensemble learning enhances prediction accuracy and reduces uncertainty. This
  study used Tamsui and Kaohsiung in Taiwan as case study locations. Historical monthly rainfall data
  (January 1950 to December 2005) from Tamsui Station and Kaohsiung Station of the Central Weather Administration,
  along with historical and varied emission scenario data (RCP 4.5 and RCP 8.5) from three AR5 GCM models
  (ACCESS 1.0, CSIRO-MK3.6.0, MRI-CGCM3), were used to evaluate future regional rainfall trends and uncertainties
  through the method proposed in this study. The research findings indicate the following: (1) Ensemble
  learning results demonstrate that all examined general circulation models effectively simulate historical
  rainfall trends. (2) The average rainfall trends under the RCP 4.5 emission scenario are generally consistent
  with historical rainfall trends. (3) The exceedance probabilities of future rainfall during the mid-term
  (2061–2080) and long-term (2081–2100) suggest that Kaohsiung may experience precipitation events with
  higher rainfall than historical data during dry seasons (October to April of next year), while Tamsui
  Station may exhibit greater variability in terms of exceedance probabilities. (4) Under both the RCP
  4.5 and RCP 8.5 emission scenarios, the percentage changes in future rainfall variability at Kaohsiung
  Station during dry seasons are higher than those during wet seasons (May to September), indicating an
  increased risk of extreme precipitation events during dry seasons.'
