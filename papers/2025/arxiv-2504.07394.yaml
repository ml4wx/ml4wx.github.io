summary: ClimateBench-M aligns ERA5, NOAA extreme-event and NASA HLS satellite data into one multimodal
  benchmark, with a simple generative baseline competitive on forecasting and alerts.
abstract: Climate science studies the structure and dynamics of Earth's climate system and seeks to understand
  how climate changes over time, where the data is usually stored in the format of time series, recording
  the climate features, geolocation, time attributes, etc. Recently, much research attention has been
  paid to the climate benchmarks. In addition to the most common task of weather forecasting, several
  pioneering benchmark works are proposed for extending the modality, such as domain-specific applications
  like tropical cyclone intensity prediction and flash flood damage estimation, or climate statement and
  confidence level in the format of natural language. To further motivate the artificial general intelligence
  development for climate science, in this paper, we first contribute a multi-modal climate benchmark,
  i.e., ClimateBench-M, which aligns (1) the time series climate data from ERA5, (2) extreme weather events
  data from NOAA, and (3) satellite image data from NASA HLS based on a unified spatial-temporal granularity.
  Second, under each data modality, we also propose a simple but strong generative method that could produce
  competitive performance in weather forecasting, thunderstorm alerts, and crop segmentation tasks in
  the proposed ClimateBench-M. The data and code of ClimateBench-M are publicly available at https://github.com/iDEA-iSAIL-Lab-UIUC/ClimateBench-M.
