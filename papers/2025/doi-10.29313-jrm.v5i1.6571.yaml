summary: Examines how ANN learning rate affects rainfall prediction using 184 days of Indonesian BMKG
  station observations.
abstract: Abstract. Artificial Neural Network (ANN) is a machine learning method that mimics the way the
  human brain processes information. ANN has the ability to recognize patterns from complex and non-linear
  data, making it suitable for use in various applications, including weather prediction. In this study,
  ANN is used to predict rainfall based on a dataset consisting of 8 attributes, namely year, day, rainfall,
  surface pressure, air temperature, humidity, wind speed, and wind direction. This research aims to understand
  the ANN algorithm in processing data on rainy weather prediction. The model training process is carried
  out using weight update optimization through Adam Optimizer, which is designed to accelerate convergence
  and improve prediction accuracy. Stages in the training process include data processing, determining
  parameters such as learning rate, and evaluating model performance using BMKG daily observation data
  for 184 days. The feedforward propagation process uses linear, ReLU, and sigmoid functions, while backpropagation
  with Adam Optimizer adapts the weights based on the learning rate and gradient of the loss function.
  The results show that the algorithm for rainy weather prediction is built with the parameters of learning
  rate, activation function, weight, bias, and optimizer as the main conditions. Therefore, these parameters
  are very important in the ANN algorithm to process data for rainy weather prediction. Abstrak. Artificial
  Neural Network (ANN) merupakan salah satu metode pembelajaran mesin yang meniru cara kerja otak manusia
  dalam memproses informasi. ANN memiliki kemampuan untuk mengenali pola dari data yang kompleks dan tidak
  linear, sehingga cocok digunakan dalam berbagai aplikasi, termasuk prediksi cuaca. Dalam penelitian
  ini, ANN digunakan untuk memprediksi curah hujan berdasarkan dataset yang terdiri dari 8 atribut, yaitu
  tahun, hari ke, curah hujan, tekanan permukaan, suhu udara, kelembaban, kecepatan angin, dan arah angin.
  Penelitian ini bertujuan untuk memahami algoritma ANN dalam memproses data pada prediksi cuaca hujan.
  Proses pelatihan model dilakukan dengan menggunakan optimasi pembaruan bobot melalui Adam Optimizer,
  yang dirancang untuk mempercepat konvergensi dan meningkatkan akurasi prediksi. Tahapan dalam proses
  pelatihan meliputi pengolahan data, penentuan parameter seperti learning rate, dan evaluasi performa
  model menggunakan data hasil pengamatan harian BMKG selama 184 hari. Proses feedforward propagation
  menggunakan fungsi linear, ReLU, dan sigmoid, sementara backpropagation dengan Adam Optimizer yang mengadaptasi
  bobot berdasarkan learning rate dan gradien dari fungsi loss. Hasil penelitian menunjukkan bahwa algoritma
  untuk prediksi cuaca hujan dibangun dengan parameter learning rate, fungsi aktivasi, bobot, bias, dan
  optimizer sebagai kondisi utama. Oleh karena itu, parameter-parameter ini sangat penting dalam algoritma
  ANN untuk memproses data pada prediksi cuaca hujan.
