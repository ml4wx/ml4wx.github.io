summary: XiChen uses the gradient of a 4DVar cost function to assimilate raw observations into an end-to-end
  ML forecast, achieving skill competitive with operational NWP without NWP initial conditions.
abstract: Machine Learning (ML) has shown great promise in revolutionizing weather forecasting, yet most
  ML systems still rely on initial conditions generated by Numerical Weather Prediction (NWP) systems.
  End-to-end ML models aim to eliminate this dependency, but they often rely on observation-specific encoders
  and require redesign or retraining when observation sources change, thereby limiting their operational
  robustness. Here, we introduce XiChen, a global weather observation-to-forecast ML system via four-dimensional
  variational (4DVar) gradient-guided flexible assimilation. We demonstrate that the gradient of the 4DVar
  cost function serves as a physically grounded interface that maps heterogeneous observations into a
  common state space. This novel formulation enables XiChen to flexibly assimilate diverse conventional
  and raw satellite observations while preserving physical consistency. Experiments show that the system
  achieves forecasting metrics competitive with operational NWP systems. This work provides a practical
  and physically consistent route toward operational ML-based global weather forecasting systems with
  heterogeneous and evolving observations.
