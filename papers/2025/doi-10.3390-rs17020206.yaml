summary: DRAF-Net dual-branch attention network corrects station-level NWP forecasts, reducing RMSE by
  83.44% across eight variables on Chinese station data.
abstract: 'Accurate station-level numerical weather predictions are critical for disaster prevention and
  mitigation, with error correction playing an essential role. However, existing correction models struggle
  to effectively handle the high-dimensional features and complex dependencies inherent in meteorological
  data. To address these challenges, this paper proposes the dual-branch residual-guided multi-view attention
  fusion network (DRAF-Net), a novel deep learning-based correction model. DRAF-Net introduces two key
  innovations: (1) a dual-branch residual structure that enhances the spatial sensitivity of deep high-dimensional
  features and improves output stability by connecting raw data and shallow features to deep features,
  respectively; and (2) a multi-view attention fusion mechanism that models spatiotemporal influences,
  temporal dynamics, and spatial associations, significantly improving the representation of complex dependencies.
  The effectiveness of DRAF-Net was validated on two real-world datasets comprising observations and predictions
  from Chinese meteorological stations. It achieved an average RMSE reduction of 83.44% and an average
  MAE reduction of 84.21% across all eight variables, significantly outperforming other methods. Moreover,
  extensive studies confirmed the critical contributions of each key component, while visualization results
  highlighted the model’s ability to eliminate anomalous values and improve prediction consistency. The
  code will be made publicly available to support future research and development.'
