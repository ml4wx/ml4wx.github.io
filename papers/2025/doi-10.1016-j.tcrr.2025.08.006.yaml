summary: Roundtable synthesis on AI for typhoon monitoring and forecasting, and on integrating AI weather
  prediction models with physics-based NWP.
abstract: This paper summarizes the ‘Artificial Intelligence (AI) + Typhoon’ session and a subordinated
  roundtable forum at the 21st China National Workshop on Tropical Cyclones (NWTC-XXI, 16-18 April. 2025,
  Changsha China), highlighting recent advances in AI techniques for typhoon monitoring, forecasting,
  and impact assessment, as well as the deep integration of state-of-the-art artificial-intelligence weather
  prediction (AIWP) models with traditional physics-based numerical weather prediction (NWP) models. Key
  insights from the round-table forum are synthesized, emphasizing the strengths, limitations, and future
  development directions for AI models in typhoon forecasting. As a forward-looking perspective, we should
  be ready for embracing the emerging AI for research (AI4R) paradigm to advance typhoon science and technology.
