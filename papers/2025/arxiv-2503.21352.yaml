summary: Uses GPT-4 Turbo to extract configurations and results from 2699 papers, revealing precipitation
  biases of nine WRF microphysics schemes across regions.
abstract: 'Large language models afford opportunities for using computers for intensive tasks, realizing
  research opportunities that have not been considered before. One such opportunity could be a systematic
  interrogation of the scientific literature. Here, we show how a large language model can be used to
  construct a literature review of 2699 publications associated with microphysics parametrizations in
  the Weather and Research Forecasting (WRF) model, with the goal of learning how they were used and their
  systematic biases, when simulating precipitation. The database was constructed of publications identified
  from Web of Science and Scopus searches. The large language model GPT-4 Turbo was used to extract information
  about model configurations and performance from the text of 2699 publications. Our results reveal the
  landscape of how nine of the most popular microphysics parameterizations have been used around the world:
  Lin, Ferrier, WRF Single-Moment, Goddard Cumulus Ensemble, Morrison, Thompson, and WRF Double-Moment.
  More studies used one-moment parameterizations before 2020 and two-moment parameterizations after 2020.
  Seven out of nine parameterizations tended to overestimate precipitation. However, systematic biases
  of parameterizations differed in various regions. Except simulations using the Lin, Ferrier, and Goddard
  parameterizations that tended to underestimate precipitation over almost all locations, the remaining
  six parameterizations tended to overestimate, particularly over China, southeast Asia, western United
  States, and central Africa. This method could be used by other researchers to help understand how the
  increasingly massive body of scientific literature can be harnessed through the power of artificial
  intelligence to solve their research problems.'
