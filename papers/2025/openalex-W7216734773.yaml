summary: Survey comparing data mining techniques for weather prediction, finding decision trees, ANN and
  SVM perform best on multidimensional weather datasets.
abstract: Weather forecasting is critically important application in meteorology and has been one of the
  most scientifically and technologically challenging problem through out the globe since past and still
  only approximations are being made to accurate prediction of weather eventslike cloudburst,hailingetc.
  Machine learning algorithms are implemented in data mining process to extract hidden patterns and useful
  information from huge weather databases, essential to get prepare for the worst of the ambience.This
  paper propounds the comparative analysis of various data mining techniques applied by different researchers
  in different domains. This survey also reviews the available literatures of algorithms applied by different
  researchers to exploit various data mining techniques for detecting and predicting weather events. For
  weather prediction Decision Tree, Artificial Neural Network and SVM techniques gives better results
  with high prediction accuracy than other data mining techniques for multidimensional weather data sets.
