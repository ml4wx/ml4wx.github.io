abstract: Weather forecasting has long been an essential application in various domains, including agriculture,
  transportation, disaster management, and daily planning. Traditional methods based on physical and statistical
  models have limitations in accuracy and computational efficiency. With advancements in Artificial Intelligence
  (AI) and Machine Learning (ML), these technologies have emerged as powerful tools for enhancing weather
  prediction. This paper explores how AI and ML are transforming weather forecasting, discussing key methodologies,
  models, datasets, and challenges while providing an overview of their current and potential applications.
