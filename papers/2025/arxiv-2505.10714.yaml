summary: GeoGrid-Bench, about 3,200 questions over 16 gridded climate variables, tests whether vision-language
  foundation models can reason about geospatial grid data.
abstract: We present GeoGrid-Bench, a benchmark designed to evaluate the ability of foundation models
  to understand geo-spatial data in the grid structure. Geo-spatial datasets pose distinct challenges
  due to their dense numerical values, strong spatial and temporal dependencies, and unique multimodal
  representations including tabular data, heatmaps, and geographic visualizations. To assess how foundation
  models can support scientific research in this domain, GeoGrid-Bench features large-scale, real-world
  data covering 16 climate variables across 150 locations and extended time frames. The benchmark includes
  approximately 3,200 question-answer pairs, systematically generated from 8 domain expert-curated templates
  to reflect practical tasks encountered by human scientists. These range from basic queries at a single
  location and time to complex spatiotemporal comparisons across regions and periods. Our evaluation reveals
  that vision-language models perform best overall, and we provide a fine-grained analysis of the strengths
  and limitations of different foundation models in different geo-spatial tasks. This benchmark offers
  clearer insights into how foundation models can be effectively applied to geo-spatial data analysis
  and used to support scientific research.
