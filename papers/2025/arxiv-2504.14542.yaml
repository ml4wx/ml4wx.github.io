summary: A lightweight neural network emulates the WRF radiative transfer scheme to speed up computation,
  validated on an extreme weather case where training data is sparse.
abstract: Radiative transfer calculations in weather and climate models are notoriously complex and computationally
  intensive, which poses significant challenges. Traditional methods, while accurate, can be prohibitively
  slow, necessitating the development of more efficient alternatives. Recently, empirical emulators based
  on neural networks (NN) have been proposed as a solution to this problem. These emulators aim to replicate
  the radiation parametrization used in the models, at a fraction of the computational cost. However,
  a common issue with these emulators is that their accuracy has often been insufficiently evaluated,
  especially for extreme events for which the amount of training data is sparse. The current study proposes
  such a model for accelerating radiative heat transfer modeling in WRF, and validates the accuracy of
  the approach for an extreme weather scenario.
