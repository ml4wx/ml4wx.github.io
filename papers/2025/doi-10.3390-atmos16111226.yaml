summary: Random-forest feature selection plus CNN-GRU bias correction downscales precipitation from 0.1°
  to 1 km in the Yellow River basin, improving NSE by 1.7–40%.
abstract: Addressing the challenges posed by sparse ground meteorological stations and the insufficient
  resolution and accuracy of reanalysis and satellite precipitation products, this study establishes a
  multi-source environmental feature system that precisely matches the target precipitation data resolution
  (1 km × 1 km). Based on this foundation, it innovatively proposes a Random Forest-based Dual-Spectrum
  Adaptive Threshold algorithm (RF-DSAT) for key factor screening and subsequently integrates Convolutional
  Neural Network (CNN) with Gated Recurrent Unit (GRU) to construct a Spatiotemporally Coupled Bias Correction
  Model for multi-source data (CGBCM). Furthermore, by integrating these technological components, it
  presents an Artificial Intelligence-driven Multi-source data Precipitation Downscaling method (AIMPD),
  capable of downscaling precipitation fields from 0.1° × 0.1° to high-precision 1 km × 1 km resolution.
  Taking the bend region of the Yellow River Basin in China as a case study, AIMPD demonstrates superior
  performance compared to bicubic interpolation, eXtreme Gradient Boosting (XGBoost), CNN, and Long Short-Term
  Memory (LSTM) networks, achieving improvements of approximately 1.73% to 40% in Nash-Sutcliffe Efficiency
  (NSE). It exhibits exceptional accuracy, particularly in extreme precipitation downscaling, while significantly
  enhancing computational efficiency, thereby offering novel insights for global precipitation downscaling
  research.
