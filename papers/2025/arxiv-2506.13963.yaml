summary: A deep-learning storm surge model applied to 900,000 synthetic tropical cyclones estimates US
  coastal risk, finding a 50% rise in population at risk by 2100.
abstract: Storm surge is one of the deadliest hazards posed by tropical cyclones (TCs), yet assessing
  its current and future risk is difficult due to the phenomenon's rarity and physical complexity. Recent
  advances in artificial intelligence applications to natural hazard modeling suggest a new avenue for
  addressing this problem. We utilize a deep learning storm surge model to efficiently estimate coastal
  surge risk in the United States from 900,000 synthetic TC events, accounting for projected changes in
  TC behavior and sea levels. The derived historical 100-year surge (the event with a 1% yearly exceedance
  probability) agrees well with historical observations and other modeling techniques. When coupled with
  an inundation model, we find that heightened TC intensities and sea levels by the end of the century
  result in a 50% increase in population at risk. Key findings include markedly heightened risk in Florida,
  and critical thresholds identified in Georgia and South Carolina.
