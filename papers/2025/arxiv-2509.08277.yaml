summary: Matrix-profile weighted ensemble combines several geographical rainfall models across Vietnamese
  basins, lowering error mean and spread versus baselines for 1 to 84 hour horizons.
abstract: Rainfall forecasting in Vietnam is highly challenging due to its diverse climatic conditions
  and strong geographical variability across river basins, yet accurate and reliable forecasts are vital
  for flood management, hydropower operation, and disaster preparedness. In this work, we propose a Matrix
  Profile-based Weighted Ensemble (MPWE), a regime-switching framework that dynamically captures covariant
  dependencies among multiple geographical model forecasts while incorporating redundancy-aware weighting
  to balance contributions across models. We evaluate MPWE using rainfall forecasts from eight major basins
  in Vietnam, spanning five forecast horizons (1 hour and accumulated rainfall over 12, 24, 48, 72, and
  84 hours). Experimental results show that MPWE consistently achieves lower mean and standard deviation
  of prediction errors compared to geographical models and ensemble baselines, demonstrating both improved
  accuracy and stability across basins and horizons.
