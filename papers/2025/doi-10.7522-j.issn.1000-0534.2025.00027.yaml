summary: LightGBM bias correction of 2 m maximum temperature over Sichuan cuts MAE by 2.48 °C versus the
  EC model in Jan–Jun 2024.
abstract: To enhance the prediction accuracy of the 2-meter maximum temperature in complex terrain areas，
  this study developed a gradient modeling approach based on the LightGBM （Light Gradient Boosting Machine，
  LGB） algorithm， applied to the Sichuan Basin and its surrounding regions.By selecting and and analyzing
  multiple meteorological and topographic factors， an optimized model was constructed.The results demonstrate
  that： （1） From January to June 2024， the LightGBM model reduced the mean absolute error by 2.48 ℃ and
  improved the forecast accuracy by 36.97% compared to EC model.Among them， the improvement effect of
  the west Sichuan Plateau and Panxi area was the most significant， the accuracy rate increased by 67.2%
  and 57.5%， respectively.（2） Compared with the existing objective forecast products SPCO and SCMOC， the
  LightGBM model improved prediction accuracy by 5.1% and 10.3%， respectively.Particularly in the Panxi
  area and the Sichuan Basin， the accuracy at individual stations improved by up to 17.6% and 23.4%， respectively.（3）The
  LightGBM model reduced the mean absolute error by 2.05~2.78 ℃， and increased the accuracy by 31.1%~41.0%，
  with the most notable enhancement occurring in April.（4）The LightGBM model exhibits strong scalability.Future
  work could further improve temperature prediction across Sichuan Province and other regions by incorporating
  time-lag effects， spatial neighborhood characteristics， and combining zoning modeling and multi-model
  integration.
