summary: A two-stage ML method clusters five large-scale weather patterns and links them to US West Coast
  offshore hub-height winds and HRRR model biases.
abstract: 'Abstract. The U.S. West Coast holds great potential for wind power generation, although its
  potential varies due to complex coastal processes. Characterizing and modelling turbine hub-height winds
  under different weather conditions are vital for wind resources assessment and management. This study
  uses a two-stage machine learning algorithm to identify five large-scale meteorological patterns (LSMPs):
  post-trough, post-ridge, pre-ridge, pre-trough, and California-high. The LSMPs are linked to offshore
  wind patterns, specifically at lidar buoy locations within lease areas for future wind farm development
  off Humboldt and Morro Bay. Distinct wind speed, wind direction, diurnal variation, and jet feature
  responses are observed for each LSMP and at both lidar locations. The wind speed at Humboldt is higher
  during the post-trough, pre-ridge, and California-high LSMPs and lower during the remaining LSMPs. Morro
  Bay has smaller responses in mean speeds, showing increased wind speed during the post-trough and California-high
  LSMPs. Besides the LSMPs, local factors, including the land-sea thermal contrast and topography, also
  modify mean winds and diurnal variation. The High-Resolution Rapid Refresh model analysis does a good
  job of capturing the mean and variation at Humboldt but produces large biases at Morro Bay, particularly
  during the pre-ridge and California-high LSMPs. The findings are anticipated to guide the selection
  of cases for studying the influence of specific large-scale and local factors on California offshore
  winds and to contribute to refining numerical weather prediction models, thereby enhancing the efficiency
  and reliability of offshore wind energy production.'
