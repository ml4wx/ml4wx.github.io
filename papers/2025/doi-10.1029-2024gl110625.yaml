summary: Conditional diffusion model refines WRF precipitation output to reproduce CMORPH satellite precipitation,
  preserving extremes better than raw NWP and traditional predictive models.
abstract: Abstract Recent advancements in state‐of‐the‐art generative deep‐learning models, particularly
  diffusion models, have significantly enhanced the capability to produce realistic and diverse synthetic
  images and videos. These advancements have had a profound impact on fields such as computer vision and
  natural language processing. In this study, we leverage this cutting‐edge generative model to refine
  Numerical Weather Prediction (NWP) precipitation outputs. By conditioning the generative model with
  fundamental meteorological variables simulated by the Weather Research and Forecasting model, we aim
  to reproduce the high‐resolution satellite precipitation product, specifically CMORPH. Benefiting from
  the superior ability of generative diffusion models to learn the distribution of target data, these
  models excel in providing detailed and accurate precipitation estimations over the raw NWP outputs and
  traditional predictive models. With this presented pipeline, we provide valuable insights and practical
  tools for refining precipitation forecasting while preserving its extremities and variability thus better
  guiding decision making regarding weather dependent activities.
