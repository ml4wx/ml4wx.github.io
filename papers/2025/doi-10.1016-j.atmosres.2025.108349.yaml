summary: Identifies severe convective clouds from Himawari-8/9 and links them to severe weather; deep
  learning segments severe weather within clouds with 78% mean IoU.
abstract: 'The occurrence of severe convective weather (SCW) often poses significant threats to socio-economic
  stability and public safety. Monitoring the evolution of convective clouds can provide critical support
  for timely severe weather warnings. We utilize Himawari-8/9 geostationary satellite imagery to identify
  severe convective clouds (SCCs) within large-scale regions through a multi-threshold sliding window
  (MTSW) algorithm, with validation using ground-based radar reflectivity data and real-world weather
  cases. Additionally, 507 SCW events were analyzed using Global Precipitation Measurement (GPM) data
  and European Centre for Medium-Range Weather Forecasts Reanalysis v5 (ERA5) datasets to investigate
  their relationship with the identified 12,177 SCCs. Finally, deep learning methods were further introduced
  to explore the quantitative correlation between SCCs and SCW. Key findings include: (1) Strong consistency
  between satellite-identified SCCs and high-reflectivity zones observed by ground-based radar; (2) The
  algorithm effectively detects convective clouds at various developmental stages, achieving an identification
  accuracy of 85 %; (3) Spatiotemporal analysis reveals that more than 90 % of severe convective weather
  (SCW) occurs within the coverage of SCCs and a 40 km buffer zone surrounding their boundaries, although
  the presence of SCCs does not necessarily lead to SCW; (4) By applying deep learning, the model attained
  a mean Intersection over Union (MIoU) score of 78 % in segmenting severe convective weather within SCCs.
  These findings enhance the application potential of geostationary satellites, deepen understanding of
  severe convective mechanisms, and improve forecasting precision. • SCW exhibits three occurrence patterns:
  within SCCs, around SCCs, and isolated minority events. • SCW occurs mainly within the SCC and a 40
  km buffer zone on its borders. • Identification results of SCC serve as indicative precursors for over
  90 % of SCW events. • Deep learning approach achieved an 85 % accuracy rate in determining SCW occurrence
  within SCCs.'
