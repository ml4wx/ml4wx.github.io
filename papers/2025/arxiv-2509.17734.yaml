summary: AutoGluon AutoML forecasts whether 90-day maximum temperatures in South America will be above,
  normal, or below normal, using station data and ocean indices; competitive with operational platforms.
abstract: 'In recent years, great progress has been made in the field of forecasting meteorological variables.
  Recently, deep learning architectures have made a major breakthrough in forecasting the daily average
  temperature over a ten-day horizon. However, advances in forecasting events related to the maximum temperature
  over short horizons remain a challenge for the community. A problem that is even more complex consists
  in making predictions of the maximum daily temperatures in the short, medium, and long term. In this
  work, we focus on forecasting events related to the maximum daily temperature over medium-term periods
  (90 days). Therefore, instead of addressing the problem from a meteorological point of view, this article
  tackles it from a climatological point of view. Due to the complexity of this problem, a common approach
  is to frame the study as a temporal classification problem with the classes: maximum temperature "above
  normal", "normal" or "below normal". From a practical point of view, we created a large historical dataset
  (from 1981 to 2018) collecting information from weather stations located in South America. In addition,
  we also integrated exogenous information from the Pacific, Atlantic, and Indian Ocean basins. We applied
  the AutoGluonTS platform to solve the above-mentioned problem. This AutoML tool shows competitive forecasting
  performance with respect to large operational platforms dedicated to tackling this climatological problem;
  but with a "relatively" low computational cost in terms of time and resources.'
