summary: A fine-tuned 1.5B-parameter weather foundation model gives asset-level power-grid forecasts that
  cut temperature MAE by 15% and reach 0.72 precision for day-ahead rime-ice detection.
abstract: 'Weather foundation models (WFMs) have recently set new benchmarks in global forecast skill,
  yet their concrete value for the weather-sensitive infrastructure that powers modern society remains
  largely unexplored. In this study, we fine-tune Silurian AI''s 1.5B-parameter WFM, Generative Forecasting
  Transformer (GFT), on a rich archive of Hydro-Québec asset observations--including transmission-line
  weather stations, wind-farm met-mast streams, and icing sensors--to deliver hyper-local, asset-level
  forecasts for five grid-critical variables: surface temperature, precipitation, hub-height wind speed,
  wind-turbine icing risk, and rime-ice accretion on overhead conductors. Across 6-72 h lead times, the
  tailored model surpasses state-of-the-art NWP benchmarks, trimming temperature mean absolute error (MAE)
  by 15%, total-precipitation MAE by 35%, and lowering wind speed MAE by 15%. Most importantly, it attains
  an average precision score of 0.72 for day-ahead rime-ice detection, a capability absent from existing
  operational systems, which affords several hours of actionable warning for potentially catastrophic
  outage events. These results show that WFMs, when post-trained with small amounts of high-fidelity,
  can serve as a practical foundation for next-generation grid-resilience intelligence.'
