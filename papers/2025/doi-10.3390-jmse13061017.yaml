summary: Random forest storm surge surrogate, a 1000-year typhoon catalog and extreme value fits estimate
  Zhejiang coastal wind and surge return levels.
abstract: 'Zhejiang Province in China is one of the most typhoon-prone regions globally, making typhoon
  and storm surge hazard analysis critically important for disaster mitigation. This study integrates
  the Tropical Cyclone Risk Model (TCRM) with a machine learning-based storm surge forecasting model to
  analyze typhoon hazards and storm surge risks at four representative coastal sites in Zhejiang Province:
  Haimen, Ruian, Wenzhou, and Zhapu. Firstly, the input database of the TCRM has been updated and subsequently
  used to generate a 1000-year synthetic typhoon event catalog for the Northwest Pacific region. Secondly,
  four machine learning models—Long Short-Term Memory (LSTM), Back Propagation (BP), Support Vector Regression
  (SVR), and Random Forest (RF)—were developed to forecast storm surge component at the four sites, with
  sensitivity analysis conducted on the input parameters. Among the four models, RF consistently outperformed
  the others across all four sites. Thirdly, by integrating the storm surge forecasting model with the
  Yan Meng (YM) typhoon wind field model, extreme wind speed sequences and extreme surge component sequences
  were derived for the four coastal sites. Finally, four extreme value distribution models—empirical distribution,
  Weibull, Gumbel, and Generalized Pareto Distribution (GPD)—were applied to fit the extreme wind and
  surge sequences. Goodness-of-fit tests indicated that the GPD best captured extreme wind speeds at all
  four sites and extreme surge levels at Haimen, Ruian, and Wenzhou. Using the optimal distributions,
  return periods (10-, 50-, 100-, and 200-year) for extreme wind speeds and surge components were calculated,
  providing actionable references for disaster risk management authorities.'
