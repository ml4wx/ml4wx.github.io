summary: Multimodal transformer forecasts wildfire occurrence probability at 100 m^2 cells within 24 h
  using hourly weather forecasts and Google Earth terrain/vegetation imagery.
abstract: Due to climate change, the extreme wildfire has become one of the most dangerous natural hazards
  to human civilization. Even though, some wildfires may be initially caused by human activity, but the
  spread of wildfires is mainly determined by environmental factors, for examples, (1) weather conditions
  such as temperature, wind direction and intensity, and moisture levels; (2) the amount and types of
  dry vegetation in a local area, and (3) topographic or local terrian conditions, which affects how much
  rain an area gets and how fire dynamics will be constrained or faciliated. Thus, to accurately forecast
  wildfire occurrence has become one of most urgent and taunting environmental challenges in global scale.
  In this work, we developed a real-time Multimodal Transformer Neural Network Machine Learning model
  that combines several advanced artificial intelligence techniques and statistical methods to practically
  forecast the occurrence of wildfire at the precise location in real time, which not only utilizes large
  scale data information such as hourly weather forecasting data, but also takes into account small scale
  topographical data such as local terrain condition and local vegetation conditions collecting from Google
  Earth images to determine the probabilities of wildfire occurrence location at small scale as well as
  their timing synchronized with weather forecast information. By using the wildfire data in the United
  States from 1992 to 2015 to train the multimodal transformer neural network, it can predict the probabilities
  of wildfire occurrence according to the real-time weather forecast and the synchronized Google Earth
  image data to provide the wildfire occurrence probability in any small location ($100m^2$) within 24
  hours ahead.
