summary: A physics-guided deep ensemble maps hourly 2 km air temperature over the contiguous US from GOES-16
  with 1.93 C station-based error and uncertainty estimates.
abstract: Near-surface air temperature is a key physical property of the Earth's surface. Although weather
  stations offer continuous monitoring and satellites provide broad spatial coverage, no single data source
  offers seamless data in a spatiotemporal fashion. Here, we propose a data-driven, physics-guided deep
  learning approach to generate hourly air temperature data at 2 km resolution over the contiguous United
  States. The approach, called Amplifier Air-Transformer, first reconstructs GOES-16 surface temperature
  data obscured by clouds. It does so through a neural network encoded with the annual temperature cycle,
  incorporating a linear term to amplify ERA5 temperature values at finer scales and convolutional layers
  to capture spatiotemporal variations. Then, another neural network transforms the reconstructed surface
  temperature into air temperature by leveraging its latent relationship with key Earth surface properties.
  The approach is further enhanced with predictive uncertainty estimation through deep ensemble learning
  to improve reliability. The proposed approach is built and tested on 77.7 billion surface temperature
  pixels and 155 million air temperature records from weather stations across the contiguous United States
  (2018-2024), achieving hourly air temperature mapping accuracy of 1.93 C in station-based validation.
  The proposed approach streamlines surface temperature reconstruction and air temperature prediction,
  and it can be extended to other satellite sources for seamless air temperature monitoring at high spatiotemporal
  resolution. The generated data of this study can be downloaded at https://doi.org/10.5281/zenodo.15252812,
  and the project webpage can be found at https://skrisliu.com/HourlyAirTemp2kmUSA/.
