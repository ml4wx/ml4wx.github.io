summary: EMAIRA-VFI uses inter-frame attention to interpolate S-band radar echoes, improving temporal
  resolution for severe convection monitoring over conventional interpolation.
abstract: Severe convective weather events are characterised by rapid evolution and high destructive potential,
  requiring weather radars to provide observations with high temporal resolution. However, current S-band
  weather radar systems, constrained by their volumetric scanning strategies, often fail to capture the
  rapidly changing features of these systems promptly. To address this limitation, we propose EMAIRA-VFI,
  a deep learning–based method for temporal super-resolution reconstruction of radar echoes, which enhances
  the temporal resolution of radar data to meet the demands of severe convective weather monitoring. By
  introducing an inter-frame attention mechanism, the proposed method effectively fuses spatiotemporal
  features from sequential radar echoes, enabling accurate modelling of dynamic weather evolution and
  the generation of continuous, high-temporal-resolution radar echoes. Compared with conventional temporal
  interpolation methods, EMAIRA-VFI demonstrates significant improvements in both interpolation accuracy
  and the preservation of fine-scale meteorological structures. Experimental results show that the model
  not only enhances the capability of S-band radars in monitoring rapidly evolving weather events but
  also provides a new perspective for spatiotemporal fusion and the intelligent application of radar data.
  We have open-sourced the code for this work at https://github.com/whua68010/EMAIRA-VFI .
