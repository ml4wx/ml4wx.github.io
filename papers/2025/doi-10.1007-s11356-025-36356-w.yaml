summary: PRISMA-based review of AI for predicting climate change impacts, highlighting the need for hybrid
  physics-AI models and synthetic data to fill atmospheric data gaps.
abstract: The accelerating pace of climate change poses unprecedented challenges to global ecosystems
  and human societies. In response, this study reviews the power of Artificial Intelligence (AI) to develop
  advanced predictive models for assessing the multifaceted impacts of climate change. The study used
  the PRISMA framework to find, assess, and combine research on using AI in predicting climate change
  impacts. Integrating AI techniques, such as machine learning algorithms and predictive analytics, into
  climate modeling provides a robust framework for understanding and projecting the complex dynamics associated
  with global climate change. These models exhibit a high capacity for data collection, analyzing intricate
  patterns and integration, including their relationships within the datasets. They enable quick and accurate
  predictions of future climate scenarios, scenarios testing, historical eventualities, their magnitude,
  and adaptation. However, challenging issues like data gaps, especially in interconnected systems such
  as the atmosphere, are associated. Also, AI insight translation into an actionable recommendation recognizable
  by the policymakers, including ethical usage, is an emerging concern. Therefore, further advances to
  circumvent these will include the integration of AI with physical models, developing hybrid models,
  and generating synthetic climatic datasets to enhance data quality and gaps. Also, AI tools are being
  developed to aid decision-making for policy integration. AI-based predictive modeling is restructuring
  and bringing reformative change to the understanding of and approach toward climatic change through
  AI model development. AI guarantees an unfailing plan and a resilient future with sustainable approaches
  that empower scientists, policymakers, and communities.
