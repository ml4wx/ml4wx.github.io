summary: Compares SARIMA, ARIMA and ETS models for rainfall forecasting at coastal and inland eThekwini
  stations using 32 years of station data.
abstract: While floods and droughts are natural occurrences in the earth’s hydrological cycle, their escalating
  frequency and intensity have become a major concern for governments throughout the globe. Developing
  nations, such as South Africa, are weary of these extreme weather events because they understand they
  lack the necessary resources and infrastructure to deal with them. The eThekwini Municipality serves
  as a prime example of how vulnerable developing nations' regions are to the devastating effects of floods
  and droughts, as multiple floods have devastated the area, resulting in fatalities, damaging public
  infrastructure, and demolishing houses. The scale of the damage from the floods reveals that significant
  gaps exist in disaster preparedness in the eThekwini Region. Rainfall forecasting is a vital tool that
  has been underutilised that can be used preemptively to manage or mitigate flooding and enhance water
  resource management in the region. Machine learning models in particular are very useful in rainfall
  forecasting; hence, the goal of this study was to evaluate the most efficient models for forecasting
  precipitation in the eThekwini northern and central regions, which are coastal and inland areas, respectively.
  Rainfall data spanning 32 years was obtained from meteorological stations in both regions, and the SARIMA,
  ARIMA, and ETS machine learning models were used for rainfall forecasting and evaluated based on their
  ability to capture seasonal patterns, handle non-stationarity, and provide accurate predictions. Model
  performance was analysed, and comparisons were made using the root mean squared error (RMSE), mean absolute
  error (MAE), and mean absolute scaled error (MASE) as evaluation metrics. The study's findings indicate
  that the most effective models for both the northern and central regions were SARIMA (0,0,0) (2,0,0)
  [12] and SARIMA (1,0,0) (1,0,0) [12]. These findings provide valuable insights for meteorologists, hydrologists,
  and policymakers involved in regional climate modelling and water resource management.
