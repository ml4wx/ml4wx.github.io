summary: PhyDL-NWP embeds atmospheric equations in a continuous-coordinate network for resolution-free
  downscaling and forecasting, with 55K parameters and 170x faster inference.
abstract: Weather forecasting is essential but remains computationally intensive and physically incomplete
  in traditional numerical weather prediction (NWP) methods. Deep learning (DL) models offer efficiency
  and accuracy but often ignore physical laws, limiting interpretability and generalization. We propose
  PhyDL-NWP, a physics-guided deep learning framework that integrates physical equations with latent force
  parameterization into data-driven models. It predicts weather variables from arbitrary spatiotemporal
  coordinates, computes physical terms via automatic differentiation, and uses a physics-informed loss
  to align predictions with governing dynamics. PhyDL-NWP enables resolution-free downscaling by modeling
  weather as a continuous function and fine-tunes pre-trained models with minimal overhead, achieving
  up to 170x faster inference with only 55K parameters. Experiments show that PhyDL-NWP improves both
  forecasting performance and physical consistency.
