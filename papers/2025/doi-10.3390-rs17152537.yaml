summary: BiLSTM with whale optimization and modal decomposition predicts the PDO 15 months ahead, reaching
  correlation 0.68 at 6 months, up from 0.47 for prior deep models.
abstract: The Pacific Decadal Oscillation (PDO), as the dominant mode of decadal sea surface temperature
  variability in the North Pacific, exhibits both interannual and decadal fluctuations that significantly
  influence global climate. The complexity associated with PDO changes poses challenges for accurate predictions.
  This study develops a BiLSTM-WOA-MMD (BWM) model, which integrates a bidirectional long short-term memory
  network with a whale optimization algorithm (WOA) and multiple modal decomposition (MMD), to forecast
  PDO at both interannual and decadal time scales. The model successfully predicts monthly/annual average
  PDO index of up to 15 months/5 years in advance, achieving a correlation coefficient of 0.56/0.55. By
  utilizing the WOA to effectively optimize hyperparameters, the model enhances the PDO prediction skill
  compared to existing deep learning PDO prediction models, improving the correlation coefficient from
  0.47 to 0.68 at a 6-month lead time. The combination of MMD and WOA further minimizes prediction errors
  and extends the forecasting effective time to 15 months by capturing essential modes. The BWM model
  can be employed for future PDO prediction and the predicted PDO will remain in its cool phase in the
  next year both using the PDO index from NECI and derived from near-time satellite data. This proposed
  model offers an effective way to advance the prediction skill of climate variability on multiple time
  scales by utilizing all kinds of data available including satellite data, and provides a large-scale
  background to monitor marine heatwaves.
