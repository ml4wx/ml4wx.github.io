summary: CAMulator is an autoregressive ML emulator of CAM6 that conserves mass, moisture and energy,
  reproduces ENSO and NAO variability, and runs 350 times faster.
abstract: We introduce CAMulator version 1, an auto-regressive machine-learned (ML) emulator of the Community
  Atmosphere Model version 6 (CAM6) that simulates the next atmospheric state given the prescribed sea
  surface temperatures and incoming solar radiation. CAMulator explicitly conserves global dry air mass,
  moisture, and total atmospheric energy while remaining numerically stable over indefinite climate integrations.
  It successfully reproduces the annual CAM6 climatology and key modes of climate variability, including
  the El Niño-Southern Oscillation, the North Atlantic Oscillation, and the Pacific-North American pattern,
  with slightly muted variability. When forced with sea surface temperature (SST) outside the training
  distribution, CAMulator exhibits a systematic cold bias in high-latitude regions, particularly in boreal
  winter, likely due to the absence of interactive land and sea ice. Nonetheless, CAMulator achieves these
  results with a 350 times speedup over CAM6, making it an efficient alternative for generating large
  ensembles.
