summary: TCDM, the first conditional diffusion model for tropical cyclone intensity, gives full probabilistic
  forecasts from satellite and reanalysis inputs, with better rapid-intensification hit rates and fewer
  false alarms.
abstract: Reliable forecasting of tropical cyclone (TC) intensity—particularly rapid intensification (RI)
  events—remains a major challenge in meteorology, largely due to the inherent difficulty of accurately
  quantifying predictive uncertainty. Traditional numerical approaches are computationally expensive,
  while statistical models often fail to capture the highly nonlinear relationships involved. Mainstream
  machine learning models typically provide only deterministic point forecasts and lack the ability to
  represent uncertainty. To address this limitation, we propose Tropical Cyclone Diffusion Model (TCDM),
  the first conditional diffusion-based probabilistic forecasting framework for TC intensity. TCDM integrates
  multimodal meteorological data, including satellite imagery, re-analysis fields, and environmental predictors,
  to directly generate the full probability distribution of future intensities. Experimental results show
  that TCDM not only achieves highly competitive deterministic accuracy (low MAE and RMSE; high R2), but
  also delivers high-quality probabilistic forecasts (low CRPS; high PICP). Moreover, it substantially
  improves RI detection by achieving higher hit rates with fewer false alarms. Compared with traditional
  ensemble-based methods, TCDM provides a more efficient and flexible approach to probabilistic forecasting,
  offering valuable support for TC risk assessment and disaster preparedness.
