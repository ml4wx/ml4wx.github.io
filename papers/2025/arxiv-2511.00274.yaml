summary: Benchmarks ACE2 emulator and NeuralGCM hybrid against observed regional thermodynamic trends,
  finding AI models capture Arctic amplification but miss US Southwest heat extremes and arid drying.
abstract: AI models have emerged as potential complements to physics-based models, but their skill in
  capturing observed regional climate trends with important societal impacts has not been explored. Here,
  we benchmark satellite-era regional thermodynamic trends, including extremes, in an AI emulator (ACE2)
  and a hybrid model (NeuralGCM). We also compare the AI models' skill to physics-based land-atmosphere
  models. Both AI models show skill in capturing regional temperature trends such as Arctic Amplification.
  ACE2 outperforms other models in capturing vertical temperature trends in the midlatitudes. However,
  the AI models do not capture regional trends in heat extremes over the US Southwest. Furthermore, they
  do not capture drying trends in arid regions, even though they generally perform better than physics-based
  models. Our results also show that a data-driven AI emulator can perform comparably to, or better than,
  hybrid and physics-based models in capturing regional thermodynamic trends.
