summary: Observation Assimilation Transformer corrects NWP fields with sparse station data, downscaling
  ERA5 to 1 km COSMO with lower MAE and CRPS than COSMO itself.
abstract: We present the Observation Assimilation Transformer (OAT), a geometry-aware neural process that
  corrects and refines a prior numerical weather prediction (NWP) field into a high-resolution posterior
  field by assimilating sparse observations. OAT is an encoder-decoder transformer that considers a set
  of observed locations and their NWP prior to condition predictions at a set of arbitrary unobserved
  query locations. Its sparse attention mechanism makes it scalable to thousands of station observations
  and depends on relative positions between locations, never on the absolute coordinates. The model allows
  for partially missing observations, predictions at arbitrary continuous locations without grid projection,
  and outputs are parametric distributions. A station-randomized training algorithm is developed with
  continuous ranked probability score (CRPS) loss. We test OAT on two datasets - one at regional scale
  with hundreds of stations, and one at continental scale with thousands of stations. On these datasets
  OAT outperforms several baselines and shows well calibrated predictions. In an illustrative case study,
  OAT's downscaling capabilities are demonstrated by downscaling ERA5 (~31km) to COSMO (1km), where OAT
  achieves lower mean absolute error (MAE) and CRPS for temperature and precipitation on test stations
  compared to COSMO.
