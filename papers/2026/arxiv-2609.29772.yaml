summary: WeatherDiagFlow adds motion, heavy-echo risk and uncertainty heads to radar nowcasting, plus
  a multi-agent bulletin and audit layer, on FJRADAR data.
abstract: Radar nowcasting is essential for short-term warning and emergency response, yet conventional
  systems mainly return future radar fields and provide limited support for operational communication
  and post-event verification. We formulate radar nowcasting as an evidence-grounded forecast--bulletin--audit
  task, in which a numerical forecaster produces both future radar fields and structured diagnostic evidence.
  Forecast-time bulletins use only model-available evidence, whereas post-event audits incorporate future
  radar truth only after the forecast horizon is observed. Based on this task formulation, WeatherDiagFlow
  predicts motion, growth and decay, heavy-echo risk, and uncertainty to condition rolling flow refinement,
  while frozen-scaffold residual calibration improves long-lead strong-echo preservation. A multi-agent
  layer converts the structured evidence into operational bulletins and independently generates verification
  audits without feeding textual outputs back into the forecaster. Experiments on FJRADAR demonstrate
  competitive overall performance and improved strong-echo event skill. WeatherDiagFlow therefore connects
  numerical prediction, evidence-grounded reporting, and auditable verification under a leakage-controlled
  protocol.
