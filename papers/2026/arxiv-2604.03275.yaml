summary: IPSL-AID is a denoising diffusion downscaler that turns coarse ERA5-based fields into 0.25° temperature,
  wind and precipitation with realistic extremes, spectra and uncertainty.
abstract: Effective adaptation and mitigation strategies for climate change require high-resolution projections
  to inform strategic decision-making. Conventional global climate models, which typically operate at
  resolutions of 150 to 200 kilometers, lack the capacity to represent essential regional processes. IPSL-AID
  is a global to regional downscaling tool based on a denoising diffusion probabilistic model designed
  to address this limitation. Trained on ERA5 reanalysis data, it generates 0.25 degree resolution fields
  for temperature, wind, and precipitation using coarse inputs and their spatiotemporal context. It also
  models probability distributions of fine-scale features to produce plausible scenarios for uncertainty
  quantification. The model accurately reconstructs statistical distributions, including extreme events,
  power spectra, and spatial structures. This work highlights the potential of generative diffusion models
  for efficient climate downscaling with uncertainty
