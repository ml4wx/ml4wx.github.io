summary: Neural rainfall model shows Amazon deforestation reduces heavy rainfall by up to 7% and raises
  light rainfall by 4%, with threshold responses after 2-3 months.
abstract: 'Understanding how vegetation loss alters rainfall remains a major challenge in climate and
  hydrological science, as deforestation modifies precipitation through heterogeneous, seasonal and nonlinear
  land-atmosphere feedbacks. Existing models struggle to capture these dynamics: convection is parameterised
  at coarse scales, tipping behaviour is poorly constrained, and rainfall-deforestation analyses are limited
  to multi-decadal timescales. Therefore, many approaches resolve correlations rather than causal effects,
  limiting our ability to anticipate hydrological disruption. Using a neural-network model for hourly
  rainfall prediction, combined with pathway diagnostics and sensitivity analyses, we examine how vegetation
  perturbations reorganise rainfall across space, intensity regimes, and timescales under deforestation.
  We assess whether the model captures physically consistent dependencies linking vegetation, atmospheric
  state, and precipitation, and whether sustained canopy loss induces threshold behaviour. The model accurately
  predicts rainfall occurrence and intensity (Spearman = 0.84, F1 = 0.93, ROC-AUC = 0.98) and learns temporally
  ordered dependencies aligned with ecohydrological theory. Sensitivity analyses reveal rapid, asymmetric
  responses to vegetation loss: heavy rainfall (20-50 mm/h) declines by up to 7% under sustained deforestation,
  while light rainfall (0.1-1 mm/h) increases by 4%. Rainfall entropy rises by 1.3%, and dry-season intensity
  increases by 0.3-0.5% per 0.5% forest-cover loss, with strongest impacts in the north-western Amazon
  and Andean foothills. Threshold analysis reveals a sharp decline in precipitating area fraction after
  2-3 months of sustained vegetation change in sensitive regions. These results demonstrate that data-driven
  approaches uncover process-relevant land-atmosphere coupling and highlight growing hydrological vulnerability
  in the Amazon.'
