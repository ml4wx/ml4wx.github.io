summary: Neural network using global analysis predicts Corsica heavy precipitation events up to 24 h ahead
  nearly as well as NWP-forecast inputs.
abstract: 'Heavy precipitation events (HPEs) in the Mediterranean can cause serious damage, thus improving
  their forecasts is essential to better anticipate their consequences. This study aims to emphasize the
  role of the synoptic-scale circulation in forecasting HPEs in the Mediterranean island of Corsica with
  a neural network (NN). Firstly, two NN models are developed to forecast the occurrence of HPEs up to
  24 h ahead: one that uses forecasts from two state-of-the-art, global and regional numerical weather
  prediction (NWP) models-named NN-Forecasts-and one that only uses the 00 UTC analysis of the global
  NWP model-named NN-Analysis. Model performance is compared using several evaluation metrics of binary
  classification and for increasingly intense HPEs. Results show that despite being a much more parsimonious
  approach, the NN-Analysis model displays similar performance than NN-Forecasts with all metrics. This
  result emphasizes the ability of NNs to capture underlying physics from the synoptic-scale atmospheric
  circulation leading to HPEs at specific locations. Secondly, a clustering task is performed using a
  Gaussian Mixture Model to identify the synoptic-scale atmospheric context preceding HPEs. Four clusters
  are identified with increasing synoptic-scale forcing as given by the integrated vapor transport: an
  overall high pressure system over western Europe and a surface depression over the Mediterranean, the
  Iberian Peninsula and the Atlantic. The NN-Analysis model shows best performance for predicting HPEs
  when the atmospheric context belongs to the Iberian and Atlantic clusters, which further emphasizes
  the role of the synoptic-scale circulation in HPE occurrence.'
