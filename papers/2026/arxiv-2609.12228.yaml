summary: WIND-Bench provides quality-controlled MADIS in-situ near-surface wind observations across CONUS,
  validated against HRRR, as a benchmark for evaluating ML and NWP high-wind forecasts.
abstract: Accurate wind forecasts are essential for operational decision-making and public safety, yet
  forecasts tend to miss near-surface high wind speeds in complex terrain. In response, advances in machine
  learning (ML) weather prediction methods have demonstrated the ability to improve forecast skill beyond
  traditional numerical weather prediction (NWP) models. However, the absence of a benchmark dataset to
  evaluate NWP and ML models with sufficient, quality-controlled wind speed observations in complex terrain
  poses challenges to the development and intercomparison of high-quality surface wind forecasts across
  the Conterminous United States (CONUS). We develop the Wind IN-situ Data Benchmark (WIND-Bench), a benchmark
  dataset from in-situ observations in the Meteorological Assimilation Data Ingest System (MADIS) observational
  network. WIND-Bench integrates multiple sensor networks with quality control that distinguishes sensor
  failures from high-wind conditions, using a framework that validates observations against forecasts
  from the National Oceanic and Atmospheric Administration (NOAA) High-Resolution Rapid Refresh (HRRR)
  model. WIND-Bench provides a standardized benchmark for evaluating ML and NWP models and for quantifying
  forecast skill, accelerating the development, evaluation, and operational deployment of skilled near-surface
  wind forecasts.
