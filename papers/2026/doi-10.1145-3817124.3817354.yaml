summary: DP-STNet forecasts next-hour reflectivity from dual-polarization radar and converts it to rainfall
  via a Z–R mapping for heavy precipitation nowcasting.
abstract: Convective precipitation nowcasting remains a formidable challenge due to the high non-linearity
  and localized suddenness of extreme weather events. To address critical issues in microphysical feature
  extraction and quantitative precipitation estimation (QPE), this paper proposes a dual-polarization
  spatiotemporal framework, DP-STNet. DP-STNet takes multi-altitude dual-polarization radar observations
  (ZH, ZDR, and KDP) from the preceding hour as input and explicitly forecasts the next-hour radar reflectivity
  field ZH on a 10-step horizon. For QPE, we further construct an empirical Z–R relationship via polynomial
  regression that maps (ZH, ZDR) to surface rainfall intensity, and apply this mapping to convert predicted
  reflectivity into rainfall estimates. In this design, KDP contributes to spatiotemporal feature learning
  and microphysical representation, while the polynomial Z–R mapping remains a consistent two-variable
  formulation. Experimental results demonstrate that DP-STNet improves physical consistency and accuracy
  in quantifying extreme precipitation compared with baseline schemes.
