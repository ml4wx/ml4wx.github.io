summary: Explainable ML corrects NWP wind speed at Zhejiang stations, cutting RMSE by 20–40%, with friction
  velocity identified as the key predictor via SHAP.
abstract: Abstract Accurate wind speed forecasting is essential for daily activities and socio‐economic
  production. This study employs an explainable machine learning (ML) model to correct wind speed forecasts
  from a numerical weather prediction (NWP) model over weather stations across lead times of 1–24 hr in
  Zhejiang Province, China. Eleven meteorological variables derived from the NWP model are used as predictors.
  The results demonstrate that ML model substantially improves the original NWP forecasts, reducing the
  root mean square error of approximately 20%–40% at most stations and about 10% at certain coastal stations.
  The corrected forecasts also consistently achieve higher Kling‐Gupta Efficiency scores and Forecast
  Accuracy across all lead times. To enhance model interpretability, we apply Split Count and SHapley
  Additive exPlanation analyses. The results indicate that the friction velocity (UST) is the most influential
  predictor and reveal a threshold beyond which the ML model's correction performance improves markedly.
  The ML model performance slightly declines in coastal regions, likely due to the inconsistent representation
  of UST between the land and water surface in the NWP model. Monthly analysis further shows superior
  model performance in November and December, when UST values are higher. This study underscores the value
  of explainable ML models in improving NWP wind forecasts and provides insights for correcting meteorological
  variables in NWP models.
