summary: Compares tree-based probabilistic wind power models driven by weather ensembles; a conditional
  diffusion model gives 12% better CRPS than a Gaussian process baseline.
abstract: Accurate production forecasts are essential for the integration of renewable energy sources
  into the power grid. This paper illustrates how to obtain probabilistic forecasts of wind power generation
  using gradient boosting trees and an ensemble of weather forecasts. To this end, we perform a comparative
  analysis across three state-of-the-art probabilistic prediction methods-conformalized quantile regression,
  natural gradient boosting and conditional diffusion models-all of which can be combined with tree-based
  machine learning. The methods are validated using four years of data for all Belgian offshore wind farms.
  We benchmark the models against the power curve and a calibrated wake model as well as a probabilistic
  method using stochastic variational Gaussian process regression. The tree-based models significantly
  reduce the mean absolute error in comparison to the deterministic baselines. Additionally, all three
  methods outperform the Gaussian process baseline in probabilistic skill, while two out of the three
  also improve point forecast accuracy. The conditional diffusion model attains the best performance,
  with improvements of 5% in mean absolute error and 12% in continuous rank probability score compared
  to the probabilistic baseline. Last, the results indicate an average improvement in point forecast accuracy
  of 17% by using an ensemble of weather forecasts instead of a single provider.
