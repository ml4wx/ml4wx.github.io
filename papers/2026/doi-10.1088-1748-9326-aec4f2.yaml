summary: Deep-learning 0.1° downscaling of Earth system projections shows carbon neutrality slightly strengthens
  China's PV potential (+0.27%) while high emissions reduce it (−0.49%).
abstract: 'Solar photovoltaic (PV) power is central to China’s carbon neutrality strategy, but the extent
  to which mitigation reshapes the climate resource base for PV generation remains uncertain. Here we
  combine Earth system simulations with a 0.1°-resolution deep learning downscaling framework to quantify
  changes in China’s meteorological PV potential under divergent emission pathways. We find that the carbon-neutral
  SSP2-com pathway not only stabilizes but actively strengthens national meteorological PV potential by
  century’s end (+0.27% relative to 1981−2010 baseline), whereas high emissions trigger a persistent decline
  (−0.49%). Crucially, stringent mitigation induces a fundamental spatial restructuring: it shields premium
  solar resources in western China from severe depletion (e.g. Tibet: −0.42% under SSP2-com versus −1.23%
  under SSP3-7.0), while substantially boosting meteorological PV potential in historically resource-constrained
  eastern provinces (e.g. Guizhou: +1.05%, Hunan: +1.04%, Jiangxi: +0.97%, Fujian: +1.07%). This asymmetric
  response reduces interprovincial disparities in solar resource availability. Factor-separation analyses
  attribute most changes to shortwave radiation rather than temperature or wind speed, consistent with
  aerosol-related brightening under stringent mitigation. Our findings reveal that carbon neutrality functions
  not merely as a climate corrective but as a potential driver of energy security, potentially contributing
  to a solar landscape with greater spatial equity and resilience.'
