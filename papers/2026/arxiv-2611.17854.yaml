summary: Using CNOP perturbations on a differentiable ocean AI model, mesoscale ocean-current errors are
  shown to seed extreme El Niño forecast failures and align with the spring predictability barrier.
abstract: The predictability of the El Niño-Southern Oscillation (ENSO) has historically been linked to
  large-scale errors in models' initial conditions such as heat content and surface wind stress. Here
  we demonstrate that these slowly evolving errors may ultimately originate from mesoscale errors in initial
  oceanic states that are common in current models and ocean observation systems. This hidden source of
  ENSO forecast uncertainty, in terms of mesoscale ocean-current errors, is convincingly exposed by the
  conditional nonlinear optimal perturbation (CNOP) method applied to a differentiable ocean AI model.
  The CNOP-identified most influential current errors are strongly event-dependent. For the 1997/98 El
  Niño, the initial current errors in the eastern Pacific results in the largest forecast error through
  locally suppressing original subsurface warming. For the 2015/16 event, the dominate error originates
  from the western Pacific, which reorganizes upper ocean temperature structure and affects the eastern
  Pacific through the equatorial waveguide. Further analysis reveals that these current errors perturb
  mesoscale eddy count and eddy kinetic energy triggering large-scale temperature errors that hinder El
  Niño development. The timing of the maximum growth rate of the obtained CNOP error is well aligned with
  the spring predictability barrier of ENSO, and the error structures are reflected in simulated analysis
  errors caused by unresolved mesoscale currents. These findings extend the potential source of ENSO predictability
  beyond large-scale thermal signals, reveal for the first time an uncharted route of ENSO forecast failure,
  and provide an important physical basis for targeted ocean observations and data assimilation in the
  future.
