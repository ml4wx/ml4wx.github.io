summary: ClimateCause releases an expert-annotated dataset of implicit and nested causal relations from
  climate policy reports and benchmarks LLMs on causal reasoning.
abstract: Understanding climate change requires reasoning over complex causal networks. Yet, existing
  causal discovery datasets predominantly capture explicit, direct causal relations. We introduce ClimateCause,
  a manually expert-annotated dataset of higher-order causal structures from science-for-policy climate
  reports, including implicit and nested causality. Cause-effect expressions are normalized and disentangled
  into individual causal relations to facilitate graph construction, with unique annotations for cause-effect
  correlation, relation type, and spatiotemporal context. We further demonstrate ClimateCause's value
  for quantifying readability based on the semantic complexity of causal graphs underlying a statement.
  Finally, large language model benchmarking on correlation inference and causal chain reasoning highlights
  the latter as a key challenge.
