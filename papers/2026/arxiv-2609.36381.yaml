summary: Fully differentiable JAX non-hydrostatic limited-area dynamical core enables gradient-based sensitivity,
  topography and boundary optimization for regional and convection-permitting simulations.
abstract: We present Su\^etes, a fully differentiable, non-hydrostatic, limited-area atmospheric dynamical
  core implemented in JAX. Su\^etes includes both a semi-implicit semi-Lagrangian scheme and a Split-Explicit
  Runge-Kutta scheme with acoustic substepping, enabling applications from coarse regional simulations
  to convection-permitting dynamics. Its terrain-following geometry, spatial discretization, time integration,
  initial conditions, lateral boundary treatment, and included physical parameterizations are all compatible
  with reverse-mode automatic differentiation. A single reverse-mode pass can therefore compute sensitivities
  of forecast diagnostics to selected initial and boundary fields, physical parameters, topography, and
  computational geometry. We provide a series of numerical experiments---including a tracer-source inverse
  problem, a sensitivity analysis of a three-dimensional squall-line, adversarial perturbation construction
  an ERA5-driven downslope hurricane force wind event, topography optimization, and terrain-following
  coordinate optimization---demonstrating the versatility of Su\^etes as a framework for gradient-based
  diagnosis and model development at regional and convection-permitting scale.
