summary: Adapts univariate time-series foundation models to multi-station weather using cross-station
  error-prior and spatial graphs with dynamic fusion.
abstract: 'With the rise of univariate time series foundation models (e.g., Sundial, Timer), initial efforts
  have been made to extend them to multivariate settings. However, these models mainly focus on modeling
  correlations among variables. When they are applied to multi-station weather forecasting, two important
  factors are often overlooked: (1) the spatial information of stations, and (2) different error priors
  of different stations relative to the foundation model. In this paper, we propose WxFM-XL, a model for
  adapting univariate time series foundation models to multi-station weather forecasting. WxFM-XL introduces
  a cross-station error correlation prior graph to capture stationwise error priors with respect to the
  foundation model. Building on this, we further propose a dynamic fusion mechanism that adaptively integrates
  a spatial correlation graph with the error correlation prior graph. Experiments on multiple datasets
  demonstrate that our model outperforms state of the art baselines.'
