summary: Equation discovery learns a compact stochastic differential equation for tropical cyclone intensification
  from IBTrACS and ERA5, matching observed statistics and a saddle-node bifurcation.
abstract: Tropical cyclones are among the most consequential weather hazards, yet estimates of their risk
  are limited by the relatively short historical record. To extend these records, researchers often generate
  large ensembles of synthetic storms using simplified models of cyclone intensification. Developing such
  models, however, has traditionally required substantial theoretical effort. Here we explore whether
  equation-discovery methods, a class of data-driven techniques designed to infer governing equations,
  can accelerate the process of developing simplified intensification models. Using observational storm
  data (IBTrACS) together with environmental conditions from reanalysis (ERA5), we learn a compact stochastic
  differential equation describing tropical cyclone intensity evolution. We focus on TCs because their
  dynamics are well studied and a hierarchy of reduced-order models exist, enabling direct comparison
  of the learned model to physically-derived counterparts. We find that the learned model simulates synthetic
  TCs whose intensification statistics and hazard estimates are consistent with observations and competitive
  with a leading physics-based TC intensification model. Our model also reproduces known nonlinear dynamical
  behavior of tropical cyclones, including as a saddle node bifurcation as inner core ventilation is increased.
  This result shows that equation-discovery approaches, when applied directly to storm intensity, can
  recover not only realistic statistics but also physically meaningful dynamical structure. These findings
  highlight the potential for data-driven methods to complement existing theory and reduced-order models
  in the study of extreme weather.
