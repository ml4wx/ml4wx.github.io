summary: Uses GraphCast forecasts of tropospheric parameters to retrieve GNSS precipitable water vapour
  globally, beating GPT3 and stacked ML baselines (RMSE 0.73 mm vs radiosonde).
abstract: 'Abstract Real‐time water vapor monitoring is critical for meteorological applications such
  as weather forecasting and nowcasting. However, accurate real‐time retrieval of precipitable water vapor
  (PWV) from Global Navigation Satellite Systems (GNSS) remains challenging, especially for GNSS stations
  lacking meteorological sensors. This study introduces a global forecast‐based GNSS PWV retrieval method
  leveraging the artificial‐intelligence (AI)‐based global weather forecast model named GraphCast. We
  utilize GraphCast to predict key tropospheric parameters (weighted mean temperature, T m , and zenith
  hydrostatic delay, ZHD), which are then combined with GNSS observations to obtain PWV. To assess the
  accuracy of GraphCast‐derived PWV, a comprehensive evaluation experiment is conducted through comparison
  with two baseline models: the Global Pressure and Temperature 3 (GPT3) model and stacked machine learning
  (ML) model, using global radiosonde and GNSS data sets. Evaluation results demonstrate that GraphCast‐based
  PWV significantly outperforms the baseline models across three metrics: root mean square error (RMSE),
  mean absolute error, and coefficient of determination ( R 2 ). Specifically, the RMSE of GraphCast‐derived
  PWV is 0.73 mm when validated against radiosonde data sets, a significant improvement of more than ∼1.3
  mm over the baseline models. Similarly, the RMSE is 1.7 mm when validated against GNSS data sets, reflecting
  an improvement of more than ∼0.7 mm. In addition, GraphCast‐based PWV also exhibits lower sensitivity
  to latitude, altitude, and temporal variations. This new approach demonstrates strong potential for
  achieving global high‐precision, real‐time PWV retrieval independent of local meteorological observations.'
