summary: XGBoost trained on pilot reports and ERA5 predicts high-altitude clear air turbulence over US
  airspace with AUC 0.904, improving moderate-to-severe detection with aircraft parameters.
abstract: High-altitude Clear Air Turbulence (CAT) poses significant risks to aviation safety due to its
  unpredictability and challenges in detection. This study leverages machine learning models to improve
  CAT prediction within U.S. airspace at 200-350 hPa pressure levels, utilizing Pilot Reports (PIREPs),
  ERA5 reanalysis data, and aircraft aerodynamic parameters from the BADA database. Gradient boosting
  algorithms, particularly XGBoost, achieved the highest performance with an AUC of 0.904, demonstrating
  superior capability in capturing non-linear atmospheric dynamics. Key findings highlight the dominance
  of geographic coordinates (17.5% feature importance) and turbulence indices like TI3 in prediction,
  emphasizing the role of regional topography and upper-tropospheric instability. The integration of aerodynamic
  features such as drag force and wing loading improved the detection of moderate-to-severe perceived
  turbulence intensity (POD improved from 0.845 to 0.866), providing additional value to traditional aircraft-independent
  methods. Seasonal analysis revealed winter months as peak periods for CAT incidents, correlating with
  jet stream activity. While results align with global studies, limitations include geographic scope and
  aircraft-type diversity. This research underscores the potential of machine learning for operational
  CAT forecasting, with recommendations for future work focusing on global data integration and real-time
  telemetry to address climate-driven turbulence trends.
