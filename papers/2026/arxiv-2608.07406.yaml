summary: Reviews explainable AI methods for geoscientific regression and tests them on a Lorenz-63 emulator,
  exposing failure modes of general-purpose XAI for continuous outputs.
abstract: As artificial intelligence (AI) systems transition from research prototypes to operational tools
  in Earth system science and forecasting, establishing trust in their predictions becomes increasingly
  important. Although model inputs and outputs are observable, the internal decision-making of modern
  AI models remains complex and hard to interpret, earning them the label ``black boxes.'' Explainable
  artificial intelligence (XAI) offers techniques to provide insight into these processes. However, most
  XAI methods were developed for classification tasks, raising questions about their suitability for the
  regression problems that dominate geoscientific applications. We review XAI approaches through this
  lens, organising them into a structured framework and examining both their theoretical foundations and
  practical behaviour. To ground this discussion, we apply a selection of methods to a machine learning
  emulator of the Lorenz 1963 system, an archetypal chaotic model that provides a tractable, physically
  meaningful setting for exposing the limitations and failure modes of general-purpose XAI in regression
  contexts. We then survey how these and related methods have been applied across a variety of Earth system
  sciences. We further situate XAI within the model development lifecycle, linking methodological choices
  to the needs of different stakeholder groups across operational Earth system science. We close by identifying
  gaps in existing methodologies and outlining a forward-looking research agenda, with practical recommendations
  for the responsible, effective use of XAI in regression applications of geoscientific modelling and
  forecasting.
