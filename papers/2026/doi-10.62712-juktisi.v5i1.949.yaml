summary: MiniBatchKMeans on GOES-19 imagery identifies five stable tropical cloud zones, with deep convective
  cover 4.1% in post-storm Caribbean versus 44% over Indonesia.
abstract: Perubahan iklim global telah meningkatkan frekuensi dan intensitas cuaca ekstrem di wilayah
  tropis, dengan Karibia mengalami intensifikasi siklon tropis dan Indonesia menghadapi peningkatan hujan
  ekstrem serta banjir. Meskipun kemajuan telah dicapai dalam pemanfaatan data satelit dan machine learning,
  masih terdapat kesenjangan penelitian yang mengintegrasikan big data satelit GOES-19 terbaru dengan
  karakterisasi pola awan tropis secara lintas wilayah, khususnya untuk adaptasi di Indonesia. Penelitian
  ini bertujuan mengidentifikasi pola awan tropis menggunakan analisis big data satelit GOES-19 di wilayah
  Karibia sebagai studi kasus serta mengeksplorasi implikasinya terhadap sistem deteksi dini cuaca ekstrem
  di Indonesia. Metode yang diterapkan adalah pendekatan kuantitatif berbasis big data dengan teknik unsupervised
  machine learning berupa algoritma MiniBatchKMeans. Data utama diperoleh dari produk ABI-L2-MCMIPF satelit
  NOAA GOES-19 melalui bucket AWS S3 untuk periode November 2024 pada koordinat 8°LU–30°LU dan 90°BB–60°BB,
  dengan ekstraksi lima channel ABI, praproses menggunakan xarray dan s3fs, normalisasi data, serta penentuan
  k=5 optimal melalui Elbow Method pada 2.308.961 piksel. Analisis komparatif dilakukan dengan data Himawari-9
  untuk wilayah Indonesia dan divalidasi menggunakan jalur badai IBTrACS. Hasil penelitian mengungkapkan
  lima zona awan tropis yang stabil secara spasial dan temporal, dengan zona Awan Konvektif Dalam hanya
  4,1% di Karibia pasca-badai namun mencapai 44% di Indonesia, serta perubahan distribusi yang konsisten
  selama fase aktif Hurricane Rafael, Sara, dan pasca-badai. Korelasi kuat ditemukan antara zona konvektif
  dengan jalur badai aktual, didukung Silhouette Score rata-rata 0,43–0,45. Studi ini berimplikasi pada
  pengembangan model prediksi cuaca berbasis satelit yang lebih adaptif dan akurat untuk Indonesia, sehingga
  dapat meningkatkan sistem peringatan dini BMKG terhadap bencana cuaca ekstrem di wilayah tropis.
