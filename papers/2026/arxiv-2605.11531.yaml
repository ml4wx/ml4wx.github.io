summary: A diffusion-based multivariate downscaler with bias correction over Japan cuts inter-variable
  correlation errors more than fourfold at 50x resolution, improving compound drought risk detection.
abstract: Physics-based climate projections using general circulation models are essential for assessing
  future risks, but their coarse resolution limits regional decision-making. Statistical downscaling can
  efficiently add detail, yet many methods treat variables independently, degrading inter-variable relationships
  that govern compound hazards such as heat stress, drought, and wildfire. Here we show that a diffusion-based
  multivariate generative framework, combined with bias correction, recovers degraded inter-variable correlations
  even under a 50$\times$ increase in linear resolution. When applied to five meteorological variables
  over Japan, the framework reduces inter-variable correlation errors by more than fourfold relative to
  existing baselines while improving both univariate and spatial accuracy, leading to more accurate detection
  of severe drought. These results demonstrate that multivariate generative downscaling improves the reliability
  of compound risk assessment under large resolution gaps.
