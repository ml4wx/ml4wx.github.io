summary: Random Forest and CA-ANN models link land-use change to Bhutan temperature and rainfall trends,
  projecting about 15% warming and 10% drying by 2028.
abstract: This study examines the spatiotemporal dynamics of land use and land cover (LULC) changes and
  their influence on local climate variability in Bhutan using an integrated geospatial and machine learning
  framework. LULC changes during the period 2004 to 2022 were analyzed to understand their relationship
  with localized climate responses. Despite increasing urbanization pressures, comprehensive assessments
  linking LULC dynamics with climate variability in Bhutan remain limited. Geographic Information System
  (GIS) techniques and Random Forest classification were used to map LULC changes, while non-parametric
  trend analyses (Mann–Kendall test and Sen’s slope estimator) were applied to evaluate trends in key
  meteorological variables, including temperature, precipitation, and humidity. Results indicate that
  rapid urban expansion and agricultural intensification are the dominant drivers of landscape transformation
  and are associated with significant climatic variations across the study area. To project future scenarios,
  Artificial Neural Network (ANN) and Cellular Automata–ANN (CAANN) models were used to simulate LULC
  and associated climate changes for the year 2028. Model projections suggest that continued urbanization
  and deforestation may lead to an approximate 15% increase in mean annual temperature and a 10% decline
  in annual precipitation. These changes may exacerbate water scarcity, intensify heatwave occurrences,
  and increase pressure on local agricultural systems and biodiversity. The findings highlight the strong
  linkage between anthropogenic land transformations and regional climate dynamics, emphasizing the need
  for integrated land-use planning and climate adaptation strategies. This study provides important baseline
  information to support evidence-based policymaking for sustainable land management and climate resilience
  in Bhutan.
