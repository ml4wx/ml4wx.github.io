summary: Compares five regressors for short-term Sri Lankan temperature prediction; histogram gradient
  boosting reaches test R² 0.96, with SHAP, ICE, PDP and ALE interpretation.
abstract: Accurate ambient temperature prediction is essential for climate monitoring, urban planning,
  and environmental management, particularly in regions experiencing rapid climatic variability such as
  Sri Lanka. This study investigates the application of explainable machine learning models for short-term
  ambient temperature prediction in Battaramulla, Sri Lanka. Five regression algorithms-K-Nearest Neighbors
  (KNN), Decision Tree (DT), Random Forest (RF), Support Vector Regression (SVR), and Histogram-based
  Gradient Boosting Regressor (HGBR) were evaluated using 14 meteorological and environmental predictors,
  including temporal variables, relative humidity, solar radiation, rainfall, wind speed, and air pollutant
  concentrations (CO2, NOₓ, CH4, O3, CO, PM2.5, and PM10). Among the models tested, HGBR demonstrated
  superior predictive performance, achieving R² values of 1.00 (training) and 0.96 (testing), with corresponding
  mean squared error values of 0.01 and 0.11. Model interpretability was examined using SHapley Additive
  exPlanations (SHAP), Partial Dependence Plots (PDP), Individual Conditional Expectation (ICE) analyses,
  and Accumulated Local Effects (ALE), which identified several features as the most influential predictors.
  Model validation using 192 real-time observations showed close agreement between predicted and measured
  temperatures, although the evaluation was limited to a single location and time period. A web-based
  application, ‘Therma’, was developed to facilitate practical deployment of the model for localized temperature
  estimation. Overall, this study demonstrates the utility of explainable machine learning for localized
  climate prediction while highlighting the need for broader spatiotemporal validation in future work.
