summary: Equation discovery yields three-ODE low-order models of coupled AMV, NAO and precipitation, with
  a 20-year oscillation and out-of-sample decadal skill, suggesting new precipitation-mediated feedbacks.
abstract: Abstract. The Atlantic Multidecadal Variability (AMV) and the North Atlantic Oscillation (NAO)
  are the dominant modes of oceanic and atmospheric variability in the North Atlantic, respectively, and
  are key sources of predictability from seasonal to decadal timescales. However, the physical processes
  and feedback mechanisms linking the AMV and NAO, and the role of diabatic processes in these feedbacks,
  remain debated. We present a data-driven dynamical modelling framework which captures coupled decadal
  variability in AMV, NAO, and North Atlantic precipitation. Applying equation discovery methods to observational
  data, we identify low-order models consisting of three coupled ordinary differential equations. These
  models reproduce observed decadal variability and show robust out-of-sample predictive skill on multi-annual
  to decadal lead times. The resulting model dynamics include a distinct quasi-periodic 20-year oscillation
  consistent with a damped oceanic mode of variability. Notably, precipitation-related terms feature prominently
  in the low-order models, suggesting an important role for latent heat release and freshwater fluxes
  in mediating ocean–atmosphere interactions. We propose new feedback mechanisms between North Atlantic
  sea surface temperature and the NAO, with precipitation acting as a dynamical bridge. Overall, these
  results illustrate how equation discovery can provide mechanistic hypotheses and new insight beyond
  conventional analyses of observations and climate model simulations.
