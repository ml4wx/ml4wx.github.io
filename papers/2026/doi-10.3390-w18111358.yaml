summary: VAR and Random Forest models forecast ENSO and PDO phases with a 3–4 month window, with 52.2%
  accuracy for three-month-lead phase classification.
abstract: Droughts are complex extreme phenomena that severely impact regional development and water availability.
  Although the influence of interannual and decadal macroclimatic patterns, such as the El Niño–Southern
  Oscillation (ENSO) and the Pacific Decadal Oscillation (PDO), on precipitation alteration is widely
  recognized, current water management systems lack multivariate predictive approaches to anticipate their
  phases with sufficient operational lead time. This study developed a predictive framework to project
  ENSO and PDO phases, establishing an optimal temporal window to forecast drought-triggering conditions.
  Using monthly historical records, teleconnections were evaluated through cross-correlation and Granger
  causality. Subsequently, Vector Autoregression (VAR) models and machine learning algorithms (Random
  Forest) were implemented to project anomalies and classify climatic phases. The Granger causality test
  demonstrated that ENSO variations statistically precede PDO phase shifts, establishing an optimal forecasting
  window of three to four months. The VAR model exhibited robust joint explanatory capacity for a continuous
  four-month projection, while the Random Forest algorithm achieved a predictive accuracy of 52.2% specifically
  for categorical phase classification at a three-month lead time. It is concluded that this lagged interaction
  allows for reliable mathematical anticipation, providing an essential analytical framework for exploring
  regional hydrological dynamics and supporting local preventive water management.
