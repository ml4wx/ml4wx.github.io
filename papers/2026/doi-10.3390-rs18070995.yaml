summary: Compares ANN, Cubist, Random Forest and SVM for downscaling TRMM precipitation from 25 km to
  1 km over the Qaidam Basin, with Cubist performing best.
abstract: High-spatiotemporal-resolution precipitation data are essential for studies on regional hydrology,
  meteorology, and ecological conservation. Because the Qaidam Basin is a data-scarce region with a few
  ground stations and coarse-resolution remote sensing products, its utility in regional research is constrained.
  Therefore, high-resolution precipitation data are urgently needed. Here, longitude, latitude, the normalized
  difference vegetation index (NDVI), the digital elevation model (DEM), daytime and nighttime land surface
  temperature, slope, and aspect were selected as environmental variables. Four machine learning methods,
  Artificial Neural Network (ANN), Cubist, Random Forest (RF), and Support Vector Machine (SVM), were
  used to downscale Tropical Rainfall Measuring Mission (TRMM) precipitation data from 25 to 1 km in the
  Qaidam Basin and validated using ground observation stations. For annual downscaling, the accuracy ranked
  as Cubist > ANN > RF > SVM, and residual correction further improved performance. The Cubist model produced
  the best results, generating finer spatial patterns and reducing outliers in both annual and monthly
  products. Longitude, latitude, the DEM, and the NDVI were important contributors to the Cubist model.
  The resulting high-resolution dataset provides valuable support for hydrological and climate change
  research in the Qaidam Basin.
