summary: Sparse autoencoder analysis of GraphCast shows how tropical cyclone position, intensity and pressure
  structure are encoded across layers, with reproducible feature organisation.
abstract: Artificial intelligence (AI) weather models now forecast weather events skillfully, but how
  they represent these events internally remains unknown. Sparse autoencoders (SAEs) provide sparse features
  for probing hidden states, but how information about multiple physical attributes of an event is organized
  across them remains unclear. Using tropical cyclones in GraphCast as a test case, we analyze 2,115 six-hourly
  timesteps from 205 cyclones, relating SAE activations to position, intensity, and pressure structure
  across five Layer-8 decompositions and 16 processor layers. Each attribute relates to multiple features;
  position and pressure-structure relations overlap in a smaller subset. This organization recurs across
  independent SAEs and layers without feature alignment. In deeper layers, the leading position feature
  aligns better with position and pressure structure six hours ahead than at present. These results suggest
  that the organization of physical-attribute relations provides a reproducible level of description for
  interpreting cyclone-related information in GraphCast.
