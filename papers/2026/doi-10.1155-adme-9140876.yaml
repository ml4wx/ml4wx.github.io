summary: BP neural network retrieves temperature and humidity profiles from ground-based microwave radiometer
  brightness temperatures, with SVR bias correction improving retrieval accuracy.
abstract: The retrieval method plays a crucial role in deriving high‐quality temperature and humidity
  profiles for the ground‐based microwave radiometer (MWR). In this paper, we propose a new approach for
  temperature and humidity profile retrieval from the ground‐based MWR. First, a radiosonde dataset is
  established and the simulated brightness temperatures incorporated into the training dataset are calculated
  using a monochromatic radiative transfer model based on the constructed radiosonde dataset. Subsequently,
  the backpropagation neural network (BPNN) algorithm is adopted as the inversion tool for atmospheric
  temperature and humidity profiles. Meanwhile, the support vector regression (SVR) algorithm is proposed
  to develop bias correction models for the observed brightness temperatures, aiming further to improve
  retrieval performance in practical inversion scenarios. Extensive experimental results demonstrate the
  effectiveness of the proposed approach for retrieving temperature and humidity profiles.
