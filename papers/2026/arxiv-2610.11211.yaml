summary: Spatiotemporal hourly precipitation model on ERA5 with geographic embeddings, event-aware loss
  and water-budget regularization that improves heavy-precipitation event detection.
abstract: 'Hourly precipitation forecasting involves several distinct statistical challenges, including
  spatially varying predictor-precipitation relationships, a strongly imbalanced precipitation distribution,
  and progressive degradation of precipitation event skill with increasing lead time. We develop a spatiotemporal
  forecasting framework that addresses these challenges through three complementary components: explicit
  geographic representation, event-aware learning for imbalanced precipitation, and weak asymmetric regularization
  derived from the atmospheric water budget. The physical information is treated as an asymmetric constraint
  rather than as an additional prediction target, designed to discourage physically unsupported precipitation
  attenuation without replacing the data-driven forecast. Experiments using ERA5 data across regional,
  enlarged domain, and spatial subset settings show that explicit geographic information improves spatial
  field prediction, while event-aware learning provides the most consistent gains in detecting moderate
  and heavy precipitation events. Physical regularization has a more selective effect, mainly reducing
  systematic underprediction over the enlarged domain while improving longer lead precipitation event
  prediction in the spatial subset experiment. These results indicate that the benefit of physical guidance
  depends on the available data regime and becomes most apparent when data-driven precipitation information
  deteriorates with increasing lead time.'
