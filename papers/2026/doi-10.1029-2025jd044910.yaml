summary: SFNO-HENS and NeuralGCM hindcasts match ECMWF at week 3+ for North Pacific circulation and MJO,
  with realistic MJO propagation and teleconnections.
abstract: Abstract In recent years, machine‐learning (ML) models trained on reanalysis data have rivaled
  physics‐based forecast models in terms of performance skill for global weather forecasting. With increased
  rollout stability, the question of how these models perform for subseasonal to seasonal (S2S, week 3–8)
  forecasting has emerged. In this study we run a large set of subseasonal hindcasts over 2004–2023 to
  evaluate two ML weather forecast models at the S2S time scale, SFNO‐HENS (Nvidia, fully ML) and NeuralGCM
  (Google Research, hybrid). Corresponding hindcasts from the European Centre for Medium‐Range Weather
  Forecasts (ECMWF) are used as a baseline for comparison to a physics‐based model. Because our focus
  is on predicting moisture transport over the Western United States between October and March, we evaluate
  the models' prediction skill for the Madden‐Julian Oscillation (MJO) and its associated teleconnections
  in the North Pacific. We find that both ML models are competitive with the ECWMF model, with comparable
  skill in predicting the North Pacific large‐scale circulation and the MJO at week 3 and beyond. Even
  though overall the mid‐latitude subseasonal prediction skill remains low, the ML models exhibit interesting
  behavior such as a realistic propagation of the MJO across the Maritime Continent and realistic teleconnections.
  A SFNO‐HENS sensitivity experiment with altered initial conditions in the tropics demonstrates the stability
  of the model, and it illustrates the capability of ML models to represent important physical processes
  of the atmosphere at the S2S time scale.
