summary: U-Net fuses annual temperature cycle, coarse model LST and AlphaEarth embeddings to fill cloud
  gaps in Landsat LST, reaching 0.78 K MAE.
abstract: Land surface temperature (LST) data at Landsat's 30 m resolution is important for many applications,
  but cloud contamination prevents its spatially continuous observations. Here, we propose A$^2$E$^2$,
  an end-to-end U-Net that integrates annual temperature cycle (ATC), coarse LST from Earth system modeling,
  and AlphaEarth embeddings for Landsat LST reconstruction. The ATC supplies a physics-guided thermal
  prior, the coarse LST provides a temporal background, and the U-Net converts the embedding field into
  day-specific fine-scale correction using observed pixels. Experimental results on four seasonally distributed
  Landsat 8/9 scenes over New York City in 2022 show that A$^2$E$^2$ achieves 0.78 K mean absolute error
  and 1.01 K root mean squared error, reducing error by 60.1% relative to baseline method without spatial
  correction and by 3.7% relative to the same U-Net guided by annual mean spectral reflectance. Sensitivity
  analysis shows stable performance regardless of distance to clear pixels and percentage of blocked pixels.
  Independent validation with ECOSTRESS LST shows that Earth foundation model embeddings have better performance
  than annual mean spectral bands for LST reconstruction.
