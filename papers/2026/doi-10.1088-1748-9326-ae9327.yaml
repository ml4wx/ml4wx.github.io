summary: Economic-value framework with compounding-loss penalties shows whether ECMWF's physics model
  or AIFS is better for European cities depends on cost-loss assumptions.
abstract: Abstract Assessing the real-world economic value (EV) of weather forecasts remains challenging,
  particularly in the context of high-impact extreme events. Meteorological forecast skill has improved
  substantially in recent years, driven by steady advances in physics-based models and breakthroughs in
  AI-based forecasting. However, operational evaluations typically provide limited consideration to how
  these improvements in meteorological skill translate into EV. The economic evaluation frameworks that
  do exist are ill-suited to extreme weather event, which often do not occur in isolation. In this study,
  we present a flexible framework to assess the EV of weather forecasts, with penalty functions that explicitly
  account for compounding losses from multiple extreme events, as well as declining user trust in case
  of repeated false alarms. In addition, the framework allows for varying cost-loss ratios to represent
  heterogeneous prevention costs and vulnerability structures. We apply the framework to cities exposed
  to extreme weather hazards, and directly compare the relative EV of leading physics-based and data-driven
  forecasting systems from the European Centre for Medium-Range Weather Forecasts. The value of forecasts
  is highly sensitive to assumptions about compounding losses, penalty structures, and prevention costs-often
  substantially altering conclusions drawn from meteorological skill alone. For instance, in some cities
  in Southern Europe, the higher sensitivity of the physics-based model IFS HRES makes it better-suited
  when protection costs are small relative to potential losses, while the higher specificity of the data-driven
  AIFS makes it better when protection costs are higher. These findings underscore the importance of evaluating
  EV under realistic risk scenarios to ensure that improvements in predictive accuracy translate into
  meaningful societal and economic benefits.
