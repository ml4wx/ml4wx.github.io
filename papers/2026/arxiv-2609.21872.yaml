summary: Chronosphere, an adaptive spatio-temporal neural field on the sphere-times-circle, beats location
  encoders at reconstructing climatology, with largest gains under transfer.
abstract: We introduce Chronosphere, a spatio-temporal neural field that learns representations of climate.
  A central challenge in geographic representation learning is modeling environmental processes whose
  spatial and temporal complexity varies widely. Yet existing location encoders typically fix a single
  level of detail everywhere. Global bases such as spherical harmonics spread capacity uniformly across
  space and time. Localized bases resolve only predefined regions. Learned tessellations adapt, but are
  inefficient at representing higher frequencies. Chronosphere unifies these approaches, pairing an adaptive
  tessellation of learnable sites on the spacetime torus $S^2\times S^1$ with a shared bank of local basis
  functions. Both where capacity is placed and how much detail each region carries adapt to the data,
  across space and time. Trained to reconstruct climatology, Chronosphere matches or leads state-of-the-art
  location encoders across spatial and temporal tasks, with the largest gains under spatial and temporal
  transfer.
