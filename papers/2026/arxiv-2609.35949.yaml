summary: Neural network emulating UTCI cuts polynomial approximation RMSE from 2.78 to 0.36 °C and halves
  thermal-stress misclassification, improving heat-stress metrics during extremes.
abstract: Extreme temperatures are the leading cause of climate-related mortality world-wide. Climate-health
  research and operational weather forecasting require accurate estimates of human thermal stress. The
  Universal Thermal Climate Index (UTCI) is among the most sophisticated and widely used feels-like temperature
  metrics. However, its ubiquitous polynomial approximation does not generalize well to extreme weather
  conditions. Here, we introduce Neural-UTCI, a neural network that calculates UTCI with substantially
  higher accuracy across global conditions at a lower computational cost for operational use. Neural-UTCI
  reduces the polynomial approximation RMSE from 2.78°C to 0.36 °C, an 87% improvement, and lowers thermal
  stress misclassification rates from 5.3% to 1.7%, with consistent performance across resampling experiments.
  These differences affect thermal exposure metrics. For example, during the 2003 European heatwave summer
  in Rome, Italy, the number of very strong heat stress days increases from 15 to 35 days when using Neural-UTCI
  compared to operational products like ERA5-HEAT. Simultaneously, Neural-UTCI reliably classifies extreme
  cold stress conditions, allowing continuous global application. By improving UTCI accuracy, Neural-UTCI
  can strengthen climate-health risk assessments and public weather warning systems, especially as global
  warming increases the incidence of extreme events.
