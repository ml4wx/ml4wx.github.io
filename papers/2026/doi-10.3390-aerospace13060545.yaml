summary: Couples RainNet radar nowcasting with a two-stage genetic algorithm to reroute aircraft around
  thunderstorms, cutting path length 14.79% versus sampling-based methods.
abstract: Adverse weather conditions, particularly thunderstorms, are the primary cause of flight delays
  and safety threats, accounting for approximately 58.7% of irregular flights in 2025. Traditional static
  rerouting methods often fail to adapt to the non-linear evolution of convective weather. This paper
  proposes a high-fidelity dynamic rerouting framework to enhance flight safety and efficiency. In the
  perception layer, a RainNet deep learning model is employed for short-term recursive nowcasting of radar
  reflectivity, which is subsequently transformed into Dynamic Avoidance Zones (DAZ) via clustering and
  convex hull algorithms. In the decision layer, a two-stage improved Genetic Algorithm (GA) is developed
  to solve the rerouting path. The first stage generates initial collaborative solutions under a receding-horizon
  framework, while the second stage applies a “path-straightening” module to reduce cumulative turning
  angles and curvature fluctuations. The comparative results in actual scenarios demonstrate a distinct
  dual-advantage over baseline methodologies. Compared to sampling-based strategies, the proposed model
  reduces the path length by 14.79%. Furthermore, when compared to heuristic algorithms, it actively trades
  a negligible 1% distance margin to achieve a massive 92.7% reduction in the cumulative turning angle.
  With a maximum single turn of only 32.51°, the trajectory completely eliminates sawtooth jitter and
  redundant detours. Ultimately, this research provides essential technical support for improving air
  traffic management efficiency and reducing controller workload during severe weather events.
