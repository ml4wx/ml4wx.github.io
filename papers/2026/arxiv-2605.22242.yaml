summary: Lorenz 96 study compares learned stochastic parameterizations and ensemble designs, showing persistent
  stochastic terms improve early spread growth and spread-error consistency.
abstract: Weather and climate forecasts are inherently uncertain due to chaotic dynamics, imperfect initial
  conditions, and incomplete representation of the underlying physical processes. Operational ensemble
  forecasts aim to represent these uncertainties through forecast spread, yet many approaches yield underdispersive
  estimates, with spread that grows too slowly relative to forecast error. Using the two-scale Lorenz
  1996 system as a widely used, controlled testbed, we design a systematic approach to disentangle intrinsic
  variability, initial-condition perturbations, and stochastic model uncertainty. We compare multiple
  ensemble configurations and parameterization strategies, including existing deterministic and autoregressive
  as well as novel Bayesian and flow-based approaches. Our results show that ensemble perturbations do
  not increase the system's long-term variance; rather, they regulate how rapidly trajectories decorrelate
  and explore the invariant measure. Stochastic parameterizations, particularly those with temporally
  persistent structure, enhance early spread growth and improve spread-error consistency. Overall, we
  bring clarity to how different sources of uncertainty interact in a chaotic system and provide guidance
  for the design and evaluation of stochastic parameterizations in weather and climate models.
