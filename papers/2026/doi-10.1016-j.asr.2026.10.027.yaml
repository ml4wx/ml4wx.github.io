summary: Random Forest, XGBoost and GBM project landslide susceptibility in northern Pakistan under CMIP6
  scenarios, with a 35.5% high-susceptibility increase under SSP585.
abstract: 'Landslides pose a significant and escalating threat to environmental stability, infrastructure,
  and communities in mountainous regions worldwide, and their occurrence is expected to be influenced
  by ongoing climate change. This study develops and applies an integrated, climate-informed multi-model
  machine-learning framework to project future changes in landslide susceptibility under contrasting climate
  scenarios. The framework integrates three machine-learningalgorithms, Random Forest, XGBoost, and Gradient
  Boosting Machine, with WorldClim CMIP6 bias-corrected, delta-downscaled total precipitation projections
  at 30-arc-second (approximately 1 km) resolution.. Applied to the highly vulnerable N-15 Highway corridor
  in northern Pakistan, the models were trained using a historical inventory of 335 mapped landslides
  and 21 geo-environmental factors. Random Forest achieved the highest performance (AUC: 0.994), while
  SHapley Additive exPlanations (SHAP) analysis identifying distance to fault, distance to stream, and
  precipitation among the strongest predictive contributors. Future projections under contrasting SSP126
  (low emissions) and SSP585 (high emissions) scenarios reveal a stark divergence in environmental outcomes.
  While the sustainable SSP126 pathway results in only a minor expansion of high-susceptibility zones
  by 2100, the high-emission SSP585 scenario forecasts a drastic 35.5% increase, with pronounced intensification
  in the Babusar and Balakot regions. This escalation is associated with enhanced precipitation forcing:
  under SSP585 during 2081–2100, the ten-GCM ensemble projects spatial-mean increases of 17.1% in annual
  precipitation, 20.2% in the wettest month precipitation, 19.9% in the wettest season precipitation,
  and 13.4% in the coldest season precipitation. By integrating multi-model machine learning with high-resolution
  climate scenarios, this study quantifies the sensitivity of geohazards to anthropogenic emissions and
  provides a scalable framework for proactive risk assessment, land-use zoning, and climate-resilient
  management in vulnerable mountain regions.'
