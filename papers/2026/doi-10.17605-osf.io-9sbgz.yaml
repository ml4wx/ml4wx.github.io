abstract: 'This registration contains the protocol for a systematic review of machine learning and deep
  learning in weather forecasting. Full details including review objectives, search strategy, inclusion/exclusion
  criteria, data extraction methods, quality assessment approach, and synthesis plan are provided in the
  attached protocol document (Gemeda_Protocol_2026.pdf). Supplementary files include: PRISMA 2020 checklist,
  search strategies by database, data extraction form (blank template), and quality assessment rubric
  with scores for all 99 included studies.'
