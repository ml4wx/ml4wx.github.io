summary: Applies reservoir computing on NMF-reduced spatiotemporal data to anticipate tipping times, with
  a demonstration on CMIP5 climate projections at lower computational cost.
abstract: In nonlinear dynamical systems, tipping refers to a critical transition from one steady state
  to another, typically catastrophic, steady state, often resulting from a saddle-node bifurcation. Recently,
  the machine-learning framework of parameter-adaptable reservoir computing has been applied to predict
  tipping in systems described by low-dimensional stochastic differential equations. However, anticipating
  tipping in complex spatiotemporal dynamical systems remains a significant open problem. The ability
  to forecast not only the occurrence but also the precise timing of such tipping events is crucial for
  providing the actionable lead time necessary for timely mitigation. By utilizing the mathematical approach
  of non-negative matrix factorization to generate dimensionally reduced spatiotemporal data as input,
  we exploit parameter-adaptable reservoir computing to accurately anticipate tipping. We demonstrate
  that the tipping time can be identified within a narrow prediction window across a variety of spatiotemporal
  dynamical systems, as well as in CMIP5 (Coupled Model Intercomparison Project 5) climate projections.
  Furthermore, we show that this reservoir-computing framework, utilizing reduced input data, is robust
  against common forecasting challenges and significantly alleviates the computational overhead associated
  with processing full spatiotemporal data.
