summary: Distils the MAUNet U-Net into a lightweight MAUNet-Light via teacher-student learning, enabling
  precipitation bias correction and downscaling at reduced compute cost.
abstract: Satellite-derived data products and climate model simulations of geophysical variables like
  precipitation, often exhibit systematic biases compared to in-situ measurements. Bias correction and
  spatial downscaling are fundamental components to develop operational weather forecast systems, as they
  seek to improve the consistency between coarse-resolution climate model simulations or satellite-based
  estimates and ground-based observations. In recent years, deep learning-based models have been increasingly
  replaced traditional statistical methods to generate high-resolution, bias free projections of climate
  variables. For example, Max-Average U-Net (MAUNet) architecture has been demonstrated for its ability
  to downscale precipitation estimates. The versatility and adaptability of these neural models make them
  highly effective across a range of applications, though this often come at the cost of high computational
  and memory requirements. The aim of this research is to develop light-weight neural network architectures
  for both bias correction and downscaling of precipitation, for which the teacher-student based learning
  paradigm is explored. This research demonstrates the adaptability of MAUNet to the task of bias correction,
  and further introduces a compact, lightweight neural network architecture termed MAUNet-Light.The proposed
  MAUNet-Light model is developed by transferring knowledge from the trained MAUNet, and it is designed
  to perform both downscaling and bias correction with reduced computational requirements without any
  significant loss in accuracy compared to state-of-the-art.
