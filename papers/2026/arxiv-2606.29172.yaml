summary: CORDEX-ML-Bench standardises ML downscaling of daily temperature and precipitation to 10 km over
  three regions, comparing 40 configurations and finding generative models better for precipitation extremes.
abstract: Machine learning (ML) has emerged as a cost-effective approach to complement dynamical downscaling
  for producing high-resolution regional climate projections. However, the absence of standardised training
  and evaluation protocols, applied consistently across multiple domains, continues to hinder meaningful
  model intercomparison. We introduce CORDEX-ML-Bench, a benchmark aligned with CORDEX, which constitutes
  the first phase of a community initiative to advance data-driven downscaling toward operational readiness,
  and complement future dynamical downscaling efforts under CMIP7. The framework targets downscaled daily
  maximum temperature and precipitation to ~10 km resolution (20x increase) across three pilot regions;
  European Alps, New Zealand, and Southern Africa. Using a perfect-model experimental design, we evaluate
  40 ML configurations developed independently, spanning traditional ML, convolutional U-Nets, vision
  transformers, graph neural networks, and generative models based on diffusion, flow matching, and generative
  adversarial networks. Models are trained under two experimental periods, an empirical-statistical downscaling
  pseudo-reality (historical period only) and Emulator (historical and future periods) -and are evaluated
  against a core set of metrics developed specifically for assessing downscaling skill. Generative models
  consistently outperform deterministic approaches for precipitation, better capturing fine-scale variability
  and extremes. For temperature, the generative advantage narrows and deterministic architectures remain
  competitive. Models trained solely on the historical period systematically underestimate future climate-change
  signals while those additionally trained on a future period perform better. These findings raise concerns
  about historically trained models widely used in an operational setting, underscoring the need for rigorous
  extrapolation testing.
