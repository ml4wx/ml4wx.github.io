summary: Estimates UTCI heat stress from a reduced set of variables in data-driven forecasts using evolutionary
  feature selection and LightGBM, skilful up to three days ahead.
abstract: 'Abstract Heat stress is a growing concern for public human health systems, underscoring the
  need for reliable thermal stress forecasting tools. This study introduces a novel approach to estimating
  the Universal Thermal Climate Index (UTCI) for southern South America using a reduced subset of variables
  from data-driven weather forecast models. These data-driven models offer rapid, accurate, and publicly
  accessible forecasts of meteorological variables. However, they do not provide all the variables required
  to calculate the UTCI. To address this limitation, this study provides a method to estimate heat stress
  in southern South America using advanced feature selection techniques and regression/classification
  models. We apply a wrapper evolutionary approach based on the Probabilistic Coral-Reef Optimization
  with Substrate Layers algorithm (PCRO-SL), previously tested in complex optimization problems, to identify
  key meteorological variables at both individual grid points and within homogeneous UTCI regions defined
  through K-means clustering. Various regression and classification models are then constructed and evaluated
  against reanalysis ground-truth UTCI data. The combination of PCRO-SL and Light Gradient Boosting Machine
  emerges as the most effective approach. The method is successfully implemented to estimate UTCI during
  three heat waves using forecasts from data-driven models. The results demonstrate a good predictive
  skill for forecasts up to three days in advance, outperforming a traditional numerical weather prediction
  model. This research represents a significant advance towards the development of a thermal stress early
  warning system for the region, potentially enhancing public health interventions through timely preventive
  measures against extreme thermal conditions. Graphical Abstract In this study, we present an alternative
  approach to estimate the Universal Climate Thermal Index (UTCI), a key indicator of heat stress, using
  a refined subset of meteorological variables available across multiple datasets, including emerging
  data-driven weather models. Using southern South America as a pilot region, our methodology expands
  the applicability of UTCI estimation and establishes a foundation for an early-warning system for heat
  stress. The method integrates advanced feature selection techniques to identify an optimal set of inputs
  for non-linear regression models. We further assess the ability of state-of-the-art data-driven forecasting
  systems to estimate both meteorological inputs and the UTCI during heat wave events. These models, powered
  by machine learning and data science, remain underexplored in the South American context. Our findings
  show that their performance is competitive with traditional physics-based forecasting systems in predicting
  meteorological variables and thermal stress. Beyond its scientific contribution, this research addresses
  an urgent societal challenge: the escalating risk of heat stress driven by climate change, with direct
  implications for human health and well-being. The work is inherently interdisciplinary, bridging meteorology,
  climate science, environmental epidemiology, and machine learning to advance innovative forecasting
  tools.'
