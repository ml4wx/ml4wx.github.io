summary: FusionCast fuses GNSS-derived precipitable water vapour with radar QPE and a forecasted radar
  prior via gated fusion to improve precipitation nowcasting.
abstract: 'Deep learning has significantly improved the accuracy of precipitation nowcasting. However,
  most existing multimodal models typically use simple channel concatenation or interpolation methods
  for data fusion, which often overlook the feature differences between different modalities. This paper
  therefore proposes a novel precipitation nowcasting optimisation framework called FusionCast. This framework
  incorporates three types of data: historical precipitable water vapour (PWV) data derived from global
  navigation satellite system (GNSS) inversions, historical radar based quantitative precipitation estimation
  (QPE), and forecasted radar QPE serving as a future prior. The FusionCast model comprises two core modules:
  the future prior radar QPE processing Module, which forecasts future radar data; and the Radar PWV Fusion
  (RPF) module, which uses a gate mechanism to efficiently combine features from various sources. Experimental
  results show that FusionCast significantly improves nowcasting performance.'
