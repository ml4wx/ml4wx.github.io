summary: Gradient guidance of diffusion sampling reduces extreme precipitation in WeatherBench2 forecasts
  while staying more physically plausible than adversarial perturbations.
abstract: 'Extreme precipitation causes severe societal and economic damage, and weather control has long
  been discussed as a potential mitigation strategy. However, to the best of our knowledge, perturbation-based
  interventions for weather control using data-driven weather forecasting models have not yet been explored.
  While adversarial attacks also generate perturbations that alter forecasts, they aim to exploit model
  artifacts and do not account for physical plausibility. In this paper, we propose a gradient-based guidance
  framework for precipitation-reduction interventions through diffusion sampling in diffusion-based weather
  forecasting models. Instead of directly perturbing atmospheric states, our method steers the diffusion
  sampling trajectory, enabling precipitation reduction while maintaining consistency with the atmospheric
  distribution. To assess physical plausibility, we evaluate from three perspectives: (i) vertical and
  variable-wise perturbation profiles, (ii) latent-space trajectory deviation, and (iii) cross-model transferability.
  Experiments on extreme precipitation events from WeatherBench2 demonstrate that our method achieves
  effective precipitation reduction while yielding more physically plausible interventions than adversarial
  perturbations.'
