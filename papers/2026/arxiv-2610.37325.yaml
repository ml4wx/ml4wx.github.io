summary: A dual-tree complex wavelet loss for kilometre-scale MLWP preserves multiscale structure and
  sharpens precipitation fields over the UK while keeping pointwise accuracy similar to MSE training.
abstract: Preserving fine-scale structure without degrading spatial accuracy is a central challenge for
  kilometre-scale machine-learning weather prediction (MLWP). We introduce a loss based on the dual-tree
  complex wavelet transform that constrains atmospheric fields jointly by scale, location, and orientation.
  We evaluate its performance using an experimental joint global--regional FastNet configuration, which
  produces \SI{1.5}{km} forecasts over the UK alongside $\sim$\SI{31}{km} global forecasts. Relative to
  both mean-squared error (MSE) and an FFT-based spectral objective, the wavelet loss substantially improves
  spectral fidelity. Compared with MSE training, it maintains similar pointwise performance, improves
  neighbourhood-based verification, and produces sharper precipitation fields with more realistic intensity
  distributions. These results demonstrate that spatially localised wavelet constraints can preserve multiscale
  atmospheric structure while largely avoiding the loss of pointwise accuracy associated with globally
  supported spectral objectives.
