summary: CASCADE reframes radar super-resolution as flow-conditioned semi-Lagrangian advection, improving
  PSNR, CSI and HSS for 4x severe convective storm reconstruction on SEVIR.
abstract: 'Super-resolution of geophysical fields presents unique challenges beyond natural image enhancement:
  fine-scale structures must respect physical dynamics, conserve mass and energy, and evolve coherently
  in time. These constraints are especially critical for extreme events, where rare, localized, high-intensity
  features drive impacts and where temporally inconsistent "hallucinated" detail can misrepresent hazards.
  We introduce CASCADE (Cross-scale Advective Super-resolution with Climate Assimilation and Downscaling
  Evolution), a framework that reframes spatiotemporal super-resolution as an explicit transport process
  across scales. Rather than hallucinating high-frequency content per pixel, CASCADE reconstructs fine
  structure by iteratively advecting coarse information along learned, flow-conditioned velocity fields
  through semi-Lagrangian warping. The architecture decomposes motion into resolved (large-scale) and
  subgrid (unresolved) components, mirroring the closure problem in numerical weather prediction, and
  enforces low-resolution consistency through an assimilation-style innovation step. Evaluated on SEVIR
  radar data for 4x super-resolution of severe convective storms, CASCADE outperforms strong baselines
  across both continuous metrics (PSNR, SSIM, MAE) and threshold-based skill scores (CSI, HSS, POD) while
  providing interpretable diagnostics through visualizable velocity and correction fields. By encoding
  advection as the fundamental operator rather than learning it implicitly, CASCADE produces temporally
  coherent, physically consistent, and mass-conserving reconstructions well suited to advection-dominated
  extremes in atmospheric and oceanic applications.'
