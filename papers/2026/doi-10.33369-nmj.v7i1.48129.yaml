summary: Uses an ANN with CHIRPS satellite rainfall and ENSO/IOD indices to forecast monthly Lampung rainfall
  up to 12 months ahead; the CHIRPS–DMI model had RMSE 55.49 mm.
abstract: Informasi curah hujan yang akurat dan andal sangat penting untuk mendukung perencanaan pertanian,
  pengelolaan sumber daya air, serta mitigasi bencana hidrometeorologi. Provinsi Lampung merupakan wilayah
  dengan tingkat kerentanan tinggi terhadap variabilitas iklim yang dipengaruhi oleh fenomena iklim global
  seperti El Niño–Southern Oscillation (ENSO) dan Indian Ocean Dipole (IOD). Penelitian ini bertujuan
  mengembangkan model prediksi curah hujan bulanan jangka menengah di Provinsi Lampung menggunakan Artificial
  Neural Network (ANN) berbasis data satelit CHIRPS dan indeks iklim global. Data yang digunakan meliputi
  curah hujan observasi dari 19 pos hujan, CHIRPS, Oceanic Niño Index (ONI), dan Dipole Mode Index (DMI)
  selama periode 1991–2020. Tiga konfigurasi model ANN diuji, yaitu kombinasi CHIRPS–DMI, CHIRPS–ONI,
  serta CHIRPS–DMI–ONI. Hasil evaluasi menunjukkan bahwa data CHIRPS memiliki korelasi kuat terhadap curah
  hujan observasi dengan nilai rata-rata 0,659 (p < 0,001). Analisis korelasi menunjukkan bahwa IOD memiliki
  pengaruh lebih dominan terhadap curah hujan Lampung dibandingkan ENSO. Model ANN terbaik diperoleh pada
  konfigurasi CHIRPS–DMI dengan nilai RMSE terendah sebesar 55,49 mm dan koefisien korelasi tertinggi
  sebesar 0,671. Model ini menunjukkan performa prediksi yang stabil hingga 12 bulan ke depan. Hasil penelitian
  ini menunjukkan potensi integrasi data satelit dan indeks iklim global dalam mendukung sistem prediksi
  curah hujan dan mitigasi risiko iklim di wilayah tropis.
