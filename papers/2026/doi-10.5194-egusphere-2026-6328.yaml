summary: FASTMIP-CMIP7 provides a coordinated ensemble of seven emulators projecting CMIP7 scenarios,
  showing 2100 land warming of 2.3 to 3.9 °C and emissions as the main uncertainty.
abstract: Earth System Models (ESMs) remain the gold standard for translating socioeconomic scenarios
  into spatially resolved climate projections, but their computational cost limits the number of scenarios
  and ensemble members that can be simulated and ties projections to the evidence available when simulations
  are performed. Climate emulators, which are statistical and machine-learning models trained on ESM output,
  enable large ensembles and allow projections to be updated as new observations emerge. Here, we present
  FASTMIP-CMIP7, a coordinated ensemble of seven emulators providing spatially and temporally resolved
  projections of temperature, precipitation and climate impact indicators for four newly released scenarios
  from the 7th phase of the Coupled Model Intercomparison Project (CMIP7), spanning very low (VL) to high
  (H) emissions. Despite scenario ranges having narrowed in CMIP7 comapred to CMIP6, emissions pathways
  remain the dominant source of uncertainty in regional end-of-century temperature projections, making
  mitigation the strongest lever for limiting future warming. In 2100, global land temperature reaches
  2.3 °C under stringent mitigation (VL), and 3.9 °C under the current-policies scenario (M), approximately
  1.4 times the global mean warming. Under M, even the coolest 5 % of years in 2100 are warmer over land
  than 95 % of present-day years. Precipitation projections are more heterogeneous, with internal variability
  and regional climate responses often obscuring scenario differences. Nevertheless, robust drying emerges
  in northern South America and the Mediterranean, where additional drying relative to today is 2.5 to
  almost four times greater under current policies (M) than under stringent mitigation (VL). Structural
  differences between emulators and choices in training, testing and validation introduce a new layer
  of uncertainty to emulated ensembles. Common, streamlined validation experiments are needed to establish
  confidence in emulated projections and support the broader integration of climate emulators into future
  climate assessments.
