summary: Model trained only on 40 years of gridded observations, with no NWP data, is competitive with
  ECMWF IFS on several upper-air and surface medium-range scores for 2021–2022.
abstract: We introduce the Artificial Intelligence Forecasting System for Direct Observation Prediction
  (AIFS-DOP). AIFS-DOP is trained on a 40-year harmonized dataset of gridded observations, without using
  numerical weather prediction (NWP) reanalysis or model data. The resulting model is competitive with
  ECMWF's Integrated Forecasting System (IFS) when scored on a one year period of forecasts across 2021/2022.
  This progress on Direct Observation Prediction represents the first time that a data-driven model, trained
  solely on observations, is competitive with the IFS at medium ranges for several key upper-air and surface
  headline scores, when verified against observation data.
