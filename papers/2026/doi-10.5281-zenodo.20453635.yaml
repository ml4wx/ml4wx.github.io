summary: Proposes a reduced-order framework combining simplified atmospheric equations with ML for lightweight
  weather prediction; no quantitative results are reported.
abstract: Weather forecasting remains one of the most computationally demanding problems in Earth system
  science. Operational forecasting centers rely on numerical weather prediction (NWP) models that solve
  large systems of nonlinear partial differential equations across three-dimensional atmospheric grids.
  While highly accurate, these approaches require substantial computational resources and are often inaccessible
  for educational, research, and lightweight forecasting applications. This paper proposes a Hybrid Physics-Informed
  and Data-Driven Framework for Reduced-Order Weather Prediction (HPIRWPM). The framework combines simplified
  atmospheric governing equations with machine learning forecasting techniques. The proposed model integrates
  temperature, pressure, humidity, wind velocity, rainfall, cloud cover, solar radiation, latitude, and
  altitude within a unified state-space representation. The model is designed to preserve physical interpretability
  while remaining computationally efficient. Potential pathways for calibration, validation, and future
  development are discussed.
