summary: Proposes a CNN, Bi-LSTM and attention fusion model for MODIS, Sentinel-2 and ERA5 data, reporting
  96.3% accuracy; claims are generic and lack validation detail.
abstract: 'It is essential to predict climate change in real-time and with high accuracy to minimize environmental
  risks and facilitate decision-making towards sustainability. Nevertheless, current models used to predict
  climate changes struggle to process heterogeneous spatio-temporal satellite data in order to ensure
  high prediction accuracy and low latency needed for real-time environmental monitoring. In this study,
  the new Deep Learning-driven Spatio-Temporal Satellite Data Fusion (DL-STF) approach will be developed
  by integrating various sources of satellite data, including MODIS, Sentinel-2, and ERA5, into a hybrid
  architecture combining Convolutional Neural Networks (CNNs) for spatial feature extraction, Bidirectional
  Long Short-Term Memory (Bi-LSTM) networks for temporal modeling, and a multi-head attention-based fusion
  mechanism for adaptive feature weighting. The novel approach described above can be regarded as the
  main research contribution due to its ability to jointly learn spatial and temporal representations
  through an attention-driven fusion strategy to improve climate prediction performance. The experimental
  analysis demonstrated the accuracy of the model equal to 96.3% while the error rate was relatively low
  (RMSE: 0.18, MAE: 0.12), and the latency was minimal (95 ms) compared to conventional CNN, LSTM, and
  CNN-LSTM models. As a result, it can be concluded that the novel attention-based spatio-temporal fusion
  framework significantly increases predictive accuracy, robustness, and computational efficiency, enabling
  scalable real-time environmental monitoring for early warning systems, climate risk assessment, and
  data-driven policy planning to strengthen climate resilience.'
