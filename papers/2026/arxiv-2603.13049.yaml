summary: Flow-matching generative model reconstructs 3-km 3D tropical cyclone structure from FuXi forecasts,
  cutting maximum wind RMSE 36.5% versus FuXi.
abstract: Global numerical weather prediction (NWP) and artificial intelligence (AI) models often underestimate
  tropical cyclone (TC) intensity, partly because coarse grids underresolve fine-scale three-dimensional
  inner-core structures that influence TC intensity evolution. Kilometer-scale NWP simulations can better
  resolve these structures but are too costly for operational use, which also makes high-resolution TC
  data limited. Here we construct a 3-km, TC-centered dataset for 2018--2024 using the Weather Research
  and Forecasting (WRF) model and develop 3DTCR, a vortex-following generative framework that reconstructs
  three-dimensional TC structure from FuXi global forecasts. 3DTCR combines conditional flow matching
  (CFM) with two-stage training to learn a coarse-to-fine mapping from center-aligned reanalysis simulation
  pairs and then adapt it to forecast inputs through latent space alignment. Evaluated on 2024 western
  North Pacific (WNP) forecasts, 3DTCR reduces the root mean square error (RMSE) and the magnitude of
  the mean bias error (MBE) in maximum 10-m wind speed by 36.5% and 60.7% relative to FuXi, and by 8.9%
  and 28.2% relative to the European Centre for Medium-Range Weather Forecasts high-resolution system
  (ECMWF-HRES), respectively. Case studies suggest that reconstructions capture wind gradients between
  the eye and eyewall, vertical structure of horizontal winds, and vortex asymmetries, while inheriting
  the FuXi-predicted TC tracks. 3DTCR generates 5-day TC-centered atmospheric fields in approximately
  3 minutes on one GPU, whereas a full-basin 3-km WRF simulation takes about 400 hours on 32 CPU cores.
  These results demonstrate that such a vortex-following generative reconstruction can add localized three-dimensional
  detail to global forecasts and improve TC intensity prediction without basin-wide kilometer-scale numerical
  integration.
