summary: Benchmarks GenCast, FourCastNet 3 and FGN against IFS-ENS on tropical cyclones, finding FGN gives
  better probabilistic track scores for 90% of 2025 storms.
abstract: 'Weather prediction is undergoing an important shift, with data-driven AI models outperforming
  leading numerical weather prediction systems on average at a fraction of the computational cost. Yet,
  whether this success extends to extreme events remains contested. Earlier evaluations have exposed important
  shortcomings, but have largely focused on deterministic models and metrics, leaving the capabilities
  of the latest probabilistic models less understood. We conduct an extensive benchmark of tropical cyclone
  forecasting, comparing GenCast, FourCastNet 3, and FGN with ECMWF''s operational physics-based ensemble,
  IFS-ENS. We develop a suite of probabilistic metrics and diagnostic analyses to assess cyclone tracking,
  intensity biases, uncertainty, and the wind-pressure relationship that characterizes storm structure.
  We find that, despite remaining limitations in intensity and ensemble spread, leading AI models substantially
  outperform IFS-ENS in cyclone tracking: FGN achieves better probabilistic location scores for 90% of
  evaluated storms in 2025. Further analyses reveal model-specific failure modes and suggest a lingering
  influence of pretraining data, pointing to opportunities for targeted improvement. Nonetheless, these
  results suggest that AI models are capable of capturing physical relationships that remain predictive
  well beyond typical weather conditions, motivating further investigation into how these capabilities
  emerge and how to strengthen them.'
