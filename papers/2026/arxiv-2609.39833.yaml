summary: Releases an ML-ready multi-continental dataset of about 210,000 ERA5-to-2 km precipitation pairs
  per region, benchmarking downscaling models and revealing poor out-of-domain generalization.
abstract: Extreme rainfall events are increasing in intensity and frequency as climate change accelerates.
  While kilometer-scale precipitation forecasts are critical for supporting local decision-making, the
  limited availability of high-resolution precipitation observations hinders their accuracy, especially
  in under-resourced regions. Machine learning models are widely used to downscale precipitation data
  to km-scale, but their application to unseen geographies presents challenges. First, processing raw
  high-resolution precipitation datasets across regions requires significant engineering and domain expertise.
  Second, generalization across regions remains difficult. To help overcome these barriers, we release
  RainAtlas, a large-scale, ML-ready and multi-continental dataset for precipitation downscaling. Covering
  three continents, RainAtlas harmonizes heterogeneous hourly km-scale observations to a common 2-km grid.
  Each regional partition contains around 210,000 aligned low- and high-resolution precipitation pairs,
  respectively from ERA5 reanalysis and direct observations. We benchmark state-of-the-art ML-based downscaling
  models across RainAtlas using a wide range of metrics. Our evaluation reveals substantial variance in
  out-of-domain generalization depending on the training regions. This underscores the need for cross-regional,
  multi-source km-scale evaluation, establishing RainAtlas as a well-positioned benchmark for precipitation
  downscaling research.
