summary: Machine learning clustering of 2007–2017 synoptic patterns shows flash-flood-producing MCSs in
  the Great Plains are driven by nearby forcing and moisture transport.
abstract: Abstract Understanding how the short‐term evolution of synoptic weather patterns influence Mesoscale
  Convective Systems (MCSs) is essential, as these systems are responsible for over half of central U.S.
  flash floods, leading to substantial socioeconomic and water resource management impacts. This study
  analyzes long‐term MCS data, flash flood reports, and atmospheric reanalyses from 2007 to 2017 using
  a machine learning clustering algorithm to examine how the synoptic weather patterns evolve prior to
  MCS initiation. While the clusters reflect seasonal and regional differences in MCS occurrence, they
  do not consistently distinguish between MCSs that do and do not produce flash floods. Systems in the
  southern Great Plains are more flood‐prone when a synoptic‐scale forcing, located near the system, drives
  strong water vapor transport from the nearby moisture source. More generally under different synoptic
  weather patterns, a broader precipitating area is the most dominant factor governing MCS flash flood
  potential.
