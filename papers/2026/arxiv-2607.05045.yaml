summary: Review contrasting scientific surrogate and free-form data-driven paradigms in machine-learning
  weather prediction, mapping each to state-conditioned or evolution operator formulations.
abstract: 'Modern machine-learning weather prediction (MLWP) has largely inherited the initial-value-problem
  (IVP) framing of numerical weather prediction (NWP). This inheritance leads to a dominant paradigm of
  learned autoregressive time-stepping and constrains how the learning problem is defined and architectures
  are favored. In this study we make the inheritance explicit, contrast two philosophical traditions:
  "scientific surrogate modeling," where machine learning (ML) is embedded within a physical system and
  must respect its structural constraints, and "free-form data-driven modeling," where atmospheric fields
  are treated as spatiotemporal sequences and models learn latent dynamics without explicit physical constraints.
  By reviewing the governing primitive equations, surveying recent literature, and analyzing concrete
  physical examples, we map each modeling paradigm to either a state-conditioned or evolution operator
  formulation. We conclude that principled model selection requires explicitly aligning architecture and
  training objectives with either the physical system structure or the statistical structure of the data.'
