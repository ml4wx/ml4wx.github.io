summary: Deep compression and ensemble ML on satellite records map global compound drought, heatwave and
  degradation hazards with SHAP-based interpretation and a unified hazard index.
abstract: Compound environmental hazards – including drought, land degradation, and heatwaves - are intensifying
  under climate change, posing escalating risks to ecosystems, agriculture, and human well-being. However,
  current assessments often focus on individual hazards and lack integrated global perspectives. Here
  we present a scalable and interpretable framework that combines Earth observation data with machine
  learning to map compound hazards globally. We derive drought, heatwave, and degradation indicators from
  satellite records, compress them using deep learning, and model their drivers using ensemble algorithms.
  Model interpretation with SHAP (Shapley Additive exPlanations) and principal component analysis (PCA)
  enables the generation of a unified hazard index. To address the temporal mismatch between long-term
  drivers and short-term extremes, we explicitly separated the spatial baseline from seasonal dynamics.
  We incorporated a temporal diagnostic framework using a short-term drought index (SPEI-3) and annual
  heatwave extremes to evaluate interannual variability and capture El Niño-Southern Oscillation (ENSO)
  teleconnections. The resulting maps reveal distinct hotspots across semi-arid and transitional regions,
  where multiple hazards converge. Case studies in six regions validate the approach across diverse climates.
  This framework offers a reproducible and physically grounded method for compound hazard assessment and
  supports early-warning systems, adaptation planning, and environmental governance in the face of accelerating
  climate risks.
