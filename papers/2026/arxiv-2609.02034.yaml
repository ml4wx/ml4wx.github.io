summary: An AI limited-area model plus diffusion ensemble downscales Atlantic hurricanes to hourly kilometre-scale
  fields, matching CONUS404 energy spectra and improving on a deterministic AI baseline for extremes.
abstract: This study presents an AI-based dynamical downscaling system for Tropical Cyclones (TCs). The
  system incorporates an AI-based limited-area model that downscales 3-hourly low-resolution boundary
  forcings into hourly high-resolution fields autoregressively, and a diffusion model that converts the
  outputs into ensembles of hazard-relevant variables. The system is trained on the regridded CONUS404
  data with ERA5 forcings, and is evaluated on 20 TCs in 2020--2024. Verification shows stable downscaling
  performance across Atlantic hurricane seasons, with energy spectra closely matching the CONUS404 reference.
  The system is also verified to produce skillful TC-relevant weather extremes, largely improved over
  a deterministic AI baseline. The system performs well with forcing data from other models (GDAS/FNL)
  and can produce detailed eyewall, rainband, and landfall structures in TC case studies. The study provides
  a good example of how AI-based dynamical downscaling systems can be designed to resolve small-scale
  extreme weather events.
