summary: Multimodal model combining GraphCast forecasts with GridSat imagery cuts tropical cyclone track
  error 15-44% and intensity error 3-6x, zero-shot to other NWP models.
abstract: We present TropicalCycloneNext (TC-Next), a multimodal deep learning model that forecasts tropical
  cyclone track and intensity at $6-24$h leads by leveraging a foundation model's forecast of atmospheric
  kinematic and thermodynamic fields, along with GridSat infrared satellite imagery. Trained only on GraphCast
  forecasts over the Western Pacific (WP), yet reliant only on generic atmospheric variables, TC-Next
  on GraphCast lowers track error by $15-44\%$ and intensity error by a factor of $3-6$ relative to the
  rule-based tracker TempestExtremes; applied without retraining to Pangu-Weather and IFS HRES forecasts,
  it stays ahead on both. Applied zero-shot to the generic weather fields of WeatherNext Cyclones on the
  2025 WP season, it attains lower average intensity error at every lead time, and lower or comparable
  average track error, than that model's specialized direct tracker in a deterministic comparison. Ablations
  show that the satellite branch lowers track error at every lead time and intensity error at longer leads.
  TC-Next thus gives a common, independently verifiable basis for comparing the AI forecasts that inform
  cyclone-warning and climate-adaptation decisions as best available science.
