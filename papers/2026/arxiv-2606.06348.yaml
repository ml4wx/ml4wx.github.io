summary: Evaluates operational GraphCast against ECMWF IFS HRES over four Brazilian sub-regions, finding
  GraphCast lags at days 2-7 for Z500 in winter but leads in extended range.
abstract: The paradigm of global weather forecasting is rapidly shifting with the emergence of Machine
  Learning Weather Prediction models (MLWP). While these data-driven architectures demonstrate remarkable
  global skill, regional benchmarks in the Global South remain scarce, leaving their efficacy in complex,
  highly convective environments largely unverified. This study evaluates the performance of GraphCast
  operational against the deterministic ECMWF IFS HRES as baseline across four distinct Brazilian climatic
  sub-regions. Utilizing a scalable, cloud-native pipeline and the WeatherBench-X framework for benchmarking
  weather models, we assess selected tropospheric variables ($T_{850}$, $Q_{850}$, $Z_{500}$) over four
  selected seasonal windows, employing the operational IFS analysis as the ground truth to calculate the
  statistical metrics for both models. Results reveal a regime-dependent skill profile. During the austral
  winter, GraphCast underperforms in the medium range (lead days 2-7) for $Z_{500}$ when resolving fast-propagating
  baroclinic systems over southern Brazil, but regains an advantage in the extended range, where its inherent
  smoothing of chaotic small-scale variability becomes beneficial under deterministic skill metrics. Conversely,
  during the austral summer wet season, GraphCast accurately captures large-scale moisture transport while
  intrinsically dampening the high-frequency convective variability that degrades deterministic NWP temperature
  forecasts. These findings establish a baseline for Brazil and define the specific physical boundaries
  that will guide future ``tropicalization'' efforts, aiming to optimize these foundational AI models
  for regional resilience.
