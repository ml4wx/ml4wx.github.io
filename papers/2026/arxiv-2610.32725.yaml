summary: LLM agents build an ontology-grounded climate science knowledge graph with 133,990 nodes; 98.96%
  of validated triplets from 2,000 papers are judged correct.
abstract: The rapid expansion of scientific literature far outpaces the speed of manual curation, creating
  a fundamental bottleneck in extracting structured knowledge from scientific texts. To address this,
  we introduce an agentic, ontology-guided framework for knowledge graph (KG) construction. Our framework
  utilizes specialized agents for document understanding, information extraction, ontology conformance,
  and entity linking. First, an LLM extracts factual knowledge in the form of triples with explicit textual
  evidence from research papers. Then the triplets undergo a multistage verification process to ground
  the triplets in the ontology. By enforcing schema constraints and requiring evidence in the form of
  text fragments, we ensure the data is both semantically consistent and traceable. In an agreement study
  over 1,000 extracted triplets, Gemini-2.5-flash achieves Cohen's $κ$ scores of 0.640--0.700 against
  three human annotators, matching the human--human agreement range of 0.616--0.689. We applied this framework
  to 2,000 scientific publications and construct a novel, ontology-grounded KG for climate science with
  133,990 nodes and 755,308 relations; of the 23,327 triplets that the publications contribute after validation,
  98.96\% are judged correct. The pipeline code and KG is publicly available https://github.com/aayushacharya/climatekg.
