summary: CNN predicts early-winter NAO from SST fields one to three months ahead, outperforming a linear
  baseline and showing skill linked to ENSO.
abstract: Abstract The North Atlantic Oscillation (NAO) is the dominant mode of atmospheric variability
  over the North Atlantic, influencing temperature and precipitation across Europe. While the NAO’s impact
  on North Atlantic sea surface temperatures (SSTs) is well understood, the NAO can also be driven by
  SST anomalies, although this response is believed to be weak and nonlinear. Former studies highlight
  that during early winter (November–December), El Niño-Southern Oscillation (ENSO) events modulate the
  NAO, with El Niño (La Niña) events being linked to positive (negative) NAO phases, and an opposite effect
  in late winter (January–February). Indian Ocean SSTs and the North Atlantic Horseshoe SST anomaly have
  also been suggested as contributors to early winter NAO variability. However, climate models often struggle
  to capture these SST-NAO teleconnections, particularly in early winter. To address this, a statistical
  framework based on convolutional neural networks (CNNs) is developed to predict the early winter NAO
  using observed SST fields one, two, and three months before. A linear model serves as a benchmark, and
  both are trained on ERA5 reanalysis data from 1940 to 2023. A sensitivity analysis interprets the CNN’s
  decision-making process, revealing that it focuses on regions such as the tropical Pacific and North
  Atlantic, confirming earlier findings. The CNN outperforms the linear model, highlighting the value
  of capturing nonlinear SST-NAO relationships. Prediction skill appears to be linked to ENSO, with strong
  events associated with greater skill than neutral events. These findings underscore the potential of
  deep learning to build NAO prediction.
