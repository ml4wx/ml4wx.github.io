summary: Blending AI weather models with a Bayesian onset-farmer-expectation model improves Indian monsoon
  onset forecasts at longer leads; the system reached 38 million farmers in 2025.
abstract: Hundreds of millions of farmers make high-stakes decisions under uncertainty about future weather.
  Forecasts can inform these decisions, but available choices and their risks and benefits vary between
  farmers. We introduce a decision-theory framework for designing useful forecasts in settings where the
  forecaster cannot prescribe optimal actions because farmers' circumstances are heterogeneous. We apply
  this framework to the case of seasonal onset of monsoon rains, a key date for planting decisions and
  agricultural investments in many tropical countries. We develop a system for tailoring forecasts to
  the requirements of this framework by blending systematically benchmarked artificial intelligence (AI)
  weather prediction models with a new "evolving farmer expectations" statistical model. This statistical
  model applies Bayesian inference to historical observations to predict time-varying probabilities of
  first-occurrence events throughout a season. The blended system yields more skillful Indian monsoon
  forecasts at longer lead times than its components or any multi-model average. In 2025, this system
  was deployed operationally in a government-led program that delivered subseasonal monsoon onset forecasts
  to 38 million Indian farmers, skillfully predicting that year's early-summer anomalous dry period. This
  decision-theory framework and blending system offer a pathway for developing climate adaptation tools
  for large vulnerable populations around the world.
