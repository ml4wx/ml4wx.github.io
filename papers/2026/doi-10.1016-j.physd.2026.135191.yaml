summary: Bayesian neural network attributes 1856–2023 global temperature change to forcings, finding anthropogenic
  forcing dominant (about 85%) in recent decades, without climate model runs.
abstract: Modelling and quantification of the relative influence of climate forcing (e.g., natural, anthropogenic
  and/or other) on global-scale temperature variation is one of the challenging problems for geo-bio-ocean
  modelers due to intricate coupling, interplaying and feedback mechanism among earth-ocean and atmospheric
  system. The coupling and interaction among these high-dimensional processes holds a complex (non-linear)
  relationship between climate variables and changes in global-scale temperature. Here we employ firstly
  a Hybrid Monte Carlo-Bayesian Neural Network (HMC-BNN) to model the past 166 years 1856–2023 global
  temperature variation with uncertainty in prediction. Secondly, we quantify relative influence of climate
  forcings/variables at each year to predict global temperature anomaly via Automatic Relevance Determination-Bayesian
  Neural Network (ARD-BNN). The HMC-BNN modelling exhibits the highest coefficient of determination (R
  2 ∼ 0.98) between observed and predicted temperature change when the network makes use of natural+ anthropogenic+
  other climate series together with network’s prediction error as input explicitly. The novel use of
  ARD-BNN detects relatively high influence of anthropogenic forcing (e.g., RFANTH (∼85%)) on global temperature
  anomaly in the last 50–60 years, it also allows quantifying the influence of climate forcing (e.g.,
  solar, volcanic, greenhouse gas, black carbon and atmospheric sulphates) on global temperature anomaly
  individually using a non-linear data-driven approach. The approach proposed here is new to quantify
  the relative influence of individual forcing without climate model simulation year by year to attribute
  non-linear global temperature change and highlight that the recent climate warming is mostly driven
  by anthropogenic/human-induced forcing.
