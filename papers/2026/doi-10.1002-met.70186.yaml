summary: Diffusion Transformer HARE raises 0–2 h Guizhou radar nowcast mean CSI to 0.284 from 0.169 for
  the operational Fenglei model.
abstract: 'ABSTRACT Precipitation nowcasting in complex terrains like the Guizhou Plateau is challenged
  by the blurry forecasts and premature dissipation common in traditional and early deep learning models.
  To address this, this study evaluates HARE, a novel nowcasting model based on a state‐of‐the‐art Diffusion
  Transformer (DiT) architecture, against the operational Fenglei model benchmark. HARE generates 0–2
  h forecasts by learning from historical radar sequences, and its performance was systematically assessed
  using a 142‐day macroscopic verification (including critical success index (CSI), probability of detection,
  false alarm rate, and bias) and microscopic diagnosis of two typical severe weather events. The results
  demonstrate HARE''s clear superiority: its mean CSI (0.2842) was significantly higher than Fenglei''s
  (0.1692), and it exhibited slower performance decay. Critically, case studies revealed that HARE successfully
  predicted key dynamic processes, such as new convective cell initiation and the full life‐cycle of a
  squall line, which the benchmark model failed to capture, instead showing an erroneous dissipation trend.
  These findings confirm the significant advantages of the DiT architecture, whose self‐attention mechanism
  and generative paradigm are key to capturing complex convective evolution with high fidelity. This work
  underscores the potential of next‐generation artificial intelligence models while also highlighting
  that future breakthroughs will likely depend on integrating such data‐driven approaches with atmospheric
  physics.'
