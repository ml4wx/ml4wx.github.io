summary: M3R fuses NEXRAD radar imagery with personal weather station time series through attention to
  predict rainfall over 100 km areas, outperforming existing approaches.
abstract: Accurate and timely rainfall nowcasting is crucial for disaster mitigation and water resource
  management. Despite recent advances in deep learning, precipitation prediction remains challenging due
  to limitations in effectively leveraging diverse multimedia data sources. We introduce M3R, a Meteorology-informed
  MultiModal attention-based architecture for direct Rainfall prediction that synergistically combines
  visual NEXRAD radar imagery with numerical Personal Weather Station (PWS) measurements, using a comprehensive
  pipeline for temporal alignment of heterogeneous meteorological data. With specialized multimodal attention
  mechanisms, M3R novelly leverages weather station time series as queries to selectively attend to spatial
  radar features, enabling focused extraction of precipitation signatures. Experimental results for three
  spatial areas of 100 km * 100 km centered at NEXRAD radar stations demonstrate that M3R outperforms
  existing approaches, achieving substantial improvements in accuracy, efficiency, and precipitation detection
  capabilities. Our work establishes new benchmarks for multimedia-based precipitation nowcasting and
  provides practical tools for operational weather prediction systems. The source code is available at
  https://github.com/Sanjeev97/M3Rain
