summary: UniPhy is a continuous-time neural stochastic PDE weather model with non-Hermitian spectral operators
  and a parallel prefix-sum integrator for planetary-scale forecasting.
abstract: While data-driven weather models have achieved remarkable deterministic accuracy, they fundamentally
  rely on discrete-time mappings and closed-system assumptions, failing to capture the multi-scale continuous
  dynamics and thermodynamic openness of the atmosphere. To address these limitations, we propose UniPhy,
  a continuous-time non-Hermitian neural stochastic partial differential equation (SPDE) solver. Geometrically,
  we employ Riemannian-Clifford gauge transformations to flatten planetary heterogeneity, enabling globally
  consistent operations. Dynamically, we construct non-Hermitian biorthogonal spectral operators integrated
  with a global flux tracker to capture transient energy growth and open-system exchange. Computationally,
  by identifying the algebraic associativity of the analytic solution, we reformulate adaptive physical
  integration as a parallel prefix-sum problem, achieving log-linear sequence parallelism. UniPhy establishes
  a physically complete foundation model architecture that unifies geometric adaptivity, thermodynamic
  consistency, and computational efficiency. Our code is available at <https://github.com/yrqUni/UniPhy>.
