summary: Tests hybrid quantum neural networks on cloud microphysics data and finds they lag simple classical
  fully connected networks despite extensive tuning.
abstract: Quantum machine learning (QML) could have the potential to leverage advantages of quantum over
  classical computing but still lacks strong evidence of actual improvements and scalability, partly due
  to phenomena such as barren plateaus. In this paper, we employ a hybrid quantum neural network (QNN)
  on a dataset on cloud microphysics, containing processes for phase transitions of water in the atmosphere
  and its related temperature changes, which are highly relevant for accurate climate predictions and
  projections. To reach optimal performance of our QNNs, we employ a rich and trainable frequency spectrum
  together with expressivity enhancing classical postprocessing. We find that our QNNs strongly benefit
  from extensive hyperparameter optimization and thereby demonstrate the feasibility of applying QNNs
  to complex physical systems. At the same time, the QNNs are outperformed by classical baselines in the
  form of simple fully-connected neural networks. We discuss identified bottlenecks of this class of quantum
  models to learn the full complexity of the cloud microphysics dataset to show that there is a need to
  further understand and improve variational quantum models for machine learning such that they might
  fill the gap where classical models fail or are inefficient.
