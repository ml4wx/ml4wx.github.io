summary: Systematic review of machine learning and deep learning methods for weather forecasting, covering
  algorithms, datasets, metrics, limitations and research gaps.
abstract: 'This research project presents a systematic review of the application of Artificial Intelligence
  (AI) techniques in weather forecasting. The study aims to investigate how AI-based methods, including
  machine learning, deep learning, hybrid intelligent systems, and data-driven predictive models, are
  being utilized to improve the accuracy, efficiency, and reliability of weather prediction systems. The
  review will analyze published research articles, conference papers, and scholarly studies related to
  AI-driven weather forecasting models. The study focuses on identifying commonly used AI algorithms,
  datasets, forecasting parameters, evaluation metrics, model performance, advantages, limitations, and
  current research trends in the field. In addition, the review seeks to explore the challenges associated
  with AI applications in meteorological forecasting, such as data quality issues, model interpretability,
  computational complexity, and real-time prediction limitations. The study will also identify research
  gaps and provide recommendations for future research directions in intelligent weather forecasting systems.
  Expected outcomes of this systematic review include: A comprehensive synthesis of AI techniques used
  in weather forecasting Comparative analysis of forecasting models and performance metrics Identification
  of existing challenges and research gaps Recommendations for future AI-based weather prediction research
  The findings of this study are expected to contribute to the advancement of intelligent meteorological
  systems and support researchers, practitioners, and policymakers interested in AI applications for environmental
  and climate-related forecasting.'
