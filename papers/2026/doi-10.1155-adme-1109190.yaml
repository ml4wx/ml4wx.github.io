summary: A Seq2Seq LSTM forecasts urban near-surface temperature, humidity and wind up to 6 h, beating
  the Korean LDAPS NWP model, with temperature RMSE about 1.4°C lower.
abstract: 'Weather prediction has traditionally relied on numerical weather prediction (NWP) models. However,
  these models have encountered significant challenges, such as high computational demands and inherent
  prediction biases, particularly in high‐resolution urban simulations. Recent advancements in deep learning
  (DL) techniques have provided potential solutions to overcome these limitations. This study presents
  a Seq2Seq long short‐term memory (LSTM) model optimized for short‐term (up to 6 h) operational predictions
  of near‐ground temperature, relative humidity, wind speed, and wind direction in a highly urbanized
  area. The optimized LSTM model was constructed by testing various structures and hyperparameters (“
  model-centric approach ”) and considering the effectiveness of different training datasets (“ data-centric
  approach ”) with a focus on jointly handling multivariate forecasting within a Seq2Seq LSTM framework.
  A 1‐month forecast evaluation showed that the Seq2Seq LSTM model improved upon the local data assimilation
  and prediction system (LDAPS), the Korea operational NWP model, with the most pronounced improvements
  observed in temperature (RMSE: ~1.4°C) and wind speed (RMSE: ~0.6 m s −1 ) forecasts, while improvements
  in relative humidity and wind direction were more limited. The model could predict more precisely time‐averaged
  trends of the forecast variables than their deviations, with deteriorated performance in abrupt meteorological
  changes. These results imply the essential role of NWP forecasts as input sequences in improving the
  model performance and reducing training data length.'
