summary: A differentiable, modular JAX Earth system model whose code was largely written by AI coding
  agents, supporting gradient-based calibration and kilometre-scale GPU simulations.
abstract: Earth system models (ESMs) have grown tremendously in realism, yet key uncertainties persist
  in the climate response to greenhouse-gas forcing, particularly due to cloud radiative feedbacks. In
  addition, their software architecture was not designed for accelerator hardware or modern artificial
  intelligence (AI). Here we present legoESM, a composable, differentiable, multiscale ESM written in
  JAX. It builds on decades of community-developed parameterizations and numerical methods, recast in
  a unified framework by AI coding agents under a human-specified scientific contract and verified through
  benchmarking. Dynamical cores, physics schemes, grids, complexity levels and components are swappable
  like building blocks, and can use conventional physics or machine-learned emulators. A single code base
  spans metre-scale large-eddy simulation to global simulations and weather to climate. End-to-end differentiability
  enables gradient-based calibration, variational data assimilation and online training. legoESM modular
  architecture enables systematic evaluation of diverse model variants to explore structural uncertainty
  and test hypotheses. legoESM produces realistic simulations across scales, reduces land-surface temperature
  bias through gradient-based calibration, and scales efficiently on GPUs to kilometer-scale simulations.
  It offers an open, community infrastructure for hypothesis testing, research and teaching in Earth sciences
  and a template for multiscale physical systems.
