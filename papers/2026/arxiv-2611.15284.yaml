summary: Combines generative ML downscaling with analog sampling to produce high-resolution unprecedented
  heatwave events over Paris from coarse global climate model boosting runs.
abstract: Extreme weather events are critical for climate impact assessments. While physical models can
  simulate unprecedented extremes, for example, through ensemble boosting, this approach is computationally
  demanding, often restricting output to coarse spatial resolutions. Probabilistic generative downscaling
  offers a solution by enabling efficient sampling from the entire climate distribution, including its
  extreme tails. Here, we first demonstrate that machine learning generated regional climate model heatwaves
  over Paris are physically realistic. We then leverage an emulated machine learning dataset to perform
  analog-based downscaling of coarse global climate model ensemble boosting events. Our hybrid framework
  effectively bridges high-resolution regional detail with rare-event sampling, providing an efficient
  tool for extreme event downscaling and capturing multi-model uncertainty.
