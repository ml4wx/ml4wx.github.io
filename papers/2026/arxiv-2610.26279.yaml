summary: Residual quantum neural networks for cloud-cover parameterization cut test MSE by 39-54% versus
  direct QNN prediction, but stronger classical models still outperform them.
abstract: 'Compact quantum neural networks have been explored for cloud-cover parameterization, but their
  predictive value depends on how physical knowledge is incorporated and which classical models provide
  the reference. We investigate an offline residual formulation that retains a fitted \XR\ cloud-cover
  estimate and learns a correction to its logit in transformed target space. Using released ICON/DYAMOND-derived
  data, we compare ten model variants in six- and eight-input settings, with three matched replicates
  and 10,000 training samples per replicate. All quantum circuits use local Z readout and noiseless exact
  expectation values. Under a common 30-epoch protocol, residual prediction reduced physical-space test
  mean squared error relative to direct QNN prediction by 54.3\% and 38.8\% for six-input XYZ and ZZXY
  circuits, and by 49.2\% and 38.9\% for their eight-input versions. Residual QNNs also outperformed the
  selected compact residual multilayer perceptron in every paired replicate. A larger, longer-trained
  Grundner-Q1 adaptation nevertheless achieved lower error: residual Q1 reached mean MSEs of 0.00778 and
  0.00791, compared with 0.01124 and 0.01082 for residual XYZ. The results support residual prediction
  for compact simulated QNNs within the tested budget and establish a clear boundary set by stronger classical
  references. They do not establish computational quantum advantage or online climate-model skill.'
