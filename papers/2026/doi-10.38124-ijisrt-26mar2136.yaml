summary: A fused EfficientNetV2S and metadata network estimates tropical cyclone Vmax and MSLP from satellite
  imagery, with errors of 2.43 knots and 2.87 hPa.
abstract: Tropical cyclones are the most destructive of natural catastrophes, since it has cost money
  and lives of many people all around the globe. The cyclone intensity parameters such as the maximum
  sustained wind speed (Vmax) as well as the minimum sea-level pressure (MSLP) play a very critical role
  in disaster preparedness and mitigation. The multi-model deep learning system proposed in this paper
  uses satellite and meteorological metadata to predict the strength of the cyclone. The model utilizes
  an already trained EfficientNetV2S model as a spatial feature extractor of multi-channel satellite image
  and a fully connected metadata branch that consists of geographical and time information. It is performed
  on the fused representation with multi-output regression (Vmax and MSLP both). Tropical Cyclone Intensity
  Regression (TCIR) data has been used to train and test the model. The capability to predict Vmax and
  MSLP with an error of 2.43 knots and 2.87 hPa has been shown to be good and the correlation coefficients
  of Vmax and MSLP have been shown to be good (0.992 and 0.977 respectively). The proposed methodology
  can make more predictions and shows the success of using visual and contextual information on the prediction
  of cyclone intensity union.
