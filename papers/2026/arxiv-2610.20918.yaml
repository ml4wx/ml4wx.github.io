summary: Uses GraphCast and FourCastNet forecasts to predict US county power outages 1–5 days ahead, finding
  captured outage burden drops with lead time and intervals undercover tropical cyclones.
abstract: 'Utilities request mutual aid crews to restore power after severe storms, and requesting early
  secures more crews but relies on less accurate forecasts. We examined how forecast lead time affects
  the value of outage predictions for crew deployment, using operational forecasts from two AI weather
  models, GraphCast and FourCastNet, to predict outage occurrence for counties across the contiguous United
  States 24 to 120 hours ahead. Forecasts were evaluated by the share of outage burden captured by the
  counties where crews would be staged. Captured burden declined with lead time: the loss between three
  and five days was significant in all analyses, whereas the loss within three days was significant only
  for outages that had not yet started. Early deployment with all requested crews outperformed late deployment
  with fewer, and we report the availability ratio at which the two break even. Antecedent land surface
  predictors computed at forecast valid time include weather from the forecast period, which inflates
  their skill by 42 to 53% and reverses their apparent advantage over forecast meteorology at long lead
  times. Computed correctly, they improved occurrence skill by 17.5% at 24 hours but did not significantly
  change captured burden, a gap that attribution analysis linked to their static component. Prediction
  intervals covered only 0.476 of tropical cyclone events against a nominal 0.90. Calibration by hazard
  class corrected most of this shortfall at an 11% cost in interval width, as a diagnostic only, because
  hazard class is known only after the event.'
