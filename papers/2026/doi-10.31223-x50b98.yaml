summary: Hybrid pipeline chains seasonal forecasts, FNO downscaling, UMAL-LSTM runoff and routing to give
  probabilistic hydropower indicators, with CRPSS 0.25–0.33 at one-month lead.
abstract: Seasonal hydropower forecasts can inform power-system resource adequacy, but uncertainty propagates
  through climate, hydrologic, routing, water-management, and generation components.We develop a regional
  planning prototype linking North American Multi-Model Ensemble seasonal forecasts, Fourier Neural Operator
  (FNO) downscaling, an uncertainty-aware long short-term memory runoff model based on Uncountable Mixtures
  of Asymmetric Laplacians (UMAL-LSTM), MOSART-WM routing and water management, and plant-level autoregressive
  generation estimates. During 2011–2020, FNO reduced monthly spatially averaged mean absolute error relative
  to the best non-FNO baseline by 13.0% for precipitation, 16.3% for temperature, and 6.2% for wind speed,
  although residual biases and complex-terrain errors remained. Runoff evaluation showed broad skill relative
  to the GRFR reanalysis target; independent streamflow and controlled-forcing checks indicated substantial
  spatial heterogeneity and contributions from both meteorological downscaling and hydrologic-model limitations.
  Regional hydropower-generation manuscript CRPSS was approximately 0.25–0.33 at a one-month lead. Skill
  declined with lead and varied by region and season; by month four, several snow- and melt-season regional
  CRPSS values approached or fell below zero. The framework provides probabilistic hydropower indicators
  for regional resource-adequacy planning, but it is not a plant-operations model because it does not
  explicitly represent plant-specific submonthly constraints, flood-control optimization, turbine release
  versus spill, dynamic hydraulic head, market dispatch, or changing operating priorities
