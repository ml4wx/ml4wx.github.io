summary: A backpropagation neural network is applied to forecast monthly rainfall in Medan City using
  2022–2024 observations; the abstract reports no accuracy figures.
abstract: Rainfall is a crucial factor in the stability of the Earth's ecosystem and has a significant
  impact on agriculture, forestry, energy, and water management. However, increasingly unstable climate
  change makes rainfall patterns difficult to predict accurately using traditional methods. The city of
  Medan, the capital of North Sumatra Province, has a tropical rainforest climate with an average annual
  rainfall of approximately ±2200 mm and an average temperature of 27°C. Significant weather fluctuations
  in this area can trigger flooding when rainfall increases and cause water shortages when rainfall decreases
  (BMKG, 2021). Therefore, a prediction approach that can manage non-linear and dynamic data is needed.
  Artificial Neural Networks (ANN) are one of the reliable machine learning methods for detecting data
  patterns. By using the backpropagation algorithm, the model can gradually reduce prediction errors,
  making it widely used in weather forecasting applications. In this regard, this study uses ANN with
  the backpropagation method to forecast monthly rainfall in Medan City by utilizing data from 2022–2024
  as training and testing data.
