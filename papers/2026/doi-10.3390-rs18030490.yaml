summary: Dynamic region attention masks non-precipitation areas so the TPDTC-Net-DRA nowcaster focuses
  on heavy rain, outperforming state-of-the-art methods and generalizing across architectures.
abstract: 'Heavy precipitation events are characterized by sudden onset, limited spatiotemporal scales,
  rapid evolution, and high disaster potential, posing long-standing challenges in weather forecasting.
  With the development of deep learning, an increasing number of researchers have leveraged its powerful
  feature representation and non-linear modeling capabilities to address the challenge of precipitation
  nowcasting. Despite recent advances in deep learning for precipitation nowcasting, most existing methods
  do not explicitly separate precipitation from non-precipitation regions. This often leads to the extraction
  of redundant or irrelevant features, thereby causing models to learn misleading patterns and ultimately
  reducing their predictive capability for heavy precipitation events. To address this issue, we propose
  a novel dynamic region attention (DRA) mechanism, and an improved model TPDTC-Net-DRA, based on our
  previously introduced TPDTC-Net. The proposed TPDTC-Net-DRA applies the DRA mechanism and incorporates
  its two key components: a dynamic region module and a weight control module. The dynamic region module
  generates a mask matrix that is applied to the feature maps, guiding the attention mechanism to focus
  only on precipitation areas. Meanwhile, the weight control module produces a location-sensitive weight
  matrix to direct the model’s attention toward regions with intense precipitation. Extensive experiments
  demonstrate that TPDTC-Net-DRA achieves superior performance for heavy precipitation, outperforming
  current state-of-the-art methods, and indicate that the proposed DRA mechanism exhibits strong generalization
  ability across diverse model architectures.'
