summary: LSTM with ICON-D2 NWP predictors improves short-term offshore wind power forecasts at Alpha Ventus,
  outperforming MLP, XGBoost, Random Forest and LightGBM.
abstract: Offshore wind power generation has emerged as a reliable and stable source of renewable energy.
  However, accurate short-term forecasting of power generation remains a challenge due to the stochastic
  nature of weather conditions. This study evaluates the contribution of Numerical Weather Prediction
  (NWP) outputs and lagged explanatory variables for short-term offshore wind power forecasting. The analysis
  was conducted using data from the Alpha Ventus wind farm, located in the North Sea. NWP outputs from
  the ICON-D2 (ICOsahedral Nonhydrostatic D2) model were integrated with historical power generation data
  collected from Alpha Ventus turbine sensors. The performance was evaluated using a state-of-the-art
  recurrent neural network (Long Short-Term Memory, LSTM) alongside four established machine learning
  baselines (Multi-Layer Perceptron, XGBoost, Random Forest, and LightGBM). The results highlight three
  main findings. First, the inclusion of NWP predictors consistently improves performance across all evaluated
  technologies. Second, LSTM-based models improve forecasting accuracy compared to the alternative algorithms.
  Third, while adding 1 h lagged variables is beneficial, extending the lag structure beyond this does
  not yield additional gains in predictive performance. These findings emphasize the potential of advanced
  neural network architectures combined with NWP data to improve offshore wind power generation forecasting
  accuracy. • Combining NWP and AI methods improved short-term offshore wind power forecasts. • Both Multilayer
  Perceptron and Long Short-Term Memory architectures were evaluated. • Long Short-Term Memory models
  consistently outperformed the Multilayer Perceptron. • The analysis used real operational data from
  the Alpha Ventus offshore wind farm. • Open-source datasets and machine learning were used to impute
  missing sensor data.
