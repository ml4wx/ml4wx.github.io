summary: Compares EMOS, distributional regression networks, Transformers and GNNs for post-processing
  ECMWF forecasts at stations in Germany, and proposes an altitude-aware linear pool for unobserved sites.
abstract: Statistical post-processing improves ensemble weather forecasts, but generating calibrated predictions
  at locations without observations remains challenging. This study compares statistical and machine-learning-based
  methods for post-processing ECMWF 2-m temperature and 10-m wind speed forecasts at observed and unobserved
  stations in Germany. We consider EMOS-based approaches, distributional regression networks, Transformers,
  and graph neural networks under both limited and extended predictor settings. For temperature, we also
  investigate linear forecast combinations and propose an altitude-aware linear pool (ALP). The results
  show that post-processing improves upon the raw ensemble in most settings, but no single method performs
  best across all variables, station groups, and evaluation metrics. The proposed ALP provides a small
  but significant improvement over the standard linear pool at unobserved locations.
