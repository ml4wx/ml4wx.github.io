summary: EOF analysis of ICON-LAM winter 2022–23 forecasts finds optimized configurations skilful for
  2-m temperature, with a fourth mode aiding night-time performance; autoencoders deferred to Part II.
abstract: 'Validation of ICON model configurations optimized over a limited domain is essential before
  accepting new semi-empirical parameters that influence the behavior of subgrid-scale schemes. Because
  such parameters can modify the dynamics of a numerical weather prediction (NWP) model in highly nonlinear
  ways, we analyze one season of forecasts (December 2022, January and February 2023) generated with the
  NWP ICON-LAM through the lens of machine learning–based diagnostics as a complement to traditional evaluation
  metrics. The goal is to extract physically interpretable information on the model behavior induced by
  the optimized parameters. This work represents the first part of a wider study exploring machine learning
  tools for model validation, focusing on two specific approaches: Empirical Orthogonal Functions (EOFs),
  which are widely used in meteorology and climate science, and autoencoders, which are increasingly adopted
  for their nonlinear feature extraction capability. In this first part, EOF analysis is used as the primary
  tool to decompose weather fields from observed reanalysis and forecast datasets. Hourly 2-m temperature
  forecasts for winter 2022–2023 from multiple regional ICON configurations are compared against downscaled
  ERA5 data and in situ observations from ground station. EOF analyses revealed that the optimized configurations
  demonstrate a high skill in predicting surface temperature. From the signal error decomposition, the
  fourth EOF mode is effective particularly during night-time hours, and contributes to enhancing the
  performance of ICON. Analyses based on autoencoders will be presented in a companion paper (Part II).'
