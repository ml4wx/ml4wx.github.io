summary: An LSTM seq2seq framework downscales WRF wind forecasts to a bridge site and predicts buffeting
  responses before strong winds arrive.
abstract: Buffeting of long‐span bridges induced by strong winds has received attention recently due to
  traffic serviceability. An essential challenge is whether the bridge response can be estimated before
  the arrival of strong winds. In this work, a buffeting response early forecasting framework based on
  meteorological weather prediction is proposed. The initial input for the forecasting model is derived
  from the original low‐time‐resolution wind data at the meteorological station, as provided by the weather
  research and forecasting (WRF) system. High‐time‐resolution wind data at the bridge site are predicted
  using a combination of an LSTM neural network and a super‐resolution method. Then, the buffeting response
  regression model is built based on the LSTM seq2seq method for different types of wind. The proposed
  framework introduces two key innovations. First, a mapping method is devised to connect large‐scale
  wind speed prediction data with local wind conditions at the bridge site. Furthermore, a predictive
  model for the wind‐induced response of bridges, incorporating a dropout layer, has been formulated to
  address various types of wind disasters. This established mapping model considers sequence‐to‐sequence
  relationships and estimated uncertainty. This integrated approach establishes a forecasting framework
  that spans from long‐term future weather predictions to the prediction of wind‐induced responses in
  significant bridge projects. The proposed method is of significant value for optimizing bridge operation
  and improving traffic control.
