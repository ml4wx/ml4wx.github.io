summary: Compares SVM, random forest, KNN and MLP regressors for rainfall prediction and intensity classification
  from historical station data.
abstract: Rainfall prediction plays a vital role in agriculture, water resource management, disaster prevention,
  and climate research. Accurate forecasting helps farmers plan crop cycles, governments manage water
  resources, and authorities prepare for floods and droughts. Traditional statistical models often fail
  to capture the nonlinear and complex patterns present in weather data. To overcome these limitations,
  this study proposes a machine learning-based rainfall prediction system that enhances forecasting accuracy
  using multiple regression algorithms. The proposed system utilizes historical rainfall datasets containing
  temporal features such as date fraction and rainfall values. Data preprocessing techniques are applied
  to clean and structure the dataset, followed by splitting it into training and testing sets. Several
  machine learning algorithms are implemented, including Support Vector Machine (SVM), Random Forest Regressor,
  Decision Tree Regressor, KNearest Neighbors (KNN), and Multi-Layer Perceptron (MLP) Neural Networks.
  Each model is trained and evaluated using Root Mean Square Error (RMSE) and accuracy metrics. The system
  also visualizes actual and predicted rainfall values to provide intuitive insights into model performance.
  The comparative analysis shows that ensemble methods like Random Forest generally achieve better accuracy
  due to their ability to handle variance and nonlinear relationships, while neural networks provide strong
  predictive capabilities for complex patterns. Additionally, the system classifies rainfall intensity
  into categories such as No Rain, Light Rain, Moderate Rain, Heavy Rain, and Very Heavy Rain. This categorization
  enhances interpretability and practical usability of the predictions. The developed application includes
  a graphical user interface (GUI) built using Tkinter, allowing users to upload datasets, preprocess
  data, run different algorithms, and visualize results easily. This makes the system user-friendly and
  accessible even for non-technical users. The experimental results demonstrate that machine learning
  models significantly improve rainfall prediction accuracy compared to traditional methods. The study
  highlights the importance of selecting appropriate models and evaluation metrics for weather forecasting
  tasks. Future work can include deep learning approaches, integration of real-time weather data, and
  inclusion of additional meteorological parameters such as humidity, temperature, and wind speed. Overall,
  this research contributes to the development of efficient and accurate rainfall prediction systems using
  machine learning techniques, offering practical benefits for agriculture, disaster management, and environmental
  sustainability.
