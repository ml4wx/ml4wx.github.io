summary: HiRO-ACEv2 emulates 3 km X-SHiELD storm-resolving output 300 times cheaper, matching precipitation
  and wind distributions to the 99.9999th percentile and tracking tropical cyclone intensities.
abstract: We present HiRO-ACEv2 (High Resolution Output Ai2 Climate Emulator), a two-stage framework for
  AI emulation of the 3~km resolution X-SHiELD global storm-resolving model (GSRM), and highlight its
  ability to generate large ensembles of data for studying the characteristics of tropical cyclones and
  extreme events in high-resolution simulations at an inference computational cost over 300 times lower
  than that of traditional numerical GSRMs. HiRO-ACEv2 expands upon the precipitation-only HiRO-ACEv1
  model to generate coherent precipitation, 10~m winds, and sea level pressure outputs, enabling a broader
  range of events to be simulated at high-resolution. Fine-resolution predictions are generated by running
  an autoregressive emulator of coarsened X-SHiELD at 100 km, whose multivariate outputs are regionally
  downscaled to 3~km resolution via a separately trained diffusion model. Particular importance is placed
  on capturing the statistics of extreme events during the diffusion downscaling step. Our ability to
  match the tails of distributions and generate realistic-looking extreme events in both the `perfect
  prediction' case as well as in free-running emulator rollouts is improved via the use of multiple denoisers
  at inference time and several updates to the data sampling, noise sampling, and loss weighting during
  training. HiRO-ACEv2 closely matches the high-resolution reference distributions of precipitation and
  near-surface winds out to their 99.9999th percentile values, and broadly tracks the reference distribution
  of tropical cyclone intensities.
