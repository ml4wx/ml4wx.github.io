summary: Review of the interface between machine learning and data assimilation, covering emerging methods
  for combining model forecasts with observations in chaotic systems such as the atmosphere.
abstract: Data assimilation (DA) is the process of combining forecasts from a model with observations
  in order to optimally estimate the state of a system. This is critical for chaotic systems, such as
  the atmosphere, since if observations are not continually assimilated the model will quickly lose skill.
  DA is routinely performed (usually every 6 hours) at operational forecasting centres around the world.
  In this article we discuss the interface of machine learning (ML) and DA. This is still an emerging
  and quickly developing field, and this article tries to give an overview of some of the main topics
  and methods.
