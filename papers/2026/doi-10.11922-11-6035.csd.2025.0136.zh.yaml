summary: XGBoost downscales GPM IMERG to a 1-km daily precipitation dataset for 2001–2024 over Yanshan-Taihang,
  with MAE of 1.51 mm.
abstract: Yanshan-Taihang Mountains are located in the central and northern part of North China. The precipitation
  distribution in this mountainous area is influenced by various factors such as terrain and landform.
  While precipitation exhibits large spatial variability, extreme weather events occur frequently, showing
  significant spatial and temporal changes. This dataset is based on GPM IMERG V07 precipitation product,
  combined with multi-source remote sensing environmental variables (vegetation index, land surface temperature,
  slope, etc.), and a machine-learning-based statistical downscaling approach using XGBoost was employed
  to generate a dataset of 1-km annual precipitation over the Yanshan-Taihang Mountains in China from
  2001 to 2024; through geo-weighted proportional decomposition and sliding window techniques, multi-level
  downscaling from annual precipitation to monthly and daily scales was conducted, resulting in a dataset
  of 1 km monthly and daily precipitation over Yanshan-Taihang Mountains, thereby improving the spatial
  and temporal accuracy of regional precipitation estimates. The dataset spans from January 1, 2001 to
  December 31, 2024, covering a spatial extent of 36°–42°N and 113°–120°E. It is provided in GeoTIFF format
  under the WGS-84 coordinate system, with precipitation units in millimeters (mm). This dataset features
  high spatiotemporal resolution and reliability. After rigorous validation (MAE=1.51 mm、KGE=0.58), it
  can be applied to meteorological disaster assessment, ecological environment evaluation, and extreme
  climate monitoring and analysis. It provides related modeling studies with high-resolution and high-accuracy
  precipitation data support.
