summary: Gradient-boosted tree emulators of the MAR regional climate model reproduce Greenland surface
  melt (R2 up to 0.99) and use SHAP to attribute melt drivers.
abstract: 'Abstract. Surface melting over the Greenland Ice Sheet has become one of the dominant sources
  of contemporary and projected global sea-level rise, with melt rates accelerating over recent decades.
  Understanding those processes and feedbacks that control Greenland''s surface melt is central to improving
  projections of future mass loss and to clarifying how changes in surface energy balance components shape
  ice-sheet stability. To this aim, we developed MAR-IA – a machine-learning emulator of the MAR regional
  climate model – designed to emulate daily surface meltwater production over Greenland and to enable
  attribution of melt drivers. We implement two complementary emulators: a high-fidelity MAR-IA trained
  on full MAR surface energy balance fields and a reanalysis-compatible MAR-IA-ERA trained on variables
  available from products such as ERA5, thereby extending applicability beyond MAR-specific outputs. Both
  emulators employ gradient-boosted trees optimized via Bayesian hyperparameter search, achieving test-set
  performance up to R2 = 0.99 with low mean squared error and negligible bias relative to MAR meltwater
  outputs. We apply a SHAP-based explainable AI analysis to quantify how the importance of surface energy
  balance components – e.g., albedo, shortwave and longwave radiation, etc. – evolves across space and
  time over Greenland. Our results reveal robust spatial and temporal patterns in the dominance of radiative
  versus non-radiative drivers and demonstrate long-term trends in the relative contribution of temperature,
  shortwave radiation, and albedo to melt variability. These findings show that emulators can be used
  as powerful tools to complement regional climate models by enabling computationally efficient ensemble
  simulations and physically interpretable attribution of past and future Greenland surface melt. Development
  of regional climate models should go hand in hand with ML-based tools.'
