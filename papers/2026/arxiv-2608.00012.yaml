summary: Obshazard-bench evaluates multimodal foundation models on raw satellite sounding streams and
  ground data for real-time disaster anticipation and impact tasks, revealing substantial limitations.
abstract: 'Multimodal Large Language Models (MLLMs) are increasingly used to interpret Earth observation
  data, yet their capability to support real-world disaster emergency response remains insufficiently
  evaluated. Existing remote sensing benchmarks largely rely on static, post-hoc, and expert-processed
  products, such as gridded reanalysis data, which are difficult to align with operational disaster scenarios
  where hazards evolve rapidly and decisions must be made under strict time constraints. To bridge this
  gap, we introduce Obshazard-bench, a real-time, observation-driven benchmark for evaluating disaster
  intelligence in MLLMs. Unlike image-centric or post-event benchmarks, Obshazard-bench directly integrates
  raw, high-frequency satellite sounding streams from diverse satellite sensors with concurrent ground-station
  observations, historical disaster records, and socio-economic indicators, bypassing delayed expert-processing
  and physical-inversion pipelines. The benchmark covers 8 major disaster categories and 28 sub-categories
  across more than 60 countries, incorporating over 120 historically documented extreme-event cases and
  thousands of lifecycle-oriented VQA samples. Moreover, Obshazard-bench further defines a three-stage
  evaluation taxonomy aligned with the operational disaster workflow: Predictive Crisis Anticipation for
  pre-disaster risk detection and early forecasting, Active Evolution Reasoning for in-situ disaster tracking
  and termination prediction, and Multi-faceted Impact Quantification for post-disaster magnitude deduction,
  humanitarian burden estimation, and socio-economic impact assessment. Experiments on representative
  general-purpose and Earth-focused foundation models reveal substantial limitations in transforming raw
  multi-channel physical observations into temporally grounded and decision-relevant disaster reasoning.'
