summary: A crop model with machine learning at 1 km shows that arid Northwest China's crop controls shift
  from heat to water limitation by 2031–2050, with irrigation demand up 9–13%.
abstract: Understanding how climate warming alters the dominant meteorological controls on crop growth
  is critical for improving yield prediction and water resource management in arid regions. However, the
  transition in the underlying regulatory mechanisms remains insufficiently quantified. Here, we developed
  a multi-meteorological-factor crop-growth simulation framework that integrated a process-based crop
  model with machine-learning techniques. It aimed to quantify yield and irrigation requirements at high
  resolution (1 km) for both historical (2001–2020) and future (2031–2050) periods. Applied to maize and
  cotton across the arid zone of Northwest China, the framework captured regional heterogeneity in climate
  drivers and their evolving influences. Localized parameter calibration substantially improved model
  performance, with The Python Crop Simulation Environment (PCSE) achieving R² values above 0.84 for both
  yield and irrigation demand. Historically, crop growth exhibited a heat-dominated response, with minimum
  temperature emerging as the primary driver. Under future climate scenarios, precipitation and vapor
  pressure became the dominant controls, indicating a transition toward a water-dominated regime. Climate
  projections showed a 2.0% decline in maize yield but a 6.9% increase in cotton yield, alongside a 9.4–12.8%
  rise in irrigation demand for both crops. Spatially, high-yield, high-water-consumption zones increasingly
  cluster within well-irrigated oasis regions, whereas arid margins face intensified water deficits due
  to enhanced evapotranspiration. The results consistently pointed to a climate-driven shift pattern of
  crop-growth regulation from heat dominance to water limitation in the arid agricultural systems of Northwest
  China. It provided a mechanistic basis and actionable guidance for advancing precision irrigation and
  climate-adaptive agricultural management.
