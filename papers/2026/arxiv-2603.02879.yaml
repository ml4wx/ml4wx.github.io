summary: DAG-VAE embeds a causal graph in a VAE latent space to disentangle Pacific and Indian Ocean influences
  on East African short rains, validated against SST-replacement experiments.
abstract: Understanding teleconnections of large-scale modes of climate variability is relevant for seasonal
  predictability and support a dynamical understanding of climatic changes. While numerical model experiments
  are the most common approach for investigating counterfactual climate responses, their conclusions are
  subject to model biases. Data-driven approaches offer a complementary perspective. Deep learning can
  extract reduced-dimensional patterns but usually lacks causal interpretability, while causal methods
  can disentangle signals in the presence of confounding yet are typically based on simple indices. Treating
  dimensionality reduction and causal inference separately thereby risks losing the teleconnection signal
  of interest. This paper introduces DAG-VAE, a causal representation learning approach that embeds a
  physics-informed directed acyclic graph in the latent space of a variational autoencoder. Combining
  deep learning with causal inference, the method jointly learns nonlinear reduced representations of
  large-scale modes of variability and their causal interactions. We apply DAG-VAE to disentangle the
  influences of the Pacific and Indian Oceans on the short rains over the Greater Horn of Africa. Trained
  on seasonal hindcasts, the method identifies dynamically meaningful representations and recovers spatial
  response patterns consistent with SST-replacement experiments. Trained on reanalysis data, DAG-VAE identifies
  a different response pattern to direct influence of the tropical Pacific, highlighting potential model
  biases and the value of DAG-VAE as a complementary, data-driven approach for estimating spatial causal
  response patterns from observations. Finally, we demonstrate the ability of the method to generate data-driven
  counterfactuals of extreme short rain seasons, with potential applications for forecast-based early
  action and scenario planning.
