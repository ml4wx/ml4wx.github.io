summary: Hybrid machine-learning and physical retrieval of day and night layered cloud cover from geostationary
  satellites, validated against cloud radar with about 77% layer accuracy.
abstract: Layered cloud cover (LCC) describes the vertical distribution of cloud occurrence and is a key
  variable for assessing the radiation budget of the Earth-atmosphere system. However, ground-based radars
  have limited spatial coverage, while existing satellite cloud-cover products rarely provide both spatiotemporal
  continuity and high accuracy. Because nighttime satellite observations lack visible-channel information,
  conventional passive satellite remote sensing remains limited in providing day-night continuous LCC
  retrievals. In this study, we propose an infrared-based framework for retrieving large-scale day-night
  LCC from geostationary satellite observations. The framework first resolves cloud vertical structure
  using a hybrid machine learning and physical algorithm for day-night cloud-base height (CBH) retrieval,
  and then derives cloud cover in different vertical layers. Validation against active measurements from
  spaceborne and ground-based cloud radar demonstrates that the satellite-retrieved LCC captures cloud
  vertical distributions and their diurnal variations. The cloud-layer identification accuracies reach
  76.3% and 77.9% for daytime and nighttime, respectively, with corresponding Cohen’s kappa coefficients
  of 0.66 and 0.68. The primary source of algorithmic uncertainty is the low precision of low-cloud identification,
  which is constrained by objective factors and physical characteristics. The retrieved annual mean LCC
  fields reproduce major climatological features, including enhanced high and deep convective clouds over
  the tropical western Pacific and dominant low-cloud occurrence over the mid-latitude oceans. A case
  study of Typhoon Doksuri further shows that the 10 min LCC retrievals capture the vertical evolution
  of the typhoon cloud system during intensification, eyewall structural adjustment, landfall, and post-landfall
  decay. These results indicate that the proposed infrared-based retrieval framework provides a promising
  basis for constructing large-scale day-night LCC datasets and can support cloud-radiation studies, climate-model
  evaluation, and weather monitoring.
