summary: Latent world model predicts cloud-free observability of EO sequences from imagery and weather
  drivers, beating persistence on usability accuracy (0.77-0.89 vs 0.49-0.56).
abstract: 'The bottleneck of Earth Observation processing chains is not the arrival of new imagery but
  whether the surface is actually visible when the image arrives. We study this as an observability forecasting
  problem on EarthNet2021. Given recent multispectral imagery and exogenous weather drivers, the goal
  is to predict whether the next acquisition will be usable and, if not, when a usable view is likely
  to return. To do this, we adapt LeWorldModel, a joint-embedding predictive architecture world model,
  to cloud-aware Earth Observation sequences. The final pipeline converts raw minicubes into episodic
  HDF5 sequences with five image channels (blue, green, red, near-infrared, cloud mask) and eight meteorological
  and calendar covariates. The resulting model has 18.0M trainable parameters and is trained from scratch
  on 23,904 training episodes. The trained leWorldModel is evaluated under a locked protocol: linear probes
  are fit on train only, calibration choices are set on an internal validation split, and the fitted heads
  are then frozen for valsplit, IID, OOD, and extreme evaluation. On the full frozen-bundle observability
  benchmark, LeWorldModel consistently outperforms persistence. For next-step usability, balanced accuracy
  ranges from 0.769 to 0.887, compared with 0.493 to 0.556 for persistence. For exact first-usable-horizon
  prediction, accuracy ranges from 0.602 to 0.806, compared with 0.120 to 0.369 for persistence. Against
  a frozen LightGBM baseline fit on the same training windows, LeWorldModel is better on continuous clear/cloud
  regression and on exact recovery timing on valsplit, IID, and extreme, while LightGBM is stronger on
  the simpler binary any-usable-within-six task and is more robust on OOD. In separate sampled diagnostic
  analyses, LeWM also produces strong ranking-based anomaly signals under synthetic temporal inconsistencies.'
