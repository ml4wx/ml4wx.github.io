summary: Transformer daily precipitation quantile forecasts feed a risk-state decision model for drought-flood
  transitions, with temporally coordinated decisions outperforming independent ones by 10.17%.
abstract: Rapid drought–flood transitions create short-term conflicts between drought mitigation and flood-control
  measures, while fixed decision modes may not adapt as risk evolves. This study develops a prediction–decision
  coupling framework that integrates Transformer-based precipitation forecasting with the NK model to
  evaluate the synergistic performance of DRR measure portfolios under evolving risks. The Transformer
  model generates daily precipitation quantile forecasts from historical meteorological data and employs
  the transition risk index (TRI) to characterize probabilistic DFAA risk states. These states are incorporated
  into the NK model to compare independent decision-making (IDM), continuously coordinated decision-making
  (CDM), and temporally coordinated decision-making (TCDM). A case study of Huangshan City identifies
  increasing drought-to-flood risk in mid-June 2024 and a weak flood-to-drought signal in mid-July. Under
  non-modular dependencies, TCDM exceeds IDM and CDM by 10.17% and 2.00%, respectively, in cost-adjusted
  performance. Sensitivity analyses indicate that this advantage depends on coordination and switching
  costs. The results suggest that coordination intensity and measure priority should vary with risk phase,
  transition direction, measure dependencies, and forecast uncertainty, providing portfolio-level support
  for adaptive drought–flood risk reduction.
