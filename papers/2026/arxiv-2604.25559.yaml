summary: Extends ECMWF's AIFS to jointly forecast atmosphere, ocean waves, and sea ice, giving about one
  extra day of marine skill and better medium-range weather forecasts.
abstract: Machine-learning (ML) models, such as the AIFS at the ECMWF, have revolutionised weather forecasting
  in recent years. We present an extension of the AIFS that jointly models the atmosphere and surface
  ocean, including ocean waves and sea ice. The primary objective of this extension is to enhance machine-learning
  medium-range forecasting and enable new use cases by expanding the weather state to better capture coupled
  surface processes. Our approach departs from traditional numerical models by not having two separate
  models for the atmosphere and marine components. The joint model instead learns correlations across
  the entire atmosphere-ocean interface in a component-agnostic way, and can exploit the expressive capacity
  of ML architectures to learn cross-component relationships directly from the data. We leverage tailored
  and targeted datasets and solve model design challenges such as missing values over land, multi-scale
  temporal dynamics, and physical realism of forecast fields and demonstrate the utility of loss scaling
  in guiding the learning process. We evaluate how representing the surface ocean affects medium-range
  weather forecasts. We also assess the model's ability to predict surface-ocean fields, including wave
  swell and tropical-cyclone cold wakes. For nearly all evaluated marine variables, we observe an improvement
  of approximately one day in forecast skill at medium-range lead times compared to physics-based models.
  Furthermore, we demonstrate that the model is robust to idealised initial conditions outside the training
  distribution and responds to them in a physically consistent way. Overall, our findings suggest that
  the joint AIFS modelling approach offers significant potential for combined atmosphere-ocean forecasting.
  Our work provides a solid foundation for future development of data-driven coupled Earth system models
  with greater flexibility and physical fidelity.
