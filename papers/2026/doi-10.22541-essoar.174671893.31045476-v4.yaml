summary: CV-GAN emulates GCM global climate variability, including sea surface temperature over 500 years,
  and reproduces many variables more accurately than CMIP6 models.
abstract: 'Key Points:• We propose CV-GAN: a generative model that can emulate the worldwide climate simulation
  by classical General Circulation Models (GCM) with much less computational complexity.• The proposed
  model can emulate sea surface temperature variability upto 500 years.• The model is further fine-tuned
  with observational data through transfer learning, enabling it to adapt to the observed domain while
  retaining the variability learned from the GCM.• The CV-GAN model can reproduce many global climate
  variables with higher accuracy than CMIP6 models.'
