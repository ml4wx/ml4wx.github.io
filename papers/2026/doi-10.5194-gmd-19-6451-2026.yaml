summary: JCM is an open-source differentiable JAX atmospheric model coupling SPEEDY physics to the Dinosaur
  core, enabling gradient-based calibration and ML scheme substitution, validated against Fortran SPEEDY
  at T31.
abstract: Abstract. In this paper we present version 1.0 of the JAX Circulation Model (JCM). JCM is an
  open-source, differentiable atmospheric model built in Python using the JAX numerical library. Earth
  system modeling is rapidly evolving, particularly through hybrid approaches that combine known dynamics
  with data-driven components. However, the training and validation of hybrid methods in traditional models
  remain difficult due to the absence of gradients and the complexity of legacy code. Differentiable models
  written in modern frameworks offer a path forward. JCM couples physics parameterizations to the Dinosaur
  dynamical core through a flexible interface that makes substitution of other schemes easy. The default
  parameterization scheme uses the SPEEDY (Simplified Parameterizations, primitivE-Equation DYnamics)
  intermediate-complexity physics scheme. This modularity supports benchmarking across physical and machine-learned
  schemes, with direct access to gradients for sensitivity analysis, calibration, and online learning.
  We show validation of JCM against the original Fortran SPEEDY code at T31 resolution. We also highlight
  JCM's differentiability and efficiency and outline plans for extending the framework to a differentiable
  Earth system model. JCM provides a lightweight yet expressive platform for accelerating research in
  climate modeling.
