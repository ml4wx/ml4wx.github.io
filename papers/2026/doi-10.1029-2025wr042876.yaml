summary: CML-RainCDM, a physics-constrained conditional diffusion model, reconstructs gridded rainfall
  from microwave link attenuation with better accuracy than interpolation and deep baselines.
abstract: Abstract High‐resolution rainfall field reconstruction is a critical task in hydrological applications,
  with significant implications for flood forecasting, water resource management, and urban resilience.
  Conventional remote sensing instruments such as rain gauges and weather radars suffer from sparse coverage
  or high operational costs, while commercial microwave links (CMLs) provide a dense, low‐cost, and opportunistic
  ground‐based remote sensing network. However, deriving gridded rainfall fields from path‐averaged CML
  attenuation constitutes an ill‐posed inversion problem. To overcome this challenge, we propose CML‐RainCDM,
  a physics‐informed conditional diffusion framework that integrates link encoding, implicit spatial structure
  prior injection, and a forward rain attenuation constraint. By jointly leveraging spatial priors and
  physical consistency, the model achieves more accurate rainfall intensity estimation and improved preservation
  of fine‐scale spatial structures compared with interpolation, statistical, and deep learning baselines.
  Sensitivity analyses further demonstrate its robustness in reconstructing heavy rainfall events, although
  extreme intensities remain difficult to capture. This study highlights the potential of opportunistic
  remote sensing via CMLs combined with generative diffusion models for practical, high‐resolution precipitation
  monitoring and environmental remote sensing applications.
