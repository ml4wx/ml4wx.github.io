summary: Learns the forward operator from paired data and normalizes guidance gradients per channel for
  diffusion-based downscaling, so one prior adapts across reanalysis sources and variables.
abstract: 'Statistical downscaling is the task of reconstructing high-resolution meteorological fields
  from coarse inputs. A principled approach formulates downscaling as a Bayesian inverse problem, using
  a diffusion prior over high-resolution fields and incorporating the coarse field only at inference through
  a likelihood. This decouples the prior from the coarse source, allowing one pretrained model to adapt
  to different sources. However, two challenges limit this flexibility: (1) when coarse and target fields
  come from different reanalysis systems, no fixed coarsening operator can capture their relationship;
  and (2) guidance gradients can differ by orders of magnitude across variables, making a single guidance
  strength ineffective. This paper addresses both challenges within the guidance loop, leaving the prior
  unchanged. We learn the forward operator from paired data and normalize the gradient per channel. We
  show that this normalization corresponds to steepest descent under a block-max norm, allowing a single
  guidance strength across variables. Our code is publicly available at https://github.com/CarloSaccardi/operator-aware-weather-downscaling.'
