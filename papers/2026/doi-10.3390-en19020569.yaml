summary: Hybrid linear regression plus support vector quantile regression corrects NWP-derived irradiance
  and yields day-ahead probabilistic PV power forecasts for a 960 kWp plant.
abstract: The increasing penetration of solar photovoltaic (PV) generation into power systems poses significant
  operational and planning integration challenges due to the high variability in solar irradiance, which
  makes PV power forecasting difficult—particularly in the short term. These fluctuations originate from
  atmospheric dynamics that are only partially captured by numerical weather prediction (NWP) models.
  In this context, probabilistic forecasting has emerged as a state-of-the-art approach, providing central
  estimates and additional quantification of uncertainty for decision-making under risk conditions. This
  work proposes a novel hybrid methodology for day-ahead, hourly resolution point, and probabilistic PV
  power forecasting. The approach integrates a multiple linear regression (LM) model to predict global
  tilted irradiance (GTI) from NWP-derived variables, followed by support vector quantile regression (SVQR)
  applied to the residuals to correct systematic errors and derive GTI quantile forecasts and a linear
  mapping to PV power quantiles. Robust data preprocessing procedures—including outlier filtering, smoothing,
  gap filling, and clustering—ensured consistency. The hybrid model was applied to a 960 kWp PV plant
  in southern Italy and outperformed benchmarks in terms of interval coverage and sharpness while maintaining
  accurate central estimates. The results confirm the effectiveness of hybrid risk-informed modeling in
  capturing forecast uncertainty and supporting reliable, data-driven operational planning in renewable
  energy systems.
