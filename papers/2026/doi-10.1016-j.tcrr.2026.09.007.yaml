summary: Random forest estimates tropical cyclone wind fields from PATMOS-x cloud and atmosphere satellite
  data, reaching RMSE below 2.6 m/s and correlation 0.80.
abstract: Machine learning algorithms are now widely applied to estimate tropical cyclone (TC) tracks
  and intensities. However, their application to TC wind field estimation remains largely unexplored.
  Furthermore, traditional satellite-based methods for estimating TC wind fields require improvement in
  accuracy. Therefore, in this study, a new method for estimating TC wind fields and intensities is proposed
  by integrating the Random Forest algorithm with multiple datasets. Specifically, the wind speed data
  from Advanced Microwave Scanning Radiometer (AMSR) TC-winds product is used as the dependent variable,
  while 13 cloud and atmospheric properties from the Pathfinder Atmospheres Extended (PATMOS-x) dataset
  are independent variables. This approach is motivated by the critical role of cloud properties in TC
  structural changes, which are closely linked to variations in wind fields and intensities. It is found
  that the total precipitable water, 0.65-μm visible reflectance, and the 6.7-μm brightness temperature
  are the top three most important variables for TC wind estimation. The established random forest model
  demonstrates promising performance, achieving a root mean square error below 2.6 m s −1 and a correlation
  coefficient of 0.80. The TC intensity extracted from the estimated wind field is also well consistent
  with the true value from IBTrACS (International Best Track Archive for Climate Stewardship).
