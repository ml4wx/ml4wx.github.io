summary: Huayu-Global is a deep-learning retrieval system that fuses three geostationary satellite streams
  into 30-minute quasi-global precipitation, outperforming real-time products against station records.
abstract: 'Satellite precipitation products face a persistent trade-off: real-time estimates are timely
  but less accurate, whereas the most reliable products are often released months after observation. This
  delay keeps high-quality precipitation information outside the decision window for flood warning and
  disaster response. Here we report Huayu-Global, a cross-constellation deep-learning system that combines
  three geostationary sensor streams from five satellites through a common retrieval framework and generates
  coherent quasi-global precipitation fields every thirty minutes. Across more than a million independent
  station records from two periods outside the training years, Huayu-Global improves event detection and
  precipitation-amount estimation relative to the real-time products evaluated and reaches delayed-product-level
  skill in key metrics. Huayu-Global therefore turns operational geostationary observations into a timely,
  high-skill precipitation layer for flood forecasting, water management and disaster response. Its cross-constellation
  design also provides a scalable foundation for incorporating future geostationary missions into hydrological
  and weather-prediction systems.'
