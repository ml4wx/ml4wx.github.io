summary: Evaluates 2024 AI weather models, finding them better than ECMWF IFS for western North Pacific
  tropical cyclone genesis and matching it on Hong Kong daily rainfall.
abstract: Abstract This study examines the performance of state‐of‐the‐art artificial intelligence (AI)
  weather forecasting models in 2024. For tropical cyclone genesis forecasts in the western North Pacific,
  AI models generally perform better than the physics‐based European Centre for Medium‐Range Weather Forecasts
  (ECMWF) Integrated Forecasting System (IFS). Furthermore, higher‐resolution AI models, such as a fine‐tuned
  version of Pangu‐Weather, improved anomaly correlation scores and Fengwu‐GHR produced more realistic
  synoptic‐scale structures for medium‐range forecasts compared with lower‐resolution versions. Moreover,
  certain AI models could match or outperform ECMWF IFS on daily rainfall forecasts over Hong Kong, especially
  for heavier rainfall events. These findings highlight the potential of AI‐based methods for operational
  applications on high‐impact weather.
