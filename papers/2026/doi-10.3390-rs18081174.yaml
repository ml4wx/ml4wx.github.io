summary: RBF neural network retrieves FY-4 GIIRS temperature and humidity profiles, cutting clear-sky
  temperature RMSE about 39% versus background.
abstract: Atmospheric temperature and humidity profiles are essential for numerical weather prediction
  and severe weather monitoring. To effectively utilize data from the Geostationary Interferometric Infrared
  Sounder (GIIRS) onboard the FY-4 satellite, this study proposes a retrieval method based on a radial
  basis function (RBF) neural network, which integrates numerical model background profiles with GIIRS
  simulated radiance errors to construct a mapping from these two inputs to background profile errors.
  A channel selection strategy is developed using correlations between background errors and radiance
  errors to identify channels sensitive to temperature and humidity variations at different pressure levels.
  Experiments are conducted using data from land stations in Zhejiang Province, China, from August to
  December 2024, including 829 clear-sky and 2109 cloudy profiles. Under clear-sky conditions, the method
  reduces temperature and humidity root mean square error (RMSE) by approximately 39% and 22.3% compared
  to background profiles. Under cloudy conditions, despite severe radiation interference, RMSE reductions
  of 38.5% for temperature and 15.3% for humidity are achieved, with notable improvements below 900 hPa
  and above 750 hPa for humidity. Compared with the multilayer perceptron (MLP) method, RBF shows superior
  performance under all test conditions, especially in cloudy-sky humidity retrieval. The proposed approach
  provides an effective, physically constrained framework for operational GIIRS data application in temperature
  and humidity retrieval.
