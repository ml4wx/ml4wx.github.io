summary: Random Forest and SHAP on NASA POWER data identify soil moisture and humidity as main drivers
  of extreme rainfall in Barishal, with AUC 0.976.
abstract: In the context of assessing climate risks in vulnerable coastal areas like Barishal, Bangladesh,
  it is important to understand the determinants of extreme rainfall. Current research mainly focuses
  on mean rainfall patterns, with limited emphasis on extremes and land–atmosphere interactions. This
  paper addresses this gap by creating a unified statistical and machine learning framework to identify
  the key drivers of extreme precipitation. Monthly climatic data for 1984–2025 (N=504) were obtained
  from the NASA POWER database, including temperature, humidity, wind speed, solar radiation, and soil
  moisture. Extreme rainfall events were defined using the 90th percentile threshold. Logistic regression
  and Random Forest models were then employed to identify both linear and nonlinear relationships, while
  SHAP was used to evaluate the importance of each variable. The results show that temperature (β=3.501,
  p<0.05) and soil moisture (β=49.788, p<0.001) significantly increase the likelihood of extreme rainfall,
  whereas solar radiation (β=−1.064, p<0.001) has a negative effect. The Random Forest model outperforms
  logistic regression (AUC=0.976 vs. 0.958), achieving 85.6% accuracy and a Kappa value of 0.68. SHAP
  analysis indicates that soil moisture is the most influential predictor, followed by humidity and temperature.
  Overall, the findings provide a robust and interpretable framework for understanding the occurrence
  of extreme rainfall, which can support improved climate risk management strategies.
