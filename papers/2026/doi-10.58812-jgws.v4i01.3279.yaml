summary: A VOSviewer bibliometric analysis of 2015-2025 Scopus literature on AI for extreme weather prediction,
  showing growth and a shift toward impacts and disaster management.
abstract: Perkembangan teknologi kecerdasan artifisial telah memberikan kontribusi signifikan dalam meningkatkan
  kemampuan prediksi cuaca, khususnya dalam menghadapi fenomena cuaca ekstrem yang semakin meningkat akibat
  perubahan iklim global. Penelitian ini bertujuan untuk memetakan tren perkembangan penelitian mengenai
  pemanfaatan kecerdasan artifisial dalam prediksi cuaca ekstrem melalui pendekatan analisis bibliometrik.
  Data penelitian diperoleh dari basis data Scopus dengan rentang publikasi tahun 2015–2025, kemudian
  dianalisis menggunakan perangkat lunak VOSviewer untuk mengidentifikasi pola kolaborasi penulis, institusi,
  negara, serta hubungan antar kata kunci penelitian. Hasil analisis menunjukkan bahwa publikasi dalam
  bidang ini mengalami peningkatan yang signifikan dan didominasi oleh tema penelitian seperti artificial
  intelligence, weather forecasting, machine learning, dan extreme weather. Jaringan kolaborasi menunjukkan
  bahwa beberapa negara seperti Tiongkok, Amerika Serikat, dan India memiliki kontribusi yang dominan
  dalam pengembangan penelitian di bidang ini, dengan kolaborasi internasional yang cukup kuat. Selain
  itu, analisis kata kunci mengungkapkan adanya pergeseran fokus penelitian dari pengembangan algoritma
  kecerdasan artifisial menuju penerapan teknologi tersebut untuk memahami dampak perubahan iklim, memprediksi
  kejadian cuaca ekstrem, serta mendukung sistem mitigasi bencana dan manajemen risiko. Temuan penelitian
  ini menunjukkan bahwa kecerdasan artifisial memiliki peran strategis dalam pengembangan sistem prediksi
  cuaca modern yang lebih akurat dan adaptif terhadap dinamika lingkungan global.
