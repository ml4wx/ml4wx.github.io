summary: LSTM, GRU, Transformer and CNN-LSTM models forecast global temperature anomalies from CO2 and
  sunspot inputs; CNN-LSTM reaches R2 0.68, with weakly supported 2025-2035 projections.
abstract: 'In this paper, a multimodal machine learning approach for predicting global surface temperatures
  is proposed. The dataset consists of Berkeley Earth temperature anomalies for 144 years (from 1880 to
  2024), NOAA Mauna Loa atmospheric CO2, and SILSO solar sunspots data. This paper builds upon the latest
  developments in data-driven climate modeling [1] to make four primary contributions: (i) a multi-panel
  exploratory data analysis (EDA) that includes decomposition into seasonality, checking for stationarity,
  autoregression, and cross-variable correlations; (ii) Huber loss training dynamics of LSTM, Bi-LSTM,
  GRU, Transformer, and CNN-LSTM; (iii) residual diagnostics showing that CNN-LSTM predictions follow
  a Gaussian distribution; and (iv) model-wise ten-year ensemble predictions (2025-2035) compared to nine
  other models. The best result in terms of deep learning is shown by CNN-LSTM model (MAE = 0.0944°C,
  RMSE = 0.1175°C, R2 = 0.6781, Murphy Skill Score = 0.7462). The mean forecast of ensembles becomes stable
  at 1.25-1.35°C by 2034 and stays below the limit of 1.5°C within the current assumptions made in this
  paper; however, this forecast is not to be considered a reliable result, as it does not include future
  emissions, aerosols, and uncertainty.'
