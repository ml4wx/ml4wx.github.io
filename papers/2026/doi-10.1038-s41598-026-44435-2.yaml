summary: Radar precipitation nowcasting is fused with multi-sensor perception for autonomous vehicles,
  raising detection precision by 31.2% under adverse precipitation.
abstract: 'This paper presents a precipitation-aware sensor ecosystem modelling framework designed to
  enhance autonomous vehicle (AV) navigation under adverse weather. By integrating spatiotemporal radar-based
  precipitation nowcasting, deep neural network-based sensor degradation modelling, and adaptive probabilistic
  sensor fusion, the system dynamically adjusts LiDAR, RADAR, and camera inputs according to precipitation
  severity and sensor reliability. The proposed framework is evaluated against a fixed-weight baseline
  detector with uniform multi-sensor fusion under identical training and hardware conditions. On 4.5 TB
  of multi-modal sensor data collected over 320 driving hours across five precipitation conditions, the
  framework achieved a 31.2% increase in detection precision, a 27.8% reduction in false positives, and
  a reduction in mean perception latency from 51 to 43 ms. Radar-based rainfall estimation yielded a mean
  absolute error of 0.42 mm/h with [Formula: see text]. Key metrics are reported as mean ± standard deviation
  over repeated evaluation runs and are further summarized with class-wise Average Precision and statistical
  variability in the Results section. The dataset used in this study is a custom multi-modal dataset collected
  during the project and is available from the authors upon reasonable request.'
