summary: Global 0.25-degree ERA5-derived dataset labels heatwaves, cold and heavy-rain events, extreme
  wind and drought with severity scores, 1981-2022, for evaluating ML forecasts.
abstract: Weather forecasting models commonly use the average forecast skill for short-range forecasts.
  However, it does not necessarily imply skill in the tails of the weather distribution. Evaluating tail
  events requires a consistently defined target with broad spatial and temporal coverage. Disaster catalogs
  record societal consequences, but are sparse and reporting-dependent; climatological tails describe
  unusual weather without necessarily implying harm. We present TailWeather, a global 0.25-degree, land-only
  dataset derived from ERA5, covering 1981-2022 and extending into January 2023. It labels heatwaves,
  cold waves, heavy precipitation, and extreme wind daily, and meteorological drought monthly. Each event
  has an ordinal severity tier and a numerical intensity score referenced to the local 1991-2020 climate.
  The scores support alternative thresholds within their stored resolution and valid domain. Comparison
  with documented disasters shows greater impact enrichment towards stricter tails, with differences among
  hazards and substantial gaps in catalog coverage. Forecast examples illustrate how low average errors
  can coexist with weak event detection, particularly for wind. TailWeather provides a reusable physical
  target for studying and evaluating extremes, while complementing the information in disaster catalogs.
