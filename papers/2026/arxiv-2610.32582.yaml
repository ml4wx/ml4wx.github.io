summary: Batched online learning of neural model-error corrections within ECMWF's IFS 4D-Var improves
  out-of-sample hybrid forecast skill, where sequential training did not generalize.
abstract: Hybrid forecasting systems combining machine learning and numerical weather prediction offer
  a promising route toward improved forecast skill while preserving physical consistency. In this study,
  we investigate online learning of state-dependent model-error corrections within the Integrated Forecasting
  System using 4D-Var. Building on previous work, we represent model error using a neural network embedded
  within the forecast model and trained from observations through the data assimilation cycle. First,
  we introduce a targeted variant of neural-network 4D-Var in which only the neural-network parameters
  are estimated, while the atmospheric state is provided by a precomputed analysis. We then propose a
  batched extension that processes assimilation windows in random order and averages parameter increments
  over multiple windows, drawing inspiration from mini-batch stochastic optimization. Experiments are
  conducted with the Integrated Forecasting System of the European Centre for Medium-Range Weather Forecasts
  at an intermediate resolution. Sequential online learning substantially improves forecasts within the
  training period, with error reductions exceeding 10%in some cases. However, these improvements fail
  to generalize to unseen data. In contrast, the proposed batched formulation produces hybrid models that
  consistently improve forecast skill in out-of-sample experiments. Larger batch sizes accelerate convergence
  and improve robustness by reducing the noise of parameter updates. Diagnostics further show that the
  online-trained corrections preserve realistic forecast variability and do not improve skill through
  artificial smoothing. These results demonstrate that the formulation of the online learning problem
  is critical for generalisation and establish batched online training as a promising framework for hybrid
  machine-learning/data-assimilation systems.
