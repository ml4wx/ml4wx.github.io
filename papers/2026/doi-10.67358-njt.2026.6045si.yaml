summary: Systematic review of 55 studies on deep learning for cloud segmentation, classification, rainfall
  and solar irradiance forecasting.
abstract: 'Clouds are the primary agents of weather systems, climate regulation, and renewable energy
  forecasting. In the past, traditional methods which relied on handcrafted features and statistical-based
  modeling have struggled with consistency, scalability, and generalizability in complex atmospheric conditions.
  Recent developments in deep learning methodologies have revolutionized cloud analysis, facilitating
  accurate cloud segmentation, classification, and forecasting through advanced data-driven representation
  learning frameworks. A systematic review of fifty-five peer-reviewed studies published between 2017
  and 2025 is conducted, with the literature organized into six methodological research streams: semantic
  segmentation for clouds, classification of clouds, forecasting rainfall, forecasting solar irradiance,
  hybrid optimization models for cloud analysis, and surveying contributions to research in this field.
  Semantic segmentation methods have used convolutions neural networks (CNNs), semi-supervised learning,
  and CNN-physics hybrid approaches, which typically utilized evaluations based on the metrics of intersection
  over union (IoU), dice, and pixel accuracy. Classification methods employed in this stream utilized
  CNN, deep neural networks (DNN), transfer learning, and transformers utilized accuracy, precision, recall,
  and F1-scores, but these methods have important limitations when working with datasets that lack balance/varied
  real-time application. Methods for predicting rain and peak sunlight rely on sequential base prediction
  methods (CNN-RNN) with enhanced predictability while continuing to meet computing resource performance
  limitations and geographic area restrictions. Evaluation highlights show the standard measurement for
  segmentation were IoU and Dice metrics, while RMSE and R² were common in Cloud Analysis, rainfall, and
  solar data analysis. The majority of studies relied on datasets captured from ground-based all-sky imagers
  or historical datasets, while some studies shared methods of synthetic data or data augmentation methods
  to avoid issues of data scarcity. Assessment for future directions and needs for work in the cloud analysis
  domain identified the need for efficient, interpretability, and robust hybrid analysis models.'
