summary: Attention-augmented GRU and Bi-LSTM encoder-decoders forecast temperature, humidity and wind
  speed, with the best attention variant identified for each parameter.
abstract: Short-term weather forecasting refers to the prediction of meteorological conditions over a
  relatively short period. The development of short-term weather forecasting is assessed as having the
  potential to facilitate the development of dynamic models or methods within the local weather forecasting
  system. In this research, we propose the incorporation of an attention mechanism into the encoder-decoder
  architecture of Recurrent Neural Network (RNN)-based models. The purpose of adding this attention mechanism
  is to enable the model to acquire knowledge regarding the interdependencies among weather parameters,
  thereby facilitating the capture of abrupt weather fluctuations. This research specifically focuses
  on the prediction of several weather parameters, including temperature, relative humidity, and wind
  speed. In this study, a performance comparison was conducted among several types of RNN-based models,
  namely Long Short-Term Memory (LSTM), Gated Recurrent Unit (GRU), Bidirectional LSTM (Bi-LSTM), Bidirectional
  GRU (Bi-GRU), and the combination of each RNN model with an attention mechanism. The research results
  indicate that the model with the best performance is the Attention GRU for temperature prediction, with
  an RMSE value of 0.02681. For relative humidity prediction, the Attention Bi-LSTM performs the best
  with an RMSE value of 0.18343, and the Attention Bi-GRU achieves the highest performance for wind speed
  prediction with an RMSE value of 0.00395. The outcomes of this investigation demonstrate the efficacy
  of the attention mechanism in enhancing the accuracy of several encoder-decoder RNN models.
