summary: A Video Swin Transformer U-Net forecasts next-day Canadian wildfire spread from three-day sequences
  of public meteorological and environmental data, trained on 2014-2023 events.
abstract: 'Background: Wildfires in Canada present increasing threats to ecosystems, communities, and
  infrastructure, demanding accurate forecasting tools to aid mitigation efforts. Existing models often
  lack scalability or fail to capture temporal dynamics effectively. Aims: This study aims to develop
  a deep learning framework tailored to Canadian wildfire spread prediction that captures spatio-temporal
  patterns in environmental data. Methods: We propose a U-Net architecture integrating a Video Swin Transformer
  encoder with a convolutional decoder to model three-day sequences of meteorological and environmental
  variables. Data are exclusively sourced from public repositories via Google Earth Engine, ensuring transparency
  and scalability. The model is trained and tested on a curated dataset of major Canadian wildfire events
  from 2014 to 2023. Key results: Our approach achieves strong predictive performance by effectively leveraging
  spatio-temporal attention to forecast next-day fire incidence maps. Conclusions: The model successfully
  captures complex wildfire dynamics unique to Canada''s landscape and temporal variability. Implications:
  This framework paves the way for advanced spatio-temporal wildfire forecasting research and operational
  applications using publicly accessible datasets.'
