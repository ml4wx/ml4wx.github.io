summary: Benchmarks conformal intervals for gridded 2 m temperature; near-nominal marginal coverage hides
  3 to 10 times excess day-to-day dispersion of covered cells.
abstract: 'Conformal prediction gives finite-sample, distribution-free marginal coverage and has begun
  to be applied to gridded weather forecasts. Marginal coverage concerns the long-run fraction of covered
  points at a location, not how coverage behaves jointly across space and time on a given day. I benchmark
  eight interval-construction procedures (Gaussian, pooled and per-cell split conformal, per-season, adaptive
  conformal inference and rolling windows) for gridded 2 m temperature forecasts at eight lead times from
  6 hours to 10 days, using ERA5 at 5.625 degree resolution, a deliberately modest convolutional forecaster
  and ECMWF''s operational HRES, with calibration in 2017-2018 and testing in 2019-2021. Alongside coverage,
  width and interval score, I report dependence diagnostics: a spatial overdispersion index, quantiles
  of daily spatial coverage and miss persistence relative to a shuffled-days null. Per-cell methods reach
  near-nominal marginal coverage, yet the day-to-day variance of the fraction of cells covered is roughly
  3 to 10 times what independent cells would give, and misses cluster in time; both effects grow with
  lead time for the CNN, also appear for HRES, and are shared by all methods. An oracle that divides each
  day''s normalised errors by that day''s mean removes 81 to 92 percent of the excess dispersion for the
  CNN and 93 to 98 percent for HRES, so days of large errors across much of the grid account for most
  of it. A day-scale predicted from seasonal terms and already-verified errors lowers the overdispersion
  index without widening intervals but improves interval score by at most 0.6 percent; on HRES from 12
  hours to 3 days it has the lowest overdispersion index while ACI or season-conditional calibration has
  the best interval score, so no method is best on both. The study covers one variable, one coarse grid,
  a reanalysis target and two forecasters.'
