summary: Android app pairing an LSTM forecaster with Random Forest/XGBoost disaster classifiers reports
  93.8% accuracy and 3.4 s alert latency against conventional baselines.
abstract: Abstract Climate change has intensified the frequency and severity of natural calamities such
  as floods, cloudbursts, and landslides, making accurate, real-time weather prediction and early-warning
  systems an urgent public-safety priority. This paper presents the AI-Based Climate Forecast Prediction
  System, a comprehensive Android application that integrates Machine Learning (ML), Artificial Intelligence
  (AI), and cloud-based services to deliver precise live weather forecasts and intelligent disaster alerts.
  The proposed system is developed using Java and XML on the Android platform and leverages the OpenWeather
  API for real-time meteorological data acquisition (temperature, humidity, atmospheric pressure, wind
  speed, and precipitation) along with Firebase Realtime Database for low-latency synchronization across
  devices. A hybrid predictive engine combining Long ShortTerm Memory (LSTM) networks for time-series
  forecasting and Random Forest / XGBoost classifiers for disaster classification is trained on historical
  climate datasets and continuously refined through adaptive learning. Comparative experiments against
  six conventional models demonstrate that the proposed hybrid LSTMRandom Forest pipeline achieves an
  overall accuracy of 93.8 %, recall of 94.2 %, and an ROC-AUC of 0.948, significantly outperforming baseline
  approaches. To enhance disaster preparedness, a multi-tier notification protocol delivers geo-fenced
  push alerts to users and rescue teams via Firebase Cloud Messaging, with a measured mean endto-end latency
  of approximately 3.4 seconds. An NLP-driven AI chatbot, built on Dialogflow, supplements the platform
  by providing personalized safety tips and conversational emergency guidance. The system is designed
  to be scalable, energy-efficient, and deployable across diverse geographic regions, contributing to
  a measurable reduction in casualty risk through timely, actionable intelligence. Keywords Artificial
  Intelligence, Machine Learning, LSTM, Random Forest, Climate Forecasting, Disaster Prediction, Android
  Application, Firebase Realtime Database, OpenWeather API, NLP Chatbot, Early Warning System, Flood Prediction,
  Cloudburst, Landslide.
