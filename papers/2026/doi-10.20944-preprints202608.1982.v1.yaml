summary: A streamlined Informer model forecasts Niño 3.4 up to 36 months ahead, reaching ACC 0.46 at 18
  months and beating a CNN benchmark at matched lead times.
abstract: Reliable prediction of the El Niño–Southern Oscillation (ENSO) at multi-year lead times remains
  challenging because forecast skill generally declines beyond 12–18 months. This study presents a streamlined
  Informer-based framework designed to predict the Niño 3.4 index up to 36 months in advance using one-dimensional
  climate time series. The proposed model was developed following an analysis of the earlier Multimodal
  ENSO Forecast framework, which showed that most of the long-lead predictive skill originated from the
  time-series branch, whereas the spatial branch added substantial computational cost with limited benefit.
  Historical simulations from CMIP5 and selected CMIP6 models were used for training, followed by calibration
  with GODAS observations from 1980 to 2000 and independent validation over 2001–2020. The model achieved
  anomaly correlation coefficient values of 0.92, 0.75, 0.56, 0.46, 0.48, and 0.41 at lead times of 1,
  6, 12, 18, 24, and 30 months, respectively. At directly comparable lead times, its performance was consistently
  higher than that of the CNN benchmark, with the largest difference observed at 18 months. The model
  also maintained useful predictive skill at extended lead times and showed reduced sensitivity to the
  spring predictability barrier. In addition, the simplified architecture required substantially less
  computational effort than the original multimodal framework and supported inference on a standard CPU.
  These results demonstrate that an efficiently optimized time-series architecture, combined with climate-model-based
  data augmentation, can provide competitive and computationally practical ENSO forecasts at multi-year
  horizons.
