summary: TerraNova is a foundation model fusing 512 gridded Earth-system fields with national indicators,
  using evidential decoders and contrastive alignment across geometries.
abstract: 'A defining problem of the Anthropocene is to model the physical Earth and human societies as
  one coupled system, yet no learned representation spans their observational breadth. We argue the obstacle
  is geometric: the physical Earth is measured as continuous fields that ignore political borders, whereas
  societies are reported for administrative units. Earth-system foundation models serve the first geometry;
  coupling it to the second has required lossy averaging over borders. We introduce TerraNova, a foundation
  model trained on 1,024 physical and societal records in their native geometries: 512 gridded Earth-system
  fields and 512 national indicators. Dedicated encoders represent location, country, time and task, cross-modal
  transformers fuse them into a shared spatiotemporal state, and a hypernetwork generates a per-query
  decoder whose evidential head returns a predictive distribution. Two contrastive objectives couple the
  representation: a population-weighted alignment between each country and coordinates in its territory,
  and one to pretrained geospatial embeddings carrying image-derived semantics. Read out through that
  decoder, the representation is competitive with purpose-built geospatial encoders while spanning axes
  they do not represent (time, oceans and uncertainty) and supporting country-level capabilities. The
  frozen backbone reconstructs dense fields from sparse observations and adapts to unseen variables in
  minutes on consumer hardware.'
