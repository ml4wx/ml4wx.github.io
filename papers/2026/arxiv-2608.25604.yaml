summary: WDANet, a wavelet-based dual-branch model, forecasts typhoon wind gusts up to 24 h and beats
  ECMWF-HRES in the first 6 h.
abstract: Accurate gust forecasting under typhoon conditions remains challenging due to the highly non-stationary
  and multi-scale characteristics of extreme wind fluctuations. Existing deep learning models often struggle
  to simultaneously capture long-term trends and rapid local variations, resulting in degraded performance
  during extreme events. We propose WDANet, a frequency-aware forecasting framework that integrates stationary
  wavelet decomposition, a Feature-wise Linear Modulation (FiLM) strategy, and a dual-branch encoder-decoder
  architecture, enabling separate modeling of trend and fluctuation components. Taking the offshore regions
  of the Western Pacific in China as an example, we conduct fine-grid wind gust prediction research. The
  results demonstrate that WDANet shows advantages for short lead times under the experimental setting
  across a 24-h forecasting horizon and achieves higher prediction accuracy than ECMWF-HRES within the
  first 6 h. During extreme wind events, WDANet more accurately captures gust peaks and attains the best
  RMSE and MAE performance. These results highlight its potential for offshore wind power operation, disaster
  warning, and risk mitigation.
