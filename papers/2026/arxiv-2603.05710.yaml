summary: Argues AI weather and climate services risk widening the North-South divide and proposes a Climate
  Digital Public Infrastructure and well-being-centred evaluation.
abstract: AI development's current trajectory risks automating and amplifying the North-South divide in
  the global climate information system. Frontier models are built almost exclusively in the Global North,
  and this inequality continues through inputs, processes, and outputs, from biased training data to unrepresentative
  validation, disproportionately affecting vulnerable regions. Addressing these disparities requires a
  Climate Digital Public Infrastructure, evaluation metrics centring well-being, and knowledge co-production
  to foster resilience rather than inequity.
