summary: Uses self-organizing maps on ERA5 500-hPa heights to define four European circulation modes (EMoCs)
  extending the classification back to 1940.
abstract: 'The key challenge of dynamic climatology has always been to describe and understand the large-scale
  variability in atmospheric circulation with the purpose of interpreting weather extremes and climate
  variability. In Europe, the classical concept of Euro–Atlantic weather regimes has been commonly adopted,
  with an emphasis placed primarily on Western Europe and its atmospheric connection to the North Atlantic
  Oscillation. However, these regimes often fail to explain a relatively large proportion of the variability
  in basic meteorological variables and their spatial patterns across more continental parts of Europe,
  particularly with respect to precipitation and connected variables (such as soil moisture). Here, we
  address this research gap by implementing a novel, machine-learning-based approach to define European
  Modes of circulation variability (EMoCs). In a Europe-centric domain (40°W–60°E, 30°–80°N), we employed
  500-hPa geopotential height anomalies from European Centre of Medium‐Range Weather Forecasts Reanalysis
  v.5 (ERA5) data for the 1981–2023 period to train 300 individual self-organizing map (SOM) neural networks
  and combined them into a single SOM model. The resulting dataset was then clustered by Wards’ clustering
  method, which facilitated the identification of four main EMoCs: Atlantic blocking (ABL), Continental
  blocking (CBL), Southern zonal track (SZT) and Northern zonal track (NZT). Using best-matching unit
  (BMU) calculations, these four EMoCs were assigned to individual days, which allowed the classification
  of days outside the SOM training period and the extension of the series to the longer 1940–2023 period.
  Moreover, this approach could enable the use of the EMoC classification for weather forecasts. Each
  EMoC represents highly distinct spatial patterns of weather conditions across Europe. In particular,
  SZT and NZT lead to very dry/wet patterns over Central and Western Europe, even though both modes represent
  enhanced zonal flow patterns over the North Atlantic. The four main EMoCs could serve as useful tools
  for dynamic climatology, future climate projections and season-to-season weather forecasts.'
