summary: An LSTM weather model coupled with the DSSAT crop model forecasts rooftop tomato leaf area index
  and biomass for seven days, with R² of 0.98–0.99.
abstract: Rooftop farms are urban green infrastructure integrating food production, ecological regulation,
  and public services, and their management increasingly relies on data-driven approaches. However, open
  built environments, microclimatic heterogeneity, and limited sensor deployment challenge continuous
  monitoring and short-term prediction of rooftop plant growth. This study proposes and validates a virtual
  sensor-driven digital twin system using a rooftop tomato case in Xiamen, China. The system adopts a
  five-layer architecture comprising data acquisition, transmission, modeling, processing, and application
  service layers. By coupling a Long Short-Term Memory (LSTM) weather prediction model with the Decision
  Support System for Agrotechnology Transfer (DSSAT) crop growth model, a predictive virtual sensor module
  was developed to forecast leaf area index (LAI), aboveground biomass, phenology, and yield for seven
  days. Results show that the system links environmental data acquisition, LSTM–DSSAT prediction, database
  storage, and three-dimensional visualization, transforming rooftop plant growth into an updatable, predictable,
  and visualized digital twin object. The coupled model showed high predictive accuracy, with R2 values
  of 0.9814 for LAI and 0.9966 for aboveground biomass, while supporting phenology and yield prediction.
  The system supports irrigation optimization, landscape management, and activity planning in sensor-constrained
  rooftop farms.
