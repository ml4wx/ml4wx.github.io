summary: Video diffusion model downscales daily GCM-scale fields to 8.8 km hourly precipitation, trained
  on a Met Office 2.2 km convection-permitting model, for 100-1000 year rainfall return levels.
abstract: Effectively preparing for changes in extreme flooding requires understanding present and future
  rainfall extremes with return periods up to $\sim$100-1000 years, including changes in intensity, spatial
  structure at km-scale and sub-daily temporal variability. Conventional km-scale climate models give
  greatly increased realism compared to typical global climate models (GCMs) but are too computationally
  costly to allow enough simulations for robustly quantifying changes in extremes. This work presents
  an approach based on video diffusion to generate realistic precipitation at 8.8km-hourly resolution
  by spatially and temporally downscaling daily, GCM-scale atmospheric variables. The emulator is trained
  to produce similar output to a $4\times$-coarsening of the Met Office's 2.2km-resolution UK convection-permitting
  model. An application for such an emulator is to downscale large-ensemble GCM simulations to allow quantification
  of $\sim$100-1000-year return level rainfall, which in turn can be used to drive hydrological and flood
  models for improved projections of future changes in flood risk.
