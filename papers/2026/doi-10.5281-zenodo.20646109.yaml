summary: IoT sensors with cloud-based neural networks aim at hyper-local rain forecasts, but the abstract
  gives no quantitative validation.
abstract: 'IoT-Rain Sense is an innovative and state-of-the-art solution for rain prediction on demand
  and continual weather monitoring based-on Internet of things (IOT) systems and cloud-based Neural Networks
  designed to predict precise, hyper localised forecasts. The architecture of the system consists of three
  main components: Data Acquisition, Feature Processing, and Weather Prediction. In phase 1, sensors being
  IoT based and ESP32 microcontrollers keep on monitoring temperature, humidity and light intensity over
  the environment of an application. The measurements are displayed in real time on a built local LCD
  interface. These sensors are cheap and energy-friendly, which means they could be sprinkled around agriculture
  and cities and institutions, without bothering anyone, and can scale up as needed. The second level
  is focused on feature processing, including preprocessing which aims to clean, filter and normalize
  raw data in order to control the quality of them. There is more weather related information added to'
