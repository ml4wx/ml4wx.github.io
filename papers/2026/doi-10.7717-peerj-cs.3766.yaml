summary: Attention-based CNN-BiGRU flags temperature anomalies in 1961-2024 national climate series and
  outperforms LSTM and GRU baselines on R2, RMSE and MAE.
abstract: Detecting climate anomalies is crucial for long-term climate change studies and for identifying
  potential extreme events or irregularities in climate behaviour that may reflect anomalies. In contrast
  to short-term weather forecasting, climate anomaly detection identifies anomalous departures from historical
  climate patterns over longer timescales. This research introduces an innovative Attention-based Convolutional
  Neural Network-Bidirectional Gated Recurrent Unit (CNN-BiGRU) Hybrid approach for detecting temporal
  temperature anomalies in climate time-series. It combines CNN’s ability to extract local temporal features
  with BiGRU’s ability to recognise patterns in a time series over long intervals, and incorporates an
  attention layer to focus on the time points most important for identifying anomalous temperatures, thereby
  enhancing performance and interpretation. The model was trained on surface temperature indicators collected
  from multiple countries during the period from 1961 to 2024. A number of pre-processing and feature
  engineering techniques were applied to enhance temporal sensitivity to anomalies, including missing
  value imputation, normalization, lag features, and year-over-year change computation. The proposed approach
  was assessed using R 2 , Root Mean Square Error (RMSE), Mean Absolute Error (MAE), and Pearson correlation.
  The experimental results showed that the Attention-based CNN-BiGRU model outperformed the baseline Long
  Short-Term Memory (LSTM) and Gated Recurrent Unit (GRU) models in detecting significant deviations in
  temperature trends. The presented framework provides a scalable and domain-independent solution for
  climate time-series anomaly detection, and can be extended to other sequential data applications.
