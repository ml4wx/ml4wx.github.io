summary: Image-to-video diffusion model generating storm-centred cyclone scenarios, with 52% lower peak
  vorticity error on the North Atlantic test set.
abstract: While machine learning-based weather models hold significant promise, they struggle to predict
  the detailed structure of large-scale weather systems such as cyclonic storms. Regional models are constrained
  by limited historical records within fixed geographic boundaries, while global models are computationally
  expensive and often operate at resolutions too coarse to capture fine-grained storm dynamics. To bridge
  this gap, we introduce the Geospatial Diffusion-based Evolution Synthesis (GeoDES) model, a custom image-to-video
  diffusion model. By focusing generation strictly on the evolving storm structure, GeoDES synthesizes
  physically consistent, high-fidelity weather events suitable for stress-testing forecast models and
  expanding meteorological datasets. Evaluations demonstrate that GeoDES outperforms prior methods on
  key metrics, achieving $52\%$ lower Peak Vorticity Error and $8\%$ higher Anomaly Correlation Coefficient
  than the next strongest methods on the North Atlantic test set.
