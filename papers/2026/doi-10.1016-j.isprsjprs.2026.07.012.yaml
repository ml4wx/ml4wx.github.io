summary: MGLANet maps 40 m Antarctic ice-shelf surface melt from Sentinel-1 for 2015 to 2023, with mean
  IoU 90.84% and improved melt boundary delineation.
abstract: Surface melt on Antarctic ice shelves is a key precursor to hydrofracture, structural weakening,
  and potential ice-shelf collapse. However, existing passive and active microwave products, while valuable
  for long term monitoring, remain inadequate for resolving fine-scale melt features over heterogeneous
  ice shelf surfaces. Moreover, conventional retrieval methods are limited in capturing fragmented melt
  boundaries and in generalizing across the highly variable surface conditions of Antarctic ice shelves.
  To address these limitations, we developed a Multiscale Global-Local Attention Network (MGLANet) for
  circum-Antarctic surface melt mapping. Within this framework, LSAM focuses on local fine-scale structure
  extraction, GLA models long-range contextual dependencies to characterize macro-scale melt distribution,
  and MCIM improves multiscale feature fusion across decoder levels. Using a standardized Sentinel-1 archive
  from the CASEarth Cloud Service Platform, we generated a high-resolution (40 m) surface melt product
  spanning 2015–2023. Quantitative evaluation on the test set demonstrates strong model performance, achieving
  a mean IoU of 90.84% and an F 1 score of 94.83%. The SARMelt product includes (1) monthly high-resolution
  surface melt maps capturing the spatiotemporal evolution of meltwater; (2) annual melt occurrence maps
  quantifying seasonal persistence; and (3) time-series statistical record for rapid climatological analysis,
  providing a new basis for analyzing the spatiotemporal evolution of Antarctic surface melt. Cross-comparison
  with ASCAT, SSMIS, and the deep-learning-based UMelt product shows that SARMelt maintains high consistency
  in capturing interannual melt variability while substantially improving the delineation of melt boundaries
  and localized melt features in grounding-line zones. By bridging the gap between kilometer-scale microwave
  observations and fine-scale ice shelf surface melt information, SARMelt provides a high-resolution benchmark
  for cryospheric monitoring, regional climate model validation, and investigations of melt-related ice
  shelf instability under ongoing climate change. The proposed SARMelt dataset is available on the CASEarth
  platform at https://doi.org/10.12237/casearth.OSD20260002 .
