summary: Physics-guided semi-supervised attention network estimates near-surface air temperature across
  pixels from satellite imagery, using surface energy balance and advection-diffusion constraints to align
  with sparse sensors.
abstract: Modern Earth observation relies on satellites to capture detailed surface properties. Yet, many
  phenomena that affect humans and ecosystems unfold in the atmosphere close to the surface. Near-ground
  sensors provide accurate measurements of certain environmental characteristics, such as near-surface
  air temperature (NSAT). However, they remain sparse and unevenly distributed, limiting their ability
  to provide continuous spatial measurements. To bridge this gap, we introduce SPyCer, a semi-supervised
  physics-guided network that can leverage pixel information and physical modeling to guide the learning
  process through meaningful physical properties. It is designed for continuous estimation of NSAT by
  proxy using satellite imagery. SPyCer frames NSAT prediction as a pixel-wise vision problem, where each
  near-ground sensor is projected onto satellite image coordinates and positioned at the center of a local
  image patch. The corresponding sensor pixel is supervised using both observed NSAT and physics-based
  constraints, while surrounding pixels contribute through physics-guided regularization derived from
  the surface energy balance and advection-diffusion-reaction partial differential equations. To capture
  the physical influence of neighboring pixels, SPyCer employs a multi-head attention guided by land cover
  characteristics and modulated with Gaussian distance weighting. Experiments on real-world datasets demonstrate
  that SPyCer produces spatially coherent and physically consistent NSAT estimates, outperforming existing
  baselines in terms of accuracy, generalization, and alignment with underlying physical processes.
