summary: GraphCast matches or beats WRF at 27 km to 3 km for heavy precipitation in South Korea, but underpredicts
  rain above 70 mm and topographic enhancement.
abstract: As AI-based weather prediction model emerges, its prediction skill for extreme weather draws
  great attention. This study assesses the skill of GraphCast in heavy precipitation prediction against
  rain gauge observations focusing on 10 heavy precipitation cases in South Korea. For comparisons, the
  Weather Research and Forecasting (WRF) model simulations with different horizontal resolutions of 27
  (WRF 27km ), 9 (WRF 9km ), and 3 km (WRF 3km ) are used. When the skill in predicting general patterns
  of precipitation is evaluated using the normalized mean bias, normalized centered root-mean-square error,
  and spatial correlation coefficient, GraphCast shows better or comparable skill compared with WRF 27km
  , WRF 9km , and WRF 3km . When the skill for different precipitation thresholds is separately examined
  using the equitable threat score (ETS), neighborhood ETS, and other contingency table-based metrics,
  GraphCast shows relatively large overprediction of light precipitation (≤ 20 mm) and underprediction
  of heavy precipitation (≥ 70 mm) compared with WRF 27km as well as WRF 9km and WRF 3km . GraphCast reproduces
  observed topographic enhancements of precipitation over the Sobaek Mountains by 42%, which is less than
  those reproduced by WRF 27km (71%), WRF 9km (63%), and WRF 3km (90%). While the synoptic conditions
  and their associated water vapor transports are similarly simulated by GraphCast and WRF 27km , the
  upward motions over the Sobaek Mountains are weaker for GraphCast than for WRF 27km . The underpredictions
  of heavy precipitation and topographically enhanced precipitation by GraphCast are mainly associated
  with its weak ability to predict large precipitation peaks with scales of about 25–100 km.
