summary: A training-mean climatology reproduces 92% of daily LIS/OTD lightning variance, beating ML lightning
  parameterizations and showing that their reported skill can be overstated.
abstract: Machine-learning approaches to predicting lightning have achieved remarkable evaluation scores,
  far exceeding traditional parameterizations. However, high performance, even on unseen years, does not
  necessarily demonstrate robust physical relationships between predictors and lightning that hold under
  climate change. Here, we investigate how similarity between training and testing data affects lightning
  model evaluation. We introduce a simple benchmark predicting the training-data mean lightning density
  for each grid-cell and day of year, which reproduces 92% of the variance in daily grid-cell LIS/OTD
  observations and outperforms machine-learning models and traditional parameterizations. This high apparent
  skill is largely attributable to the strong spatiotemporal smoothing of LIS/OTD. We further show that
  previously reported model skill in reproducing inter-annual variability results from inconsistent observational
  coverage and disappears under a common spatiotemporal domain. Our results suggest that common lightning-model
  evaluations can overstate projection skill and highlight the need to test models under conditions differing
  from the training distribution.
