summary: BEAST is a Bayesian Swin Transformer for 0.25° global forecasts with a 4D parallelism scheme
  reaching 3.96 EFLOP/s on 20,480 GPUs, enabling large uncertainty-aware ensembles.
abstract: We present BEAST, the first-ever Bayesian Swin Transformer for atmospheric forecasting on 0.25$^\circ$
  global resolution able to accurately quantify both aleatoric and epistemic uncertainty. To overcome
  the associated computational bottlenecks, we devise an orthogonal 4D-parallelization scheme that introduces
  a unique domain-tensor-parallelism strategy and a novel uncertainty parallel method, enabling us to
  fully leverage GPU capacity and efficiently scale model training. For a 2.4-billion-parameter model,
  we achieve a peak performance of 3.96 EFLOP/s on 20,480 NVIDIA GH200 GPUs on the JUPITER supercomputer.
  We train BEAST as a 700-million-parameter model with 96 random weight samples on 384 nodes on 40 years
  of data for nearly one million gradient updates. This model achieves predictive skill scores competitive
  with state-of-the-art probabilistic atmospheric AI models and numerical models, and can predict extreme
  events with exceptional skill, while generating large ensembles 3 to 4 times faster than the current-best
  AI model. Our contribution unlocks the potential of high-fidelity uncertainty quantification in atmospheric
  AI models, heralding a new era for AI-based models in climate and Earth system sciences.
