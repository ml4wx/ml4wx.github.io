summary: Explainable K-means and machine learning attribute Tibetan Plateau extreme precipitation trends
  to upper humidity and project CMIP6-bias-reduced intensification under SSP5-8.5.
abstract: Increasingly extreme precipitation on the Tibetan Plateau (TP) threatens infrastructure, ecosystems,
  and livelihoods. However, traditional linear models are limited in capturing nonlinear drivers and projecting
  long-term changes. To address this, we applied K -means clustering and developed an explainable machine
  learning framework. Using six extreme precipitation indices from 1961–2022, we identified significant
  upward trends in R95pTOT, RX1day, and RX5day, increasing by 0.19 mm, 0.12 mm, and 0.12 mm per decade,
  respectively. Attribution analysis revealed that upper-level specific humidity (q400) generally serves
  as the most influential factor, contributing 45.72% to RX5day (north TP), 20.51% to R10 (south and east
  TP), and 32.6% to RX5day (southeast TP), although upper-level temperature (t400) occasionally dominates.
  Compared with CMIP6 simulations, the machine learning models project slightly lower magnitudes of future
  extreme precipitation but exhibit strong spatial and temporal consistency, effectively capturing large-scale
  patterns and reducing CMIP6 biases. Under SSP1-2.6, extreme precipitation shows a modest increase, whereas
  under SSP5-8.5, a pronounced intensification is projected. Specifically, R95pTOT and CWD are expected
  to rise by 0.28 mm and 0.16 days per decade, respectively. This study establishes a computationally
  efficient, reproducible, and interpretable framework, providing reliable scientific support for disaster
  risk management and climate adaptation in high-altitude, data-sparse regions.
