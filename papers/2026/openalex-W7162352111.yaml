summary: Benchmark of eleven ML algorithms for hourly station forecasts finds tree ensembles (Extra Trees,
  XGBoost) best for temperature, humidity and wind speed.
abstract: Η παρούσα διπλωματική εργασία εξετάζει συστηματικά την εφαρμογή και συγκριτική αξιολόγηση έντεκα
  αλγορίθμων Μηχανικής Μάθησης για τη βραχυπρόθεσμη πρόγνωση ωριαίων μετεωρολογικών χρονοσειρών, με στόχους
  τη θερμοκρασία, τη σχετική υγρασία, την ταχύτητα και τη διεύθυνση του ανέμου, καθώς και τη βροχόπτωση.
  Η μελέτη τοποθετείται στο σημείο σύγκλισης της αριθμητικής πρόγνωσης και της μηχανικής μάθησης και εστιάζει
  στην ανάγκη για δίκαιες, διαφανείς και αναπαραγώγιμες συγκρίσεις μεταξύ διαφορετικών οικογενειών μοντέλων.
  Για τον σκοπό αυτό αναπτύχθηκε ένα ενιαίο και πλήρως αυτοματοποιημένο πειραματικό pipeline, το οποίο
  περιλαμβάνει κοινή προεπεξεργασία δεδομένων, δημιουργία χαρακτηριστικών με χρονικές υστερήσεις (lags),
  χρονικά διαδοχικό διαχωρισμό εκπαίδευσης-επικύρωσηςελέγχου (time-aware split), εκπαίδευση σε διάταξη
  πολλαπλών εξόδων και αυτόματη παραγωγή μετρικών και γραφημάτων. Η αξιολόγηση πραγματοποιείται με συμπληρωματικές
  μετρικές (RMSE, MAE, R² και SMAPE), ώστε να αποτυπώνονται τόσο τα απόλυτα όσο και τα σχετικά σφάλματα
  πρόβλεψης. Τα αποτελέσματα δείχνουν με συνέπεια την υπεροχή των δενδροειδών ensemble μεθόδων (ιδίως
  Extra Trees και XGBoost) για τη θερμοκρασία, τη σχετική υγρασία και την ταχύτητα ανέμου, επιβεβαιώνοντας
  την ικανότητά τους να συλλαμβάνουν μη γραμμικότητες και αλληλεπιδράσεις σε ωριαία δεδομένα. Για τη διεύθυνση
  ανέμου, το Gradient Boosting παρουσιάζει την καλύτερη σχετική επίδοση, αν και αναδεικνύεται σαφώς η
  ανάγκη για κυκλική ή διανυσματική αναπαράσταση της μεταβλητής ώστε να αποφεύγονται τεχνητά σφάλματα.
  Η πρόγνωση της βροχόπτωσης αποδεικνύεται το πιο απαιτητικό πρόβλημα, με μέτριες επιδόσεις για όλα τα
  μοντέλα, λόγω της έντονης ασυμμετρίας και της μεγάλης συχνότητας μηδενικών τιμών, γεγονός που καθιστά
  αναγκαία τη χρήση κατηγοριοποιητικών και πιθανοτικών μετρικών. Η εργασία καταλήγει ότι η απόδοση όλων
  των μοντέλων υποβαθμίζεται αναμενόμενα με την αύξηση του χρονικού ορίζοντα πρόβλεψης (h=1→3), με τα
  ensemble μοντέλα να διατηρούν μεγαλύτερη σταθερότητα. Παράλληλα, αναδεικνύεται η σημασία του ενιαίου
  πειραματικού πρωτοκόλλου για την εξαγωγή αξιόπιστων συμπερασμάτων. Τέλος, προτείνονται συγκεκριμένες
  κατευθύνσεις μελλοντικής επέκτασης, όπως η εισαγωγή επίσημων baselines και skill scores, ο εμπλουτισμός
  χαρακτηριστικών, η υιοθέτηση πιθανοτικών μοντέλων και τεχνικών ερμηνευσιμότητας, καθώς και η επιχειρησιακή
  ωρίμανση μέσω πρακτικών MLOps. Συνολικά, η εργασία παραδίδει ένα καθαρό και αναπαραγώγιμο benchmark
  και έναν ρεαλιστικό οδικό χάρτη για τη μετατροπή του σε αξιόπιστο σύστημα πρόγνωσης.
