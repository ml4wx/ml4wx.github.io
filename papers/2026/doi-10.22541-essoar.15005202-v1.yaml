summary: Logistic regression with SHAP attribution identifies predictors of CESM2 soil-moisture regime
  mismatches against the GOLAM observation-based dataset.
abstract: Several studies have utilized Earth system models to characterize soil moisture (SM) regimes,
  a key indicator of land–atmosphere interactions. However, notable spatial differences between modeled
  and observed SM regimes present challenges. Here, we will employ logistic regression, a supervised machine
  learning algorithm, to identify features that contribute to mismatches between modeled and observed
  SM regimes. This work will utilize daily global fields of SM and land-surface fluxes (SH and LE) from
  the Community Earth System Model version 2 (CESM2) to calculate SM regimes. Additionally, we will use
  the global, gridded, observation-based SM regime from the Global Observationally-Based Land-Atmosphere
  Coupling Metrics (GOLAM; v1.0) dataset. To train the logistic regression model, we will incorporate
  predictor variables such as meteorological data, vegetation cover fraction, soil characteristics, and
  topography, while the target variable indicates whether the modeled SM regime matches or mismatches
  observations. After separately training the logistic regression model for three SM regime types (dry,
  transitional, and wet), we will assess model performance through 5-fold stratified cross-validation
  and cross-entropy analysis. Global maps highlighting the main SHAP contributors and their effect directions
  will help identify which predictors most influence regime mismatches, revealing potential internal model
  inconsistencies. Ultimately, this study will guide development efforts and identify systematic biases
  in land-surface physics and atmospheric model parameterizations. Moreover, the results can improve our
  understanding of ecosystem dynamics and climate variability, highlighting possible implications for
  model simulations.
