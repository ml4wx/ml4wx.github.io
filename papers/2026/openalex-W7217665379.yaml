summary: A neural network system forecasts local weather conditions from Dark Sky observations, a small
  application study with no quantitative results.
abstract: To forecast the situation of weather at a particular location is a vital application of machine
  learning. While traditionally this has been done by human experts by identifying patterns in data collected
  by various measuring instruments, in modern times the machine learning algorithms are used to crunch
  data and identify patterns which are used for predicting the weather parameters. In this work, we have
  used neural networks to analyze data from Dark Sky to forecast the climatic conditions.
