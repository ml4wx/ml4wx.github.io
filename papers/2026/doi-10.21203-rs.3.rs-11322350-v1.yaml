summary: Graph attention couples sparse GNSS precipitable water vapour stations with NWP to calibrate
  unmonitored coastal sites, cutting 1-24 h NWP error by 12.8% in China and 6.1% in the US.
abstract: 'Ground-based Global Navigation Satellite System (GNSS) precipitable water vapor (PWV) provides
  essential observational constraints for coastal convective forecasting. However, existing statistical
  and deep-learning models rely on multi-year single-station archives, restricting utility to permanently
  instrumented locations and leaving unmonitored coastal zones dependent on uncorrected numerical weather
  prediction (NWP). Here, we establish a sparse-GNSS-backbone regional forecasting framework that projects
  observation-informed calibration beyond sensor footprints by coupling GNSS anchors with continuous NWP
  tendencies through geographically biased graph attention. Trained with stochastic whole-station history
  dropout, the architecture operates across a two-tier service paradigm: Level 1 regional coverage projecting
  calibration across unmonitored footprints without local GNSS hardware or archives, and Level 2 local
  enhancement providing precision upgrades where receivers exist. In China, Level 1 reduces raw NWP 1–24
  h mean absolute error across 19 unmonitored targets by 12.8% (7.0% over calibrated NWP), where on-site
  GNSS records yield a 9.7% precision upgrade; across the instrumented source backbone, Level 2 reduces
  error by 7.5% over local fusion. An independent 138-station benchmark along the US coast confirms cross-continental
  portability: a 30-station backbone reliably projects calibration across 108 verification targets (reducing
  error by 6.1% over calibrated NWP), with skill sustained across 200–300 km. Under severe sensing disruptions,
  the architecture maintains a 9.9% error reduction during tropical cyclones, and its advantage increases
  to 19.9% (China) and 30.7% (US) during extended telemetry outages. This framework demonstrates observational
  leverage, transforming sparse GNSS arrays into regional predictive assets.'
