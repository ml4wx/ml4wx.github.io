summary: XGBoost with heatwave indices predicts photovoltaic output in Santo André, Brazil (R² above 0.996),
  projecting a 0.3–0.4% annual decline to 2100.
abstract: Climate change is intensifying extreme temperature events, especially heatwaves, which affect
  both energy demand and the performance of photovoltaic systems in the metropolitan region of São Paulo,
  particularly in the municipality of Santo André. The central problem lies in the difficulty of accurately
  estimating solar generation during these extreme events, as photovoltaic panels exhibit complex behavior.
  Although heatwaves are associated with higher solar radiation due to reduced cloud cover, high temperatures
  significantly reduce module efficiency, potentially causing losses of up to half a percent for each
  degree Celsius above standard conditions. This study presents a machine-learning-based methodology using
  the Extreme Gradient Boosting (XGBoost) algorithm to estimate photovoltaic generation while explicitly
  considering the effects of heatwaves and future climate projections. Using historical data from the
  Brazilian DailyWeather Gridded Data dataset, combined with extreme temperature event indices calculated
  with Climpact software and projections from four global climate models under the SSP2-4.5 and SSP5-8.5
  scenarios, the developed model estimated photovoltaic energy generation. During the validation, the
  XGBoost model achieved a coefficient of determination greater than 0.996. The distinguishing contribution
  lies in the explicit integration of heatwave indices as predictive variables and systematic analysis
  of future climate scenarios up to 2100. Results from the ensemble of four climate models indicate that
  annual mean generation decreases by 0.33% under SSP2-4.5, and 0.37% under SSP5-8.5 over 2021–2100, with
  monthly reductions reaching up to 3.92% under the high-emission scenario, providing quantitative tools
  for energy planning in systems with high solar radiation incidence.
