summary: Hybrid EMMA-BiGRU-XGBoost estimates monthly mean precipitable water vapor across Turkey from
  only latitude, longitude, altitude and season, improving error by 15-20%.
abstract: 'Abstract Precipitable water vapor (PWV) is a crucial atmospheric variable that influences weather
  systems, climate variability, and hydrological processes. Accurate PWV estimation is essential for improving
  numerical weather prediction, climate modeling, and remote‐sensing applications. However, existing methods
  often rely on extensive meteorological inputs or computationally intensive architectures, limiting their
  applicability in data‐sparse regions. This study introduces a novel hybrid framework, EMMA–NN–BiGRU–XGBoost,
  designed to forecast monthly mean PWV across Turkey using only four physically meaningful inputs: latitude,
  longitude, altitude, and seasonal indicators. The framework integrates an enhanced multimodal attention
  (EMMA) mechanism that disentangles spatial, altitudinal, and seasonal influences, improving interpretability
  and physical consistency. Bidirectional gated recurrent units (BiGRU) capture temporal dependencies,
  and XGBoost models nonlinear feature interactions within a weighted stacking ensemble. Hyperparameters
  are optimized via particle swarm optimization and Bayesian optimization, with particle swarm optimization
  demonstrating superior tuning efficiency. Extensive benchmarking against traditional machine‐learning
  models, using grid search and random search with fivefold cross‐validation, as well as deep‐learning
  baselines, demonstrates significant improvements in predictive accuracy, achieving an root‐mean‐square
  error of and an of 0.92, representing a 15%–20% reduction in error compared with state‐of‐the‐art methods.
  The model also exhibits robustness across diverse climatic zones in Turkey. Shapley additive explanations
  further elucidate feature importance, aligning model outputs with climatological principles. Beyond
  methodological advances, this work provides a scalable, interpretable, and data‐efficient baseline for
  PWV forecasting, thereby facilitating enhanced climate diagnostics, hydrological risk assessments, and
  early warning systems, particularly in regions with limited meteorological observations.'
