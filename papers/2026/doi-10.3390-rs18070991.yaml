summary: Deep network fuses dual-band S- and X-band radar data to super-resolve S-band reflectivity, reaching
  PSNR 30.84 and SSIM 0.8755 in severe weather cases.
abstract: Dual-band weather radar networks enable complementary multi-radar observations, improving the
  accuracy, three-dimensional characterization, and early warning capability for severe convective weather.
  S-band radar provides strong penetration and long detection range but suffers from limited spatial resolution,
  whereas X-band radar offers high resolution with weaker penetration, posing challenges for dual-frequency
  data fusion. To address the resolution mismatch and fusion modeling issues between dual-band radars,
  this study proposes a super-resolution reconstruction method for S-band reflectivity based on dual-frequency
  radar observations. S-band and X-band radar data, together with key polarimetric parameters, are jointly
  incorporated into a deep neural network-based fusion model to enhance the spatial resolution of S-band
  reflectivity. Experimental results under typical severe weather conditions demonstrate that the proposed
  method achieves improved detail recovery and structural reconstruction, with the model achieving PSNR
  30.84, SSIM 0.8755, and MAE 0.24178, which shows obvious advantages compared with other models and effectively
  enhances radar network data quality, and it outperforms single S-band super-resolution approaches in
  both objective metrics and subjective evaluations.
