summary: Style-inspired CNN and PatchGAN classifiers recognise sunny, rain, snow and fog from ground images,
  claiming state-of-the-art results on public datasets.
abstract: In this paper, we present three neural network architectures designed for real-time classification
  of weather conditions (sunny, rain, snow, fog) from images. These models, inspired by recent advances
  in style transfer, aim to capture the stylistic elements present in images. One model, called "Multi-PatchGAN",
  is based on PatchGANs used in well-known architectures such as Pix2Pix and CycleGAN, but here adapted
  with multiple patch sizes for detection tasks. The second model, "Truncated ResNet50", is a simplified
  version of ResNet50 retaining only its first nine layers. This truncation, determined by an evolutionary
  algorithm, facilitates the extraction of high-frequency features essential for capturing subtle stylistic
  details. Finally, we propose "Truncated ResNet50 with Gram Matrix and Attention", which computes Gram
  matrices for each layer during training and automatically weights them via an attention mechanism, thus
  optimizing the extraction of the most relevant stylistic expressions for classification. These last
  two models outperform the state of the art and demonstrate remarkable generalization capability on several
  public databases. Although developed for weather detection, these architectures are also suitable for
  other appearance-based classification tasks, such as animal species recognition, texture classification,
  disease detection in medical imaging, or industrial defect identification.
