summary: Physics-informed linear state space model forecasts solar irradiance for off-grid PV in Sudan
  with under 40,000 parameters, enforcing diurnal cycles using solar zenith angle.
abstract: The stable operation of off-grid photovoltaic systems requires accurate, computationally efficient
  solar forecasting. Contemporary deep learning models often suffer from massive computational overhead
  and physical blindness, generating impossible predictions. This paper introduces the Physics-Informed
  State Space Model (PISSM) to bridge the gap between efficiency and physical accuracy for edge-deployed
  microcontrollers. PISSM utilizes a dynamic Hankel matrix embedding to filter stochastic sensor noise
  by transforming raw meteorological sequences into a robust state space. A Linear State Space Model replaces
  heavy attention mechanisms, efficiently modeling temporal dependencies for parallel processing. Crucially,
  a novel Physics-Informed Gating mechanism leverages the Solar Zenith Angle and Clearness Index to structurally
  bound outputs, ensuring predictions strictly obey diurnal cycles and preventing nocturnal errors. Validated
  on a multi-year dataset for Omdurman, Sudan, PISSM achieves superior accuracy with fewer than 40,000
  parameters, establishing an ultra-lightweight benchmark for real-time off-grid control.
