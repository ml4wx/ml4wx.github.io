summary: Review of machine learning for solar irradiance forecasting, covering LSTM, hybrid, physics-informed
  and federated methods, with error ranges reported across studies.
abstract: This review provides a comprehensive and systematic assessment of the current state of machine
  learning (ML)-based solar irradiance prediction methods. The discussion begins with the significance
  of solar radiation forecasting and the environmental factors influencing its variability, followed by
  an outline of the limitations inherent in conventional empirical and numerical weather prediction models
  that have motivated the adoption of ML approaches. A structured analysis of key ML techniques including
  regression-based models, ensemble learners, deep learning frameworks, and hybrid architectures is presented.
  Deep learning models, particularly LSTM networks, achieve MAE as low as 0.039 kWh/m² and R² up to 0.988,
  with hybrid CNN–LSTM models reducing errors by 10–25%. Recent advances such as physics-informed learning,
  explainable AI, and data fusion strategies are also examined, emphasizing their roles in enhancing model
  transparency, robustness, and reliability. Furthermore, this review explores emerging directions in
  federated learning, transfer learning, and edge AI, which promise to enhance adaptability and real-time
  performance. Transfer learning achieves R² of 0.85–0.90, while federated learning maintains 90–95% accuracy.
  However, forecast errors remain 40–60% higher in data-scarce regions. The review identifies key challenges
  specific to solar irradiance forecasting, including the unpredictability of cloud dynamics, the data
  paradox in climate-vulnerable regions, and the gap between model accuracy and real-world deployment.
  It further highlights novel future directions, including physics-informed models, uncertainty-aware
  forecasting, federated learning, and lightweight edge AI for real-time, low-power applications. Practical
  applications in PV system optimization and climate modeling are discussed, highlighting the operational
  importance of accurate forecasting. Overall, the review emphasizes the need for more interpretable,
  efficient, and deployable solutions to address data, variability and computational constraints.
