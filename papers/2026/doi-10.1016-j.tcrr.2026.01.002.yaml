summary: Hong Kong Observatory overview of five operational tropical cyclone tools combining ensemble
  prediction, AI satellite intensity estimation, storm surge and AI weather models.
abstract: The Hong Kong Observatory (HKO) is the meteorological authority in Hong Kong, responsible for
  weather monitoring, forecasting, and issuing warnings on weather-related hazards. Over the years, the
  HKO has been employing cutting-edge technologies to enhance tropical cyclone (TC) prediction accuracy
  and timeliness, support decision-making and improve local warning services. These efforts align with
  the United Nations’ “Early Warnings for All” initiative promoted by the World Meteorological Organization
  (WMO). In this paper, five recent developments in the HKO by utilizing ensemble prediction systems (EPS)
  and artificial intelligence (AI) to support TC monitoring and forecasting are concisely presented. These
  notable advancements include (i) TC strike probability maps generated from multiple EPS, (ii) probabilistic
  storm surge forecast products to strengthen coastal flood risk assessment, (iii) an AI-based system
  for real-time position analysis and intensity estimation based on satellite imagery, (iv) a real-time
  flood monitoring tool leveraging camera imagery and AI algorithms, as well as (v) the use of AI weather
  prediction models to support TC forecasting operations. Looking into the future, the HKO will continue
  to improve forecast accuracy, enhance warning effectiveness, and collaborate with ESCAP/WMO Typhoon
  Committee Members to mitigate the TC impacts in Hong Kong and the broader region.
