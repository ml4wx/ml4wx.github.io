summary: FYSATTY is a 2005–2024 dataset of 614 western North Pacific tropical cyclones from FY-2 and FY-4
  geostationary imagery, aligned to best tracks and built for machine learning.
abstract: Abstract This paper introduces a comprehensive Tropical Cyclone (TC) dataset based on China’s
  FengYun (FY) series geostationary satellite observations in the Western North Pacific (WNP), designated
  as FYSATTY. This innovative dataset integrates high-resolution geostationary meteorological satellite
  observations with best-track data, providing a unique resource for TC monitoring and analysis in the
  WNP region. FYSATTY is derived from infrared, water vapor, and visible channel imagery captured by the
  FY-2 and FY-4 satellites, which is processed using an equal-interval latitude-longitude grid system
  within a 1500-km radius centered on each TC. The best-track data, sourced from the China Meteorological
  Administration (CMA), is interpolated into 3-h intervals to ensure temporal consistency with the satellite
  observations. This dataset consists of 99714 observations for 614 TCs from 2005 to 2024 and will be
  updated annually. It represents the most comprehensive collection of TC satellite imagery derived from
  the FY series of geostationary meteorological satellites of the National Satellite Meteorological Center
  (NSMC). It encompasses a synthesis of infrared, water vapor, and visible channel data from the FY-2
  and FY-4 satellite series. The dataset has been meticulously cropped and georeferenced using the CMA
  best-track data, with fundamental geographic spatial calibration completed. Comparative analysis with
  analogous elements within other TC geostationary meteorological satellite datasets reveals a high degree
  of consistency. It is suitable for reanalyzing TC best-track data, assessing climatic characteristics
  of TC satellite observations, and enhancing forecasting capabilities. This dataset is particularly useful
  for TC research, forecasting, and machine learning, and is publicly available.
