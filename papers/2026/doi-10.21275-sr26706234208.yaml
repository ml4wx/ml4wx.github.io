summary: Review of deep learning for weather and climate prediction across heatwaves, floods, wildfires
  and cyclones, noting blurring and interpretability limits.
abstract: 'Extreme climate events- heatwaves, floods, droughts, wildfires, and intensified tropical cyclones-
  are increasing in frequency and severity as anthropogenic climate change reshapes the statistical distribution
  of weather. Traditional numerical weather and climate prediction, built on physics-based equations solved
  on supercomputers, remains the backbone of forecasting but faces limits in computational cost, resolution,
  and speed. Over the past five years, artificial intelligence (AI), particularly deep learning, has emerged
  as a complementary and in some respects transformative tool across the full disaster management cycle:
  prediction, early warning, real-time monitoring, response coordination, and post-event damage assessment.
  This article reviews the scientific basis of AI-based weather and climate modeling, surveys applications
  across major hazard types, examines documented strengths and limitations (including the "blurring" problem
  in deterministic AI forecasts and the loss of physical interpretability), and discusses governance and
  equity challenges that will determine whether these tools reduce or exacerbate global disaster risk.'
