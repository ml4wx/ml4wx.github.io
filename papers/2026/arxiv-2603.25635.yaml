summary: AB-SWIFT is a branched transformer surrogate for 3D urban atmospheric flow over randomized city
  geometries and stratifications, outperforming transformer and graph baselines on all fields.
abstract: Air flow modeling at a local scale is essential for applications such as pollutant dispersion
  modeling or wind farm modeling. To circumvent costly Computational Fluid Dynamics (CFD) computations,
  deep learning surrogate models have recently emerged as promising alternatives. However, in the context
  of urban air flow, deep learning models struggle to adapt to the high variations of the urban geometry
  and to large mesh sizes. To tackle these challenges, we introduce Anchored Branched Steady-state WInd
  Flow Transformer (AB-SWIFT), a transformer-based model with an internal branched structure uniquely
  designed for atmospheric flow modeling. We train our model on a specially designed database of atmospheric
  simulations around randomised urban geometries and with a mixture of unstable, neutral, and stable atmospheric
  stratifications. Our model reaches the best accuracy on all predicted fields compared to state-of-the-art
  transformers and graph-based models. Our code and data is available at https://github.com/cerea-daml/abswift.
