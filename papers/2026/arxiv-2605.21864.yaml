summary: Testbed couples the Pangu weather model with PID closed-loop control to study typhoon track and
  intensity response to controlled environmental perturbations.
abstract: Understanding how typhoons respond to localized perturbations in their environmental fields
  is fundamental to assessing the limits of predictability and exploring the potential for track or intensity
  intervention. This study develops a dedicated simulation methodology testbed for typhoon sensitivity
  analysis by integrating the Pangu weather model, a high-precision AI forecasting system, with Proportional-Integral-Derivative
  (PID) closed-loop techniques. The testbed is constructed with modular functional blocks including a
  meteorological prediction module, an artificial perturbation input interface, a typhoon quantitative
  modeling module, and a PID closed-loop test module, implemented via a cross-platform MATLAB/ONNX technical
  framework. A Single-Input Single-Output (SISO) test system was built, with velocity and thermal perturbations
  set as the core inputs and typhoon track and intensity as the key output targets, to perform controlled
  perturbation-response experiments. The experiments reveal the feasible perturbation-response range,
  the parameter tuning behavior of the PID module, and the energy-scale response characteristics under
  different perturbation modes, and quantify the input-output coupling relationships of the test system.
  By constructing this testbed on an operational AI weather forecasting model, this study provides a framework
  that goes beyond idealized sensitivity studies typically validated only on low-order dynamical models.
  The testbed offers an expandable platform for investigating typhoon sensitivity to artificial environmental
  perturbations and provides a foundation for subsequent expansion toward multi-input multi-output architectures
  and advanced analysis strategies such as nonlinear PID or model predictive control.
