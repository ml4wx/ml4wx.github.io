summary: Probabilistic deep learning for European drought forecasting adds an ensemble-informed lower-tail
  drought bound that is better calibrated than reanalysis-only bounds, especially in dry conditions.
abstract: Predicting drought risk is essential for anticipating impacts on water resources, agriculture,
  ecosystems, and climate adaptation planning. Yet drought forecasts remain uncertain because variability
  can substantially alter regional precipitation and evaporative demand. Treating this variability as
  unstructured noise ignores the fact that internal variability has spatial, seasonal, and temporal structure
  and thus contains information that can be used to improve drought forecasting. We propose a deep-learning-based
  forecasting framework for European drought prediction and extend it with an uncertainty-aware drought
  bound that explicitly incorporates internal forecast variability from a large climate model ensemble.
  This bound represents a physically plausible lower-tail trajectory of future drought conditions and
  marks how severe drought could plausibly become under an unfavourable realisation of internal variability,
  giving adaptation planning a conservative, risk-averse reference. We compare the proposed bound with
  a lower bound derived from reanalysis data only and show that our proposed ensemble-informed bound is
  better calibrated across most regions and seasons. This is specifically true during anomalously dry
  conditions, when historical reanalysis alone underestimates lower-tail drought risk. Our results show
  that internal variability should be treated as a forecast quantity in its own right. More broadly, large
  ensembles provide a practical way to transfer physically plausible climate variability into machine-learning
  drought forecasts, yielding risk-aware bounds that are more informative for drought assessment under
  shifting climate conditions.
