summary: RealBench evaluates AI weather models on 2025 operational analyses and 10,000+ stations, revealing
  gaps versus reanalysis metrics on heatwaves and tropical cyclones.
abstract: 'Accurate evaluation of weather forecasting models is critical for their reliable deployment
  in real-world applications. However, existing benchmarks predominantly rely on reanalysis products such
  as ERA5, which are generated through delayed data assimilation and do not reflect the constraints of
  real-time operational forecasting, thereby resulting in a systematic mismatch between benchmark performance
  and real-world forecasting. In this work, we introduce RealBench, a next-generation benchmark for AI
  weather forecasting that emphasizes realistic evaluation under operational conditions. RealBench features
  a strictly out-of-distribution test set spanning 2025 to eliminate data leakage and capture recent atmospheric
  regimes. It integrates multiple data sources, including low-latency operational analysis and a large-scale
  global in-situ observation dataset comprising over 10,000 stations, enabling direct evaluation against
  real atmospheric measurements. Beyond standard global metrics, RealBench provides a comprehensive evaluation
  framework for high-impact extreme events, including heatwaves, cold surges, and tropical cyclones, using
  event-specific metrics that better reflect real-world forecasting priorities. The evaluation results
  reveal substantial discrepancies between reanalysis-based metrics and real-world performance, particularly
  concerning extreme events. By highlighting the limitations of existing benchmarks, this work establishes
  a more faithful and operationally relevant evaluation paradigm, providing a rigorous foundation for
  advancing next-generation AI weather forecasting systems. The benchmark implementation is available
  at: https://github.com/lixruize-del/NWP-Benchmark.'
