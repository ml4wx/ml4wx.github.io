summary: Dual-branch CNN with cross-attention for next-day wildfire spread reaches F1 0.4176, and shows
  common evaluation shortcuts inflate reported F1 by over 44%.
abstract: Accurate prediction of next-day wildfire spread is critical for disaster response and resource
  allocation. Existing deep learning approaches typically concatenate heterogeneous geospatial inputs
  into a single tensor, ignoring the fundamental physical distinction between static fuel/terrain properties
  and dynamic meteorological conditions. We propose FireSenseNet, a dual-branch convolutional neural network
  equipped with a novel Cross-Attentive Feature Interaction Module (CAFIM) that explicitly models the
  spatially varying interaction between fuel and weather modalities through learnable attention gates
  at multiple encoder scales. Through a systematic comparison of seven architectures -- spanning pure
  CNNs, Vision Transformers, and hybrid designs -- on the Google Next-Day Wildfire Spread benchmark, we
  demonstrate that FireSenseNet achieves an F1 of 0.4176 and AUC-PR of 0.3435, outperforming all alternatives
  including a SegFormer with 3.8* more parameters (F1 = 0.3502). Ablation studies confirm that CAFIM provides
  a 7.1% relative F1 gain over naive concatenation, and channel-wise feature importance analysis reveals
  that the previous-day fire mask dominates prediction while wind speed acts as noise at the dataset's
  coarse temporal resolution. We further incorporate Monte Carlo Dropout for pixel-level uncertainty quantification
  and present a critical analysis showing that common evaluation shortcuts inflate reported F1 scores
  by over 44%.
