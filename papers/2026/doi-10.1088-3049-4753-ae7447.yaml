summary: Neural ODEs forecast seasonal sea surface temperature indices such as ENSO at lower computational
  cost than NMME, reducing cumulative error and extending long-lead skill.
abstract: Global meteorological agencies provide seasonal forecasts based on indicators such as El Niño-Southern
  Oscillation (ENSO) and Indian Ocean variability. The NOAA operates forecasts up to 9 months, while the
  ECMWF offers extended predictions up to 13 months. However, these physics-based forecasting systems
  suffer from the chaotic nature of the atmosphere, leading to a rapid decline in forecast accuracy as
  the lead times increase. This study proposes a novel seasonal forecasting framework utilizing Neural
  Ordinary Differential Equations (Neural ODEs). Through comparative experiments with the North American
  Multi-Model Ensemble (NMME) model, we demonstrate that Neural ODEs significantly reduce computational
  costs and mitigate cumulative errors, thereby enhancing long-term forecasting capability. Furthermore,
  we employ multifractal detrended fluctuation analysis (MF-DFA) to quantify the memory characteristics,
  revealing the intrinsic limits of predictability in the climate system.
