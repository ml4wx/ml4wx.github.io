summary: Video diffusion model conditioned on low-dimensional metrics generates long, realistic MJO sequences
  from reanalysis, enabling idealized experiments such as perpetual MJO and ENSO modulation.
abstract: Generative Deep Learning is a powerful tool for modeling of the Madden-Julian oscillation (MJO)
  in the tropics, yet its relationship to traditional theoretical frameworks remains poorly understood.
  Here we propose a video diffusion model, trained on atmospheric reanalysis, to synthetize long MJO sequences
  conditioned on key low-dimensional metrics. The generated MJOs capture key features including composites,
  power spectra and multiscale structures including convectively coupled waves, despite some bias. We
  then prompt the model to generate more tractable MJOs based on intentionally idealized low-dimensional
  conditionings, for example a perpetual MJO, an isolated modulation by seasons and/or the El Nino-Southern
  Oscillation, and so on. This enables deconstructing the underlying processes and identifying physical
  drivers. The present approach provides a practical framework for bridging the gap between low-dimensional
  MJO theory and high-resolution atmospheric complexity and will help tropical atmosphere prediction.
