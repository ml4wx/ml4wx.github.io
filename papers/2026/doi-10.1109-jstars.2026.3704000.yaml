summary: IEEE Region 8 hackathon ML postprocessing of forecasts for local weather; top teams cut ECMWF
  IFS RMSSE by 30% on average, up to 59% for one variable.
abstract: Motivated by the need for climate-change resilience, this article summarizes the results of
  an international hackathon-style competition aimed at improving local weather forecasts using machine-learning
  postprocessing of multiple forecast sources and historical data. The approaches and results of the top
  teams are presented and compared, including support vector regression, gradient boosting, k-nearest
  neighbors, long short-term memory networks, and transformer-based architectures. Each approach tailors
  model architectures, preprocessing, feature selection, and hyperparameter tuning to the characteristics
  of the target meteorological variables across three case studies in Africa, the Middle East, and Europe
  (IEEE Region 8). Six variables are evaluated against ground-truth measurements collected over the seven
  days following each submission. The results show that careful architectural and feature-engineering
  choices, informed by domain knowledge, can substantially reduce error relative to the operational European
  Centre for Medium-Range Weather Forecasts Integrated Forecasting System benchmark. Across the five variables
  with nontrivial benchmark values, the best per-variable RMSSE reductions reach 59.26%, with an average
  reduction of 30.46% using postprocessing of historical numerical weather prediction forecasts and local
  observations, highlighting the significant potential of this technology.
