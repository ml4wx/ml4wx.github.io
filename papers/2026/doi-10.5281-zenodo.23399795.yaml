abstract: CLAIMA (Climate AI Modelling and Analysis), a Horizon Europe project coordinated by the Alfred
  Wegener Institute, has started work on a European Digital Twin Platform for Climate Modelling driven
  by artificial intelligence. Schedule until August 2030, it aims to make climate simulations faster and
  much cheaper to run, and to open them to a far wider community of users, without compromising scientific
  integrity. Read the full press release to learn more about the project and consult the website to stay
  up to date with recent developments at claima.eu
