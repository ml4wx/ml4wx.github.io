summary: ST-RadGAN combines graph attention, temporal transformer and adversarial training to downscale
  ERA5-Land surface solar radiation, reaching R² 0.87 and beating six baselines.
abstract: Global horizontal irradiance (GHI) is an important variable in surface-energy studies, solar-resource
  assessment, environmental meteorology, and eco-hydrological applications. Gridded reanalysis products
  provide spatially continuous radiation information, but their native resolution can limit localized
  analyses. This study presents ST-RadGAN, a deep learning framework for reconstructing a finer-grid ERA5-Land
  GHI reference from coarse-resolution meteorological inputs. The framework combines a Graph Attention
  Network (GAT) for feature-dependent aggregation over a fixed local grid neighborhood, a Temporal Transformer
  for integrating historical input representations, and conditional adversarial supervision alongside
  pixel-wise reconstruction. The implemented model performs deterministic conditional reconstruction of
  the terminal input time. Across three independent runs, ST-RadGAN achieved an RMSE of 1.6453 ± 0.0570,
  an MAE of 1.0481 ± 0.0140, and an R 2 of 0.8726 ± 0.0088 on the held-out test segment. Under the common
  repeated-run protocol, it obtained lower mean point-wise errors than the six compared baseline models.
