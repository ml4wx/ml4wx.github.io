summary: XGBoost downscales WRF 2 m air temperature to 100 m over Tehran (R² 0.96), feeding a heat-risk
  map of extreme-risk districts from XAI and fuzzy decision-making.
abstract: This study presents a framework for mapping urban heat stress risk in Tehran. It combines multi-year
  numerical simulations, machine learning downscaling, explainable AI, and multi-criteria decision-making.
  First, we produced 2-m air temperature (T2) fields using the Weather Research and Forecasting (WRF)
  model at 1-km resolution, driven by 0.25° boundary conditions. We then downscaled these fields to 100
  m using XGBoost, with spectral indices, urban morphology, and topography as predictors. The XGBoost
  model achieved an R 2 of 0.96 on test data. When validated against independent weather stations, it
  improved R 2 from 0.73 (WRF alone) to 0.79, and reduced RMSE from 0.89 °C to 0.75 °C. SHapley Additive
  exPlanations (SHAP) analysis identified elevation, spatial coordinates, and slope as the dominant predictors.
  Next, we combined the multi-year downscaled T2 data (for heatwaves between 2019 and 2022) with demographic,
  socio-economic, and urban-structure indicators using a Fuzzy Analytic Hierarchy Process (FAHP). The
  resulting risk map reveals sharp spatial disparities. Northern districts—which have higher elevation
  and more green space—show very low to low risk. In contrast, central and southern districts face high
  to extreme risk. For example, District 10 has 84% of its area under extreme risk. Only 4% of Tehran's
  area falls into the very low risk category. This integrated framework offers a robust approach that
  can be adapted to other cities after context-specific recalibration (particularly of the FAHP weights).
  It supports the identification of high-risk zones and contributes to climate-resilient urban planning.
