summary: Temporal deep learning models impute missing tropical cyclone Rmax values in IBTrACS best-track
  records, with temporal models outperforming non-temporal ones on fewer samples.
abstract: Probabilistic coastal hazard assessments require accurate characterization of tropical cyclone
  (TC) parameters, yet datasets often contain missing records for the radius of maximum winds (Rmax),
  a key variable in Joint Probability Method analyses. This study evaluates data-driven approaches for
  Rmax imputation, including one-dimensional Convolutional Neural Networks (1DCNNs), Long Short-Term Memory
  (LSTM) networks, and conventional machine learning models. We examine physics-informed input augmentation,
  temporal modeling, and transfer learning using synthetic RAFT and STORM datasets for pre-training and
  observational IBTrACS data for fine-tuning. Including the radius of 34-knot winds (R34) substantially
  improves performance across all model types. Temporal models achieve higher average correlations than
  non-temporal models despite using approximately an order of magnitude fewer samples, indicating better
  preservation of relative Rmax variability across storms. This advantage is more pronounced when R34
  is unavailable, suggesting temporal information can partially compensate for missing storm-size predictors.
  Transfer learning does not improve performance, likely because synthetic datasets have lower and less
  variable Rmax distributions than IBTrACS. These findings demonstrate the potential of temporal deep
  learning for reconstructing incomplete TC records and highlight the importance of physics-informed inputs,
  observational data availability, and distributional consistency in coastal hazard assessment.
