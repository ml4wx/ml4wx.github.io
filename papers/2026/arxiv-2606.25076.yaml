summary: Position piece arguing that ML and digital tools such as agentic software engineering and open
  compressed data will reshape how weather and climate centres develop, verify and deliver forecasts.
abstract: 'Following the success of machine learning in producing weather predictions with competitive
  skill compared to complex traditional systems, this article shifts attention from forecast output to
  the working practices that make prediction systems possible. We argue that machine learning and recent
  digital technologies will reshape the forecasting value chain: how models are coded and developed, how
  observations and Earth-system data are exploited, how data and computing are managed, how systems are
  verified, and how information is created, evaluated and turned into services. We discuss six non-exhaustive
  areas in which agentic software engineering, open and compressed data, shared verification workflows,
  interactive computing and generative methods may make modelling, evaluation and service creation faster,
  more interactive and more widely accessible. These changes will require weather and climate centres
  to adapt their infrastructures, data stewardship, trust and quality-assurance frameworks, skills and
  service delivery while maintaining scientific understanding, operational reliability, human expertise
  and their public-service role.'
