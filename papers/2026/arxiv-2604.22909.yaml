summary: Masked Siamese Networks discretize daily temperature series into climate-state clusters that
  show statistical associations with El Niño events.
abstract: 'Understanding and representing complex climate variability is essential for both scientific
  analysis and predictive modeling. However, identifying meaningful climate regimes from raw variables
  is challenging, as they exhibit high noise and nonlinear dependencies. In this work, we explore the
  use of Masked Siamese Networks to discretize climate time series into semantically rich clusters. Focusing
  on daily minimum and maximum temperature, we show that the resulting representations: (i) yield clusters
  that reflect meaningful climate states under our modeling assumptions, offering a simplified representation
  for downstream use; (ii) enable sampling and analysis of specific climate scenarios; and (iii) exhibit
  statistical associations with El Niño events, underscoring their scientific relevance. Our findings
  highlight the potential of self-supervised discretization as a tool for climate data analysis and open
  avenues for incorporating richer climate indicators in future work.'
