summary: ML reconstructs landfalling tropical cyclone precipitation in China for 1960 to 2019, finding
  falling totals but rising 3-hour extremes on the southeast coast.
abstract: Extreme precipitation induced by tropical cyclones poses severe risks to both coastal and inland
  regions. However, existing research on TC precipitation is often constrained by sparse spatial coverage,
  limited temporal records, and coarse data resolution. To address these limitations, we developed a machine
  learning-based model, which reconstructs TC-induced precipitation by integrating key cyclone characteristics
  and environmental factors. The model was applied to simulate landfalling TC precipitation across China
  from 1960 to 2019. Based on the reconstructed TC precipitation data, the spatiotemporal characteristics
  of historical TC-induced precipitation in China were analyzed. Results show that from 1960 to 2019,
  the Average Annual Tropical Cyclone Precipitation, the Mean Tropical Cyclone Precipitation, and the
  Mean Maximum 3‑hour Tropical Cyclone Precipitation exhibited a fluctuating downward trend, whereas the
  Maximum 3‑hour Tropical Cyclone Precipitation Extremum showed an increasing trend. In the southeastern
  coastal areas of China, total TC precipitation decreased, but the intensity of extreme precipitation
  increased significantly. While trends over inland regions, including Northeast China, are generally
  not statistically significant after multiple-testing correction. These findings indicate that it is
  necessary to pay attention to the risk of extreme TC precipitation in northern and inland regions, and
  further in-depth research should be conducted on the potential TC impacts in these areas.
