summary: Recreates the 1944 D-Day forecasts with ECMWF's AIFS-ENS, showing the ML ensemble moves the storm
  too fast and gives overconfident landing conditions.
abstract: Abstract The new film ‘Pressure’ brings renewed attention to one of the most dramatic weather
  forecasts ever. In June 1944, James Stagg faced the unenviable task of advising whether conditions would
  allow the D‐Day landings to proceed, with the lives of 160 000 troops and the fate of the war in the
  balance. Using AIFS‐ENS, the ECMWF machine‐learning ensemble forecast system, we recreate the forecasts
  in the days before 6th June. Even at short range, AIFS‐ENS moves the storm too rapidly into the Norwegian
  Sea giving undue confidence for favourable conditions for the landing in Normandy.
