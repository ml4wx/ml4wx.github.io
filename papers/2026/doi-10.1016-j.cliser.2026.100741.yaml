summary: Reviews typhoon prediction from NWP to deep learning and AI-physics hybrids, through observations,
  hydrodynamic coupling, impacts and forecast-based financing, with ML as one strand.
abstract: While recent advancements in tropical cyclone prediction have been extensively documented, existing
  review literature remains heavily fragmented into isolated academic domains, such as artificial intelligence,
  data assimilation, or coastal hydrodynamics. This fragmentation obscures the operational reality of
  disaster risk reduction. To address this critical gap, this paper presents a transdisciplinary systematic
  review of the entire end-to-end climate service value chain. First, the examination of the paradigm
  shift in atmospheric modeling, contrasting traditional Numerical Weather Prediction (NWP) with the rapid
  emergence of pure deep learning and AI-physics hybrid frameworks. Second, the evaluation of multi-platform
  observational networks and the integration of Interpretable AI (XAI) for operational trust. Third, the
  bridging of the “scale gap” by analyzing how synoptic meteorological forcing is dynamically coupled
  with high-resolution hydrodynamic models to predict secondary hazards and compound extremes. Fourth,
  the review of the translation of these physical hazards into micro-scale structural engineering impacts.
  Finally, the synthesis of these domains into the framework of socio-economic Impact-Based Forecasting
  (IBF) and Forecast-based Financing (FbF). Ultimately, this review establishes that advancing modern
  typhoon resilience requires moving beyond isolated computational superiority toward a unified convergence
  of atmospheric physics, civil engineering, and user-centric climate services.
