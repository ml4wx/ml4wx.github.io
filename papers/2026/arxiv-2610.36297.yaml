summary: FASST replaces the atmosphere and sea ice in a coupled climate model with U-Net emulators, achieving
  stable 140-year free runs with global SST close to CESM2 piControl.
abstract: Coupled climate simulations are computationally expensive, largely because of the atmosphere.
  We introduce FASST, a coupled climate model that retains the prognostic POP2 ocean while replacing the
  atmosphere and sea ice with lightweight U-Net emulators. The atmospheric emulator is diagnostic, predicting
  surface fluxes from the evolving ocean-ice state every $6$ simulated hours, while the sea-ice emulator
  advances the ice state monthly. For $140$ years of unforced integration, FASST maintains a stable global-mean
  climate without SST restoring, with post-transient global-mean SST of $291.30 \pm 0.22\mathrm{K}$ compared
  with $291.25 \pm 0.10\mathrm{K}$ in CESM$2$ piControl. FASST also captures interannual Niño-$3.4$ variability,
  although with weaker amplitude than CESM ($0.62\mathrm{K}$ versus $1.02\mathrm{K}$). These results demonstrate
  that a stateless learned atmosphere can sustain stable, free-running coupled climate simulations over
  century-scale integrations.
