summary: Deep learning on 796 basins finds compound atmospheric-riverine heatwaves tripled since the 1980s
  and may coincide in 98.5% of riverine heatwaves by 2100.
abstract: Record-breaking heatwaves disrupt global water, energy and food systems, yet the co-occurrence
  of atmospheric and riverine events remains largely unexplored. Here we analyse 796 river basins in the
  USA and Central Europe to characterize such co-occurring atmospheric-riverine compound heatwaves. Combining
  water quality observations with a deep learning model, we find that compound heatwaves have increased
  by about 0.40 events per decade since the 1980s. This corresponds to a rise from roughly 0.76 events
  per year in the early period to about three times that frequency today, meaning their occurrence has
  effectively tripled over the past four decades. This trend coincides with the rapid intensification
  of riverine heatwaves, which have increased in frequency (114%), duration (148%) and intensity (95%)
  between 1981-1990 and 2010-2019, far outpacing changes in atmospheric heatwaves. Compound occurrences
  are primarily controlled by climatic (59.2%), topographic (22.4%) and hydrological (18.3%) factors,
  with amplified trends in high-elevation (>3,000 m) mountain rivers (+128% per decade). Compared with
  isolated riverine heatwaves, compound heatwaves drive an additional 16% rise in water temperature and
  a further 2.9% decline in dissolved oxygen. Under a high-emissions scenario, 98.5% of riverine heatwaves
  will coincide with atmospheric heatwaves by 2100. These findings highlight the escalating threats of
  compound heatwaves to freshwater ecosystems and the need to incorporate their dynamics into future water
  risk assessments.
