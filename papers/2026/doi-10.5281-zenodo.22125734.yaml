summary: Hybrid Markov chain and linear regression model for temperature variability using elevation,
  vegetation and water proximity; methodological novelty is limited.
abstract: Determining climate behaviour has historically been a difficult science to predict accurately,
  mainly due to the many complex and changing interconnections among geophysical, geographical, and environmental
  components of the atmosphere. Most traditional methods have tended to focus on identifying time-related
  patterns in climate data or trends (statistical) in climate data; therefore, they are typically limited
  by their ability to capture the complex nature of climate systems. In this research project, we propose
  an integrated approach that combines Markov chain modelling with regression analysis to enhance existing
  climate forecasting models. The Markov modelling is designed to model the probability of transitioning
  between different climate states; whereas, the regression model is developed to quantify how individual
  physical parameters like elevation, vegetative density, and proximity to water—individually and collectively
  contribute to variations in temperature. Through the use of a weighted mechanism for integrating both
  aspects of the modelling process, our combined approach yields more robust, adaptable, and interpretable
  climate forecasts than traditional single-method climate forecasting models. Our experimental evaluations
  demonstrated that the proposed method not only improves climate forecast accuracy it also provides greater
  transparency and adaptability than traditional single-method models. Therefore, the proposed method
  presents a viable pathway for understanding and predicting variability in climate conditions.
