summary: Uses conditional flow matching for unsupervised domain adaptation of radiometer images, improving
  GPM rain precipitation estimation across satellite instruments.
abstract: Deep generative networks have recently achieved unprecedented performance in precise image and
  video editing using sophisticated textual prompts. However, the effectiveness of such models heavily
  depends on access to very large supervised and annotated image datasets, which can be very difficult
  to obtain. This is particularly true for satellite instruments, which very rarely overlap with labelled
  data, and suffer from domain shifts in the rare occasions they do. In this paper, we investigate the
  potential of flow matching models for unsupervised domain adaptation of satellite radiometer images.
  Our main contribution is a novel unsupervised method that achieves precise domain alignment by leveraging
  parts of the deterministic ordinary differential equations in flow matching models, conditioned on different
  satellite instruments. A key strength of our approach is its ability to preserve essential information
  while adapting across any domains since the perturbations are in theory bijective. Extensive experiments
  conducted on the GPM-Core constellation show the benefit of our conditional domain adaptation, particularly
  in improving rain precipitation estimation from radiometer imagery.
