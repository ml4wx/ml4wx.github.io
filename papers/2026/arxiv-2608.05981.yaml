summary: Temporal-enhanced climate data super-resolution using bidirectional latent-frame alignment to
  improve spatial resolution over single-frame methods.
abstract: High-resolution climate data is crucial for meteorological predictions and for informing decision
  support across diverse domains. However, the acquisition of such high-resolution climate information
  is often prohibitively costly, necessitating the development of data-driven meteorological prediction
  models. These models aim to generate fine-grained climate data from low-resolution inputs, a process
  termed climate data super-resolution (SR). Nevertheless, recent advancements in deep learning for climate
  data SR have primarily focused on leveraging single-frame spatial information, largely neglecting the
  temporal correlations between different time frames that could enhance SR outcomes. Furthermore, climate
  data are inherently stochastic and noisy, rendering widely used temporal alignment methods, such as
  optical flow models, ineffective in this context. Consequently, the development of a framework tailored
  for climate data SR that effectively captures implicit temporal correlations remains an unresolved challenge.
  To this end, we propose a novel Temporal-Enhanced framework with bidirectional temporal alignment. In
  essence, our framework establishes a temporal bridge to enhance spatial resolution in climate data SR
  through bidirectional alignment, leading to improved SR performance. Within this framework, Paired Latent
  Mapping achieves spatial alignment and noise reduction by unifying latent spaces. Then a Bidirectional
  Temporal Alignment captures temporal correlations by training forward and backward networks on consecutive
  latent frames. Temporal Enhanced Super-resolution then optimizes the entire framework for climate data
  SR. Experiments on large-scale real-world datasets demonstrated the superior performance of our framework.
