summary: Compares CNN, ConvLSTM, CNN-LSTM and Transformer models on satellite and reanalysis data for
  extreme weather prediction, with only qualitative claims of benefit.
abstract: 'Climate change has some what currently increased the frequency and severity of extreme weather
  events such as the floods, the storms, the droughts, and some of the heatwaves. Accurate early forecasting
  That is essential for some of the disaster preparedness and reducing losses. Traditional numerical weather
  prediction methods are powerful but computationally expensive and sometimes less effective for some
  of the rare but also some localised events. Now This paper proposes an artificial intelligence framework
  for predicting extreme weather using satellite imagery and meteorological datasets. Public datasets
  such as the GOES, Himawari, Sentinel, ERA5, MERRA 2, and GPM IMERG are reviewed. Four model architectures
  are explored as: the CNN, the Continued Convo LSTM, the CNN LSTM, and the Transformer based networks.
  Performance is evaluated using classification and meteorological metrics including the Precision, the
  Recall, some of the the F1 score, AND the ROC AUC, CSI, POD, and FAR. The study concludes that the hybrid
  spatiotemporal deep learning models offer some of some of the cool strong potential for improving the
  forecast accuracy and lead time and more'
