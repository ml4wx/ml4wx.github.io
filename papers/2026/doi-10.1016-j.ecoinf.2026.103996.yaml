summary: BiLSTM-PSO with SHAP maps wildfire susceptibility in British Columbia from climate indicators
  (AUC 0.92), identifying drought index and wind as main controls.
abstract: Wildfire activity in British Columbia, Canada, has intensified in recent years, yet spatially
  explicit, explainable methods for assessing susceptibility and prioritizing exposure remain limited.
  This study presents an integrated framework that combines Earth observation, geospatial indicators,
  and geospatial deep learning with SHAP-based explainable AI for climate-informed wildfire susceptibility
  and exposure assessment. Wildfire records from 2000 to 2024 were combined with eighteen climatic, vegetation,
  topographic, and anthropogenic indicators from SRTM, TerraClimate, ERA5-Land, Sentinel-2, and national
  datasets. Long short-term memory (LSTM) and bidirectional LSTM (BiLSTM) models, including particle swarm
  optimization (PSO)-enhanced variants, mapped susceptibility, while SHapley Additive exPlanations identified
  the dominant controls. Potential exposure within the very high class was evaluated for households, roads,
  and vegetation and rangeland across ten fire-prone districts. Results indicate an increasingly climate-sensitive
  fire regime that intensified after 2019, with an extreme 2023 season under warmer, drier conditions.
  The BiLSTM-PSO model achieved the best performance (test AUC = 0.92, accuracy = 82.5%, F1-score = 82.6%),
  remained stable across seeds and large-fire thresholds, and assigned 24.7% of the province to the very
  high class. The drought index (DSI) and forested (tree-cover) land use, road and household proximity,
  temperature, and wind speed emerged as the most influential predictors, whereas humidity, precipitation,
  and soil moisture reduced susceptibility. High and very high susceptibility concentrated in the south-central
  and southeastern interior, with Central Kootenay, Okanagan-Similkameen, East Kootenay, and Thompson-Nicola
  as the most prominent exposure hotspots. ENSO and PDO teleconnections influenced fire only indirectly,
  while susceptibility agreed with an independent cross-border model (Spearman ρ = +0.42). Overall, the
  framework provides an explainable basis for susceptibility modelling, exposure prioritization, and adaptation
  planning.
