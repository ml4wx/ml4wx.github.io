summary: Random forest with SHAP links Ghana's 1980–2020 UTCI heat-stress trends to AOD and climate indices,
  explaining only 22% of out-of-sample variance.
abstract: 'ABSTRACT Rising temperatures and rapid urbanization have intensified heat stress risks in Ghana''s
  coastal cities. However, limited knowledge exists on long‐term human thermal comfort variability and
  its relationships with large‐scale climate indices in tropical coastal settings. This study investigated
  four‐decade patterns of outdoor thermal comfort along Ghana''s coastal‐urban corridor from 1980 to 2020
  using the Universal Thermal Climate Index (UTCI). Maximum UTCI increased significantly by 0.029°C year
  −1 , very strong heat‐stress days increased by 1.393 days year −1 , and comfortable conditions declined
  across most regions. Inland cities experienced stronger warming, whereas coastal centres exhibited more
  moderate increases, a pattern that may be consistent with coastal climatic moderation. Change point
  analysis identified significant shifts in 1998 and 2002, broadly coinciding with El Niño events and
  accelerated 21st‐century warming. Random Forest modelling with temporal validation (training: 1980–1999;
  testing: 2000–2020) explained a modest 22% of out‐of‐sample monthly UTCI variance ( R 2 = 0.22; RMSE
  = 1.47°C). The analysis emphasised relative predictor importance rather than predictive accuracy. SHAP
  results identified aerosol optical depth as the strongest model‐based contributor (mean absolute SHAP
  = 0.782), followed by the Tropical South Atlantic index (0.277). Higher observed AOD values were associated
  with positive SHAP contributions and higher predicted UTCI within the model. The machine‐learning framework
  identifies statistical associations rather than physical causality. Future work using aerosol speciation,
  radiative‐transfer analysis, and process‐based climate modelling is needed to clarify the underlying
  mechanisms. These findings highlight increasing thermal stress along Ghana''s coastal‐urban corridor
  and suggest that aerosol–climate interactions deserve greater attention in tropical coastal heat‐stress
  research.'
