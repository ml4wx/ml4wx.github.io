summary: WeatherSyn is an instruction-tuned multimodal LLM that generates weather forecast reports for
  31 US cities, outperforming leading closed-source MLLMs on structured weather aspects.
abstract: Accurate weather forecast reporting enables individuals and communities to better plan daily
  activities and agricultural operations. However, the current reporting process primarily relies on manual
  analysis of multi-source data, which leads to information overload and reduced efficiency. With the
  development of multimodal large language models (MLLMs), leveraging data-driven models to analyze and
  generate reports in the weather forecasting domain remains largely underexplored. In this work, we propose
  the Weather Forecasting Report (WFR) task and construct the first instruction-tuning dataset for this
  task, named~\DatasetNameL, which covers 31 cities in America and 8 weather aspects. Based on this corpus,
  we develop the first model, \ModelNameL, specialized in generating weather forecast reports. Evaluation
  across multiple metrics on our dataset shows that \ModelNameL~ consistently outperforms leading closed-source
  MLLMs, particularly on structurally complex weather aspects. We further analyze its performance across
  diverse geographic regions and weather aspects. \ModelNameL~ demonstrates strong transferability across
  different regions, highlighting its zero-shot generalization capability. \ModelNameL~offers valuable
  insight for developing MLLMs specialized in weather report generation. .
