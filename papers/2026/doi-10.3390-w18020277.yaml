summary: Random Forest statistical downscaling of HadGEM3 CMIP6 projections for 23 Turkish stations, projecting
  basin-wide drying of 12 to 34 mm by 2100 under SSP2-4.5.
abstract: Climate change increasingly threatens the sustainability of regional water resources; therefore,
  robust station-scale precipitation projections are essential for basin-level planning. This study aims
  to develop and evaluate a hybrid, machine-learning-based statistical downscaling framework to generate
  monthly precipitation projections for the 21st century in the Büyük Menderes Basin, western Türkiye,
  using the HadGEM3-GC31-LL global climate model from the CMIP6. Monthly observations from 23 rainfall
  observation stations and ERA5 reanalysis predictors were employed to train station-specific Random Forest
  (RF) models, with optimal predictor sets identified through a multistage selection procedure (MPSP).
  Coarse-resolution general circulation model (GCM) fields were harmonized with ERA5 data using a three-stage
  inverse distance weighting (IDW), Delta, and Variance rescaling approach. The downscaled projections
  were bias-corrected using Quantile Delta Mapping (QDM) to maintain the climate-change signal. The RF
  models exhibited strong predictive skill across most stations, with test Nash–Sutcliffe Efficiency (NSE)
  values ranging from 0.45 to 0.81, RSR values from 0.43 to 0.74, and PBIAS values from −21.99% to +5.29%.
  Future projections indicate a basin-wide drying trend under both scenarios. Relative to the baseline,
  mean annual precipitation is projected to decrease by approximately 12.2, 19.6, and 33.7 mm in the near
  (2025–2050), mid (2051–2075), and late (2076–2099) periods under SSP2-4.5 (Shared Socioeconomic Pathway
  2-4.5, a moderate greenhouse gas scenario). Under the high-emission SSP5-8.5 scenario, projected decreases
  are 25.2, 53.2, and 86.9 mm, respectively. Late-century reductions reach approximately 15–22% in several
  sub-basins. These findings indicate a substantial decline in future water availability and underscore
  the value of RF-based hybrid downscaling and trend-preserving bias correction for water resources planning
  in semi-arid Mediterranean basins.
