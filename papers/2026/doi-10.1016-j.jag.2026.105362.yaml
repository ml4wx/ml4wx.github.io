summary: Compares 18 bias-correction methods, including random forests, for CMIP6 and ERA5 climate variables
  over Benin; ML does not systematically outperform classical methods.
abstract: 'Regular gridded datasets commonly exhibit significant biases and therefore require correction
  before being used in impact studies. This study highlights the challenges involved in improving the
  adjustment of climate variables (precipitation and temperature), hydrological variables (soil water
  content, streamflow, evapotranspiration), and radiative variables (longwave and shortwave radiation).
  Eighteen bias-correction (BC) methods were selected, covering a wide range of approaches, including
  classical statistical techniques (e.g., quantile mapping), distribution-based methods (e.g., kernel
  smoothing), and machine learning approaches (e.g., random forests). BC outputs from CMIP6 models and
  ERA5 reanalyses were evaluated against observations from contrasting climatic regions of Benin. The
  evaluation relied on Kling–Gupta Efficiency (KGE), Pearson correlation coefficient, relative-mean-absolute-error
  (RMAE), and fraction within tolerance (FTI), computed at hourly, daily, and monthly temporal scales.
  It also considered the representation of diurnal and monthly cycles, as well as consistency with mean
  values and trends of various climatic extreme indices. Three calibration strategies were explored: (i)
  using the first half of the time series for calibration to assess the preservation of future trends;
  (ii) the second half to evaluate the ability to reconstruct missing data; and (iii) 80% of the series
  to investigate the effect of sample size. Finally, bias corrections were applied by stratifying the
  data by month and intensity ranges to assess the limitations of global BC methods. Results show that
  machine learning methods do not systematically outperform classical bias-correction approaches. Performance
  varies considerably by variable, station, and climatic context. It is therefore important to select
  methods suited to the specific conditions and intended use, to improve the reliability of future climate
  and hydrological projections.'
