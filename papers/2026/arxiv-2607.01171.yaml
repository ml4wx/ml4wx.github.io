summary: Adds a differentiable decision loss to energy-score training of sample-based forecasters, improving
  cost-sensitive tails in wind dispatch and frost protection tasks.
abstract: Sample-based generative models are increasingly used for probabilistic forecasting in high-stakes
  decision settings, yet their training objectives are blind to the decision maker's cost structure. These
  models are commonly trained with strictly proper scoring rules, such as the energy score, which allocate
  their training signal in proportion to data density, with no awareness of where forecast errors are
  most costly for downstream decisions. We therefore propose decision-aware training for sample-based
  generative models, augmenting the energy score objective with a differentiable decision loss that directly
  penalises the cost incurred by acting on the model's forecast. This combined loss is theoretically grounded,
  as the decision loss is itself a proper scoring rule. We compute the decision loss via a differentiable
  optimisation layer. Its gradient concentrates in cost-sensitive regions of the output space, making
  the method's effects interpretable and predictable from the cost structure. We validate the method on
  one synthetic and two real-world tasks. In the synthetic task, the method corrects the mode weights
  of a learned bimodal distribution; in a wind power dispatch task, it concentrates improvements in the
  rare but costly tail region, and in a frost protection task, it improves how well the decision costs
  are anticipated. Our method yields generative models that retain full probabilistic forecasts while
  being better aligned with the decision maker's specific cost structure.
