summary: A typology framework classifies ways to blend machine learning with physics-based weather and
  climate models, outlining strategic routes to incremental adoption of ML components.
abstract: The integration of machine learning (ML) with traditional physics-based models is reshaping
  the landscape of weather and climate prediction. On their own, ML-based and physics-based approaches
  each have significant benefits - but also challenges. Deploying both these approaches side by side has
  the potential to accelerate the pull through of emerging science in a trusted and practical way. But
  there are many choices that can be made to how we "blend" ML and established physics-based modelling
  systems to get the optimal benefits. This paper aims to provide a typology of blended modelling approaches
  and discusses some of the strategic benefits that come with them. It can be used not just to classify
  modelling systems, but also identify routes to gradual, incremental or wholesale development and implementation
  of new and emerging capabilities. These approaches provide a practical path to innovation by combining
  the speed and adaptability of machine learning with the robustness, trust, and interpretability of physics-based
  systems. By adopting a structured vocabulary and outlining the benefits and limitations of each approach,
  this framework supports informed decision-making and strategic planning, and can be used by the wider
  community to navigate the transition to next-generation prediction systems.
