summary: Compares heat-mortality forecasts for Europe in summer 2024 from physics-based and data-driven
  weather models; both underestimate mortality, more so for data-driven.
abstract: Abstract. Heat has emerged as a major public health concern. Over 62,000 heat-related deaths
  were estimated to have occurred during the European summer of 2024, exemplifying the pressing need to
  develop effective early warning systems. Such systems depend critically on the quality of the underlying
  forecasts, and recent work has focused on developing impact-based forecasts for heat-related mortality,
  which provide impact-oriented information. To date, heat-related mortality forecasts have been based
  on the output of numerical weather prediction models, or physics-based forecasts. The field of weather
  forecasting is undergoing a rapid transformation with the advent of skillful data-driven forecasts.
  This study compares European temperature-related mortality forecasts for summer 2024 based on physics-based
  weather forecasts with those based on data-driven weather forecasts. Our results highlight that both
  the physics-based and data-driven forecasts systematically underestimate temperature-related mortality,
  more pronouncedly so in the latter. Both types of forecasts appear sensitive to forecast errors at hot
  temperatures, due to the non-linear relationship between temperature and mortality. Nevertheless, temperature-related
  mortality forecasts based on data-driven weather forecasts appear to be a promising alternative to traditional
  physics-based weather forecasts, and targeted improvement of the representation of hot temperatures
  through bias correction or adjustment of the loss function to give greater weighting to hot temperatures
  would be beneficial for temperature-related mortality forecasting. We suggest the application of this
  approach to both data-driven and physics-based forecast ensembles as an important next step in the continued
  development of informative, impact-oriented forecasts.
