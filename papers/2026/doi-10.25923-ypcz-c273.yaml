summary: NOAA's AIGFS v1.1 fine-tunes an AI global forecast model with an adjusted MSE loss, improving
  wind representation and hurricane intensity forecasts out to 72 hours.
abstract: We present an update to NOAA’s Artificial Intelligence Global Forecast System (AIGFS), incorporating
  several key structural and operational improvements. The model is fine-tuned using an adjusted mean
  squared error (AMSE) loss function featuring enhanced wind vector representations. Additionally, the
  training data has been extended to encompass four years of Global Data Assimilation System (GDAS) analysis,
  and the fine-tuning schedule was updated to train the model autoregressively from forecast hour 6 out
  to 72 at 6-h intervals. This updated AMSE loss function significantly mitigates the over-smoothing issue
  common in machine learning models, thereby resolving small-scale features and markedly improving hurricane
  intensity forecasts. Overall, headline verification scores demonstrate considerable improvement over
  the previous AIGFS version.
