summary: Perspective arguing that ECMWF-style machine learning forecasts now match or beat physics-based
  models and can be embedded operationally alongside them.
abstract: Climate change is directly linked to the increase in intensity and frequency of extreme weather
  events such as heatwaves, heavy rainfall, droughts, floods and hurricanes. In this context, anticipating
  such extreme events with accurate weather forecasts is of the highest importance in order to provide
  early warnings to the population and adapt to climate change. Forecasting has long relied on physical
  models to anticipate atmospheric changes, underpinning decisions that affect millions of lives and livelihoods.
  In recent years, machine learning has emerged as a powerful new tool, learning from decades of weather
  data to generate forecasts with remarkable speed and accuracy. Here we show that the integration of
  machine learning into operational weather prediction, as pioneered by the European Centre for Medium-Range
  Weather Forecasts, not only matches but regularly surpasses traditional physics-based methods in many
  metrics. These advances demonstrate that machine learning—far from being a mysterious or threatening
  ‘black box’—can already be responsibly embedded alongside physics-based methods, boosting predictive
  skill while fostering new forms of scientific and operational collaboration
