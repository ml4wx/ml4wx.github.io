summary: A design-landscape paper outlining data, physics, and AI choices for a foundation model of the
  Martian atmosphere, with candidate downstream applications and data assimilation.
abstract: The martian atmosphere hosts dynamical phenomena ranging from planet-encircling dust storms
  to mesoscale orographic clouds and nocturnal low-level jets. General circulation model show capability
  to simulate these phenomena, but is computationally expensive at resolution needed to resolve mesoscale
  features. While assimilation of satellite remote sensing observation enable forecasting capabilities
  using such models, observation record is often sparse, short and fragmented across instrument generators.
  These constraints motivate the development of a data-driven foundation model for the Martian atmosphere.
  Foundation models live in a complex design landscape. There is an interplay between the available data,
  the physics of the underlying processes and corresponding developments in AI. Even though the idea of
  a foundation model is to address multiple use cases in a data- and compute-efficient manner, it is important
  to have a clear picture what applications can sensibly addressed by a single model. The purpose of this
  paper is to elucidate this design landscape. We discuss available data ranging from atmospheric retrievals
  to reanalysis datasets as well as existing physical models. Moreover, we identify a wide range of candidate
  downstream applications. Finally, we consider relevant recent developments in artificial intelligence
  (AI) that can be leveraged in this context. Here, we put a particular emphasis on AI models for atmospheric
  physics, data-driven approaches to data assimilation as well as methods to work in a limited data setting.
