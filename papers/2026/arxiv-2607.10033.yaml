summary: TraCE-ST, a probabilistic Lagrangian causal tracking method, recovers known drivers of Earth
  extremes and proposes new ones, such as orography-driven vorticity for Tropical Storm Debby.
abstract: Identifying the causes of Earth's extremes is challenging because counterfactual experiments
  are not possible in the observed world. Data-driven causal discovery complements computationally expensive
  and potentially biased numerical experiments, but existing methods can struggle with undersampled, high-dimensional
  data and fail to recover multi-timestep, multivariate pathways leading to specific events. We introduce
  Tracer of Causal Evolutions in Space and Time (TraCE-ST), a probabilistic Lagrangian approach that produces
  event-conditioned causal trajectories in multivariate gridded data. TraCE-ST recovers known causal drivers
  and estimates their relative contributions in synthetic experiments and real-world extremes, including
  the 1991 Mount Pinatubo eruption. TraCE-ST also highlights less-studied drivers, such as orography-driven
  vorticity for Tropical Storm Debby (2006) and anomalous ocean-surface fluxes for the 2021 Pacific Northwest
  heatwave. Here, we propose causal tracking as an efficient data-driven framework for synthesizing causal
  evidence and generating testable hypotheses, complementing association analyses and numerical modeling
  while accelerating the study of high-impact events.
