summary: SR-Weather deep super-resolution downscales 0.25° FuXi forecasts to 1-km air temperature, cutting
  7-day error over South Korea by more than 20%.
abstract: Abstract Artificial intelligence has improved the accuracy and efficiency of weather forecasting,
  surpassing traditional numerical weather prediction models. However, the coarse spatial resolution of
  global weather forecasting systems limits their ability to capture fine-scale surface heterogeneity
  and localized extremes, particularly in regions with complex terrain or urban heat island effects. Here,
  we introduce SR-Weather, a deep learning-based super-resolution framework that converts coarse 0.25°
  forecasts into 1-km surface air temperature fields using MODIS-derived temperature targets and high-resolution
  auxiliary inputs. SR-Weather outperforms existing super-resolution methods by explicitly incorporating
  spatial context, such as topography, impervious surface fraction, and seasonal climatology maps of air
  temperature. When SR-Weather was applied to the FuXi global weather forecast, the 7-day forecast error
  in South Korea decreased by more than 20%, which was comparable to the 1-day forecast error from low-resolution
  prediction using simple spatial interpolation. In addition, SR-Weather effectively reconstructs missing
  pixels in MODIS-derived air temperature maps under heavy cloud contamination by leveraging auxiliary
  variables and climatologically smoothed fields. Although validated over South Korea, the method is region-agnostic
  and readily generalizable because of the global availability of MODIS inputs and minimal auxiliary data
  requirements. These results indicate that SR-Weather is a scalable and high-fidelity tool for enhancing
  machine learning-based weather forecasts at fine spatial scales.
