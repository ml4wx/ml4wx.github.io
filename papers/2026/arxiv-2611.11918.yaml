summary: Shows GraphCast can propagate ensemble covariances in a cycled EnVar/EnKF system assimilating
  real observations, with spread comparable to a fully physics-based reference.
abstract: Integrating machine learning weather prediction (MLWP) models into classical data assimilation
  (DA) workflows requires that they accurately evolve ensemble covariances. We evaluate this capability
  in a two-way coupled DA system, where an ensemble variational (EnVar) component evolves the mean and
  an ensemble Kalman filter (EnKF) evolves the covariances. The system is cycled over one month and assimilates
  a wide range of real-world observations, including microwave radiances. Using the MLWP model GraphCast
  for the EnKF and the physics-based MPAS model for the EnVar yields ensemble spread and covariances comparable
  to a reference configuration in which MPAS evolves both components. The resulting EnVar mean achieves
  consistently lower RMSE against GFS analyses, except near the model top, where spurious correlations
  degrade performance. These results demonstrate that MLWP models can propagate covariance information
  in a realistic DA cycling system and provide a proof of concept for their integration into future operational
  ensemble systems.
