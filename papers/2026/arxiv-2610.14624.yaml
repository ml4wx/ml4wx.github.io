summary: EarthAlign provides a 2000-2024 dataset with grounded captions for ERA5 fields, and MeteoLIP
  aligns meteorology and language, beating CLIP and SigLIP baselines.
abstract: 'Interpreting Earth system conditions is central to understanding environmental risks and informing
  decisions across weather- and climate-sensitive sectors. Existing multimodal weather systems primarily
  target task-specific prediction, generation, or question answering, while general-purpose alignment
  between Earth system data and language remains underexplored due to the limited availability of diverse
  language supervision grounded in meteorological conditions. To fill this gap, we introduce EarthAlign,
  a large-scale dataset with broad geographic coverage spanning 2000-2024 that combines 10 expert-curated
  natural event and disaster data sources with climatology-derived normal-weather samples. Each sample
  includes temporal and geospatial information and four grounded caption styles aligned with 63-variable
  ERA5 meteorological data. Building on EarthAlign, we introduce MeteoLIP, a dual-encoder framework for
  learning aligned meteorology-language representations. MeteoLIP incorporates MetTok, which uses a geolocation-
  and time-conditioned query to aggregate variable-specific patch embeddings into a compact sequence of
  meteorology tokens. To comprehensively assess Earth system multimodal representations, we introduce
  three downstream tasks: cross-modal retrieval, weather-condition classification, and physical variable
  estimation. Our experiments show that MeteoLIP improves upon the corresponding CLIP and SigLIP baselines
  across these tasks. Further analyses highlight the importance of meteorological input, temporal and
  geospatial conditioning, and multi-style supervision for meteorology-language alignment. Thus, EarthAlign
  and MeteoLIP provide a foundation for learning and evaluating language-aligned representations of Earth
  system data. Our code, dataset, and weights are publicly available at https://github.com/mbzuai-oryx/EarthAlign.'
