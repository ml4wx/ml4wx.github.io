summary: ForeSay uses a vision-language scenario prior and rectified-flow branching to cut ensemble nowcast
  cost from 8x to 5.2x while improving heavy-rain CSI by 10-84%.
abstract: 'Precipitation nowcasting involves two distinct scales of uncertainty: macroscopic storm evolution
  and fine-scale local convective variations. Current generative ensemble methods entangle both scales
  within independent random noise draws. This coupling causes two practical limitations: every ensemble
  member must execute the full sampling trajectory from scratch, so an N-member ensemble costs N times
  a single forecast; moreover, divergent trajectories spatially misalign heavy-rain echoes across members,
  causing standard pixel-wise averaging to blur critical high-intensity extremes. We present ForeSay,
  a generative nowcasting framework that decouples macroscopic evolution prediction from local stochastic
  detail generation. Given historical radar frames, a vision-language model first predicts a textual scenario
  of future storm dynamics to condition a Rectified Flow generator. Guided by this shared macroscopic
  prior, ensemble members share early trunk sampling steps to establish the storm trajectory and branch
  with fresh noise only in later steps to explore local convective details. Because members then differ
  mainly in local details, self-anchored support-consensus decoding replaces pixel averaging with discrete
  support voting to preserve sharp heavy-rain cores. Across six datasets, ForeSay achieves the best CSI
  at the highest precipitation thresholds, with relative improvements over the strongest baseline on each
  dataset ranging from over 10% to 84%. Our 8-member ensemble retains the forecasting skill and diversity
  of eight independently sampled runs while reducing computational cost from 8x to 5.2x that of a single
  forecast.'
