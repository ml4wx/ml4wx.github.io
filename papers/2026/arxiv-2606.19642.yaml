summary: Online conformal prediction restores calibrated coverage for GenCast, NeuralGCM and AIFS-ENS
  temperature and precipitation forecasts, especially for extremes, as a model-agnostic method.
abstract: Probabilistic weather forecasting is undergoing rapid transformation with artificial intelligence
  (AI). In traditional numerical weather prediction, computing power can limit how well ensemble forecasts
  approximate the unknown statistical distribution of future states. AI models facilitate larger ensembles
  and are trained with probabilistic considerations, ideally leading to better uncertainty quantification.
  Forecasts from these state-of-the-art models are often considered well-calibrated. However, here we
  show that the statistical coverage of such models, the ultimate measure of calibration, can struggle,
  especially on extreme events. To address this shortcoming, we employ conformal prediction, a class of
  statistical methods that mathematically guarantees coverage under no distributional assumptions, unlike
  previous post-processing techniques. We apply online conformal prediction to temperature and precipitation
  forecasts (including extremes) of three leading global weather models, GenCast, NeuralGCM, and AIFS-ENS,
  ensuring calibrated uncertainty at no expense to other probabilistic metrics. This post-processing method
  can be applied to any forecasting model.
