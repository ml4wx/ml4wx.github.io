summary: Dynamic graph convolutional network learns typhoon-dependent station relations for storm surge,
  cutting 72-hour RMSE by 14.4% versus static graphs.
abstract: 'Storm surges are a severe marine disaster, making accurate and efficient forecasting crucial.
  Existing numerical models are computationally expensive, while deep learning methods lack causal reasoning
  and interpretability. The key challenge of our proposal lies in how to enable the model to adaptively
  learn time‑varying causal relationships among stations under dynamic typhoon conditions while satisfying
  physical propagation laws. To address this challenge, this study proposes a Dynamic Graph Convolutional
  Network (DGCN) that effectively extracts features from wind fields and station water levels. Its core
  innovation is a dynamic graph structure learning module that combines the physical propagation laws
  of storm surges with the dynamic evolution of typhoons, enabling adaptive causal inference under different
  typhoon conditions. Experiments show that DGCN achieves significant advantages: for 72-hour forecasts,
  the root mean square error and peak error are reduced by 14.4% and 37.9%, respectively, compared to
  static graph structures, alleviating peak prediction inaccuracy and temporal lag. The learned dynamic
  node associations align closely with actual typhoon tracks and the physical propagation process of storm
  surges, demonstrating causal inference capability and enhancing model credibility and interpretability.
  This study provides a foundation for integrating physical mechanisms with deep learning to improve forecasting
  reliability.'
