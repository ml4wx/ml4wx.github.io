summary: Entropy and Higuchi fractal descriptors fed to a regression model predict monthly precipitation
  across ten Indian states, reaching R2 of 0.91 on NASA POWER data.
abstract: Atmospheric processes are nonlinear and multi-scaled variability of the atmosphere due to combined
  thermodynamic and hydrological processes. The traditional predictors of meteorology are not usually
  effective in capturing structural complexity in climate time series. This paper will use the joint entropy-fractal
  model to describe atmospheric variability and improve the forecasting of precipitation in ten Indian
  states based on reanalysis data that is available on the NASA POWER (Prediction of Worldwide Energy
  Resources) data access portal, which is managed by NASA. To measure stochasticity and the multi-scale
  complexity of time series with multiple parameters, the Shannon entropy and Higuchi fractal dimension
  were used to analyze the weekly multi-parameter meteorological observations. These complexity measures
  derived were combined into a regression model based on supervised machine learning to predict the precipitation
  in the coming month. Findings indicate that entropy fractal descriptors are very effective in predictive
  performance and produce $R^2=0.9099$ and $\mathrm{RMSE}=0.0857$ (normalized scale). The suggested methodology
  offers an integrated statistical-geometric description of atmospheric variability and forms complexity-based
  forecasting an avenue to enhanced sub-seasonal weather prediction.
