summary: Multitask learning embedded in a physical cloud parameterization estimates cloudy-sky downward
  shortwave radiation with r=0.88 and up to 23.8% rRMSE gain using fewer samples.
abstract: 'Downward shortwave radiation (DSR), a key component of the surface energy balance, is commonly
  estimated using either physics-based methods or machine learning (ML) models. Recently, efforts to integrate
  the strengths of both approaches have shown great potential for enhancing DSR estimation. However, most
  existing hybrid methods focus on integrating ML with physics by training ML models on massive datasets
  simulated by radiative transfer models (RTMs), which is both computationally expensive and time-consuming.
  To overcome these limitations, we propose a novel hybrid approach that embeds an MTL-based model into
  a physics-based cloud parameterization method, referred to as the multi-task learning embedded parameterization
  method (MEPM). By grounding the MTL-based component within a rigorous physical backbone, MEPM requires
  relatively fewer training samples while preserving strong generalization capability. Simultaneously,
  the powerful nonlinear mapping capacity of the MTL module optimizes the simulation of complex cloud-induced
  radiative attenuation processes, resulting in great improvements in overall model accuracy. There were
  three major findings: (1) MEPM demonstrated good performance under cloudy-sky conditions, achieving
  a Pearson correlation coefficient of 0.88 and outperforming the original parameterization method; (2)
  when compared with representative models and mainstream DSR products, MEPM achieved notable improvements,
  with maximum reductions in relative root mean square error (rRMSE) of up to 23.80%; and (3) MEPM accurately
  captured the spatial distribution of DSR across a wide range of regions, time periods, and cloud cover
  conditions. By embedding ML directly into a cloud parameterization method, this study introduced a highly
  efficient and robust hybrid approach. This work provides valuable insights for advancing DSR estimation
  and contributes to research on land surface processes, climate change, and solar energy resource utilization.'
