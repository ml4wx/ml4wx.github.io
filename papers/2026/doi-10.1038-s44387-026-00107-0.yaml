summary: Review arguing machine learning and data assimilation are converging, with ML accelerating DA
  and DA supplying uncertainty quantification and physical constraints.
abstract: 'Abstract Data assimilation (DA) combines observations with numerical models to estimate evolving
  Earth system states for forecasting and monitoring. Machine learning (ML) enables surrogate modeling,
  pattern recognition and Bayesian inference. These fields are converging: ML accelerates DA, while DA
  provides uncertainty quantification and physical constraints. Hybrid DA-ML systems are promising, yet
  challenges persist in generalization, consistency and reproducibility. These approaches are increasingly
  integrated, shaping next-generation prediction systems and observing networks.'
