summary: A residual CNN emulates the RRTMG radiation scheme in CMA's operational system, giving about
  8x speed-up with accuracy comparable to physics in 10-day reforecasts.
abstract: 'Abstract. Radiation is typically the most time-consuming physical process in numerical models.
  One solution is to use machine learning methods to simulate the radiation process to improve computational
  efficiency. From a practical application standpoint, this study investigates the key issues for hybrid
  modelling: coupling compatibility and long-term integration stability. A residual convolutional neural
  network is employed to approximate the Rapid Radiative Transfer Model for General Circulation Models
  (RRTMG) within the global operational system of China Meteorological Administration. We adopted an offline
  training and online coupling approach. First, a comprehensive dataset is generated through model simulations,
  encompassing all atmospheric columns. To ensure the stability of the hybrid model, the dataset is enhanced
  via experience replay, and additional output constraints based on physical significance are imposed.
  Meanwhile, a LibTorch-based coupling method is utilized, which is more suitable for real-time operational
  computations. The hybrid model is capable of performing ten-day integrated forecasts as required. A
  two-month operational reforecast experiment demonstrates that the machine learning emulator achieves
  accuracy comparable to that of the traditional physical scheme, while accelerating the computation speed
  by approximately eightfold.'
