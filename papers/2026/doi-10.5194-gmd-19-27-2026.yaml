summary: A 3D U-Net post-processes ECMWF sub-seasonal ensembles over the western US, beating NWP on temperature
  and adding spatial resolution using PRISM data, though it underestimates extreme precipitation.
abstract: Abstract. Sub-seasonal weather forecasting is a major challenge, particularly when high spatial
  resolution is needed to capture complex patterns and extreme events. Traditional Numerical Weather Prediction
  (NWP) models struggle with accurate forecasting at finer scales, especially for precipitation. In this
  study, we investigate the use of 3D U-Net architecture for post-processing sub-seasonal forecasts to
  enhance both predictability and spatial resolution, focusing on the western U.S. Using the ECMWF ensemble
  forecasting system and high-resolution PRISM data, we tested different combinations of ensemble members
  and meteorological variables. Our results demonstrate that the 3D U-Net model significantly improves
  temperature predictability, and consistently outperforms NWP models across multiple metrics. However,
  challenges remain in accurately forecasting extreme precipitation events, as the model tends to underestimate
  precipitation in coastal and mountainous regions. While ensemble members contribute to forecast accuracy,
  their impact is modest compared to the improvements achieved through downscaling. This study lays the
  groundwork for further development of neural network-based post-processing methods, showing their potential
  to enhance weather forecasts at sub-seasonal timescales.
