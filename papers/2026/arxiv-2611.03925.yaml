summary: A tropical-cyclone-following video dataset from downscaled simulations, showing that lateral
  boundary information is needed for ML regional intensity prediction.
abstract: This work presents a lightweight dataset of tropical cyclone (TC)-following meteorological variables
  to facilitate the development and application of machine learning (ML) methods in TC research. Using
  outputs from our previous climate downscaling and idealized simulations, the dataset is constructed
  as multichannel video sequences that track TC centers throughout their lifetimes. To demonstrate the
  dataset utility, we present an application in which a regional ML model is trained to predict TC intensity
  with explicit incorporation of lateral boundary conditions. Our results highlight the importance of
  lateral boundary information for predicting TC intensity with ML models inside a limited-area domain,
  underscoring the need to properly account for lateral boundaries when developing regional ML models
  for TC intensity forecast.
