summary: A dual-encoder Transformer retrieves planetary boundary layer height from MetOp radiances with
  155.8 m MAE, working in all weather and beating pixel-wise baselines.
abstract: 'Estimating the Planetary Boundary Layer Height (PBLH) from satellite observations is a challenging
  regression problem due to the indirect relationship between top-of-atmosphere radiances and near-surface
  atmospheric structure. Progress has been limited both by the lack of architectures capable of handling
  the multimodal, spatially incomplete nature of satellite overpasses, and by the scarcity of suitable
  datasets. In this paper, we build upon the large-scale dataset pairing MetOp radiances with ERA5 PBLH
  labels that we introduced in our previous work, making three contributions. First, we establish a benchmark
  across eight approaches spanning pixel-wise regression, swath-wise sequence models, and convolutional
  and Transformer models operating on the full orbital passage. Second, we quantify what the resulting
  model actually relies on, using grouped Shapley decomposition over the input blocks. Third, we present
  the best-performing architecture found: a dual-encoder Transformer whose masked-input handling lets
  it operate in all weather conditions. The proposed model achieves MAE = 155.8 m on the held-out global
  test set, outperforming all baselines on every evaluation subset. On 30 out-of-distribution granules
  acquired on two days overlapping the TEAMx observational campaign, it achieves MAE = 165.3 m, outperforming
  a pixel-wise baseline trained on the same data (MAE = 197 m).'
