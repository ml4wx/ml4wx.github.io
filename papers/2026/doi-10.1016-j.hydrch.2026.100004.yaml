summary: MLP predicts rainfall erosivity from IMD observations, then applies bias-corrected CMIP6 projections
  to estimate future R-factor changes for soil erosion planning in India.
abstract: Soil erosion begins with the impact of raindrops, which create a splashing effect. The rainfall
  erosivity factor (R-factor) quantifies this impact and is used to estimate soil erosion in the Revised
  Universal Soil Loss Equation (RUSLE) model. Gridded daily rainfall and temperature data from the Indian
  Meteorological Department (IMD) were collected. The R-factor was computed for the period 1989–2024.
  A preliminary study was carried out at a selected grid point to develop a model using various machine
  learning techniques. Daily rainfall, maximum temperature, and minimum temperature were chosen as input
  features, while the R-factor was used as the prediction target. A 5-fold cross-validation approach was
  applied to assess model performance. The evaluation metrics indicated that the Multi-Layer Perceptron
  (MLP) achieved the best predictive accuracy. Predicted rainfall and temperature data were then obtained
  from the Bias-Corrected Climate Projections of CMIP6 Global Circulation Models (GCMs) for South Asia.
  To identify the most suitable GCM, rainfall data from 2015 to 2024 were compared between IMD observations
  and GCM outputs using Taylor diagram. The selected GCM was then used to provide future rainfall and
  temperature data, which were applied to predict the R-factor for upcoming years. The projected changes
  in rainfall erosivity provide important insights for soil conservation planning and sustainable land
  management under future climate change scenarios.
