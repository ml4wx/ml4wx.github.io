summary: VeinCast uses physics-guided dynamic graphs for 69-field global ERA5 forecasts to 14 days, competitive
  with FuXi, Pangu, GraphCast and FengWu but without clear superiority.
abstract: Global medium-range weather forecasting requires modeling structured yet state-dependent interactions
  among heterogeneous atmospheric fields. Existing data-driven models largely learn these interactions
  implicitly, whereas equation-level physical constraints may inherit approximation and model-form biases.
  We present VeinCast, a physics-guided dynamic field graph and graph-conditioned fusion framework that
  jointly forecasts 69 surface and upper-air fields. Within each local window, its Physics-Guided Dynamic
  Field Graph combines predefined atmospheric relations with state-dependent Top-K residual edges and
  adapts Earth-window attention using the resulting graph context. Graph-Conditioned Latent Fusion further
  employs graph context and source-node centrality to guide field-to-latent aggregation, while bounded
  feedback preserves field-specific information. On the $1.5^\circ$ ERA5 benchmark, VeinCast demonstrates
  competitive forecasting performance across all 69 meteorological fields at lead times of up to 14 days,
  compared with representative global weather forecasting models including FuXi, Pangu-Weather, GraphCast,
  FengWu, and ARROW. Ablations confirm that the two modules provide complementary gains, demonstrating
  the effectiveness of relational-level physical guidance for data-driven weather forecasting.
