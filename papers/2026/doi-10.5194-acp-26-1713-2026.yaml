summary: Gaussian process emulators of 34 LES runs show aerosol dominates stratocumulus-to-cumulus transition
  time in low-aerosol conditions, with inversion strength dominant at high aerosol.
abstract: 'Abstract. Stratocumulus-to-cumulus transitions are driven by numerous interacting cloud-controlling
  factors. Understanding these interactions is important for improving the accuracy of cloud responses
  to changes in climate and other environmental factors in global climate models. Many studies have found
  lower-tropospheric stability dictates the transition time, while aerosol-focused studies found that
  aerosol concentration plays a key role via the drizzle-depletion mechanism. We consider the role of
  aerosol together with several other cloud-controlling factors representing the wider environmental conditions.
  A 34-member perturbed parameter ensemble of large-eddy simulations with 2-moment cloud microphysics
  is used to train Gaussian process emulators (statistical representations) of the relationships between
  the factors and two properties of the transition: transition temporal length and average rain water
  path. Using these emulators, parameter space can be densely sampled to visualise the joint and individual
  effects of the factors on the transition properties. We find that in the low-aerosol regime (< 200 cm-3)
  the transition time is most strongly affected by the aerosol concentration. Fast transitions, under
  40 hours, occur in this regime with high mean rain water path, which is consistent with a drizzle-depletion
  effect. In the high-aerosol regime, the inversion strength becomes more important than the aerosol concentration
  through the inversion''s effect on entrainment and the deepening-warming decoupling mechanism.'
