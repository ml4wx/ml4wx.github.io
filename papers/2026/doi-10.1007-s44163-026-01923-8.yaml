summary: Physically constrained ensemble learning improves monthly temperature RMSE from 1.8 to 1.2 °C
  and cuts agricultural emission intensity 14.7% in one site.
abstract: Abstract Agricultural greenhouse gas emissions exhibit strong nonlinear responses to climate
  conditions, yet conventional numerical simulation approaches fail to meet the demands of regional-scale
  emission reduction decision-making. To address the problem of blind agricultural carbon management caused
  by insufficient climate prediction accuracy, this paper proposes a physically constrained ensemble learning
  framework. The framework integrates satellite remote sensing, ground-based monitoring, and reanalysis
  datasets to construct a spatiotemporally adaptive climate prediction structure. A bidirectional coupled
  climate–carbon emission interaction model is established to quantify the dynamic effects of temperature
  and precipitation on soil respiration, paddy field methane emission, and nitrogen fertilizer-induced
  nitrous oxide emission. A prediction-driven multi-objective optimization algorithm is further developed
  to support intelligent control of cropping systems and agronomic management for emission minimization.
  Experiments conducted on a winter wheat–summer maize rotation site in the North China Plain demonstrate
  that, compared with conventional empirical models, the proposed framework reduces the root mean square
  error of monthly temperature prediction from 1.8 to 1.20 °C, raises the precipitation skill score from
  0.48 to 0.69, and achieves a 14.7% reduction in carbon emission intensity per unit yield through optimized
  agricultural management. These results offer methodological support for climate-smart management of
  wheat–maize double-cropping systems; broader applicability to other regions and cropping systems requires
  further multi-site validation.
