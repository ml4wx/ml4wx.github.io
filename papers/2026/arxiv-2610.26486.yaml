summary: Shows wet-biased test sampling can reverse calibration conclusions for a satellite-to-radar diffusion
  nowcasting model, and that matched training and test sampling hides training bias.
abstract: Generative models for precipitation nowcasting are trained and evaluated predominantly on wet-biased
  datasets, which over-represent precipitation events to emphasize rare extremes. Selecting test cases
  based on target observations is known to favor forecasts that match the selected distribution rather
  than the intended deployment distribution. We show analytically how this target-dependent sampling also
  shifts the conditional distribution learned by generative models. When training and test sampling match,
  even an ideal model learns precisely the distribution favored by evaluation, allowing the evaluation
  bias to conceal the training bias. Using a fixed satellite-to-radar diffusion model, we demonstrate
  that target-dependent test sampling can reverse the calibration assessment. The model appears under-predictive
  on a wet-biased test set but over-predictive on a deployment-representative test set. This result is
  replicated outside the model's training domain after a seven-year gap. Utilizing classifier-free guidance
  as an example, we demonstrate how the contradictory calibration assessment can misdirect downstream
  model development.
