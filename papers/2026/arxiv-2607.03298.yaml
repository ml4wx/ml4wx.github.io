summary: Releases WorldTensor, a harmonised 0.25 degree global dataset combining hundreds of climate,
  land, hazard and socioeconomic variables for training Earth system foundation models.
abstract: Foundation models for Earth systems have so far been trained primarily on physical climate and
  weather data, with limited representation of the human systems that both drive and respond to environmental
  change. The lack of a unified global training resource that combines climate, land, ocean, cryosphere,
  infrastructure, hazards, and socioeconomic data on a common grid hinders progress toward truly multimodal
  Earth system foundation models. We present WorldTensor, a harmonised global dataset that aligns hundreds
  of environmental and socioeconomic variables to a standardised 0.25$^\circ$ spatial grid and annual
  temporal framework. WorldTensor integrates reanalysis products, remote sensing, emissions inventories,
  land use reconstructions, hydrological observations, infrastructure and hazard datasets, and socioeconomic
  indicators within a single representation designed for machine learning workflows. To build the dataset,
  we regridded inputs across heterogeneous native resolutions and projections, rasterised point and vector
  datasets into spatially meaningful gridded fields, and reconciled temporal coverages ranging from daily
  observations to sparse multiyear socioeconomic snapshots. All outputs are distributed as NetCDF files
  with standardised coordinates, variable metadata, and a common CF metadata convention. WorldTensor provides
  a reproducible resource for training and evaluating foundation models that learn coupled dynamics across
  environmental and human systems at planetary scale.
