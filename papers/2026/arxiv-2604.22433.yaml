summary: Explainable GW-XGBoost and GAM models map Landsat land surface temperature and UTCI heat stress
  in Singapore, showing urban morphology effects differ between the two metrics.
abstract: Heat exposure connects the built environment and public health, directly shaping the livability
  and sustainability of urban areas. Understanding the spatial heterogeneity of heat exposure and its
  drivers is vital for climate-adaptive urban planning. However, most planning-oriented studies rely on
  land surface temperature (LST), and whether LST adequately represents human heat exposure and how it
  differs from physiologically relevant heat stress remains insufficiently examined. Here, using Landsat-retrieved
  30-m LST and GPU-accelerated 1-m universal thermal climate index (UTCI) in Singapore, this study establishes
  a comprehensive "Modeling-Comparing-Assessing" framework to systematically evaluate the spatial and
  mechanistic differences between these two metrics. We further investigate their pronounced non-stationary
  and threshold-based relationships with urban factors using a novel geographically weighted XGBoost (GW-XGBoost)
  and generalized additive model (GAM) workflow. Our results reveal substantial differences in the spatial
  patterns of LST and UTCI, along with marked spatial heterogeneity in how 2D and 3D urban factors impact
  these thermal metrics, as demonstrated by explainable GW-XGBoost models (test R2 = 0.855 for LST and
  0.905 for UTCI). Crucially, spatially explicit SHAP shows that sky view factor plays a central role
  in explaining UTCI variability but exhibits a comparatively marginal independent contribution to LST,
  indicating that LST inadequately captures shading-driven and radiative processes governing actual human
  heat stress. Moreover, SHAP-GAM analysis indicates that higher albedo is associated with increased UTCI.
  These findings provide model-informed planning implications for integrating physiologically relevant
  thermal indices to support targeted heat risk management and human-centric urban planning.
