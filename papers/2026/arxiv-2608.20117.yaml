summary: Geographically modulated sparse autoencoders with rule-based SAE-Xplainers give human-readable
  rules for fires, tropical cyclones and atmospheric rivers, improving reconstruction.
abstract: 'The emergence of large-scale Weather and Climate (W&C) datasets offers new opportunities for
  modeling extreme Earth events (ExEE) and their impacts using deep learning. However, their adoption
  in operational settings remains limited by the lack of models'' interpretability. While for conventional
  text and image modalities, tools such as Sparse Autoencoders (SAEs) have proven effective for extracting
  human-understandable concepts, their use for the analysis of ExEE remains challenging due to the nature
  of W&C data. To address this, we introduce (i) a geographic location-based modulation of the inputs
  of SAE to capture the local semantic meaning of environmental patterns, and (ii) an ensemble of rule-based
  SAE-Xplainers to interpret the resulting high-dimensional features derived from complex, multi-modal
  environmental predictors. We evaluate our method on three ExEE types: the prediction of fires, and the
  detection of tropical cyclones and atmospheric rivers. We show that SAE input modulation improves both
  reconstruction performance and feature utilization, and that our SAE-Xplainers enable faithful interpretation
  of complex climatic patterns by unfolding them into human-understandable rules that are consistent with
  the scientific literature, while also supporting the identification of feature absorption.'
