summary: Probabilistic RIME-X links global warming ensembles to regional climate indicator distributions,
  giving scenario-dependent uncertainty for impact emulation.
abstract: Many tasks in climate science, including climate impact assessment, scenario analysis, and end-to-end
  attribution, require efficient methods to translate a wide range of emissions scenarios into regional-scale
  climate indicators while explicitly accounting for uncertainty. Climate and impact model emulators are
  statistical models that approximate selected outputs of comprehensive models and can perform this translation.
  The Rapid Impact Model Emulator (RIME) uses individual simulations from climate or impact models to
  empirically relate global mean surface air temperature (GMT) levels to regional-scale indicators, enabling
  the conversion of GMT trajectories, commonly derived from Simple Climate Models (SCMs), into time series
  of regional climate impacts. Here, we present the Rapid Impact Model Emulator Extended (RIME-X), an
  extension of the RIME framework that replaces deterministic emulation of individual models along single
  GMT trajectories with a probabilistic approach. RIME-X combines ensemble simulations of GMT derived
  from SCMs with warming-level-dependent regional indicator distributions estimated from weighted Model
  Intercomparison Project (MIP) data. This results in scenario-dependent, time-evolving probability distributions
  of those regional indicators. By jointly quantifying global and regional sources of uncertainty from
  the start, RIME-X enables systematic exploration of the full space of plausible regional climate impact
  trajectories under different emissions scenarios. The method is conceptually applicable to regional
  indicators whose distributions are predominantly determined by warming level and provides a computationally
  efficient framework for uncertainty-aware regional indicator emulation. We evaluate the method using
  out-of-sample validation on temperature and precipitation simulations from the Coupled Model Intercomparison
  Project 6 (CMIP-6) and demonstrate its applicability to a range of impact and extreme event indicators
  derived from the Inter-Sectoral Impact Model Intercomparison Project (ISIMIP). We provide an open-source
  Python implementation of RIME-X, including preprocessing workflows for data from ISIMIP and support
  for user-defined indicators.
