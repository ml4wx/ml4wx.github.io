summary: Bias-corrected conformal PIT calibration turns sample-based generators into calibrated predictive
  distributions, demonstrated on WeatherBench-2 precipitation forecasts.
abstract: Conditional generative models, including diffusion models and ensemble forecasters, often produce
  predictive samples without a tractable likelihood representation. Such sample-based predictive distributions
  can be systematically biased and poorly calibrated. We propose bias-corrected conformal probability
  integral transform (PIT) calibration, a split-sample post-processing framework that outputs a calibrated
  predictive distribution rather than a single fixed-level prediction interval. The method first estimates
  an affine location-scale correction on a held-out bias split, then calibrates randomized PIT values
  using a conformal calibrator. The resulting predictive law is represented as a weighted empirical distribution
  on the generator order statistics, enabling the direct computation of threshold-coherent exceedance
  probabilities, arbitrary quantiles, highest-density intervals, expected tail losses, and calibrated
  resamples. In contrast, standard conformal prediction primarily provides fixed-level prediction sets
  or threshold decisions and does not directly estimate predictive probabilities or high-density regions.
  We establish finite-sample calibration in probability under exchangeability and show how an optional
  split-conformal wrapper based on a PIT-centrality score gives nested prediction intervals with finite-sample
  marginal coverage at user-specified levels. Simulation studies with controlled misspecification and
  a WeatherBench-2 precipitation-forecasting application demonstrate substantial improvements in probabilistic
  calibration and downstream distributional summaries relative to uncalibrated sample-based forecasts
  and interval-only conformal baselines.
