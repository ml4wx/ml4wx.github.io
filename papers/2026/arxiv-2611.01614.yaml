summary: Sonny-ENS, three MC-dropout networks trained on CRPS in 2.7 GPU-days, beats ECMWF ENS on 96%
  of targets and GenCast on 69%.
abstract: 'Every weather forecast is uncertain, and decisions from flood warnings to energy trading depend
  on how well that uncertainty is quantified. Machine-learning (ML) ensembles now quantify it better than
  the best physics-based ensemble, yet two things about them remain opaque: whether their skill requires
  hundreds to thousands of accelerator-days of training, and how a network with a simple source of randomness
  produces a spread that follows the flow. Here we introduce Sonny-ENS, an ensemble of three 68.9-million-parameter
  networks with Monte Carlo dropout, trained on the continuous ranked probability score (CRPS) in 2.7
  A40 GPU-days. On 2022, it has a lower CRPS than the European Centre for Medium-Range Weather Forecasts
  ensemble (ENS) on 96% of 570 targets and an 8.3% lower mean CRPS at lead times of 1-10 days. It outperforms
  the operational GenCast on 69% of the targets, and a 51-member, 15-day forecast takes 69 s on one GPU.
  Ablations identify the ingredients of this skill, and a Kolmogorov-Arnold sparse autoencoder shows that
  dropout injects uncertainty mainly in the tropics, whereas the spread grows where the atmosphere is
  baroclinically unstable (spatial correlation 0.91 with the Eady growth rate). Skillful probabilistic
  weather forecasts are therefore within reach of a single GPU server.'
