summary: Hybrid 1D-CNN-LSTM with KNN imputation predicts daily rainfall at Indonesian stations, reaching
  RMSE 14.1 mm; no comparison with physical forecasts.
abstract: 'One crucial aspect of weather forecasting is rainfall prediction, which has a direct impact
  on agricultural planning and flood risk prevention.Therefore, this study aims to develop a rainfall
  prediction model by applying a RainAI is a hybrid One-Dimensional Convolutional Neural Network (1D-CNN)
  -Long Short-Term Memory (LSTM) model along with data preprocessing using K-Nearest Neighbor (KNN) imputation
  to handle missing values.The model was developed using meteorological datasets collected from Indonesia
  Meteorology, Climatology, and Geophysics Agency (BMKG).The dataset includes several weather parameters
  temperature, humidity, wind speed, wind direction, and sunlight duration recorded at daily intervals.In
  the modeling stage, two deep learning methods are employed: 1D-CNN for spatial feature extraction from
  time series data, and LSTM for capturing long-term sequential patterns.These are combined into a hybrid
  model for rainfall prediction.Experimental results using the 1D-CNN-LSTM hybrid model yielded an RMSE
  of 14.066 mm and MAE of 6.673 mm.Furthermore, testing the model for predicting average weekly rainfall
  resulted in RMSE of 9.915 mm and MAE of 5.273 mm.Additionally, evaluation of different window sizes
  showed that using 15 historical data points produced the best performance, with RMSE of 15.142 mm and
  MAE of 7.942 mm.'
