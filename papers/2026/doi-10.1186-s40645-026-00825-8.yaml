summary: Encoder-decoder cluster-matching of 32,517 d4PDF typhoons shows a 33% rise in Vmax affecting
  the Chikugo basin under +4K warming.
abstract: Abstract Understanding typhoon characteristics and identifying affected areas are crucial for
  effective preparedness and proactive response during extreme events. While many previous studies have
  focused on typhoon clustering at oceanic scales using historical best-track datasets, a research gap
  remains in applying such analyses to the database for Policy Decision-making for Future Climate Change
  (d4PDF) to assess typhoon impacts at the basin scale. This study addresses that gap by analyzing 32,517
  typhoons from the d4PDF under both historical and +4K future climate scenarios that affect the Chikugo
  River Basin (CRB) in southwestern Japan. A novel deep learning-based cluster-matching model was developed
  to cluster typhoons affecting the CRB and to match forecast events with similar typhoons in the d4PDF.
  At the core of the model is an embedding vector generated by an encoder–decoder neural network, which
  effectively overcomes the limitations of conventional clustering and matching algorithms by handling
  high-dimensional features, large datasets, and the complex nature of typhoons. The analysis identified
  four distinct clusters, allowed for a clearer understanding of typhoon behavior in key typhoon characteristics
  (trajectory, maximum wind speed ( V max ), minimum central pressure ( P min ), and lifetime) and their
  changes under different climate scenarios. Notably, under the +4K future climate scenario (2051–2110),
  typhoons affecting the CRB were projected to increase significantly in intensity, with a 33% rise in
  average V max and a marked increase in the proportion of violent typhoons (Category 4 and Category 5).
  The real-time matching process demonstrated high reliability when validated using 280 historical typhoons
  (1951–2024) as forecast inputs. It achieved a high level of similarity, as indicated by overall median
  differences of + 9%, − 3.4%, and + 1.8% in V max , P min , and lifetime, respectively. Integrating this
  approach with precipitation data from similar typhoons improves flood forecasting and enhances the development
  of water resources management strategies under climate variability.
