summary: ML-generated 3D cloud scenes and Monte Carlo radiative transfer quantify how 3D cloud structure
  biases EarthCARE-relevant radiative fluxes.
abstract: Clouds remain one of the largest sources of uncertainty in the Earth’s radiation budget and
  in weather and climate projections, due to their strong modulation of both incoming solar and outgoing
  terrestrial radiation and their high spatial and temporal variability. In particular, the three-dimensional
  (3D) structure of clouds plays a crucial role in shaping radiative transfer processes, however, today
  all operational radiative transfer (RT) schemes in operational numerical weather forecast and climate
  models rely on plane-parallel, one-dimensional (1D) assumptions. In this study, we quantify the impact
  of realistic 3D cloud structure on radiative fluxes and radiances using machine-learning (ML) - generated
  3D cloud scenes for EarthCARE. We employ Monte Carlo RT simulations with the MYSTIC solver in the libRadtran
  package to compute and compare 1D and 3D radiation fields under different atmospheric conditions. Simulated
  TOA shortwave (SW) radiances and irradiances are evaluated against unfiltered radiances and effective
  fluxes from the EarthCARE Broadband Radiometer (BBR), as well as collocated airborne radiation observations
  from the spectrometer of the Munich Aerosol Cloud Scanner (specMACS) onboard the HALO research aircraft
  during the ORCESTRA/PERCUSION campaign. This work is conducted within the framework of the Obs3RvE EarthCARE+
  project, which aims to improve the 3D radiation EarthCARE products by producing improved 3D cloud reconstructions
  from EarthCARE, combining its observations with Meteosat Third Generation (MTG) observations, using
  ML techniques. The overarching goal is to reduce the uncertainties in estimates of the cloud radiative
  effect, as well as assess the effect of clouds on solar radiation/energy applications.
