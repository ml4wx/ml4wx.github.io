summary: A U-Net with DEM terrain constraint fuses GPM IMERG, radar and gauges, improving hourly precipitation
  estimates over complex terrain in Chongqing.
abstract: 'ABSTRACT Accurately capturing the spatial distribution of precipitation over complex terrain
  remains a major challenge in meteorology. Satellite observations struggle to simultaneously achieve
  both high spatiotemporal resolution and retrieval accuracy, while radar observations are easily affected
  by terrain blockage in mountainous areas. As a result, a single data source is insufficient for high‐resolution
  precipitation monitoring. In this study, we developed a U‐Net–based deep learning fusion framework incorporating
  digital elevation model (DEM) information as a terrain constraint. Using hourly GPM IMERG satellite
  precipitation, SWAN QPE radar precipitation, and rain‐gauge observations collected over Chongqing, China,
  during the rainy seasons (April–October) of 2016–2021, three multi‐source fusion schemes were constructed:
  GModel (satellite + gauges), QModel (radar + gauges), and GQModel (satellite + radar + gauges). The
  performance of the two original precipitation products and the three fused products was comprehensively
  evaluated. The results show that GPM IMERG tends to overestimate precipitation, and the peak time of
  precipitation is delayed by approximately 1 h. Although its overall performance is inferior to that
  of SWAN QPE, the radar product generally underestimates precipitation because of terrain blockage, with
  substantially better performance over the relatively flat western hills than over the mountainous eastern
  region in Chongqing. All three fusion products exhibit markedly better agreement with rain‐gauge observations
  than the original satellite and radar products in both temporal evolution and precipitation magnitude,
  effectively reducing the systematic biases associated with complex terrain. The generalisation capability
  of the proposed framework was further evaluated using independent observations from April to October
  2023 together with two representative heavy rainfall events that occurred over the western hilly region
  and the northeastern mountainous region, respectively. The fused precipitation products successfully
  reproduced both the temporal evolution and rainfall magnitude observed by rain gauges. Overall, GQModel
  achieved the best comprehensive statistical performance, whereas QModel showed superior skill in estimating
  extreme precipitation events (> 40 mm h −1 and representative heavy rainfall cases).'
