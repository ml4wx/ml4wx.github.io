summary: Compares CNN-LSTM and Transformer with feature engineering and SMOTE/GAN/physics-informed augmentation
  for extreme precipitation; peak F1 is only 0.14.
abstract: 'Accurate precipitation forecasting is paramount for water security and disaster mitigation,
  yet it remains formidable due to atmospheric stochasticity and the inherent class imbalance in rainfall
  datasets. This study proposes an integrated “architecture-feature-augmentation” framework to circumvent
  these limitations. Through a systematic evaluation of CNN-LSTM and Transformer architectures, we delineate
  distinct performance profiles: The Transformer model, when coupled with feature engineering and physics-informed
  augmentation, yields a peak F1-score of 0.1429, marking the optimal configuration for harmonizing precision
  and recall. Conversely, CNN-LSTM demonstrates superior robustness in extreme event detection, consistently
  maintaining high recall rates (up to 0.90) across diverse scenarios. We identify feature engineering
  as a critical performance modulator, substantially bolstering CNN-LSTM’s baseline metrics while enabling
  the Transformer to realize its maximum predictive capacity. Although synthetic oversampling techniques—such
  as SMOTE and GAN—effectively extend the detection range for heavy precipitation, physics-informed augmentation
  provides the most consistent performance gains, particularly in multi-class contexts. We conclude that
  the Transformer, augmented by physical constraints, is the optimal candidate for high-precision requirements,
  whereas CNN-LSTM, integrated with synthetic augmentation, offers a more sensitive alternative for early
  warning systems prioritizing recall. These findings provide empirical guidance for advancing extreme
  weather preparedness and strategic water resource management.'
