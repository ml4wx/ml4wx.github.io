summary: Lightweight DenseNet-transformer ensemble predicts half-hourly GPM IMERG precipitation over Northeast
  India with MAE 0.235 mm.
abstract: Proper short-term forecasting of precipitation is crucial in disaster management and preparedness.
  Nonetheless, the variability and nonlinearity of precipitation make short-term forecasting challenging
  for meteorologists. Moreover, capturing temporal dependencies in spatiotemporal data is a challenge
  in precipitation nowcasting. In this article, we introduce a lightweight deep learning model for half-hourly
  precipitation nowcasting. This model has been designed by incorporating the DenseNet architecture, residual
  connections, and transformer encoders for effective precipitation nowcasting with reduced model parameters.
  The North-Eastern region of India has been selected as the area of interest for our study. The region
  receives the highest precipitation during the months of June-September due to the monsoon season. The
  proposed model takes the previous five time-steps of half-hourly precipitation as inputs and predicts
  the precipitation in the next two half-hours. The GPM IMERG precipitation dataset with a 30-minute cadence
  has been used in this study for training and testing the model. The proposed architecture achieves best
  MAE of 0.235 millimetres, RMSE of 0.735 millimetres, and KGE score of 0.816 at an interval of 30 minutes.
