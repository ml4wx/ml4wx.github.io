summary: Conceptual early-warning framework links short-term precipitation nowcasts to risk indicators
  for Colombian agricultural supply chains, with only a prototype demonstration.
abstract: This paper presents a methodological framework for real-time climate risk assessment using data-driven
  nowcasting techniques to enhance supply chain resilience in Colombian agricultural contexts. Climate
  variability in Colombia, characterized by irregular rainfall, temperature fluctuations, and recurrent
  extreme events, has a direct impact on agricultural production and logistics, particularly for time
  sensitive crops. The proposed approach integrates short term climate forecasting based on historical
  meteorological observations with supply chain risk modeling to establish a conceptual early warning
  system architecture. A prototype implementation developed in a controlled computational environment
  demonstrates the feasibility of the framework using historical meteorological and agricultural time
  series derived from official statistics and reanalysis products, without reliance on satellite imagery
  or computer vision components. The methodology addresses the integration of climate nowcasting with
  supply chain decision making through explicit risk mapping, threshold-based categorization, and stakeholder-oriented
  risk signals. Results from synthetic and historical data experiments indicate that short term precipitation
  nowcasts can be translated into actionable risk indicators for agricultural supply chains, supporting
  anticipatory decisions related to inventory, sourcing, and transport.
