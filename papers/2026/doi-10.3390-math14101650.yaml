summary: A double-criterion early-stop pruning scheme for an FFNN–EKF hybrid cuts wind speed forecast
  MAE and RMSE by about 65–80% and 60–78% on NWP output.
abstract: A novel double-criterion early stopping pruning strategy is introduced in this study. The proposed
  approach enables the structural optimization of a hybrid filtering framework that integrates FeedForward
  Neural Networks with an adaptive Extended Kalman Filter, by simultaneously monitoring the validation
  error and the trace of the error covariance matrix. Unlike classical pruning methods, which are applied
  after the completion of the training process and aggressively remove network neurons, the proposed scheme
  exploits the learning procedure, achieving a more selective reduction of 2% to 13%, balancing effectively
  between strong generalization performance and computationally efficient training. The proposed framework
  is evaluated on wind speed forecasts obtained from a numerical weather prediction model, within a time-varying
  window scheme, demonstrating promising improvements. Key statistical indices, such as the Mean Absolute
  Error and the Root Mean Square Error, were significantly reduced, with reductions ranging from approximately
  65% to 80% and 60% to 78%, respectively. These findings suggest that the proposed methodology offers
  a robust and accurate framework for time series forecasting in operational settings.
