summary: Shows neural climate prediction model stability depends on initialization and stop criteria;
  scaling initial weights by 0.1 and ensembling improve skill.
abstract: 'Due to randomness factors in the machine learning model construction process, reproducibility
  is compromised. This study investigates the impact of randomness on model stability and evaluates techniques
  for reducing this impact, using the widely adopted shallow neural network (NN) model as a testbed. Randomness
  in this NN model arises from three events: randomly initializing model parameters, randomly selecting
  a validation subset, and randomly sampling batches for parameter updates. Among these, batch randomness
  exerts a significantly weaker impact than the other two factors. In this study, the model training is
  stopped when the validation performance fails to improve or when a preset threshold for loss or epoch-number
  is met. The final model stability is significantly better using threshold criteria than using validation
  criterion, as the former avoids the randomness associated with validation subset. Sensitivity experiments
  show that scaling the model''s initial parameters to 0.1 times their original values can mitigate the
  impact of initialization randomness, thereby significantly improving model stability while also markedly
  enhancing predictive skill. Furthermore, weight decay and multi-model ensembles, which are two commonly
  used techniques, can also significantly enhance model stability. Moreover, the inherent instability
  of individual sub-models may actually benefit the overall predictive skill of a multi-model ensemble.'
