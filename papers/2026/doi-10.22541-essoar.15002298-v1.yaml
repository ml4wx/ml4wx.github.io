summary: Deep learning trained on coupled model ensembles reconstructs AMOC from SST and SSH records,
  finding no significant 20th-century decline but sustained post-2000 weakening.
abstract: Despite its importance for climate, the Atlantic Meridional Overturning Circulation (AMOC) is
  not well constrained before in-situ RAPID array observations began in 2004. Extending the record further
  back in time requires proxies, the most widely used being a subpolar North Atlantic sea-surface temperature
  (SST) index, which implies substantial AMOC decline over the 20th century. In contrast, climate model
  simulations generally show a stable or strengthening AMOC prior to a decline only over recent decades.
  Here, we move beyond the subpolar SST index by training deep-learning models on a diverse ensemble of
  coupled climate model simulations, reconstructing AMOC from observed SST records since the late 19th
  century and sea-surface height (SSH) records since 1993. When applied to observations, the deep-learning
  reconstruction shows no statistically significant AMOC decline over the 20th century, consistent with
  compensating effects of greenhouse-gas and aerosol forcing. However, the reconstruction reveals sustained
  post-2000 AMOC weakening, consistent with in-situ observations and climate model simulations, to a state
  that is now weaker than at any point over the 20th century. These findings provide an observational
  constraint on historical AMOC variability that is consistent with climate model simulations, and place
  the post-2000 weakening in a longer historical context.
