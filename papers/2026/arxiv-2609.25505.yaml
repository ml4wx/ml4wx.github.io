summary: FAST-ML learns ventilation parameters from ERA5 through a differentiable tropical cyclone intensity
  model, cutting 60 h ensemble CRPS by about 31% and nearly halving rapid-intensification false alarms.
abstract: Rapid intensification (RI) remains one of the most consequential and difficult aspects of tropical
  cyclone (TC) forecasting. Although full-physics numerical weather prediction models can represent the
  processes governing RI, resolving storm-environment interactions remains computationally expensive,
  while purely data-driven approaches often lack physical interpretability. We present FAST-ML, a hybrid
  framework that bridges data-driven efficiency with physical constraints. A physically informed dual-stream
  neural parameterization ingests 3D ERA5 fields to diagnose ventilation controls---environmental wind
  shear and mid-level entropy deficit. By optimizing these parameters end-to-end through a differentiable
  FAST intensity model, this architecture establishes a robust new paradigm for observation-driven parameter
  optimization, ensuring storm evolution remains strictly governed by thermodynamic principles. By better
  capturing the storm's continuous intensity evolution, FAST-ML improves upon its physical baseline, reducing
  ensemble CRPS across forecast lead times, with a reduction of approximately 31% at 60 h and nearly halving
  the RI false alarm ratio without sacrificing detection skill. In a 100-member ensemble configuration,
  FAST-ML produces intensity forecasts comparable to FNV3 for selected storms under the evaluated input
  configurations. Furthermore, zero-shot tests on selected Eastern Pacific storms provide encouraging
  evidence of cross-basin transferability. FAST-ML provides a modular intensity forecasting framework
  that can be coupled with externally supplied storm tracks and environmental fields. It demonstrates
  that observation-driven parameter learning within physically constrained dynamics simultaneously enhances
  accuracy, interpretability, and computational efficiency.
