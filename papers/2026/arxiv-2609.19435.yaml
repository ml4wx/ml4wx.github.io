summary: A Koopman-operator MJO index evolves more smoothly than RMM and gives skillful prediction out
  to 46 days versus 11 days for RMM.
abstract: The Madden-Julian oscillation (MJO) is a major source of subseasonal-to-seasonal (S2S) predictability.
  The MJO is commonly defined and tracked with indices such as the Real-time Multivariate MJO (RMM) index.
  Although the RMM provides a useful description of the MJO, its evolution can be noisy and difficult
  to predict. We define an MJO index using a data-driven approximation of the Koopman operator. The Koopman
  index captures similar tropical circulation and convection patterns to the RMM but evolves more smoothly
  and predictably. Skillful prediction extends to 46 days for the Koopman index compared to 11 days for
  the RMM under the same prediction framework. While this new approach does not recover the RMM as well
  as operational S2S models, which provide skillful forecasts up to 35 days, the Koopman index could complement
  existing MJO diagnostics in evaluating and developing extended-range forecast systems.
