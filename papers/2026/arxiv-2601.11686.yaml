summary: Proof-of-concept hybrid framework pairing predictive models for wildfire risk dimensions, including
  meteorological danger, with LLMs that synthesize operational reports for first responders.
abstract: Current state-of-the-art approaches to wildfire risk assessment often overlook operational needs,
  limiting their practical value for first responders and firefighting services. Effective wildfire management
  requires a multi-target analysis that captures the diverse dimensions of wildfire risk, including meteorological
  danger, ignition activity, intervention complexity, and resource mobilization, rather than relying on
  a single predictive indicator. In this proof of concept, we propose the development of a hybrid framework
  that combines predictive models for each risk dimension with large language models (LLMs) to synthesize
  heterogeneous outputs into structured, actionable reports.
