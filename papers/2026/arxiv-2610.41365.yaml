summary: Generative model StormGen turns a storm's first hour into full hourly rainfall lifecycles, reproducing
  Hurricane Harvey's extreme totals for stress-testing flood protection in Texas.
abstract: Historically rare ''one-in-a-generation'' storms are occurring with unprecedented frequency,
  causing catastrophic damage and mounting casualties, and exposing the vulnerability of infrastructure
  designed around short observational records. To overcome the limitations of sparse data, we present
  StormGen, a generative machine-learning model that transforms an observed storm's initial hours into
  complete, physically plausible hourly rainfall lifecycles in minutes. Evaluated on a decade of southeast
  Texas rainfall, StormGen produced close counterparts for 4\5% of the most severe 2\% of storms--compared
  to just 3\% for stochastic storm transposition--and maintained spatial coherence over full 24-hour sequences.
  Crucially, from a single hour of initial rainfall, the model successfully reconstructed the specific
  lifecycle, spatial pattern, and extreme catchment totals of Hurricane Harvey itself, despite the event
  being entirely absent in training. Because storm timing alone can more than double peak flows, these
  complete generated scenarios provide a vital mechanism to stress-test flood protections against unprecedented
  extremes.
