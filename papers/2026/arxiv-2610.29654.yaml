summary: Benchmarks probabilistic models for two-hour atmospheric seeing forecasts at Maunakea; LSTM and
  a normalizing-flow model (FloTS) give the best accuracy and calibrated uncertainty.
abstract: Accurate short-term forecasting of atmospheric seeing is of significant interest for astronomical
  observations and free-space optical communication systems, where rapid variations in optical turbulence
  can affect system performance and operational planning. In this work, we benchmark machine learning
  models for predicting atmospheric seeing up to two hours in advance, with a particular focus on probabilistic
  forecasting and uncertainty quantification. We compare two probabilistic approaches, Gaussian Processes
  (GPs) and a normalizing-flow- based model (FloTS), against deterministic recurrent neural network (RNN)
  and long short-term memory (LSTM) baselines. All models are trained and evaluated on seeing measurements
  from the Maunakea summit. We assess the models using both deterministic metrics, including the root
  mean square error and the Pearson correlation coefficient, and probabilistic metrics that evaluate the
  quality and calibration of predictive uncertainty estimates. The results show that deep learning approaches
  outperform standard recurrent networks for short-term forecasting, with LSTM and FloTS achieving the
  best overall predictive accuracy. While Gaussian Processes provide a useful probabilistic baseline,
  their predictive distributions are limited by the Gaussian assumption. FloTS combines competitive forecasting
  accuracy with flexible uncertainty quantification and produces the most informative probabilistic forecasts.
