summary: TabPFN-KNN fuses GFS and station data to predict 24 h 2 m temperature, reducing MAE 24% to 1.26
  °C at unseen stations for precision agriculture.
abstract: Accurate field-scale meteorological information is required for precision agriculture, but operational
  numerical weather prediction products remain spatially coarse and cannot resolve local microclimate
  variability. This study proposes a data fusion superresolution workflow that combines global GFS predictors
  (0.25°), regional station observations from Southern Moravia (Czech Republic), and static physiographic
  descriptors (elevation and terrain gradients) to predict the 2 m air temperature 24 h ahead and to generate
  spatially continuous high-resolution temperature fields. Several model families (LightGBM, TabPFN, Transformer,
  and Bayesian neural fields) are evaluated under spatiotemporal splits designed to test generalization
  to unseen time periods and unseen stations; spatial mapping is implemented via a KNN interpolation layer
  in the physiographic feature space. All learned configurations reduce the mean absolute error relative
  to raw GFS across splits. In the most operationally relevant regime (unseen stations and unseen future
  period), TabPFN-KNN achieves the lowest MAE (1.26 °C), corresponding to an ≈24% reduction versus GFS
  (1.66 °C). The results support the feasibility of an operational, sensor-infrastructure-compatible pipeline
  for high-resolution temperature superresolution in agricultural landscapes.
