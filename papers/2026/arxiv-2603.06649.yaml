summary: HURRI-GAN uses TimeGAN to extrapolate ADCIRC storm-surge bias corrections beyond gauge stations,
  reducing mesh size and runtime for hurricane water-level forecasts.
abstract: The coastal regions of the eastern and southern United States are impacted by severe storm events,
  leading to significant loss of life and properties. Accurately forecasting storm surge and wind impacts
  from hurricanes is essential for mitigating some of the impacts, e.g., timely preparation of evacuations
  and other countermeasures. Physical simulation models like the ADCIRC hydrodynamics model, which run
  on high-performance computing resources, are sophisticated tools that produce increasingly accurate
  forecasts as the resolution of the computational meshes improves. However, a major drawback of these
  models is the significant time required to generate results at very high resolutions, which may not
  meet the near real-time demands of emergency responders. The presented work introduces HURRI-GAN, a
  novel AI-driven approach that augments the results produced by physical simulation models using time
  series generative adversarial networks (TimeGAN) to compensate for systemic errors of the physical model,
  thus reducing the necessary mesh size and runtime without loss in forecasting accuracy. We present first
  results in extrapolating model bias corrections for the spatial regions beyond the positions of the
  water level gauge stations. The presented results show that our methodology can accurately generate
  bias corrections at target locations spatially beyond gauge stations locations. The model's performance,
  as indicated by low root mean squared error (RMSE) values, highlights its capability to generate accurate
  extrapolated data. Applying the corrections generated by HURRI-GAN on the ADCIRC modeled water levels
  resulted in improving the overall prediction on the majority of the testing gauge stations.
