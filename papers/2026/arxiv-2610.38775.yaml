summary: FitzRoy refines a conditional discrete diffusion precipitation model with reinforcement learning,
  matching or beating state-of-the-art skill up to 24 h over the US while producing realistic extremes
  and running in low-latency.
abstract: Accurate precipitation forecasting remains elusive as physics-based models struggle to resolve
  mesoscale convection and machine learning often yields physically inconsistent, blurred results that
  consistently underestimate extreme events. We present FitzRoy, the first system that simultaneously
  achieves state-of-the-art predictive skill and physical realism over the continental United States.
  Through a reinforced diffusion framework, where a conditional discrete diffusion model is refined via
  reinforcement learning, FitzRoy effectively resolves the long-standing trade-off between pointwise accuracy
  and structural fidelity. Across lead times up to 24 hours, FitzRoy consistently matches or exceeds state-of-the-art
  models while preserving structural realism and capturing extreme events. Its low-latency inference further
  enables deployment in real-time operational settings. In case studies such as the 2025 Texas Hill Country
  floods and the 2026 Missouri floods, FitzRoy signals record-breaking accumulations that existing models
  largely missed. By bridging the gap between realism and skill, FitzRoy establishes a new frontier for
  high-fidelity precipitation forecasting.
