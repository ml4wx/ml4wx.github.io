abstract: Weather forecasting plays an important role in many fields such as agriculture, disastermanagement,
  transportation, and environmental monitoring. Temperature is one of the mostimportant parameters in
  weather prediction.This project focuses on predicting temperature usingmachine learning techniques based
  on historical weather data.Machinelearning models cananalyze large datasets and identify patterns that
  help predict future temperature values.Thesystem uses historical weather data including humidity,windspeed,pressure,
  and past temperaturerecords to algorithmssuchasLinearRegression,DecisionTree,andRandomForestareusedtobuild
  theprediction model. The dataset is preprocessed and cleaned before training the model. Aftertraining,
  the system can predict future temperature values with good accuracy. The project isimplemented using
  Python programming language and machine learning libraries such asPandas, NumPy, and Scikit-learn. A
  user interface is developed using Streamlit to allow users toinput weather parameters and get.Temperature
  prediction plays a vital role in weather forecasting, agriculture, and environmentalmonitoring. This
  project focuses on predicting temperature using machine learning techniquesbased on historical weather
  data. The system collects past data such as temperature, humidity,wind speed, and atmospheric pressure,
  and processes it to identify patterns and trends. Machinelearning algorithms like Linear Regression
  and Random Forest are used to build predictivemodels. The proposed system improves accuracy compared
  to traditional methods by learningcomplex relationships in data. It provides reliable and real-time
  temperature predictions withminimal human intervention. The system can be extended to different regions
  and helps in betterdecision-making for climate-related applications
