summary: Uses CNOP-based sampling with the Pangu-Weather model to find initial-error sensitive areas for
  Northeast China cold vortex forecasts, with about 13% error reduction from targeted observations.
abstract: The Northeast China Cold Vortex (NECV) is a key circulation system affecting weather patterns
  over North China, frequently triggering thunderstorms, hail, and other severe convective weather. Accurate
  prediction of NECVs is therefore of great importance. However, substantial forecast errors still remain,
  largely due to uncertainties in the initial conditions. To improve NECV forecast skills, we investigate
  the optimal initial errors and targeted observation sensitive areas using a sampling-based approximation
  of the conditional nonlinear optimal perturbation (CNOP) method together with the Pangu-Weather deep
  learning model. We first evaluate the model’s performance over Northeast China and find that Pangu-Weather
  exhibits forecast skill generally comparable to the ECMWF Integrated Forecasting System (IFS) during
  the May–August 2022 period over Northeast China. Then the CNOP-based approach is used to capture the
  optimal initial errors with the greatest impact on NECV forecasts. The largest error amplitudes are
  primarily located upstream of the vortex and near upper-level jet-entrance regions, which are identified
  as the targeted observation sensitive areas. Perturbation kinetic-energy diagnostics further indicate
  that baroclinic conversion is the dominant mechanism for error growth. Observing system simulation experiments
  suggest that, under an idealized assumption of completely eliminating errors in a given region, targeted
  observations over the sensitive area can produce the largest forecast improvement, with an average error
  reduction of approximately 13% relative to other areas. This study contributes to a deeper understanding
  of NECV predictability and may help improve forecasting capability.
