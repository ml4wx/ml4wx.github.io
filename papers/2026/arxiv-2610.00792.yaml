summary: Feasibility diagnostics suggest Aurora's trajectories respond to small perturbations, but no
  steering intervention is tested; the work is exploratory.
abstract: 'Weather Jiu-Jitsu is a control paradigm for extreme climatological events, inspired by chaos
  theory. As a proposition, small, precise, targeted, and cost-inexpensive perturbations can redirect
  trajectories of a large dynamical system. This strategy has been demonstrated analytically in the Lorenz-63
  system, where a naturally chaotic trajectory switching between two attractors can be confined to a single
  attractor, indefinitely, via arbitrarily small perturbations. This paper examines the feasibility of
  Microsoft''s Aurora -- a 1.3 billion parameter global atmospheric model -- as a test bed for this strategy.
  This paper explores three questions: (1) Is Aurora a reliable enough simulation environment to serve
  as a meaningful testbed? (2) Are the perturbations required to redirect its trajectories small enough
  to be physically plausible? (3) Does Aurora''s learned latent space (the parametric estimators on climatological
  attributes) yield any apparent, structured, and/or perhaps interpretable features that can convey a
  geo/atmospheric response to initial conditions? We find evidence consistent with all three: Aurora''s
  modeled trajectories respond to perturbations beyond measurement drift, the perturbation magnitudes
  required are small relative to the model''s own forecast uncertainty, and its latent representations
  exhibit directional structure that responds to Jiu-Jitsu-type interventions, even though that structure
  does not separate extreme from normal states outright. These results should be read as feasibility diagnostics
  rather than a demonstration of control: we do not implement or test an actual steering intervention
  on Aurora, and several of our findings, particularly around the model''s latent-space geometry, are
  exploratory.'
