summary: CNN-LSTM and CNN-CBAM models forecast daily rainfall over Hunan at 20–30 day leads, outperforming
  the ECMWF ensemble, which loses skill beyond about two weeks.
abstract: ABSTRACT Based on the circulation products from European Centre for Medium‐Range Weather Forecasts
  (ECMWF) model and daily site rainfall data over Hunan Province during May to August between 2005 and
  2022, experiments for extended precipitation forecasting were conducted by incorporating the Convolutional
  Block Attention Module (CBAM) and Long Short‐Term Memory Network (LSTM) into the Convolutional Neural
  Network (CNN) separately. The performance of the CNN, CNN‐CBAM, CNN‐LSTM, and ECMWF ensemble was evaluated
  and compared. The results indicate that the forecasting skill of ECMWF ensemble significantly decreases
  as the forecast horizon extends. In contrast, the skill of the three intelligent models (CNN, CNN‐CBAM,
  and CNN‐LSTM) exhibits greater stability. Notably, the CNN‐LSTM model maintains high forecasting skill
  even at the 20–30 day forecast horizons. Furthermore, the superiority of the intelligent models becomes
  increasingly evident with higher precipitation magnitudes. For instance, while the ECMWF ensemble shows
  nearly no skill for larger precipitation events (daily rainfall exceeding 25 mm), the intelligent models
  retain a certain level of consistent accuracy. Case studies highlight that ECMWF only holds a slight
  advantage in predicting light precipitation, whereas the intelligent models outperform ECMWF for heavier
  precipitation events. In particular, the CNN‐LSTM model demonstrates superior performance in long‐range
  forecasting.
