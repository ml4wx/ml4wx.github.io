summary: An Attention Residual U-Net outputs calibrated hourly precipitation probability distributions
  from convection-permitting NWP over CONUS, trained against MRMS radar with a Gamma-mixture likelihood.
abstract: An ``Attention Residual U-Net'' method is described for probabilistic quantitative precipitation
  forecasting (PQPF) that predicts the hourly probability of no precipitation plus the distribution of
  positive precipitation from a weighted mixture of two Gamma distributions. The neural network is trained
  on patches of numerical weather prediction (NWP) hourly precipitation from The Weather Company's convection-permitting
  GRAF (Global high-Resolution Atmospheric Forecasting) model along with terrain information and column-average
  relative humidity from the National Oceanic and Atmospheric Administration's (NOAA's) Global Forecast
  System (GFS). The target data are NOAA's Multi-Radar, Multi-Sensor (MRMS) gauge-corrected, quality controlled
  radar data sampled to the same grid as the GRAF data. The network outputs distributional parameters
  for each model grid point. Training uses negative log-likelihood as a proper scoring rule, with climatological
  initialization for stable convergence. Inference is performed as a single forward pass over the contiguous
  United States (CONUS) domain, with edge-replication padding to satisfy the network's spatial-divisibility
  requirement. The subsequent forecasts are spatially detailed, highly reliable, and skillful with respect
  to climatology and a simpler reference forecast method. The method is particularly useful for estimating
  probabilities in regions with large terrain variation.
