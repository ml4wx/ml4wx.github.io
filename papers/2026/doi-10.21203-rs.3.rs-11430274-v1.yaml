summary: Reuses a pretrained medium-range model with lightweight temporal attention and a teleconnection-index
  graph module to extend forecasts to four weeks, updating only 10.9% of parameters.
abstract: Abstract Subseasonal forecasting is essential for agricultural planning, water-resource management,
  and early warning of natural hazards, yet remains challenging because forecast errors grow rapidly with
  lead time. Recent machine-learning models have achieved remarkable foresting skills, but training such
  models requires substantial computational resources and associated energy consumption. Here, we propose
  a parameter-efficient framework that reuses a pretrained medium-range weather model and extends its
  forecast horizon from 24 hours to four weeks. The architecture retains the pretrained spatial-attention
  modules while introducing lightweight temporal attention to model dependencies across multiple atmospheric
  states. To account for the influence of large-scale boundary conditions at subseasonal timescales, we
  further incorporate climate teleconnection indices through a difference-based graph module. This physically
  motivated component learns how large-scale teleconnection patterns modulate the temporal evolution of
  geographically remote areas. Experiments show that the proposed framework reduces root-mean-square error
  for most evaluated atmospheric variables from the two-week forecast horizon onward. The framework requires
  updating only 10.9% of the total model parameters while enabling the processing of substantially longer
  temporal sequences. These results further indicate the transferability of spatial representations learned
  from medium-range forecasting to extended-range prediction.
