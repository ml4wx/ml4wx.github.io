summary: XGBoost, Random Forest and other ML models predict Bangladesh seasonal temperature from ENSO
  indices, reaching R² up to 0.97, while rainfall prediction is weaker (R² 0.63).
abstract: Abstract The accurate prediction of seasonal weather patterns holds significant importance in
  supporting agriculture, disaster management, and economic planning in Bangladesh. However, the non-linear
  characteristics of weather and climatic patterns makes it quite challenging. Recently, the significant
  impact of El Nino-Southern Oscillation (ENSO) indices on regional climate variability have increasingly
  been recognized. This study investigates the correlation between nine ENSO indices and both temperature
  and rainfall patterns across Bangladesh and also evaluates the effectiveness of machine learning (ML)
  models in predicting these weather variables. Historical monthly data from 29 meteorological stations,
  spanning 1977 to 2022, were analyzed. Six supervised ML models—Random Forest (RF), Decision Tree (DT),
  K-Fold Cross-Validation (KFCV), XGBoost (XGB), Linear Regression (LR), and K-Nearest Neighbors (KNN)
  were applied. Performance was evaluated using R² score, Mean Absolute Error (MAE), and Root Mean Square
  Error (RMSE). Results revealed that ENSO indices have a notable impact on climate parameters in Bangladesh.
  Among these models, XGB achieved the highest R² scores for temperature prediction, with values of 0.8824
  (Tmax), 0.9706 (Tmin), and 0.9559 (Tavg). RF and KFCV also showed strong performance, with RF achieving
  R² values of 0.8770 (Tmax), 0.9699 (Tmin) and 0.9531 (Tavg) and KFCV achieving R² scores of 0.8606 (Tmax),
  0.9619 (Tmin), and 0.9438 (Tavg). Rainfall prediction, however, yielded lower accuracy, with RF recording
  the highest R² of 0.6273. The study highlights the impact of ENSO indices and concludes that XGB, RF,
  and KFCV are highly effective in modeling seasonal climate patterns influenced by ENSO.
