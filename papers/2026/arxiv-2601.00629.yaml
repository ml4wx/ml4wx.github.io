summary: Critical review arguing AI/ML downscaling of climate projections is often poorly evaluated and
  that statistical methods are underrated relative to ML.
abstract: A critical review of artificial intelligence and deep machine learning (AI/ML) applied to downscaling
  of global climate model simulations provides some words of caution, based on past experiences and well-established
  principles. Recent papers tend to ignore more subtle successes with statistics and mathematical based
  downscaling, and there are examples of inappropriate evaluation strategies and incomplete accounts of
  the scientific progress when it comes to climate downscaling. An incomplete description state-of-the-art
  and a dogmatic approach to evaluation may give a deceiving impression that AI/ML is superior to more
  statistics and mathematics based methods.
