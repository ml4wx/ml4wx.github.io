summary: 4DPrecipNet recovers 4D precipitation structure from geostationary infrared radiances using a
  moisture-first physical constraint, validated against independent radar profiles of deep convection.
abstract: Accurate four-dimensional (4D) precipitation information is essential for understanding the
  Earth's energy and water cycles, yet remains observationally unresolved at global scales. Conventional
  theory holds that geostationary infrared observations primarily sense cloud-top properties, with limited
  sensitivity to sub-cloud precipitation. Here we show that cloud-top infrared measurements nevertheless
  encode sufficient information to recover the four-dimensional structure of precipitation, revealing
  a previously unexploited observability of sub-cloud processes. We introduce a physically constrained
  deep learning framework, 4DPrecipNet, in which a moisture-first constraint requires the latent representation
  to recover precipitable water vapour, anchoring the model in thermodynamic consistency. By integrating
  multi-channel infrared radiances with these constraints and radar-derived precipitation profiles, we
  reconstruct the vertical and temporal evolution of precipitation systems from geostationary orbit. The
  framework captures deep convective structures and their evolution, with robust performance across large
  samples and independent radar comparisons. These results demonstrate that sub-cloud precipitation is
  physically encoded in cloud-top infrared observations, establishing a new pathway for continuous global
  monitoring of precipitation structure.
