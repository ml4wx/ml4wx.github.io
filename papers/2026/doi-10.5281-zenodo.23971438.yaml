abstract: 'AI for Climate Change Prediction and Environmental Monitoring: A Systematic Review 2018-2026
  Nidhi Raghav¹ and Meenakshi Singh² ¹Assistant Professor, Department of Computer Applications, NIET,
  Greater Noida, India ²Assistant Professor, School of Data Science & AI, AAFT, Noida, India nidhiraghavchd011@gmail.com;
  meenakshisingh.mbd@gmail.com Abstract—Climate change has emerged as a major global challenge affecting
  ecosystems, economies, and human life. Accurate prediction and continuous environmental monitoring are
  essential for reducing risks associated with extreme weather events, pollution, and ecological degradation.
  Traditional climate prediction models often face limitations in handling large-scale heterogeneous environmental
  datasets. Recent advancements in artificial intelligence (AI), particularly machine learning, deep learning,
  and hybrid approaches, have improved predictive capabilities in climate-related applications. This review
  paper examines research published between 2018 and 2026 on AI-based climate prediction and environmental
  monitoring systems. It analyzes major techniques, application domains, performance trends, and existing
  limitations. Special emphasis is given to computational efficiency, scalability, and real-time deployment
  challenges, which are often overlooked in current studies. Based on the identified research gaps, an
  energy-aware AI framework is proposed to support sustainable and efficient climate prediction systems.
  The study also highlights future research directions for developing practical and environmentally responsible
  AI solutions. Index Terms—Artificial Intelligence, Climate Change, Environmental Monitoring, Machine
