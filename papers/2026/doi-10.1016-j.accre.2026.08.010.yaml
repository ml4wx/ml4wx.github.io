summary: Machine learning forecasts summer concurrent compound heatwaves one season ahead with correlation
  0.80, nearly doubling NCEP CFSv2 skill, and identifies three SST precursors.
abstract: Concurrent compound heatwaves (CCHWs) pose an escalating threat to global socioeconomic stability
  in a warming climate, yet current dynamical models remain inadequate for seasonal-scale forecasting.
  This predictive shortfall hampers effective early warning efforts. Here, we addressed this deficit by
  developing two machine learning (ML) models capable of forecasting summer CCHWs one season in advance.
  The ML models deliver a substantial leap in performance, near doubling the predictive skill of NCEP
  CFSv2 dynamical forecasts by raising the correlation score from 0.46 (and 0.35 for the conventional
  linear method) to 0.80. In addition to the well-documented Arctic influence, our ML-based attribution
  identifies sea surface temperature anomalies in the Tropical Atlantic and Southern Indian Ocean as critical
  precursors. Together, these three predictors dominate the forecast signal and collectively account for
  76% of the interannual variance in summer CCHWs observed between 2012 and 2021. The integrated three
  precursors maintain a statistically significant correlation with summer CCHWs up to nine months in advance.
  Physically, the combined effects of these three factors are associated with a wavenumber-6 circumglobal
  quasi-stationary wave pattern, potentially emerging from interconnected mechanisms that involve weakened
  meridional temperature gradients and enhanced Rossby wave flux activity. These results establish a valuable
  pathway for advancing early warning systems, enhancing regional resilience to compound extremes in a
  changing climate.
