summary: Reviewing peer-reviewed comparisons, data-driven models generally beat NWP on temperature extremes
  and cyclone tracks but underpredict records, with mixed results for extreme precipitation.
abstract: Data-driven weather forecasting models, chiefly trained on reanalysis data, now match or beat
  physics-based numerical weather prediction (NWP) models on most headline scores, but whether this advantage
  extends to extreme weather is contested. We review peer-reviewed studies that directly compare data-driven
  forecasts with NWP for extremes, from nowcasting to subseasonal lead times. We discuss grey literature
  in the outlook but do not include it in the formal review. There is good agreement on the fact that
  data-driven models mostly outperform NWP on temperature extremes, tropical cyclone tracks and the location
  of synoptic features across time scales. The evidence is mixed for extreme precipitation and feature-based
  extreme event detection such as extremes related to atmospheric rivers, while it leans toward better
  NWP performance for estimating event intensity. For record-breaking events that lie outside the training
  distribution, the evidence is narrower. Nonetheless, both a systematic global evaluation and several
  case studies find that physics-based models retain the advantage, with data-driven models underestimating
  both the frequency and the magnitude of records. Hybrid systems that post-process NWP with machine-learning
  (ML), or couple data-driven forecasts with physics-based models, deliver some of the largest and most
  consistent gains. We argue that headline scores, verification choices and case selection explain much
  of the apparent disagreement in the literature, and provide recommendations for a more trustworthy and
  interpretable evaluation of data-driven models for extreme and record-breaking weather.
