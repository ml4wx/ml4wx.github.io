summary: TDA-DARKNet detects tornadoes from dual-polarization radar with 97.11% accuracy and up to 42
  min lead time in strong tornado cases.
abstract: Tornado is a localized, small-scale severe convective weather phenomenon characterized by extreme
  destructiveness. Tornado detecting and warning mainly rely on Doppler weather radar, which identifies
  and tracks tornadoes by recognizing the tornado vortex signature and supercells in radar data. Artificial
  intelligence technology has been applied to tornado recognition in recent years. However, existing monitoring
  methods, especially those using unsupervised learning algorithms, still have limited recognition accuracy
  and timely warning, and usually struggle to strike a balance between detection accuracy and false alarm
  rate. A novel tornado detection algorithm TDA-DARKNet has been proposed to address the aforementioned
  issues. The algorithm integrates a dual attention mechanism, dense residual connections, and Kolmogorov–Arnold
  network (KAN). A tornado dataset suitable for deep learning has been formed, which utilizes features
  including radial velocity, reflectivity, velocity spectrum width, differential reflectivity, and correlation
  coefficient in radar data. The TDA-DARKNet algorithm was trained and tested using the tornado dataset,
  and evaluated in tornado cases. The experimental results show that TDA-DARKNet improves the detection
  probability and extends the lead time to a maximum of 42 min in strong tornado situations, while achieving
  97.11% accuracy, 95.08% precision, indicating strong overall identification performance. In addition,
  by directly leveraging radar-based data for tornado identification, the algorithm eliminates the need
  for manual feature engineering, simplifies data processing, reduces complexity, and further enhances
  detection effectiveness.
