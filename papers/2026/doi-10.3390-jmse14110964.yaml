summary: Compares seven machine learning algorithms for Northwest Pacific typhoon track and intensity;
  best models get under 7 km position error at 1 h and skill to 48–72 h.
abstract: 'In this study, we employ seven well-established machine learning algorithms for the stochastic
  simulation of tropical cyclones in the Northwest Pacific, namely Support Vector Machine (SVM), Random
  Forest (RF), Bayesian Network (BN), Backpropagation Neural Network (BPNN), Wavelet Neural Network (WNN),
  Recurrent Neural Network (RNN), and Long Short-Term Memory (LSTM) network. First, based on the CMA (China
  Meteorological Administration) Tropical Cyclone Best-Track Dataset, we statistically analyze key typhoon
  parameters within each 5° × 5° grid over the Northwest Pacific. Second, the Random Forest method is
  applied to rank the importance of feature factors for predicting typhoon translation speed, storm heading,
  and central pressure in each grid. Third, each algorithm is used to develop prediction models, with
  hyperparameters optimized via a time-series cross-validation scheme. Fourth, the prediction models are
  compared to identify the best-performing model for predicting translation speed, storm heading, and
  central pressure, respectively. The optimal models are then evaluated in terms of computational efficiency
  and overfitting/underfitting, and validated both against traditional statistical methods and through
  multi-lead-time (1–72 h) predictions for four independent typhoons: Lekima 2019, Doksuri 2023, Ragasa
  2025, and Yagi 2024. The results show that the optimal machine learning models outperform traditional
  statistical benchmarks, achieve a direct position error of <7 km and R2 ≥ 0.979 at 1 h lead time, with
  track prediction remaining useful up to 48–72 h, while effective intensity prediction does not exceed
  24 h. This study provides a robust data-driven framework for short-term typhoon forecasting within stochastic
  simulation, with future work aiming to extend to long-term predictions.'
