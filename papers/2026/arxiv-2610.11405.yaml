summary: A physics-constrained implicit neural network reconstructs continuous tropical cyclone near-surface
  wind profiles from sparse dropsondes, preserving surface winds across two decades of NOAA data.
abstract: Near the ocean surface, tropical cyclone winds change rapidly with height, but direct measurements
  are limited because aircraft dropsondes provide only sparse and irregular observations. Continuous wind
  profiles are important for understanding hurricane boundary-layer processes, improving storm-surge prediction,
  supporting offshore engineering, and assessing coastal hazards. In this study, we developed an artificial
  intelligence model that combines machine learning with physical principles to reconstruct continuous
  wind profiles from sparse observations. The model is designed to preserve the observed surface winds
  while generating realistic changes in wind speed and direction with height. Tests using more than two
  decades of NOAA hurricane observations show that the method accurately reproduces the vertical structure
  of tropical cyclone winds over a wide range of storm intensities. The framework can also extend satellite-derived
  surface wind measurements into three-dimensional near-surface wind fields, providing new opportunities
  for hurricane research, operational forecasting, and engineering applications.
