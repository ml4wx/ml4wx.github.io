summary: U-Net and GAN downscaling maps daily ERA5 fields to IMERG precipitation over West Africa, with
  GANs preserving variance that deterministic models lose.
abstract: Global reanalyses are too coarse to resolve the convective systems that produce most West African
  monsoon rainfall. In this work, we use U-Net based architectures to downscale daily ERA5 fields (0.25°)
  to IMERG V07 satellite precipitation (0.1°) over West Africa for the June to October seasons of 2000
  to 2024, using geopotential, temperature, humidity and wind at three pressure levels together with elevation
  and land fraction. Adding ERA5 precipitation as input slightly improves performance for this particular
  challenging region. We find that all the deterministic networks investigated for this work are too dry
  and lose almost all observed variance below a few hundred kilometers, which motivated our use of a GAN-based
  alternative. We also investigated permutation importance for the U-Net that ranks 500 hPa specific humidity
  first, consistent with the sensitivity of deep convection to mid-tropospheric moisture.
