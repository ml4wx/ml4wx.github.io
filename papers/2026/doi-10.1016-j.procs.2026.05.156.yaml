summary: Clustering and Dynamic Time Warping define a Climate Pattern Shift Index that quantifies temperature
  instability at two Bangladesh stations from 1980 to 2023.
abstract: Climate change poses severe threats to data-scarce agricultural regions, necessitating the development
  of advanced analytical frameworks for assessing temporal temperature variability. This study presents
  a rigorous machine learning-based methodology that employs K-means clustering and Dynamic Time Warping
  (DTW) to quantify climate instability using historical temperature data (1980–2023) from Rajshahi and
  Ishwardi, Bangladesh. A novel Climate Pattern Shift Index (CPSI) is proposed to measure interannual
  variations in seasonal peak temperatures. Results reveal substantial warming trends, with clustering-derived
  regime transitions demarcating pre-2000 and post-2000 climate structures. Additionally, approximately
  30% temporal misalignment is observed between temperature profiles of the 1980s and 2010s via DTW analysis.
  Rajshahi exhibited significantly higher CPSI instability (exceeding 1.5 months annually) compared to
  Ishwardi, which had relatively stable patterns (predominantly below 1 month). These findings validate
  algorithmic approaches for detecting latent nonlinear temperature anomalies, which are critical to regional
  climate resilience strategies. They offer reproducible methodological frameworks applicable to data-sparse
  populations globally and advance climate adaptation planning through quantitative temporal instability
  metrics.
