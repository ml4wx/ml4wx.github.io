summary: A practical checklist and set of metrics for assessing the energy and carbon footprint of ML
  applications across the Earth system modelling development pipeline.
abstract: As machine learning and artificial intelligence find their way into nearly every aspect of climate,
  weather, and Earth system modeling, it is worth pausing to consider what our design decisions imply
  for the science and for the computational resources we consume. A growing body of literature addresses
  the ethical and sustainable development of ML/AI, yet translating these principles into day-to-day research
  practice remains a challenge as most of best practices are dispersed across multiple studies and commentaries.
  Here, we distill these discussions into a practical checklist that ML/AI and Earth system science practitioners
  can use to assess and reduce the environmental footprint of their own applications, organised around
  the successive stages of the model development pipeline. We complement the checklist with a selection
  of metrics drawn from the literature for estimating the energy consumption and carbon footprint of a
  project. For each question, we point to concrete examples and actionable suggestions from recent literature,
  aiming to bridge the gap between aspirational principles and the decisions researchers face at every
  stage of the development cycle.
