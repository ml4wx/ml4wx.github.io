summary: Review arguing AI/ML can downscale, bias-correct and quantify uncertainty in wind forecasts to
  widen prescribed fire burn windows in complex terrain.
abstract: 'Prescribed fire is a vital tool for ecosystem management and wildfire risk reduction but its
  escalation is constrained by overly conservative burn windows because of uncertainties, for instance,
  in wind forecasts. This review describes the state of the art in weather product use by fire/smoke models
  and identifies three priority research gaps that artificial intelligence/machine learning (AI/ML) is
  well positioned to address: (1) spatial and temporal downscaling to meter-scale, sub-hourly wind fields;
  (2) bias correction for systematic model errors in complex terrain; and (3) robust uncertainty quantification
  to inform ensemble-based simulations. Emerging AI/ML techniques offer promising frameworks to address
  all three challenges. By providing high-resolution, bias-corrected, and probabilistic wind fields, AI/ML-enhanced
  forecasts will allow for expanded burn windows, improved ignition strategy design and a reduced reliance
  on expert intuition, especially when a prescribed fire is introduced into new areas.'
