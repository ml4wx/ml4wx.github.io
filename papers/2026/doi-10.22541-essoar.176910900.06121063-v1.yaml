summary: Nine deep learning super-resolution models downscale satellite precipitation over India and transfer
  zero-shot to ten global domains, with KGE above 0.85.
abstract: High-resolution precipitation estimates are essential for characterizing climate extremes, assessing
  sectoral impacts, and improving early-warning systems. However, the spatial resolution of global climate
  models (GCMs) and numerical weather prediction (NWP) systems are still limited due to computational
  constraints. This study assesses the zero-shot transferability and statistical robustness of deep learning
  (DL)-based super-resolution models for precipitation downscaling across heterogeneous geographic domains,
  data sources, and temporal scales. Nine DL architectures ranging from convolutional baselines to spatial
  attention-based generative models are trained on satellite-derived precipitation over three Indian monsoon-dominated
  regions during 2001-2014. Model performance is comprehensively evaluated against independent observational
  data across ten global domains (2015-2023), control NWP forecasts (2018-2023), and a GCM projection
  spanning 1950-2100. Across tropical, subtropical, and mid-latitude climate regimes, DL models demonstrate
  strong zero-shot generalization, achieving Kling-Gupta efficiency (KGE) scores exceeding ~0.85 and consistently
  outperforming bilinear interpolation (BI). Skill gains are evident in the representation of fine-scale
  spatial variability and extreme precipitation statistics that are not resolved in coarse inputs. Cross-dataset
  application further demonstrates stable statistical performance under differing forcing data and evolving
  climate conditions across multi-decadal projections. While overall performance differences among model
  architectures are generally modest, an approach incorporating spatial attention mechanisms shows enhanced
  skill for spatial coherence and extreme event detection. The analysis focuses on DL generalization and
  transferability and does not explicitly assess physical consistency or conservation constraints. These
  results highlight both the potential and limitations of DL-based precipitation downscaling as a computationally
  efficient post-processing framework for weather and climate model outputs.
