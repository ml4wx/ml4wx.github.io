summary: Machine-learning mosquito model driven by regional climate simulations projects Alpine Aedes
  albopictus season lengthening by 1.8 to 3.6 weeks and upward range expansion.
abstract: The recent global expansion of the Asian tiger mosquito (Aedes albopictus) across tropical and
  temperate regions provides a clear example of the mobility and adaptability of invasive species. Among
  multiple drivers influencing the spread of this species, climate change is emerging as a major driver,
  creating conditions that favour its persistence and expansion into higher latitudes and elevations.
  Hence, as global warming continues to make the climate of mountain areas milder, understanding Ae. albopictus'
  range and seasonality expansion in the Alpine area is fundamental, as it could introduce and propagate
  mosquito-borne diseases in previously free areas. Our objective is to evaluate the likely impact of
  climate change on the distribution and seasonality of Ae. albopictus for the periods 2036-2055 and 2066-2085
  in the Alps. We use entomological data collected for public health surveillance, along with temperature
  and precipitation datasets from surface observations and regional climate model simulations, to train
  a machine-learning mosquito population model and predict its spatial distribution under both current
  and future climate conditions. Our results demonstrate how increasing temperatures and altered precipitation
  regimes increase the abundance and seasonal expansion of Ae. albopictus. In particular, rising temperatures
  are projected to push the species' range to higher altitudes and to lengthen the duration of climatically
  suitable conditions. Projected warming increased mean season length by 1.8–3.6 weeks, depending on location,
  and expanded suitable elevation by several hundred metres across future climates, demonstrating consistent
  climate-driven increases in both seasonal activity and spatial reach of Ae. albopictus in the Alps.
