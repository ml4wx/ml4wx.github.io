summary: Large-ensemble test shows an AI emulator of E3SMv3 is strongly underdispersive and misses dependence
  structure and tail extremes over 10-day forecasts.
abstract: 'We evaluate the statistical fidelity of a very large ensemble of an AI/ML emulator by evaluating
  it against a similarly large ensemble of an ultra-low-resolution configuration of E3SMv3 for forecasts
  up to 10-day lead time. The emulator is trained on this E3SMv3 configuration, and initial conditions
  for emulator forecasts are taken directly from trajectories of the E3SMv3 ensemble. We compare the emulator-generated
  and E3SMv3 ensembles for RMSE growth, multivariate error covariance, and extremes across the 20 emulated
  prognostic variables. Emulator ensembles are found to be strongly underdispersive: ensemble spread grows
  robustly with lead time in E3SMv3 while remaining much smaller in the emulator. A nonparametric permutation
  test on the 20-dimensional RMSE covariance matrices shows that the covariance and correlation structures
  of the emulator and E3SMv3 differ significantly, with the observed Frobenius-norm statistic lying far
  in the tail of the permutation null distribution. Across variables, the emulator also under-populates
  the upper tails of the ensemble distributions, indicating an underrepresentation of rare but dynamically
  important events. Our results indicate that AI/ML emulators of global atmosphere models, while offering
  orders-of-magnitude speedups for ensemble prediction, require explicit evaluation of ensemble spread,
  dependence structure, and extremes to establish their suitability as replacements for their parent dynamical
  systems.'
