summary: An elevation-dependent XGBoost framework produces a 1 km daily China temperature dataset for
  1961–2024, cutting ERA5-Land RMSE to 0.75–1.35 °C.
abstract: High-resolution temperature datasets are essential for climate and agricultural research, yet
  the limitation of the existing products often includes coarse spatial resolution, short temporal coverage,
  or limited accuracy in regions with complex terrain. This study constructed a 1-km daily temperature
  dataset (including T max , T min and T mean ) for China from 1961 to 2024 using a machine-learning downscaling
  approach. An elevation-dependent refinement strategy was proposed, in which samples were grouped by
  elevation and transitional-zone weighted fusion was applied to ensure spatial continuity. XGBoost, optimized
  through Bayesian optimization and 10-fold cross-validation, was used to model nonlinear relationships
  between temperature and multi-source covariates. Independent validation demonstrated substantial improvements
  over ERA5-Land, with RMSE reduced to 0.97 °C, 0.75 °C, and 1.35 °C for T max , T mean , and T min ,
  respectively, particularly in high-elevation regions. The dataset effectively reproduced long-term temperature
  trends and extreme climate indices (including TXx, TNn, TX90p, TN10p, TX35d and TX35l), confirming its
  suitability for climate trend analysis and extreme-event research.
