summary: Applies PCMDI Metrics Package diagnostics to evaluate ACE2 and NeuralGCM as deep-learning Earth
  system models against observations and CMIP benchmarks.
abstract: In recent years, Deep-Learning Earth System Models (DL-ESMs) have emerged as promising, computationally
  efficient complements to traditional Earth system models. Here, we present an evaluation framework for
  testing DL-ESMs from an Earth system model-development perspective using standardized diagnostics from
  the PCMDI Metrics Package (PMP). This framework allows DL-ESMs, including Ai2's ACE2 and Google's NeuralGCM,
  to be assessed with metrics that quantify their ability to reproduce climatology, major modes of variability,
  monsoons, and precipitation variability relative to observational reference datasets and CMIP-class
  benchmarks. By evaluating DL-ESMs with tools commonly used for traditional models, we extend their assessment
  beyond short-range forecast skill and toward longer Earth System-relevant applications. The results
  identify encouraging strengths in several large-scale fields and modes of variability, while also highlighting
  persistent challenges in precipitation, tropical variability, and long-run stability for some model
  versions. This evaluation is a critical step toward building trust in DL-ESMs, guiding future model
  development, and clarifying their fit-for-purpose for Earth system science applications.
