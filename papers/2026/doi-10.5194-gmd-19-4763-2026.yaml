summary: Implements corrective machine learning in the kilometre-scale E3SM SCREAM model via a Python-C++
  coupling, and discusses why gains seen in FV3 did not transfer.
abstract: Abstract. The Simplified Cloud-Resolving E3SM Atmosphere Model (SCREAM) is the newest addition
  to the family of earth system models capable of explicitly resolving convective systems. SCREAM is a
  kilometer-scale configuration of the advanced E3SM Atmosphere Model (EAMxx), designed for heterogeneous
  systems. While the enhanced accuracy of kilometer-scale modeling offers significant benefits, it comes
  with a substantial computational cost, limiting feasible simulation durations to only a few years, even
  on the fastest supercomputers. Machine learning presents an opportunity for scientists to achieve the
  high accuracy of storm-resolving models at a significantly reduced cost. Building on the previous success
  of applying corrective machine learning (ML) to the FV3 model, this study explores the effects of implementing
  corrective ML in EAMxx-SCREAM. We also address the computational challenges of integrating our implementation
  of corrective ML, which is written in Python, with the C++/Kokkos EAMxx driver, as well as potential
  reasons why this approach has not proved as effective for EAMxx-SCREAM as for the FV3 model.
