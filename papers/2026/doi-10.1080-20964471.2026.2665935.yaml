summary: Compares analog ensembles with CorrDiff for downscaling GraphCast precipitation over the Western
  US; CorrDiff better captures extremes but needs about 600 times more compute.
abstract: In the time of big geodata, uncertainty quantification and reliable forecasts are crucial for
  decision making, especially when the resolution is limited. This study investigates uncertainty quantification
  in precipitation forecasting by applying two downscaling methods, Analog Ensemble (AnEn) and Corrective
  Diffusion (CorrDiff), to the AI weather model, GraphCast (0.25°, ~25 km), using PRISM (4 km) as the
  target for the Western US. The motivation of our investigation is to compare these two methods, as AnEn
  belongs to the traditional family of methods for ensemble generation, while CorrDiff represents a new
  direction of research. Our findings reveal a critical trade-off between the forecast accuracy for extreme
  events and the computational cost. While both AnEn and CorrDiff are effective for downscaling and ensemble
  generation, the generative approach of CorrDiff excels in reconstructing the most extreme, high-magnitude
  precipitation patterns at short lead times. This superior performance comes at a significantly higher
  computational expense, with CorrDiff requiring approximately 600 times more computations than AnEn.
  Furthermore, the skill of both methods is highly dependent on the quality of the underlying model forecasts,
  with performance degrading as lead time increases. This study aims to contribute to a better understanding
  of the uncertainty in downscaling and ensemble generation.
