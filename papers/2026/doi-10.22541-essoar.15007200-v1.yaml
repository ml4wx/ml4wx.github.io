summary: Spherical Fourier neural operator emulator shows that radiative forcing governs ENSO, IOD and
  MJO skill in long tropical rollouts.
abstract: We configure a neural operator emulator for process understanding of component radiative and
  surface forcings on emulation of the major modes of tropical variability. First, we describe and evaluate
  the performance of a spherical harmonic Fourier neural operator climate emulator in training and autoregressive
  inference of the tropical atmosphere over the ERA5 reanalysis period 1985-2024. Inference and ablation
  studies performed with an ensemble of independent models at varying resolutions demonstrate physical
  consistency, low biases, and reliable emulation over long auto-regressive rollout integrations. Examination
  of in-and out-of-sample inference and ablation studies indicate that long term forecast skill of key
  indices of tropical modes of variability on seasonal to interannual timescales namely, the El Niño
  Southern Oscillation, the Indian Ocean Dipole, and daily variations of the Interdecadal Pacific Oscillation,
  is dependent on accurate knowledge of large scale variations in the incident downward short wave radiation.
  For intraseasonal variability associated with the Madden-Julian Oscillation, accurate forcing due to
  outward longwave radiation is further required. Resolution dependencies are also examined.
