summary: Random forest combined with empirical quantile mapping downscales 11 CMIP6 precipitation models
  over Europe, reducing errors for light rainfall versus quantile mapping alone.
abstract: 'This study evaluated bias-correction-based downscaling approaches for precipitation data from
  11 high-resolution CMIP6 models across Europe. The Empirical Quantile Mapping technique demonstrated
  superior performance by aligning the model outputs with observed precipitation data. Random Forest -
  empirical quantile mapping model outperformed Random Forest model, particularly for low rainfall intensities
  (0–5 mm/day), and exhibited residual errors closer to zero across most European regions. Precipitation
  overestimations by CMIP6 models in Central and Eastern Europe were significantly reduced through the
  application of empirical quantile mapping, Random Forest, and Random Forest empirical quantile mapping
  approaches. Seasonal analysis revealed lower residual errors in summer than in winter for the evaluated
  methods. Future projections will provide insights into reduced overestimation of high quantiles, leading
  to reliable precipitation estimates. The proposed methodological framework suggests that integrating
  bias correction complemented by machine learning techniques enhances the accuracy of regional precipitation
  downscaling, crucial for climate risk management in Europe. To get an output for the study region other
  than Europe follow the methodology of the manuscript (available at: https://doi.org/10.1080/10106049.2026.2657618).'
