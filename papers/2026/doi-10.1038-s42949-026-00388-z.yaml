summary: Perspective proposing a hybrid physics, observation and machine learning framework to resolve
  the granularity-coverage-interpretability trilemma in urban weather and climate modeling.
abstract: Urban weather and climate modeling is challenged by the highly heterogeneous and dynamic nature
  of cities. It exhibits a persistent trilemma between spatial granularity, spatiotemporal coverage, and
  physical interpretability. We articulate this challenge and propose a hybrid framework integrating physics-based
  models, urban observations, and machine learning. Framing this challenge as an integration problem across
  methods and scales, we provide a structured guide for next-generation, decision-relevant urban weather
  and climate modeling.
