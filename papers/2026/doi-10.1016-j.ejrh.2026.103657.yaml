summary: Interpretable machine learning attributes China's meteorological drought propagation to ENSO
  and sunspot activity, with hydrological drought lagging by up to 1.5 months.
abstract: Study region The study region is China's four major ecological geographical regions Study focus
  Investigating the cascading propagation effects of different drought types across distinct zones and
  their influence by atmospheric circulation is crucial for refined regional water resource management.
  This study systematically characterizes meteorological, hydrological, and ecological droughts. By constructing
  a comprehensive analytical framework integrating Pearson correlation analysis, wavelet coherence, and
  interpretable machine learning, we quantified the spatiotemporal coherence of multi-type drought evolution,
  propagation delays, and the nonlinear driving effects of atmospheric circulation factors. New hydrological
  insights for the region (1)The propagation of meteorological drought to hydrological drought is significant
  on the long timescale, while its progression to ecological drought is concentrated on the shorter timescale.
  (2)Meteorological and hydrological droughts in China's northwest region have continued to worsen, while
  ecological drought conditions have eased. (3)Hydrological drought follows a meteorological cascade with
  lags ranging from near-synchronous to approximately 1.5 months. Conversely, ecological drought exhibits
  decoupling and weaker correlations, manifesting as quasi-instantaneous responses in islands. (4)Among
  atmospheric circulation factors, ENSO dominates meteorological drought, while sunspot activity emerges
  as a key associated factor, producing opposing effects. These findings clarify the distinct propagation
  lags and atmospheric forcing mechanisms across diverse drought types.
