summary: CNN emulators of 19 dynamic vegetation models, driven by ERA5, reproduce global land carbon sink
  anomalies (median R2=0.81) on unseen years.
abstract: The land carbon sink explains most of the variability of the atmospheric CO2 growth rate, but
  the Global Carbon Budget estimates it with dynamic global vegetation models (DGVMs) run once a year.
  Emulators could provide it sooner if they reproduce each model outside its training period. Here we
  show that convolutional neural network emulators of 19 of these models, driven by ERA5 climate and their
  own past predictions, reproduce the global land sink of these models and its spread over two years not
  used in training. Global monthly net biome production (NBP) anomalies were reproduced with a median
  R^2 of 0.81. The error of the multi-model mean annual NBP was at most 0.23 GtC yr^-1. At the grid-cell
  level, the median R^2 of monthly anomalies was 0.30, partly because of errors that accumulate in the
  emulated NBP history.
