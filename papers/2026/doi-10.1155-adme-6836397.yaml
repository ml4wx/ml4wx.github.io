summary: Random forest and linear models estimate planetary boundary layer height in Quito from drone
  profiles, performing best under unstable conditions.
abstract: 'The estimation of height of the planetary boundary layer (hPBL) is essential for weather prediction,
  air quality assessment, and atmospheric research, particularly in complex terrain where boundary‐layer
  dynamics strongly influence temperature structure, cloud development, and convective processes. In data‐scarce
  regions such as the tropical Andes, routine hPBL monitoring is often constrained by the high operational
  costs and logistical limitations of radiosonde observations. Low‐altitude drones offer a flexible and
  cost‐effective alternative for sampling lower atmospheric conditions, although their restricted vertical
  range necessitates complementary inference approaches. This study presents a methodological proof‐of‐concept
  through a site‐specific case study in Quito, Ecuador, exploring the feasibility of combining drone‐derived
  meteorological profiles (0–300 m above ground level) with machine learning (ML) techniques to estimate
  hPBL. Four models were evaluated: neural networks (NNs), random forest (RF), support vector regression
  (SVR), and multiple linear regression (MLR). Among these, RF and MLR achieved the strongest performance
  when trained using the most relevant predictors identified through RF‐based feature importance analysis.
  Model performance was generally higher under unstable atmospheric conditions, characterized by elevated
  convective available potential energy (CAPE; ≈1400 J kg −1 ) and deeper hPBL (≈2700 m agl), and lower
  under more stable conditions (CAPE, ≈300 J kg −1 ; hPBL, ≈2200 m agl). Surface wind speed (WS), mixing
  ratio (MR), and the interaction between MR and temperature emerged as the most influential predictors,
  offering preliminary insight into the physical drivers of boundary‐layer development in this environment.
  While the findings are constrained by limited sample size, vertical extent, and geographic specificity,
  this exploratory framework demonstrates the potential of integrating unmanned aerial vehicle (UAV) observations
  with artificial intelligence (AI)‐based methods as a low‐cost strategy for hPBL estimation in observationally
  limited, topographically complex regions, and provides a foundation for future validation and broader
  application.'
