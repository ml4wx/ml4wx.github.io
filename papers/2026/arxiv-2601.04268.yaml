summary: Reinforcement learning learns state-dependent online parametrisation corrections in idealised
  climate models, with TD3, DDPG and TQC outperforming static tuning in simple testbeds.
abstract: Weather and climate models rely on parametrisations to represent unresolved sub-grid processes.
  Traditional schemes rely on fixed coefficients that are weakly constrained and tuned offline, contributing
  to persistent biases that limit their ability to adapt to underlying physics. This study presents a
  framework that learns components of parametrisation schemes online as a function of the evolving model
  state using reinforcement learning (RL) and evaluates policy-driven parameter updates across idealised
  testbeds spanning a simple climate bias correction (SCBC), a radiative-convective equilibrium (RCE),
  and a zonal mean energy balance model (EBM) with single-agent and federated multi-agent settings. Across
  nine RL algorithms, Truncated Quantile Critics (TQC), Deep Deterministic Policy Gradient (DDPG), and
  Twin Delayed DDPG (TD3) achieved the highest skill and stable convergence, with performance assessed
  against a static baseline using area-weighted RMSE, temperature and pressure-level diagnostics. For
  the EBM, single-agent RL outperformed static parameter tuning with the strongest gains in tropical and
  mid-latitude bands, while federated RL on multi-agent setups enabled specialised control and faster
  convergence, with a six-agent DDPG configuration using frequent aggregation yielding the lowest area-weighted
  RMSE across the tropics and mid-latitudes. The learnt corrections were also physically meaningful as
  agents modulated EBM radiative parameters to reduce meridional biases, adjusted RCE lapse rates to match
  vertical temperature errors, and stabilised heating increments to limit drift. Overall, results show
  that RL can learn skilful state-dependent parametrisation components in idealised settings, offering
  a scalable pathway for online learning within numerical models and a starting point for evaluation in
  weather and climate models.
