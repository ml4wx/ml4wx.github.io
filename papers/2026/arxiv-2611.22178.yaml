summary: CorrectCast adds a lightweight frozen-backbone residual corrector using QPE and PWV, raising
  mean CSI by 0.023-0.029 across six precipitation nowcasters.
abstract: Precipitation nowcasting models suffer from errors in intensity, location, and spatial structure.
  Addressing these errors by retraining nowcaster backbones can be computationally expensive and requires
  architecture-specific modifications. To overcome these limitations, we propose CorrectCast, a decoupled
  residual correction framework that refines completed nowcasts while keeping the base nowcaster frozen.
  By operating on predicted precipitation fields, CorrectCast requires training only a lightweight corrector,
  reducing computational overhead while providing a unified correction interface across different nowcasting
  models. Conditioned on the base nowcast and historical quantitative precipitation estimation (QPE) and
  precipitable water vapor (PWV) observations, the corrector selects multimodal context and employs scale-aware
  modulation to estimate residual corrections. On the Mississippi River Basin (MRB) and contiguous United
  States (CONUS) datasets, CorrectCast improves six base nowcasters spanning extrapolation-based, deterministic,
  and generative approaches, with absolute gains in mean CSI averaging 0.0233 and 0.0290 across the six
  models, respectively.
