summary: A Swin Transformer weather emulator shows predictable neural scaling under continual training,
  with IsoFLOP analysis identifying compute-optimal regimes for forecasting.
abstract: Neural scaling laws, which in some domains can predict the performance of large neural networks
  as a function of model, data, and compute scale, are the cornerstone of building foundation models in
  Natural Language Processing and Computer Vision. We study neural scaling in Scientific Machine Learning,
  focusing on models for weather forecasting. To analyze scaling behavior in as simple a setting as possible,
  we adopt a minimal, scalable, general-purpose Swin Transformer architecture, and we use continual training
  with constant learning rates and periodic cooldowns as an efficient training strategy. We show that
  models trained in this minimalist way follow predictable scaling trends and even outperform standard
  cosine learning rate schedules. Cooldown phases can be re-purposed to improve downstream performance,
  e.g., enabling accurate multi-step rollouts over longer forecast horizons as well as sharper predictions
  through spectral loss adjustments. We also systematically explore a wide range of model and dataset
  sizes under various compute budgets to construct IsoFLOP curves, and we identify compute-optimal training
  regimes. Extrapolating these trends to larger scales highlights potential performance limits, demonstrating
  that neural scaling can serve as an important diagnostic for efficient resource allocation. We open-source
  our code for reproducibility.
