summary: A history-matching calibration method with simpler emulators detects structural error in a 34-parameter
  CAM6 perturbed ensemble and finds members beating the default configuration.
abstract: We propose a fully automated, structural error-aware, interpretable climate model parameter
  estimation method that leverages Perturbed Parameter Ensembles (PPEs). It is based on history matching
  and aligns with an increasingly-used iterative simulation-emulation-calibration methodology. The method
  is motivated by the negative impacts of structural error and emulator and observational uncertainties
  on climate model parameter estimation efforts, as well as the problems associated with sparsely-sampled
  PPEs. To address these challenges, the method explicitly builds simpler emulators that avoid overfitting,
  detect structural error, avoids compensating for structural error through inflated mismatch tolerances,
  and sequentially excludes structurally inconsistent variables for parameter estimation. The method decomposes
  the high-dimensional calibration problem into linked low-dimensional subproblems, and integrates their
  constraints to reconstruct the jointly plausible region of the full parameter space. The method is applied
  to a 100-member PPE with 34 perturbed parameters generated by a version of CAM6 with machine learning-based
  warm rain microphysics parameterization. Through iterative application, the method greatly reduces the
  ensemble spread and improves the matching between simulated and observed zonal climatologies. The method
  also finds ensemble members that outperform the default CAM6 configuration in root mean square error
  across multiple diagnostics. Controlled experiments demonstrate that overly-conservative emulator uncertainty
  could lead to neglect of informative observations, and tolerance of the structural error, in the context
  of this method, biases the estimated parameters toward compensating for structural error. Our work also
  emphasizes the value of interpretability for diagnosing structural error and informing parameter estimation
  in PPE-based calibration.
