summary: LightGBM day-ahead PV forecasts use NWP features, with random-forest downscaling of site-level
  data to resolve the coarse NWP spatial mismatch.
abstract: Accurate forecasting of photovoltaic (PV) power is essential for secure grid operation, but
  remains difficult due to meteorological uncertainty and the coarse spatial resolution of numerical weather
  prediction (NWP) data. To address these challenges, this study develops a hybrid framework that integrates
  physical modeling with machine learning. The PVWatts model is first applied as a physical baseline.
  Building on this, historical power records, temporal statistical features, and NWP data are incorporated
  into a LightGBM regression model for day-ahead forecasting. Comparative t-tests confirm that NWP features
  significantly improve predictive accuracy, while scenario partitioning using global horizontal irradiance
  (GHI) further enhances model adaptability. To resolve spatial mismatch, a Random Forest–based downscaling
  method is proposed, reconstructing high-resolution meteorological features from site-level data. These
  downscaled features are integrated into the forecasting model, yielding higher accuracy, robustness,
  and performance under diverse operating conditions. Overall, this study establishes a multi-level PV
  forecasting system that combines physical mechanisms and data-driven learning. The proposed approach
  achieves strong adaptability and reliable accuracy, providing effective support for renewable energy
  integration, smart grid scheduling, and PV plant operation.
