summary: A physics-informed network forecasts ERA5 potential temperature at three pressure levels 1-3
  h ahead, beating baselines by 8-24% RMSE and transferring across regions.
abstract: Short-horizon forecasts of atmospheric temperature are needed to support climate-aware digital-twin
  systems, but such forecasts must be produced where thermal observations are incomplete. This study evaluates
  a physics-informed neural network for potential-temperature forecasting, constrained by a pressure-coordinate
  thermodynamic advection-source equation and a diabatic-source closure fit from the preceding 12-hour
  period and frozen before future-time training. Using hourly ERA5 reanalysis at three pressure levels,
  the model is evaluated as a conditional hindcast at lead times of one, two and three hours against persistence,
  local-trend, and two matched neural-network baselines, one of which receives the same future meteorological
  forcing as the PINN, helping distinguish the physical constraint from access to future forcing. In an
  Oklahoma development case, mean RMSE improvement over the strongest baseline grew from 8.1\% at one
  hour to 23.8\% at three hours; under an observation-density sweep down to 5\% of candidate locations,
  this 3-hour advantage remained 14.6--16.9\%, with no evidence that lower density improves performance.
  Under a fixed protocol transferred to an Alabama heat event with three virtual-observation layouts,
  three-hour improvement ranged 19.7-24.4\% with consistent origin-level wins. A parallel Montana stress
  test, in which fixed pressure levels intersected complex terrain, produced a three-hour degradation
  of roughly 17.5\%, identifying a terrain-related applicability limit of the formulation. Together, these
  results indicate that the physics constraint's benefit grows with forecast horizon, persists under severe
  observation sparsity, and transfers across regions, but is bounded by the validity of a fixed vertical-coordinate
  representation over complex terrain, evidence relevant to physics-constrained components of climate-aware
  forecasting and digital-twin systems.
