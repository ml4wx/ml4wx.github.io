summary: TAUT combines U-Net, Swin Transformer and terrain features to downscale 2 m temperature to 0.01°
  hourly over Southwest China, beating U-Net and SRCNN.
abstract: High-precision temperature prediction is crucial for dealing with extreme weather events under
  the background of global warming. However, due to the limitations of computing resources, numerical
  weather prediction models are difficult to directly provide high spatio-temporal resolution data that
  meets the specific application requirements of a certain region. This problem is particularly prominent
  in areas with complex terrain. The use of remote sensing data, especially high-resolution terrain data,
  provides key information for understanding and simulating the interaction between land and atmosphere
  in complex terrain, making the integration of remote sensing and NWP outputs to achieve high-precision
  meteorological element downscaling a core challenge. Aiming at the challenge of temperature scaling
  in complex terrain areas of Southwest China, this paper proposes a novel deep learning model—Terrain
  Adaptive U-Net Transformer (TAUT). This model takes the encoder–decoder structure of U-Net as the skeleton,
  deeply integrates the global attention mechanism of Swin Transformer and the local spatiotemporal feature
  extraction ability of three-dimensional convolution, and innovatively introduces the multi-branch terrain
  adaptive module (MBTA). The adaptive integration of terrain remote sensing data with various meteorological
  data, such as temperature fields and wind fields, has been achieved. Eventually, in the complex terrain
  area of Southwest China, a spatio-temporal high-resolution downscaling of 2 m temperature was realized
  (from 0.1° in space to 0.01°, and from 3 h intervals to 1 h intervals in time). The experimental results
  show that within the 48 h downscaling window period, the TAUT model outperforms the comparison models
  such as bilinear interpolation, SRCNN, U-Net, and EDVR in all evaluation metrics (MAE, RMSE, COR, ACC,
  PSNR, SSIM). The systematic ablation experiment verified the independent contributions and synergistic
  effects of the Swin Transformer module, the 3D convolution module, and the MBTA module in improving
  the performance of each model. In addition, the regional terrain verification shows that this model
  demonstrates good adaptability and stability under different terrain types (mountains, plateaus, basins).
  Especially in cases of high-temperature extreme weather, it can more precisely restore the temperature
  distribution details and spatial textures affected by the terrain, verifying the significant impact
  of terrain remote sensing data on the accuracy of temperature downscaling. The core contribution of
  this study lies in the successful construction of a hybrid architecture that can jointly leverage the
  local feature extraction advantages of CNN and the global context modeling capabilities of Transformer,
  and effectively integrate key terrain remote sensing data through dedicated modules. The TAUT model
  offers an effective deep learning solution for precise temperature prediction in complex terrain areas
  and also provides a referential framework for the integration of remote sensing data and numerical model
  data in deep learning models.
