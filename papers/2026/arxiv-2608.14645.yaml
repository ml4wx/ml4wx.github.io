summary: An MLP surrogate replaces line-by-line radiative transfer for NanoCarb CO2 spectra, trained with
  radiance and Jacobian loss, enabling efficient CO2 retrieval forward modelling.
abstract: 'Studying climate change requires reducing uncertainties in CO2 and CH4 emission estimates to
  better distinguish anthropogenic from natural sources, which motivates spaceborne measurements with
  improved revisit frequency and spatial coverage. In this context, the Horizon Europe SCARBOn project
  assesses a low-cost satellite constellation featuring the NanoCarb imaging interferometer as its core
  sensor for monitoring CO2 and CH4 emissions in the atmosphere. However, estimating CO2 and CH4 concentrations
  with high revisit and spatial coverage poses significant challenges: full-physics retrieval algorithms
  commonly used rely on repeated high-resolution radiative transfer (RT) simulations, which are computationally
  expensive when using line-by-line RT models. As an alternative, we propose in this study a feedforward
  multilayer perceptron (MLP) surrogate designed to accurately and efficiently predict top-of-atmosphere
  radiances in the CO2 weak band, using a combined mean absolute error (MAE) loss on radiances and RT
  Jacobians to preserve both spectral accuracy and sensitivity to geophysical parameters. Coupling the
  MLP-based RT surrogate with the NanoCarb instrumental response yields an efficient and precise forward
  model for NanoCarb measurements, which shows promising results for CO2 concentration retrieval.'
