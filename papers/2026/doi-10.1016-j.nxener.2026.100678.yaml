summary: CNN+LSTM hybrid forecasts Bangladesh monthly temperature from 122 years of records (R² 0.96)
  and projects 2023–2033 temperature trends.
abstract: Bangladesh’s tropical location makes it particularly vulnerable to the effects of climate change,
  with rising temperatures and extreme heat posing threats to agriculture, the economy, and public health.
  Accurate weather forecasting is essential for effective decision-making and building climate resilience;
  however, it faces challenges due to the non-linear nature of climate data. While traditional forecasting
  models have been extensively studied, they often lack robustness and fail to capture the complex patterns
  inherent in climate systems. This highlights the need for more advanced methodologies to enhance forecast
  accuracy and support climate adaptation efforts. This study analyzed 122 years of historical weather
  data to predict monthly temperatures for 2022 in Bangladesh, utilizing seven deep learning models including
  CNN, LSTM, BiLSTM, ConvLSTM, and three hybrid architectures (CNN+BiLSTM, CNN+ConvLSTM, and CNN+LSTM).
  The paper employed metrics such as MAE, MSE, RMSE, and R 2 , with the CNN+LSTM model demonstrating superior
  performance, achieving an MAE of 0.04 ∘ C and an R 2 of 0.96. To the best of our knowledge, this research
  represents the first comparative study in Bangladesh that utilizes century-long historical climate data
  to apply and compare various deep learning models for long-term temperature forecasting. Furthermore,
  this research forecasts monthly temperature trend Bangladesh from 2023 to 2033. This study establishes
  a novel benchmark in Bangladesh that policymakers can use to create early alert systems for disaster-related
  activities, address climate change, plan for heat-resistant urban development, and formulate public
  health and agricultural adaptation policies.
