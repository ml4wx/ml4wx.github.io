summary: STGLDWeather combines multi-scale spatiotemporal graph networks with latent diffusion to forecast
  temperature, geopotential and wind, outperforming baselines in accuracy and efficiency.
abstract: 'Accurate weather prediction is crucial in agriculture, disaster prevention, and public safety.
  CHALLENGE: Traditional numerical models have high computational costs and struggle with atmospheric
  nonlinearity and chaos, while existing deep learning methods face limitations in handling spatial heterogeneity
  and non-Euclidean data. SOLUTION: This paper introduces the STGLDWeather method. It combines multi-scale
  spatiotemporal graph neural networks (MS-ST-GNN) and latent diffusion models (LDM) to capture multi-scale
  spatiotemporal dependencies in weather data and model the temporal evolution of weather conditions in
  latent space. CONCLUSION: Experiments on real weather datasets show that STGLDWeather significantly
  outperforms existing state-of-the-art baselines in prediction accuracy and computational efficiency,
  particularly excelling in temperature, geopotential height, and wind speed forecasts.'
