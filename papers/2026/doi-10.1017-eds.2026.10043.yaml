summary: Three-dimensional implicit neural network compresses and continuously reconstructs multi-altitude
  wind data, outperforming baselines in super-resolution and compression.
abstract: 'Abstract Wind energy stands out as a promising clean and renewable energy alternative, not
  only for its potential to combat global warming but also for its capacity to meet the ever-growing demand
  for energy. However, analysis of wind data to fully harness the benefits of wind energy demands tackling
  several related challenges: (1) Current data resolution is inadequate for capturing the detailed information
  needed across diverse climatic conditions; (2) Efficient management and storage of real-time measurements
  are currently lacking; (3) Extrapolating wind data across spatial specifications enables analysis at
  costly-to-measure, unobserved points is necessary. In response to these challenges, we introduce the
  One Stone Three Bird model, a modality-agnostic learning framework utilizing Implicit Neural Network.
  Our model effectively compresses a large volume of climate data into a manageable latent codec. It also
  learns underlying continuous climate patterns, enabling reconstruction at any scale and supporting modality
  transfer and fusion. Extensive experimental results show consistent performance improvements over existing
  baselines in both (1) continuous super-resolution reconstruction and (2) data compression tasks for
  different cross-altitude prediction scenarios. Through systematic ablation studies, we demonstrate the
  effectiveness of each core component, quantifying its individual contribution to the overall performance
  of the proposed design.'
