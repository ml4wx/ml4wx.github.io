summary: U-Net blending of ECMWF and Pangu forecasts, exploiting their opposite errors, significantly
  improves South China Sea boundary-layer jet prediction over either model alone.
abstract: Abstract The boundary-layer jet (BLJ) over the northern South China Sea exerts a strong influence
  on heavy rainfall along the South China coast, yet its predictability across different modeling frameworks
  remains insufficiently understood. This study presents a systematic comparison of BLJ forecasts from
  a conventional numerical weather prediction (NWP) model (the European Centre for Medium-Range Weather
  Forecasts, ECMWF) and a data-driven artificial intelligence (AI) model (Pangu). The AI model outperforms
  the NWP model in overall accuracy, with reduced root-mean-square errors and improved representation
  of wind direction. However, the two models exhibit distinct and opposite systematic error structures.
  ECMWF consistently overestimates BLJ intensity and spatial extent, accompanied by a northwestward displacement
  of the jet core and a clockwise wind-direction bias. Conversely, Pangu underestimates BLJ intensity,
  with a northeastward core shift and a counterclockwise wind-direction bias. Motivated by these complementary
  errors, we develop a U-Net–based blending framework with a composite loss function integrating mean
  absolute error, miss rate, and false alarm rate. The blended forecasts significantly outperform both
  individual models across multiple BLJ metrics. These results demonstrate that combining physics-based
  and AI-based forecasts can mitigate systematic biases to improve BLJ prediction, highlighting a promising
  pathway toward hybrid forecasting systems for weather extremes.
