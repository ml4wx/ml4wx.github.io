summary: Systematic review of 139 studies (2020–2026) on deep learning for extreme rainfall prediction,
  covering multimodal fusion, uncertainty, physics-informed hybrids and evaluation gaps.
abstract: Extreme rainfall events (ERES) are among the most challenging hydro-meteorological phenomena
  to forecast because the complex, nonlinear atmospheric processes involved span multiple spatial and
  temporal scales and are further intensified by rising climate variability. While Numerical Weather Prediction
  (NWP) models offer physically consistent representations of atmospheric dynamics, they still struggle
  to resolve localized convection, rapidly evolving storm systems, and rare, high-intensity precipitation
  events. This study systematically reviews recent advances in Artificial Intelligence (AI) for extreme
  rainfall prediction published between 2020 and 2026, using a transparent literature search strategy,
  predefined screening criteria, quality assessment, and a structured literature review matrix. The review
  synthesizes evidence from a final evidence base of 139 studies across several dimensions, including
  deep learning (DL) methodologies, multimodal data fusion, forecasting horizons, operational deployment,
  uncertainty quantification, and emerging intelligent forecasting paradigms. The analysis reveals a transition
  from deterministic DI models to hybrid, physics-informed, uncertainty-aware, and operational forecasting
  systems that increasingly integrate AI with physical knowledge and heterogeneous environmental observations.
  Despite notable progress, persistent challenges remain, including data scarcity, class imbalance, model
  generalization, physical consistency, uncertainty estimation, transferability, and the lack of standardized
  evaluation frameworks. This review provides a unified synthesis of current methodologies. It identifies
  key research gaps, highlighting the need for evaluation frameworks that address physical plausibility,
  uncertainty quantification, reliability, transferability, and operational relevance. The findings indicate
  that future extreme rainfall prediction systems should advance beyond accuracy-focused evaluation toward
  integrated, trustworthy, uncertainty-aware, and physically consistent forecasting approaches.
