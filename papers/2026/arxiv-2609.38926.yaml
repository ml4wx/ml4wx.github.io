summary: PrecipJEPA adds a JEPA auxiliary path and motion-source renderer, raising highest-threshold CSI
  by 118.6% on SEVIR for 3-hour radar nowcasting.
abstract: Long-term precipitation nowcasting requires modeling radar-echo evolution while preserving localized
  high-intensity structures. Recent radar-specific studies motivate location-aware prediction and separating
  echo displacement from intensity change. However existing encoders learn historical representations
  mainly from final forecast errors. We propose PrecipJEPA, which couples a structured forecasting path
  with an auxiliary path that enriches its encoder from observed radar history. In the forecasting path,
  an online encoder first converts the observations into spatiotemporal tokens. The Task-Driven Future-State
  Predictor (TFP) combines these tokens with a recent-dynamics summary and spatiotemporal queries to construct
  future radar states. The Parallel Motion-Source Renderer (PMSR) decodes these states into motion and
  source-sink fields that transform the latest observation into future frames. During joint training,
  the History-Masked JEPA (H-JEPA) operates on the auxiliary path to predict masked historical features
  from visible context, directly supervising the same online encoder from the observed sequence. Experiments
  on SEVIR and MeteoNet show that PrecipJEPA improves highest-threshold CSI by 118.6% and 35.1%, respectively,
  over the strongest baselines, while maintaining the highest mean CSI throughout the 3-hour forecast.
