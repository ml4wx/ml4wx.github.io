summary: Random Forest classifies disaster risk from live weather API data in a web dashboard with alerts;
  the abstract gives no quantitative accuracy.
abstract: 'Natural disasters such as floods, heatwaves, cyclones, and droughts continue to pose serious
  threats to human life and infrastructure. This paper presents an AI Disaster Prediction Web Application
  that uses machine learning algorithms and real-time meteorological data to predict potential disaster
  conditions and provide early alerts. The system collects environmental parameters including temperature,
  humidity, rainfall, wind speed, and atmospheric pressure from live weather APIs. A Random Forest machine
  learning model processes these inputs to classify possible disaster types and estimate their probability.
  The application includes an interactive web dashboard for real-time visualization, alert notifications,
  and precautionary recommendations. Experimental analysis demonstrates that the system achieves high
  prediction accuracy while maintaining low response latency. The proposed solution offers an intelligent,
  scalable, and userfriendly platform for disaster preparedness and early warning management. Keywords:
  Artificial Intelligence, Disaster Prediction, Machine Learning, Random Forest, Weather Analytics, Real-Time
  Alerts, Web Dashboard.'
