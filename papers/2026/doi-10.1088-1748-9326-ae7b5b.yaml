summary: Complex-network analysis maps lagged SST-to-land heat extreme teleconnections, covering over
  90% of land at 12-month lead, suggesting overlooked long-term predictability.
abstract: Abstract While sea surface temperature (SST) anomalies are known as important drivers of terrestrial
  heat extremes, a unified quantitative understanding of the SST’s impacts across seasons, ocean basins,
  and lead times has not been ascertained. Here, we apply a complex network framework to systematically
  investigate these ocean-to-land linkages at a global scale. It is found that the global impacts of different
  ocean basins emerge at distinct time lags. In particular, the Indian Ocean exerts near-instantaneous
  effects, whereas the predominant influences of tropical Pacific can persist for up to six months. The
  impacts of the North Atlantic and western Pacific peak at lead times of approximately 3–6 months. Robust
  SST-terrestrial heat extreme teleconnections span >90% of the land areas even at a lead time of 12 months,
  exposing a potentially substantial source of long-term predictability that has been overlooked by traditional
  statistical analysis. Climate models demonstrate skillful simulations of these lag-dependent teleconnections,
  linking stronger SST variability to enhanced modulations on extreme terrestrial high temperature. This
  framework provides a systematic, data-driven approach for elucidating ocean-to-land modulations, which
  deepens our knowledge of the predictability of the climate system.
