summary: CNN and ConvLSTM models downscale CMIP6 daily temperature over India to 0.1° using ERA5-Land,
  projecting a 0.3°C 2030 annual warming.
abstract: 'Abstract Global climate change leads to distinct regional impacts. Future climate projections
  are available through global model outputs, but they lack the spatial detail needed to inform local
  decision-making for adaptation. Regional- and local-scale climate information can be generated by ‘downscaling’
  these global model outputs through regional climate model simulations, which require enormous supercomputing
  resources, thereby limiting the availability of local-scale projections, especially in underdeveloped
  regions. Here, we build and test four different computationally efficient machine learning models as
  an alternative to regional climate models for downscaling daily temperature data over India. We utilise
  publicly available CMIP6 coarse (1.87° × 1.87°) resolution climate data and relate them to the finer
  (0.1° × 0.1°) resolution ERA5-Land reanalyses 2 m daily temperatures as a target to train our models
  over the 2018–2022 period. We progressively improve our model design by utilising spatial learning (through
  a convolutional neural network) and then including temporal learning (through ConvLSTM) and optimising
  the target region for downscaling. We systematically evaluate all four models for a temporally near
  year 2017 and a temporally distant year 2007 and select the best model variant to project daily temperatures
  over India for the medium-term future, 2030. We present seasonal maps, frequency distributions, as well
  as city-specific time-series of daily temperatures for the downscaled data vis-à-vis the original global
  model data. We find a slight overall increase in the annual averaged downscaled temperatures for 2030
  (0.3°C) and an even larger increase in the most frequent (i.e., modal) temperature (1°C), but also a
  decrease over certain regions, particularly in the Indo-Gangetic plain, in summer and monsoon as compared
  to the coarse-scale temperatures in the global model data for 2030. Our deep learning model compares
  favourably with reference data from the ERA5-Land reanalyses and runs much faster, with much fewer computational
  resources than a typical physics-based regional climate model and therefore opens up the possibility
  of democratising the field of climate downscaling. Research highlights ML-based coarse-grid to fine-grid
  downscaling of daily temperatures over India: Four neural network architectures, two CNNs and two RNNs,
  are built and tested as computationally-light replacements for physics-based models. Excluding the Tibetan
  plateau with complex topography from the target region and including a 14-day weather history into the
  model input stream improves model performance. All model architectures show better performance at the
  coasts and worse performance over the Thar desert and Himalayan foothills and struggle to predict fine-grid
  temperatures during pre-monsoon. The best model architecture (with 14-day history and cropped target
  region) is ultimately used to rapidly downscale future CMIP6 projections of daily temperatures over
  India for 2030. The downscaled 2030 temperatures differ meaningfully from the coarse CMIP6 2030 temperatures
  over India overall as well as over its major cities, thereby proving the added value of the ML-downscaling
  exercise.'
