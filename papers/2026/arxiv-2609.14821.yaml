summary: Decision-oriented uncertainty quantification for Earth system foundation models, cutting decision
  regret 18.7% and missed events from 14.2% to 9.1% on warning tasks.
abstract: Earth system modeling is shifting from task-specific predictors toward foundation models with
  general spatiotemporal representation capabilities. Although these models can jointly encode dynamic
  Earth fields, external forcings, and static geographic context for multistep forecasting, accurate point
  predictions or statistically calibrated intervals alone are insufficient for high-impact applications
  such as extremeweather warning, flood control, renewable-energy dispatch, and emergency resource allocation.
  What matters in practice is whether predictive uncertainty can be translated into reliable decision
  risk under specific actions, loss functions, and risk preferences. We propose a decision-oriented uncertainty
  quantification framework for Earth system spatiotemporal foundation models. The framework produces predictive
  distributions of future states and uses a decision risk adapter to map forecast samples, decision context,
  and utility functions into action-conditional risks. A utility-aware calibration module further enforces
  reliability at the downstream decision-loss level rather than only at the forecast-value level. Calibrated
  risks are then used to select warning, dispatch, inspection, or resource-allocation actions. Compared
  with the strongest baseline, the proposed method reduces decision regret by 18.7%, lowers the missed-event
  rate from 14.2% to 9.1%, and improves expected utility by 11.6%, while maintaining 90.4% predictive
  coverage and reducing decision calibration error from 0.083 to 0.047. These results suggest that decision-oriented
  uncertainty quantification can improve the robustness and operational value of Earth system foundation
  models in risk-sensitive applications.
