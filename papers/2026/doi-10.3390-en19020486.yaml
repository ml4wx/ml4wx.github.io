summary: Model Output Statistics correction of UM-LDAPS temperature, wind and radiation cuts their RMSE
  by 38–62%, reducing downstream PV forecast errors by 70–79%.
abstract: Accurate forecasting of photovoltaic (PV) power generation is essential for mitigating weather-induced
  variability and maintaining power-system stability. This study aims to improve PV power forecasting
  accuracy by enhancing the quality of numerical weather prediction (NWP) inputs rather than modifying
  forecasting model structures. Specifically, systematic errors in temperature, wind speed, and solar
  radiation data produced by the Unified Model–Local Data Assimilation and Prediction System (UM-LDAPS)
  are corrected using a Model Output Statistics (MOS) approach. A case study was conducted for a 20 kW
  rooftop PV system in Buan, South Korea, comparing forecasting performance before and after MOS application
  using a random forest-based PV forecasting model. The results show that MOS significantly improves meteorological
  input accuracy, reducing the root mean square error (RMSE) of temperature, wind speed, and solar radiation
  by 38.1–62.3%. Consequently, PV power forecasting errors were reduced by 70.0–78.7% across lead times
  of 1–6 h, 7–12 h, and 19–24 h. After MOS correction, the normalized mean absolute percentage error (nMAPE)
  remained consistently low at approximately 7–8%, indicating improved forecasting robustness across the
  evaluated lead-time ranges. In addition, an economic evaluation based on the Korean renewable energy
  forecast-settlement mechanism estimated an annual benefit of approximately 854 USD for the analyzed
  20 kW PV system. A complementary valuation using an NREL-based framework yielded an annual benefit of
  approximately 296 USD. These results demonstrate that improving meteorological data quality through
  MOS enhances PV forecasting performance and provide measurable economic value.
