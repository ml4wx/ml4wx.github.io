summary: U3DWind is a building-resolved LBM-LES urban low-altitude wind dataset for five Chinese megacities,
  with 720 simulations and five benchmark tasks for UAM planning.
abstract: 'Urban Air Mobility (UAM) requires reliable assessment of low-altitude wind hazards, because
  winds, gusts, and building-induced turbulence have been recognized as critical factors affecting vehicle
  stability, route feasibility, vertiport siting, and airspace management. While wind-tunnel experiments,
  computational fluid dynamics (CFD), multiscale downscaling, reduced-order models, and UAV planning datasets
  have advanced wind-aware analysis, public resources for data-driven, city-scale UAM planning remain
  limited in geographic coverage, scenario diversity, vertical extent, building realism, and task-oriented
  benchmarking. To address this gap, we introduce U3DWind, a building-resolved low-altitude wind-field
  dataset generated using our GPU-accelerated Lattice Boltzmann Method--Large-Eddy Simulation (LBM-LES)
  framework for rapid urban flow simulation. U3DWind covers five megacities in China: Beijing, Shanghai,
  Guangzhou, Shenzhen, and Hong Kong. It contains 720 simulations, with 16 inflow directions, three reference
  wind speeds, and three seasonal atmospheric scenarios (annual, summer, and winter) for each city. At
  a 10 m grid resolution, the dataset provides three-dimensional three-component (3D3C) velocity, turbulent
  kinetic energy (TKE), flow density, and fluid--solid masks. To support operationally relevant evaluation,
  we further define five baseline tasks: wind-field prediction, sparse-sensor wind-field reconstruction,
  site wind-exposure ranking, airworthiness wind-compliance risk scoring, and noise propagation modeling.
  As a multi-city, building-resolved 3D urban wind-field dataset, U3DWind enables systematic evaluation
  of wind-induced impacts in low-altitude traffic scenarios and provides an open benchmark for urban airspace
  management and data-driven high-fidelity urban flow simulation.'
