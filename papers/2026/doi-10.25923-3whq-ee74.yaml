summary: Fine-tuning pretrained GraphCast with an adjusted MSE loss restores spectral amplitude and Hurricane
  Ian structure compared with the standard MSE baseline.
abstract: Loss functions strongly shape the behavior of machine-learning weather models (MLWP). The commonly
  used mean squared error (MSE) in MLWP penalizes spatial displacement twice, suppressing variance and
  producing overly smooth forecasts of high-impact events. To address this issue, we utilize the Adjusted
  Mean Squared Error (AMSE) (Subich et al., 2025), which mitigates this "double penalty" by separating
  amplitude and phase contributions in spherical harmonic space. We conduct a sensitivity analysis by
  fine-tuning the pretrained GraphCast model on NOAA Global Data Assimilation System (GDAS) data, aiming
  to explore the impacts of learning rate schedules. Using Hurricane Ian (2022) as a case study, we demonstrate
  that AMSE-based fine-tuning improves spectral amplitudes and hurricane structure compared with the MSE-based
  model baseline.
