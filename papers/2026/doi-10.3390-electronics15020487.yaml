summary: A dynamic graph convolution and Transformer with KAN enhancement forecasts short-term wind power
  across 101 Chinese wind farms, cutting RMSE by about 1.16%.
abstract: Aiming at the challenges of complex spatial-temporal correlation and strong nonlinearity in
  the power prediction of large-scale wind farm clusters, this study proposes a short-term wind power
  prediction method that combines a dynamic graph structure and a Kolmogorov–Arnold Network (KAN) enhanced
  neural network. Firstly, a spectral embedding fuzzy C-means (FCM) cluster partition method combining
  geographic location and numerical weather prediction (NWP) is proposed to solve the problem of insufficient
  spatio-temporal representation ability of traditional methods. Secondly, a dynamic directed graph construction
  mechanism based on a stacked wind direction matrix and wind speed mutual information is designed to
  describe the directional correlation between stations with the evolution of meteorological conditions.
  Finally, a prediction model of dynamic graph convolution and Transformer based on KAN enhancement (DGTK-Net)
  is constructed to improve the fitting ability of complex nonlinear relationships. Based on the cluster
  data of 31 wind farms in Gansu Province of China and the cluster data of 70 wind farms in Inner Mongolia,
  a case study is carried out. The results show that the proposed model is significantly better than the
  comparison methods in terms of key evaluation indicators, and the root mean square error is reduced
  by about 1.16% on average. This method provides a prediction tool that can adapt to time and space changes
  for engineering practice, which is helpful to improve the wind power consumption capacity and operation
  economy of the power grid.
