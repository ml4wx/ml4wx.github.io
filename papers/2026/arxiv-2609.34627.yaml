summary: Evaluates Pangu-Weather, GraphCast and FengWu on predictive structure of planetary-wave and NAM
  dynamics, revealing departures hidden by standard forecast errors.
abstract: Machine-learning models for physical systems are currently evaluated primarily through errors
  between predicted and reference states and, increasingly, through tests of physical consistency. These
  metrics assess whether predictions are accurate and satisfy selected physical requirements, but provide
  limited insight into whether learned trajectories reproduce the underlying dynamics. Domain experts
  examine such relationships through physical representations that expose relevant processes, interactions,
  and responses, but these analyses are often separated from typical machine-learning evaluation. We introduce
  a practical framework for evaluating dynamical fidelity through predictive structure in physical representation
  spaces. Experts define the representations, while reference trajectories determine which relationships
  are predictive and retained as evaluation tests. We demonstrate the approach in atmospheric forecasting
  using ERA5 representations of planetary-wave activity and Northern Annular Mode evolution, and evaluate
  Pangu-Weather, GraphCast, and FengWu. The models exhibit distinct departures from reference predictive
  structure that are not reflected by conventional forecast errors. The framework thereby turns domain-expert
  representations into systematic tests of learned physical dynamics without prescribing the relationships
  in advance.
