summary: CloudCast v2 uses conditional flow matching, trained on reanalysis and adapted to satellite clouds,
  to cut 1-12 h cloud-cover MAE by 10% and beat v1 after 3-6 h.
abstract: Accurate cloud-cover forecasts are important for temperature prediction, radiation forecasting,
  and solar-power operations. Short-range forecasting methods can preserve observed cloud placement during
  the first forecast hours, but their skill decreases when cloud fields evolve through formation, dissipation
  and deformation. Longer lead times require accounting for atmospheric evolution, but operational numerical
  weather prediction (NWP) forecasts may not accurately represent the satellite-observed cloud state at
  initialization. We develop CloudCast v2, a machine-learning model for 12-hour cloud-cover forecasting
  from observation-based initial conditions. The model is first trained on the Copernicus European Regional
  Reanalysis (Ridal2024) to learn cloud-evolution dynamics, and is then adapted to satellite-derived cloud
  fields using conditional flow matching (Lipman2023), a generative method that transforms noise into
  cloud-cover forecasts conditioned on the observed initial cloud fields and NWP inputs. CloudCast v2
  reduces mean absolute error by 10% relative to its predecessor, CloudCast v1 (Partio2025), over the
  1-12 h range. It also overtakes CloudCast v1 in fractions skill score, a neighborhood-based measure
  of spatial agreement, after approximately 3-6 h, depending on the cloudiness category. These results
  show that observation-initialized machine-learning forecasts can extend beyond the usual 1-3-hour nowcasting
  range while retaining spatial detail from satellite cloud fields.
