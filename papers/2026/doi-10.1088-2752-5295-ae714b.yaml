summary: Four AI weather models forecast and attribute two European extratropical cyclones via pseudo-global-warming
  storylines, showing consistent moisture-driven climate change fingerprints across models.
abstract: 'Abstract Extratropical cyclones are among the most damaging weather systems in midlatitudes;
  however, quantifying the influence of anthropogenic climate change (ACC) on individual storms remains
  challenging due to the interplay between thermodynamic and dynamical processes. Here, we assess the
  capacity of artificial intelligence-based weather prediction (AIWP) models to both forecast and attribute
  two high-impact European extratropical cyclones with contrasting characteristics: storm Ciarán (November
  2023), which underwent explosive cyclogenesis and extreme winds, and storm Claudia (November 2025),
  characterized by an intense atmospheric river. We evaluate four state-of-the-art AIWP models and benchmark
  them against operational forecasts from the ECMWF Integrated Forecast System. All AIWP systems skillfully
  reproduce the large-scale evolution of both storms several days in advance, albeit with event-dependent
  performance. Building on this skill, we apply a forecast-based storyline attribution framework comparing
  factual forecasts initialized from ERA5 with counterfactual simulations generated with a pseudo–global
  warming perturbation derived from CMIP6 historical simulations. The attribution analysis reveals physically
  coherent ACC fingerprints across sea-level pressure, low-level winds, moisture, and precipitation. Moisture-related
  signals are robust across models for both storms, while wind and circulation responses show greater
  model dependence, reflecting the differing levels of robustness of thermodynamic and dynamic responses
  to ACC. Precipitation attribution using the ECMWF artificial intelligence forecasting system indicates
  regional ACC-induced increases consistent with near–Clausius–Clapeyron thermodynamic scaling, modulated
  by event-dependent dynamical responses that shape moisture availability and transport. These results
  demonstrate that AIWP models can support event-specific, computationally efficient ACC attribution within
  the forecast window, offering strong potential for assessing ACC influences on high-impact extratropical
  cyclones.'
