summary: An LSTM predicts snow and storm days at the Kopaonik ski resort from 30 years of station data,
  reaching 72.9% and 78.2% accuracy respectively.
abstract: Abstract This paper introduces an innovative application of long short-term memory (LSTM) networks
  to predict snow and storm days at Kopaonik, Serbia’s premier ski resort, based on three decades of meteorological
  data, provided by the Republic Hydrometeorological Service of Serbia (RHMZ). The importance of this
  research stems from the critical need for precise weather forecasting in mountainous regions, which
  directly impacts safety, operational efficiency, and risk management for ski resorts and related industries.
  The developed LSTM model achieved prediction accuracies of 72.88 % for snow days and 78.16 % for storm
  days, representing a significant improvement over conventional methods. These results not only confirm
  the efficacy of deep learning in meteorological predictions but also highlight the model’s capacity
  to identify complex patterns in historical weather data. Key findings show that integrating atmospheric
  variables such as temperature, wind speed, pressure, and snow depth into the model leads to substantial
  gains in forecast accuracy. This paper contributes to the growing body of knowledge in machine learning
  applications for weather forecasting and has practical implications for optimizing resource allocation,
  enhancing public safety, and improving infrastructure planning in ski resorts. Also, the study opens
  avenues for future research, particularly in the areas of real-time weather prediction, the inclusion
  of additional meteorological variables, and the application of this model to other climates and geographic
  regions. The findings lay the groundwork for more advanced weather prediction models, offering insights
  into how artificial intelligence can further enhance forecasting in the era of climate change.
