summary: Uses the cBottle-video foundation model to generate 1000-member end-conditioned ensembles for
  the 2021 PNW heatwave, Sandy and Ian, revealing diverse antecedent trajectories.
abstract: Scenario planning for rare, high-impact events often requires massive ensembles to stochastically
  sample relevant trajectories. Although autoregressive weather emulators can efficiently generate such
  ensembles, isolating trajectories of interest requires sifting through petabytes of data, a challenge
  that grows exponentially with lead time and rarity. In contrast, a non-autoregressive foundation model
  like Climate in a Bottle video (cBottle-video) can directly sample trajectories terminating in extremes,
  avoiding large-ensemble search. We use cBottle-video to generate 1000-member ensembles with start- and/or
  end-conditioning across three extreme events---the 2021 Pacific Northwest (PNW) heatwave, Superstorm
  Sandy, and Hurricane Ian. Antecedent 500 hPa geopotential height ($z_{500}$) spread at the free end
  of end-conditioned ensembles reaches 84--89\% of the final-state spread of start-conditioned ensembles,
  revealing substantial diversity consistent with each extreme event. For the 2021 PNW heatwave, end-conditioned
  ensemble members begin uniformly warmer than reanalysis and stay warm, replacing the observed rapid
  intensification with persistent antecedent heat. For Superstorm Sandy, the leading modes of $z_{500}$
  at the antecedent end of the end-conditioned ensemble explain 44\% of the variance in track latitude,
  and roughly 10\% of ensemble members begin as stronger hurricanes than Sandy. For Hurricane Ian, variation
  in the first landfall location among end-conditioned trajectories underscores the importance of accounting
  for intermediate hazard exposure in risk planning.
