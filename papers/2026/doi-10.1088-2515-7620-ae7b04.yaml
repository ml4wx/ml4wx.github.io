summary: Deep learning model predicts the Pacific Decadal Oscillation with correlation above 0.64 at 1–8
  year leads, outperforming current statistical and dynamical approaches beyond two years.
abstract: Abstract The Pacific decadal oscillation (PDO) is an essential decadal mode in climate variability,
  exerting profound global impacts on climates, hydroclimates, and marine ecosystems. Consequently, skillful
  prediction of the PDO is of considerable scientific and societal significance. However, current statistical
  and dynamical approaches face a challenge in predicting the PDO, particularly beyond two-year lead times.
  To address this challenge, we develop a deep learning (DL) model tailored for the PDO prediction. The
  DL model exhibits a skillful prediction, achieving a mean correlation coefficient > 0.64 at lead times
  of 1–8 years and ∼0.41 at 7–8 year leads. Moreover, our developed DL-based physical diagnosis method
  demonstrates that this improved performance stems primarily from the DL model’s capability to identify
  effective predictors and capture their synergistic interactions. Collectively, these findings provide
  a transformative approach for decadal climate prediction, extending beyond the PDO to other decadal
  modes and climatic patterns.
