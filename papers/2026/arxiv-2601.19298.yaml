summary: Evaluates ensemble spread and error structure of the generative LDCast and pysteps STEPS nowcasts
  over Belgium, finding both lack spatial error localisation.
abstract: The predictability of the generative AI-based nowcasting model LDCast (trained on another region)
  is evaluated over Belgium, together with the pysteps implementation of the nowcasting algorithm STEPS.
  STEPS and LDCast are slightly underdispersive, but the ensemble spread provides an estimation of the
  error at almost all scales. Both models adapt the properties of their ensembles to the type of event,
  either convective or stratiform. The spatial scores of the STEPS and LDCast ensembles are compared with
  those of surrogate ensembles having some key properties, revealing that both STEPS and LDCast have very
  little ability to spatially localise the ensemble mean error vector through their ensemble members.
  This suggests that the content of STEPS and LDCast ensembles is informative in terms of statistics,
  but not in terms of dynamics.
