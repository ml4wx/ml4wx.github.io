summary: Systematic review of 51 machine learning and deep learning rainfall prediction studies, finding
  LSTM most used and ensemble and hybrid methods gaining ground.
abstract: There are numerous aspects of human life in which knowing how much rain to expect might be beneficial.
  Heavy rainfall events such as flash floods and landslides, as well as droughts, can be predicted with
  effective rainfall forecasting. Because of reliable weather forecasts, the infrastructure required to
  capture rainwater and cultivate crops may be planned ahead of time. A variety of machine learning (ML)
  and deep learning (DL) algorithms enable accurate weather forecasting. This work seeks to provide a
  full overview of the numerous ML algorithms used for rainfall prediction by focusing on the technique,
  input parameters, and several performance measures. The review consists of 51 works divided into three
  sections. It is found that long short-term memory (LSTM), one of the DL algorithms, is mostly used by
  researchers for developing the model, but in recent years, ensemble learning and hybrid learning have
  also gained popularity among researchers as they give more accurate results. These methods need to be
  explored further.
