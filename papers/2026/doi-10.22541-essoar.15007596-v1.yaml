summary: GraphCast forecasts of tropospheric parameters combined with GNSS give global PWV retrieval,
  reaching 0.73 mm RMSE against radiosondes and beating GPT3 and stacked-ML baselines.
abstract: '18 Real-time water vapor monitoring is critical for meteorological applications such as weather
  19 forecasting and nowcasting. However, accurate real-time retrieval of precipitable water vapor 20
  (PWV) from Global Navigation Satellite Systems (GNSS) remains challenging, especially for 21 GNSS stations
  lacking meteorological sensors. This study introduces a global forecast-based 22 GNSS PWV retrieval
  method leveraging the artificial-intelligence (AI)-based global weather 23 forecast model named GraphCast.
  We utilize GraphCast to predict key tropospheric parameters 24 (weighted mean temperature, Tm, and zenith
  hydrostatic delay, ZHD), which are then combined 25 with GNSS observations to obtain PWV. To assess
  the accuracy of GraphCast-derived PWV, a 26 comprehensive evaluation experiment is conducted through
  comparison with two baseline 27 models: the Global Pressure and Temperature 3 (GPT3) model and stacked
  machine learning 28 (ML) model, using global radiosonde and GNSS datasets. Evaluation results demonstrate
  that 29 GraphCast-based PWV significantly outperforms the baseline models across three metrics: root
  30 mean square error (RMSE), mean absolute error (MAE), and coefficient of determination (R2). 31 Specifically,
  the RMSE of GraphCast-derived PWV is 0.73 mm when validated against 32 radiosonde datasets, a significant
  improvement of more than ~1.3 mm over the baseline models. 33 Similarly, the RMSE is 1.7 mm when validated
  against GNSS datasets, reflecting an 34 improvement of more than ~0.7 mm. In addition, GraphCast-based
  PWV also exhibits lower 35 sensitivity to latitude, altitude, and temporal variations. This new approach
  demonstrates strong 36 potential for achieving global high-precision, real-time PWV retrieval independent
  of local 37 meteorological observations. 38 39 40 Highlights: 41  A new global forecast-based PWV retrieval
  method is presented and comprehensively 42 evaluated based on the AI global weather forecast model.
  43  This PWV retrieval method has an impressive performance over two baseline models 44 through validations
  with global radiosonde and GNSS data. 45  This improved performance is beneficial and promising for
  time-critical meteorological 46 applications like weather forecasting and nowcasting 47 48'
