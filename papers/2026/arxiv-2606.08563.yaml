summary: Physics-guided dual-decoder with spectral matching and adversarial training produces 72-hour
  3D hydrometeor forecasts that beat GFS on extreme-event detection and spectral fidelity.
abstract: While global data-driven models excel at predicting continuous atmospheric variables, three-dimensional
  hydrometeor forecasting remains challenging due to the zero-inflated, long-tailed distributions of these
  variables. Standard deep learning optimization often yields overly smooth forecasts, attenuating extreme
  events and spatial textures. We propose PredHydro-Net, a physics-guided dual-decoding framework that
  mitigates this smoothing. To resolve multi-variable optimization conflicts, it employs a decoupled architecture
  where macroscopic thermodynamic and dynamic fields unidirectionally modulate hydrometeor generation.
  By integrating wavelet-based frequency decoupling, spectral amplitude matching, and adversarial training,
  the model achieves a favorable trade-off between quantitative accuracy and spatial fidelity. In a 72-h
  global evaluation, PredHydro-Net outperforms both spatiotemporal deep learning baselines (Earthformer
  and PredRNNv2) and the operational Global Forecast System (GFS) in extreme-event detection and spectral
  representation. Furthermore, it demonstrates strong climatological consistency with Global Precipitation
  Measurement (GPM) satellite retrievals. The model reasonably reproduces the three-dimensional cloud
  structures in extreme weather events, such as Hurricane Ian. Feature attribution confirms its dependence
  on physical precursors such as relative humidity and wind convergence, offering a robust, physics-informed
  approach to long-tailed atmospheric prediction.
