summary: Simple neural networks retrieve tropical cyclone 2D surface wind fields and maximum-wind radius
  from geostationary imagery, improving rapid-intensification cases.
abstract: High-resolution tropical cyclone surface wind speeds derived from synthetic aperture radar (SAR)
  observations can support storm structure and intensity modelling, but remain spatially and temporally
  sparse and unavailable near-real-time. Geostationary satellites capture cloud tops continuously in space
  and time, but do not directly resolve surface winds. Here, we present simple neural networks to predict
  2D wind fields and storm-scale intensity metrics from geostationary imagery. Through a series of ablation
  studies, we find that joint prediction of 2D fields and scalar metrics from the model latent space improves
  the retrieval of the (radius of) maximum wind, especially for rapid intensification events.
