summary: A stochastic coupled emulator, ACE2S plus Samudra, reproduces a 400-year preindustrial E3SMv3
  control with small biases and retains ENSO and sea-ice variability.
abstract: We present a stochastic coupled emulator of E3SM version 3, built on the SamudrACE framework,
  which couples an atmosphere emulator (ACE2) with a full-depth ocean emulator (Samudra). We replace the
  deterministic atmosphere emulator with its stochastic counterpart, ACE2S, and fine-tune the coupled
  system with a probabilistic objective, so that the atmosphere acts as a source of internal variability
  for the ocean. Trained on 105 years of a pre-industrial control simulation and evaluated on an independent
  400 years, the emulator reproduces E3SMv3's mean climate state with biases much smaller than existing
  model-to-observation differences. Relative to a deterministic baseline, stochastic training maintains
  internal variability across timescales, most notably in the ENSO power spectrum, eddy-rich SST anomalies,
  and sea ice variability in the marginal ice zone. The emulator captures daily precipitation accurately
  up to the 99.99th percentile, but underestimates the rarest tropical extremes. These results show that
  stochastic coupled emulators can reproduce long-timescale variability with high fidelity, while extrapolation
  to unseen extremes remains a key challenge.
