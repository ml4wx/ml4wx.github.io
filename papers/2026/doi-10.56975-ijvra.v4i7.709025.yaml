summary: Compares linear, Lasso and neural regression for wind speed from basic meteorological inputs
  and wraps the best model in a web interface; the work is a basic application with no novel method.
abstract: Wind speed prediction is essential for renewable energy management, weather forecasting, and
  efficient wind farm operations. This paper presents a Smart Wind Speed Prediction System that utilizes
  machine learning and deep learning techniques to estimate wind speed using meteorological parameters,
  including temperature, humidity, atmospheric pressure, and wind direction. The proposed system employs
  Linear Regression, Lasso Regression, and Artificial Neural Network models to analyze historical weather
  data and generate accurate predictions. Data preprocessing techniques such as data cleaning, feature
  selection, normalization, and missing value handling are applied to improve model performance and reliability.
  The models are evaluated using Mean Absolute Error, Root Mean Square Error, and the coefficient of determination
  to assess prediction accuracy. An interactive web-based interface enables users to input weather parameters
  and obtain real-time wind speed predictions. The system also incorporates live weather visualization
  to enhance user understanding and practical usability. Experimental results demonstrate that the proposed
  framework provides accurate and reliable wind speed forecasting, making it suitable for renewable energy
  planning, weather analysis, and intelligent decision-making. The proposed approach offers a scalable
  and efficient solution for improving forecasting accuracy and supporting sustainable energy applications.
