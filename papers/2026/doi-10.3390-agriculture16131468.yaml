summary: Graph neural network-regularized ERA5 flash drought-heatwave masks show vegetation NDVI declines
  peaking about one week after events in Northeast China.
abstract: 'Compound flash drought–heatwave extremes (FDHW) expose vegetation to rapid water and heat stress,
  but regional assessments often conflate event detection with vegetation response and rarely resolve
  delayed canopy trajectories. We quantified FDHW across China’s Northeast Black Soil Region during the
  1995–2024 growing seasons using ERA5-Land soil-moisture and temperature thresholds, applied a spatiotemporal
  graph neural network to regularize threshold-derived event masks, and reserved AVHRR NDVI for independent
  post-event impact assessment. Flash drought and FDHW frequencies exhibited strong interannual variability
  rather than a significant monotonic trend. FDHW occurrence increased from 3.8 to 4.8 d per growing season
  between 1995–2005 and 2016–2024, but the Theil–Sen trend was near zero (0.05 d per decade). Land–atmosphere
  composites indicate progressive soil-moisture depletion before FDHW occurrence and a transition from
  latent to sensible heat release roughly three days before maximum temperature anomalies. NDVI composites
  revealed a delayed greenness response: anomalies were negative through the first two post-event weeks,
  reached their minimum approximately one week after the reference FDHW grid-day, and then partially recovered
  during days 16–30. Mean NDVI suppression was modest (short-term −0.009; long-term −0.006), but persistent
  negative anomalies remained in 12.1% of southern cropland-dominant trajectories and 10.7% of northern
  forest–crop ecotone trajectories. These results show that FDHW impacts in the NBSR are expressed less
  as a steady rise in event frequency than as delayed and spatially heterogeneous vegetation stress, highlighting
  the need for post-event monitoring windows and cross-sensor validation to support agricultural risk
  assessment and adaptation planning.'
