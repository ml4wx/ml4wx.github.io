summary: 'Shows AI weather models reproduce butterfly-effect sensitivity: tiny perturbations shift a typhoon
  track by 1006 km on Day 7, seen in about 12% of cyclones.'
abstract: A paradox recently emerged in artificial intelligence (AI) weather prediction research. While
  some claim AI weather models cannot simulate atmospheric butterfly effect, this conflicts with AI models'
  limited predictability and advances in AI ensemble forecasting. This study demonstrates via counterexamples
  that the butterfly effect does exist in AI weather predictions. For Super Typhoon Khanun, AI predictions
  are constrained by a double-attractor system. Minor initial perturbations confined to two regions trigger
  state transitions between two local attractors, causing a 1006-km difference in the predicted storm
  position on Day 7. This behavior is consistent with numerical weather prediction models and observed
  in ~12% of tropical cyclones in the past 5 years. These findings verify AI's ability to capture atmospheric
  chaos and provide the physical basis for AI ensemble forecasting.
