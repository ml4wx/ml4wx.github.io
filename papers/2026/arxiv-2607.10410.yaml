summary: Two-stage CNN-LSTM with Gaussian copula adds calibrated joint prediction intervals to monthly
  precipitation and temperature forecasts for 50 cities without losing point accuracy.
abstract: Reliable forecasting of several interrelated environmental variables - such as regional precipitation
  and temperature, or other correlated geophysical fields - across many locations calls for accurate predictions
  accompanied by trustworthy statements of their uncertainty. Modern deep-learning models forecast such
  variables accurately but usually report no uncertainty, and forcing them to output uncertainty through
  maximum likelihood tends to degrade their accuracy, especially when the variables are strongly correlated.
  Motivated by this tension, we develop TSCoNet, a two-stage convolutional-recurrent model coupled with
  a Gaussian copula that jointly forecasts multiple variables over space and time while quantifying predictive
  uncertainty. The method first learns accurate mean forecasts and then, holding the mean fixed, refines
  a shared representation to estimate the predictive variance, yielding calibrated prediction intervals
  after a standard recalibration, so that uncertainty is added without sacrificing point accuracy. We
  study the approach on simulated non-stationary spatial fields on the sphere and on a real dataset of
  monthly precipitation and temperature for fifty cities over 2000-2020. The model matches the accuracy
  of a strong deterministic forecaster while supplying calibrated prediction intervals that the deterministic
  model cannot, giving a single tool that provides both accurate point forecasts and reliable uncertainty
  for multivariate spatio-temporal data.
