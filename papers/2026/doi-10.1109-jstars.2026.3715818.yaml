summary: Attention-based 3D CNN fuses Himawari-8 bands to estimate hourly 2 km rainfall over Taiwan, raising
  correlation from 0.51 to 0.63.
abstract: Estimating rainfall from geostationary satellite observations is essential for monitoring extreme
  precipitation events across land and ocean surfaces, particularly in regions with complex topography.
  This article describes the development and evaluation of the artificial intelligence quantitative precipitation
  estimation (AIQPE) model, a deep learning framework based on a three-dimensional convolutional encoder–decoder
  architecture. AIQPE is designed to fuse multispectral cloud features from the Himawari-8 geostationary
  satellite to produce hourly precipitation estimates at 2 km spatial resolution. The main innovation
  of AIQPE lies in the incorporation of advanced attention mechanisms, including a mixed pooling module
  to capture both short- and long-range spatio-temporal dependencies, a selective kernel concatenation
  module for adaptive multimodal feature fusion, and a ghost bottleneck architecture for improved computational
  efficiency. In addition, a custom loss function combining mean squared error and correlation is adopted
  to preserve rainfall structure during training. AIQPE was trained and evaluated using diverse warm-season
  precipitation events over Taiwan. Experimental results present substantial performance improvements
  over the baseline model, achieving a 22% increase in the correlation coefficient (from 0.51 to 0.63)
  and a 70% reduction in root-mean-square error MSE) (from 20.18 to 6.08). To further assess operational
  applicability, supplementary interproduct evaluation against IMERG and GSMaP was incorporated. The results
  confirm that the proposed framework provides substantial advantages for high-resolution operational
  rainfall monitoring under challenging meteorological and topographic conditions.
