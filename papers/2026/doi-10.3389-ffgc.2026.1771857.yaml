summary: Random Forest on 19 bioclimatic variables projects natural wildfire susceptibility in Turkish
  Mediterranean forests rising from 56.4% in 2025 to 64.0% by 2070.
abstract: Introduction Mediterranean forest ecosystems are highly susceptible to natural wildfires under
  climate change, driven by rising temperatures, reduced precipitation, and pro¬longed dry periods. This
  study aimed to develop a climate-based natural wildfire susceptibility model using the Random Forest
  (RF) machine learning algorithm for the Emet Forest Management Directorate in the Mediterranean climate
  zone of Türkiye. This study considers only natural wildfires and excludes human-induced fire events.
  Methods All fire occurrence data used in the modeling process consist solely of recorded natural wildfire
  ignitions. The model incorporated 19 bioclimatic variables with historical wildfire occurrence data,
  using 258 recorded natural fire locations from 2015 to 2025 as reference points. Model performance was
  evaluated using Receiver Operating Characteristic (ROC) analysis. Results and discussion An Area Under
  the Curve (AUC) value of 0.711, which indicates moderate but acceptable predictive performance and is
  consistent with values reported in similar climate-driven susceptibility studies. The model results
  showed that the most influential drivers of fire susceptibility were temperature seasonality (BIO4),
  dry season precipitation (BIO17), and the minimum temperature of the coldest month (BIO6). According
  to future projections based on the Representative Concentration Pathways (RCP) 2.6 scenario using the
  Beijing Climate Center-Climate System Model Version 2-Medium Resolution (BCC-CSM2-MR) climate model
  for 2050 and 2070, the proportion of areas with high and extremely high fire susceptibility is projected
  to increase from 56.4% in 2025 to 64.0% in 2070, while low-and moderate-suscep¬tibility zones decline.
  This study provides one of the first climate-only, machine learning-based evaluations of present and
  future natural wildfire susceptibility in Mediterranean forests of Türkiye. These results revealed the
  escalating threat of wildfires in Mediterranean forests under climate change.
