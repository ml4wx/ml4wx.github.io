summary: Encyclopedia entry describing federated learning for weather modeling on distributed ground-station,
  satellite and IoT sensor data while preserving privacy.
abstract: Federated weather modeling on sensor data is a distributed system underpinned by federated learning,
  enabling multiple sensor data sources, including ground weather stations, satellites and IoT devices,
  to collaboratively train deep learning models without sharing raw data. This method safeguards data
  privacy and security while leverages diverse, geographically distributed datasets to improve the accuracy
  and robustness of global/regional weather modeling tasks such as forecasting and anomaly detection.
