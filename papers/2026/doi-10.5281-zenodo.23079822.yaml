summary: IoT field sensors plus online forecasts feed a machine learning rainfall-risk classifier that
  sends automated farm alerts; no accuracy results are reported.
abstract: Abstract Agriculture is highly dependent on weather conditions, and sudden heavy rainfall can
  cause crop damage, waterlogging, soil erosion, and significant financial losses for farmers. Timely
  weather alerts can help farmers take preventive actions and reduce potential losses. This work presents
  an AI-Driven Smart Farming and Weather Prediction System that combines Internet of Things (IoT) technology,
  online weather forecast data, and machine learning techniques for intelligent rainfall prediction and
  early warning generation. The system collects environmental parameters from field sensors and combines
  them with online weather forecast information to analyze changing weather conditions. A machine learning
  model is used to predict rainfall risk levels based on the collected data. According to the prediction
  results, automated Telegram alerts are generated and sent to users for timely precautionary measures.
  The proposed system offers a low-cost, scalable, and intelligent approach for smart agriculture applications
  and demonstrates the potential of AI-enabled weather monitoring systems in supporting better farming
  decisions.
