summary: A residual U-Net retrieves all-sky temperature and humidity profiles from MTG FCI imagery without
  NWP inputs, with biases below 0.4 K against radiosondes.
abstract: The Meteosat Third Generation (MTG) Flexible Combined Imager (FCI) offers new opportunities
  for tropospheric temperature and humidity profiling, at higher spatio-temporal resolutions and expanded
  spectral coverage relative to its predecessor. Vertically resolved retrievals from broadband imagers
  are inherently challenging, and operational retrieval algorithms typically rely on numerical weather
  prediction (NWP) background fields to compensate for limited infrared spectral resolution, reducing
  the retrievals' independence. We develop a spatially aware deep learning framework to retrieve all-sky
  tropospheric temperature and humidity profiles from FCI, without forecast profiles as input. A Residual
  U-Net that exploits spatial context across all 16 FCI channels was trained on 14 months of collocated
  FCI observations and CERRA reanalysis targets over Europe. Validated against independent radiosondes,
  retrieved temperatures show biases below 0.4 K and standard deviations of 1.5-1.9 K. Retrieved relative
  humidity standard deviations range from 12-20 %, compared to 9-19 % for CERRA. Performance degrades
  modestly under clouds, with standard deviation increases below 0.4 K and 3 % RH beneath cloud tops despite
  limited direct radiative information. Ablation experiments show that spatial context improves retrievals,
  with the largest gains below cloud tops. Feature sensitivity analysis indicates broad consistency with
  FCI bands' established radiative transfer characteristics. Visible and near-infrared channels contribute
  despite not being commonly used in physics-based profile inversions. These results demonstrate that
  spatially aware deep learning models can extract statistically reliable tropospheric profiles from geostationary
  imager observations, independent of NWP forecast fields, enabling more rapid autonomous monitoring of
  the atmosphere.
