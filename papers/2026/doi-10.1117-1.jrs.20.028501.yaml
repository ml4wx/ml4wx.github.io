summary: Deep-learning fusion of FY-3D microwave brightness temperatures with downscaling yields all-weather
  1 km land surface temperature, validated against CLDAS, MODIS and in situ data.
abstract: 'Overcoming cloud-induced gaps in optical thermal infrared observations remains a critical challenge
  for continuous land surface temperature (LST) monitoring. While microwave sensors provide cloud-penetrating
  capability, their coarse spatial resolution (⩾25 km) severely limits high-precision applications. This
  study presents a multistage framework that synergizes microwave observations from China’s FY-3D microwave
  radiation imager (MWRI) sensor with advanced spatiotemporal fusion algorithms to achieve a 1 km all-weather
  LST product. Our methodology features three innovations: (1) A microwave temperature convolutional LST
  model that establishes nonlinear relationships between MWRI brightness temperatures and LST at 6.25
  km resolution; (2) An orbital gap-filling algorithm using temporal-spatial similarity matrices to reconstruct
  daily seamless LST composites over China; (3) A data mining sharpener downscaling scheme incorporating
  NDVI to enhance spatial resolution to 1 km. Based on the proposed methodology, multiple representative
  dates were selected across China for validation experiments. The resulting LST products were evaluated
  using CLDAS data, MODIS LST products, and in situ ground observations. Results demonstrate that the
  6.25 km LST data derived from the proposed method exhibit high consistency with CLDAS data, achieving
  correlation coefficients of 93.7% (day) and 97.0% (night), root mean square errors (RMSE) of 3.16 K
  (day) and 2.11 K (night), and mean absolute errors (MAE) of 2.42 K (day) and 1.55 K (night). Compared
  with ground-based observations, the RMSE of the all-weather 1 km LST is 4.48 K (day) and 2.24 K (night),
  and the MAE of the all-weather 1 km LST is 3.79 K (day) and 1.80 K (night). Note that the current validation
  is based on in situ observations from the homogeneous grassland underlying surface in Xilinhot, where
  the uniform surface condition ensures the representativeness of point measurements for satellite pixel
  scales. Performance of the product over heterogeneous underlying surfaces such as urban areas, dense
  forests, and complex terrains requires further verification with multisource data. This study provides
  a novel methodological foundation for high-precision all-weather LST monitoring, with significant implications
  for grassland ecological assessment, drought monitoring, and future extension to diverse underlying
  surfaces.'
