summary: GRU-TSFE hybrid forecasts ENSO indices up to 12 months ahead, keeping Niño4 correlation near
  0.80 out to 10-month leads.
abstract: ENSO drives global climate variability and extremes, motivating skillful mid-range forecasts
  of ENSO indices. Here, we propose a three-branch deep-learning framework, the Seasonal Gated Recurrent
  Unit with Time-Series Feature Extraction (GRU-TSFE), which integrates convolutional feature extraction
  with recurrent temporal modeling for continuous monthly-lead prediction. Twelve-month hindcasts of Niño3,
  Niño4, NCT, and NWP indices (March 1985–February 2025) show comparable skill at 1–4-month leads, but
  substantially higher accuracy for Niño4 and NWP at 5–12-month leads. The GRU-TSFE model performs best
  for Niño4, maintaining correlation coefficients near 0.80 up to 10-month lead times. Comparison of prediction
  results from two consecutive 20-year periods reveals an interdecadal migration of the spring predictability
  barrier, with a delayed onset for Niño3 and an earlier onset for NCT. These shifts may be associated
  with PDO-related background variability, tropical Pacific mean-state changes, and evolving ENSO modal
  structure; these mechanisms are treated here as plausible contributors and testable hypotheses rather
  than established causal drivers.
