summary: ObsCast generates analyses and forecasts over the US and Europe from observations only, without
  NWP data, and outperforms operational NWP for near-surface variables through 18 h.
abstract: Accurate and timely weather forecasts are critical for high-impact decisions in modern society.
  Machine-learning-based weather prediction is emerging as an alternative for producing initial conditions,
  forecasts, and even both in end-to-end systems. These methods deliver predictions faster and often with
  higher skill than traditional numerical weather prediction (NWP). However, even end-to-end models typically
  rely on NWP-generated reanalyses for supervision, thereby inheriting the biases and resolution limitations
  of those NWPs, and limiting adaptation to settings where suitable reanalysis products are unavailable,
  infrequently updated, or expensive to produce. Here we introduce ObsCast, a regional system that generates
  both analysis and predictions, without using any NWP-derived data in either training or inference, while
  still achieving state-of-the-art performance in short-term high-resolution regional modeling. Over the
  contiguous United States and Europe, ObsCast outperforms operational NWP for near-surface variables
  through 18 h and produces skillful precipitation forecasts. It provides a simpler and more adaptable
  route to build and refine regional forecasting services directly from local observations, without the
  need to develop complex and costly traditional forecasting pipelines.
