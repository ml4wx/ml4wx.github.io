summary: Updated Attention ResUNet postprocessor for GRAF hourly precipitation uses one seasonal FiLM-conditioned
  model, extends lead time to 72 h, and improves Brier skill score.
abstract: This note is a technical companion to a previously published preprint describing an Attention
  Residual U-Net that postprocesses deterministic forecasts from The Weather Company's Global and Regional
  Atmospheric Forecast (GRAF) model into probabilistic hourly precipitation forecasts. It documents what
  has changed in that method since publication. Feature-wise Linear Modulation conditioning on calendar
  season and forecast lead time is used to produce a single trained model for each season, replacing 192
  separately trained per-month, per-lead checkpoints. Lead time is extended from 48 to 72 h. Two new input
  channels are used, per-pixel local solar hour and a static, monthly-varying precipitation climatology.
  During verification, the climatological reference against which the Brier Skill Score is computed now
  has an added diurnal dimension, on top of the monthly resolution it already had. Brier Skill Score and
  reliability are compared between the new vs. the previous training. Forecasts generated with the new
  training show a modest, consistent improvement of the current training over the original.
