summary: Shows probabilistic AI weather models beat the ECMWF IFS ensemble on global land heat extremes,
  including record-breaking events, once verification is probabilistic.
abstract: AI weather prediction (AIWP) models have emerged as a key complement to physics-based numerical
  weather prediction (NWP) models, and now often outperform them on aggregate skill. Yet, several studies
  report that physics-based models still forecast extreme events better, in particular record-breaking
  extremes, based on the evaluation of deterministic forecasts. Here we evaluate heat extreme forecasts
  from probabilistic AIWP models over global land and show that they clearly outperform the ECMWF IFS
  ensemble, both raw and post-processed, including for record-breaking events, in all regions and at all
  lead times considered. AIWP models better forecast the occurrence and intensity of extremes, are better
  calibrated in the tail and miss fewer records. Station observations confirm these results. We argue
  that many reported AIWP limitations stem from unsuitable verification choices, specifically comparing
  deterministic forecasts that target different quantities. Instead, a fair evaluation of extremes necessitates
  probabilistic verification.
