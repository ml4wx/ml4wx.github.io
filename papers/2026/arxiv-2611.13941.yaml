summary: PARDIG learns global 0.1°, 15-minute precipitation from geostationary imagery and sparse spaceborne
  radar, beating IMERG, MSWEP, ERA5 and HRES, with a 1999-present historical variant.
abstract: 'Estimating precipitation at the global scale is vital for Earth system science and disaster
  response, yet observational coverage and measurement precision remain constrained. Existing solutions
  provide options that trade off desirable traits such as skill, latency, geographical coverage, temporal
  coverage, and spatial and temporal resolution. We present PARDIG, an artificial intelligence framework
  based on a spherical graph-mesh transformer architecture that produces near-real-time global precipitation
  estimates. PARDIG is trained on dense multi-modal inputs, including atmospheric state analyses and multi-spectral
  geostationary satellite imagery, to predict sparse, high-precision precipitation measurements from spaceborne
  radar. At inference, the trained model is applied densely across the globe at $0.1^\circ$ spatial and
  15-minute temporal resolution, producing complete near-real-time precipitation fields from 2016 to the
  present, alongside a historical variant extending the record back to 1999. Evaluation against three
  independent radar networks (over the US, Europe, and Japan) and against over 36,000 surface stations
  worldwide shows that PARDIG consistently outperforms IMERG V07 (Final and Early), MSWEP V3, ERA5, and
  HRES across precipitation thresholds and regions, with the largest improvements at extreme intensities.
  Case studies of extreme precipitation events demonstrate that PARDIG successfully captures their spatial
  structure and timing. The improvements also extend to forecasting: WeatherNext 3, a global weather model,
  produces more skillful precipitation forecasts when trained to predict PARDIG. Both the historical and
  near-real-time PARDIG datasets are openly available under a CC BY 4.0 license.'
