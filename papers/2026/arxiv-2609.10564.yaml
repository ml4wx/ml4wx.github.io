summary: Station evaluation in Northern Norway finds ECMWF HRES slightly beats FourCastNet3 and GraphCast
  on wind speed (RMSE 2.89 vs 2.96 and 2.94 m/s).
abstract: Recent machine learning weather prediction (MLWP) models have demonstrated remarkable forecasting
  skill on global reanalysis-based benchmarks. However, their performance remains unclear in challenging
  environments such as Northern Norway, where narrow fjords and rapidly changing weather result in highly
  variable local wind conditions. In this case study, we evaluate FourCastNet3 (FCN3), GraphCast, and
  ECMWF High Resolution Forecast (HRES) for wind speed forecasting using multi-year station observations
  from Northern Norway, focusing on their relative performance, generalization beyond the training period,
  and performance under high-wind conditions. Our results show that HRES slightly outperforms FCN3 and
  GraphCast, with an overall RMSE of 2.89 $\mathrm{m\,s^{-1}}$, compared to 2.96 $\mathrm{m\,s^{-1}}$
  for FCN3 and 2.94 $\mathrm{m\,s^{-1}}$ for GraphCast. Notably, the MLWP models maintain comparable performance
  beyond their respective training periods, with no clear evidence of noticeable degradation. FCN3 performs
  best under high-wind conditions, although all models substantially underestimate strong winds. Our findings
  suggest that MLWP has become competitive with NWP for local wind, but further refinements are still
  needed to capture complex terrain better.
