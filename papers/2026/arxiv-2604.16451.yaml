summary: Releases SynopticBench, 1.37 million NWS forecast discussions paired with weather maps, plus
  a SPACE metric showing standard metrics poorly judge VLM-generated synoptic text.
abstract: Recent advances in visual-language models (VLMs) have led to significant improvements in a plethora
  of complex multimodal tasks like image captioning, report generation, and visual perception. However,
  generating text from meteorological data is highly challenging because the atmosphere is a chaotic system
  that is rapidly changing at various spatial and temporal scales. Given the complexity of atmospheric
  phenomena, it is critical to verifiably quantify the effectiveness of existing VLMs on weather forecasting
  data. In this work, we present SynopticBench, a high-quality dataset consisting of 1,367,041 text samples
  of Area Forecast Discussions created by the National Weather Service over the continental United States
  paired to images of 500mb geopotential height, 2 meter temperature, and 850mb wind velocity in weather
  forecasts. We also present Synoptic Phenomena Alignment and Coverage Evaluation (SPACE), a novel evaluation
  framework that can be used to effectively estimate the quality of text descriptions of synoptic weather
  phenomena. Extensive experiments on generating forecast discussions using state-of-the-art VLMs show
  the sensitivity of existing evaluation metrics in this domain and enable further exploration into synoptic
  weather and climate text generation.
