summary: A stacking-ensemble ML and quantile-mapping framework downscales CMIP6 to 5 km for Yangtze River
  Delta compound heatwaves, reducing RMSE by 18% and projecting about four events per year by 2050.
abstract: Urbanization intensifies compound heatwaves (CoHot) involving concurrent hot days and nights,
  yet coarse‐resolution climate projections cannot resolve urban‐scale processes. Dynamical downscaling
  can bridge this gap but requires substantial computing for long‐term projections. Here we introduce
  a novel and efficient hybrid framework combining daily‐scale stacking ensemble machine learning with
  monthly‐scale quantile mapping to downscale CMIP6 projections to urban resolution. Applied to China's
  Yangtze River Delta (YRD), a highly developed urban area, this framework improves simulation of CoHot
  frequency, duration, and intensity, increasing spatial correlation from −0.26–0.50 to 0.29–0.77 and
  reducing RMSE by 18%. High‐resolution (5‐km) projections reveal cities as evolving CoHot hotspots, where
  urban expansion drives shifting spatial patterns. By 2050, city centers could experience about four
  CoHot events and over 20 CoHot days annually, with total duration twice that in surrounding rural areas.
  This scalable, efficient tool aids urban heat risk assessment with broad applicability to rapidly urbanizing
  regions worldwide.
