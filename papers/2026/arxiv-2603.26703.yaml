summary: Compares GraphCast background ensemble covariances with GEFS for Hurricane Lee, finding weaker
  spread and different secondary-circulation correlations but broadly consistent covariance structure.
abstract: Short-term background ensemble covariances (BEC) are crucial for ensemble-based data assimilation
  (DA). However, limited studies so far have examined the fidelity of the cost-effective data-driven model
  in producing the short-term BEC for hurricane data assimilation. In this study, we evaluate the background
  ensemble spread and correlations from GraphCast against those of GEFS for Hurricane Lee (2023) during
  both its intensification and non-intensification phases. Specifically, the BEC in the hurricane vortex,
  the hurricane environment, and the vortex-environment interactions are examined. Within the hurricane
  vortex, the background ensemble of GraphCast is less dispersive than GEFS. The two models agree well
  on the background ensemble correlations that are tied to the primary circulation but show a larger correlation
  difference associated with the secondary circulation, indicating the two models represent unbalanced
  and diabatic processes differently. In the hurricane environment, binned univariable correlations show
  linear relationships between the two models, with a weaker horizontal geopotential height correlation
  in GraphCast. GraphCast also shows a reduced spread and a flatter empirical orthogonal function spectrum
  of the 500 hPa geopotential height background ensemble, with more perturbation growth distributed to
  smaller-scale features such as shortwaves. For the vortex-environment interaction, the two models produce
  close background ensemble correlation patterns for Lee's track but differ more for intensity. Overall,
  GraphCast can produce broadly consistent short-term BEC for Hurricane Lee compared to those of GEFS.
  However, systematic difference exists in certain variables, scales, and processes, suggesting the need
  to further investigate its fidelity in a cycled hurricane DA context.
