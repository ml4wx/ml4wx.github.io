summary: Modified CNN (ARcnn) post-processes GFS integrated vapor transport over the Himalayas, cutting
  RMSE and detecting atmospheric rivers GFS missed at 24 h and 7 days.
abstract: Extreme precipitation over the Himalayas is often linked to Atmospheric Rivers (ARs) interacting
  with its unique and complex topography. The topographic complexity and sparse observational data constitute
  a challenging problem for numerical weather prediction models. We find that the widely used Global Forecast
  System (GFS) exhibits systematic errors for high magnitude Integrated Vapor Transport (IVT), and its
  predicted AR structure and direction exhibits significant mismatches with observations. Our work proposes
  a modified convolutional neural network model, based on a previously-developed ARcnn, for IVT over South
  Asian including the Himalayas. ARcnn significantly improves the error metrics, root mean square error
  (RMSE), bias in high-IVT, and directional mean angular error (MAE), for both 24-hour lead and 7-day
  lead forecasts over the Himalayan region. The results in this study indicate the improved IVT forecast
  across the study entire area and more specifically over the Himalayas. Further, the ARcnn model was
  able to correct IVT that made it possible to detect the ARs missed in GFS forecasts for both lead times.
  Thus, these results provide compelling evidence of ARcnn’s powerful postprocessing capability and its
  potential for using in early prediction tools for IVT and AR.
