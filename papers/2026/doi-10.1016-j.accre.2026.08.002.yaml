summary: Machine learning with CMIP6 projections shows China's ski-resort suitable area falling 19.9%
  by 2051–2070 under SSP585.
abstract: Climate change poses substantial risks to ski tourism globally, making it increasingly important
  to identify where ski resorts can remain suitable. Across China, however, suitability has not been comprehensively
  quantified at the national scale. Here, we constructed a comprehensive indicator framework encompassing
  natural and socioeconomic dimensions and integrated machine learning with multi-model climate projections
  to assess ski resort suitability across China under current and future warming scenarios. Currently,
  the total suitable area (Suitability Index ≥ 0.3) is approximately 1.98 × 10 6 km 2 , concentrated in
  Northeast and North China, with winter temperature and population identified as the dominant contributing
  factors. Under SSP126 and SSP245, the suitable area increases slightly in 2021–2050, then decreases
  by 9.36% and 9.24%, respectively, in 2051–2070. Under SSP585, it remains relatively stable in 2021–2050
  but decreases sharply by 19.90% in 2051–2070, with Southern China exhibiting the largest decline (55.71%),
  followed by the Northeast (21.23%), North (18.68%), and Northwest (10.43%). The suitability centroid
  shifts northwestward from North China toward higher elevations and latitudes. Adaptation requires region-specific
  strategies. Northeast and Northwest should prioritize expanding the scale and capacity of high-grade
  ski resorts and improving their service quality, while North China requires relocation to higher elevations,
  advanced snowmaking technology effective above −2 °C, and optimization of resource utilization. Southern
  regions should transition to indoor ski tourism supplemented by outdoor activities. This framework offers
  a transferable approach for assessing the impacts of warming on climate-sensitive industries.
