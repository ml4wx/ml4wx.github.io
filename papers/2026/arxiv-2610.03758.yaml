summary: GraphCast and AIFS beat GFS and GEFS in spatial skill for atmospheric-river precipitation to
  Day 10, but still misstate heavy-rain magnitudes.
abstract: Atmospheric rivers (ARs) produce many of the world's most extreme precipitation events and hydrometeorological
  hazards. Although artificial intelligence weather prediction (AIWP) models have demonstrated skill comparable
  to or exceeding numerical weather prediction (NWP) systems for large-scale atmospheric variables, their
  ability to forecast AR-related precipitation remains insufficiently characterized globally. Here, we
  evaluate 24-hour precipitation forecasts from the Global Forecast System (GFS), Global Ensemble Forecast
  System (GEFS), GraphCast, and Artificial Intelligence Forecasting System (AIFS) from Day 1 through Day
  10 globally and across North America, Europe, and Australia and New Zealand. Using the Extreme Weather
  Bench framework, forecasts are evaluated against Integrated Multi-satellitE Retrievals for GPM (IMERG)
  observations using measures of precipitation magnitude, spatial structure, and localization. GraphCast
  and AIFS exhibit greater spatial skill than GFS and GEFS, particularly for heavy precipitation and at
  longer lead times, and better preserve the spatial organization of AR-related precipitation through
  Day 10. However, this improved spatial skill does not translate into accurate precipitation magnitudes.
  AIWP models tend to overpredict moderate-to-heavy accumulations while underpredicting the heaviest precipitation
  at longer lead times, whereas NWP systems develop pronounced dry biases. These results reveal distinct
  strengths and limitations of AIWP for high-impact precipitation forecasting and provide a reproducible
  benchmark.
