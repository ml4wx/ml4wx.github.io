summary: Spectral analysis of four probabilistic ML weather models finds that only NeuralGCM reproduces
  upscale kinetic energy transfer, while others misplace energy or miss the butterfly-effect spread growth.
abstract: 'This study analyses kinetic energy (KE) spectra, difference kinetic energy (DKE) spectra, and
  signatures of KE transfer across spatial scales in four state-of-the-art probabilistic machine learning
  weather prediction (MLWP) models: NeuralGCM-ENS, FourCastNet 3, AIFS-ENS, and GenCast. Results are compared
  with those from the physics-based numerical weather prediction model IFS-ENS. While NeuralGCM-ENS successfully
  reproduces the expected upscale transfer of KE, noise injection at its encoder stage underestimates
  mesoscale KE. Conversely, AIFS-ENS, GenCast, and FourCastNet 3 produce realistic KE spectral magnitudes
  but do not capture the expected upscale transfer of KE. In particular, AIFS-ENS and GenCast, which employ
  spatially uncorrelated stochastic perturbations, exhibit enhanced accumulation of KE at high wavenumbers.
  All examined models exhibit upscale error growth, reflected by the progressive shift of the DKE spectral
  peak toward larger wavelengths over time. However, the MLWP models struggle to reproduce the rapid initial
  growth of ensemble spread at small spatial scales associated with the butterfly effect. The results
  show that MLWP models can misrepresent the known scale transfer of kinetic energy despite producing
  skilful weather forecasts.'
