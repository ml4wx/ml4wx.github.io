summary: OpFML, a TOML-configured pipeline that automates data ingestion, contingency handling, preprocessing
  and inference for operational ML forecasts, demonstrated on daily fire activity in southern Italy.
abstract: 'Machine learning models for climate and Earth science are becoming increasingly capable, yet
  model deployment into operational use remains a largely unaddressed challenge: general-purpose model-serving
  tools, such as MLflow and KServe, assume input data availability at the inference node, while data acquisition,
  failure handling, and preprocessing are trusted to a separate workflow. We present OpFML: Operational
  Forecasting with Machine Learning - a configurable pipeline integrating the four steps of operational
  inference into a single TOML-configured workflow: data consumption, contingency handling, preprocessing,
  and model inference. By consolidating these steps, OpFML removes the significant boilerplate code required
  for each new deployment. We demonstrate the pipeline on the operational forecasting of daily fire activity
  over southern Italy.'
