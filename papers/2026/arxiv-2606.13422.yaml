summary: Quantum statistical priors and Bell measurements to probe which invariant structures aid prediction,
  tested on turbulence and ERA5 planetary-wave forecasting.
abstract: Long-horizon prediction of a chaotic system is governed by fidelity to its invariant measure,
  and which parts of that measure a learned predictor needs is a physical question not known in advance.
  We establish a quantum statistical memory advantage for interrogating it. A quantum statistical prior
  (Q-Prior), trained once on classical data, stores an efficiently preparable $k$-point marginal in polynomially
  many circuit parameters against exponentially many for explicit tabulation. Collective Bell measurements
  on two copies then estimate any post hoc Pauli-expectation magnitude at a copy cost independent of register
  size, with a worst-case exponential separation from single-copy protocols. A single Bell dataset supports
  an entire family of candidate observables at a cost growing only logarithmically in the family size,
  so an exponentially large candidate space stays open for later analysis. We implement the protocol on
  IQM superconducting processors with two-copy registers of up to 54 physical-qubit chips. We apply this
  to turbulent channel flow and ERA5 forecasting, resolving invariant structure by statistical sector
  and order. Turbulent phase correlations persist through eighth order, while most predictive gains arise
  from low-order constraints; in ERA5, planetary-wave phase coherence complements covariance regularisation,
  identifying distinct low-order sectors with predictive value. Quantum statistical memory is therefore
  both a near-term computational resource and an instrument for identifying which invariant structures
  matter for prediction.
