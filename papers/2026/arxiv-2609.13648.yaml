summary: Retrieval-augmented LLM platform for solar energy that adds XGBoost daily forecasts of irradiance,
  temperature and wind from NASA POWER data.
abstract: Solar energy decision support is fragmented across dashboards that provide data without explanation,
  research papers are slow to parse, and general-purpose language models are not solar domain specific
  and answer without evidence. This paper introduces Solar Intelligence, a hybrid retrieval-augmented
  framework that unifies structured solar analytics, evidence-grounded scientific question answering,
  and machine learning forecasting in one system. The platform integrates daily NASA POWER solar and meteorological
  data, Biosphere 2 ground-sensor readings, and a curated corpus of research papers and institutional
  reports. Structured queries use DuckDB SQL; scientific questions are answered by a hybrid retriever
  that fuses BM25 and ChromaDB dense embeddings via Reciprocal Rank Fusion, with responses grounded through
  a language model (llama3.2:3b). An Extreme Gradient Boosting (XGBoost) model produces daily forecasts
  of irradiance, temperature, and wind speed. The system is exposed via FastAPI, Streamlit, and an MCP
  server, so it can be used as an application, an API service, or an agent tool - by students, researchers,
  and energy analysts.
