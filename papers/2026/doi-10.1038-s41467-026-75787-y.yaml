summary: Perspective arguing AI is merging weather forecasting and climate prediction into unified Earth-system
  models, while flagging trust, energy and equity challenges.
abstract: Weather and climate shape every aspect of our lives, yet for decades they have been studied
  as separate worlds—one concerned with what happens tomorrow, the other with what awaits us over the
  coming decades. This long-standing divide has slowed progress in both fields. Here, we argue that artificial
  intelligence (AI) is helping to dissolve the boundary between them. By learning directly from vast streams
  of Earth observations, AI is starting to predict both tomorrow’s storm and next century’s climate within
  a single, unified framework. We show how this convergence is already underway, why weather and climate
  science have much to gain from each other, and what still stands in the way—from trust, transparency,
  and fairness to the energy cost of computation and the risk of widening global inequalities. Realizing
  this vision will demand not only better algorithms but a new culture of collaboration across scientific
  communities, operational centers, fields and disciplines. Done well, a unified, AI-driven Earth science
  could deliver faster, more reliable, and more actionable predictions—helping societies anticipate and
  adapt to a rapidly warming planet. Weather forecasting and climate prediction have long developed in
  isolation. This Perspective argues that artificial intelligence is dissolving that divide, enabling
  unified Earth-system models that span from tomorrow’s storms to the climate of coming decades.
