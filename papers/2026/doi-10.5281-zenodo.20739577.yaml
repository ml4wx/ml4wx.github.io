summary: Dual-branch graph attention and Transformer model classifies drought severity across eight Indian
  states with 96.76% test accuracy, outperforming LSTM and CNN-LSTM baselines.
abstract: Drought remains a persistent threat to agricultural economies worldwide, yet forecasting its
  onset with sufficient lead time continues to challenge existing prediction systems. Existing forecasting
  systems tend to treat spatial and temporal dimensions separately, limiting their ability to capture
  cross-regional climate dependencies alongside long-horizon temporal patterns. This paper presents a
  parallel dual-branch architecture that couples a Graph Attention Network (GAT) for inter-regional spatial
  encoding with a Transformer encoder for sequential climate modeling. Both branches operate concurrently,
  and their representations are fused at a shared classification head to assign one of four drought severity
  levels per record. Experiments are conducted on a monthly climate dataset covering eight Indian states
  with 11,680 total records. The combined model achieves 96.76% test accuracy, 96.94% weighted precision,
  and a weighted F1-score of 0.9682, consistently exceeding standalone LSTM, CNN-LSTM, and single-branch
  Transformer baselines. A Streamlit-based monitoring dashboard supports near-real-time severity inference
  for field use.
