summary: Random forest produces 0.25° monthly precipitation isotope maps for Australia from 1962–2023,
  outperforming an isotope-enabled atmospheric GCM.
abstract: Abstract. The stable isotopic composition of precipitation (δ2HP, δ18OP; 'water isotopes') is
  a powerful tool for tracking water through the atmosphere, as well as fingerprinting land-surface water
  masses and identifying water cycle biases in isotope-enabled climate models. Water isotopes also underpin
  our understanding of multi-decadal to multi-centennial water cycle variability via their retrieval from
  palaeoclimate archives. Water isotopes thereby increase our understanding of past and present – and
  hence future – water cycle variability. Understanding the drivers of spatial and temporal water isotope
  variability is a critical first step in applying these tracers for a better understanding of the water
  cycle. However, water isotope observations are sparse in both space and time. Here we develop and apply
  a machine learning (random forest) approach to predict spatially continuous monthly δ2HP and δ18OP across
  the Australian continent at 0.25° resolution from 1962–2023. We train the random forest models on monthly
  δ2HP (n = 5199) and δ18OP (n = 5217) observations from 60 sites across Australia. We also predict the
  deuterium excess of precipitation (dxsP, defined as δ2HP − 8*δ18OP). Out-of-sample δ2HP and δ18OP prediction
  skill is high both geographically and temporally. Skill is slightly lower for the secondary parameter
  dxsP, likely reflecting the larger reliance of spatio-temporal dxsP variability on moisture source conditions.
  The random forest models accurately capture both the seasonal cycle of precipitation isotopic variability
  and long-term annual-mean precipitation isotopic variability across the continent, and outperform estimates
  from an isotope-enabled atmosphere general circulation model over an equivalent time period. We show
  that spatio-temporal variability in precipitation amount, precipitation intensity, and surface temperature
  are particularly important for monthly δ2HP and δ18OP variations across the continent, with local surface
  pressure also important for dxsP. Drivers of site-level δ2HP, δ18OP, and dxsP are more varied. Overall,
  the new random forest modelled dataset reveals clear spatial and temporal variability in δ2HP, δ18OP,
  and dxsP across the Australian continent over the past decades – providing a robust foundation for hydrology,
  ecology, and palaeoclimate research, as well as an accessible framework for predicting water isotope
  values in other locations.
