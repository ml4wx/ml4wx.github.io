summary: Copula and machine-learning analysis shows ENSO and Atlantic modes give skillful lagged predictability
  of Amazon compound hot-dry extremes, up to 7-month leads.
abstract: Abstract We characterize the dependence between lagged large‐scale climate modes and Amazon
  climate extremes and assess whether monthly precursor signals enable early warning of compound hot‐dry
  events. A copula‐based framework analyses tail dependence between major climate drivers and precipitation
  and temperature anomalies at multiple lags, identifying where and how far in advance extreme phases
  of modes of variability likely precede local extremes. Machine learning models then evaluate the predictability
  of compound hot‐dry events from lagged climate indices, determining which modes and lead times yield
  skillful forecasts. Copula modeling shows hot extremes are more likely following positive phases of
  El Niño‐Southern Oscillation (ENSO) and tropical Atlantic variability, with relationships more prevalent
  than for cold extremes. The most persistent signal occurs for March–May temperatures, when hot extremes
  are more likely across the Amazon following positive climate‐mode anomalies at lags up to 7 months,
  indicating substantial long‐lead early‐warning potential. In September–November, hot extremes are associated
  with prior tropical North Atlantic warming. During December–February, they occur at short lags with
  tropical South Atlantic warming across the basin, and at longer ENSO lags in the Planalto Amazon and
  Andes–Amazon foothills. In contrast, precipitation shows limited tail‐dependence with climate indices,
  and North Atlantic variability exhibits weak dependence with individual hot and dry extremes. Predictability
  of compound hot‐dry events is dominated by ENSO and peaks in December–February, especially in the western
  Guiana highlands, and in March–May in the lower central Amazon, with lowest skill in June–August. Reliable
  predictions typically require at least one climate index at 1‐month lead.
