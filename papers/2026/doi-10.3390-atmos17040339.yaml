summary: A dual-path gated axial Transformer improves typhoon track prediction accuracy over comparison
  methods across multiple lead times, with lower computational cost.
abstract: Typhoon track prediction is an important research direction in weather forecasting. Although
  deep learning methods have achieved some progress in this field, challenges remain, including insufficient
  fusion of meteorological features, limited capability in modeling temporal and spatial evolution, and
  high computational cost of some models. To address these issues, this paper proposes a dual-path, multi-modal
  typhoon track prediction model that incorporates a gated axial Transformer to enhance the modeling of
  deep structural features in the meteorological environment. Numerical experimental results show that
  the proposed model achieves higher prediction accuracy than comparative methods in typhoon track prediction
  tasks across multiple time scales, demonstrating the effectiveness of the approach.
