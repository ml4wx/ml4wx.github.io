summary: Shows atmospheric rivers supply about one-third of liquid rain and up to 50% of freezing rain
  in East Asia during 1961–2023, using machine-learning feature importance to attribute trends.
abstract: Extreme hydrometeorological events, including freezing rain and ice pellets, pose severe threats
  to countries across the Asian monsoon region. This was underscored by the unprecedented 2008 freezing
  disaster and recent extreme freezing events in 2025/2026 over southern China. While previous studies
  have highlighted the role of atmospheric rivers (ARs) in modifying precipitation types in other regions,
  research focusing on the populous Asian monsoon region, a hotspot of such high-impact events, remains
  insufficient. Here, based on an AR detection tool (ARDT) named ARIA-Asia v1.8 validated against seven
  ARDTs, we demonstrate that during 1961–2023, ARs account for over one-third of the liquid rain frequency
  in key coastal areas of East Asia (e.g., southern Japan, the Yangtze River Estuary), account for up
  to 50% of freezing rain events in eastern China, and account for 26%–44% of ice pellet events over the
  Yangtze River basin and southern China. Trends in AR activity have reduced liquid rain frequency across
  mid-latitude East Asia while significantly increasing AR-associated solid and mixed-phase precipitation
  in southern China, particularly during the cold season. Using five machine-learning algorithms, feature
  importance analyses reveal that trends in AR frequency account for approximately 53% of the total feature
  importance for AR-associated liquid rain, whereas trends in solid and mixed-phase precipitation are
  jointly governed by thermodynamic (e.g., sensible/latent heat fluxes) and microphysical (e.g., cloud
  ice, snow water content) processes. Our findings demonstrate that ARs are core weather systems reshaping
  the regional distribution of hydrometeors and high-impact precipitation types in Asia. The findings
  provide critical insights for improving the prediction of hydrometeor-related disasters and mitigation
  strategies under climate change.
