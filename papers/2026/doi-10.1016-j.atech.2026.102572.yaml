summary: Hybrid DSSAT crop model and random forest framework with ML downscaling of CMIP6 projections,
  finding 8–22% maize yield losses under RCP 4.5 in Ethiopia.
abstract: 'Climate variability and change pose increasing threats to crop productivity in data-scarce
  regions of East Africa. This study develops and validates a hybrid artificial intelligence-physics modeling
  framework that integrates mechanistic crop simulation, machine learning, and climate downscaling to
  enable evidence-based agricultural adaptation under climate uncertainty. The work combines: (i) 36 years
  of climate trend analysis (1987–2022) in Mecha woreda, Northwest Ethiopia; (ii) field experiments testing
  16 density-nitrogen combinations (2020–2022); (iii) mechanistic crop simulation using DSSAT-CERES-Maize;
  (iv) machine learning-based climate downscaling and bias correction from three CMIP6 global climate
  models; and (v) ensemble uncertainty quantification. Results show significant climate trends: annual
  rainfall declining by 4–6 mm/year, minimum temperature warming at 0.20°C/decade, and growing period
  variability of 176 days (range: 94–229 days). Field optimization through random forest analysis and
  Bayesian optimization identified optimal management practices (80,000 plants/ha, 207 kg N/ha) yielding
  9.38 t/ha a 68% increase over baseline (5.58 t/ha). The hybrid model achieved strong calibration-validation
  performance (phenology: R² = 0.94–0.96; grain yield: R² = 0.91, NRMSE = 5.58%). Future climate projections
  (RCP 4.5, 2040–2069) indicate rainfall decline of 8–12%, warming of 1.8–2.4°C, and growing period shortening
  of 10–15 days, translating to yield reductions of 8–22% depending on agroecological zone. The lowland
  zone (1000–1600 m) faces highest risk (−18–22% yield loss), while highland zones (2200–3200 m) show
  greater resilience. Machine learning-optimized adaptation strategies include earlier planting (8–15
  May), increased nitrogen application (207–276 kg/ha), adoption of short-duration varieties (90–120 days),
  and crop diversification toward drought-tolerant species. The framework demonstrates that integrating
  AI/ML with physics-based models, Earth observations, and climate projections rather than deploying AI/ML
  alone enables transparent, robust, and farmer-actionable climate-risk decisions. The methodology is
  reproducible and scalable across East Africa.'
