summary: Review of ML radiation emulators for weather and climate models, classifying them by replacement
  scope and validation level, and covering online stability and GPU integration.
abstract: Radiation physics processes are a core component of numerical weather and climate-Earth system
  models, governing the energy budget through longwave and shortwave fluxes and heating rates. However,
  their high computational cost and limited parallel scalability remain a major bottleneck for high-resolution
  integrations and large ensemble forecasts. Operational systems have reduced this burden through infrequent
  calls, coarse-grid treatments, and clear-sky simplifications, but such approximations can weaken cloud-radiation
  interactions and introduce accumulated errors and numerical instability. This review reframes these
  limitations as a problem of computational structure rather than incremental approximation and systematically
  surveys machine-learning-based radiation physics emulators by replacement scope (full-scheme, module-level,
  and hybrid/compound) and validation level (offline accuracy, online time-integration stability, and
  distributional robustness). Recent advances in deep learning architectures, physics-constrained training,
  three-dimensional and high-resolution effect emulation, and practical integration with Fortran-based
  models, GPU acceleration, and generalization strategies are synthesized to highlight key trade-offs
  and future directions for operational deployment.
