summary: MKB is a unified scientific multimodal model that outputs weather fields alongside biological,
  molecular and medical outputs; weather is one of six branches.
abstract: 'Scientific discovery is increasingly shifting from isolated disciplines to multi-domain reasoning,
  and AI for science faces a similar transition. Existing systems are either specialised for individual
  domains or unify scientific data mainly through text tokenisation and prompt-based interfaces, limiting
  their ability to handle diverse scientific inputs, produce modality-native outputs, and support joint
  understanding, reasoning, and generation across scientific domains. We introduce MKB, a unified scientific
  multimodal model for both understanding and generation, built around a shared Transformer backbone and
  modality-tailored encoders, adapters, and decoders. MKB covers six scientific branches, including DNA,
  RNA, proteins, small molecules, earth science, and medical images, and supports native outputs such
  as biological sequences, molecular strings, meteorological fields, and segmentation masks. Training
  follows a two-stage modality-then-language curriculum: Stage 1 aligns modality-specific components with
  the frozen backbone, and Stage 2 consolidates them with the language backbone using mixed scientific
  and general corpora. Experiments show that MKB achieves competitive scientific understanding across
  biological and molecular benchmarks, produces high-fidelity native outputs for weather forecasting,
  biological generation, and medical-image segmentation, and largely retains the general capabilities
  of its Qwen3-VL backbone. These results demonstrate the feasibility of the proposed paradigm, suggesting
  that shared-backbone models with modality-tailored components can provide a promising foundation for
  future cross-domain scientific multimodal exploration. The model and code are publicly available at
  https://github.com/Shanghai-Academy-of-AI-For-Science/MKB and https://huggingface.co/sais-org/MKB.'
