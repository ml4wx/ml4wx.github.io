summary: Clustering-based regionalization and weighted CMIP6 ensemble with bias correction project increases
  in heavy precipitation extremes across Pakistan, especially under SSP5-8.5.
abstract: Study region Pakistan is a topographically diverse region influenced by both the South Asian
  monsoon and westerly disturbances. The interaction of these climatic systems produces pronounced spatial
  and temporal climate variability, and recent decades have witnessed a significant increase in the occurrence
  and intensity of hydroclimatic extremes. Study focus This study examines historical and future changes
  in precipitation extremes using an optimized climate modeling framework. Homogeneous climatic regions
  are identified through a machine learning–based clustering approach that combines elevation, geographical
  coordinates, and long-term precipitation records. A weighted multi-model ensemble of CMIP6 simulations
  is constructed using K-fold cross-validation (KFCV) to improve the robustness and regional reliability
  of climate projections, while Quantile Delta Mapping (QDM) is employed for bias correction. Precipitation
  extreme indices are evaluated for the historical baseline period (1985–2014) and projected under SSP2–4.5
  and SSP5–8.5 scenarios to quantify future changes in extreme precipitation characteristics. New hydrological
  insights for the region The findings reveal that there is significant spatial and scenario-dependent
  variability in precipitation extremes across Pakistan. Arid southwestern regions are subjected to more
  continuous dry days and less overall precipitation, signifying a high risk of drought. In contrast,
  northern and monsoon-influenced regions reveal significant growth in heavy and very heavy precipitation
  indices (R20mm, R25mm, R95p, R99p, RX1day, and RX5day), especially with SSP5–8.5, which indicates high
  floods and flash flood hazards. Trend analysis shows a remarkable increase in extreme rainfall intensity
  alongside prolonged dry spells in arid areas. From a hydrological perspective, these projected changes
  imply increasing challenges for reservoir operation, irrigation planning, flood risk management, and
  drought preparedness. These findings provide region-specific insights to support climate-resilient water
  management, agricultural planning, and disaster risk reduction in Pakistan.
