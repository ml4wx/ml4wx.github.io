summary: Sparse autoencoder features in GraphCast show causal use; amplifying convection features cuts
  tropical cyclone intensity error by a median 51%.
abstract: Learned weather models are experimentally accessible computational systems whose internal representations
  can be inspected and manipulated. Using sparse autoencoder features from GraphCast, DeepMind's autoregressive
  weather forecasting model, we test whether causal relevance requires physical semantics, a question
  that matters for auditing whether AI forecasters used in high-assurance settings rely on reliable mechanisms.
  We also look at whether physically associated latent directions can be steered to improve extreme-event
  forecasts, where interventions are applied to the model's internal activations during the rollout. We
  find that ablating a feature locked to GraphCast's computational mesh increases global geopotential
  height error despite lacking conventional physical semantics. Second, suppressing convection- and low-level-vorticity-associated
  features weakens predicted tropical-cyclone deepening (the fall in central pressure during intensification),
  while amplifying them reduces intensity error, with amplification of convection features through feature
  scaling achieving a median of 51\% error reduction over seven storms. Together, these results separate
  interpretable, physical association from causal utility and establish sparse features as experimental
  coordinates for auditing and intervening on learned weather dynamics.
