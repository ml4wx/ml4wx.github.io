summary: Minkowski image loss makes precipitation-field geometry differentiable; constrained CNN emulator
  on OPERA radar eliminates geometric violations seen in baselines, which produce impossible fields in
  7.8% of cases.
abstract: 'Abstract The “differentiability gap” presents a primary bottleneck in Earth system deep learning:
  Since models cannot be trained directly on non-differentiable scientific metrics and must rely on smooth
  proxies (e.g., MSE), they often fail to capture high-frequency details, yielding “blurry” outputs. We
  develop a framework that bridges this gap using two different methods to deal with non-differentiable
  functions: The first is to analytically approximate the original non-differentiable function into a
  differentiable equivalent one; the second is to learn differentiable surrogates for scientific functionals.
  We formulate the analytical approximation by relaxing discrete topological operations using temperature-controlled
  sigmoids and continuous logical operators. Conversely, our neural emulator uses Lipschitz-convolutional
  neural networks to stabilize gradient learning via: (1) spectral normalization to bound the Lipschitz
  constant and (2) hard architectural constraints enforcing geometric principles. We demonstrate this
  framework’s utility by developing the Minkowski image loss, a differentiable equivalent for the integral-geometric
  measures of surface precipitation fields (area, perimeter, and connected components). Validated on the
  EUMETNET OPERA dataset, our constrained neural surrogate achieves high emulation accuracy, completely
  eliminating the geometric violations observed in unconstrained baselines, which generate physically
  impossible precipitation fields in up to 7.8% of cases. However, applying these differentiable surrogates
  to a deterministic super-resolution task reveals a fundamental trade-off: While strict Lipschitz regularization
  ensures optimization stability, it inherently over-smooths gradient signals, restricting the recovery
  of highly localized convective textures. This work highlights the necessity of coupling such topological
  constraints with stochastic generative architectures to achieve full morphological realism.'
