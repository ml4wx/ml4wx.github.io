summary: GenONet uses a DeepONet generator inside a GAN with a moisture-conservation loss to produce sharper
  precipitation nowcasts up to 3 hours, gaining most at high intensities and long leads.
abstract: High-resolution precipitation nowcasting is critical for reducing the impacts of severe weather
  but remains difficult because of rapid storm evolution. Deep learning models have shown great promise
  for this task, but their predictive skill often deteriorates over longer forecast horizons. This leads
  to increasingly blurry forecasts that fail to capture the complex, non-linear evolution of storm systems.
  In order to address these limitations, we introduce Spatio-Temporal U-DeepONet (GenONet), a novel architecture
  for long-range precipitation forecasting up to 3 hours, specifically designed to produce sharp and physically
  consistent results. GenONet's architecture pioneers the use of a Deep Operator Network (DeepONet) as
  a generator within a Generative Adversarial Network (GAN) framework for this task. The DeepONet learns
  the continuous-time dynamics of precipitation, ensuring stability over long forecast horizons. Adversial
  training against a spatio-temporal discriminator compels the model to produce sharp, coherent forecasts,
  while a physics-informed loss regularizer, derived from the Moisture Conservation Equation, improves
  physical plausibility in our ablation setting. Quantitative evaluations show that our model achieves
  consistently higher scores on most of the metrics, especially for highintensity events and at longer
  lead times. Qualitatively, GenONet produces structurally coherent forecasts that maintain their integrity,
  whereas baseline models degrade into indistinct patterns. Finally, an ablation study confirms the benefit
  of this physics-informed loss, highlighting the strength of combining operator learning with adversarial
  training.
