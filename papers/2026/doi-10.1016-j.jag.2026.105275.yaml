summary: Transformer retrieves 3D cloud radar reflectivity from GOES-R imagery, reaching R=0.80 and 6.75
  dBZ RMSE against CloudSat and capturing 2020 hurricane eyewall structure.
abstract: Obtaining high-resolution, large-scale three-dimensional (3D) cloud vertical structure remains
  a major challenge in remote sensing, limited by the sparse coverage and narrow swath of operational
  spaceborne cloud radars. This study presents a novel Transformer-based machine learning framework to
  retrieve continuous 3D radar reflectivity fields directly from GOES-R geostationary satellite imagery.
  By modeling the non-linear relationships between passive multispectral radiances and active cloud radar
  profiles, the framework enables continuous day-and-night retrieval of cloud structures. Extensive validation
  against independent CloudSat observations demonstrates robust performance, with the retrieval achieving
  a correlation coefficient (R) of 0.80 and a root-mean-square error (RMSE) of 6.75 dBZ for composite
  reflectivity. Further evaluation using ground-based Ka-band radars confirms the model’s ability to reproduce
  realistic vertical structures across diverse climate regimes. The framework’s practical utility is demonstrated
  through the analysis of four major 2020 Atlantic hurricanes, where the retrieved 3D fields successfully
  capture eyewall organization and intensification processes. Notably, the derived reflectivity metrics
  exhibit a strong correlation (R > 0.8) with maximum sustained wind speeds. These results demonstrate
  that the proposed retrieval framework can generate wide-field, high-frequency 3D cloud-structure reconstructions
  from geostationary multispectral imagery, providing useful complementary information to sparse active
  profiling observations for improved severe weather analysis.
