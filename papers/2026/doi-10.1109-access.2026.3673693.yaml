summary: Open-source framework benchmarks nine neural downscaling architectures; transformers are most
  accurate, while diffusion and ESRGAN better capture complex terrain.
abstract: Effective climate adaptation and resilience require high-resolution localized climate data;
  however, widely used global climate models (GCMs) operate at coarse spatial resolutions and are unable
  to address community-scale needs. Even the most advanced GCMs often reduce the world’s largest cities
  to a single grid cell, largely ignoring their complex terrains and microclimates. This limits community-level
  risk assessment and adaptation planning. This paper introduces a unified, open-source framework for
  neural downscaling of climate data that converts coarse-resolution GCM outputs into finer-scale projections.
  Using standardized inputs, preprocessing, data splits, and latitude-aware evaluation metrics, we evaluate
  nine state-of-the-art neural architectures across a range of climate variables and geographically diverse
  regions using three public datasets. Empirical results show that transformer-based models (ViT, HAT)
  achieve the highest predictive accuracy overall, while generative models (ESRGAN and diffusion) produce
  realistic fine-scale structure and better describe climate in complex terrain. We release all code,
  datasets, and evaluation tools to support reproducible comparison and practical deployment.
