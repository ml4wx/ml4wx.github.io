summary: Scoping review of 23 studies on ML heatwave prediction, finding ANNs and random forests most
  common and temperature the top predictor.
abstract: As extreme heat events increase in frequency, intensity, and duration due to climate change,
  forecasting these events has become vital for early warning systems, public health preparedness, and
  climate adaptation strategies, especially in parts of the world that are already subject to extreme
  heat, such as tropical regions. In recent years, machine learning (ML) has increasingly been applied
  to environmental and meteorological data to improve the prediction of heatwaves and extreme heat events.
  This scoping review examines global peer-reviewed literature on the application of ML techniques for
  extreme heat prediction using environmental variables. This includes heatwave prediction, environmental
  and meteorological predictors used in these models, and the geographical distribution of existing research.
  A total of 23 peer-reviewed studies meeting the inclusion criteria were included in the review, following
  the PRISMA-ScR guidelines. The findings indicate that artificial neural networks and random forest models
  were most frequently reported as high performing within individual studies. However, direct comparisons
  across studies are limited by heterogeneity in prediction targets, validation strategies, lead times,
  heatwave definitions, and performance metrics. Temperature-related variables, especially maximum temperature,
  were consistently identified as the most influential predictors across studies. Furthermore, the evidence
  base was heavily concentrated in Europe, Asia, and North America, with comparatively limited representation
  from low- and middle-income countries respective to population, despite these regions often experiencing
  disproportionate impacts of climate change and extreme heat exposure. By synthesising current evidence
  on ML-based heatwave prediction, associated environmental predictors, and geographical research trends,
  this review provides insights to support the development of more robust, context-aware, and globally
  representative heatwave forecasting frameworks.
