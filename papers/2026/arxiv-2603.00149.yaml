summary: Physics-consistent multigrid diffusion for fluid super-resolution, evaluated on atmospheric and
  oceanic benchmarks, with fewer sampling steps than diffusion baselines.
abstract: 'Existing image SR and generic diffusion models transfer poorly to fluid SR: they are sampling-intensive,
  ignore physical constraints, and often yield spectral mismatch and spurious divergence. We address fluid
  super-resolution (SR) with \textbf{ReMD} (\underline{Re}sidual-\underline{M}ultigrid \underline{D}iffusion),
  a physics-consistent diffusion framework. At each reverse step, ReMD performs a \emph{multigrid residual
  correction}: the update direction is obtained by coupling data consistency with lightweight physics
  cues and then correcting the residual across scales; the multiscale hierarchy is instantiated with a
  \emph{multi-wavelet} basis to capture both large structures and fine vortical details. This coarse-to-fine
  design accelerates convergence and preserves fine structures while remaining equation-free. Across atmospheric
  and oceanic benchmarks, ReMD improves accuracy and spectral fidelity, reduces divergence, and reaches
  comparable quality with markedly fewer sampling steps than diffusion baselines. Our results show that
  enforcing physics consistency \emph{inside} the diffusion process via multigrid residual correction
  and multi-wavelet multiscale modeling is an effective route to efficient fluid SR. Our code are available
  on https://github.com/lizhihao2022/ReMD.'
