summary: MS-FTNet fuses Fourier frequency-domain and multi-scale convolutional features for multi-source
  precipitation nowcasting, improving CSI and LPIPS on SEVIR heavy events.
abstract: Accurate precipitation nowcasting plays an important role in disaster prevention and hydrometeorological
  applications, yet it remains highly challenging due to the complex spatiotemporal variability and multi-scale
  structural characteristics of precipitation systems. Existing deep learning methods are largely data-driven
  and often struggle to effectively exploit multi-source observations or learn physically meaningful representations.
  To address these limitations, this study proposes a Multi-Scale Frequency-Temporal Network (MS-FTNet)
  for precipitation nowcasting. The framework leverages Fourier transform-based frequency-domain modeling
  to achieve an interpretable multi-scale decomposition of precipitation dynamics. Specifically, low-frequency
  components capture large-scale stratiform patterns and their temporal evolution, while high-frequency
  components represent localized convective structures and abrupt variations. Building on this, a Global
  Feature Collaboration (GFC) module integrates global frequency-domain representations with multi-scale
  convolutional features, and an Adaptive Temporal Fusion (ATF) module enhances temporal dependency modeling.
  Experiments on the SEVIR dataset demonstrate that MS-FTNet consistently outperforms representative baseline
  models in terms of MSE, CSI, and LPIPS, particularly for heavy precipitation events and longer forecast
  lead times.
