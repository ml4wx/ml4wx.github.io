summary: A stochastic-differential-equation conditional diffusion model super-resolves multi-product forecasts
  over Eastern China, reaching R² about 0.90 at 12 h and improving downstream ozone prediction by 4.6–5.8%.
abstract: Global weather forecasts provide essential support for socioeconomic activities, but their applications
  remain constrained by coarse spatial resolution and systematic, regime-dependent biases, particularly
  over meteorologically heterogeneous regions. This study develops a conditional diffusion model based
  on stochastic differential equations, which integrates intensity-boundary structural learning with adaptive
  refinement via dynamic convolution and channel attention to produce high-resolution meteorological fields
  across multiple forecast products. Evaluations over Eastern China against ERA5-Land show that the super-resolution
  forecasts achieve strong agreement with the reference, with temperature and wind fields at a 12 h lead
  time reaching R 2 values of up to about 0.90 and 0.87, respectively, and precipitation event skill reaching
  stable equitable error in probability space (SEEPS) values as low as approximately 0.05, consistently
  outperforming interpolation-based and deterministic learning methods. Compared with representative baseline
  models, the proposed framework demonstrates more robust performance across variables and forecast settings,
  with improved preservation of coherent spatial distributions, localized gradients, and extreme-value
  features. Using the super-resolution weather forecasts, we further demonstrate an application to gridded
  daily maximum 8 h ozone prediction. Compared with ozone predictions driven by the low-resolution meteorological
  fields, the use of super-resolved meteorological fields yields systematic improvements in predictive
  performance, with R 2 increased by 4.6–5.8%. For the evaluated forecast products and meteorological
  variables over Eastern China, these results demonstrate that the proposed framework provides an effective
  approach for regional-scale forecast refinement and downstream air-quality prediction.
