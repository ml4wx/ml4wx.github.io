summary: Interpretable Kolmogorov–Arnold networks with predictor pruning give 24-h tropical cyclone intensity
  forecasts (MAE 7.87 kt) and symbolic expressions that match known intensification theory.
abstract: 'Deep learning models have considerably improved the accuracy of tropical cyclone (TC) intensity
  forecasting, yet their black-box nature limits physical interpretability. To overcome this limitation,
  this study proposes an interpretable framework for 24‑h TC intensity forecasting based on Kolmogorov–Arnold
  Networks (KANs), consisting of three modules: an attribution score-guided recursive predictor pruning
  module; a neural network optimization and prediction module; and a symbolic regression-based predictor
  contribution analysis module. Results demonstrate that the recursive pruning module identifies high-impact
  predictors, thereby improving both the robustness and accuracy of the KAN model, with a mean absolute
  error of 7.87 kt. Furthermore, the contribution analysis module quantifies the contributions of dominant
  predictors by converting the KAN model into interpretable symbolic expressions. It is revealed that
  the initial TC intensity exhibits the strongest negative contribution to 24‑h TC intensity change among
  climatology and persistence predictors; 850‑hPa maximum symmetric tangential wind shows the largest
  positive dynamic contribution; and the maximum potential intensity dominates the thermodynamic contribution,
  indicating that a more favorable future thermodynamic environment promotes TC intensification. Therefore,
  the relationships derived from the symbolic expression largely align with the existing TC intensification
  theory. This indicates that the proposed framework, despite its data‑driven nature, can effectively
  capture complex physical mechanisms of TC intensity evolution, effectively bridging data-driven forecasting
  and physical interpretability. 摘要 当前深度学习模型已显著提升热带气旋(tropical cyclone, TC)强度预报准确度, 但其“黑箱”特性制约了其物理可解释性.为此,
  本文提出基于Kolmogorov–Arnold网络(KAN)的可解释TC强度预报框架, 包含基于归因分数的递归剪枝模块,网络优化和预报模块以及基于符号化回归的因子贡献分析模块.结果表明, 剪枝模块有效筛选高影响因子,
  提升模型鲁棒性与准确度, 独立测试集平均绝对误差为7.87 kt.贡献分析模块将KAN模型转化为符号表达式, 量化主导因子贡献, 分析发现, 初始TC强度呈最强负贡献, 850 hPa最大对称切向风为最大动力贡献因子,
  最大潜在强度主导热力贡献, 这与现有TC强度变化理论基本一致.结果表明, 该框架能够有效揭示热带气旋强度演变机制, 架起了数据驱动预报与物理可解释性之间的桥梁.'
