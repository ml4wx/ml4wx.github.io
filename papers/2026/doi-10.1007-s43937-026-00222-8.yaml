summary: Compares ten forecasting methods for Bangladesh solar irradiance, finding skill falls to near
  climatology beyond 24 hours, though 30-day PV energy block estimates remain usable (8% NRMSE).
abstract: Growing electricity demand and persistent pressure on conventional power supply have increased
  the need for reliable renewable-energy generation, particularly in energy-intensive industrial regions.
  Rooftop photovoltaic (PV) systems offer a practical alternative, but effective electricity planning
  requires reliable estimates of how much electrical energy these systems can generate over an upcoming
  planning period. This study therefore investigates whether solar irradiance forecasting can support
  estimation of PV energy availability over the subsequent 30 days and how forecast reliability changes
  as the prediction horizon increases. Ten forecasting approaches, spanning conventional baselines, machine
  learning, recurrent neural networks, and transformer-based models, were evaluated using ten years of
  hourly solar and meteorological data from Gazipur, Bangladesh. A leakage-controlled rolling-origin framework
  was applied at forecast-window lengths of 1, 24, 168, and 720 h, with the final year reserved for independent
  testing. Relative to smoothed climatology, the best window-average forecast skill declined from 0.599
  for the 1-h window to 0.231 for the 24-h window and 0.015 for the 168-h window, while no data-driven
  model outperformed climatology over the 720-h window. Nevertheless, temporal aggregation substantially
  improved planning-level accuracy, reducing normalised RMSE from 40.1% hourly to 22.3% daily, 14.0% weekly,
  and 8.0% for 30-day energy blocks. A multi-year evaluation over four held-out years placed the 30-day
  block mean absolute percentage error at $$5.87 \pm 0.42$$ %, and recalibrating the energy intervals
  on a different single year gave pooled empirical coverage of 0.771 over three held-out years, against
  0.625 for the primary 2022 interval and a nominal 0.80. These findings show that data-driven forecasting
  provides its greatest benefit at shorter horizons, whereas aggregation becomes increasingly important
  for longer-term energy planning. The conclusions apply to this site, this information set of pre-origin
  observations and deterministic calendar variables, and these forecast-window lengths, and they do not
  bear on the value of numerical weather prediction forecasts, which were deliberately excluded. Within
  those bounds the framework provides a practical basis for estimating the idealised irradiance-derived
  energy an industrial rooftop PV system can be expected to generate over a 30-day period. Clinical trial
  registration Not applicable. This study is not a clinical trial.
