summary: Var-ANN calibrates FY-3C VASS temperature profiles over the Tibetan Plateau, reaching RMSE 2.11
  K against radiosondes, and improves WRF precipitation after assimilation.
abstract: Accurate information on atmospheric temperature profiles is crucial for improving numerical
  weather forecasting and short-term numerical weather prediction (NWP). However, the harsh environment
  of the Tibetan Plateau (TP) limits the availability of station observations, which fails to meet the
  high spatial resolution required for NWP. In this study, we present a method to calibrate temperature
  profiles obtained from the Vertical Atmosphere Sounding System (VASS) using data from the polar-orbiting
  satellite FY-3C. The aim is to provide high-resolution atmospheric structure for NWP in the TP. The
  temperature profile in VASS exhibits temporal and spatial heterogeneity due to the significant impact
  of clouds on the radiative transfer mode (RTM). To address this, we employ a combination of variation
  and artificial neural network (Var-ANN) methods to calibrate the satellite product and improve its compatibility
  with the model. To confirm the feasibility of our method, we compare the calibrated results with the
  observed data from 121 radiosonde soundings and 2400 meteorological stations in China, both of which
  represent conditions closest to the real atmospheric states. The calibrated temperature shows improvements
  over the original temperature, with a root mean square error, bias, and agreement with radiosonde soundings
  of 2.11, -0.72, and 0.998, respectively. We also select two classical cases involving the eastward movement
  of the plateau vortex (PV) and the formation of precipitation to verify the applicability of the calibration
  in NWP. The results demonstrate that the performance of NWP improves after assimilating the calibrated
  data, with the Var-ANN data assimilation scheme achieving the highest threat score of 66.9 and 66.7
  for case 1 and case 2, respectively. These findings suggest that the Var-ANN method is suitable for
  calibrating satellite temperature profiles, and the calibrated data holds potential for precipitation
  forecasting. Furthermore, the novel method can also be applied in global temperature profile correction
  and satellite cross-calibration.
