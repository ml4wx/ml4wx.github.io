summary: Operator-learning downscaler maps coarse Earth system model near-surface winds to fine scale,
  generalizing to unseen models and future scenarios without retraining while preserving wind trends.
abstract: Accurate high-resolution wind field simulations are critical for resolving fine-scale atmospheric
  dynamics, yet the simulation of wind fields in Earth System Models (ESMs) remains limited by coarse
  spatial resolution and systematic biases. To address this, data-driven down scaling techniques have
  been widely used to enhance coarse-resolution ESM outputs. However, existing methods are typically tied
  to fixed discretizations, limiting generalization across models with different native resolutions. Here
  we formulate global near-surface wind downscaling as an operator-learning problem on continuous atmospheric
  state fields and develop a downscaling neural operator that maps coarse-scale fields to fine-scale counterparts
  across heterogeneous discretizations. The operator learning-based neural downscaling framework outperforms
  dominant baselines, recovers fine-scale physical structures, and generalizes to previously unseen ESMs
  and future climate scenarios without retraining, while preserving long-term wind projection trends.
  These findings establish a generalizable paradigm for high-resolution climate downscaling across diverse
  simulation outputs and future scenarios.
