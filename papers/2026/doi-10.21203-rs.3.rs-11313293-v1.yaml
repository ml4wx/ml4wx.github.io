summary: Causality-selected predictors feed CNN models that forecast summer western North Pacific accumulated
  cyclone energy with useful skill at 1–4 month leads.
abstract: 'Abstract Accumulated cyclone energy (ACE) over the western North Pacific (WNP) is an important
  metric of basin-scale tropical cyclone (TC) activity and is essential for seasonal prediction and disaster
  risk reduction. In this study, empirical orthogonal function (EOF) analysis was applied to May–August
  WNP ACE anomalies, identifying two leading modes: a basin-wide mode and a dipole mode, which together
  explain 20.71% of the total variance. The basin-wide mode is associated with a sea surface temperature
  (SST) pattern resembling the developing phase of El Niño, whereas the dipole mode is linked to a developing
  Pacific Meridional Mode (PMM)-like SST pattern. Using the information flow method, physically meaningful
  predictors were selected from SST, subsurface ocean temperature, and major air–sea climate indices.
  These predictors were then used to develop month-specific convolutional neural network (CNN) forecast
  models for PC1 and PC2. Independent forecasts for 2024–2025 show that PC1 and PC2 maintains useful skill
  at lead times of 1–4 months. The EOF-based reconstruction using CNN-predicted PCs captures part of the
  observed spatial variability of summer WNP ACE anomalies, with relatively high skill over key TC-active
  regions, especially east of the Bashi Strait. The 2026 forecast suggests an enhanced ACE anomalies from
  May to July, then weaken in August. These results suggest that information-flow-based predictor selection
  combined with CNN modeling provides a useful framework for seasonal WNP ACE prediction.'
