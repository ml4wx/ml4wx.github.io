summary: Applies WEKA classification algorithms, including an optimized KNN, to past weather datasets
  to predict rainfall, humidity and temperature.
abstract: Weather has a lot of blow in our daily life and also gained researchers concentration due to
  its enormous effect in the human life. To defend ourselves from weather, we need to predict the weather
  such as rainfall, humidity and temperature etc. Using classification algorithms, we can predict the
  weather by using the past datasets. In this research paper, WEKA tool is used to implement classification
  algorithms for weather forecasting. Machine Learning is an internal part of artificial intelligence,
  which is used to design algorithms based on the relationships between data and data trends.
