summary: Proposes a fuzzy-transform seasonal forecaster for station heat index in Campania, Italy, outperforming
  ARIMA and ANN baselines; the ML contribution is modest.
abstract: 'We present a new seasonal forecasting method based on F1-transform (fuzzy transform of order
  1) applied on weather datasets. The objective of this research is to improve the performances of the
  fuzzy transform-based prediction method applied to seasonal time series. The time series’ trend is obtained
  via polynomial fitting: then, the dataset is partitioned in S seasonal subsets and the direct F1-transform
  components for each seasonal subset are calculated as well. The inverse F1-transforms are used to predict
  the value of the weather parameter in the future. We test our method on heat index datasets obtained
  from daily weather data measured from weather stations of the Campania Region (Italy) during the months
  of July and August from 2003 to 2017. We compare the results obtained with the statistics Autoregressive
  Integrated Moving Average (ARIMA), Automatic Design of Artificial Neural Networks (ADANN), and the seasonal
  F-transform methods, showing that the best results are just given by our approach.'
