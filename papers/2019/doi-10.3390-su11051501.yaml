summary: A two-step model links unannounced weather variables to announced forecasts for one-day-ahead
  PV output; random forest reaches R-squared 0.705, beating the base approach.
abstract: Photovoltaic systems have become an important source of renewable energy generation. Because
  solar power generation is intrinsically highly dependent on weather fluctuations, predicting power generation
  using weather information has several economic benefits, including reliable operation planning and proactive
  power trading. This study builds a model that predicts the amounts of solar power generation using weather
  information provided by weather agencies. This study proposes a two-step modeling process that connects
  unannounced weather variables with announced weather forecasts. The empirical results show that this
  approach improves a base approach by wide margins, regardless of types of applied machine learning algorithms.
  The results also show that the random forest regression algorithm performs the best for this problem,
  achieving an R-squared value of 70.5% in the test data. The intermediate modeling process creates four
  variables, which are ranked with high importance in the post-analysis. The constructed model performs
  realistic one-day ahead predictions.
