summary: XGBoost predicts Western North Pacific tropical cyclone intensity changes at 6–24 h lead times,
  with lower MAE than a back-propagation network.
abstract: Coastal cities in China are frequently hit by tropical cyclones (TCs), which result in tremendous
  loss of life and property. Even though the capability of numerical weather prediction models to forecast
  and track TCs has considerably improved in recent years, forecasting the intensity of a TC is still
  very difficult; thus, it is necessary to improve the accuracy of TC intensity prediction. To this end,
  we established a series of predictors using the Best Track TC dataset to predict the intensity of TCs
  in the Western North Pacific with an eXtreme Gradient BOOSTing (XGBOOST) model. The climatology and
  persistence factors, environmental factors, brainstorm features, intensity categories, and TC months
  are considered inputs for the models while the output is the TC intensity. The performance of the XGBOOST
  model was tested for very strong TCs such as Hato (2017), Rammasum (2014), Mujiage (2015), and Hagupit
  (2014). The results obtained show that the combination of inputs chosen were the optimal predictors
  for TC intensification with lead times of 6, 12, 18, and 24 h. Furthermore, the mean absolute error
  (MAE) of the XGBOOST model was much smaller than the MAEs of a back propagation neural network (BPNN)
  used to predict TC intensity. The MAEs of the forecasts with 6, 12, 18, and 24 h lead times for the
  test samples used were 1.61, 2.44, 3.10, and 3.70 m/s, respectively, for the XGBOOST model. The results
  indicate that the XGBOOST model developed in this study can be used to improve TC intensity forecast
  accuracy and can be considered a better alternative to conventional operational forecast models for
  TC intensity prediction.
