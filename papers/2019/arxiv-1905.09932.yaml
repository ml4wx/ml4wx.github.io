summary: Yandex develops satellite-imagery-based precipitation nowcasting, extending coverage beyond radar
  regions and deployed in the Yandex.Weather map and alerts.
abstract: Precipitation nowcasting is a short-range forecast of rain/snow (up to 2 hours), often displayed
  on top of the geographical map by the weather service. Modern precipitation nowcasting algorithms rely
  on the extrapolation of observations by ground-based radars via optical flow techniques or neural network
  models. Dependent on these radars, typical nowcasting is limited to the regions around their locations.
  We have developed a method for precipitation nowcasting based on geostationary satellite imagery and
  incorporated the resulting data into the Yandex.Weather precipitation map (including an alerting service
  with push notifications for products in the Yandex ecosystem), thus expanding its coverage and paving
  the way to a truly global nowcasting service.
