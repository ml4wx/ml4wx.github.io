summary: An MLP neural network nowcasts hourly summer precipitation over the Eastern Alps, outperforming
  the INCA nowcasting system and a multiple linear regression baseline.
abstract: This paper presents a new machine learning-based nowcasting model for hourly summer precipitation
  over the Eastern Alps. An artificial neural network (ANN) using the multi-layer perceptron algorithm
  was applied and evaluated against the Integrated Nowcasting through Comprehensive Analysis (INCA) nowcasting
  system and a multiple linear regression (MLR) model. Results show that the ANN model has a better nowcasting
  skill than the INCA model and the MLR model. The MLR model performs, too, also better than the INCA
  model. The improvement of precipitation intensity accuracy is substantial for both the morning to late
  evening period and for large rainfall thresholds. This study suggested that the machine learning approach
  is a promising methodology for precipitation forecasting.
