summary: Compares two ANN day-ahead PV forecasters, one using daily weather forecasts; the hybrid wins
  on sunny days (NMAE below 1%) but is less stable.
abstract: We compare the 24-hour ahead forecasting performance of two methods commonly used for the prediction
  of the power output of photovoltaic systems. Both methods are based on Artificial Neural Networks (ANN),
  which have been trained on the same dataset, thus enabling a much-needed homogeneous comparison currently
  lacking in the available literature. The dataset consists of an hourly series of simultaneous climatic
  and PV system parameters covering an entire year, and has been clustered to distinguish sunny from cloudy
  days and separately train the ANN. One forecasting method feeds only on the available dataset, while
  the other is a hybrid method as it relies upon the daily weather forecast. For sunny days, the first
  method shows a very good and stable prediction performance, with an almost constant Normalized Mean
  Absolute Error, NMAE%, in all cases (1% < NMAE% < 2%); the hybrid method shows an even better performance
  (NMAE% < 1%) for two of the days considered in this analysis, but overall a less stable performance
  (NMAE% > 2% and up to 5.3% for all the other cases). For cloudy days, the forecasting performance of
  both methods typically drops; the performance is rather stable for the method that does not use weather
  forecasts, while for the hybrid method it varies significantly for the days considered in the analysis.
