summary: Neural-network soil moisture retrievals from SMOS are assimilated into ECMWF's land model, improving
  Southern Hemisphere and some Northern Hemisphere forecasts through atmospheric feedback.
abstract: 'The assimilation of Soil Moisture and Ocean Salinity (SMOS) data into the ECMWF (European Centre
  for Medium Range Weather Forecasts) H-TESSEL (Hydrology revised-Tiled ECMWF Scheme for Surface Exchanges
  over Land) model is presented. SMOS soil moisture (SM) estimates have been produced specifically by
  training a neural network with SMOS brightness temperatures as input and H-TESSEL model SM simulations
  as reference. This can help the assimilation of SMOS information in several ways: (1) the neural network
  soil moisture (NNSM) data have a similar climatology to the model, (2) no global bias is present with
  respect to the model even if local biases can remain. Experiments performing joint data assimilation
  (DA) of NNSM, 2 m air temperature and relative humidity or NNSM-only DA are discussed. The resulting
  SM was evaluated against a large number of in situ measurements of SM obtaining similar results to those
  of the model with no assimilation, even if significant differences were found from site to site. In
  addition, atmospheric forecasts initialized with H-TESSEL runs (without DA) or with the analysed SM
  were compared to measure of the impact of the satellite information. Although NNSM DA has an overall
  neutral impact in the forecast in the Tropics, a significant positive impact was found in other areas
  and periods, especially in regions with limited in situ information. The joint NNSM, T2m and RH2m DA
  improves the forecast for all the seasons in the Southern Hemisphere. The impact is mostly due to T2m
  and RH2m but SMOS NN DA alone also improves the forecast in July- September. In the Northern Hemisphere,
  the joint NNSM, T2m and RH2m DA improves the forecast in April–September, while NNSM alone has a significant
  positive effect in July–September. Furthermore, forecasting skill maps show that SMOS NNSM improves
  the forecast in North America and in Northern Asia for up to 72 h lead time.'
