summary: 2D and 3D CNNs estimate tropical cyclone intensity from multispectral geostationary imagery,
  reaching 8.32 kt RMSE, about 35% better than single-channel CNNs.
abstract: For a long time, researchers have tried to find a way to analyze tropical cyclone (TC) intensity
  in real-time. Since there is no standardized method for estimating TC intensity and the most widely
  used method is a manual algorithm using satellite-based cloud images, there is a bias that varies depending
  on the TC center and shape. In this study, we adopted convolutional neural networks (CNNs) which are
  part of a state-of-art approach that analyzes image patterns to estimate TC intensity by mimicking human
  cloud pattern recognition. Both two dimensional-CNN (2D-CNN) and three-dimensional-CNN (3D-CNN) were
  used to analyze the relationship between multi-spectral geostationary satellite images and TC intensity.
  Our best-optimized model produced a root mean squared error (RMSE) of 8.32 kts, resulting in better
  performance (~35%) than the existing model using the CNN-based approach with a single channel image.
  Moreover, we analyzed the characteristics of multi-spectral satellite-based TC images according to intensity
  using a heat map, which is one of the visualization means of CNNs. It shows that the stronger the intensity
  of the TC, the greater the influence of the TC center in the lower atmosphere. This is consistent with
  the results from the existing TC initialization method with numerical simulations based on dynamical
  TC models. Our study suggests the possibility that a deep learning approach can be used to interpret
  the behavior characteristics of TCs.
