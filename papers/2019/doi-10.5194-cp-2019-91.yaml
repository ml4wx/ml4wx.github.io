summary: Statistical emulator GCMET reconstructs global climate over the last 800,000 years at high spatial
  detail, revealing stable habitat refugia.
abstract: Abstract. A detailed and accurate reconstruction of the past climate is essential in understanding
  the interactions between ecosystems and their environment through time. We know that climatic drivers
  have shaped the distribution and evolution of species, including our own, and their habitats. Yet, spatially-detailed
  climate reconstructions that continuously cover the Quaternary do not exist. This is mainly because
  no paleoclimate model can reconstruct regional-scale dynamics over geological time scales. Here we develop
  a statistical emulator, the Global Climate Model Emulator (GCMET), which reconstructs the climate of
  the last 800 000 years with unprecedented spatial detail. GCMET captures the temporal dynamics of glacial-interglacial
  climates as an Earth System Model of Intermediate Complexity would whilst resolving the local dynamics
  with the accuracy of a Global Climate Model. It provides a new, unique resource to explore the climate
  of the Quaternary, which we use to investigate the long-term stability of major habitat types. We identify
  a number of stable pockets of habitat that have remained unchanged over the last 800 thousand years,
  acting as potential long-term evolutionary refugia. Thus, the highly detailed, comprehensive overview
  of climatic changes through time delivered by GCMET provides the needed resolution to quantify the role
  of long term habitat change and fragmentation in an ecological and anthropological context.
