summary: Logistic regression over land and extra-trees over sea detect clouds in FY-4A GIIRS hyperspectral
  infrared data, reaching HSS 0.78 land and 0.95 sea.
abstract: FengYun-4A (FY-4A)’s Geostationary Interferometric Infrared Sounder (GIIRS) is the first hyperspectral
  infrared sounder on board a geostationary satellite, enabling the collection of infrared detection data
  with high temporal and spectral resolution. As clouds have complex spectral characteristics, and the
  retrieval of atmospheric profiles incorporating clouds is a significant problem, it is often necessary
  to undertake cloud detection before further processing procedures for cloud pixels when infrared hyperspectral
  data is entered into assimilation system. In this study, we proposed machine-learning-based cloud detection
  models using two kinds of GIIRS channel observation sets (689 channels and 38 channels) as features.
  Due to differences in surface cover and meteorological elements between land and sea, we chose logistic
  regression (lr) model for the land and extremely randomized tree (et) model for the sea respectively.
  Six hundred and eighty-nine channels models produced slightly higher performance (Heidke skill score
  (HSS) of 0.780 and false alarm rate (FAR) of 16.6% on land, HSS of 0.945 and FAR of 4.7% at sea) than
  38 channels models (HSSof 0.741 and FAR of 17.7% on land, HSS of 0.912 and FAR of 7.1% at sea). By comparing
  visualized cloud detection results with the Himawari-8 Advanced Himawari Imager (AHI) cloud images,
  the proposed method has a good ability to identify clouds under circumstances such as typhoons, snow
  covered land, and bright broken clouds. In addition, compared with the collocated Advanced Geosynchronous
  Radiation Imager (AGRI)-GIIRS cloud detection method, the machine learning cloud detection method has
  a significant advantage in time cost. This method is not effective for the detection of partially cloudy
  GIIRS’s field of views, and there are limitations in the scope of spatial application.
