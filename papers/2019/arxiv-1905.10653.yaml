summary: Applies Gaussian process regression to infer marine boundary layer electromagnetic duct height
  from radar propagation factors, including noisy-input handling.
abstract: We show that Gaussian process regression (GPR) can be used to infer the electromagnetic (EM)
  duct height within the marine atmospheric boundary layer (MABL) from sparsely sampled propagation factors
  within the context of bistatic radars. We use GPR to calculate the posterior predictive distribution
  on the labels (i.e. duct height) from both noise-free and noise-contaminated array of propagation factors.
  For duct height inference from noise-contaminated propagation factors, we compare a naive approach,
  utilizing one random sample from the input distribution (i.e. disregarding the input noise), with an
  inverse-variance weighted approach, utilizing a few random samples to estimate the true predictive distribution.
  The resulting posterior predictive distributions from these two approaches are compared to a "ground
  truth" distribution, which is approximated using a large number of Monte-Carlo samples. The ability
  of GPR to yield accurate and fast duct height predictions using a few training examples indicates the
  suitability of the proposed method for real-time applications.
