summary: Feed-forward neural network predicts rainfall from time series for agriculture and drought or
  flood warning, with no quantitative results given.
abstract: Rainfall prediction is helpful for the agriculture sector. Early prediction of drought and torrent
  situations is achieved through time series data. For the precise prediction, Artificial Neural Network(ANN)
  technique is used. The rainy dataset is tested using Feed Forward Neural Network(FFNN). The performance
  of this model is evaluated using Mean Square Error(MSE) and Magnitude of Relative Error(MRE). Better
  performance achieved when compared with other data mining techniques.
