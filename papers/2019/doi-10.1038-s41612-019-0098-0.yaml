summary: Machine learning nowcasts lightning up to 30 minutes ahead from four surface variables at single
  stations, beating persistence, electric-field and CAPE baselines.
abstract: 'Abstract Lightning discharges in the atmosphere owe their existence to the combination of complex
  dynamic and microphysical processes. Knowledge discovery and data mining methods can be used for seeking
  characteristics of data and their teleconnections in complex data clusters. We have used machine learning
  techniques to successfully hindcast nearby and distant lightning hazards by looking at single-site observations
  of meteorological parameters. We developed a four-parameter model based on four commonly available surface
  weather variables (air pressure at station level (QFE), air temperature, relative humidity, and wind
  speed). The produced warnings are validated using the data from lightning location systems. Evaluation
  results show that the model has statistically considerable predictive skill for lead times up to 30
  min. Furthermore, the importance of the input parameters fits with the broad physical understanding
  of surface processes driving thunderstorms (e.g., the surface temperature and the relative humidity
  will be important factors for the instability and moisture availability of the thunderstorm environment).
  The model also improves upon three competitive baselines for generating lightning warnings: (i) a simple
  but objective baseline forecast, based on the persistence method, (ii) the widely-used method based
  on a threshold of the vertical electrostatic field magnitude at ground level, and, finally (iii) a scheme
  based on CAPE threshold. Apart from discussing the prediction skill of the model, data mining techniques
  are also used to compare the patterns of data distribution, both spatially and temporally among the
  stations. The results encourage further analysis on how mining techniques could contribute to further
  our understanding of lightning dependencies on atmospheric parameters.'
