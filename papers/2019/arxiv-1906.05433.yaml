summary: Position paper surveying how machine learning can help climate change mitigation and adaptation
  across sectors such as energy and disaster management; not focused on weather or climate science.
abstract: Climate change is one of the greatest challenges facing humanity, and we, as machine learning
  experts, may wonder how we can help. Here we describe how machine learning can be a powerful tool in
  reducing greenhouse gas emissions and helping society adapt to a changing climate. From smart grids
  to disaster management, we identify high impact problems where existing gaps can be filled by machine
  learning, in collaboration with other fields. Our recommendations encompass exciting research questions
  as well as promising business opportunities. We call on the machine learning community to join the global
  effort against climate change.
