summary: Hybrid day-ahead PV forecasting switches between clear-sky models and an ANN ensemble via a decision
  tree driven by the weather forecast, validated on a real plant.
abstract: PhotoVoltaic (PV) plants can provide important economic and environmental benefits to electric
  systems. On the other hand, the variability of the solar source leads to technical challenges in grid
  management as PV penetration rates increase continuously. For this reason, PV power forecasting represents
  a crucial tool for uncertainty management to ensure system stability. In this paper, a novel hybrid
  methodology for the PV forecasting is presented. The proposed approach can exploit clear-sky models
  or an ensemble of artificial neural networks, according to day-ahead weather forecast. In particular,
  the selection among these techniques is performed through a decision tree approach, which is designed
  to choose the best method among those aforementioned. The presented methodology has been validated on
  a real PV plant with very promising results.
