summary: Deep neural network emulates WRF-simulated typhoon wind speeds at arbitrary locations in Northern
  Taiwan, matching WRF accuracy across 47 typhoon events.
abstract: 'A scheme for wind-speed simulation during typhoons in Taiwan is highly desirable, considering
  the effects of the powerful winds accompanying the severe typhoons. The developed combination of deep
  learning (DL) algorithms with a weather-forecasting numerical model can be used to determine wind speed
  in a rapid simulation process. Here, the Weather Research and Forecasting (WRF) numerical model was
  employed as the numerical simulation-based model for precomputing solutions to determine the wind velocity
  at arbitrary positions where the wind cannot be measured. The deep neural network (DNN) was used for
  constructing the DL-based wind-velocity simulation model. The experimental area of Northern Taiwan was
  used for the simulation. Regarding the complex typhoon system, the collected data comprised the typhoon
  tracks, FNL (Final) Operational Global Analysis Data for the WRF model, typhoon characteristics, and
  ground weather data. This study included 47 typhoon events that occurred over 2000–2017. Three measures
  were used to analyze the models for identifying optimal performance levels: Mean absolute error, root
  mean squared error, and correlation coefficient. This study compared observations with the WRF numerical
  model and DNN model. The results revealed that (1) simulations by using the WRF-based models were satisfactorily
  consistent with the observed data and (2) simulations by using the DNN model were considerably consistent
  with those of the WRF-based model. Consequently, the proposed DNN combined with WRF model can be effectively
  used in simulations of wind velocity at arbitrary positions of study area.'
