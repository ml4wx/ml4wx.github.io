summary: CNN-LSTM statistical downscaling of ECMWF precipitation over a monsoon basin beats quantile mapping
  and SVM, with gains up to two-week lead times.
abstract: Precipitation downscaling is widely employed for enhancing the resolution and accuracy of precipitation
  products from general circulation models (GCMs). In this study, we propose a novel statistical downscaling
  method to foster GCMs’ precipitation prediction resolution and accuracy for the monsoon region. We develop
  a deep neural network composed of a convolution and Long Short Term Memory (LSTM) recurrent module to
  estimate precipitation based on well-resolved atmospheric dynamical fields. The proposed model is compared
  against the GCM precipitation product and classical downscaling methods in the Xiangjiang River Basin
  in South China. Results show considerable improvement compared to the European Centre for Medium-Range
  Weather Forecasts (ECMWF)-Interim reanalysis precipitation. Also, the model outperforms benchmark downscaling
  approaches, including (1) quantile mapping, (2) the support vector machine, and (3) the convolutional
  neural network. To test the robustness of the model and its applicability in practical forecasting,
  we apply the trained network for precipitation prediction forced by retrospective forecasts from the
  ECMWF model. Compared to the ECMWF precipitation forecast, our model makes better use of the resolved
  dynamical field for more accurate precipitation prediction at lead times from 1 day up to 2 weeks. This
  superiority decreases with the forecast lead time, as the GCM’s skill in predicting atmospheric dynamics
  is diminished by the chaotic effect. Finally, we build a distributed hydrological model and force it
  with different sources of precipitation inputs. Hydrological simulation forced with the neural network
  precipitation estimation shows significant advantage over simulation forced with the original ERA-Interim
  precipitation (with NSE value increases from 0.06 to 0.64), and the performance is only slightly worse
  than the observed precipitation forced simulation (NSE = 0.82). This further proves the value of the
  proposed downscaling method, and suggests its potential for hydrological forecasts.
