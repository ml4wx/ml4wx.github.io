summary: A GAN with conditional generator and two discriminators extrapolates radar echoes 0.5 to 1.5
  h ahead, reducing blur and outperforming baseline models.
abstract: Abstract. Weather radar echo is one of the fundamental data for meteorological workers to weather
  systems identification and classification. Through the technique of weather radar echo extrapolation,
  the future short-term weather conditions can be predicted and severe convection storms can be warned.
  However, traditional extrapolation methods cannot offer accurate enough extrapolation results since
  their modeling capacity is limited, the recent deep learning based methods make some progress but still
  remains a problem of blurry prediction when making deeper extrapolation, which may due to they choose
  the mean square error as their loss function and that will lead to losing echo details. To address this
  problem and make a more realistic and accurate extrapolation, we propose a deep learning model called
  Adversarial Extrapolation Neural Network (AENN), which is a Generative Adversarial Network (GAN) structure
  and consist of a conditional generator and two discriminators, echo-frame discriminator and echo-sequence
  discriminator. The generator and discriminators are trained alternately in an adversarial way to make
  the final extrapolation results be realistic and accurate. To evaluate the model, we conduct experiments
  on extrapolating 0.5h, 1h, and 1.5h imminent future echoes, the results show that our proposed AENN
  can achieve the expected effect and outperforms other models significantly, which has a powerful potential
  application value for short-term weather forecasting.
