summary: Decision tree calibration of greenhouse leaf wetness duration models; the neural network model
  gives the best estimates, with MAE of 1.3 to 1.85 h.
abstract: 'Leaf wetness duration (LWD) is a key driving variable for peat and disease control in greenhouse
  management, and depends upon irrigation, rainfall, and dewfall. However, LWD measurement is often replaced
  by its estimation from other meteorological variables, with associated uncertainty due to the modelling
  approach used and its calibration. This study uses the decision learning tree method (DLT) for calibrating
  four LWD models—RH threshold model (RHM), the dew parameterization model (DPM), the classification and
  regression tree model (CART) and the neural network model (NNM)—whose performances in reproducing measured
  data are assessed using a large dataset. The relative importance of input variables in contributing
  to LWD estimation is also computed for the models tested. The LWD models were evaluated at two different
  greenhouse locations: in a Chinese (CN) greenhouse over three planting seasons (April 2014–October 2015)
  and in a Spanish (ES) greenhouse over four planting seasons (April 2016–February 2018). Based on multi-evaluation
  indicators, the models were given a ranking for their assessment capabilities during calibration (in
  the Spanish greenhouse from April 2016 to December 2016 and in the Chinese greenhouse from April 2014
  to November 2014). The models were then evaluated on an independent set of data, and the obtained areas
  under the receiver operating characteristic curve (AUC) of the LWD models were over 0.73. Therein, the
  best LWD model in this case was the NNM, with positive predict values (PPVs) of 0.82 (SP) and 0.90 (CN),
  and mean absolute errors (MAEs) of 1.85 h (SP) and 1.30 h (CN). Consequently, the DLT can decrease LWD
  estimation error by calibrating the model threshold and choosing black box model input variables.'
