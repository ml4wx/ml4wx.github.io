summary: GAN-based super-resolution of degraded weather radar echo images produces sharper reconstructions
  with higher PSNR and SSIM than classical methods.
abstract: Improving the resolution of degraded radar echo images of weather radar systems can aid severe
  weather forecasting and disaster prevention. Previous approaches to this problem include classical super-resolution
  (SR) algorithms such as iterative back-projection (IBP) and a recent nonlocal self-similarity sparse
  representation (NSSR) that exploits the data redundancy of radar echo data, etc. However, since radar
  echoes tend to have rich edge information and contour textures, the textural detail in the reconstructed
  echoes of traditional approaches is typically absent. Inspired by the recent advances of faster and
  deeper neural networks, especially the generative adversarial networks (GAN), which are capable of pushing
  SR solutions to the natural image manifold, we propose using GAN to tackle the problem of weather radar
  echo super-resolution to achieve better reconstruction performance (measured in peak signal-to-noise
  ratio (PSNR) and structural similarity index (SSIM)). Using authentic weather radar echo data, we present
  the experimental results and compare its reconstruction performance with the above-mentioned methods.
  The experimental results showed that the GAN-based method is capable of generating perceptually superior
  solutions while achieving higher PSNR/SSIM results.
