summary: Review of neural-network and complex-network approaches to El Nino prediction, reporting ML gains
  in skill beyond 12-month lead times over classical methods.
abstract: We review prediction efforts of El Ni\~no events in the tropical Pacific with particular focus
  on using modern machine learning (ML) methods based on artificial neural networks. With current classical
  prediction methods using both statistical and dynamical models, the skill decreases substantially for
  lead times larger than about 6 months. Initial ML results have shown enhanced skill for lead times larger
  than 12 months. The search for optimal attributes in these methods is described, in particular those
  derived from complex network approaches, and a critical outlook on further developments is given.
