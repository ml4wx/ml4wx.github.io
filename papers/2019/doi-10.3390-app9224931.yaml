summary: Compares random forest and gradient boosting for monthly rainfall prediction on Tenerife using
  station and reanalysis predictors over four decades.
abstract: We present a comparative study between predictive monthly rainfall models for islands of complex
  orography using machine learning techniques. The models have been developed for the island of Tenerife
  (Canary Islands). Weather forecasting is influenced both by the local geographic characteristics as
  well as by the time horizon comprised. Accuracy of mid-term rainfall prediction on islands with complex
  orography is generally low when carried out with atmospheric models. Predictive models based on algorithms
  such as Random Forest or Extreme Gradient Boosting among others were analyzed. The predictors used in
  the models include weather predictors measured in two main meteorological stations, reanalysis predictors
  from the National Oceanic and Atmospheric Administration, and the global predictor North Atlantic Oscillation,
  all of them obtained over a period of time of more than four decades. When comparing the proposed models,
  we evaluated accuracy, kappa and interpretability of the model obtained, as well as the relevance of
  the predictors used. The results show that global predictors such as the North Atlantic Oscillation
  Index (NAO) have a very low influence, while the local Geopotential Height (GPH) predictor is relatively
  more important. Machine learning prediction models are a relevant proposition for predicting medium-term
  precipitation in similar geographical regions.
