summary: Information-flow analysis of FLUXNET eddy-covariance sites with a neural network maps global
  land-atmosphere coupling, revealing hotspots and aridity dependence.
abstract: Abstract Feedbacks between atmospheric processes like precipitation and land surface fluxes
  including evapotranspiration are difficult to observe, but critical for understanding the role of the
  land surface in the Earth System. To quantify global surface-atmosphere feedbacks we use results of
  a process network (PN) applied to 251 eddy covariance sites from the LaThuile database to train a neural
  network across the global terrestrial surface. There is a strong land–atmosphere coupling between latent
  (LE) and sensible heat flux (H) and precipitation (P) during summer months in temperate regions, and
  between H and P during winter, whereas tropical rainforests show little coupling seasonality. Savanna,
  shrubland, and other semi-arid ecosystems exhibit strong responses in their coupling behavior based
  on water availability. Feedback couplings from surface fluxes to P peaks at aridity (P/potential evapotranspiration
  ETp) values near unity, whereas coupling with respect to clouds, inferred from reduced global radiation,
  increases as P/ETp approaches zero. Spatial patterns in feedback coupling strength are related to climatic
  zone and biome type. Information flow statistics highlight hotspots of (1) persistent land–atmosphere
  coupling in sub-Saharan Africa, (2) boreal summer coupling in the central and southwestern US, Brazil,
  and the Congo basin and (3) in the southern Andes, South Africa and Australia during austral summer.
  Our data-driven approach to quantifying land atmosphere coupling strength that leverages the global
  FLUXNET database and information flow statistics provides a basis for verification of feedback interactions
  in general circulation models and for predicting locations where land cover change will feedback to
  climate or weather.
