summary: Applies a temporal convolutional network with transfer learning to forecast offshore visibility
  at Haikou Station, improving 24 h forecast scores and beating the CUACE model on TS score by 0.16.
abstract: Visibility forecasting in offshore areas faces the problems of low observational data and complex
  weather. This paper proposes an intelligent prediction method of offshore visibility based on temporal
  convolutional network (TCN) and transfer learning to solve the problem. First, preprocess the visibility
  data sets of the source and target domains to improve the quality of the data. Then, build a model based
  on temporal convolutional network and transfer learning (TCN_TL) to learn the visibility data of the
  source domain. Finally, after transferring the knowledge learned from a large amount of data in the
  source domain, the model learns the small data set in the target domain. After completing the training,
  the model data of the European Mid-Range Weather Forecast Center (ECMWF) meteorological field were selected
  to test the model performance. The method proposed in this paper has achieved relatively good results
  in the visibility forecast of Qiongzhou Strait. Taking Haikou Station in the spring and winter of 2018
  as an example, the forecast error is significantly lower than that before the transfer learning, and
  the forecast score is increased by 0.11 within the 0-1 km level and the 24 h forecast period. Compared
  with the CUACE forecast results, the forecast error of TCN_TL is smaller than that of the former, and
  the TS score is improved by 0.16. The results show that under the condition of small data sets, transfer
  learning improves the prediction performance of the model, and TCN_TL performs better than other deep
  learning methods and CUACE.
