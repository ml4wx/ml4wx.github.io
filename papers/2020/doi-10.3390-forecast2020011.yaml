summary: A generative neural network nowcasts radar precipitation up to one hour ahead and beats optical-flow
  methods on five years of Japanese radar data.
abstract: In this article, a nowcasting technique for meteorological radar images based on a generative
  neural network is presented. This technique’s performance is compared with state-of-the-art optical
  flow procedures. Both methods have been validated using a public domain data set of radar images, covering
  an area of about 104 km2 over Japan, and a period of five years with a sampling frequency of five minutes.
  The performance of the neural network, trained with three of the five years of data, forecasts with
  a time horizon of up to one hour, evaluated over one year of the data, proved to be significantly better
  than those obtained with the techniques currently in use.
