summary: Dual-channel CNN with multihead attention and residual connections improves radar-based local
  precipitation nowcasting, reaching state-of-the-art accuracy on a radar echo dataset.
abstract: Short-term precipitation forecast in local areas based on radar reflectance images has become
  a hot spot issue in the meteorological field, which has an important impact on daily life. Recently,
  deep learning techniques have been applied to this field, and the effect is promoted remarkably compared
  with traditional methods. However, existing deep learning-based methods have not considered the problem
  that different areas and channels exert different influence on precipitation. In this paper, we propose
  to incorporate the multihead attention into a dual-channel neural network to highlight the key areas
  for precipitation forecast. Furthermore, to solve the problem of excessive loss of global information
  caused by the attention mechanism, the residual connection is introduced into the proposed model. Quantitative
  and qualitative results demonstrate that the proposed method achieves the state-of-the-art precipitation
  forecast accuracy on the radar echo dataset.
