summary: Spatial quantile regression forests map rainfall erosivity in Greece using RCM projections to
  2100, with regional climate models validated against gauges.
abstract: 'A future variation of precipitation characteristics, due to climate change, will affect the
  ability of rainfall to precipitate soil loss. In this paper, the monthly and annual values of rainfall
  erosivity (R) in Greece are calculated, for the historical period 1971–2000, using precipitation records
  that suffer from a significant volume of missing values. In order to overcome the data limitations,
  an intermediate step is applied using the calculation of monthly erosivity density, which is more robust
  to the presence of missing values. Spatial Quantile Regression Forests, a data driven algorithm that
  imitates kriging without the need of strict statistical assumptions, was utilized and validated, in
  order to create maps of R and its uncertainty using error propagation. The monthly average precipitation
  for the historical period 1971–2000 estimated by five (5) Global Circulation Models-Regional Climatic
  Models were validated against observed values and the one with the best performance was used to estimate
  projected changes of R in Greece for the future time period 2011–2100 and two different greenhouse gases
  concentration scenarios. The main findings of this study are: (a) the mean annual R in Greece is 1039
  MJ·mm/ha/h/y, with a range between 405.1 and 3160.2 MJ·mm/ha/h/y. The highest values are calculated
  at the mountain range of Pindos and the lowest at central Greece; (b) the monthly R maps adhere to the
  spatiotemporal characteristics of precipitation depth and intensities over the country; (c) the projected
  R values, as an average over Greece, follow the projected changes of precipitation of climatic models,
  but not in a spatially homogenous way.'
