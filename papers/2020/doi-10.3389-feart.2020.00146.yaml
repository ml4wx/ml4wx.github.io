summary: SVM and BPNN downscale IMERG daily precipitation over Zhejiang; SVM raises R² from 0.344 to 0.615
  against gauges.
abstract: Precipitation estimates with high accuracy and fine spatial resolution play an important role
  in the field of meteorology, hydrology and ecology. In this study, Support Vector Machine (SVM) and
  Back Propagation Neural Network (BPNN) machine learning algorithms were used to downscale the Integrated
  Multi-satellitE Retrievals for Global Precipitation Measurement (GPM) (IMERG) data at daily scale through
  four events selected from 2017 and 2018 by establishing the relationships between precipitation and
  six environmental variables over Zhejiang, southeastern China. The downscaled results were validated
  by ground observations and we found that (1) generally, the SVM-based products had better performance
  and finer spatial textures compared with the BPNN-based products, the MLR-based products and the original
  IMERG; (2) all downscaled products decreased the degree of overestimation of the original IMERG at heavy
  precipitation regions to a certain extent; (3) for heavy precipitation events in plum rain season, the
  downscaled products based on SVM and BPNN both improved prediction accuracy compared to the MLR-based
  products and the original IMERG considering the validations against ground observations. R2 maximally
  increased from 0.344 to 0.615 for the SVM-based products and from 0.344 to 0.435 for the BPNN-based
  products compared to the original IMERG; (4) for typhoon precipitation events, the SVM-based products
  still showed better accuracy with R2 maximally increased from 0.492 to 0.615 compared to the original
  IMERG. While the performance of BPNN-based products was not satisfying and showed no significant differences
  with the performance of MLR-based products. This study provided a potential solution for generating
  downscaled satellite-based precipitation products at meteorological scales with finer accuracy and spatial
  resolutions.
