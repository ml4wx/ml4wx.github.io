summary: Machine-learning-constrained autoconversion and accretion parameterizations, fitted to Azores
  cloud-probe data, cut uncertainty to about 15% and 5% and reveal drizzle number's role.
abstract: We introduce new parameterizations for autoconversion and accretion rates that greatly improve
  representation of the growth processes of warm rain. The new parameterizations capitalize on machine-learning
  and optimization techniques and are constrained by in situ cloud probe measurements from the recent
  Atmospheric Radiation Measurement Program field campaign at Azores. The uncertainty in the new estimates
  of autoconversion and accretion rates is about 15% and 5%, respectively, outperforming existing parameterizations.
  Our results confirm that cloud and drizzle water content are the most important factors for determining
  accretion rates. However, for autoconversion, in addition to cloud water content and droplet number
  concentration, we discovered a key role of drizzle number concentration that is missing in current parameterizations.
  The robust relation between autoconversion rate and drizzle number concentration is surprising but real,
  and furthermore supported by theory. Thus, drizzle number concentration should be considered in parameterizations
  for improved representation of the autoconversion process.
