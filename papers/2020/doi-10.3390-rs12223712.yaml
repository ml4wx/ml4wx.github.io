summary: Random forest models using FLUXNET, reanalysis and LAI explain 53–90% of global latent and sensible
  heat flux variance, linking contrasting flux trends mainly to rising CO2.
abstract: 'As two competitive pathways of surface energy partitioning, latent (LE) and sensible (H) heat
  fluxes are expected to be strongly influenced by climate change and wide spread of global greening in
  recent several decades. Quantifying the surface energy fluxes (i.e., LE and H) variations and controlling
  factors is still a challenge because of the discrepancy in existing models, parameterizations, as well
  as driven datasets. In this study, we assessed the ability of random forest (RF, a machine learning
  method) and further predicted the global surface energy fluxes (i.e., LE and H) by combining FLUXNET
  observations, climate reanalysis and satellite-based leaf area index (LAI). The results show that the
  surface energy fluxes variations can be highly explained by the established RF models. The coefficient
  of determination (R2) ranges from 0.66 to 0.89 for the LE, and from 0.53 to 0.90 for the H across 10
  plant functional types (PFTs), respectively. Meanwhile, the root mean square error (RMSE) ranges from
  12.20 W/m2 to 21.94 W/m2 for the LE and from 12.05 W/m2 to 22.34 W/m2 for the H at a monthly scale,
  respectively. The important influencing factors in building RF models are divergent with respect to
  LE and H, but the solar radiation is common to both LE and H and to all 10 PFTs in this study. We also
  found a contrasting trend of LE and H: a positive trend in LE and a negative trend in H during 1982–2016
  and these contrasting trends are dominated by the elevated CO2 concentration level. Our study suggested
  an important role of the CO2 concentration in determining surface energy partitioning which is needed
  to be considered in future studies.'
