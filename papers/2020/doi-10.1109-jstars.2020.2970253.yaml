summary: CNN classifies storm versus non-storm satellite images for cyclone detection after augmentation,
  reporting 90% accuracy, with linear regression for track prediction.
abstract: Satellite images are primary data in weather prediction modeling. Deep learning-based approach,
  a viable candidate for automatic image processing, requires large sets of annotated data with diverse
  characteristics for training purposes. Accuracy of weather prediction improves with data having a relatively
  dense temporal resolution. We have employed interpolation and data augmentation techniques for enhancement
  of the temporal resolution and diversifications of characters in a given dataset. Algorithm requires
  classical approaches during preprocessing steps. Three optical flow methods using 14 different constraint
  optimization techniques and five error estimates are tested here. The artificially enriched data (optimal
  combination from the previous exercise) are used as a training set for a convolutional neural network
  to classify images in terms of storm or nonstorm. Several cyclone data (eight cyclone datasets of a
  different class) were used for training. A deep learning model is trained and tested with artificially
  densified and classified storm data for cyclone classification and locating the cyclone vortex giving
  minimum 90% and 84% accuracy, respectively. In the final step, we show that the linear regression method
  can be used for predicting the path.
