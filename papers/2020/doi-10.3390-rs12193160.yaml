summary: A deep neural network dynamic radiometric bias correction for ATMS radiances in MiRS improves
  temperature and humidity profile retrievals over ocean.
abstract: We present the development of a dynamic over-ocean radiometric bias correction for the Microwave
  Integrated Retrieval System (MiRS) which accounts for spatial, temporal, spectral, and angular dependence
  of the systematic differences between observed and forward model-simulated radiances. The dynamic bias
  correction, which utilizes a deep neural network approach, is designed to incorporate dependence on
  the atmospheric and surface conditions that impact forward model biases. The approach utilizes collocations
  of observed Suomi National Polar-orbiting Partnership/Advanced Technology Microwave Sounder (SNPP/ATMS)
  radiances and European Centre for Medium-Range Weather Forecasts (ECMWF) model analyses which are used
  as input to the Community Radiative Transfer Model (CRTM) forward model to develop training data of
  radiometric biases. Analysis of the neural network performance indicates that in many channels, the
  dynamic bias is able to reproduce realistically both the spatial patterns of the original bias and its
  probability distribution function. Furthermore, retrieval impact experiments on independent data show
  that, compared with the baseline static bias correction, using the dynamic bias correction can improve
  temperature and water vapor profile retrievals, particularly in regions with higher Cloud Liquid Water
  (CLW) amounts. Ocean surface emissivity retrievals are also improved, for example at 23.8 GHz, showing
  an increase in correlation from 0.59 to 0.67 and a reduction of standard deviation from 0.035 to 0.026.
