summary: Neural network maps GDAS numerical weather data to photovoltaic power output at an Italian plant
  with under 10% error, even without local weather measurements.
abstract: The monitoring of power generation installations is key for modelling and predicting their future
  behaviour. Many renewable energy generation systems, such as photovoltaic panels and wind turbines,
  strongly depend on weather conditions. However, in situ measurements of relevant weather variables are
  not always taken into account when designing monitoring systems, and only power output is available.
  This paper aims to combine data from a Numerical Weather Prediction model with machine learning tools
  in order to accurately predict the power generation from a photovoltaic system. An Artificial Neural
  Network (ANN) model is used to predict power outputs from a real installation located in Puglia (southern
  Italy) using temperature and solar irradiation data taken from the Global Data Assimilation System (GDAS)
  sflux model outputs. Power outputs and weather monitoring data from the PV installation are used as
  a reference dataset. Three training and testing scenarios are designed. In the first one, weather data
  monitoring is used to both train the ANN model and predict power outputs. In the second one, training
  is done with monitoring data, but GDAS data is used to predict the results. In the last set, both training
  and result prediction are done by feeding GDAS weather data into the ANN model. The results show that
  the tested numerical weather model can be combined with machine learning tools to model the output of
  PV systems with less than 10% error, even when in situ weather measurements are not available.
