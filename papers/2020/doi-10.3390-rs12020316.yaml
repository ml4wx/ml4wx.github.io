summary: DeepCTC neural network classifies cloud types from GOES-16 ABI imagery using CloudSat labels
  and evaluates PERSIANN-CCS precipitation by cloud type against MRMS.
abstract: Satellite remote sensing plays a pivotal role in characterizing hydrometeorological components
  including cloud types and their associated precipitation. The Cloud Profiling Radar (CPR) on the Polar
  Orbiting CloudSat satellite has provided a unique dataset to characterize cloud types. However, data
  from this nadir-looking radar offers limited capability for estimating precipitation because of the
  narrow satellite swath coverage and low temporal frequency. We use these high-quality observations to
  build a Deep Neural Network Cloud-Type Classification (DeepCTC) model to estimate cloud types from multispectral
  data from the Advanced Baseline Imager (ABI) onboard the GOES-16 platform. The DeepCTC model is trained
  and tested using coincident data from both CloudSat and ABI over the CONUS region. Evaluations of DeepCTC
  indicate that the model performs well for a variety of cloud types including Altostratus, Altocumulus,
  Cumulus, Nimbostratus, Deep Convective and High clouds. However, capturing low-level clouds remains
  a challenge for the model. Results from simulated GOES-16 ABI imageries of the Hurricane Harvey event
  show a large-scale perspective of the rapid and consistent cloud-type monitoring is possible using the
  DeepCTC model. Additionally, assessments using half-hourly Multi-Radar/Multi-Sensor (MRMS) precipitation
  rate data (for Hurricane Harvey as a case study) show the ability of DeepCTC in identifying rainy clouds,
  including Deep Convective and Nimbostratus and their precipitation potential. We also use DeepCTC to
  evaluate the performance of the Precipitation Estimation from Remotely Sensed Information using Artificial
  Neural Networks-Cloud Classification System (PERSIANN-CCS) product over different cloud types with respect
  to MRMS referenced at a half-hourly time scale for July 2018. Our analysis suggests that DeepCTC provides
  supplementary insights into the variability of cloud types to diagnose the weakness and strength of
  near real-time GEO-based precipitation retrievals. With additional training and testing, we believe
  DeepCTC has the potential to augment the widely used PERSIANN-CCS algorithm for estimating precipitation.
