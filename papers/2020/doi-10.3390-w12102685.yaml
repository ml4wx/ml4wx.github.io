summary: A 3D-CNN on surrounding atmosphere and ocean fields predicts 24 h tropical cyclone intensity
  change, improving MAE and intensification classification accuracy.
abstract: Tropical cyclone (TC) motion has an important impact on both human lives and infrastructure.
  Predicting TC intensity is crucial, especially within the 24 h warning time. TC intensity change prediction
  can be regarded as a problem of both regression and classification. Statistical forecasting methods
  based on empirical relationships and traditional numerical prediction methods based on dynamical equations
  still have difficulty in accurately predicting TC intensity. In this study, a prediction algorithm for
  TC intensity changes based on deep learning is proposed by exploring the joint spatial features of three-dimensional
  (3D) environmental conditions that contain the basic variables of the atmosphere and ocean. These features
  can also be interpreted as fused characteristics of the distributions and interactions of these 3D environmental
  variables. We adopt a 3D convolutional neural network (3D-CNN) for learning the implicit correlations
  between the spatial distribution features and TC intensity changes. Image processing technology is also
  used to enhance the data from a small number of TC samples to generate the training set. Considering
  the instantaneous 3D status of a TC, we extract deep hybrid features from TC image patterns to predict
  24 h intensity changes. Compared to previous studies, the experimental results show that the mean absolute
  error (MAE) of TC intensity change predictions and the accuracy of the classification as either intensifying
  or weakening are both significantly improved. The results of combining features of high and low spatial
  layers confirm that considering the distributions and interactions of 3D environmental variables is
  conducive to predicting TC intensity changes, thus providing insight into the process of TC evolution.
