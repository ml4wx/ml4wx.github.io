summary: Deep CNN approach detects polar mesocyclones and polar lows in satellite mosaics, addressing
  class imbalance and scale filtering for satellite data.
abstract: Polar mesocyclones (PMCs) and their intense subclass polar lows (PLs) are relatively small atmospheric
  vortices that form mostly over the ocean in high latitudes. PLs can strongly influence deep ocean water
  formation since they are associated with strong surface winds and heat fluxes. Detection and tracking
  of PLs are crucial for understanding the climatological dynamics of PLs and for the analysis of their
  impacts on other components of the climatic system. At the same time, visual tracking of PLs is a highly
  time-consuming procedure that requires expert knowledge and extensive examination of source data. There
  are known procedures involving deep convolutional neural networks (DCNNs) for the detection of large-scale
  atmospheric phenomena in reanalysis data that demonstrate a high quality of detection. However, one
  cannot apply these procedures to satellite data directly since, unlike reanalyses, satellite products
  register all the scales of atmospheric vortices. It is also known that DCNNs were originally designed
  to be scale-invariant. This leads to the problem of filtering the scale of detected phenomena. There
  are other problems to be solved, such as a low signal-to-noise ratio of satellite data and an unbalanced
  number of negative (without PLs) and positive (where a PL is presented) classes in a satellite dataset.
  In our study, we propose a deep learning approach for the detection of PLs and PMCs in remote sensing
  data, which addresses class imbalance and scale filtering problems. We also outline potential solutions
  for other problems, along with promising improvements to the presented approach.
