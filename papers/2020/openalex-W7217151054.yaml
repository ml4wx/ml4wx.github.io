summary: Compares curve-fitting and soft computing models to predict India's annual average temperature;
  ML is only loosely central and the study is weak.
abstract: The burgeoning research in the fields of statistical has given rise to numerous weather prediction
  models. But the problem of accurately predicting or forecasting the weather still persists. Numerical
  weather prediction is taking the existing numerical data on weather conditions and applying machine
  learning algorithms on it to forecast the weather. If the assessment of weather cannot be selected properly,
  the prediction information becomes incorrect and this will create lots of the problem in the real life.
  Therefore selection of an appropriate technique for the purpose of forecasting is needed. Here the effort
  is to select the soft computing technique properly for the prediction of the futuristic annual average
  Temperature of India. Initially, the concepts of least square base linear equation, exponential, asymptotic
  , curvilinear , logarithm have been applied to optimize the error and the concept of soft computing
  model will be used for the further enhance of the error. Moreover, the same concept has been applied
  on the tested data to select the optimality of the model predicted model.
