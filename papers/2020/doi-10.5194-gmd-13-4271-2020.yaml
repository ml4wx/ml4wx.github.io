summary: Random forests and polynomial regression trained on Perdigão sonic anemometer data remove the
  MYNN bias in boundary-layer TKE dissipation and cut average error by up to 30%.
abstract: Abstract. Current turbulence parameterizations in numerical weather prediction models at the
  mesoscale assume a local equilibrium between production and dissipation of turbulence. As this assumption
  does not hold at fine horizontal resolutions, improved ways to represent turbulent kinetic energy (TKE)
  dissipation rate (ε) are needed. Here, we use a 6-week data set of turbulence measurements from 184
  sonic anemometers in complex terrain at the Perdigão field campaign to suggest improved representations
  of dissipation rate. First, we demonstrate that a widely used Mellor, Yamada, Nakanishi, and Niino (MYNN)
  parameterization of TKE dissipation rate leads to a large inaccuracy and bias in the representation
  of ε. Next, we assess the potential of machine-learning techniques to predict TKE dissipation rate from
  a set of atmospheric and terrain-related features. We train and test several machine-learning algorithms
  using the data at Perdigão, and we find that multivariate polynomial regressions and random forests
  can eliminate the bias MYNN currently shows in representing ε, while also reducing the average error
  by up to 30 %. Of all the variables included in the algorithms, TKE is the variable responsible for
  most of the variability of ε, and a strong positive correlation exists between the two. These results
  suggest further consideration of machine-learning techniques to enhance parameterizations of turbulence
  in numerical weather prediction models.
