summary: Studies how ANN parameter count and hidden-layer depth affect one-day-ahead maximum temperature
  forecasts at South Korean stations, with a five-layer, 49-parameter model giving the lowest RMSE.
abstract: Weather forecasting, especially that of extreme climatic events, has gained considerable attention
  among researchers due to their impacts on natural ecosystems and human life. The applicability of artificial
  neural networks (ANNs) in non-linear process forecasting has significantly contributed to hydro-climatology.
  The efficiency of neural network functions depends on the network structure and parameters. This study
  proposed a new approach to forecasting a one-day-ahead maximum temperature time series for South Korea
  to discuss the relationship between network specifications and performance by employing various scenarios
  for the number of parameters and hidden layers in the ANN model. Specifically, a different number of
  trainable parameters (i.e., the total number of weights and bias) and distinctive numbers of hidden
  layers were compared for system-performance effects. If the parameter sizes were too large, the root
  mean square error (RMSE) would be generally increased, and the model’s ability was impaired. Besides,
  too many hidden layers would reduce the system prediction if the number of parameters was high. The
  number of parameters and hidden layers affected the performance of ANN models for time series forecasting
  competitively. The result showed that the five-hidden layer model with 49 parameters produced the smallest
  RMSE at most South Korean stations.
