summary: Uses machine learning to improve winds-aloft forecasts and an uncertainty-aware routing method,
  aiming to cut flight time and aviation's climate impact.
abstract: Commercial aviation is one of the biggest contributors towards climate change. We propose to
  reduce environmental impact of aviation by considering solutions that would reduce the flight time.
  Specifically, we first consider improving winds aloft forecast so that flight planners could use better
  information to find routes that are efficient. Secondly, we propose an aircraft routing method that
  seeks to find the fastest route to the destination by considering uncertainty in the wind forecasts
  and then optimally trading-off between exploration and exploitation.
