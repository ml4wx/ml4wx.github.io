summary: Conditional GAN with a predictive learning module sharpens meteorological image forecasts, achieving
  14% better sharpness than the baseline.
abstract: Meteorological imagery prediction is an important and challenging problem for weather forecasting.
  It can also be seen as a video frame prediction problem that estimates future frames based on observed
  meteorological imageries. Despite it is a widely-investigated problem, it is still far from being solved.
  Current state-of-the-art deep learning based approaches mainly optimise the mean square error loss resulting
  in blurry predictions. We address this problem by introducing a Meteorological Predictive Learning GAN
  model (in short MPL-GAN) that utilises the conditional GAN along with the predictive learning module
  in order to handle the uncertainty in future frame prediction. Experiments on a real-world dataset demonstrate
  the superior performance of our proposed model. Our proposed model is able to map the blurry predictions
  produced by traditional mean square error loss based predictive learning methods back to their original
  data distributions, hence it is able to improve and sharpen the prediction. In particular, our MPL-GAN
  achieves an average sharpness of 52.82, which is 14% better than the baseline method. Furthermore, our
  model correctly detects the meteorological movement patterns that traditional unconditional GANs fail
  to do.
