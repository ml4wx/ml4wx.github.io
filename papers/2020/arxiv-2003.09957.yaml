summary: Road weather station network with ML that flags faulty sensor data and corrects physical road-ice
  forecasts, aiming to improve winter road safety.
abstract: In this paper, we present a monitoring system that allows increasing road safety by predicting
  ice formation. The system consists of a network of road weather stations and intelligence data processing
  program module. The results were achieved by combining physical models for forecasting road conditions
  based on measurements from stations and machine learning models for detecting incorrect data and forecast
  correction.
