summary: Artificial neural networks classify 500 hPa circulation patterns, showing the 2019 Greenland
  melt season was about five standard deviations anomalous in atmospheric persistence.
abstract: Abstract. Understanding the role of atmospheric circulation anomalies on the surface mass balance
  of the Greenland ice sheet (GrIS) is fundamental for improving estimates of its current and future contributions
  to sea level rise. Here, we show, using a combination of remote sensing observations, regional climate
  model outputs, reanalysis data and artificial neural networks, that unprecedented atmospheric conditions
  (1948–2019) occurring in the summer of 2019 over Greenland promoted new records or close-to-record values
  of SMB, runoff and snowfall. Specifically, runoff in 2019 ranked second within the 1948–2019 period
  (after 2012) and first in terms of surface mass balance negative anomaly for the hydrological year September
  1, 2018–August 31, 2019. Summer of 2019 was characterized by an exceptional persistence of anticyclonic
  conditions that, in conjunction with low albedo associated with reduced snowfall in summer, enhanced
  the melt-albedo feedback by promoting the absorption of solar radiation and favored advection of warm,
  moist air along the western portion of the ice sheet towards the North, where the surface melt has been
  the highest since 1948. The analysis of the frequency of daily 500 hPa geopotential heights obtained
  from artificial neural networks shows that the total number of days with the most frequent atmospheric
  pattern that characterized the summer of 2019 was 5 standard deviations above the 1981–2010 mean, confirming
  the exceptional nature of the 2019 season over Greenland.
