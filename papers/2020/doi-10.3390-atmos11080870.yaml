summary: Uses deep neural networks and multiple linear regression on Spark-based big-data infrastructure
  to predict typhoon rainfall at four Taiwan stations, with faster computation than standalone systems.
abstract: 'Situated in the main tracks of typhoons in the Northwestern Pacific Ocean, Taiwan frequently
  encounters disasters from heavy rainfall during typhoons. Accurate and timely typhoon rainfall prediction
  is an imperative topic that must be addressed. The purpose of this study was to develop a Hadoop Spark
  distribute framework based on big-data technology, to accelerate the computation of typhoon rainfall
  prediction models. This study used deep neural networks (DNNs) and multiple linear regressions (MLRs)
  in machine learning, to establish rainfall prediction models and evaluate rainfall prediction accuracy.
  The Hadoop Spark distributed cluster-computing framework was the big-data technology used. The Hadoop
  Spark framework consisted of the Hadoop Distributed File System, MapReduce framework, and Spark, which
  was used as a new-generation technology to improve the efficiency of the distributed computing. The
  research area was Northern Taiwan, which contains four surface observation stations as the experimental
  sites. This study collected 271 typhoon events (from 1961 to 2017). The following results were obtained:
  (1) in machine-learning computation, prediction errors increased with prediction duration in the DNN
  and MLR models; and (2) the system of Hadoop Spark framework was faster than the standalone systems
  (single I7 central processing unit (CPU) and single E3 CPU). When complex computation is required in
  a model (e.g., DNN model parameter calibration), the big-data-based Hadoop Spark framework can be used
  to establish highly efficient computation environments. In summary, this study successfully used the
  big-data Hadoop Spark framework with machine learning, to develop rainfall prediction models with effectively
  improved computing efficiency. Therefore, the proposed system can solve problems regarding real-time
  typhoon rainfall prediction with high timeliness and accuracy.'
