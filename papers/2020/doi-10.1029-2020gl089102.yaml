summary: Machine learning using satellite inner-core precipitation and outflow temperature beats the NHC
  operational rapid-intensification consensus, improving Peirce skill score by 12 to 138%.
abstract: Abstract Tropical cyclone (TC) intensity change is controlled by both environmental conditions
  and internal storm processes. We show that TC 24‐hr subsequent intensity change (DV24) is linearly correlated
  with the departures in satellite observations of inner‐core precipitation, ice water content, and outflow
  temperature from respective threshold values corresponding to neutral TCs of nearly constant intensity.
  The threshold values vary linearly with TC intensity. Using machine learning with the inner‐core precipitation
  and the predictors currently employed at the National Hurricane Center (NHC) for probabilistic rapid
  intensification (RI) forecast guidance, our model outperforms the NHC operational RI consensus in terms
  of the Peirce Skill Score for RI in the Atlantic basin during 2009–2014 by 37%, 12%, and 138% for DV24
  ≥ 25, 30, and 35 kt, respectively. Our probability of detection is 40%, 60%, and 200% higher than the
  operational RI consensus, while the false alarm ratio is only 4%, 7%, and 6% higher.
