summary: Spatiotemporal graph neural networks forecast ENSO at 1 and 3 months lead, outperforming state-of-the-art
  systems and modeling teleconnections more interpretably.
abstract: Deep learning-based models have recently outperformed state-of-the-art seasonal forecasting
  models, such as for predicting El Niño-Southern Oscillation (ENSO). However, current deep learning models
  are based on convolutional neural networks which are difficult to interpret and can fail to model large-scale
  atmospheric patterns called teleconnections. Hence, we propose the application of spatiotemporal Graph
  Neural Networks (GNN) to forecast ENSO at long lead times, finer granularity and improved predictive
  skill than current state-of-the-art methods. The explicit modeling of information flow via edges may
  also allow for more interpretable forecasts. Preliminary results are promising and outperform state-of-the
  art systems for projections 1 and 3 months ahead.
