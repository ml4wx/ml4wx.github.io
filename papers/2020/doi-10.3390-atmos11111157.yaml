summary: Applies the PredRNN++ video prediction model to São Paulo radar reflectivity sequences, forecasting
  up to 1 h ahead as a nowcasting aid.
abstract: Precipitation nowcasting can predict and alert for any possibility of abrupt weather changes
  which may cause both human and material risks. Most of the conventional nowcasting methods extrapolate
  weather radar echoes, but precipitation nowcasting is still a challenge, mainly due to rapid changes
  in meteorological systems and time required for numerical simulations. Recently video prediction deep
  learning (VPDL) algorithms have been applied in precipitation nowcasting. In this study, we use the
  VPDL PredRNN++ and sequences of radar reflectivity images to predict the future sequence of reflectivity
  images for up to 1-h lead time for São Paulo, Brazil. We also verify the feasibility for the continuous
  use of the VPDL model, providing the meteorologist with trends and forecasts in precipitation edges
  regardless of the weather event occurring. The results obtained confirm the potential of the VPDL model
  as an additional tool to assist nowcasting. Even though meteorological systems that trigger natural
  disasters vary by location, a general solution can contribute as a tool to assist decision-makers and
  consequently issue efficient alerts.
