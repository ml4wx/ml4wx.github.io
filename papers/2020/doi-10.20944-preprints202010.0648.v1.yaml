summary: PERSIANN-CWB uses a deeper convolutional autoencoder CNN on Himawari-8 infrared and water vapor
  channels, improving rainfall retrieval over Taiwan relative to the prior CNN version.
abstract: Rainfall retrieval using geostationary satellites provides critical means to the monitoring
  of extreme rainfall events. Using the relatively new Himawari 8 meteorological satellite with three
  times more channels than its predecessors, the deep learning framework of “convolutional autoencoder”
  (CAE) was applied to the extraction of cloud and precipitation features. The CAE method was incorporated
  into the Convolution Neural Network version of the PERSIANN precipitation retrieval that uses GOES satellites.
  By applying the CAE technique with the addition of Residual Blocks and other modifications of deep learning
  architecture, the presented derivation of PERSIANN operated at the Central Weather Bureau of Taiwan
  (referred to as PERSIANN-CWB) expands four extra convolution layers to fully use Himawari 8’s infrared
  and water vapor channels, while preventing degradation of accuracy caused by the deeper network. The
  development of PERSIANN-CWB was trained over Taiwan for its diverse weather systems and localized rainfall
  features, and the evaluation reveals an overall improvement from its CNN counterpart and superior performance
  over all other rainfall retrievals analyzed. Limitation of this model was found in the derivation of
  typhoon rainfall, an area requiring further research.
