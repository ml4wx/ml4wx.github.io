summary: Neural networks reproduce weak-constraint 4D-Var model error corrections in the operational ECMWF
  IFS and could extend correction to the whole atmospheric column.
abstract: Abstract Model error is one of the main obstacles to improved accuracy and reliability in numerical
  weather prediction (NWP) and climate prediction conducted with state‐of‐the‐art, comprehensive high‐resolution
  general circulation models. In a data assimilation framework, recent advances in the context of weak‐constraint
  4D‐Var have shown that it is possible to estimate and correct for a large fraction of systematic model
  error which develops in the stratosphere over short forecast ranges. The recent explosion of interest
  in machine learning/deep learning technologies has been driven by their remarkable success in disparate
  application areas. This raises the question of whether model error estimation and correction in operational
  NWP and climate prediction can also benefit from these techniques. In this work, we aim to start to
  give an answer to this question. Specifically, we show that artificial neural networks (ANNs) can reproduce
  the main results obtained with weak‐constraint 4D‐Var in the operational configuration of the IFS model
  of the European Centre for Medium‐Range Weather Forecasts (ECMWF). We show that the use of ANN models
  inside the weak‐constraint 4D‐Var framework has the potential to extend the applicability of the weak‐constraint
  methodology for model error correction to the whole atmospheric column. Finally, we discuss the potential
  and limitations of the machine learning/deep learning technologies in the core NWP tasks. In particular,
  we reconsider the fundamental constraints of a purely data‐driven approach to forecasting and provide
  a view on how to best integrate machine learning technologies within current data assimilation and forecasting
  methods.
