summary: Uses linear regression and support vector regression to attribute and predict Canberra's seasonal
  precipitation and temperature from ENSO, SAM and IOD drivers, with SVR reaching r=0.737 for precipitation.
abstract: Southeast Australia is frequently impacted by drought, requiring monitoring of how the various
  factors influencing drought change over time. Precipitation and temperature trends were analysed for
  Canberra, Australia, revealing decreasing autumn precipitation. However, annual precipitation remains
  stable as summer precipitation increased and the other seasons show no trend. Further, mean temperature
  increases in all seasons. These results suggest that Canberra is increasingly vulnerable to drought.
  Wavelet analysis suggests that the El-Niño Southern Oscillation (ENSO) influences precipitation and
  temperature in Canberra, although its impact on precipitation has decreased since the 2000s. Linear
  regression (LR) and support vector regression (SVR) were applied to attribute climate drivers of annual
  precipitation and mean maximum temperature (TMax). Important attributes of precipitation include ENSO,
  the southern annular mode (SAM), Indian Ocean Dipole (DMI) and Tasman Sea SST anomalies. Drivers of
  TMax included DMI and global warming attributes. The SVR models achieved high correlations of 0.737
  and 0.531 on prediction of precipitation and TMax, respectively, outperforming the LR models which obtained
  correlations of 0.516 and 0.415 for prediction of precipitation and TMax on the testing data. This highlights
  the importance of continued research utilising machine learning methods for prediction of atmospheric
  variables and weather pattens on multiple time scales.
