summary: An LSTM network maps climate-model meteorology to monthly wind power utilisation hours, giving
  medium- to long-term generation forecasts for power planning; the case study is limited.
abstract: Predicting wind power generation over the medium and long term is helpful for dispatching departments,
  as it aids in constructing generation plans and electricity market transactions. This study presents
  a monthly wind power generation forecasting method based on a climate model and long short-term memory
  (LSTM) neural network. A nonlinear mapping model is established between the meteorological elements
  and wind power monthly utilization hours. After considering the meteorological data (as predicted for
  the future) and new installed capacity planning, the monthly wind power generation forecast results
  are output. A case study shows the effectiveness of the prediction method.
