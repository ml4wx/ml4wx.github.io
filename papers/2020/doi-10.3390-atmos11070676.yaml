summary: Reviews machine learning for tropical cyclone genesis, track, intensity, rainfall, storm surge
  and numerical model improvement, highlighting opportunities and challenges.
abstract: Tropical cyclones have always been a concern of meteorologists, and there are many studies regarding
  the axisymmetric structures, dynamic mechanisms, and forecasting techniques from the past 100 years.
  This research demonstrates the ongoing progress as well as the many remaining problems. Machine learning,
  as a means of artificial intelligence, has been certified by many researchers as being able to provide
  a new way to solve the bottlenecks of tropical cyclone forecasts, whether using a pure data-driven model
  or improving numerical models by incorporating machine learning. Through summarizing and analyzing the
  challenges of tropical cyclone forecasts in recent years and successful cases of machine learning methods
  in these aspects, this review introduces progress based on machine learning in genesis forecasts, track
  forecasts, intensity forecasts, extreme weather forecasts associated with tropical cyclones (such as
  strong winds and rainstorms, and their disastrous impacts), and storm surge forecasts, as well as in
  improving numerical forecast models. All of these can be regarded as both an opportunity and a challenge.
  The opportunity is that at present, the potential of machine learning has not been completely exploited,
  and a large amount of multi-source data have also not been fully utilized to improve the accuracy of
  tropical cyclone forecasting. The challenge is that the predictable period and stability of tropical
  cyclone prediction can be difficult to guarantee, because tropical cyclones are different from normal
  weather phenomena and oceanographic processes and they have complex dynamic mechanisms and are easily
  influenced by many factors.
