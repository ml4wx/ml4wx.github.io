summary: NowDeepN ensemble of deep neural networks predicts future radar product values from past values,
  reaching under 4% normalised RMSE on Romanian radar data.
abstract: One of the hottest topics in today’s meteorological research is Weather nowcasting, which is
  the weather forecast for a short time period such as one to six hours. Radar is an important data source
  used by operational meteorologists for issuing nowcasting warnings. With the main goal of helping meteorologists
  in analysing radar data for issuing nowcasting warnings, we propose NowDeepN, a supervised learning
  based regression model which uses an ensemble of deep artificial neural networks for predicting the
  values for radar products at a certain time moment. The values predicted by NowDeepN may be used by
  meteorologists in estimating the future development of potential severe phenomena and would replace
  the time consuming process of extrapolating the radar echoes. NowDeepN is intended to be a proof of
  concept for the effectiveness of learning from radar data relevant patterns that would be useful for
  predicting future values for radar products based on their historical values. For assessing the performance
  of NowDeepN, a set of experiments on real radar data provided by the Romanian National Meteorological
  Administration is conducted. The impact of a data cleaning step introduced for correcting the erroneous
  radar products’ values is investigated both from the computational and meteorological perspectives.
  The experimental results also indicate the relevance of the features considered in the supervised learning
  task, highlighting that the radar products’ values at a certain geographical location at a time moment
  may be predicted from the products’ values from a neighboring area of that location at previous time
  moments. An overall Normalized Root Mean Squared Error less than 4% was obtained for NowDeepN on the
  cleaned radar data. Compared to similar related work from the nowcasting literature, NowDeepN outperforms
  several approaches and this emphasizes the performance of our proposal.
