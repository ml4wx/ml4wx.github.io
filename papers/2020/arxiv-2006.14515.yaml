summary: POD combined with Kriging or Random Forest emulates Arome-NWC rainfall nowcasts over France at
  1-minute resolution with much lower computational cost.
abstract: 'Nowcasting (or short-term weather forecasting) is particularly important in the case of extreme
  events as it helps prevent human losses. Many of our activities, however, also depend on the weather.
  Therefore, nowcasting has shown to be useful in many different domains. Currently, immediate rainfall
  forecasts in France are calculated using the Arome-NWC model developed by Météo-France, which is a complex
  physical model. Arome-NWC forecasts are stored with a 15 minute time interval. A higher time resolution
  is, however, desirable for other meteorological applications. Complex model calculations, such as Arome-NWC,
  can be very expensive and time consuming. A surrogate model aims at producing results which are very
  close to the ones obtained using a complex model, but with largely reduced calculation times. Building
  a surrogate model requires only a few calculations with the real model. Once the surrogate model is
  built, further calculations can be quickly realized. In this study, we propose to build surrogate models
  for immediate rainfall forecasts with two different approaches: combining Proper Orthogonal Decomposition
  (POD) and Kriging, or combining POD and Random Forest (RF). We show that results obtained with our surrogate
  models are not only close to the ones obtained by Arome-NWC, but they also have a higher time resolution
  (1 minute) with a reduced calculation time.'
