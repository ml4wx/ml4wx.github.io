summary: XGBoost corrects KMA quantitative precipitation forecasts for heavy rain in Seoul, cutting MAE
  by up to about 30% at some sites.
abstract: 'This study aimed to enhance the accuracy of extreme rainfall forecast, using a machine learning
  technique for forecasting hydrological impact. In this study, machine learning with XGBoost technique
  was applied for correcting the quantitative precipitation forecast (QPF) provided by the Korea Meteorological
  Administration (KMA) to develop a hydrological quantitative precipitation forecast (HQPF) for flood
  inundation modeling. The performance of machine learning techniques for HQPF production was evaluated
  with a focus on two cases: one for heavy rainfall events in Seoul and the other for heavy rainfall accompanied
  by Typhoon Kong-rey (1825). This study calculated the well-known statistical metrics to compare the
  error derived from QPF-based rainfall and HQPF-based rainfall against the observational data from the
  four sites. For the heavy rainfall case in Seoul, the mean absolute errors (MAE) of the four sites,
  i.e., Nowon, Jungnang, Dobong, and Gangnam, were 18.6 mm/3 h, 19.4 mm/3 h, 48.7 mm/3 h, and 19.1 mm/3
  h for QPF and 13.6 mm/3 h, 14.2 mm/3 h, 33.3 mm/3 h, and 12.0 mm/3 h for HQPF, respectively. These results
  clearly indicate that the machine learning technique is able to improve the forecasting performance
  for localized rainfall. In addition, the HQPF-based rainfall shows better performance in capturing the
  peak rainfall amount and spatial pattern. Therefore, it is considered that the HQPF can be helpful to
  improve the accuracy of intense rainfall forecast, which is subsequently beneficial for forecasting
  floods and their hydrological impacts.'
