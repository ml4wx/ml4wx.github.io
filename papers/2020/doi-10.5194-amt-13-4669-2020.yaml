summary: XGBoost corrects MAIAC satellite column water vapor errors, cutting RMSE by 26.9% for Terra and
  16.5% for Aqua against AERONET sites.
abstract: Abstract. The atmospheric products of the Multi-Angle Implementation of Atmospheric Correction
  (MAIAC) algorithm include column water vapor (CWV) at 1 km resolution, derived from daily overpasses
  of NASA’s Moderate Resolution Imaging Spectroradiometer (MODIS) instruments aboard the Aqua and Terra
  satellites. We have recently shown that machine learning using extreme gradient boosting (XGBoost) can
  improve the estimation of MAIAC aerosol optical depth (AOD). Although MAIAC CWV is generally well validated
  (Pearson’s R > 0.97 versus CWV from AERONET sun photometers), it has not yet been assessed whether machine-learning
  approaches can further improve CWV. Using a novel spatiotemporal cross-validation approach to avoid
  overfitting, our XGBoost model with nine features derived from land use terms, date, and ancillary variables
  from the MAIAC retrieval, quantifies and can correct a substantial portion of measurement error relative
  to collocated measures at AERONET sites (26.9 % and 16.5 % decrease in Root Mean Square Error (RMSE)
  for Terra and Aqua datasets, respectively) in the Northeastern USA, 2000–2015. We use machine-learning
  interpretation tools to illustrate complex patterns of measurement error and describe a positive bias
  in MAIAC Terra CWV worsening in recent summertime conditions. We validate our predictive model on MAIAC
  CWV estimates at independent stations from the SuomiNet GPS network where our corrections decrease the
  RMSE by 19.7 % and 9.5 % for Terra and Aqua MAIAC CWV. Empirically correcting for measurement error
  with machine-learning algorithms is a post-processing opportunity to improve satellite-derived CWV data
  for Earth science and remote sensing applications.
