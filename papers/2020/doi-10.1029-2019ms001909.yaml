summary: Differentiable versions of probability of detection and false alarm rate let neural precipitation
  forecasts be trained directly on categorical skill scores.
abstract: Abstract This work introduces a methodology for optimizing neural network models using a combination
  of continuous and categorical binary indices in the context of precipitation forecasting. Probability
  of detection and false alarm rate are popular metrics used in the verification of precipitation models.
  However, machine learning models trained using gradient descent cannot be optimized based on these metrics,
  as they are not differentiable. We propose an alternative formulation for these categorical indices
  that are differentiable and we demonstrate how they can be used to optimize the skill of precipitation
  neural network models defined as a multiobjective optimization problem. To our knowledge, this is the
  first proposal of a methodology for optimizing weather neural network models based on categorical indices.
