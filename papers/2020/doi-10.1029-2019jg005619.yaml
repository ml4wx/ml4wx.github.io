summary: Combines an emergent constraint with machine learning to narrow CMIP5 end-of-century GPP to 171
  ± 12 Gt C/yr and reduce gridded projection uncertainty.
abstract: Abstract The terrestrial biosphere is currently slowing down global warming by absorbing about
  30% of human emissions of carbon dioxide (CO2). The largest flux of the terrestrial carbon uptake is
  gross primary production (GPP) defined as the production of carbohydrates by photosynthesis. Elevated
  atmospheric CO2concentration is expected to increase GPP (“CO2fertilization effect”). However, Earth
  system models (ESMs) exhibit a large range in simulated GPP projections. In this study, we combine an
  existing emergent constraint on CO2fertilization with a machine learning approach to constrain the spatial
  variations of multimodel GPP projections. In a first step, we use observed changes in the CO2seasonal
  cycle at Cape Kumukahi to constrain the global mean GPP at the end of the 21st century (2091–2100) in
  Representative Concentration Pathway 8.5 simulations with ESMs participating in the Coupled Model Intercomparison
  Project Phase 5 (CMIP5) to 171 ± 12 Gt C yr−1, compared to the unconstrained model range of 156–247
  Gt C yr−1. In a second step, we use a machine learning model to constrain gridded future absolute GPP
  and gridded fractional GPP change in two independent approaches. For this, observational data are fed
  into the machine learning algorithm that has been trained on CMIP5 data to learn relationships between
  present‐day physically relevant diagnostics and the target variable. In a leave‐one‐model‐out cross‐validation
  approach, the machine learning model shows superior performance to the CMIP5 ensemble mean. Our approach
  predicts an increased GPP change in northern high latitudes compared to regions closer to the equator.
