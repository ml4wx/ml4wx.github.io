summary: NOAA workshop outlook identifying opportunities for AI to exploit satellite and in situ observations
  for numerical weather prediction and broader Earth science, with recommendations.
abstract: Abstract Promising new opportunities to apply artificial intelligence (AI) to the Earth and
  environmental sciences are identified, informed by an overview of current efforts in the community.
  Community input was collected at the first National Oceanic and Atmospheric Administration (NOAA) workshop
  on “Leveraging AI in the Exploitation of Satellite Earth Observations and Numerical Weather Prediction”
  held in April 2019. This workshop brought together over 400 scientists, program managers, and leaders
  from the public, academic, and private sectors in order to enable experts involved in the development
  and adaptation of AI tools and applications to meet and exchange experiences with NOAA experts. Paths
  are described to actualize the potential of AI to better exploit the massive volumes of environmental
  data from satellite and in situ sources that are critical for numerical weather prediction (NWP) and
  other Earth and environmental science applications. The main lessons communicated from community input
  via active workshop discussions and polling are reported. Finally, recommendations are presented for
  both scientists and decision-makers to address some of the challenges facing the adoption of AI across
  all Earth science.
