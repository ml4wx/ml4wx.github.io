summary: Support vector regression and random forest forecast the ENSO Modoki index 6 and 12 months ahead,
  with SVR performing better than RF.
abstract: The focus of this study is to evaluate the efficacy of Machine Learning (ML) algorithms in the
  long-lead prediction of El Niño (La Niña) Modoki (ENSO Modoki) index (EMI). We evaluated two widely
  used non-linear ML algorithms namely Support Vector Regression (SVR) and Random Forest (RF) to forecast
  the EMI at various lead times, viz. 6, 12, 18 and 24 months. The predictors for the EMI are identified
  using Kendall's tau correlation coefficient between the monthly EMI index and the monthly anomalies
  of the slowly varying climate variables such as sea surface temperature (SST), sea surface height (SSH)
  and soil moisture content (SMC). The importance of each of the predictors is evaluated using the Supervised
  Principal Component Analysis (SPCA). The results indicate both SVR and RF to be capable of forecasting
  the phase of the EMI realistically at both 6-months and 12-months lead times though the amplitude of
  the EMI is underestimated for the strong events. The analysis also indicates the SVR to perform better
  than the RF method in forecasting the EMI.
