summary: Neural networks and NGBoost post-process SubX GEFS 2-m maximum temperature forecasts, beating
  EMOS by about 0.2 in CRPS over lead times of 1 to 35 days.
abstract: The extended range temperature prediction is of great importance for public health, energy and
  agriculture. The two machine learning methods, namely, the neural networks and natural gradient boosting
  (NGBoost), are applied to improve the prediction skills of the 2-m maximum air temperature with lead
  times of 1–35 days over East Asia based on the Environmental Modeling Center, Global Ensemble Forecast
  System (EMC-GEFS), under the Subseasonal Experiment (SubX) of the National Centers for Environmental
  Prediction (NCEP). The ensemble model output statistics (EMOS) method is conducted as the benchmark
  for comparison. The results show that all the post-processing methods can efficiently reduce the prediction
  biases and uncertainties, especially in the lead week 1–2. The two machine learning methods outperform
  EMOS by approximately 0.2 in terms of the continuous ranked probability score (CRPS) overall. The neural
  networks and NGBoost behave as the best models in more than 90% of the study area over the validation
  period. In our study, CRPS, which is not a common loss function in machine learning, is introduced to
  make probabilistic forecasting possible for traditional neural networks. Moreover, we extend the NGBoost
  model to atmospheric sciences of probabilistic temperature forecasting which obtains satisfying performances.
