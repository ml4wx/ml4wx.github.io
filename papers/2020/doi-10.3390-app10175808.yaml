summary: End-to-end CNN post-processing (MODL) of TIGGE ECMWF forecasts improves Tianjin 2 m temperature
  RMSE over ECMWF, MOS and other ML baselines, especially in the first three days.
abstract: In weather forecasting, numerical weather prediction (NWP) that is based on physical models
  requires proper post-processing before it can be applied to actual operations. Therefore, research on
  intelligent post-processing algorithms has always been an important topic in this field. This paper
  proposes a model output deep learning (MODL) method for post-processing, which can improve the forecast
  effect of numerical weather prediction. MODL is an end-to-end post-processing method based on deep convolutional
  neural network, which directly learns the mapping relationship between the forecast fields output by
  numerical model and the observation temperature field in order to obtain more accurate temperature forecasts.
  MODL modifies the existing deep convolution model according to the post-processing problem’s characteristics,
  thereby improving the performance of the weather forecast. This paper uses The International Grand Global
  Ensemble (TIGGE) dataset from European Centre for Medium-Range Weather Forecasts (ECMWF) and the observed
  air temperature of 2 m obtained from Tianjin meteorological station in order to test the post-processing
  performance of MODL. The MODL method applied to temperature in post-processing is compared with the
  ECMWF forecast, Model Output Statistics (MOS) methods, and Model Output Machine Learning (MOML) methods.
  The Root Mean Square Error (RMSE) of the temperature field predicted by MODL and the observed temperature
  field is smaller than the other models and the accuracy of the temperature difference of 2 °C (Acc)
  is higher, especially where the prediction time is in the first three days. The lightweight nature of
  MODL also makes it suitable for most operations.
