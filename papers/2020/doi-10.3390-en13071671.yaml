summary: Random forest cloud mask from GOES-16 radiances matches the operational GOES-R clear-sky product
  and aids solar irradiance forecasting.
abstract: In order for numerical weather prediction (NWP) models to correctly predict solar irradiance
  reaching the earth's surface for more accurate solar power forecasting, it is important to initialize
  the NWP model with accurate cloud information. Knowing where the clouds are located is the first step.
  Using data from geostationary satellites is an attractive possibility given the low latencies and high
  spatio-temporal resolution provided nowadays. Here, we explore the potential of utilizing the random
  forest machine learning method to generate the cloud mask from GOES-16 radiances. We first perform a
  predictor selection process to determine the optimal predictor set for the random forest predictions
  of the horizontal cloud fraction and then determine the appropriate threshold to generate the cloud
  mask prediction. The results show that the random forest method performs as well as the GOES-16 level
  2 clear sky mask product with the ability to customize the threshold for under or over predicting cloud
  cover. Further developments to enhance the cloud mask estimations for improved short-term solar irradiance
  and power forecasting with the MAD-WRF NWP model are discussed.
