summary: Artificial neural networks retrieve temperature and humidity profiles from FY-4 GIIRS hyperspectral
  radiances, outperforming a simulation-trained network and matching AIRS consistency.
abstract: 'This study proposes a new technique for retrieving temperature and humidity profiles based
  on Artificial Neural Networks (ANNs) using data acquired from the GIIRS (Geosynchronous Interferometric
  Infrared Sounder) L1 and ERA-Interim (European Centre for Medium-Range Weather Forecasts Reanalysis).
  The approach is also compared against another method that uses simulated data from the radiative transfer
  model to construct the retrieval network. Furthermore, the two methods of network construction are evaluated
  in the North China Plain for July and August 2018, for which ground validated observations concurrent
  to the satellite data were available. In summary, the results showed that: (1) the ANN built with the
  GIIRS L1 and the EC data is superior to that built with the forward simulation and EC data in retrieval
  accuracy; (2) the retrieval accuracy for the troposphere exceeds that for the stratosphere; (3) the
  root mean square errors (RMSEs) of the relative humidity in the troposphere as retrieved by the two
  ANNs are 6.003% and 10.608%, respectively; (4) a relatively low correlation (R) between the simulated
  and observed radiance of the GIIRS is found, ranging between 720 and 736.875 cm−1, and the correlation
  between the simulated and observed radiance of the water vapor channels exceeds that between the temperature
  channels; (5) compared with Atmospheric Infrared Sounder’s (AIRS’) products, our retrieved temperature
  profiles exhibit preferable consistency and the humidity retrievals also show an acceptable accuracy.
  Our study offers important insights towards improving our ability to retrieve atmospheric temperature
  and humidity profiles from the most sophisticated Earth Observation instruments such as the GIIRS of
  the FY-4 satellite, which could assist in expanding the use of those products globally.'
