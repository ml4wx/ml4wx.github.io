summary: CNN on polar-coordinate satellite images profiles full tropical cyclone structure parameters
  and wind profiles, with a new labeled benchmark dataset as baseline.
abstract: Convolutional neural networks (CNN) have achieved great success in analyzing tropical cyclones
  (TC) with satellite images in several tasks, such as TC intensity estimation. In contrast, TC structure,
  which is conventionally described by a few parameters estimated subjectively by meteorology specialists,
  is still hard to be profiled objectively and routinely. This study applies CNN on satellite images to
  create the entire TC structure profiles, covering all the structural parameters. By utilizing the meteorological
  domain knowledge to construct TC wind profiles based on historical structure parameters, we provide
  valuable labels for training in our newly released benchmark dataset. With such a dataset, we hope to
  attract more attention to this crucial issue among data scientists. Meanwhile, a baseline is established
  with a specialized convolutional model operating on polar-coordinates. We discovered that it is more
  feasible and physically reasonable to extract structural information on polar-coordinates, instead of
  Cartesian coordinates, according to a TC's rotational and spiral natures. Experimental results on the
  released benchmark dataset verified the robustness of the proposed model and demonstrated the potential
  for applying deep learning techniques for this barely developed yet important topic.
