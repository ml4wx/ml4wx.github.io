summary: A VAE trained on about 6 million high-resolution vertical velocity samples reconstructs convection
  and clusters organization regimes, supporting stochastic convection parameterizations.
abstract: While cloud-resolving models can explicitly simulate the details of small-scale storm formation
  and morphology, these details are often ignored by climate models for lack of computational resources.
  Here, we explore the potential of generative modeling to cheaply recreate small-scale storms by designing
  and implementing a Variational Autoencoder (VAE) that performs structural replication, dimensionality
  reduction, and clustering of high-resolution vertical velocity fields. Trained on ~6*10^6 samples spanning
  the globe, the VAE successfully reconstructs the spatial structure of convection, performs unsupervised
  clustering of convective organization regimes, and identifies anomalous storm activity, confirming the
  potential of generative modeling to power stochastic parameterizations of convection in climate models.
