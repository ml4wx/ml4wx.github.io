summary: A CNN trained on QPEns analyses approximates mass-conserving data assimilation at lower cost,
  matching QPEns error levels in an idealized setup.
abstract: Abstract. In previous work, it was shown that preservation of physical properties in the data
  assimilation framework can significantly reduce forecasting errors. Proposed data assimilation methods,
  such as the quadratic programming ensemble (QPEns) that can impose such constraints on the calculation
  of the analysis, are computationally more expensive, severely limiting their application to high dimensional
  prediction systems as found in earth sciences. In order to produce from a less computationally expensive,
  unconstrained analysis, a solution that is closer to the constrained analysis, we propose to use a convolutional
  neural network (CNN) trained on analyses produced by the QPEns. In this paper, we focus on conservation
  of mass and show in an idealized setup that the hybrid of a CNN and the ensemble Kalman filter is capable
  of reducing analysis and background errors to the same level as the QPEns. To obtain these positive
  results, it was in one case necessary to add a penalty term to the loss function of the CNN training
  process.
