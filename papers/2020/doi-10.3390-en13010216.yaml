summary: Kernel-density analogue ensemble forecasts PV output from weather forecasts in Portugal, beating
  a neural network in most cases and running 32 times faster.
abstract: A novel ensemble algorithm based on kernel density estimation (KDE) is proposed to forecast
  distributed generation (DG) from renewable energy sources (RES). The proposed method relies solely on
  publicly available historical input variables (e.g., meteorological forecasts) and the corresponding
  local output (e.g., recorded power generation). Given a new case (with forecasted meteorological variables),
  the resulting power generation is forecasted. This is performed by calculating a KDE-based similarity
  index to determine a set of most similar cases from the historical dataset. Then, the outputs of the
  most similar cases are used to calculate an ensemble prediction. The method is tested using historical
  weather forecasts and recorded generation of a PV installation in Portugal. Despite only being given
  averaged data as input, the algorithm is shown to be capable of predicting uncertainties associated
  with high frequency weather variations, outperforming deterministic predictions based on solar irradiance
  forecasts. Moreover, the algorithm is shown to outperform a neural network (NN) in most test cases while
  being exceptionally faster (32 times). Given that the proposed model only relies on public locally-metered
  data, it is a convenient tool for DG owners/operators to effectively forecast their expected generation
  without depending on private/proprietary data or divulging their own.
