summary: A multilayer perceptron outperforms ARIMA for daily rainfall forecasting at a single site, with
  lower MAE and RMSE and R of 0.94.
abstract: Rainfall is important in predicting weather forecast particularly to the agriculture sector
  and also in environment which gives great contribution towards the economy of the nation. Thus, it is
  important for the hydrologists to forecast daily rainfall in order to help the other people in the agriculture
  sector to proceed with their harvesting schedules accordingly and to make sure the results of their
  crops would be satisfying. This study is set to forecast the daily rainfall future value using ARIMA
  model and Artificial Neural Network (ANN) model. Both method is evaluated by using Mean Absolute Error
  (MAE), Mean Forecast Error (MFE), Root Mean Squared Error (RMSE) and coefficient of determination (R
  ). The results showed that ANN model has outperformed results than ARIMA model. The results also showed
  ANN has under-forecast the daily rainfall data by 2.21% compare to ARIMA with over-forecast of -3.34%.
  From this study, it shows that the ANN (6,4,1) model produces better results of MAE (8.4208), MFE (2.2188),
  RMSE (34.6740) and R (0.9432) compared to ARIMA model. This has proved that ANN model has outperformed
  ARIMA model in predicting daily rainfall values.
