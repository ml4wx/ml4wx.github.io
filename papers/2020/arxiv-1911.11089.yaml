summary: Interpretable satellite-derived convective structure features with logistic lasso classify tropical
  cyclone rapid intensity change, matching the accuracy of environmental predictors.
abstract: Abstract Tropical cyclones (TCs) rank among the most costly natural disasters in the United
  States, and accurate forecasts of track and intensity are critical for emergency response. Intensity
  guidance has improved steadily but slowly, as processes that drive intensity change are not fully understood.
  Because most TCs develop far from land-based observing networks, geostationary satellite imagery is
  critical to monitor these storms. However, these complex data can be challenging to analyze in real
  time, and off-the-shelf machine-learning algorithms have limited applicability on this front because
  of their “black box” structure. This study presents analytic tools that quantify convective structure
  patterns in infrared satellite imagery for overocean TCs, yielding lower-dimensional but rich representations
  that support analysis and visualization of how these patterns evolve during rapid intensity change.
  The proposed feature suite targets the global organization, radial structure, and bulk morphology (ORB)
  of TCs. By combining ORB and empirical orthogonal functions, we arrive at an interpretable and rich
  representation of convective structure patterns that serve as inputs to machine-learning methods. This
  study uses the logistic lasso, a penalized generalized linear model, to relate predictors to rapid intensity
  change. Using ORB alone, binary classifiers identifying the presence (vs absence) of such intensity-change
  events can achieve accuracy comparable to classifiers using environmental predictors alone, with a combined
  predictor set improving classification accuracy in some settings. More complex nonlinear machine-learning
  methods did not perform better than the linear logistic lasso model for current data.
