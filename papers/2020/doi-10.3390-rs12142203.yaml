summary: XGBoost retrieves rainfall from radar reflectivity at multiple elevation angles, beating Marshall-Palmer
  and regression baselines for typhoon rainfall in Taiwan.
abstract: The purpose of this study was to develop an optimal estimation model for rainfall rate retrievals
  using radar reflectivity, thereby gaining an effective grasp of rainfall information for disaster prevention
  uses. A process was designed for evaluating the optimal retrieval models using various dataset combinations
  with radar reflectivity and ground meteorological attributes. Various ground meteorological attributes
  (such as relative humidity, wind speed, precipitation, etc.) were obtained using the land-based weather
  stations affiliated with Taiwan’s Central Weather Bureau (CWB). This study used nine radar reflectivity
  provided by the Hualien weather surveillance radar station’s Volume Cover Pattern 21 system. The developed
  models are built using multiple machine learning algorithms, including linear regression (REG), support
  vector regression (SVR), and extreme gradient boosting (XGBoost), in addition to the Marshall–Palmer
  formula (MP). The study examined 14 typhoons that occurred from 2008 to 2017 at Chenggong station in
  southeast Taiwan, and Lanyu station in the outlying islands, and the top four major rainfall events
  were designated as test typhoons—Nanmadol (2011), Tembin (2012), Matmo (2014), and Nepartak (2016).
  The results indicated that for rainfall retrievals, radar reflectivity at a scanning (elevation) angle
  of 6.0° combined with ground meteorological attributes were the optimal input variables for the Chenggong
  station, whereas radar reflectivity at an elevation angle of 4.3° combined with ground meteorological
  attributes were optimal for the Lanyu station. In terms of model performance, XGBoost models had the
  lowest error index at Chenggong and Lanyu stations compared with MP, REG, and SVR models. XGBoost models
  at Lanyu station had the highest efficiency coefficient (0.903), and those at Chenggong station had
  the second highest (0.885). As a result, pairing the combination of optimal radar reflectivity and ground
  meteorological attributes, as verified by the evaluation process, with a high-efficiency algorithm (XGBoost)
  can effectively increase the accuracy of rainfall retrieval during typhoons.
