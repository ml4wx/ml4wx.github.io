summary: Graph neural network fuses wind farm power history with NWP inputs and multi-task learning to
  predict ultra-short-term power for all farms in a cluster.
abstract: Ultra-short-term wind power prediction is of great importance for the integration of renewable
  energy. It is the foundation of probabilistic prediction and even a slight increase in the prediction
  accuracy can exert significant improvement for the safe and economic operation of power systems. However,
  due to the complex spatiotemporal relationship and the intrinsic characteristic of nonlinear, randomness
  and intermittence, the prediction of regional wind farm clusters and each wind farm’s power is still
  a challenge. In this paper, a framework based on graph neural network and numerical weather prediction
  (NWP) is proposed for the ultra-short-term wind power prediction. First, the adjacent matrix of wind
  farms, which are regarded as the vertexes of a graph, is defined based on geographical distance. Second,
  two graph neural networks are designed to extract the spatiotemporal feature of historical wind power
  and NWP information separately. Then, these features are fused based on multi-modal learning. Third,
  to enhance the efficiency of prediction method, a multi-task learning method is adopted to extract the
  common feature of the regional wind farm cluster and it can output the prediction of each wind farm
  at the same time. The cases of a wind farm cluster located in Northeast China verified that the accuracy
  of a regional wind farm cluster power prediction is improved, and the time consumption increases slowly
  when the number of wind farms grows. The results indicate that this method has great potential to be
  used in large-scale wind farm clusters.
