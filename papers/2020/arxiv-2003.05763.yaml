summary: A CNN trained on 35 years of meteorological maps and visibility data forecasts severe haze occurrence
  in Singapore, beating a no-skill baseline but missing many haze events.
abstract: Severe haze or low visibility event caused by particulate pollution has become a serious environmental
  issue in Southeast Asia. A forecasting framework of such events based on deep convolutional neural networks
  has been developed. The framework has been trained using time sequential maps of up to 18 meteorological
  and hydrological variables alongside surface visibility data over past 35 years. In forecasting haze
  versus no-haze situations in Singapore, the trained machine has achieved a good overall accuracy that
  easily exceeds that of the no-skill blinded forecast based on haze occurrence frequency. However, the
  machine still produces a relatively high number of missing forecasts (false negative for haze events),
  likely owing to its lack of experience in identifying atypical patterns. Nevertheless, this effort has
  demonstrated a promising prospect of using deep learning algorithms to predict the occurrence of extreme
  environmental and weather events, and to advance knowledge about these still poorly known phenomena.
