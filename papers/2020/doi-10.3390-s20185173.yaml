summary: LSTM and MLP models use city-bus sensor data to monitor and forecast temperature, humidity and
  pressure one day ahead.
abstract: Accurate weather data are important for planning our day-to-day activities. In order to monitor
  and predict weather information, a two-phase weather management system is proposed, which combines information
  processing, bus mobility, sensors, and deep learning technologies to provide real-time weather monitoring
  in buses and stations and achieve weather forecasts through predictive models. Based on the sensing
  measurements from buses, this work incorporates the strengths of local information processing and moving
  buses for increasing the measurement coverage and supplying new sensing data. In Phase I, given the
  weather sensing data, the long short-term memory (LSTM) model and the multilayer perceptron (MLP) model
  are trained and verified using the data of temperature, humidity, and air pressure of the test environment.
  In Phase II, the trained learning model is applied to predict the time series of weather information.
  In order to assess the system performance, we compare the predicted weather data with the actual sensing
  measurements from the Environment Protection Administration (EPA) and Central Weather Bureau (CWB) of
  Taichung observation station to evaluate the prediction accuracy. The results show that the proposed
  system has reliable performance at weather monitoring and a good forecast for one-day weather prediction
  via the trained models.
