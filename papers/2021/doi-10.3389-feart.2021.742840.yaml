summary: GRU recurrent network statistically downscales WRF/MPI-ESM-LR RCP8.5 output to project Metro
  Vancouver daily temperature extremes to 2100, with warming near 3°C.
abstract: Evident climate change has been observed and projected in observation records and General Circulation
  Models (GCMs), respectively. This change is expected to reshape current seasonal variability; the degree
  varies between regions. High-resolution climate projections are thereby necessary to support further
  regional impact assessment. In this study, a gated recurrent unit-based recurrent neural network statistical
  downscaling model is developed to project future temperature change (both daily maximum temperature
  and minimum temperature) over Metro Vancouver, Canada. Three indexes (i.e., coefficient of determinant,
  root mean square error, and correlation coefficient) are estimated for model validation, indicating
  the developed model’s competitive ability to simulate the regional climatology of Metro Vancouver. Monthly
  comparisons between simulation and observation also highlight the effectiveness of the proposed downscaling
  method. The projected results (under one model set-up, WRF-MPI-ESM-LR, RCP 8.5) show that both maximum
  and minimum temperature will consistently increase between 2,035 and 2,100 over the 12 selected meteorological
  stations. By the end of this century, the daily maximum temperature and minimum temperature are expected
  to increase by an average of 2.91°C and 2.98°C. Nevertheless, with trivial increases in summer and significant
  rises in winter and spring, the seasonal variability will be reduced substantially, which indicates
  less energy requirement over Metro Vancouver. This is quite favorable for Metro Vancouver to switch
  from fossil fuel-based energy sources to renewable and clean forms of energy. Further, the cold extremes’
  frequency of minimum temperature will be reduced as expected; however, despite evident warming trend,
  the hot extremes of maximum temperature will become less frequent.
