summary: A neural network predicts weather conditions from Indian Meteorological Department station data,
  with performance reported on standard metrics only.
abstract: Abstract Prediction of weather condition is important to take efficient decisions. In general,
  the relationship between the input weather parameters and the output weather condition is non linear
  and predicting the weather conditions in non linear relationship posses challenging task. The traditional
  methods of weather prediction sometimes deviate in predicting the weather conditions due to non linear
  relationship between the input features and output condition. Motivated with this factor, we propose
  a neural networks based model for weather prediction. The superiority of the proposed model is tested
  with the weather data collected from Indian metrological Department (IMD). The performance of model
  is tested with various metrics..
