summary: A simple CNN estimates tropical cyclone intensity for Indian-basin storms, claimed to beat state-of-the-art
  methods with lower computation, with few quantitative details in the abstract.
abstract: The tropical cyclones in India is a common natural disaster happening every year.As per the
  statistics, about three cyclones hit India's east coast in the Bay of Bengal, which damaged human lives,
  crops and property.It is essential to predict the cyclones in advance to prevent and reduce huge damage.The
  techniques used are based on numerical models that require vast expertise and higher skill sets to achieve
  better prediction accuracy.The usage of Convolutional Neural Networks shall overcome various issues
  like domain knowledge, the scope for human errors.Hence, in this paper, we attempted to predict cyclone
  intensity using Convolutional Neural Networks by proposing a simple and robust architecture for Tropical
  Cyclone intensity estimation.The results yielded better performance than the state-of-the-art techniques
  with reduced computation time.
