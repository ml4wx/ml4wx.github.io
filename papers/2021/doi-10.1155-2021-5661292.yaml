summary: A distributed multitask deep network using climatic, geographic and physical features is proposed
  for typhoon track prediction; the abstract gives no quantitative gain.
abstract: Typhoons are common natural phenomena that often have disastrous aftermaths, particularly in
  coastal areas. Consequently, typhoon track prediction has always been an important research topic. It
  chiefly involves predicting the movement of a typhoon according to its history. However, the formation
  and movement of typhoons is a complex process, which in turn makes accurate prediction more complicated;
  the potential location of typhoons is related to both historical and future factors. Existing works
  do not fully consider these factors; thus, there is significant room for improving the accuracy of predictions.
  To this end, we presented a novel typhoon track prediction framework comprising complex historical features—climatic,
  geographical, and physical features—as well as a deep‐learning network based on multitask learning.
  We implemented the framework in a distributed system, thereby improving the training efficiency of the
  network. We verified the efficiency of the proposed framework on real datasets.
