summary: Random forest predicts Yangtze summer precipitation with 0.473 skill from December, outperforming
  eight climate models in several respects.
abstract: The middle and lower reaches of the Yangtze River valley (YRV), which are among the most densely
  populated regions in China, are subject to frequent flooding. In this study, the predictor importance
  analysis model was used to sort and select predictors, and five methods (multiple linear regression
  (MLR), decision tree (DT), random forest (RF), backpropagation neural network (BPNN), and convolutional
  neural network (CNN)) were used to predict the interannual variation of summer precipitation over the
  middle and lower reaches of the YRV. Predictions from eight climate models were used for comparison.
  Of the five tested methods, RF demonstrated the best predictive skill. Starting the RF prediction in
  December, when its prediction skill was highest, the 70-year correlation coefficient from cross validation
  of average predictions was 0.473. Using the same five predictors in December 2019, the RF model successfully
  predicted the YRV wet anomaly in summer 2020, although it had weaker amplitude. It was found that the
  enhanced warm pool area in the Indian Ocean was the most important causal factor. The BPNN and CNN methods
  demonstrated the poorest performance. The RF, DT, and climate models all showed higher prediction skills
  when the predictions start in winter than in early spring, and the RF, DT, and MLR methods all showed
  better prediction skills than the numerical climate models. Lack of training data was a factor that
  limited the performance of the machine learning methods. Future studies should use deep learning methods
  to take full advantage of the potential of ocean, land, sea ice, and other factors for more accurate
  climate predictions.
