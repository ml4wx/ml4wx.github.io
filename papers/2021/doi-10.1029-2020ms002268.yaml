summary: Neural-network emulators replace bin-microphysics warm-rain processes in a GCM, reproducing its
  climate behaviour at the control run's computational cost.
abstract: 'Abstract Clouds are critical for weather and climate prediction. The multiple scales of cloud
  processes make simulation difficult. Often models and measurements are used to develop empirical relationships
  for large‐scale models to be computationally efficient. Machine learning provides another potential
  tool to improve our empirical parameterizations of clouds. To explore these opportunities, we replace
  the warm rain formation process in a General Circulation Model (GCM) with a detailed treatment from
  a bin microphysical model that causes a 400% slowdown in the GCM. We analyze the changes in climate
  that result from the use of the bin microphysical calculation and find improvements in the rain onset
  and frequency of light rain compared to high resolution process models and observations. We also find
  a resulting change in the cloud feedback response of the model to warming, which will significantly
  impact the climate sensitivity. We then replace the bin microphysical model with several neural networks
  designed to emulate the autoconversion and accretion rates produced by the bin microphysical model.
  The neural networks are organized into two stages: the first stage identifies where tendencies will
  be nonzero (and the sign of the tendency), and the second stage predicts the magnitude of the autoconversion
  and accretion rates. We describe the risks of overfitting, extrapolation, and linearization by using
  perfect model experiments with and without the emulator. We can recover the solutions with the emulators
  in almost all respects, and get simulations that perform as the detailed model, but with the computational
  cost of the control simulation.'
