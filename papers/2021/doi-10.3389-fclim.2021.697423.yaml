summary: Ridge and lasso models using Niño3.4 give modest week 3-4 skill for US winter temperature, only
  slightly beating CFSv2 and climatology-based baselines.
abstract: 'This paper shows that skillful week 3–4 predictions of a large-scale pattern of 2 m temperature
  over the US can be made based on the Nino3.4 index alone, where skillful is defined to be better than
  climatology. To find more skillful regression models, this paper explores various machine learning strategies
  (e.g., ridge regression and lasso), including those trained on observations and on climate model output.
  It is found that regression models trained on climate model output yield more skillful predictions than
  regression models trained on observations, presumably because of the larger training sample. Nevertheless,
  the skill of the best machine learning models are only modestly better than ordinary least squares based
  on the Nino3.4 index. Importantly, this fact is difficult to infer from the parameters of the machine
  learning model because very different parameter sets can produce virtually identical predictions. For
  this reason, attempts to interpret the source of predictability from the machine learning model can
  be very misleading. The skill of machine learning models also are compared to those of a fully coupled
  dynamical model, CFSv2. The results depend on the skill measure: for mean square error, the dynamical
  model is slightly worse than the machine learning models; for correlation skill, the dynamical model
  is only modestly better than machine learning models or the Nino3.4 index. In summary, the best predictions
  of the large-scale pattern come from machine learning models trained on long climate simulations, but
  the skill is only modestly better than predictions based on the Nino3.4 index alone.'
