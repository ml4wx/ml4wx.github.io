summary: Position paper arguing AI in environmental sciences risks bias and injustice, with weather and
  climate examples; calls for responsible AI practice.
abstract: Given the growing use of Artificial Intelligence (AI) and machine learning (ML) methods across
  all aspects of environmental sciences, it is imperative that we initiate a discussion about the ethical
  and responsible use of AI. In fact, much can be learned from other domains where AI was introduced,
  often with the best of intentions, yet often led to unintended societal consequences, such as hard coding
  racial bias in the criminal justice system or increasing economic inequality through the financial system.
  A common misconception is that the environmental sciences are immune to such unintended consequences
  when AI is being used, as most data come from observations, and AI algorithms are based on mathematical
  formulas, which are often seen as objective. In this article, we argue the opposite can be the case.
  Using specific examples, we demonstrate many ways in which the use of AI can introduce similar consequences
  in the environmental sciences. This article will stimulate discussion and research efforts in this direction.
  As a community, we should avoid repeating any foreseeable mistakes made in other domains through the
  introduction of AI. In fact, with proper precautions, AI can be a great tool to help {\it reduce} climate
  and environmental injustice. We primarily focus on weather and climate examples but the conclusions
  apply broadly across the environmental sciences.
