summary: Improved CNN estimates hurricane intensity from infrared satellite imagery with 7.6-knot RMSE
  and adds VGG19-based post-disaster damage assessment.
abstract: The prediction of severe weather events such as hurricanes is always a challenging task in the
  history of climate research, and many deep learning models have been developed for predicting the severity
  of weather events. When a disastrous hurricane strikes a coastal region, it causes serious hazards to
  human life and habitats and also reflects a prodigious amount of economic losses. Therefore, it is necessary
  to build models to improve the prediction accuracy and to avoid such significant losses in all aspects.
  However, it is impractical to predict or monitor every storm formation in real time. Though various
  techniques exist for diagnosing the tropical cyclone intensity such as convolutional neural networks
  (CNN), convolutional auto-encoders, recurrent neural network (RNN), etc., there are some challenges
  involved in estimating the tropical cyclone intensity. This study emphasizes estimating the tropical
  cyclone intensity to identify the different categories of hurricanes and to perform post-disaster management.
  An improved deep convolutional neural network (CNN) model is used for predicting the weakest to strongest
  hurricanes with the intensity values using infrared satellite imagery data and wind speed data from
  HURDAT2 database. The model achieves a lower Root mean squared error (RMSE) value of 7.6 knots and a
  Mean squared error (MSE) value of 6.68 knots by adding the batch normalization and dropout layers in
  the CNN model. Further, it is crucial to predict and evaluate the post-disaster damage for implementing
  advance measures and planning for the resources. The fine-tuning of the pre-trained visual geometry
  group (VGG 19) model is accomplished to predict the extent of damage and to perform automatic annotation
  for the image using the satellite imagery data of Greater Houston. VGG 19 is also trained using video
  datasets for classifying various types of severe weather events and to annotate the weather event automatically.
  An accuracy of 98% is achieved for hurricane damage prediction and 97% accuracy for classifying severe
  weather events. The results proved that the proposed models for hurricane intensity estimation and its
  damage prediction enhances the learning ability, which can ultimately help scientists and meteorologists
  to comprehend the formation of storm events. Finally, the mitigation steps in reducing the hurricane
  risks are addressed.
