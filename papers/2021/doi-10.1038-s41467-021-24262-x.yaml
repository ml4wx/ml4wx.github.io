summary: Machine learning that accounts for model uncertainty detects a physically interpretable anthropogenic
  signal in extreme precipitation across all global observational datasets.
abstract: The intensification of extreme precipitation under anthropogenic forcing is robustly projected
  by global climate models, but highly challenging to detect in the observational record. Large internal
  variability distorts this anthropogenic signal. Models produce diverse magnitudes of precipitation response
  to anthropogenic forcing, largely due to differing schemes for parameterizing subgrid-scale processes.
  Meanwhile, multiple global observational datasets of daily precipitation exist, developed using varying
  techniques and inhomogeneously sampled data in space and time. Previous attempts to detect human influence
  on extreme precipitation have not incorporated model uncertainty, and have been limited to specific
  regions and observational datasets. Using machine learning methods that can account for these uncertainties
  and capable of identifying the time evolution of the spatial patterns, we find a physically interpretable
  anthropogenic signal that is detectable in all global observational datasets. Machine learning efficiently
  generates multiple lines of evidence supporting detection of an anthropogenic signal in global extreme
  precipitation.
