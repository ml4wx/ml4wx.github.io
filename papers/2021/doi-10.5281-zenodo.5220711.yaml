summary: Releases code and training data for a neural network radiation emulator in an NWP model, tied
  to improved forecast accuracy.
abstract: 'These files contain main source codes and datasets for the neural network (NN) radiation emulator
  (Song and Roh, 2021) as well as the compound parameterization (CP) of the NN emulator (Song et al.,
  2021). Song, H.-J., & Roh, S. (2021). Improved weather forecasting using neural network emulation for
  radiation parameterization. Journal of Advances in Modeling Earth Systems, 13, e2021MS002609, https://doi.org/10.1029/2021MS002609.
  Song, H.-J., Roh, S., & Park, H. (2021). Compound parameterization to improve the accuracy of radiation
  emulator in a numerical weather prediction model. Geophysical Research Letters, 48, e2021GL095043, https://doi.org/10.1029/2021GL095043.
  Also, you can download the "tr.tar: training sets for NN radiation emulator and CP" and "met.tar: WPS
  metgrid files based on ERA5 reanalysis data". Monthly separated datasets are available in other Zenodo
  pages. See readme (in src.zip) for more information. tr.tar (339GB): https://drive.google.com/file/d/1BIIzU6KdSKj6i1pFdgCayTiwrHuQUApo/view?usp=sharing
