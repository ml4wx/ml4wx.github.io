summary: Hybrid LSTM and genetic programming model forecasts short-term global solar radiation from weather
  station data, with improved accuracy over stacking baselines.
abstract: 'The integration of solar energy in smart grids and other utilities is continuously increasing
  due to its economic and environmental benefits. However, the uncertainty of available solar energy creates
  challenges regarding the stability of the generated power the supply-demand balance’s consistency. An
  accurate global solar radiation (GSR) prediction model can ensure overall system reliability and power
  generation scheduling. This article describes a nonlinear hybrid model based on Long Short-Term Memory
  (LSTM) models and the Genetic Programming technique for short-term prediction of global solar radiation.
  The LSTMs are Recurrent Neural Network (RNN) models that are successfully used to predict time-series
  data. We use these models as base predictors of GSR using weather and solar radiation (SR) data. Genetic
  programming (GP) is an evolutionary heuristic computing technique that enables automatic search for
  complex solution formulas. We use the GP in a post-processing stage to combine the LSTM models’ outputs
  to find the best prediction of the GSR. We have examined two versions of the GP in the proposed model:
  a standard version and a boosted version that incorporates a local search technique. We have shown an
  improvement in terms of performance provided by the proposed hybrid model. We have compared its performance
  to stacking techniques based on machine learning for combination. The results show that the suggested
  method provides significant improvement in terms of performance and consistency.'
