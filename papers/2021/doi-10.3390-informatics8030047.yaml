summary: A bagging framework combining KNN, SVM, DNN and LSTM engines forecasts regional rainfall in Upstate
  New York, with SVM and KNN best for classification.
abstract: Regional rainfall forecasting is an important issue in hydrology and meteorology. Machine learning
  algorithms especially deep learning methods have emerged as a part of prediction tools for regional
  rainfall forecasting. This paper aims to design and implement a generic computing framework that can
  assemble a variety of machine learning algorithms as computational engines for regional rainfall forecasting
  in Upstate New York. The algorithms that have been bagged in the computing framework include the classical
  algorithms and the state-of-the-art deep learning algorithms, such as K-Nearest Neighbors, Support Vector
  Machine, Deep Neural Network, Wide Neural Network, Deep and Wide Neural Network, Reservoir Computing,
  and Long Short Term Memory methods. Through the experimental results and the performance comparisons
  of these various engines, we have observed that the SVM- and KNN-based method are outstanding models
  over other models in classification while DWNN- and KNN-based methods outstrip other models in regression,
  particularly those prevailing deep-learning-based methods, for handling uncertain and complex climatic
  data for precipitation forecasting. Meanwhile, the normalization methods such as Z-score and Minmax
  are also integrated into the generic computing framework for the investigation and evaluation of their
  impacts on machine learning models.
