summary: Two machine-learning and statistical up-scaling methods for convection-permitting ensemble rainfall
  forecasts reduce the double-penalty problem and improve severe-weather forecast skill.
abstract: Convection-permitting weather forecasting models allow for prediction of rainfall events with
  increasing levels of detail. However, the high resolutions used can create problems and introduce the
  so-called “double penalty” problem when attempting to verify the forecast accuracy. Post-processing
  within an ensemble prediction system can help to overcome these issues. In this paper, two new up-scaling
  algorithms based on Machine Learning and Statistical approaches are proposed and tested. The aim of
  these tools is to enhance the skill and value of the forecasts and to provide a better tool for forecasters
  to predict severe weather.
