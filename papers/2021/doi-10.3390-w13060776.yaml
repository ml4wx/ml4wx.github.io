summary: LSTM post-processes MAPLE radar nowcasts for 180-minute rainfall at 13 urban stations in South
  Korea, outperforming MLR, MARS, MLP and basic RNN baselines.
abstract: Radar-based rainfall forecasts are widely used extrapolation algorithms that are popular in
  systems of precipitation for predicting up to six hours in lead time. Nevertheless, the reliability
  of rainfall forecasts gradually declines for heavy rain events with lead time due to the lack of predictability.
  Recently, data-driven approaches were commonly implemented in hydrological problems. In this research,
  the data-driven models were developed based on the data obtained from a radar forecasting system named
  McGill Algorithm for Precipitation nowcasting by Lagrangian Extrapolation (MAPLE) and ground rain gauges.
  The data included thirteen urban stations in the five metropolitan cities located in South Korea. The
  twenty-five data points of MAPLE surrounding each rain station were utilized as the model input, and
  the observed rainfall at the corresponding gauges were used as the model output. The results showed
  superior capabilities of long short-term memory (LSTM) network in improving 180-min rainfall forecasts
  at the stations based on a comparison of five different data-driven models, including multiple linear
  regression (MLR), multivariate adaptive regression splines (MARS), multi-layer perceptron (MLP), basic
  recurrent neural network (RNN), and LSTM. Although the model still produced an underestimation of extreme
  rainfall values at some examined stations, this study proved that the LSTM could provide reliable performance.
  This model can be an optional method for improving rainfall forecasts at the stations for urban basins.
