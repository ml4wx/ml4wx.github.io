summary: A feedforward neural network grid model of GNSS weighted mean temperature over China improves
  on GPT2w-Tm by about 8.6–10.9% in validation.
abstract: Abstract Weighted mean temperature (Tm) is a key parameter in Global Navigation Satellite System
  meteorology. In this study, European Centre for Medium‐Range Weather Forecasts Re‐Analysis product with
  a spatial resolution of 0.5° × 0.5° from 1999 to 2018 was used to study the spatiotemporal behaviors
  of Tm in China. Decomposed by Fast Fourier Transformation, Tm and lapse rate (β) variations are highly
  latitude‐dependent and exhibit periodicities on annual, semi‐annual, and diurnal scales. Meanwhile,
  Tm keeps increasing at a rate of 0.25 K per decade across China. Based on these discoveries, this study
  build a new grid Tm model based on feedforward neural network (FNN) with a spatial resolution of 0.5°
  × 0.5°, known as Grid‐FNN model. FNN is applied to each grid point to compensate the residual error
  of the corresponding periodic functions. And the fitting accuracy at each grid is improved by the FNN
  algorithm. ERA‐Interim product with a spatial resolution of 0.4° × 0.4° and Radiosonde data in 2018
  are used to validate the new model, and the accuracy of Grid‐FNN model is proved 8.6% and 10.9% better
  than GPT2w‐Tm model, respectively. The Grid‐FNN model also shows better performance than IGPT2w, GTm‐III,
  and GTrop model in autumn and winter and in high‐altitude regions.
