summary: Benchmarks ESRGAN, EDSR and PhIREGAN for super-resolving NWP wind and solar fields, and releases
  an ML-ready dataset for renewable forecasting.
abstract: The transition to green energy grids depends on detailed wind and solar forecasts to optimize
  the siting and scheduling of renewable energy generation. Operational forecasts from numerical weather
  prediction models, however, only have a spatial resolution of 10 to 20-km, which leads to sub-optimal
  usage and development of renewable energy farms. Weather scientists have been developing super-resolution
  methods to increase the resolution, but often rely on simple interpolation techniques or computationally
  expensive differential equation-based models. Recently, machine learning-based models, specifically
  the physics-informed resolution-enhancing generative adversarial network (PhIREGAN), have outperformed
  traditional downscaling methods. We provide a thorough and extensible benchmark of leading deep learning-based
  super-resolution techniques, including the enhanced super-resolution generative adversarial network
  (ESRGAN) and an enhanced deep super-resolution (EDSR) network, on wind and solar data. We accompany
  the benchmark with a novel public, processed, and machine learning-ready dataset for benchmarking super-resolution
  methods on wind and solar data.
