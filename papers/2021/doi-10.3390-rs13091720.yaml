summary: Generalized regression neural network calibrates MODIS and ERA5 precipitable water vapor against
  GNSS over China, improving accuracy most at monthly timescales.
abstract: Global climate change has noticeable influences on the water vapor redistribution in China,
  which is embodied by the fact that both wetting and drying tendencies were observed across China. This
  poses the necessity to monitor and understand the water vapor evolution in China. However, observations
  of water vapor from different techniques are subjected to systematic biases, different spatiotemporal
  resolutions and coverages, and different accuracy, which would hamper their joint use, potentially leading
  to contradictory conclusions when using different techniques. Data fusion is a promising way to address
  this problem. Some scholars have proposed several methods to fuse multi-source PWV data in China region,
  such as the enhanced spatial and temporal adaptive reflectance fusion model, the hybrid PWV fusion model,
  and the linear calibration model. Although these models can produce PWV products with improved accuracy,
  they still have some shortcomings, such as no consideration for spatial or temporal variations in bias
  or inevitably impose some biases inaccurate information since assumptions made for interpolations are
  imperfect. In this study, we use the high-quality Global Navigation Satellite System (GNSS) precipitable
  water vapor (PWV) to calibrate and optimize the Moderate-resolution Imaging Spectroradiometer (MODIS)
  and the European Centre for Medium-Range Weather Forecasts ReAnalyses 5 (ERA5) PWV in 2018–2019 through
  a Generalized Regression Neural Network (GRNN) at annual, quarterly, and monthly timescales. Validation
  results demonstrate that modifying the MODIS and ERA5 PWV at the monthly timescale results in the best
  accuracy. In the monthly experiment, the average bias, standard deviation (STD), and root mean square
  (RMS) error of modified MODIS PWV are 0.0 mm, 2.6 mm, and 2.6 mm, respectively. The percentage improvement
  is as high as 50% in terms of RMS compared to the original MODIS PWV. It becomes 0.0 mm, 1.7 mm, and
  1.7 mm for the modified ERA5 PWV and the percentage improvement is 40%. Since the biases among different
  products are well-calibrated and the accuracy of MODIS and ERA5 PWV is improved to the same level of
  GNSS PWV, we can fuse them by simply merging them. Finally, we generate a new product of PWV in China
  with a temporal resolution of 1 day, a spatial resolution better than 31 km, and an accuracy better
  than 2.7 mm, which will serve as a high-quality product for investigating the water vapor redistribution
  under a changing climate.
