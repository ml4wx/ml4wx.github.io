summary: Temporal Fusion Transformer forecasts weekly extreme precipitation quantiles up to six months
  ahead, beating calibrated SEAS5 at six-month lead and modestly beating climatology.
abstract: 'An impact of climate change is the increase in frequency and intensity of extreme precipitation
  events. However, confidently predicting the likelihood of extreme precipitation at seasonal scales remains
  an outstanding challenge. Here, we present an approach to forecasting the quantiles of the maximum daily
  precipitation in each week up to six months ahead using the temporal fusion transformer (TFT) model.
  Through experiments in two regions, we compare TFT predictions with those of two baselines: climatology
  and a calibrated ECMWF SEAS5 ensemble forecast (S5). Our results show that, in terms of quantile risk
  at six month lead time, the TFT predictions significantly outperform those from S5 and show an overall
  small improvement compared to climatology. The TFT also responds positively to departures from normal
  that climatology cannot.'
