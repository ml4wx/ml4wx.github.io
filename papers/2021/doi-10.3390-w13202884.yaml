summary: Optimizes an SVM for extreme Meiyu rainfall over southern Taiwan, reaching F1 scores above 0.6
  at 16 to 64 h lead times through predictor and domain selection.
abstract: This study aims to propose a strategy to optimize the performance of the Support Vector Machine
  (SVM) scheme for extreme Meiyu rainfall prediction over southern Taiwan. Variables derived from Climate
  Forecast System Reanalysis (CFSR) dataset are the candidates for predictor selection. A series of experiments
  with different combinations of predictors and domains are designed to obtain the optimal strategy for
  constructing the SVM scheme. The results reveal that the accuracy (ACC), positive predictive values
  (PPV), probability of detection (POD), and F1-score can exceed 0.6 on average. Choosing the predictors
  associated with the Meiyu system and determine the domain associated with the correlations between selected
  predictors and predictand can improve the forecast performance. Our strategy shows the potential to
  predict extreme Meiyu rainfall in southern Taiwan with lead times from 16 h to 64 h. The F1-score analysis
  further demonstrates that the forecast performance of our scheme is stable, with slight inter-annual
  fluctuations from 1990 to 2019. Higher performance would be expected when the north of the South China
  Sea is characterized by stronger southwesterly flow and abundant low-level moisture for a given year.
