summary: Position paper proposing research agendas for AI in Earth science and remote sensing to move
  beyond disciplinary comfort zones.
abstract: In the last years we have witnessed the fields of geosciences and remote sensing and artificial
  intelligence to become closer. Thanks to both the massive availability of observational data, improved
  simulations, and algorithmic advances, these disciplines have found common objectives and challenges
  to advance the modeling and understanding of the Earth system. Despite such great opportunities, we
  also observed a worrying tendency to remain in disciplinary comfort zones applying recent advances from
  artificial intelligence on well resolved remote sensing problems. Here we take a position on research
  directions where we think the interface between these fields will have the most impact and become potential
  game changers. In our declared agenda for AI on Earth sciences, we aim to inspire researchers, especially
  the younger generations, to tackle these challenges for a real advance of remote sensing and the geosciences.
