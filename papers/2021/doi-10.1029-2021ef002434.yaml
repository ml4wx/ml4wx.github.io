summary: Machine learning links weather to household air conditioning use, projecting 8–13% higher US
  residential demand under 1.5–2.0°C warming.
abstract: Abstract Soaring temperatures and increased occurrence of heatwaves have drastically increased
  air‐conditioning demand, a trend that will likely continue into the future. Yet, the impact of anthropogenic
  warming on household air conditioning is largely unaccounted for in the operation and planning of energy
  grids. Here, by leveraging the state‐of‐the‐art in machine learning and climate model projections, we
  find substantial increases in future residential air conditioning demand across the U.S.—up to 8% with
  a range of 5%–8.5% (13% with a range of 11%–15%) after anthropogenic warming of 1.5°C (2.0°C) in global
  mean temperature. To offset this climate‐induced demand, an increase in the efficiency of air conditioners
  by as much as 8% (±4.5%) compared to current levels is needed; without this daunting technological effort,
  we estimate that some states will face supply inadequacies of up to 75 million “household‐days” (i.e.,
  nearly half a month per average current household) without air conditioning in a 2.0°C warmer world.
  In the absence of effective climate mitigation and technological adaptation strategies, the U.S. will
  face substantial increases in air conditioning demand and, in the event of supply inadequacies, there
  is increased risk of leaving millions without access to space cooling during extreme temperatures.
