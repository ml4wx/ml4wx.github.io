summary: A deep neural network fuses NUCAPS, ABI and RTMA data to cut low-level temperature and moisture
  profile RMSE by over 30% versus ERA5.
abstract: Abstract Thermodynamic information from low levels in the atmosphere is crucial for operational
  weather forecasts and meteorological researchers. The NOAA Unique Combined Atmospheric Processing System
  (NUCAPS) sounding products have been proven beneficial to fill the data gap between synoptic radiosonde
  observations (RAOBs). However, compared with the upper troposphere, the accuracy of NUCAPS soundings
  in the low levels still needs improvement. In this study, a deep neural network (DNN) is applied to
  fuse multiple data sources to enhance the NUCAPS temperature and moisture profiles in the lower atmosphere.
  The network is developed by combining satellite observations, including NUCAPS sounding retrievals and
  high resolution geostationary satellite observations from the Advanced Baseline Imager, and surface
  analysis from the Real‐Time Mesoscale Analysis (RTMA) as inputs, while collocated soundings from ECMWF
  re‐analysis version 5 are used as the benchmark for the training. The performance of the model is evaluated
  by using the independent testing data set, data from a different year, as well as collocated RAOBs,
  showing improvement to the temperature and moisture profiles by reducing the root‐mean‐squared‐error
  (RMSE) by more than 30% in the lower atmosphere (from 700 hPa to surface) in both clear sky and partially
  cloudy conditions. A convective event from June 18, 2017 is presented to illustrate the application
  of the enhanced low level soundings on high impact weather events. The enhanced soundings from fused
  data capture the large surface‐based convective available potential energy structures in the preconvection
  environment, which is very useful for severe storm nowcasting and forecasting applications.
