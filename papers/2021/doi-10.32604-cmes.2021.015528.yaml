summary: Reviews machine learning methods for drought prediction, covering drought indices, datasets and
  performance metrics, with an India focus.
abstract: Drought is the least understood natural disaster due to the complex relationship of multiple
  contributory factors. Its beginning and end are hard to gauge, and they can last for months or even
  for years. India has faced many droughts in the last few decades. Predicting future droughts is vital
  for framing drought management plans to sustain natural resources. The data-driven modelling for forecasting
  the metrological time series prediction is becoming more powerful and flexible with computational intelligence
  techniques. Machine learning (ML) techniques have demonstrated success in the drought prediction process
  and are becoming popular to predict the weather, especially the minimum temperature using backpropagation
  algorithms. The favourite ML techniques for weather forecasting include support vector machines (SVM),
  support vector regression, random forest, decision tree, logistic regression, Naive Bayes, linear regression,
  gradient boosting tree, k-nearest neighbours (KNN), the adaptive neuro-fuzzy inference system, the feed-forward
  neural networks, Markovian chain, Bayesian network, hidden Markov models, and autoregressive moving
  averages, evolutionary algorithms, deep learning and many more. This paper presents a recent review
  of the literature using ML in drought prediction, the drought indices, dataset, and performance metrics.
