summary: An MLP predicts next-day minimum and maximum temperature and pressure for Szczecin, Poland, with
  96% accuracy for temperature.
abstract: Artificial Neural Networks (ANNs) have proven to be a powerful tool for solving a wide variety
  of real-life problems. The possibility of using them for forecasting phenomena occurring in nature,
  especially weather indicators, has been widely discussed. However, the various areas of the world differ
  in terms of their difficulty and ability in preparing accurate weather forecasts. Poland lies in a zone
  with a moderate transition climate, which is characterized by seasonality and the inflow of many types
  of air masses from different directions, which, combined with the compound terrain, causes climate variability
  and makes it difficult to accurately predict the weather. For this reason, it is necessary to adapt
  the model to the prediction of weather conditions and verify its effectiveness on real data. The principal
  aim of this study is to present the use of a regressive model based on a unidirectional multilayer neural
  network, also called a Multilayer Perceptron (MLP), to predict selected weather indicators for the city
  of Szczecin in Poland. The forecast of the model we implemented was effective in determining the daily
  parameters at 96% compliance with the actual measurements for the prediction of the minimum and maximum
  temperature for the next day and 83.27% for the prediction of atmospheric pressure.
