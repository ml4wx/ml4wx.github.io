summary: Compares two NWP systems with different data assimilation as inputs to a thunderstorm power-outage
  model, showing simulation errors propagate quantifiably into outage predictions.
abstract: Thunderstorms are one of the most damaging weather phenomena in the United States, but they
  are also one of the least predictable. This unpredictable nature can make it especially challenging
  for emergency responders, infrastructure managers, and power utilities to be able to prepare and react
  to these types of events when they occur. Predictive analytical methods could be used to help power
  utilities adapt to these types of storms, but there are uncertainties inherent in the predictability
  of convective storms that pose a challenge to the accurate prediction of storm-related outages. Describing
  the strength and localized effects of thunderstorms remains a major technical challenge for meteorologists
  and weather modelers, and any predictive system for storm impacts will be limited by the quality of
  the data used to create it. We investigate how the quality of thunderstorm simulations affects power
  outage models by conducting a comparative analysis, using two different numerical weather prediction
  systems with different levels of data assimilation. We find that limitations in the weather simulations
  propagate into the outage model in specific and quantifiable ways, which has implications on how convective
  storms should be represented to these types of data-driven impact models in the future.
