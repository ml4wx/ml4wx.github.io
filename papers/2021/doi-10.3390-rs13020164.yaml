summary: IDA-LSTM adds coupled convolutions and channel-position dual attention to ConvLSTM to reduce
  underestimation of high radar echoes in extrapolation on CIKM 2017 data.
abstract: The task of precipitation nowcasting is significant in the operational weather forecast. The
  radar echo map extrapolation plays a vital role in this task. Recently, deep learning techniques such
  as Convolutional Recurrent Neural Network (ConvRNN) models have been designed to solve the task. These
  models, albeit performing much better than conventional optical flow based approaches, suffer from a
  common problem of underestimating the high echo value parts. The drawback is fatal to precipitation
  nowcasting, as the parts often lead to heavy rains that may cause natural disasters. In this paper,
  we propose a novel interaction dual attention long short-term memory (IDA-LSTM) model to address the
  drawback. In the method, an interaction framework is developed for the ConvRNN unit to fully exploit
  the short-term context information by constructing a serial of coupled convolutions on the input and
  hidden states. Moreover, a dual attention mechanism on channels and positions is developed to recall
  the forgotten information in the long term. Comprehensive experiments have been conducted on CIKM AnalytiCup
  2017 data sets, and the results show the effectiveness of the IDA-LSTM in addressing the underestimation
  drawback. The extrapolation performance of IDA-LSTM is superior to that of the state-of-the-art methods.
