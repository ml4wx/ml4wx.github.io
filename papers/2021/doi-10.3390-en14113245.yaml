summary: Support vector regression using JMA mesoscale ensemble forecasts improves day-ahead Kanto solar
  irradiance prediction and reduces the maximum error.
abstract: From the perspective of stable operation of the power transmission system, the transmission
  system operators (TSO) needs to procure reserve adjustment power at the stage of the previous day based
  on solar power forecast information from global horizontal irradiance (GHI). Because the reserve adjustment
  power is determined based on information on major outliers in past forecasts, reducing the maximum forecast
  error in addition to improving the average forecast accuracy is extremely important from the perspective
  of grid operation. In the past, researchers have proposed various methods combining the numerical weather
  prediction (NWP) and machine learning techniques for the one day-ahead solar power forecasting, but
  the accuracy of NWP has been a bottleneck issue. In recent years, the development of the ensemble prediction
  system (EPS) forecasts based on probabilistic approaches has been promoted to improve the accuracy of
  NWP, and in Japan, EPS forecasts in the mesoscale domain, called mesoscale ensemble prediction system
  (MEPS), have been distributed by the Japan Meteorological Agency (JMA). The use of EPS as a machine
  learning model is expected to improve the maximum forecast error, as well as the accuracy, since the
  predictor can utilize various weather scenarios as information. The purpose of this study is to examine
  the effect of EPS on the GHI prediction and the structure of the machine learning model that can effectively
  use EPS. In this study, we constructed the support vector regression (SVR)-based predictors with multiple
  network configurations using MEPS as input and evaluated the forecast error of the Kanto region GHI
  by each model. Through the comparison of the prediction results, it was shown that the machine learning
  model can achieve average accuracy improvement while reducing the maximum prediction error by MEPS,
  and knowledge was obtained on how to effectively provide EPS information to the predictor. In addition,
  machine learning was found to be useful in improving the systematic error of MEPS.
