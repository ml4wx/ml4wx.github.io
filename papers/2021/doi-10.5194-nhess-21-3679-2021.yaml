summary: Applies neural networks and SHAP to predict European drought one month ahead from a 50-member
  regional climate large ensemble, with about 55–60% correct event classification.
abstract: Abstract. There is strong scientific and social interest to understand the factors leading to
  extreme events in order to improve the management of risks associated with hazards like droughts. In
  this study, artificial neural networks are applied to predict the occurrence of a drought in two contrasting
  European domains, Munich and Lisbon, with a lead time of one month. The approach takes into account
  a list of 30 atmospheric and soil variables as input parameters from a single-model initial condition
  large ensemble (CRCM5-LE). The data was produced the context of the ClimEx project by Ouranos with the
  Canadian Regional Climate Model (CRCM5) driven by 50 members of the Canadian Earth System Model (CanESM2).
  Drought occurrence was defined using the Standardized Precipitation Index. The best performing machine
  learning algorithms managed to obtain a correct classification of drought or no drought for a lead time
  of one month for around 55–60 % of the events of each class for both domains. Explainable AI methods
  like SHapley Additive exPlanations (SHAP) were applied to gain a better understanding of the trained
  algorithms. Variables like the North Atlantic Oscillation Index and air pressure one month before the
  event proved to be of high importance for the prediction. The study showed that seasonality has a high
  influence on goodness of drought prediction, especially for the Lisbon domain.
