summary: AdaBoost models using early-stage vortex and environment features classify western North Pacific
  storms as weak or strong at genesis (about 75% accuracy) and estimate lifetime maximum intensity (R2
  0.30).
abstract: The relationship between early-stage features and lifetime maximum intensity (LMI) of tropical
  cyclones (TCs) over the Western North Pacific (WNP) was investigated by ensemble machine learning methods
  and composite analysis in this study. By selecting key features of TCs’ vortex attributes and environmental
  conditions, a two-step AdaBoost model demonstrated accuracy of about 75% in distinguishing weak and
  strong TCs at genesis and a coefficient of determination (R2) of 0.30 for LMI estimation from the early
  stage of strong TCs, suggesting an underlying relationship between LMI and early-stage features. The
  composite analysis reveals that TCs with higher LMI are characterized by lower latitude embedded in
  a continuous band of high low-troposphere vorticity, more compact circulation at both the upper and
  lower levels of the troposphere, stronger circulation at the mid-troposphere, a higher outflow layer
  with stronger convection, a more symmetrical structure of high-level moisture distribution, a slower
  translation speed, and a greater intensification rate around genesis. Specifically, TCs with greater
  “tightness” at genesis may have a better chance of strengthening to major TCs (LMI ≥ 96 kt), since it
  represents a combination of the inner and outer-core wind structure related to TCs’ rapid intensification
  and eyewall replacement cycle.
