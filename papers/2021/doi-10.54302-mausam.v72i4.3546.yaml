summary: A machine learning approach to precipitation level prediction and mapping is proposed on a cloud
  big-data environment. The abstract is truncated and gives no quantitative results.
abstract: Numerical weather prediction (NWP) has long been a difficult task for meteorologists. Atmospheric
  dynamics is extremely complicated to model, and chaos theory teaches us that the mathematical equations
  used to predict the weather are sensitive to initial conditions; that is, slightly perturbed initial
  conditions could yield very different forecasts. Over the years, meteorologists have developed a number
  of different mathematical models for atmospheric dynamics, each making slightly different assumptions
  and simplifications, and hence each yielding different forecasts. It has been noted that each model
  has its strengths and weaknesses forecasting in different situations, and hence to improve performance,
  scientists now use an ensemble forecast consisting of different models and running those models with
  different initial conditions. This ensemble method uses statistical post-processing; usually linear
  regression. Recently, machine learning techniques have started to be applied to NWP. Studies of neural
  networks, logistic regression, and genetic algorithms have shown improvements over standard linear regression
  for precipitation prediction. Gagne et al proposed using multiple machine learning techniques to improve
  precipitation forecasting. They used Breiman’s random forest technique, which had previously been applied
  to other areas of meteorology. Performance was verified using Next Generation Weather Radar (NEXRAD)
  data. Instead of using an ensemble forecast, it discusses the usage of techniques pertaining to machine
  learning to improve the precipitation forecast. This paper is to present an approach for mapping of
  precipitation data. The project attempts to arrive at a machine learning method which is optimal and
  data driven for predicting precipitation levels that aids farmers thereby aiming to provide benefits
  to the agricultural domain.
