summary: Conditional GAN and dense networks postprocess COSMO-E and IFS cloud cover ensembles over Switzerland,
  with cGAN producing realistic scenarios without copula or shuffle templates.
abstract: Abstract Statistical postprocessing is commonly applied to reduce location and dispersion errors
  of probabilistic forecasts provided by numerical weather prediction (NWP) models. If postprocessed forecast
  scenarios are required, the combination of ensemble model output statistics (EMOS) for univariate postprocessing
  with ensemble copula coupling (ECC) or the Schaake shuffle (ScS) to retain the dependence structure
  of the raw ensemble is a state-of-the-art approach. However, modern machine learning methods may lead
  to both a better univariate skill and more realistic forecast scenarios. In this study, we postprocess
  multimodel ensemble forecasts of cloud cover over Switzerland provided by COSMO-E and ECMWF-IFS using
  (i) EMOS + ECC, (ii) EMOS + ScS, (iii) dense neural networks (dense NN) + ECC, (iv) dense NN + ScS,
  and (v) conditional generative adversarial networks (cGAN). The different methods are verified using
  EUMETSAT satellite data. Dense NN shows the best univariate skill, but cGAN performed only slightly
  worse. Furthermore, cGAN generates realistic forecast scenario maps, while not relying on a dependence
  template like ECC or ScS, which is particularly favorable in the case of complex topography.
