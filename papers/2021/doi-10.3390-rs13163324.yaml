summary: SVR, PCA-SVR and CNN models invert high sea-surface winds from CYGNSS GNSS-R data; the CNN reaches
  2.71 m/s MAE for winds above 25 m/s.
abstract: In response to the deficiency of the detection capability of traditional remote sensing means
  (scatterometer, microwave radiometer, etc.) for high wind speed above 25 m/s, this paper proposes a
  GNSS-R technique combined with a machine learning method to invert high wind speed at sea surface. The
  L1-level satellite-based data from the Cyclone Global Navigation Satellite System (CYGNSS), together
  with the European Centre for Medium-Range Weather Forecasts (ECMWF) and the National Centers for Environmental
  Prediction (NCEP) data, constitute the original sample set, which is processed and trained with Support
  Vector Regression (SVR), the combination of Principal Component Analysis (PCA) and SVR (PCA-SVR), and
  Convolutional Neural Network (CNN) methods, respectively, to finally construct a sea surface high wind
  speed inversion model. The three models for high wind speed inversion are certified by the test data
  collected during Typhoon Bavi in 2020. The results show that all three machine learning models can be
  used for high wind speed inversion on sea surface, among which the CNN method has the highest inversion
  accuracy with a mean absolute error of 2.71 m/s and a root mean square error of 3.80 m/s. The experimental
  results largely meet the operational requirements for high wind speed inversion accuracy.
