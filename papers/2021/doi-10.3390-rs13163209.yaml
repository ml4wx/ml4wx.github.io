summary: Perspective arguing AI will transform weather forecasting, climate monitoring and decadal prediction,
  and that the field needs scientists skilled in both domains.
abstract: 'Artificial Intelligence (AI) is an explosively growing field of computer technology, which
  is expected to transform many aspects of our society in a profound way. AI techniques are used to analyse
  large amounts of unstructured and heterogeneous data and discover and exploit complex and intricate
  relations among these data, without recourse to an explicit analytical treatment of those relations.
  These AI techniques are unavoidable to make sense of the rapidly increasing data deluge and to respond
  to the challenging new demands in Weather Forecast (WF), Climate Monitoring (CM) and Decadal Prediction
  (DP). The use of AI techniques can lead simultaneously to: (1) a reduction of human development effort,
  (2) a more efficient use of computing resources and (3) an increased forecast quality. To realise this
  potential, a new generation of scientists combining atmospheric science domain knowledge and state-of-the-art
  AI skills needs to be trained. AI should become a cornerstone of future weather and climate observation
  and modelling systems.'
