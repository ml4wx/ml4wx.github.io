summary: Segmentation neural network identifies dry intrusion origins from ERA-Interim geopotential height
  alone, enabling detection in climate datasets lacking wind fields.
abstract: Abstract Mid‐latitude cyclones are complex weather systems that are tightly related to surface
  weather impacts. Coherent air streams are known to be associated with such systems, in particular dry
  intrusions (DIs) in which dry air masses descend slantwise from the vicinity of the tropopause equatorward
  towards the surface. Often, DIs are associated with severe surface winds, heavy precipitation and frontogenesis.
  Currently, DIs can only be identified in hindsight by costly Lagrangian calculations using high resolution
  wind field data. Here, we use a novel method aiming to simplify the detection procedure of DI origins
  to allow their future identification in climate datasets, previously inaccessible for such diagnostic
  studies. A novel adaptation of a segmentation‐oriented neural network model is hereby presented as a
  successful tool to identify DI origins based solely on three ERA‐Interim reanalysis geopotential height
  fields, representing the state of the atmosphere. The model prediction skill is tested by calculating
  both the grid‐point and DI object based Matthews correlation coefficient. We find the model highly skilful
  in both reconstructing accurately the climatological distribution and predicting the vast majority of
  the individual DI origin objects. The skill decreases for relatively small objects and for objects occurring
  at locations where such cases are relatively less frequent. This indicates that geopotential height
  variability is related to the dynamic mechanisms involved in DI initiations. The results serve as a
  proof of concept for predicting DIs and other coherent air mass trajectories even when high resolution
  wind field data are not available, such as for model output for future climate projections.
