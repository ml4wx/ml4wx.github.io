summary: An LSTM with rolling forecasts predicts typhoon intensity up to 120 h from historical data and
  outperforms a feed-forward network on 2015 typhoons.
abstract: A typhoon is an extreme weather event with strong destructive force, which can bring huge losses
  of life and economic damage to people. Thus, it is meaningful to reduce the prediction errors of typhoon
  intensity forecasting. Artificial and deep neural networks have recently become widely used for typhoon
  forecasting in order to ensure typhoon intensity forecasting is accurate and timely. Typhoon intensity
  forecasting models based on long short-term memory (LSTM) are proposed herein, which forecast typhoon
  intensity as a time series problem based on historical typhoon data. First, the typhoon intensity forecasting
  models are trained and tested with processed typhoon data from 2000 to 2014 to find the optimal prediction
  factors. Then, the models are validated using the optimal prediction factors compared to a feed-forward
  neural network (FNN). As per the results of the model applied for typhoons Chan-hom and Soudelor in
  2015, the model based on LSTM using the optimal prediction factors shows the best performance and lowest
  prediction errors. Thus, the model based on LSTM is practical and meaningful for predicting typhoon
  intensity within 120 h.
