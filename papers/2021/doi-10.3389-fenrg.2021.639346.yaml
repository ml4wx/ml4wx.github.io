summary: Compares physics-based and data-driven day-ahead PV power forecasts built on NWP inputs at one
  site; all ML methods perform comparably.
abstract: 'In the context of smart grids, the need for forecasts of the power output of small-scale photovoltaic
  (PV) arrays increases as control processes such as the management of flexibilities in the distribution
  grid gain importance. However, there is often only very little knowledge about the PV systems installed:
  even fundamental system parameters such as panel orientation, the number of panels and their type, or
  time series data of past PV system performance are usually unknown to the grid operator. In the past,
  only forecasting models that attempted to account for cause-and-effect chains existed; nowadays, also
  data-driven methods that attempt to recognize patterns in past behavior are available. Choosing between
  physics-based or data-driven forecast methods requires knowledge about the typical forecast quality
  as well as the requirements that each approach entails. In this contribution, the achieved forecast
  quality for a typical scenario (day-ahead, based on numerical weather predictions [NWP]) is evaluated
  for one physics-based as well as five different data-driven forecast methods for a year at the same
  site in south-western Germany. Namely, feed-forward neural networks (FFNN), long short-term memory (LSTM)
  networks, random forest, bagging and boosting are investigated. Additionally, the forecast quality of
  the weather forecast is analyzed for key quantities. All evaluated PV forecast methods showed comparable
  performance; based on concise descriptions of the forecast approaches, advantages and disadvantages
  of each are discussed. The approaches are viable even though the forecasts regularly differ significantly
  from the observed behavior; the residual analysis performed offers a qualitative insight into the achievable
  forecast quality in a typical real-world scenario.'
