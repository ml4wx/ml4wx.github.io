summary: Applies pix2pix GAN and DeepLabv3+ segmentation to live road images to compute a snow-cover hazard
  index for Japanese highways.
abstract: In 2020, there was a record heavy snowfall owing to climate change. In reality, 2,000 vehicles
  were stuck on the highway for three days. Because of the freezing of the road surface, 10 vehicles had
  a billiard accident. Road managers are required to provide indicators to alert drivers regarding snow
  cover at hazardous locations. This study proposes a deep learning application with live image post-processing
  to automatically calculate a snow hazard ratio indicator. First, the road surface hidden under snow
  is translated using a generative adversarial network, pix2pix. Second, snow-covered and road surface
  classes are detected by semantic segmentation using DeepLabv3+ with MobileNet as a backbone. Based on
  these trained networks, we automatically compute the road to snow rate hazard index, indicating the
  amount of snow covered on the road surface. We demonstrate the applied results to 1,155 live snow images
  of the cold region in Japan. We mention the usefulness and the practical robustness of our study.
