summary: Nonlocal residual CNN super-resolves weather radar echo images at x2 and x4, outperforming interpolation
  in quantitative metrics and edge detail.
abstract: Accurate and high-resolution weather radar images reflecting detailed structure information
  of radar echo are vital for analysis and forecast of extreme weather. Typically, this is performed by
  using interpolation schemes, which only use several neighboring data values for computational approximation
  to get the estimated value regardless of the large-scale context feature of weather radar images. Inspired
  by the striking performance of the convolutional neural network (CNN) applied in feature extraction
  and nonlocal self-similarity of weather radar images, we proposed a nonlocal residual network (NLRN)
  on the basis of CNN. The proposed network mainly consists of several nonlocal residual blocks (NLRB),
  which combine short skip connection (SSC) and nonlocal operation to train the deep network and capture
  large-scale context information. In addition, long skip connection (LSC) added in the network avoids
  learning low-frequency information, making the network focus on high-level features. Extensive experiments
  of ×2 and ×4 super-resolution reconstruction demonstrate that NLRN achieves superior performance in
  terms of both quantitative evaluation metrics and visual quality, especially for the reconstruction
  of the edge and detailed information of the weather radar echo.
