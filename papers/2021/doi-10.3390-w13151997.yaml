summary: A wavelet packet decomposition plus extreme learning machine hybrid (WPD-ELM) forecasts annual
  rainfall better than ARIMA and BPNN baselines, though the study is regional and modest in scope.
abstract: 'Accurate precipitation prediction can help plan for different water resources management demands
  and provide an extension of lead-time for the tactical and strategic planning of courses of action.
  This paper examines the applicability of several forecasting models based on wavelet packet decomposition
  (WPD) in annual rainfall forecasting, and a novel hybrid precipitation prediction framework (WPD-ELM)
  is proposed coupling extreme learning machine (ELM) and WPD. The works of this paper can be described
  as follows: (a) WPD is used to decompose the original precipitation data into several sub-layers; (b)
  ELM model, autoregressive integrated moving average model (ARIMA), and back-propagation neural network
  (BPNN) are employed to realize the forecasting computation for the decomposed series; (c) the results
  are integrated to attain the final prediction. Four evaluation indexes (RMSE, MAE, R, and NSEC) are
  adopted to assess the performance of the models. The results indicate that the WPD-ELM model outperforms
  other models used in this paper and WPD can significantly enhance the performance of forecasting models.
  In conclusion, WPD-ELM can be a promising alternative for annual precipitation forecasting and WPD is
  an effective data pre-processing technique in producing convincing forecasting models.'
