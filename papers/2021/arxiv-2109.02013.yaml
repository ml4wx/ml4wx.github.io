summary: Path-signature machine learning model using climate indices predicts El Niño NINO3.4 SST six
  months ahead with MSE of 0.596 and identifies North Pacific precursors.
abstract: El Niño is a typical example of a coupled atmosphere--ocean phenomenon, but it is unclear whether
  it can be described quantitatively by a correlation between relevant climate events. To provide clarity
  on this issue, we developed a machine learning-based El Niño prediction model that uses the time series
  of climate indices. By transforming the multidimensional time series into the path signature, the model
  is able to properly evaluate the order and nonlinearity of climate events, which allowed us to achieve
  good forecasting skill (mean square error = 0.596 for 6-month prediction). In addition, it is possible
  to provide information about the sequence of climate events that tend to change the future NINO3.4 sea
  surface temperatures. In forecasting experiments conducted, changes in the North Pacific Index and several
  NINO indices were found to be important precursors. The results suggest that El Niño is predictable
  to some extent based on the correlation of climate events.
