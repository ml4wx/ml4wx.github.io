summary: Differential polynomial neural networks forecast photovoltaic output from recent weather and
  power data, as an alternative to delayed NWP cloud forecasts.
abstract: Forecasting Photovoltaic (PV) energy production, based on the last weather and power data only,
  can obtain acceptable prediction accuracy in short-time horizons. Numerical Weather Prediction (NWP)
  systems usually produce free forecasts of the local cloud amount each 6 h. These are considerably delayed
  by several hours and do not provide sufficient quality. A Differential Polynomial Neural Network (D-PNN)
  is a recent unconventional soft-computing technique that can model complex weather patterns. D-PNN expands
  the n-variable kth order Partial Differential Equation (PDE) into selected two-variable node PDEs of
  the first or second order. Their derivatives are easy to convert into the Laplace transforms and substitute
  using Operator Calculus (OC). D-PNN proves two-input nodes to insert their PDE components into its gradually
  expanded sum model. Its PDE representation allows for the variability and uncertainty of specific patterns
  in the surface layer. The proposed all-day single-model and intra-day several-step PV prediction schemes
  are compared and interpreted with differential and stochastic machine learning. The statistical models
  are evolved for the specific data time delay to predict the PV output in complete day sequences or specific
  hours. Spatial data from a larger territory and the initially recognized daily periods enable models
  to compute accurate predictions each day and compensate for unexpected pattern variations and different
  initial conditions. The optimal data samples, determined by the particular time shifts between the model
  inputs and output, are trained to predict the Clear Sky Index in the defined horizon.
