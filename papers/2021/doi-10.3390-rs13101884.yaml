summary: Neural networks retrieve Arctic temperature and humidity profiles from FY-3D HIRAS under clear
  skies, closer to ERA5 than AIRS products.
abstract: 'The acquisition of real-time temperature and relative humidity (RH) profiles in the Arctic
  is of great significance for the study of the Arctic’s climate and Arctic scientific research. However,
  the operational algorithm of Fengyun-3D only takes into account areas within 60°N, the innovation of
  this work is that a new technique based on Neural Network (NN) algorithm was proposed, which can retrieve
  these parameters in real time from the Fengyun-3D Hyperspectral Infrared Radiation Atmospheric Sounding
  (HIRAS) observations in the Arctic region. Considering the difficulty of obtaining a large amount of
  actual observation (such as radiosonde) in the Arctic region, collocated ERA5 data from European Centre
  for Medium-Range Weather Forecasts (ECMWF) and HIRAS observations were used to train the neural networks
  (NNs). Brightness temperature and training targets were classified using two variables: season (warm
  season and cold season) and surface type (ocean and land). NNs-based retrievals were compared with ERA5
  data and radiosonde observations (RAOBs) independent of the NN training sets. Results showed that (1)
  the NNs retrievals accuracy is generally higher on warm season and ocean; (2) the root-mean-square error
  (RMSE) of retrieved profiles is generally slightly higher in the RAOB comparisons than in the ERA5 comparisons,
  but the variation trend of errors with height is consistent; (3) the retrieved profiles by the NN method
  are closer to ERA5, comparing with the AIRS products. All the results demonstrated the potential value
  in time and space of NN algorithm in retrieving temperature and relative humidity profiles of the Arctic
  region from HIRAS observations under clear-sky conditions. As such, the proposed NN algorithm provides
  a valuable pathway for retrieving reliably temperature and RH profiles from HIRAS observations in the
  Arctic region, providing information of practical value in a wide spectrum of practical applications
  and research investigations alike.All in all, our work has important implications in broadening Fengyun-3D’s
  operational implementation range from within 60°N to the Arctic region.'
