summary: Backpropagation neural network with iteratively selected predictors forecasts typhoon precipitation
  occurrence in Anhui with 100% hindcast and 90% validation accuracy.
abstract: Typhoon is one of the most frequent meteorological phenomena that covers most of central-eastern
  China during the summer. Typhoon-induced precipitation is one of the most important water resources,
  but it often leads to severe flood disasters. Accurate typhoon precipitation prediction is crucial for
  mitigating typhoon disasters and managing water resources. Anhui Province, located in East China, is
  a typhoon affected region. Typhoon-related disasters are its major natural disasters. This study aims
  at developing a new back propagation (BP) neural network model to predict both the typhoon precipitation
  event and the typhoon precipitation amount. The predictors in the model are identified through correlation
  analysis of the above two target variables and a large set of candidate variables. We further improve
  the predictor selection through an iterative approach, which proposes new predictors for the BP model
  in each iteration by analyzing the differences of candidate predictors between the years with large
  prediction errors and the normal years. The results show that the accuracy of the BP-based summer typhoon
  event prediction model in the simulation period from 1957 to 2006 is 100%, and its accuracy in the validation
  period from 2007 to 2016 is 90%. In addition, the absolute value of the mean relative error predicted
  by the typhoon precipitation amount model for the simulation period is 20.9%. A significant error can
  be found in 2000 as the mechanism of typhoon precipitation in this year is different from that of other
  normal years. The error in 2000 is probably caused by the impact of vertical shear anomalies over the
  western Pacific which hinders the development of typhoon embryos. Additionally, the absolute value of
  the mean relative error predicted by the typhoon precipitation amount model in the validation period
  is 14.2%. A significant error also can be found in 2009, probably due to the influence of the asymmetry
  in the typhoon cloud system.
