summary: A random forest hybrid estimates mesoscale convective system rainrate from FY-4A cloud-top temperature
  features, outperforming the operational FY-4A precipitation product.
abstract: Satellite rainrate estimation is a great challenge, especially in mesoscale convective systems
  (MCSs), which is mainly due to the absence of a direct physical connection between observable cloud
  parameters and surface rainrate. The machine learning technique was employed in this study to estimate
  rainrate in the MCS domain via using cloud top temperature (CTT) derived from a geostationary satellite.
  Five kinds of machine learning models were investigated, i.e., polynomial regression, support vector
  machine, decision tree, random forest, and multilayer perceptron, and the precipitation of Climate Prediction
  Center morphing technique (CMORPH) was used as the reference. A total of 31 CTT related features were
  designed to be the potential inputs for training an algorithm, and they were all proved to have a positive
  contribution in modulating the algorithm. Random forest (RF) shows the best performance among the five
  kinds of models. By combining the classification and regression schemes of the RF model, an RF-based
  hybrid algorithm was proposed first to discriminate the rainy pixel and then estimate its rainrate.
  For the MCS samples considered in this study, such an algorithm generates the best estimation, and its
  accuracy is definitely higher than the operational precipitation product of FY-4A. These results demonstrate
  the promising feasibility of applying a machine learning technique to solve the satellite precipitation
  retrieval problem.
