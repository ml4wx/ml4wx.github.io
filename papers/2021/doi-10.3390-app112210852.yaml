summary: Dense neural networks predict daily max and min 2 m temperatures from radiosonde profiles up
  to 500 days ahead, beating persistence but not climatology beyond day 2-3.
abstract: This study investigates the potential of direct prediction of daily extremes of temperature
  at 2 m from a vertical profile measurement using neural networks (NNs). The analysis is based on 3800
  daily profiles measured in the period 2004–2019. Various setups of dense sequential NNs are trained
  to predict the daily extremes at different lead times ranging from 0 to 500 days into the future. The
  short- to medium-range forecasts rely mainly on the profile data from the lowest layer—mostly on the
  temperature in the lowest 1 km. For the long-range forecasts (e.g., 100 days), the NN relies on the
  data from the whole troposphere. The error increases with forecast lead time, but at the same time,
  it exhibits periodic behavior for long lead times. The NN forecast beats the persistence forecast but
  becomes worse than the climatological forecast on day two or three. The forecast slightly improves when
  the previous-day measurements of temperature extremes are added as a predictor. The best forecast is
  obtained when the climatological value is added as well, with the biggest improvement in the long-term
  range where the error is constrained to the climatological forecast error.
