summary: Fitness-tuned adaptive neural network forecasts Karnataka rainfall and temperature for 2021-2030
  and maps effects on five crops; validation is limited.
abstract: Weather forecast is significantly imperative in today’s smart technological world. A precise
  forecast model entails a plentiful data in order to attain the most accurate predictions. However, a
  forecast of future rainfall from historical data samples has always been challenging and key area of
  research. Hence, in modern weather forecasting a combo of computer models, observation, and knowledge
  of trends and patterns are introduced. This research work has presented a fitness function based adaptive
  artificial neural network scheme in order to forecast rainfall and temperature for upcoming decade (2021-2030)
  using historical weather data of 20 different districts of Karnataka state. Furthermore, effects of
  these forecasted weather parameters are realized over five major crops of Karnataka namely rice, wheat,
  jowar, maize, and ragi with the intention of evaluation for efficient crop management in terms of the
  passing relevant messages to the farmers and alternate measures such as suggesting other geographical
  locations to grow the same crop or growing other suitable crops at same geographical location. A graphical
  user interface (GUI) application has been developed for the proposed work in order to ease out the flow
  of work.
