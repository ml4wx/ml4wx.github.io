summary: XGBoost model estimates hourly 1-km air temperature across 13 northeastern US states, with RMSE
  about 1.6 K versus 2.5 K for NLDAS-2.
abstract: 'BACKGROUND: Accurate and precise estimates of ambient air temperatures that can capture fine-scale
  within-day variability are necessary for studies of air temperature and health. METHOD: We developed
  statistical models to predict temperature at each hour in each cell of a 927-m square grid across the
  Northeast and Mid-Atlantic United States from 2003 to 2019, across ~4000 meteorological stations from
  the Integrated Mesonet, using inputs such as elevation, an inverse-distance-weighted interpolation of
  temperature, and satellite-based vegetation and land surface temperature. We used a rigorous spatial
  cross-validation scheme and spatially weighted the errors to estimate how well model predictions would
  generalize to new cell-days. We assess the within-county association of temperature and social vulnerability
  in a heat wave as an example application. RESULTS: We found that a model based on the XGBoost machine-learning
  algorithm was fast and accurate, obtaining weighted root mean square errors (RMSEs) around 1.6 K, compared
  to standard deviations around 11.0 K. We found similar accuracy when validating our model on an external
  dataset from Weather Underground. Assessing predictions from the North American Land Data Assimilation
  System-2 (NLDAS-2), another hourly model, in the same way, we found it was much less accurate, with
  RMSEs around 2.5 K. This is likely due to the NLDAS-2 model''s coarser spatial resolution, and the dynamic
  variability of temperature within its grid cells. Finally, we demonstrated the health relevance of our
  model by showing that our temperature estimates were associated with social vulnerability across the
  region during a heat wave, whereas the NLDAS-2 showed a much weaker association. CONCLUSION: Our high
  spatiotemporal resolution air temperature model provides a strong contribution for future health studies
  in this region.'
