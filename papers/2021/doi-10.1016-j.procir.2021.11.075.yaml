summary: Dual-input 1D CNN predicts wind turbine blade icing 24 hours ahead using turbine data and weather
  forecasts, reaching 97.9% balanced accuracy across three wind farms.
abstract: Downtimes due to ice formation on rotor blades reduce the economic efficiency of wind turbines.
  An accurate ice prediction is required to operate active de-icing measures such as blade heating as
  an anti-icing system. Building upon our previous research, this paper proposes the use of a convolutional
  neural network model with dual inputs and one-dimensional convolution filters using historical data
  from the wind turbine as well as weather forecasts to predict the ice situation for the next 24 hours.
  The model is validated using data from three different wind farms and shows an average balanced accuracy
  of 97.9%.
