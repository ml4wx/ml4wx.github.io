summary: Random forest retrieves tropical overshooting cloud-top height from Himawari-8 infrared channels
  against CloudSat, reaching r=0.92 and RMSE 222 m versus 1305 m for interpolation.
abstract: Tropical overshooting convection has a strong impact on both heat budget and moisture distribution
  in the upper troposphere and lower stratosphere, and it can pose a great risk to aviation safety. Cloud-top
  height is one of the essential concerns of overshooting convection for both the climate system and the
  aviation weather forecast. The main purpose of our work is to verify the application of the machine
  learning method, taking the random forest (RF) model as an instance, in overshooting cloud-top height
  retrieval from Himawari-8 data. By using collocated CloudSat observations as a reference, we utilize
  several infrared indicators of Himawari-8 that are commonly recognized to relate to cloud-top height,
  along with some temporal and geographical parameters (latitude, month, satellite zenith angle, etc.),
  as predictors to construct and validate the model. Analysis of variable importance shows that the brightness
  temperature of 6.2 um acts as the dominant predictor, followed by satellite zenith angle, brightness
  temperature of 13.3 um, latitude, and month. In the comparison between the RF model and the traditional
  single-channel interpolation method, retrievals from the RF model agree well with observation with a
  high correlation coefficient (0.92), small RMSE (222 m), and small MAE (164 m), while these metrics
  from traditional single-channel interpolation method shows lower skills (0.70, 1305 m, and 1179 m).
  This work presents a new sight of overshooting cloud-top height retrieval based on the machine learning
  method.
