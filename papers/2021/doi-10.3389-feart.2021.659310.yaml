summary: Multitask local linear regression predicts China precipitation 2–6 weeks ahead with skill 0.11,
  rising to 0.13 when the Arctic Oscillation index is added.
abstract: Precipitation change, which is closely related to drought and flood disasters in China, affects
  billions of people every year, and the demand for subseasonal forecasting of precipitation is even more
  urgent. Subseasonal forecasting, which is more difficult than weather forecasting, however, has remained
  as a blank area in meteorological service for a long period of time. To improve the accuracy of subseasonal
  forecasting of China precipitation, this work introduces the machine learning method proposed by Hwang
  et al. in 2019 to predict the precipitation in China 2–6 weeks in advance. The authors used a non-linear
  regression model called local linear regression together with multitask feature election (MultiLLR)
  model and chosen 21 meteorological elements as candidate predictors to integrate diverse meteorological
  observation data. This method automatically eliminates irrelevant predictors so as to establish the
  forecast equations using multitask feature selection process. The experiments demonstrate that the pressure
  and Madden–Julian Oscillation (MJO) are the most important physical factors. The average prediction
  skill is 0.11 during 2011–2016, and there are seasonal differences in forecasting skills, evidenced
  by higher forecast skills of winter and spring seasons than summer and autumn seasons. The proposed
  method can provide effective and indicative guidance for the subseasonal prediction of precipitation
  in China. By adding another three factors, Arctic Oscillation (AO) index, Western North Pacific Monsoon
  (WNPM) index and Western North Pacific Subtropical High (WNPSH) index into the MultiLLR model, the authors
  find that AO can improve the forecast skill of China precipitation to the maximum extent from 0.11 to
  0.13, followed by WNPSH. Moreover, the ensemble skill of our model and CFSv2 is 0.16. This work shows
  that our subseasonal prediction of China precipitation should be benefited from the MultiLLR model.
