abstract: Climate change has largely impacted our daily lives. As one of its consequences, we are experiencing
  more wildfires. In the year 2020, wildfires burned a record number of 8,888,297 acres in the US. To
  awaken people's attention to climate change, and to visualize the current risk of wildfires, We developed
  RtFPS, "Real-Time Fire Prediction System". It provides a real-time prediction visualization of wildfire
  risk at specific locations base on a Machine Learning model. It also provides interactive map features
  that show the historical wildfire events with environmental info.
