summary: A neural network corrects 3 km WRF forecasts of valley winds in complex terrain, significantly
  improving low-level wind speed and direction.
abstract: In regions of complex topography, local flows are difficult to forecast on a routine basis,
  especially in stable conditions, due to the coarse resolution of operational models. The Cadarache valley
  (southeastern France) features this sort of complex topography. The Weather Research and Forecasting
  (WRF) model is run daily to forecast the weather in this region with a horizontal resolution of 3 km.
  Such a resolution cannot resolve all topography details of the small Cadarache valley, and therefore
  its local wind patterns. Other variables, however, that are less dependent on the subgrid topography,
  are satisfactorily forecasted, and used as inputs to an artificial neural network (ANN) designed to
  reproduce wind observations inside the valley from WRF forecasts. A variable selection procedure identified
  5 key input variables that best drive the ANN. With respect to the WRF output, the ANN significantly
  improves forecasted low-level winds, both for speed and direction. This study demonstrates the potential
  for the ANN technique to be used as a correcting tool to forecast weather conditions at the local scale
  when numerical modeling is performed at a resolution too coarse to take into account the effect of local
  topography.
