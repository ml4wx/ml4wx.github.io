summary: Survey of machine learning and deep learning methods for weather forecasting, covering applications,
  types and problems; no new model.
abstract: Forecast of future weather is one of the dominant concerns in today’s era. Several techniques
  that have been used to forecast future weather are statistical analysis, machine learning, and deep
  learning techniques. Forecast of weather can assist in the decision-making process for the prevention
  of disasters. While forecasting weekly weather can help people, decide and manage their activities and
  recreational programs it can also help Smart management programs. The accuracy of the Short term ambient
  forecast conditions is particularly conducive to the development of forecast management strategies.
  This paper presents an inclusive survey on such methods based on Machine Learning, and Deep Learning
  Techniques used to predict weather and discusses the applications, types, and problems of the forecasting.
