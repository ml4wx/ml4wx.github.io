summary: Propagates 1–5 day weather forecast uncertainty into a machine-learning storm outage model for
  the northeastern US, with precipitation and gusts dominating error.
abstract: Weather-related power outages affect millions of utility customers every year. Predicting storm
  outages with lead times of up to five days could help utilities to allocate crews and resources and
  devise cost-effective restoration plans that meet the strict time and efficiency requirements imposed
  by regulatory authorities. In this study, we construct a numerical experiment to evaluate how weather
  parameter uncertainty, based on weather forecasts with one to five days of lead time, propagates into
  outage prediction error. We apply a machine-learning-based outage prediction model on storm-caused outage
  events that occurred between 2016 and 2019 in the northeastern United States. The model predictions,
  fed by weather analysis and other environmental parameters including land cover, tree canopy, vegetation
  characteristics, and utility infrastructure variables exhibited a mean absolute percentage error of
  38%, Nash–Sutcliffe efficiency of 0.54, and normalized centered root mean square error of 68%. Our numerical
  experiment demonstrated that uncertainties of precipitation and wind-gust variables play a significant
  role in the outage prediction uncertainty while sustained wind and temperature parameters play a less
  important role. We showed that, while the overall weather forecast uncertainty increases gradually with
  lead time, the corresponding outage prediction uncertainty exhibited a lower dependence on lead times
  up to 3 days and a stepwise increase in the four- and five-day lead times.
