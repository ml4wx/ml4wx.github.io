summary: A CNN using spatially restructured SST, sea-level pressure and wind predictors forecasts El Niño
  and La Niña types one year ahead with high precision.
abstract: 'El Niño-Southern Oscillation (ENSO) is characterized by large-scale fluctuations of sea surface
  temperature (SST) in the central and eastern tropical Pacific accompanied by changes in the atmospheric
  circulation. ENSO events are of two main types: El Niño and La Niña. Oceanic Niño index (ONI) determines
  the five consecutive three-month running mean of SST anomalies, in the Niño 3.4 region (5° S-5° N, 170°
  W-120° W). El Niño is a phenomenon in the equatorial Pacific Ocean characterized by a value of greater
  than 0.5 °C for ONI. La Niña is a phenomenon in the equatorial Pacific Ocean characterized by a value
  of less than -0.5 °C for ONI. The lingering of either of these two phenomena could induce severe droughts,
  whereas either of them following the other could cause massive floods. In both cases, deaths and substantial
  pecuniary loss are unavoidable, making their forecast of great significance. This study takes over the
  challenge of forecasting these two phenomena with one year lead time, which has proven difficult in
  the literature. This research''s contribution is restructuring ENSO events'' predictors, including SST,
  sea level pressure, surface wind speed, and wind stress in a spatially and temporally meaningful way
  and designing a convolutional neural network that takes advantage of this structure to forecast ENSO
  events of different types (i.e., Central Pacific and Eastern Pacific) in the next year. Not only a high
  precision in forecasts was achieved but also it was shown that the proposed model has the potential
  to achieve higher recalls if a larger number of samples from the positive class would become available.'
