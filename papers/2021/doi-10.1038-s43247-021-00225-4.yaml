summary: ML trained on a large climate model ensemble yields seasonal precipitation forecasts over the
  western US competitive with NMME dynamical models.
abstract: Abstract A barrier to utilizing machine learning in seasonal forecasting applications is the
  limited sample size of observational data for model training. To circumvent this issue, here we explore
  the feasibility of training various machine learning approaches on a large climate model ensemble, providing
  a long training set with physically consistent model realizations. After training on thousands of seasons
  of climate model simulations, the machine learning models are tested for producing seasonal forecasts
  across the historical observational period (1980-2020). For forecasting large-scale spatial patterns
  of precipitation across the western United States, here we show that these machine learning-based models
  are capable of competing with or outperforming existing dynamical models from the North American Multi
  Model Ensemble. We further show that this approach need not be considered a ‘black box’ by utilizing
  machine learning interpretability methods to identify the relevant physical processes that lead to prediction
  skill.
