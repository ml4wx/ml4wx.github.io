summary: ML-enhanced Model Output Statistics post-processes NWP output to predict 24-hour temperature
  and wind speed at four Chinese cities, beating neural network and SVM baselines.
abstract: The Model Output Statistics (MOS) model is a dynamic statistical weather forecast model based
  on multiple linear regression technology. It is greatly affected by the selection of parameters and
  predictors, especially when the weather changes drastically, or extreme weather occurs. We improved
  the traditional MOS model with the machine learning method to enhance the capabilities of self-learning
  and generalization. Simultaneously, multi-source meteorological data were used as the input to the model
  to improve the data quality. In the experiment, we selected the four areas of Nanjing, Beijing, Chengdu,
  and Guangzhou for verification, with the numerical weather prediction (NWP) products and observation
  data from automatic weather stations (AWSs) used to predict the temperature and wind speed in the next
  24 h. From the experiment, it can be seen that the accuracy of the prediction values and speed of the
  method were improved by the ML-MOS. Finally, we compared the ML-MOS model with neural networks and support
  vector machine (SVM), the results show that the prediction result of the ML-MOS model is better than
  that of the above two models.
