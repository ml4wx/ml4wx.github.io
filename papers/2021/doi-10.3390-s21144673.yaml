summary: Deep neural networks retrieve temperature and humidity profiles from FY-3 MWHTS microwave sounder
  and bias-correct its observations, outperforming shallow networks in accuracy and stability.
abstract: The shallow neural network (SNN) is a popular algorithm in atmospheric parameters retrieval
  from microwave remote sensing. However, the deep neural network (DNN) has a stronger nonlinear mapping
  capability compared to SNN and has great potential for applications in microwave remote sensing. The
  Microwave Humidity and Temperature Sounder (Beijing, China, MWHTS) onboard the Fengyun-3 (FY-3) satellite
  has the ability to independently retrieve atmospheric temperature and humidity profiles. A study on
  the application of DNN in retrieving atmospheric temperature and humidity profiles from MWHTS was carried
  out. Three retrieval schemes of atmospheric parameters in microwave remote sensing based on DNN were
  performed in the study of bias correction of MWHTS observation and the retrieval of the atmospheric
  temperature and humidity profiles using MWHTS observations. The experimental results show that, compared
  with SNN, DNN can obtain better bias-correction results when applied to MWHTS observation, and can obtain
  higher retrieval accuracy of temperature and humidity profiles in all three retrieval schemes. Meanwhile,
  DNN shows higher stability than SNN when applied to the retrieval of temperature and humidity profiles.
  The comparative study of DNN and SNN applied in different atmospheric parameter retrieval schemes shows
  that DNN has a more superior performance.
