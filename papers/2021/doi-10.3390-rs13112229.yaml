summary: A deep learning regression retrieves radar composite reflectivity maps from Fengyun-4A geostationary
  satellite data, with R² of 0.88-0.96 and MAE of 0.3-0.6 dBZ.
abstract: Ground-based weather radar data plays an essential role in monitoring severe convective weather.
  The detection of such weather systems in time is critical for saving people’s lives and property. However,
  the limited spatial coverage of radars over the ocean and mountainous regions greatly limits their effective
  application. In this study, we propose a novel framework of a deep learning-based model to retrieve
  the radar composite reflectivity factor (RCRF) maps from the Fengyun-4A new-generation geostationary
  satellite data. The suggested framework consists of three main processes, i.e., satellite and radar
  data preprocessing, the deep learning-based regression model for retrieving the RCRF maps, as well as
  the testing and validation of the model. In addition, three typical cases are also analyzed and studied,
  including a cluster of rapidly developing convective cells, a Northeast China cold vortex, and the Super
  Typhoon Haishen. Compared with the high-quality precipitation rate products from the integrated Multi-satellite
  Retrievals for Global Precipitation Measurement, it is found that the retrieved RCRF maps are in good
  agreement with the precipitation pattern. The statistical results show that retrieved RCRF maps have
  an R-square of 0.88-0.96, a mean absolute error of 0.3-0.6 dBZ, and a root-mean-square error of 1.2-2.4
  dBZ.
