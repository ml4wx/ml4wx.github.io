summary: Releases a 2016-2019 statewide Iowa rainfall event dataset built from NEXRAD radar with quantitative
  precipitation estimation, intended for ML and physical modeling.
abstract: Effective environmental planning and management to address climate change could be achieved
  through extensive environmental modeling with machine learning and conventional physical models. In
  order to develop and improve these models, practitioners and researchers need comprehensive benchmark
  datasets that are prepared and processed with environmental expertise that they can rely on. This study
  presents an extensive dataset of rainfall events for the state of Iowa (2016-2019) acquired from the
  National Weather Service Next Generation Weather Radar (NEXRAD) system and processed by a quantitative
  precipitation estimation system. The dataset presented in this study could be used for better disaster
  monitoring, response and recovery by paving the way for both predictive and prescriptive modeling.
