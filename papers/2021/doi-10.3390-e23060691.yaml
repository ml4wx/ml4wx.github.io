summary: Information-theoretic causal analysis with neural networks quantifies direct solar influences
  on hydro-climatic variables at specific frequencies and lags.
abstract: This study addresses the causal links between external factors and the main hydro-climatic variables
  by using a chain of methods to unravel the complexity of the direct sun-climate link. There is a gap
  in the literature on the description of a complete chain in addressing the structures of direct causal
  links of solar activity on terrestrial variables. This is why the present study uses the extensive facilities
  of the application of information theory in view of recent advances in different fields. Additionally,
  by other methods (e.g., neural networks) we first tested the existent non-linear links of solar-terrestrial
  influences on the hydro-climate system. The results related to the solar impact on terrestrial phenomena
  are promising, which is discriminant in the space-time domain. The implications prove robust for determining
  the causal measure of climate variables under direct solar impact, which makes it easier to consider
  solar activity in climate models by appropriate parametrizations. This study found that hydro-climatic
  variables are sensitive to solar impact only for certain frequencies (periods) and have a coherence
  with the Solar Flux only for some lags of the Solar Flux (in advance).
