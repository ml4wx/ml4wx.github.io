summary: XGBoost wind power forecaster uses autoencoder-compressed 20-member NWP ensembles from Taiwan
  CWB, improving short-term deterministic and probabilistic accuracy.
abstract: In recent years, wind energy has become a competitively priced source of energy around the world,
  which has created increasing challenges for system operators. Accurate wind power generation forecasting
  plays an important role in power systems to improve the reliable and efficient operation. Therefore,
  numerous artificial intelligent methods such as machine learning and deep learning have been considered
  as solutions for accurate wind power forecasts. In addition to deterministic forecasting, the probabilistic
  forecasting becomes more important, because it indicates the level of uncertainty. In this paper, a
  hybrid forecasting model considering different Numerical Weather Prediction (NWP) models and the XGBoost
  training model is proposed for short-term wind power forecasting. The proposed forecasting algorithm
  includes data preprocessing, in which an autoencoder model is used to reduce the dimension of 20 NWP
  ensembles. The performance of the proposed method is investigated using historical wind power measurements
  and NWP results by the Taiwan Central Weather Bureau (CWB); the NWP includes spot wind speeds from WRFD,
  RWRF, and ensemble wind speeds from WEPS. Based on the forecasting results, the proposed model produces
  better performance and forecasting accuracy among other forecasting models, which reveals the importance
  of data preprocessing using autoencoders and the use of deep learning models in deterministic or probabilistic
  forecasts.
