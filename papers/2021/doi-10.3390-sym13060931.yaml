summary: Combines CEEMDAN decomposition, permutation entropy and ConvGRU to forecast daily South Asian
  High intensity from NCEP geopotential height, reporting higher accuracy than classical deep learning
  baselines.
abstract: The intensity variation of the South Asian high (SAH) plays an important role in the formation
  and extinction of many kinds of mesoscale systems, including tropical cyclones, southwest vortices in
  the Asian summer monsoon (ASM) region, and the precipitation in the whole Asia Europe region, and the
  SAH has a vortex symmetrical structure; its dynamic field also has the symmetry form. Not enough previous
  studies focus on the variation of SAH daily intensity. The purpose of this study is to establish a day-to-day
  prediction model of the SAH intensity, which can accurately predict not only the interannual variation
  but also the day-to-day variation of the SAH. Focusing on the summer period when the SAH is the strongest,
  this paper selects the geopotential height data between 1948 and 2020 from NCEP to construct the SAH
  intensity datasets. Compared with the classical deep learning methods of various kinds of efficient
  time series prediction model, we ultimately combine the Ensemble Empirical Mode Decomposition with Adaptive
  Noise (CEEMDAN) method, which has the ability to deal with the nonlinear and unstable single system,
  with the Permutation Entropy (PE) method, which can extract the SAH intensity feature of IMF decomposed
  by CEEMDAN, and the Convolution-based Gated Recurrent Neural Network (ConvGRU) model is used to train,
  test, and predict the intensity of the SAH. The prediction results show that the combination of CEEMDAN
  and ConvGRU can have a higher accuracy and more stable prediction ability than the traditional deep
  learning model. After removing the redundant features in the time series, the prediction accuracy of
  the SAH intensity is higher than that of the classical model, which proves that the method has good
  applicability for the prediction of nonlinear systems in the atmosphere.
