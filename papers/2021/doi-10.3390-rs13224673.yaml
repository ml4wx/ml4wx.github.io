summary: Machine learning downscales MODIS land surface temperature from 1 km to 30 m over Antarctic Dry
  Valleys using Landsat 8 as reference, achieving R² of 0.78.
abstract: To monitor environmental and biological processes, Land Surface Temperature (LST) is a central
  variable, which is highly variable in space and time. This particularly applies to the Antarctic Dry
  Valleys, which host an ecosystem highly adapted to the extreme conditions in this cold desert. To predict
  possible climate induced changes on the Dry Valley ecosystem, high spatial and temporal resolution environmental
  variables are needed. Thus we enhanced the spatial resolution of the MODIS satellite LST product that
  is sensed sub-daily at a 1 km spatial resolution to a 30 m spatial resolution. We employed machine learning
  models that are trained using Landsat 8 thermal infrared data from 2013 to 2019 as a reference to predict
  LST at 30 m resolution. For the downscaling procedure, terrain derived variables and information on
  the soil type as well as the solar insolation were used as potential predictors in addition to MODIS
  LST. The trained model can be applied to all available MODIS scenes from 1999 onward to develop a 30
  m resolution LST product of the Antarctic Dry Valleys. A spatio-temporal validation revealed an R2 of
  0.78 and a RMSE of 3.32 ∘C. The downscaled LST will provide a valuable surface climate data set for
  various research applications, such as species distribution modeling, climate model evaluation, and
  the basis for the development of further relevant environmental information such as the surface moisture
  distribution.
