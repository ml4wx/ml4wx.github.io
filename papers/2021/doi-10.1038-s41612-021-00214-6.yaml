summary: 'Retracted article: feed-forward and recurrent networks predict the Madden–Julian oscillation
  with about 26–27 days skill, reaching 60 days for some initial phases.'
abstract: Abstract The socioeconomic impact of weather extremes draws the attention of researchers to
  the development of novel methodologies to make more accurate weather predictions. The Madden–Julian
  oscillation (MJO) is the dominant mode of variability in the tropical atmosphere on sub-seasonal time
  scales, and can promote or enhance extreme events in both, the tropics and the extratropics. Forecasting
  extreme events on the sub-seasonal time scale (from 10 days to about 3 months) is very challenging due
  to a poor understanding of the phenomena that can increase predictability on this time scale. Here we
  show that two artificial neural networks (ANNs), a feed-forward neural network and a recurrent neural
  network, allow a very competitive MJO prediction. While our average prediction skill is about 26–27
  days (which competes with that obtained with most computationally demanding state-of-the-art climate
  models), for some initial phases and seasons the ANNs have a prediction skill of 60 days or longer.
  Furthermore, we show that the ANNs have a good ability to predict the MJO phase, but the amplitude is
  underestimated.
