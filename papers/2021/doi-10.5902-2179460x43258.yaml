summary: RBF neural networks forecast monthly temperature and precipitation for Paraná, Brazil, with best
  skill for temperature and 3-month smoothed series.
abstract: Precipitation and temperature have an impact on various sectors of society, such as agriculture,
  power generation, water availability, so it is essential to develop accurate monthly forecasts. The
  objective of this study is to develop an artificial neural network (ANN) model for monthly temperature
  and precipitation forecasts for the state of Paraná, Brazil. An important step in the ANN model is the
  selection of input variables, for which the forward stepwise regression method was used. After identifying
  the predictor variables for the forecasting model, the Radial Basis Function (RBF) ANN was developed
  with 50 neurons in the hidden layer and one neuron in the output layer. For the precipitation forecasting
  models, better performances were obtained for forecasting the data smoothed by the three-month moving
  average, since noisy data, such as monthly precipitation, are more difficult to be simulated by the
  neural network. For the temperature forecasts, the ANN model performed well both in the monthly temperature
  forecast and in the 3-month moving average forecast. This study showed the suitability of forecasting
  precipitation and temperature with the use of RBF ANNs, especially in the forecast of the monthly temperature.
