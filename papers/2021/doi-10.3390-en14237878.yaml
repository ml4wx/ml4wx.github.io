summary: Ensemble neural networks trained on perturbed observations nowcast wind speed and direction for
  wind farm output, with better accuracy and runtime than alternatives.
abstract: To plan operations and avoid any grid disturbances, power utilities require accurate power generation
  estimates for renewable generation. The generation estimates for wind power stations require an accurate
  prediction of wind speed and direction. This paper proposes a new prediction model for nowcasting the
  wind speed and direction, which can be used to predict the output of a wind power plant. The proposed
  model uses perturbed observations to train the ensemble networks. The trained model is then used to
  predict the wind speed and direction. The paper performs a comparative assessment of three artificial
  neural network models. It also studies the performance of introducing perturbed observations to the
  model using six different interpolation techniques. For each technique, the computational efficiency
  is measured and assessed. Furthermore, the paper presents an exhaustive investigation of the performance
  of neural network types and several techniques in training, data splitting, and interpolation. To check
  the efficacy of the proposed model, the power output from a real wind farm is predicted and compared
  with the actual recorded measurements. The results of the comprehensive analysis show that the proposed
  model outperforms contending models in terms of accuracy and execution time. Therefore, this model can
  be used by operators to reliably generate a dispatch plan.
