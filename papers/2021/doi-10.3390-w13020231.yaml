summary: Regression, ANN and GWR corrections of IMERG late-run rainstorm precipitation in southern China
  slightly improve accuracy, with the best method varying by region.
abstract: Satellite precipitation products play an essential role in providing effective global or regional
  precipitation. However, there are still many uncertainties in the performance of satellite precipitation
  products, especially in extreme precipitation analysis. In this study, a Global Precipitation Measurement
  (GPM) Integrated Multi-satellite Retrievals for GPM (IMERG) late run (LR) product was used to evaluate
  the rainstorms in the southern basin of China from 2015 to 2018. Three correction methods, multiple
  linear regression (MLR), artificial neural network (ANN), and geographically weighted regression (GWR),
  were used to get correction products to improve the precipitation performance. This study found that
  IMERG LR’s ability to characterize rainstorm events was limited, and there was a significant underestimation.
  The observation error and detection ability of IMERG LR decrease gradually from the southeast coast
  to the northwest inland. The error test shows that in the eastern coastal area (zone I and II), the
  central area (zone III), and the western inland area (zone IV and V), the optimal correction method
  is MLR, ANN, and GWR, respectively. The performance of three correction products is slightly better
  compared with the original product IMERG LR. From zone I to V, correlation coefficient (CC) and root
  mean square error (RMSE) show a decreasing trend. Zone II has the highest relative bias (RB), and the
  deviation is relatively large. The categorical indices of inland area performed better than coastal
  area. The correction product’s precipitation is slightly lower than the observed value from April to
  November with a mean error of 8.03%. The correction product’s precipitation was slightly higher than
  the observed values in other months, with an average error of 12.27%. The greater the observed precipitation,
  the higher the uncertainty of corrected precipitation result. The coefficient of variation showed that
  zone II had the highest uncertainty, and zone V had the lowest uncertainty. MLR had a high uncertainty
  with an average of 9.72%. The mean coefficient of variation of ANN and GWR is 7.74% and 7.29%, respectively.
  This study aims to generate a set of precipitation products with good accuracy through the IMERG LR
  evaluation and correction to support regional extreme precipitation research.
