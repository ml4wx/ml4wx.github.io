summary: U-Net-style CNN reconstructs 35 dBZ radar reflectivity from Himawari-8 infrared channels over
  North China, a proxy product for regions without radar.
abstract: Radar reflectivity (RR) greater than 35 dBZ usually indicates the presence of severe convective
  weather, which affects a variety of human activities, including aviation. However, RR data are scarce,
  especially in regions with poor radar coverage or substantial terrain obstructions. Fortunately, the
  radiance data of space-based satellites with universal coverage can be converted into a proxy field
  of RR. In this study, a convolutional neural network-based data-driven model is developed to convert
  the radiance data (infrared bands 07, 09, 13, 16, and 16–13) of Himawari-8 into the radar combined reflectivity
  factor (CREF). A weighted loss function is designed to solve the data imbalance problem due to the sparse
  convective pixels in the sample. The developed model demonstrates an overall reconstruction capability
  and performs well in terms of classification scores with 35 dBZ as the threshold. A five-channel input
  is more efficient in reconstructing the CREF than the commonly used one-channel input. In a case study
  of a convective event over North China in the summer using the test dataset, U-Net reproduces the location,
  shape and strength of the convective storm well. The present RR reconstruction technology based on deep
  learning and Himawari-8 radiance data is shown to be an efficient tool for producing high-resolution
  RR products, which are especially needed for regions without or with poor radar coverage.
