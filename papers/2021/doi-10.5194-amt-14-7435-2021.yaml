summary: Support vector regression corrects rain-affected Ku-band scatterometer winds over the tropics,
  reducing rain-induced bias against ASCAT as reference.
abstract: Abstract. Wind retrieval parameters, i.e., quality indicators and the 2DVAR analysis speeds,
  are explored with the aim to improve wind speed retrieval during rain for tropical regions. We apply
  the well-researched support vector machine (SVM) method in machine learning (ML) to solve this complex
  problem in a data-orientated regression. To guarantee the effectiveness of SVM, the inputs are extensively
  analysed to evaluate their appropriateness for this problem, before the results are produced. Subsequently,
  triple collocation shows that the similarity of the resolved Ku-band (OSCAT-2) wind speed in rain is
  better than the 2DVAR speed, with respect to the collocated C-band (ASCAT) speed, which is much less
  affected by rain. The comparisons between distributions and differences between data of rain-contaminated
  winds, corrected winds and good quality C-band winds, illustrate that the rain-distorted wind distributions
  become more nominal with SVM, hence eliminating rain-induced biases and error variance. Further confirmation
  is obtained from a case with synchronous Himawari-8 observation indicating rain (clouds) in the scene.
  Furthermore, the determination of simultaneous rain rate is attempted to retrieve both wind and rain.
  Although, additional observations or higher resolution may be required to better assess the accuracy
  of the wind and rain retrievals, the Machine Learning (ML) results demonstrate benefits of such methodology
  in geophysical retrieval and nowcasting applications.
