summary: An MLP using SHIPS predictors beats operational statistical-dynamical models by 5-22% for Atlantic
  tropical cyclone intensity in 2019-2020 real-time tests.
abstract: Abstract Reducing tropical cyclone (TC) intensity forecast errors is a challenging task that
  has interested the operational forecasting and research community for decades. To address this, we developed
  a deep learning (DL)-based Multilayer Perceptron (MLP) TC intensity prediction model. The model was
  trained using the global Statistical Hurricane Intensity Prediction Scheme (SHIPS) predictors to forecast
  the change in TC maximum wind speed for the Atlantic Basin. In the first experiment, a 24-hour forecast
  period was considered. To overcome sample size limitations, we adopted a Leave One Year Out (LOYO) testing
  scheme, where a model is trained using data from all years except one and then evaluated on the year
  that is left out. When tested on 2010–2018 operational data using the LOYO scheme, the MLP outperformed
  other statistical-dynamical models by 9-20%. Additional independent tests in 2019 and 2020 were conducted
  to simulate real-time operational forecasts, where the MLP model again outperformed the statistical-dynamical
  models by 5-22% and achieved comparable results as HWFI. The MLP model also correctly predicted more
  rapid intensification events than all the four operational TC intensity models compared. In the second
  experiment, we developed a lightweight MLP for 6-hour intensity predictions. When coupled with a synthetic
  TC track model, the lightweight MLP generated realistic TC intensity distribution in the Atlantic Basin.
  Therefore, the MLP-based approach has the potential to improve operational TC intensity forecasts, and
  will also be a viable option for generating synthetic TCs for climate studies.
