summary: Spectral analysis of proxy temperature records trains a neural network on pre-1880 oscillations
  to forecast 20th-century warming, estimating natural versus anthropogenic contributions.
abstract: The validity and interpretation of differing representations of proxy temperature profiles from
  the past 2,000 years for the northern hemisphere remains controversial. One perspective of temperatures
  over the past 1,000 years embodies a major oscillation with a peak corresponding with the Medieval Warm
  Period (MWP), a trough representing the Little Ice Age (LIA) and subsequent increasing temperatures
  to the present. An alternate temperature perspective, known as the “hockey stick” exhibits a slow long-term
  cooling trend downward from about 1000 AD to about 1900 AD, followed by relatively rapid warming in
  the 20th century and is a prominent feature in describing the apparent climate crisis. The present study,
  using spectral analysis, shows that both types of profile have a dominant millennial oscillation and
  a set of lower power centennial and decadal oscillations. The key difference in determination of development
  of the proxy temperature profile into either a hockey stick or MWP_LIA cycle is the phase alignments
  of centennial and decadal oscillations with respect to the millennial oscillation. In both cases, the
  resultant sine waves from spectral analysis up to 1880 AD can be used to train a an artificial neural
  network using oscillatory data corresponding to the pre-industrial era, then forecasting temperatures
  into the 20th century, enabling an estimation of natural and anthropogenic contributions to recent warming.
  The limitations of highly complex general circulation models that do not to adequately incorporate oscillatory
  patterns in temperatures may be a compelling reason to promote more extensive use of forecasting with
  established machine learning techniques such as ANNs.
