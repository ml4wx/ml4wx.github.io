# ML4WX org watchlist. Generated 2026-10-22.
#
# How each field was checked:
# - ror: every id looked up with the ROR API (api.ror.org/v2/organizations/<id>), all status=active.
#   Values are full ROR ids as the ROR API and OpenAlex return them. The ror list covers the same
#   institutions as openalex_ids (plus any ROR-only org).
# - openalex_ids: institution ids from the OpenAlex API (first ~100 searches, before the keyless
#   budget ran out) and the official OpenAlex S3 snapshot (data/parquet/institutions, updated to
#   2026-10-14). Every id exists, is status=active, and its ROR in OpenAlex equals the ror above.
# - blog_feeds: fetched on 2026-10-22, HTTP 200, parsed as RSS/Atom with items. news_url: HTTP 200.
# - github_repos: `gh api repos/OWNER/REPO` returns the same full_name (no redirect).
# - people.orcid: ORCID public API; record checked (works or employer) for the right person.
#   people.openalex_id is empty: OpenAlex author search was not possible (rate limit). Resolve later
#   with https://api.openalex.org/authors/orcid:<orcid>.
#
# aliases: lowercase strings for matching raw affiliation strings (case-insensitive substring).
# Short or ambiguous names are left out on purpose (e.g. "google", "ibm", "ai2", "ncar", "nasa",
# "amazon", "atmo", "jua", "sdsc", "mpi-m"); see notes. Word-boundary matching is still safer.
# tier 1 = always alert; tier 2 = highlight only together with another signal.

