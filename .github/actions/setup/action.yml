name: Set up ml4wx
description: uv + Python deps, and optionally Node + the Claude Code CLI
inputs:
  claude:
    description: Install the Claude Code CLI
    default: "false"
  extras:
    description: Extra uv sync arguments
    default: ""
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v10.3.1  # no floating major tag upstream
      with:
        enable-cache: true
    - run: uv sync ${{ inputs.extras }}
      shell: bash
    - if: inputs.claude == 'true'
      uses: actions/setup-node@v7
      with:
        node-version: 22
    - if: inputs.claude == 'true'
      # Pinned: the pipeline relies on `claude -p` flags (--json-schema, --tools, --setting-sources).
      run: npm install -g @anthropic-ai/claude-code@2.1.302
      shell: bash
