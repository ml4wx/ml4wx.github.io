name: Daily alerts

# Every morning: important new papers and lab blog posts become `highlight` issues.
on:
  schedule:
    - cron: "0 8 * * *"
      timezone: "Europe/Zurich"
  workflow_dispatch:
    inputs:
      days:
        description: Look back this many days
        default: "3"

permissions:
  contents: read
  issues: write

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          claude: "true"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create highlight --color b7791f --description "Important new paper" --force
      - name: Find highlights and open issues
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: uv run ml4wx alerts --days "${{ inputs.days || 3 }}"
