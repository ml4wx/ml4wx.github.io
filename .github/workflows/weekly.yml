name: Weekly update

# By Monday morning: crawl the last days, classify, open a PR with the new papers,
# and post the digest as an issue that mentions the people in settings.yaml `notify`.
on:
  schedule:
    # GitHub starts scheduled runs of this repo 6-7 h late (Oct-Nov 2026: daily cron 06:07 UTC ran at
    # 12:00-13:10, 09:07 at 15:15-16:05; the weekly 08:37 run at 15:25). So the first slot is Sunday
    # evening: with the usual delay it runs early Monday (UTC), without delay late Sunday. A Sunday
    # run makes the digest of the coming week (digest.week_id). The Monday slots are fallbacks in
    # case GitHub drops a run; the guard job skips them once this week's PR or digest exists.
    # Odd minutes, plain UTC: full hours are the busiest times, and the `timezone:` key was later still.
    - cron: "37 21 * * 0"
    - cron: "37 0 * * 1"
    - cron: "37 3 * * 1"
    - cron: "37 6 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: Run even if this week's PR or digest issue already exists
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: archive-write
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          # The digest week, same rule as digest.week_id: a Sunday run makes the coming week's digest.
          if [ "$(date -u +%u)" = 7 ]; then day=tomorrow; else day=today; fi
          week=$(date -u -d "$day" +%G-W%V)
          [ "$FORCE" = "true" ] && exit 0
          # The PR lookup does not use the search index, so it also sees a PR made minutes ago.
          pr=$(gh pr list -R "$GITHUB_REPOSITORY" --head "weekly/$week" --state all --json number -q '.[0].number')
          issue=$(gh issue list -R "$GITHUB_REPOSITORY" --label digest --state all \
            --search "\"$week\" in:title" --json number -q '.[0].number')
          if [ -n "$pr$issue" ]; then
            echo "Weekly update for $week exists (PR ${pr:-none}, digest issue ${issue:-none}); nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  weekly:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          claude: "true"

      - name: Labs and journal versions for recent papers (OpenAlex adds affiliations late)
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: uv run ml4wx enrich --days 35 --missing-orgs

      - name: Citation counts of the last two years (for "most cited" lists and trends)
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: uv run ml4wx citations --years 2

      - name: GitHub stars, releases and paper citations of datasets, models and tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
        run: uv run ml4wx resources refresh

      - name: Crawl, classify, export, write digest
        id: run
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run ml4wx weekly

      - run: uv run ml4wx validate

      - name: Open or update the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          WEEK: ${{ steps.run.outputs.week }}
          ADDED: ${{ steps.run.outputs.added }}
          DIGEST: ${{ steps.run.outputs.digest }}
          REVIEWERS: ${{ steps.run.outputs.reviewers }}
        run: |
          branch="weekly/$WEEK"
          git config user.name "ml4wx-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes this week."
            exit 0
          fi
          git commit -q -m "Weekly update $WEEK: +$ADDED papers"
          git push -q -f origin "$branch"
          awk 'NR==1 && /^---$/ {fm=1; next} fm && /^---$/ {fm=0; next} !fm' "$DIGEST" | head -c 60000 > /tmp/pr-body.md
          url=$(gh pr view "$branch" --json url -q .url 2>/dev/null || true)
          if [ -z "$url" ]; then
            # A review request notifies the reviewers even if they do not watch the repo.
            url=$(gh pr create --base main --head "$branch" ${REVIEWERS:+--reviewer "$REVIEWERS"} \
              --title "Weekly update $WEEK: +$ADDED papers" --body-file /tmp/pr-body.md)
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Post the digest issue
        if: steps.pr.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          WEEK: ${{ steps.run.outputs.week }}
          DIGEST: ${{ steps.run.outputs.digest }}
          PR_URL: ${{ steps.pr.outputs.url }}
          MENTIONS: ${{ steps.run.outputs.mentions }}
        run: |
          gh label create digest --color 0b6aa2 --description "Weekly digest" --force
          title="🌦️ Weekly digest $WEEK"
          if gh issue list --label digest --state all --search "\"$WEEK\" in:title" --json number -q '.[0].number' | grep -q .; then
            echo "Digest issue for $WEEK exists."
            exit 0
          fi
          # Drop the YAML front matter (first block between --- lines), keep the Markdown.
          # The cc line mentions the readers, so GitHub notifies them by email.
          { awk 'NR==1 && /^---$/ {fm=1; next} fm && /^---$/ {fm=0; next} !fm' "$DIGEST" | head -c 60000; \
            printf '\n\n**Review and merge:** %s\n' "$PR_URL"; \
            [ -n "$MENTIONS" ] && printf '\ncc %s\n' "$MENTIONS"; } > /tmp/issue-body.md
          gh issue create --title "$title" --label digest --body-file /tmp/issue-body.md
