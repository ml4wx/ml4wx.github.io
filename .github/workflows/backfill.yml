name: Backfill

# Manual, resumable historical search. Every run continues on the `backfill` branch and keeps
# one pull request open; merge it when the backfill is complete.
on:
  workflow_dispatch:
    inputs:
      task:
        description: What to run
        type: choice
        options: [seed, backfill, snowball, enrich, judge]
        default: backfill
      start:
        description: "backfill: first month (YYYY-MM-DD)"
        default: "2018-01-01"
      end:
        description: "backfill: last day (YYYY-MM-DD, empty = today)"
        default: ""
      max_months:
        description: "backfill: at most this many months in this run"
        default: "120"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: archive-write
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Continue on the backfill branch
        run: |
          git config user.name "ml4wx-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin backfill >/dev/null; then
            git checkout -B backfill origin/backfill
            if ! git merge -q --no-edit origin/main; then
              # Generated files are rebuilt by `ml4wx export` at the end, and a paper added on
              # both sides is the same paper: take main's copy for these conflicts.
              git diff --name-only --diff-filter=U | grep -E '^(README\.md|lists/|exports/|papers/)' \
                | xargs -r git checkout --theirs --
              git diff --name-only --diff-filter=U | grep -E '^(README\.md|lists/|exports/|papers/)' \
                | xargs -r git add --
              if git diff --name-only --diff-filter=U | grep -q .; then
                echo "::error::unresolved conflicts:"; git diff --name-only --diff-filter=U; exit 1
              fi
              git -c core.editor=true merge --continue
            fi
          else
            git checkout -B backfill
          fi
      - uses: ./.github/actions/setup
        with:
          claude: "true"

      - name: Run ${{ inputs.task }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          TASK: ${{ inputs.task }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          MAX_MONTHS: ${{ inputs.max_months }}
        run: |
          # Save the data to the branch after every chunk, so a failure loses at most one chunk.
          checkpoint() {
            git add -A -- $(ls -d papers parked state 2>/dev/null)
            git diff --cached --quiet && return 0
            n=$(git diff --cached --name-only --diff-filter=A -- papers | wc -l | tr -d ' ')
            git commit -q -m "Backfill ($TASK$1): +$n papers"
            git push -q origin backfill
          }
          case "$TASK" in
            seed)     uv run ml4wx seed config/seeds.json ;;
            backfill)
              deadline=$((SECONDS + 300 * 60))
              done_months=0
              while [ "$SECONDS" -lt "$deadline" ] && [ "$done_months" -lt "$MAX_MONTHS" ]; do
                before=$(cat state/backfill.json 2>/dev/null || echo "[]")
                uv run ml4wx backfill --start "$START" ${END:+--end "$END"} --max-months 6 \
                  --max-minutes $(( (deadline - SECONDS) / 60 ))
                after=$(cat state/backfill.json 2>/dev/null || echo "[]")
                checkpoint " $(python3 -c 'import json,sys; d=json.loads(sys.argv[1]); print(d[-1] if d else "")' "$after")"
                [ "$before" = "$after" ] && break   # nothing new: done, or months keep failing
                done_months=$((done_months + 6))
              done ;;
            snowball) uv run ml4wx snowball --max-minutes 300 ;;
            enrich)   uv run ml4wx enrich ;;
            judge)    uv run ml4wx judge ;;
          esac
          checkpoint ""

      - name: Export, commit, push, open PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TASK: ${{ inputs.task }}
        run: |
          # Data first, so a failing export cannot lose it.
          git add -A -- $(ls -d papers parked state 2>/dev/null)
          git diff --cached --quiet || { git commit -q -m "Backfill ($TASK): data"; git push -q origin backfill; }
          uv run ml4wx export
          uv run ml4wx validate || echo "::warning::validation errors, see log"
          git add -A
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -q -m "Backfill ($TASK): export README, lists, BibTeX, CSV"
          git push -q origin backfill
          if [ -z "$(gh pr list --head backfill --state open --json url -q '.[0].url')" ]; then
            gh pr create --base main --head backfill --title "Backfill: historical papers" \
              --body "Historical papers from the backfill runs (seeds, arXiv/OpenAlex month by month, citation snowballing). Merge when the backfill is complete."
          fi
          echo "Total papers on branch: $(find papers -name '*.yaml' | wc -l)" >> "$GITHUB_STEP_SUMMARY"
